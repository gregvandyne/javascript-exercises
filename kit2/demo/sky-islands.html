<title>Sky Islands</title>
<!-- The Sky Islands prototype rebuilt on Oomba3D 1.1.0 (docs/kit2-api.md): pick a hero, hop the islands, collect
     coins, land on the right answer, reach the flag. A game carries kitImportMap() where the marker line below is;
     tests/unit/kit2-oomba3d.test.js puts it there and plays this game in the real game frame. -->
<!-- KIT2_IMPORT_MAP -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3ff; font-family: "Bricolage Grotesque", system-ui, sans-serif; }
  .title { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 7vh 0 calc(7vh + env(safe-area-inset-bottom, 0px)); text-align: center; color: #141414; pointer-events: none; }
  .title h1 { margin: 0; font-size: clamp(34px, 7vw, 64px); text-shadow: 0 4px 0 #FFFDF2; }
  .title p { margin: 0; font-weight: 700; font-size: 18px; }
  .pick { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 0 16px; pointer-events: auto; }
  .pick button { font: 800 17px system-ui, sans-serif; min-height: 48px; padding: 0 18px; border-radius: 16px; border: 3px solid #141414; background: #FFFDF2; box-shadow: 0 4px 0 #141414; cursor: pointer; }
  .pick button:focus-visible { outline: 3px solid #141414; outline-offset: 3px; }
</style>
<div class="title" id="title"><div><h1>Sky Islands</h1><p>Pick your hero</p></div><div class="pick" id="pick"></div></div>
<script type="module">
import { start } from 'oomba3d';

const g = await start({ theme: 'sky-islands', version: '1.0.1', outline: true, weather: 'sparkles' });
const W = g.world;
W.water({ y: -7 });

// The start island and its grass.
await W.island({ x: 0, y: 0, z: 0 });
for (const [x, z, r] of [[-4, 3, 0.3], [4.5, -2, 1], [-3, -4.2, 2], [5, 3.5, 0.5]]) W.piece('grass', { x, y: 1.5, z, scale: 3, turn: r });

// A path of stepping islands, each with a coin above it.
const path = [[0, 1.2, -11], [3, 1.8, -17], [0, 2.4, -23], [-3, 3, -29]];
for (const [i, [x, y, z]] of path.entries()) await W.island({ x, y, z, scale: i % 2 ? 1.1 : 0.9 });
g.coins(path.map(([x, y, z]) => [x, y + 1.7, z]));

// Three answer islands (the question appears when the game starts), then the goal with its flag.
let answered = false;
const goal = await W.island({ x: 0, y: 4, z: -51, scale: 2 });
W.piece('flag', { x: 0, y: 5, z: -53, scale: 3 });
for (const [x, z] of [[-2.8, -49.5], [2.6, -52.5]]) W.piece('grass-small', { x, y: 5, z, scale: 3.5 });

// The title: every hero of the theme, standing on a stage island in front of the camera.
const stage = await W.island({ x: 0, y: 0, z: 40 });
const lineup = await Promise.all(g.theme.heroes.map((h, i) => g.hero(h.id, { x: (i - 2) * 2.7, y: stage.top(), z: 40 - Math.abs(i - 2) * 0.8, face: (2 - i) * 0.22 })));
lineup.forEach((h, i) => h.play(['cheer', 'wave', 'idle', 'ready', 'jumpAir'][i % 5]));
g.camera.position.set(0, 4.6, 54); g.camera.lookAt(0, 2.6, 40);

const pick = document.getElementById('pick');
for (const h of g.theme.heroes) {
  const b = document.createElement('button');
  b.textContent = h.name;
  b.onclick = () => play(h.id);
  pick.append(b);
}

async function play(id) {
  document.getElementById('title').remove();
  lineup.forEach(h => { h.object.visible = false; });
  const me = await g.hero(id, { x: 0, y: 1.5, z: 3 });
  g.controls(me);
  g.followCamera(me);
  g.askQuestion({ question: '7 × 8 = ?', answers: [54, 56, 63], correct: 56, at: { x: 0, y: 3, z: -38 }, onRight: () => { answered = true; } });
  goal.onLand = () => { if (answered && !goal.cheered) { goal.cheered = true; g.celebrate(me, 'You did it!'); } };
  window.__game = { g, me, goal, answered: () => answered };
}
window.__ready = true;
</script>
