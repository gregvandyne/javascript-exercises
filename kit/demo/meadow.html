<style>
/* The hero customiser card (the rest of the UI is the kit's own screens and HUD). */
.mh{position:fixed;z-index:20;inset-inline-end:max(16px,5vw);top:50%;transform:translateY(-50%);width:min(392px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;
  background:var(--ok-card);color:var(--ok-text);border:3px solid #141414;border-radius:30px;box-shadow:0 8px 0 #141414;padding:20px 18px 18px;display:flex;flex-direction:column;gap:14px;
  animation:mh-in 420ms cubic-bezier(.34,1.56,.64,1) both}
.ok-night .mh{border-color:#FFFDF233;box-shadow:0 8px 0 #000}
@keyframes mh-in{0%{opacity:0;transform:translateY(-50%) translateX(40px) scale(.92)}100%{opacity:1;transform:translateY(-50%)}}
[dir=rtl] .mh{animation-name:mh-in-rtl}@keyframes mh-in-rtl{0%{opacity:0;transform:translateY(-50%) translateX(-40px) scale(.92)}100%{opacity:1;transform:translateY(-50%)}}
.mh h2{margin:0;font-weight:800;font-size:1.65em;line-height:1.1;text-align:center;font-variation-settings:"opsz" 48}
.mh-tabs{display:flex;gap:4px;background:var(--ok-bg2);border-radius:999px;padding:4px;border:2px solid var(--ok-line)}
.mh-tabs button{flex:1;font:inherit;font-weight:700;font-size:.95em;min-height:44px;border:0;border-radius:999px;background:transparent;color:var(--ok-text);cursor:pointer;padding:0 6px}
.mh-tabs button[aria-selected=true]{background:#66C792;color:#141414;box-shadow:inset 0 -3px 0 #1F9D6355}
.mh-panel{display:flex;flex-direction:column;gap:12px}
.mh-head{display:flex;align-items:center;justify-content:center;gap:10px}
.mh-live{display:none;height:132px;justify-content:center;align-items:flex-end;margin:-4px 0 -6px}
.mh-live canvas{display:block}
.mh-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mh-opt{position:relative;aspect-ratio:1;border-radius:20px;border:2.5px solid var(--ok-line);background:var(--ok-bg2);display:flex;align-items:flex-end;justify-content:center;cursor:pointer;padding:0;overflow:hidden;
  transition:transform 140ms cubic-bezier(.34,1.56,.64,1),border-color 120ms}
.mh-opt{align-items:flex-start}.mh-opt canvas{display:block;height:170%!important;width:auto!important;margin-top:4%;flex-shrink:0}
/* outfits: the torso at 2x, so the choices differ at a glance; extras: head and shoulders */
.mh-torso .mh-opt canvas{height:250%!important;margin-top:-128%}
.mh-bust .mh-opt canvas{height:150%!important;margin-top:-6%}
.mh-opt:hover{transform:translateY(-2px)}
.mh-opt[aria-pressed=true]{border-color:#141414;box-shadow:0 0 0 3px #66C792;transform:scale(1.05)}
.ok-night .mh-opt[aria-pressed=true]{border-color:#FFFDF2}
.mh-sws{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mh-sw{width:40px;height:40px;border-radius:50%;border:2.5px solid #141414;cursor:pointer;padding:0;box-shadow:0 3px 0 #141414;transition:transform 140ms cubic-bezier(.34,1.56,.64,1)}
.mh-sws.mh-big .mh-sw{width:52px;height:52px}
.mh-sw[aria-pressed=true]{transform:scale(1.14);box-shadow:0 0 0 3px var(--ok-card),0 0 0 6px #66C792}
.mh-label{font-weight:700;font-size:.85em;opacity:.75;text-align:center;margin:0}
.mh-acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mh-none{font-weight:800;font-size:1.6em;opacity:.45;align-self:center}
@media (orientation:portrait) and (max-width:720px){
  .mh{top:calc(10px + env(safe-area-inset-top));transform:none;inset-inline:12px;width:auto;padding:14px 12px 12px;gap:10px;border-radius:24px;max-height:62vh;animation-name:mh-drop}
  [dir=rtl] .mh{animation-name:mh-drop}
  @keyframes mh-drop{0%{opacity:0;transform:translateY(-30px) scale(.94)}100%{opacity:1;transform:none}}
  .mh h2{font-size:1.3em}.mh-panel{min-height:0;gap:8px}.mh-grid{gap:8px}.mh-opt{border-radius:16px}.mh-sw{width:34px;height:34px}.mh-sws.mh-big .mh-sw{width:40px;height:40px}
  .mh{max-height:calc(100vh - 24px)}
  .mh-live{display:flex}   /* the hero you are making, large, inside the card */
  .mh .ok-big{min-height:52px;font-size:1.15em;padding:0 22px}
}
.mh-skip{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));inset-inline-start:14px;z-index:19}
</style></head>

<script>

// one-character grid, the parts (player, sparks, spikes, the bee, the quiz gate, the fox, lanterns, the flag) come from
// the built-in legend, and the kit does the physics, juice, scenes, HUD, scoring and test hooks. What is left here is

    croak: 'Quak!', splash: 'Platsch!', ouch: 'Autsch!', closeSay: 'Die Wiese wartet auf dich. Nochmal?', night: 'Die Nacht kommt…', hint2: '6 × 8 ist dasselbe wie 8 + 8 + 8 + 8 + 8 + 8', nightCap: '[die Nacht kommt]' },

    move: 'Беги стрелками или джойстиком', jump: 'Прыгай пробелом, ↑ или зелёной кнопкой', collect: 'Лови все искры — они летят к тебе!',

    croak: 'Ква!', splash: 'Плюх!', ouch: 'Ой!', closeSay: 'Луг тебя подождёт. Ещё разок?', night: 'Наступает ночь…', hint2: '6 × 8 — это 8 + 8 + 8 + 8 + 8 + 8', nightCap: '[наступает ночь]' },

// ---- art the demo adds on top of the kit (Oomba.art.define + the "Oomba Ink" grammar) ------------------------------
const ink = O.art.ink;
O.art.define('lilypad', { w: 100, h: 40, ax: 0.5, ay: 0.4, draw(ctx, k) {
  const p = new Path2D(); p.moveTo(50, 16); p.lineTo(80, 6); p.bezierCurveTo(100, 14, 100, 34, 50, 36); p.bezierCurveTo(0, 34, 0, 6, 50, 6); p.lineTo(64, 4); p.closePath();
  ink.sticker(ctx, k, p, { fill: PAL.mint[2], shade: PAL.mint[3], gloss: [30, 14, 12, 3, -0.15] });
  for (const a of [-2.6, -1.9, -0.9, 0.4]) { const v = new Path2D(); v.moveTo(50, 20); v.lineTo(50 + Math.cos(a) * 34, 20 + Math.sin(a) * 12); ink.detail(ctx, k, v, 0.7); }
  if (k.v === 'b') { for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; ink.sticker(ctx, k, ink.ellipse(28 + Math.cos(a) * 5, 14 + Math.sin(a) * 4, 5, 4), { fill: PAL.coral[0], rim: false, line: 0.6 }); } ink.sticker(ctx, k, ink.ellipse(28, 14, 3.5, 3), { fill: PAL.spark[2], rim: false, line: 0.6 }); }
} });
O.art.define('reed', { w: 30, h: 70, ax: 0.5, ay: 1, draw(ctx, k) {
  for (const [x, h, c] of [[9, 62, 0], [17, 68, 1], [24, 54, 0]]) {
    const s = new Path2D(); s.moveTo(x, 70); s.quadraticCurveTo(x - 2, 70 - h * 0.5, x + 1, 70 - h); ctx.strokeStyle = INK; ctx.lineWidth = ink.lines(k).w * 2.2; ctx.lineCap = 'round'; ctx.stroke(s); ctx.strokeStyle = PAL.mint[3]; ctx.lineWidth = ink.lines(k).w; ctx.stroke(s);
    if (c) ink.sticker(ctx, k, ink.rrect(x - 4, 70 - h + 4, 9, 20, 4.5), { fill: PAL.cocoa[2], shade: PAL.cocoa[3], rim: false, line: 0.8 });
  }
} });

// ---- the level: one character per cell (64 units); the surface is row 6 --------------------------------------------
//  built-in: #  ground   ~  water   P  hero start   $  spark   ^  spikes   B  bee   Q  quiz gate   N  fox (npc)
//            L  lantern  i  sign    G  goal flag
//  this game: T tree   u bush   m mushroom   b bunny   O the Oomba mascot   F lily pad + frog   @ lily pad
const MAP = [
//0         1         2         3         4         5         6         7
//01234567890123456789012345678901234567890123456789012345678901234567890123456789
 '                                                                                ',
 '                                 B    $$                                        ',
 '                                     ####                                       ',
 '            $$        $$         $$$$                                           ',
 '           $  $      $  $       ######      $$$            $$    $$ L$$    $$   ',
 '  T  b  P i     u         $$$    ^^^^^    m  T N u Q   L    L  ######  L  T L GO',
 '###################~~F~@~#######################################################',
 '###################~~~~~~#######################################################',
];
const CELL = 64, SURF = 6 * CELL, cx = c => c * CELL + CELL / 2;
const WATER = { kind: 'water', splash: true };
const PAD = v => ({ kind: 'lilypad', place: 'top', size: 34 / CELL, oy: 0.1, variant: v, layer: 'world', z: 3, shadow: false, parts: [{ platform: { surface: -0.094, width: 1.2 } }] });
const LEGEND = {
  '~': WATER,
  N: { kind: 'npc', species: 'fox', size: 1.9, flip: true, seed: 9, tag: 'fox' },
  G: { kind: 'goal', ox: -0.16 },
  T: { kind: 'tree', size: 3.6, oy: 0.03, layer: 'world', z: -2, shadow: false, wind: 0.6 },
  u: { kind: 'bush', size: 1.1, oy: 0.06, layer: 'world', z: 2, shadow: false },
  m: { kind: 'mushroom', size: 0.88, oy: 0.03, layer: 'world', z: 2, shadow: false },
  b: { kind: 'bunny', size: 1.44, seed: 6, tag: 'bunny', parts: [{ follow: { gap: 1.5 } }] },
  O: { kind: 'oomba', size: 1.75, flip: true, seed: 3, tag: 'mascot' },
  F: [WATER, PAD(''), { kind: 'frog', size: 78 / CELL, ox: 0.1, oy: -0.78, flip: true, seed: 5, tag: 'frog' }],
  '@': [WATER, PAD('b')],
};

// ---- the hero (saved between visits) ----------------------------------------------------------------------------
const save = O.save.define({ v: 1, defaults: { best: 0, hero: null } });
const HERO0 = { species: 'kid', skin: 3, hair: { style: 'curls', color: 'black' }, outfit: { top: 'hoodie', color: 'sky' }, wear: ['backpack'] };
let heroSpec = save.hero && save.hero.species ? save.hero : HERO0;
const M = { night: false, croakT: 0, frog: null };

// ---- story beats ----------------------------------------------------------------------------------------------------
/** The fox: a speech bubble, then the times-table gate (two tries a question: a miss shows the hint, two misses reveal
 *  the answer and the fox asks a different fact), then the gate swings open. */
async function foxGate(w, fox) {
  const kid = w.hero, gate = w.find('gate');
  kid.flip = false; fox.look(kid);
  await realWait(500); fox.state('talk');
  await O.ui.bubble(fox, T('foxHi'), { ms: 4600 });
  fox.state('think');
  const QS = [['7 × 6 = ?', 42, ['36', '42', '48', '49'], 'hint'], ['6 × 8 = ?', 48, ['42', '48', '54', '46'], 'hint2'], ['7 × 6 = ?', 42, ['42', '54', '35', '48'], 'hint']];
  for (let i = 0; !w.ended; i++) {
    const [q, a, ch, h] = QS[Math.min(i, QS.length - 1)];
    if (await w.ask({ q, a, choices: ch, hint: T(h), tries: 2, who: fox })) break;
    fox.state('talk'); kid.state('think');
    await O.ui.bubble(fox, T('foxAgain'), { ms: 2400 });
  }
  if (w.ended) return;
  fox.state('cheer'); kid.state('cheer'); w.score(50);
  gate.open();
  O.ui.bubble(fox, T('foxYes'), { ms: 2200 });
  await realWait(900);
  kid.state('idle'); fox.state('idle');
}
function nightfall(w, ms = 3200) {
  M.night = true; const k = ms / 3200;
  w.stage.setTimeOfDay(TOD.night, ms);
  O.ui.toast(T('night'), { ms: 2400 }); O.sfx('whoosh', { pitch: 0.5, caption: T('nightCap') });
  w.all('lantern').sort((a, b) => a.x - b.x).forEach((l, i) => w.after((1300 + i * 420) * k, () => {
    l.light.on = true; l.squash(1.25, 360);
    w.stage.burst('sparks', l.x, l.y - l.size * 0.8, { n: 7, color: PAL.spark[1] }); O.sfx('spark', { pitch: 0.7 + i * 0.1, at: l, caption: false });
  }));
  const kid = w.hero; w.find('mascot').state('idle');
  w.after(600, () => { kid.state('think'); w.after(700, () => { if (kid.clip === 'think') kid.state('idle'); }); });
}
function croak(w) {
  const f = M.frog; f.state('talk'); f.squash(1.3, 380); O.sfx('pop', { pitch: 0.55, at: f }); w.stage.floatText(T('croak'), f.x, f.y - 100, 'player');
  O.tween(f, { jy: -40 }, { ms: 180, ease: 'quadOut' }).then(() => O.tween(f, { jy: 0 }, { ms: 260, ease: 'bounceOut' })).then(() => f.state('idle'));
  const p = w.find('lilypad'); if (p) O.tween(p, { jy: 5 }, { ms: 120 }).then(() => O.tween(p, { jy: 0 }, { ms: 500, ease: 'elasticOut' }));
}
/** The results tableau: everyone you met cheers in a row either side of the results card. */
function tableau(w) {
  const S = w.stage, flag = w.find('goal'), kid = w.hero, VW = S.view.vw / S.camera.zoom;
  const mid = Math.min(flag.x - 120, w.level.w - VW / 2), wide = VW > 760;
  const cast = [w.find('bunny'), M.frog, kid, w.find('fox'), w.find('mascot')];
  const spots = wide ? [-470, -360, -250, 250, 370] : [-150, 50, -50, 150, 250];
  cast.forEach((e, i) => { const dx = spots[i]; e.behaviours.length = 0; e.x = mid + dx; e.y = SURF; e.jy = 0; e.groundY = SURF; e.flip = dx > 0; e.look(null); e.state('cheer'); });
  flag.x = mid + (wide ? 445 : 330);
  const bee = w.find('bee'); bee.behaviours.length = 0; bee.x = mid - 300; bee.y = SURF - 300; bee.add('fly', { rangeX: 40, rangeY: 16 });
  S.camera.target = null; S.camera.x = mid;
}

// ---- the hero maker (between the title and the how-to) -------------------------------------------------------------
let mh = null;
function makeHero(w) {
  O.scene = 'custom'; w.stage.setTimeOfDay(TOD.day, 1800);
  const kid = w.hero; kid.flip = false; kid.state('wave'); O.time.real.after(1200, () => kid.state('idle'));
  return new Promise(resolve => {
    const done = () => { if (mh) { mh.remove(); mh = null; } resolve(); };
    w.on('skip', done);
    const root = O.ui.root(), el = (t, c, s) => { const e = document.createElement(t); if (c) e.className = c; if (s != null) e.textContent = s; return e; };
    mh = el('section', 'mh'); mh.setAttribute('role', 'dialog'); mh.setAttribute('aria-label', T('make'));
    mh.appendChild(el('h2', '', T('make')));
    const live = el('div', 'mh-live'); mh.appendChild(live);
    const showLive = () => { live.innerHTML = ''; live.appendChild(O.ui.portrait(O.char(heroSpec), { size: 132, mood: 'happy' })); };
    const tabs = el('div', 'mh-tabs'); tabs.setAttribute('role', 'tablist'); mh.appendChild(tabs);
    const panel = el('div', 'mh-panel'); mh.appendChild(panel);
    const spec = () => JSON.parse(JSON.stringify(heroSpec.species === 'kid' ? heroSpec : HERO0));
    const apply = s => {
      heroSpec = s; O.save.set({ hero: s });
      const e = game.hero(O.char(s)); e.state('cheer'); e.squash(1.18, 320); w.stage.burst('sparkle', e.x, e.y - 70, { n: 14 }); O.sfx('pop', { pitch: 1.1 });
      O.time.real.after(900, () => { if (e.clip === 'cheer') e.state('idle'); });
      render(); showLive();
    };
    const pic = s => O.ui.portrait(O.char(s), { size: 120 });
    const opt = (content, pressed, onPick, label) => { const b = el('button', 'mh-opt'); b.type = 'button'; b.setAttribute('aria-pressed', String(pressed)); b.setAttribute('aria-label', label); if (typeof content === 'string') b.appendChild(el('span', 'mh-none', content)); else b.appendChild(content); b.onclick = onPick; return b; };
    const sw = (hex, pressed, onPick, label) => { const b = el('button', 'mh-sw'); b.type = 'button'; b.style.background = hex; b.setAttribute('aria-pressed', String(pressed)); b.setAttribute('aria-label', label); b.onclick = onPick; return b; };
    const TABS = {
      skin() { const g = el('div', 'mh-grid'); O.tokens.skin.forEach((hex, i) => { const s = spec(); s.skin = i; const b = opt(pic(s), heroSpec.skin === i, () => apply(s), T('skin') + ' ' + (i + 1)); b.style.background = `linear-gradient(${hex}55, transparent 70%)`; g.appendChild(b); }); panel.appendChild(g); },
      hair() { const g = el('div', 'mh-grid'); O.art.hair.forEach(st => { const s = spec(); s.hair = { style: st, color: s.hair.color }; g.appendChild(opt(pic(s), heroSpec.hair && heroSpec.hair.style === st, () => apply(s), st)); }); panel.appendChild(g);
        const r = el('div', 'mh-sws'); ['cocoa', 'black', 'blonde', 'copper', 'grape', 'sky'].forEach(c => r.appendChild(sw(O.tokens.hair[c], heroSpec.hair && heroSpec.hair.color === c, () => { const s = spec(); s.hair.color = c; apply(s); }, c))); panel.appendChild(r); },
      outfit() { const g = el('div', 'mh-grid mh-torso'); O.art.tops.forEach(tp => { const s = spec(); s.outfit = { top: tp, color: s.outfit.color }; g.appendChild(opt(pic(s), heroSpec.outfit && heroSpec.outfit.top === tp, () => apply(s), tp)); }); panel.appendChild(g);
        const r = el('div', 'mh-sws'); ['sky', 'grape', 'coral', 'mint', 'peach', 'cocoa'].forEach(c => r.appendChild(sw(PAL[c][2], heroSpec.outfit && heroSpec.outfit.color === c, () => { const s = spec(); s.outfit.color = c; apply(s); }, c))); panel.appendChild(r); },
      extra() { const g = el('div', 'mh-grid mh-bust'); [null, ...O.art.wear].forEach(x => { const s = spec(); s.wear = x ? [x] : []; const on = x ? (heroSpec.wear || []).includes(x) : !(heroSpec.wear || []).length; g.appendChild(opt(x ? pic(s) : '—', on, () => apply(s), x || 'none')); });
        g.appendChild(opt(O.ui.portrait(O.me(), { size: 120 }), false, () => apply(JSON.parse(JSON.stringify(O.me()))), T('avatar'))); panel.appendChild(g); },
    };
    let tab = 'skin';
    function render() {
      tabs.innerHTML = ''; panel.innerHTML = '';
      for (const k of Object.keys(TABS)) { const b = el('button', '', T(k)); b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(k === tab)); b.onclick = () => { tab = k; O.sfx('select'); render(); }; tabs.appendChild(b); }
      TABS[tab]();
    }
    render(); showLive();
    const acts = el('div', 'mh-acts');
    acts.append(O.ui.button(T('avatar'), { kind: 'quiet', onPress: () => apply(JSON.parse(JSON.stringify(O.me()))) }), O.ui.button(T('ready'), { kind: 'hot', big: true, onPress: done }));
    mh.appendChild(acts); root.appendChild(mh);
  });
}

// ---- the game ---------------------------------------------------------------------------------------------------------
const game = O.game({
  api: 1, title: 'Oomba Meadow', subtitle: 'sub', biome: 'meadow', seed: 21,
  level: O.level.grid(MAP, LEGEND, { cell: CELL }),
  hero: O.char(heroSpec), titleHero: O.char('oomba'), titleHeroSize: 116,
  controls: 'platformer:kid-easy',
  camera: { lookAhead: 0.16, deadzone: [0.08, 0.9], smooth: 0.1 },
  hud: ['score', 'lives:3', 'timer:150', 'progress', 'combo'],
  howTo: [{ icon: 'move', text: 'move' }, { icon: 'jump', text: 'jump' }, { icon: 'spark', text: 'collect' }],
  trySay: 'closeSay', hurtSay: 'ouch', splashSay: 'splash', prebakeText: ['ouch', 'splash', 'croak'], night: true,
  intro: makeHero,
  setup(w) {
    M.night = false; M.frog = w.find('frog'); w.stage.setTimeOfDay(TOD.day, 0);
    for (const l of w.all('lantern')) l.light.on = false;
    const fox = w.find('fox'), kid = w.hero; fox.look({ x: fox.x - 300, y: fox.y - 60 }); w.find('mascot').state('wave');
    for (const t of ['mascot', 'frog', 'bunny']) w.find(t).look(kid);
    // flowers, grass and reeds on open ground (seeded: the same meadow every time)
    const R = w.rand, row = MAP[5], ground = MAP[6];
    for (let c = 1; c < row.length - 1; c++) {
      const x = cx(c);
      if (row[c] !== ' ' || ground[c] !== '#') continue;
      if (ground[c + 1] === '~' || ground[c - 1] === '~') w.spawn('reed', { x: x + (ground[c + 1] === '~' ? 18 : -18), y: SURF + 4, size: 1, layer: 'world', z: 5, shadow: false, wind: 1 });
      else if (R.float() < 0.55) w.spawn('flower', { x: x + R.range(-20, 20), y: SURF + 3, size: R.range(30, 42) / CELL, variant: R.float() < 0.5 ? '' : 'b', layer: 'world', z: 1, shadow: false, wind: 1 });
      if (R.float() < 0.45 && row[c - 1] !== '^' && row[c + 1] !== '^') w.spawn('grass', { x: x + R.range(-24, 24), y: SURF + 6, size: R.range(18, 26) / CELL, layer: 'world', z: 5, shadow: false, wind: 1 });
    }
  },
  update(w, dt) {
    const kid = w.hero, fox = w.find('fox'), S = w.stage;
    M.croakT -= dt;
    if (game.state === 'intro') { const VW = S.view.vw / S.camera.zoom, portrait = S.view.vh > S.view.vw * 1.1; const want = kid.x + (portrait ? 0 : (O.dir === 'rtl' ? -1 : 1) * VW * 0.22); S.camera.x += (want - S.camera.x) * Math.min(1, dt * 4); }
    if (fox && fox.clip !== 'talk' && fox.clip !== 'cheer' && fox.clip !== 'think') fox.look(Math.abs(fox.x - kid.x) < 600 ? kid : { x: fox.x - 300, y: fox.y - 60 });
    const gate = w.find('gate');
    if (game.state === 'play' && gate && !gate.solidOn && !M.night && kid.x > gate.x + 60) nightfall(w);
  },
  on: {
    title(w) { w.stage.setTimeOfDay(TOD.title, 0); },
    talk(w, npc) { if (npc.tag === 'fox') return foxGate(w, npc); },
    land(w) { if (M.frog && M.croakT <= 0 && Math.abs(M.frog.x - w.hero.x) < 230) { M.croakT = 2; croak(w); } },
    win(w) { const m = w.find('mascot'); m.state('cheer'); w.stage.burst('sparkle', m.x, m.y - 120, { n: 12 }); },
    results(w) { tableau(w); },
  },
});

// ---- test and screenshot hooks (the game's own: state, start, win; the demo adds beats) ---------------------------
const W = () => game.world;
const meadowState = () => {
  const w = W(), k = w && w.hero, st = game.state, gate = w && w.find('gate');
  return { scene: st === 'intro' ? 'custom' : st === 'countdown' ? 'count' : st, x: Math.round(k ? k.x : 0), y: Math.round(k ? k.y - SURF : 0), got: w ? w.got : 0, total: w ? w.total : 0, score: w ? w.points : 0,
    gate: !!gate && !gate.solidOn, night: M.night, tod: +game.stage.timeOfDay.toFixed(2), lanterns: w ? w.all('lantern').filter(l => l.light.on).length : 0 };
};
Object.assign(window.__brbTest, {
  meadow: meadowState,
  /** jump the demo to a beat: 'custom' | 'play' | 'pond' | 'bee' | 'fox' | 'night' | 'goal' | 'lose' */
  beat: async name => {
    if (name === 'custom') { const b = document.querySelector('.ok-title-screen .ok-hot'); if (b) b.click(); return; }
    if (game.state !== 'play' && game.state !== 'talk') { game.start(); await realWait(50); }
    const w = W(), kid = w.hero, gate = w.find('gate');
    const at = { play: w.level.start.c, pond: 17, bee: 31, fox: 44, night: 50, goal: 74 }[name];
    if (at != null) { kid.x = cx(at); kid.y = name === 'bee' ? 4 * CELL : SURF; w.body.vx = w.body.vy = 0; w.find('bunny').x = kid.x - 96; game.stage.camera.x = kid.x; }
    if (name === 'night' && gate.solidOn) gate.open();
    if (name === 'goal') { if (gate.solidOn) gate.open(); w.find('fox').talked = true; if (!M.night) nightfall(w); w.stage.setTimeOfDay(1, 0); for (const l of w.all('lantern')) l.light.on = true; }
    if (name === 'lose') w.lose();
  },
  hold: (action, ms) => O.input.hold(action, ms),
  nightfall: ms => nightfall(W(), ms),
  collectAll: () => { const w = W(); for (const s of w.roles.collectible) if (!s.dead && !s.collecting) w._collect(s); },
});
</script>
