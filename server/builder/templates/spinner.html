<title>Team Spinner</title>
<!--CLASSROOM_STYLE-->
<style>
/* Team Spinner: a big wheel for the board that picks a team, a number or a topic. Never students' names: teams and
   numbers only (or the teacher's own topics). Space, Enter or a clicker spins it.  In the Oomba classroom style (classroom-style.css). */
.main{flex:1;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(12px,3vmin,40px);align-items:center;min-height:0}
.wheelbox{position:relative;width:min(100%,calc(100dvh - 120px));aspect-ratio:1;margin:auto;filter:drop-shadow(0 18px 26px rgba(20,20,20,.18))}
#wheel{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:clamp(14px,2.6vmin,26px) solid transparent;border-right:clamp(14px,2.6vmin,26px) solid transparent;border-top:clamp(26px,4.6vmin,46px) solid var(--ink);filter:drop-shadow(0 3px 0 var(--green))}
.side{display:flex;flex-direction:column;gap:clamp(10px,2vmin,20px);align-items:center;text-align:center}
.result{min-height:1.2em;width:100%;padding:.1em .3em;border-radius:var(--r-sm);font-size:clamp(2.4rem,10.5vmin,7.6rem);font-weight:800;letter-spacing:-.04em;line-height:1.05;overflow-wrap:anywhere}
.result:not(:empty){background:var(--current);color:var(--on-current)}
.result:not(:empty){animation:oc-pop .45s var(--spring) both}
.hint{margin:0;font-weight:700;color:var(--soft);font-size:clamp(1rem,2.5vmin,1.55rem)}
.picked{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;list-style:none;margin:0;padding:0}
.picked li{padding:6px 14px;border-radius:999px;background:var(--card2);font-weight:700;font-size:clamp(.9rem,2.1vmin,1.35rem)}
@media (max-width:760px),(orientation:portrait){.main{grid-template-columns:1fr}.wheelbox{width:min(100%,62dvh)}}
</style>
<main class="app">
  <header class="bar"><h1 id="title"></h1><button class="small" id="sound" aria-pressed="false"></button><button class="small" id="full"></button></header>
  <div class="main">
    <div class="wheelbox"><canvas id="wheel" role="img"></canvas><div class="pointer" aria-hidden="true"></div></div>
    <div class="side widget g-tools">
      <p class="hint" id="hint"></p>
      <div class="result" id="result" aria-live="polite"></div>
      <div class="row"><button class="big hot" id="spin"></button></div>
      <div class="row"><button class="small" id="noRepeat" aria-pressed="true"></button><button class="small" id="reset"></button></div>
      <ul class="picked" id="picked"></ul>
      <p class="keys" id="keys"></p>
    </div>
  </div>
</main>
<script>
// Team Spinner. What is on the wheel: CONFIG.topics when it lists any (the teacher's own topics or questions), else
// the numbers 1 to CONFIG.numbers when it is above 0 (seat or question numbers), else Team 1 to Team CONFIG.teams.
// NEVER students' names: a wheel of names becomes numbers. With CONFIG.noRepeat each pick leaves the wheel until
// "Put them all back". Nothing is saved or sent. Keys: Space, Enter or Page Down spin · R puts them all back.
'use strict';
const CONFIG = {
  title: 'Team Spinner',
  lang: 'en',
  sound: false,
  teams: 4,
  numbers: 0,
  topics: [],
  noRepeat: true,
  spinSeconds: 4,
  readAloud: true,
};
// {n} is a number.
const WORDS = {
  en: { sound: 'Sound', full: 'Full screen', spin: 'Spin', spinning: 'Spinning…', hint: 'Press Spin or the Space bar', team: 'Team {n}', noRepeat: 'Take out each pick', reset: 'Put them all back', allPicked: 'All picked! Put them all back to spin again.', picked: 'Picked so far', keys: 'Keys: Space spin · R put them all back · F full screen', wheel: 'A spinner with {n} parts' },
  es: { sound: 'Sonido', full: 'Pantalla completa', spin: 'Girar', spinning: 'Girando…', hint: 'Pulsa Girar o la barra espaciadora', team: 'Equipo {n}', noRepeat: 'Quitar cada elegido', reset: 'Volver a ponerlos todos', allPicked: '¡Ya salieron todos! Vuelve a ponerlos para girar otra vez.', picked: 'Ya elegidos', keys: 'Teclas: Espacio girar · R ponerlos todos · F pantalla completa', wheel: 'Una ruleta con {n} partes' },
  fr: { sound: 'Son', full: 'Plein écran', spin: 'Tourner', spinning: 'Ça tourne…', hint: 'Appuie sur Tourner ou sur Espace', team: 'Équipe {n}', noRepeat: 'Retirer chaque tirage', reset: 'Tout remettre', allPicked: 'Tout est tiré ! Remets tout pour tourner encore.', picked: 'Déjà tirés', keys: 'Touches : Espace tourner · R tout remettre · F plein écran', wheel: 'Une roue en {n} parts' },
  de: { sound: 'Ton', full: 'Vollbild', spin: 'Drehen', spinning: 'Dreht sich…', hint: 'Drück auf Drehen oder die Leertaste', team: 'Team {n}', noRepeat: 'Gezogene herausnehmen', reset: 'Alle zurücklegen', allPicked: 'Alle gezogen! Leg alle zurück, um wieder zu drehen.', picked: 'Schon gezogen', keys: 'Tasten: Leertaste drehen · R alle zurücklegen · F Vollbild', wheel: 'Ein Glücksrad mit {n} Feldern' },
  it: { sound: 'Suono', full: 'Schermo intero', spin: 'Gira', spinning: 'Gira…', hint: 'Premi Gira o la barra spaziatrice', team: 'Squadra {n}', noRepeat: 'Togli ogni estratto', reset: 'Rimetti tutti', allPicked: 'Estratti tutti! Rimettili tutti per girare ancora.', picked: 'Già estratti', keys: 'Tasti: Spazio gira · R rimetti tutti · F schermo intero', wheel: 'Una ruota con {n} spicchi' },
  pt: { sound: 'Som', full: 'Tela cheia', spin: 'Girar', spinning: 'Girando…', hint: 'Aperte Girar ou a barra de espaço', team: 'Equipe {n}', noRepeat: 'Tirar cada sorteado', reset: 'Devolver todos', allPicked: 'Todos sorteados! Devolva todos para girar de novo.', picked: 'Já sorteados', keys: 'Teclas: Espaço gira · R devolver todos · F tela cheia', wheel: 'Uma roleta com {n} partes' },
  nl: { sound: 'Geluid', full: 'Volledig scherm', spin: 'Draaien', spinning: 'Draait…', hint: 'Druk op Draaien of de spatiebalk', team: 'Team {n}', noRepeat: 'Gekozen eruit halen', reset: 'Alles terugzetten', allPicked: 'Alles gekozen! Zet alles terug om weer te draaien.', picked: 'Al gekozen', keys: 'Toetsen: spatie draaien · R alles terug · F volledig scherm', wheel: 'Een draaiwiel met {n} vakken' },
  ru: { sound: 'Звук', full: 'Весь экран', spin: 'Крутить', spinning: 'Крутится…', hint: 'Нажмите «Крутить» или пробел', team: 'Команда {n}', noRepeat: 'Убирать выпавшее', reset: 'Вернуть все', allPicked: 'Выпало всё! Верните все, чтобы крутить снова.', picked: 'Уже выпало', keys: 'Клавиши: пробел крутить · R вернуть все · F весь экран', wheel: 'Колесо из {n} частей' },
  he: { sound: 'צליל', full: 'מסך מלא', spin: 'לסובב', spinning: 'מסתובב…', hint: 'לחצו לסובב או על מקש הרווח', team: 'קבוצה {n}', noRepeat: 'להוציא כל בחירה', reset: 'להחזיר את כולם', allPicked: 'כולם נבחרו! החזירו את כולם כדי לסובב שוב.', picked: 'נבחרו עד עכשיו', keys: 'מקשים: רווח לסובב · R להחזיר הכול · F מסך מלא', wheel: 'גלגל עם {n} חלקים' },
  ar: { sound: 'الصوت', full: 'ملء الشاشة', spin: 'أدِر', spinning: 'تدور…', hint: 'اضغط أدِر أو مفتاح المسافة', team: 'الفريق {n}', noRepeat: 'أخرج كل اختيار', reset: 'أعِد الجميع', allPicked: 'تم اختيار الجميع! أعِد الجميع لتدير مرة أخرى.', picked: 'ما اختير حتى الآن', keys: 'المفاتيح: المسافة للإدارة · R أعِد الجميع · F ملء الشاشة', wheel: 'عجلة من {n} أجزاء' },
  ja: { sound: 'サウンド', full: '全画面', spin: 'まわす', spinning: 'まわっています…', hint: '「まわす」かスペースキーをおしてね', team: 'チーム{n}', noRepeat: '出たものをはずす', reset: 'ぜんぶもどす', allPicked: 'ぜんぶ出たよ！もどすとまたまわせます。', picked: 'これまでに出たもの', keys: 'キー：スペース まわす・R ぜんぶもどす・F 全画面', wheel: '{n}こに分かれたルーレット' },
  'zh-Hant': { sound: '聲音', full: '全螢幕', spin: '轉動', spinning: '轉動中…', hint: '按「轉動」或空白鍵', team: '第 {n} 隊', noRepeat: '抽過就拿掉', reset: '全部放回', allPicked: '全部抽完了！全部放回就能再轉。', picked: '已經抽到', keys: '按鍵：空白鍵 轉動・R 全部放回・F 全螢幕', wheel: '分成 {n} 格的轉盤' },
};

const B = window.BRB || {};
const LANG = (B.user && B.user.lang) || 'en';
const W = WORDS[LANG] || WORDS[String(LANG).split('-')[0]] || WORDS.en;
const tr = (k, v) => String(W[k] != null ? W[k] : WORDS.en[k]).replace(/\{(\w+)\}/g, (m, n) => (v && v[n] != null ? v[n] : m));
document.documentElement.lang = LANG; document.documentElement.dir = (B.user && B.user.dir) || 'ltr';
if (B.theme === 'light' || B.theme === 'dark') document.documentElement.dataset.theme = B.theme;   // the site's light or dark (else the device's)
const $ = id => document.getElementById(id);
let soundOn = !!CONFIG.sound;   // sound is off until someone presses Sound
const sfx = name => { try { if (soundOn && B.sfx && !B.sfx.muted) B.sfx.play(name); } catch (e) { /* no sound */ } };
const say = text => { try { if (CONFIG.readAloud && B.speak && !(B.sfx && B.sfx.muted)) B.speak(text, { lang: CONFIG.lang }); } catch (e) { /* no voice */ } };
const COLORS = ['#66C792', '#FFD23F', '#7FB3E6', '#F2957C', '#B9A0E3', '#F7B267', '#A8DDB9', '#FFE58A'];   // the Oomba classroom accents
const INK = '#141414', PAPER = '#FFFDF2', FONT = '"Bricolage Grotesque", system-ui, sans-serif';
/** Everything the wheel can land on: { label, spoken } (spoken is a fixed CONFIG string, or null for team and number labels). */
function allItems() {
  if (CONFIG.topics.length) return CONFIG.topics.slice(0, 30).map(t => ({ label: String(t), spoken: String(t) }));
  if (CONFIG.numbers > 0) return [...Array(Math.min(60, CONFIG.numbers | 0))].map((_, i) => ({ label: String(i + 1), spoken: null }));
  return [...Array(Math.max(2, Math.min(12, CONFIG.teams | 0)))].map((_, i) => ({ label: tr('team', { n: i + 1 }), spoken: null }));
}

// ---- the state ----------------------------------------------------------------------------------------------------
const S = { items: allItems(), left: [], picked: [], angle: 0, spinning: false, last: null, out: null, noRepeat: !!CONFIG.noRepeat };
S.left = S.items.slice();

// ---- the wheel ----------------------------------------------------------------------------------------------------
const cv = $('wheel'), ctx = cv.getContext('2d');
function fit() { const r = cv.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.max(10, Math.round(r.width * d)); cv.height = Math.max(10, Math.round(r.height * d)); ctx.setTransform(d, 0, 0, d, 0, 0); draw(); }
addEventListener('resize', fit);
function draw() {
  const r = cv.getBoundingClientRect(), w = r.width, h = r.height, R = Math.min(w, h) / 2 - 6, cx = w / 2, cy = h / 2, n = S.left.length;
  ctx.clearRect(0, 0, w, h);
  
  if (!n) { ctx.fillStyle = PAPER; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill(); }
  const step = (Math.PI * 2) / Math.max(1, n);
  S.left.forEach((it, i) => {
    const a0 = S.angle + i * step - Math.PI / 2, a1 = a0 + step;
    ctx.fillStyle = COLORS[(S.items.indexOf(it)) % COLORS.length]; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a1); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = PAPER; ctx.lineWidth = 3; ctx.stroke();
    const mid = a0 + step / 2, flip = Math.cos(mid) < 0;   // the left half reads the right way up
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(flip ? mid + Math.PI : mid);
    const size = Math.max(11, Math.min(R * 0.14, (R * step) * 0.45, (R * 0.8) / Math.max(4, it.label.length) * 1.7));
    ctx.font = `800 ${size}px ${FONT}`; ctx.fillStyle = INK; ctx.textAlign = flip ? 'left' : 'right'; ctx.textBaseline = 'middle';
    let t = it.label; while (ctx.measureText(t).width > R * 0.78 && t.length > 2) t = `${t.slice(0, -2)}…`;
    ctx.fillText(t, flip ? -(R - 14) : R - 14, 0); ctx.restore();
  });
  ctx.fillStyle = PAPER; ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy, R * 0.12, 0, 7); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = PAPER; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
  cv.setAttribute('aria-label', tr('wheel', { n }));
}
const still = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const ease = t => 1 - Math.pow(1 - t, 4);
function spin() {
  if (S.spinning) return;
  if (S.out) { S.left = S.left.filter(x => x !== S.out); S.out = null; }
  if (!S.left.length) { $('result').textContent = ''; $('hint').textContent = tr('allPicked'); draw(); return; }
  const n = S.left.length, step = (Math.PI * 2) / n, pick = Math.floor(Math.random() * n);
  // land the middle of the picked part (a little off it) under the pointer at the top, after a few whole turns
  const want = -(pick * step + step / 2) + (Math.random() - 0.5) * step * 0.6;
  const from = S.angle, turns = still() ? 0 : 4 + Math.floor(Math.random() * 2);
  const to = want + Math.PI * 2 * (Math.ceil((from - want) / (Math.PI * 2)) + turns);
  const ms = still() ? 250 : CONFIG.spinSeconds * 1000, t0 = performance.now();
  let lastPart = -1, lastTick = 0;
  S.spinning = true; $('spin').disabled = true; $('result').textContent = ''; $('hint').textContent = tr('spinning'); sfx('click');
  const frame = now => {
    const t = Math.min(1, (now - t0) / ms); S.angle = from + (to - from) * ease(t); draw();
    const part = Math.floor((((-S.angle) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) / step);
    if (part !== lastPart && now - lastTick > 70) { lastPart = part; lastTick = now; if (t < 0.97) sfx('click'); }
    if (t < 1) { requestAnimationFrame(frame); return; }
    S.angle = to % (Math.PI * 2); S.spinning = false; done(S.left[pick]);
  };
  requestAnimationFrame(frame);
}
function done(it) {
  S.last = it.label; S.picked.push(it.label); if (S.noRepeat) S.out = it;
  $('result').textContent = it.label; $('hint').textContent = tr('hint'); $('spin').disabled = false; $('spin').focus({ preventScroll: true });
  sfx('powerup'); try { if (B.fx) B.fx.confetti({ count: 40 }); } catch (e) { /* reduced motion */ }
  if (it.spoken) say(it.spoken);
  paintPicked(); draw();
}
function paintPicked() { const ul = $('picked'); ul.innerHTML = ''; for (const p of S.picked.slice(-12)) { const li = document.createElement('li'); li.textContent = p; ul.appendChild(li); } ul.setAttribute('aria-label', tr('picked')); }
function resetAll() { if (S.spinning) return; S.left = S.items.slice(); S.out = null; S.picked = []; S.last = null; $('result').textContent = ''; $('hint').textContent = tr('hint'); paintPicked(); draw(); sfx('click'); }

// ---- buttons and keys ---------------------------------------------------------------------------------------------
$('spin').onclick = spin; $('reset').onclick = resetAll;
$('noRepeat').onclick = () => { S.noRepeat = !S.noRepeat; if (!S.noRepeat) S.out = null; $('noRepeat').setAttribute('aria-pressed', String(S.noRepeat)); };
$('sound').onclick = () => { soundOn = !soundOn; $('sound').setAttribute('aria-pressed', String(soundOn)); sfx('click'); };
$('full').onclick = () => { try { if (B.fullscreen) B.fullscreen(); } catch (e) { /* not here */ } };
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  const k = e.key, onBtn = document.activeElement && document.activeElement.tagName === 'BUTTON' && document.activeElement !== $('spin');
  if (k === 'f' || k === 'F') { $('full').click(); return; }
  if (k === 'r' || k === 'R') { resetAll(); return; }
  if ((k === ' ' || k === 'Enter' || k === 'PageDown' || k === 'ArrowRight' || k === 'ArrowLeft') && !onBtn) { e.preventDefault(); spin(); }
});

document.title = CONFIG.title; $('title').textContent = CONFIG.title;
for (const [id, k] of [['sound', 'sound'], ['full', 'full'], ['spin', 'spin'], ['hint', 'hint'], ['noRepeat', 'noRepeat'], ['reset', 'reset'], ['keys', 'keys']]) $(id).textContent = tr(k);
$('noRepeat').setAttribute('aria-pressed', String(S.noRepeat)); $('sound').setAttribute('aria-pressed', String(soundOn));
window.__brbTest = { state: () => ({ spinning: S.spinning, result: S.last, left: S.left.length - (S.out ? 1 : 0), items: S.items.length, picked: S.picked.slice() }), start() { spin(); } };
fit();
</script>
