<title>Word Lab</title>
<!--CLASSROOM_STYLE-->
<style>
/* Word Lab: practice a word list three ways. Unscramble (read the clue, put the letters in order), Spell it (hear the
   word, spell it from the letters, with a few extra letters mixed in) and Fill the gap (pick the word that completes
   the sentence). For the board or each student's own device. Plain HTML in the Oomba classroom style: letters can be
   tapped or typed, nothing is sent anywhere and nobody is named. */
.top{display:flex;align-items:center;gap:12px}
.progress{flex:1;height:12px;border-radius:999px;background:var(--card);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.top .pill{background:var(--card);box-shadow:var(--shadow)}
.progress i{display:block;height:100%;width:0;background:var(--leaf);border-radius:999px;transition:width .45s var(--ease)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px;margin:16px 0 4px;text-align:start}
.mode{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:start;gap:4px;padding:14px 16px;border-radius:18px;border:0;background:var(--card2);min-height:96px}
.mode b{font-size:clamp(1.1rem,2.8vmin,1.6rem);font-weight:800}
.mode span{font-weight:500;font-size:clamp(.85rem,1.9vmin,1.1rem);color:var(--soft)}
.mode[aria-pressed="true"]{background:var(--current);color:var(--on-current)}
.mode[aria-pressed="true"] span{color:inherit;opacity:.85}
.stage{flex:1;width:min(100%,1100px);margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vmin,32px);text-align:center}
.clue{margin:0;width:100%;text-align:start;min-height:84px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:14px clamp(16px,2.4vmin,28px);border-radius:var(--r-sm);background:var(--current);color:var(--on-current);font-size:clamp(1.3rem,4.4vmin,3rem);font-weight:800;line-height:1.2;text-wrap:balance;overflow-wrap:anywhere}
.clue small{display:block;font-size:clamp(.8rem,1.7vmin,1rem);font-weight:800;text-transform:uppercase;letter-spacing:.05em;opacity:.9}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(5px,1vmin,10px)}
.slot{--s:clamp(40px,min(9vmin,calc((100vw - 60px) / var(--n,6))),96px);width:var(--s);height:calc(var(--s) * 1.15);min-width:0;min-height:0;padding:0;display:grid;place-items:center;border-radius:12px;border:2px dashed color-mix(in srgb,var(--ink) 30%,transparent);background:color-mix(in srgb,var(--card) 55%,transparent);box-shadow:none;font-size:calc(var(--s) * .56);font-weight:800}
.slot.full{border-style:solid;border-color:var(--ink);background:var(--card);box-shadow:var(--shadow)}
.slot.space{border:0;width:calc(var(--s) * .4)}
.slots.good .slot{background:var(--mint-t);border-color:var(--green);color:var(--ink)}
.slots.bad .slot.full{background:var(--coral-t);border-color:var(--coral)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,1.2vmin,12px)}
.tile{--s:clamp(46px,min(9.5vmin,calc((100vw - 70px) / var(--n,6))),100px);width:var(--s);height:var(--s);min-width:0;min-height:44px;padding:0;border-radius:14px;font-size:calc(var(--s) * .5);font-weight:800;background:var(--card);border-color:var(--line);box-shadow:var(--shadow);border-radius:14px}
.tile:disabled{opacity:.18;transform:scale(.9)}
.sentence{margin:0;font-size:clamp(1.4rem,5vmin,3.4rem);font-weight:700;line-height:1.3;text-wrap:balance;overflow-wrap:anywhere}
.gap{display:inline-block;min-width:4ch;padding:0 .3em;border-bottom:4px solid var(--green);color:var(--accent-ink)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;width:100%}
.choice{font-size:clamp(1.15rem,3.6vmin,2.4rem);min-height:clamp(60px,10vmin,100px);font-weight:800;border-radius:var(--r);border-color:var(--line);box-shadow:var(--shadow)}
.choice.right{background:var(--mint-t);border-color:var(--green);box-shadow:0 0 0 3px var(--green)}
.choice.wrong{background:var(--coral-t);border-color:var(--coral)}
.choice:disabled{opacity:1;cursor:default}
.feedback{margin:0;min-height:1.4em;font-weight:800;font-size:clamp(1.1rem,3vmin,2rem)}

.feedback.bad{color:var(--coral)}
.hear{font-size:clamp(1.2rem,3.6vmin,2.2rem)}

.review li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-sm);background:var(--card2);font-size:clamp(1rem,2.4vmin,1.4rem);font-weight:700}

.review li.no .ok{background:var(--coral);color:var(--on-coral)}
.end .card{width:min(100%,900px)}
.editor{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:var(--scrim)}

.editor h2{font-size:clamp(1.4rem,4vmin,2.4rem)}

.editor .msg{min-height:1.3em;font-weight:700}
.editor .msg.bad{color:var(--coral)}
.editor .row{justify-content:flex-end}

  <section class="screen end" id="end" hidden>

      <div class="row"><button class="big hot" id="again"></button><button class="big" id="menu"></button></div>

</main>
<section class="editor" id="editor" role="dialog" aria-modal="true" aria-labelledby="editH" hidden>

    <p class="msg" id="editMsg" aria-live="polite"></p>
    <div class="row"><button class="big" id="editCancel"></button><button class="big hot" id="editUse"></button></div></div>
</section>

  try { if (B.gameOver) B.gameOver({ won: pct >= 0.6, score: n }); } catch (e) { /* preview */ }
  $('again').focus({ preventScroll: true });
}

// ---- the teacher's own words ----------------------------------------------------------------------------------------
function fromLines(text) {
  const out = [], lines = String(text).split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i].trim(); if (!raw) continue;
    const parts = raw.split('|').map(s => s.trim());
    if (!parts[0] || parts[0].length > 30) return { error: tr('bad', { n: i + 1 }) };
    out.push({ word: parts[0], clue: (parts[1] || '').slice(0, 160), sentence: (parts[2] || '').slice(0, 200) });
  }
  return out.length >= 3 ? { list: out.slice(0, 60) } : { error: tr('few') };
}
function openEditor() { $('editText').value = list.map(x => [x.word, x.clue, x.sentence].join(' | ')).join('\n'); $('editMsg').textContent = ''; $('editMsg').className = 'msg'; $('editor').hidden = false; $('editText').focus(); }
function closeEditor() { $('editor').hidden = true; $('editBtn').focus(); }
function useEditor() { const r = fromLines($('editText').value); if (r.error) { $('editMsg').textContent = r.error; $('editMsg').className = 'msg bad'; return; } list = r.list; closeEditor(); home(); }

// ---- buttons and keys ---------------------------------------------------------------------------------------------
$('go').onclick = begin; $('again').onclick = begin; $('menu').onclick = home; $('next').onclick = next;
$('check').onclick = check; $('clear').onclick = clearAll; $('hint').onclick = hint;
$('hear').onclick = () => { const x = S.round[S.i]; if (x && !speak(x.word)) { $('clue').hidden = !x.clue; } };
$('showClue').onclick = () => { const x = S.round[S.i]; if (!x) return; $('clue').innerHTML = '<small></small><span></span>'; $('clue').children[0].textContent = tr('clue'); $('clue').children[1].textContent = x.clue; $('clue').hidden = false; $('showClue').hidden = true; S.clueShown = true; };
$('editBtn').onclick = openEditor; $('editCancel').onclick = closeEditor; $('editUse').onclick = useEditor;
$('sound').onclick = () => { soundOn = !soundOn; $('sound').setAttribute('aria-pressed', String(soundOn)); sfx('click'); };
$('full').onclick = () => { try { if (B.fullscreen) B.fullscreen(); } catch (e) { /* not here */ } };
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!$('editor').hidden) { if (e.key === 'Escape') { e.preventDefault(); closeEditor(); } return; }
  if (S.screen !== 'play') { if ((e.key === 'f' || e.key === 'F') && S.screen !== 'play') $('full').click(); return; }
  const k = e.key;
  if (S.done) { if (k === 'Enter' || k === ' ' || k === 'PageDown' || k === 'ArrowRight') { e.preventDefault(); next(); } return; }
  if (S.mode === 'gap') { const i = '1234'.indexOf(k); if (k.length === 1 && i >= 0 && i < (S.opts || []).length) { e.preventDefault(); pickGap(i); } return; }
  if (k === 'Backspace') { e.preventDefault(); for (let i = S.placed.length - 1; i >= 0; i--) if (S.placed[i] && typeof S.placed[i] !== 'string') { unplace(i); break; } return; }
  if (k === 'Enter' && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) { e.preventDefault(); check(); return; }
  if (k.length === 1 && !FIXED.test(k)) { const j = S.tiles.findIndex(t => !t.used && low(t.ch) === low(k)); if (j >= 0) { e.preventDefault(); place(j); } }
});

document.title = CONFIG.title; $('title').textContent = CONFIG.title; $('startH').textContent = CONFIG.title;
$('sound').textContent = tr('sound'); $('full').textContent = tr('full'); $('go').textContent = tr('go'); $('editBtn').textContent = tr('edit');
$('hear').textContent = `🔊 ${tr('hear')}`; $('showClue').textContent = tr('showClue'); $('hint').textContent = tr('hint'); $('clear').textContent = tr('clear'); $('check').textContent = tr('check');
$('again').textContent = tr('again'); $('menu').textContent = tr('menu'); $('review').setAttribute('aria-label', tr('review')); $('reviewH').textContent = tr('review'); $('keys').textContent = tr('keys'); $('startKeys').textContent = tr('keys');
$('editH').textContent = tr('editH'); $('editP').textContent = tr('editP'); $('editText').setAttribute('aria-label', tr('editH')); $('editUse').textContent = tr('use'); $('editCancel').textContent = tr('cancel');
$('editBtn').hidden = !CONFIG.allowEdit;
$('sound').setAttribute('aria-pressed', String(soundOn));
window.__brbTest = { state: () => ({ screen: S.screen, mode: S.mode, word: S.i + 1, total: S.round.length, score: S.score, done: S.done, tries: S.tries, target: S.round[S.i] ? S.round[S.i].word : '', placed: S.placed.map(p => (p ? (typeof p === 'string' ? p : p.ch) : '')).join(''), tiles: S.tiles.length }), start() { begin(); }, mode(m) { if (MODES.includes(m)) S.mode = m; } };
home();
</script>
