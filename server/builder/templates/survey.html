<title>Class Survey</title>
<!--CLASSROOM_STYLE-->
<style>
/* Class Survey: fixed-choice questions written by the teacher. "Count hands" (the teacher taps how many hands are up)
   or "Pass the device" (each student taps a choice in private). Only counts, only in this page's memory: no names, no
   typing, nothing saved or sent. Big type for the board, keyboard and clicker keys.  In the Oomba classroom style (classroom-style.css). */
:root{--c0:var(--g-class);--c1:var(--g-tools);--c2:var(--g-time);--c3:var(--g-show)}
#askQ,#resQ{text-align:start}
.choices{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(10px,2vmin,20px);align-content:center}
.choice{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"tag lab" "ctl ctl";align-items:center;justify-content:stretch;gap:10px 14px;padding:12px 16px;border:2px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);min-height:84px}
.choice .tag{grid-area:tag;display:grid;place-items:center;width:clamp(44px,8vmin,72px);height:clamp(44px,8vmin,72px);border-radius:14px;color:var(--on-team);font-weight:800;font-size:clamp(1.2rem,4vmin,2.6rem)}
.choice .lab{grid-area:lab;min-width:0;font-weight:800;font-size:clamp(1.2rem,3.8vmin,2.7rem);overflow-wrap:anywhere;text-align:start}
.choice .num{font-weight:800;font-size:clamp(1.8rem,7vmin,5rem);font-variant-numeric:tabular-nums;min-width:1.6em;text-align:center}
.choice .ctl{grid-area:ctl;display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vmin,32px)}
.choice .ctl button{min-width:clamp(56px,9vmin,84px);min-height:clamp(56px,9vmin,84px);font-size:clamp(1.4rem,4.4vmin,3rem);padding:0;border-radius:50%}
.pick{width:100%;grid-template-areas:"tag lab";text-align:start;font-size:inherit}
.bars{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,2vmin,20px)}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center}
.barrow .lab{font-weight:800;font-size:clamp(1.1rem,3.4vmin,2.5rem);overflow-wrap:anywhere}
.barrow .val{font-weight:800;font-size:clamp(1.1rem,3.4vmin,2.5rem);font-variant-numeric:tabular-nums}
.track{grid-column:1/-1;height:clamp(22px,4.4vmin,46px);border-radius:999px;background:var(--card);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.fill{height:100%;width:0;border-radius:999px;transition:width .7s var(--ease)}
.summary{display:grid;gap:18px;width:min(100%,980px);margin:0 auto}
.summary>*{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:inset 0 4px 0 color-mix(in srgb,var(--g-show) 75%,var(--card)),var(--shadow)}
.summary h3{margin:0 0 6px;font-size:clamp(1.2rem,3.4vmin,2.3rem)}
</style>
<main class="app">
  <header class="bar"><h1 id="title"></h1><button class="small" id="sound" aria-pressed="false"></button><button class="small" id="full"></button></header>

  <section class="screen" id="start">
    <div class="card g-show"><div class="wh"><span class="wicon" aria-hidden="true">📊</span><h2 class="wt" id="startH"></h2></div><p id="startP"></p><p class="note" id="privacy"></p>
      <div class="row"><button class="big hot" id="hands"></button><button class="big" id="private"></button></div>
      <p id="handsP"></p><p id="privateP"></p></div>
  </section>

  <section class="screen" id="ask" hidden>
    <div class="nowbar"><b id="askN"></b><h2 class="q" id="askQ"></h2></div>
    <div class="choices" id="choices"></div>
    <div class="row"><button class="big" id="prev"></button><button class="big hot" id="show"></button></div>
    <p class="keys" id="askKeys"></p>
  </section>

  <section class="screen" id="ready" hidden>
    <div class="card center g-show"><p class="count" id="readyN"></p><h2 id="readyH"></h2><p id="readyP"></p>
      <div class="row"><button class="big hot" id="readyBtn"></button><button class="big" id="readyShow"></button></div></div>
  </section>

  <section class="screen" id="thanks" hidden>
    <div class="card center g-show" aria-live="polite"><h2 id="thanksH"></h2><p id="thanksP"></p></div>
  </section>

  <section class="screen" id="results" hidden>
    <div class="nowbar"><b id="resN"></b><h2 class="q" id="resQ"></h2></div>
    <div class="bars" id="bars"></div>
    <p class="note" id="tooFew" hidden></p>
    <div class="row"><button class="big" id="resBack"></button><button class="big hot" id="next"></button></div>
  </section>

  <section class="screen" id="all" hidden>
    <h2 class="q" id="allH"></h2>
    <div class="summary" id="summary"></div>
    <div class="row"><button class="big hot" id="restart"></button></div>
  </section>
</main>

const B = window.BRB || {};
const LANG = (B.user && B.user.lang) || 'en';
const W = WORDS[LANG] || WORDS[String(LANG).split('-')[0]] || WORDS.en;
const tr = (k, v) => String(W[k] != null ? W[k] : WORDS.en[k]).replace(/\{(\w+)\}/g, (m, n) => (v && v[n] != null ? v[n] : m));
document.documentElement.lang = LANG; document.documentElement.dir = (B.user && B.user.dir) || 'ltr';
if (B.theme === 'light' || B.theme === 'dark') document.documentElement.dataset.theme = B.theme;   // the site's light or dark (else the device's)
const $ = id => document.getElementById(id);
let soundOn = !!CONFIG.sound;   // sound is off until someone presses Sound
const sfx = name => { try { if (soundOn && B.sfx && !B.sfx.muted) B.sfx.play(name); } catch (e) { /* no sound */ } };
const say = text => { try { if (CONFIG.readAloud && B.speak && !(B.sfx && B.sfx.muted)) B.speak(text, { lang: CONFIG.lang }); } catch (e) { /* no voice */ } };
const QS = QUESTIONS.map(x => ({ q: x.q, choices: x.choices.slice(0, 4) })).filter(x => x.choices.length >= 2);

// ---- the state: only counts ---------------------------------------------------------------------------------------
const S = { screen: 'start', mode: '', i: 0, counts: [] };
const total = i => S.counts[i].reduce((a, b) => a + b, 0);
const canShow = i => S.mode === 'hands' || total(i) >= CONFIG.minShown;
function go(name) {
  S.screen = name;
  for (const id of ['start', 'ask', 'ready', 'thanks', 'results', 'all']) $(id).hidden = id !== name;
  const f = $(name).querySelector('button.hot') || $(name).querySelector('button'); if (f) f.focus({ preventScroll: true });
}
function begin(mode) { S.mode = mode; S.i = 0; S.counts = QS.map(x => x.choices.map(() => 0)); sfx('click'); question(); }
function question() {
  const x = QS[S.i];
  if (S.mode === 'private') { $('readyN').textContent = tr('qn', { n: S.i + 1, total: QS.length }); go('ready'); return; }
  $('askN').textContent = tr('qn', { n: S.i + 1, total: QS.length }); $('askQ').textContent = x.q; $('askKeys').hidden = false;
  const box = $('choices'); box.innerHTML = '';
  x.choices.forEach((c, k) => {
    // Count hands: the number, with - and + (keys 1-4, Shift takes one away)
    const row = document.createElement('div'); row.className = 'choice';
    row.innerHTML = '<span class="tag"></span><span class="lab"></span><span class="ctl"><button class="minus">−</button><span class="num" aria-live="polite"></span><button class="hot plus">+</button></span>';
    row.querySelector('.minus').setAttribute('aria-label', `${tr('minus')}: ${c}`); row.querySelector('.plus').setAttribute('aria-label', `${tr('plus')}: ${c}`);
    row.querySelector('.minus').onclick = () => bump(k, -1); row.querySelector('.plus').onclick = () => bump(k, 1);
    row.querySelector('.num').textContent = String(S.counts[S.i][k]);
    row.querySelector('.tag').textContent = String(k + 1); row.querySelector('.tag').style.background = `var(--c${k})`; row.querySelector('.lab').textContent = c;
    box.appendChild(row);
  });
  $('prev').disabled = S.i === 0; $('prev').hidden = false; $('show').hidden = false;
  go('ask');
}
function bump(k, d) { if (S.screen !== 'ask' || S.mode !== 'hands' || !QS[S.i].choices[k]) return; S.counts[S.i][k] = Math.max(0, S.counts[S.i][k] + d); sfx(d > 0 ? 'coin' : 'click'); $('choices').children[k].querySelector('.num').textContent = String(S.counts[S.i][k]); }
/** A private answer: one more in that choice's count, and straight to "Thank you" (the choice is never shown again). */
function answer(k) {
  if (S.screen !== 'ask' || S.mode !== 'private' || !QS[S.i].choices[k]) return;
  S.counts[S.i][k] += 1; sfx('coin'); $('choices').innerHTML = '';
  go('thanks'); setTimeout(() => { if (S.screen === 'thanks') question(); }, CONFIG.thanksSeconds * 1000);
}
function results() {
  const x = QS[S.i], n = total(S.i);
  $('resN').textContent = `${tr('qn', { n: S.i + 1, total: QS.length })} · ${tr('answers', { n })}`; $('resQ').textContent = x.q;
  $('bars').innerHTML = ''; $('tooFew').hidden = canShow(S.i); $('tooFew').textContent = tr('tooFew', { n: CONFIG.minShown });
  if (canShow(S.i)) $('bars').appendChild(barsFor(S.i));
  $('next').textContent = S.i < QS.length - 1 ? tr('next') : tr('finish');
  $('resBack').textContent = S.mode === 'private' ? tr('back') : tr('prev');
  go('results'); sfx('powerup');
  requestAnimationFrame(() => requestAnimationFrame(() => { for (const f of $('bars').querySelectorAll('.fill')) f.style.width = f.dataset.w; }));
}
function barsFor(i) {
  const n = total(i), max = Math.max(1, ...S.counts[i]), wrap = document.createElement('div'); wrap.className = 'bars';
  QS[i].choices.forEach((c, k) => {
    const v = S.counts[i][k], row = document.createElement('div'); row.className = 'barrow';
    row.innerHTML = '<span class="lab"></span><span class="val"></span><div class="track"><div class="fill"></div></div>';
    row.querySelector('.lab').textContent = c;
    row.querySelector('.val').textContent = CONFIG.showPercent && n ? `${v} · ${Math.round((v / n) * 100)}%` : String(v);
    const f = row.querySelector('.fill'); f.style.background = `var(--c${k})`; f.dataset.w = `${(v / max) * 100}%`;
    wrap.appendChild(row);
  });
  return wrap;
}
function next() {
  if (S.i < QS.length - 1) { S.i += 1; question(); return; }
  $('summary').innerHTML = '';
  QS.forEach((x, i) => {
    const sec = document.createElement('section'), h = document.createElement('h3'); h.textContent = `${x.q} (${tr('answers', { n: total(i) })})`; sec.appendChild(h);
    if (canShow(i)) sec.appendChild(barsFor(i)); else { const p = document.createElement('p'); p.className = 'note'; p.textContent = tr('tooFew', { n: CONFIG.minShown }); sec.appendChild(p); }
    $('summary').appendChild(sec);
  });
  go('all'); sfx('win');
  requestAnimationFrame(() => requestAnimationFrame(() => { for (const f of $('summary').querySelectorAll('.fill')) f.style.width = f.dataset.w; }));
  try { if (B.gameOver) B.gameOver({ won: true, score: null }); } catch (e) { /* preview */ }
}

// ---- buttons and keys ---------------------------------------------------------------------------------------------
$('hands').onclick = () => begin('hands'); $('private').onclick = () => begin('private');
$('show').onclick = results; $('readyShow').onclick = results; $('next').onclick = next;
$('prev').onclick = () => { if (S.i > 0) { S.i -= 1; question(); } };
$('resBack').onclick = question;
$('readyBtn').onclick = () => {
  const x = QS[S.i]; $('askN').textContent = tr('qn', { n: S.i + 1, total: QS.length }); $('askQ').textContent = x.q;
  const box = $('choices'); box.innerHTML = '';
  x.choices.forEach((c, k) => { const b = document.createElement('button'); b.className = 'choice pick'; b.innerHTML = '<span class="tag"></span><span class="lab"></span>'; b.querySelector('.tag').textContent = String(k + 1); b.querySelector('.tag').style.background = `var(--c${k})`; b.querySelector('.lab').textContent = c; b.onclick = () => answer(k); box.appendChild(b); });
  $('prev').hidden = true; $('show').hidden = true; $('askKeys').hidden = true; go('ask'); say(x.q);
};
$('restart').onclick = () => { S.counts = []; go('start'); };
$('sound').onclick = () => { soundOn = !soundOn; $('sound').setAttribute('aria-pressed', String(soundOn)); sfx('click'); };
$('full').onclick = () => { try { if (B.fullscreen) B.fullscreen(); } catch (e) { /* not here */ } };
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (e.key === 'f' || e.key === 'F') { $('full').click(); return; }
  const digit = /^Digit([1-4])$/.exec(e.code || '') || /^Numpad([1-4])$/.exec(e.code || '');
  if (S.screen === 'ask' && digit) { e.preventDefault(); const k = +digit[1] - 1; if (S.mode === 'hands') bump(k, e.shiftKey ? -1 : 1); else answer(k); return; }
  if (e.key === 'PageDown' || e.key === 'ArrowRight' && document.documentElement.dir !== 'rtl' || e.key === 'ArrowLeft' && document.documentElement.dir === 'rtl') {
    if (S.screen === 'ask' && S.mode === 'hands') { e.preventDefault(); results(); }
    else if (S.screen === 'results') { e.preventDefault(); next(); }
  } else if (e.key === 'PageUp') {
    if (S.screen === 'ask' && S.mode === 'hands') { e.preventDefault(); $('prev').click(); }
    else if (S.screen === 'results') { e.preventDefault(); question(); }
  }
});

document.title = CONFIG.title; $('title').textContent = CONFIG.title;
for (const [id, k] of [['sound', 'sound'], ['full', 'full'], ['startH', 'startH'], ['startP', 'startP'], ['privacy', 'privacy'], ['hands', 'hands'], ['private', 'private'], ['handsP', 'handsP'], ['privateP', 'privateP'], ['show', 'show'], ['prev', 'prev'], ['readyH', 'readyH'], ['readyP', 'readyP'], ['readyBtn', 'ready'], ['readyShow', 'show'], ['thanksH', 'thanksH'], ['thanksP', 'thanksP'], ['allH', 'allH'], ['restart', 'restart'], ['askKeys', 'askKeys']]) $(id).textContent = tr(k);
$('sound').setAttribute('aria-pressed', String(soundOn));
window.__brbTest = { state: () => ({ screen: S.screen, mode: S.mode, question: S.i + 1, counts: S.counts.map(c => c.slice()), total: S.counts.length ? total(S.i) : 0, shown: S.screen === 'results' && $('bars').children.length > 0 }), start() { begin('hands'); } };
go('start');
</script>
