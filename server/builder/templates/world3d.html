  scene.add(new THREE.HemisphereLight('#ffffff', '#6a8f5a', 1.1));
  const sun = new THREE.DirectionalLight('#fff3d6', 1.6); sun.position.set(20, 40, 15); sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, far: 120 });
  scene.add(sun);
  // land: a meadow with one round hill
  land({ height: (x, z) => 3.2 * Math.exp(-((x + 14) ** 2 + (z + 10) ** 2) / 80), color: (x, z, y) => new THREE.Color().setHSL(0.28, 0.45, 0.42 + y * 0.03) });
  // a little house (a solid you can jump onto)
  const house = new THREE.Mesh(new THREE.BoxGeometry(5, 3, 5), lambert('#ff8a5c')); house.position.set(8, 1.5, -6); house.castShadow = true; scene.add(house); solid(house);
  // steps up to a ledge
  for (let i = 0; i < 4; i++) { const st = new THREE.Mesh(new THREE.BoxGeometry(3, 0.45 * (i + 1), 1.2), lambert('#c9b79c')); st.position.set(-6, 0.225 * (i + 1), -2 - i * 1.2); st.castShadow = st.receiveShadow = true; scene.add(st); solid(st); }
  // a wall
  const wall = new THREE.Mesh(new THREE.BoxGeometry(12, 2.4, 0.8), lambert('#9aa0b5')); wall.position.set(0, 1.2, -16); wall.castShadow = true; scene.add(wall); solid(wall);
  // trees (decoration, with solid trunks)
  for (const [x, z] of [[14, 6], [-16, 8], [18, -14], [-4, 14]]) {
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2), lambert('#8a5a3b')); trunk.position.set(x, landHeight(x, z) + 1, z);
    const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(1.6, 0), lambert('#3fa45b')); crown.position.set(x, landHeight(x, z) + 3, z);
    trunk.castShadow = crown.castShadow = true; decor.add(trunk, crown); solid(trunk, { round: true, walkable: false });
  }
  // stars to find
  const starGeo = new THREE.OctahedronGeometry(0.5, 0), starMat = new THREE.MeshLambertMaterial({ color: '#ffd23f', emissive: '#a07000' });
  for (const [x, y, z] of [[8, 3.9, -6], [-6, 2.6, -6.2], [-14, landHeight(-14, -10) + 1, -10], [3, 1, 2], [12, 1, 10]]) pickup(new THREE.Mesh(starGeo, starMat), x, y, z);
}
/** The player: build it from shapes, in the builder's idea (a fox, a robot, themselves...). Feet at y = 0. */
function makeHero() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.38, 0.7, 4, 10), lambert('#5fb4ff')); body.position.y = 0.75;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.34, 14, 10), lambert('#ffd9b0')); head.position.y = 1.42;
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 6), lambert('#1f1d2b')); nose.position.set(0, 1.42, -0.33);
  for (const m of [body, head]) m.castShadow = true;
  g.add(body, head, nose); return g;
}
/** What happens when a pickup is collected, and how the round is won. */
function onPickup(p) { S.score += 10; BRB.sfx.play('coin'); if (S.got === pickups.length) endRound(true); }

/* ---------- the player: gravity, ground, slopes, steps, walls, jumps, bounds ---------- */
const hero = { group: makeHero(), x: SPAWN.x, y: 0, z: SPAWN.z, vy: 0, heading: Math.PI, grounded: true, coyote: 0, buffer: 0 };
scene.add(hero.group);
function respawn() { hero.x = SPAWN.x; hero.z = SPAWN.z; hero.y = groundAt(hero.x, hero.z) ; hero.vy = 0; hero.grounded = true; }
/** Can the player stand at (x, z) with feet at y? -> the new feet height, or null when a wall, a cliff or a steep slope is in the way. */
function canStand(x, z, y, dist) {
  const R = CONFIG.radius;
  for (const s of solids) {
    if (s.mesh && !s.mesh.visible) continue;
    if (!inside(s, x, z, R)) continue;
    if (s.bottom >= y + CONFIG.height - 0.05) continue;                  // above the head
    if (s.walkable && s.top <= y + CONFIG.step + 0.001) continue;       // low enough to step onto
    return null;                                                         // a wall
  }
  const h = landHeight(x, z);
  if (h > y + 0.02 && (h - y > CONFIG.step || (hero.grounded && (h - y) / Math.max(dist, 1e-4) > CONFIG.slope))) return null;   // a cliff or too steep
  return y;
}
function inBounds(x, z) { return Math.hypot(x, z) <= CONFIG.bounds; }
function moveHero(dt, ix, iz, jumpPressed) {
  // input is relative to where the camera looks, on the ground only (never its tilt)
  const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw), rx = -fz, rz = fx;
  let mx = rx * ix + fx * iz, mz = rz * ix + fz * iz; const len = Math.hypot(mx, mz); if (len > 1) { mx /= len; mz /= len; }
  if (len > 0.05) hero.heading = Math.atan2(mx, mz);
  if (jumpPressed) hero.buffer = 0.14;
  const steps = Math.max(1, Math.ceil(dt / (1 / 120))), h = dt / steps;
  for (let i = 0; i < steps; i++) {
    hero.coyote = hero.grounded ? 0.12 : Math.max(0, hero.coyote - h); hero.buffer = Math.max(0, hero.buffer - h);
    if (hero.buffer > 0 && hero.coyote > 0) { hero.vy = CONFIG.jump; hero.grounded = false; hero.coyote = 0; hero.buffer = 0; BRB.sfx.play('jump'); }
    // sideways: x then z, so a wall stops one direction and the player slides along it
    const dx = mx * CONFIG.speed * h, dz = mz * CONFIG.speed * h;
    if (dx && inBounds(hero.x + dx, hero.z) && canStand(hero.x + dx, hero.z, hero.y, Math.abs(dx)) !== null) hero.x += dx;
    if (dz && inBounds(hero.x, hero.z + dz) && canStand(hero.x, hero.z + dz, hero.y, Math.abs(dz)) !== null) hero.z += dz;
    // up and down: gravity always pulls; land on the ground or a solid's top; walk down slopes without bouncing
    hero.vy -= CONFIG.gravity * h; let ny = hero.y + hero.vy * h;
    for (const s of solids) {   // bump the head on a solid's underside
      if (hero.vy > 0 && !(s.mesh && !s.mesh.visible) && inside(s, hero.x, hero.z, CONFIG.radius * 0.6) && hero.y + CONFIG.height <= s.bottom + 0.01 && ny + CONFIG.height > s.bottom) { ny = s.bottom - CONFIG.height; hero.vy = 0; }
    }
    const g = groundAt(hero.x, hero.z, hero.y, CONFIG.radius);
    if (ny <= g) { ny = g; hero.vy = 0; hero.grounded = true; }
    else if (hero.grounded && hero.vy <= 0 && hero.y - g <= CONFIG.step) { ny = g; hero.vy = 0; }   // stay on the ground going downhill
    else hero.grounded = false;
    hero.y = ny;
  }
  if (hero.y < -20 || !inBounds(hero.x, hero.z)) respawn();
  hero.group.position.set(hero.x, hero.y, hero.z);
  hero.group.rotation.y = hero.heading;
  if (!REDUCED) { const run = hero.grounded && len > 0.05; hero.group.children[0].scale.y = run ? 1 + Math.sin(S.time * 18) * 0.04 : 1; }
}

/* ---------- the camera: behind and above, never under the land or inside a solid ---------- */
const cam = { yaw: 0, pitch: 0.38, dist: 7.5, cur: new THREE.Vector3(), look: new THREE.Vector3(), ready: false };
function blocked(x, y, z) {
  if (y < landHeight(x, z) + 0.4) return true;
  for (const s of solids) if (!(s.mesh && !s.mesh.visible) && inside(s, x, z, 0.2) && y < s.top + 0.3 && y > s.bottom - 0.3) return true;
  return false;
}
function updateCamera(dt) {
  const portrait = innerWidth / innerHeight < 0.8, D = cam.dist * (portrait ? 1.25 : 1);
  const tx = hero.x, ty = hero.y + 1.4, tz = hero.z;
  let d = D;
  for (let k = 1; k <= 10; k++) {   // pull in until nothing is between the player and the camera
    const f = k / 10 * D, x = tx + Math.sin(cam.yaw) * Math.cos(cam.pitch) * f, y = ty + Math.sin(cam.pitch) * f, z = tz + Math.cos(cam.yaw) * Math.cos(cam.pitch) * f;
    if (blocked(x, y, z)) { d = Math.max(1.2, (k - 1) / 10 * D); break; }
  }
  const want = new THREE.Vector3(tx + Math.sin(cam.yaw) * Math.cos(cam.pitch) * d, ty + Math.sin(cam.pitch) * d, tz + Math.cos(cam.yaw) * Math.cos(cam.pitch) * d);
  const k = cam.ready ? 1 - Math.exp(-dt * 8) : 1; cam.cur.lerp(want, k); cam.look.lerp(new THREE.Vector3(tx, ty, tz), k); cam.ready = true;
  cam.cur.y = Math.max(cam.cur.y, landHeight(cam.cur.x, cam.cur.z) + 0.4);
  camera.position.copy(cam.cur); camera.lookAt(cam.look);
}

/* ---------- input: keyboard, touch joystick + jump button, drag to look around ---------- */
const keys = new Set(); let jumpQueued = false;
const stick = { id: null, x0: 0, y0: 0, x: 0, y: 0 }, look = { id: null, x: 0 };
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys.add(k);
  if ((k === ' ' || k === 'z') && S.screen === 'play') { jumpQueued = true; e.preventDefault(); }
  if ((k === 'p' || k === 'escape') && (S.screen === 'play' || S.screen === 'pause')) S.screen === 'play' ? pause() : resume();
  if (k.startsWith('arrow')) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
canvas.addEventListener('pointerdown', e => {
  if (S.screen !== 'play') return;
  if (e.pointerType !== 'mouse' && e.clientX < innerWidth * 0.55 && stick.id === null) {
    Object.assign(stick, { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: 0, y: 0 });
    const b = $('stickBase'); b.style.display = 'block'; b.style.left = e.clientX + 'px'; b.style.top = e.clientY + 'px'; $('hint').hidden = true;
  } else if (look.id === null) Object.assign(look, { id: e.pointerId, x: e.clientX });
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId === stick.id) {
    let dx = e.clientX - stick.x0, dy = e.clientY - stick.y0; const m = Math.hypot(dx, dy), R = 52; if (m > R) { dx *= R / m; dy *= R / m; }
    stick.x = dx / R; stick.y = dy / R; $('stickKnob').style.transform = `translate(${dx}px,${dy}px)`;
  } else if (e.pointerId === look.id) { cam.yaw -= (e.clientX - look.x) * 0.006; look.x = e.clientX; }
});
const endPointer = e => {
  if (e.pointerId === stick.id) { stick.id = null; stick.x = stick.y = 0; $('stickBase').style.display = 'none'; $('stickKnob').style.transform = ''; }
  if (e.pointerId === look.id) look.id = null;
};
canvas.addEventListener('pointerup', endPointer); canvas.addEventListener('pointercancel', endPointer);
const jb = $('jumpBtn');
jb.addEventListener('pointerdown', e => { e.preventDefault(); jumpQueued = true; jb.classList.add('down'); });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) jb.addEventListener(ev, () => jb.classList.remove('down'));
let drive = null;   // test input (window.__brbTest.drive)
function readInput() {
  if (drive) return { x: drive.x || 0, z: drive.z || 0 };
  let x = 0, z = 0;
  if (keys.has('arrowleft') || keys.has('a') || keys.has('q')) x -= 1;
  if (keys.has('arrowright') || keys.has('d')) x += 1;
  if (keys.has('arrowup') || keys.has('w')) z += 1;
  if (keys.has('arrowdown') || keys.has('s')) z -= 1;
  if (stick.id !== null) { x = stick.x; z = -stick.y; }
  return { x, z };
}

/* ---------- screens, HUD, rounds ---------- */
const S = { screen: 'title', ready: false, lost: false, time: 0, left: 0, got: 0, score: 0, best: +(BRB.storage.get('best') || 0), frames: 0, slow: 0, quality: 2 };
const show = id => { for (const s of ['titleScreen', 'pauseScreen', 'endScreen']) $(s).hidden = s !== id; };
function hud() { $('goal').textContent = t('goal', { got: S.got, total: pickups.length }); const c = $('clock'); c.hidden = !CONFIG.roundSeconds; if (CONFIG.roundSeconds) c.textContent = '⏱ ' + Math.ceil(S.left); }
function startRound() {
  S.got = 0; S.score = 0; S.left = CONFIG.roundSeconds; for (const p of pickups) { p.got = false; p.mesh.visible = true; }
  respawn(); cam.yaw = 0; cam.ready = false; show(null); $('hud').hidden = false; S.screen = 'play'; document.body.classList.add('playing');
  $('hint').textContent = t(TOUCH ? 'hintTouch' : 'hintKeys'); $('hint').hidden = false; hud(); canvas.focus();
}
function pause() { if (S.screen !== 'play') return; S.screen = 'pause'; show('pauseScreen'); keys.clear(); }
function resume() { if (S.screen !== 'pause') return; S.screen = 'play'; show(null); }
function endRound(won) {
  S.screen = 'end'; document.body.classList.remove('playing'); $('hud').hidden = true;
  if (won) S.score += Math.ceil(S.left) * 5;
  const best = Math.max(S.best, S.score); if (best !== S.best) { S.best = best; BRB.storage.set('best', best); }
  BRB.gameOver({ won, score: S.score }); BRB.sfx.play(won ? 'win' : 'lose'); if (won) BRB.fx.confetti();
  $('endTitle').textContent = t(won ? 'win' : 'lose'); $('endText').textContent = won ? t('winText') : t('loseText', { got: S.got, total: pickups.length });
  $('endScore').textContent = t('score', { score: S.score, best: S.best }); show('endScreen');
}
function toTitle() {
  S.screen = 'title'; $('titleText').textContent = t('title'); $('subText').textContent = t('sub');
  $('bestText').textContent = S.best ? t('best', { n: S.best }) : ''; $('howText').textContent = t(TOUCH ? 'hintTouch' : 'hintKeys'); show('titleScreen');
}
$('playBtn').textContent = t('play'); $('againBtn').textContent = t('again'); $('resumeBtn').textContent = t('resume'); $('restartBtn').textContent = t('restart');
$('pausedText').textContent = t('paused'); jb.textContent = t('jump'); canvas.setAttribute('aria-label', t('world'));
$('pauseBtn').setAttribute('aria-label', t('pause')); $('soundBtn').setAttribute('aria-label', t('sound'));
const soundIcon = () => { $('soundBtn').textContent = BRB.sfx.muted ? '🔇' : '🔊'; }; soundIcon();
$('playBtn').onclick = () => { BRB.sfx.play('click'); startRound(); };
$('againBtn').onclick = () => { BRB.sfx.play('click'); startRound(); };
$('resumeBtn').onclick = resume; $('restartBtn').onclick = startRound;
$('pauseBtn').onclick = pause; $('soundBtn').onclick = () => { BRB.sfx.mute(); soundIcon(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ---------- the loop, with a quality ladder for slow devices ---------- */
buildWorld(); respawn();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.1, clock.getDelta()); S.time += dt; S.frames++;
  if (S.screen === 'play' && !S.lost) {
    const i = readInput(); moveHero(dt, i.x, i.z, jumpQueued || !!(drive && drive.jump)); jumpQueued = false; if (drive) drive.jump = false;
    for (const p of pickups) {
      if (p.got) continue;
      p.mesh.rotation.y += dt * 2; if (!REDUCED) p.mesh.position.y = p.base + Math.sin(S.time * 2 + p.x) * 0.15;
      if (Math.hypot(p.x - hero.x, p.z - hero.z) < 1.1 && Math.abs(p.y - (hero.y + 0.8)) < 1.4) { p.got = true; p.mesh.visible = false; S.got++; onPickup(p); }
    }
    if (CONFIG.roundSeconds && S.screen === 'play') { S.left -= dt; if (S.left <= 0) { S.left = 0; endRound(false); } }
    hud();
  } else if (S.screen !== 'play') { if (!REDUCED) cam.yaw += dt * 0.08; }
  updateCamera(dt);
  renderer.render(scene, camera);
  // quality ladder: slow frames lower the pixel ratio, then turn off shadows, then hide decoration
  S.slow = S.slow * 0.97 + (dt > 1 / 40 ? 0.03 : 0);
  if (S.slow > 0.5 && S.frames > 120) { S.slow = 0; if (S.quality === 2) fit.maxDpr(1); else if (S.quality === 1) { renderer.shadowMap.enabled = false; scene.traverse(o => { if (o.material) o.material.needsUpdate = true; }); } else decor.visible = false; S.quality = Math.max(-1, S.quality - 1); }
});
S.ready = true;

/* ---------- test hook (the platform's playtests and cover pictures) ---------- */
window.__brbTest = {
  state: () => ({ screen: S.screen, ready: S.ready, got: S.got, total: pickups.length, score: S.score, pos: { x: +hero.x.toFixed(2), y: +hero.y.toFixed(2), z: +hero.z.toFixed(2) },
    ground: +landHeight(hero.x, hero.z).toFixed(2), grounded: hero.grounded, quality: S.quality, drawCalls: renderer.info.render.calls, triangles: renderer.info.render.triangles }),
  start() { startRound(); $('hint').hidden = true; },
  drive(o) { drive = o ? Object.assign({}, o) : null; },   // { x: -1..1, z: -1..1 (forward), jump: true } or null
  teleport(x, z) { hero.x = x; hero.z = z; hero.y = groundAt(x, z); hero.vy = 0; },
  look(yaw) { cam.yaw = yaw; },
};
toTitle();
if (window.__worldStartWanted) window.__brbTest.start();
</script>
