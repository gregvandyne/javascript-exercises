<title>Class Quiz</title>
<!--CLASSROOM_STYLE-->
<style>
/* Class Quiz: multiple-choice questions, one at a time, for the board or each student's own device. An optional timer,
   a score, and at the end a review of every answer. The teacher can paste their own questions (Edit questions). Plain
   HTML in the Oomba classroom style: nothing is sent anywhere and nobody is named. */
.top{display:flex;align-items:center;gap:12px}
.progress{flex:1;height:12px;border-radius:999px;background:var(--card);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--leaf);border-radius:999px;transition:width .45s var(--ease)}
.timer{--p:1;flex:none;width:clamp(46px,7vmin,72px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(.95rem,2.4vmin,1.5rem);background:conic-gradient(var(--leaf) calc(var(--p) * 360deg),var(--tint) 0);position:relative}
.timer::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--card)}
.top .pill{background:var(--card);box-shadow:var(--shadow)}
.timer span{position:relative}
.timer.low{background:conic-gradient(var(--coral) calc(var(--p) * 360deg),var(--tint) 0)}
.qcard{width:min(100%,1100px);margin:0 auto;display:flex;flex-direction:column;gap:clamp(12px,2.6vmin,22px);flex:1;justify-content:center}
.qcard .q{text-align:start}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(10px,1.8vmin,18px)}
.choice{display:flex;align-items:center;justify-content:flex-start;gap:14px;padding:12px 16px;border-radius:var(--r);border-color:var(--line);box-shadow:var(--shadow);min-height:clamp(64px,11vmin,116px);text-align:start;font-size:clamp(1.15rem,3.8vmin,2.6rem);font-weight:700}
.choice .tag{flex:none;display:grid;place-items:center;width:clamp(38px,6.4vmin,60px);aspect-ratio:1;border-radius:12px;background:var(--tint);font-weight:800;font-size:.8em}
.choice:nth-child(1) .tag{background:color-mix(in srgb,var(--g-class) 30%,var(--card))}.choice:nth-child(2) .tag{background:color-mix(in srgb,var(--g-tools) 34%,var(--card))}.choice:nth-child(3) .tag{background:color-mix(in srgb,var(--g-time) 30%,var(--card))}.choice:nth-child(4) .tag{background:color-mix(in srgb,var(--g-check) 30%,var(--card))}
.choice .lab{flex:1;min-width:0;overflow-wrap:anywhere}
.choice .mark{flex:none;font-weight:800}
.choice.right{background:var(--mint-t);border-color:var(--green);box-shadow:0 0 0 3px var(--green)}
.choice.right .tag,.choice.right:nth-child(n) .tag{background:var(--green);color:var(--on-green)}
.choice.wrong{background:var(--coral-t);border-color:var(--coral)}
.choice.wrong .tag,.choice.wrong:nth-child(n) .tag{background:var(--coral);color:var(--on-coral)}
.choice.dim{opacity:.5}
.choice:disabled{opacity:1;cursor:default}
.choice.dim:disabled{opacity:.5}
.feedback{margin:0;text-align:center;min-height:1.4em;font-weight:800;font-size:clamp(1.1rem,3vmin,2rem)}
.feedback.good{color:var(--accent-ink)}
.feedback.bad{color:var(--coral)}
.feedback .why{display:block;margin-top:6px;color:var(--ink);font-weight:600;font-size:.85em}
.big-score{font-size:clamp(3rem,13vmin,9rem);font-weight:800;letter-spacing:-.04em;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.big-score small{font-size:.4em;color:var(--soft);font-weight:700}
.card .stars{font-size:clamp(1.6rem,5vmin,3rem);letter-spacing:.15em;margin:0;color:var(--spark);text-shadow:0 2px 0 rgba(0,0,0,.15)}
.review{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px;text-align:start}
.review li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--card2);font-size:clamp(.95rem,2.2vmin,1.3rem)}
.review .ok{grid-row:span 2;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font-weight:800;color:var(--on-green);background:var(--green)}
.review .no .ok,.review li.no .ok{background:var(--coral);color:var(--on-coral)}
.review b{font-weight:800}
.review span{color:var(--soft)}
.end .card{width:min(100%,900px);max-height:none}
.editor{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:var(--scrim)}
.editor .card{width:min(100%,900px);text-align:start;max-height:calc(100dvh - 32px);overflow:auto}
.editor h2{font-size:clamp(1.4rem,4vmin,2.4rem)}
.editor textarea{width:100%;min-height:clamp(200px,40dvh,420px);font:600 clamp(.95rem,2vmin,1.15rem)/1.5 var(--font);background:var(--card2);padding:12px 14px;resize:vertical}
.editor .msg{min-height:1.3em;font-weight:700}
.editor .msg.bad{color:var(--coral)}
.editor .row{justify-content:flex-end}
@media (max-width:600px){.choice{min-height:58px;padding:10px 12px}.top{gap:8px}}
</style>
<main class="app">
  <header class="bar"><h1 id="title"></h1><button class="small" id="sound" aria-pressed="false"></button><button class="small" id="full"></button></header>

  <section class="screen" id="start">
    <div class="card g-check"><div class="wh"><span class="wicon" aria-hidden="true">❓</span><h2 class="wt" id="startH"></h2></div><p id="startP"></p>
      <div class="row"><button class="big hot" id="go"></button></div>
      <div class="row"><button class="small" id="timerBtn"></button><button class="small" id="editBtn"></button></div>
      <p class="keys" id="startKeys"></p></div>
  </section>

  <section class="screen" id="ask" hidden>
    <div class="top"><div class="progress" aria-hidden="true"><i id="bar"></i></div><span class="pill" id="score"></span><div class="timer" id="timer" hidden><span id="timerN"></span></div></div>
    <div class="qcard">
      <div class="nowbar"><b id="qn"></b><h2 class="q" id="q"></h2></div>
      <div class="choices" id="choices" role="group"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
    </div>
    <div class="row"><button class="big" id="read"></button><button class="big hot" id="next" hidden></button></div>
    <p class="keys" id="askKeys"></p>
  </section>

  <section class="screen end" id="end" hidden>
    <div class="card center g-check"><h2 id="endH"></h2><div class="big-score" id="endScore"></div><p class="stars" id="stars" aria-hidden="true"></p><p id="endP"></p>
      <div class="row"><button class="big hot" id="again"></button><button class="big" id="missed"></button></div>
      <h3 id="reviewH"></h3><ol class="review" id="review"></ol></div>
  </section>
</main>
<section class="editor" id="editor" role="dialog" aria-modal="true" aria-labelledby="editH" hidden>
  <div class="card"><h2 id="editH"></h2><p id="editP"></p>
    <label class="sr" for="editText" id="editLabel" hidden></label>
    <textarea id="editText" spellcheck="true" dir="auto"></textarea>
    <p class="msg" id="editMsg" aria-live="polite"></p>
    <div class="row"><button class="big" id="editCancel"></button><button class="big hot" id="editUse"></button></div></div>
</section>

const B = window.BRB || {};
const LANG = (B.user && B.user.lang) || 'en';
const W = WORDS[LANG] || WORDS[String(LANG).split('-')[0]] || WORDS.en;
const tr = (k, v) => String(W[k] != null ? W[k] : WORDS.en[k]).replace(/\{(\w+)\}/g, (m, n) => (v && v[n] != null ? v[n] : m));
document.documentElement.lang = LANG; document.documentElement.dir = (B.user && B.user.dir) || 'ltr';
if (B.theme === 'light' || B.theme === 'dark') document.documentElement.dataset.theme = B.theme;   // the site's light or dark (else the device's)
const $ = id => document.getElementById(id);
let soundOn = !!CONFIG.sound;   // sound is off until someone presses Sound
const sfx = name => { try { if (soundOn && B.sfx && !B.sfx.muted) B.sfx.play(name); } catch (e) { /* no sound */ } };
const say = text => { try { if (CONFIG.readAloud && B.speak) B.speak(text, { lang: CONFIG.lang }); } catch (e) { /* no voice */ } };
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const TIMERS = [0, 10, 20, 30];
const LETTERS = ['A', 'B', 'C', 'D'];

// ---- the questions in play ------------------------------------------------------------------------------------------
let bank = QUESTIONS.filter(x => x && x.q && Array.isArray(x.choices) && x.choices.length >= 2).map(x => ({ q: String(x.q), choices: x.choices.slice(0, 4).map(String), answer: Math.max(0, Math.min(x.choices.length - 1, x.answer | 0)), why: x.why ? String(x.why) : '' }));
const S = { screen: 'start', list: [], i: 0, score: 0, picked: null, log: [], timer: TIMERS.includes(CONFIG.timer) ? CONFIG.timer : 0, left: 0, tick: null };
function deal(from) {
  const order = CONFIG.shuffleQuestions ? shuffle(from) : from.slice();
  return order.map(x => {
    const idx = x.choices.map((c, i) => i), ord = CONFIG.shuffleChoices ? shuffle(idx) : idx;
    return { q: x.q, why: x.why, choices: ord.map(i => x.choices[i]), answer: ord.indexOf(x.answer), src: x };
  });
}
function show(id) { for (const s of ['start', 'ask', 'end']) $(s).hidden = s !== id; S.screen = id; }
function home() { stopTimer(); show('start'); $('startP').textContent = tr('startP', { total: bank.length }); paintTimerBtn(); $('go').focus(); }
function begin(from) {
  S.list = deal(from || bank); S.i = 0; S.score = 0; S.log = []; show('ask'); ask();
}
function ask() {
  const x = S.list[S.i]; S.picked = null;
  $('qn').textContent = tr('qn', { n: S.i + 1, total: S.list.length }); $('score').textContent = tr('score', { n: S.score });
  $('bar').style.width = `${(S.i / S.list.length) * 100}%`;
  $('q').textContent = x.q; $('q').classList.remove('oc-rise'); void $('q').offsetWidth; $('q').classList.add('oc-rise');
  $('feedback').textContent = ''; $('feedback').className = 'feedback'; $('next').hidden = true;
  const box = $('choices'); box.innerHTML = '';
  x.choices.forEach((c, i) => {
    const b = document.createElement('button'); b.className = 'choice oc-pop'; b.style.animationDelay = `${i * 45}ms`;
    b.innerHTML = '<span class="tag"></span><span class="lab"></span><span class="mark"></span>';
    b.children[0].textContent = LETTERS[i]; b.children[1].textContent = c;
    b.onclick = () => pick(i); box.appendChild(b);
  });
  $('read').hidden = !(CONFIG.readAloud && B.speak);
  startTimer(); box.querySelector('button').focus({ preventScroll: true });
}
function pick(i) {
  if (S.screen !== 'ask' || S.picked !== null) return;
  stopTimer();
  const x = S.list[S.i], ok = i === x.answer; S.picked = i;
  if (ok) S.score++;
  S.log.push({ q: x.q, given: i >= 0 ? x.choices[i] : '', right: x.choices[x.answer], ok, src: x.src });
  [...$('choices').children].forEach((b, j) => {
    b.disabled = true;
    if (j === x.answer) { b.classList.add('right'); b.children[2].textContent = '✓'; b.setAttribute('aria-label', `${x.choices[j]}: ${tr('yes')}`); }
    else if (j === i) { b.classList.add('wrong', 'oc-nudge'); b.children[2].textContent = '✗'; b.setAttribute('aria-label', `${x.choices[j]}: ${tr('no')}`); }
    else b.classList.add('dim');
  });
  const fb = $('feedback');
  fb.textContent = ok ? tr('right') : i < 0 ? tr('timeUp') : tr('wrong');
  if (x.why) { const w = document.createElement('span'); w.className = 'why'; w.textContent = x.why; fb.appendChild(w); }
  fb.className = `feedback ${ok ? 'good' : 'bad'}`;
  $('score').textContent = tr('score', { n: S.score }); if (ok) { $('score').classList.remove('oc-bump'); void $('score').offsetWidth; $('score').classList.add('oc-bump'); }
  sfx(ok ? 'coin' : 'hit');
  $('bar').style.width = `${((S.i + 1) / S.list.length) * 100}%`;
  $('next').textContent = S.i + 1 < S.list.length ? tr('next') : tr('finish'); $('next').hidden = false; $('next').focus({ preventScroll: true });
}
function next() { if (S.screen !== 'ask' || S.picked === null) return; if (++S.i < S.list.length) ask(); else finish(); }
function finish() {
  stopTimer(); show('end');
  const n = S.score, total = S.list.length, pct = total ? n / total : 0;
  $('endH').textContent = pct === 1 ? tr('endAll') : pct >= 0.6 ? tr('endGood') : tr('endTry');
  $('endScore').innerHTML = ''; $('endScore').append(String(n)); const sm = document.createElement('small'); sm.textContent = ` / ${total}`; $('endScore').appendChild(sm);
  $('stars').textContent = '★'.repeat(pct === 1 ? 3 : pct >= 0.6 ? 2 : pct > 0 ? 1 : 0).padEnd(3, '☆');
  $('endP').textContent = tr('endH', { n, total });
  const r = $('review'); r.innerHTML = '';
  for (const l of S.log) {
    const li = document.createElement('li'); li.className = l.ok ? 'yes' : 'no';
    li.innerHTML = '<span class="ok" aria-hidden="true"></span><b></b><span></span>';
    li.children[0].textContent = l.ok ? '✓' : '✗'; li.children[1].textContent = l.q;
    li.children[2].textContent = l.ok ? tr('answer', { a: l.right }) : `${tr('yours', { a: l.given || tr('none') })} · ${tr('answer', { a: l.right })}`;
    li.setAttribute('aria-label', `${l.ok ? tr('yes') : tr('no')}. ${l.q}. ${li.children[2].textContent}`);
    r.appendChild(li);
  }
  $('missed').hidden = S.log.every(l => l.ok);
  sfx(pct >= 0.6 ? 'win' : 'click'); if (pct === 1) { try { if (B.fx) B.fx.confetti(); } catch (e) { /* reduced motion */ } }
  try { if (B.gameOver) B.gameOver({ won: pct >= 0.6, score: n }); } catch (e) { /* preview */ }
  $('again').focus({ preventScroll: true });
}

// ---- the timer ----------------------------------------------------------------------------------------------------
function paintTimerBtn() { $('timerBtn').textContent = S.timer ? tr('timerOn', { s: S.timer }) : tr('timerOff'); $('timerBtn').setAttribute('aria-pressed', String(!!S.timer)); }
function startTimer() {
  stopTimer(); $('timer').hidden = !S.timer; if (!S.timer) return;
  const end = Date.now() + S.timer * 1000;
  const paint = () => { const ms = Math.max(0, end - Date.now()); S.left = Math.ceil(ms / 1000); $('timerN').textContent = String(S.left); $('timer').style.setProperty('--p', String(ms / (S.timer * 1000))); $('timer').classList.toggle('low', ms < 4000); if (!ms) pick(-1); };
  paint(); S.tick = setInterval(paint, 200);
}
function stopTimer() { if (S.tick) { clearInterval(S.tick); S.tick = null; } }

// ---- the teacher's own questions ----------------------------------------------------------------------------------
const toLines = list => list.map(x => [x.q, x.choices[x.answer], ...x.choices.filter((c, i) => i !== x.answer)].join(' | ')).join('\n');
function fromLines(text) {
  const out = [], lines = String(text).split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i].trim(); if (!raw) continue;
    const parts = raw.split('|').map(s => s.trim()).filter(Boolean);
    if (parts.length < 3) return { error: tr('bad', { n: i + 1 }) };
    out.push({ q: parts[0].slice(0, 300), choices: parts.slice(1, 5).map(s => s.slice(0, 120)), answer: 0, why: '' });
  }
  return out.length ? { list: out.slice(0, 60) } : { error: tr('bad', { n: 1 }) };
}
function openEditor() { $('editText').value = toLines(bank); $('editMsg').textContent = ''; $('editMsg').className = 'msg'; $('editor').hidden = false; $('editText').focus(); }
function closeEditor() { $('editor').hidden = true; $('editBtn').focus(); }
function useEditor() {
  const r = fromLines($('editText').value);
  if (r.error) { $('editMsg').textContent = r.error; $('editMsg').className = 'msg bad'; return; }
  bank = r.list; $('editMsg').textContent = tr('ready', { n: bank.length }); closeEditor(); home();
}

// ---- buttons and keys ---------------------------------------------------------------------------------------------
$('go').onclick = () => begin(); $('next').onclick = next; $('again').onclick = () => begin();
$('missed').onclick = () => begin(S.log.filter(l => !l.ok).map(l => l.src));
$('read').onclick = () => { const x = S.list[S.i]; if (x) say(x.q); };
$('timerBtn').onclick = () => { S.timer = TIMERS[(TIMERS.indexOf(S.timer) + 1) % TIMERS.length]; paintTimerBtn(); };
$('editBtn').onclick = openEditor; $('editCancel').onclick = closeEditor; $('editUse').onclick = useEditor;
$('sound').onclick = () => { soundOn = !soundOn; $('sound').setAttribute('aria-pressed', String(soundOn)); sfx('click'); };
$('full').onclick = () => { try { if (B.fullscreen) B.fullscreen(); } catch (e) { /* not here */ } };
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!$('editor').hidden) { if (e.key === 'Escape') { e.preventDefault(); closeEditor(); } return; }
  const k = e.key;
  if (k === 'f' || k === 'F') { $('full').click(); return; }
  if (S.screen === 'ask') {
    const i = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k.toLowerCase());
    if (k.length === 1 && i >= 0 && i < S.list[S.i].choices.length && S.picked === null) { e.preventDefault(); pick(i); }
    else if ((k === 'Enter' || k === ' ' || k === 'PageDown' || k === 'ArrowRight') && S.picked !== null) { e.preventDefault(); next(); }
    else if (k === 'r' || k === 'R') { $('read').click(); }
  }
});

document.title = CONFIG.title; $('title').textContent = CONFIG.title; $('startH').textContent = CONFIG.title;
$('sound').textContent = tr('sound'); $('full').textContent = tr('full'); $('go').textContent = tr('go'); $('editBtn').textContent = tr('edit');
$('read').textContent = tr('read'); $('again').textContent = tr('again'); $('missed').textContent = tr('missed'); $('reviewH').textContent = tr('review');
$('askKeys').textContent = tr('keys'); $('startKeys').textContent = tr('keys');
$('editH').textContent = tr('editH'); $('editP').textContent = tr('editP'); $('editLabel').textContent = tr('editH'); $('editText').setAttribute('aria-label', tr('editH'));
$('editUse').textContent = tr('use'); $('editCancel').textContent = tr('cancel');
$('editBtn').hidden = !CONFIG.allowEdit;
$('sound').setAttribute('aria-pressed', String(soundOn));
window.__brbTest = { state: () => ({ screen: S.screen, question: S.i + 1, total: S.list.length || bank.length, score: S.score, answered: S.picked !== null, answer: S.list[S.i] ? S.list[S.i].answer : null, timer: S.timer }), start() { begin(); } };
home();
</script>
