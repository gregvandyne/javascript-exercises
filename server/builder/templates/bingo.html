<title>Class Bingo</title>
<style>
/* Class Bingo. "Call on the board": the board shows each call big (a math fact, a definition), with the answer a tap
   away and every call so far. "Play a card": a random card on a player's own device, tap to mark, five in a row wins.
   Nothing is sent between devices and nobody is named. Big type, keyboard and clicker keys. */
:root{--bg:#1d1a3a;--bg2:#2a2552;--ink:#fffaf2;--soft:#d6d0ff;--edge:#0d0b20;--card:#fffaf2;--card-ink:#231f3d;--hot:#ff5fa2;--hot-ink:#ffffff;--mark:#ffcf3f;--good:#5be3a1}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
body{background:radial-gradient(circle at 20% 10%,var(--bg2),var(--bg) 60%) fixed}
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:12px;padding:max(10px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
.bar{display:flex;align-items:center;gap:10px}
.bar h1{flex:1;min-width:0;margin:0;font-size:clamp(1.2rem,3.4vmin,2.4rem);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;font-weight:800;min-height:48px;min-width:48px;padding:8px 18px;border-radius:16px;border:3px solid var(--edge);background:var(--bg2);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--edge)}
button:active{transform:translateY(2px);box-shadow:0 2px 0 var(--edge)}
button:focus-visible{outline:5px solid var(--mark);outline-offset:3px}
button[aria-pressed="true"]{background:var(--mark);color:var(--card-ink)}
button:disabled{opacity:.45;cursor:default}
.small{min-height:44px;padding:6px 14px;font-size:clamp(.9rem,2vmin,1.2rem)}
.hot{background:var(--hot);color:var(--hot-ink)}
.big{font-size:clamp(1.1rem,3.4vmin,2.2rem);min-height:60px;padding:10px 24px}
[hidden]{display:none!important}
.screen{flex:1;display:flex;flex-direction:column;gap:clamp(10px,2vmin,20px);min-height:0}
.card{margin:auto;width:min(100%,800px);background:var(--bg2);border:4px solid var(--edge);border-radius:28px;padding:clamp(18px,4vmin,40px);text-align:center;box-shadow:0 8px 0 var(--edge)}
.card h2{margin:0 0 10px;font-size:clamp(1.8rem,6.4vmin,4.2rem)}
.card p{margin:10px 0;font-size:clamp(1.05rem,2.8vmin,1.8rem);color:var(--soft)}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.count{margin:0;text-align:center;font-weight:800;color:var(--soft);font-size:clamp(1rem,2.6vmin,1.6rem)}
.call{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:var(--card);color:var(--card-ink);border:5px solid var(--edge);border-radius:32px;padding:16px;box-shadow:0 8px 0 var(--edge);min-height:180px}
.call .now{font-size:clamp(2.4rem,14vmin,10rem);font-weight:900;line-height:1.05;overflow-wrap:anywhere}
.call .ans{font-size:clamp(1.4rem,6vmin,4rem);font-weight:900;color:var(--hot)}
.called{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0;padding:0;list-style:none}
.called li{padding:6px 12px;border-radius:999px;background:var(--edge);font-weight:800;font-size:clamp(.9rem,2.2vmin,1.4rem)}
.grid{margin:auto;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:clamp(5px,1.2vmin,10px);width:min(100%,calc(100dvh - 230px),720px);aspect-ratio:1}
.cell{aspect-ratio:1;min-width:0;padding:2px;border-radius:14px;background:var(--card);color:var(--card-ink);font-size:clamp(1rem,calc(min(100vw,100dvh) / var(--n) / 3.4),3rem);font-weight:900;overflow-wrap:anywhere;line-height:1.05}
.cell[aria-pressed="true"]{background:var(--mark);color:var(--card-ink);box-shadow:inset 0 0 0 6px var(--hot),0 4px 0 var(--edge)}
.cell.free{background:var(--good)}
.bingo{position:fixed;inset:0;display:grid;place-items:center;background:rgba(13,11,32,.6);z-index:5;pointer-events:none}
.bingo b{font-size:clamp(3rem,18vmin,12rem);font-weight:900;color:var(--mark);text-shadow:0 8px 0 var(--edge);transform:rotate(-6deg)}
.keys{text-align:center;margin:0;font-size:clamp(.85rem,2vmin,1.2rem);font-weight:700;color:var(--soft)}
</style>
<main class="app">
  <header class="bar"><h1 id="title"></h1><button class="small" id="sound" aria-pressed="true"></button><button class="small" id="full"></button></header>
  <section class="screen" id="start">
    <div class="card"><h2 id="startH"></h2><p id="startP"></p>
      <div class="row"><button class="big hot" id="caller"></button><button class="big" id="player"></button></div>
      <p id="callerP"></p><p id="playerP"></p></div>
  </section>
  <section class="screen" id="calling" hidden>
    <p class="count" id="callN"></p>
    <div class="call" aria-live="polite"><div class="now" id="now"></div><div class="ans" id="ans" hidden></div></div>
    <div class="row"><button class="big" id="undo"></button><button class="big" id="showAns"></button><button class="big" id="read"></button><button class="big hot" id="nextCall"></button></div>
    <ul class="called" id="called" aria-label=""></ul>
    <p class="keys" id="callKeys"></p>
  </section>
  <section class="screen" id="playing" hidden>
    <p class="count" id="cardP"></p>
    <div class="grid" id="grid" role="grid"></div>
    <div class="row"><button class="big" id="newCard"></button></div>
  </section>
  <div class="bingo" id="bingo" hidden><b id="bingoW"></b></div>
</main>

const B = window.BRB || {};
const LANG = (B.user && B.user.lang) || 'en';
const W = WORDS[LANG] || WORDS[String(LANG).split('-')[0]] || WORDS.en;
const tr = (k, v) => String(W[k] != null ? W[k] : WORDS.en[k]).replace(/\{(\w+)\}/g, (m, n) => (v && v[n] != null ? v[n] : m));
document.documentElement.lang = LANG; document.documentElement.dir = (B.user && B.user.dir) || 'ltr';
const $ = id => document.getElementById(id);
const sfx = name => { try { if (B.sfx) B.sfx.play(name); } catch (e) { /* no sound */ } };
const say = text => { try { if (CONFIG.readAloud && B.speak && !(B.sfx && B.sfx.muted)) B.speak(text, { lang: CONFIG.lang }); } catch (e) { /* no voice */ } };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const N = Math.max(3, Math.min(6, CONFIG.size | 0)), FREE = !!CONFIG.free && N % 2 === 1;

// ---- the state ----------------------------------------------------------------------------------------------------
const S = { screen: 'start', deck: [], at: -1, answer: false, card: [], marked: [], bingo: false };
function go(name) {
  S.screen = name; for (const id of ['start', 'calling', 'playing']) $(id).hidden = id !== name;
  const f = $(name).querySelector('button.hot') || $(name).querySelector('button'); if (f) f.focus({ preventScroll: true });
}

// ---- calling ------------------------------------------------------------------------------------------------------
function startCalling() { S.deck = shuffle(ITEMS.slice()); S.at = -1; S.answer = false; go('calling'); paintCall(); }
function paintCall() {
  const cur = S.deck[S.at];
  $('callN').textContent = S.at < 0 ? tr('ready') : tr('callN', { n: S.at + 1, total: S.deck.length });
  $('now').textContent = cur ? cur.call : '?';
  $('ans').textContent = cur ? cur.mark : ''; $('ans').hidden = !cur || !S.answer || cur.mark === cur.call;
  $('showAns').disabled = !cur || cur.mark === cur.call; $('showAns').setAttribute('aria-pressed', String(S.answer)); $('read').disabled = !cur;
  $('undo').disabled = S.at < 0; $('nextCall').disabled = S.at >= S.deck.length - 1;
  if (S.at >= S.deck.length - 1 && cur) $('callN').textContent = `${tr('callN', { n: S.at + 1, total: S.deck.length })} · ${tr('allDone')}`;
  const list = $('called'); list.innerHTML = '';
  for (let i = S.at - 1; i >= 0; i--) { const li = document.createElement('li'); const x = S.deck[i]; li.textContent = x.mark === x.call ? x.call : `${x.call} = ${x.mark}`; list.appendChild(li); }
}
function nextCall() { if (S.screen !== 'calling' || S.at >= S.deck.length - 1) return; S.at += 1; S.answer = false; sfx('coin'); paintCall(); say(S.deck[S.at].call); }
function undoCall() { if (S.screen !== 'calling' || S.at < 0) return; S.at -= 1; S.answer = false; sfx('click'); paintCall(); }
function toggleAnswer() { if (S.screen !== 'calling' || S.at < 0) return; S.answer = !S.answer; paintCall(); }

// ---- a card -------------------------------------------------------------------------------------------------------
function newCard() {
  const need = N * N - (FREE ? 1 : 0), marks = shuffle(ITEMS.map(x => x.mark)).slice(0, need);
  S.card = []; S.marked = []; S.bingo = false;
  for (let i = 0; i < N * N; i++) {
    const free = FREE && i === Math.floor((N * N) / 2);
    S.card.push(free ? null : marks.shift() || '');
    S.marked.push(free);
  }
  go('playing'); paintCard();
}
function paintCard() {
  const g = $('grid'); g.style.setProperty('--n', N); g.innerHTML = '';
  S.card.forEach((m, i) => {
    const b = document.createElement('button'); b.className = `cell${m === null ? ' free' : ''}`;
    b.textContent = m === null ? tr('free') : m; b.setAttribute('aria-pressed', String(S.marked[i])); b.disabled = m === null;
    b.onclick = () => { S.marked[i] = !S.marked[i]; b.setAttribute('aria-pressed', String(S.marked[i])); sfx(S.marked[i] ? 'click' : 'jump'); check(); };
    g.appendChild(b);
  });
  $('cardP').textContent = N === 5 ? tr('cardP') : tr('cardP4');
}
function lines() {
  const out = [];
  for (let r = 0; r < N; r++) out.push([...Array(N)].map((_, c) => r * N + c));
  for (let c = 0; c < N; c++) out.push([...Array(N)].map((_, r) => r * N + c));
  out.push([...Array(N)].map((_, i) => i * N + i), [...Array(N)].map((_, i) => i * N + (N - 1 - i)));
  return out;
}
function check() {
  const got = lines().some(l => l.every(i => S.marked[i]));
  if (got && !S.bingo) {
    S.bingo = true; $('bingoW').textContent = tr('bingo'); $('bingo').hidden = false; sfx('win');
    try { if (B.fx) B.fx.confetti(); } catch (e) { /* reduced motion */ }
    setTimeout(() => { $('bingo').hidden = true; }, 2200);
    try { if (B.gameOver) B.gameOver({ won: true, score: null }); } catch (e) { /* preview */ }
  } else if (!got) S.bingo = false;
}

// ---- buttons and keys ---------------------------------------------------------------------------------------------
$('caller').onclick = () => { sfx('click'); startCalling(); }; $('player').onclick = () => { sfx('click'); newCard(); };
$('nextCall').onclick = nextCall; $('undo').onclick = undoCall; $('showAns').onclick = toggleAnswer; $('newCard').onclick = newCard;
$('read').onclick = () => { if (S.at >= 0) say(S.deck[S.at].call); };
$('sound').onclick = () => { try { if (B.sfx) B.sfx.mute(); } catch (e) { /* no sound */ } $('sound').setAttribute('aria-pressed', String(!(B.sfx && B.sfx.muted))); };
$('full').onclick = () => { try { if (B.fullscreen) B.fullscreen(); } catch (e) { /* not here */ } };
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  const k = e.key, rtl = document.documentElement.dir === 'rtl';
  if (k === 'f' || k === 'F') { $('full').click(); return; }
  if (S.screen !== 'calling') return;
  const fwd = k === ' ' || k === 'Enter' || k === 'PageDown' || k === (rtl ? 'ArrowLeft' : 'ArrowRight');
  const back = k === 'PageUp' || k === (rtl ? 'ArrowRight' : 'ArrowLeft');
  if (fwd && !(document.activeElement && document.activeElement.tagName === 'BUTTON' && document.activeElement !== $('nextCall') && (k === ' ' || k === 'Enter'))) { e.preventDefault(); nextCall(); }
  else if (back) { e.preventDefault(); undoCall(); }
  else if (k === 'a' || k === 'A') toggleAnswer();
});

document.title = CONFIG.title; $('title').textContent = CONFIG.title;
for (const [id, k] of [['sound', 'sound'], ['full', 'full'], ['startH', 'startH'], ['startP', 'startP'], ['caller', 'caller'], ['player', 'player'], ['callerP', 'callerP'], ['playerP', 'playerP'], ['nextCall', 'next'], ['undo', 'undo'], ['showAns', 'showAns'], ['read', 'read'], ['newCard', 'newCard'], ['callKeys', 'callKeys']]) $(id).textContent = tr(k);
$('called').setAttribute('aria-label', tr('calledList')); $('read').hidden = !(CONFIG.readAloud && B.speak);
$('sound').setAttribute('aria-pressed', String(!(B.sfx && B.sfx.muted)));
window.__brbTest = { state: () => ({ screen: S.screen, called: S.at + 1, current: S.at >= 0 ? S.deck[S.at].call : null, marked: S.marked.filter(Boolean).length, bingo: S.bingo, size: N }), start() { startCalling(); nextCall(); } };
go('start');
</script>
