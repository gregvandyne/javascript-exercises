  background:var(--ok-card);color:var(--ok-text);border:3px solid var(--ok-edge);box-shadow:0 4px 0 var(--ok-edge);border-radius:999px;font-weight:800;white-space:nowrap;z-index:1}

<script>
// Race Board Game, on the Oomba Kit: one Oomba.game call (controls: 'none'). Roll the die and race along a winding
// path of numbered tiles: rockets zoom you ahead, banana peels slide you back, stars give another roll. Play a friend
// on one screen or the robot. The kit does the screens, pause, results, sound and juice.
'use strict';
const CONFIG = {
  title: 'Rocket Race',
  p1: { name: 'Fox', species: 'fox' },
  p2: { name: 'Frog', species: 'frog' },
  robot: { name: 'Robo', species: 'oomba', colors: { base: 'stone' }, wear: ['headphones'] },
  biome: 'meadow',
  squares: 30,
  perRow: 6,
  botDelay: 0.8,
  stepMs: 170,
};
// Special squares: boost (zoom ahead to "to"), slide (slide back to "to"), again (roll again). art: a kit prop.
const SPECIALS = {
  3: { kind: 'boost', to: 11, art: 'rocket' },
  7: { kind: 'again', art: 'spark' },
  9: { kind: 'slide', to: 4, art: 'banana' },
  14: { kind: 'boost', to: 20, art: 'rocket' },
  17: { kind: 'slide', to: 12, art: 'banana' },
  19: { kind: 'again', art: 'spark' },
  23: { kind: 'boost', to: 27, art: 'rocket' },
  26: { kind: 'slide', to: 18, art: 'banana' },
};
const WORDS = {
  en: { sub: 'Roll the die and race to the trophy! Rockets zoom you ahead, banana peels slide you back.', roll: 'Roll!', turn: '{name}’s turn', boost: 'Rocket boost!', slide: 'Wheee! Slide down!', again: 'Lucky star! Roll again!', who: 'Who is playing?', two: 'Two players', robot: 'Me vs the robot', how1: 'Tap Roll to throw the die', how2: 'Rockets zoom you ahead', how3: 'First to the trophy wins', wins: '{name} wins!' },
  es: { sub: '¡Tira el dado y corre hasta el trofeo! Los cohetes te adelantan y las cáscaras de plátano te hacen resbalar.', roll: '¡Tirar!', turn: 'Turno de {name}', boost: '¡Impulso de cohete!', slide: '¡Uiii! ¡A resbalar!', again: '¡Estrella de la suerte! ¡Tira otra vez!', who: '¿Quién juega?', two: 'Dos jugadores', robot: 'Yo contra el robot', how1: 'Toca Tirar para lanzar el dado', how2: 'Los cohetes te adelantan', how3: 'Gana quien llegue primero al trofeo', wins: '¡Gana {name}!' },
  fr: { sub: 'Lance le dé et file jusqu’au trophée ! Les fusées te font avancer, les peaux de banane te font glisser.', roll: 'Lancer !', turn: 'Au tour de {name}', boost: 'Coup de fusée !', slide: 'Wiii ! Ça glisse !', again: 'Étoile porte-bonheur ! Relance !', who: 'Qui joue ?', two: 'Deux joueurs', robot: 'Moi contre le robot', how1: 'Touche Lancer pour jeter le dé', how2: 'Les fusées te font avancer', how3: 'Le premier au trophée gagne', wins: '{name} gagne !' },
  de: { sub: 'Würfle und renn zum Pokal! Raketen bringen dich nach vorn, Bananenschalen lassen dich zurückrutschen.', roll: 'Würfeln!', turn: '{name} ist dran', boost: 'Raketenschub!', slide: 'Huiii! Runterrutschen!', again: 'Glücksstern! Noch mal würfeln!', who: 'Wer spielt?', two: 'Zwei Spieler', robot: 'Ich gegen den Roboter', how1: 'Tippe auf Würfeln', how2: 'Raketen bringen dich nach vorn', how3: 'Wer zuerst beim Pokal ist, gewinnt', wins: '{name} gewinnt!' },
  it: { sub: 'Tira il dado e corri fino al trofeo! I razzi ti spingono avanti, le bucce di banana ti fanno scivolare indietro.', roll: 'Tira!', turn: 'Tocca a {name}', boost: 'Spinta a razzo!', slide: 'Uiii! Si scivola!', again: 'Stella fortunata! Tira ancora!', who: 'Chi gioca?', two: 'Due giocatori', robot: 'Io contro il robot', how1: 'Tocca Tira per lanciare il dado', how2: 'I razzi ti spingono avanti', how3: 'Vince chi arriva primo al trofeo', wins: 'Vince {name}!' },
  pt: { sub: 'Jogue o dado e corra até o troféu! Foguetes te levam para frente, cascas de banana te fazem escorregar.', roll: 'Jogar!', turn: 'Vez de {name}', boost: 'Impulso de foguete!', slide: 'Uhuuu! Escorregou!', again: 'Estrela da sorte! Jogue de novo!', who: 'Quem vai jogar?', two: 'Dois jogadores', robot: 'Eu contra o robô', how1: 'Toque em Jogar para lançar o dado', how2: 'Foguetes te levam para frente', how3: 'Quem chegar primeiro ao troféu vence', wins: '{name} venceu!' },
  nl: { sub: 'Gooi de dobbelsteen en race naar de beker! Raketten schieten je vooruit, bananenschillen laten je terugglijden.', roll: 'Gooien!', turn: '{name} is aan de beurt', boost: 'Raketboost!', slide: 'Wiii! Glijden!', again: 'Geluksster! Gooi nog eens!', who: 'Wie speelt er?', two: 'Twee spelers', robot: 'Ik tegen de robot', how1: 'Tik op Gooien voor de dobbelsteen', how2: 'Raketten schieten je vooruit', how3: 'Wie eerst bij de beker is, wint', wins: '{name} wint!' },
  ru: { sub: 'Бросай кубик и мчись к кубку! Ракеты несут вперёд, а банановые шкурки — назад.', roll: 'Бросить!', turn: 'Ходит {name}', boost: 'Ракетный рывок!', slide: 'Уиии! Скатываемся!', again: 'Счастливая звёздочка! Бросай ещё!', who: 'Кто играет?', two: 'Два игрока', robot: 'Я против робота', how1: 'Нажми «Бросить», чтобы кинуть кубик', how2: 'Ракеты несут вперёд', how3: 'Кто первым дойдёт до кубка — победил', wins: '{name} побеждает!' },
  he: { sub: 'הטילו את הקובייה ודהרו אל הגביע! טילים מקפיצים קדימה, קליפות בננה מחליקות אחורה.', roll: 'הטל!', turn: 'התור של {name}', boost: 'זינוק טיל!', slide: 'ווּיי! מחליקים למטה!', again: 'כוכב מזל! הטילו שוב!', who: 'מי משחק?', two: 'שני שחקנים', robot: 'אני נגד הרובוט', how1: 'הקישו על ״הטל!״ כדי להטיל את הקובייה', how2: 'טילים מקפיצים קדימה', how3: 'מי שמגיע ראשון לגביע מנצח', wins: '{name} מנצח!' },
  ar: { sub: 'ارمِ النرد وسابق نحو الكأس! الصواريخ تدفعك للأمام وقشور الموز تزلقك للخلف.', roll: 'ارمِ!', turn: 'دور {name}', boost: 'دفعة صاروخ!', slide: 'ويي! انزلاق للأسفل!', again: 'نجمة الحظ! ارمِ مرة أخرى!', who: 'من سيلعب؟', two: 'لاعبان', robot: 'أنا ضد الروبوت', how1: 'انقر «ارمِ!» لترمي النرد', how2: 'الصواريخ تدفعك للأمام', how3: 'أول من يصل إلى الكأس يفوز', wins: '{name} يفوز!' },
  ja: { sub: 'サイコロを ふって トロフィーまで きょうそう！ロケットで すすみ、バナナの かわで すべって もどるよ。', roll: 'ふる！', turn: '{name}の ばん', boost: 'ロケットで ビューン！', slide: 'わーい！すべって もどる！', again: 'ラッキースター！もう いっかい！', who: 'だれが あそぶ？', two: '2にんで あそぶ', robot: 'ロボットと たいけつ', how1: '「ふる！」で サイコロを ふろう', how2: 'ロケットで まえに すすむよ', how3: 'さきに トロフィーに ついたら かち', wins: '{name}の かち！' },
  'zh-Hant': { sub: '擲骰子，衝向獎盃！火箭讓你往前衝，香蕉皮讓你滑回去。', roll: '擲！', turn: '輪到{name}', boost: '火箭加速！', slide: '咻～滑下去！', again: '幸運星！再擲一次！', who: '誰要玩？', two: '兩個玩家', robot: '我對機器人', how1: '點「擲！」擲骰子', how2: '火箭讓你往前衝', how3: '先到獎盃的人贏', wins: '{name} 贏了！' },
};
const SET = [
  '                              ',
  '                              ',
  '                              ',
  '                              ',
  '                              ',
  '                              ',
  '                              ',
  '                              ',
  '                              ',
  '              P               ',
  '##############################',
  '##############################',
  '##############################',
  '##############################',
  '##############################',
];

const O = window.Oomba;
let vsBot = false, ui = null, pos = [1, 1], turn = 0, rolling = false, die = null, world = null;
const who = i => (i === 1 && vsBot ? CONFIG.robot : i ? CONFIG.p2 : CONFIG.p1);
const token = (w, i) => (i ? w.find('p2') : w.hero);
const rows = () => Math.ceil(CONFIG.squares / CONFIG.perRow);
/** Square n (1..squares) -> its place: rows wind left to right, then back, from the bottom up. */
function spot(w, n) {
  const c = w.cell * 1.55, i = n - 1, r = Math.floor(i / CONFIG.perRow), k = i % CONFIG.perRow, col = r % 2 ? CONFIG.perRow - 1 - k : k;
  return { x: w.level.w / 2 + (col - (CONFIG.perRow - 1) / 2) * c, y: ground(w) - 1.1 * w.cell - r * c };
}
const ground = w => w.level.h - 5 * w.cell;
/** The board fills the screen between the "whose turn" pill (top) and the Roll button (bottom). */
function frame(w) {
  const V = w.stage.view, C = w.cam, k = V.vh / innerHeight, top = 120 * k, bottom = 100 * k, c = w.cell * 1.55;
  const x0 = w.level.w / 2 - (CONFIG.perRow * c) / 2 - w.cell, x1 = w.level.w - x0, y0 = spot(w, CONFIG.squares).y - 3.4 * w.cell, y1 = ground(w) + w.cell * 0.6;
  const z = Math.min(V.vw / (x1 - x0), (V.vh - top - bottom) / (y1 - y0));
  C.bounds(null); C.zoom = z; C.x = (x0 + x1) / 2; C.y = (y0 + y1) / 2 - ((top + V.vh - bottom) / 2 - V.vh / 2) / z;
}
function clear() { if (ui) { ui.roll.remove(); ui.turn.remove(); } ui = null; }
function build(w) {
  clear(); world = w; pos = [1, 1]; turn = 0; rolling = false;
  for (let n = 1; n <= CONFIG.squares; n++) {
    const s = SPECIALS[n], p = spot(w, n), hue = s ? { boost: 'mint', slide: 'coral', again: 'grape' }[s.kind] : n === CONFIG.squares ? 'peach' : 'sky';
    w.spawn('tile', { x: p.x, y: p.y, size: 1.25, variant: O.num(n) + ':' + hue, z: 1 });
    if (s) w.spawn(s.art, { x: p.x + w.cell * 0.5, y: p.y - w.cell * 0.5, size: 0.85, z: 2 });
  }
  const end = spot(w, CONFIG.squares);
  w.spawn('trophy', { x: end.x, y: end.y - w.cell * 1.2, size: 1.1, z: 2, parts: [{ bob: { amp: 5 } }, { glow: { amount: 0.5 } }] });
  const p2 = w.spawn(Object.assign({}, who(1)), { x: 0, y: 0, tag: 'p2', size: 1, z: 4 });
  w.hero.size = w.cell;
  place(w, 0, 1); place(w, 1, 1); p2.look(w.hero);
  die = w.spawn('dice', { x: w.level.w / 2, y: spot(w, CONFIG.squares).y - w.cell * 2.7, size: 1.3, variant: '6', z: 5 });
  ui = { roll: O.ui.button(O.t('roll'), { kind: 'hot', big: true, icon: O.icon('play'), onPress: () => roll(w) }), turn: document.createElement('div') };
  ui.roll.classList.add('bd-roll'); ui.turn.className = 'bd-turn';
  O.ui.root().append(ui.roll, ui.turn);
  showTurn(w);
}
function place(w, i, n) { const p = spot(w, n), t = token(w, i); t.x = p.x + (i ? 0.32 : -0.32) * w.cell; t.y = p.y - w.cell * 0.45; }
function showTurn(w) {
  if (!ui) return;
  ui.turn.innerHTML = ''; ui.turn.append(O.ui.portrait(token(w, turn).spec, { size: 40 }), O.t('turn', { name: who(turn).name }));
  const bot = vsBot && turn === 1; ui.roll.disabled = bot;
  token(w, turn).state('wave'); token(w, 1 - turn).state('idle');
  if (bot) w.after(CONFIG.botDelay * 1000, () => roll(w));
}
async function hop(w, i, to) {
  const t = token(w, i), dir = to > pos[i] ? 1 : -1;
  while (pos[i] !== to && !w.ended) {
    pos[i] += dir; const p = spot(w, pos[i]);
    t.flip = p.x + (i ? 0.32 : -0.32) * w.cell < t.x; t.state('jump');
    await O.tween(t, { x: p.x + (i ? 0.32 : -0.32) * w.cell, y: p.y - w.cell * 0.45 }, { ms: CONFIG.stepMs, ease: 'quadOut' });
    t.squash(0.85, 120); O.sfx('step', { pitch: 1 + pos[i] * 0.01 });
  }
  t.state('idle');
}
async function roll(w) {
  if (rolling || w.ended || w.scene !== 'play' || w !== world) return;
  rolling = true; if (ui) ui.roll.disabled = true;
  const n = w.rand.int(1, 6), i = turn;
  for (let k = 0; k < 7; k++) { die.variant = String(w.rand.int(1, 6)); die.squash(1.1, 60); O.sfx('pop', { pitch: 0.8 + k * 0.05, volume: 0.4 }); await O.wait(70); }
  die.variant = String(n); die.pop(); O.ui.announce(O.num(n));
  await O.wait(250);
  await hop(w, i, Math.min(CONFIG.squares, pos[i] + n));
  if (i === 0) w.score(n * 10);
  let again = false;
  const s = SPECIALS[pos[i]];
  if (s && !w.ended) {
    O.ui.toast(O.t(s.kind));
    if (s.kind === 'again') { again = true; O.sfx('spark'); token(w, i).state('cheer'); }
    else {
      O.sfx(s.kind === 'boost' ? 'levelup' : 'whoosh'); const p = spot(w, s.to); pos[i] = s.to;
      w.stage.burst(s.kind === 'boost' ? 'sparkle' : 'dust', token(w, i).x, token(w, i).y, { n: 14 });
      await O.tween(token(w, i), { x: p.x + (i ? 0.32 : -0.32) * w.cell, y: p.y - w.cell * 0.45 }, { ms: 520, ease: 'cubicInOut' });
    }
  }
  if (w.ended) return;
  if (pos[i] >= CONFIG.squares) {
    token(w, i).state('cheer'); await w.say(token(w, i), O.t('wins', { name: who(i).name })); clear();
    if (vsBot && i === 1) w.lose({ say: O.t('wins', { name: who(1).name }) });
    else w.win(Object.assign({ stars: pos[1 - i] < CONFIG.squares / 2 ? 3 : 2 }, vsBot ? {} : { title: O.t('wins', { name: who(i).name }), who: token(w, i), submit: false }));
    return;
  }
  rolling = false;
  if (!again) turn = 1 - turn;
  showTurn(w);
}

const game = O.game({
  api: 1, title: CONFIG.title, subtitle: 'sub', biome: CONFIG.biome,
  controls: 'none', camera: 'fixed', hero: Object.assign({}, CONFIG.p1), countdown: 0,
  hud: ['score'],
  howTo: [{ icon: 'tap', text: 'how1' }, { icon: 'next', text: 'how2' }, { icon: 'trophy', text: 'how3' }],
  strings: WORDS,
  level: O.level.grid(SET),
  async intro() {
    vsBot = (await O.ui.dialog({ title: O.t('who'), buttons: [{ label: O.t('robot'), kind: 'quiet', value: 1, icon: 'gamepad' }, { label: O.t('two'), kind: 'hot', value: 2, icon: 'user' }] })) === 1;
  },
  setup: clear,
  update: frame,
  on: { start: build, results: clear, lose: clear },
});
</script>
