<title>Zippy Dash</title>
<div id="game"></div>
<!--KIT-->
<!--PACK:dress-->
<script>
// Endless Runner, on the Oomba Kit: one Oomba.game call. The hero runs by itself; the player jumps (tap, Space or the
// jump button) over spikes, gaps and bees, grabs sparks and coins, and races to the flag. Level 1 is drawn below, one
// character per cell; levels 2 and 3 are made by Oomba.level.generate and get harder. The kit does the physics, the
// juice, the HUD, pause, results and every screen.
'use strict';
const CONFIG = {
  title: 'Zippy Dash',
  hero: { species: 'fox', wear: ['scarf'] },
  biome: 'meadow',
  autoRun: true,
  controls: 'platformer:kid-easy',
  lives: 3,
  roundSeconds: 120,
  level2: 0.4,
  level3: 0.7,
  levelLength: 90,
};
const WORDS = {
  en: { sub: 'Jump the bumps, grab the sparks and reach the flag!', run: 'You run all by yourself!', jump: 'Tap, or press Space, to jump', goal: 'Grab the sparks and reach the flag!' },
  es: { sub: '¡Salta los obstáculos, atrapa las chispas y llega a la bandera!', run: '¡Corres tú solito!', jump: 'Toca la pantalla o pulsa Espacio para saltar', goal: '¡Atrapa las chispas y llega a la bandera!' },
  fr: { sub: 'Saute les bosses, attrape les étincelles et file jusqu’au drapeau !', run: 'Tu cours tout seul !', jump: 'Touche l’écran ou appuie sur Espace pour sauter', goal: 'Attrape les étincelles et atteins le drapeau !' },
  de: { sub: 'Spring über Hindernisse, sammle Funken und lauf zur Flagge!', run: 'Du rennst ganz von allein!', jump: 'Tippe oder drück die Leertaste zum Springen', goal: 'Sammle Funken und erreiche die Flagge!' },
  it: { sub: 'Salta gli ostacoli, prendi le scintille e arriva alla bandiera!', run: 'Corri da solo!', jump: 'Tocca o premi Spazio per saltare', goal: 'Prendi le scintille e raggiungi la bandiera!' },
  pt: { sub: 'Pule os obstáculos, pegue as faíscas e chegue à bandeira!', run: 'Você corre sozinho!', jump: 'Toque ou aperte Espaço para pular', goal: 'Pegue as faíscas e chegue à bandeira!' },
  nl: { sub: 'Spring over de hobbels, pak de vonkjes en ren naar de vlag!', run: 'Je rent helemaal vanzelf!', jump: 'Tik, of druk op de spatiebalk, om te springen', goal: 'Pak de vonkjes en haal de vlag!' },
  ru: { sub: 'Перепрыгивай препятствия, собирай искорки и беги к флажку!', run: 'Ты бежишь сам!', jump: 'Нажми на экран или пробел, чтобы прыгнуть', goal: 'Собирай искорки и добеги до флажка!' },
  he: { sub: 'קפצו מעל המכשולים, אספו ניצוצות והגיעו לדגל!', run: 'אתם רצים לבד!', jump: 'הקישו או לחצו על רווח כדי לקפוץ', goal: 'אספו ניצוצות והגיעו לדגל!' },
  ar: { sub: 'اقفز فوق العقبات، واجمع الشرارات، واصل إلى العلم!', run: 'أنت تركض وحدك!', jump: 'انقر أو اضغط المسافة لتقفز', goal: 'اجمع الشرارات وصل إلى العلم!' },
  ja: { sub: 'でこぼこを とびこえて、ひかりを あつめて、はたまで はしろう！', run: 'じぶんで はしるよ！', jump: 'タップか スペースで ジャンプ', goal: 'ひかりを あつめて はたへ！' },
  'zh-Hant': { sub: '跳過障礙，收集星光，衝向旗子！', run: '你會自己往前跑！', jump: '點一下或按空白鍵跳躍', goal: '收集星光，跑到旗子那裡！' },
};
// Level 1, one character per cell: P start, # ground, = ledge, $ spark, o coin, ^ spikes, B bee, S spring, K checkpoint,
// H heart, G flag. The gaps in the ground are holes to jump over.
const LEVEL = [
  '                                                                                ',
  '                                                                                ',
  '                                  $$$                                           ',
  '                                             B                                  ',
  '           $$$   $$$$    $$$$$                    $$   $$$$$           $        ',
  '                         =====                                                  ',
  '  P   o o o ^                    S      K   o  o  ^^          o o oH   ^    G   ',
  '##################  ####################################   #####################',
  '##################  ####################################   #####################',
];

const O = window.Oomba;
let rest = 0;   // seconds the hero waits after a bump before running on
const game = O.game({
  api: 1, title: CONFIG.title, subtitle: 'sub', biome: CONFIG.biome, hero: CONFIG.hero,
  controls: CONFIG.controls,
  hud: ['score', 'lives:' + CONFIG.lives, 'timer:' + CONFIG.roundSeconds, 'progress'],
  howTo: [{ icon: 'move', text: 'run' }, { icon: 'jump', text: 'jump' }, { icon: 'flag', text: 'goal' }],
  strings: WORDS,
  level: [
    O.level.grid(LEVEL),
    O.level.generate({ seed: 21, length: CONFIG.levelLength, difficulty: CONFIG.level2 }),
    O.level.generate({ seed: 34, length: CONFIG.levelLength, difficulty: CONFIG.level3 }),
  ],
  setup() { rest = 0; },
  update(w, dt) {
    // auto-run: keep "right" pressed while playing (the arrows still steer); after a bump, wait a moment first
    rest = Math.max(0, rest - dt);
    if (CONFIG.autoRun && w.scene === 'play' && !w.busy && !rest && !O.input.down('right')) O.input.hold('right', 400);
  },
  on: { hit() { rest = 1.2; } },
});
// a tap anywhere on the world jumps (the touch jump button and Space work too)
O.input.on('tap', () => { if (game.state === 'play') O.input.hold('jump', 220); });
</script>
