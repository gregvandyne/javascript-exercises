<title>Fruit Catch</title>
<div id="game"></div>
<!--KIT-->
<!--PACK:dress-->
<!--PACK:art-school-->
<script>
// Catch the Falling Things, on the Oomba Kit: one Oomba.game call. The kit does the hero, the controls (keys, stick,
// jump button), the catching (a pickup magnet), getting hurt, the HUD, pause, results and every screen. This file only
// drops things from the sky and makes it a little faster as the minute goes by.
'use strict';
const CONFIG = {
  title: 'Fruit Catch',
  hero: { species: 'bunny' },
  biome: 'meadow',
  good: ['apple', 'banana', 'grapes', 'melon', 'cupcake', 'carrot'],
  bad: ['rock', 'spikeball'],
  extraLife: 'heart',
  powerUp: 'gem',
  points: 10,
  powerPoints: 30,
  lives: 3,
  roundSeconds: 60,
  startFall: 3,
  endFall: 7,
  startEvery: 1,
  endEvery: 0.45,
  startBad: 0.18,
  endBad: 0.38,
  stars: [150, 300, 450],
};
// The words players read, in the site's languages (Oomba.t picks the player's; English when one is missing).
const WORDS = {
  en: { sub: 'Catch the yummy food before time runs out!', move: 'Run with the arrows or the stick. Jump with Space!', catch: 'Catch fruit and treats for points', dodge: 'Dodge the rocks!', big: 'Super catcher!' },
  es: { sub: '¡Atrapa la comida rica antes de que se acabe el tiempo!', move: 'Corre con las flechas o el joystick. ¡Salta con Espacio!', catch: 'Atrapa frutas y golosinas para ganar puntos', dodge: '¡Esquiva las rocas!', big: '¡Súper atrapador!' },
  fr: { sub: 'Attrape la bonne nourriture avant la fin du temps !', move: 'Cours avec les flèches ou le joystick. Saute avec Espace !', catch: 'Attrape fruits et friandises pour gagner des points', dodge: 'Évite les cailloux !', big: 'Super attrapeur !' },
  de: { sub: 'Fang das leckere Essen, bevor die Zeit um ist!', move: 'Lauf mit den Pfeilen oder dem Stick. Spring mit der Leertaste!', catch: 'Fang Obst und Leckereien für Punkte', dodge: 'Weich den Steinen aus!', big: 'Super-Fänger!' },
  it: { sub: 'Prendi il cibo buono prima che finisca il tempo!', move: 'Corri con le frecce o la levetta. Salta con Spazio!', catch: 'Prendi frutta e dolcetti per fare punti', dodge: 'Schiva i sassi!', big: 'Super acchiappa!' },
  pt: { sub: 'Pegue a comida gostosa antes que o tempo acabe!', move: 'Corra com as setas ou o controle. Pule com Espaço!', catch: 'Pegue frutas e doces para ganhar pontos', dodge: 'Desvie das pedras!', big: 'Super pegador!' },
  nl: { sub: 'Vang het lekkere eten voordat de tijd op is!', move: 'Ren met de pijltjes of de stick. Spring met de spatiebalk!', catch: 'Vang fruit en snoepjes voor punten', dodge: 'Ontwijk de stenen!', big: 'Supervanger!' },
  ru: { sub: 'Лови вкусную еду, пока не кончилось время!', move: 'Беги стрелками или джойстиком. Прыгай пробелом!', catch: 'Лови фрукты и сладости, чтобы получить очки', dodge: 'Уворачивайся от камней!', big: 'Супер-ловец!' },
  he: { sub: 'תפסו את האוכל הטעים לפני שהזמן נגמר!', move: 'רוצו עם החצים או הג׳ויסטיק. קפצו עם רווח!', catch: 'תפסו פירות וממתקים כדי לקבל נקודות', dodge: 'התחמקו מהאבנים!', big: 'תופס־על!' },
  ar: { sub: 'التقط الطعام اللذيذ قبل أن ينتهي الوقت!', move: 'اركض بالأسهم أو بعصا التحكم. اقفز بالمسافة!', catch: 'التقط الفواكه والحلوى لتربح النقاط', dodge: 'تجنّب الصخور!', big: 'ملتقط خارق!' },
  ja: { sub: 'じかんが なくなる まえに おいしい たべものを キャッチしよう！', move: 'やじるしか スティックで はしろう。スペースで ジャンプ！', catch: 'くだものや おやつを キャッチして ポイント', dodge: 'いしを よけよう！', big: 'スーパーキャッチ！' },
  'zh-Hant': { sub: '在時間用完前接住好吃的食物！', move: '用方向鍵或搖桿跑，按空白鍵跳！', catch: '接住水果和點心得分', dodge: '躲開石頭！', big: '超級接手！' },
};
// The field: one character per cell (P = where the hero starts, # = ground).
const FIELD = [
  '                        ',
  '                        ',
  '                        ',
  '                        ',
  '                        ',
  '                        ',
  '                        ',
  '                        ',
  '           P            ',
  '########################',
  '########################',
];

const O = window.Oomba;
const lerp = (a, b, k) => a + (b - a) * k;
let clock = 0, wait = 0;

function drop(w, k) {
  const r = w.rand, c = w.cell, S = w.stage;
  const x = r.range(Math.max(c, S.viewX(0.08)), Math.min(w.level.w - c, S.viewX(0.92))), y = S.viewY(0) - c;
  const roll = r.float();
  let e;
  if (roll < lerp(CONFIG.startBad, CONFIG.endBad, k)) e = w.spawn(r.pick(CONFIG.bad), { x, y, size: 1.2, parts: ['hazard'], tag: 'drop' });
  else if (roll > 0.975) e = w.spawn(CONFIG.extraLife, { x, y, size: 0.8, parts: [{ collectible: { heal: 1, value: 0, count: false } }], tag: 'drop' });
  else if (roll > 0.95) { e = w.spawn(CONFIG.powerUp, { x, y, size: 0.8, parts: [{ collectible: { value: CONFIG.powerPoints } }, { glow: { amount: 0.6 } }], tag: 'drop' }); e.power = true; }
  else e = w.spawn(r.pick(CONFIG.good), { x, y, size: 1.2, parts: [{ collectible: { value: CONFIG.points } }], tag: 'drop' });
  e.fall = lerp(CONFIG.startFall, CONFIG.endFall, k) * c * r.range(0.85, 1.15);
}

const game = O.game({
  api: 1, title: CONFIG.title, subtitle: 'sub', biome: CONFIG.biome, hero: CONFIG.hero,
  controls: 'platformer:snappy',
  hud: ['score', 'lives:' + CONFIG.lives, 'timer:' + CONFIG.roundSeconds, 'combo'],
  howTo: [{ icon: 'move', text: 'move' }, { icon: 'spark', text: 'catch' }, { icon: 'heart', text: 'dodge' }],
  strings: WORDS,
  level: O.level.grid(FIELD),
  stars: w => CONFIG.stars.filter(s => w.points >= s).length,
  setup() { clock = 0; wait = 0.8; },
  update(w, dt) {
    if (w.scene !== 'play' || w.busy) return;
    clock += dt; wait -= dt;
    const k = Math.min(1, clock / CONFIG.roundSeconds);
    if (wait <= 0) { wait = lerp(CONFIG.startEvery, CONFIG.endEvery, k); drop(w, k); }
    const floor = w.level.h - 2 * w.cell;
    for (const e of w.all('drop')) { e.y += e.fall * dt; if (e.y > floor - e.size * 0.3) e.remove('puff'); }
  },
  on: {
    hit(w, by) { if (by) by.remove('puff'); },
    collect(w, item) {
      if (!item.power) return;
      O.ui.toast(O.t('big'));
      w.hero.size *= 1.3; w.hero.pop();
      w.after(6000, () => { w.hero.size /= 1.3; });
    },
    timeup(w) { w.win(); return false; },   // the round ends on time: results, with stars from the score
  },
});
</script>
