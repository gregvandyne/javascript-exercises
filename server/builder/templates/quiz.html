<script>
// Quiz Show, on the Oomba Kit: one Oomba.game call with no running about (controls: 'none'). A host asks ten
// questions with the kit's quiz card (a hint and a second go after a miss, the right answer shown after the last
// miss), says a fun fact after each one, and cheers. Fast answers and streaks earn bonus points.
'use strict';
const CONFIG = {
  title: 'Animal Quiz Show',

  biome: 'forest',

  pointsRight: 100,
  speedBonus: 50,
  fastSeconds: 6,
  streakBonus: 25,

// The questions, one list per language (the player's language, else English). a is the right answer (it must be one
// of the choices; they are shuffled). art (optional) is a kit character or prop shown next to the host. Write them in
// the builder's language first; add the other languages you know (same order, same art). This one has English,
// Spanish and French; other players get the English list.

    { q: 'Which bird cannot fly but is a super swimmer?', a: 'Penguin', choices: ['Penguin', 'Parrot', 'Owl', 'Eagle'], fact: 'Penguins use their wings like flippers.', art: 'penguin' },
    { q: 'What is a baby frog called?', a: 'Tadpole', choices: ['Tadpole', 'Kitten', 'Cub', 'Chick'], fact: 'Tadpoles live in water and grow legs later.', art: 'frog' },
    { q: 'Which animal has a long neck for treetop leaves?', a: 'Giraffe', choices: ['Giraffe', 'Zebra', 'Lion', 'Camel'], fact: 'A giraffe tongue can be as long as your arm!' },
    { q: 'Where does a baby kangaroo ride?', a: 'In a pouch', choices: ['In a pouch', 'In a nest', 'In a cave', 'Up a tree'], fact: 'A baby kangaroo is called a joey.' },
    { q: 'Which animal can change colour to hide?', a: 'Chameleon', choices: ['Chameleon', 'Rabbit', 'Cow', 'Duck'], fact: 'Chameleons also change colour when they feel cold or excited.' },
    { q: 'What do pandas love to munch?', a: 'Bamboo', choices: ['Bamboo', 'Pizza', 'Fish', 'Carrots'], fact: 'Pandas munch bamboo for about 12 hours a day!' },
    { q: 'How do fish breathe underwater?', a: 'With gills', choices: ['With gills', 'With a snorkel', 'They hold their breath', 'With a straw'], fact: 'Gills take oxygen out of the water.' },
    { q: 'Which animal sleeps hanging upside down?', a: 'Bat', choices: ['Bat', 'Dog', 'Horse', 'Duck'], fact: 'Bats hang by their feet to rest.' },

    { q: '¿Cuál es el animal más grande del mundo?', a: 'Ballena azul', choices: ['Ballena azul', 'Elefante', 'Jirafa', 'Hipopótamo'], fact: '¡Una ballena azul es tan larga como tres autobuses escolares!' },
    { q: '¿Cuántas patas tiene una araña?', a: '8', choices: ['8', '6', '10', '4'], fact: 'Las arañas tienen 8 patas. Los insectos tienen 6.' },

    { q: '¿Qué ave no puede volar pero nada genial?', a: 'Pingüino', choices: ['Pingüino', 'Loro', 'Búho', 'Águila'], fact: 'Los pingüinos usan las alas como aletas.', art: 'penguin' },
    { q: '¿Cómo se llama la cría de la rana?', a: 'Renacuajo', choices: ['Renacuajo', 'Gatito', 'Cachorro', 'Pollito'], fact: 'Los renacuajos viven en el agua y luego les salen patas.', art: 'frog' },

    { q: '¿Dónde viaja la cría del canguro?', a: 'En una bolsa', choices: ['En una bolsa', 'En un nido', 'En una cueva', 'En un árbol'], fact: 'La cría del canguro se llama joey.' },
    { q: '¿Qué animal cambia de color para esconderse?', a: 'Camaleón', choices: ['Camaleón', 'Conejo', 'Vaca', 'Pato'], fact: 'Los camaleones también cambian de color con el frío o la emoción.' },
    { q: '¿Qué les encanta comer a los pandas?', a: 'Bambú', choices: ['Bambú', 'Pizza', 'Pescado', 'Zanahorias'], fact: '¡Los pandas comen bambú unas 12 horas al día!' },
    { q: '¿Cómo respiran los peces bajo el agua?', a: 'Con branquias', choices: ['Con branquias', 'Con un tubo de buceo', 'Aguantan la respiración', 'Con una pajita'], fact: 'Las branquias sacan el oxígeno del agua.' },
    { q: '¿Qué animal duerme colgado boca abajo?', a: 'Murciélago', choices: ['Murciélago', 'Perro', 'Caballo', 'Pato'], fact: 'Los murciélagos se cuelgan de las patas para descansar.' },
    { q: '¿En qué se convierte una oruga?', a: 'En mariposa', choices: ['En mariposa', 'En rana', 'En pájaro', 'En caracol'], fact: 'Dentro del capullo, la oruga cambia de forma por completo.' },
  ],
  fr: [
    { q: 'Quel est le plus grand animal du monde ?', a: 'La baleine bleue', choices: ['La baleine bleue', 'L’éléphant', 'La girafe', 'L’hippopotame'], fact: 'Une baleine bleue est aussi longue que trois bus scolaires !' },
    { q: 'Combien de pattes a une araignée ?', a: '8', choices: ['8', '6', '10', '4'], fact: 'Les araignées ont 8 pattes. Les insectes en ont 6.' },
    { q: 'Que fabriquent les abeilles ?', a: 'Du miel', choices: ['Du miel', 'Du lait', 'De la confiture', 'Du pain'], fact: 'Les abeilles font du miel avec le nectar des fleurs.', art: 'bee' },
    { q: 'Quel oiseau ne vole pas mais nage très bien ?', a: 'Le manchot', choices: ['Le manchot', 'Le perroquet', 'La chouette', 'L’aigle'], fact: 'Les manchots nagent avec leurs ailes comme des nageoires.', art: 'penguin' },
    { q: 'Comment s’appelle le bébé de la grenouille ?', a: 'Le têtard', choices: ['Le têtard', 'Le chaton', 'Le lionceau', 'Le poussin'], fact: 'Les têtards vivent dans l’eau et ont des pattes plus tard.', art: 'frog' },
    { q: 'Quel animal a un long cou pour manger en haut des arbres ?', a: 'La girafe', choices: ['La girafe', 'Le zèbre', 'Le lion', 'Le chameau'], fact: 'La langue d’une girafe peut être aussi longue que ton bras !' },
    { q: 'Où voyage le bébé kangourou ?', a: 'Dans une poche', choices: ['Dans une poche', 'Dans un nid', 'Dans une grotte', 'Dans un arbre'], fact: 'Le bébé kangourou s’appelle un joey.' },
    { q: 'Quel animal change de couleur pour se cacher ?', a: 'Le caméléon', choices: ['Le caméléon', 'Le lapin', 'La vache', 'Le canard'], fact: 'Les caméléons changent aussi de couleur quand ils ont froid ou sont excités.' },
    { q: 'Qu’est-ce que les pandas adorent manger ?', a: 'Du bambou', choices: ['Du bambou', 'De la pizza', 'Du poisson', 'Des carottes'], fact: 'Les pandas mangent du bambou environ 12 heures par jour !' },
    { q: 'Comment les poissons respirent-ils sous l’eau ?', a: 'Avec des branchies', choices: ['Avec des branchies', 'Avec un tuba', 'Ils retiennent leur souffle', 'Avec une paille'], fact: 'Les branchies prennent l’oxygène dans l’eau.' },
    { q: 'Quel animal dort la tête en bas ?', a: 'La chauve-souris', choices: ['La chauve-souris', 'Le chien', 'Le cheval', 'Le canard'], fact: 'Les chauves-souris se suspendent par les pattes pour se reposer.' },
    { q: 'En quoi se transforme une chenille ?', a: 'En papillon', choices: ['En papillon', 'En grenouille', 'En oiseau', 'En escargot'], fact: 'Dans son cocon, la chenille change complètement de forme.' },
  ],
};
const WORDS = {
  en: { sub: 'Ten questions. Answer fast for bonus points!', look: 'Read the question', tap: 'Tap the right answer (or press 1 to 4)', learn: 'Learn a fun fact each time', hello: 'Hoot! Welcome to the quiz show!', qOf: 'Question {n} of {total}', streak: '{n} in a row!', more: 'Great try! Play again to get more right.' },
  es: { sub: 'Diez preguntas. ¡Responde rápido para ganar puntos extra!', look: 'Lee la pregunta', tap: 'Toca la respuesta correcta (o pulsa del 1 al 4)', learn: 'Aprende un dato curioso cada vez', hello: '¡Uhu! ¡Bienvenido al concurso!', qOf: 'Pregunta {n} de {total}', streak: '¡{n} seguidas!', more: '¡Buen intento! Juega otra vez para acertar más.' },
  fr: { sub: 'Dix questions. Réponds vite pour des points bonus !', look: 'Lis la question', tap: 'Touche la bonne réponse (ou appuie sur 1 à 4)', learn: 'Découvre une anecdote à chaque fois', hello: 'Hou hou ! Bienvenue au quiz !', qOf: 'Question {n} sur {total}', streak: '{n} d’affilée !', more: 'Bel essai ! Rejoue pour en réussir plus.' },
  de: { sub: 'Zehn Fragen. Antworte schnell für Bonuspunkte!', look: 'Lies die Frage', tap: 'Tippe auf die richtige Antwort (oder drück 1 bis 4)', learn: 'Lerne jedes Mal etwas Spannendes', hello: 'Huhu! Willkommen beim Quiz!', qOf: 'Frage {n} von {total}', streak: '{n} hintereinander!', more: 'Toll versucht! Spiel noch mal, um mehr richtig zu haben.' },
  it: { sub: 'Dieci domande. Rispondi in fretta per punti extra!', look: 'Leggi la domanda', tap: 'Tocca la risposta giusta (o premi da 1 a 4)', learn: 'Scopri una curiosità ogni volta', hello: 'Uh uh! Benvenuto al quiz!', qOf: 'Domanda {n} di {total}', streak: '{n} di fila!', more: 'Bel tentativo! Gioca ancora per indovinarne di più.' },
  pt: { sub: 'Dez perguntas. Responda rápido para ganhar pontos extras!', look: 'Leia a pergunta', tap: 'Toque na resposta certa (ou aperte de 1 a 4)', learn: 'Aprenda uma curiosidade a cada vez', hello: 'Uhu! Bem-vindo ao show de perguntas!', qOf: 'Pergunta {n} de {total}', streak: '{n} seguidas!', more: 'Boa tentativa! Jogue de novo para acertar mais.' },
  nl: { sub: 'Tien vragen. Antwoord snel voor bonuspunten!', look: 'Lees de vraag', tap: 'Tik op het goede antwoord (of druk op 1 tot 4)', learn: 'Leer elke keer een leuk weetje', hello: 'Oehoe! Welkom bij de quiz!', qOf: 'Vraag {n} van {total}', streak: '{n} op rij!', more: 'Goed geprobeerd! Speel nog eens om er meer goed te hebben.' },
  ru: { sub: 'Десять вопросов. Отвечай быстро — получишь бонус!', look: 'Прочитай вопрос', tap: 'Нажми на правильный ответ (или клавиши 1–4)', learn: 'Каждый раз узнавай интересный факт', hello: 'Ух-ух! Добро пожаловать на викторину!', qOf: 'Вопрос {n} из {total}', streak: '{n} подряд!', more: 'Хорошая попытка! Сыграй ещё, чтобы ответить лучше.' },
  he: { sub: 'עשר שאלות. ענו מהר וקבלו נקודות בונוס!', look: 'קראו את השאלה', tap: 'הקישו על התשובה הנכונה (או לחצו 1 עד 4)', learn: 'למדו עובדה מעניינת בכל פעם', hello: 'הוּ הוּ! ברוכים הבאים לחידון!', qOf: 'שאלה {n} מתוך {total}', streak: '{n} ברצף!', more: 'ניסיון יפה! שחקו שוב כדי לצדוק יותר.' },
  ar: { sub: 'عشرة أسئلة. أجب بسرعة لتربح نقاطاً إضافية!', look: 'اقرأ السؤال', tap: 'انقر على الإجابة الصحيحة (أو اضغط من 1 إلى 4)', learn: 'تعلّم معلومة ممتعة في كل مرة', hello: 'هوو! أهلاً بك في مسابقة الأسئلة!', qOf: 'السؤال {n} من {total}', streak: '{n} على التوالي!', more: 'محاولة رائعة! العب مرة أخرى لتصيب أكثر.' },
  ja: { sub: 'もんだいは 10もん。はやく こたえると ボーナス！', look: 'もんだいを よもう', tap: 'ただしい こたえを タップ（1〜4キーでも OK）', learn: 'まいかい おもしろい ことを しろう', hello: 'ホーホー！クイズショーへ ようこそ！', qOf: '{total}もん中 {n}もんめ', streak: '{n}もん れんぞく！', more: 'よく がんばったね！もう いちど ちょうせん しよう。' },
  'zh-Hant': { sub: '十個問題，答得快有額外加分！', look: '讀一讀問題', tap: '點選正確答案（或按 1 到 4）', learn: '每次都學到一個有趣知識', hello: '咕咕！歡迎來到問答秀！', qOf: '第 {n} 題，共 {total} 題', streak: '連對 {n} 題！', more: '很棒的嘗試！再玩一次，答對更多吧。' },
};
// The set: P is the player (their own avatar), N the host, A where a question's picture appears.
const SET = [
  '                              ',
  '                              ',
  '                              ',
  '                              ',
  '                              ',
  '            P  A  N           ',
  '##############################',
  '##############################',
];

const O = window.Oomba;
let art = null;
/** The middle of the set in view (12 cells wide), the ground near the bottom (on a phone the quiz card sits above). */
function frame(w) {
  // a close set: the cast big beside the card (10 cells across, 7 high; 4.6 across on a phone in portrait, where the
  // two step in toward the middle), with just a lip of soil under them
  const V = w.stage.view, C = w.cam, L = w.level, tall = V.vh > V.vw * 1.1, z = tall ? V.vw / (4.6 * w.cell) : Math.min(V.vw / (10 * w.cell), V.vh / (7 * w.cell));
  C.bounds(null); C.zoom = z; C.x = L.w / 2; C.y = L.h - w.cell * 1.4 - V.vh / z / 2;
  const host = w.find('host'); if (host && w.hero) { const d = (tall ? 1.25 : 3.5) * w.cell; host.x = L.w / 2 + d; w.hero.x = L.w / 2 - d; }
}
function showArt(w, name) {
  if (art) { art.remove('puff'); art = null; }
  if (name) { art = w.spawn(name, { at: 'A', size: 1.6 }); art.pop(); }
}
async function play(w) {
  const list = QUESTIONS[O.lang] || QUESTIONS[String(O.lang).split('-')[0]] || QUESTIONS.en;
  const host = w.find('host'), qs = w.rand.shuffle(list.slice()).slice(0, CONFIG.questionsPerRound);
  let right = 0, streak = 0;
  host.look(w.hero); w.hero.look(host);
  await w.say(host, 'hello');
  for (let i = 0; i < qs.length; i++) {
    if (w.ended) return;
    const q = qs[i];
    showArt(w, q.art);
    if (w.hud.count) w.hud.count.set(i + 1, qs.length); else O.ui.toast(O.t('qOf', { n: i + 1, total: qs.length }));
    host.state('think');
    const t0 = O.time.now;
    const ok = await w.ask({ q: q.q, a: q.a, choices: w.rand.shuffle(q.choices.slice()), hint: q.hint, tries: CONFIG.tries, who: host });
    if (w.ended) return;
    if (ok) {
      right++; streak++;
      const fast = Math.max(0, 1 - (O.time.now - t0) / (CONFIG.fastSeconds * 1000));
      const pts = CONFIG.pointsRight + Math.round(fast * CONFIG.speedBonus) + (streak - 1) * CONFIG.streakBonus;
      w.score(pts); host.float('+' + O.num(pts)); host.state('cheer'); w.hero.state('cheer');
      if (streak >= 3) O.ui.toast(O.t('streak', { n: streak }));
    } else { streak = 0; host.state('idle'); w.hero.state('think'); }
    if (q.fact) await w.say(host, q.fact);
    if (w.ended) return;
    w.hero.state('idle');
  }
  showArt(w, null);
  const stars = right >= qs.length ? 3 : right >= CONFIG.passMark + 2 ? 2 : 1;
  if (right >= CONFIG.passMark) w.win({ stars }); else w.lose({ say: 'more' });
}

const game = O.game({
  api: 1, title: CONFIG.title, subtitle: 'sub', biome: CONFIG.biome,
  controls: 'none', camera: 'fixed', heroSize: 2.1, hero: 'me', titleHero: O.char(CONFIG.host),
  hud: ['score', 'count:flag'],
  howTo: [{ icon: 'question', text: 'look' }, { icon: 'tap', text: 'tap' }, { icon: 'book', text: 'learn' }],
  strings: WORDS,
  level: O.level.grid(SET, { N: Object.assign({ kind: 'npc', tag: 'host', flip: true, size: 2.3 }, CONFIG.host), A: 'cloud' }),
  setup(w) { art = null; const a = w.find('cloud'); if (a) a.remove(null); },
  update: frame,
  on: { start: play },
});
</script>
