/* Layout: one full-screen 3D canvas, the touch controls (joystick + jump) and the tip. The title, how-to, HUD, pause and
   results screens are the Oomba Kit's (Oomba.ui), so they match every other Oomba game and speak all 13 languages. */
:root{--is-ink:currentColor}   /* the --is-* colours and font come from the kit (see "Kit colours" in the module) */
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--is-sky);touch-action:none;user-select:none;-webkit-user-select:none}
body{margin:0;font-family:var(--is-font);color:var(--is-ink)}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font-family:inherit;cursor:pointer}
#stickBase{position:fixed;width:132px;height:132px;border-radius:50%;background:rgba(255,253,242,.3);border:3px solid var(--is-ink);display:none;z-index:6;pointer-events:none;transform:translate(-50%,-50%)}
#stickKnob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:var(--is-go);border:3px solid var(--is-ink);box-shadow:0 3px 0 var(--is-go-shade)}
#stickHint{position:fixed;left:24px;right:130px;bottom:max(26px,env(safe-area-inset-bottom));z-index:6;pointer-events:none;color:var(--is-card);font:800 15px var(--is-font);text-shadow:0 2px 4px rgba(0,0,0,.45);display:none}
#jumpBtn{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:92px;height:92px;border-radius:50%;border:3px solid var(--is-ink);font:900 17px var(--is-font);color:var(--is-ink);background:var(--is-go);box-shadow:0 6px 0 var(--is-ink);z-index:6;display:none;touch-action:none;padding:0 6px;overflow:hidden}
#jumpBtn:active,#jumpBtn.down{transform:translateY(4px);box-shadow:0 2px 0 var(--is-ink)}
body.touch.playing #jumpBtn,body.touch.playing #stickHint{display:block}
.tip{position:fixed;left:50%;top:max(78px,calc(env(safe-area-inset-top) + 68px));transform:translateX(-50%);z-index:5;background:var(--is-card);color:var(--is-ink);border:2px solid var(--is-ink);border-radius:999px;padding:10px 18px;font:800 16px/1.3 var(--is-font);text-align:center;width:max-content;max-width:calc(100% - 32px);pointer-events:none;box-shadow:0 4px 0 var(--is-ink)}
.pop{position:fixed;z-index:7;pointer-events:none;font:900 28px var(--is-font);color:var(--is-reward);-webkit-text-stroke:2px var(--is-ink);text-shadow:0 3px 0 var(--is-ink);animation:pop .9s ease-out forwards}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6)}30%{transform:translate(-50%,-90%) scale(1.25)}to{transform:translate(-50%,-170%) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.pop{animation:fade 1s linear forwards;transform:translate(-50%,-50%)}}
@keyframes fade{to{opacity:0}}
</style>

<div class="tip" id="tip" hidden></div>

  // the worst frame is over a second, or far longer than this window's typical frame. A device that just
  // runs slowly (every frame ~200 ms) must not be mistaken for a pause, or it never steps down.
  const paused = worstMs > 1000 || worstMs > avgMs * 4;
  perf.t0 = now; perf.n = 0; perf.worst = 0;
  S.fps = fps;   // report every window (even skipped ones), so state().fps is never 0 while playing
  if (S.screen === 'pause' || S.screen === 'end') return;
  perf.history.push([S.quality, fps]); if (perf.history.length > 20) perf.history.shift();
  if (perf.skip > 0) { perf.skip--; return; }                         // the first seconds compile shaders
  // Step down on a slow window. Ignore a one-off stall, unless the device is clearly struggling (under ~20 fps).
  if (S.quality < LEVELS.length - 1 && (fps < 20 || (fps < 45 && !paused))) { setQuality(S.quality + 1); perf.skip = 1; }
}

/* ===== Camera ===== */
const camPos = new THREE.Vector3(), lookAt = new THREE.Vector3();

/* ===== The game loop ===== */
const tmp = new THREE.Vector3();
let last = 0, clock = 0;
function frame(now) {
  const raw = last ? (now - last) / 1000 : 0.016, dt = Math.min(0.05, raw); last = now; clock += dt;
  watchFps(now, raw); S.frames++;
  if (S.lost) return;
  if (S.screen === 'play' && !Oomba.time.paused) step(dt);
  animateWorld(dt);
  if (S.screen === 'title') {   // a slow orbit on the title screen (a still view with reduced motion)
    const a = REDUCED ? 0.6 : clock * 0.12;
    camera.position.set(Math.sin(a) * 26, 13, Math.cos(a) * 26); camera.lookAt(0, 1, 0);
  } else {                      // follow the hero smoothly; never shake or roll
    tmp.copy(hero.pos).add(camOffset);
    camPos.lerp(tmp, damp(dt, 4));
    camera.position.copy(camPos);
    lookAt.lerp(tmp.set(hero.pos.x + hero.vel.x * 0.15, hero.pos.y + 1, hero.pos.z - 1.5 + hero.vel.z * 0.15), damp(dt, 6));
    camera.lookAt(lookAt);
  }
  fadeTrees(dt);
  const focus = S.screen === 'title' ? tmp.set(0, 0, 0) : hero.pos;
  sun.target.position.copy(focus); sun.position.copy(focus).add(SUN_OFFSET);
  B.update(dt);
  renderer.render(scene, camera);
}

// Trees standing between the camera and the hero shrink away so the hero is never hidden.
const segA = new THREE.Vector3(), segB = new THREE.Vector3(), closest = new THREE.Vector3(), line = new THREE.Line3(), tm = new THREE.Matrix4(), ts = new THREE.Vector3();
function fadeTrees(dt) {
  if (!crownData.length || S.screen === 'title') return;
  segA.copy(camera.position); segB.set(hero.pos.x, hero.pos.y + 0.6, hero.pos.z); line.set(segA, segB);
  let changed = false;
  crownData.forEach((c, i) => {
    line.closestPointToPoint(c.pos, true, closest);
    const inWay = closest.distanceTo(c.pos) < 1.3 * c.k + 0.5 && closest.distanceToSquared(segB) > 0.5;
    const want = inWay ? 0.12 : 1, f = c.fade + (want - c.fade) * damp(dt, REDUCED ? 30 : 10);
    if (Math.abs(f - c.fade) > 0.002) { c.fade = f; changed = true; crowns.setMatrixAt(i, tm.compose(c.pos, c.q, ts.set(c.k * 1.05 * f, c.k * 1.15 * f, c.k * 1.05 * f))); trunks.setMatrixAt(i, tm.compose(c.trunkPos, c.q, ts.set(c.k, c.k * f, c.k))); }
  });
  if (changed) { crowns.instanceMatrix.needsUpdate = true; trunks.instanceMatrix.needsUpdate = true; }
}

/* ===== Moving the hero: walk, bump around trees and rocks, jump, land on the ground or a floating rock ===== */
const HEAD = 1.2;
/** The highest thing under (x, z) the hero can stand on, coming from height y. */
function supportAt(x, z, y) {
  let g = heightAt(x, z);
  for (const p of plats) if ((x - p.x) ** 2 + (z - p.z) ** 2 < p.r * p.r && p.top <= y + 0.35 && p.top > g) g = p.top;
  return g;
}
const offLand = (x, z) => heightAt(x, z) < 0.08 || Math.hypot(x, z) > R * 0.93;
function step(dt) {
  S.timeLeft = hud ? hud.timer.left : 0;
  const inp = inputVector();
  hero.vel.x += (inp.x * CONFIG.speed - hero.vel.x) * damp(dt, 10);
  hero.vel.z += (inp.z * CONFIG.speed - hero.vel.z) * damp(dt, 10);
  let nx = hero.pos.x + hero.vel.x * dt, nz = hero.pos.z + hero.vel.z * dt;
  if (hero.pos.y < 0.6 && offLand(nx, nz)) { if (!offLand(nx, hero.pos.z)) nz = hero.pos.z; else if (!offLand(hero.pos.x, nz)) nx = hero.pos.x; else { nx = hero.pos.x; nz = hero.pos.z; } }
  if (Math.hypot(nx, nz) > R * 0.93) { const k = R * 0.93 / Math.hypot(nx, nz); nx *= k; nz *= k; }
  for (const o of obstacles) {   // trunks and rocks
    if (hero.pos.y > heightAt(o.x, o.z) + 1.4) continue;
    const dx = nx - o.x, dz = nz - o.z, d = Math.hypot(dx, dz);
    if (d < o.r && d > 0.0001) { nx = o.x + dx / d * o.r; nz = o.z + dz / d * o.r; }
  }
  for (const p of plats) {       // the sides of the floating rocks are solid; their bottoms bump heads
    const dx = nx - p.x, dz = nz - p.z, d = Math.hypot(dx, dz), y = hero.pos.y;
    if (d < p.r + 0.3 && y < p.top - 0.35 && y + HEAD > p.bottom && d > 0.0001) {
      if (hero.vy > 0 && y + HEAD - hero.vy * dt <= p.bottom + 0.05 && d < p.r) { hero.vy = 0; }
      else { nx = p.x + dx / d * (p.r + 0.3); nz = p.z + dz / d * (p.r + 0.3); }
    }
  }
  hero.pos.x = nx; hero.pos.z = nz;
  if (jumpQueued && hero.onGround) { hero.vy = CONFIG.jump; hero.onGround = false; hero.squashV = -6; BRB.sfx.play('jump'); }
  jumpQueued = false;
  let ground = supportAt(nx, nz, hero.pos.y);
  if (hero.onGround && ground < hero.pos.y - 0.35) hero.onGround = false;   // walked off an edge
  if (!hero.onGround) {
    const before = hero.pos.y;
    hero.vy -= CONFIG.gravity * dt; hero.pos.y += hero.vy * dt;
    ground = supportAt(nx, nz, before);
    if (hero.pos.y <= ground) { hero.pos.y = ground; hero.onGround = true; hero.squashV = 5 + Math.min(6, -hero.vy * 0.4); hero.vy = 0; if (hero.rig) hero.rig.play('land'); }
  } else hero.pos.y = ground;
  // Stars
  const centre = tmp.set(hero.pos.x, hero.pos.y + 0.62, hero.pos.z);
  for (const st of stars) {
    if (st.taken || st.mesh.position.distanceTo(centre) > 1.15) continue;
    st.taken = true; st.mesh.visible = st.glow.visible = false; S.got++;
    burst(st.mesh.position); popText(st.mesh.position, '+1'); BRB.sfx.play('coin');
    updateHud();
    if (S.got >= stars.length) { BRB.score.submit(S.got * 100 + Math.ceil(S.timeLeft) * 10); endGame(true); return; }
  }
}

function animateWorld(dt) {
  const speed = Math.hypot(hero.vel.x, hero.vel.z);
  // The hero: face the way we walk, waddle, bob, blink, squash and stretch (calmer with reduced motion).
  if (speed > 0.3) { const want = Math.atan2(hero.vel.x, hero.vel.z); let d = want - hero.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); hero.yaw += d * damp(dt, 12); }
  hero.walk += dt * (speed > 0.3 && hero.onGround ? speed * 2.2 : 0);
  const sw = Math.sin(hero.walk * 2);
  if (hero.feet.length) { hero.feet[0].position.z = 0.05 + sw * 0.14 * Math.min(1, speed / 3); hero.feet[1].position.z = 0.05 - sw * 0.14 * Math.min(1, speed / 3); }
  hero.squashV += (-hero.squash * 120 - hero.squashV * 10) * dt; hero.squash += hero.squashV * dt;
  const sq = REDUCED ? 0 : clamp(hero.squash * 0.08, -0.25, 0.25);
  hero.body.scale.set(1 + sq, 1 - sq, 1 + sq);
  const bob = REDUCED ? 0 : (speed > 0.3 && hero.onGround ? Math.abs(Math.sin(hero.walk * 2)) * 0.07 : Math.sin(clock * 3) * 0.02);
  hero.body.position.y = 0.62 + hero.float + bob - sq * 0.3;
  hero.body.rotation.z = REDUCED ? 0 : sw * 0.06 * Math.min(1, speed / 3);
  if (hero.rig) { hero.rig.speed = hero.onGround ? clamp(speed / CONFIG.speed, 0, 1) : 0; hero.rig.air = !hero.onGround; }
  hero.blinkIn -= dt; const blink = hero.blinkIn < 0.12; if (hero.blinkIn < 0) hero.blinkIn = 2 + rnd() * 3;
  hero.eyes.forEach(e => { e.scale.y = blink ? 0.12 : 1; });
  hero.group.position.copy(hero.pos); hero.group.rotation.y = hero.yaw;
  hero.shade.position.set(hero.pos.x, supportAt(hero.pos.x, hero.pos.z, hero.pos.y) + 0.03, hero.pos.z);
  // Stars spin and bob; sparkles fly and fade; floating rocks drift a tiny bit.
  for (const st of stars) {
    if (st.taken) continue;
    st.mesh.rotation.y += dt * (REDUCED ? 0.5 : 2.2);
    st.mesh.position.y = st.base + (REDUCED ? 0 : Math.sin(clock * 2 + st.phase) * 0.15);
    st.glow.position.copy(st.mesh.position);
  }
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i], arr = b.pts.geometry.attributes.position.array; b.life += dt;
    b.vel.forEach((v, j) => { v.y -= 6 * dt; arr[j * 3] += v.x * dt; arr[j * 3 + 1] += v.y * dt; arr[j * 3 + 2] += v.z * dt; });
    b.pts.geometry.attributes.position.needsUpdate = true; b.pts.material.opacity = 1 - b.life / 0.8;
    if (b.life > 0.8) { scene.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); bursts.splice(i, 1); }
  }
  if (!REDUCED) {
    clouds.rotation.y += dt * 0.01; water.position.y = Math.sin(clock * 0.8) * 0.04;
    for (const p of plats) p.mesh.rotation.y += dt * 0.05;
    if (skyDots) skyDots.material.opacity = 0.75 + Math.sin(clock * 0.6) * 0.15;   // slow, gentle twinkle
  }
}

/* ===== Ready: show the island behind the title card and enable Play ===== */
buildStars();
// Oomba Ink: every material becomes the kit's toon shading; the hero is one mesh (eyes and feet apart) with Ink around it,
// and the trees, rocks and floating rocks get Ink too (on slow devices only the hero keeps it).
B.inkify(scene);
if (!hero.rig) { B.bake(hero.body); B.outline(hero.group, { important: true }); }
B.outline(trunks); B.outline(crowns); plats.forEach(p => B.outline(p.mesh));
setQuality(0);
renderer.setAnimationLoop(frame);
S.ready = true; window.__islandReady = true; window.__islandOnReady();

// Test hook used by the platform's playtests and cover pictures. start() begins play without the start tip or
// touch hint, so a cover picture shows the island and hero, not the "Hop up the floating rocks…" bubble.
function testStart() {
  direct = true; closeScreens(); startGame();
  if (tipTimer) tipTimer(); const tipEl = $('tip'); if (tipEl) tipEl.hidden = true;
  const sh = $('stickHint'); if (sh) sh.style.visibility = 'hidden';
}
window.__brbTest = {
  state() {
    return { screen: S.screen, ready: S.ready, stars: S.got, total: stars.length, platforms: plats.length, hero: HERO, timeLeft: Math.ceil(S.timeLeft),
      fps: S.fps, quality: S.quality, pixelRatio: renderer.getPixelRatio(), shadows: renderer.shadowMap.enabled, frames: S.frames,
      pos: { x: +hero.pos.x.toFixed(2), y: +hero.pos.y.toFixed(2), z: +hero.pos.z.toFixed(2) }, onGround: hero.onGround, reducedMotion: REDUCED,
      drawCalls: renderer.info.render.calls, triangles: renderer.info.render.triangles };
  },
  start() { testStart(); },
};
toTitle();
if (window.__islandStartWanted) testStart();
</script>
