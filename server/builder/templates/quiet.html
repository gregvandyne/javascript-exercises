<title>Quiet Stars</title>
<style>
/* Quiet Stars: a classroom noise meter for the board. A night sky fills with stars while the room is quiet. Big type
   (readable from the back of the room), keyboard and clicker keys, and it works as a calm quiet timer with no microphone. */
:root{--ink:#fffdf5;--soft:#d9e2ff;--card:#1d2552;--card2:#28316a;--edge:#0b0f2a;--hot:#ffd65c;--hot-ink:#2a2000;--good:#7ee0b5;--warn:#ffb37a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1030;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;inset-inline:0;top:0;display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 16px 10px;z-index:3}
.bar h1{flex:1;min-width:0;margin:0;font-size:clamp(1.2rem,3.4vmin,2.4rem);font-weight:800;text-shadow:0 2px 0 var(--edge);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;font-weight:800;min-height:48px;min-width:48px;padding:8px 18px;border-radius:16px;border:3px solid var(--edge);background:var(--card2);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--edge)}
button:active{transform:translateY(2px);box-shadow:0 2px 0 var(--edge)}
button:focus-visible{outline:4px solid var(--hot);outline-offset:3px}
button[aria-pressed="true"]{background:var(--hot);color:var(--hot-ink)}
.hot{background:var(--hot);color:var(--hot-ink)}
.small{min-height:44px;padding:6px 14px;font-size:clamp(.9rem,2vmin,1.2rem)}
.panel{position:fixed;inset:0;display:grid;place-items:center;padding:80px 16px 16px;z-index:2}
.panel[hidden],[hidden]{display:none!important}
.card{width:min(100%,760px);max-height:100%;overflow:auto;background:rgba(29,37,82,.94);border:4px solid var(--edge);border-radius:28px;padding:clamp(18px,4vmin,40px);text-align:center;box-shadow:0 10px 0 var(--edge)}
.card h2{margin:0 0 8px;font-size:clamp(1.8rem,6vmin,4rem);line-height:1.1}
.card p{margin:8px 0;font-size:clamp(1.05rem,2.8vmin,1.8rem);color:var(--soft)}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:16px 0}
.big{font-size:clamp(1.2rem,3.4vmin,2.2rem);min-height:64px;padding:10px 26px}
.privacy{font-weight:700;color:var(--ink)!important;background:var(--edge);border-radius:14px;padding:8px 14px}
.notice{color:var(--warn)!important;font-weight:800}
.hud{position:fixed;inset-inline:0;bottom:0;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 16px max(16px,env(safe-area-inset-bottom));z-index:2;pointer-events:none}
.hud>*{pointer-events:auto}
.clock{font-size:clamp(2.4rem,11vmin,8rem);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 4px 0 var(--edge)}
.goal{font-size:clamp(1rem,2.8vmin,1.8rem);color:var(--soft);font-weight:700}
.chip{display:inline-block;margin-top:6px;padding:6px 12px;border-radius:999px;background:var(--edge);font-weight:800;font-size:clamp(.9rem,2.2vmin,1.3rem)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.stars{font-size:clamp(1.4rem,5vmin,3.2rem);font-weight:900;text-shadow:0 3px 0 var(--edge)}
.gauge{width:clamp(180px,36vmin,420px);height:28px;border-radius:14px;background:var(--edge);position:relative;overflow:hidden;border:3px solid var(--edge)}
.gauge i{position:absolute;inset-block:0;inset-inline-start:0;width:0;background:var(--good);border-radius:10px;transition:width .1s linear}
.gauge.loud i{background:var(--warn)}
.gauge b{position:absolute;inset-block:-2px;width:4px;background:var(--ink)}
.zones{display:flex;justify-content:space-between;width:clamp(180px,36vmin,420px);font-weight:800;font-size:clamp(.85rem,2vmin,1.2rem);color:var(--soft)}
.shh{position:fixed;inset-inline:0;top:24%;text-align:center;font-size:clamp(2rem,9vmin,6rem);font-weight:900;text-shadow:0 5px 0 var(--edge);z-index:2;pointer-events:none}
.btns{display:flex;flex-wrap:wrap;gap:10px}
@media (prefers-reduced-motion:reduce){.gauge i{transition:none}}

<p class="shh" id="shh" hidden></p>

  </div>
</div>

<section class="panel" id="done" hidden>

    <h2 id="doneH"></h2>
    <p id="doneP"></p>
    <div class="row"><button class="big hot" id="again"></button><button class="big" id="change"></button></div>
  </div>
</section>

const B = window.BRB || {};
const LANG = (B.user && B.user.lang) || 'en';
const W = WORDS[LANG] || WORDS[String(LANG).split('-')[0]] || WORDS.en;
const tr = (k, v) => String(W[k] != null ? W[k] : WORDS.en[k]).replace(/\{(\w+)\}/g, (m, n) => (v && v[n] != null ? v[n] : m));
document.documentElement.lang = LANG; document.documentElement.dir = (B.user && B.user.dir) || 'ltr';
const $ = id => document.getElementById(id);
const sfx = name => { try { if (B.sfx) B.sfx.play(name); } catch (e) { /* no sound */ } };
const clock = s => { s = Math.max(0, Math.floor(s)); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };

// ---- the state ----------------------------------------------------------------------------------------------------
const LD = B.loudness || null;
let offDb = null;
const S = { screen: 'setup', mode: '', goal: CONFIG.goal, quiet: 0, stars: [], slots: [], loud: false, overFor: 0, underFor: 0, hold: 0,
  db: -100, smooth: -100, lastDb: 0, base: null, samples: [], calibUntil: 0, paused: false, notice: '' };
const line = () => (S.base == null ? -100 : S.base + CONFIG.loudBy);
const toPct = db => Math.max(0, Math.min(100, ((db + 70) / 60) * 100));   // -70 dBFS .. -10 dBFS -> 0 .. 100

// ---- the words on screen ------------------------------------------------------------------------------------------
function words() {
  document.title = CONFIG.title; $('title').textContent = CONFIG.title;
  $('sound').textContent = tr('sound'); $('full').textContent = tr('full');
  $('setupH').textContent = tr('setupH'); $('setupP').textContent = tr('setupP'); $('goalH').textContent = tr('goalH');
  $('privacy').textContent = tr('privacy'); $('listen').textContent = tr('listen'); $('timer').textContent = tr('timer'); $('keys').textContent = tr('keys');
  $('zQuiet').textContent = tr('zQuiet'); $('zLoud').textContent = tr('zLoud'); $('tooLoud').textContent = tr('tooLoud'); $('end').textContent = tr('end');
  $('again').textContent = tr('again'); $('change').textContent = tr('change'); $('shh').textContent = tr('shh');
  $('goals').setAttribute('aria-labelledby', 'goalH');
  $('goals').innerHTML = '';
  for (const g of CONFIG.goals) {
    const b = document.createElement('button'); b.className = 'big'; b.textContent = g ? tr('min', { n: g }) : tr('noGoal');
    b.setAttribute('aria-pressed', String(g === S.goal)); b.onclick = () => { S.goal = g; words(); sfx('click'); };
    $('goals').appendChild(b);
  }
  paintSound();
}
function paintSound() { $('sound').setAttribute('aria-pressed', String(!(B.sfx && B.sfx.muted))); }

// ---- screens ------------------------------------------------------------------------------------------------------
function screen(name) {
  S.screen = name;
  $('setup').hidden = name !== 'setup'; $('hud').hidden = name !== 'play'; $('done').hidden = name !== 'done';
  if (name !== 'play') $('shh').hidden = true;
}
function showNotice(key) { S.notice = key; $('notice').hidden = !key; $('notice').textContent = key ? tr(key) : ''; }
/** Start the sky. mode: 'mic' (the page passes the room's loudness) or 'timer' (no microphone). */
function begin(mode, why) {
  S.mode = mode; S.quiet = 0; S.stars = []; S.slots = makeSlots(Math.min(CONFIG.maxStars, S.goal ? Math.ceil((S.goal * 60) / CONFIG.starEvery) : 30)); S.loud = false; S.overFor = 0; S.underFor = 0; S.hold = 0; S.paused = false;
  S.base = null; S.samples = []; S.calibUntil = performance.now() + CONFIG.calibrateSeconds * 1000;
  $('meter').hidden = mode !== 'mic'; $('tooLoud').hidden = mode === 'mic';
  $('modeChip').textContent = why ? tr(why) : tr(mode === 'mic' ? 'listening' : 'timerMode');
  $('pause').textContent = tr('pause');
  $('goalText').textContent = S.goal ? tr('ofGoal', { goal: clock(S.goal * 60) }) : '';
  screen('play'); paintHud();
}
async function startListening() {
  showNotice('');
  if (!LD) return begin('timer', 'unavailable');
  let st = 'off';
  try { st = await LD.start(); } catch (e) { st = 'unavailable'; }
  if (st === 'on') {
    if (offDb) offDb();
    offDb = LD.on(db => { S.db = db; S.lastDb = performance.now(); });
    return begin('mic');
  }
  if (st === 'needsTap') return showNotice('needsTap');   // the page wants one more tap of its own: Start listening again
  begin('timer', { denied: 'denied', nodevice: 'nodevice', busy: 'busy' }[st] || 'unavailable');
}
if (LD && LD.onState) LD.onState(st => { if (st === 'stopped' && S.screen === 'play' && S.mode === 'mic') { S.mode = 'timer'; S.loud = false; $('meter').hidden = true; $('tooLoud').hidden = false; $('modeChip').textContent = tr('stoppedMic'); } });
function stopListening() { try { if (LD && S.mode === 'mic') LD.stop(); } catch (e) { /* already stopped */ } }
function finish() {
  stopListening(); screen('done');
  $('doneH').textContent = tr('doneH'); $('doneP').textContent = tr('doneP', { time: clock(S.quiet), n: S.stars.length });
  sfx('win'); try { if (B.fx) B.fx.confetti(); } catch (e) { /* reduced motion */ }
  try { if (B.gameOver) B.gameOver({ won: true, score: null }); } catch (e) { /* preview */ }
  $('again').focus();
}
function togglePause() {
  if (S.screen !== 'play') return;
  S.paused = !S.paused; $('pause').textContent = tr(S.paused ? 'resume' : 'pause');
  $('modeChip').textContent = S.paused ? tr('paused') : tr(S.mode === 'mic' ? 'listening' : 'timerMode');
}
function tooLoud() { if (S.screen === 'play' && S.mode === 'timer') { S.hold = CONFIG.holdSeconds; S.loud = true; } }

// ---- each step ----------------------------------------------------------------------------------------------------
function step(dt, now) {
  if (S.screen !== 'play' || S.paused) return;
  let measuring = true;
  if (S.mode === 'mic') {
    measuring = now - S.lastDb < 600;   // the clock and the sky move only while the room is really measured
    $('modeChip').textContent = measuring ? tr('listening') : tr('waiting');
    if (measuring) {
      S.smooth += (S.db - S.smooth) * (S.db > S.smooth ? 0.25 : 0.08);
      if (S.base == null) {
        S.samples.push(S.db);
        if (now >= S.calibUntil && S.samples.length >= 10) { const v = S.samples.slice().sort((a, b) => a - b); S.base = Math.max(-75, Math.min(-35, v[Math.floor(v.length / 2)])); }
      } else if (S.smooth > line()) { S.overFor += dt; S.underFor = 0; if (S.overFor >= CONFIG.loudSeconds) S.loud = true; }
      else if (S.smooth < line() - 2) { S.underFor += dt; S.overFor = 0; if (S.underFor >= CONFIG.calmSeconds) S.loud = false; }
    }
  } else if (S.hold > 0) { S.hold -= dt; if (S.hold <= 0) S.loud = false; }
  if (measuring && !S.loud) {
    const before = Math.floor(S.quiet / CONFIG.starEvery);
    S.quiet += dt;
    if (Math.floor(S.quiet / CONFIG.starEvery) > before) addStar();
    if (S.goal && S.quiet >= S.goal * 60) { S.quiet = S.goal * 60; paintHud(); return finish(); }
  }
  paintHud();
}
/** Where the stars will go: spread over the sky (a jittered grid, so they never pile up), shuffled. */
function makeSlots(n) {
  const cols = Math.max(4, Math.ceil(Math.sqrt(n * 2))), rows = Math.max(2, Math.ceil(n / cols)), r = Math.random, out = [];
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) out.push({ x: 0.05 + ((x + 0.2 + r() * 0.6) / cols) * 0.9, y: 0.1 + ((y + 0.2 + r() * 0.6) / rows) * 0.5, s: 0.6 + r() * 0.9, tw: r() * 6.28 });
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
  return out.slice(0, n);
}
function addStar() {
  if (S.stars.length >= S.slots.length) S.slots.push(...makeSlots(Math.min(30, CONFIG.maxStars - S.slots.length)));
  const p = S.slots[S.stars.length];
  S.stars.push(p ? { ...p, born: performance.now() } : null);
}
function paintHud() {
  $('clock').textContent = clock(S.quiet); $('starCount').textContent = tr('stars', { n: S.stars.length });
  $('shh').hidden = !(S.screen === 'play' && S.loud && !S.paused);
  if (S.mode === 'mic') {
    $('level').style.width = `${toPct(S.smooth)}%`; $('gauge').classList.toggle('loud', S.loud);
    $('line').style.insetInlineStart = `${toPct(S.base == null ? -100 : line())}%`; $('line').hidden = S.base == null;
  }
}

// ---- the sky (canvas) ---------------------------------------------------------------------------------------------
const cv = $('sky'), ctx = cv.getContext('2d');
let dim = 0, cloudX = 1.3;
function fit() { const d = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.round(innerWidth * d); cv.height = Math.round(innerHeight * d); ctx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', fit); fit();
const still = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function starShape(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath();
}
function draw(now) {
  const w = innerWidth, h = innerHeight, u = Math.min(w, h), mx = w * 0.82, my = h * 0.2, mr = u * 0.07;
  const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#0b1030'); g.addColorStop(0.6, '#26306e'); g.addColorStop(1, '#4b3d7a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  // the places of the stars still to earn (faint dots), then the stars the class has earned
  ctx.fillStyle = 'rgba(220,226,255,0.28)';
  for (let i = S.stars.length; i < S.slots.length; i++) { const p = S.slots[i]; ctx.beginPath(); ctx.arc(p.x * w, p.y * h, Math.max(1.5, u * 0.004), 0, 7); ctx.fill(); }
  for (const s of S.stars) {
    if (!s) continue;
    const age = Math.min(1, (now - s.born) / 1200), tw = still() ? 1 : 0.8 + 0.2 * Math.sin(now / 1600 + s.tw);
    ctx.globalAlpha = age * tw; ctx.fillStyle = '#ffe48a'; ctx.strokeStyle = '#fff8d8'; ctx.lineWidth = 2;
    starShape(s.x * w, s.y * h, u * 0.018 * s.s * (0.6 + 0.4 * age)); ctx.fill(); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // the moon with a soft glow
  const glow = ctx.createRadialGradient(mx, my, mr * 0.8, mx, my, mr * 2.4); glow.addColorStop(0, 'rgba(255,240,190,0.35)'); glow.addColorStop(1, 'rgba(255,240,190,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(mx, my, mr * 2.4, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, 7); ctx.fill();
  ctx.fillStyle = '#f1e2a6'; for (const [dx, dy, r] of [[-0.3, -0.2, 0.22], [0.25, 0.3, 0.16], [0.35, -0.35, 0.1]]) { ctx.beginPath(); ctx.arc(mx + dx * mr, my + dy * mr, r * mr, 0, 7); ctx.fill(); }
  // two hills
  ctx.fillStyle = '#2a2a5c'; ctx.beginPath(); ctx.moveTo(0, h); ctx.quadraticCurveTo(w * 0.25, h * 0.66, w * 0.55, h * 0.8); ctx.quadraticCurveTo(w * 0.8, h * 0.9, w, h * 0.74); ctx.lineTo(w, h); ctx.fill();
  ctx.fillStyle = '#1b1c45'; ctx.beginPath(); ctx.moveTo(0, h * 0.86); ctx.quadraticCurveTo(w * 0.4, h * 0.78, w * 0.7, h * 0.9); ctx.quadraticCurveTo(w * 0.88, h * 0.96, w, h * 0.9); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.fill();
  // too loud: the sky dims a little and a cloud drifts over the moon (slowly, never a flash)
  const want = S.loud && S.screen === 'play' ? 1 : 0; dim += (want - dim) * 0.04;
  cloudX += ((want ? 0.78 : 1.3) - cloudX) * (still() ? 1 : 0.02);
  if (dim > 0.01) { ctx.fillStyle = `rgba(6,8,24,${0.3 * dim})`; ctx.fillRect(0, 0, w, h); }
  if (cloudX < 1.25) {
    ctx.fillStyle = 'rgba(200,208,240,0.85)';
    for (const [dx, dy, r] of [[0, 0, 1], [0.9, 0.15, 0.8], [-0.85, 0.2, 0.75], [0.3, -0.45, 0.7]]) { ctx.beginPath(); ctx.arc(cloudX * w + dx * mr, my + dy * mr, r * mr, 0, 7); ctx.fill(); }
  }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  step(dt, now); draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- buttons and keys ---------------------------------------------------------------------------------------------
$('listen').onclick = () => { sfx('click'); startListening(); };
$('timer').onclick = () => { sfx('click'); begin('timer'); };
$('pause').onclick = togglePause; $('tooLoud').onclick = tooLoud; $('end').onclick = finish;
$('again').onclick = () => { sfx('click'); if (S.mode === 'mic') startListening(); else begin('timer'); };
$('change').onclick = () => { screen('setup'); words(); $('listen').focus(); };
$('sound').onclick = () => { try { if (B.sfx) B.sfx.mute(); } catch (e) { /* no sound */ } paintSound(); };
$('full').onclick = () => { try { if (B.fullscreen) B.fullscreen(); } catch (e) { /* not here */ } };
addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'f') { $('full').click(); return; }
  if (S.screen !== 'play') return;
  if (k === ' ' || k === 'p' || k === 'pagedown') { e.preventDefault(); togglePause(); }
  else if (k === 'l') tooLoud();
  else if (k === 'e' || k === 'escape') finish();
});
addEventListener('pagehide', stopListening);

window.__brbTest = { state: () => ({ screen: S.screen, mode: S.mode, quietSeconds: Math.floor(S.quiet), stars: S.stars.length, loud: S.loud, goal: S.goal, notice: S.notice }), start() { begin('timer'); },
  advance(sec) { for (let i = 0; i < sec * 10; i++) step(0.1, performance.now()); } };
words(); screen('setup');
</script>
