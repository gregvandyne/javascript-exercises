<title>Snack Snatch!</title>
<style>
/* Two big tap pads (one per player), the signal and the score: kit buttons and pills in the kit's UI layer. */
.ok-ui .du-pad{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));width:calc(50vw - 21px);height:min(22vh,150px);border-radius:28px;font-size:1.3em;z-index:1;flex-direction:column}
.ok-ui .du-p1{inset-inline-start:14px}
.ok-ui .du-p2{inset-inline-end:14px}
.du-pad small{font-size:.7em;opacity:.85}
.du-pad b{font-size:1.5em;line-height:1;-webkit-text-stroke:.12em var(--ok-edge);paint-order:stroke fill;color:var(--ok-card)}
.ok-ui .du-pad:active{transform:translateY(3px) scale(.97)}
.du-signal,.du-score{position:fixed;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;border:3px solid var(--ok-edge);box-shadow:0 4px 0 var(--ok-edge);border-radius:999px;font-weight:800;z-index:1;white-space:nowrap}
.du-signal{top:calc(70px + env(safe-area-inset-top));padding:10px 26px;font-size:clamp(26px,7vw,44px);background:var(--du-bg);color:var(--ok-text)}
.du-signal svg{width:1.1em;height:1.1em}
.du-score{top:calc(14px + env(safe-area-inset-top));padding:6px 16px;background:var(--ok-card);color:var(--ok-text);font-size:1.05em}
</style>
<div id="game"></div>
<!--KIT-->
<!--PACK:dress-->
<!--PACK:art-school-->
<script>
// Two-Player Duel, on the Oomba Kit: one Oomba.game call (controls: 'none'). Two players share one screen: wait for
// GO, then tap your pad (or press A / L) first to snatch the snack. Tap too early and the other player gets the point.
// Play a friend or the robot; first to three wins. The kit does the screens, pause, results and juice.
'use strict';
const CONFIG = {
  title: 'Snack Snatch!',
  p1: { name: 'Fox', species: 'fox' },
  p2: { name: 'Frog', species: 'frog' },
  robot: { name: 'Robo', species: 'oomba', colors: { base: 'stone' }, wear: ['headphones'] },
  biome: 'candy',
  padColors: ['coral', 'sky'],
  snacks: ['cupcake', 'cookie', 'apple', 'melon', 'grapes'],
  roundsToWin: 3,
  minWait: 1.4,
  maxWait: 3.6,
  fakeFromRound: 3,
  botMin: 0.42,
  botMax: 0.75,
  keys: ['KeyA', 'KeyL'],
};
const WORDS = {
  en: { sub: 'Wait for GO, then tap your side first to grab the snack!', wait: 'Wait…', go: 'GO!', trick: 'Not yet!', early: 'Too early!', who: 'Who is playing?', two: 'Two players', robot: 'Me vs the robot', how1: 'Wait for GO', how2: 'Tap your side first (or press A / L)', how3: 'Too early gives your friend the point', wins: '{name} wins!', tap: 'Tap!' },
  es: { sub: '¡Espera al YA y toca tu lado primero para atrapar la golosina!', wait: 'Espera…', go: '¡YA!', trick: '¡Todavía no!', early: '¡Demasiado pronto!', who: '¿Quién juega?', two: 'Dos jugadores', robot: 'Yo contra el robot', how1: 'Espera al YA', how2: 'Toca tu lado primero (o pulsa A / L)', how3: 'Si te adelantas, el punto es para el otro', wins: '¡Gana {name}!', tap: '¡Toca!' },
  fr: { sub: 'Attends le PARTEZ, puis touche ton côté en premier pour attraper le goûter !', wait: 'Attends…', go: 'PARTEZ !', trick: 'Pas encore !', early: 'Trop tôt !', who: 'Qui joue ?', two: 'Deux joueurs', robot: 'Moi contre le robot', how1: 'Attends le PARTEZ', how2: 'Touche ton côté en premier (ou A / L)', how3: 'Trop tôt : le point va à l’autre', wins: '{name} gagne !', tap: 'Touche !' },
  de: { sub: 'Warte auf LOS und tippe zuerst auf deine Seite, um den Snack zu schnappen!', wait: 'Warte…', go: 'LOS!', trick: 'Noch nicht!', early: 'Zu früh!', who: 'Wer spielt?', two: 'Zwei Spieler', robot: 'Ich gegen den Roboter', how1: 'Warte auf LOS', how2: 'Tippe zuerst auf deine Seite (oder A / L)', how3: 'Zu früh: Der Punkt geht an die andere Seite', wins: '{name} gewinnt!', tap: 'Tippen!' },
  it: { sub: 'Aspetta il VIA, poi tocca per primo il tuo lato per prendere lo spuntino!', wait: 'Aspetta…', go: 'VIA!', trick: 'Non ancora!', early: 'Troppo presto!', who: 'Chi gioca?', two: 'Due giocatori', robot: 'Io contro il robot', how1: 'Aspetta il VIA', how2: 'Tocca per primo il tuo lato (o premi A / L)', how3: 'Troppo presto: il punto va all’altro', wins: 'Vince {name}!', tap: 'Tocca!' },
  pt: { sub: 'Espere o JÁ e toque primeiro no seu lado para pegar o lanche!', wait: 'Espere…', go: 'JÁ!', trick: 'Ainda não!', early: 'Cedo demais!', who: 'Quem vai jogar?', two: 'Dois jogadores', robot: 'Eu contra o robô', how1: 'Espere o JÁ', how2: 'Toque primeiro no seu lado (ou aperte A / L)', how3: 'Cedo demais: o ponto vai para o outro', wins: '{name} venceu!', tap: 'Toque!' },
  nl: { sub: 'Wacht op NU en tik als eerste op jouw kant om de snack te pakken!', wait: 'Wacht…', go: 'NU!', trick: 'Nog niet!', early: 'Te vroeg!', who: 'Wie speelt er?', two: 'Twee spelers', robot: 'Ik tegen de robot', how1: 'Wacht op NU', how2: 'Tik als eerste op jouw kant (of druk A / L)', how3: 'Te vroeg: het punt gaat naar de ander', wins: '{name} wint!', tap: 'Tik!' },
  ru: { sub: 'Жди сигнала «ДАВАЙ», потом первым нажми на свою сторону и схвати угощение!', wait: 'Жди…', go: 'ДАВАЙ!', trick: 'Ещё нет!', early: 'Слишком рано!', who: 'Кто играет?', two: 'Два игрока', robot: 'Я против робота', how1: 'Жди сигнала «ДАВАЙ»', how2: 'Первым нажми на свою сторону (или A / L)', how3: 'Слишком рано — очко получит соперник', wins: '{name} побеждает!', tap: 'Жми!' },
  he: { sub: 'חכו ל״עכשיו!״ והקישו ראשונים על הצד שלכם כדי לחטוף את החטיף!', wait: 'חכו…', go: 'עכשיו!', trick: 'עוד לא!', early: 'מוקדם מדי!', who: 'מי משחק?', two: 'שני שחקנים', robot: 'אני נגד הרובוט', how1: 'חכו ל״עכשיו!״', how2: 'הקישו ראשונים על הצד שלכם (או A / L)', how3: 'מוקדם מדי? הנקודה עוברת לשני', wins: '{name} מנצח!', tap: 'הקישו!' },
  ar: { sub: 'انتظر «الآن!» ثم انقر على جهتك أولاً لتخطف الوجبة!', wait: 'انتظر…', go: 'الآن!', trick: 'ليس بعد!', early: 'مبكر جداً!', who: 'من سيلعب؟', two: 'لاعبان', robot: 'أنا ضد الروبوت', how1: 'انتظر «الآن!»', how2: 'انقر على جهتك أولاً (أو اضغط A / L)', how3: 'إن بكّرت تذهب النقطة للآخر', wins: '{name} يفوز!', tap: 'انقر!' },
  ja: { sub: '「いま！」を まって、さきに じぶんの がわを タップして おやつを とろう！', wait: 'まって…', go: 'いま！', trick: 'まだだよ！', early: 'はやすぎ！', who: 'だれが あそぶ？', two: '2にんで あそぶ', robot: 'ロボットと たいけつ', how1: '「いま！」を まとう', how2: 'さきに じぶんの がわを タップ（A / L キーでも OK）', how3: 'はやすぎると あいてに 1てん', wins: '{name}の かち！', tap: 'タップ！' },
  'zh-Hant': { sub: '等到「開始！」，再搶先點你那一邊，把點心搶到手！', wait: '等一下…', go: '開始！', trick: '還沒！', early: '太早了！', who: '誰要玩？', two: '兩個玩家', robot: '我對機器人', how1: '等「開始！」', how2: '搶先點你那一邊（或按 A / L）', how3: '太早點，分數就給對方', wins: '{name} 贏了！', tap: '點！' },
};
const SET = [
  '                              ',
  '                              ',
  '                              ',
  '                              ',
  '                              ',
  '           P        2         ',
  '##############################',
  '##############################',
  '##############################',
  '##############################',
  '##############################',
];

const O = window.Oomba;
let vsBot = false, ui = null, wins = [0, 0], round = 1, phase = 'idle', t = 0, goAt = 0, trickAt = 0, botAt = 0, snack = null, world = null;
const who = i => (i === 1 && vsBot ? CONFIG.robot : i ? CONFIG.p2 : CONFIG.p1);
const actor = (w, i) => (i ? w.find('p2') : w.hero);
/** The middle of the set in view, the ground just above the tap pads. */
function frame(w) {
  const V = w.stage.view, C = w.cam, L = w.level, pads = V.vh * (Math.min(innerHeight * 0.22, 150) + 20) / innerHeight;
  const z = Math.min(V.vw / (12 * w.cell), (V.vh - pads) / (L.h - 2 * w.cell));
  C.bounds(null); C.zoom = z; C.x = L.w / 2; C.y = L.h - 4.6 * w.cell - (V.vh / 2 - pads) / z;
}
const el = (tag, cls, html) => { const e = document.createElement(tag); e.className = cls; if (html != null) e.innerHTML = html; return e; };
function signal(kind) {
  if (!ui) return;
  const role = { wait: 'wrong', go: 'correct', trick: 'reward' }[kind] || 'neutral', icon = { wait: 'pause', go: 'check', trick: 'cross' }[kind] || 'timer';
  ui.signal.style.setProperty('--du-bg', O.color(role, 'light'));
  ui.signal.innerHTML = O.icon(icon); ui.signal.append(O.t(kind)); O.ui.announce(O.t(kind));
}
function score() { if (ui) ui.score.textContent = `${who(0).name} ${O.num(wins[0])} – ${O.num(wins[1])} ${who(1).name}`; }
function clear() { if (ui) for (const k in ui) ui[k].remove(); ui = null; }
function build(w) {
  clear(); world = w; wins = [0, 0]; round = 1; phase = 'idle';
  const p2 = w.spawn(Object.assign({}, who(1)), { c: 20, r: 5, tag: 'p2', flip: true, size: 1.75 });
  p2.look(w.hero); w.hero.look(p2);
  ui = { signal: el('div', 'du-signal'), score: el('div', 'du-score') };
  [0, 1].forEach(i => {
    const pad = O.ui.button('', { kind: i ? 'hot' : 'go', big: true });
    pad.classList.add('du-pad', i ? 'du-p2' : 'du-p1');
    pad.innerHTML = `<b>${O.t('tap')}</b><small>${who(i).name}${i && vsBot ? '' : ' · ' + CONFIG.keys[i].replace('Key', '')}</small>`;
    // each pad in its player's colour at full strength, with their portrait
    pad.style.background = O.color(CONFIG.padColors[i]); pad.style.setProperty('--ok-press', O.color(CONFIG.padColors[i], 'shade'));
    const look = Object.assign({}, who(i)); delete look.name; pad.prepend(O.ui.portrait(look, { size: 56, mood: 'determined' }));
    pad.addEventListener('pointerdown', e => { e.preventDefault(); if (!(i === 1 && vsBot)) press(i); });
    if (i === 1 && vsBot) pad.disabled = true;
    ui['pad' + i] = pad;
  });
  for (const k in ui) O.ui.root().appendChild(ui[k]);
  score(); signal('wait');
}
function next(w) {
  if (w.ended) return;
  if (snack) snack.remove(null);
  snack = w.spawn(w.rand.pick(CONFIG.snacks), { c: 15.5, r: 4, size: 1.2, parts: [{ bob: { amp: 6 } }] }); snack.pop();
  for (const i of [0, 1]) actor(w, i).state('idle').mood('determined');
  phase = 'wait'; t = 0; goAt = w.rand.range(CONFIG.minWait, CONFIG.maxWait);
  trickAt = round >= CONFIG.fakeFromRound && w.rand.chance(0.5) ? goAt * w.rand.range(0.35, 0.6) : 0;
  signal('wait');
}
function press(i) {
  const w = world; if (!w || w.ended || w.scene !== 'play' || (phase !== 'wait' && phase !== 'trick' && phase !== 'go')) return;
  const early = phase !== 'go', win = early ? 1 - i : i;
  phase = 'done';
  if (early) { actor(w, i).state('hurt').mood('surprised'); O.ui.toast(O.t('early')); O.sfx('wrong'); }
  const a = actor(w, win), b = actor(w, 1 - win);
  O.tween(snack, { x: a.x, y: a.y - a.size * 0.7 }, { ms: 220, ease: 'quadOut' }).then(() => { if (snack) snack.collect(); snack = null; });
  a.state('cheer'); a.squash(1.15); if (!early) b.state('sad');
  O.sfx('spark'); w.cam.punch(1.04);
  wins[win]++; round++; score();
  if (wins[win] >= CONFIG.roundsToWin) {
    w.after(900, async () => {
      await w.say(a, O.t('wins', { name: who(win).name }));
      clear();
      if (vsBot && win === 1) w.lose({ say: O.t('wins', { name: who(1).name }) });
      // two friends: the card names the winner and shows them; a hot-seat score never goes to the leaderboard
      else w.win(Object.assign({ stars: wins[1 - win] === 0 ? 3 : wins[1 - win] === 1 ? 2 : 1, score: wins[win] * 100 }, vsBot ? {} : { title: O.t('wins', { name: who(win).name }), who: a, submit: false }));
    });
  } else w.after(1600, () => next(w));
}

const game = O.game({
  api: 1, title: CONFIG.title, subtitle: 'sub', biome: CONFIG.biome,
  controls: 'none', camera: 'fixed', hero: Object.assign({}, CONFIG.p1), countdown: 0,
  hud: [],
  howTo: [{ icon: 'timer', text: 'how1' }, { icon: 'tap', text: 'how2' }, { icon: 'info', text: 'how3' }],
  strings: WORDS,
  level: O.level.grid(SET, { 2: 'cloud' }),
  async intro() {
    vsBot = (await O.ui.dialog({ title: O.t('who'), buttons: [{ label: O.t('robot'), kind: 'quiet', value: 1, icon: 'gamepad' }, { label: O.t('two'), kind: 'hot', value: 2, icon: 'user' }] })) === 1;
  },
  setup(w) { const c = w.find('cloud'); if (c) c.remove(null); clear(); },
  update(w, dt) {
    frame(w);
    if (w.scene !== 'play' || w !== world) return;
    t += dt;
    if (phase === 'wait' && trickAt && t >= trickAt) { phase = 'trick'; trickAt = 0; signal('trick'); O.sfx('pop', { pitch: 0.7 }); w.after(600, () => { if (phase === 'trick') { phase = 'wait'; signal('wait'); } }); }
    if (phase === 'wait' && t >= goAt) { phase = 'go'; signal('go'); O.sfx('count', { pitch: 1.5 }); botAt = t + w.rand.range(CONFIG.botMin, CONFIG.botMax) * Math.max(0.7, 1 - round * 0.05); }
    if (phase === 'go' && vsBot && t >= botAt) press(1);
  },
  on: { start(w) { build(w); w.after(700, () => next(w)); }, results: clear, lose: clear },
});
addEventListener('keydown', e => { const i = CONFIG.keys.indexOf(e.code); if (i >= 0 && !e.repeat && !(i === 1 && vsBot)) press(i); });
</script>
