<title>Memory Match</title>
<!--CLASSROOM_STYLE-->
<style>
/* Memory Match: flip two cards to find a pair, a term and its meaning (or a picture and its word). Solo, or teams who
   take turns on the board (a team keeps its turn while it finds pairs). Plain HTML in the Oomba classroom style:
   arrows and Enter flip cards, nothing is sent anywhere and nobody is named. */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}
.teams{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.team{display:flex;align-items:center;gap:10px;padding:6px 16px;border-radius:999px;background:var(--card);font-weight:800;font-size:clamp(1rem,2.8vmin,1.8rem);box-shadow:var(--shadow)}
.top .pill{background:var(--card);box-shadow:var(--shadow)}
.team .pts{font-variant-numeric:tabular-nums;min-width:1.2em;text-align:center}
.team.turn{background:var(--current);color:var(--on-current)}
.turnline{margin:0;text-align:center;font-weight:700;color:var(--soft);font-size:clamp(1rem,2.6vmin,1.6rem);min-height:1.3em}
.boardwrap{flex:1;display:grid;place-items:center;min-height:0}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:clamp(8px,1.4vmin,16px);width:min(100%,calc((100dvh - 230px) * var(--cols) / var(--rows) * 1.32));max-width:1200px;perspective:1400px}
.mc{position:relative;aspect-ratio:4/3;padding:0;border:0;background:none;box-shadow:none;border-radius:var(--r);min-height:0;min-width:0}
.mc:hover:not(:disabled){transform:translateY(-2px);box-shadow:none}
.mc:active:not(:disabled){transform:scale(.98);box-shadow:none}
.mc .in{position:absolute;inset:0;transition:transform .5s var(--spring);transform-style:preserve-3d}
.mc.up .in{transform:rotateY(180deg)}
.mc .f{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;border-radius:var(--r);backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.mc .back{background:var(--green);color:var(--on-green);border-color:transparent;background-image:radial-gradient(rgba(255,255,255,.13) 1.5px,transparent 1.6px);background-size:14px 14px}
.mc .back::before{content:"";position:absolute;inset:7px;border-radius:calc(var(--r) - 6px);border:1.5px solid rgba(255,255,255,.28)}
.mc .back b{width:clamp(14px,2.6vmin,26px);height:clamp(14px,2.6vmin,26px);border-radius:50%;background:var(--mint);box-shadow:calc(clamp(14px,2.6vmin,26px) * .62) 0 0 var(--spark);margin-inline-end:calc(clamp(14px,2.6vmin,26px) * .62)}
.mc .face{background:var(--card);transform:rotateY(180deg);color:var(--ink);box-shadow:inset 0 4px 0 color-mix(in srgb,var(--g-class) 75%,var(--card)),var(--shadow)}
.mc .face.mean{box-shadow:inset 0 4px 0 color-mix(in srgb,var(--g-tools) 75%,var(--card)),var(--shadow)}
.mc .face .k{font-size:clamp(.62rem,1.5vmin,.95rem);font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 10px;border-radius:999px;background:var(--card2);color:var(--muted)}
.mc .face .t{font-weight:800;line-height:1.12;text-align:center;overflow-wrap:anywhere;font-size:var(--fs,clamp(.9rem,2.6vmin,1.9rem))}
.mc .face .t.pic{font-size:clamp(2rem,8vmin,5.4rem);line-height:1}
.mc.done .face{background:var(--mint-t);border-color:var(--green);box-shadow:0 0 0 3px var(--green)}
.mc.done .face::after{content:"✓";position:absolute;top:6px;inset-inline-end:10px;font-weight:800;color:var(--accent-ink)}
.mc.miss .face{background:var(--coral-t);border-color:var(--coral)}
.mc:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.mc:disabled{opacity:1;cursor:default}
.end .card{width:min(100%,900px)}
.big-score{font-size:clamp(2.6rem,11vmin,7rem);font-weight:800;letter-spacing:-.04em;line-height:1;margin:6px 0;font-variant-numeric:tabular-nums}
.pairs{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px;text-align:start}
.pairs li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-sm);background:var(--card2);font-size:clamp(.95rem,2.2vmin,1.3rem)}
.pairs b{font-weight:800}
.pairs span{color:var(--soft)}
.editor{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:var(--scrim)}
.editor .card{width:min(100%,900px);text-align:start;max-height:calc(100dvh - 32px);overflow:auto}
.editor h2{font-size:clamp(1.4rem,4vmin,2.4rem)}
.editor textarea{width:100%;min-height:clamp(200px,40dvh,420px);font:600 clamp(.95rem,2vmin,1.15rem)/1.5 var(--font);background:var(--card2);padding:12px 14px;resize:vertical}
.editor .msg{min-height:1.3em;font-weight:700}
.editor .msg.bad{color:var(--coral)}
.editor .row{justify-content:flex-end}
@media (max-width:600px){.grid{gap:6px;width:100%}.mc .f{padding:4px;border-radius:12px}.mc .face .k{display:none}.mc{aspect-ratio:3/4}}
</style>
<main class="app">
  <header class="bar"><h1 id="title"></h1><button class="small" id="sound" aria-pressed="false"></button><button class="small" id="full"></button></header>

  <section class="screen setup" id="start">
    <div class="card g-class"><div class="wh"><span class="wicon" aria-hidden="true">🃏</span><h2 class="wt" id="startH"></h2></div><p id="startP"></p>
      <p id="whoP"></p>
      <div class="row" id="who" role="group"></div>
      <div class="row"><button class="big hot" id="go"></button></div>
      <div class="row"><button class="small" id="editBtn"></button></div>
      <p class="keys" id="startKeys"></p></div>
  </section>

  <section class="screen" id="play" hidden>
    <div class="top"><span class="pill" id="found"></span><span class="pill" id="moves"></span><div class="teams" id="teams"></div></div>
    <p class="turnline" id="turnline" aria-live="polite"></p>
    <div class="boardwrap"><div class="grid" id="grid" role="grid"></div></div>
    <p class="keys" id="keys"></p>
  </section>

  <section class="screen end" id="end" hidden>
    <div class="card center g-class"><h2 id="endH"></h2><div class="big-score" id="endScore"></div><p id="endP"></p>
      <div class="row"><button class="big hot" id="again"></button><button class="big" id="menu"></button></div>
      <h3 id="pairsH"></h3><ul class="pairs" id="pairs"></ul></div>
  </section>
</main>
<section class="editor" id="editor" role="dialog" aria-modal="true" aria-labelledby="editH" hidden>
  <div class="card"><h2 id="editH"></h2><p id="editP"></p>
    <textarea id="editText" spellcheck="true" dir="auto"></textarea>
    <p class="msg" id="editMsg" aria-live="polite"></p>
    <div class="row"><button class="big" id="editCancel"></button><button class="big hot" id="editUse"></button></div></div>
</section>

const B = window.BRB || {};
const LANG = (B.user && B.user.lang) || 'en';
const W = WORDS[LANG] || WORDS[String(LANG).split('-')[0]] || WORDS.en;
const tr = (k, v) => String(W[k] != null ? W[k] : WORDS.en[k]).replace(/\{(\w+)\}/g, (m, n) => (v && v[n] != null ? v[n] : m));
document.documentElement.lang = LANG; document.documentElement.dir = (B.user && B.user.dir) || 'ltr';
if (B.theme === 'light' || B.theme === 'dark') document.documentElement.dataset.theme = B.theme;   // the site's light or dark (else the device's)
const $ = id => document.getElementById(id);
let soundOn = !!CONFIG.sound;   // sound is off until someone presses Sound
const sfx = name => { try { if (soundOn && B.sfx && !B.sfx.muted) B.sfx.play(name); } catch (e) { /* no sound */ } };
const say = (text, queue = false) => { try { if (CONFIG.readAloud && B.speak && soundOn) B.speak(text, { lang: CONFIG.lang, queue }); } catch (e) { /* no voice */ } };
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
// One emoji (a picture) is drawn big; anything else is text.
const isPic = s => /^\p{Extended_Pictographic}(️|‍\p{Extended_Pictographic}|[\u{1F3FB}-\u{1F3FF}])*$/u.test(String(s).trim());

let pairs = PAIRS.filter(p => p && p.a && p.b).map(p => ({ a: String(p.a), b: String(p.b) }));
const S = { screen: 'start', teams: Math.max(0, Math.min(4, CONFIG.teams | 0)), cards: [], open: [], found: 0, moves: 0, turn: 0, scores: [], lock: false, focus: 0, cols: 4, rows: 4, dealt: [] };
function show(id) { for (const s of ['start', 'play', 'end']) $(s).hidden = s !== id; S.screen = id; }
function home() {
  show('start'); $('startP').textContent = tr('startP', { total: Math.min(pairs.length, CONFIG.maxPairs) });
  const who = $('who'); who.innerHTML = '';
  for (const n of [0, 2, 3, 4]) { const b = document.createElement('button'); b.className = 'small'; b.textContent = n ? tr('teamsN', { n }) : tr('solo'); b.setAttribute('aria-pressed', String(S.teams === n)); b.onclick = () => { S.teams = n; home(); $('go').focus(); }; who.appendChild(b); }
  $('go').focus({ preventScroll: true });
}
function layout(n) {
  const wide = innerWidth >= innerHeight;
  // The columns that fill the rows best for this screen (a gap in the last row costs more than an odd shape).
  let best = 4, score = 1e9;
  for (let c = 2; c <= Math.min(n, 10); c++) { const r = Math.ceil(n / c), ratio = c / r, want = wide ? 1.5 : innerWidth < 600 ? 0.8 : 1; const s = Math.abs(Math.log(ratio / want)) + (c * r - n) * 0.6; if (s < score) { score = s; best = c; } }
  S.cols = best; S.rows = Math.ceil(n / best);
  $('grid').style.setProperty('--cols', S.cols); $('grid').style.setProperty('--rows', S.rows);
}
function begin() {
  S.dealt = shuffle(pairs).slice(0, Math.max(2, CONFIG.maxPairs));
  S.cards = shuffle(S.dealt.flatMap((p, i) => [{ pair: i, side: 'a', t: p.a }, { pair: i, side: 'b', t: p.b }])).map(c => ({ ...c, up: false, done: false }));
  S.open = []; S.found = 0; S.moves = 0; S.turn = 0; S.scores = Array(S.teams).fill(0); S.lock = false; S.focus = 0;
  show('play'); layout(S.cards.length); render(); paint(); focusCard();
}
function render() {
  const g = $('grid'); g.innerHTML = '';
  S.cards.forEach((c, i) => {
    const b = document.createElement('button'); b.className = 'mc oc-pop'; b.style.animationDelay = `${Math.min(i, 24) * 22}ms`; b.dataset.i = i; b.tabIndex = -1;
    b.innerHTML = '<span class="in"><span class="f back"><b></b></span><span class="f face"><span class="k"></span><span class="t"></span></span></span>';
    const face = b.querySelector('.face'), t = b.querySelector('.t');
    if (c.side === 'b') face.classList.add('mean');
    b.querySelector('.k').textContent = c.side === 'a' ? tr('term') : tr('mean'); b.querySelector('.k').hidden = !CONFIG.labels || isPic(c.t);
    t.textContent = c.t; if (isPic(c.t)) t.classList.add('pic'); else if (c.t.length > 24) t.style.setProperty('--fs', 'clamp(.78rem,1.9vmin,1.35rem)');
    b.onclick = () => flip(i); g.appendChild(b);
  });
}
function paint() {
  const total = S.cards.length / 2;
  $('found').textContent = tr('found', { n: S.found, total }); $('moves').textContent = tr('moves', { n: S.moves });
  const tm = $('teams'); tm.innerHTML = '';
  for (let i = 0; i < S.teams; i++) { const d = document.createElement('div'); d.className = `team${i === S.turn ? ' turn' : ''}`; d.innerHTML = '<span></span><span class="pts"></span>'; d.children[0].textContent = tr('team', { n: i + 1 }); d.children[1].textContent = String(S.scores[i]); tm.appendChild(d); }
  [...$('grid').children].forEach((b, i) => {
    const c = S.cards[i]; b.classList.toggle('up', c.up || c.done); b.classList.toggle('done', c.done); b.disabled = c.done;
    b.setAttribute('aria-label', c.up || c.done ? `${tr('shown', { n: i + 1, t: c.t })}${c.done ? `, ${tr('matched')}` : ''}` : tr('hidden', { n: i + 1 }));
  });
}
function flip(i) {
  const c = S.cards[i];
  if (S.screen !== 'play' || S.lock || !c || c.up || c.done) return;
  c.up = true; S.open.push(i); S.focus = i; sfx('click'); paint();
  if (S.open.length < 2) { $('turnline').textContent = S.teams ? tr('turn', { n: S.turn + 1 }) : ''; return; }
  S.moves++;
  const [x, y] = S.open.map(k => S.cards[k]);
  if (x.pair === y.pair) {
    x.done = y.done = true; x.up = y.up = false; S.open = []; S.found++;
    if (S.teams) S.scores[S.turn]++;
    $('turnline').textContent = S.teams ? tr('again2', { n: S.turn + 1 }) : tr('pair'); sfx('coin');
    paint(); for (const k of [i, S.cards.indexOf(x === c ? y : x)]) { const el = $('grid').children[k]; el.classList.remove('oc-bump'); void el.offsetWidth; el.classList.add('oc-bump'); }
    if (!isPic(S.dealt[x.pair].a)) say(S.dealt[x.pair].a); say(S.dealt[x.pair].b, true);   // each as written, one after the other
    if (S.found === S.cards.length / 2) setTimeout(finish, 700); else focusCard();
  } else {
    S.lock = true; $('turnline').textContent = tr('nope'); sfx('hit');
    const els = S.open.map(k => $('grid').children[k]); els.forEach(el => el.classList.add('miss'));
    setTimeout(() => {
      x.up = y.up = false; S.open = []; S.lock = false; els.forEach(el => el.classList.remove('miss'));
      if (S.teams) { S.turn = (S.turn + 1) % S.teams; $('turnline').textContent = tr('turn', { n: S.turn + 1 }); } else $('turnline').textContent = '';
      paint(); focusCard();
    }, Math.max(400, CONFIG.flipBackMs | 0));
  }
}
function finish() {
  show('end');
  if (S.teams) {
    const top = Math.max(...S.scores), win = S.scores.map((s, i) => (s === top ? i : -1)).filter(i => i >= 0);
    $('endH').textContent = win.length > 1 ? tr('endTie') : tr('endTeam', { n: win[0] + 1 });
    $('endScore').textContent = S.scores.map((s, i) => `${tr('team', { n: i + 1 })} ${s}`).join(' · '); $('endScore').style.fontSize = 'clamp(1.4rem,5vmin,3rem)';
  } else { $('endH').textContent = tr('endSolo'); $('endScore').textContent = tr('endMoves', { moves: S.moves }); $('endScore').style.fontSize = ''; }
  $('endP').textContent = tr('endP');
  const ul = $('pairs'); ul.innerHTML = '';
  for (const p of S.dealt) { const li = document.createElement('li'); li.innerHTML = '<b></b><span aria-hidden="true">→</span><span></span>'; li.children[0].textContent = p.a; li.children[2].textContent = p.b; ul.appendChild(li); }
  sfx('win'); try { if (B.fx) B.fx.confetti(); } catch (e) { /* reduced motion */ }
  try { if (B.gameOver) B.gameOver({ won: true, score: S.teams ? null : Math.max(0, 100 - S.moves) }); } catch (e) { /* preview */ }
  $('again').focus({ preventScroll: true });
}
function focusCard() {
  const els = [...$('grid').children]; els.forEach(b => { b.tabIndex = -1; });
  let i = S.focus; if (!S.cards[i] || S.cards[i].done) i = S.cards.findIndex(c => !c.done);
  if (i < 0) return; S.focus = i; els[i].tabIndex = 0; if (S.screen === 'play') els[i].focus({ preventScroll: true });
}
function move(dx, dy) {
  const n = S.cards.length; let i = S.focus;
  for (let k = 0; k < n; k++) {
    let c = i % S.cols, r = Math.floor(i / S.cols);
    c = (c + dx + S.cols) % S.cols; r = (r + dy + S.rows) % S.rows; i = r * S.cols + c;
    if (i < n && !S.cards[i].done) break;
  }
  if (i < n) { S.focus = i; focusCard(); }
}

// ---- the teacher's own pairs ----------------------------------------------------------------------------------------
function fromLines(text) {
  const out = [], lines = String(text).split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i].trim(); if (!raw) continue;
    const parts = raw.split('|').map(s => s.trim());
    if (parts.length < 2 || !parts[0] || !parts[1]) return { error: tr('bad', { n: i + 1 }) };
    out.push({ a: parts[0].slice(0, 80), b: parts.slice(1).join(' | ').slice(0, 120) });
  }
  return out.length >= 3 ? { list: out.slice(0, 40) } : { error: tr('few') };
}
function openEditor() { $('editText').value = pairs.map(p => `${p.a} | ${p.b}`).join('\n'); $('editMsg').textContent = ''; $('editMsg').className = 'msg'; $('editor').hidden = false; $('editText').focus(); }
function closeEditor() { $('editor').hidden = true; $('editBtn').focus(); }
function useEditor() { const r = fromLines($('editText').value); if (r.error) { $('editMsg').textContent = r.error; $('editMsg').className = 'msg bad'; return; } pairs = r.list; closeEditor(); home(); }

// ---- buttons and keys ---------------------------------------------------------------------------------------------
$('go').onclick = begin; $('again').onclick = begin; $('menu').onclick = home;
$('editBtn').onclick = openEditor; $('editCancel').onclick = closeEditor; $('editUse').onclick = useEditor;
$('sound').onclick = () => { soundOn = !soundOn; $('sound').setAttribute('aria-pressed', String(soundOn)); sfx('click'); };
$('full').onclick = () => { try { if (B.fullscreen) B.fullscreen(); } catch (e) { /* not here */ } };
addEventListener('resize', () => { if (S.screen === 'play') layout(S.cards.length); });
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!$('editor').hidden) { if (e.key === 'Escape') { e.preventDefault(); closeEditor(); } return; }
  const k = e.key, rtl = document.documentElement.dir === 'rtl';
  if (k === 'f' || k === 'F') { $('full').click(); return; }
  if (S.screen !== 'play') return;
  const m = { ArrowLeft: [rtl ? 1 : -1, 0], ArrowRight: [rtl ? -1 : 1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[k];
  if (m) { e.preventDefault(); move(m[0], m[1]); }
});

document.title = CONFIG.title; $('title').textContent = CONFIG.title; $('startH').textContent = CONFIG.title;
$('sound').textContent = tr('sound'); $('full').textContent = tr('full'); $('go').textContent = tr('go'); $('editBtn').textContent = tr('edit'); $('whoP').textContent = tr('whoP');
$('again').textContent = tr('again'); $('menu').textContent = tr('menu'); $('pairsH').textContent = tr('pairsH'); $('keys').textContent = tr('keys'); $('startKeys').textContent = tr('keys');
$('editH').textContent = tr('editH'); $('editP').textContent = tr('editP'); $('editText').setAttribute('aria-label', tr('editH')); $('editUse').textContent = tr('use'); $('editCancel').textContent = tr('cancel');
$('editBtn').hidden = !CONFIG.allowEdit; $('grid').setAttribute('aria-label', CONFIG.title);
$('sound').setAttribute('aria-pressed', String(soundOn));
window.__brbTest = { state: () => ({ screen: S.screen, cards: S.cards.length, found: S.found, moves: S.moves, open: S.open.slice(), teams: S.teams, turn: S.turn + 1, scores: S.scores.slice(), pairOf: S.cards.map(c => c.pair) }), start() { begin(); } };
home();
