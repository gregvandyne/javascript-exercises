<title>Wiggle Words</title>
<style>
/* The word card: real buttons in the kit's UI layer, styled with the kit's colour variables. Words stay left to right. */
.wd{position:fixed;left:50%;top:calc(72px + env(safe-area-inset-top));transform:translateX(-50%);width:min(560px,calc(100vw - 24px));
  background:var(--ok-card);color:var(--ok-text);border:3px solid var(--ok-edge);border-radius:24px;box-shadow:0 5px 0 var(--ok-edge);
  padding:12px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;z-index:1}
.wd-pic{display:flex;align-items:center;gap:12px}
.wd-pic canvas{height:min(120px,18vh);width:auto}
.wd-slots,.wd-keys{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;direction:ltr}
.wd-slot{width:clamp(44px,12vw,60px);height:clamp(52px,14vw,68px);border-radius:14px;border:3px dashed var(--ok-edge);display:flex;align-items:center;justify-content:center;font-size:clamp(26px,7vw,38px);font-weight:800}
.wd-slot.wd-on{border-style:solid;background:var(--ok-bg2)}
.wd .wd-key{min-width:clamp(52px,14vw,64px);font-size:clamp(24px,6.5vw,32px);font-weight:800}
.wd .wd-key[disabled]{opacity:.35}
</style>
<div id="game"></div>
<!--KIT-->
<!--PACK:dress-->
<!--PACK:art-animals-->
<!--PACK:art-school-->
<script>
// Word Builder, on the Oomba Kit: one Oomba.game call (controls: 'none') for the screens, hearts, pause and results.
// An early-reader game: look at the picture, hear the word, then fill in the missing letter; later words are spelled
// letter by letter from shuffled tiles. A wrong letter costs a heart; a whole word right earns a star's worth of points.
'use strict';
const CONFIG = {
  title: 'Wiggle Words',
  host: { species: 'frog', wear: ['glasses'] },
  biome: 'meadow',
  wordsPerRound: 10,
  missingLetterRounds: 4,
  choices: 3,
  hearts: 5,
  pointsPerWord: 100,
  perfectBonus: 50,
  readAloud: true,
  speechLang: 'en-US',
  wordRate: 0.85,
};
// The words and their pictures (a kit character or prop), in the language of speechLang.
const WORD_LIST = [
  ['CAT', 'cat'], ['DOG', 'dog'], ['FOX', 'fox'], ['BEE', 'bee'], ['OWL', 'owl'], ['KEY', 'key'], ['BUS', 'bus'], ['CAR', 'car'],
  ['GEM', 'gem'], ['PIE', 'pie'], ['FROG', 'frog'], ['DUCK', 'duck'], ['BEAR', 'bear'], ['BOAT', 'boat'], ['TREE', 'tree'], ['ROCK', 'rock'],
  ['LEAF', 'leaf'], ['FLAG', 'flag'], ['GIFT', 'gift'], ['BOOK', 'book'], ['DICE', 'dice'], ['MOUSE', 'mouse'], ['APPLE', 'apple'],
  ['CLOCK', 'clock'], ['SHELL', 'shell'], ['PLANE', 'plane'], ['GLOBE', 'globe'], ['RULER', 'ruler'], ['MELON', 'melon'],
];
const WORDS = {
  en: { sub: 'Look at the picture and build the word!', look: 'Look at the picture and listen', tap: 'Tap the letters to build the word', heart: 'A wrong letter costs a heart', hear: 'Hear the word', hello: 'Ribbit! Let’s read some words!' },
  es: { sub: '¡Mira el dibujo y forma la palabra!', look: 'Mira el dibujo y escucha', tap: 'Toca las letras para formar la palabra', heart: 'Una letra equivocada cuesta un corazón', hear: 'Escuchar la palabra', hello: '¡Croac! ¡Vamos a leer palabras!' },
  fr: { sub: 'Regarde l’image et construis le mot !', look: 'Regarde l’image et écoute', tap: 'Touche les lettres pour former le mot', heart: 'Une mauvaise lettre coûte un cœur', hear: 'Écouter le mot', hello: 'Croâ ! Lisons des mots !' },
  de: { sub: 'Schau dir das Bild an und bau das Wort!', look: 'Schau das Bild an und hör zu', tap: 'Tippe auf die Buchstaben, um das Wort zu bauen', heart: 'Ein falscher Buchstabe kostet ein Herz', hear: 'Wort anhören', hello: 'Quak! Lass uns Wörter lesen!' },
  it: { sub: 'Guarda l’immagine e costruisci la parola!', look: 'Guarda l’immagine e ascolta', tap: 'Tocca le lettere per formare la parola', heart: 'Una lettera sbagliata costa un cuore', hear: 'Ascolta la parola', hello: 'Cra cra! Leggiamo qualche parola!' },
  pt: { sub: 'Olhe a figura e monte a palavra!', look: 'Olhe a figura e escute', tap: 'Toque nas letras para montar a palavra', heart: 'Uma letra errada custa um coração', hear: 'Ouvir a palavra', hello: 'Croac! Vamos ler palavras!' },
  nl: { sub: 'Kijk naar het plaatje en bouw het woord!', look: 'Kijk naar het plaatje en luister', tap: 'Tik op de letters om het woord te bouwen', heart: 'Een verkeerde letter kost een hartje', hear: 'Luister naar het woord', hello: 'Kwaak! Laten we woordjes lezen!' },
  ru: { sub: 'Посмотри на картинку и собери слово!', look: 'Посмотри на картинку и послушай', tap: 'Нажимай на буквы, чтобы собрать слово', heart: 'Неверная буква стоит сердечко', hear: 'Послушать слово', hello: 'Ква! Давай читать слова!' },
  he: { sub: 'הסתכלו בתמונה ובנו את המילה!', look: 'הסתכלו בתמונה והקשיבו', tap: 'הקישו על האותיות כדי לבנות את המילה', heart: 'אות שגויה עולה לב אחד', hear: 'לשמוע את המילה', hello: 'קוואק! בואו נקרא מילים!' },
  ar: { sub: 'انظر إلى الصورة وكوّن الكلمة!', look: 'انظر إلى الصورة واستمع', tap: 'انقر على الحروف لتكوّن الكلمة', heart: 'الحرف الخطأ يكلّفك قلباً', hear: 'استمع إلى الكلمة', hello: 'نق نق! هيا نقرأ بعض الكلمات!' },
  ja: { sub: 'えを みて ことばを つくろう！', look: 'えを みて きいてね', tap: 'もじを タップして ことばを つくろう', heart: 'まちがえると ハートが へるよ', hear: 'ことばを きく', hello: 'ケロッ！ことばを よもう！' },
  'zh-Hant': { sub: '看看圖片，拼出單字！', look: '看圖片，仔細聽', tap: '點字母拼出單字', heart: '選錯字母會少一顆心', hear: '聽單字', hello: '呱呱！一起來讀單字吧！' },
};
const SET = [
  '                              ',
  '                              ',
  '                              ',
  '                              ',
  '                              ',
  '           P      N           ',
  '##############################',
  '##############################',
];

const O = window.Oomba;
let card = null;
function frame(w) {
  // a close set: the cast big beside the card (10 cells across, 7 high; 4.6 across on a phone in portrait, where the
  // two step in toward the middle), with just a lip of soil under them
  const V = w.stage.view, C = w.cam, L = w.level, tall = V.vh > V.vw * 1.1, z = tall ? V.vw / (4.6 * w.cell) : Math.min(V.vw / (10 * w.cell), V.vh / (7 * w.cell));
  C.bounds(null); C.zoom = z; C.x = L.w / 2; C.y = L.h - w.cell * 1.4 - V.vh / z / 2;
  const host = w.find('host'); if (host && w.hero) { const d = (tall ? 1.25 : 3.5) * w.cell; host.x = L.w / 2 + d; w.hero.x = L.w / 2 - d; }
}
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
function speak(word) {
  if (!CONFIG.readAloud || !window.BRB || (BRB.sfx && BRB.sfx.muted) || O.settings.readAloud === false) return;
  BRB.speak(word.toLowerCase(), { lang: CONFIG.speechLang, rate: CONFIG.wordRate });
}
const clear = () => { if (card) card.remove(); card = null; };
/** One word: resolves true when it is spelled (or false when the round ended). */
function spell(w, word, art, missing) {
  return new Promise(resolve => {
    let stop = null;
    const done = ok => { if (stop) stop(); resolve(ok); };
    clear();
    card = el('div', 'wd'); card.setAttribute('role', 'group');
    const pic = el('div', 'wd-pic'); pic.appendChild(O.art.toCanvas(art, 240));
    pic.appendChild(O.ui.button(O.t('hear'), { kind: 'icon', icon: O.icon('speak'), onPress: () => speak(word) }));
    const slots = el('div', 'wd-slots'), keys = el('div', 'wd-keys');
    card.append(pic, slots, keys); O.ui.root().appendChild(card);
    const letters = [...word], gap = w.rand.int(0, letters.length - 1);
    const filled = letters.map((ch, i) => (missing && i !== gap ? ch : null));
    const boxes = letters.map((ch, i) => { const b = el('div', 'wd-slot' + (filled[i] ? ' wd-on' : ''), filled[i] || ''); slots.appendChild(b); return b; });
    let tiles = missing ? [letters[gap]] : letters.slice();
    if (missing) while (tiles.length < CONFIG.choices) { const x = String.fromCharCode(65 + w.rand.int(0, 25)); if (!tiles.includes(x)) tiles.push(x); }
    tiles = w.rand.shuffle(tiles);
    let mistakes = 0;
    tiles.forEach(ch => {
      const k = O.ui.button(ch, { kind: 'quiet', onPress: () => {
        if (w.ended || w.scene !== 'play') return;
        const at = filled.indexOf(null);
        if (letters[at] === ch) {
          filled[at] = ch; boxes[at].textContent = ch; boxes[at].classList.add('wd-on'); O.juice.pop(boxes[at]); k.disabled = true;
          O.sfx('pop', { pitch: 1 + at * 0.08 });
          if (!filled.includes(null)) {
            O.ui.banner('correct'); O.sfx('correct'); speak(word);
            w.score(CONFIG.pointsPerWord + (mistakes ? 0 : CONFIG.perfectBonus));
            w.hero.state('cheer'); w.find('host').state('cheer');
            O.after(1200, () => { w.hero.state('idle'); done(true); });
          }
        } else {
          mistakes++; O.juice.shake(0.4, k); O.sfx('wrong', { volume: 0.6 }); w.hurt();
        }
      } });
      k.classList.add('wd-key'); keys.appendChild(k);
    });
    speak(word);
    stop = O.every(250, () => { if (w.ended) done(false); });
  });
}
async function play(w) {
  await w.say(w.find('host'), 'hello');
  const list = w.rand.shuffle(WORD_LIST.slice()).slice(0, CONFIG.wordsPerRound);
  for (let i = 0; i < list.length; i++) {
    if (w.hud.count) w.hud.count.set(i + 1, list.length);
    if (w.ended || !(await spell(w, list[i][0], list[i][1], i < CONFIG.missingLetterRounds))) return;
  }
  clear();
  const lost = CONFIG.hearts - w.lives;
  w.win({ stars: lost <= 0 ? 3 : lost <= 2 ? 2 : 1 });
}

const game = O.game({
  api: 1, title: CONFIG.title, subtitle: 'sub', biome: CONFIG.biome,
  controls: 'none', camera: 'fixed', heroSize: 2.1, hero: 'me', titleHero: O.char(CONFIG.host),
  hud: ['score', 'lives:' + CONFIG.hearts, 'count:flag'],
  howTo: [{ icon: 'speak', text: 'look' }, { icon: 'tap', text: 'tap' }, { icon: 'heart', text: 'heart' }],
  strings: WORDS,
  level: O.level.grid(SET, { N: Object.assign({ kind: 'npc', tag: 'host', flip: true, size: 2.3 }, CONFIG.host) }),
  setup: clear,
  update: frame,
  on: { start: play, results: clear, lose: clear },
});
</script>
