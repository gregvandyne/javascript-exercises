<title>Ocean Memory</title>
<style>
/* The cards: real buttons in the kit's UI layer (keyboard, screen readers), styled with the kit's own colour variables. */
.mm-grid{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);display:grid;gap:10px;z-index:1}
.mm-card{position:relative;padding:0;border:0;background:none;cursor:pointer;perspective:600px;font:inherit}
.mm-in{position:absolute;inset:0;transition:transform 260ms cubic-bezier(.34,1.56,.64,1);transform-style:preserve-3d}
.mm-up .mm-in,.mm-done .mm-in{transform:rotateY(180deg)}
.mm-back,.mm-face{position:absolute;inset:0;border-radius:16px;border:3px solid var(--ok-edge);box-shadow:0 4px 0 var(--ok-edge);backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.mm-back{background:repeating-linear-gradient(45deg,var(--mm-back) 0 14px,var(--mm-back2) 14px 28px);color:var(--ok-text)}
.mm-back svg{background:var(--ok-card);border-radius:50%;padding:6%;border:3px solid var(--ok-edge)}
.mm-back svg{width:42%;height:42%}
.mm-face{background:var(--ok-card);transform:rotateY(180deg)}
.mm-face canvas{max-width:80%;max-height:80%}
.mm-done .mm-face{box-shadow:0 0 0 4px var(--ok-focus)}
.mm-tick{position:absolute;inset-inline-end:6px;top:6px;width:24px;height:24px;display:none}
.mm-done .mm-tick{display:block}
.ok-rm .mm-in{transition:none}
</style>
<div id="game"></div>
<!--KIT-->
<!--PACK:dress-->
<!--PACK:art-animals-->
<!--PACK:art-biomes-->
<script>
// Memory Match, on the Oomba Kit: one Oomba.game call (controls: 'none') for the screens, HUD, timer, pause and
// results; the cards are buttons in the kit's UI layer showing kit characters. Three levels: more pairs each time
// (the results screen's Next goes on). Fewer wrong flips means more stars.
'use strict';
const CONFIG = {
  title: 'Ocean Memory',
  host: { species: 'penguin' },
  biome: 'reef',
  cardColor: 'water',
  pictures: ['fox', 'bunny', 'frog', 'bee', 'owl', 'penguin', 'duck', 'cat', 'dog', 'bear', 'mouse', 'oomba'],
  pairs: [6, 8, 10],
  seconds: 90,
  peekSeconds: 1.5,
  pointsPerPair: 100,
  streakBonus: 50,
};
const WORDS = {
  en: { sub: 'Flip two cards. Find all the pairs before the clock runs out!', flip: 'Tap a card to flip it', pair: 'Find the two that match', clock: 'Be quick: the clock is ticking!', match: 'Match!', card: 'Card {n}' },
  es: { sub: 'Da la vuelta a dos cartas. ¡Encuentra todas las parejas antes de que se acabe el tiempo!', flip: 'Toca una carta para darle la vuelta', pair: 'Busca las dos iguales', clock: '¡Rápido: el reloj corre!', match: '¡Pareja!', card: 'Carta {n}' },
  fr: { sub: 'Retourne deux cartes. Trouve toutes les paires avant la fin du temps !', flip: 'Touche une carte pour la retourner', pair: 'Trouve les deux pareilles', clock: 'Vite : le temps passe !', match: 'Paire !', card: 'Carte {n}' },
  de: { sub: 'Dreh zwei Karten um. Finde alle Paare, bevor die Zeit um ist!', flip: 'Tippe auf eine Karte, um sie umzudrehen', pair: 'Finde die zwei gleichen', clock: 'Schnell: Die Uhr läuft!', match: 'Paar!', card: 'Karte {n}' },
  it: { sub: 'Gira due carte. Trova tutte le coppie prima che finisca il tempo!', flip: 'Tocca una carta per girarla', pair: 'Trova le due uguali', clock: 'Veloce: il tempo scorre!', match: 'Coppia!', card: 'Carta {n}' },
  pt: { sub: 'Vire duas cartas. Ache todos os pares antes que o tempo acabe!', flip: 'Toque numa carta para virar', pair: 'Ache as duas iguais', clock: 'Rápido: o relógio está correndo!', match: 'Par!', card: 'Carta {n}' },
  nl: { sub: 'Draai twee kaarten om. Vind alle paren voordat de tijd op is!', flip: 'Tik op een kaart om hem om te draaien', pair: 'Zoek de twee die hetzelfde zijn', clock: 'Snel: de klok tikt!', match: 'Paar!', card: 'Kaart {n}' },
  ru: { sub: 'Переверни две карточки. Найди все пары, пока не кончилось время!', flip: 'Нажми на карточку, чтобы перевернуть', pair: 'Найди две одинаковые', clock: 'Скорее: время идёт!', match: 'Пара!', card: 'Карточка {n}' },
  he: { sub: 'הפכו שני קלפים. מצאו את כל הזוגות לפני שהזמן נגמר!', flip: 'הקישו על קלף כדי להפוך אותו', pair: 'מצאו את שני הקלפים הזהים', clock: 'מהר: השעון מתקתק!', match: 'זוג!', card: 'קלף {n}' },
  ar: { sub: 'اقلب بطاقتين. اعثر على كل الأزواج قبل أن ينتهي الوقت!', flip: 'انقر على بطاقة لتقلبها', pair: 'اعثر على البطاقتين المتشابهتين', clock: 'أسرع: الوقت يمضي!', match: 'زوج!', card: 'البطاقة {n}' },
  ja: { sub: 'カードを 2まい めくって、じかん内に ぜんぶの ペアを みつけよう！', flip: 'カードを タップして めくろう', pair: 'おなじ 2まいを さがそう', clock: 'いそいで！とけいが すすんでるよ', match: 'ペア！', card: 'カード {n}' },
  'zh-Hant': { sub: '翻開兩張牌，在時間用完前找出所有配對！', flip: '點一下牌就能翻開', pair: '找出兩張一樣的', clock: '快一點：時間在走！', match: '配對成功！', card: '第 {n} 張牌' },
};
const SET = [
  '                              ',
  '                              ',
  '                              ',
  '                              ',
  '                              ',
  '           P      N           ',
  '##############################',
  '##############################',
];

const O = window.Oomba;
let grid = null, cards = [], open = [], misses = 0, streak = 0, left = 0, busy = false;
const level = w => Math.max(0, LEVELS.indexOf(w.level));
function frame(w) {
  // a close set: the cast big beside the card (10 cells across, 7 high; 4.6 across on a phone in portrait, where the
  // two step in toward the middle), with just a lip of soil under them
  const V = w.stage.view, C = w.cam, L = w.level, tall = V.vh > V.vw * 1.1, z = tall ? V.vw / (4.6 * w.cell) : Math.min(V.vw / (10 * w.cell), V.vh / (7 * w.cell));
  C.bounds(null); C.zoom = z; C.x = L.w / 2; C.y = L.h - w.cell * 1.4 - V.vh / z / 2;
  const host = w.find('host'); if (host && w.hero) { const d = (tall ? 1.25 : 3.5) * w.cell; host.x = L.w / 2 + d; w.hero.x = L.w / 2 - d; }
}
/** Lay the cards out as big as the screen allows, above the characters. */
function layout() {
  if (!grid) return;
  const W = innerWidth - 24, H = innerHeight - 76 - Math.min(170, innerHeight * 0.24), n = cards.length;
  let best = { s: 0, c: 4 };
  for (let c = 2; c <= 8; c++) { const r = Math.ceil(n / c), s = Math.min((W - (c - 1) * 10) / c, (H - (r - 1) * 10) / r / 1.15); if (s > best.s) best = { s, c }; }
  const s = Math.max(48, Math.floor(Math.min(best.s, 150)));
  grid.style.gridTemplateColumns = `repeat(${best.c}, ${s}px)`;
  for (const c of cards) { c.el.style.width = s + 'px'; c.el.style.height = Math.round(s * 1.15) + 'px'; }
}
function deal(w) {
  if (grid) grid.remove();
  const pairs = CONFIG.pairs[level(w)] || CONFIG.pairs[0];
  const pics = w.rand.shuffle(CONFIG.pictures.slice()).slice(0, pairs);
  grid = document.createElement('div'); grid.className = 'mm-grid'; grid.style.setProperty('--mm-back', O.color(CONFIG.cardColor, 'light')); grid.style.setProperty('--mm-back2', O.color(CONFIG.cardColor));   // a two-tone diagonal pattern on the backs
  cards = w.rand.shuffle(pics.concat(pics)).map((pic, i) => {
    const el = document.createElement('button'); el.type = 'button'; el.className = 'mm-card';
    el.setAttribute('aria-label', O.t('card', { n: i + 1 }));
    el.innerHTML = `<span class="mm-in"><span class="mm-back">${O.icon('question')}</span><span class="mm-face"><span class="mm-tick">${O.icon('check')}</span></span></span>`;
    el.querySelector('.mm-face').prepend(O.art.toCanvas(pic, 120));
    const card = { el, pic, up: false, done: false };
    el.addEventListener('click', () => flip(w, card));
    grid.appendChild(el); return card;
  });
  O.ui.root().appendChild(grid); layout();
  open = []; misses = 0; streak = 0; left = pairs; busy = true;
  show(true);
  O.after(CONFIG.peekSeconds * 1000, () => { show(false); busy = false; });
}
function show(up) { for (const c of cards) if (!c.done) { c.up = up; c.el.classList.toggle('mm-up', up); } }
function flip(w, card) {
  if (busy || card.up || card.done || w.scene !== 'play') return;
  card.up = true; card.el.classList.add('mm-up'); card.el.setAttribute('aria-pressed', 'true');
  O.sfx('pop', { pitch: 1.1 });
  open.push(card);
  if (open.length < 2) return;
  const [a, b] = open; open = []; busy = true;
  if (a.pic === b.pic) {
    a.done = b.done = true; streak++; left--;
    O.after(250, () => {
      for (const c of [a, b]) { c.el.classList.add('mm-done'); O.juice.pop(c.el); }
      O.sfx('correct'); O.ui.announce(O.t('match'));
      w.score(CONFIG.pointsPerPair + (streak - 1) * CONFIG.streakBonus);
      w.hero.state('cheer'); w.find('host').state('cheer');
      busy = false;
      if (!left) { const stars = misses <= 2 ? 3 : misses <= 6 ? 2 : 1; O.after(500, () => w.win({ stars })); }
    });
  } else {
    streak = 0; misses++;
    O.after(800, () => {
      for (const c of [a, b]) { c.up = false; c.el.classList.remove('mm-up'); c.el.setAttribute('aria-pressed', 'false'); O.juice.shake(0.3, c.el); }
      O.sfx('wrong', { volume: 0.5 }); busy = false;
    });
  }
}
const clear = () => { if (grid) grid.remove(); grid = null; cards = []; };
const LEVELS = CONFIG.pairs.map(() => O.level.grid(SET, { N: Object.assign({ kind: 'npc', tag: 'host', flip: true, size: 2.3 }, CONFIG.host) }));

const game = O.game({
  api: 1, title: CONFIG.title, subtitle: 'sub', biome: CONFIG.biome,
  controls: 'none', camera: 'fixed', heroSize: 2.1, hero: 'me', titleHero: O.char(CONFIG.host),
  hud: ['score', 'timer:' + CONFIG.seconds],
  howTo: [{ icon: 'tap', text: 'flip' }, { icon: 'eye', text: 'pair' }, { icon: 'clock', text: 'clock' }],
  strings: WORDS,
  level: LEVELS,
  setup: clear,
  update: frame,
  on: { start: deal, results: clear, lose: clear },
});
addEventListener('resize', layout);
</script>
