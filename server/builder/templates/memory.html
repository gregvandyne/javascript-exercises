<title>Ocean Memory Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: HUD on top, then a grid of flip cards sized by script to fit the screen. Overlays for title, level done, pause, results. */
:root{
  --bg1:#38bdf8; --bg2:#1e40af; --ink:#0c2a4d; --accent:#f97316; --accentDark:#c2410c; --cardBack:#0ea5e9; --cardBack2:#0369a1;
  --good:#22c55e; --card:#fff; --font:"Fredoka","Trebuchet MS",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;font-family:var(--font);color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));touch-action:manipulation;user-select:none;-webkit-user-select:none}
#bgArt{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.app{position:relative;height:100%;display:flex;flex-direction:column;gap:10px;padding:10px max(12px,env(safe-area-inset-left)) 12px max(12px,env(safe-area-inset-right))}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #ffd23f;outline-offset:2px}
.hud{display:flex;align-items:center;gap:6px;max-width:640px;width:100%;margin:0 auto}
.hud .grow{flex:1;display:flex;justify-content:center;gap:4px;min-width:0}
.pill{background:rgba(255,255,255,.94);border-radius:999px;padding:6px 8px;font-weight:700;font-size:.98rem;box-shadow:0 3px 0 rgba(0,0,0,.15);white-space:nowrap}
.pill.low{background:#fee2e2;color:#b91c1c}
.icon-btn{width:46px;height:46px;flex:none;border:0;border-radius:50%;background:#fff;font-size:1.35rem;box-shadow:0 4px 0 rgba(0,0,0,.18);display:grid;place-items:center;padding:0}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.board{flex:1;min-height:0;display:grid;place-items:center}
.grid{display:grid;gap:10px}
.card{position:relative;border:0;padding:0;background:none;perspective:700px;border-radius:16px}
.flip{position:absolute;inset:0;transition:transform .4s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.card.up .flip,.card.done .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.back{background:var(--cardBack);overflow:hidden}
.back svg{width:100%;height:100%}
.front{background:var(--card);transform:rotateY(180deg);font-size:var(--emoji,2.4rem);line-height:1;border:4px solid #e0f2fe}
.card.done .front{border-color:var(--good);background:#ecfdf5}
.card.done{animation:matched .5s ease-out}
.card.nope .flip{animation:nope .45s}
@keyframes matched{40%{transform:scale(1.12)}}
@keyframes nope{20%{translate:-6px 0}40%{translate:6px 0}60%{translate:-4px 0}80%{translate:4px 0}}
.spark{position:fixed;pointer-events:none;font-size:1.3rem;z-index:6}
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(12,42,77,.35)}
.panel{background:var(--card);border-radius:28px;padding:22px 20px;width:min(100%,420px);max-height:100%;overflow:auto;text-align:center;
  box-shadow:0 10px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;gap:12px}
.panel h1{margin:0;font-size:clamp(2rem,9vw,2.6rem);line-height:1.05;color:var(--accent)}
.panel p{margin:0;font-size:1.1rem;line-height:1.35}
.fan{width:200px;height:120px}
.big-btn{border:0;border-radius:20px;background:var(--accent);color:#fff;font-weight:700;font-size:1.5rem;padding:14px 34px;min-height:60px;min-width:200px;box-shadow:0 6px 0 var(--accentDark)}
.big-btn.alt{background:#e0f2fe;color:var(--ink);box-shadow:0 6px 0 #a5d8f5;font-size:1.2rem;min-height:52px}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accentDark)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{font-weight:700;background:#fff4cc;border-radius:999px;padding:6px 14px}
.stars{display:flex;gap:6px}
.stars svg{width:56px;height:56px}
.stars svg.on{animation:starIn .5s both}
.stars svg:nth-child(2){animation-delay:.2s}.stars svg:nth-child(3){animation-delay:.4s}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
.newbest{background:var(--good);color:#fff;border-radius:999px;padding:4px 14px;font-weight:700}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:8;background:#fff;border-radius:999px;padding:10px 22px;font-weight:700;font-size:1.4rem;box-shadow:0 6px 0 rgba(0,0,0,.18);pointer-events:none;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.flip{transition:none}.card.done,.card.nope .flip,.stars svg.on{animation:none}#bgArt *{animation:none!important}}
</style>

<!-- Bubbles rising slowly behind the cards -->
<svg id="bgArt" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <style>.b{fill:none;stroke:#fff;stroke-width:3;opacity:.35;animation:rise 14s linear infinite}.b2{animation-duration:19s;animation-delay:-6s}.b3{animation-duration:23s;animation-delay:-11s}
  @keyframes rise{from{transform:translateY(120px)}to{transform:translateY(-820px)}}</style>
  <path d="M0 640q60-30 120 0t120 0 120 0 120 0V700H0z" fill="#fcd9a0" opacity=".9"/>
  <path d="M30 640c-6-40 10-70 0-110M46 640c8-30-6-60 6-90" stroke="#22c55e" stroke-width="7" fill="none" stroke-linecap="round" opacity=".7"/>
  <path d="M350 640c-8-50 12-80 0-120" stroke="#16a34a" stroke-width="8" fill="none" stroke-linecap="round" opacity=".7"/>
  <circle class="b" cx="60" cy="700" r="10"/><circle class="b b2" cx="150" cy="720" r="6"/><circle class="b b3" cx="250" cy="700" r="12"/>
  <circle class="b b2" cx="330" cy="740" r="8"/><circle class="b b3" cx="100" cy="760" r="5"/><circle class="b" cx="300" cy="790" r="7" style="animation-delay:-4s"/>
</svg>

<!-- Card back pattern (reused by every card) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="backArt" viewBox="0 0 100 130" preserveAspectRatio="xMidYMid slice">
    <rect width="100" height="130" fill="var(--cardBack)"/>
    <g fill="#fff" opacity=".14"><circle cx="0" cy="0" r="22"/><circle cx="100" cy="0" r="22"/><circle cx="0" cy="130" r="22"/><circle cx="100" cy="130" r="22"/><circle cx="50" cy="65" r="40"/></g>
    <rect x="8" y="8" width="84" height="114" rx="12" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 6" opacity=".5"/>
    <circle cx="50" cy="65" r="24" fill="var(--cardBack2)"/>
    <text x="50" y="80" font-size="40" font-weight="700" font-family="Fredoka,Trebuchet MS,sans-serif" text-anchor="middle" fill="#fff">?</text>
  </symbol>
</svg>

<div class="app">
  <div class="hud">
    <button class="icon-btn" id="pauseBtn" aria-label="Pause">⏸️</button>
    <div class="grow">
      <div class="pill" id="levelEl">Lv 1</div>
      <div class="pill" id="movesEl" aria-label="Moves">👆 0</div>
      <div class="pill" id="timeEl" aria-label="Time left">⏱ 0</div>
      <div class="pill" id="scoreEl" aria-label="Score">⭐ 0</div>
    </div>
    <button class="icon-btn mute" aria-label="Turn sound off">🔊</button>
  </div>
  <div class="board" id="board"><div class="grid" id="grid" role="grid" aria-label="Memory cards"></div></div>
</div>

<section class="screen" id="titleScreen">
  <div class="panel">
    <svg class="fan" viewBox="0 0 200 120" aria-hidden="true">
      <g transform="rotate(-14 100 140)"><rect x="30" y="20" width="62" height="84" rx="10" fill="#fff" stroke="#e0f2fe" stroke-width="4"/><text x="61" y="72" font-size="34" text-anchor="middle" id="fanA">🐙</text></g>
      <g transform="rotate(14 100 140)"><rect x="108" y="20" width="62" height="84" rx="10" fill="#fff" stroke="#e0f2fe" stroke-width="4"/><text x="139" y="72" font-size="34" text-anchor="middle" id="fanB">🐙</text></g>
      <g><svg x="69" y="10" width="62" height="88"><use href="#backArt"/></svg></g>
    </svg>
    <h1 id="titleText">Ocean Memory</h1>
    <p id="subtitleText">Flip two cards. Find all the pairs before the clock runs out!</p>
    <div class="chip" id="bestTitle">🏆 Best: 0</div>
    <button class="big-btn" id="playBtn">▶ Play</button>
    <p style="font-size:.95rem">Tap cards · Keys: arrows + Enter · P = pause</p>
    <button class="icon-btn mute" aria-label="Turn sound off">🔊</button>
  </div>
</section>

<section class="screen" id="levelScreen" hidden>
  <div class="panel">
    <h1 id="levelTitle">Level 1 done!</h1>
    <div class="stars" id="levelStars"></div>
    <p id="levelLine"></p>
    <button class="big-btn" id="nextLevelBtn">Next level ➜</button>
  </div>
</section>

<section class="screen" id="pauseScreen" hidden>
  <div class="panel">
    <h1>Paused</h1>
    <button class="big-btn" id="resumeBtn">▶ Keep going</button>
    <button class="big-btn alt" id="restartBtn">↺ Start over</button>
    <button class="icon-btn mute" aria-label="Turn sound off">🔊</button>
  </div>
</section>

<section class="screen" id="resultScreen" hidden>
  <div class="panel">
    <h1 id="resultTitle">Memory master!</h1>
    <div class="stars" id="resultStars"></div>
    <p id="resultLine"></p>
    <div class="chips"><div class="chip" id="resultScore">⭐ 0</div><div class="chip" id="bestResult">🏆 Best: 0</div></div>
    <div class="newbest" id="newBest" hidden>New best score!</div>
    <button class="big-btn" id="againBtn">↺ Play again</button>
  </div>
</section>

<script>
/* =====================================================================
   CONFIG: change these to make the memory game your own!
   ===================================================================== */
const CONFIG = {
  title: 'Ocean Memory',
  subtitle: 'Flip two cards. Find all the pairs before the clock runs out!',
  colors: { bg1: '#38bdf8', bg2: '#1e40af', accent: '#f97316', accentDark: '#c2410c', cardBack: '#0ea5e9', cardBack2: '#0369a1' },
  // Card pictures: each one appears twice. Need at least as many as the biggest level's pairs.
  pictures: ['🐙', '🐠', '🐳', '🦀', '🐢', '🐬', '🦈', '⭐', '🐚', '🦑', '🐡', '🪼'],
  levels: [
    { pairs: 6, seconds: 50 },    // 12 cards (4 x 3)
    { pairs: 8, seconds: 70 },    // 16 cards (4 x 4)
    { pairs: 10, seconds: 90 },   // 20 cards (4 x 5)
  ],
  peekSeconds: 1.5,               // show all cards for a moment at the start of each level
  pointsPerPair: 100,
  pointsPerSecondLeft: 5,
  streakBonus: 50,                // extra for matching pairs in a row
  cheers: ['Match!', 'Great memory!', 'Splash!', 'Yes!', 'Super!'],
  saveKey: 'memory-best',
};

/* ===== Shell helpers ===== */
const $ = id => document.getElementById(id);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pick = list => list[Math.floor(Math.random() * list.length)];
const shuffle = list => { const a = list.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
for (const k in CONFIG.colors) document.documentElement.style.setProperty('--' + k, CONFIG.colors[k]);
document.title = CONFIG.title;
$('titleText').textContent = CONFIG.title;
$('subtitleText').textContent = CONFIG.subtitle;
$('fanA').textContent = CONFIG.pictures[0]; $('fanB').textContent = CONFIG.pictures[0];
function showScreen(id) { document.querySelectorAll('.screen').forEach(s => { s.hidden = s.id !== id; }); }
function updateMute() {
  document.querySelectorAll('.mute').forEach(b => { b.textContent = BRB.sfx.muted ? '🔇' : '🔊'; b.setAttribute('aria-label', BRB.sfx.muted ? 'Turn sound on' : 'Turn sound off'); });
}
document.querySelectorAll('.mute').forEach(b => b.addEventListener('click', () => { BRB.sfx.mute(); updateMute(); BRB.sfx.play('click'); }));
updateMute();
let best = +BRB.storage.get(CONFIG.saveKey) || 0;
$('bestTitle').textContent = '🏆 Best: ' + best;
function starSvg(on) {
  return '<svg viewBox="0 0 50 50" class="' + (on ? 'on' : '') + '"><path d="M25 3l6.5 14 15 1.6-11.3 10.2 3.2 15L25 36.2 11.6 43.8l3.2-15L3.5 18.6l15-1.6z" fill="' +
    (on ? '#ffc83d' : '#e2e8f0') + '" stroke="' + (on ? '#e09a00' : '#cbd5e1') + '" stroke-width="3" stroke-linejoin="round"/></svg>';
}

/* ===== Game state ===== */
let level = 0, score = 0, moves = 0, timeLeft = 0, streak = 0, starsTotal = 0;
let open = [], matched = 0, locked = true, playing = false, paused = false, cols = 4, rows = 3;

function startGame() { level = 0; score = 0; starsTotal = 0; showScreen(null); BRB.sfx.play('powerup'); startLevel(); }

function startLevel() {
  const L = CONFIG.levels[level];
  moves = 0; streak = 0; matched = 0; open = []; timeLeft = L.seconds; playing = true; paused = false; locked = true;
  const deck = shuffle(shuffle(CONFIG.pictures).slice(0, L.pairs).flatMap(p => [p, p]));
  const grid = $('grid'); grid.innerHTML = '';
  deck.forEach((pic, i) => {
    const b = document.createElement('button');
    b.className = 'card up'; b.dataset.pic = pic; b.dataset.i = i; b.setAttribute('aria-label', 'Hidden card');
    b.innerHTML = '<div class="flip"><div class="face back"><svg><use href="#backArt"/></svg></div><div class="face front">' + pic + '</div></div>';
    b.addEventListener('click', () => flip(b));
    grid.appendChild(b);
  });
  layout(); updateHud();
  toast('Level ' + (level + 1) + ' · Peek!');
  // Peek, then hide all cards and start the clock
  setTimeout(() => {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('up'));
    locked = false; BRB.sfx.play('click');
    const first = document.querySelector('.card'); if (first) first.focus({ preventScroll: true });
  }, CONFIG.peekSeconds * 1000 + 400);
}

/* Fit the grid: try every column count and keep the one with the biggest cards */
function layout() {
  const n = document.querySelectorAll('.card').length; if (!n) return;
  const box = $('board').getBoundingClientRect(), gap = 10;
  let bestSize = 0;
  for (let c = 2; c <= n; c++) {
    if (n % c) continue;
    const r = n / c;
    const w = Math.min((box.width - gap * (c - 1)) / c, ((box.height - gap * (r - 1)) / r) * 0.78);
    if (w > bestSize) { bestSize = w; cols = c; rows = r; }
  }
  const cw = Math.floor(Math.min(bestSize, 130)), ch = Math.floor(cw / 0.78);
  const grid = $('grid');
  grid.style.gridTemplateColumns = 'repeat(' + cols + ',' + cw + 'px)';
  grid.style.gridAutoRows = ch + 'px';
  grid.style.setProperty('--emoji', Math.round(cw * 0.55) + 'px');
}
addEventListener('resize', layout);

function flip(card) {
  if (locked || paused || !playing || card.classList.contains('up') || card.classList.contains('done')) return;
  card.classList.add('up'); card.setAttribute('aria-label', 'Card ' + card.dataset.pic);
  BRB.sfx.play('click');
  open.push(card);
  if (open.length < 2) return;
  moves++; locked = true; updateHud();
  const [a, b] = open;
  if (a.dataset.pic === b.dataset.pic) {
    setTimeout(() => {
      a.classList.add('done'); b.classList.add('done'); open = []; locked = false; matched++; streak++;
      const gain = CONFIG.pointsPerPair + (streak > 1 ? CONFIG.streakBonus * (streak - 1) : 0);
      score += gain; updateHud();
      BRB.sfx.play(streak > 1 ? 'powerup' : 'coin'); sparkle(a); sparkle(b);
      toast((streak > 1 ? streak + ' in a row! ' : pick(CONFIG.cheers) + ' ') + '+' + gain);
      if (matched === CONFIG.levels[level].pairs) levelDone();
    }, 350);
  } else {
    streak = 0;
    setTimeout(() => { a.classList.add('nope'); b.classList.add('nope'); BRB.sfx.play('hit'); }, 450);
    setTimeout(() => {
      [a, b].forEach(c => { c.classList.remove('up', 'nope'); c.setAttribute('aria-label', 'Hidden card'); });
      open = []; locked = false;
    }, 1000);
  }
}

function starsFor(pairs, m) { return m <= pairs * 1.5 ? 3 : m <= pairs * 2.2 ? 2 : 1; }

function levelDone() {
  playing = false;
  const L = CONFIG.levels[level];
  const stars = starsFor(L.pairs, moves);
  const bonus = Math.ceil(timeLeft) * CONFIG.pointsPerSecondLeft + stars * 100;
  score += bonus; starsTotal += stars; updateHud();
  if (level === CONFIG.levels.length - 1) return setTimeout(() => endGame(true), 700);
  BRB.sfx.play('win');
  setTimeout(() => {
    $('levelTitle').textContent = 'Level ' + (level + 1) + ' done!';
    $('levelStars').innerHTML = [0, 1, 2].map(i => starSvg(i < stars)).join('');
    $('levelLine').textContent = moves + ' moves · time bonus +' + bonus;
    showScreen('levelScreen'); $('nextLevelBtn').focus({ preventScroll: true });
  }, 600);
}
function nextLevel() { level++; showScreen(null); BRB.sfx.play('click'); startLevel(); }

function endGame(won) {
  playing = false; locked = true;
  const isBest = score > best;
  if (isBest) { best = score; BRB.storage.set(CONFIG.saveKey, best); }
  BRB.score.submit(score, won ? starsTotal + ' stars' : 'Level ' + (level + 1));
  BRB.gameOver({ won, score });
  BRB.sfx.play(won ? 'win' : 'lose');
  if (won || isBest) BRB.fx.confetti();
  const maxStars = CONFIG.levels.length * 3, avg = won ? Math.round(starsTotal / maxStars * 3) : 0;
  $('resultTitle').textContent = won ? 'Memory master!' : 'Time’s up!';
  $('resultStars').innerHTML = [0, 1, 2].map(i => starSvg(i < avg)).join('');
  $('resultLine').textContent = won ? 'You found every pair and earned ' + starsTotal + ' of ' + maxStars + ' stars!' : 'You reached level ' + (level + 1) + '. Try again and be quick!';
  $('resultScore').textContent = '⭐ ' + score;
  $('bestResult').textContent = '🏆 Best: ' + best;
  $('bestTitle').textContent = '🏆 Best: ' + best;
  $('newBest').hidden = !isBest;
  showScreen('resultScreen'); $('againBtn').focus({ preventScroll: true });
}

/* ===== HUD and juice ===== */
function updateHud() {
  $('levelEl').textContent = 'Lv ' + (level + 1);
  $('movesEl').textContent = '👆 ' + moves;
  $('timeEl').textContent = '⏱ ' + Math.ceil(timeLeft);
  $('timeEl').classList.toggle('low', timeLeft <= 10 && playing);
  $('scoreEl').textContent = '⭐ ' + score;
}
let toastEl = null;
function toast(text) {
  if (toastEl) toastEl.remove();
  const t = toastEl = document.createElement('div'); t.className = 'toast'; t.textContent = text; document.body.appendChild(t);
  const anim = REDUCED ? [{ opacity: 1 }, { opacity: 1 }, { opacity: 0 }] : [{ transform: 'translate(-50%,-50%) scale(.5)', opacity: 0 }, { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: 0.2 }, { transform: 'translate(-50%,-70%) scale(1)', opacity: 0 }];
  t.animate(anim, { duration: 1100, easing: 'ease-out' }).onfinish = () => t.remove();
}
function sparkle(el) {
  if (REDUCED) return;
  const r = el.getBoundingClientRect();
  for (let i = 0; i < 8; i++) {
    const s = document.createElement('div'); s.className = 'spark'; s.textContent = pick(['✨', '⭐', '💧']);
    s.style.left = r.left + r.width / 2 + 'px'; s.style.top = r.top + r.height / 2 + 'px'; document.body.appendChild(s);
    const a = Math.random() * 6.28, d = 40 + Math.random() * 50;
    s.animate([{ transform: 'translate(-50%,-50%) scale(.5)', opacity: 1 }, { transform: 'translate(calc(-50% + ' + Math.cos(a) * d + 'px),calc(-50% + ' + Math.sin(a) * d + 'px)) scale(1.1)', opacity: 0 }], { duration: 700 }).onfinish = () => s.remove();
  }
}

/* ===== Clock ===== */
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !paused && !locked || (playing && !paused && open.length === 2)) {
    const before = Math.ceil(timeLeft);
    timeLeft -= dt;
    if (Math.ceil(timeLeft) !== before) { updateHud(); if (timeLeft <= 5 && timeLeft > 0) BRB.sfx.play('click'); }
    if (timeLeft <= 0) { timeLeft = 0; updateHud(); endGame(false); }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ===== Pause ===== */
function pause() { if (!playing || paused) return; paused = true; showScreen('pauseScreen'); BRB.sfx.play('click'); }
function resume() { paused = false; showScreen(null); BRB.sfx.play('click'); }
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ===== Controls ===== */
$('playBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('nextLevelBtn').addEventListener('click', nextLevel);
$('pauseBtn').addEventListener('click', pause);
$('resumeBtn').addEventListener('click', resume);
$('restartBtn').addEventListener('click', startGame);
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!$('titleScreen').hidden || !$('resultScreen').hidden) { if (k === 'enter' && !e.repeat) { e.preventDefault(); startGame(); } return; }
  if (!$('levelScreen').hidden) { if (k === 'enter' && !e.repeat) { e.preventDefault(); nextLevel(); } return; }
  if (!$('pauseScreen').hidden) { if (k === 'escape' || k === 'p') resume(); return; }
  if (k === 'escape' || k === 'p') return pause();
  // arrow keys move between cards
  const cards = [...document.querySelectorAll('.card')];
  let i = cards.indexOf(document.activeElement);
  const step = { arrowleft: -1, arrowright: 1, arrowup: -cols, arrowdown: cols }[k];
  if (step !== undefined) { e.preventDefault(); i = i < 0 ? 0 : Math.max(0, Math.min(cards.length - 1, i + step)); cards[i].focus(); }
});
</script>
