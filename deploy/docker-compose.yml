# Oomba Academy on one server (a VM with a block disk): the app and Caddy for HTTPS, plus the screenshot worker once
# that change is merged (see "shots" below).
#   cd deploy && cp .env.example .env   (fill it in, chmod 600 .env)
#   docker compose up -d --build
# Docs: docs/deploy-aws.md, docs/deploy-azure.md. ONE app container only: the app keeps rate limits, presence and
# login cards in memory and SQLite allows one writer, so never scale it past 1.
name: oomba

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  app:
    build: { context: .., dockerfile: Dockerfile }
    image: ${OOMBA_IMAGE:-oomba-academy:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      BRB_DATA_DIR: /data
      # Caddy is the one proxy in front of the app. Trusted by address, not as "1 hop": only Caddy and the app are on
      # the "web" network, so a request from the screenshot worker's network can't pick its own X-Forwarded-For.
      # With a CDN in front of Caddy (guides, section 6) set TRUST_PROXY=2 in .env.
      TRUST_PROXY: ${TRUST_PROXY:-172.30.42.0/24}
      # The screenshot worker's address (SNAPSHOT_URL) and SHOTS_TOKEN come from .env.
    volumes:
      # The block disk (EBS / Azure managed disk), mounted on the host at /srv/oomba. If it isn't mounted (a boot
      # problem), the app refuses to start instead of starting an empty site on the root disk.
      - type: bind
        source: ${DATA_DIR:-/srv/oomba/data}
        target: /data
        bind: { create_host_path: false }
    # No "ports:": only Caddy can reach the app. Publishing 3000 would let anyone bypass Caddy and fake X-Forwarded-For.
    expose: ["3000"]
    networks: [web, shots]
    # SIGTERM first: the app finishes requests and Builder turns (up to 25 s), Litestream ships its last changes.
    stop_grace_period: 40s
    # 2g while Chromium runs inside the app (until the screenshot worker is turned on; then 1g is plenty).
    mem_limit: 2g
    security_opt: ["no-new-privileges:true"]
    # Enough to fix the data folder's owner and switch to the "node" user at start, and for tini (root) to pass
    # SIGTERM on to the app (uid 1000): without KILL a stop cuts the app off instead of letting it finish.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, KILL]
    logging: *logging

  # Headless Chromium for cover pictures and the Builder's playtests, away from the data and the secrets.
  # Same image, run as the screenshot worker (server/shots-worker.js): no data volume, read-only, no internet,
  # its own token and nothing else from .env.
  # NOT YET: the worker is a separate change. Until it is merged, Chromium runs inside the app and this service stays
  # off. Once it is merged, turn it on in .env: COMPOSE_PROFILES=worker, SNAPSHOT_URL=http://shots:4900 and a
  # SHOTS_TOKEN (openssl rand -hex 32), then docker compose up -d --build.
  shots:
    profiles: [worker]
    image: ${OOMBA_IMAGE:-oomba-academy:latest}
    command: ["node", "server/shots-worker.js"]
    restart: unless-stopped
    user: "1000:1000"
    environment:
      NODE_ENV: production
      SHOTS_PORT: "4900"
      SHOTS_TOKEN: ${SHOTS_TOKEN:-}
      HOME: /tmp
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    expose: ["4900"]
    # Internal network only: the worker can't reach the internet, and only the app can reach it.
    # (Games that load fonts or libraries from Google Fonts or cdnjs then get screenshots without them. To allow
    # those two sites, also add the "web" network here.)
    networks: [shots]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.SHOTS_PORT||4900)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    logging: *logging

networks:
  # Caddy <-> app, and the app's way out to the internet (the Builder's AI calls, Litestream backups). A fixed
  # subnet, so the app can trust exactly this network for X-Forwarded-For (TRUST_PROXY above).
  web:
    ipam:
      config:
        - subnet: 172.30.42.0/24
  # app <-> screenshot worker only.
  shots:
    internal: true

volumes:
  # Caddy's certificates: keep them, or Let's Encrypt rate limits bite after a few rebuilds.
  caddy-data: {}
  caddy-config: {}
