/** The boss round: a fixed mixed deal per band (the Pro eight include faked senders, as Lock 4 of the escape
 *  room requires). Ids point into MESSAGES, so the boss never drifts from the sets it mixes. */
const BOSS = {
  '1b': ['lt-1', 'ch-1', 'mx-1', 'lt-3', 'ch-3', 'mx-2'],
  '2': ['sd-1', 'pr-2', 'lt-7', 'md-3', 'pr-5', 'sd-4', 'pr-3', 'mx-1'],
};
const BY_ID = Object.fromEntries(MESSAGES.map(m => [m.id, m]));
const SET_BY_ID = Object.fromEntries(SETS.map(s => [s.id, s]));

/** The clues a message hides: its real address first when the address itself is a clue (addrClue, the faked
 *  senders), then the body's clue segments in order, then its button's true destination when it has one (link).
 *  Safe messages hide none. */
function cluesOf(msg) {
  const out = [];
  if (msg.addrClue && msg.addr) out.push({ id: msg.id + ':addr', kind: 'sender', text: msg.addr });
  for (const seg of msg.body || []) if (seg && typeof seg === 'object' && seg.clue) out.push({ id: msg.id + ':' + out.length, kind: seg.clue, text: seg.t });
  if (msg.link) out.push({ id: msg.id + ':link', kind: 'link', text: msg.link.shown + ' → ' + msg.link.goes });
  return out;
}
/** One round of a set for a band and seed: the set's messages for that band, in a seeded order. */
function round(setId, band, seed) {
  const b = band === '2' ? '2' : '1b';
  let list;
  if (setId === 'boss') list = (BOSS[b] || []).map(id => BY_ID[id]).filter(Boolean);
  else list = MESSAGES.filter(m => m.set === setId && m.bands.includes(b));
  const r = rng(seedOf(setId + '|' + b + '|' + (seed == null ? 1 : seed)));
  return r.shuffle(list);
}

    try { if (window.BRB && BRB.score) BRB.score.submit(run.score, lab); } catch (e) { /* no page */ }
    try { if (window.BRB && typeof BRB.progress === 'function') BRB.progress({ game: 'ti', chapter: run.set, stars, band: S.band === '2' ? 2 : 1, score: run.score, stampStars: run.stampStars }); } catch (e) { /* older SDK */ }
  }
  const finished = run; S.run = null; S.screen = 'done'; hudSync();
  const w = S.w;
  if (w && !w.ended && !S.projector) { try { if (window.BRB && BRB.gameOver) BRB.gameOver({ won: true, score: finished.score }); } catch (e) { /* no page */ } S.gameOverSent = true; }
  if (w && !w.ended) w.win({ stars, score: S.projector ? 0 : finished.score, submit: false, title: tr('Inbox sorted!'), who: PIM });
  if (!w) { hideAll(); showMap(); }
}
document.addEventListener('keydown', e => {
  const run = S.run; if (!run || S.screen !== 'round' || e.repeat) return;
  if (run.phase === 'decide' && ['1', '2', '3', '4'].includes(e.key)) { const a = E.ACTIONS[+e.key - 1]; if (a) { e.preventDefault(); doAct({ t: 'action', action: a.id }); } }
});

/* ---------- test hooks (covers, the playtest, the unit test's Chromium run) ---------- */
function testState() {
  const run = S.run, msg = cur();
  return { ti: true, screen: S.screen, chapter: S.set, band: S.band, mode: S.mode, lesson: S.lesson, lock: S.lock,
    phase: run ? run.phase : S.screen, index: run ? run.i + 1 : 0, total: run ? run.msgs.length : 0, msgId: msg ? msg.id : null,
    found: run ? run.found.size : 0, clues: msg ? E.cluesOf(msg).length : 0, score: run ? run.score : S.lastScore, maxScore: run ? run.maxScore : (S.lastMaxScore || 0),
    stampStars: run ? run.stampStars : 3, stars: S.lastStars || 0, label: S.lastLabel, gameOver: S.gameOverSent, ready: true, busy: S.busy };}
Object.assign(window.__brbTest || (window.__brbTest = {}), {
  start(o = {}) { S.pending = Object.assign({}, o); S.fast = S.fast || !!o.fast; game.start(); return testState(); },
  skipAnimations() { S.fast = true; return true; },
  act(a) { return doAct(a); },
  state() { return testState(); },
  run() { const run = S.run; return run ? { set: run.set, i: run.i, phase: run.phase, score: run.score, maxScore: run.maxScore, stampStars: run.stampStars, msg: cur() ? cur().id : null } : null; },
  /** Play the current round perfectly: find every clue, choose the best move, read every debrief. */
  async solve() {
    S.fast = true; let guard = 0;
    while (S.run && guard++ < 200) {
      const run = S.run, msg = cur(); if (!msg) break;
      if (run.phase === 'hunt') { for (const c of E.cluesOf(msg)) if (!run.found.has(c.id)) doAct({ t: 'clue', id: c.id }); doAct({ t: 'ready' }); }
      else if (run.phase === 'decide') doAct({ t: 'action', action: msg.action });
      else if (run.phase === 'debrief') doAct({ t: 'next' });
      else break;
    }
    return testState();
  },
  async cover() {
    S.fast = true; S.pending = { chapter: 'letters', band: '1b', seed: 7, lesson: false };
    game.start();
    await O.time.real.wait(50);
    const run = S.run; if (!run) return false;
    const msg = cur(); if (msg) { const cs = E.cluesOf(msg); if (cs[0]) doAct({ t: 'clue', id: cs[0].id }); }
    return true;
  },
});
</script>
