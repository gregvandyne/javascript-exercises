<!-- Machine Line: Number Quest Pro Unit 3, The Machine Hall (grades 6-7, ages 11-13). A factory street at sunset,
     on Oomba3D 1.2.0 in the Toy Town theme 1.1.0: a big board on the street shows a line of machines (times 3,
     plus 5), a box with a number or a letter rides it, and a small conveyor loads a crate on the dock for each
     finished round. Three chapters of six rounds:
       build (3.1) write an expression as a line ("5 more than 3 times n", "3 times the sum of n and 4", a story
                   with crates), work one out for a number, read a line as an expression, and a squaring machine;
       same  (3.2) two lines that always, sometimes or never give the same output, and one line rebuilt as
                   another: expand 3(x + 2), combine 2x + 3x + 4, factor 4x + 12, subtract a sum;
       undo  (3.3) the output is known: run the line backward to find what went in (x + 7 = 12, 4x = 28,
                   3x + 5 = 23, 5(x + 2) = 35), which line undoes another, and the inputs an inequality allows,
                   marked as a ray on a number line.
     Made for ages 11 to 14: plan first, then run. The player puts machine blocks into the line, sets a stepper or
     a ray, or picks one of three tiles, and runs the plan; a wrong plan is run too and shown as it really turns
     out (the output it gives for a number, beside the output wanted) with a spoken hint, and the round stays
     open. Two lines are compared as polynomials, never as text. There is no balance in this game. No timer, no
     lives, no fail state, nothing typed, nothing bought or sold. Read-aloud is on by default (BRB.speak, the
     shared path; the speaker button says a line again): lines are written the way they are said. Keys: 1 to 4
     put a block in or take it out, Backspace takes the last one out, arrows or + and - move the stepper, F flips
     the ray, Enter runs, 1 to 3 pick a tile. Lesson mode: BRB.params { chapter: build | same | undo, lock: 1 }
     opens that chapter only; finishing its six rounds reports game over, won, once (the course step's completion
     signal). With no parameters the game offers the three chapters from a menu. Saves only which chapters are
     finished (BRB.storage 'machine-line-v1'). The import map below is exactly kit2ImportMap()
     (server/services/vendor.js); tests/unit/machine-line.test.js fails if a library bump leaves it behind.
     English only, like Number Quest's other lesson games. Test handle: window.__ml (also window.__brbTest, the
     name the picture scripts wait for). -->

/* ---------- the board: one picture, drawn by the game, always face on (so a line of machines stays a straight line
   and a number line stays level), redrawn for each round and for each of its three looks: asked (with the plan on
   it), tried (a wrong plan, as it really turns out) and found ---------- */
const CW = 1024, CH = 768, BOARD = V3(0, 2.2, -3.05);

}

  X.fillStyle = o.fill || C.ink; X.fillText(s, px, py);

  while (o.max && z > (o.min || 40) && X.measureText(s).width > o.max) { z -= 2; X.font = `${o.weight || 800} ${z}px ${FONT}`; }

const rr = (x0, y0, w, h, r) => { const p = new Path2D(); p.roundRect(x0, y0, w, h, r); return p; };

/* A row: the value boxes and the machines of one line, left to right, with an arrow between each. A machine block is a

/** One look of the board: a heading, rows, a number line and lines of maths, set out from top to bottom. */
function paintView(ov, plan, live) {
  const blocks = [], lines = (ov.lines || []).map(printed);
  if (ov.head) blocks.push({ h: 96, draw: y => label(ov.head, CW / 2, y + 50, 66, { fill: C.sky, max: 940 }) });
  for (const row of ov.rows || []) blocks.push({ h: row.back ? 264 : 180, draw: y => paintRow(row, y + 90, plan) });

/* ---------- where things go, and the camera ---------- */
const portrait = () => innerWidth < innerHeight * 0.9;

let wasSquat = squat();
addEventListener('resize', () => { const t = portrait(); if (t !== tall || squat() !== wasSquat) { tall = t; wasSquat = squat(); redraw(); } frame(); });

/* ---------- dragging the end of the ray: a finger or the mouse on the board's number line puts the end there ---------- */
let dragging = false;
function boardValue(ev) {
  const R = S.R; if (!R || S.screen !== 'play' || S.phase !== 'play' || R.input !== 'ray' || !stage.children.includes(board)) return null;
  const [l, t, r, b] = boxOf(board), px = (ev.clientX - l) / (r - l) * CW, py = (ev.clientY - t) / (b - t) * CH;
  if (px < 30 || px > CW - 30 || Math.abs(py - RAY.ay) > 110) return null;

const cnv = g.renderer.domElement;
cnv.addEventListener('pointerdown', ev => { const v = boardValue(ev); if (v != null) { dragging = true; setPlan({ at: v, dir: S.value.dir }); } });
cnv.addEventListener('pointermove', ev => { if (!dragging) return; const v = boardValue(ev); if (v != null && v !== S.value.at) setPlan({ at: v, dir: S.value.dir }); });

/* ---------- the stage: the board on the street, and the crates on the dock ---------- */

/* ---------- the line engineer: one helper by the board (no picker: the job starts at once) ---------- */

/* ---------- a chapter: six rounds ---------- */
/* Each play of a chapter (the first, and every Play again) takes its own lap: a random one whose rounds all ask
   different things and none of what the last play of that chapter asked (its lap is kept in the game's save, BRB.storage,
   best effort). The fixed lap 0 only when a test pins it (window.__brbTest.lap). */
const LAPS_KEY = 'machine-line.laps';

  if (!last || typeof last !== 'object' || Array.isArray(last)) last = {};
  const lap = ML.lapOf(chapter, +last[chapter] || 0, rand01);
  last[chapter] = lap;
  try { if (B && B.storage) B.storage.set(LAPS_KEY, last); } catch (e) { /* no save here: the lap is still new */ }
  return lap;
}
function startChapter(chapter) {
  if (!ML.CHAPTERS.includes(chapter)) return showMenu();
  S.chapter = chapter; S.lap = playLap(chapter); S.round = 0; S.screen = 'play'; el.card.hidden = true; el.card.replaceChildren();
  setCrates(0);
  if (S.hero) S.hero.play('idle');

}
function dots2() {

  el.dots.setAttribute('aria-label', fmt('round', { n: S.round, m: ML.ROUNDS })); el.dots.hidden = false; el.row2.hidden = false;

/** The sign of a ray round's inequality for the way the ray points. */
const signOf = (Rd, dir) => ML.sign(dir, Rd.ray.closed);
/** What the controls show for the plan: the stepper's number, or the ray as an inequality. */
function valueText(Rd, v) { return Rd.input === 'ray' ? `x ${signOf(Rd, v.dir)} ${v.at}` : fmt('show.x', { n: ML.nt(v) }); }
/** The controls of a round: machine blocks and a run button, a stepper and a run button (with the ray's flip button
 *  in the middle), or three tiles. */
function controls(Rd, found) {
  if (Rd.input === 'tiles') return Rd.opts.map((o, i) => button({ id: 'ml-n' + i, big: o.t, aria: o.t, cls: (o.t.length > 4 ? 'long' : '') + (found && i === Rd.answer ? ' right' : ''), go: b => answer(i, b) }));
  const go = button({ id: 'ml-go', icon: '▶', label: fmt('btn.run'), cls: 'go', go: b => run(b) });
  if (Rd.input === 'build') return Rd.build.blocks.map((o, i) => { const b = button({ id: 'ml-b' + i, big: ML.opText(o), aria: ML.opText(o), cls: 'blk', go: () => toggle(i) }); b.setAttribute('aria-pressed', String(S.value.includes(i))); return b; }).concat(go);

  if (Rd.input === 'ray') return [dn, button({ id: 'ml-flip', big: valueText(Rd, S.value), label: '⇄ ' + fmt('btn.flip'), aria: valueText(Rd, S.value), cls: 'flip', go: () => flip() }), up, go];

/** Draw the round from its state (also after the screen turns): the board, the helper, the crates, the controls. */
function redraw() {
  if (S.screen === 'start' || S.screen === 'menu' || S.screen === 'end') { solo(S.screen === 'end' ? ML.ROUNDS : 0); return void frame(); }
  if (S.screen !== 'play' || !S.R) return void frame();
  const focus = el.bar.contains(document.activeElement) ? document.activeElement.id : '';
  const Rd = S.R, found = S.phase === 'right', first = !S.shown && !found;
  clearStage(); S.tick++;
  el.card.hidden = true;
  putBoard(Rd, found ? 'found' : S.mode, first); setCrates(S.round - 1 + (found ? 1 : 0));
  placeHero(); view.pts = stagePts();
  el.bar.hidden = false; el.bar.className = 'ml-bar ' + Rd.input;
  el.bar.replaceChildren(...controls(Rd, found));
  if (focus) { const b = document.getElementById(focus) || el.bar.querySelector('button'); if (b) b.focus(); }   // a keyboard player stays on the controls

/** A step that only runs if the round it belongs to is still the one on screen. */
const guard = fn => { const tick = S.tick; return (...a) => { if (tick === S.tick) fn(...a); }; };
const still = () => { drop(board); board.position.copy(BOARD); board.scale.set(BW, BH, 1); board.visible = true; };

/** A new plan (blocks in the line, a number, a ray): the board goes back to the question, with the blocks or the ray of the plan on it (a number stays on the stepper: the board never shows an output the plan has not earned). */
function setPlan(v) {
  const Rd = S.R; if (!Rd || S.screen !== 'play' || S.phase !== 'play' || Rd.input === 'tiles') return;
  if (Rd.input === 'build') { if (!Array.isArray(v)) return; v = v.filter((i, k) => Number.isInteger(i) && i >= 0 && i < Rd.build.blocks.length && v.indexOf(i) === k).slice(0, Rd.build.slots); }
  else if (Rd.input === 'step') { if (typeof v !== 'number') return; v = Math.max(Rd.step.min, Math.min(Rd.step.max, Math.round(v / Rd.step.by) * Rd.step.by)); }
  else { if (!v || typeof v.at !== 'number') return; v = { at: Math.max(Rd.step.min, Math.min(Rd.step.max, Math.round(v.at))), dir: v.dir === 'left' ? 'left' : 'right' }; }
  S.value = v; S.draw = null; hint();
  if (Rd.input === 'build') Rd.build.blocks.forEach((o, i) => { const b = document.getElementById('ml-b' + i); if (b) b.setAttribute('aria-pressed', String(v.includes(i))); });
  else if (Rd.input === 'step') { const out = document.getElementById('ml-val'); if (out) out.textContent = valueText(Rd, v); }
  else { const b = document.getElementById('ml-flip'); if (b) { b.querySelector('.big').textContent = valueText(Rd, v); b.setAttribute('aria-label', valueText(Rd, v)); } }
  still(); paint(Rd, 'ask');
}
function bump(dir) { const Rd = S.R; if (!Rd) return; if (Rd.input === 'step') setPlan(S.value + dir * Rd.step.by); else if (Rd.input === 'ray') setPlan({ at: S.value.at + dir, dir: S.value.dir }); }
/** The ray points the other way. */
function flip() { const Rd = S.R; if (Rd && Rd.input === 'ray') setPlan({ at: S.value.at, dir: S.value.dir === 'left' ? 'right' : 'left' }); }
/** A block goes into the next empty slot, or comes out if it is in the line; with the line full it takes the last slot. */
function toggle(i) {
  const Rd = S.R; if (!Rd || Rd.input !== 'build' || S.phase !== 'play') return;
  const v = S.value.slice(), at = v.indexOf(i);
  if (at >= 0) v.splice(at, 1); else { if (v.length >= Rd.build.slots) v.pop(); v.push(i); }
  setPlan(v);

/** Run the plan. */
function run(b) { const Rd = S.R; if (Rd && Rd.input !== 'tiles') settle(ML.judge(Rd, S.value), b || document.getElementById('ml-go')); }
/** Pick a tile. */
function answer(i, b) { const Rd = S.R; if (Rd && Rd.input === 'tiles') settle(ML.judge(Rd, i), b || document.getElementById('ml-n' + i)); }
function settle(res, b) {
  if (S.phase !== 'play' || !S.R || S.screen !== 'play' || !res) return;
  const Rd = S.R;
  if (!res.ok) {
    // a wrong plan: the board shows what it really does, the hint says why, and the round stays open
    wobble(b); S.draw = res.draw || null; hint(res.lines);
    paint(Rd, 'hint'); still(); shake(board);
    return;
  }
  S.phase = 'right'; S.tick++; S.draw = null; hint(); sfx('coin');
  if (b) b.classList.add('right');
  chip(Rd.chipDone, 'ok');
  say(Rd.said, { queue: true });
  paint(Rd, 'found'); still(); pop(board, { from: 0.9 });
  // the round's crate rides the conveyor to the dock, the helper cheers, and only then the next round
  shipCrate(guard(() => { sfx('cheer'); heroMove('cheer', 1700); pause(reduced ? 3.6 : 2.4, guard(nextRound)); }));

// Keys: 1 to 4 put a block in or take it out and Backspace takes the last one out; the arrows (or + and −) move the
// stepper and F flips the ray; Enter runs the plan; 1 to 3 pick a tile. Every control is also a button, so Tab, Enter
// and Space work too.
addEventListener('keydown', ev => {
  const Rd = S.R; if (!Rd || S.screen !== 'play' || S.phase !== 'play' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key, onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
  if (Rd.input === 'tiles') { if (/^[1-3]$/.test(k) && +k <= Rd.opts.length) { answer(+k - 1); ev.preventDefault(); } return; }
  if (k === 'Enter' && !onButton) { run(); ev.preventDefault(); }
  else if (Rd.input === 'build') {
    if (/^[1-9]$/.test(k) && +k <= Rd.build.blocks.length) { toggle(+k - 1); ev.preventDefault(); }
    else if (k === 'Backspace' && S.value.length) { setPlan(S.value.slice(0, -1)); ev.preventDefault(); }
  } else if (k === 'ArrowUp' || k === 'ArrowRight' || k === '+' || k === '=') { bump(1); ev.preventDefault(); }
  else if (k === 'ArrowDown' || k === 'ArrowLeft' || k === '-' || k === '_') { bump(-1); ev.preventDefault(); }
  else if (Rd.input === 'ray' && (k === 'f' || k === 'F')) { flip(); ev.preventDefault(); }

/* ---------- the test handle: what the round asks and what is on screen (tests, covers, slide pictures) ---------- */

const ray = new THREE.Raycaster();

  const from = g.camera.position, dir = p.clone().sub(from), dist = dir.length();
  ray.set(from, dir.normalize()); ray.near = 0.1; ray.far = dist - 0.12;
