<title>Rocket Supply</title>
<!-- Rocket Supply: Number Quest Launchpad Unit 5, The Hundreds Hedge (grade 2, ages 7-8). A launch pad on a space
     base, on Oomba3D 1.1.0 in the Space Base theme: supply pods are stocked for a rocket (a flat pallet is a HUNDRED,
     a rack is a TEN, a canister is a ONE), and when the load is right the rocket lifts off. Three chapters of six
     rounds, one per course step:
       build (5.1) load a number with pallets, racks and canisters (ten racks lock into a pallet), read a load and
                   pick its number (407, 470 or 47?), match a number to its parts (300 + 40 + 2) and to its name,
                   read aloud, all to 999;
       count (5.2) skip count by fives, tens and hundreds along the fuel gauge (what comes next?), then pick the
                   sign for two three-digit numbers: >, = or <;
       fuel  (5.3) add and take away within 100 with tens and ones (38 + 27: ten ones lock into a new ten;
                   62 − 25: a ten opens into ten ones), and quick facts within 20.
     Made for a child who is only starting to read: every instruction is short, shown and spoken (BRB.speak, the
     shared path; the speaker button says it again), the numbers are big, and everything is done with big buttons.
     No timer, no lives, no fail state: a wrong answer wobbles, shows why on the pad and gets a spoken hint, then
     another try. Lesson mode: BRB.params { chapter: build | count | fuel, lock: 1 } opens that chapter only;
     finishing its six rounds reports game over, won, once (the course step's completion signal). With no parameters
     the game offers the three chapters from a picture menu. Saves only which chapters are finished (BRB.storage
     'rocket-supply-v1'). The import map below is exactly kit2ImportMap() (server/services/vendor.js);
     tests/unit/rocket-supply.test.js fails if a library bump leaves it behind. English only, like Number Quest's
     other lesson games. Test handle: window.__rs (also window.__brbTest, the name the picture scripts wait for). -->

/** Show the work of a sum on the pad, step by step: the ones come together and ten of them lock into a new rack;

/** What stands on the pad for the round as it is now: the pads, the pods, the boards, the lift and the helper.

/** The hint a wrong answer gets. */
function hintFor(Rd) {

  if (Rd.kind === 'expand') return ['expand.hint'];
  if (Rd.kind === 'name') return ['name.hint'];
  if (Rd.kind === 'skip') return ['skip.hint.' + Rd.by];

/** The child picks an answer: a number, or a sign. */

window.__rs = window.__brbTest = {
  state: () => ({ game: 'rocket-supply', screen: S.screen, chapter: S.chapter, lock: S.lock, round: S.round, rounds: RS.ROUNDS, phase: S.phase, hero: S.hero ? S.hero.id : null, reported: S.reported, tall, launched: S.launched,
    ...(S.R && S.screen === 'play' ? { ...S.R, total: S.total, load: S.load, reveal: S.reveal, work: S.work, lift: lift.position.y, flying, moving: tweens.length,
      pods: ['h', 't', 'o'].map(k => stage.children.filter(o => o.userData.pod === k && !o.userData.ghost).length), ghosts: stage.children.filter(o => o.userData.ghost).length, boards: stage.children.filter(o => o.userData.label).map(o => o.userData.text) } : {}) }),
  fast: on => { S.fast = on !== false; },
  hero: id => chooseHero(id || HEROES[0]),

  /** The helper's place: [x, y, z]. */

  /** Where things are on the screen (CSS pixels): the two ends of the pad, and the boxes round the helper (as wide
