<title>Shark Plank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
/* Shark Plank on the Oomba Kit: a hangman game for early readers. The kit draws the beach world behind the game (day,
   or night in the dark theme), the explorer (the player's own avatar), the title, HUD (hearts and words won), pause,
   settings, icons, buttons, sounds and the type. This file lays out the game's own pieces: the word-size chips, the sea
   scene (a canvas in the Oomba Ink style: Ink outlines, kit colours), the word slots, the ABC keys, the three tools,
   the results card and the "secret word" card. Phones in portrait: one column. Wider screens (and landscape phones):
   the sea on the left, the word and the keys on the right, so nothing needs scrolling.
   Colours come from the kit (set as --sp-* variables at start). The letters (keys and word slots) use Andika, a
   reading font with the a and g that children learn to write; everything else uses the kit's font. */
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.sp{--letters:"Andika","Trebuchet MS",system-ui,sans-serif;--rim:var(--sp-ink);--soft:color-mix(in srgb,var(--ok-text) 62%,transparent)}
.ok-night .sp{--rim:color-mix(in srgb,var(--sp-cream) 40%,transparent)}
.sp button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.lvl,.tool{font-family:inherit}
.sp svg{display:block}
.sp .ok-btn{color:var(--sp-ink)}
.scroller{position:fixed;inset:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:1}
.scroller.offstage{visibility:hidden}
.app{max-width:560px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;
  padding:calc(62px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.sr,.res.is-win h2{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}

/* ---------- the game's name (kept on screen while playing) ---------- */
.brand{margin:0;justify-self:center;align-self:center;display:flex;align-items:baseline;justify-content:center;gap:.3em;font-weight:800;font-size:clamp(1.45rem,6.4vw,2rem);line-height:1;letter-spacing:.01em;
  padding:7px 20px 8px;border-radius:999px;background:var(--ok-card);border:3px solid var(--rim);box-shadow:0 4px 0 var(--sp-ink);width:max-content;max-width:100%;box-sizing:border-box;margin-inline:auto}
.brand span{color:var(--sp-skyDeep)}.brand b{color:var(--sp-coralShade)}
.ok-night .brand span{color:var(--sp-sky)}.ok-night .brand b{color:var(--sp-coral)}

/* ---------- word size chips ---------- */
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lvl{font-weight:800;font-size:.98rem;line-height:1.1;padding:5px 2px 4px;border-radius:18px;border:3px solid var(--rim);background:var(--ok-card);color:var(--ok-text);
  box-shadow:0 4px 0 var(--sp-ink);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;transition:transform 80ms ease-out,box-shadow 80ms ease-out}
.lvl:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sp-ink)}
.lvl[aria-pressed="true"]{background:var(--sp-sky);color:var(--sp-ink);border-color:var(--sp-ink)}
.lvl .pips{display:flex;gap:3px;height:16px;align-items:center}
.lvl .pips i{width:11px;height:11px;box-sizing:border-box;border-radius:3px;border:2px solid var(--sp-ink);background:var(--sp-spark)}
.lvl .pips svg{width:20px;height:20px}
.lvl span,.tool span{display:block;max-width:100%;white-space:nowrap;overflow:hidden}   /* long words shrink to fit (fitLabels) */
.tool span{width:0;min-width:100%}   /* the label never widens the play column; it shrinks instead */

/* ---------- the sea scene ---------- */
.scene{position:relative;border-radius:26px;overflow:hidden;border:3px solid var(--sp-ink);box-shadow:0 7px 0 var(--sp-ink);aspect-ratio:5/3;background:var(--sp-skyTint)}
.ok-night .scene{border-color:color-mix(in srgb,var(--sp-cream) 40%,var(--sp-ink));box-shadow:0 7px 0 var(--sp-ink)}
.scene canvas{position:absolute;inset:0;display:block;width:100%;height:100%}

/* ---------- the word ---------- */
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:2px 0}
.slot{width:clamp(34px,10.5vw,52px);height:clamp(44px,13vw,62px);box-sizing:border-box;border-radius:14px;background:var(--ok-card);border:3px solid var(--rim);box-shadow:0 4px 0 var(--sp-ink);
  display:grid;place-items:center;font:700 clamp(1.7rem,8.5vw,2.6rem)/1 var(--letters);color:var(--ok-text)}
.slot:empty{background:var(--ok-bg2);border-style:dashed;box-shadow:none}
.slot.pop{background:var(--sp-mintTint);border-color:var(--sp-ink);color:var(--sp-ink);animation:sp-pop .4s ease-out}
.slot.miss{background:var(--sp-coralTint);color:var(--sp-coralShade);border-style:solid}
@keyframes sp-pop{40%{transform:translateY(-10px) scale(1.15)}}

/* ---------- the play panel: the word, keys and tools sit on one calm card (the busy beach stays behind it) ---------- */
#play{background:color-mix(in srgb,var(--ok-bg2) 92%,transparent);border:3px solid var(--rim);border-radius:26px;box-shadow:0 6px 0 var(--sp-ink);padding:10px 10px 12px;box-sizing:border-box;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

/* ---------- ABC keys ---------- */
.keys{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px 5px}
.key{position:relative;aspect-ratio:1/1;border-radius:14px;border:2.5px solid var(--sp-ink);background:var(--sp-cream);color:var(--sp-ink);
  font:700 clamp(1.4rem,6.6vw,2rem)/1 var(--letters);box-shadow:0 4px 0 var(--sp-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;gap:0;
  transition:transform 80ms ease-out,box-shadow 80ms ease-out}
.key small{font-size:.55em;color:var(--sp-stoneShade);font-weight:400;line-height:1}
.key:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--sp-ink)}
.key.good{background:var(--sp-mint)}
.key.good small{color:var(--sp-ink)}
.key.bad{background:var(--sp-stoneTint);color:color-mix(in srgb,var(--sp-ink) 35%,var(--sp-stoneTint));border-color:color-mix(in srgb,var(--sp-ink) 35%,var(--sp-stoneTint));box-shadow:none}
.key.bad small{color:inherit}
.key .mk{position:absolute;top:-7px;inset-inline-end:-6px;width:20px;height:20px;border-radius:50%;border:2px solid var(--sp-ink);display:grid;place-items:center;background:var(--sp-cream);color:var(--sp-ink)}
.key .mk svg{width:13px;height:13px;stroke-width:3.4}
.key.bad .mk{background:var(--sp-coral);border-radius:5px;transform:rotate(45deg)}.key.bad .mk svg{transform:rotate(-45deg)}
.key:disabled{cursor:default}
.ok-night .key{border-color:var(--sp-ink)}
.ok-night .key.bad{background:var(--ok-icon-card);color:var(--sp-stoneShade);border-color:var(--ok-line)}

/* ---------- tools ---------- */
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tool{font-weight:800;font-size:1rem;line-height:1.1;border:2.5px solid var(--sp-ink);border-radius:18px;padding:7px 4px;color:var(--sp-ink);display:flex;flex-direction:column;align-items:center;gap:3px;
  box-shadow:0 4px 0 var(--press);transition:transform 80ms ease-out,box-shadow 80ms ease-out;min-height:48px}
.tool svg{width:30px;height:30px;flex:none}
.tool.hear{background:var(--sp-skyLight);--press:var(--sp-ink)}
.tool.hint{background:var(--sp-grapeLight);--press:var(--sp-ink)}
.tool.next{background:var(--sp-spark);--press:var(--sp-sparkShade)}
.tool:disabled{opacity:.45;cursor:default}
.tool:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--press)}

/* ---------- cards: results and the secret word ---------- */
.card{background:var(--ok-card);color:var(--ok-text);border:3px solid var(--rim);border-radius:26px;box-shadow:0 7px 0 var(--sp-ink);padding:16px;
  display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:sp-in 320ms cubic-bezier(.34,1.56,.64,1)}
@keyframes sp-in{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.03);opacity:1}100%{transform:none}}
.res .top{display:flex;align-items:center;justify-content:center;gap:14px;min-width:0}
.res .pic{flex:none;display:grid;place-items:center;width:92px;height:92px;border-radius:22px;background:var(--ok-bg2);border:2.5px solid var(--rim);font-size:58px;line-height:1}
.res .pic canvas{display:block;max-width:80px;max-height:80px;width:auto;height:auto}
.res h2{margin:0;font-weight:800;font-size:clamp(1.3rem,5.4vw,1.8rem);line-height:1.15;text-wrap:balance}
.res .tiles{gap:6px;flex-wrap:nowrap;min-width:0}
.res .tiles .slot{width:clamp(32px,10vw,48px);height:clamp(38px,11.5vw,56px);font-size:clamp(1.4rem,7.4vw,2.3rem);border-radius:12px;box-shadow:0 3px 0 var(--sp-ink);flex:0 1 auto;min-width:0}
.res .tiles.long{gap:4px}.res .tiles.long .slot{width:clamp(24px,7.4vw,36px);height:clamp(34px,10vw,46px);font-size:clamp(1.15rem,5.6vw,1.8rem);border-radius:10px;border-width:2.5px}
.res .tiles .slot.got{background:var(--sp-mintTint);color:var(--sp-ink);border-color:var(--sp-ink)}
.res .tiles .slot.miss{background:var(--sp-coralTint);color:var(--sp-coralShade);border-color:var(--sp-coralShade)}
.res .top{flex-wrap:wrap}
.res .msg{margin:0;font-weight:650;font-size:1.05rem;line-height:1.35;max-width:32ch;text-wrap:pretty}
.res .ok-sparks .ok-slot{width:clamp(44px,12vw,58px);height:clamp(44px,12vw,58px)}
.ok-night .res .ok-sparks .ok-on{--ok-fill:var(--sp-spark)}   /* the kit's night rule outweighs its own lit spark */
.res .pic svg{width:56px;height:56px;color:var(--ok-text)}
.res .won{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:1.05rem;background:var(--ok-bg2);border:2px solid var(--rim);border-radius:999px;padding:3px 12px 3px 6px}
.res .won svg{width:24px;height:24px}
.res .row{display:flex;gap:10px;justify-content:center;width:100%}
.res .row .ok-btn{flex:1 1 auto;min-width:0;max-width:280px;white-space:nowrap;padding:0 14px}
.res .row .ok-big{flex-grow:1.6;font-size:1.25em}
.res.lose .top .pic{background:var(--sp-coralTint)}
.secret{align-items:stretch;text-align:start}
.secret p{margin:0;font-size:1.1rem;line-height:1.35;font-weight:600}
.secret input{font:700 1.6rem var(--letters);padding:8px 12px;border-radius:14px;border:3px solid var(--rim);background:var(--ok-bg2);color:var(--ok-text);text-transform:uppercase;letter-spacing:.08em;width:100%;min-width:0;box-sizing:border-box}
.secret input:focus-visible{outline:3px solid var(--ok-focus);outline-offset:3px}
.err{color:var(--sp-coralShade);min-height:1.2em;font-weight:700}
.ok-night .err{color:var(--sp-coral)}
.secret .ok-btn{width:100%}

.ok-rm .slot.pop,.ok-rm .card{animation:none}

/* Wider than tall (desktop, tablets, landscape phones): the name and the sea on the left (the sea as big as the
   screen allows), the word sizes, word and keys on the right, so nothing needs scrolling. */
@media (min-aspect-ratio:5/4){
  .app{max-width:1320px;display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);grid-template-areas:"brand levels" "scene side";grid-template-rows:auto auto;
    column-gap:22px;row-gap:12px;align-items:start;min-height:100%;align-content:center;padding-top:calc(70px + env(safe-area-inset-top))}
  .brand{grid-area:brand} .levels{grid-area:levels;align-self:end}
  .scene{grid-area:scene;width:min(100%,calc((100vh - 190px) * 5 / 3));justify-self:center}
  #play,#secret,#result{grid-area:side;align-self:start;width:100%}
  .keys{gap:7px 6px}
  .key{aspect-ratio:auto;height:clamp(44px,8.2vh,60px);font-size:clamp(1.4rem,4.4vh,2rem)}
  .slot{width:clamp(34px,4vw,52px);height:clamp(44px,8.4vh,62px);font-size:clamp(1.7rem,5.4vh,2.5rem)}
  .lvl{flex-direction:row;justify-content:center;gap:6px;min-height:46px;padding:4px 4px}
  .lvl .pips{gap:2px}.lvl .pips i{width:8px;height:11px;border-width:1.5px;border-radius:2px}
}
/* Short landscape screens (phones on their side). */
@media (min-aspect-ratio:5/4) and (max-height:520px){
  .app{padding-top:calc(64px + env(safe-area-inset-top));padding-bottom:6px;row-gap:6px;column-gap:14px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
  .brand{font-size:1.15rem;padding:4px 14px 5px;border-width:2px;box-shadow:0 3px 0 var(--sp-ink)}
  .lvl{padding:2px;gap:5px;font-size:.88rem;min-height:36px} .lvl .pips:not([data-icon]){display:none}   /* short screens: the label alone */
  .scene{width:min(100%,calc((100vh - 122px - env(safe-area-inset-top)) * 5 / 3))}
  #play{gap:5px!important;padding:5px 6px 7px;border-radius:18px} .key{flex-direction:row;align-items:baseline;gap:2px} .key small{font-size:.7em}   /* the small letter sits beside the big one */
  .keys{gap:4px}
  .key{height:clamp(28px,7.6vh,40px);font-size:1.1rem;line-height:.92;border-radius:10px}
  .slot{height:32px;width:clamp(26px,4vw,36px);font-size:1.3rem;border-radius:9px;border-width:2.5px}
  .tool{flex-direction:row;justify-content:center;gap:6px;padding:2px;min-height:36px} .tool svg{width:22px;height:22px}
  .tool span{width:auto;min-width:0;flex:0 1 auto}
  .res .pic{width:70px;height:70px;font-size:44px} .res .pic canvas{max-width:60px;max-height:60px}
  .res .tiles .slot{height:40px;width:32px;font-size:1.5rem}
}
@media (max-width:600px){.ok-hud .ok-btn.ok-sound{display:inline-flex}}
@media (max-width:360px){.keys{gap:5px}.tool svg{width:26px;height:26px}}
</style>

<div class="sp scroller offstage" id="game">
<div class="app" id="app">
  <h2 class="brand" dir="ltr"><span>Shark</span> <b>Plank</b></h2>
  <div class="levels" role="group" data-i18n-aria="wordSize" aria-label="Word size">
    <button class="lvl" data-l="easy" aria-pressed="true" data-i18n-aria="lvlEasyA"><span class="pips" aria-hidden="true"><i></i><i></i><i></i></span><span dir="ltr">3–4</span></button>
    <button class="lvl" data-l="mid" aria-pressed="false" data-i18n-aria="lvlMidA"><span class="pips" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span dir="ltr">5–6</span></button>
    <button class="lvl" data-l="hard" aria-pressed="false" data-i18n-aria="lvlHardA"><span class="pips" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span data-i18n="lvlHard">Big</span></button>
    <button class="lvl" data-l="two" aria-pressed="false" data-i18n-aria="lvlTwoA"><span class="pips" aria-hidden="true" data-icon="user"></span><span data-i18n="lvlTwo">2 play</span></button>
  </div>

  <div class="scene" dir="ltr"><canvas id="cv" role="img" data-i18n-aria="scene" aria-label="A kid on a pirate plank with a shark in the water"></canvas></div>

  <section id="play" style="display:flex;flex-direction:column;gap:10px">
    <div class="word" id="word" aria-live="polite" dir="ltr"></div>
    <div class="keys" id="keys" dir="ltr"></div>
    <div class="tools">
      <button class="tool hear" id="hear" data-icon="speak"><span data-i18n="hear">Hear it</span></button>
      <button class="tool hint" id="hint" data-icon="hint"><span data-i18n="hint">Help me</span></button>
      <button class="tool next" id="next" data-icon="next"><span data-i18n="next">New word</span></button>
    </div>
  </section>

  <section class="card res" id="result" hidden aria-live="polite">
    <div class="top"><div class="pic" id="resPic" aria-hidden="true"></div><div class="word tiles" id="resWord" dir="ltr"></div></div>
    <h2 id="resH"></h2>
    <div class="ok-sparks" id="resSparks" role="img"></div>
    <div class="won" id="resWon"></div>
    <div class="row" id="resBtns"></div>
  </section>

  <section class="card secret" id="secret" hidden>
    <p><b data-i18n="secretWho">Grown-up or Player 1:</b> <span data-i18n="secretMsg">type a secret word. Don't let the other player peek!</span></p>
    <input id="secretIn" type="password" autocomplete="off" maxlength="14" dir="ltr" placeholder="e.g. Goal" data-i18n-ph="secretPh" data-i18n-aria="secretLabel" aria-label="Secret word">
    <div class="err" id="err" role="alert"></div>
    <button class="ok-btn ok-hot ok-big" id="startSecret" data-i18n="startSecret">Hide it and pass the phone 📱</button>
  </section>
</div>
</div>

/* The game's words and letters are always spoken with an English (en-US) voice. Cheers and messages use the
   menu language's voice when the device has one; with no such voice only the English word is spoken.
   Voices: the most natural one on the device (BRB.speak), at the normal pitch. Rates: 1 is normal talking;
   a letter and the messages use 1, and the "hear the word" button reads the word slower (RATE.word) on purpose. */
const RATE={talk:1,word:.8};
/* voice-pick:start. Only for playing this file on its own: on Oomba Academy the SDK's BRB.speak is used.
   The same scoring as BRB.voice in public/sdk/brb-sdk.js (tests/unit/voice.test.js checks they agree):
   the language's preferred region first, natural/premium/enhanced voices up, old Windows "Desktop" voices,
   eSpeak and Apple's novelty voices down; the browser's online voices (Edge "Online (Natural)", Chrome "Google US English")
   after on-device natural ones but before plain on-device ones. An online voice sends the text to Microsoft or Google
   (accepted by the owner on 29 Oct 2026, docs/decisions.md). When the browser has not listed its voices yet,
   speakWith waits for them rather than letting the browser choose one. */
const VOICE_REGIONS = { en: ['us', 'gb', 'ca', 'au'], 'en-gb': ['gb', 'ie', 'au'], pt: ['br', 'pt'], 'zh-hant': ['tw', 'cn', 'hk'], zh: ['cn', 'tw', 'hk'],
  he: ['il'], es: ['es', 'mx', 'us'], fr: ['fr', 'ca'], de: ['de', 'at', 'ch'], it: ['it'], nl: ['nl', 'be'], ja: ['jp'], ru: ['ru'], ar: ['sa', 'eg', 'ae'] };
const VOICE_SCORES = [[/\b(natural|neural)\b/i, 30], [/premium/i, 30], [/siri/i, 25], [/enhanced/i, 25], [/^google\b/i, 10], [/\bdesktop\b/i, -15], [/compact/i, -10],
  [/^(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley)\b/i, -40],
  [/^(albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|pipe organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|kathy|ralph|agnes|bruce|princess|vicki|victoria)\b/i, -80],
  [/e-?speak/i, -60]];
const VOICE_ONLINE = 20;   // an online voice gets this instead of the bonuses (penalties still count)
function voiceTag(t) {
  const p = String(t || '').replace(/_/g, '-').toLowerCase().split('-'); let lang = p[0], region = '', script = '';
  for (const x of p.slice(1)) { if (/^[a-z]{4}$/.test(x)) script = x; else if (!region && /^([a-z]{2}|\d{3})$/.test(x)) region = x; }
  if (lang === 'iw') lang = 'he';
  if (lang === 'cmn' || lang === 'yue') lang = 'zh';

  return { lang, region };
}

  let best = null, top = -Infinity;

    const online = v.localService === false || /-network\b/i.test(id);   // the text goes to Google / Microsoft

    if (v.default) s += 5;
    if (s > top) { best = v; top = s; }

    const go = () => {   // only ever with a voice set explicitly: a lang-only utterance lets the browser pick any voice (often the worst)
      const v = pickVoice(ss.getVoices() || [], lang); if (!v) return false;
      const u = new SpeechSynthesisUtterance(text); u.voice = v; u.lang = v.lang; u.rate = rate; ss.speak(u); return true;
    };
    if ((ss.getVoices() || []).length) return go();
    // Chrome lists its voices a moment after the page loads: wait for them once (at most 1.5 s), then speak or stay silent.
    let waited = false; const later = () => { if (waited) return; waited = true; try { go(); } catch (e) { /* ignore */ } };

  } catch (e) { return false; }

  GOAL:['goalpost'],TREE:['tree'],BOAT:['boat'],BOOK:['book'],APPLE:['apple'],MOUSE:['mouse'],CLOCK:['clock','3:00'],GRAPES:['grapes'],BANANA:['banana'],

/** The art's canvas cut to what is drawn (the kit's animals stand small in a big square: the clue should fill its frame). */
function trim(src){
  const w=src.width,h=src.height;let d;try{d=src.getContext('2d').getImageData(0,0,w,h).data;}catch(e){return src;}
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>24){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1<0)return src;const pad=2;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w-1,x1+pad);y1=Math.min(h-1,y1+pad);

}
/** The kit art for the word (a canvas px tall, cut to its drawing), or null: then the emoji is the clue. */
function picCanvas(w,px){

  if(picCache.has(key))return picCache.get(key);

/** Ink outline for the current path. */

function wave(y,amp,len,speed,t,col,off=0,line=0){
  const yy=x=>y+Math.sin((x+off)/len+t*speed)*amp+Math.sin((x+off)/(len*.47)+t*speed*1.6)*amp*.35;
  c.fillStyle=col;c.beginPath();c.moveTo(0,SH);c.lineTo(0,yy(0));

    c.fillStyle=INK;c.beginPath();c.arc(843,86,5.5,0,7);c.arc(877,86,5.5,0,7);c.fill();

function drawShip(t){

function drawPlank(t,kx,bob){

/* The explorer is the player's own avatar (the kit's Oomba.avatar(): the mascot for guests), drawn from the kit's

const kidCache=new Map();
function kidSprite(mood){
  const px=Math.max(48,Math.round(KID_H*(FIT?FIT.scale:1)*1.15)),key=mood+'|'+px;let s=kidCache.get(key);if(s)return s;
  const full=Oomba.art.toCanvas(HERO,px,mood),w=full.width,h=full.height;let top=0,bot=h-1;
  try{const d=full.getContext('2d').getImageData(0,0,w,h).data,row=y=>{for(let x=0;x<w;x+=2)if(d[(y*w+x)*4+3]>30)return true;return false;};
    while(top<h-1&&!row(top))top++;while(bot>top&&!row(bot))bot--;}catch(e){/* keep the whole canvas */}
  s={c:full,sy:top,sh:Math.max(1,bot-top+1)};kidCache.set(key,s);if(kidCache.size>16)kidCache.delete(kidCache.keys().next().value);return s;
}
function drawKid(x,y,t,o){
  // o: {worry, happy, fly, walking, rot}
  const mood=o.happy?'cheer':o.fly||o.worry>=5?'surprised':o.worry>=3?'thinking':'happy';   // cheerful until the plank gets short
  const s=kidSprite(mood),h=KID_H,w=h*s.c.width/s.sh;
  c.save();c.translate(x,y);if(o.rot)c.rotate(o.rot);
  const bounce=o.happy?Math.abs(Math.sin(t*10))*-18:0,step=o.walking?Math.abs(Math.sin(t*14))*-7:0;c.translate(0,bounce+step);
  if(o.worry>=5&&!o.happy&&!o.fly)c.rotate(Math.sin(t*12)*.05);
  if(NIGHT){c.shadowColor=rgba(CREAM,.6);c.shadowBlur=10*(FIT?FIT.scale:1);}
  c.drawImage(s.c,0,s.sy,s.c.width,s.sh,-w/2,-h,w,h);
  c.shadowBlur=0;
  if(o.worry>=5&&!o.happy){c.fillStyle=pal.drop;c.beginPath();c.ellipse(w*.36,-h*.82+((t*40)%20),4,6,0,0,7);c.fill();ink(2);}
  c.restore();
}
function drawBubble(x,y,word,emoji,t){
  const by=y-236+Math.sin(t*2)*4;
  c.fillStyle=CREAM;
  c.beginPath();c.arc(x+20,y-176,7,0,7);c.fill();ink(3.5);c.beginPath();c.arc(x+36,y-196,11,0,7);c.fill();ink(3.5);
  c.beginPath();c.ellipse(x+74,by,74,54,0,0,7);c.fill();ink(4.5);
  const k=FIT?FIT.scale:1,art=picCanvas(word,Math.round(84*k));
  if(art){const r=art.width/art.height,w=Math.min(110,84*r),hh=w/r;c.drawImage(art,x+74-w/2,by-hh/2+2,w,hh);}
  else if(emoji==='❓')D.text(c,'?',x+74,by+2,{size:76,role:'magic',rim:true});   // a friend's secret word: a big kit question mark
  else{c.font='68px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillStyle=INK;c.fillText(emoji,x+74,by+4);c.textBaseline='alphabetic';}
}
function drawShark(x,y,ang,mouth,s,t){
  c.save();c.translate(x,y);c.rotate(ang);c.scale(s,s);
  const tail=Math.sin(t*10)*.25;
  // tail
  c.save();c.translate(-150,0);c.rotate(tail);c.fillStyle=SHARK_D;c.beginPath();c.moveTo(10,0);c.lineTo(-60,-60);c.quadraticCurveTo(-36,0,-56,50);c.closePath();c.fill();ink(5);c.restore();
  // fins behind the body
  c.fillStyle=SHARK_D;c.beginPath();c.moveTo(20,30);c.lineTo(-30,80);c.quadraticCurveTo(40,60,60,36);c.closePath();c.fill();ink(5);
  // body: blue-grey back, cream belly, one Ink outline
  const m=mouth*42;
  const body=()=>{c.beginPath();c.moveTo(-160,0);c.quadraticCurveTo(-60,-70,80,-46);c.quadraticCurveTo(150,-34,170,-6);
    c.lineTo(110,4);c.lineTo(170,10+m);c.quadraticCurveTo(150,44+m*.6,60,48);c.quadraticCurveTo(-60,56,-160,0);c.closePath();};
  body();c.fillStyle=SHARK;c.fill();
  c.save();body();c.clip();c.fillStyle=CREAM;c.beginPath();c.moveTo(-170,8);c.quadraticCurveTo(0,0,180,12);c.lineTo(180,120);c.lineTo(-170,120);c.closePath();c.fill();
  c.fillStyle=rgba(CREAM,.35);c.beginPath();c.ellipse(-10,-36,70,10,-.08,0,7);c.fill();c.restore();
  body();ink(6);
  // mouth inside + teeth
  if(mouth>.05){c.fillStyle=P.coral[3];c.beginPath();c.moveTo(108,2);c.lineTo(168,-4);c.lineTo(168,10+m);c.closePath();c.fill();ink(3);
    c.fillStyle=CREAM;for(let i=0;i<4;i++){const tx=118+i*13;c.beginPath();c.moveTo(tx,-1);c.lineTo(tx+6,9);c.lineTo(tx+12,-2);c.fill();c.beginPath();c.moveTo(tx+2,6+m*(.5+i*.15));c.lineTo(tx+8,-4+m*(.5+i*.15));c.lineTo(tx+14,6+m*(.5+i*.15));c.fill();}}
  else{c.beginPath();c.moveTo(110,6);c.quadraticCurveTo(140,22,166,6);ink(4);
    c.fillStyle=CREAM;[120,132,144,156].forEach(tx=>{c.beginPath();c.moveTo(tx,10);c.lineTo(tx+5,18);c.lineTo(tx+10,11);c.closePath();c.fill();ink(1.5);});}
  // top fin
  c.fillStyle=SHARK;c.beginPath();c.moveTo(-10,-50);c.lineTo(-40,-120);c.quadraticCurveTo(20,-80,40,-48);c.closePath();c.fill();ink(5);
  // gills
  c.strokeStyle=rgba(INK,.55);c.lineWidth=3;c.lineCap='round';[60,72,84].forEach(gx=>{c.beginPath();c.moveTo(gx,-18);c.quadraticCurveTo(gx-6,0,gx,14);c.stroke();});
  // eye (a kit ring eye: Cream, Ink pupil, glint) and brow
  c.fillStyle=CREAM;c.beginPath();c.arc(118,-22,13,0,7);c.fill();ink(3);c.fillStyle=INK;c.beginPath();c.arc(122,-22,7,0,7);c.fill();c.fillStyle=CREAM;c.beginPath();c.arc(124,-25,2.5,0,7);c.fill();
  c.beginPath();c.moveTo(104,-40);c.lineTo(132,-34);ink(5);
  c.restore();
}
function drawFin(x,t,dir){
  const y=SEA+8+Math.sin(t*3)*3;
  c.fillStyle=pal.foam;c.beginPath();c.ellipse(x-dir*30,y+6,46,6,0,0,7);c.fill();
  c.fillStyle=SHARK;c.beginPath();c.moveTo(x-dir*28,y+4);c.lineTo(x+dir*6,y-58);c.quadraticCurveTo(x+dir*20,y-20,x+dir*30,y+4);c.closePath();c.fill();ink(4);
}
function splash(x,y,n,big){for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*2.2,sp=(big?500:260)*(0.4+Math.random());scene.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:4+Math.random()*(big?12:7),life:1+Math.random()*.6,t:0,k:'drop'});}}
const CONF=[P.spark[2],P.coral[2],P.mint[2],P.grape[2],P.sky[2]];
function confetti(){if(REDUCED)return;for(let i=0;i<90;i++)scene.parts.push({x:Math.random()*SW,y:-20-Math.random()*200,vx:(Math.random()-.5)*80,vy:120+Math.random()*160,r:6,life:3,t:0,k:'conf',col:CONF[i%5],rot:Math.random()*6});}
function words(txt,x,y,role,s,life){scene.parts.push({k:'txt',txt,x,y,role,s,life:life||1.4,t:0});}
/** A word that pops in and stays (YOU DID IT! over the sea, BURP! over the shark): t is the seconds since it appeared. */
function sticker(txt,x,y,role,t,s){
  const pop=REDUCED?1:t<.25?t/.25*1.15:t<.4?1.15-(t-.25)/.15*.15:1;let k=s*pop;
  c.save();c.font='800 90px '+FONTSTACK;const tw=c.measureText(txt).width*s;const max=760;if(tw>max)k*=max/tw;const half=Math.min(tw,max)/2+20;
  c.translate(Math.max(half,Math.min(SW-half,x)),y+(REDUCED?0:Math.sin(T*2.2)*4));c.scale(k,k);c.rotate(-.06+(REDUCED?0:Math.sin(T*1.7)*.02));
  D.text(c,txt,0,0,{size:90,role,rim:true});c.restore();
}
/** The title's badge: the shark, grinning. */
function titleBadge(){
  const k=Math.min(2,devicePixelRatio||1),cw=Math.round(250*k),ch=Math.round(130*k),b=document.createElement('canvas');b.width=cw;b.height=ch;
  const keep=c;c=b.getContext('2d');c.scale(k*.62,k*.62);pal=NIGHT?PAL.night:PAL.day;drawShark(212,112,-.12,.35,1,0.3);c=keep;
  b.style.width='250px';b.style.height='130px';return b;
}

let last=performance.now(),T=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(!playing||!FIT)return;
  if(Oomba.time.paused)dt=0;   // the pause screen (or a lost focus) holds the scene too
  T+=dt;pal=NIGHT?PAL.night:PAL.day;
  scene.shown+= (scene.step-scene.shown)*Math.min(1,dt*3);
  scene.walk=Math.max(0,scene.walk-dt*1.4);scene.happy=Math.max(0,scene.happy-dt);
  c.setTransform(FIT.scale,0,0,FIT.scale,FIT.offsetX,FIT.offsetY);
  c.save();
  if(scene.shake>0){if(!REDUCED)c.translate((Math.random()-.5)*scene.shake,(Math.random()-.5)*scene.shake);scene.shake=Math.max(0,scene.shake-dt*40);}
  drawSky(T);
  // far sea
  const sg=c.createLinearGradient(0,SEA,0,SH);sg.addColorStop(0,pal.seaFar);sg.addColorStop(1,pal.seaDeep);c.fillStyle=sg;c.fillRect(-20,SEA,SW+40,SH-SEA+20);
  wave(SEA-4,6,60,1.4,T,pal.seaTop,0,.9);
  // shark (fin circling or attack)
  let kx=kidX(scene.shown),ky=PLANK_Y-12;
  const bob=drawShip(T);
  const tip=drawPlank(T,kx,bob);
  ky+=bob+Math.min(1,(kx-PLANK_X0)/(PLANK_X1-PLANK_X0))*tip;
  const worry=scene.step;
  if(scene.anim==='chomp'){
    scene.at+=dt;const a=scene.at;
    // phases: 0-.6 the fin rushes in, .6-2.0 the leap (it hangs at the top for the CHOMP), 2.0-2.7 splash down,
    // 2.7-3.9 the BURP and the spit-back, then the shark stays up, grinning, with the BURP over it
    if(a<.6){drawFin(lerp(900,kx+80,a/.6),T,-1);if(!scene.kid.gone)drawKid(kx,ky,T,{worry:6});}
    else if(a<2.0){const k=(a-.6)/1.4;
      const up=k<.3?Math.sin(k/.3*Math.PI/2):k<.7?1+Math.sin((k-.3)*12)*.02:Math.cos((k-.7)/.3*Math.PI/2);
      const sx=k<.3?lerp(kx+170,kx-50,k/.3):k<.7?kx-50-(k-.3)*40:lerp(kx-66,kx-110,(k-.7)/.3),sy=SEA+60-up*330;
      if(!scene.splash1){scene.splash1=1;splash(kx+150,SEA,30,false);scene.shake=10;sfx('splash');}
      const mouth=k<.28?k/.28:k<.4?Math.max(0,1-(k-.28)/.08):0;
      if(!scene.kid.gone&&k<.36){drawKid(kx,ky-(k>.2?(k-.2)*700:0),T,{worry:6,fly:k>.2});}
      if(k>=.36&&!scene.kid.gone){scene.kid.gone=true;words(t('chomp'),kx+130,262,'hazard',1,1.6);scene.shake=16;sfx('hurt');}
      drawShark(sx,sy,k<.3?-.9+k/.3*.9:k<.7?Math.sin(T*3)*.05:(k-.7)/.3*.9,mouth,1.12,T);}
    else if(a<2.7){const k=(a-2.0)/.7;if(!scene.splash2){scene.splash2=1;splash(kx-40,SEA,60,true);scene.shake=20;sfx('splash',{volume:.8});}
      if(k<.5)drawShark(kx-30,SEA+20+k*240,.9,0,1.12,T);}
    else{const k=Math.min(1,(a-2.7)/1.2);
      const rise=Math.sin(Math.min(1,k*1.6)*Math.PI/2),settle=a>3.9?Math.min(1,(a-3.9)/.8):0;
      const sy=SEA+40-rise*90+settle*28+Math.sin(T*2)*4*settle;
      drawShark(kx+40,sy,-.25+settle*.1,k>.45?(a<3.9?Math.min(1,(k-.45)*5):Math.max(.18,1-settle)):0,1,T);
      if(k>.5&&!scene.burp){scene.burp=a;sfx('pop');}
      if(scene.burp)sticker(t('burp'),kx+170,SEA-190,'magic',a-scene.burp,.95);   // stays: the funny moment is still there on the results
      if(a<3.9){if(k>.5){const f=Math.min(1,(k-.5)/.5);const fx=lerp(kx+200,kidX(0),f),fy=lerp(SEA-40,PLANK_Y-12,f)-Math.sin(f*Math.PI)*220;drawKid(fx,fy+bob,T,{worry:5,fly:1,rot:f*6.28});
        if(f>=1&&!scene.drip){scene.drip=1;sfx('land');}}}
      else{drawKid(kidX(0),PLANK_Y-12+bob,T,{worry:5});
        if(!scene.revealed){scene.revealed=1;renderWord();sayT('sLose',{w:word.toLowerCase()});cancelResult();resultT=Oomba.time.real.after(1000,()=>showResult(false));}
        c.fillStyle=pal.drop;for(let i=0;i<3;i++){c.beginPath();c.ellipse(kidX(0)-20+i*20,PLANK_Y-150+((T*60+i*15)%60),3,6,0,0,7);c.fill();ink(1.5);}
        if(!REDUCED)for(let i=0;i<3;i++){const bt=(T*.8+i/3)%1;c.globalAlpha=1-bt;c.fillStyle=rgba(CREAM,.7);c.beginPath();c.arc(kx+200+Math.sin(bt*9+i)*8,sy-30-bt*90,5+i*2,0,7);c.fill();ink(2);c.globalAlpha=1;}}}   // burp bubbles
  } else if(scene.anim==='win'){
    scene.at+=dt;if(!scene.conf){scene.conf=1;confetti();}
    drawFin(kx+200+scene.at*260,T,1);
    drawKid(kx,ky,T,{happy:1});
  } else {
    const r=Math.max(40,330-scene.step*48),fx=kx+150+Math.sin(T*.9)*r,dir=Math.cos(T*.9)>0?1:-1;
    drawFin(fx,T,dir);
    drawKid(kx,ky,T,{worry,happy:scene.happy>0,walking:scene.walk>0});
  }
  // near waves (cover shark bottoms)
  wave(SEA+22,8,80,1.1,T,rgba(pal.seaMid,.9),200,.6);
  wave(SEA+60,10,110,.8,T,rgba(pal.seaDeep,.94),500,.4);
  c.fillStyle=pal.foam;for(let i=0;i<14;i++){const x=(i*97+T*30)%SW,y=SEA+44+((i*53)%120);c.beginPath();c.ellipse(x,y,10,2.2,0,0,7);c.fill();}
  // thought bubble (picture clue)
  if(word&&scene.anim!=='chomp')drawBubble(kx,ky,word,pic,T);
  if(scene.anim==='win')sticker(t('win'),SW/2,SEA+118,'correct',scene.at,1.05);
  // particles
  scene.parts=scene.parts.filter(p=>(p.t+=dt)<p.life);
  for(const p of scene.parts){
    if(p.k==='drop'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;c.globalAlpha=1-p.t/p.life;c.fillStyle=pal.drop;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();if(p.r>8)ink(2);c.globalAlpha=1;}
    else if(p.k==='conf'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*6;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.col;c.beginPath();c.rect(-6,-9,12,18);c.fill();ink(2);c.restore();}
    else if(p.k==='txt'){const k=p.t/p.life;let s=p.s*(k<.15?k/.15*1.2:1.2-k*.2);c.save();
      c.font='800 90px '+FONTSTACK;
      const tw=c.measureText(p.txt).width*s;if(tw>900)s*=900/tw;const half=Math.min(tw,900)/2+20;   // long words (GESCHAFFT!) shrink to fit
      c.translate(Math.max(half,Math.min(SW-half,p.x)),p.y-k*40);c.scale(s,s);c.rotate(-.08);c.globalAlpha=k>.75?(1-k)/.25:1;
      D.text(c,p.txt,0,0,{size:90,role:p.role,rim:true});c.restore();}
  }
  c.restore();
}
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- test hooks (the screenshot worker and the playtest call start() instead of tapping Play) ---------- */
Oomba.test({
  state:()=>({screen:!playing?'title':!$('result').hidden?'result':!$('secret').hidden?'secret':'play',level,word,guessed:[...guessed],misses:miss,lives:LIVES-miss,
    over,won:!!word&&word.split('').every(ch=>guessed.has(ch)),stars,anim:scene.anim}),
  start:()=>{const b=document.querySelector('.ok-title-screen .ok-big');if(b)b.click();else if(!playing)startPlay();},
});

applyI18n();
requestAnimationFrame(frame);
Oomba.fonts.ready.then(showTitle);
})();
</script>
