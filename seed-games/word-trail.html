<title>Word Trail</title>
<!-- Andika: a font made for early readers (a and g as children write them, l with a tail so it is never I) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@700&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Word Trail: an official sight-word game for ages about 4-8. The Dolch words (Pre-primer to Grade 3) are five units
   on a winding felt-and-paper trail through a daytime meadow; each unit is a row of lesson stones, a review stone and
   a treasure chest. Lessons are short (new words first, then 10-12 exercises: hear it, say-pick, fill the sentence,
   build it, match pairs, speed tap) with XP, a daily streak, gentle hearts, combos, a mastery level per word and
   simple spaced repetition. Bramble (our own hedgehog) guides. Every word, sentence and instruction is spoken
   through BRB.speak and registered in server/services/tts-lines.js, so the AI voice reads it (the device's voice only
   as the fallback). The sprites are felt renders from Blender (tools/blender/word_trail.py) in a data pack; without
   the pack the game still plays with plain shapes. The words on the cards are never textured: big, crisp, dark ink on
   light paper. */
html,body{height:100%;margin:0}
body{overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:#cfe9f3}
[hidden]{display:none!important}
*{box-sizing:border-box}
:root{
  --ink:#2a1b22;--ink2:#5b4636;--onbg:#2a1b22;
  --sky1:#a9dcf2;--sky2:#fff1d2;--sun:#ffd65c;--cloud:#fffdf6;--cloud2:#e9f1f6;
  --hill1:#b6dca0;--hill2:#98cc84;--hill3:#7dbd6c;
  --path:#f6e4be;--pathEdge:#d8bb86;--stitch:rgba(255,253,242,.95);
  --paper:#fffaf0;--paperEdge:#eadcc0;--cstitch:rgba(160,118,78,.55);
  --mint:#46b873;--mintD:#2c8d55;--mintL:#dff5e6;--coral:#ff7466;--coralD:#c8402f;--coralL:#ffe3df;
  --gold:#ffc23d;--goldD:#b8860b;--lilac:#9d84e6;--sky:#4fa8f0;--skyD:#2f6fc8;
  --chrome:#fff6e4;--chromeEdge:#e3cfa8;
  --felt:none;--ptex:none;
  --shadow:0 3px 0 rgba(120,80,40,.2),0 10px 22px rgba(80,50,20,.16);
  --font:"Bricolage Grotesque",ui-rounded,"Nunito","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --read:"Andika","Century Gothic","Avenir Next","Avenir","Nunito",ui-rounded,"Bricolage Grotesque",system-ui,sans-serif;
  --top:max(10px,env(safe-area-inset-top));--bot:max(12px,env(safe-area-inset-bottom));
}
.dark{
  --onbg:#fff6e4;--sky1:#3a4f7a;--sky2:#c7a7a0;--sun:#ffcf8a;--cloud:#e7e3f0;--cloud2:#c4c7dd;
  --hill1:#5f8b6c;--hill2:#4c7a5c;--hill3:#3d6a4e;--path:#e3cf9f;--pathEdge:#a98f5c;
  --chrome:#3a3150;--chromeEdge:#241d33;--shadow:0 3px 0 rgba(0,0,0,.35),0 10px 22px rgba(0,0,0,.35);
}
.wt{position:fixed;inset:0;font-family:var(--font);color:var(--ink);overflow:hidden}
.wt button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wt button:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- felt and paper surfaces (a grey swatch tiled and multiplied over a colour) ---------- */
.felt{background-image:var(--felt);background-size:256px;background-blend-mode:multiply}
.paper{background-color:var(--paper);background-image:var(--ptex);background-size:256px;background-blend-mode:multiply}
.stitched{position:relative}
.stitched::after{content:"";position:absolute;inset:6px;border:2.5px dashed var(--cstitch);border-radius:inherit;pointer-events:none}
.patch{border-radius:18px;box-shadow:var(--shadow)}

/* ---------- the backdrop: paper sky, a paper sun, felt clouds and layered felt hills ---------- */
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
#bg .sky0{stop-color:var(--sky1)}#bg .sky1{stop-color:var(--sky2)}
#bg .sun{fill:var(--sun)}#bg .cl{fill:var(--cloud)}#bg .cl2{fill:var(--cloud2)}
#bg .h1{fill:var(--hill1)}#bg .h2{fill:var(--hill2)}#bg .h3{fill:var(--hill3)}
#bg .tex{mix-blend-mode:multiply;opacity:.55}
.wt:not(.on-title) #bg .sunG{display:none}
#bg .st{fill:none;stroke:var(--stitch);stroke-width:3;stroke-dasharray:9 8;stroke-linecap:round;opacity:.75}
.dark #bg .st{opacity:.35}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.col{width:100%;max-width:600px;margin:0 auto}

/* top bar: felt patches with the streak, XP and hearts */
.topbar{display:flex;align-items:center;gap:8px;padding:var(--top) 12px 8px;z-index:5}
.chip{display:flex;align-items:center;gap:6px;height:48px;padding:0 14px 0 10px;border-radius:24px;background-color:var(--chrome);border:none;
  font-weight:800;font-size:20px;color:var(--onbg);box-shadow:var(--shadow);white-space:nowrap}
.chip svg{width:28px;height:28px;flex:none}
.chip.icon{width:52px;padding:0;justify-content:center}
.chip.grow{margin-left:auto}
.dark .chip{color:#fff6e4}

/* the trail map */
#map .scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative;
  -webkit-mask-image:linear-gradient(transparent,#000 18px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(transparent,#000 18px,#000 calc(100% - 24px),transparent)}
/* a stone, card or tag cut by the top or bottom edge fades out until it is scrolled into view */
#trail .edge{opacity:.12;transition:opacity .2s}
#trail{position:relative;margin:0 auto;width:100%}
#trail svg.path{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.path .road{fill:none;stroke:var(--path);stroke-linecap:round;stroke-linejoin:round}
.path .edge{fill:none;stroke:var(--pathEdge);stroke-linecap:round;stroke-linejoin:round}
.path .seam{fill:none;stroke:var(--stitch);stroke-width:3;stroke-dasharray:10 9;stroke-linecap:round}
.path .ptex{fill:none;stroke-linecap:round;stroke-linejoin:round;mix-blend-mode:multiply;opacity:.6}
.band{position:absolute;left:-40px;right:-40px}
.band svg{position:absolute;left:0;top:-36px;width:100%;height:44px;display:block}
.band .fill{position:absolute;inset:0}
.deco{position:absolute;pointer-events:none;background:center bottom/contain no-repeat;filter:drop-shadow(0 6px 5px rgba(60,40,10,.18))}
.sign{position:absolute;width:150px;height:150px;pointer-events:none}
.sign .post{position:absolute;inset:0;background:center bottom/contain no-repeat}
.unitcard{position:absolute;left:50%;transform:translateX(-50%);width:min(320px,82%);padding:12px 18px 14px;border-radius:20px;text-align:center}
.unitcard .u{font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.unitcard .n{font-size:26px;font-weight:900;line-height:1.1;margin-top:2px}
.unitcard .l{font-size:15px;font-weight:700;color:var(--ink2);margin-top:4px}
.node{position:absolute;width:104px;height:84px;margin:-42px 0 0 -52px;border:none;background:center/contain no-repeat;padding:0;filter:drop-shadow(0 6px 4px rgba(60,40,10,.22))}
.node .ic{position:absolute;left:50%;top:40%;width:40px;height:40px;transform:translate(-50%,-50%);pointer-events:none}
.node .stars{position:absolute;left:0;right:0;bottom:-16px;display:flex;justify-content:center;gap:2px}
.node .stars svg{width:18px;height:18px}
.node.locked{filter:drop-shadow(0 4px 3px rgba(60,40,10,.15)) saturate(.7)}
.node.cur{animation:wt-bob 1.6s ease-in-out infinite}
.node.chest{width:118px;height:104px;margin:-56px 0 0 -59px}
.noart .node{border-radius:50%/42%;width:96px;height:72px;margin:-36px 0 0 -48px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12),var(--shadow)}
.noart .node.s-grey{background-color:#bdb6a8}.noart .node.s-gold{background-color:#ffb627}.noart .node.s-mint{background-color:#4fbf7a}.noart .node.s-lilac{background-color:#9d84e6}.noart .node.chest{background-color:#b5733f;border-radius:18px}
.tag{position:absolute;padding:6px 14px;border-radius:12px;font-weight:900;font-size:18px;white-space:nowrap;transform:translate(-50%,0);pointer-events:none;
  animation:wt-bob 1.6s ease-in-out infinite;box-shadow:var(--shadow)}
.tag::before{content:"";position:absolute;left:50%;top:-8px;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom-color:var(--paper)}
.guide{position:absolute;width:92px;height:110px;background:center bottom/contain no-repeat;pointer-events:none;transition:left .5s,top .5s}
.dock{display:flex;gap:10px;justify-content:center;padding:10px 12px var(--bot);z-index:5}
.dock button{flex:1;max-width:240px;height:60px;border:none;border-radius:20px;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px}
.dock svg{width:30px;height:30px}
.dark .dock button{color:#fff6e4}

/* big felt buttons */
.btn{border:none;border-radius:22px;min-height:64px;padding:0 26px;font-size:24px;font-weight:900;letter-spacing:.01em;color:#fff;
  box-shadow:0 5px 0 rgba(0,0,0,.18),0 12px 20px rgba(60,40,20,.18);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn::after{content:"";position:absolute;inset:5px;border:2.5px dashed rgba(255,255,255,.6);border-radius:17px;pointer-events:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.go{background-color:var(--mint)}.btn.hot{background-color:#ff8a3d}.btn.sky{background-color:var(--sky)}.btn.coral{background-color:var(--coral)}
.btn.quiet{background-color:var(--paper);color:var(--ink)}.btn.quiet::after{border-color:var(--cstitch)}
.btn[disabled]{background-color:#cfc6b5;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.08)}
.btn.wide{width:100%}
.say{border:none;border-radius:50%;width:56px;height:56px;flex:none;display:flex;align-items:center;justify-content:center;background-color:var(--sky);color:#fff;
  box-shadow:0 4px 0 var(--skyD),0 8px 14px rgba(40,60,120,.2);position:relative}
.say::after{content:"";position:absolute;inset:4px;border:2px dashed rgba(255,255,255,.65);border-radius:50%}
.say svg{width:30px;height:30px}
.say.big{width:128px;height:128px}.say.big svg{width:64px;height:64px}
.say.playing{animation:wt-pulse .7s ease-in-out infinite}

/* ---------- title ---------- */
#title{align-items:center;justify-content:center;text-align:center;padding:var(--top) 20px var(--bot)}
.logo{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.logo b{display:inline-flex;gap:5px;white-space:nowrap}
.logo span{display:inline-block;padding:4px 9px 6px;border-radius:12px;font-size:clamp(34px,9.6vw,64px);font-weight:900;color:#fff;line-height:1;box-shadow:var(--shadow);position:relative}
.logo span::after{content:"";position:absolute;inset:4px;border:2px dashed rgba(255,255,255,.55);border-radius:9px}
.logo{column-gap:16px;row-gap:10px}
.sub{margin:14px auto 0;max-width:340px;padding:10px 16px;border-radius:16px;font-size:19px;font-weight:700;color:var(--ink2)}
.hero{width:min(220px,48vw);height:min(250px,54vw);margin:14px auto 4px;background:center bottom/contain no-repeat}
.hero.bob{animation:wt-bob 2.2s ease-in-out infinite}

/* ---------- lesson ---------- */
#lesson .lhead{display:flex;align-items:center;gap:10px;padding:var(--top) 14px 6px}
.x{width:48px;height:48px;border:none;border-radius:50%;background-color:var(--chrome);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.x svg{width:24px;height:24px}
.bar{flex:1;height:26px;border-radius:13px;background-color:#e8dcc4;position:relative;overflow:hidden;box-shadow:inset 0 3px 0 rgba(0,0,0,.08)}
.dark .bar{background-color:#5a5070}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:13px;background-color:var(--mint);transition:width .4s cubic-bezier(.3,1.4,.6,1);min-width:26px}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:50%;border-top:2.5px dashed rgba(255,255,255,.7)}
.hearts{display:flex;align-items:center;gap:4px;font-weight:900;font-size:22px;color:var(--onbg)}
.hearts svg{width:32px;height:32px}
.ask{display:flex;align-items:center;gap:10px;padding:4px 14px}
.ask .mini{width:70px;height:80px;flex:none;background:center bottom/contain no-repeat}
.bubble{flex:1;padding:12px 16px;border-radius:18px;font-size:19px;font-weight:800;line-height:1.25;position:relative}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-left:0;border-right-color:var(--paper)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:8px 16px;min-height:0;overflow:hidden}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:460px}
.grid.three{grid-template-columns:1fr}
.grid.six{grid-template-columns:1fr 1fr}
/* the word card: a paper tag with a stitched edge; the word itself is plain, crisp, high-contrast type */
.card{border:none;border-radius:22px;min-height:86px;padding:10px 12px;display:flex;align-items:center;justify-content:center;
  font-family:var(--read);font-weight:700;font-size:clamp(34px,10vw,48px);line-height:1;color:var(--ink);letter-spacing:.01em;
  box-shadow:0 4px 0 var(--paperEdge),0 10px 18px rgba(80,50,20,.14);position:relative;transition:transform .12s}
.card::after{content:"";position:absolute;inset:7px;border:2.5px dashed var(--cstitch);border-radius:16px;pointer-events:none}
.card:active{transform:translateY(3px)}
.card.ok{background-color:var(--mintL);box-shadow:0 4px 0 var(--mint),0 10px 18px rgba(30,120,60,.2)}
.card.ok::after{border-color:var(--mint)}
.card.bad{background-color:var(--coralL);box-shadow:0 4px 0 var(--coral),0 10px 18px rgba(160,40,30,.18)}
.card.bad::after{border-color:var(--coral)}
.card.sel{box-shadow:0 0 0 5px var(--sky),0 4px 0 var(--paperEdge)}
.card.done{opacity:.35;pointer-events:none}
.card.dim{opacity:.55}
.word{font-family:var(--read);font-weight:700;color:var(--ink)}
.bigword{min-width:200px;min-height:130px;font-size:clamp(56px,17vw,84px);padding:16px 30px;border-radius:26px}
.sentence{width:100%;max-width:480px;padding:18px 18px 20px;border-radius:20px;font-family:var(--read);font-size:clamp(26px,7.4vw,34px);font-weight:700;line-height:1.35;text-align:center}
.blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--ink2);margin:0 .12em;color:var(--mintD);line-height:1.1}
.hl{color:#c4472e;text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{width:52px;height:64px;border-radius:14px;border:3px dashed var(--pathEdge);background:rgba(255,250,240,.65);display:flex;align-items:center;justify-content:center;
  font-family:var(--read);font-size:38px;font-weight:700;color:var(--ink);padding:0}
.slot.on{border-style:solid;border-color:var(--paperEdge);background-color:var(--paper)}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:420px}
.tile{width:60px;height:66px;border:none;border-radius:16px;font-family:var(--read);font-size:38px;font-weight:700;padding:0;
  box-shadow:0 4px 0 var(--paperEdge),0 8px 12px rgba(80,50,20,.14);position:relative}
.tile::after{content:"";position:absolute;inset:5px;border:2px dashed var(--cstitch);border-radius:11px}
.tile.used{visibility:hidden}
.pairs{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;width:100%;max-width:420px;align-items:center}
.pairs .say{width:76px;height:76px}
.pairs .say.on{box-shadow:0 0 0 5px var(--gold),0 4px 0 var(--skyD)}
.pairs .say.ok{background-color:var(--mint);box-shadow:0 4px 0 var(--mintD)}
.pairs .card{min-height:76px;font-size:clamp(30px,9vw,42px)}
.opts{display:flex;gap:12px;justify-content:center;width:100%;max-width:440px}
.opt{flex:1;border:none;border-radius:22px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 4px;
  box-shadow:0 4px 0 var(--paperEdge),0 10px 18px rgba(80,50,20,.14);position:relative;font-weight:900;font-size:20px;color:var(--ink2)}
.opt::after{content:"";position:absolute;inset:7px;border:2.5px dashed var(--cstitch);border-radius:16px}
.opt svg{width:46px;height:46px;color:var(--skyD)}
.opt.sel{box-shadow:0 0 0 5px var(--sky),0 4px 0 var(--paperEdge)}
.opt.ok{background-color:var(--mintL)}.opt.bad{background-color:var(--coralL)}
.timer{width:100%;max-width:440px;height:16px;border-radius:8px;background:#e8dcc4;overflow:hidden}
.timer i{display:block;height:100%;background-color:var(--gold);border-radius:8px;transition:width .1s linear}
.foot{padding:10px 16px var(--bot);min-height:96px;display:flex;align-items:flex-end;justify-content:center}
.foot .btn{width:100%;max-width:460px}
/* the feedback panel: a felt patch that slides up */
.fb{position:absolute;left:0;right:0;bottom:0;padding:16px 16px var(--bot);border-radius:26px 26px 0 0;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.3,1.3,.6,1),visibility 0s .28s;z-index:6;
  box-shadow:0 -6px 22px rgba(60,40,20,.2)}
.fb.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.3,1.3,.6,1),visibility 0s}
.fb.good{background-color:#d9f3e2}.fb.oops{background-color:#ffe6e0}
.fb .row{display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto 12px}
.fb .mini{width:74px;height:84px;flex:none;background:center bottom/contain no-repeat}
.fb .msg{font-size:26px;font-weight:900;line-height:1.1}
.fb.good .msg{color:#1f7a45}.fb.oops .msg{color:#b03a2a}
.fb .ans{margin-top:6px;display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;color:var(--ink2)}
.fb .ans .word{font-size:34px;background-color:var(--paper);padding:2px 14px;border-radius:12px}
.fb .ans .say{width:46px;height:46px}.fb .ans .say svg{width:24px;height:24px}
.fb .btn{display:flex;width:100%;max-width:560px;margin:0 auto}
.combo{position:absolute;left:50%;top:15%;transform:translate(-50%,-50%) scale(.6);opacity:0;padding:12px 22px;border-radius:18px;background-color:#ff8a3d;color:#fff;
  font-size:28px;font-weight:900;white-space:nowrap;pointer-events:none;z-index:7;box-shadow:var(--shadow)}
.combo::after{content:"";position:absolute;inset:5px;border:2.5px dashed rgba(255,255,255,.6);border-radius:13px}
.combo.on{animation:wt-combo 1.6s ease-out forwards}
.spark{position:absolute;width:22px;height:22px;pointer-events:none;z-index:8;animation:wt-spark .8s ease-out forwards}
/* intro of a new word */
.newtag{padding:6px 16px;border-radius:12px;background-color:var(--gold);color:#5a3a00;font-weight:900;font-size:19px;letter-spacing:.05em;text-transform:uppercase;position:relative}
.newtag::after{content:"";position:absolute;inset:4px;border:2px dashed rgba(255,255,255,.7);border-radius:9px}
.introrow{display:flex;align-items:center;gap:14px}
.sentrow{display:flex;align-items:center;gap:12px;width:100%;max-width:500px}
.sentrow .sentence{flex:1;font-size:clamp(24px,6.6vw,30px)}

/* ---------- end of lesson, treasure, sheets ---------- */
.endbox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:var(--top) 18px 8px;text-align:center}
.endbox h1{margin:0;font-size:clamp(32px,9vw,44px);font-weight:900;color:var(--onbg);text-shadow:0 2px 0 rgba(255,255,255,.5)}
.dark .endbox h1{text-shadow:none}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.stat{min-width:100px;padding:10px 12px 12px;border-radius:18px;text-align:center}
.stat b{display:flex;align-items:center;justify-content:center;gap:6px;font-size:30px;font-weight:900}
.stat b svg{width:30px;height:30px}
.stat span{display:block;font-size:14px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:460px}
.wchip{border:none;padding:6px 14px;border-radius:12px;font-family:var(--read);font-size:24px;font-weight:700;box-shadow:0 3px 0 var(--paperEdge)}
.bwrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.trow{display:flex;align-items:center;justify-content:center;gap:16px}
.trow .hero{width:130px;height:150px;margin:0}
.chest{width:min(260px,62vw);height:min(220px,52vw);background:center bottom/contain no-repeat;border:none;padding:0;filter:drop-shadow(0 10px 8px rgba(60,40,10,.25))}
.chest.shake{animation:wt-shake .5s ease-in-out 2}
.badge{width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:900;position:relative;box-shadow:var(--shadow)}
.badge::after{content:"";position:absolute;inset:7px;border:3px dashed rgba(255,255,255,.7);border-radius:50%}
.badge svg{width:56px;height:56px}
.badge small{font-size:15px;margin-top:2px;max-width:110px;line-height:1.1}
.scrim{position:absolute;inset:0;background:rgba(40,28,20,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px var(--bot);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;

.sheet .row2{display:flex;gap:10px;width:100%}
.sheet .row2 .btn{flex:1}
.wbook{display:flex;flex-direction:column;gap:12px;width:100%;text-align:left}
.wbook h3{margin:6px 0 0;font-size:18px;font-weight:900;color:var(--ink2)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.wcell{border:none;border-radius:14px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 3px 0 var(--paperEdge)}
.wcell .word{font-size:24px}
.wcell .m{display:flex;gap:2px}.wcell .m i{width:9px;height:9px;border-radius:50%;background:#e2d6be}.wcell .m i.on{background:var(--gold)}

  /** Results per word for the end of the lesson (grade once each). */
  function note(w, ok) { var r = L.results[w] || (L.results[w] = { r: 0, w: 0 }); if (ok) r.r++; else r.w++; }
  function sparkle(target) {
    if (reduced() || !target) return;
    var box = target.getBoundingClientRect(), host = $('lesson');
    for (var i = 0; i < 8; i++) {
      var s = el('div', 'spark', IC.star), a = i / 8 * Math.PI * 2;
      s.style.left = (box.left + box.width / 2 - 11) + 'px'; s.style.top = (box.top + box.height / 2 - 11) + 'px';
      s.style.setProperty('--dx', Math.round(Math.cos(a) * (box.width / 2 + 30)) + 'px'); s.style.setProperty('--dy', Math.round(Math.sin(a) * (box.height / 2 + 30)) + 'px');
      host.appendChild(s); setTimeout(function (n) { return function () { n.remove(); }; }(s), 900);
    }
  }
  /**
   * The answer to the item on screen. ok: right or not; target: the card (or slots) tapped; showRight(): marks the
   * right answer on a miss; sayKey: a line to read after a right answer (the full sentence for fill); graded: the
   * item noted its own words already (match, speed).
   */
  function answer(ok, target, showRight, sayKey, graded) {
    if (L.answered) return;
    L.answered = true; var it = L.item;
    if (it.stop) it.stop();
    if (!graded) note(it.word, ok);
    if (ok) {
      L.done++; L.combo++; L.best = Math.max(L.best, L.combo); if (!it.retry) L.right++;
      if (target) { target.classList.add('ok'); if (!reduced()) { target.classList.remove('pop'); void target.offsetWidth; target.classList.add('pop'); } sparkle(target); }
      sfx('correct');
      if (L.combo === 3 || L.combo === 5 || L.combo === 8) combo(L.combo);
    } else {
      L.mistakes++; L.combo = 0;
      if (target) { target.classList.add('bad'); if (!reduced()) { target.classList.remove('shake'); void target.offsetWidth; target.classList.add('shake'); } }
      if (showRight) showRight();
      else if (it.type === 'hear') { var r = $('lStage').querySelector('.card[data-word="' + it.word + '"]'); if (r) r.classList.add('ok'); }
      sfx('wrong');

      // the item comes back at the end of the lesson, once

      else L.done++;
    }

  }
  function timeUp() {
    var it = L.item; L.answered = true; L.done++; L.combo = 0;
    note(it.word, true);
    setBar();
    var fb = $('lFb'); fb.className = 'fb oops paper';
    fb.innerHTML = '<div class="row"><div class="mini"></div><div><div class="msg">' + esc(t('speed.time')) + '</div></div></div>';
    bgOf(fb.querySelector('.mini'), 'mascot_idle');
    var b = el('button', 'btn go', esc(t('ui.continue'))); b.dataset.act = 'continue'; b.addEventListener('click', function () { hush(); nextItem(); });
    fb.appendChild(b); requestAnimationFrame(function () { fb.classList.add('on'); });
    speak('speed.time', { auto: true });
  }
  var praise = 0;
  function feedback(ok, it, sayKey) {
    var fb = $('lFb'); fb.className = 'fb ' + (ok ? 'good' : 'oops');
    var w = it.word, msgKey = ok ? 'ok.' + (1 + (praise++ % 6)) : 'no.' + (1 + (L.mistakes % 2));
    var html = '<div class="row"><div class="mini"></div><div style="flex:1"><div class="msg">' + esc(t(msgKey)) + '</div>';
    if (!ok && it.type !== 'match' && it.type !== 'speed') html += '<div class="ans"><span class="word">' + esc(C.WORDS[w].text) + '</span><span class="sbtn"></span></div>';
    if (!ok && !it.retry) html += '<div class="ans" style="font-size:16px">' + esc(t('later')) + '</div>';
    html += '</div></div>';
    fb.innerHTML = html;
    bgOf(fb.querySelector('.mini'), ok ? 'mascot_cheer' : 'mascot_sad');
    var sb = fb.querySelector('.sbtn'); if (sb) sb.appendChild(sayBtn(function () { speak('w.' + w); }, t('ui.replay')));
    var b = el('button', 'btn ' + (ok ? 'go' : 'coral'), esc(t('ui.continue'))); b.dataset.act = 'continue';
    b.addEventListener('click', function () { hush(); sfx('pop'); nextItem(); });
    fb.appendChild(b);
    requestAnimationFrame(function () { fb.classList.add('on'); try { b.focus({ preventScroll: true }); } catch (e) { /* old */ } });
    announce(t(msgKey) + (ok ? '' : ' ' + C.WORDS[w].text));
    hush();
    if (ok) { speak(msgKey, { auto: true }); if (sayKey) speak(sayKey, { queue: true, auto: true }); }
    else if (it.type !== 'match' && it.type !== 'speed') speakAll([msgKey, 'w.' + w], { auto: true });
    else speak(msgKey, { auto: true });
  }
  function combo(n) {
    var c = $('lCombo'); c.textContent = t('combo.' + n); c.classList.remove('on'); void c.offsetWidth;
    if (!reduced()) c.classList.add('on'); else { c.style.opacity = '1'; setTimeout(function () { c.style.opacity = ''; }, 1400); }
    sfx('levelup'); speak('combo.' + n, { queue: true, auto: true });
  }
  function quitAsk() {
    sheet(function (sh) {
      sh.innerHTML = '<div class="hero" style="width:110px;height:120px;margin:0"></div><h2>' + esc(t('ui.quitAsk')) + '</h2><p>' + esc(t('ui.quitP')) + '</p>';
      bgOf(sh.firstChild, 'mascot_sad');
      var row = el('div', 'row2'), keep = el('button', 'btn go', esc(t('ui.keep'))), stop = el('button', 'btn quiet', esc(t('ui.quit')));
      keep.addEventListener('click', closeSheet);
      stop.addEventListener('click', function () { if (L && L.item && L.item.stop) L.item.stop(); L = null; openMap(); });
      row.appendChild(stop); row.appendChild(keep); sh.appendChild(row);
    });
  }

  /* ---------- the end of a lesson ---------- */
  function finish() {
    var kind = L.kind, n = L.node, earned = C.xpFor(kind, L.right, L.plan.items.length, L.mistakes, L.best);
    C.grade(save, L.results);
    save.played++;
    save.xp += earned;
    if (save.today.day !== today()) save.today = { day: today(), xp: 0 };
    save.today.xp += earned;
    var streakUp = C.addDay(save, today());
    var stars = C.starsFor(L.mistakes);
    if (n && n.kind !== 'treasure') save.done[n.id] = Math.max(save.done[n.id] || 0, stars);
    var heart = false;
    if (kind === 'practice' && C.hearts(save, now()).n < C.HEARTS) { C.gainHeart(save, now()); heart = true; }
    store();
    try { if (window.BRB && BRB.gameOver) BRB.gameOver({ won: true, score: save.xp }); } catch (e) { /* offline */ }
    var words = Object.keys(L.results);

    var box = $('doneBox'); box.innerHTML = ''; box.className = 'endbox col';
    var hero = el('div', 'hero' + (reduced() ? '' : ' bob')); bgOf(hero, 'mascot_cheer'); box.appendChild(hero);
    box.appendChild(el('h1', '', esc(t(kind === 'review' ? 'ui.reviewDone' : kind === 'practice' ? 'ui.practiceDone' : 'ui.lessonDone'))));
    var acc = Math.round(100 * L.right / Math.max(1, L.plan.items.length));

      '<div class="stat paper patch"><b style="color:#2c8d55">' + acc + '%</b><span>' + esc(t('ui.right')) + '</span></div>' +
      '<div class="stat paper patch"><b>' + IC.flame + C.streakNow(save, today()) + '</b><span>' + esc(t('ui.days')) + '</span></div>' +
      (heart ? '<div class="stat paper patch"><b>' + IC.heart + '+1</b><span>' + esc(t('hearts.back')) + '</span></div>' : '');
    box.appendChild(stats);
    if (words.length) {
      box.appendChild(el('p', 'sub paper patch', esc(t('ui.practised'))));
      var chips = el('div', 'chips');
      words.slice(0, 10).forEach(function (w) { var c = el('button', 'wchip paper', esc(C.WORDS[w].text)); c.addEventListener('click', function () { speak('w.' + w); }); chips.appendChild(c); });
      box.appendChild(chips);
    }
    var b = el('button', 'btn go', esc(t('ui.continue'))); b.dataset.act = 'done';
    b.addEventListener('click', function () { sfx('pop'); L = null; openMap(); scrollToCurrent(true); });
    $('doneFoot').innerHTML = ''; $('doneFoot').appendChild(b);
    sfx('win');
    var lines = ['done.say']; if (L.mistakes === 0) lines.push('done.perfect'); if (streakUp) lines.push('done.streak'); if (heart) lines.push('hearts.back');
    speakAll(lines, { auto: true });
    if (!reduced()) { try { if (window.BRB && BRB.fx && BRB.fx.confetti) BRB.fx.confetti(); } catch (e) { /* none */ } }
    lastDone = { kind: kind, xp: earned, right: L.right, mistakes: L.mistakes, streakUp: streakUp, heart: heart, stars: stars };
  }
  var lastDone = null;

  /* ---------- the unit treasure ---------- */
  var BADGE = ['#ff8a3d', '#4fa8f0', '#e8483c', '#2f9a74', '#9d84e6'];
  function openTreasure(n) {
    show('done'); hush();
    var box = $('doneBox'), opened = save.treasures.indexOf(n.unit) >= 0;
    box.className = 'endbox col tre';
    box.innerHTML = '';
    box.appendChild(el('h1', '', esc(t('ui.treasureT'))));
    box.appendChild(el('p', 'sub paper patch', esc(t('ui.unit', { n: n.unit + 1 }) + ' · ' + t('ui.u' + n.unit))));
    var chest = el('button', 'chest'); chest.dataset.act = 'chest'; chest.setAttribute('aria-label', t('treasure.tap'));
    bgOf(chest, opened ? 'chest_open' : 'chest_closed');
    if (!ART.chest_closed) { chest.style.background = '#b5733f'; chest.style.borderRadius = '22px'; }
    box.appendChild(chest);
    var trow = el('div', 'trow'), hero = el('div', 'hero'); hero.style.height = '150px'; bgOf(hero, opened ? 'mascot_cheer' : 'mascot_idle'); trow.appendChild(hero); box.appendChild(trow);
    var foot = $('doneFoot'); foot.innerHTML = '';
    var cont = el('button', 'btn go', esc(t('ui.continue'))); cont.dataset.act = 'done';
    cont.addEventListener('click', function () { openMap(); scrollToCurrent(true); });
    var reveal = function () {
      bgOf(chest, 'chest_open'); bgOf(hero, 'mascot_cheer');
      var badge = el('div', 'badge felt', IC.star + '<small>' + esc(t('ui.u' + n.unit)) + '</small>');
      badge.style.backgroundColor = BADGE[n.unit]; trow.insertBefore(badge, hero); hero.style.height = '';

    };
    if (opened) { reveal(); return; }
    speak('treasure.tap', { auto: true });
    chest.addEventListener('click', function once() {
      chest.removeEventListener('click', once);
      if (!reduced()) chest.classList.add('shake');
      sfx('select');
      setTimeout(function () {
        save.treasures.push(n.unit); save.xp += 25; store();
        try { if (window.BRB && BRB.gameOver) BRB.gameOver({ won: true, score: save.xp }); } catch (e) { /* offline */ }
        sfx('win'); reveal(); speak('treasure.say', { auto: true });
        if (!reduced()) { try { if (window.BRB && BRB.fx && BRB.fx.confetti) BRB.fx.confetti(); } catch (e) { /* none */ } }
      }, reduced() ? 0 : 900);
    });
  }

  /* ---------- hearts, practice and the word book ---------- */
  function heartsOut() {
    speak('hearts.out', { auto: true });
    sheet(function (sh) {
      var h = C.hearts(save, now());
      sh.innerHTML = '<div class="hero" style="width:120px;height:130px;margin:0"></div><h2>' + esc(t('ui.heartsOut')) + '</h2><p>' + esc(t('hearts.out')) + '</p><p style="font-size:16px">' + esc(t('ui.heartsSoon')) + '</p>';
      bgOf(sh.firstChild, 'mascot_sad');
      var row = el('div', 'row2'), later = el('button', 'btn quiet', esc(t('ui.later'))), go = el('button', 'btn go', esc(t('ui.practise')));
      later.addEventListener('click', closeSheet); go.addEventListener('click', function () { closeSheet(); practice(); });
      row.appendChild(later); row.appendChild(go); sh.appendChild(row);
      void h;
    });
  }
  function practice() {
    var plan = C.planPractice(save, seed(), T);
    if (!plan) { sheet(function (sh) { sh.innerHTML = '<h2>' + esc(t('ui.practise')) + '</h2><p>' + esc(t('ui.noWords')) + '</p>'; var b = el('button', 'btn go wide', esc(t('ui.close'))); b.addEventListener('click', closeSheet); sh.appendChild(b); }); return; }
    startLesson(null, plan);
  }
  function wordBook() {
    sheet(function (sh) {
      sh.innerHTML = '<h2>' + esc(t('ui.words')) + '</h2><p>' + esc(t('ui.mastery')) + '</p>';
      var bk = el('div', 'wbook'), any = false;
      var cell = function (w, miss) {
        var b = el('button', 'wcell paper' + (miss ? ' miss' : ''), '<span class="word">' + esc(C.WORDS[w].text) + '</span>');
        var m = el('span', 'm'), lv = C.mastery(save, w);
        for (var i = 0; i < 5; i++) m.appendChild(el('i', i < lv ? 'on' : ''));
        b.appendChild(m); b.setAttribute('aria-label', C.WORDS[w].text + ', ' + lv + '/5');
        b.addEventListener('click', function () { speak('w.' + w); });
        return b;
      };
      if (save.missed.length) {
        bk.appendChild(el('h3', '', esc(t('ui.missed'))));
        var g0 = el('div', 'wgrid'); save.missed.forEach(function (w) { g0.appendChild(cell(w, true)); }); bk.appendChild(g0);
      }
      C.UNITS.forEach(function (U) {
        var ws = U.words.filter(function (w) { return save.words[w]; });
        if (!ws.length) return; any = true;
        bk.appendChild(el('h3', '', esc(t('ui.unit', { n: U.i + 1 }) + ' · ' + t('ui.u' + U.i))));
        var g = el('div', 'wgrid'); ws.forEach(function (w) { g.appendChild(cell(w, false)); }); bk.appendChild(g);
      });
      if (!any) bk.appendChild(el('p', '', esc(t('ui.noWords'))));
      sh.appendChild(bk);
      var b = el('button', 'btn go wide', esc(t('ui.close'))); b.addEventListener('click', closeSheet); sh.appendChild(b);
    });
  }

  /* ---------- title ---------- */
  function drawTitle() {
    var logo = document.querySelector('#title .logo'), cols = ['#ff8a3d', '#4fa8f0', '#46b873', '#e8483c', '#9d84e6'], i = 0;
    logo.innerHTML = '';
    t('ui.title').split(' ').forEach(function (word, wi) {
      var wb = el('b'); logo.appendChild(wb);
      word.split('').forEach(function (ch, ci) {
        var s = el('span', 'felt', esc(ch)); s.style.backgroundColor = cols[i++ % cols.length]; s.style.rotate = ((i % 2 ? -1 : 1) * (2 + (i % 3))) + 'deg';
        wb.appendChild(s);
      });
    });
    $('titleText').textContent = t('ui.title'); $('titleSub').textContent = t('ui.sub');
    $('playBtn').textContent = t('ui.play');
  }

  /* ---------- wiring ---------- */
  $('playBtn').addEventListener('click', function () {
    sfx('select');
    var first = !save.played;
    speak('title.hi', { auto: true });

  });
  $('lQuit').innerHTML = IC.x; $('lQuit').setAttribute('aria-label', t('ui.quit'));
  $('lQuit').addEventListener('click', quitAsk);
  $('cSound').addEventListener('click', function () { try { if (window.BRB && BRB.sfx) BRB.sfx.mute(); } catch (e) { /* none */ } if (muted()) hush(); refreshBar(); });
  $('cHearts').addEventListener('click', function () { if (C.hearts(save, now()).n < C.HEARTS) heartsOut(); });
  $('bWords').addEventListener('click', wordBook);
  $('bPractice').addEventListener('click', practice);
  var rz = null;
  window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { if (screen === 'map') { drawMap(); } }, 150); });
  if (window.matchMedia) try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { applyTheme(); if (screen === 'map') drawMap(); }); } catch (e) { /* old */ }
  setInterval(function () { if (screen === 'map') refreshBar(); }, 30000);

  load(); applyTheme(); drawBackdrop(); drawTitle(); applyArt();
  loadArt(function () { applyArt(); if (screen === 'map') drawMap(); });

  /* ---------- test hooks (the e2e tests, the covers and the contact sheet) ---------- */
  function rightAction(wrong) {
    var it = L && L.item, st = $('lStage');
    if (!it || L.answered) return false;
    var pickCard = function (pred) { var c = Array.prototype.find.call(st.querySelectorAll('[data-word]'), pred); if (c) c.click(); return !!c; };
    if (it.type === 'hear' || it.type === 'fill') return pickCard(function (c) { return c.classList.contains('card') && (wrong ? c.dataset.word !== it.word : c.dataset.word === it.word); });
    if (it.type === 'say') { pickCard(function (c) { return c.classList.contains('opt') && (wrong ? c.dataset.word !== it.word : c.dataset.word === it.word); }); $('lFoot').querySelector('button').click(); return true; }
    if (it.type === 'build') {
      var tiles = Array.prototype.slice.call(st.querySelectorAll('.tile')), letters = wrong ? it.letters.slice().reverse() : it.letters;
      if (wrong && letters.join('') === it.letters.join('')) letters = [it.tiles.find(function (x) { return it.letters.indexOf(x) < 0; })].concat(it.letters.slice(1));
      letters.forEach(function (l) { var b = tiles.find(function (x) { return x.dataset.letter === l && !x.classList.contains('used'); }); if (b) b.click(); });
      return true;
    }
    if (it.type === 'match') {
      var cards = st.querySelectorAll('.card');
      it.words.forEach(function (w, i) {
        var s = st.querySelector('.say[data-word="' + w + '"]'); s.click();
        var target = wrong && i === 0 ? Array.prototype.find.call(cards, function (c) { return c.dataset.word !== w; }) : null;
        if (target) { target.click(); s.click(); }
        Array.prototype.find.call(cards, function (c) { return c.dataset.word === w; }).click();
      });
      return true;
    }
    if (it.type === 'speed') {
      if (wrong) pickCard(function (c) { return c.dataset.word !== it.word; });
      Array.prototype.forEach.call(st.querySelectorAll('.card'), function (c) { if (c.dataset.word === it.word && !L.answered) c.click(); });
      return true;
    }
    return false;
  }
  function testState() {
    var it = L && L.item;
    return { screen: screen, art: !!ART.mascot_idle, dark: root.classList.contains('dark'), xp: save.xp, streak: C.streakNow(save, today()), hearts: C.hearts(save, now()).n,
      played: save.played, done: Object.keys(save.done), treasures: save.treasures.slice(), missed: save.missed.slice(), current: (C.current(save) || {}).id || null,
      lesson: L ? { kind: L.kind, node: L.node && L.node.id, intro: L.intro.length - L.introAt, left: L.queue.length, total: L.total, done: L.done, right: L.right, mistakes: L.mistakes, combo: L.combo,
        item: it ? { type: it.type, word: it.word, retry: !!it.retry, answered: L.answered } : null } : null,

  }
  window.__brbTest = Object.assign(window.__brbTest || {}, {
    state: testState,
    start: function () { if (screen === 'title') $('playBtn').click(); return testState(); },
    map: function () { openMap(); return testState(); },
    lesson: function (id) { var n = C.BYID[id || (C.current(save) || {}).id]; if (!n) return null; closeSheet(); if (n.kind === 'treasure') openTreasure(n); else startLesson(n); return testState(); },
    practice: function () { practice(); return testState(); },
    intro: function () { while (L && L.introAt < L.intro.length) { L.introAt++; } if (L) nextItem(); return testState(); },
    answer: function (wrong) { rightAction(!!wrong); return testState(); },
    next: function () { var b = document.querySelector(L && L.answered ? '#lFb [data-act="continue"]' : '#lFoot [data-act="next"]'); if (b) b.click(); return testState(); },
    finish: function () { var n = 0; while (L && screen === 'lesson' && n++ < 80) { if (L.introAt < L.intro.length) { window.__brbTest.intro(); continue; } if (!L.answered) rightAction(false); window.__brbTest.next(); } return testState(); },
    setSave: function (o) { save = C.norm(JSON.parse(JSON.stringify(o || {}))); store(); if (screen === 'map') { refreshBar(); drawMap(); } return testState(); },
    save: function () { return JSON.parse(JSON.stringify(save)); },
    core: function () { return { nodes: C.NODES.length, words: C.ORDER.length }; },
    plan: function () { return L ? JSON.parse(JSON.stringify(L.plan)) : null; },
  });
})();
