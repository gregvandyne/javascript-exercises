<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
  /* Brain Board in the classroom dashboard's look (as Crossword): cream widget cards with a group color on the top edge
     and the icon chip, the schedule's dark "Now" bar for the status and the question, a dotted mint board behind it all,
     light and dark (BRB.theme, else the device), Bricolage Grotesque. Tokens: public/css/app.css, public/css/dash.css. */
  :root {
    --paper: #E1F1E1; --dots: #66C792; --card: #FFFDF2; --card2: #F9F6EB; --hover: #EFEBDC; --ink: #141414; --line: #E2DDCB; --muted: #5B584F;
    --green: #1F9D63; --accent: #66C792; --mint-t: #E1F1E1; --current: #141414; --on-current: #FFFDF2; --coral: #C8432F; --coral-t: #FBE0DA;
    --spark: #FFD23F; --focus: #2563EB; --shade: rgba(20,20,20,.42);
    --g-time: #5AA9D6; --g-class: #66C792; --g-tools: #FFD23F; --g-show: #F28C6B; --g-check: #9B8CE0; --g-join: #4FB6A8;
    --a0: #D64553; --a1: #2F6BDB; --a2: #B07A00; --a3: #1F9D63;
    --shadow: 0 1px 0 rgba(20,20,20,.04), 0 4px 16px rgba(20,20,20,.06); --r: 20px; --r-sm: 12px;
    --font: 'Bricolage Grotesque', var(--ok-font, ui-rounded), system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --paper: #141414; --dots: #2E5A41; --card: #1E1E1B; --card2: #262622; --hover: #2C2C27; --ink: #FFFDF2; --line: #36352F; --muted: #B8B3A1;
    --green: #66C792; --accent: #66C792; --mint-t: #1F3A2B; --current: #66C792; --on-current: #141414; --coral: #FF8A7D; --coral-t: #4A2420;
    --focus: #8AB4FF; --shade: rgba(0,0,0,.6); --a0: #FF7A85; --a1: #7FA7FF; --a2: #F2C14E; --a3: #66C792;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.32);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: var(--font); color: var(--ink); background-color: var(--paper);
    background-image: radial-gradient(var(--dots) 1.5px, transparent 1.6px); background-size: 22px 22px; -webkit-text-size-adjust: 100%; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  :where(button):focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  /* a widget: the dashboard's card, its group color on the top edge and the icon chip only (never on text) */
  .bb-w { --g: var(--g-class); background: var(--card); color: var(--ink); border-radius: var(--r);
    box-shadow: inset 0 5px 0 color-mix(in srgb, var(--g) 80%, var(--card)), 0 0 0 1px color-mix(in srgb, var(--line) 70%, transparent), var(--shadow); }
  .bb-chip { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: color-mix(in srgb, var(--g, var(--g-class)) 30%, var(--card)); font-size: 1.3rem; line-height: 1; }
  .bb { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px; padding: max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); }
  .bb-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 800; }
  .bb-top .sp { flex: 1; }
  .bb-logo { display: inline-flex; align-items: center; gap: 10px; padding: 4px 14px 4px 4px; border-radius: 16px; font-size: clamp(18px, 2.6vw, 28px); letter-spacing: -.01em; --g: var(--g-tools); }
  .bb-logo .bb-chip { width: clamp(36px, 4.4vw, 48px); height: clamp(36px, 4.4vw, 48px); font-size: clamp(18px, 2.4vw, 26px); }
  .bb-pill { background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 14px; box-shadow: 0 0 0 1px var(--line), var(--shadow); font-size: clamp(14px, 1.8vw, 20px); font-weight: 800; white-space: nowrap; }
  #team { box-shadow: inset 0 -5px 0 var(--team, transparent), 0 0 0 1px var(--line), var(--shadow); }
  .bb-pill.gold { background: color-mix(in srgb, var(--spark) 34%, var(--card)); }
  button.bb-pill { min-height: 44px; border: 2px solid var(--ink); box-shadow: none; cursor: pointer; }
  button.bb-pill:hover { background: var(--card2); }
  button.bb-pill[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
  :root[data-theme="dark"] button.bb-pill[aria-pressed="true"] { color: #10261A; }
  .bb-btn { font-weight: 800; }
  /* the status: the schedule widget's dark "Now" bar */
  .bb-status { margin: 0 auto; width: min(100%, 1100px); min-height: 1.2em; padding: clamp(8px, 1.3vh, 14px) 18px; border-radius: var(--r-sm); background: var(--current); color: var(--on-current);
    text-align: center; font-weight: 800; font-size: clamp(18px, 3vw, 32px); line-height: 1.2; }
  .bb-status:empty { display: none; }
  .bb-status.mine { background: var(--spark); color: #141414; animation: bb-pulse 1.1s ease-in-out infinite; }
  /* the board: a crisp grid of cards on the dotted board */
  .bb-main { flex: 1; min-height: 0; display: flex; gap: 12px; }
  .bb-grid { flex: 1; min-height: 0; display: grid; gap: clamp(5px, 1vw, 12px); grid-template-rows: auto repeat(5, 1fr); align-content: center; }
  .k0 { --k: var(--g-time); } .k1 { --k: var(--g-class); } .k2 { --k: var(--g-tools); } .k3 { --k: var(--g-show); } .k4 { --k: var(--g-check); } .k5 { --k: var(--g-join); }
  .bb-cat { display: grid; place-items: center; text-align: center; padding: 12px 6px 6px; border-radius: 14px; background: color-mix(in srgb, var(--k) 22%, var(--card));
    box-shadow: inset 0 5px 0 var(--k), 0 0 0 1px color-mix(in srgb, var(--line) 70%, transparent), var(--shadow);
    font-weight: 800; font-size: clamp(11px, 1.9vw, 24px); line-height: 1.1; color: var(--ink); overflow-wrap: normal; word-break: normal; hyphens: manual; min-width: 0; min-height: 2.8em; }
  .bb-cat.sym { font-size: clamp(22px, 4vw, 42px); padding: 8px 4px 2px; }
  .bb-grid.short .bb-cat { min-height: 0; padding: 7px 4px 2px; }
  .bb-grid.short .bb-cat.sym { font-size: 20px; }
  .bb-cat.squeeze { overflow-wrap: anywhere; } /* last resort: a single word wider than its column even at the smallest size */
  .bb-tile { position: relative; perspective: 900px; border: 0; padding: 0; background: none; min-height: 0; cursor: default; font: inherit; color: inherit; border-radius: 14px; }
  .bb-tile .in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3,1.4,.5,1); }
  .bb-tile .f, .bb-tile .b { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; font-variant-numeric: tabular-nums; }
  .bb-tile .f { background: var(--card); color: var(--ink); font-weight: 800; font-size: clamp(18px, 3.8vw, 50px); letter-spacing: -.02em;
    box-shadow: inset 0 5px 0 color-mix(in srgb, var(--k) 85%, var(--card)), 0 0 0 1px color-mix(in srgb, var(--line) 80%, transparent), var(--shadow); transition: transform .15s, background .15s; }
  .bb-tile .b { transform: rotateY(180deg); background: var(--current); color: var(--on-current); font-weight: 800; font-size: clamp(16px, 3vw, 40px); }
  .bb-tile.star .b { background: var(--spark); color: #141414; }
  .bb-tile.open .in { transform: rotateY(180deg) scale(1.06); }
  .bb-tile.done .f { background: color-mix(in srgb, var(--card2) 55%, transparent); color: color-mix(in srgb, var(--muted) 70%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--line) 60%, transparent); font-size: clamp(14px, 2.6vw, 32px); }
  .bb-tile.done.star .f { color: color-mix(in srgb, var(--spark) 80%, var(--ink)); }
  .bb-tile.can { cursor: pointer; }
  .bb-tile.can:hover .f, .bb-tile.can:focus-visible .f { background: var(--hover); transform: translateY(-3px); }
  .bb-tile:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
  .bb-grid.mine .bb-tile.can .f { animation: bb-glow 2s ease-in-out infinite; }
  /* scores (projector) */
  .bb-side { width: clamp(200px, 24vw, 320px); padding: 12px; display: flex; flex-direction: column; gap: 10px; align-self: center; max-height: 100%; overflow: hidden; --g: var(--g-tools); }
  .bb-wh { display: flex; align-items: center; gap: 10px; }
  .bb-side h2 { margin: 0; font-size: clamp(15px, 1.8vw, 22px); font-weight: 800; }
  .bb-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .bb-rows li { display: flex; align-items: center; gap: 6px; background: var(--card2); color: var(--ink); border-radius: var(--r-sm); padding: 4px 8px; font-weight: 800; font-size: clamp(12px, 1.4vw, 18px); line-height: 1.15; }
  .bb-rows li:first-child { background: color-mix(in srgb, var(--spark) 32%, var(--card)); }
  /* a team name is never cut: it fits the wider column, or wraps cleanly */
  .bb-rows li .nm { flex: 1; min-width: 0; white-space: normal; overflow-wrap: break-word; }
  .bb-rows li .tm { flex: none; width: 14px; height: 14px; border-radius: 4px; background: var(--team); box-shadow: 0 0 0 2px var(--card); }
  .bb-rows li canvas { width: 28px; height: 28px; flex: none; }
  /* the lobby: everyone who has joined, as small cards on one widget */
  .bb-lobby { flex: 1; min-height: 0; width: min(100%, 1400px); margin: 0 auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; --g: var(--g-class); }
  .bb-lobby h2 { margin: 0; flex: 1; font-size: clamp(18px, 2.4vw, 28px); font-weight: 800; }
  .bb-n { padding: 2px 12px; border-radius: 999px; background: var(--card2); font-weight: 800; font-size: clamp(15px, 2vw, 22px); }
  .bb-crowd { list-style: none; margin: 0; padding: 4px 2px; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: clamp(8px, 1vw, 14px); }
  .bb-p { position: relative; display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 14px; background: var(--card2); font-weight: 800; font-size: clamp(14px, 1.6vw, 24px);
    max-width: 15em; box-shadow: inset 0 4px 0 var(--team, transparent); animation: bb-join .4s cubic-bezier(.3,1.5,.5,1) both; }
  .bb-p canvas { width: clamp(40px, 3.6vw, 64px); height: clamp(40px, 3.6vw, 64px); flex: none; }
  .bb-p span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bb-p.me { background: color-mix(in srgb, var(--accent) 30%, var(--card)); }
  .bb-p i { position: absolute; top: -12px; inset-inline-end: -6px; font-style: normal; font-size: 22px; }
  .bb-crowd.tight .bb-p { padding: 2px; } .bb-crowd.tight .bb-p span { display: none; } .bb-crowd.tight .bb-p canvas { width: 30px; height: 30px; }
  .bb-empty { margin: auto; color: var(--muted); font-weight: 700; font-size: clamp(16px, 2vw, 22px); }
  /* the question card: a widget over the board, the question in the dark bar */
  .bb-card { position: fixed; inset: 0; z-index: 5; transform: translateZ(0); display: flex; align-items: center; justify-content: center; padding: 12px; background: var(--shade); }
  .bb-cardin { width: min(1100px, 100%); max-height: 100%; overflow: auto; padding: clamp(12px, 2.2vw, 26px); display: flex; flex-direction: column; gap: clamp(8px, 1.6vw, 16px); animation: bb-in .45s cubic-bezier(.3,1.5,.5,1); }
  .bb-chead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: clamp(15px, 2vw, 24px); }
  .bb-chead .cat { font-weight: 800; overflow-wrap: anywhere; }
  .bb-chead .val { padding: 4px 14px; border-radius: 999px; background: var(--card2); font-weight: 800; box-shadow: 0 0 0 1px var(--line); }
  .bb-chead .lucky { padding: 4px 14px; border-radius: 999px; background: var(--spark); color: #141414; font-weight: 800; animation: bb-pulse 1s ease-in-out infinite; }
  .bb-chead .sp { flex: 1; }
  .bb-qbar { display: flex; align-items: center; gap: clamp(10px, 1.6vw, 18px); padding: clamp(10px, 1.6vw, 18px) clamp(12px, 1.8vw, 22px); border-radius: var(--r-sm); background: var(--current); color: var(--on-current); }
  .bb-ring { width: clamp(48px, 6vw, 64px); height: clamp(48px, 6vw, 64px); position: relative; flex: none; }
  .bb-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .bb-ring .tr { stroke: color-mix(in srgb, var(--on-current) 22%, transparent); }
  .bb-ring #ring { stroke: var(--spark); transition: stroke .3s; }
  :root[data-theme="dark"] .bb-ring #ring { stroke: var(--on-current); }
  .bb-ring.low #ring { stroke: var(--coral); }
  .bb-ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(18px, 2.2vw, 24px); font-variant-numeric: tabular-nums; }
  .bb-q { margin: 0; flex: 1; text-align: center; font-weight: 800; font-size: clamp(17px, min(4.2vw, 4.2vh), 46px); line-height: 1.2; overflow-wrap: anywhere; }
  .bb-pad { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(8px, 1.2vw, 14px); }
  .bb-a { --c: var(--a0); position: relative; overflow: hidden; min-height: 64px; border: 3px solid var(--c); border-radius: 18px; background: color-mix(in srgb, var(--c) 12%, var(--card)); color: var(--ink);
    font-weight: 800; font-size: clamp(16px, min(3vw, 3.2vh), 34px); line-height: 1.15; padding: 8px 12px 8px 8px; display: flex; align-items: center; gap: 12px; text-align: start; cursor: pointer;
    transition: transform .08s, opacity .2s, background .2s; }
  .bb-a:hover:not([disabled]) { background: color-mix(in srgb, var(--c) 22%, var(--card)); }
  .bb-a:active:not([disabled]) { transform: translateY(2px); }
  .bb-a .sh { display: grid; place-items: center; flex: none; width: 1.8em; height: 1.8em; border-radius: 12px; background: var(--c); color: #fff; font-size: 1em; }
  :root[data-theme="dark"] .bb-a .sh { color: #141414; }
  .bb-a .tx { flex: 1; overflow-wrap: anywhere; }
  .bb-a .n { flex: none; padding: 2px 12px; border-radius: 999px; background: var(--card); box-shadow: 0 0 0 2px var(--c); font-size: .9em; font-variant-numeric: tabular-nums; }
  .bb-a[disabled] { cursor: default; opacity: .55; }
  html.host .bb-a[disabled] { opacity: 1; } /* the projector shows the answers at full strength (it never answers) */
  html.host .bb-a.dimmed { opacity: .72; }
  .bb-a.pick { opacity: 1; box-shadow: 0 0 0 4px var(--ink); }
  .bb-a.right { opacity: 1; border-color: var(--green); background: color-mix(in srgb, var(--green) 26%, var(--card)); box-shadow: 0 0 0 4px var(--green); }
  .bb-a.right::after { content: '✓'; flex: none; display: grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--green); color: #fff; font-size: .9em; }
  :root[data-theme="dark"] .bb-a.right::after { color: #10261A; }
  .bb-a:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
  .c0 { --c: var(--a0); } .c1 { --c: var(--a1); } .c2 { --c: var(--a2); } .c3 { --c: var(--a3); }
  .bb-note { margin: 0; text-align: center; font-weight: 800; font-size: clamp(18px, 3vw, 32px); min-height: 1.2em; }
  .bb-note.good { color: var(--green); } .bb-note.bad { color: var(--coral); }
  /* the Lucky Star burst */
  .bb-burst { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; pointer-events: none; }
  .bb-burst div { display: flex; flex-direction: column; align-items: center; padding: 18px 34px 22px; border-radius: 28px; background: var(--card); text-align: center; font-weight: 800; color: var(--ink);
    box-shadow: inset 0 6px 0 var(--spark), 0 0 0 1px var(--line), 0 12px 40px rgba(0,0,0,.25); animation: bb-star 1.8s ease-out forwards; }
  .bb-burst big { display: block; font-size: clamp(90px, 20vw, 200px); line-height: 1; color: var(--spark); text-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .bb-burst span { font-size: clamp(24px, 5vw, 56px); }
  .bb-banner { position: fixed; left: 50%; top: 44%; transform: translate(-50%, -50%); z-index: 7; margin: 0; background: var(--current); color: var(--on-current); border-radius: 26px; padding: 8px 34px;
    font-weight: 800; font-size: clamp(30px, 8vw, 84px); box-shadow: 0 10px 30px rgba(0,0,0,.25); pointer-events: none; font-variant-numeric: tabular-nums; }
  .bb-banner:empty { display: none; }
  /* the end: the class's (or this player's own) result, and a team podium in team games, in the same cards */
  .bb-end { position: fixed; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .bb-endin { width: min(760px, 100%); max-height: 100%; overflow: auto; padding: clamp(14px, 2.4vw, 28px); display: flex; flex-direction: column; align-items: center; gap: 14px; --g: var(--g-tools); }
  .bb-endin .bb-wh { align-self: stretch; }
  .bb-end h2 { margin: 0; flex: 1; font-size: clamp(24px, 4.4vw, 52px); font-weight: 800; line-height: 1.1; }
  .bb-podium { display: flex; justify-content: center; align-items: flex-end; gap: 12px; width: 100%; }
  .bb-step { display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; text-align: center; width: 30%; max-width: 200px; overflow-wrap: anywhere; font-size: clamp(14px, 2vw, 22px); }
  .bb-step canvas { width: clamp(56px, 8vw, 84px); height: clamp(56px, 8vw, 84px); }
  .bb-step i { --g: var(--g-tools); display: grid; place-items: start center; padding-top: 10px; width: 100%; border-radius: 16px 16px 6px 6px; background: color-mix(in srgb, var(--g) 30%, var(--card2));
    box-shadow: inset 0 5px 0 var(--g); font-style: normal; font-size: clamp(24px, 3vw, 34px); transform-origin: 50% 100%; animation: bb-rise .8s cubic-bezier(.2,1.4,.4,1) both; }
  .bb-step:nth-child(1) i { --g: var(--g-time); animation-delay: .3s; } .bb-step:nth-child(3) i { --g: var(--g-show); animation-delay: 0s; } .bb-step:nth-child(2) i { animation-delay: .6s; }
  .bb-end ol { margin: 0; align-self: stretch; padding: 0; list-style: none; counter-reset: r 3; display: flex; flex-direction: column; gap: 6px; font-weight: 800; font-size: clamp(15px, 2vw, 22px); }
  .bb-end ol:empty { display: none; }
  .bb-endline { margin: 0; text-align: center; font-weight: 800; font-size: clamp(18px, 2.8vw, 32px); }
  .bb-endline:empty { display: none; }
  .bb-end ol li { padding: 6px 14px; border-radius: var(--r-sm); background: var(--card2); overflow-wrap: anywhere; }
  .bb-end ol[start] li { counter-increment: r; }
  .bb-end ol[start] li::before { content: counter(r) '. '; color: var(--muted); }
  .bb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @keyframes bb-in { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes bb-join { from { transform: scale(.4); opacity: 0; } }
  @keyframes bb-rise { from { transform: scaleY(0); } }
  @keyframes bb-pulse { 50% { transform: scale(1.04); } }
  @keyframes bb-glow { 50% { box-shadow: inset 0 5px 0 var(--k), 0 0 0 3px var(--spark), var(--shadow); } }
  @keyframes bb-star { 0% { transform: scale(.2) rotate(-20deg); opacity: 0; } 25% { transform: scale(1.08) rotate(4deg); opacity: 1; } 70% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.2); opacity: 0; } }
  /* phones in portrait: taller tiles take up the spare height (fitBoard), and the board sits centered in what is left */
  @media (max-width: 700px) and (orientation: portrait) { .bb-grid { align-content: center; } }
  /* phones: a little more width for the five columns, so a long word ("Centimeters") fits its header whole */
  @media (max-width: 480px) { .bb { padding-left: 8px; padding-right: 8px; } .bb-cat { padding: 9px 1px 4px; letter-spacing: -.01em; } .bb-tile .f, .bb-tile .b, .bb-cat { border-radius: 10px; } }
  @media (max-width: 700px) { .bb-side { display: none !important; } .bb-a { min-height: 56px; gap: 8px; } .bb-logo { padding-inline-end: 10px; } }
  /* very narrow phones: answers stay two by two (all four in view), with less room around them */
  @media (max-width: 380px) { .bb-a { padding: 6px; } .bb-a .sh { width: 1.5em; height: 1.5em; } .bb-card { padding: 6px; } .bb-qbar { padding: 8px 10px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  html.reduced *, html.reduced *::before, html.reduced *::after { animation: none !important; transition: none !important; }
</style>
</head>
<body>
<div class="bb" id="ui">
  <div class="bb-top">
    <span class="bb-logo bb-w"><span class="bb-chip" aria-hidden="true">🌟</span><span id="logo"></span></span>
    <span class="sp"></span>
    <span class="bb-pill" id="team" hidden></span>
    <span class="bb-pill" id="left" hidden></span>

      for (i = 0; i < 5; i++) { // Estimate first: the Rough first habit as the course teaches it, each number
        // rounded to the nearest hundred, then added (249 + 249 is about 200 + 200 = 400). Rounding the exact sum
        // instead can land elsewhere (498 -> 500), so that value is never offered as a wrong choice: only one
        // choice can match a method the course teaches.
        a = ri(140, 480); b = ri(120, 460);
        var est = Math.round(a / 100) * 100 + Math.round(b / 100) * 100, sumRound = Math.round((a + b) / 100) * 100;
        var eWrong = [est - 100, est + 100, est + 200, est - 200, est + 300].filter(function (v) { return v > 0 && v !== sumRound; });
        out.push(nqItem('Rough first: round each number to the nearest hundred, then add. About how much is ' + a + ' + ' + b + '?', 'About ' + est,
          eWrong.map(function (v) { return 'About ' + v; }), 'Estimate first'));
      }
      return out;
    }
    if (NQ_STEP === 'explorer-5.1') { // The Measure Shop (Unit 5.1): measuring is counting units, and a
      // conversion is the same measure wearing a new name (x100 for cm, x1000 for g and ml).
      for (i = 0; i < 5; i++) { // Centimeters: meters renamed in centimeters.
        a = ri(2, 9);
        out.push(nqItem('A ribbon is ' + a + ' meters long. How many centimeters is that?', nqFmt(a * 100),
          [nqFmt(a * 10), nqFmt(a * 1000), nqFmt(a)], 'Centimeters')); // 10 in a meter, 1,000 in a meter, not converted
      }
      for (i = 0; i < 5; i++) { // Kilograms: the shop's heavy unit, renamed in grams.
        a = ri(2, 8);
        out.push(nqItem('How many grams are in ' + a + ' kilograms?', nqFmt(a * 1000),
          [nqFmt(a * 100), nqFmt(a * 10), nqFmt(a)], 'Kilograms')); // 100 or 10 in a kilogram, not converted
      }
      for (i = 0; i < 5; i++) { // Count the units: measuring is counting (the lesson's footprints of 10 cm,
        // its meter stick marked 0 to 100, and its rule that smaller units need a bigger count).
        if (i < 3) {
          a = ri(3, 9);
          out.push(nqItem('Each footprint is 10 centimeters long. How long is a trail of ' + a + ' footprints in a row?', (a * 10) + ' centimeters',
            [a + ' centimeters', (a * 100) + ' centimeters', ((a + 1) * 10) + ' centimeters'], 'Count the units'));
        } else if (i === 3) {
          out.push(nqItem('A meter stick is marked from 0 to 100 centimeters. Where is half a meter?', 'At the 50 mark',
            ['At the 5 mark', 'At the 25 mark', 'At the 100 mark'], 'Count the units'));
        } else {
          out.push(nqItem('A ribbon is measured in meters, then in centimeters. Which count is bigger?', 'The centimeters count',
            ['The meters count', 'The two counts are the same', 'You cannot tell'], 'Count the units'));
        }
      }
      for (i = 0; i < 5; i++) { // Add the measure: two lengths, one unit, joined.
        a = ri(24, 88); b = ri(15, 96);
        out.push(nqItem('A ribbon of ' + a + ' cm is tied to one of ' + b + ' cm. How long together?', (a + b) + ' cm',
          [(a + b + 10) + ' cm', (a + b - 10) + ' cm', Math.abs(a - b) + ' cm'], 'Add the measure'));
      }
      for (i = 0; i < 5; i++) { // Which is longer: units must be renamed before they can be compared.
        a = ri(3, 7);
        out.push(nqItem('Which is the longest?', a + ' meters',
          [(a * 100 - 40) + ' centimeters', (a - 1) + ' meters 90 centimeters', (a * 100 - 150) + ' centimeters'], 'Which is longer'));
      }
      return out;
    }
    if (NQ_STEP === 'explorer-5.3') { // Coins and change (Unit 5.3): a dollar is a whole of 100 cents,
      // coins are its parts, and change is the gap counted up from the price.
      var nqC = function (n) { return n + (n === 1 ? ' cent' : ' cents'); };
      var coinQs = [[1, 25], [2, 50], [3, 75], [4, 100], [5, 125]];
      for (i = 0; i < 5; i++) { // Coin values: quarters counted in cents.
        var qn = coinQs[i][0];
        out.push(nqItem('How many cents is ' + qn + (qn === 1 ? ' quarter?' : ' quarters?'), coinQs[i][1] + ' cents',
          [(qn * 10) + ' cents', (coinQs[i][1] - 5) + ' cents', (coinQs[i][1] + 25) + ' cents'], 'Coin values'));
      }
      for (i = 0; i < 5; i++) { // Make the price: count a handful of coins.
        var cq = ri(1, 3), cd = ri(0, 2), cn = ri(0, 2), cp = ri(0, 4), tot = cq * 25 + cd * 10 + cn * 5 + cp;
        // only the coins you hold, joined the way you say them: "2 quarters, 1 dime and 3 pennies"
        var coins = [[cq, 'quarter', 'quarters'], [cd, 'dime', 'dimes'], [cn, 'nickel', 'nickels'], [cp, 'penny', 'pennies']]
          .filter(function (c) { return c[0] > 0; }).map(function (c) { return c[0] + ' ' + (c[0] === 1 ? c[1] : c[2]); });
        var handful = coins.length > 1 ? coins.slice(0, -1).join(', ') + ' and ' + coins[coins.length - 1] : coins[0];
        out.push(nqItem('You hold ' + handful + '. How many cents do you hold?', tot + ' cents',
          [(tot + 10) + ' cents', (tot - 5) + ' cents', (tot + 25) + ' cents'], 'Make the price'));
      }
      for (i = 0; i < 5; i++) { // Change back: the gap between the price and 100.
        do a = ri(35, 92); while (a === 50); // at 50 the price and the change would be the same choice
        out.push(nqItem('A toy costs ' + a + ' cents. You pay with 100 cents. How much change do you get?', (100 - a) + ' cents',
          [(100 - a + 10) + ' cents', (100 - a - 10 > 0 ? 100 - a - 10 : 100 - a + 20) + ' cents', a + ' cents', (100 + a) + ' cents'], 'Change back'));
      }
      for (i = 0; i < 5; i++) { // Add the prices: two costs, one total.
        a = ri(22, 68); b = ri(15, 58);
        out.push(nqItem('A pen costs ' + a + ' cents and a book costs ' + b + ' cents. How much do they cost together?', (a + b) + ' cents',
          [nqC(a + b + 10), nqC(a + b - 10), nqC(Math.abs(a - b) >= 5 ? Math.abs(a - b) : a + b + 20)], 'Add the prices'));
      }
      for (i = 0; i < 5; i++) { // Dollars and cents: the zero holds the tens place (the Jumble's error).
        var dol = ri(2, 6), cents = [35, 5, 65, 25, 85][i], full = dol * 100 + cents;
        var dropped = cents < 10 ? dol * 100 + 50 : dol * 100 + (cents % 10);
        out.push(nqItem('How many cents is $' + dol + '.' + (cents < 10 ? '0' : '') + cents + '?', full + ' cents',
          [dropped + ' cents', (full + 100) + ' cents', (full - 10) + ' cents'], 'Dollars and cents'));
      }
      out.forEach(function (it) { it.choices = it.choices.map(function (c) { return c === '1 cents' ? '1 cent' : c; }); }); // one cent, never "1 cents"
      return out;
    }
    if (NQ_STEP === 'explorer-6.2') { // Around and inside (Unit 6.2): perimeter is the fence (add the
      // sides), area is the carpet (multiply them) - the two crews' famous mix-up is the lesson.
      for (i = 0; i < 5; i++) { // Fence it: all the way around.
        a = ri(3, 9); b = ri(2, 8); if (b === a) b += 1;
        if (a * b === 2 * (a + b)) b += 1; // area would equal the fence: the signature distractor must not be the key
        out.push(nqItem('A garden is ' + a + ' by ' + b + ' meters. How many meters of fence go around it?', 2 * (a + b),
          [a * b, a + b, 2 * a + b], 'Fence it')); // the carpet, half the fence, one side missed
      }
      for (i = 0; i < 5; i++) { // Carpet it: the covering squares.
        a = ri(3, 9); b = ri(2, 8); if (b === a) b += 1;
        if (a * b === 2 * (a + b)) b += 1; // perimeter would equal the carpet: same guard, other direction
        out.push(nqItem('A rug is ' + a + ' by ' + b + ' meters. What is its area in square meters?', a * b,
          [2 * (a + b), a + b, a * b + 10], 'Carpet it'));
      }
      for (i = 0; i < 5; i++) { // Count the squares: rows of squares, multiplied.
        a = ri(3, 8); b = ri(3, 9);
        out.push(nqItem('A garden has ' + a + ' rows of ' + b + ' square tiles. What is its area in square tiles?', a * b,
          [a + b === a * b - b ? 2 * (a + b) : a + b, a * b - b, a * b + 10], 'Count the squares'));
      }
      var jobs = [ // Fence or carpet? The lesson's question, asked of real jobs: around the edge, or covering inside.
        ['You put a fence all the way around a garden. Which do you need to know?', 'The perimeter'],
        ['You cover a floor with carpet squares. Which do you need to know?', 'The area'],
        ['You glue ribbon around the edge of a card. Which do you need to know?', 'The perimeter'],
        ['You paint the whole top of a table. Which do you need to know?', 'The area'],
        ['You walk once around the edge of a field. Which tells how far you walked?', 'The perimeter'],
      ];
      for (i = 0; i < 5; i++) out.push(nqItem(jobs[i][0], jobs[i][1],
        [jobs[i][1] === 'The area' ? 'The perimeter' : 'The area', 'The number of corners', 'The number of sides'], 'Fence or carpet?'));
      var pairs = [[8, 2, 5], [6, 2, 4], [7, 3, 5], [9, 3, 6], [7, 1, 4]]; // [long, thin, square side]: one fence each
      for (i = 0; i < 5; i++) { // Same fence: the lesson's own comparison, a long thin garden beside a square one
        // with the same fence (8 by 2 and 5 by 5 both take 20 m); the square holds more carpet.
        var L = pairs[i][0], T = pairs[i][1], S = pairs[i][2];
        out.push(nqItem('Two gardens both take ' + (2 * (L + T)) + ' meters of fence: one is ' + L + ' by ' + T + ', one is ' + S + ' by ' + S + '. Which holds more carpet?',
          'The ' + S + ' by ' + S + ' garden', ['The ' + L + ' by ' + T + ' garden', 'They hold the same', 'The one with more fence'], 'Same fence'));
      }
      return out;
    }
    if (NQ_STEP === 'explorer-6.3') { // Lines, symmetry, grids (Unit 6.3): lines by how they sit, symmetry
      // as a fold, and grid addresses read right first, then up (the Jumble's swap is the trap). Only what the
      // lesson teaches: no rays, no turns, no shape families (those belong to 6.1).
      var lineQs = [
        ['Which pair of lines never meets, no matter how far it runs?', 'Parallel lines', ['Perpendicular lines', 'Crossing lines', 'Curved lines']],
        ['Which pair of lines crosses at a square corner?', 'Perpendicular lines', ['Parallel lines', 'Side-by-side lines', 'Curved lines']],
        ['Two rails on a straight track run side by side and never meet. They are...', 'Parallel lines', ['Perpendicular lines', 'Crossing lines', 'Curved lines']],
        ['The corner of a door is where two edges meet at a square corner. They are...', 'Perpendicular lines', ['Parallel lines', 'Crossing lines', 'Curved lines']],
        ['Two lines cross, but not at a square corner. Are they perpendicular?', 'No, they just cross', ['Yes, all crossing lines are', 'Yes, they are parallel', 'No, they are parallel']],
      ];
      for (i = 0; i < 5; i++) out.push(nqItem(lineQs[i][0], lineQs[i][1], lineQs[i][2], 'Parallel or not'));
      var goodLetters = ['A', 'H', 'O', 'T', 'M'], badLetters = [['F', 'G', 'J'], ['L', 'P', 'R'], ['S', 'F', 'Z'], ['G', 'N', 'J'], ['P', 'S', 'L']];
      for (i = 0; i < 5; i++) { // Fold it: one letter of four folds exactly in half.
        out.push(nqItem('Which letter folds exactly in half, both sides matching?', goodLetters[i], badLetters[i], 'Fold it'));
      }
      var foldQs = [
        ['A fold makes two halves land exactly on each other. The fold line is called...', 'The line of symmetry', ['The perimeter', 'The axis', 'The square corner']],
        ['A bar is folded on its halfway line. What do its two halves do?', 'Land exactly on each other', ['Cross at a square corner', 'Run side by side forever', 'Stay different sizes']],
        ['Which word means a fold where both halves match?', 'Symmetry', ['Perimeter', 'Parallel', 'Area']],
        ['The letter A folds down its middle. Where is its line of symmetry?', 'Straight down the middle', ['Across the bottom', 'Along one slanted side', 'It has none']],
        ['The two halves of a fold match exactly. They are the same size and...', 'The same shape, flipped', ['Different shapes', 'Twice as big', 'Half as tall']],
      ];
      for (i = 0; i < 5; i++) out.push(nqItem(foldQs[i][0], foldQs[i][1], foldQs[i][2], 'Lines of symmetry'));
      for (i = 0; i < 5; i++) { // Grid addresses: first number right, second number up.
        a = ri(2, 6); b = ri(2, 5); if (b === a) b += 1;
        out.push(nqItem('Which point is ' + a + ' steps right and ' + b + ' steps up from (0, 0)?', '(' + a + ', ' + b + ')',
          ['(' + b + ', ' + a + ')', '(' + a + ', ' + a + ')', '(' + b + ', ' + b + ')'], 'Grid addresses'));
      }
      for (i = 0; i < 5; i++) { // The swap trap: the card's address, walked in the right order.
        a = ri(2, 6); b = ri(1, 5); if (b === a) b += 1;
        out.push(nqItem('The card says (' + a + ', ' + b + '). Starting at (0, 0), how do you walk there?', a + ' right, then ' + b + ' up',
          [b + ' right, then ' + a + ' up', a + ' up, then ' + b + ' right', (a + b) + ' right, then 0 up'], 'Swap trap'));
      }
      return out;
    }
    if (NQ_STEP === 'explorer-6.1') { // Shape hunt (Unit 6.1): shapes are sorted by properties you can test
      // (sides, square corners), a square is a kind of rectangle, and an angle is an amount of turn. Only the
      // shapes the lesson draws (triangle, square, rectangle, pentagon, hexagon) and only the turn it teaches.
      var sideShapes = [['a triangle', 3], ['a square', 4], ['a pentagon', 5], ['a hexagon', 6], ['a rectangle', 4]];
      for (i = 0; i < 5; i++) { // Count the sides: the property that sorts shapes first.
        a = sideShapes[i][1];
        out.push(nqItem('How many straight sides does ' + sideShapes[i][0] + ' have?', a, [a - 1, a + 1, a + 2], 'Count the sides'));
      }
      var cornerQs = [
        ['How many square corners does a rectangle have?', '4', ['2', '3', '0']],
        ['How many square corners does a square have?', '4', ['2', '1', '0']],
        ['Which shape always has 4 square corners?', 'Rectangle', ['Triangle', 'Pentagon', 'Hexagon']],
        ['Which shape has 4 sides and 4 square corners?', 'Square', ['Triangle', 'Pentagon', 'Hexagon']],
        ['How many corners does a triangle have?', '3', ['4', '2', '5']],
      ];
      for (i = 0; i < 5; i++) out.push(nqItem(cornerQs[i][0], cornerQs[i][1], cornerQs[i][2], 'Square corners'));
      var quadQs = [
        ['Which shape is a quadrilateral?', 'Square', ['Triangle', 'Pentagon', 'Hexagon']],
        ['Which of these has exactly 4 straight sides?', 'Rectangle', ['Triangle', 'Pentagon', 'Hexagon']],
        ['Every quadrilateral has...', '4 straight sides', ['4 square corners', '4 equal sides', '3 corners']],
        ['Is a triangle a quadrilateral?', 'No, it has only 3 sides', ['Yes, it has 3 sides', 'Yes, every shape is', 'No, it is too small']],
        ['Is a hexagon a quadrilateral?', 'No, it has 6 sides', ['Yes, it has 6 sides', 'Yes, it has corners', 'No, it is too big']],
      ];
      for (i = 0; i < 5; i++) out.push(nqItem(quadQs[i][0], quadQs[i][1], quadQs[i][2], 'Quadrilateral?'));
      var famHunt = [
        ['A square is always a kind of...', 'Rectangle', ['Triangle', 'Pentagon', 'Hexagon']],
        ['A rectangle with 4 equal sides is a...', 'Square', ['Triangle', 'Pentagon', 'Hexagon']],
        ['Is every rectangle a square?', 'No, its sides need not be equal', ['Yes, always', 'Yes, if it is big', 'No, it has 5 sides']],
        ['Which two shapes have the same 4 square corners?', 'A square and a rectangle', ['A triangle and a square', 'A pentagon and a hexagon', 'A triangle and a hexagon']],
        ['Why is a square a kind of rectangle?', 'It has 4 sides and 4 square corners', ['It is bigger', 'It has the nicest name', 'It has 3 sides']],
      ];
      for (i = 0; i < 5; i++) out.push(nqItem(famHunt[i][0], famHunt[i][1], famHunt[i][2], 'Families'));
      var turnHunt = [
        ['A square corner is what kind of turn?', 'A quarter turn', ['A half turn', 'A full turn', 'No turn at all']],
        ['You face the door and make a quarter turn. Now you face...', 'A side wall', ['The door again', 'The opposite wall', 'The ceiling']],
        ['An angle measures...', 'How much something turns', ['How long a side is', 'How heavy a shape is', 'How many sides there are']],
        ['Each corner of a rectangle is...', 'A quarter turn', ['A half turn', 'A full turn', 'No turn at all']],
        ['Which shape has a quarter turn at every corner?', 'Square', ['Triangle', 'Pentagon', 'Hexagon']],
      ];
      for (i = 0; i < 5; i++) out.push(nqItem(turnHunt[i][0], turnHunt[i][1], turnHunt[i][2], 'Turns'));
      return out;
    }
    return null;
  }

  /* ---- Number Quest lesson progress: the board saves as you play (Greg, 5 Nov 2026) ----
     A lesson board is 25 tiles, too much to demand in one sitting, so every answer saves the board
     (questions, tiles, star, score) through BRB.storage — the player's cloud save, the same store
     SoloBank uses — and re-entering the step restores it exactly as it was left. The save is per
     player: a signed-in student's board follows their account, and a guest's board lives on their
     guest account, kept for their own view and merged into their real account when they sign in,
     like every other game save. The lesson completes at the NQ_GOAL points target, not at a full
     clear: the report fires once, the moment the goal is reached, and nqPassed is saved with the
     board so no later visit can report it twice. A board used up below the goal starts fresh. */
  var nqPassed = false;
  function nqKey() { return 'bb-nq-' + String(BRB.params.mode); }
  /* The lesson's points goal, on screen for the whole lesson board: points so far against the goal. */
  function goalPill() {
    var el = $('goal'); if (!el) return;
    if (!NQ_STEP || !practice) { el.hidden = true; return; }
    el.hidden = false;
    el.textContent = t('goal', { have: nqFmt(Math.round(practice.score)), need: nqFmt(NQ_GOAL) });
  }
  function nqSave() {
    if (!NQ_STEP || !practice) return;
    var p = practice, b = p.bb;
    try {
      BRB.storage.set(nqKey(), {
        cols: p.items, cats: b.cats, star: p.star, score: p.score, passed: nqPassed ? 1 : 0,
        done: b.t.map(function (col) { return col.map(function (tile) { return tile[1]; }); })
      });
    } catch (e) { /* saves off: the lesson still plays */ }
  }
  /* The saved lesson board rebuilt as a practice round, or null for a fresh board: no save, a save
     that does not parse back into this board's shape, or a used-up board that never met the goal. */
  function nqRestore() {
    var s = null;
    try { s = BRB.storage.get(nqKey()); } catch (e) { /* no save */ }
    if (!s || !Array.isArray(s.cols) || !Array.isArray(s.done) || !Array.isArray(s.cats)) return null;
    if (s.cols.length < 1 || s.cols.length !== s.done.length || s.cols.length !== s.cats.length) return null;
    if (typeof s.score !== 'number' || !(s.score >= 0)) return null;
    var left = 0;
    for (var ci = 0; ci < s.cols.length; ci++) {
      if (!Array.isArray(s.cols[ci]) || !Array.isArray(s.done[ci]) || s.cols[ci].length !== s.done[ci].length) return null;
      for (var r = 0; r < s.cols[ci].length; r++) {
        var it = s.cols[ci][r], st = s.done[ci][r];
        if (!it || typeof it.q !== 'string' || !Array.isArray(it.choices) || typeof it.answer !== 'number' || typeof it.v !== 'number' || typeof it.secs !== 'number') return null;
        if (st !== 0 && st !== 2 && st !== 3) return null;
        if (st === 0) left++;
      }
    }
    nqPassed = !!s.passed;
    if (!left && !nqPassed) return null; // used up below the goal: a fresh board next time
    var star = Array.isArray(s.star) && s.star.length === 2 ? s.star : [-1, -1];
    var tiles = s.cols.map(function (col, c2) { return col.map(function (it2, r2) { return [it2.v, s.done[c2][r2]]; }); });
    return { items: s.cols, star: star, bb: { cats: s.cats, t: tiles, cur: null, turn: 0, turns: 0, left: left }, score: s.score, deadline: 0, to: 0 };
  }

  L.ready({ lobby: true, quiz: true, hostView: true, teams: true, words: ['pick'] });
  if (!L.active) {
    // Playing alone: a Number Quest lesson opens its own board at once; anyone else picks first.
    L.on('start', function () {
      var nq = nqBoardItems();
      if (nq) {
        practice = nqRestore() || boardFrom(nq) || practiceBoard();
        if (practice && nqPassed && !practice.bb.left) {
          // The board was finished on an earlier visit, goal met: show its end state, do not restart it.
          phase = 'ended'; endCard(t('stepDone'), t('score', { n: practice.score })); view(); return;
        }
        phase = 'between'; $('status').textContent = t('practice'); view(); return;
      }
      window.SoloBank.choose({ board: true }, function (items) {
        practice = (items && boardFrom(items)) || practiceBoard(); phase = 'between'; $('status').textContent = t('practice'); view();
      });
    });
  } else if (phase === 'lobby' && !host) $('status').textContent = t('wait');
  O.test({
    state: function () {
      var b = bb();
      return { role: L.role, phase: phase, practice: !!practice, board: b ? { cats: b.cats.slice(), left: b.left, cur: b.cur, turns: b.turns, turn: b.turn, done: b.t.map(function (c) { return c.map(function (x) { return x[1]; }); }) } : null,
        question: Q ? { i: Q.i, q: Q.q, choices: Q.choices.slice(), answered: myPick >= 0, correct: practice && b && b.cur ? practice.items[b.cur[0]][b.cur[1]].answer : null } : null, card: !$('card').hidden, score: myScore, goal: NQ_STEP && practice ? { have: practice.score, need: NQ_GOAL, passed: nqPassed } : null, note: $('note').textContent, status: $('status').textContent, canPick: canPick(b), ended: !$('end').hidden };
    },
    start: function () { return true; },
  });
  window.__brbTest.pick = function (c, r) { pickTile(c, r); };
  window.__brbTest.answer = function (i) { choose(i); };
  window.__brbTest.turns = function () { $('turns').click(); };
})();
</script>
</body>
