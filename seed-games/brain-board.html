      (top || []).slice(0, 8).forEach(function (p) {
        var li = document.createElement('li');
        var c = flat.portrait(p.seat); if (c) { var img = document.createElement('canvas'); img.width = c.width; img.height = c.height; img.getContext('2d').drawImage(c, 0, 0); img.setAttribute('aria-hidden', 'true'); li.appendChild(img); }
        var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = p.name;
        var sc = document.createElement('b'); sc.textContent = p.score; li.append(nm, sc); rows.appendChild(li);
      });
    }
    $('side').hidden = !rows.children.length;
  }
  L.on('leaderboard', function (e) { if (host) scores(e.top); });
  L.on('teams', function () { if (host && L.teamsOn) scores([]); myTeamPill(); });

  // ---- the end: a podium ----
  function podium(top, title) {
    $('end-h').textContent = title;
    var pd = $('podium'), ol = $('end-list'); pd.textContent = ''; ol.textContent = '';
    [1, 0, 2].forEach(function (k) {
      var p = top[k]; if (!p) return;
      var st = document.createElement('div'); st.className = 'bb-step';
      if (p.seat) { var c = flat.portrait(p.seat); if (c) { var img = document.createElement('canvas'); img.width = c.width; img.height = c.height; img.getContext('2d').drawImage(c, 0, 0); img.setAttribute('aria-hidden', 'true'); st.appendChild(img); } }
      var nm = document.createElement('span'); nm.textContent = p.name + ' · ' + p.score; st.appendChild(nm);
      var bar = document.createElement('i'); bar.style.height = [110, 80, 56][k] + 'px'; bar.textContent = k + 1; st.appendChild(bar);
      pd.appendChild(st);
    });
    top.slice(3, 8).forEach(function (p) { var li = document.createElement('li'); li.textContent = p.name + ' · ' + p.score; ol.appendChild(li); });
    ol.start = 4;
  }

  // ---- the session ----
  L.on('phase', function (e) {
    var was = phase;
    phase = e.phase;
    // the question just closed: keep its card up while the answer is revealed (the reveal follows this message)
    if (phase === 'between' && was === 'playing' && Q) revealUntil = performance.now() + 4200;
    if (phase === 'lobby') { $('status').textContent = host ? '' : t('wait'); }
    if (phase === 'loading') $('status').textContent = t('ready');
    view();
  });
  var cd = 0;
  L.on('countdown', function (e) {
    clearInterval(cd);
    // the first countdown (before the board) says 3-2-1; later ones are the tile flipping: a quick 2-1 over the board
    var tick = function () { var left = Math.ceil((e.at - L.now()) / 1000); $('banner').textContent = left > 0 && $('burst').hidden ? String(left) : ''; if (left <= 0) clearInterval(cd); };
    tick(); cd = setInterval(tick, 200);
  });
  L.on('question', function (q) { clearInterval(cd); $('banner').textContent = ''; showCard(q); });
  L.on('answers', function (a) { if (host) $('note').textContent = t('answers', { n: a.n }); });
  L.on('reveal', showReveal);
  L.on('result', showResult);
  L.on('end', function (e) {
    clearInterval(ringTimer); phase = 'ended'; Q = null;
    if (e.teams && e.teams.length && !(e.top && e.top.length)) podium(e.teams.filter(function (x) { return x.rank; }).sort(function (a, b) { return a.rank - b.rank; }).map(function (x) { return { seat: 0, name: x.icon + ' ' + x.name, score: x.score }; }), t('teamPodium'));
    else podium(e.top || [], t('done'));
    view();
    if (!REDUCED) { try { BRB.fx.confetti(); } catch (er) { /* none */ } }
    sfx('win');
  });
  function myTeamPill() { var mt = L.myTeam, el = $('team'); el.hidden = !mt || host; if (mt && !host) { el.textContent = t('yourTeam', { team: mt.icon + ' ' + mt.name }); el.style.background = mt.color; el.style.color = mt.ink; } }
  L.on('welcome', function () { phase = L.phase; myTeamPill(); onBoard(); });

  // ---- practice (played alone): a board of sums, + − × ÷ and a mix, easy at the top ----
  function practiceBoard() {
    var R = O.rand(Date.now() % 100000), items = [], cats = ['+', '−', '×', '÷', '?'];
    function four(ans, spread) { var set = [ans]; while (set.length < 4) { var w = ans + R.int(-spread, spread); if (w !== ans && w >= 0 && set.indexOf(w) < 0) set.push(w); } return R.shuffle(set); }
    var t5 = [];
    cats.forEach(function (c, ci) {
      var col = [];
      for (var r = 0; r < 5; r++) {
        var hi = [9, 20, 50, 100, 500][r], a, b, ans, q;
        if (ci === 0) { a = R.int(1, hi); b = R.int(1, hi); ans = a + b; q = a + ' + ' + b; }
        else if (ci === 1) { a = R.int(2, hi * 2); b = R.int(1, a); ans = a - b; q = a + ' − ' + b; }
        else if (ci === 2) { a = R.int(2, [5, 9, 12, 15, 25][r]); b = R.int(2, [5, 9, 12, 15, 25][r]); ans = a * b; q = a + ' × ' + b; }
        else if (ci === 3) { b = R.int(2, [5, 9, 12, 12, 20][r]); ans = R.int(2, [5, 9, 12, 20, 25][r]); a = b * ans; q = a + ' ÷ ' + b; }
        else { a = R.int(1, hi); ans = R.int(1, hi); b = a + ans; q = a + ' + ? = ' + b; }
        var ch = four(ans, Math.max(3, Math.round(ans / 6)));
        col.push({ q: q.indexOf('?') >= 0 ? q : q + ' = ?', choices: ch.map(String), answer: ch.indexOf(ans), secs: 15 + r * 5, v: (r + 1) * 100 });
      }
      items.push(col);
      t5.push(col.map(function (it) { return [it.v, 0]; }));
    });
    var starAt = [R.int(0, 4), R.int(1, 4)];
    return { items: items, star: starAt, bb: { cats: cats, t: t5, cur: null, turn: 0, turns: 0, left: 25 }, score: 0, deadline: 0, to: 0 };
  }
  function practicePick(ci, r) {
    var p = practice, b = p.bb;
    b.cur = [ci, r, p.star[0] === ci && p.star[1] === r ? 1 : 0]; b.t[ci][r][1] = 1;
    phase = 'countdown'; onBoard();
    setTimeout(function () {
      var it = p.items[ci][r]; phase = 'playing'; p.deadline = performance.now() + it.secs * 1000;
      showCard({ i: ci * 5 + r, n: 25, q: it.q, choices: it.choices, secs: it.secs, at: 0 });
      clearTimeout(p.to); p.to = setTimeout(function () { if (myPick < 0) { myPick = 9; practiceAnswer(-1); } }, it.secs * 1000);
    }, REDUCED ? 300 : 1100);
  }
  function practiceAnswer(i) {
    var p = practice, b = p.bb; clearTimeout(p.to);
    var ci = b.cur[0], r = b.cur[1], it = p.items[ci][r], ok = i === it.answer, star = !!b.cur[2];
    var pts = ok ? (it.v + Math.round(it.v * 0.2 * Math.max(0, p.deadline - performance.now()) / (it.secs * 1000))) * (star ? 2 : 1) : 0;
    p.score += pts; phase = 'between';
    showReveal({ answer: it.answer }); showResult({ ok: ok, points: pts, score: p.score, none: i < 0 });
    b.t[ci][r][1] = star ? 3 : 2; b.cur = null; b.left--;
    setTimeout(function () {
      if (!b.left) { phase = 'ended'; Q = null; podium([{ seat: 0, name: BRB.user.displayName || t('title'), score: p.score }], t('done')); view(); sfx('win'); if (!REDUCED) { try { BRB.fx.confetti(); } catch (e) { /* none */ } } }
      else view();
    }, 1950);
  }

  L.ready({ lobby: true, quiz: true, hostView: true, teams: true, words: ['pick'] });
  if (!L.active) {
    L.on('start', function () { practice = practiceBoard(); phase = 'between'; $('status').textContent = t('practice'); view(); });
  } else if (phase === 'lobby' && !host) $('status').textContent = t('wait');
  O.test({
    state: function () {
      var b = bb();
      return { role: L.role, phase: phase, practice: !!practice, board: b ? { cats: b.cats.slice(), left: b.left, cur: b.cur, turns: b.turns, turn: b.turn, done: b.t.map(function (c) { return c.map(function (x) { return x[1]; }); }) } : null,
        question: Q ? { i: Q.i, q: Q.q, choices: Q.choices.slice(), answered: myPick >= 0 } : null, card: !$('card').hidden, score: myScore, note: $('note').textContent, status: $('status').textContent, canPick: canPick(b), ended: !$('end').hidden };
    },
    start: function () { return true; },
  });
  window.__brbTest.pick = function (c, r) { pickTile(c, r); };
  window.__brbTest.answer = function (i) { choose(i); };
  window.__brbTest.turns = function () { $('turns').click(); };
})();
</script>
