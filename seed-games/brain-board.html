<title>Brain Board</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: var(--ok-font, system-ui, sans-serif); background: #14183a; color: #fff8e6; }
  html.light, html.light body { background: #1b2150; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  [hidden] { display: none !important; }
  .bb { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px; padding: max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); }
  .bb-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 800; }
  .bb-top .sp { flex: 1; }
  .bb-logo { display: inline-flex; align-items: center; gap: 8px; font-size: clamp(18px, 3vw, 28px); letter-spacing: .02em; color: #ffd24a; text-shadow: 0 3px 0 #0b0e26; }
  .bb-logo i { font-style: normal; display: inline-block; animation: bb-tw 2.4s ease-in-out infinite; }
  .bb-pill { background: #fff8e6; color: #1d2340; border-radius: 999px; padding: 6px 14px; border: 3px solid #0b0e26; box-shadow: 0 3px 0 #0b0e26; font-size: clamp(14px, 2vw, 18px); white-space: nowrap; }
  .bb-pill.gold { background: #ffd24a; }
  button.bb-pill { min-height: 44px; }
  .bb-btn { font: inherit; font-weight: 800; cursor: pointer; }
  .bb-status { margin: 0 auto; text-align: center; font-weight: 800; font-size: clamp(18px, 3.6vw, 32px); color: #fff8e6; text-shadow: 0 3px 0 #0b0e26; min-height: 1.2em; }
  .bb-status.mine { color: #ffd24a; animation: bb-pulse 1.1s ease-in-out infinite; }

  .bb-main { flex: 1; min-height: 0; display: flex; gap: 12px; }

  .bb-cat.sym { font-size: clamp(22px, 4vw, 40px); padding: 2px 4px; }
  .bb-grid.short .bb-cat { min-height: 0; padding: 2px 4px; box-shadow: 0 2px 0 #0b0e26; }
  .bb-grid.short .bb-cat.sym { font-size: 20px; }
  .bb-cat { display: grid; place-items: center; text-align: center; padding: 6px 4px; border-radius: 14px; border: 3px solid #0b0e26; box-shadow: 0 4px 0 #0b0e26; font-weight: 800; font-size: clamp(11px, 1.9vw, 22px); line-height: 1.1; color: #1d2340; overflow-wrap: normal; word-break: normal; hyphens: manual; min-width: 0; min-height: 2.6em; }

  .bb-tile { position: relative; perspective: 900px; border: 0; padding: 0; background: none; min-height: 0; cursor: default; font: inherit; }
  .bb-tile .in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3,1.4,.5,1); }
  .bb-tile .f, .bb-tile .b { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 14px; border: 3px solid #0b0e26; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .bb-tile .f { background: linear-gradient(160deg, #3d4bb8, #262f86); box-shadow: inset 0 -6px 0 rgba(0,0,0,.25), 0 4px 0 #0b0e26; color: #ffd24a; font-weight: 900; font-size: clamp(16px, 3.6vw, 44px); text-shadow: 0 3px 0 #0b0e26; }
  .bb-tile .b { transform: rotateY(180deg); background: #fff8e6; color: #1d2340; font-weight: 900; font-size: clamp(14px, 2.6vw, 30px); }
  .bb-tile.star .b { background: radial-gradient(circle, #fff4b0, #ffd24a 60%, #ff9f1a); }
  .bb-tile.open .in { transform: rotateY(180deg) scale(1.06); }
  .bb-tile.done .f { background: #1c2152; color: rgba(255,248,230,.28); text-shadow: none; box-shadow: none; font-size: clamp(14px, 2.6vw, 30px); }
  .bb-tile.can { cursor: pointer; }
  .bb-tile.can:hover .f, .bb-tile.can:focus-visible .f { background: linear-gradient(160deg, #5664d8, #333ea6); transform: translateY(-2px); }
  .bb-tile:focus-visible { outline: 4px solid #ffd24a; outline-offset: 2px; border-radius: 14px; }
  .bb-tile.can .f { animation: bb-glow 2s ease-in-out infinite; }

  .bb-side h2 { margin: 0; font-size: clamp(14px, 1.8vw, 20px); color: #ffd24a; text-shadow: 0 2px 0 #0b0e26; }
  .bb-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

  .bb-rows li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bb-rows li canvas { width: 26px; height: 26px; flex: none; }

  .bb-a .sh { font-size: 1.2em; width: 1.3em; text-align: center; flex: none; }
  .bb-a .tx { flex: 1; overflow-wrap: anywhere; }
  .bb-a .n { font-size: .85em; background: rgba(0,0,0,.25); border-radius: 99px; padding: 2px 10px; }

  .bb-a:focus-visible { outline: 4px solid #ffd24a; outline-offset: 3px; }

  .bb-burst div { text-align: center; font-weight: 900; color: #ffd24a; text-shadow: 0 4px 0 #0b0e26; animation: bb-star 1.8s ease-out forwards; }

  .bb-step canvas { width: 76px; height: 76px; }

  // ---- practice (played alone): a board of sums, + − × ÷ and a mix, easy at the top ----
  function practiceBoard() {
    var R = O.rand(Date.now() % 100000), items = [], cats = ['+', '−', '×', '÷', '?'];
    function four(ans, spread) { var set = [ans]; while (set.length < 4) { var w = ans + R.int(-spread, spread); if (w !== ans && w >= 0 && set.indexOf(w) < 0) set.push(w); } return R.shuffle(set); }

        else if (ci === 3) { b = R.int(2, [5, 9, 12, 12, 20][r]); ans = R.int(2, [5, 9, 12, 20, 25][r]); a = b * ans; q = a + ' ÷ ' + b; }
        else { a = R.int(1, hi); ans = R.int(1, hi); b = a + ans; q = a + ' + ? = ' + b; }

  /** A practice board from bank items (grouped by subject, easy to hard): up to 6 columns of 5, values 100-500. */

        ['A rectangle with 4 equal sides is a...', 'Square', ['Triangle', 'Pentagon', 'Hexagon']],
        ['Is every rectangle a square?', 'No, its sides need not be equal', ['Yes, always', 'Yes, if it is big', 'No, it has 5 sides']],
        ['Which two shapes have the same 4 square corners?', 'A square and a rectangle', ['A triangle and a square', 'A pentagon and a hexagon', 'A triangle and a hexagon']],
        ['Why is a square a kind of rectangle?', 'It has 4 sides and 4 square corners', ['It is bigger', 'It has the nicest name', 'It has 3 sides']],
      ];
      for (i = 0; i < 5; i++) out.push(nqItem(famHunt[i][0], famHunt[i][1], famHunt[i][2], 'Families'));
      var turnHunt = [
        ['A square corner is what kind of turn?', 'A quarter turn', ['A half turn', 'A full turn', 'No turn at all']],
        ['You face the door and make a quarter turn. Now you face...', 'A side wall', ['The door again', 'The opposite wall', 'The ceiling']],
        ['An angle measures...', 'How much something turns', ['How long a side is', 'How heavy a shape is', 'How many sides there are']],
        ['Each corner of a rectangle is...', 'A quarter turn', ['A half turn', 'A full turn', 'No turn at all']],
        ['Which shape has a quarter turn at every corner?', 'Square', ['Triangle', 'Pentagon', 'Hexagon']],
      ];
      for (i = 0; i < 5; i++) out.push(nqItem(turnHunt[i][0], turnHunt[i][1], turnHunt[i][2], 'Turns'));
      return out;
    }
    return null;
  }

  /* ---- Number Quest lesson progress: the board saves as you play (Greg, 5 Nov 2026) ----
     A lesson board is 25 tiles, too much to demand in one sitting, so every answer saves the board
     (questions, tiles, star, score) through BRB.storage — the player's cloud save, the same store
     SoloBank uses — and re-entering the step restores it exactly as it was left. The save is per
     player: a signed-in student's board follows their account, and a guest's board lives on their
     guest account, kept for their own view and merged into their real account when they sign in,
     like every other game save. The lesson completes at the NQ_GOAL points target, not at a full
     clear: the report fires once, the moment the goal is reached, and nqPassed is saved with the
     board so no later visit can report it twice. A board used up below the goal starts fresh. */
  var nqPassed = false;
  function nqKey() { return 'bb-nq-' + String(BRB.params.mode); }
  /* The lesson's points goal, on screen for the whole lesson board: points so far against the goal. */
  function goalPill() {
    var el = $('goal'); if (!el) return;
    if (!NQ_STEP || !practice) { el.hidden = true; return; }
    el.hidden = false;
    el.textContent = t('goal', { have: nqFmt(Math.round(practice.score)), need: nqFmt(NQ_GOAL) });
  }
  function nqSave() {
    if (!NQ_STEP || !practice) return;
    var p = practice, b = p.bb;
    try {
      BRB.storage.set(nqKey(), {
        cols: p.items, cats: b.cats, star: p.star, score: p.score, passed: nqPassed ? 1 : 0,
        done: b.t.map(function (col) { return col.map(function (tile) { return tile[1]; }); })
      });
    } catch (e) { /* saves off: the lesson still plays */ }
  }
  /* The saved lesson board rebuilt as a practice round, or null for a fresh board: no save, a save
     that does not parse back into this board's shape, or a used-up board that never met the goal. */
  function nqRestore() {
    var s = null;
    try { s = BRB.storage.get(nqKey()); } catch (e) { /* no save */ }
    if (!s || !Array.isArray(s.cols) || !Array.isArray(s.done) || !Array.isArray(s.cats)) return null;
    if (s.cols.length < 1 || s.cols.length !== s.done.length || s.cols.length !== s.cats.length) return null;
    if (typeof s.score !== 'number' || !(s.score >= 0)) return null;
    var left = 0;
    for (var ci = 0; ci < s.cols.length; ci++) {
      if (!Array.isArray(s.cols[ci]) || !Array.isArray(s.done[ci]) || s.cols[ci].length !== s.done[ci].length) return null;
      for (var r = 0; r < s.cols[ci].length; r++) {
        var it = s.cols[ci][r], st = s.done[ci][r];
        if (!it || typeof it.q !== 'string' || !Array.isArray(it.choices) || typeof it.answer !== 'number' || typeof it.v !== 'number' || typeof it.secs !== 'number') return null;
        if (st !== 0 && st !== 2 && st !== 3) return null;
        if (st === 0) left++;
      }
    }
    nqPassed = !!s.passed;
    if (!left && !nqPassed) return null; // used up below the goal: a fresh board next time
    var star = Array.isArray(s.star) && s.star.length === 2 ? s.star : [-1, -1];
    var tiles = s.cols.map(function (col, c2) { return col.map(function (it2, r2) { return [it2.v, s.done[c2][r2]]; }); });
    return { items: s.cols, star: star, bb: { cats: s.cats, t: tiles, cur: null, turn: 0, turns: 0, left: left }, score: s.score, deadline: 0, to: 0 };
  }

  L.ready({ lobby: true, quiz: true, hostView: true, teams: true, words: ['pick'] });
  if (!L.active) {
    // Playing alone: a Number Quest lesson opens its own board at once; anyone else picks first.
    L.on('start', function () {
      var nq = nqBoardItems();
      if (nq) {
        practice = nqRestore() || boardFrom(nq) || practiceBoard();
        if (practice && nqPassed && !practice.bb.left) {
          // The board was finished on an earlier visit, goal met: show its end state, do not restart it.
          phase = 'ended'; podium([{ seat: 0, name: BRB.user.displayName || t('title'), score: practice.score }], t('stepDone')); view(); return;
        }
        phase = 'between'; $('status').textContent = t('practice'); view(); return;
      }
      window.SoloBank.choose({ board: true }, function (items) {
        practice = (items && boardFrom(items)) || practiceBoard(); phase = 'between'; $('status').textContent = t('practice'); view();
      });
    });
  } else if (phase === 'lobby' && !host) $('status').textContent = t('wait');
  O.test({
    state: function () {
      var b = bb();
      return { role: L.role, phase: phase, practice: !!practice, board: b ? { cats: b.cats.slice(), left: b.left, cur: b.cur, turns: b.turns, turn: b.turn, done: b.t.map(function (c) { return c.map(function (x) { return x[1]; }); }) } : null,
        question: Q ? { i: Q.i, q: Q.q, choices: Q.choices.slice(), answered: myPick >= 0, correct: practice && b && b.cur ? practice.items[b.cur[0]][b.cur[1]].answer : null } : null, card: !$('card').hidden, score: myScore, goal: NQ_STEP && practice ? { have: practice.score, need: NQ_GOAL, passed: nqPassed } : null, note: $('note').textContent, status: $('status').textContent, canPick: canPick(b), ended: !$('end').hidden };
    },
    start: function () { return true; },
  });
  window.__brbTest.pick = function (c, r) { pickTile(c, r); };
  window.__brbTest.answer = function (i) { choose(i); };
  window.__brbTest.turns = function () { $('turns').click(); };
})();
</script>
