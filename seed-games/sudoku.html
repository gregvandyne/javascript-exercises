<title>Sudoku</title>

    S.sel = last[0][0]; sfx('whoosh', { volume: 0.4, pitch: 0.8 }); save(); refresh(); focusSel();
  }
  function toggleNotes(on) { if (S.screen !== 'play') return; S.noting = on == null ? !S.noting : !!on; sfx('select'); refresh(); announce(t(S.noting ? 'notesOn' : 'notesOff')); }
  function toggleCheck(on) { if (S.screen !== 'play') return; S.check = on == null ? !S.check : !!on; SAVE.check = S.check; sfx('select'); save(); refresh(); toast(t(S.check ? 'checkOn' : 'checkOff')); }
  /** A hint fills one box with its answer: the chosen box if it is empty or wrong, else the box with the fewest
   *  possible numbers. It is counted and locked (it cannot be undone). */
  function hint() {
    if (S.screen !== 'play') return;
    var i = S.sel, n = S.n;
    if (i < 0 || locked(i) || S.v[i] === S.sol[i]) {
      i = -1; var best = 99;
      for (var x = 0; x < S.N; x++) if (!locked(x) && S.v[x] !== S.sol[x]) {
        var m = C.bits(C.candidates(S.v.map(function (v, k) { return v === S.sol[k] ? v : 0; }), n, x)); if (S.v[x]) m += 10;
        if (m < best) { best = m; i = x; }
      }
    }
    if (i < 0) return;
    var d = S.sol[i];
    S.v[i] = d; S.notes[i] = 0; S.hinted[i] = 1; S.hints++;
    C.geom(n).peers[i].forEach(function (x) { S.notes[x] &= ~(1 << (d - 1)); });
    S.sel = i; sfx('spark', { volume: 0.6 }); pop(i); save(); refresh(); focusSel();
    announce(t('hinted') + ' ' + t('cell', { r: Math.floor(i / n) + 1, c: i % n + 1, v: valueWord(d) }));
    afterMove();
  }
  function afterMove() {
    for (var i = 0; i < S.N; i++) if (!S.v[i]) return;
    for (i = 0; i < S.N; i++) if (S.v[i] !== S.sol[i]) { toast(t('notDone')); announce(t('notDone')); return; }
    win();
  }

  /* ---------- solved: a wave across the board, then the kit's results card (stars, points, BRB.gameOver) ---------- */
  function win() {
    var L = S.L, w = S.w, r = { hints: S.hints, mistakes: S.mistakes, time: Math.floor(S.time) };
    var stars = C.stars(L.id, r), points = C.score(L.id, r);
    S.screen = 'won'; S.sel = -1; refresh();
    delete SAVE.games[L.id]; if (SAVE.last === L.id) SAVE.last = '';
    var prev = SAVE.best[L.id]; if (!prev || stars > prev.stars || stars === prev.stars && r.time < prev.time) SAVE.best[L.id] = { stars: stars, time: r.time };
    persist();
    S.lastWin = { id: L.id, stars: stars, score: points, time: r.time, hints: r.hints, mistakes: r.mistakes };
    announce(t('winSay', { name: levelName(L), t: clock(r.time), h: r.hints, m: r.mistakes }));
    if (!reduced()) D.cells.forEach(function (c, i) { var rr = Math.floor(i / S.n), cc = i % S.n; c.style.setProperty('--sd-d', ((rr + cc) * 45) + 'ms'); c.classList.add('wave'); });
    sfx('levelup');
    S.again = true;
    var finish = function () { if (w && !w.ended) w.win({ stars: stars, score: points, title: t('solvedH') }); };
    if (S.fast) finish(); else if (w) w.after(reduced() ? 400 : 900 + S.n * 2 * 45, finish); else finish();
  }

  /* ---------- the keyboard: arrows, 1 to n, Backspace or Delete, N for notes, Z or U to undo, H for a hint ---------- */
  function onBoardKey(e) { if (handleKey(e)) { e.preventDefault(); e.stopPropagation(); } }
  window.addEventListener('keydown', function (e) {
    if (S.screen !== 'play' || game.state !== 'play' || (O.ui.open && O.ui.open > 0)) return;
    var tg = e.target; if (tg && tg.closest && tg.closest('.sd-board')) return;   // the board's own handler
    if (handleKey(e)) e.preventDefault();
  });
  function handleKey(e) {
    if (S.screen !== 'play' || e.altKey) return false;
    var k = e.key, n = S.n, i = S.sel < 0 ? 0 : S.sel, r = Math.floor(i / n), c = i % n;
    if ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'Z')) { undo(); return true; }
    if (e.ctrlKey || e.metaKey) return false;
    var mv = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[k];
    if (mv) { r = Math.min(n - 1, Math.max(0, r + mv[0])); c = Math.min(n - 1, Math.max(0, c + mv[1])); select(r * n + c, false); focusSel(); return true; }
    if (k === 'Home') { select(r * n, false); focusSel(); return true; }
    if (k === 'End') { select(r * n + n - 1, false); focusSel(); return true; }
    var d = /^[1-9]$/.test(k) ? +k : /^(Digit|Numpad)[1-9]$/.test(e.code || '') ? +e.code.slice(-1) : 0;
    if (d) { if (d <= n) input(d); return true; }
    if (k === 'Backspace' || k === 'Delete' || k === '0') { erase(); return true; }
    if (k === 'n' || k === 'N') { toggleNotes(); return true; }
    if (k === 'u' || k === 'U' || k === 'z' || k === 'Z') { undo(); return true; }
    if (k === 'h' || k === 'H') { hint(); return true; }
    return false;
  }

  /* ---------- the save: the puzzle in progress (digits as text), notes, hints, mistakes and time ---------- */
  function save() {
    if (!S.L || S.screen !== 'play') return;
    var hi = Object.keys(S.hinted).map(Number);
    SAVE.games[S.L.id] = { p: C.encode(S.puzzle), s: C.encode(S.sol), v: C.encode(S.v), n: S.notes.slice(), h: S.hints, m: S.mistakes, t: Math.floor(S.time), hi: hi, seed: S.seed, tier: S.tier };
    SAVE.last = S.L.id;
    persist();
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden && S.screen === 'play') save(); });

  /* ---------- test hooks (window.__brbTest, merged with the kit's) ---------- */
  function testState() {
    return {
      screen: S.screen, level: S.L ? S.L.id : null, size: S.n, seed: S.seed, tier: S.tier,
      givens: S.puzzle.filter(Boolean).length, filled: S.v.filter(Boolean).length,
      puzzle: C.encode(S.puzzle), values: C.encode(S.v), solution: S.screen === 'play' || S.screen === 'won' ? C.encode(S.sol) : '',
      notes: S.notes.slice(), noting: S.noting, check: S.check, pics: S.pics, sel: S.sel,
      hints: S.hints, mistakes: S.mistakes, time: Math.floor(S.time), conflicts: S.v.length ? C.conflicts(S.v, S.n) : [],
      saved: Object.keys(SAVE.games), last: SAVE.last, best: SAVE.best, lastWin: S.lastWin || null, kit: game.state,
    };
  }
  Object.assign(window.__brbTest, {
    state: testState,
    core: C,
    pick: function (id, o) { o = Object.assign({ fast: true }, o || {}); if (game.state === 'play') startLevel(id, o); else { S.pending = Object.assign({ id: id }, o); game.start(); } return testState(); },
    picker: function () { if (game.state === 'play') showPicker(); else game.start(); return testState(); },
    select: function (i) { select(i, false); return testState(); },
    press: function (d) { input(d); return testState(); },
    erase: function () { erase(); return testState(); },
    undo: function () { undo(); return testState(); },
    hint: function () { hint(); return testState(); },
    notes: function (on) { toggleNotes(on); return testState(); },
    checkMistakes: function (on) { toggleCheck(on); return testState(); },
    pictures: function (on) { S.pics = on !== false; SAVE.pics = S.pics; persist(); if (S.screen === 'play') refresh(true); else if (S.screen === 'pick') showPicker(); return testState(); },
    /** Fills the board with the answer, leaving `leave` boxes empty (the last ones in reading order). */
    fill: function (leave) { var left = leave || 0; for (var i = S.N - 1; i >= 0; i--) { if (S.puzzle[i] || S.hinted[i]) continue; if (left > 0) { left--; S.v[i] = 0; continue; } S.v[i] = S.sol[i]; S.notes[i] = 0; } save(); refresh(); return testState(); },
    jot: function (i, ds) { S.notes[i] = 0; (ds || []).forEach(function (d) { S.notes[i] |= 1 << (d - 1); }); save(); refresh(); return testState(); },
    skipAnimations: function () { S.fast = true; return testState(); },
    setTime: function (s) { S.time = +s || 0; S.shown = -1; return testState(); },
  });
})();
</script>
