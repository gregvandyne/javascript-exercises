<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sudoku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
  /* Sudoku: a plain page in Crossword's look (the classroom dashboard's widgets: cream cards with a group color on the
     top edge and the icon chip, the dark Now-style bar, a dotted mint board), light and dark, Bricolage Grotesque.
     No game engine: every screen is this page's own DOM. The board always reads left to right. */
  :root {
    --paper: #E1F1E1; --dots: #66C792; --card: #FFFDF2; --card2: #F9F6EB; --hover: #EFEBDC; --ink: #141414; --line: #E2DDCB; --muted: #5B584F;
    --green: #1F9D63; --accent: #66C792; --mint-t: #E1F1E1; --accent-ink: #0F5A37; --current: #141414; --on-current: #FFFDF2;
    --sky: #5AA9D6; --sky-t: #DCEDF7; --sky-s: #A8D2EC; --coral: #C8432F; --coral-t: #FBE0DA; --grape: #6E56C9; --grape-t: #ECE7FA; --spark: #FFD23F; --focus: #2563EB;
    --user: #1F6FA8; --grid: #8E8A7C;
    --g-time: #5AA9D6; --g-class: #66C792; --g-tools: #FFD23F; --g-show: #F28C6B; --g-check: #9B8CE0; --g-join: #4FB6A8;
    --shadow: 0 1px 0 rgba(20,20,20,.04), 0 4px 16px rgba(20,20,20,.06); --r: 20px; --r-sm: 12px;
    --font: 'Bricolage Grotesque', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --paper: #141414; --dots: #2E5A41; --card: #1E1E1B; --card2: #262622; --hover: #2C2C27; --ink: #FFFDF2; --line: #36352F; --muted: #B8B3A1;
    --green: #66C792; --accent: #66C792; --mint-t: #1F3A2B; --accent-ink: #8FDDB0; --current: #66C792; --on-current: #141414;
    --sky-t: #1B3342; --sky-s: #2C5A75; --coral: #FF8A7D; --coral-t: #4A2420; --grape: #B9A2FF; --grape-t: #342A52; --focus: #8AB4FF;
    --user: #8CC8EC; --grid: #6B675C;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.32);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background-color: var(--paper); background-image: radial-gradient(var(--dots) 1.5px, transparent 1.6px); background-size: 22px 22px; color: var(--ink); font-family: var(--font); line-height: 1.3; -webkit-text-size-adjust: 100%; }
  body { padding: 0 12px calc(12px + env(safe-area-inset-bottom)); }
  :where(button) { font: inherit; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  button { touch-action: manipulation; cursor: pointer; }
  :where(button, a):focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  [tabindex="-1"]:focus { outline: none; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* the page head */
  .sd-head { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 0; }
  .sd-logo { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; font-weight: 800; font-size: 1.25em; letter-spacing: -.01em; }
  .sd-logo svg { width: 36px; height: 36px; flex: none; }
  .sd-icon { flex: none; min-width: 46px; height: 46px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--card); box-shadow: var(--shadow); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 1.05em; font-weight: 800; }
  .sd-icon.sd-round { width: 46px; padding: 0; font-size: 1.15em; }
  .sd-icon:hover { background: var(--card2); }

  .sd { max-width: 1100px; margin: 0 auto; }
  /* a widget: the dashboard's card, its group color on the top edge and the icon chip only (never on text) */
  .sd-widget { --g: var(--g-class); background: var(--card); color: var(--ink); border-radius: var(--r); padding: 16px;
    box-shadow: inset 0 4px 0 color-mix(in srgb, var(--g) 75%, var(--card)), 0 0 0 1px color-mix(in srgb, var(--line) 70%, transparent), var(--shadow); }
  .sd-wh { display: flex; align-items: center; gap: 10px; min-height: 40px; flex-wrap: wrap; }
  .sd-wicon { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: color-mix(in srgb, var(--g) 26%, var(--card)); font-size: 1.3rem; line-height: 1; }
  .sd .sd-wt { flex: 1 1 8em; min-width: 0; margin: 0; font-size: 1.2rem; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
  .sd-card { width: min(100%, 640px); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .sd h3 { margin: 0; font-size: 1.08em; font-weight: 800; }
  .sd-sub { margin: -6px 0 0; color: var(--muted); font-weight: 600; }
  .sd-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sd-prog { font-weight: 800; padding: 4px 12px; border-radius: 999px; background: var(--card2); white-space: nowrap; font-size: .95rem; font-variant-numeric: tabular-nums; }

  .sd-big { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 72px; padding: 12px 16px; border-radius: 18px; border: 0; background: var(--card2); text-align: start; }
  .sd-big:hover { background: var(--hover); }
  .sd-big .sd-emo { font-size: 1.8em; flex: none; }
  .sd-big span:last-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .sd-big b { font-size: 1.12em; font-weight: 800; }
  .sd-big small { font-weight: 600; color: var(--muted); }
  .sd-big.sd-go { background: var(--current); color: var(--on-current); }
  .sd-big.sd-go small { color: inherit; opacity: .85; }
  .sd-btn { min-height: 46px; padding: 6px 18px; border-radius: 999px; border: 2px solid var(--ink); background: var(--card); font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; overflow-wrap: anywhere; }
  .sd-btn:hover { background: var(--card2); }
  .sd-btn.sd-go { background: var(--green); border-color: var(--green); color: #fff; }
  :root[data-theme="dark"] .sd-btn.sd-go { color: #10261A; }
  .sd-btn.sd-quiet { border-color: var(--line); }
  .sd-btn:active, .sd-big:active, .sd-lv:active, .sd-key:active, .sd-tool:active { transform: translateY(1px); }

  /* the level picker */
  .sd-group { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--r-sm); background: var(--card2); }
  .sd-gh { display: flex; align-items: center; gap: 12px; }
  .sd-gh div { flex: 1; min-width: 0; }
  .sd-gh p { margin: 2px 0 0; font-weight: 600; font-size: .92em; color: var(--muted); }
  .sd-mini { flex: none; display: block; }
  .sd-diffs { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
  .sd-lv { position: relative; min-height: 58px; padding: 6px 10px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-weight: 800; font-size: 1.05em;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .sd-lv:hover { border-color: var(--ink); }
  .sd-lv small { font-size: .78em; letter-spacing: 2px; color: var(--spark); text-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .sd-lv .sd-dot { position: absolute; top: -9px; inset-inline-end: -4px; font-size: .62em; font-weight: 800; padding: 1px 8px; border-radius: 999px; background: var(--current); color: var(--on-current); white-space: nowrap; }
  .sd-pics { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; padding: 4px 8px 4px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); text-align: start; width: 100%; font-weight: 800; }
  .sd-pics .sd-pv { display: flex; gap: 2px; }
  .sd-pics .sd-pv svg { width: 30px; height: 30px; }
  .sd-sw { flex: none; width: 52px; height: 30px; border-radius: 999px; background: var(--line); position: relative; }
  .sd-sw::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: inset-inline-start .15s; }
  .sd-pics[aria-pressed="true"] .sd-sw { background: var(--green); }
  .sd-pics[aria-pressed="true"] .sd-sw::after { inset-inline-start: 25px; }
  .sd-how ol { margin: 0; padding-inline-start: 1.3em; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .sd-how .sd-row { justify-content: space-between; }
  .sd-making { align-items: center; text-align: center; font-weight: 800; font-size: 1.15em; padding: 26px 16px; }

  /* the puzzle */
  .sd-play { display: flex; gap: 16px; align-items: flex-start; justify-content: center; }
  .sd-left { flex: 0 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .sd-right { flex: 0 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 12px; --g: var(--g-tools); }
  /* the status bar: the schedule widget's dark "Now" block */
  .sd-now { width: 100%; min-height: 62px; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 9px 16px; border-radius: var(--r-sm); background: var(--current); color: var(--on-current); }
  .sd-now b { font-weight: 800; text-transform: uppercase; letter-spacing: .04em; font-size: .82rem; opacity: .9; }
  .sd-now span { font-size: clamp(1rem, 2.2vw, 1.25rem); font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
  .sd-boardwrap { position: relative; display: flex; justify-content: center; }
  .sd-board { width: var(--sd-b, 300px); height: var(--sd-b, 300px); display: grid; grid-template-columns: repeat(var(--sd-bx), 1fr); grid-template-rows: repeat(var(--sd-by), 1fr);
    gap: 3px; padding: 3px; background: var(--ink); border-radius: 12px; direction: ltr; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .sd-board.sd-paused { filter: blur(10px); }
  .sd-box { display: grid; grid-template-columns: repeat(var(--sd-bc), 1fr); grid-template-rows: repeat(var(--sd-br), 1fr); gap: 1px; background: var(--grid); min-width: 0; min-height: 0; overflow: hidden; }
  .sd-cell { position: relative; min-width: 0; min-height: 0; border: 0; padding: 0; margin: 0; background: var(--card); display: grid; place-items: center; cursor: pointer;
    font-size: var(--sd-fs, 24px); font-weight: 600; line-height: 1; border-radius: 0; color: var(--ink); }
  .sd-cell .sd-v { display: grid; place-items: center; width: 100%; height: 100%; color: var(--user); font-weight: 700; }
  .sd-cell.given .sd-v { color: var(--ink); font-weight: 800; }
  .sd-cell.hinted .sd-v { color: var(--grape); font-weight: 800; }
  .sd-cell.peer { background: var(--sky-t); }
  .sd-cell.same { background: color-mix(in srgb, var(--sky-s) 70%, var(--card)); }
  .sd-cell.same .sd-v { text-decoration: underline; text-decoration-thickness: .08em; text-underline-offset: .12em; }
  .sd-cell.sel { background: var(--sky-s); box-shadow: inset 0 0 0 3px var(--ink); z-index: 1; }
  .sd .sd-cell:focus-visible { outline: 3px solid var(--focus); outline-offset: -6px; z-index: 2; }
  .sd-cell svg { width: 78%; height: 78%; display: block; }
  .sd-cell.clash { background: var(--coral-t); }
  .sd-cell.clash.sel { background: color-mix(in srgb, var(--coral) 45%, var(--card)); }
  .sd-cell.clash::after { content: '!'; position: absolute; top: 2px; right: 2px; width: max(13px, .4em); height: max(13px, .4em); border-radius: 50%; display: grid; place-items: center;
    font-size: max(9px, .28em); font-weight: 800; line-height: 1; background: var(--coral); color: #fff; }
  .sd-cell.wrong .sd-v { color: var(--coral); text-decoration: line-through; text-decoration-thickness: .07em; }
  .sd-cell.wrong::before { content: '✕'; position: absolute; bottom: 1px; left: 3px; font-size: max(9px, .3em); font-weight: 800; color: var(--coral); line-height: 1; }
  .sd-notes { position: absolute; inset: 5%; display: grid; grid-template-columns: repeat(var(--sd-nc), 1fr); grid-template-rows: repeat(var(--sd-nr), 1fr); pointer-events: none; }
  .sd-notes span { display: grid; place-items: center; font-size: var(--sd-nfs, 10px); font-weight: 700; color: var(--muted); line-height: 1; min-width: 0; min-height: 0; }
  .sd-notes span.on-same { background: var(--sky-s); border-radius: 4px; color: var(--ink); }
  .sd-notes svg { width: 88%; height: 88%; }
  .sd-cell.pop .sd-v { animation: sd-pop .22s ease-out; }
  .sd-cell.wave { animation: sd-wave .6s ease both; animation-delay: var(--sd-d, 0ms); }
  @keyframes sd-pop { 0% { transform: scale(.6); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes sd-wave { 40% { transform: scale(1.1); background: var(--mint-t); } 100% { background: var(--mint-t); } }
  .sd-pause { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; z-index: 3; }
  .sd-pause > div { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 22px; border-radius: var(--r); background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(20,20,20,.2); }
  .sd-pause h2 { margin: 0; font-size: 1.4em; font-weight: 800; }

  .sd-ctrl { display: flex; flex-direction: column; gap: 8px; }
  .sd-pad { display: grid; grid-template-columns: repeat(var(--sd-pc), 1fr); gap: 6px; direction: ltr; }
  .sd-key { min-height: var(--sd-kh, 52px); border-radius: 14px; border: 0; background: var(--card2); box-shadow: inset 0 0 0 2px var(--line);
    font-size: var(--sd-kf, 1.6em); font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0; min-width: 0; position: relative; }
  .sd-key:hover { box-shadow: inset 0 0 0 2px var(--ink); }
  .sd-key svg { width: min(46px, 70%); height: auto; aspect-ratio: 1; }
  .sd-key.done { color: color-mix(in srgb, var(--ink) 40%, var(--card2)); }
  .sd-key.done svg { opacity: .45; }
  .sd-key.done::after { content: '✓'; position: absolute; top: 3px; right: 7px; font-size: 14px; font-weight: 800; color: var(--green); }
  .sd-key.erase { font-size: 1.4em; }
  .sd-ctrl.noting .sd-key:not(.erase) { background: var(--grape-t); box-shadow: inset 0 0 0 2px var(--grape); font-size: calc(var(--sd-kf, 1.6em) * .78); }
  .sd-tools { display: grid; grid-template-columns: repeat(var(--sd-tc, 5), 1fr); gap: 6px; }
  .sd-tool { min-height: 56px; border-radius: 14px; border: 2px solid var(--ink); background: var(--card);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 3px 2px; font-size: .82em; font-weight: 800; min-width: 0; position: relative; }
  .sd-tool:hover { background: var(--card2); }
  .sd-tool span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sd-tool .sd-ti { font-size: 1.35em; line-height: 1.1; }
  .sd-tool[aria-pressed="true"] { background: var(--current); color: var(--on-current); border-color: var(--current); }
  .sd-tool .sd-n { position: absolute; top: -8px; inset-inline-end: -4px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 999px; background: var(--grape); color: #fff;
    font-size: 12px; display: grid; place-items: center; }
  .sd-tool .sd-n:empty { display: none; }

  /* solved */
  .sd-done { text-align: center; align-items: center; display: flex; flex-direction: column; gap: 10px; }
  .sd-done h2 { margin: 0; font-size: 1.45em; font-weight: 800; }
  .sd-stars { font-size: 2.6em; letter-spacing: 6px; color: var(--spark); text-shadow: 0 2px 0 rgba(0,0,0,.15); line-height: 1; }
  .sd-stars .off { color: var(--line); }
  .sd-stats { margin: 0; font-weight: 700; color: var(--muted); }
  .sd-done .sd-row { justify-content: center; }
  .sd-confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 15; }
  .sd-confetti i { position: absolute; top: -12px; width: 10px; height: 14px; border-radius: 2px; animation: sd-fall var(--t, 1.6s) ease-in var(--d, 0s) forwards; }
  @keyframes sd-fall { to { transform: translate(var(--x, 0), 105vh) rotate(var(--r, 360deg)); } }
  .sd-rm .sd-cell, .sd-rm .sd-cell .sd-v, .sd-rm .sd-sw::after { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { .sd-cell, .sd-cell .sd-v, .sd-confetti i { animation: none !important; } .sd-confetti { display: none; } }
  @media (max-width: 760px) {
    .sd-play { flex-direction: column; align-items: stretch; gap: 10px; }
    .sd-right { flex: none; }
    .sd-widget.sd-left, .sd-widget.sd-right { padding: 10px; }
    .sd-left { gap: 8px; }
    .sd-card { padding: 14px 12px 16px; }
    .sd-head .sd-icon:not(.sd-round) { padding: 0 12px; }
  }
  @media (max-height: 560px) { .sd-head { padding: 4px 0; } .sd-now { min-height: 48px; padding: 6px 14px; } }
</style>
</head>
<body>
<header class="sd-head">
  <div class="sd-logo"><svg viewBox="0 0 36 36" aria-hidden="true"><rect x="1" y="1" width="34" height="34" rx="9" fill="var(--accent)"/><rect x="7" y="7" width="22" height="22" rx="3" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><path d="M18 7v22M7 18h22" stroke="var(--ink)" stroke-width="2"/><path d="M12.5 7v22M23.5 7v22M7 12.5h22M7 23.5h22" stroke="var(--ink)" stroke-width=".9" opacity=".6"/><rect x="18.5" y="12.5" width="5" height="5" fill="var(--sky-s)"/></svg><span id="sd-apptitle">Sudoku</span></div>
  <button class="sd-icon" type="button" id="sd-levels" hidden></button>
  <button class="sd-icon sd-round" type="button" id="sd-pause" aria-pressed="false" hidden>⏸️</button>
  <button class="sd-icon sd-round" type="button" id="sd-sound" aria-pressed="true">🔊</button>
</header>
<main class="sd" id="sd"></main>
<div class="sr" id="sd-say" aria-live="polite"></div>
<script>
/* sudoku-core:begin */
/* The puzzle maker, the solver and the grader: plain functions, no DOM and no kit, so the unit test runs this block
   on its own (node:vm). Grids are arrays of n*n numbers read row by row: 0 is an empty box, 1..n a digit. */
(function (root) {
  'use strict';
  // The levels. givens: how many boxes are filled at the start (both ends included). tier: the hardest way of
  // thinking the puzzle may need, and the least it must need (0 naked singles, 1 hidden singles, 2 pointing and
  // claiming, naked and hidden pairs, 3 triples, X-wing and XY-wing). par: seconds for the time star; base: points.
  var LEVELS = [
    { id: 'tiny-easy', group: 'tiny', diff: 'easy', size: 4, givens: [10, 11], tier: [0, 0], par: 150, base: 100 },
    { id: 'tiny-medium', group: 'tiny', diff: 'medium', size: 4, givens: [7, 8], tier: [0, 1], par: 240, base: 150 },
    { id: 'small-easy', group: 'small', diff: 'easy', size: 6, givens: [20, 22], tier: [0, 0], par: 360, base: 250 },
    { id: 'small-medium', group: 'small', diff: 'medium', size: 6, givens: [13, 15], tier: [1, 1], par: 600, base: 400 },
    { id: 'classic-easy', group: 'classic', diff: 'easy', size: 9, givens: [38, 42], tier: [0, 1], par: 900, base: 600 },
    { id: 'classic-medium', group: 'classic', diff: 'medium', size: 9, givens: [32, 36], tier: [1, 2], par: 1500, base: 900 },
    { id: 'classic-hard', group: 'classic', diff: 'hard', size: 9, givens: [28, 31], tier: [2, 2], par: 2100, base: 1300 },
    { id: 'classic-expert', group: 'classic', diff: 'expert', size: 9, givens: [23, 27], tier: [3, 3], par: 3000, base: 1800 }
  ];
  var BY_ID = {};
  LEVELS.forEach(function (l) { BY_ID[l.id] = l; });
  function level(id) { return BY_ID[id] || null; }

  // mulberry32: small, fast and the same on every device.
  var TWO32 = Math.pow(2, 32);
  function rng(seed) {
    var a = (seed >>> 0) || 1;
    function f() { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / TWO32; }
    return { float: f, int: function (lo, hi) { return lo + Math.floor(f() * (hi - lo + 1)); }, shuffle: function (arr) { for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(f() * (i + 1)), x = arr[i]; arr[i] = arr[j]; arr[j] = x; } return arr; } };
  }

  // The shape of a board: 4x4 has 2x2 boxes, 6x6 boxes of 2 rows by 3 columns, 9x9 3x3 boxes.
  var GEOM = {};
  function geom(n) {
    if (GEOM[n]) return GEOM[n];
    var br = n === 4 ? 2 : n === 6 ? 2 : 3, bc = n === 4 ? 2 : 3, N = n * n, units = [], unitsOf = [], peers = [], i, r, c, u;
    for (r = 0; r < n; r++) { u = []; for (c = 0; c < n; c++) u.push(r * n + c); units.push(u); }

    undo: function () { undo(); return testState(); },
    hint: function () { hint(); return testState(); },
    notes: function (on) { toggleNotes(on); return testState(); },
    checkMistakes: function (on) { toggleCheck(on); return testState(); },
    pause: function (on) { setPaused(on !== false); return testState(); },
    pictures: function (on) { S.pics = on !== false; SAVE.pics = S.pics; persist(); if (S.screen === 'play') refresh(true); else if (S.screen === 'pick') showPicker(); return testState(); },
    /** Fills the board with the answer, leaving `leave` boxes empty (the last ones in reading order). */
    fill: function (leave) { var left = leave || 0; for (var i = S.N - 1; i >= 0; i--) { if (S.puzzle[i] || S.hinted[i]) continue; if (left > 0) { left--; S.v[i] = 0; continue; } S.v[i] = S.sol[i]; S.notes[i] = 0; } save(); refresh(); return testState(); },
    jot: function (i, ds) { S.notes[i] = 0; (ds || []).forEach(function (d) { S.notes[i] |= 1 << (d - 1); }); save(); refresh(); return testState(); },
    skipAnimations: function () { S.fast = true; return testState(); },
    setTime: function (s) { S.time = +s || 0; S.shown = -1; return testState(); },
  });
  showPicker();
})();
</script>
</body>
</html>
