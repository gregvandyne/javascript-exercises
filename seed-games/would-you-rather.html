<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Would You Rather?</title>
<!-- Would You Rather (official, Oomba Kit 1.1.0): pick one of two, with no right or wrong answers, so nothing is scored.
     Alone it ends with a "You're a…" card made from the kinds of things you picked (tags on every option); with friends
     everyone picks in secret on one device, then the picks are revealed; in "Guess my pick" one picks and the rest guess.
     Completion: reaching that end card is a finished run, so finish() signals BRB.gameOver({ won: true }) exactly
     once per run (no score: there is still nothing to score). Course steps that assign a run (Cyber Defenders'
     Online: share or keep missions) complete only on that signal; opening the game completes nothing.
     The questions (444 in English) and the game's words in every site language come from scripts/data/would-you-rather
     (scripts/wyr-bank.js writes them between the wyr-data markers below; translated questions load as packs). -->
<style>
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  body { background: #bfe6ff; }
  #game { position: fixed; inset: 0; display: flex; flex-direction: column; font-family: var(--ok-font, system-ui, sans-serif); color: var(--ok-text, #1d2340);
    padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); box-sizing: border-box; gap: 8px; pointer-events: auto; }
  .bar { display: flex; align-items: center; gap: 8px; min-height: 48px; flex: none; }
  .bar .sp { flex: 1; min-width: 0; }
  .pill { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 14px; border-radius: 999px; background: var(--ok-card, #fffaf0); border: 3px solid var(--ok-edge, #1d2340); font-weight: 800; font-size: 16px; white-space: nowrap; }
  .ibtn { width: 48px; height: 48px; flex: none; display: grid; place-items: center; padding: 0; border-radius: 50%; border: 3px solid var(--ok-edge, #1d2340); background: var(--ok-card, #fffaf0); color: var(--ok-text, #1d2340); box-shadow: 0 3px 0 var(--ok-edge, #1d2340); cursor: pointer; font: inherit; }
  .ibtn svg { width: 24px; height: 24px; }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .card { background: var(--ok-card, #fffaf0); border: 4px solid var(--ok-edge, #1d2340); border-radius: 28px; box-shadow: 0 6px 0 var(--ok-edge, #1d2340); box-sizing: border-box; }
  .btn { font: inherit; font-weight: 800; font-size: clamp(17px, min(2.6vw, 3.4vh), 24px); min-height: 52px; padding: 8px 22px; border-radius: 999px; border: 3px solid var(--ok-edge, #1d2340);
    box-shadow: 0 4px 0 var(--ok-edge, #1d2340); background: var(--ok-card, #fffaf0); color: var(--ok-text, #1d2340); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.hot { background: var(--wyr-hot); color: var(--wyr-ink); }
  .btn.go { background: var(--wyr-go); color: var(--wyr-ink); }
  .btn:active, .ibtn:active, .chip:active, .mode:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ok-edge, #1d2340); }
  .btn:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 4px solid var(--wyr-focus); outline-offset: 3px; }

  /* home */
  #home .card { width: min(640px, 100%); max-height: 100%; overflow: auto; padding: clamp(14px, 3vh, 28px) clamp(14px, 3vw, 28px); display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.6vh, 14px); text-align: center; }
  .logo { margin: 0; font-size: clamp(30px, min(7vw, 7vh), 60px); line-height: 1.05; font-weight: 900; letter-spacing: .01em; }
  .logo .a { color: var(--wyr-a-ink); } .logo .b { color: var(--wyr-b-ink); }
  .topic-lock { margin: 0; white-space: normal; text-align: center; justify-content: center; }
  .chip.locked { cursor: default; }
  .tagline { margin: 0; font-size: clamp(15px, min(2.6vw, 3vh), 20px); font-weight: 700; opacity: .85; }
  .duo { display: flex; gap: 10px; justify-content: center; font-size: clamp(34px, min(8vw, 8vh), 64px); line-height: 1; }
  .duo span { display: inline-block; animation: wyr-bob 2.4s ease-in-out infinite; }
  .duo span:nth-child(2) { animation-delay: .4s; } .duo span:nth-child(3) { animation-delay: .8s; }
  @keyframes wyr-bob { 50% { transform: translateY(-6px) rotate(-4deg); } }
  .modes { width: 100%; display: grid; gap: 10px; }
  .mode { display: flex; align-items: center; gap: 14px; text-align: start; width: 100%; min-height: 64px; padding: 10px 16px; border-radius: 22px; border: 3px solid var(--ok-edge, #1d2340);
    box-shadow: 0 4px 0 var(--ok-edge, #1d2340); background: var(--ok-card, #fffaf0); color: var(--ok-text, #1d2340); font: inherit; cursor: pointer; }
  .mode .em { font-size: 34px; flex: none; }
  .mode b { display: block; font-size: clamp(18px, min(2.8vw, 3.4vh), 24px); }
  .mode small { display: block; font-size: clamp(13px, min(2vw, 2.6vh), 16px); font-weight: 600; opacity: .85; }
  .mode.m-alone { background: var(--wyr-a); } .mode.m-friends { background: var(--wyr-b); } .mode.m-guess { background: var(--wyr-c); }
  @media (orientation: landscape) and (min-width: 700px) { .modes { grid-template-columns: repeat(3, 1fr); } .mode { flex-direction: column; text-align: center; gap: 4px; padding: 14px 10px; } }
  @media (orientation: landscape) and (max-height: 430px) { .duo { display: none; } .mode { min-height: 56px; padding: 8px 10px; } .mode .em { font-size: 26px; } }

  /* setup */
  #setup .card { width: min(820px, 100%); max-height: 100%; display: flex; flex-direction: column; padding: clamp(12px, 2.4vh, 24px) clamp(12px, 2.4vw, 24px); gap: 10px; }
  .setup-scroll { overflow: auto; min-height: 0; flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 4px; }
  .lbl { margin: 0; font-weight: 800; font-size: clamp(16px, min(2.4vw, 3vh), 20px); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: inherit; font-weight: 700; font-size: clamp(15px, min(2.2vw, 2.8vh), 18px); min-height: 46px; padding: 6px 14px; border-radius: 999px; border: 3px solid var(--ok-edge, #1d2340);
    background: var(--ok-card, #fffaf0); color: var(--ok-text, #1d2340); box-shadow: 0 3px 0 var(--ok-edge, #1d2340); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .chip[aria-pressed="true"] { background: var(--wyr-spark); color: var(--wyr-ink); }
  .people { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .face { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; border: 3px solid var(--ok-edge, #1d2340); flex: none; color: var(--wyr-ink); }
  .start-row { display: flex; justify-content: flex-end; gap: 10px; flex: none; }
  .start-row .btn { min-width: 160px; }

  /* play */
  #play { justify-content: flex-start; }
  .ask { margin: 0; text-align: center; font-weight: 900; font-size: clamp(22px, min(4.4vw, 4.6vh), 40px); flex: none; background: var(--ok-card, #fffaf0); border: 3px solid var(--ok-edge, #1d2340); border-radius: 999px; padding: 0 22px; }
  .who-line { margin: 0; background: var(--ok-card, #fffaf0); border-radius: 999px; padding: 2px 14px; text-align: center; font-weight: 800; font-size: clamp(16px, min(2.6vw, 3vh), 22px); flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .who-line .face { width: 40px; height: 40px; font-size: 22px; }
  .pair { flex: 1; min-height: 0; width: min(1100px, 100%); display: grid; grid-template-rows: 1fr auto 1fr; gap: 6px; align-items: stretch; }
  @media (orientation: landscape) { .pair { grid-template-rows: none; grid-template-columns: 1fr auto 1fr; } }
  .opt { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 0; padding: clamp(10px, 2vh, 24px) clamp(12px, 2vw, 24px);
    border-radius: 30px; border: 4px solid var(--ok-edge, #1d2340); box-shadow: 0 6px 0 var(--ok-edge, #1d2340); color: var(--wyr-ink); font: inherit; cursor: pointer; text-align: center; overflow: hidden;
    transition: transform .18s ease, opacity .25s ease, box-shadow .18s ease; }
  .opt.a { background: var(--wyr-a); } .opt.b { background: var(--wyr-b); }
  .opt .tx { font-weight: 900; font-size: clamp(20px, min(3.6vw, 4.2vh), 40px); line-height: 1.2; overflow-wrap: anywhere; }
  .opt .tag { font-size: clamp(26px, min(5vw, 5.5vh), 52px); line-height: 1; }
  .opt .count { font-weight: 800; font-size: clamp(14px, min(2.2vw, 2.6vh), 18px); background: rgba(255,255,255,.75); border-radius: 999px; padding: 2px 12px; }
  .opt .faces { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; min-height: 0; }
  .opt .faces .face { width: 44px; height: 44px; font-size: 24px; }
  /* what everyone chose (BRB.poll): a bar and the share, on both cards after a pick */
  .opt .pct { display: flex; flex-direction: column; align-items: stretch; gap: 4px; width: min(100%, 320px); font-weight: 800; font-size: clamp(14px, 2vh, 18px); }
  .opt .pct[hidden] { display: none; }
  .opt .pct i { display: block; height: 12px; border-radius: 99px; background: rgba(0,0,0,.12); overflow: hidden; }
  .opt .pct i::after { content: ''; display: block; height: 100%; width: var(--pct, 0%); background: var(--ok-edge, #1d2340); border-radius: 99px; transition: width .6s cubic-bezier(.2,1.2,.4,1); }
  .opt .pct.first i { display: none; }
  .opt.faded .pct { opacity: 1; }
  .opt .check { position: absolute; inset-block-start: 10px; inset-inline-end: 12px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 26px;
    background: var(--ok-card, #fffaf0); border: 3px solid var(--ok-edge, #1d2340); transform: scale(0); transition: transform .2s cubic-bezier(.3, 1.6, .5, 1); }
  .opt.chosen { transform: scale(1.03); box-shadow: 0 0 0 6px var(--wyr-spark), 0 6px 0 var(--ok-edge, #1d2340); }
  .opt.chosen .check { transform: scale(1); }
  .opt.chosen .tx { padding-inline: 44px; }
  .opt.faded { filter: saturate(.25) brightness(.92); transform: scale(.96); box-shadow: 0 3px 0 var(--ok-edge, #1d2340); }
  .opt.faded .tx { opacity: .7; }
  .opt:disabled { cursor: default; }
  .opt.guess { cursor: default; justify-content: space-between; }
  .opt.guess .gtap { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .gface { width: 52px; height: 52px; border-radius: 50%; border: 3px dashed var(--ok-edge, #1d2340); display: grid; place-items: center; font-size: 26px; background: rgba(255,255,255,.55); cursor: pointer; padding: 0; font-family: inherit; }
  .gface[aria-pressed="true"] { border-style: solid; background: var(--ok-card, #fffaf0); box-shadow: 0 0 0 4px var(--wyr-spark); }
  .gface.right { box-shadow: 0 0 0 5px var(--wyr-go-solid); }
  .or { align-self: center; justify-self: center; display: grid; place-items: center; min-width: 58px; height: 58px; padding: 0 10px; border-radius: 999px; font-weight: 900; font-size: 20px;
    background: var(--ok-edge, #1d2340); color: var(--ok-card, #fffaf0); z-index: 1; margin: -14px 0; }
  @media (orientation: landscape) { .or { margin: 0 -14px; } }
  .react { margin: 0; text-align: center; font-weight: 900; font-size: clamp(18px, min(3vw, 3.6vh), 28px); min-height: 1.3em; flex: none; color: var(--ok-text, #1d2340); }
  .react span { display: inline-block; background: var(--ok-card, #fffaf0); border: 3px solid var(--ok-edge, #1d2340); border-radius: 999px; padding: 2px 16px; animation: wyr-pop .35s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes wyr-pop { from { transform: scale(.4); opacity: 0; } }
  .foot { display: flex; align-items: center; justify-content: center; gap: 10px; flex: none; width: min(1100px, 100%); flex-wrap: wrap; }
  .foot .sp { flex: 1; }

  /* pass the device */
  #pass .card, #summary .card { width: min(620px, 100%); max-height: 100%; overflow: auto; padding: clamp(14px, 3vh, 30px); display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.6vh, 14px); text-align: center; }
  #pass .big { width: clamp(84px, min(16vw, 16vh), 130px); height: clamp(84px, min(16vw, 16vh), 130px); font-size: clamp(46px, min(9vw, 9vh), 72px); }
  #pass h2, #summary h2 { margin: 0; font-size: clamp(24px, min(4.6vw, 5vh), 38px); }
  #pass p { margin: 0; font-weight: 700; font-size: clamp(16px, min(2.6vw, 3vh), 20px); }

  /* summary */
  .trait-big { font-size: clamp(56px, min(12vw, 12vh), 96px); line-height: 1; }
  .trait-name { margin: 0; font-size: clamp(26px, min(5vw, 5.4vh), 44px); font-weight: 900; color: var(--wyr-a-ink); }
  .trait-desc { margin: 0; font-weight: 700; font-size: clamp(16px, min(2.6vw, 3vh), 20px); }
  .mixbars { width: 100%; display: grid; gap: 8px; text-align: start; }
  .mixbar { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-weight: 800; }
  .mixbar i { display: block; height: 14px; border-radius: 99px; background: var(--wyr-spark); border: 2px solid var(--ok-edge, #1d2340); }
  .mixbar .track { background: rgba(0,0,0,.08); border-radius: 99px; }
  .ppl { width: 100%; display: grid; gap: 8px; }

    padding: 10px 18px; border-radius: 16px; font-weight: 800; z-index: 20; pointer-events: none; }

  @media (max-height: 430px) {

    .bar { min-height: 44px; } .ibtn { width: 44px; height: 44px; }

    .or { min-width: 46px; height: 46px; font-size: 16px; }

<body>
<div id="game" dir="auto">
  <div class="bar">
    <button class="ibtn" type="button" id="homeBtn" hidden></button>
    <span class="pill" id="progress" hidden></span>
    <span class="sp"></span>
    <button class="ibtn" type="button" id="setBtn"></button>
  </div>

  <section class="screen" id="home">
    <div class="card">
      <div class="duo" aria-hidden="true"><span>🤔</span><span>⚖️</span><span>🤩</span></div>
      <h1 class="logo" id="logo"></h1>
      <p class="tagline" data-t="tagline"></p>
      <p class="pill topic-lock" id="lockTopic" hidden></p>
      <div class="modes">
        <button class="mode m-alone" type="button" id="play" data-mode="alone"><span class="em" aria-hidden="true">🙋</span><span><b data-t="alone"></b><small data-t="aloneSub"></small></span></button>
        <button class="mode m-friends" type="button" data-mode="friends"><span class="em" aria-hidden="true">👫</span><span><b data-t="friends"></b><small data-t="friendsSub"></small></span></button>
        <button class="mode m-guess" type="button" data-mode="guess"><span class="em" aria-hidden="true">🔮</span><span><b data-t="guess"></b><small data-t="guessSub"></small></span></button>
      </div>
    </div>
  </section>

  <section class="screen" id="setup" hidden>
    <div class="card">
      <div class="setup-scroll">
        <p class="lbl" data-t="topics"></p>
        <div class="chips" id="topics"></div>
        <div id="countBox"><p class="lbl" data-t="howMany"></p><div class="chips" id="counts"></div></div>
        <div id="peopleBox"><p class="lbl" data-t="players"></p><div class="people" id="people"></div></div>
      </div>
      <div class="start-row"><button class="btn hot" type="button" id="startBtn" data-start data-t="play"></button></div>
    </div>
  </section>

  <section class="screen" id="pass" hidden>
    <div class="card">
      <div class="face big" id="passFace"></div>
      <h2 id="passTitle"></h2>
      <p id="passText"></p>
      <button class="btn hot" type="button" id="readyBtn" data-t="ready"></button>
    </div>
  </section>

  <section class="screen" id="playScreen" hidden>
    <p class="who-line" id="whoLine" hidden></p>
    <p class="ask" id="ask" data-t="wyr"></p>
    <div class="pair" id="pair">
      <button class="opt a" type="button" id="optA"><span class="check" aria-hidden="true">✔</span><span class="tag" aria-hidden="true"></span><span class="tx" dir="auto"></span><span class="faces"></span><span class="gtap"></span><span class="pct" hidden><i></i><b></b></span></button>
      <span class="or" data-t="or"></span>
      <button class="opt b" type="button" id="optB"><span class="check" aria-hidden="true">✔</span><span class="tag" aria-hidden="true"></span><span class="tx" dir="auto"></span><span class="faces"></span><span class="gtap"></span><span class="pct" hidden><i></i><b></b></span></button>
    </div>
    <p class="react" id="react" aria-live="polite"></p>
    <div class="foot">
      <button class="btn" type="button" id="skipBtn" data-t="skip"></button>
      <button class="btn" type="button" id="finishBtn" data-t="finish" hidden></button>
      <button class="btn hot" type="button" id="revealBtn" data-t="reveal" hidden></button>
      <button class="btn go" type="button" id="nextBtn" data-t="next" hidden></button>
    </div>
  </section>

  <section class="screen" id="summary" hidden>
    <div class="card" id="sumCard"></div>
  </section>
  <p class="toast" id="toast" hidden></p>
</div>

<script src="/vendor/oomba-kit/1.1.3/oomba-kit.js" integrity="sha384-C3W9aOBuSkvtAv0cHch+tzSi9h4GN4XCkR3u9iTN7D83Xx2nTtdr3zkPLu6EdBuH" crossorigin="anonymous"></script>
<script src="/vendor/oomba-kit/1.1.3/packs/dress.js" integrity="sha384-9wPjHho+viJMVdJg8L4+1ENGqI/oQT3z3YT7Y5WZ+WbBv2hGK7t0HR67J5LxaylI" crossorigin="anonymous"></script>

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const CONFIG = {
  storeKey: 'would-you-rather-v1',
  counts: [10, 20, 0],          // 0 = endless
  autoNextMs: 1500,             // alone: the next question comes by itself after a pick
  maxPlayers: 6,
  faces: ['🦊', '🐼', '🐯', '🐙', '🦄', '🐨'],
  hues: ['coral', 'sky', 'mint', 'grape', 'spark', 'peach'],
  traitOrder: ['brave', 'think', 'make', 'animal', 'food', 'fast', 'kind', 'calm', 'fun', 'nature', 'tech', 'social'],
  traitIcon: { brave: '🧭', think: '💡', make: '🎨', animal: '🐾', food: '🍕', fast: '⚡', kind: '💛', calm: '☁️', fun: '😄', nature: '🌿', tech: '🤖', social: '🤝' },
  catIcon: { mix: '🎲', animals: '🐾', food: '🍕', powers: '🦸', school: '📚', travel: '🧭', silly: '🤪', sports: '⚽', space: '🪐', future: '🚀', family: '💛', deep: '💭', tech: '🤖', online: '🌐', numbers: '🔢' },
  cats: ['animals', 'food', 'powers', 'school', 'travel', 'silly', 'sports', 'space', 'future', 'family', 'deep', 'tech', 'online', 'numbers'],
};

/* ---------------- words: the game's table under 'wyr.' keys, English as the fallback ---------------- */
const STR = {};
for (const l in WYR_UI) { STR[l] = {}; for (const k in WYR_UI[l]) STR[l]['wyr.' + k] = WYR_UI[l][k]; }
try { Oomba.strings(STR); } catch (e) { /* ignore */ }
const LANG = (typeof Oomba !== 'undefined' && Oomba.lang) || 'en';
function t(k, vars) {
  let s = null;
  try { const v = Oomba.t('wyr.' + k, vars); if (v && v !== 'wyr.' + k) s = v; } catch (e) { /* ignore */ }
  if (s == null) { s = (WYR_UI[LANG] && WYR_UI[LANG][k]) || (WYR_UI.en && WYR_UI.en[k]) || k; for (const n in vars || {}) s = s.split('{' + n + '}').join(vars[n]); }
  return s;
}
function paint(root) { for (const el of (root || document).querySelectorAll('[data-t]')) el.textContent = t(el.dataset.t); }

/* ---------------- the questions: English built in; a translated pack replaces the texts by id ---------------- */
const ITEMS = WYR_EN.map(r => ({ id: r[0], cat: r[1], a: { text: r[2], tags: r[3].split(' ') }, b: { text: r[4], tags: r[5].split(' ') } }));
const BY_ID = new Map(ITEMS.map(it => [it.id, it]));
function loadPack() {
  return new Promise(res => {
    if (!WYR_PACK_VER || !WYR_PACK_SRI[LANG]) return res(false);
    const s = document.createElement('script');
    s.src = '/vendor/data/would-you-rather/' + WYR_PACK_VER + '/' + LANG + '.js'; s.integrity = WYR_PACK_SRI[LANG]; s.crossOrigin = 'anonymous';
    s.onload = () => { const rows = (window.WyrPacks || {})[LANG] || []; for (const r of rows) { const it = BY_ID.get(r[0]); if (it) { it.a.text = r[1]; it.b.text = r[2]; } } res(true); };
    s.onerror = () => res(false);
    document.head.appendChild(s);
  });
}

/* ---------------- saved choices (settings and the questions seen, never anything scored) ---------------- */
const store = { get() { try { return (window.BRB && BRB.storage.get(CONFIG.storeKey)) || {}; } catch (e) { return {}; } },
  set(v) { try { if (window.BRB) BRB.storage.set(CONFIG.storeKey, v); } catch (e) { /* ignore */ } } };
const SAVE = Object.assign({ seen: [], topics: ['mix'], count: 10, players: 3 }, store.get());
if (!Array.isArray(SAVE.seen)) SAVE.seen = [];
const save = () => store.set({ seen: SAVE.seen.slice(-ITEMS.length), topics: SAVE.topics, count: SAVE.count, players: SAVE.players });

/* ---------------- kit: the world behind, colours, sound ---------------- */
let STAGE = null;
try {
  STAGE = Oomba.stage({ api: 1, biome: 'meadow', size: [960, 540] });
  STAGE.camera.y = -120;
  for (const [x, s] of [[-420, 150], [400, 170], [-260, 110], [250, 120]]) STAGE.add('tree', { x, y: 30, size: s, layer: 'near' });
} catch (e) { /* the page still works without the world */ }
const C = (r, s) => { try { return Oomba.color(r, s); } catch (e) { return null; } };
const VARS = { a: C('coral', 'light') || '#ffb3a7', b: C('sky', 'light') || '#a8d8ff', c: C('grape', 'light') || '#d7c4ff', hot: C('hot') || '#ffd24a', go: C('mint', 'light') || '#b9f0c8',
  'go-solid': C('mint') || '#3fc380', spark: C('spark') || '#ffd24a', ink: C('ink') || '#1d2340', 'a-ink': C('coral', 'shade') || '#b8402d', 'b-ink': C('sky', 'shade') || '#1f6fae', focus: C('grape') || '#7b5cff' };
for (const k in VARS) document.documentElement.style.setProperty('--wyr-' + k, VARS[k]);
const hue = i => C(CONFIG.hues[i % CONFIG.hues.length], 'light') || '#eee';
try { Oomba.ui.root().appendChild($('game')); } catch (e) { /* ignore */ }
const reduced = () => { try { return !!Oomba.settings.reduced; } catch (e) { return false; } };
const syncMotion = () => $('game').classList.toggle('ok-rm', reduced());
function sfx(name) { try { Oomba.sfx(name, { caption: false }); } catch (e) { /* ignore */ } }
function icon(name) { try { return Oomba.icon(name, { size: 24 }); } catch (e) { return ''; } }
$('setBtn').innerHTML = icon('settings'); $('setBtn').setAttribute('aria-label', t('settings'));
$('homeBtn').innerHTML = icon('home'); $('homeBtn').setAttribute('aria-label', t('home'));
$('game').dir = (typeof Oomba !== 'undefined' && Oomba.dir) || 'ltr';
document.documentElement.lang = LANG;
$('logo').innerHTML = '';
{ const words = t('title'); $('logo').textContent = words; }
paint();

/* ---------------- a lesson's topic lock ----------------
   A course step opens the game on one topic with params topic=<id>&lock=1 (the play page carries topic as BRB.params.chapter;
   chapter=<id>&lock=1 works the same). Locked: no topic picker and no way to switch; playing alone starts straight away. */
const LOCKED = (() => {
  const p = (window.BRB && BRB.params) || {};
  const id = String(p.topic || p.chapter || '');
  return p.lock && CONFIG.cats.includes(id) ? id : null;
})();
if (LOCKED) {
  const el = $('lockTopic'); el.hidden = false;
  el.innerHTML = '<span aria-hidden="true">' + CONFIG.catIcon[LOCKED] + '</span>'; el.appendChild(document.createTextNode(t('cat.' + LOCKED)));
}

/* ---------------- state ---------------- */
const S = { screen: 'home', mode: 'alone', topics: LOCKED ? [LOCKED] : SAVE.topics.slice(), count: SAVE.count, players: SAVE.players,
  queue: [], cur: null, n: 0, picks: [], people: [], turn: 0, round: [], picker: 0, guesses: {}, busy: false, timer: 0, gameOverSent: false };
function toast(text) { const el = $('toast'); el.textContent = text; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2600); }
function show(id) {
  for (const s of ['home', 'setup', 'pass', 'playScreen', 'summary']) $(s).hidden = s !== id;
  S.screen = id; $('homeBtn').hidden = id === 'home';
  try { Oomba.scene = id === 'home' ? 'home' : 'play'; } catch (e) { /* ignore */ }
  syncMotion();
}
const person = i => ({ face: CONFIG.faces[i], name: t('player', { n: i + 1 }), color: hue(i) });
function faceEl(i, cls) { const p = person(i), el = document.createElement('span'); el.className = 'face' + (cls ? ' ' + cls : ''); el.style.background = p.color; el.textContent = p.face; el.setAttribute('aria-label', p.name); el.title = p.name; return el; }

/* ---------------- home and setup ---------------- */
for (const b of document.querySelectorAll('.mode')) b.addEventListener('click', () => {
  sfx('select');
  // a lesson locked to a topic: playing alone has nothing left to set up, so it starts at once (a 10-question run)
  if (LOCKED && b.dataset.mode === 'alone') { S.mode = 'alone'; if (!S.count) S.count = CONFIG.counts[0]; return begin(); }
  openSetup(b.dataset.mode);
});
function openSetup(mode) {
  S.mode = mode;
  const topics = $('topics'); topics.textContent = '';
  for (const c of LOCKED ? [LOCKED] : ['mix', ...CONFIG.cats]) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.cat = c;
    b.innerHTML = '<span aria-hidden="true">' + CONFIG.catIcon[c] + '</span>'; b.appendChild(document.createTextNode(t(c === 'mix' ? 'mix' : 'cat.' + c)));
    if (LOCKED) { b.classList.add('locked'); b.setAttribute('aria-disabled', 'true'); } else b.addEventListener('click', () => { sfx('pop'); toggleTopic(c); });
    topics.appendChild(b);
  }
  const counts = $('counts'); counts.textContent = '';
  for (const n of CONFIG.counts) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = n ? String(n) : t('endless'); b.dataset.n = n;
    b.addEventListener('click', () => { sfx('pop'); S.count = n; syncSetup(); });
    counts.appendChild(b);
  }
  $('peopleBox').hidden = mode === 'alone';
  syncSetup(); show('setup');
}
function toggleTopic(c) {
  if (LOCKED) { S.topics = [LOCKED]; return syncSetup(); }
  if (c === 'mix') S.topics = ['mix'];
  else {
    let list = S.topics.filter(x => x !== 'mix');
    list = list.includes(c) ? list.filter(x => x !== c) : [...list, c];
    S.topics = list.length ? list : ['mix'];
  }
  syncSetup();
}
function syncSetup() {
  for (const b of $('topics').children) b.setAttribute('aria-pressed', String(S.topics.includes(b.dataset.cat)));
  for (const b of $('counts').children) b.setAttribute('aria-pressed', String(+b.dataset.n === S.count));
  const box = $('people'); box.textContent = '';
  for (let i = 0; i < S.players; i++) box.appendChild(faceEl(i));
  const minus = document.createElement('button'); minus.type = 'button'; minus.className = 'ibtn'; minus.textContent = '−'; minus.setAttribute('aria-label', t('removePlayer')); minus.disabled = S.players <= 2;
  minus.addEventListener('click', () => { S.players = Math.max(2, S.players - 1); sfx('pop'); syncSetup(); });
  const plus = document.createElement('button'); plus.type = 'button'; plus.className = 'ibtn'; plus.textContent = '+'; plus.setAttribute('aria-label', t('addPlayer')); plus.disabled = S.players >= CONFIG.maxPlayers;
  plus.addEventListener('click', () => { S.players = Math.min(CONFIG.maxPlayers, S.players + 1); sfx('pop'); syncSetup(); });
  box.append(minus, plus);
}
$('startBtn').addEventListener('click', () => { sfx('spark'); begin(); });

/* ---------------- the questions in play: chosen topics, nothing repeated until the pool is used up ---------------- */
function pool() { return ITEMS.filter(it => S.topics.includes('mix') || S.topics.includes(it.cat)); }
function fillQueue() {
  const all = pool(), seen = new Set(SAVE.seen);
  let fresh = all.filter(it => !seen.has(it.id));
  if (!fresh.length) { const ids = new Set(all.map(it => it.id)); SAVE.seen = SAVE.seen.filter(id => !ids.has(id)); fresh = all.slice(); toast(t('allSeen')); }
  for (let i = fresh.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [fresh[i], fresh[j]] = [fresh[j], fresh[i]]; }
  S.queue = fresh;
}
function nextItem() { if (!S.queue.length) fillQueue(); return S.queue.shift(); }
function begin() {
  if (LOCKED) S.topics = [LOCKED];
  else SAVE.topics = S.topics.slice();
  SAVE.count = S.count; SAVE.players = S.players; save();
  S.n = 0; S.picks = []; S.queue = []; S.round = []; S.gameOverSent = false;
  S.people = S.mode === 'alone' ? [0] : Array.from({ length: S.players }, (_, i) => i);
  S.picker = 0;
  ask();
}
const total = () => S.count;
function progress() {
  const el = $('progress'); el.hidden = false;
  el.textContent = total() ? t('qOf', { n: S.n, total: total() }) : t('choices', { n: S.n });
}

/* One question: alone you pick; with friends everyone picks in secret in turn; in guess mode one picks, the rest guess. */
function ask() {
  if (total() && S.n >= total()) return finish();
  S.cur = nextItem(); S.n += 1; S.round = []; S.turn = 0; S.guesses = {};
  progress();
  if (S.mode === 'alone') return showQuestion({});
  if (S.mode === 'friends') return passTo(S.people[0]);
  S.picker = (S.n - 1) % S.people.length;
  return passTo(S.picker, true);
}
function passTo(i, picker) {
  const p = person(i);
  const f = $('passFace'); f.textContent = p.face; f.style.background = p.color;
  $('passTitle').textContent = picker ? t('guessWho', { name: p.name }) : t('passTo', { name: p.name });
  $('passText').textContent = t('secret');
  S.passing = i; show('pass'); setTimeout(() => $('readyBtn').focus(), 60);
}
$('readyBtn').addEventListener('click', () => { sfx('select'); showQuestion({ who: S.passing }); });

function setCard(el, opt, side) {
  el.querySelector('.tx').textContent = opt.text;
  el.querySelector('.tag').textContent = CONFIG.traitIcon[opt.tags[0]] || '';
  el.querySelector('.faces').textContent = ''; el.querySelector('.gtap').textContent = '';
  const pc = el.querySelector('.pct'); pc.hidden = true; pc.classList.remove('first'); pc.style.removeProperty('--pct');
  el.classList.remove('chosen', 'faded', 'guess'); el.disabled = false; el.dataset.side = side;
  el.setAttribute('aria-label', opt.text);
}
function showQuestion({ who, guessing }) {
  const it = S.cur;
  setCard($('optA'), it.a, 'a'); setCard($('optB'), it.b, 'b');
  // a picture per card, never the same one on both (it would say the two are alike)
  const ia = CONFIG.traitIcon[it.a.tags[0]], ib = (it.b.tags.map(x => CONFIG.traitIcon[x]).find(x => x !== ia)) || '';
  $('optA').querySelector('.tag').textContent = ib ? ia : (it.a.tags.map(x => CONFIG.traitIcon[x]).find(x => x !== CONFIG.traitIcon[it.b.tags[0]]) || '');
  $('optB').querySelector('.tag').textContent = ib || ($('optA').querySelector('.tag').textContent ? CONFIG.traitIcon[it.b.tags[0]] : '');
  const line = $('whoLine'); line.textContent = ''; line.hidden = who == null && !guessing;
  $('playScreen').classList.toggle('with-who', !line.hidden);
  if (who != null) { line.appendChild(faceEl(who)); line.appendChild(document.createTextNode(person(who).name)); }
  if (guessing) line.appendChild(document.createTextNode(t('guessNow', { name: person(S.picker).name })));
  $('react').textContent = '';
  $('skipBtn').hidden = !(S.mode === 'alone' || (S.mode !== 'alone' && S.turn === 0 && !guessing));
  $('finishBtn').hidden = !(S.mode === 'alone' && !total() && S.picks.length > 0);
  $('revealBtn').hidden = !guessing; $('nextBtn').hidden = true;
  S.busy = false; S.who = who; S.guessing = !!guessing;
  show('playScreen');
  if (guessing) setupGuess();
}

/* What everyone chose (BRB.poll): counted once per player and seat; shown on both cards. Below the site's minimum
   number of votes it says "one of the first to answer" instead of a percentage that would mean little. */
S.pollRes = {};
function ask_poll(id, side, seat) {
  const B = window.BRB; if (!B || typeof B.poll !== 'function') return Promise.resolve(null);
  return B.poll(id, side === 'a' ? 0 : 1, seat).then(r => { if (r) S.pollRes[id] = r; return r; }, () => null);
}
function showPct(id, mine) {
  const r = S.pollRes[id]; if (!r || !r.total) return;
  const first = r.total < (r.min || 5);
  for (const [el, n] of [[$('optA'), r.a], [$('optB'), r.b]]) {
    const pc = el.querySelector('.pct'), side = el.dataset.side;
    if (first && side !== mine) { pc.hidden = true; continue; }
    const pct = Math.round(100 * n / r.total);
    pc.classList.toggle('first', first);
    pc.querySelector('b').textContent = first ? t('pctFirst') : t('pct', { n: pct });
    pc.hidden = false;
    requestAnimationFrame(() => pc.style.setProperty('--pct', pct + '%'));
  }
}
function choose(side) {
  if (S.busy || S.screen !== 'playScreen' || S.guessing) return;
  S.busy = true;
  const it = S.cur, opt = it[side];
  const chosen = side === 'a' ? $('optA') : $('optB'), other = side === 'a' ? $('optB') : $('optA');
  chosen.classList.add('chosen'); other.classList.add('faded'); $('optA').disabled = $('optB').disabled = true;
  sfx('pop');
  if (!reduced()) { try { Oomba.juice.pop(chosen); } catch (e) { /* ignore */ } }
  const by = S.who != null ? S.who : 0;
  S.picks.push({ id: it.id, side, tags: opt.tags, by });
  if (S.mode === 'alone') {
    SAVE.seen.push(it.id); save();
    ask_poll(it.id, side, 0).then(() => { if (S.cur === it && S.screen === 'playScreen') showPct(it.id, side); });
    const r = $('react'); r.textContent = ''; const s = document.createElement('span'); s.textContent = t('react.' + Math.floor(Math.random() * 6)); r.appendChild(s);
    $('skipBtn').hidden = true; $('nextBtn').hidden = false; $('finishBtn').hidden = !!total();
    clearTimeout(S.timer); S.timer = setTimeout(() => { if (S.screen === 'playScreen' && S.busy) goNext(); }, reduced() ? CONFIG.autoNextMs + 800 : CONFIG.autoNextMs);
    return;
  }
  S.round.push({ by, side });
  ask_poll(it.id, side, Math.min(5, S.round.length - 1));
  if (S.mode === 'guess') { // the picker has chosen: everyone else guesses
    SAVE.seen.push(it.id); save();
    setTimeout(() => showQuestion({ guessing: true }), reduced() ? 150 : 650);
    return;
  }
  S.turn += 1;
  setTimeout(() => { if (S.turn < S.people.length) passTo(S.people[S.turn]); else { SAVE.seen.push(it.id); save(); revealFriends(); } }, reduced() ? 150 : 650);
}
$('optA').addEventListener('click', () => choose('a'));
$('optB').addEventListener('click', () => choose('b'));
function goNext() { clearTimeout(S.timer); sfx('select'); ask(); }
$('nextBtn').addEventListener('click', goNext);
$('skipBtn').addEventListener('click', () => { if (S.busy) return; sfx('whoosh'); S.n -= 1; S.round = []; ask(); });
$('finishBtn').addEventListener('click', () => { clearTimeout(S.timer); finish(); });

/* With friends: everyone's picks, side by side. */
function revealFriends() {
  showQuestion({});
  $('skipBtn').hidden = true;
  const byA = S.round.filter(r => r.side === 'a').map(r => r.by), byB = S.round.filter(r => r.side === 'b').map(r => r.by);
  for (const [el, list] of [[$('optA'), byA], [$('optB'), byB]]) {
    el.disabled = true;
    const faces = el.querySelector('.faces'); for (const i of list) faces.appendChild(faceEl(i));
    const c = document.createElement('span'); c.className = 'count'; c.textContent = t('picked', { n: list.length }); faces.appendChild(c);
    if (!list.length) el.classList.add('faded');
  }
  let line = byA.length === 0 || byB.length === 0 ? t('allMatch') : t('split');
  if (byA.length && byB.length) { const pair = byA.length >= 2 ? byA : byB.length >= 2 ? byB : null; if (pair) line = t('matched', { a: person(pair[0]).name, b: person(pair[1]).name }); }
  const r = $('react'); r.textContent = ''; const s = document.createElement('span'); s.textContent = line; r.appendChild(s);
  sfx('spark');
  showPct(S.cur.id, null);
  $('nextBtn').hidden = false; S.busy = true; setTimeout(() => $('nextBtn').focus(), 60);
}

/* Guess my pick: each other player puts their face on the card they think was picked. */
function setupGuess() {
  const guessers = S.people.filter(i => i !== S.picker);
  for (const el of [$('optA'), $('optB')]) {
    el.classList.add('guess'); el.disabled = false;
    const box = el.querySelector('.gtap');
    for (const i of guessers) {
      const p = person(i), b = document.createElement('button'); b.type = 'button'; b.className = 'gface'; b.textContent = p.face; b.style.borderColor = 'var(--ok-edge, #1d2340)';
      b.setAttribute('aria-label', p.name + ': ' + el.querySelector('.tx').textContent); b.dataset.p = i; b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', ev => { ev.stopPropagation(); S.guesses[i] = el.dataset.side; sfx('pop'); syncGuess(); });
      box.appendChild(b);
    }
  }
  const r = $('react'); r.textContent = ''; const s = document.createElement('span'); s.textContent = t('tapYou'); r.appendChild(s);
  syncGuess();
}
function syncGuess() {
  for (const b of document.querySelectorAll('.gface')) {
    const side = b.closest('.opt').dataset.side, on = S.guesses[b.dataset.p] === side;
    b.setAttribute('aria-pressed', String(on)); b.style.background = on ? person(+b.dataset.p).color : '';
  }
}
$('revealBtn').addEventListener('click', () => {
  const pick = S.round[0].side, el = pick === 'a' ? $('optA') : $('optB'), other = pick === 'a' ? $('optB') : $('optA');
  el.classList.add('chosen'); other.classList.add('faded');
  const guessers = S.people.filter(i => i !== S.picker), right = guessers.filter(i => S.guesses[i] === pick);
  for (const b of document.querySelectorAll('.gface')) { b.disabled = true; if (S.guesses[b.dataset.p] === pick && b.closest('.opt') === el) b.classList.add('right'); }
  const line = right.length === guessers.length ? t('allGuessed') : right.length ? t('guessedRight', { n: right.length }) : t('nobodyGuessed');
  const r = $('react'); r.textContent = ''; const s = document.createElement('span'); s.textContent = line; r.appendChild(s);
  sfx(right.length ? 'spark' : 'whoosh');
  if (right.length && !reduced()) { try { Oomba.juice.pop(el); } catch (e) { /* ignore */ } }
  showPct(S.cur.id, pick);
  $('revealBtn').hidden = true; $('nextBtn').hidden = false; S.guessing = false; S.busy = true;
  setTimeout(() => $('nextBtn').focus(), 60);
});

/* ---------------- the end: what kind of chooser you are (always kind, never a score) ---------------- */
function traits(picks) {
  const n = {}; for (const k of CONFIG.traitOrder) n[k] = 0;
  for (const p of picks) for (const tg of p.tags) if (tg in n) n[tg] += 1;
  return CONFIG.traitOrder.map(k => [k, n[k]]).sort((a, b) => b[1] - a[1] || CONFIG.traitOrder.indexOf(a[0]) - CONFIG.traitOrder.indexOf(b[0]));
}
function finish() {
  clearTimeout(S.timer);
  const card = $('sumCard'); card.textContent = '';
  const add = (tag, cls, text) => { const el = document.createElement(tag); if (cls) el.className = cls; if (text != null) el.textContent = text; card.appendChild(el); return el; };
  $('progress').hidden = true;
  if (S.mode === 'alone') {
    const tr = traits(S.picks), top = tr[0][1] ? tr[0][0] : 'fun';
    add('p', 'lbl', t('youAre'));
    add('div', 'trait-big', CONFIG.traitIcon[top]).setAttribute('aria-hidden', 'true');
    add('h2', 'trait-name', t('t.' + top));
    add('p', 'trait-desc', t('d.' + top));
    if (S.picks.length) {
      add('p', 'lbl', t('yourMix'));
      const bars = add('div', 'mixbars'), max = Math.max(1, tr.reduce((n, x) => n + x[1], 0));   // each trait's share of all the tags picked
      for (const [k, v] of tr.slice(0, 3)) {
        if (!v) continue;
        const row = document.createElement('div'); row.className = 'mixbar';
        const name = document.createElement('span'); name.textContent = CONFIG.traitIcon[k] + ' ' + t('t.' + k);
        const track = document.createElement('span'); track.className = 'track'; const bar = document.createElement('i'); bar.style.width = Math.max(8, Math.round(100 * v / max)) + '%'; track.appendChild(bar);
        row.append(name, track, document.createElement('span')); bars.appendChild(row);
      }
      add('p', 'trait-desc', t('choices', { n: S.picks.length }));
    }
  } else {
    // most alike: the pair who picked the same side most often (friends mode), and everyone's own type
    const by = i => S.picks.filter(p => p.by === i);
    if (S.mode === 'friends' && S.people.length >= 2) {
      let best = null;
      for (let i = 0; i < S.people.length; i++) for (let j = i + 1; j < S.people.length; j++) {
        const a = new Map(by(i).map(p => [p.id, p.side])); let same = 0;
        for (const p of by(j)) if (a.get(p.id) === p.side) same++;
        if (!best || same > best[2]) best = [i, j, same];
      }
      if (best && best[2] > 0) {
        const box = add('div', 'alike'); const faces = document.createElement('div'); faces.className = 'faces'; faces.append(faceEl(best[0]), faceEl(best[1]));
        const h = document.createElement('div'); h.textContent = t('mostAlike'); h.style.fontSize = '20px';
        const l = document.createElement('div'); l.textContent = t('alikeLine', { a: person(best[0]).name, b: person(best[1]).name, n: best[2] });
        box.append(faces, h, l);
      }
    }
    const ppl = add('div', 'ppl');
    for (const i of S.people) {
      const mine = by(i); if (!mine.length) continue;
      const top = traits(mine)[0][0], row = document.createElement('div'); row.className = 'prow';
      const txt = document.createElement('span'); const b = document.createElement('b'); b.textContent = person(i).name; const s = document.createElement('small'); s.textContent = CONFIG.traitIcon[top] + ' ' + t('t.' + top);
      txt.append(b, s); row.append(faceEl(i), txt); ppl.appendChild(row);
    }
  }
  const acts = add('div', 'acts');
  const again = document.createElement('button'); again.type = 'button'; again.className = 'btn hot'; again.textContent = t('again'); again.addEventListener('click', () => { sfx('spark'); begin(); });
  const home = document.createElement('button'); home.type = 'button'; home.className = 'btn'; home.textContent = t('home'); home.addEventListener('click', goHome);
  acts.append(again, home);
  show('summary'); sfx('win');
  // A finished run is the game's only completion: signal it once, with no score (nothing here is scored).
  // The play page turns this into course credit only for a step that assigned this game; a run with no
  // picks (finish pressed before playing) signals nothing.
  if (!S.gameOverSent && S.picks.length) {
    S.gameOverSent = true;
    try { if (window.BRB && BRB.gameOver) BRB.gameOver({ won: true }); } catch (e) { /* no page */ }
  }
  if (!reduced()) { try { Oomba.juice.confetti(); } catch (e) { /* ignore */ } }
  setTimeout(() => again.focus(), 60);
}

function goHome() { clearTimeout(S.timer); sfx('select'); $('progress').hidden = true; show('home'); }
$('homeBtn').addEventListener('click', goHome);
$('setBtn').addEventListener('click', async () => { sfx('select'); try { await Oomba.ui.settings(); } catch (e) { /* ignore */ } syncMotion(); });
document.addEventListener('keydown', e => {
  if (S.screen !== 'playScreen' || e.repeat) return;
  if ((e.key === 'ArrowLeft' || e.key === '1') && !S.busy) choose('a');
  if ((e.key === 'ArrowRight' || e.key === '2') && !S.busy) choose('b');
});

/* ---------------- test hooks ---------------- */
window.__brbTest = {
  state: () => ({ locked: LOCKED, screen: S.screen, mode: S.mode, n: S.n, total: total(), cur: S.cur && S.cur.id, picks: S.picks.length, players: S.people.length, topics: S.topics.slice(), bank: ITEMS.length, seen: SAVE.seen.length, gameOver: S.gameOverSent }),
  start: (mode, opts) => { openSetup(mode || 'alone'); if (opts) { if (opts.count != null) S.count = opts.count; if (opts.players) S.players = opts.players; if (opts.topics && !LOCKED) S.topics = opts.topics; } begin(); },
  pick: side => choose(side === 1 || side === 'b' ? 'b' : 'a'),
  ready: () => $('readyBtn').click(),
  next: () => $('nextBtn').click(),
  guess: (player, side) => { S.guesses[player] = side; syncGuess(); },
  reveal: () => $('revealBtn').click(),
  finish: () => finish(),
  home: () => goHome(),
};

show('home');
loadPack().then(() => { paint(); });
try { if (window.BRB && BRB.ready) BRB.ready(); } catch (e) { /* ignore */ }
})();
</script>
</body>
