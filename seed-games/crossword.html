<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crossword</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
  /* Crossword: a plain page in Oomba's look (paper, ink and green, Bricolage Grotesque, rounded cards, pill buttons),
     light and dark. No game engine: every screen is this page's own DOM. */
  /* The classroom dashboard's tokens (public/css/app.css, public/css/dash.css): cream cards on a dotted mint board. */
  :root {
    --paper: #E1F1E1; --dots: #66C792; --card: #FFFDF2; --card2: #F9F6EB; --hover: #EFEBDC; --ink: #141414; --line: #E2DDCB; --muted: #5B584F;
    --green: #1F9D63; --accent: #66C792; --mint-t: #E1F1E1; --accent-ink: #0F5A37; --current: #141414; --on-current: #FFFDF2;
    --sky: #5AA9D6; --sky-t: #DCEDF7; --sky-s: #A8D2EC; --coral: #C8432F; --coral-t: #FBE0DA; --grape: #6E56C9; --grape-t: #ECE7FA; --spark: #FFD23F; --focus: #2563EB;
    --g-time: #5AA9D6; --g-class: #66C792; --g-tools: #FFD23F; --g-show: #F28C6B; --g-check: #9B8CE0; --g-join: #4FB6A8;
    --shadow: 0 1px 0 rgba(20,20,20,.04), 0 4px 16px rgba(20,20,20,.06); --r: 20px; --r-sm: 12px;
    --font: 'Bricolage Grotesque', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --paper: #141414; --dots: #2E5A41; --card: #1E1E1B; --card2: #262622; --hover: #2C2C27; --ink: #FFFDF2; --line: #36352F; --muted: #B8B3A1;
    --green: #66C792; --accent: #66C792; --mint-t: #1F3A2B; --accent-ink: #8FDDB0; --current: #66C792; --on-current: #141414;
    --sky-t: #1B3342; --sky-s: #2C5A75; --coral: #FF8A7D; --coral-t: #4A2420; --grape: #B9A2FF; --grape-t: #342A52; --focus: #8AB4FF;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.32);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background-color: var(--paper); background-image: radial-gradient(var(--dots) 1.5px, transparent 1.6px); background-size: 22px 22px; color: var(--ink); font-family: var(--font); line-height: 1.3; -webkit-text-size-adjust: 100%; }
  body { padding: 0 12px calc(16px + env(safe-area-inset-bottom)); }
  :where(button, input, textarea) { font: inherit; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  button { touch-action: manipulation; cursor: pointer; }
  :where(button, input, textarea, a):focus-visible, .cw-file:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
  [tabindex="-1"]:focus { outline: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* the page head */
  .cw-head { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 0; }
  .cw-logo { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; font-weight: 800; font-size: 1.25em; letter-spacing: -.01em; }
  .cw-logo svg { width: 36px; height: 36px; flex: none; }
  .cw-icon { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 1.15em; }

  .cw { max-width: 1100px; margin: 0 auto; }
  /* a widget: the dashboard's card, its group colour on the top edge and the icon chip only (never on text) */
  .cw-widget { --g: var(--g-class); background: var(--card); color: var(--ink); border-radius: var(--r); padding: 16px;
    box-shadow: inset 0 4px 0 color-mix(in srgb, var(--g) 75%, var(--card)), 0 0 0 1px color-mix(in srgb, var(--line) 70%, transparent), var(--shadow); }
  .cw-wh { display: flex; align-items: center; gap: 10px; min-height: 40px; flex-wrap: wrap; }
  .cw-wicon { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: color-mix(in srgb, var(--g) 26%, var(--card)); font-size: 1.3rem; line-height: 1; }
  .cw .cw-wt { flex: 1 1 8em; min-width: 0; margin: 0; font-size: 1.2rem; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; letter-spacing: 0; }
  .cw-card { width: min(100%, 580px); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .cw-card.cw-wide { width: min(100%, 900px); }
  .cw h2 { margin: 0; font-size: 1.45em; font-weight: 800; line-height: 1.15; letter-spacing: -.01em; }
  .cw h3 { margin: 0; font-size: 1.08em; font-weight: 800; }
  .cw-sub { margin: -6px 0 0; color: var(--muted); font-weight: 600; }
  .cw-lead { margin: 0; text-align: center; font-weight: 700; font-size: 1.1em; }
  .cw-note { margin: 0; font-weight: 600; font-size: .92em; color: var(--muted); }
  .cw-msg { margin: 0; font-weight: 700; }
  .cw-msg:empty { display: none; }
  .cw-err { color: var(--coral); }
  .cw-ok { color: var(--green); }
  .cw-row { display: flex; gap: 8px; align-items: center; }
  .cw-wrap { flex-wrap: wrap; }
  .cw-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cw-top h2 { flex: 1; min-width: 0; overflow-wrap: anywhere; }

  .cw-big { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 72px; padding: 12px 16px; border-radius: 18px;
    border: 0; background: var(--card2); text-align: start; }
  .cw-big:hover { background: var(--hover); }
  .cw-big .cw-emo { font-size: 1.8em; flex: none; }
  .cw-big span:last-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .cw-big b { font-size: 1.12em; font-weight: 800; }
  .cw-big small, .cw-code small { font-weight: 600; color: var(--muted); }
  .cw-big.cw-go { background: var(--current); color: var(--on-current); }
  .cw-big.cw-go small { color: inherit; opacity: .85; }
  .cw-btn { min-height: 46px; padding: 6px 18px; border-radius: 999px; border: 2px solid var(--ink); background: var(--card); font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  .cw-btn:hover { background: var(--card2); }
  .cw-btn.cw-go { background: var(--green); border-color: var(--green); color: #fff; }
  :root[data-theme="dark"] .cw-btn.cw-go { color: #10261A; }
  .cw-btn.cw-quiet { border-color: var(--line); }
  .cw-btn:active, .cw-big:active { transform: translateY(1px); }
  .cw-btn:disabled { opacity: .55; cursor: default; }
  .cw-main { width: 100%; min-height: 56px; font-size: 1.1em; }
  .cw-code { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: var(--r-sm); background: var(--card2); }
  .cw-code label { font-weight: 800; font-size: 1.12em; }
  .cw-in { min-height: 46px; padding: 8px 12px; border-radius: var(--r-sm); border: 2px solid var(--line); background: var(--card); min-width: 0; }
  .cw-in:focus { border-color: var(--ink); }
  .cw-code .cw-in { flex: 1; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
  .cw-mine { display: flex; flex-direction: column; gap: 8px; border-top: 2px solid var(--line); padding-top: 14px; }
  .cw-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .cw-list li { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: var(--r-sm); background: var(--card2); }
  .cw-name { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-wrap: anywhere; }
  .cw-name small { font-weight: 600; color: var(--muted); }
  .cw-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cw-field { display: flex; flex-direction: column; gap: 4px; }
  .cw-field label { font-weight: 800; }
  .cw-sec { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: var(--r-sm); background: var(--card2); }
  .cw-paste { width: 100%; resize: vertical; min-height: 110px; }
  .cw-file { position: relative; cursor: pointer; }
  .cw-file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .cw-lhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cw-lhead h3 { flex: 1; }
  .cw-btn.cw-ai { background: var(--grape-t); border-color: var(--grape); }
  .cw-words { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .cw-wrow { display: grid; grid-template-columns: 2em minmax(7em, 1fr) minmax(10em, 2fr) 44px; gap: 6px; align-items: start; }
  .cw-n { font-weight: 800; text-align: center; padding-top: 12px; color: var(--muted); }
  .cw-c { resize: vertical; min-height: 46px; width: 100%; }
  .cw-x { width: 44px; height: 46px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-weight: 800; }
  .cw-x:hover { border-color: var(--coral); color: var(--coral); }
  .cw-toggle { display: flex; align-items: center; gap: 10px; font-weight: 700; min-height: 44px; cursor: pointer; }
  .cw-toggle input { width: 24px; height: 24px; accent-color: var(--green); }
  .cw-acts { justify-content: center; }
  .cw-share { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px; border-radius: var(--r-sm); background: var(--mint-t); }
  .cw-share:empty { display: none; }
  .cw-share .cw-row { width: 100%; justify-content: center; }
  .cw-link { flex: 1; min-width: 12em; font-size: .9em; }
  .cw-codebig { margin: 0; display: flex; flex-direction: column; align-items: center; font-weight: 700; }
  .cw-codebig b { font-size: 1.8em; letter-spacing: 3px; }
  canvas.cw-qr { width: 180px; height: 180px; image-rendering: pixelated; border-radius: 12px; border: 2px solid var(--line); }

  /* the grid */
  .cw-gridwrap { position: relative; width: 100%; display: flex; justify-content: center; padding: 4px 2px; }
  .cw-gridwrap.cw-scrollx { justify-content: flex-start; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: thin; }
  .cw-grid { --cell: 34px; display: grid; grid-template-columns: repeat(var(--cols), var(--cell)); grid-template-rows: repeat(var(--rows), var(--cell)); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .cw-cell { position: relative; border: 2px solid var(--ink); margin: -1px; background: var(--card); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .cw-cell.cw-empty { border-color: transparent; background: transparent; cursor: default; }
  .cw-num { position: absolute; top: 1px; inset-inline-start: 3px; font-size: max(8px, calc(var(--cell) * .27)); font-weight: 700; line-height: 1; color: var(--muted); }
  .cw-l { font-weight: 800; font-size: calc(var(--cell) * .56); line-height: 1; padding-top: calc(var(--cell) * .1); }
  .cw-cell.cw-word { background: var(--sky-t); }
  .cw-cell.cw-sel { background: var(--sky-s); }
  .cw-cell.cw-bad { background: var(--coral-t); }
  .cw-cell.cw-bad .cw-l { color: var(--coral); text-decoration: line-through; }
  .cw-cell.cw-hinted .cw-l { color: var(--grape); }
  .cw-cell.cw-wave { animation: cw-wave .6s ease var(--cw-d, 0ms) both; }
  @keyframes cw-wave { 40% { transform: scale(1.15); background: var(--mint-t); } }
  .cw-type { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }

  /* play */
  .cw-prog { font-weight: 800; padding: 4px 12px; border-radius: 999px; background: var(--card2); white-space: nowrap; font-size: .9rem; }
  .cw-gridw { display: flex; flex-direction: column; gap: 12px; }
  .cw-play { display: flex; gap: 16px; align-items: flex-start; }
  .cw-left { flex: 1.7; min-width: 0; display: flex; flex-direction: column; gap: 12px; align-items: stretch; position: sticky; top: 8px; }
  .cw-right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  /* the clue on now: the schedule widget's dark "Now" block */
  .cw-clue { width: 100%; min-height: 84px; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 12px 16px; border-radius: var(--r-sm); background: var(--current); color: var(--on-current); }
  .cw-clue b { font-weight: 800; text-transform: uppercase; letter-spacing: .04em; font-size: .9rem; opacity: .9; }
  .cw-clue span { font-size: clamp(1.1rem, 2.4vw, 1.5rem); font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
  .cw-tools { justify-content: center; }
  .cw-clues ol, .cw-bank ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .cw-cl { width: 100%; display: flex; gap: 10px; align-items: baseline; text-align: start; padding: 8px 12px; min-height: 44px; border: 0; border-radius: var(--r-sm); background: var(--card2); font-weight: 600; }
  .cw-cl:hover { background: var(--hover); }
  .cw-cl b { min-width: 1.6em; font-weight: 800; }
  .cw-cl.cw-on { background: var(--current); color: var(--on-current); }
  .cw-cl.cw-on span { color: inherit; text-decoration: none; }
  .cw-cl.cw-done:not(.cw-on) span { color: var(--muted); }
  .cw-bank ul { flex-direction: row; flex-wrap: wrap; gap: 6px; }
  .cw-bank li { padding: 3px 12px; border-radius: 999px; background: var(--card2); font-weight: 700; }
  .cw-how summary { font-weight: 800; cursor: pointer; min-height: 30px; }
  .cw-how ul { margin: 8px 0 0; padding-inline-start: 1.2em; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }

  /* solved */
  .cw-done-card { text-align: center; align-items: center; }
  .cw-stars { font-size: 2.6em; letter-spacing: 6px; color: var(--spark); text-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .cw-stars .off { color: var(--line); }
  .cw-stats { margin: 0; font-weight: 700; color: var(--muted); }
  .cw-toast { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 20; max-width: min(92vw, 560px); padding: 10px 18px; border-radius: 16px;
    background: var(--ink); color: var(--paper); font-weight: 700; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.2); pointer-events: none; }
  .cw-toast[hidden] { display: none; }
  .cw-confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 15; }
  .cw-confetti i { position: absolute; top: -12px; width: 10px; height: 14px; border-radius: 2px; animation: cw-fall var(--t, 1.6s) ease-in var(--d, 0s) forwards; }
  @keyframes cw-fall { to { transform: translate(var(--x, 0), 105vh) rotate(var(--r, 360deg)); } }
  @media (prefers-reduced-motion: reduce) { .cw-cell.cw-wave, .cw-confetti i { animation: none; } .cw-confetti { display: none; } }
  @media (max-width: 760px) {
    .cw-play { flex-direction: column; align-items: stretch; }
    .cw-left { position: static; padding: 10px; }
    .cw-meta { grid-template-columns: 1fr; }
    .cw-wrow { grid-template-columns: 1.6em 1fr 44px; }
    .cw-wrow .cw-c { grid-column: 2 / 3; }
    .cw-wrow .cw-x { grid-row: 1; grid-column: 3; }
    .cw-card { padding: 14px 12px 16px; }
  }
</style>
</head>
<body>
<header class="cw-head">
  <div class="cw-logo"><svg viewBox="0 0 36 36" aria-hidden="true"><rect x="1" y="1" width="34" height="34" rx="9" fill="var(--accent)"/><g fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"><rect x="7" y="7" width="7" height="7"/><rect x="14" y="7" width="7" height="7"/><rect x="21" y="7" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="14" y="21" width="7" height="7"/></g></svg><span id="cw-apptitle">Crossword</span></div>
  <button class="cw-icon" type="button" id="cw-sound" aria-pressed="true">🔊</button>
</header>
<main class="cw" id="cw" aria-live="off"></main>
<div class="cw-toast" id="cw-toast" role="status" hidden></div>
<div class="sr" id="cw-say" aria-live="polite"></div>
<script>
/* crossword-core:begin */
/* Reading a word list and laying the words out on a grid: plain functions, no DOM and no kit, so the unit test runs
   this block on its own (node:vm). A word's letters are what the grid holds: capital letters (any script), with the
   spaces, hyphens and apostrophes of the typed word left out. The same words and seed always make the same grid. */
(function (root) {
  'use strict';
  var MAX_WORDS = 30, MAX_WORD = 24, MAX_CLUE = 150, MAX_SIDE = 25;

  // mulberry32: small, fast and the same on every device.
  var TWO32 = Math.pow(2, 32);
  function rng(seed) {
    var a = (seed >>> 0) || 1;
    function f() { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / TWO32; }
    return { float: f, int: function (lo, hi) { return lo + Math.floor(f() * (hi - lo + 1)); }, shuffle: function (arr) { for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(f() * (i + 1)), x = arr[i]; arr[i] = arr[j]; arr[j] = x; } return arr; } };
  }

  /** The grid letters of a typed word: ["P","H","O",...]. */
  function letters(word) {
    return Array.from(String(word || '').normalize('NFC').replace(/[\s'’\-]/g, '').toLocaleUpperCase());
  }
  /** A letter as it is compared with what a student typed: capital, accents left out (é counts as E). */
  function fold(ch) { return String(ch || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLocaleUpperCase(); }
  /** May this be a crossword word? Letters (any script) with spaces, hyphens or apostrophes; 2 to 24 characters. */
  function okWord(w) {
    w = String(w || '').trim();
    return w.length > 0 && w.length <= MAX_WORD && /^[\p{L}\p{M}][\p{L}\p{M} '’\-]*$/u.test(w) && letters(w).length >= 2;
  }
  var HEAD = /^(words?|terms?|vocab(ulary)?|answers?)\s*[,;:\t|]\s*(definitions?|clues?|meanings?|hints?)?\s*$/i;
  /** A pasted or uploaded list -> [{ w, c }]. One word a line, with its clue after a tab, " - ", " – ", " — ", ":",
   *  "=", "|" (or a full-width colon) or the first comma (a spreadsheet's two columns). A line with only a word has an empty clue. Bullets
   *  and numbers in front are dropped; a header row ("Word, Definition") is skipped; a word given twice is kept once. */
  function parseList(text) {
    var out = [], seen = {};
    String(text || '').replace(/^﻿/, '').split(/\r?\n/).slice(0, 500).forEach(function (line, i) {
      var s = line.replace(/^\s*(?:[-*•·]\s+|\d{1,3}[.)]\s+)/, '').trim();
      if (!s || (i < 3 && HEAD.test(s))) return;
      var m = /^(.*?)(?:\t|\s+[-–—]\s+|\s*[:=|：]\s*|\s*[,，、]\s*)(.*)$/.exec(s), w, c;
      if (m && okWord(m[1].replace(/^"|"$/g, ''))) { w = m[1]; c = m[2]; }
      else { w = s; c = ''; }
      w = w.replace(/^"|"$/g, '').replace(/\s+/g, ' ').trim();
      c = c.replace(/^"|"$/g, '').replace(/""/g, '"').replace(/\s+/g, ' ').trim().slice(0, MAX_CLUE);
      if (!okWord(w)) return;
      var k = letters(w).join('');
      if (seen[k]) return; seen[k] = 1;
      out.push({ w: w, c: c });
    });
    return out.slice(0, MAX_WORDS);
  }

  /* ---------- the layout ---------- */
  // One try: the words in `order`, each placed where it crosses the most letters already down (ties: the smaller grid,
  // then the seed), never touching another word side by side. Words that fit nowhere yet are tried again at the end.
  function attempt(W, order, rand) {
    var cells = {}, placed = [], left = order.slice(1), minR = 0, maxR = 0, minC = 0, maxC = W[order[0]].length - 1;
    function key(r, c) { return r + ',' + c; }
    function put(i, r, c, dir) {
      var L = W[i];
      for (var j = 0; j < L.length; j++) {
        var rr = dir === 'd' ? r + j : r, cc = dir === 'a' ? c + j : c, k = key(rr, cc), cell = cells[k] || (cells[k] = { ch: L[j], a: -1, d: -1 });
        cell[dir] = i;
        if (rr < minR) minR = rr; if (rr > maxR) maxR = rr; if (cc < minC) minC = cc; if (cc > maxC) maxC = cc;
      }
      placed.push({ i: i, r: r, c: c, dir: dir });
    }
    function fits(L, r, c, dir) {
      var dr = dir === 'd' ? 1 : 0, dc = dir === 'a' ? 1 : 0, cross = 0;
      if (cells[key(r - dr, c - dc)] || cells[key(r + dr * L.length, c + dc * L.length)]) return -1;
      for (var j = 0; j < L.length; j++) {
        var rr = r + dr * j, cc = c + dc * j, cell = cells[key(rr, cc)];
        if (cell) { if (cell.ch !== L[j] || cell[dir] >= 0) return -1; cross++; }

      }

    if (B.canAssign && B.assign) sec.appendChild(btn('cw-btn cw-go', '📚 ' + t('assign'), function () { B.assign('chapter=' + id + '&lock=1'); }, 'cw-assign'));
  }
  function qrCanvas(text) {
    try {
      var q = QR.qr(text, { max: 10 }), n = q.size + 8, px = 6, c = el('canvas', 'cw-qr'), g;
      c.width = n * px; c.height = n * px; c.setAttribute('role', 'img'); c.setAttribute('aria-label', t('qrAlt'));
      g = c.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height); g.fillStyle = '#000000';
      for (var y = 0; y < q.size; y++) for (var x = 0; x < q.size; x++) if (q.modules[y][x]) g.fillRect((x + 4) * px, (y + 4) * px, px, px);
      return c;
    } catch (e) { return null; }
  }

  /* ---------- the grid ---------- */
  function drawGrid(wrap, answers) {
    var L = S.L, P = S.P, g = el('div', 'cw-grid'); g.id = 'cw-grid';
    g.dir = C.rtl(P.w.map(function (p) { return p[0]; })) ? 'rtl' : 'ltr';
    g.style.setProperty('--cols', L.w); g.style.setProperty('--rows', L.h);
    var nums = {}; L.entries.forEach(function (e) { nums[e.r + ',' + e.c] = e.num; });
    D.cells = {};
    for (var r = 0; r < L.h; r++) for (var c = 0; c < L.w; c++) {
      var ch = L.grid[r][c], cell = el('div', ch ? 'cw-cell' : 'cw-cell cw-empty');
      if (ch) {
        cell.dataset.rc = r + ',' + c;
        if (nums[r + ',' + c]) cell.appendChild(el('span', 'cw-num', String(nums[r + ',' + c])));
        var ltr = el('span', 'cw-l', answers ? ch : (S.v[r + ',' + c] || '')); cell.appendChild(ltr);
        D.cells[r + ',' + c] = cell;

      g.appendChild(cell);
    }
    g.setAttribute('aria-hidden', 'true');
    wrap.appendChild(g); D.grid = g; D.gridWrap = wrap;
    fitGrid();
    return g;
  }
  function fitGrid() {
    var g = D.grid, wrap = D.gridWrap; if (!g || !wrap || !S.L) return;
    // Big enough to tap and read while playing (30 px at least: a big grid then scrolls sideways in its box, following
    // the square picked); the preview may be smaller, to show the whole grid at once.
    var avail = wrap.clientWidth || 300, playing = S.screen === 'play', room = playing ? Math.max(260, window.innerHeight * 0.62) : 9999;
    var size = Math.floor(Math.min(46, (avail - 4) / S.L.w, room / S.L.h));
    g.style.setProperty('--cell', Math.max(playing ? 30 : 16, size) + 'px');
    wrap.classList.toggle('cw-scrollx', g.scrollWidth > wrap.clientWidth + 2);
  }

  /* ---------- play ---------- */
  var progKey = function (P) { return P.set || ('sample-' + LANG); };
  function play(P, opts) {
    S.P = P; S.L = C.layout(P.w.map(function (p) { return p[0]; }), P.r);
    S.v = {}; S.hints = 0; S.checks = 0; S.wrong = {}; S.hinted = {}; S.dir = 'a';
    var saved = !(opts && opts.fresh) && SAVE.prog[progKey(P)];
    if (saved && saved.r === P.r && saved.n === P.w.length && saved.v && typeof saved.v === 'object') { S.v = saved.v; S.hints = saved.h || 0; S.checks = saved.c || 0; S.hinted = saved.hi || {}; }
    var first = S.L.entries[0]; S.sel = first ? [first.r, first.c] : null; S.dir = first ? first.dir : 'a';
    var cw = screen('play');
    var main = el('div', 'cw-play'); cw.appendChild(main);
    var left = el('div', 'cw-left'); main.appendChild(left);
    var gw = el('section', 'cw-gridw'); left.appendChild(gw);
    var top = head(gw, '🧩', P.t || t('title'), 'class');
    var prog = el('span', 'cw-prog'); prog.id = 'cw-prog'; top.appendChild(prog);
    if (S.fromBuild || P.mine) top.appendChild(btn('cw-btn cw-quiet', '‹ ' + t(P.mine && !S.fromBuild ? 'changeIt' : 'edit'), function () {
      saveProgress();
      if (S.fromBuild && S.draft) { S.fromBuild = false; return showPreview(); }
      edit(SAVE.mine.filter(function (m) { return m.set === P.set; })[0] || { t: P.t, w: P.w, r: P.r, b: P.b, h: P.h, set: P.set });
    }, 'cw-back'));
    var clue = el('div', 'cw-clue'); clue.id = 'cw-clue'; clue.dir = 'auto'; clue.setAttribute('aria-hidden', 'true'); gw.appendChild(clue);
    var wrap = el('div', 'cw-gridwrap'); gw.appendChild(wrap);
    var g = drawGrid(wrap, false);
    // The typing box: one hidden field that takes every letter (and brings up a phone's keyboard).
    var inp = el('input', 'cw-type'); inp.id = 'cw-type'; inp.autocomplete = 'off'; inp.autocapitalize = 'characters'; inp.spellcheck = false; inp.setAttribute('autocorrect', 'off'); inp.dir = g.dir;
    wrap.appendChild(inp); D.type = inp;
    g.addEventListener('pointerdown', function (e) {
      var cell = e.target.closest && e.target.closest('[data-rc]'); if (!cell) return;
      e.preventDefault();
      var rc = cell.dataset.rc.split(',').map(Number);
      if (S.sel && S.sel[0] === rc[0] && S.sel[1] === rc[1]) flip(); else select(rc, entryAt(rc, S.dir) ? S.dir : (S.dir === 'a' ? 'd' : 'a'));
      inp.focus({ preventScroll: true });
    });
    inp.addEventListener('keydown', onKey);
    inp.addEventListener('input', function (e) { if (e.isComposing) return; takeTyped(); });
    inp.addEventListener('compositionend', function () { takeTyped(); });
    inp.addEventListener('focus', function () { g.classList.add('cw-focus'); });
    inp.addEventListener('blur', function () { g.classList.remove('cw-focus'); });
    // Tools.
    var tools = el('div', 'cw-row cw-wrap cw-tools');
    tools.appendChild(btn('cw-btn', '✔️ ' + t('check'), function () { check(); }, 'cw-check'));
    if (P.h) tools.appendChild(btn('cw-btn', '💡 ' + t('hint'), function () { hint(); }, 'cw-hint'));
    gw.appendChild(tools);
    // Clues (and the word bank).
    var right = el('div', 'cw-right'); main.appendChild(right);
    ['a', 'd'].forEach(function (dir) {
      var es = S.L.entries.filter(function (e) { return e.dir === dir; }); if (!es.length) return;
      var sec = el('section', 'cw-clues'); head(sec, dir === 'a' ? '➡️' : '⬇️', t(dir === 'a' ? 'across' : 'down'), dir === 'a' ? 'time' : 'join', 'h3');
      var ol = el('ol');
      es.forEach(function (e) {
        var b = btn('cw-cl', '', function () { var sq = firstOpen(e); select(sq, e.dir); inp.focus({ preventScroll: true }); });
        b.id = 'cw-cl-' + e.num + e.dir; b.dir = 'auto';
        b.appendChild(el('b', '', String(e.num))); b.appendChild(el('span', '', P.w[e.i][1] + ' (' + C.letters(P.w[e.i][0]).length + ')'));
        var li = el('li'); li.appendChild(b); ol.appendChild(li);
      });
      sec.appendChild(ol); right.appendChild(sec);
    });
    if (P.b) {
      var bank = el('section', 'cw-bank'); bank.id = 'cw-bank'; head(bank, '📚', t('bankH'), 'tools', 'h3');
      var ul = el('ul');
      S.L.entries.map(function (e) { return P.w[e.i][0]; }).sort(function (a, b) { return a.localeCompare(b); }).forEach(function (w) { var li = el('li', '', w); li.dir = 'auto'; ul.appendChild(li); });
      bank.appendChild(ul); right.appendChild(bank);
    }
    refresh();
    setTimeout(function () { try { inp.focus({ preventScroll: true }); } catch (e) { /* not yet */ } }, 60);
  }
  function entryAt(rc, dir) {
    var es = S.L.entries;
    for (var k = 0; k < es.length; k++) { var e = es[k]; if (e.dir !== dir) continue; if (dir === 'a' ? (e.r === rc[0] && rc[1] >= e.c && rc[1] < e.c + e.len) : (e.c === rc[1] && rc[0] >= e.r && rc[0] < e.r + e.len)) return e; }
    return null;
  }
  function cur() { return S.sel ? (entryAt(S.sel, S.dir) || entryAt(S.sel, S.dir === 'a' ? 'd' : 'a')) : null; }
  function firstOpen(e) { var sq = C.squares(e); for (var j = 0; j < sq.length; j++) if (!S.v[sq[j][0] + ',' + sq[j][1]]) return sq[j]; return sq[0]; }
  function select(rc, dir) { S.sel = rc; if (dir && entryAt(rc, dir)) S.dir = dir; else if (!entryAt(rc, S.dir)) S.dir = S.dir === 'a' ? 'd' : 'a'; refresh(); }
  function flip() { var o = S.dir === 'a' ? 'd' : 'a'; if (entryAt(S.sel, o)) { S.dir = o; sfx('select', { volume: 0.3 }); refresh(); } }
  function refresh() {
    if (!D.cells) return;
    var e = cur(), inWord = {};
    if (e) { S.dir = e.dir; C.squares(e).forEach(function (sq) { inWord[sq[0] + ',' + sq[1]] = 1; }); }
    Object.keys(D.cells).forEach(function (k) {
      var cell = D.cells[k], v = S.v[k] || '';
      cell.lastChild.textContent = v;
      cell.classList.toggle('cw-word', !!inWord[k]);
      cell.classList.toggle('cw-sel', !!S.sel && k === S.sel[0] + ',' + S.sel[1]);
      cell.classList.toggle('cw-bad', !!S.wrong[k] && !!v);
      cell.classList.toggle('cw-hinted', !!S.hinted[k]);
    });
    if (S.sel && D.gridWrap && D.gridWrap.classList.contains('cw-scrollx')) { var sc = D.cells[S.sel[0] + ',' + S.sel[1]]; if (sc) sc.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
    document.querySelectorAll('.cw-cl').forEach(function (b) { b.classList.toggle('cw-on', !!e && b.id === 'cw-cl-' + e.num + e.dir); b.classList.toggle('cw-done', doneEntry(entryById(b.id))); });
    var clue = document.getElementById('cw-clue');
    if (clue && e) {
      clue.innerHTML = '';
      var tag = el('b', '', e.num + ' ' + t(e.dir === 'a' ? 'across' : 'down')); clue.appendChild(tag); clue.appendChild(el('span', '', S.P.w[e.i][1]));
      var pattern = C.squares(e).map(function (sq) { return S.v[sq[0] + ',' + sq[1]] || '_'; }).join(' ');
      if (D.type) D.type.setAttribute('aria-label', t('clueSay', { n: e.num, dir: t(e.dir === 'a' ? 'across' : 'down'), clue: S.P.w[e.i][1], len: e.len }) + ' ' + pattern);
    }
    var done = S.L.entries.filter(doneEntry).length, p = document.getElementById('cw-prog');
    if (p) p.textContent = t('progress', { a: done, b: S.L.entries.length });
  }
  function entryById(id) { var m = /^cw-cl-(\d+)([ad])$/.exec(id || ''); if (!m) return null; return S.L.entries.filter(function (e) { return e.num === +m[1] && e.dir === m[2]; })[0] || null; }
  function doneEntry(e) { return !!e && C.squares(e).every(function (sq) { return !!S.v[sq[0] + ',' + sq[1]]; }); }
  /** Move along the word: +1 to the next square, -1 back. */
  function step(d) {
    var e = cur(); if (!e) return;
    var sq = C.squares(e), at = -1;
    for (var j = 0; j < sq.length; j++) if (sq[j][0] === S.sel[0] && sq[j][1] === S.sel[1]) at = j;
    var nx = at + d;
    if (nx >= 0 && nx < sq.length) { S.sel = sq[nx]; return; }
    if (d > 0) { var es = S.L.entries, k = es.indexOf(e), nextE = null; for (var m = 1; m <= es.length; m++) { var c2 = es[(k + m) % es.length]; if (!doneEntry(c2)) { nextE = c2; break; } } if (nextE) { S.sel = firstOpen(nextE); S.dir = nextE.dir; } }
  }
  function put(ch) {
    if (!S.sel || S.screen !== 'play') return;
    var k = S.sel[0] + ',' + S.sel[1];
    if (S.hinted[k]) { step(1); refresh(); return; }
    S.v[k] = ch; delete S.wrong[k];
    sfx('pop', { volume: 0.35 });
    step(1); refresh(); saveProgress(); afterMove();
  }
  function takeTyped() {
    var inp = D.type; if (!inp) return;
    var chars = Array.from(inp.value.normalize('NFC').toLocaleUpperCase()).filter(function (c) { return /[\p{L}\p{M}]/u.test(c); });
    inp.value = '';
    chars.forEach(function (c) { put(c); });
  }
  function onKey(e) {
    if (S.screen !== 'play' || e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key, rtl = D.grid && D.grid.dir === 'rtl';
    var mv = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, rtl ? 1 : -1], ArrowRight: [0, rtl ? -1 : 1] }[k];
    if (mv) {
      e.preventDefault();
      var want = mv[0] ? 'd' : 'a';
      if (S.dir !== want && entryAt(S.sel, want)) { S.dir = want; refresh(); return; }
      var r = S.sel[0] + mv[0], c = S.sel[1] + mv[1];
      while (r >= 0 && c >= 0 && r < S.L.h && c < S.L.w && !S.L.grid[r][c]) { r += mv[0]; c += mv[1]; }
      if (r >= 0 && c >= 0 && r < S.L.h && c < S.L.w) select([r, c], want);
      return;
    }
    if (k === 'Backspace' || k === 'Delete') {
      e.preventDefault();
      var key = S.sel[0] + ',' + S.sel[1];
      if (S.v[key] && !S.hinted[key]) { delete S.v[key]; delete S.wrong[key]; }
      else if (k === 'Backspace') { step(-1); key = S.sel[0] + ',' + S.sel[1]; if (!S.hinted[key]) { delete S.v[key]; delete S.wrong[key]; } }
      sfx('whoosh', { volume: 0.25 }); refresh(); saveProgress(); return;
    }
    if (k === 'Enter' || k === 'Tab') {
      e.preventDefault();
      var es = S.L.entries, i = es.indexOf(cur()), n = es[(i + (e.shiftKey ? es.length - 1 : 1)) % es.length];
      select(firstOpen(n), n.dir); return;
    }
    if (k === ' ') { e.preventDefault(); flip(); }
  }
  function check() {
    if (S.screen !== 'play') return;
    S.checks++; S.wrong = {};
    var bad = 0;
    Object.keys(D.cells).forEach(function (k) { var rc = k.split(','), v = S.v[k]; if (v && C.fold(v) !== C.fold(S.L.grid[+rc[0]][+rc[1]])) { S.wrong[k] = 1; bad++; } });
    refresh(); saveProgress();
    var m = bad ? t('wrongN', { n: bad }) : t('allRight');
    sfx(bad ? 'wrong' : 'correct', { volume: 0.5 }); toast(m); announce(m);
  }
  function hint() {
    if (S.screen !== 'play') return;
    if (!S.P.h) { toast(t('noHints')); return; }
    var e = cur(); if (!e) return;
    var sq = C.squares(e), pick = null;
    var here = S.sel[0] + ',' + S.sel[1];
    if (!S.hinted[here] && C.fold(S.v[here] || '') !== C.fold(S.L.grid[S.sel[0]][S.sel[1]])) pick = S.sel;
    for (var j = 0; !pick && j < sq.length; j++) { var k = sq[j][0] + ',' + sq[j][1]; if (C.fold(S.v[k] || '') !== C.fold(S.L.grid[sq[j][0]][sq[j][1]])) pick = sq[j]; }
    if (!pick) { toast(t('allRight')); return; }
    var key = pick[0] + ',' + pick[1];
    S.v[key] = S.L.grid[pick[0]][pick[1]]; S.hinted[key] = 1; delete S.wrong[key]; S.hints++;
    S.sel = pick; sfx('spark', { volume: 0.6 }); refresh(); saveProgress();
    announce(t('hinted')); afterMove();
  }
  function saveProgress() {
    if (S.screen !== 'play' || !S.P) return;
    SAVE.prog[progKey(S.P)] = { r: S.P.r, n: S.P.w.length, v: S.v, h: S.hints, c: S.checks, hi: S.hinted, at: new Date().getTime() };
    var keys = Object.keys(SAVE.prog); if (keys.length > 40) { keys.sort(function (a, b) { return (SAVE.prog[a].at || 0) - (SAVE.prog[b].at || 0); }); delete SAVE.prog[keys[0]]; }
    persist();
  }
  function afterMove() {
    var ks = Object.keys(D.cells);
    for (var i = 0; i < ks.length; i++) if (!S.v[ks[i]]) return;
    for (i = 0; i < ks.length; i++) { var rc = ks[i].split(','); if (C.fold(S.v[ks[i]]) !== C.fold(S.L.grid[+rc[0]][+rc[1]])) { if (!S.toldFull) { S.toldFull = true; toast(t('notDone')); announce(t('notDone')); } return; } }
    win();
  }
  /** Solved: every square shows its own letter (accents and all), a wave, confetti, then the solved card; the game's
   *  one BRB.gameOver for this solve (a lesson step done, the Classroom completion grade). */
  function win() {
    var r = { hints: S.hints, checks: S.checks, letters: Object.keys(D.cells).length }, stars = C.stars(r), points = C.score(r);
    S.screen = 'won'; S.toldFull = false; delete SAVE.prog[progKey(S.P)]; persist();
    Object.keys(D.cells).forEach(function (k) { var rc = k.split(','); D.cells[k].lastChild.textContent = S.L.grid[+rc[0]][+rc[1]]; D.cells[k].classList.remove('cw-bad', 'cw-sel', 'cw-word'); });
    if (!reduced()) Object.keys(D.cells).forEach(function (k) { var rc = k.split(','); D.cells[k].style.setProperty('--cw-d', ((+rc[0] + +rc[1]) * 35) + 'ms'); D.cells[k].classList.add('cw-wave'); });
    if (D.type) D.type.blur();
    document.querySelectorAll('.cw-tools button, .cw-cl').forEach(function (b) { b.disabled = true; });
    toastBox.hidden = true; clearTimeout(toastTimer);
    sfx('levelup'); announce(t('solvedH'));
    try { if (B.gameOver) B.gameOver({ won: true, score: points }); } catch (e) { /* no SDK */ }
    confetti();
    setTimeout(function () { showSolved(stars, points); }, reduced() ? 300 : 1100);
  }
  function showSolved(stars, points) {
    if (S.screen !== 'won') return;
    var left = D.cw.querySelector('.cw-gridw'); if (!left) return;
    var box = el('section', 'cw-sec cw-done-card'); box.id = 'cw-solved';
    var h = el('h2', '', '🎉 ' + t('solvedH')); h.tabIndex = -1; box.appendChild(h);
    var st = el('div', 'cw-stars'); st.setAttribute('role', 'img'); st.setAttribute('aria-label', t('starsSay', { n: stars }));
    for (var i = 0; i < 3; i++) { var sp = el('span', i < stars ? '' : 'off', '★'); sp.setAttribute('aria-hidden', 'true'); st.appendChild(sp); }
    box.appendChild(st);
    box.appendChild(el('p', 'cw-stats', t('stats', { h: S.hints, c: S.checks, p: points })));
    var row = el('div', 'cw-row cw-wrap cw-acts');
    row.appendChild(btn('cw-btn cw-go', '🔁 ' + t('playAgain'), function () { sfx('select'); play(S.P, { fresh: true }); }, 'cw-again'));
    if (S.fromBuild || S.P.mine) row.appendChild(btn('cw-btn', '✏️ ' + t(S.fromBuild ? 'edit' : 'changeIt'), function () { var bk = document.getElementById('cw-back'); if (bk) bk.click(); }, 'cw-done-edit'));
    else row.appendChild(btn('cw-btn cw-quiet', '🏠 ' + t('home'), function () { S.backTo = 'home'; showHome(); }, 'cw-done-home'));
    box.appendChild(row);
    left.insertBefore(box, left.querySelector('.cw-clue'));
    var tools = left.querySelector('.cw-tools'); if (tools) tools.hidden = true;
    h.focus({ preventScroll: true }); box.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' });
  }
  function confetti() {
    if (reduced()) return;
    var box = el('div', 'cw-confetti'), cols = ['var(--green)', 'var(--sky)', 'var(--spark)', 'var(--coral)', 'var(--grape)'];
    box.setAttribute('aria-hidden', 'true');
    for (var i = 0; i < 70; i++) {
      var p = el('i'); p.style.left = (Math.random() * 100) + '%'; p.style.background = cols[i % cols.length];
      p.style.setProperty('--x', ((Math.random() - 0.5) * 240) + 'px'); p.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg');
      p.style.setProperty('--d', (Math.random() * 0.5) + 's'); p.style.setProperty('--t', (1.4 + Math.random() * 1.2) + 's');
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(function () { box.remove(); }, 3500);
  }

  /* ---------- test hooks (window.__brbTest) ---------- */
  function testState() {
    return {
      screen: S.screen, title: S.P ? S.P.t : '', words: S.P ? S.P.w.length : 0, set: S.P ? S.P.set || '' : '',
      size: S.L ? [S.L.w, S.L.h] : null, entries: S.L ? S.L.entries.length : 0, unplaced: S.L ? S.L.unplaced.length : 0,
      filled: Object.keys(S.v).length, cells: D.cells ? Object.keys(D.cells).length : 0, hints: S.hints, checks: S.checks,
      sel: S.sel, dir: S.dir, draft: S.draft ? S.draft.w.length : 0, mine: SAVE.mine.length,
      answers: S.L && (S.screen === 'play' || S.screen === 'preview') ? S.L.entries.map(function (e) { return { num: e.num, dir: e.dir, r: e.r, c: e.c, letters: C.squares(e).map(function (sq) { return S.L.grid[sq[0]][sq[1]]; }).join('') }; }) : [],
    };
  }
  window.__brbTest = Object.assign(window.__brbTest || {}, {
    cwState: testState,
    cwType: function (s) { Array.from(String(s)).forEach(function (c) { put(c.toLocaleUpperCase()); }); return testState(); },
    cwSelect: function (r, c, dir) { select([r, c], dir); return testState(); },
    // Straight into the sample puzzle (the cover's recipe): past the title and the how-to.
    cwSample: function () { S.setDone = true; playSample(); },
  });
  begin();
})();
