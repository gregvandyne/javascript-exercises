<title>Footy Tycoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: night stadium. 9x9 board ring (32 spaces) framed like the stands, floodlit pitch in the middle holds dice + controls; team sheets below. Single committed dark look. */
:root{
  --night:#070b18; --night2:#0f1730; --tile:#141d36; --tile2:#1b2747; --ink:#eef3ff; --muted:#93a2c6; --line:#2c3a63;
  --grass:#1f8f45; --grass2:#1a7f3d; --chalk:#f4fff6; --gold:#ffd23f; --gold-ink:#1d1606; --neon:#39e58c; --red:#ff4f5e;
  --display:"Bungee","Impact",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);font-family:var(--body);
  background-image:radial-gradient(60% 40% at 10% -5%,rgba(160,200,255,.22),transparent 70%),radial-gradient(60% 40% at 90% -5%,rgba(160,200,255,.22),transparent 70%),linear-gradient(var(--night2),var(--night) 60%);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.title{display:flex;flex-direction:column;align-items:center;gap:2px}
.title h1{font:400 clamp(1.9rem,9vw,2.8rem)/1 var(--display);margin:0;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff 10%,var(--gold) 55%,#e08a00 95%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #5a3500) drop-shadow(0 0 18px rgba(255,210,63,.35))}
.title small{font:900 .7rem var(--body);letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
button{font-family:inherit}
.btn{font:400 1rem var(--display);letter-spacing:.03em;padding:11px 18px;border-radius:14px;cursor:pointer;border:2px solid var(--line);
  background:linear-gradient(var(--tile2),var(--tile));color:var(--ink);box-shadow:0 4px 0 #050812,0 0 0 1px rgba(255,255,255,.04) inset}
.btn.primary{background:linear-gradient(#ffe27a,var(--gold) 50%,#f0a800);color:var(--gold-ink);border-color:#a46a00;box-shadow:0 4px 0 #7a4c00,0 0 22px rgba(255,210,63,.35)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #050812}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.btn:focus-visible,.tile:focus-visible,.chipbtn:focus-visible,.mode:focus-visible{outline:3px solid var(--neon);outline-offset:2px}

/* setup */
.panel{background:linear-gradient(var(--tile2),var(--tile));border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.4)}
.panel h2{font:400 1.05rem var(--display);margin:0;color:var(--gold);letter-spacing:.04em}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{border:2px solid var(--line);border-radius:16px;background:var(--night2);color:var(--ink);padding:12px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.mode b{font:400 1.05rem var(--display)}
.mode span{font-size:.78rem;color:var(--muted);font-weight:800}
.mode .faces{display:flex}
.mode .faces div{width:38px;height:38px;border-radius:50%;margin-inline-start:-8px;border:2px solid var(--night2);background:var(--tile2);overflow:hidden}
.mode .faces div:first-child{margin-inline-start:0}
.mode[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset,0 0 24px rgba(255,210,63,.25);background:linear-gradient(#2a2410,var(--night2))}
.counts{display:flex;gap:8px}
.counts .btn{flex:1}
.counts .btn[aria-pressed="true"]{background:var(--neon);color:#062513;border-color:#0f7a43}
.names{display:flex;flex-direction:column;gap:8px}
.namerow{display:flex;gap:10px;align-items:center}
.pblock{display:flex;flex-direction:column;gap:6px}
.iconrow{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.iconrow::-webkit-scrollbar{display:none}
.iconpick{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--night2);font-size:1.15rem;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.iconpick[aria-pressed="true"]{border-color:#fff;background:var(--c);box-shadow:0 0 12px var(--c)}
.dot.ic{width:32px;height:32px;display:grid;place-items:center;font-size:1.05rem;line-height:1}
.botbtn{flex:none;font:900 .85rem var(--body);padding:9px 10px;border-radius:12px;border:2px solid var(--line);background:var(--night2);color:var(--muted);cursor:pointer}
.botbtn[aria-pressed="true"]{background:#7c5cff;border-color:#a78bfa;color:#fff;box-shadow:0 0 14px rgba(124,92,255,.5)}
.namerow input{flex:1;min-width:0;font:800 1rem var(--body);padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--night2);color:var(--ink)}
.dot{width:22px;height:22px;border-radius:50%;border:3px solid #fff;flex:none;box-shadow:0 0 10px var(--c,transparent)}
.rules{margin:0;padding-inline-start:20px;color:var(--muted);font-size:.9rem;line-height:1.45;display:flex;flex-direction:column;gap:3px}
.rules b{color:var(--ink)}

/* board */
.stadium{padding:8px;border-radius:20px;background:linear-gradient(145deg,#25335c,#0b1124);box-shadow:0 0 0 2px var(--line),0 18px 40px rgba(0,0,0,.6),0 0 60px rgba(57,229,140,.08)}
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));
  aspect-ratio:1;width:100%;max-width:100%;gap:2px;background:#050812;border-radius:12px;overflow:hidden}
.tile{position:relative;background:linear-gradient(170deg,var(--tile2),var(--tile));border:0;padding:0;color:var(--ink);display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;text-align:center;min-width:0;min-height:0;cursor:pointer;overflow:hidden}
.tile .band{height:12%;width:100%;flex:none;background:var(--g);box-shadow:0 0 8px var(--g)}
.tile .av{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding-top:4%}
.tile .av svg{height:100%;width:auto;max-width:90%}
.tile .nm{font:900 clamp(.38rem,1.55vw,.66rem)/1 var(--body);padding:1px 1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;letter-spacing:-.02em}
.tile.special{justify-content:center;gap:2px}
.tile .ic{font-size:clamp(.8rem,3.4vw,1.35rem);line-height:1}
.tile .ic svg{height:clamp(16px,5.6vw,30px);width:auto}
.tile.special .nm{font-family:var(--display);font-weight:400;font-size:clamp(.32rem,1.35vw,.56rem);letter-spacing:0}
.tile.chance{background:linear-gradient(170deg,#3a2f0b,#211a06)}
.tile.chance .ic{color:var(--gold);font-family:var(--display);text-shadow:0 0 10px var(--gold)}
.tile.shoot{background:repeating-linear-gradient(45deg,#0f3a22 0 4px,#0c2f1c 4px 8px)}
.tile.champ{background:linear-gradient(170deg,#2b2350,#17123a)}
.tile.corner{background:linear-gradient(135deg,#22305a,#121a33)}
.tile.corner .nm{font-size:clamp(.36rem,1.5vw,.62rem)}
.tile.owned::after{content:"";position:absolute;inset:0;border:2px solid var(--own);border-radius:2px;pointer-events:none;box-shadow:inset 0 0 10px var(--own)}
.tile .hurt{position:absolute;top:13%;left:1px;font-size:.55rem}
.tile .toks{position:absolute;left:0;right:0;bottom:2px;display:flex;justify-content:center;gap:1px;z-index:2}
.tok{width:clamp(13px,3.7vw,21px);height:clamp(13px,3.7vw,21px);border-radius:50%;border:1.5px solid #fff;display:grid;place-items:center;font-size:clamp(7px,2.3vw,12px);line-height:1;box-shadow:0 2px 4px rgba(0,0,0,.6),0 0 8px var(--c)}
.tok.hop{animation:hop .17s ease-out}
@keyframes hop{50%{transform:translateY(-60%) scale(1.15)}}
.tile.here{filter:brightness(1.35)}

.pitch{grid-area:2/2/10/10;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,2vw,14px);
  padding:10px;color:var(--chalk);text-align:center;overflow:hidden;
  background:radial-gradient(70% 60% at 50% 45%,rgba(255,255,255,.12),transparent 70%),repeating-linear-gradient(90deg,var(--grass) 0 12.5%,var(--grass2) 12.5% 25%)}
.pitch .lines{position:absolute;inset:0;pointer-events:none}
.pitch > :not(.lines){position:relative;z-index:1}
.turnpill{display:flex;align-items:center;gap:8px;background:rgba(5,10,20,.55);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:5px 14px 5px 6px;
  font:400 clamp(.75rem,3vw,1rem) var(--display);max-width:100%;backdrop-filter:blur(2px)}
.turnpill .tok{width:26px;height:26px;flex:none;font-size:15px}
.turnpill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minidice{display:flex;gap:8px}
.mdie{width:clamp(30px,8.5vw,42px);aspect-ratio:1;background:linear-gradient(145deg,#fff,#dfe5ef);border-radius:9px;display:grid;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14%;gap:6%;box-shadow:0 4px 0 #9aa6bd,0 6px 12px rgba(0,0,0,.4)}
.mdie i,.face i{border-radius:50%}
.mdie i.on,.face i.on{background:radial-gradient(circle at 35% 35%,#4a5170,#0d1226)}
.msg{font:900 clamp(.7rem,2.8vw,.95rem)/1.25 var(--body);max-width:88%;min-height:2.5em;text-wrap:balance;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.pitch .btn{font-size:clamp(1rem,4.4vw,1.35rem);padding:10px 30px}

/* rolling dice overlay */
.diceStage{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;gap:28px;pointer-events:none;perspective:900px;transition:opacity .3s}
.dw{position:relative;width:68px;height:68px;transform-style:preserve-3d}
.cube{position:absolute;inset:0;transform-style:preserve-3d;--h:34px}
.face{position:absolute;inset:0;border-radius:14px;background:linear-gradient(145deg,#ffffff,#dde3ee);box-shadow:inset 0 0 0 2px #c7cfdf,inset 0 -6px 10px rgba(0,0,0,.08);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14%;gap:6%;backface-visibility:hidden}
.f1{transform:translateZ(var(--h))} .f2{transform:rotateY(90deg) translateZ(var(--h))} .f3{transform:rotateX(90deg) translateZ(var(--h))}
.f4{transform:rotateX(-90deg) translateZ(var(--h))} .f5{transform:rotateY(-90deg) translateZ(var(--h))} .f6{transform:rotateY(180deg) translateZ(var(--h))}
.dshadow{position:absolute;left:8%;right:8%;bottom:-22px;height:14px;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(5px)}

/* team sheets */
.sheets{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.ps{background:linear-gradient(var(--tile2),var(--tile));border:2px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:7px;min-width:0}
.ps.active{box-shadow:0 0 0 2px var(--c),0 0 24px color-mix(in srgb,var(--c) 45%,transparent)}
.ps .top{display:flex;align-items:center;gap:8px;min-width:0}
.ps .top b{font:400 .95rem var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.ps .money{font:400 1.35rem var(--display);font-variant-numeric:tabular-nums;color:var(--neon)}
.checks{display:flex;gap:6px}
.checks i{width:26px;height:26px;border-radius:50%;border:2px dashed var(--muted);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:.9rem}
.checks i.on{border:2px solid #fff;background:var(--neon);color:#062513;box-shadow:0 0 12px var(--neon)}
.owned-list{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:800 .72rem var(--body);padding:2px 7px 2px 2px;border-radius:999px;border:1.5px solid var(--g);background:var(--night2);display:inline-flex;align-items:center;gap:4px}
.chip .mini{width:18px;height:18px;border-radius:50%;overflow:hidden;background:var(--tile2);display:grid;place-items:center}
.chip .mini svg{width:100%;height:100%}
.ps .none{font-size:.78rem;color:var(--muted)}
.ps .note{font-size:.75rem;font-weight:900;color:var(--red)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.foot .btn{font-size:.8rem;padding:7px 12px}
.howto{font-size:.85rem;color:var(--muted);margin:0;line-height:1.45}
.modetag{font:400 .75rem var(--display);color:var(--gold);letter-spacing:.06em}

/* modal */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(3,6,14,.72);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:380px;max-height:100%;overflow:auto;background:linear-gradient(var(--tile2),var(--tile));border:2px solid var(--line);border-radius:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px color-mix(in srgb,var(--hc,var(--gold)) 30%,transparent);animation:pop .35s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:scale(.6) rotate(-3deg);opacity:0}}
.sheet-head{background:linear-gradient(135deg,var(--hc,var(--gold)),color-mix(in srgb,var(--hc,var(--gold)) 60%,#000));color:var(--hi,#fff);padding:14px 16px 12px}
.sheet-head small{display:block;font:900 .7rem var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.sheet-head h3{font:400 1.4rem/1.1 var(--display);margin:3px 0 0;text-wrap:balance;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.sheet-body{padding:14px 16px;font-size:1rem;line-height:1.4;display:flex;flex-direction:column;gap:8px}
.sheet-body p{margin:0}
.sheet-body .big{font:400 2.4rem/1 var(--display);text-align:center}
.sheet-body .stat{display:flex;justify-content:space-between;gap:10px;font-weight:800;border-bottom:1px dashed var(--line);padding-bottom:4px}
.card{display:flex;align-items:center;gap:12px}
.avbig{width:96px;height:96px;flex:none;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#3a4a7a,#141d36);border:3px solid var(--g,#fff);box-shadow:0 0 18px var(--g,transparent)}
.avbig svg{width:100%;height:100%}
.card .who b{display:block;font:400 1.05rem/1.1 var(--display)}
.card .who span{font-weight:800;color:var(--muted);font-size:.9rem}
.sheet-btns{padding:0 16px 16px;display:flex;flex-wrap:wrap;gap:8px}
.sheet-btns .btn{flex:1 1 auto}
.chipbtn{flex:1 1 40%;font:800 .9rem var(--body);padding:6px 8px;border-radius:12px;border:2px solid var(--g);background:var(--night2);color:var(--ink);
  cursor:pointer;display:flex;align-items:center;gap:6px;text-align:start}
.chipbtn .mini{width:26px;height:26px;border-radius:50%;overflow:hidden;flex:none;background:var(--tile2)}
.chipbtn small{color:var(--muted);font-weight:800;display:block}
.mini-dice{display:flex;justify-content:center;gap:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pitch .btn.small{font-size:clamp(.75rem,3vw,.95rem);padding:8px 12px}
.tside{border:1.5px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--night2)}
.tside h4{margin:0;font:400 .85rem var(--display);color:var(--gold)}
.cash{display:flex;align-items:center;gap:8px;font-weight:900;flex-wrap:wrap}
.cash input{width:96px;font:800 1rem var(--body);padding:6px 8px;border-radius:10px;border:2px solid var(--line);background:var(--tile);color:var(--ink)}
.cash small{color:var(--muted)}
.titems{display:flex;flex-wrap:wrap;gap:6px}
.titem{display:inline-flex;align-items:center;gap:5px;padding:4px 9px 4px 4px;border-radius:999px;border:2px solid var(--g);font-weight:800;font-size:.82rem;cursor:pointer}
.titem input{width:18px;height:18px;accent-color:var(--neon);margin:0}
.titem .mini{width:22px;height:22px;border-radius:50%;overflow:hidden;background:var(--tile2)}
.titem:has(input:checked){background:color-mix(in srgb,var(--g) 32%,transparent)}
.none{font-size:.8rem;color:var(--muted)}
.ps .pardon{font-size:.75rem;font-weight:900;color:var(--gold)}
.iconpick:disabled{opacity:.22;cursor:not-allowed;filter:grayscale(1)}
.tile.goalie .band{background:repeating-linear-gradient(90deg,#22d3ee 0 4px,#0e7490 4px 8px);box-shadow:0 0 8px #22d3ee}
.tile .glove{position:absolute;top:12%;right:1px;font-size:clamp(.45rem,1.8vw,.7rem)}
.tile.redcard{background:linear-gradient(135deg,#5a0f1c,#2a0710)}
.tile.sinbin{background:repeating-linear-gradient(90deg,#1b2440 0 6px,#0d1328 6px 9px)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:8px;height:14px;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* trophy shop */
.shophead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wallet{display:flex;gap:6px;flex-wrap:wrap}
.wchip{font:800 .9rem var(--body);padding:7px 12px;border-radius:999px;border:2px solid var(--line);background:var(--night2);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.wchip b{color:var(--gold);font-family:var(--display);font-weight:400}
.wchip[aria-pressed="true"]{border-color:var(--gold);background:#2a2410;box-shadow:0 0 14px rgba(255,210,63,.3)}
.shoptabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.shoptabs::-webkit-scrollbar{display:none}
.shoptabs .btn{flex:none;font-size:.85rem;padding:8px 12px}
.shoptabs .btn[aria-pressed="true"]{background:var(--gold);color:#1d1606;border-color:#a46a00}
.prizes{display:flex;flex-direction:column;gap:8px}
.prize{border:2px solid var(--line);border-radius:14px;background:var(--night2);padding:10px;display:flex;gap:10px;align-items:center}
.prize .pe{font-size:1.9rem;line-height:1;flex:none;width:44px;text-align:center}
.prize .pt{flex:1;min-width:0}
.prize .pt b{display:block;font:400 .92rem/1.15 var(--display);letter-spacing:.02em}
.prize .pt small{color:var(--muted);font-weight:800;line-height:1.25;display:block}
.prize .cost{font:400 1rem var(--display);color:var(--gold);white-space:nowrap}
.prize .btn{padding:8px 12px;font-size:.8rem;flex:none}
.prize.owned{border-color:var(--neon)}
.prize.cant{opacity:.7}
.bigtrophy{font:400 2.2rem var(--display);color:var(--gold);text-shadow:0 0 18px rgba(255,210,63,.4);white-space:nowrap}
.voucher{border:2px dashed var(--gold);border-radius:12px;padding:10px 12px;background:#2a2410;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.voucher.used{opacity:.45;border-style:solid;border-color:var(--line);background:var(--night2)}
.voucher .vn{font:400 1rem var(--display)} .voucher small{color:var(--muted);font-weight:800;display:block}
.ticket{border:3px dashed var(--gold);border-radius:16px;padding:14px;text-align:center;background:repeating-linear-gradient(45deg,#2a2410 0 10px,#241f0e 10px 20px)}
.ticket .te{font-size:3rem;line-height:1}
.ticket h4{margin:6px 0 2px;font:400 1.3rem var(--display);color:var(--gold)}
.ticket p{margin:0;font-weight:800}
.grown{display:flex;flex-direction:column;gap:8px}
.grow{display:grid;grid-template-columns:52px 1fr 70px auto;gap:6px;align-items:center}
.grow input{font:800 .95rem var(--body);padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--night2);color:var(--ink);min-width:0;width:100%}
.ttl{font:400 .72rem var(--display);color:var(--gold);letter-spacing:.04em;white-space:nowrap}
.emptybox{text-align:center;color:var(--muted);font-weight:800;padding:14px;border:2px dashed var(--line);border-radius:14px}
.sect{font:400 .85rem var(--display);color:var(--gold);letter-spacing:.06em;margin-top:4px}
@media (prefers-reduced-motion:reduce){.sheet,.tok.hop,.confetti i{animation:none}}
/* Languages. The board ring always runs left to right (its squares are placed by grid column); menus, the pitch's
   messages and the popups follow the language's direction. fitTiles() shrinks a square's label to fit, and lets a
   two-word label take two lines when it still does not. */
.board{direction:ltr}
.tile.champ .ic svg{height:clamp(14px,4.8vw,26px)}   /* leaves room for the label under the trophy */
.turnpill span{white-space:normal;line-height:1.1;text-wrap:balance}   /* a long name and title wrap to a second line */
.ps .top{flex-wrap:wrap}
.ps .top b{white-space:normal;overflow-wrap:anywhere;text-overflow:clip}   /* a long name wraps instead of being cut */

function buildSpaces(mode){
  const R=ROSTERS[mode].players;SPACES=[];
  // Squares and championships get their names in the player's language (full name, and a short one for the board).
  const CH=CHAMPS.map(c=>({...c,name:t('ch_'+c.kind),short:t('chs_'+c.kind)}));
  const CO=CORNERS.map(c=>({...c,name:t('sq_'+c.t),short:t('sqs_'+c.t)}));
  for(let s=0;s<4;s++){
    const g1=2*s,g2=2*s+1,P=(j,g)=>{const [name,short,av]=R[j];const G=GROUPS[g];return {t:'player',name,short,av,g,price:G.price,rent:G.rent};};
    SPACES.push({...CO[s]});
    SPACES.push(P(4*s,g1));
    SPACES.push({t:'chance',name:t('sq_chance'),short:t('sqs_chance')});
    SPACES.push(P(4*s+1,g1));
    SPACES.push({t:'champ',...CH[s],price:CHAMP_PRICE});
    SPACES.push(P(4*s+2,g2));
    SPACES.push({t:'shoot',name:t('sq_shoot'),short:t('sqs_shoot')});
    SPACES.push(P(4*s+3,g2));
    const [gn,gs,gav]=ROSTERS[mode].goalies[s];
    SPACES.push({t:'goalie',name:gn,short:gs,av:gav,price:GOALIE_PRICE});
  }
  PLAYER_IDX=SPACES.map((x,i)=>x.t==='player'?i:-1).filter(i=>i>=0);
  CHAMP_IDX=SPACES.map((x,i)=>x.t==='champ'?i:-1).filter(i=>i>=0);
  GOALIE_IDX=SPACES.map((x,i)=>x.t==='goalie'?i:-1).filter(i=>i>=0);
}
function coord(i){
  if(i<=9) return [10,10-i];
  if(i<=18) return [10-(i-9),1];
  if(i<=27) return [1,1+(i-18)];
  return [1+(i-27),10];
}

  if(shopTab==='titles'){h+=`<p class="howto">${esc(t('titlesIntro'))}</p><div class="prizes">`+TITLES.map(x=>w.titles.includes(x)?row('🏷️',titleName(x),w.title===x?t('wearingNow'):t('ownTitle'),null,w.title===x?`<button class="btn" data-wear="">${esc(t('takeOff'))}</button>`:`<button class="btn primary" data-wear="${esc(x)}">${esc(t('wearIt'))}</button>`,'owned'):row('🏷️',titleName(x),t('unlockTitle'),1,buyBtn('title:'+x,1,t('unlock')))).join('')+'</div>';}
  if(shopTab==='pitch'){h+=`<p class="howto">${esc(t('pitchIntro'))}</p><div class="prizes">`+Object.keys(THEMES).map(k=>{const th=THEMES[k],own=w.themes.includes(k),on=W.theme===k;return own?row(th.em,themeName(k),on?t('pitchOn'):t('ownPitch'),null,on?`<span class="cost">✓ ${esc(t('onBadge'))}</span>`:`<button class="btn primary" data-theme="${k}">${esc(t('useIt'))}</button>`,'owned'):row(th.em,themeName(k),t('unlockPitch'),th.cost,buyBtn('theme:'+k,th.cost,t('unlock')));}).join('')+'</div>';}

function buy(w,what){
  const [kind,val]=what.includes(':')?[what.split(':')[0],what.slice(what.indexOf(':')+1)]:['boost',what];
  let cost=0,done='';
  if(kind==='boost'){const b=BOOSTS.find(x=>x.id===val);cost=b.cost;if(w.trophies<cost)return;w.boosts[val]=(w.boosts[val]||0)+1;done=esc(t('boughtBoost',{item:b.em+' '+boostName(b)}));}
  if(kind==='icon'){cost=1;if(w.trophies<cost||w.icons.includes(val))return;w.icons.push(val);done=esc(t('boughtIcon',{icon:val}));}
  if(kind==='title'){cost=1;if(w.trophies<cost||w.titles.includes(val))return;w.titles.push(val);w.title=val;done=esc(t('boughtTitle',{name:showName(w.name),title:titleName(val)}));}
  if(kind==='theme'){const th=THEMES[val];cost=th.cost;if(w.trophies<cost||w.themes.includes(val))return;w.themes.push(val);W.theme=val;applyTheme();done=esc(t('boughtTheme',{item:th.em+' '+themeName(val)}));}
  // A voucher keeps the prize's saved name and the time (shown as a date in the player's language), never words.
  if(kind==='real'){const p=W.prizes.find(x=>x.id===val);if(!p||w.trophies<p.cost)return;cost=p.cost;const v={id:'v'+(W.nextId++),em:p.em,name:p.name,ts:Date.now(),used:false};w.vouchers.push(v);
    w.trophies-=cost;saveWallet();confetti();renderShop();
    return modal({kicker:t('ticketKicker'),title:t('ticketTitle'),color:'#f59e0b',ink:'#1d1606',html:`<div class="ticket"><div class="te">${p.em}</div><h4>${esc(prizeName(p))}</h4><p>${esc(t('earnedBy',{name:showName(w.name),date:voucherDate(v)}))}</p></div><p>${t('ticketSaved',{tab:'🎟️ '+esc(t('tab_vouchers'))})}</p>`,buttons:[{label:t('yay'),primary:true}],nobot:true});}
  w.trophies-=cost;saveWallet();confetti();renderShop();shopBadge();
  modal({kicker:t('shop'),title:t('bought'),color:'#16a34a',html:`<p class="big">🏆</p><p>${done}</p><p>${t('leftN',{name:esc(showName(w.name)),n:w.trophies})}</p>`,buttons:[{label:t('ok'),primary:true}],nobot:true});
}

    buttons:[{label:t('save'),primary:true,fn:()=>{saveGrown();renderShop();shopBadge();}},{label:t('cancel')}],nobot:true});
  const body=document.getElementById('mBody');
  // A starter prize shown in the player's language keeps its saved English name unless a grown-up changed the words.
  const keepName=(old,typed)=>old&&typed===prizeName(old)?old.name:typed;
  const saveGrown=()=>{W.prizes=[...body.querySelectorAll('[data-pid]')].map(r=>({id:r.dataset.pid,em:r.querySelector('.pem').value.trim()||'🎁',name:keepName(W.prizes.find(x=>x.id===r.dataset.pid),r.querySelector('.pname').value.trim())||'Prize',cost:Math.max(1,Math.min(99,+r.querySelector('.pcost').value||1))}));saveWallet();};
  body.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{saveGrown();W.prizes=W.prizes.filter(p=>p.id!==b.dataset.del);saveWallet();grownUps();}));
  body.querySelector('#addPrize').addEventListener('click',()=>{saveGrown();W.prizes.push({id:'p'+(W.nextId++),em:'🎁',name:'New prize',cost:3});saveWallet();grownUps();});
  body.querySelectorAll('[data-adj]').forEach(b=>b.addEventListener('click',()=>{saveGrown();const [k,d]=b.dataset.adj.split('|');const w=W.players[k];if(w)w.trophies=Math.max(0,w.trophies+(+d));saveWallet();grownUps();}));
  body.querySelector('#addChamp').addEventListener('click',()=>{saveGrown();const n=body.querySelector('#newChamp').value;if(wkey(n)){getWallet(n,true);saveWallet();}grownUps();});

function awardWin(p){if(p.bot)return null;const w=getWallet(p.name,true);   // wallets are keyed by the name as saved (never a translation)
w.trophies+=WIN_TROPHIES;w.wins++;saveWallet();shopBadge();return w;}
function applyBoostsToGame(){
  const lines=[];
  S.players.forEach((p,i)=>{if(p.bot)return;const w=getWallet(p.name,false);if(!w)return;p.title=w.title||null;
    const take=id=>{if((w.boosts[id]||0)>0){w.boosts[id]--;return true;}return false;};
    const pn=pName(p);
    if(take('cash')){p.money+=300;lines.push('💰 '+esc(t('boostCash',{name:pn,m:money(300)})));}
    if(take('pardon')){p.pardon=(p.pardon||0)+1;lines.push('🎫 '+esc(t('boostPardon',{name:pn})));}
    if(take('player')){const free=PLAYER_IDX.filter(x=>S.owner[x]===undefined);if(free.length){const x=free[rnd(free.length)];S.owner[x]=i;lines.push('⚽ '+esc(t('boostPlayer',{name:pn,player:SPACES[x].name})));}}
    if(take('goalie')){const free=GOALIE_IDX.filter(x=>S.owner[x]===undefined);if(free.length){const x=free[rnd(free.length)];S.owner[x]=i;lines.push('🧤 '+esc(t('boostGoalie',{name:pn,player:SPACES[x].short})));}}
    if(take('lucky')){p.lucky=true;lines.push('🍀 '+esc(t('boostLucky',{name:pn})));}
  });
  saveWallet();
  if(lines.length){render();modal({kicker:t('boostsKicker'),title:t('boostsTitle'),color:'#f59e0b',ink:'#1d1606',html:'<p>'+lines.join('</p><p>')+'</p>',buttons:[{label:t('letsGo'),primary:true,fn:()=>{botTick();}}],nobot:true});return true;}
  return false;
}


const savedNames=['','','',''],bots=[false,true,false,false];
const ICONS=['⚽','🦁','🚀','🐉','🦈','👑','🔥','⭐','🐯','🦖','🍕','🏆','🦅','👽','🐼','🤖'];
const icons=['⚽','🤖','🦁','🚀'];
// The English bot names and "Player 1".."Player 4" are what a save holds for an unnamed seat; showName() turns them
// into the player's language (botNames[i], playerN), so a saved game reads right in every language.
const BOT_NAMES=['Kickbot','Goalbot 3000','RoboKeeper','Bot-Ball'];
function showName(n){n=String(n==null?'':n);const b=BOT_NAMES.indexOf(n);if(b>=0)return tl('botNames',b);const m=/^Player ([1-9])$/.exec(n);return m?t('playerN',{n:+m[1]}):n;}
const pName=p=>showName(p&&p.name);
function drawNames(){
  const box=$('names');
  [...box.querySelectorAll('input')].forEach((x,i)=>savedNames[i]=x.value);
  for(let i=1;i<count;i++){if(icons.slice(0,i).includes(icons[i]))icons[i]=ICONS.find(e=>!icons.slice(0,count).includes(e));}
  box.innerHTML='';
  for(let i=0;i<count;i++){
    const block=document.createElement('div');block.className='pblock';
    const row=document.createElement('div');row.className='namerow';
    row.innerHTML=`<span class="dot ic" style="background:${TOKENS[i]};--c:${TOKENS[i]}">${icons[i]}</span><input id="name${i}" maxlength="14" placeholder="${esc(bots[i]?tl('botNames',i):t('playerN',{n:i+1}))}" value="${esc(savedNames[i]||'')}" aria-label="${esc(t('nameFor',{n:i+1}))}"><button class="botbtn" id="bot${i}" aria-pressed="${bots[i]}">🤖 ${esc(t('bot'))}</button>`;
    const ir=document.createElement('div');ir.className='iconrow';ir.setAttribute('role','group');ir.setAttribute('aria-label',t('iconFor',{n:i+1}));
    const wl=(typeof W!=='undefined'&&W)?getWallet(savedNames[i],false):null;const myIcons=ICONS.concat(wl?wl.icons.filter(e=>!ICONS.includes(e)):[]);
    ir.innerHTML=myIcons.map(e=>`<button class="iconpick" style="--c:${TOKENS[i]}${LEGEND_ICONS.includes(e)?';border-color:var(--gold)':''}" aria-pressed="${e===icons[i]}" aria-label="${esc(t('iconLabel',{e})+(LEGEND_ICONS.includes(e)?' '+t('legendary'):''))}">${e}</button>`).join('');
    ir.querySelectorAll('.iconpick').forEach(btn=>btn.addEventListener('click',()=>{icons[i]=btn.textContent;syncIcons();}));
    block.appendChild(row);block.appendChild(ir);box.appendChild(block);
    row.querySelector('input').addEventListener('change',()=>drawNames());
    row.querySelector('.botbtn').addEventListener('click',e=>{bots[i]=!bots[i];e.currentTarget.setAttribute('aria-pressed',bots[i]);row.querySelector('input').placeholder=bots[i]?tl('botNames',i):t('playerN',{n:i+1});});
  }
  syncIcons();
}
function syncIcons(){
  document.querySelectorAll('#names .pblock').forEach((bl,i)=>{
    const taken=icons.slice(0,count).filter((_,j)=>j!==i);
    bl.querySelector('.dot').textContent=icons[i];
    bl.querySelectorAll('.iconpick').forEach(b=>{const e=b.textContent;b.setAttribute('aria-pressed',e===icons[i]);b.disabled=taken.includes(e);b.setAttribute('aria-label',t('iconLabel',{e})+(taken.includes(e)?' '+t('taken'):''));});
  });
}
document.querySelectorAll('.counts .btn').forEach(b=>b.addEventListener('click',()=>{
  count=+b.dataset.n;
  document.querySelectorAll('.counts .btn').forEach(x=>x.setAttribute('aria-pressed',x===b));
  drawNames();
}));
drawNames();

function newGame(){
  const players=[];
  for(let i=0;i<count;i++){
    const v=($('name'+i).value||'').trim();
    players.push({name:v||(bots[i]?BOT_NAMES[i]:'Player '+(i+1)),bot:bots[i],icon:icons[i],color:TOKENS[i],pos:0,money:START_MONEY,checks:0});
  }
  if(players.every(p=>p.bot)) players[0].bot=false;
  S={mode,players,owner:{},injured:{},turn:0,turnCount:0,dice:[1,1],deck:[],msg:M('kickoffMsg',{p:0}),won:false,fresh:true};
  startGame();
}
function startGame(){
  buildSpaces(S.mode);
  $('setup').hidden=true;$('game').hidden=false;
  $('modetag').textContent=S.mode==='legends'?'👑 '+t('legendsMode'):'⭐ '+t('normalMode');

}

/* The pitch message (S.msg) is saved with the game, so it is a message id with its values, never words:
   M('paid', { p: 0, p2: 1, m: 40 }), or a list of them. Values named p/p2 are seats and s/s2 board squares (shown
   by name), f/f2 a square's full name, sl a list of squares, m/m2 dollar amounts. Saves from before the game spoke
   other languages hold plain text, which is shown as it is. */
function M(k,v){return {k,v:v||{}};}
function msgVal(k,x){
  if(/^p\d?$/.test(k))return S&&S.players[x]?pName(S.players[x]):'';
  if(/^s\d?$/.test(k))return SPACES[x]?SPACES[x].short:'';
  if(/^f\d?$/.test(k))return SPACES[x]?SPACES[x].name:'';
  if(k==='sl')return (x||[]).map(i=>SPACES[i]?SPACES[i].short:'').join(', ');
  if(/^m\d?$/.test(k))return money(x);
  return x;
}
function msgText(m){
  if(!m)return '';
  if(typeof m==='string')return m;
  if(Array.isArray(m))return m.map(msgText).join(' ');
  const v={};for(const k in (m.v||{}))v[k]=msgVal(k,m.v[k]);
  return t(m.k,v);
}
function save(){try{if(S&&!S.won)localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}

const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const pips=n=>{let h='';for(let q=0;q<9;q++)h+=`<i class="${PIPS[n].includes(q)?'on':''}"></i>`;return h;};
const PITCH_LINES=`<svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" fill="none" stroke="rgba(255,255,255,.55)" stroke-width=".6">
  <rect x="4" y="4" width="92" height="92"/><line x1="4" y1="50" x2="96" y2="50"/><circle cx="50" cy="50" r="13"/><circle cx="50" cy="50" r=".9" fill="rgba(255,255,255,.7)"/>
  <rect x="28" y="4" width="44" height="14"/><rect x="40" y="4" width="20" height="5"/><rect x="28" y="82" width="44" height="14"/><rect x="40" y="91" width="20" height="5"/></svg>`;
function buildBoard(){
  const b=$('board');b.innerHTML='';
  SPACES.forEach((s,i)=>{
    const [r,c]=coord(i);
    const tile=document.createElement('button');
    tile.className='tile';tile.id='t'+i;tile.style.gridRow=r;tile.style.gridColumn=c;
    if(s.t==='player'){
      tile.style.setProperty('--g',GROUPS[s.g].c);
      tile.innerHTML=`<div class="band"></div><div class="av">${avatar(s.av)}</div><div class="nm">${esc(s.short)}</div>`;
    }else if(s.t==='goalie'){
      tile.classList.add('goalie');
      tile.innerHTML=`<div class="band"></div><span class="glove">🧤</span><div class="av">${avatar(s.av)}</div><div class="nm">${esc(s.short)}</div>`;
    }else if(s.t==='champ'){
      tile.classList.add('special','champ');
      tile.innerHTML=`<div class="ic">${trophy(s.kind)}</div><div class="nm">${esc(s.short.toLocaleUpperCase(LANG))}</div>`;
    }else{
      tile.classList.add('special',s.t);
      if(i%9===0) tile.classList.add('corner');
      tile.innerHTML=`<div class="ic">${s.t==='chance'?'?':s.t==='shoot'?'🥅':s.ic}</div><div class="nm">${esc(s.short.toLocaleUpperCase(LANG))}</div>`;
    }
    tile.addEventListener('click',()=>info(i));
    b.appendChild(tile);
  });
  const p=document.createElement('div');p.className='pitch';
  p.innerHTML=`${PITCH_LINES}<div class="turnpill"><span class="tok" id="ptok"></span><span id="pname"></span></div>
    <div class="minidice"><div class="mdie" id="d1"></div><div class="mdie" id="d2"></div></div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="btnrow"><button class="btn primary" id="roll"></button><button class="btn small" id="trade">🤝 ${esc(t('trade'))}</button></div>`;
  p.dir=DIR;   // the pitch's messages and buttons read in the language's direction; the ring around it stays put
  b.appendChild(p);

/** Make every square's label fit its little square (footballer names included): shrink it (down to about 70%),
    then let a label with a space in it take two lines, shrinking again until it fits. */
function fitTiles(){
  document.querySelectorAll('.tile .nm').forEach(el=>{
    el.style.fontSize='';el.classList.remove('two');
    if(!el.clientWidth)return;
    const base=parseFloat(getComputedStyle(el).fontSize)||8;let size=base;
    const over=()=>el.scrollWidth>el.clientWidth+0.5;
    while(over()&&size>base*0.7){size-=0.25;el.style.fontSize=size+'px';}
    if(!over())return;
    el.classList.add('two');size=base;el.style.fontSize=size+'px';
    const tooTall=()=>el.scrollHeight>size*2.2+3;
    while((over()||tooTall())&&size>4){size-=0.25;el.style.fontSize=size+'px';}
  });
}

/* ---------- dice ---------- */
const FACE_ROT={1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,-180]};
function throwDice(d,done){
  if(reduced()){done();return;}
  const st=$('diceStage');st.hidden=false;st.style.opacity=1;
  const vw=innerWidth,vh=innerHeight,fromLeft=Math.random()<.5?-1:1;
  const anims=[0,1].map(j=>{
    const [fx,fy]=FACE_ROT[d[j]];
    const sx=fx+360*(3+j)*fromLeft,sy=fy-360*(2+j),sz=360*(2-j)*fromLeft;
    const P=[0,.38,.62,.82,1];
    const X=[fromLeft*vw*.75,fromLeft*vw*.3,fromLeft*vw*.1,fromLeft*vw*.025,0];
    const Y=[-vh*(.25+.1*j),vh*.05,-vh*.06,vh*.008,0];
    const tr=P.map((p,q)=>({offset:p,transform:`translate3d(${X[q]}px,${Y[q]}px,0)`}));
    const rot=P.map(p=>({offset:p,transform:`rotateX(${sx+(fx-sx)*p}deg) rotateY(${sy+(fy-sy)*p}deg) rotateZ(${sz-sz*p}deg)`}));
    const opts={duration:1250+j*90,easing:'cubic-bezier(.25,.8,.35,1)',fill:'forwards'};
    $('dw'+(j+1)).animate(tr,opts);
    return $('cube'+(j+1)).animate(rot,opts).finished;
  });
  Promise.all(anims).then(()=>setTimeout(()=>{
    st.style.opacity=0;
    setTimeout(()=>{st.hidden=true;done();},300);
  },550));
}

/* ---------- turn flow ---------- */
function roll(){
  if(animating||S.won||!$('scrim').hidden) return;
  if(S.players[S.turn].inJail) return jailTurn();
  doRoll();
}
function doRoll(){
  animating=true;render();
  const d=[1+rnd(6),1+rnd(6)];
  throwDice(d,()=>{
    S.dice=d;S.msg=M(d[0]===d[1]?'rolledDbl':'rolled',{p:S.turn,n:d[0]+d[1]});
    S.again=d[0]===d[1];
    if(d[0]===d[1]){const back=liftSusp(S.turn);if(back.length)S.msg=[S.msg,M('backFromSusp',{sl:back,n:back.length})];}
    render();
    move(d[0]+d[1],resolve);
  });
}
function move(steps,done){
  animating=true;
  const p=S.players[S.turn],dir=steps>0?1:-1;let left=Math.abs(steps);
  const step=()=>{
    if(left<=0){animating=false;render();done&&done();return;}
    p.pos=(p.pos+dir+N)%N;left--;
    if(dir>0&&p.pos===0){p.money+=PASS_GO;S.msg=M('passedGo',{p:S.turn,m:PASS_GO});}
    render(S.turn);setTimeout(step,180);
  };
  setTimeout(step,100);
}
function moveTo(target,done){let d=(target-S.players[S.turn].pos+N)%N;if(d===0)d=N;move(d,done);}

function resolve(){
  const q=S.turn,p=S.players[q],i=p.pos,s=SPACES[i];
  if(s.t==='player') return landPlayer(i);
  if(s.t==='champ') return landChamp(i);
  if(s.t==='goalie') return landGoalie(i);
  if(s.t==='shoot') return shoot();
  if(s.t==='chance') return chance();
  if(s.t==='var') return varCheck();
  if(s.t==='redcard') return sendToBin();
  if(s.t==='sinbin'){S.msg=M('visitBin',{p:q});return endTurn();}
  if(s.t==='go'){S.msg=M('onGo',{p:q});return endTurn();}
}

function shoot(){
  const q=S.turn;let i=PLAYER_IDX[rnd(PLAYER_IDX.length)];
  if(S.players[q].lucky){const mine=owned(q).filter(x=>S.injured[x]===undefined&&!isSusp(x));if(mine.length){i=mine[rnd(mine.length)];S.players[q].lucky=false;S.msg=M('luckyMsg',{s:i});}}
  const s=SPACES[i],o=S.owner[i],g=GROUPS[s.g];
  let title,html,goal=false;
  if(o===q&&isSusp(i)){
    S.msg=M('suspendedMsg',{s:i});
    return modal({kicker:t('shootsK',{s:s.short}),title:t('suspended'),color:'#e11d48',html:card(i)+`<p class="big">🚫</p><p>${t('suspendedBody',{name:esc(s.name)})}</p><p>${esc(t('suspendedFix',{m:money(SUSP_FEE)}))}</p>`,buttons:[{label:t('ok'),primary:true,fn:endTurn}]});
  }
  if(o===q&&S.injured[i]===undefined){
    const defs=S.players.map((_,j)=>j).filter(j=>j!==q&&!S.players[j].out&&ownedGoalies(j).length);
    if(defs.length) return askBlock(i,q,defs,0);
    return scoreGoal(i,q);
  }
  if(o===q&&S.injured[i]!==undefined){title=t('ouch');html=`<p>${t('injuredBody',{name:esc(s.name)})}</p>`;S.msg=M('injuredMsg',{s:i});}
  else if(o===q){goal=true;S.players[q].checks++;title=t('goal');html=`<p class="big">⚽ ✓</p><p>${t('scoresFor',{name:esc(s.name),p:nm(q),n:S.players[q].checks})}</p>`;S.msg=M('scoredMsg',{s:i,p:q});}
  else if(o!==undefined){title=t('notYours');html=`<p class="big">🧤</p><p>${t('notYoursBody',{name:esc(s.name),o:nm(o)})}</p>`;S.msg=M('notYoursMsg',{s:i});}
  else{title=t('savedT');html=`<p class="big">🧤</p><p>${t('nobodyBody',{name:esc(s.name)})}</p>`;S.msg=M('nobodyMsg',{s:i});}
  if(goal)confetti();
  modal({kicker:t('shootsK',{s:s.short}),title,color:goal?'#16a34a':g.c,ink:goal?'#fff':'#0b0f1c',html:card(i)+html,buttons:[{label:t('ok'),primary:true,fn:endTurn}]});
}

/* Chance deck */
// The card texts are I18N.cards[i], in this same order (the saved deck holds card numbers only).
function chanceCards(){
  const c=(i,m,o)=>Object.assign({t:String(tl('cards',i)||'').replace(/\{m\}/g,()=>money(m))},o);   // {m}: the card's dollar amount
  return [
    c(0,150,{fx:q=>{S.players[q].money+=150;}}),
    c(1,100,{fx:q=>{S.players[q].money+=100;}}),
    c(2,75,{fx:q=>{S.players[q].money+=75;}}),
    c(3,50,{fx:q=>{S.players[q].money+=50;}}),
    c(4,25,{fx:q=>{S.players.forEach((p,j)=>{if(j!==q&&!p.out)give(j,q,25);});}}),
    c(5,50,{fx:q=>{pay(q,50);}}),
    c(6,20,{fx:q=>{pay(q,20);}}),
    c(7,30,{fx:q=>{pay(q,30);}}),
    c(8,40,{fx:q=>{pay(q,40);}}),
    c(9,60,{fx:q=>{give(q,nextIdx(),60);}}),
    c(10,0,{fx:q=>{
      const m=owned(q);if(!m.length)return esc(t('noGive'));
      const i=m[rnd(m.length)];S.owner[i]=nextIdx();delete S.injured[i];return esc(t('nowPlaysFor',{name:SPACES[i].name,p:pName(S.players[nextIdx()])}));}}),
    c(11,0,{fx:q=>{
      const n=nextIdx(),m=owned(n);if(!m.length)return esc(t('noPlayersToGive',{p:pName(S.players[n])}));
      const i=m[rnd(m.length)];S.owner[i]=q;delete S.injured[i];return esc(t('youGot',{name:SPACES[i].name}));}}),
    c(12,0,{then:()=>sendToBin()}),
    c(13,0,{fx:q=>{
      const m=owned(q);if(!m.length)return esc(t('noHurt'));
      const i=m[rnd(m.length)];S.injured[i]=S.turnCount+S.players.length;return esc(t('isInjured',{name:SPACES[i].name}));}}),
    c(14,0,{then:()=>{const p=S.players[S.turn].pos;let x=p;do{x=(x+1)%N;}while(SPACES[x].t!=='shoot');moveTo(x,resolve);}}),
    c(15,0,{then:()=>moveTo(CHAMP_IDX[3],resolve)}),
    c(16,0,{then:()=>move(-3,resolve)}),
    c(17,PASS_GO,{then:()=>moveTo(0,()=>{S.msg=M('ranBack',{p:S.turn});endTurn();})}),
    c(18,0,{then:()=>sendToBin()}),
    c(19,0,{fx:q=>{S.players[q].pardon=(S.players[q].pardon||0)+1;return esc(t('pardonCount',{n:S.players[q].pardon}));}}),
    c(20,0,{then:()=>transfer()})
  ];
}
function chance(){
  if(!S.deck||!S.deck.length){S.deck=chanceCards().map((_,i)=>i).sort(()=>Math.random()-.5);}
  const idx=S.deck.pop(),c=chanceCards()[idx],q=S.turn;
  let extra='';
  if(c.fx){const r=c.fx(q);if(r)extra=`<p><b>${r}</b></p>`;}
  S.msg=M('drewChance',{p:q});
  modal({kicker:t('sq_chance'),title:t('chanceCard'),color:'#f5b700',ink:'#1d1606',html:`<p class="big">?</p><p style="font-size:1.1rem;font-weight:900">${esc(c.t)}</p>${extra}<p>${t('youNowHave',{m:'<bdi>'+money(S.players[q].money)+'</bdi>'})}</p>`,
    buttons:[{label:t('ok'),primary:true,fn:()=>{if(c.then)c.then();else endTurn();}}]});
}

function transfer(){
  const q=S.turn,mine=owned(q).sort((a,b)=>SPACES[a].price-SPACES[b].price),theirs=PLAYER_IDX.filter(i=>S.owner[i]!==undefined&&S.owner[i]!==q).sort((a,b)=>SPACES[b].price-SPACES[a].price);
  const head={kicker:t('transferK'),title:t('swapQ'),color:'#7c5cff'};
  const chipFor=(i,sub)=>({chip:GROUPS[SPACES[i].g].c,html:`<span class="mini">${avatar(SPACES[i].av)}</span><span>${esc(SPACES[i].short)}${sub?`<small>${sub}</small>`:''}</span>`});
  if(!mine.length||!theirs.length){
    S.msg=M('noSwapMsg');
    return modal({...head,html:`<p>${esc(t(!mine.length?'needOne':'nobodyElse'))}</p>`,buttons:[{label:t('ok'),primary:true,fn:endTurn}]});
  }
  modal({...head,html:`<p>${t('step1')}</p>`,buttons:[
    ...mine.map(i=>({...chipFor(i),fn:()=>pickTheirs(i)})),
    {label:t('noSwap'),fn:()=>{S.msg=M('noTransfer');endTurn();}}]});
  function pickTheirs(gi){
    modal({...head,title:t('whoWant'),html:`<p>${t('step2',{name:esc(SPACES[gi].short)})}</p>`,buttons:[
      ...theirs.map(i=>({...chipFor(i,nm(S.owner[i])),fn:()=>{
        const o=S.owner[i];S.owner[i]=q;S.owner[gi]=o;
        S.msg=M('swapped',{p:q,s:gi,s2:i});
        modal({...head,title:t('dealDone'),html:card(i)+`<p>${t('getsLine',{p:nm(q),name:esc(SPACES[i].name)})}<br>${t('getsLine',{p:nm(o),name:esc(SPACES[gi].name)})}</p>`,buttons:[{label:t('ok'),primary:true,fn:endTurn}]});}})),
      {label:t('cancelSwap'),fn:()=>{S.msg=M('noTransfer');endTurn();}}]});
  }
}

function varCheck(){
  const q=S.turn;
  modal({kicker:t('sq_var'),title:t('varChecking'),color:'#2563eb',html:`<p class="big">📺</p><p>${t('varBody')}</p>`,
    buttons:[{label:t('rollVar'),primary:true,fn:()=>{
      const a=1+rnd(6),b=1+rnd(6);
      animating=true;render();
      throwDice([a,b],()=>{
        animating=false;S.dice=[a,b];
        const dice=`<div class="mini-dice" dir="ltr"><div class="mdie">${pips(a)}</div><div class="mdie">${pips(b)}</div></div>`;
        if(a!==b){S.msg=M('playOnMsg');return modal({kicker:t('sq_var'),title:t('noDoubles'),color:'#2563eb',html:dice+`<p>${esc(t('playOnBody'))}</p>`,buttons:[{label:t('ok'),primary:true,fn:endTurn}]});}
        const others=S.players.map((p,j)=>j).filter(j=>j!==q&&!S.players[j].out&&S.players[j].checks>0);
        if(!others.length){S.players[q].money+=50;S.msg=M('varNobodyMsg',{m:50});
          return modal({kicker:t('sq_var'),title:t('doublesT'),color:'#2563eb',html:dice+`<p>${esc(t('varNobodyBody',{m:money(50)}))}</p>`,buttons:[{label:t('ok'),primary:true,fn:endTurn}]});}
        const top=Math.max(...others.map(j=>S.players[j].checks)),v=others.filter(j=>S.players[j].checks===top)[0];
        S.players[v].checks--;S.players[q].checks++;
        S.msg=M('stoleMsg',{p:q,p2:v});
        modal({kicker:t('sq_var'),title:t('overturned'),color:'#2563eb',html:dice+`<p>${esc(t('stoleBody',{p:pName(S.players[q]),v:pName(S.players[v])}))}</p>`,buttons:[{label:t('ok'),primary:true,fn:endTurn}]});
      });
    }}]});
}

function endTurn(){
  const debtor=S.players.findIndex(p=>!p.out&&p.money<0);
  if(debtor>=0) return resolveDebt(debtor,endTurn);
  if(winCheck()) return;
  const cur=S.players[S.turn];
  if(S.again&&!cur.out&&!cur.inJail){
    S.again=false;S.msg=M('rollsAgain',{p:S.turn});
    render();save();return botTick();
  }
  S.again=false;
  nextTurn();
}
function winCheck(){
  let w=S.players.findIndex(p=>!p.out&&p.checks>=WIN);
  const left=alive();
  if(w<0&&left.length===1)w=left[0];
  if(w<0) return false;
  S.won=true;try{localStorage.removeItem(KEY)}catch(e){}
  const wal=awardWin(S.players[w]);
  render();confetti();setTimeout(confetti,700);
  const back=()=>{S=null;$('game').hidden=true;$('setup').hidden=false;$('resume').hidden=true;drawNames();};
  modal({kicker:t('champions'),title:t('winsLeague',{name:pName(S.players[w])}),color:'#16a34a',
    html:`<div class="avbig" style="margin:0 auto;--g:#ffd23f">${trophy('wc')}</div><p style="text-align:center">${esc(S.players[w].checks>=WIN?t('got3',{name:pName(S.players[w]),n:WIN}):t('allBankrupt'))} ${esc(t('whatSeason'))}</p>${wal?`<div class="ticket"><div class="te">🏆🏆🏆🏆🏆</div><h4>${esc(t('plusTro',{tro:t('trophiesN',{n:WIN_TROPHIES})}))}</h4><p>${esc(t('nowHas',{name:showName(wal.name),n:wal.trophies}))}</p></div>`:''}`,
    buttons:wal?[{label:'🏆 '+t('shop'),primary:true,fn:()=>{S=null;$('resume').hidden=true;openShop(wal.name);}},{label:t('playAgain'),fn:back},{label:t('lookBoard')}]:[{label:t('playAgain'),primary:true,fn:back},{label:t('lookBoard')}],nobot:true});
  return true;
}
function nextTurn(){
  S.turnCount++;
  Object.keys(S.injured).forEach(i=>{if(S.turnCount>=S.injured[i])delete S.injured[i];});
  S.turn=nextIdx();
  const p=S.players[S.turn];
  if(p.inJail) S.msg=M('inBinMsg',{p:S.turn});
  render();save();
  const sus=owned(S.turn).filter(isSusp);
  if(sus.length) return suspOffer(sus);
  botTick();
}

/* ---------- suspensions ---------- */
const SUSP_FEE=150;
function liftSusp(q){const back=owned(q).filter(isSusp);back.forEach(i=>delete S.susp[i]);return back;}   // the squares that are back
function suspOffer(sus){
  const q=S.turn,p=S.players[q],i=sus[0],s=SPACES[i];
  modal({kicker:t('clubNews',{name:pName(p)}),title:t('isSuspended',{name:s.short})+' 🚫',color:'#e11d48',html:card(i)+`<p>${esc(t('cantScoreSusp',{name:s.name}))}</p><p>${t('payToBring',{m:money(SUSP_FEE)})}</p><p>${t('youHave',{m:money(p.money)})}</p>`,
    buttons:[{label:t('payM',{m:money(SUSP_FEE)}),primary:true,bot:p.money>=SUSP_FEE+250,disabled:p.money<SUSP_FEE,fn:()=>{pay(q,SUSP_FEE);delete S.susp[i];S.msg=M('paidBack',{p:q,m:SUSP_FEE,s:i});render();save();
        const more=owned(q).filter(isSusp);if(more.length)return suspOffer(more);botTick();}},
      {label:t('rollDoubles'),bot:!(p.money>=SUSP_FEE+250),fn:()=>{S.msg=M('rollToBring',{p:q,s:i});render();botTick();}}]});
}

/* ---------- debt: sell to the bank or auction ---------- */
const assetsOf=q=>[...owned(q),...ownedChamps(q),...ownedGoalies(q)];
const sellPrice=i=>Math.floor(SPACES[i].price/2);
function assetChip(i,sub){const s=SPACES[i],c=s.t==='champ'?'#c9b6ff':s.t==='goalie'?'#22d3ee':GROUPS[s.g].c,art=s.t==='champ'?trophy(s.kind):avatar(s.av);
  return {chip:c,html:`<span class="mini">${art}</span><span>${esc(s.short)}<small>${sub}</small></span>`};}
function resolveDebt(q,then){
  const p=S.players[q];
  if(p.money>=0) return then();
  const assets=assetsOf(q).sort((a,b)=>SPACES[a].price-SPACES[b].price);
  if(!assets.length) return bankrupt(q,then);
  modal({actor:q,kicker:'💸 '+t('outOfMoney'),title:t('owes',{name:pName(p),m:money(-p.money)}),color:'#e11d48',
    html:`<p>${esc(t('debtBody',{name:pName(p)}))}</p><p>${esc(t('debtPick'))}</p>`,
    buttons:assets.map(i=>({...assetChip(i,esc(t('bankPays',{m:money(sellPrice(i))}))),fn:()=>sellMenu(q,i,then)}))});
}
function sellMenu(q,i,then){
  const s=SPACES[i],bidders=alive().filter(j=>j!==q);
  modal({actor:q,kicker:t('sellK',{name:s.short}),title:t('bankOrAuction'),color:'#e11d48',html:card(i)+`<p>${t('bankBody',{m:money(sellPrice(i))})}</p>`,
    buttons:[{label:t('sellBank',{m:money(sellPrice(i))}),primary:true,bot:true,fn:()=>{sellTo(q,i,null,sellPrice(i));resolveDebt(q,then);}},
      {label:'🔨 '+t('auction'),disabled:!bidders.length,fn:()=>auction(q,i,then)},
      {label:t('pickElse'),fn:()=>resolveDebt(q,then)}]});
}
function sellTo(q,i,buyer,price){
  const s=SPACES[i];
  if(buyer==null){delete S.owner[i];S.players[q].money+=price;S.msg=M('soldBank',{p:q,s:i,m:price});}
  else{S.owner[i]=buyer;S.players[buyer].money-=price;S.players[q].money+=price;S.msg=M('boughtAuction',{p:buyer,s:i,m:price});}
  if(S.susp)delete S.susp[i];delete S.injured[i];
  render();save();
}
function auction(q,i,then){
  const s=SPACES[i],bidders=alive().filter(j=>j!==q);
  let high=null,price=Math.max(10,Math.floor(sellPrice(i)*.6/10)*10),passed=new Set(),turn=0;
  const step=()=>{
    const active=bidders.filter(j=>!passed.has(j)&&j!==high);
    if(!active.length||(high!=null&&bidders.filter(j=>!passed.has(j)).length<=1)){
      if(high==null){
        return modal({actor:q,kicker:t('auction'),title:t('noBids'),color:'#e11d48',html:`<p>${esc(t('noBidsBody',{name:s.short,m:money(sellPrice(i))}))}</p>`,buttons:[{label:t('ok'),primary:true,fn:()=>{sellTo(q,i,null,sellPrice(i));resolveDebt(q,then);}}]});
      }
      sellTo(q,i,high,price);confetti();
      return modal({actor:q,kicker:t('auction'),title:t('sold')+' 🔨',color:'#16a34a',html:card(i)+`<p>${t('soldBody',{buyer:nm(high),name:esc(s.name),m:money(price),seller:nm(q)})}</p>`,buttons:[{label:t('ok'),primary:true,fn:()=>resolveDebt(q,then)}]});
    }
    const b=active[turn++%active.length],bp=S.players[b],next=high==null?price:price+20;
    const botWants=bp.money-next>=150&&next<=s.price*1.1;
    modal({actor:b,kicker:'🔨 '+t('auction')+' · '+(bp.bot?'🤖 '+t('thinkingK',{name:pName(bp)}):'📱 '+t('passPhone',{name:pName(bp)})),title:t('forSaleT',{name:s.short}),color:'#f59e0b',ink:'#1d1606',
      html:card(i)+`<div class="stat"><span>${esc(t('topBid'))}</span><span>${high==null?esc(t('noneYet')):esc(t('bidBy',{m:money(price),name:pName(S.players[high])}))}</span></div><p>${t('youHaveName',{name:esc(pName(bp)),m:money(bp.money)})}</p>`,
      buttons:[{label:t('bid',{m:money(next)}),primary:true,bot:botWants,disabled:bp.money<next,fn:()=>{high=b;price=next;passed.delete(b);step();}},
        {label:t('pass'),bot:!botWants,fn:()=>{passed.add(b);step();}}]});
  };
  step();
}
function bankrupt(q,then){
  const p=S.players[q];p.out=true;p.money=0;p.inJail=false;
  assetsOf(q).forEach(i=>{delete S.owner[i];if(S.susp)delete S.susp[i];});
  S.msg=M('wentBankrupt',{p:q});render();save();
  modal({actor:-1,kicker:'💸 '+t('bankruptK'),title:t('isOut',{name:pName(p)}),color:'#e11d48',html:`<p class="big">💸</p><p>${esc(t('outBody',{name:pName(p)}))}</p>`,
    buttons:[{label:t('ok'),primary:true,fn:()=>{
      if(S.turn===q){if(winCheck())return;return nextTurn();}
      then();}}]});
}

/* ---------- Sin Bin (jail) ---------- */
function sendToBin(){
  const q=S.turn,p=S.players[q];
  p.pos=SINBIN;p.inJail=true;p.jailTries=0;S.again=false;S.msg=M('sentBin',{p:q});render(q);
  modal({kicker:t('redCardK'),title:t('offToBin'),color:'#e11d48',html:`<p class="big">🟥</p><p>${esc(t('binBody1',{name:pName(p),m:money(PASS_GO)}))}</p><p>${esc(t('binBody2',{fine:money(50)}))}</p>`,
    buttons:[{label:t('ok'),primary:true,fn:endTurn}]});
}
function jailTurn(){
  const q=S.turn,p=S.players[q];
  const release=()=>{p.inJail=false;p.jailTries=0;};
  const btns=[];
  const botPay=!(p.pardon>0)&&p.money>=250;
  if(p.pardon>0) btns.push({label:t('usePardon')+' 🎫',primary:true,bot:true,fn:()=>{p.pardon--;release();S.msg=M('usedPardon',{p:q});doRoll();}});
  btns.push({label:t('payRoll',{m:money(50)}),primary:!(p.pardon>0),bot:botPay,disabled:p.money<50,fn:()=>{pay(q,50);release();S.msg=M('paidLeave',{p:q,m:50});doRoll();}});
  btns.push({label:t('rollTry',{n:p.jailTries+1}),bot:!(p.pardon>0)&&!botPay,fn:()=>{
    animating=true;render();
    const d=[1+rnd(6),1+rnd(6)];
    throwDice(d,()=>{
      S.dice=d;animating=false;S.again=false;
      if(d[0]===d[1]){release();S.msg=M('outBin',{p:q});render();move(d[0]+d[1],resolve);}
      else if(p.jailTries>=2){pay(q,50);release();S.msg=M('thirdMiss',{p:q,m:50});render();move(d[0]+d[1],resolve);}
      else{p.jailTries++;S.msg=M('staysMsg',{p:q});render();
        modal({kicker:t('sq_sinbin'),title:t('noDoublesT'),color:'#e11d48',html:`<div class="mini-dice" dir="ltr"><div class="mdie">${pips(d[0])}</div><div class="mdie">${pips(d[1])}</div></div><p>${esc(t('staysBody',{name:pName(p),n:3-p.jailTries}))}</p>`,buttons:[{label:t('ok'),primary:true,fn:endTurn}]});}
    });
  }});
  modal({kicker:t('sq_sinbin'),title:t('inBinT',{name:pName(p)}),color:'#e11d48',html:`<p class="big">🔒</p><p>${esc(t('binHow',{m:money(50)}))}</p>`,buttons:btns});
}

/* ---------- trading ---------- */
function itemRow(i,side){
  const s=SPACES[i],art=s.t==='champ'?trophy(s.kind):avatar(s.av),c=s.t==='champ'?'#c9b6ff':s.t==='goalie'?'#22d3ee':GROUPS[s.g].c;
  return `<label class="titem" style="--g:${c}"><input type="checkbox" data-side="${side}" value="${i}"><span class="mini">${art}</span>${esc(s.short)}</label>`;
}
function startTrade(){
  if(animating||S.won||!$('scrim').hidden) return;

  modal({kicker:t('trade'),title:t('tradeWho'),color:'#0ea5e9',buttons:[...others.map(j=>({label:pName(S.players[j]),fn:()=>buildTrade(j)})),{label:t('cancel')}]});
}
function buildTrade(o){
  const q=S.turn,me=S.players[q],them=S.players[o];
  const mine=[...owned(q),...ownedChamps(q),...ownedGoalies(q)],theirs=[...owned(o),...ownedChamps(o),...ownedGoalies(o)];
  modal({kicker:t('makeTrade'),title:pName(me)+' ⇄ '+pName(them),color:'#0ea5e9',html:`
    <div class="tside"><h4>${t('gives',{name:nm(q)})}</h4>
      <label class="cash">💰 ${esc(t('cashLabel'))}<input type="number" id="tGive" min="0" max="${me.money}" step="10" value="0" inputmode="numeric" dir="ltr"><small>${esc(t('youHaveSmall',{m:money(me.money)}))}</small></label>
      <div class="titems">${mine.length?mine.map(i=>itemRow(i,'give')).join(''):`<span class="none">${esc(t('noItems'))}</span>`}</div></div>
    <div class="tside"><h4>${t('gives',{name:nm(o)})}</h4>
      <label class="cash">💰 ${esc(t('cashLabel'))}<input type="number" id="tGet" min="0" max="${them.money}" step="10" value="0" inputmode="numeric" dir="ltr"><small>${esc(t('theyHave',{m:money(them.money)}))}</small></label>
      <div class="titems">${theirs.length?theirs.map(i=>itemRow(i,'get')).join(''):`<span class="none">${esc(t('noItems'))}</span>`}</div></div>`,
    buttons:[{label:t('sendOffer'),primary:true,fn:()=>{
      const gv=[...document.querySelectorAll('#mBody input[data-side=give]:checked')].map(x=>+x.value);
      const gt=[...document.querySelectorAll('#mBody input[data-side=get]:checked')].map(x=>+x.value);
      const gc=Math.max(0,Math.min(me.money,Math.floor(+$('tGive').value||0)));
      const tc=Math.max(0,Math.min(them.money,Math.floor(+$('tGet').value||0)));
      if(!gv.length&&!gt.length&&!gc&&!tc) return modal({kicker:t('trade'),title:t('emptyTrade'),color:'#0ea5e9',html:`<p>${esc(t('pickOne'))}</p>`,buttons:[{label:t('back'),primary:true,fn:()=>buildTrade(o)}]});
      offer(o,{gv,gt,gc,tc});
    }},{label:t('cancel')}]});
}
function tradeList(items,cash){const parts=items.map(i=>esc(SPACES[i].short));if(cash)parts.unshift('<bdi>'+money(cash)+'</bdi>');return parts.length?parts.join(t('listSep')):esc(t('nothing'));}
function offer(o,deal){
  const q=S.turn,ob=S.players[o].bot;
  const val=(items,cash)=>items.reduce((a,i)=>a+SPACES[i].price*(SPACES[i].t==='player'&&hasSet(S.owner[i],SPACES[i].g)?1.6:1),0)+cash;
  const yes=val(deal.gv,deal.gc)>=val(deal.gt,deal.tc)*1.25&&(deal.gv.length+deal.gc>0);
  modal({actor:o,kicker:ob?'🤖 '+t('thinkingAbout',{name:pName(S.players[o])}):'📱 '+t('passPhone',{name:pName(S.players[o])}),title:t('wantsTrade',{name:pName(S.players[q])}),color:'#0ea5e9',html:`
    <div class="stat"><span>${esc(t('youGet'))}</span><span>${tradeList(deal.gv,deal.gc)}</span></div>
    <div class="stat"><span>${esc(t('youGive'))}</span><span>${tradeList(deal.gt,deal.tc)}</span></div>
    <p>${t('acceptQ',{name:nm(o)})}</p>`,
    buttons:[{label:t('accept')+' ✓',primary:true,bot:yes,fn:()=>{
      deal.gv.forEach(i=>{if(S.owner[i]===q)S.owner[i]=o;});
      deal.gt.forEach(i=>{if(S.owner[i]===o)S.owner[i]=q;});
      give(q,o,deal.gc);give(o,q,deal.tc);
      S.msg=M('acceptedMsg',{p:o});save();
      modal({kicker:t('trade'),title:t('dealDone')+' 🤝',color:'#16a34a',html:`<p>${t('gotLine',{name:nm(q),items:tradeList(deal.gt,deal.tc)})}<br>${t('gotLine',{name:nm(o),items:tradeList(deal.gv,deal.gc)})}</p>${ob?'':`<p>📱 ${esc(t('passBack',{name:pName(S.players[q])}))}</p>`}`});
    }},{label:t('decline')+' ✗',bot:!yes,fn:()=>{
      S.msg=M('saidNo',{p:o});
      modal({kicker:t('trade'),title:t('declinedT'),color:'#e11d48',html:ob?`<p>🤖 ${esc(t('noDeal',{name:pName(S.players[o])}))}</p>`:`<p>📱 ${esc(t('passBack',{name:pName(S.players[q])}))}</p>`});
    }}]});
}
})();
</script>
