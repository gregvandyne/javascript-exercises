<title>Keep Builder</title>
<!-- Keep Builder: Number Quest Pro Unit 6, The Drafting Keep (grades 6-8, ages 11-14). A castle courtyard at sunset
     where a keep is being built, on Oomba3D 1.2.0 in the Castle Quest theme 1.2.0: the architect's plan on a board
     shows boxes, nets, banners, beams, a plan grid, ladders and squares, a builder stands by it, and a stone block is
     set on the keep for each finished round. Three chapters of six rounds:
       build (6.1) crates of half a meter in a store room, a tower block's net and the stone that covers it, a
                   trapezoid banner cut into a rectangle and two triangles, an earth ramp (a prism with a right
                   triangle end), the height of a cistern that must hold a set volume, and a roof's net;
       move  (6.2) the angle next to a known one where two beams cross, the equation for a brace in a square corner,
                   and the gate stone moved into a gap on the plan grid: a slide, a flip and a turn by their rules in
                   coordinates, and a window copied bigger or smaller from the origin (a scale factor);
       span  (6.3) the Pythagorean theorem: a ladder, a plank ramp, a rope between two towers on the grid, squares on
                   the three sides, the longest pole in a room, and which three beams make a square corner.
     Made for ages 11 to 14: plan first, then run. The player sets a stepper or picks one of three tiles and runs
     the plan; a wrong plan is run too and shown as it really turns out (the stone runs out before the net is
     covered, the beam bends, the stone misses the gap, the ladder reaches somewhere else) with a spoken hint, and the
     round stays open. Nothing is priced, bought or sold. No timer, no lives, no fail state, nothing typed.
     Read-aloud is on by default (BRB.speak, the shared path; the speaker button says a line again): lines are
     written the way they are said. Keys: arrows or + and - move the stepper, Enter runs, 1 to 3 pick a tile. Lesson
     mode: BRB.params { chapter: build | move | span, lock: 1 } opens that chapter only; finishing its six rounds
     reports game over, won, once (the course step's completion signal). With no parameters the game offers the
     three chapters from a menu. Saves only which chapters are finished (BRB.storage 'keep-builder-v1'). The import
     map below is exactly kit2ImportMap() (server/services/vendor.js); tests/unit/keep-builder.test.js fails if a
     library bump leaves it behind. English only, like Number Quest's other lesson games. Test handle: window.__kb
     (also window.__brbTest, the name the picture scripts wait for). -->

  const buttons = [{ id: 'again', icon: '🔁', label: fmt('btn.again'), cls: 'go', go: () => { S.lap++; startChapter(S.chapter); } }];
  if (!S.lock) buttons.push({ id: 'menu', icon: '🏰', label: fmt('btn.menu'), go: showMenu });
  card('end', { title: fmt('win'), sub: fmt('ch.' + S.chapter), line: 'win.card', buttons });
  frame();
}

/** What the stepper shows for the plan: the number and its unit. */
function valueText(Rd, v) { return Rd.unit === '×' ? '× ' + KB.nt(v) : Rd.unit === '°' ? KB.nt(v) + '°' : KB.nt(v) + ' ' + Rd.unit; }
/** The controls of a round: three tiles, or a stepper and a run button. */
function controls(Rd, found) {
  if (Rd.input === 'tiles') return Rd.opts.map((o, i) => button({ id: 'kb-n' + i, big: o.t, aria: o.t, cls: (o.t.length > 12 ? 'longer' : o.t.length > 5 ? 'long' : '') + (found && i === Rd.answer ? ' right' : ''), go: b => answer(i, b) }));
  const go = button({ id: 'kb-go', icon: '▶', label: fmt('btn.run'), cls: 'go', go: b => run(b) });
  const stepBtn = (id, sign, key, dir) => {
    const b = button({ id, big: sign, aria: fmt(key), cls: 'step', go: () => { if (held) { held = false; return; } bump(dir); } });
    b.addEventListener('pointerdown', () => { held = false; hold = { dir, t: 0.5 }; });
    for (const name of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(name, () => { hold = null; });
    return b;
  };
  const val = document.createElement('output'); val.id = 'kb-val'; val.className = 'kb-val'; val.setAttribute('aria-live', 'polite'); val.textContent = valueText(Rd, S.value);
  return [stepBtn('kb-dn', '−', 'btn.down', -1), val, stepBtn('kb-up', '+', 'btn.up', 1), go];
}
/** Draw the round from its state (also after the screen turns): the board, the builder, the keep, the controls. */
function redraw() {
  if (S.screen === 'start' || S.screen === 'menu' || S.screen === 'end') { solo(S.screen === 'end' ? KB.ROUNDS : 0); return void frame(); }
  if (S.screen !== 'play' || !S.R) return void frame();
  const focus = el.bar.contains(document.activeElement) ? document.activeElement.id : '';
  const Rd = S.R, found = S.phase === 'right', first = !S.shown && !found;
  clearStage(); S.tick++; hold = null;
  el.card.hidden = true;
  putBoard(Rd, found ? 'found' : S.mode, first); setStones(S.round - 1 + (found ? 1 : 0));
  placeHero(); view.pts = stagePts();
  el.bar.hidden = false; el.bar.className = 'kb-bar ' + Rd.input;
  el.bar.replaceChildren(...controls(Rd, found));
  if (focus) { const b = document.getElementById(focus) || el.bar.querySelector('button'); if (b) b.focus(); }   // a keyboard player stays on the controls
  S.shown = true;
  if (found) pause(1.6, guard(nextRound));   // the screen turned while the answer was showing: the round ends here
}
/** A step that only runs if the round it belongs to is still the one on screen. */
const guard = fn => { const tick = S.tick; return (...a) => { if (tick === S.tick) fn(...a); }; };
const still = () => { drop(board); board.position.copy(BOARD); board.scale.set(BW, BH, 1); board.visible = true; };

/** A new plan (a number on the stepper): the board goes back to the question, and the number stays on the stepper,
 *  so the board never shows a result the plan has not earned. */
function setPlan(v) {
  const Rd = S.R; if (!Rd || S.screen !== 'play' || S.phase !== 'play' || Rd.input !== 'step' || typeof v !== 'number') return;
  v = Math.max(Rd.step.min, Math.min(Rd.step.max, Math.round((v - Rd.step.min) / Rd.step.by) * Rd.step.by + Rd.step.min));
  v = Math.round(v * 1000) / 1000;
  S.value = v; S.draw = null; hint();
  const out = document.getElementById('kb-val'); if (out) out.textContent = valueText(Rd, v);
  still(); paint(Rd, 'ask');
}
function bump(dir) { const Rd = S.R; if (Rd && Rd.input === 'step' && S.phase === 'play') setPlan(S.value + dir * Rd.step.by); }
/** Run the plan. */
function run(b) { const Rd = S.R; if (Rd && Rd.input === 'step') settle(KB.judge(Rd, S.value), b || document.getElementById('kb-go')); }
/** Pick a tile. */
function answer(i, b) { const Rd = S.R; if (Rd && Rd.input === 'tiles') settle(KB.judge(Rd, i), b || document.getElementById('kb-n' + i)); }
function settle(res, b) {
  if (S.phase !== 'play' || !S.R || S.screen !== 'play' || !res) return;
  const Rd = S.R; hold = null;
  if (!res.ok) {
    // a wrong plan: the board shows what it really gives, the hint says why, and the round stays open
    wobble(b); S.draw = res.draw || null; hint(res.lines);
    paint(Rd, 'hint'); still(); shake(board);
    return;
  }
  S.phase = 'right'; S.tick++; S.draw = null; hint(); sfx('coin');
  if (b) b.classList.add('right');
  chip(Rd.chipDone, 'ok');
  say(Rd.said, { queue: true });
  paint(Rd, 'found'); still(); pop(board, { from: 0.9 });
  // the round's stone is set on the keep, the builder cheers, and only then the next round
  setStone(guard(() => { heroMove('cheer', 1700); pause(reduced ? 3.6 : 2.4, guard(nextRound)); }));
}
// Keys: the arrows (or + and −) move the stepper and Enter runs the plan; 1 to 3 pick a tile. Every control is also a
// button, so Tab, Enter and Space work too.
addEventListener('keydown', ev => {
  const Rd = S.R; if (!Rd || S.screen !== 'play' || S.phase !== 'play' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key, onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
  if (Rd.input === 'tiles') { if (/^[1-3]$/.test(k) && +k <= Rd.opts.length) { answer(+k - 1); ev.preventDefault(); } return; }
  if (k === 'Enter' && !onButton) { run(); ev.preventDefault(); }
  else if (k === 'ArrowUp' || k === 'ArrowRight' || k === '+' || k === '=') { bump(1); ev.preventDefault(); }
  else if (k === 'ArrowDown' || k === 'ArrowLeft' || k === '-' || k === '_') { bump(-1); ev.preventDefault(); }
});

/* ---------- the test handle: what the round asks and what is on screen (tests, covers, slide pictures) ---------- */
const shownIn = o => { for (let q = o; q; q = q.parent) if (!q.visible) return false; return true; };
const caster = new THREE.Raycaster();
/** Whether nothing of the courtyard stands between the camera and a point (the scenery never hides the board). */
function clearTo(p) {
  const from = g.camera.position, dir = p.clone().sub(from), dist = dir.length();
  caster.set(from, dir.normalize()); caster.near = 0.1; caster.far = dist - 0.12;
  return !caster.intersectObjects([room, props, posts], true).some(hit => shownIn(hit.object));
}
const boxPts = pts => { const p = pts.map(scr); return [Math.min(...p.map(q => q[0])), Math.min(...p.map(q => q[1])), Math.max(...p.map(q => q[0])), Math.max(...p.map(q => q[1]))].map(n => Math.round(n)); };
window.__kb = window.__brbTest = {
  state: () => ({ game: 'keep-builder', screen: S.screen, chapter: S.chapter, lock: S.lock, round: S.round, rounds: KB.ROUNDS, phase: S.phase, hero: S.hero ? S.hero.id : null, reported: S.reported, tall,
    ...(S.R && S.screen === 'play' ? { ...S.R, mode: S.mode, value: S.value, tried: S.draw, moving: tweens.length, onStage: { board: stage.children.includes(board) && board.visible, stones: rack.children.length } } : {}) }),
  /** Fast: nothing waits and nothing moves. Turning it on also finishes whatever is moving now. */
  fast: on => { S.fast = on !== false; for (let n = 0; S.fast && tweens.length && n < 50; n++) { const w = tweens.shift(); w.o.visible = true; w.step(1); if (w.then) w.then(); } },
  /** 'set' a plan, 'run' it, 'answer' a tile, or 'solve' the round the right way. */
  act: (name, arg) => {
    const Rd = S.R; if (!Rd) return;
    if (name === 'set') setPlan(arg); else if (name === 'run') run(); else if (name === 'answer') answer(arg);
    else if (name === 'solve') { if (Rd.input === 'tiles') answer(Rd.answer); else { setPlan(Rd.answer); run(); } }
  },
  /** Where things are on the screen (CSS pixels): the builder, the board (its box, whether the courtyard leaves it in
   *  full view, and the smallest words on it in screen pixels) and the keep. */
  spot: () => {
    const bx = boxOf(board), k = 0.46;
    return {
      hero: S.hero ? boxPts(heroBox(S.hero.position, S.hero.object.scale.x)) : null,
      board: { box: bx, small: Math.round(S.small * (bx[2] - bx[0]) / CW * 10) / 10,
        clear: [[0, 0], [-k, -k], [k, -k], [k, k], [-k, k], [0, -k], [0, k]].every(([dx, dy]) => clearTo(V3(BOARD.x + dx * BW, BOARD.y + dy * BH, BOARD.z))) },
      chest: boxPts(chestBox()),
    };
  },
};

S.hero = await g.hero('barbarian', { x: 0, y: 0, z: 0, outfit: '#3E6FA8' });
el.load.hidden = true; el.load.remove(); el.kb.hidden = false;
if (P.chapter) showStart(); else showMenu();
window.__ready = true;
</script>
