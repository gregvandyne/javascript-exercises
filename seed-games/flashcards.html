<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
  /* Flashcards: a plain page in Crossword's look (docs/decisions.md "Flashcards"): the classroom dashboard's widgets
     (cream cards with a group color on the top edge and the icon chip), the dark Now bar, a dotted mint board, pill
     buttons, Bricolage Grotesque, light and dark from BRB.theme. No game engine: every screen is this page's own DOM. */
  :root {
    --paper: #E1F1E1; --dots: #66C792; --card: #FFFDF2; --card2: #F9F6EB; --hover: #EFEBDC; --ink: #141414; --line: #E2DDCB; --muted: #5B584F;
    --green: #1F9D63; --accent: #66C792; --mint-t: #E1F1E1; --accent-ink: #0F5A37; --current: #141414; --on-current: #FFFDF2;
    --sky: #5AA9D6; --sky-t: #DCEDF7; --sky-s: #A8D2EC; --coral: #C8432F; --coral-t: #FBE0DA; --grape: #6E56C9; --grape-t: #ECE7FA; --grape-l: #C9BDF0; --spark: #FFD23F; --spark-t: #FFF3C4; --focus: #2563EB;
    --g-time: #5AA9D6; --g-class: #66C792; --g-tools: #FFD23F; --g-show: #F28C6B; --g-check: #9B8CE0; --g-join: #4FB6A8;
    --shadow: 0 1px 0 rgba(20,20,20,.04), 0 4px 16px rgba(20,20,20,.06); --r: 20px; --r-sm: 12px;
    --font: 'Bricolage Grotesque', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --paper: #141414; --dots: #2E5A41; --card: #1E1E1B; --card2: #262622; --hover: #2C2C27; --ink: #FFFDF2; --line: #36352F; --muted: #B8B3A1;
    --green: #66C792; --accent: #66C792; --mint-t: #1F3A2B; --accent-ink: #8FDDB0; --current: #66C792; --on-current: #141414;
    --sky-t: #1B3342; --sky-s: #2C5A75; --coral: #FF8A7D; --coral-t: #4A2420; --grape: #B9A2FF; --grape-t: #342A52; --grape-l: #5B4A8F; --spark-t: #4A3F14; --focus: #8AB4FF;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.32);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background-color: var(--paper); background-image: radial-gradient(var(--dots) 1.5px, transparent 1.6px); background-size: 22px 22px; color: var(--ink); font-family: var(--font); line-height: 1.3; -webkit-text-size-adjust: 100%; }
  body { padding: 0 12px calc(16px + env(safe-area-inset-bottom)); }
  :where(button, input, textarea, select) { font: inherit; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  button { touch-action: manipulation; cursor: pointer; }
  :where(button, input, textarea, select, a):focus-visible, .fc-file:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
  [tabindex="-1"]:focus { outline: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .fc-head { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 0; }
  .fc-logo { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; font-weight: 800; font-size: 1.25em; letter-spacing: -.01em; }
  .fc-logo svg { width: 36px; height: 36px; flex: none; }
  .fc-icon { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 1.15em; }
  .fc { max-width: 1100px; margin: 0 auto; }
  .fc-widget { --g: var(--g-class); background: var(--card); color: var(--ink); border-radius: var(--r); padding: 16px;
    box-shadow: inset 0 4px 0 color-mix(in srgb, var(--g) 75%, var(--card)), 0 0 0 1px color-mix(in srgb, var(--line) 70%, transparent), var(--shadow); }
  .fc-wh { display: flex; align-items: center; gap: 10px; min-height: 40px; flex-wrap: wrap; }
  .fc-wicon { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: color-mix(in srgb, var(--g) 26%, var(--card)); font-size: 1.3rem; line-height: 1; }
  .fc .fc-wt { flex: 1 1 8em; min-width: 0; margin: 0; font-size: 1.2rem; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
  .fc-card { width: min(100%, 620px); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .fc-card.fc-wide { width: min(100%, 920px); }
  .fc h3 { margin: 0; font-size: 1.08em; font-weight: 800; }
  .fc-sub { margin: -6px 0 0; color: var(--muted); font-weight: 600; }
  .fc-lead { margin: 0; text-align: center; font-weight: 700; font-size: 1.1em; }
  .fc-note { margin: 0; font-weight: 600; font-size: .92em; color: var(--muted); }
  .fc-msg { margin: 0; font-weight: 700; }
  .fc-msg:empty { display: none; }
  .fc-err { color: var(--coral); }
  .fc-ok { color: var(--green); }
  .fc-row { display: flex; gap: 8px; align-items: center; }
  .fc-wrap { flex-wrap: wrap; }
  .fc-center { justify-content: center; }
  .fc-big { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 72px; padding: 12px 16px; border-radius: 18px; border: 0; background: var(--card2); text-align: start; }
  .fc-big:hover { background: var(--hover); }
  .fc-big .fc-emo { font-size: 1.8em; flex: none; }
  .fc-big span:last-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .fc-big b { font-size: 1.12em; font-weight: 800; }
  .fc-big small { font-weight: 600; color: var(--muted); }
  .fc-big.fc-go { background: var(--current); color: var(--on-current); }
  .fc-big.fc-go small { color: inherit; opacity: .85; }
  .fc-btn { min-height: 46px; padding: 6px 18px; border-radius: 999px; border: 2px solid var(--ink); background: var(--card); font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; overflow-wrap: anywhere; }
  .fc-btn:hover { background: var(--card2); }
  .fc-btn.fc-go { background: var(--green); border-color: var(--green); color: #fff; }
  :root[data-theme="dark"] .fc-btn.fc-go { color: #10261A; }
  .fc-btn.fc-quiet { border-color: var(--line); }
  .fc-btn.fc-sm { min-height: 44px; padding: 4px 14px; font-size: .95em; }
  .fc-btn.fc-danger { background: var(--coral-t); border-color: var(--coral); color: var(--coral); }
  .fc-btn.fc-ai { background: var(--ink); border-color: var(--ink); color: var(--card); }
  .fc-btn[aria-pressed="true"] { background: var(--current); border-color: var(--current); color: var(--on-current); }
  .fc-btn:active, .fc-big:active { transform: translateY(1px); }
  .fc-btn:disabled { opacity: .55; cursor: default; }
  .fc-main { width: 100%; min-height: 56px; font-size: 1.1em; }
  .fc-in { min-height: 46px; padding: 8px 12px; border-radius: var(--r-sm); border: 2px solid var(--line); background: var(--card); min-width: 0; }
  .fc-in:focus { border-color: var(--ink); }
  .fc-in[aria-invalid="true"] { border-color: var(--coral); }
  .fc-code { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: var(--r-sm); background: var(--card2); }
  .fc-code label { font-weight: 800; font-size: 1.12em; }
  .fc-code small { font-weight: 600; color: var(--muted); }
  .fc-code .fc-in { flex: 1; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
  .fc-sec { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: var(--r-sm); background: var(--card2); }
  .fc-field { display: flex; flex-direction: column; gap: 4px; }
  .fc-field label, .fc-lab { font-weight: 800; }
  .fc-meta { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
  .fc-meta > :only-child { grid-column: 1 / -1; }
  .fc-paste { width: 100%; resize: vertical; min-height: 110px; }
  .fc-file { position: relative; cursor: pointer; }
  .fc-file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .fc-file.fc-busy { opacity: .75; cursor: progress; }
  /* AI in the widget look: a cream card with a Spark top edge and a dark AI chip, calm (no glow, no motion) */
  .fc-aibox { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--r-sm); background: var(--card); box-shadow: inset 0 4px 0 var(--spark), 0 0 0 1px var(--line), 0 4px 14px rgba(20,20,20,.07); }
  .fc-aichip { display: inline-block; margin-inline-end: 4px; padding: 1px 10px; border-radius: 999px; background: var(--ink); color: var(--card); font-size: .85em; font-weight: 800; line-height: 1.5; white-space: nowrap; }
  .fc-airow { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: end; }
  .fc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .fc-list li { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: var(--r-sm); background: var(--card2); }
  .fc-name { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-wrap: anywhere; }
  .fc-name small { font-weight: 600; color: var(--muted); }
  .fc-acts2 { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .fc-mine { display: flex; flex-direction: column; gap: 8px; border-top: 2px solid var(--line); padding-top: 14px; }
  /* Sharing with a class (BRB.flashShare): the student's switch, and the shared lists */
  .fc-shareme { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: var(--r-sm); background: var(--mint-t); }
  .fc-switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 52px; padding: 8px 12px; border: 0; border-radius: var(--r-sm); background: var(--card); text-align: start; font-weight: 800; overflow-wrap: anywhere; }
  .fc-knob { flex: none; position: relative; width: 52px; height: 30px; border-radius: 999px; background: var(--line); transition: background .2s; }
  .fc-knob::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 3px rgba(20,20,20,.3); transition: transform .2s; }
  .fc-switch[aria-checked="true"] .fc-knob { background: var(--green); }
  .fc-switch[aria-checked="true"] .fc-knob::after { transform: translateX(22px); }
  [dir="rtl"] .fc-switch[aria-checked="true"] .fc-knob::after { transform: translateX(-22px); }
  .fc-switch[disabled] { opacity: .6; cursor: wait; }
  .fc-sharetag { display: inline-block; margin-inline-start: 6px; padding: 0 8px; border-radius: 999px; background: var(--mint-t); color: var(--accent-ink); font-size: .85em; font-weight: 800; white-space: nowrap; }
  .fc-sharetag.fc-off { background: var(--hover); color: var(--muted); }
  .fc-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .fc-erow { display: grid; grid-template-columns: 2em 46px minmax(7em, 1fr) minmax(10em, 1.6fr) 44px; gap: 6px; align-items: start; }
  .fc-n { font-weight: 800; text-align: center; padding-top: 12px; color: var(--muted); }
  .fc-def { resize: vertical; min-height: 46px; width: 100%; }
  .fc-x, .fc-emobtn { width: 44px; height: 46px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-weight: 800; font-size: 1.2em; padding: 0; }
  .fc-x:hover { border-color: var(--coral); color: var(--coral); }
  .fc-emobtn:empty::before { content: '＋'; color: var(--muted); font-size: .8em; }
  .fc-erow.fc-haspic { grid-template-columns: 2em 46px 46px minmax(7em, 1fr) minmax(10em, 1.6fr) 44px; }
  .fc-picbtn { width: 44px; height: 46px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-size: 1.15em; padding: 0; }
  .fc-picbtn[aria-expanded="true"], .fc-emobtn[aria-expanded="true"] { border-color: var(--sky); }
  .fc-emobtn .fc-img { width: 36px; height: 36px; border-radius: 8px; vertical-align: middle; }
  .fc-emobtn .fc-img.fc-painting, .fc-emobtn .fc-img.fc-nopic { font-size: 0; padding: 0; }
  .fc-rowpics { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 10px; }
  .fc-rowpics figure { margin: 0; display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border-radius: 12px; background: var(--card2); font-weight: 700; font-size: .85rem; color: var(--muted); }
  .fc-rowpics .fc-img { width: 64px; height: 48px; border-radius: 8px; }
  .fc-picpanel { grid-column: 2 / -1; display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: var(--r-sm); background: var(--card2); }
  .fc-picpanel .fc-lab { margin: 0; }
  .fc-img { display: inline-flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 12px; background: var(--card2); flex: none; }
  .fc-img img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .fc-img.fc-painting { border: 2px dashed var(--line); color: var(--muted); font-weight: 700; font-size: .8rem; text-align: center; padding: 4px; line-height: 1.2; }
  .fc-img.fc-nopic { border: 2px dashed var(--coral); color: var(--muted); font-size: .75rem; text-align: center; padding: 4px; }
  .fc-face .fc-img { width: min(78%, 320px); height: clamp(90px, 22vh, 190px); background: transparent; }
  .fc-q .fc-img { width: min(80%, 280px); height: clamp(90px, 20vh, 170px); }
  .fc-tile .fc-img { width: 100%; height: 78px; background: transparent; }
  .fc-tile.fc-imgtile { padding: 6px; }
  .fc-tq .fc-img { width: 120px; height: 90px; margin-block: 4px; }
  .fc-terms .fc-img { width: 40px; height: 30px; border-radius: 6px; vertical-align: middle; margin-inline-end: 6px; }
  .fc-picker { grid-column: 2 / -1; display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: var(--r-sm); background: var(--card2); }
  .fc-picks { display: flex; flex-wrap: wrap; gap: 4px; }
  .fc-picks button { width: 44px; height: 44px; border-radius: 10px; border: 0; background: var(--card); font-size: 1.3em; }
  .fc-picks button:hover { background: var(--hover); }
  .fc-radio { display: flex; gap: 14px; flex-wrap: wrap; }
  .fc-radio label, .fc-toggle { display: flex; align-items: center; gap: 8px; font-weight: 700; min-height: 44px; cursor: pointer; }
  .fc-radio input, .fc-toggle input { width: 22px; height: 22px; accent-color: var(--green); }
  .fc-foot { gap: 10px; flex-wrap: wrap; }
  .fc-foot .fc-main { flex: 1 1 14em; width: auto; }
  .fc-share { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px; border-radius: var(--r-sm); background: var(--mint-t); }
  .fc-share:empty { display: none; }
  .fc-share .fc-row { width: 100%; justify-content: center; }
  .fc-link { flex: 1; min-width: 12em; font-size: .9em; }
  .fc-codebig { margin: 0; display: flex; flex-direction: column; align-items: center; font-weight: 700; }
  .fc-codebig b { font-size: 1.8em; letter-spacing: 3px; }
  canvas.fc-qr { width: 180px; height: 180px; image-rendering: pixelated; border-radius: 12px; border: 2px solid var(--line); }

  /* the library */
  .fc-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .fc-chip { min-height: 40px; padding: 4px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); font-weight: 800; }
  .fc-chip[aria-pressed="true"] { background: var(--current); border-color: var(--current); color: var(--on-current); }
  .fc-libgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .fc-libset { --g: var(--g-class); display: flex; align-items: center; gap: 12px; min-height: 76px; padding: 12px 14px; border: 0; border-radius: var(--r-sm); background: var(--card2); text-align: start;
    box-shadow: inset 4px 0 0 color-mix(in srgb, var(--g) 80%, var(--card2)); }
  .fc-libset:hover { background: var(--hover); }
  .fc-libset .fc-emo { font-size: 1.8em; flex: none; }
  .fc-libset span:last-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .fc-libset b { font-weight: 800; overflow-wrap: anywhere; }
  .fc-libset small { color: var(--muted); font-weight: 600; }

  /* a set's page: the four ways to study */
  .fc-modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .fc-mode { --g: var(--g-time); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 104px; padding: 12px 8px; border: 0; border-radius: 18px; background: var(--card2); font-weight: 800; font-size: 1.05em; text-align: center;
    box-shadow: inset 0 4px 0 color-mix(in srgb, var(--g) 75%, var(--card2)); }
  .fc-mode:hover { background: var(--hover); }
  .fc-mode .fc-emo { font-size: 1.9em; line-height: 1; }
  .fc-mode small { font-weight: 600; color: var(--muted); font-size: .82em; }
  .fc-terms { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .fc-terms li { display: grid; grid-template-columns: minmax(6em, 1fr) 2fr 44px; gap: 10px; align-items: center; padding: 8px 8px 8px 14px; border-radius: var(--r-sm); background: var(--card2); }
  .fc-terms b { overflow-wrap: anywhere; }
  .fc-terms span { color: var(--muted); font-weight: 600; overflow-wrap: anywhere; }
  .fc-starbtn { width: 44px; height: 44px; border: 0; border-radius: 50%; background: none; font-size: 1.25em; color: var(--muted); }
  .fc-starbtn[aria-pressed="true"] { color: #E2A400; }
  :root[data-theme="dark"] .fc-starbtn[aria-pressed="true"] { color: var(--spark); }
  .fc-starbtn:hover { background: var(--hover); }

  /* the Now bar: what to do next, dark as the dashboard's schedule block */
  .fc-now { width: 100%; min-height: 64px; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 10px 16px; border-radius: var(--r-sm); background: var(--current); color: var(--on-current); }
  .fc-now b { font-weight: 800; text-transform: uppercase; letter-spacing: .04em; font-size: .85rem; opacity: .9; }
  .fc-now span { font-size: clamp(1.05rem, 2.2vw, 1.3rem); font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
  .fc-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .fc-prog { font-weight: 800; padding: 4px 12px; border-radius: 999px; background: var(--card2); white-space: nowrap; font-size: .9rem; }

  /* Flip: a card that turns over */
  .fc-stage { perspective: 1400px; width: 100%; }
  .fc-flip { position: relative; width: 100%; height: clamp(230px, 46vh, 380px); border: 0; padding: 0; background: none; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.2,.7,.3,1); border-radius: 22px; }
  .fc-flip.fc-turned { transform: rotateY(180deg); }
  .fc-face { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 22px 26px; border-radius: 22px; background: var(--card);
    box-shadow: inset 0 5px 0 color-mix(in srgb, var(--g-time) 75%, var(--card)), 0 0 0 2px var(--line), var(--shadow); backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: auto; }
  .fc-back { transform: rotateY(180deg); box-shadow: inset 0 5px 0 color-mix(in srgb, var(--g-check) 75%, var(--card)), 0 0 0 2px var(--line), var(--shadow); }
  .fc-face .fc-pic { font-size: clamp(2.6rem, 8vw, 4.2rem); line-height: 1; }
  .fc-face .fc-txt { font-size: clamp(1.3rem, 4vw, 2.3rem); font-weight: 800; text-align: center; overflow-wrap: anywhere; line-height: 1.2; }
  .fc-back .fc-txt { font-size: clamp(1.1rem, 3vw, 1.6rem); font-weight: 700; }
  .fc-face .fc-side { position: absolute; top: 12px; inset-inline-start: 16px; font-size: .8rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .fc-face .fc-tap { position: absolute; bottom: 10px; font-size: .85rem; font-weight: 700; color: var(--muted); }
  .fc-tools { justify-content: center; flex-wrap: wrap; }
  .fc-kbd { font-size: .85em; color: var(--muted); font-weight: 600; text-align: center; margin: 0; }

  /* Learn */
  .fc-mastery { display: flex; flex-direction: column; gap: 6px; }
  .fc-mbar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--line); }
  .fc-mbar i { display: block; height: 100%; transition: width .4s ease; }
  .fc-m3 { background: var(--green); } .fc-m1 { background: var(--spark); } .fc-m0 { background: var(--coral); }
  .fc-mkey { display: flex; flex-wrap: wrap; gap: 4px 14px; font-weight: 700; font-size: .9em; }
  .fc-mkey span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-inline-end: 6px; background: var(--line); vertical-align: middle; }
  .fc-mkey .k3::before { background: var(--green); } .fc-mkey .k1::before { background: var(--spark); } .fc-mkey .k0::before { background: var(--coral); }
  .fc-q { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 18px; border-radius: 18px; background: var(--card2); text-align: center; }
  .fc-q .fc-pic { font-size: 3rem; line-height: 1; }
