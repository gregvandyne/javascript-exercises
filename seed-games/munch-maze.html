<title>Munch Maze</title>
<style>
/* Munch Maze on the Oomba Kit: a classic maze-chase game with original characters (the player's own character as
   Munch, and the four Gloops) and original mazes. The kit draws the friendly haunted world behind the game (dusk, or
   night in the dark theme), the title lockup, the pause screen, the icons, buttons and the type; this file lays out
   the game's own pieces in the kit's sticker look (Cream cards, Ink edges).
   Layout: a HUD row (pause / score / best / sound), the maze board, an info row (lives / level / bonus snacks) and an
   optional on-screen D-pad. On wide screens (landscape phones, desktop) the maze sits in the middle with the HUD on
   the left and the D-pad on the right. The script sizes the maze so a whole number of device pixels makes one tile
   (crisp at any devicePixelRatio). Colours come from the kit (set as --mm-* variables at start); no fonts here. */
.mm{position:absolute;inset:0;--rim:var(--mm-ink);--soft:color-mix(in srgb,var(--ok-text) 66%,transparent)}
.mm-tcard{--rim:var(--mm-ink);--soft:color-mix(in srgb,var(--ok-text) 66%,transparent)}
.ok-night .mm,.ok-night .mm-tcard{--rim:color-mix(in srgb,var(--mm-cream) 38%,transparent)}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.mm button,.mm-tcard button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mm svg,.mm-tcard svg{display:block}

/* ---------- play screen ---------- */
.app{position:absolute;inset:0;display:grid;justify-content:center;align-content:center;gap:6px;
  padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
  grid-template-columns:var(--bw,340px);grid-template-areas:"hud" "board" "info" "side"}
.app.offstage{visibility:hidden}
.app.over .side{visibility:hidden}
/* the HUD, the board and the side panel on their own compositor layers: the world behind and the maze repaint every
   frame, and without this a slow device re-rasters the whole play screen each time */
.hud,.board,.info,.side{will-change:transform}
.hud{grid-area:hud;display:flex;align-items:center;gap:6px;min-width:0}
.hud .ok-btn.ok-icon{width:46px;min-height:46px;flex:none}
#pauseBtn{order:0} #scoreBox{order:1} #bestBox{order:2} .hud .mute{order:3}
.stat{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;line-height:1.1;background:var(--ok-card);color:var(--ok-text);
  border:2.5px solid var(--rim);border-radius:16px;padding:2px 6px 4px;box-shadow:0 3px 0 var(--mm-ink)}
.stat .lab{max-width:100%;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);white-space:nowrap;overflow:hidden}
.stat b{font-size:1.2rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
#bestBox{background:var(--mm-sparkTint);color:var(--mm-ink);border-color:var(--mm-ink)}
#bestBox .lab{color:color-mix(in srgb,var(--mm-ink) 70%,transparent)}
/* the board: an Ink-edged frame (a thick Ink edge below, like the kit's stickers) with a Cream rim around the night
   maze. Borders, not shadows: the maze canvas repaints every frame and a shadow over the world would repaint with it. */
.board{grid-area:board;position:relative;justify-self:center;align-self:center;border-radius:16px;padding:2px;box-sizing:border-box;
  background:var(--mm-frame);border:3px solid var(--mm-ink);border-bottom-width:8px}
.board::before{content:"";position:absolute;inset:0;border:2px solid var(--mm-cream);border-radius:13px;pointer-events:none}
#cv{display:block;border-radius:10px;touch-action:none}
.info{grid-area:info;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.info canvas{display:block}
#livesCv,#fruitCv{background:var(--ok-card);border:2.5px solid var(--rim);border-radius:999px;padding:3px 8px;box-shadow:0 3px 0 var(--mm-ink)}
#levelEl{font-weight:800;font-size:1rem;white-space:nowrap;background:var(--ok-card);color:var(--ok-text);border:2.5px solid var(--rim);border-radius:999px;padding:2px 12px;box-shadow:0 3px 0 var(--mm-ink)}
.side{grid-area:side;display:flex;flex-direction:column;align-items:center;gap:6px}
.pad{display:grid;grid-template-columns:repeat(3,var(--pc,64px));grid-template-rows:repeat(3,var(--pc,64px));gap:8px}
.pad button{border:3px solid var(--mm-ink);border-bottom-width:8px;border-radius:18px;background:var(--mm-cream);color:var(--mm-ink);touch-action:none;padding:0;
  display:grid;place-items:center}
.pad button svg{width:calc(var(--pc,64px)*.46);height:calc(var(--pc,64px)*.46);pointer-events:none;stroke-width:2.6}
.pad button.on,.pad button:active{transform:translateY(4px);border-bottom-width:4px;background:var(--mm-mint)}
.pad [data-dir=up]{grid-area:1/2} .pad [data-dir=left]{grid-area:2/1} .pad [data-dir=right]{grid-area:2/3} .pad [data-dir=down]{grid-area:3/2}
.pad .hub{display:none}
/* Portrait phones: a wide two-row pad (tall left/right on the sides, up/down stacked in the middle) gives big buttons without eating maze height. */
.app:not(.wide) .side{justify-self:stretch}
.app:not(.wide) .pad{width:min(100%,460px);grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,var(--pc,64px))}
.app:not(.wide) .pad [data-dir=left]{grid-area:1/1/3/2} .app:not(.wide) .pad [data-dir=right]{grid-area:1/3/3/4}
.app:not(.wide) .pad [data-dir=up]{grid-area:1/2} .app:not(.wide) .pad [data-dir=down]{grid-area:2/2}
.keys{margin:0;font-size:.9rem;font-weight:600;text-align:center;line-height:1.6;background:var(--ok-card);color:var(--ok-text);border:2.5px solid var(--rim);border-radius:16px;
  padding:8px 12px;box-shadow:0 3px 0 var(--mm-ink)}
.keys kbd{display:inline-block;min-width:1.4em;padding:0 .3em;border-radius:7px;background:var(--ok-bg2);border:2px solid var(--rim);box-shadow:0 2px 0 var(--mm-ink);
  font-family:inherit;font-weight:800;font-size:.85rem;line-height:1.35}
.keys .nw{white-space:nowrap}
.skip{position:absolute;right:10px;bottom:10px}

/* Wide screens: HUD on the left, D-pad on the right, maze in the middle. */
.app.wide{grid-template-columns:minmax(0,1fr) var(--bw,340px) minmax(0,1fr);grid-template-rows:1fr auto auto 1fr;column-gap:18px;row-gap:12px;
  grid-template-areas:". board ." "hud board side" "info board side" ". board ."}
.app.wide .board{grid-row:1/5}
.app.wide .side{grid-row:1/5;justify-content:center}
.app.wide .hud{flex-wrap:wrap;justify-content:center;justify-self:center;width:min(100%,210px);gap:10px}
.app.wide .stat,.app.wide #scoreBox,.app.wide #bestBox{flex-basis:100%;order:2;padding:6px 10px}
.app.wide .stat b{font-size:1.6rem}
.app.wide .hud .mute{order:1}
.app.wide .info{flex-direction:column;justify-content:flex-start;justify-self:center;gap:10px}

/* ---------- Title (the kit's title screen; the game's card: the two modes, the maze picker, Play) ---------- */
.ok-ui .ok-title-screen .ok-title-block{max-height:none}
.mm-tcard{display:flex;flex-direction:column;align-items:center;gap:9px;width:min(460px,calc(100vw - 32px));box-sizing:border-box;background:var(--ok-card);color:var(--ok-text);
  border:3px solid var(--mm-ink);border-radius:26px;box-shadow:0 6px 0 var(--mm-ink);padding:12px 12px 14px}
.ok-night .mm-tcard{border-color:color-mix(in srgb,var(--mm-cream) 34%,transparent);box-shadow:0 6px 0 black}
.ok-ui .ok-title-screen .mm-tcard .ok-p{border:0;box-shadow:none;background:none;padding:0 6px;font-size:clamp(.98rem,2.3vmin,1.15rem)}
.ok-title-screen .mm-tcard .ok-big{margin-top:2px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.mode{display:flex;align-items:center;gap:8px;min-width:0;min-height:56px;box-sizing:border-box;border:2.5px solid var(--ok-line);background:var(--ok-bg2);color:var(--ok-text);
  border-radius:18px;padding:6px 8px;text-align:start;font:inherit;line-height:1.15}
.mode[aria-pressed="true"]{background:var(--mm-mintTint);color:var(--mm-ink);border-color:var(--mm-ink);box-shadow:0 4px 0 var(--mm-ink)}
.mode .mi{flex:none;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--mm-cream);border:2px solid var(--mm-ink);color:var(--mm-ink)}
.mode[aria-pressed="true"] .mi{background:var(--mm-mint)}
.mode .mi svg{width:20px;height:20px}
.mode .mt{min-width:0;display:flex;flex-direction:column}
.mode .mt b{font-size:1.08rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode .mt small{font-size:.8rem;font-weight:700;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl-row{font-size:.8rem;font-weight:800;color:var(--soft);letter-spacing:.05em;text-transform:uppercase;margin-bottom:-4px}
.mazes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}
.mazes button{border:2.5px solid var(--ok-line);border-radius:14px;background:var(--ok-bg2);color:var(--ok-text);padding:5px 2px 4px;min-height:48px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;font-size:.8rem;line-height:1.05;min-width:0}
.mazes button canvas{display:block;width:28px;height:31px;border-radius:5px;border:2px solid var(--mm-ink)}
.mazes button .mix{width:33px;height:33px;display:grid;place-items:center;border-radius:50%;background:var(--mm-cream);border:2px solid var(--mm-ink);color:var(--mm-ink)}
.mazes button .mix svg{width:20px;height:20px}
.mazes button span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mazes button[aria-pressed="true"]{background:var(--mm-mintTint);color:var(--mm-ink);border-color:var(--mm-ink);box-shadow:0 3px 0 var(--mm-ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.toggle{display:inline-flex;align-items:center;gap:6px;border:2.5px solid var(--ok-line);border-radius:999px;background:var(--ok-bg2);color:var(--ok-text);min-height:44px;padding:0 14px;
  font-weight:800;font-size:.95rem}
.toggle svg{width:22px;height:22px;flex:none}
.toggle[aria-pressed="true"]{background:var(--mm-mintTint);color:var(--mm-ink);border-color:var(--mm-ink)}
.hint{margin:0;font-size:.88rem;font-weight:600;color:var(--soft);text-align:center;text-wrap:balance}
.kbonly{display:none}
@media (hover:hover) and (pointer:fine){.kbonly{display:block}}

/* ---------- chips (title, pause, results) ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-weight:800;background:var(--ok-bg2);color:var(--ok-text);border:2px solid var(--ok-line);border-radius:999px;padding:3px 11px;font-size:.92rem}
.chip svg{width:1.1em;height:1.1em;flex:none}
.chip.gold{background:var(--mm-spark);color:var(--mm-ink);border-color:var(--mm-ink);transform:rotate(-3deg)}

/* ---------- Pause (the kit's pause screen, with the game's note and the arrow-buttons switch) ---------- */
.ok-pause .mm-note{margin:-4px 0 0;font-weight:700;line-height:1.35;max-width:32ch;text-wrap:balance}
/* the sound switch and the arrow-buttons switch share a row below the buttons */
.mm-prow{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:300px}
.mm-prow .ok-srow{box-sizing:border-box}
/* Short landscape screens (phones on their side): a compact pause card that fits without scrolling: a smaller title,
   Resume on its own row, Restart / Settings / Quit side by side, then Sound and the arrow-buttons switch in one row. */
@media (orientation:landscape) and (max-height:520px){
  .ok-ui .ok-pause.ok-modal{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .ok-ui .ok-pause .ok-card{width:min(600px,100%);padding:12px 16px 14px;gap:8px;border-radius:24px}
  .ok-ui .ok-pause .ok-h2{font-size:1.35em}
  .ok-ui .ok-pause .mm-note{margin:-2px 0 0;font-size:.95rem;max-width:none}
  .ok-ui .ok-pause .ok-col{max-width:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .ok-ui .ok-pause .ok-col>.ok-btn{min-height:46px;padding:0 10px;font-size:1rem;min-width:0}
  .ok-ui .ok-pause .ok-col>.ok-go{grid-column:1/-1;min-height:52px;font-size:1.2rem}
  .ok-ui .ok-pause .mm-prow{flex-direction:row;justify-content:center;flex-wrap:wrap;max-width:none;gap:10px 18px}
  .ok-ui .ok-pause .mm-prow .ok-srow{width:auto;gap:10px}
  .ok-ui .ok-pause .mm-prow .toggle{min-height:40px}
}

/* ---------- Results (a kit card: the player's character, the score, Play again / Menu) ---------- */
.mm .ok-card{width:min(440px,100%);padding:18px 16px 16px;gap:9px}
.mm .ok-card .ok-portrait{margin:-4px 0 -6px}
.mm .ok-card p{margin:0;font-size:1.05rem;font-weight:600;line-height:1.3;text-wrap:balance}
.score-big{font-size:2.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--mm-cream);-webkit-text-stroke:.14em var(--mm-ink);paint-order:stroke fill;
  text-shadow:0 .08em 0 var(--mm-ink)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;margin-top:2px}
.btns .ok-btn{flex:1 1 auto}
/* Arabic letters must stay joined: no letter spacing. Japanese: break lines between phrases. */
html[lang="ar"] .mm *,html[lang="ar"] .mm-tcard *{letter-spacing:0!important}
html[lang="ja"] .mm p,html[lang="ja"] .mm-tcard p{word-break:auto-phrase}
@media (orientation:portrait) and (max-height:700px){
  .ok-ui .ok-title-screen .mm-tcard .ok-p{display:none}
  .mm-tcard{gap:7px;padding:10px 12px 12px}
}
/* the title's sound button sits in the corner next to the theme button; on narrow phones the two stack in a column
   so they stay clear of the title lockup */
@media (max-width:440px){.ok-title-screen .ok-corner{flex-direction:column-reverse;align-items:flex-end}}
/* Landscape (desktop, tablets, phones on their side): the title card goes two columns so nothing scrolls. */
@media (orientation:landscape) and (min-width:700px){
  .mm-tcard{width:min(720px,calc(100vw - 32px));display:grid;grid-template-columns:1fr 1fr;column-gap:16px;row-gap:8px;align-items:center}
  .mm-tcard .colL,.mm-tcard .colR{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
}
/* Short landscape phones: smaller lockup, no badge. */
@media (orientation:landscape) and (max-height:500px){
  .ok-ui .ok-title-screen{padding-top:8px}
  .ok-ui .ok-title-screen .ok-h1{font-size:clamp(2rem,10vmin,2.6rem);margin:0}
  .ok-ui .ok-title-screen .ok-title-block{gap:6px;padding-top:0}
  .ok-ui .ok-title-badge{display:none}
  .mm-tcard{width:min(720px,calc(100vw - 32px));display:grid;grid-template-columns:1fr 1fr;column-gap:14px;row-gap:6px;padding:8px 12px 10px}
  .mm-tcard .colL,.mm-tcard .colR{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
  .ok-ui .ok-title-screen .mm-tcard .ok-p{display:none}
  .ok-title-screen .mm-tcard .ok-big{min-height:52px;margin-top:0}
  .mm .ok-card{width:min(640px,100%);padding:12px 16px 14px;gap:6px}
  .mm .ok-card .ok-portrait{display:none}
}
.colL,.colR{display:contents}
@media (max-width:374px){
  .mode .mt b{font-size:.98rem}
  .mazes button{font-size:.7rem}
  .stat .lab{font-size:.66rem}
}
@media (prefers-reduced-motion:reduce){.chip.gold{transform:none}}
.ok-rm .chip.gold{transform:none}
</style>

<script>
/* =====================================================================================
   CONFIG: change these to make the game your own!
   ===================================================================================== */
const CONFIG = {
  title: 'Munch Maze',
  saveKey: 'munch-maze-v1',
  biome: 'spooky',             // the kit's world behind the game (the friendly haunted theme's world)
  timeOfDay: 0.7,              // dusk (0 = noon ... 1 = night; the dark site theme is always night)
  lives: 3,                    // lives at the start of a Classic game
  extraLifeAt: 10000,          // one extra life when the score reaches this
  baseSpeed: 9,                // tiles per second at "100%" (the level tables below are percentages of this)
  stepHz: 120,                 // the game logic runs in fixed steps, this many per second, on every screen
  cornerWindow: 0.45,          // how early or late (in tiles) Munch may turn into an opening ("cornering")
  hitRadius: 0.5,              // how close (in tiles) a Gloop must get to catch Munch
  dotPause: 1 / 60,            // Munch stops this long (seconds) after each dot, like the old arcade games
  snackPause: 3 / 60,          // ...and this long after a Super Snack
  points: { dot: 10, snack: 50, gloops: [200, 400, 800, 1600] },
  fruitAtDots: [70, 170],      // a bonus snack appears after this many dots (out of 244; scaled to each maze)
  fruitSeconds: 9,             // a bonus snack stays 9 to 10 seconds
  eatFreeze: 0.7,              // the game pauses this long to show the points when a Gloop is munched
  eyesSpeed: 1.7,              // eyes hurry home this fast (x baseSpeed)
  houseSpeed: 0.5,             // Gloops move this fast inside the house
  frightMinSeconds: 1,         // Super Snack power never drops below this (late levels)
  blinkSeconds: 2,             // the Gloops start fading blue <-> white this long before the power ends...
  blinkPeriod: 0.6,            // ...one slow fade every 0.6 s (under 2 a second, never a strobe)
  readySeconds: 2.4,           // "READY!" at the start of a game
  readyAgainSeconds: 1.7,      // "READY!" after a new level or a lost life
  intermissionAfter: [2, 5, 9, 13, 17],   // a short funny cartoon plays after these levels
  swipeMin: 16,                // pixels a finger must slide before it counts as a swipe
  easy: { lives: 5, gloopSpeed: 0.78, frightScale: 1.6, minFright: 3, munchMin: 0.85 },
  hero: 'me',                  // Munch is the player's own character (their Me-page avatar; the Oomba mascot for guests), or a character spec
  heroSize: 2.8,               // Munch's height in tiles
  superSnack: 'sweet',         // the kit prop for the Super Snacks

const RTL = ((window.BRB && BRB.user && BRB.user.dir) === 'rtl') || LANG_BASE === 'he' || LANG_BASE === 'ar';
const NUM_LOCALE = LANG_BASE === 'ar' ? 'ar-u-nu-latn' : LANG;     // Arabic text, Latin digits (like the site)
const I18N_CHAIN = [I18N[LANG], I18N[LANG_BASE], I18N.en].filter(Boolean);
let PLURAL = null, NUMF = null;
try { PLURAL = new Intl.PluralRules(NUM_LOCALE); } catch (e) { /* old browser: one/other below */ }
try { NUMF = new Intl.NumberFormat(NUM_LOCALE); } catch (e) { /* ignore */ }
const fmtNum = n => (NUMF ? NUMF.format(n) : String(n));
/** t('key', { n: 3, v: 'x' }): the string for this language; {name} placeholders filled; a plural set picks its form by n. */
function t(key, vars) {
  let s;
  for (let i = 0; i < I18N_CHAIN.length && s === undefined; i++) s = I18N_CHAIN[i][key];
  if (s === undefined) return key;
  if (s && typeof s === 'object' && !Array.isArray(s)) { const n = vars && typeof vars.n === 'number' ? vars.n : 0; s = (n === 0 && s.zero) || s[PLURAL ? PLURAL.select(n) : (n === 1 ? 'one' : 'other')] || s.other; }
  if (vars && typeof s === 'string') s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] === undefined ? m : typeof vars[k] === 'number' ? fmtNum(vars[k]) : vars[k]));
  return s;
}

/* ENGINE:BEGIN ========================================================================
   The game rules, with no drawing and no page access (so they can be tested on their own).
   Positions are in tiles; a whole number is the centre of a tile. Everything runs in fixed
   steps of 1/CONFIG.stepHz seconds, so the game plays the same at 30, 60 or 144 frames a second.
   The engine reports what happened (dots, snacks, catches...) as events in G.ev for the
   screen to turn into sounds and sparkles.
   ===================================================================================== */
const Engine = (() => {
  const DIRS = { up: [0, -1], left: [-1, 0], down: [0, 1], right: [1, 0] };
  const ORDER = ['up', 'left', 'down', 'right'];          // tie-break order when two ways are equally good
  const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
  const EPS = 1e-6;
  const T_WALL = 0, T_PATH = 1, T_TUNNEL = 2, T_DOOR = 3, T_HOUSE = 4;
  const STEP = 1 / CONFIG.stepHz;
  const CAUGHT_LEN = 2.1, CLEAR_LEN = 3.0, INTER_LEN = 8.5;
  const GLOBAL_LIMITS = [0, 7, 17, 32];                  // after a lost life: dots before Sneaky, Tricky, Dozy come out
  const FRIGHT = [6, 5, 4, 3, 2, 5, 2, 2, 1, 5, 2, 1, 1, 3, 1, 1, 0, 1];   // Super Snack seconds by level (then 0)

  /** Turn a maze definition (rows of text) into typed grids plus the house and tunnel positions. */
  function parseMaze(def, index) {
    const rows = def.rows, H = rows.length, W = rows[0].length;
    const grid = new Uint8Array(W * H), dots = new Uint8Array(W * H), tunnelRows = [];
    let doorY = -1, doorX0 = 99, doorX1 = -1, total = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const ch = rows[y][x], i = y * W + x;
      if (ch === '#') grid[i] = T_WALL;
      else if (ch === 't') grid[i] = T_TUNNEL;
      else if (ch === '-') { grid[i] = T_DOOR; doorY = y; doorX0 = Math.min(doorX0, x); doorX1 = Math.max(doorX1, x); }
      else if (ch === '_') grid[i] = T_HOUSE;
      else { grid[i] = T_PATH; if (ch === '.') { dots[i] = 1; total++; } else if (ch === 'o') { dots[i] = 2; total++; } }
      if (x === 0 && ch === 't') tunnelRows.push(y);
    }
    const homeX = (doorX0 + doorX1) / 2;
    return { index, id: def.id, name: def.name, colors: def.colors, deco: def.deco, rows, W, H, grid, dots, total, tunnelRows,
      doorY, doorX0, doorX1, homeX, exitY: doorY - 1, houseY: doorY + 2,
      start: { x: def.start[0], y: def.start[1] }, fruit: { x: homeX, y: doorY + 5 } };
  }
  const PARSED = MAZES.map(parseMaze);

  const wrapX = (M, x) => ((x % M.W) + M.W) % M.W;
  const wrapDist = (M, a, b) => { const d = Math.abs(a - b) % M.W; return Math.min(d, M.W - d); };
  function tileType(M, tx, ty) { if (ty < 0 || ty >= M.H) return T_WALL; return M.grid[ty * M.W + wrapX(M, tx)]; }
  /** Can Munch (or a Gloop out in the maze) stand on this tile? Walls, the door and the house say no. */
  function open(M, tx, ty) { const t = tileType(M, tx, ty); return t === T_PATH || t === T_TUNNEL; }

  // Seeded random numbers (mulberry32), kept in the game so a seed replays the same game.
  function rnd(G) { G.rs = (G.rs + 0x6D2B79F5) >>> 0; let t = G.rs; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }

  /* ---------- level tables (classic arcade values, as fractions of CONFIG.baseSpeed) ---------- */
  function speedTable(level) {
    if (level <= 1) return { munch: 0.80, munchFright: 0.90, gloop: 0.75, tunnel: 0.40, fright: 0.50, elroy1: 0.80, elroy2: 0.85 };
    if (level <= 4) return { munch: 0.90, munchFright: 0.95, gloop: 0.85, tunnel: 0.45, fright: 0.55, elroy1: 0.90, elroy2: 0.95 };
    if (level <= 20) return { munch: 1.00, munchFright: 1.00, gloop: 0.95, tunnel: 0.50, fright: 0.60, elroy1: 1.00, elroy2: 1.05 };
    return { munch: 0.90, munchFright: 0.90, gloop: 0.95, tunnel: 0.50, fright: 0.60, elroy1: 1.00, elroy2: 1.05 };
  }
  /** Scatter / chase schedule in seconds: scatter, chase, scatter, chase... the last chase lasts forever. */
  function modeTable(level) {
    if (level <= 1) return [7, 20, 7, 20, 5, 20, 5, Infinity];
    if (level <= 4) return [7, 20, 7, 20, 5, 1033, 1 / 60, Infinity];
    return [5, 20, 5, 20, 5, 1037, 1 / 60, Infinity];
  }
  function frightSeconds(G) {
    let s = FRIGHT[G.level - 1]; if (s === undefined) s = 0;
    if (G.mode === 'easy') s = Math.max(CONFIG.easy.minFright, s * CONFIG.easy.frightScale);
    return Math.max(CONFIG.frightMinSeconds, s);
  }
  /** Zippy speeds up ("in a hurry") when this few dots are left; twice as hurried at half that. */
  function elroyDots(level) { return level <= 1 ? 20 : level === 2 ? 30 : level <= 5 ? 40 : level <= 8 ? 50 : level <= 11 ? 60 : level <= 14 ? 80 : level <= 18 ? 100 : 120; }
  /** Dots each Gloop waits for in the house at the start of a level (by Gloop id; Zippy starts outside). */
  function houseLimits(level) { return level <= 1 ? [0, 0, 30, 60] : level === 2 ? [0, 0, 0, 50] : [0, 0, 0, 0]; }
  function fruitIndex(level) { return level <= 1 ? 0 : level === 2 ? 1 : Math.min(CONFIG.fruits.length - 1, Math.floor((level - 3) / 2) + 2); }
  /** Which maze a level uses. Mix: levels 1-2, 3-5, 6-9 on the three mazes, then a new maze every 4 levels. */
  function mazeIndexFor(pick, level) {
    if (pick !== 'mix') { const i = PARSED.findIndex(m => m.id === pick); return i < 0 ? 0 : i; }
    if (level <= 2) return 0; if (level <= 5) return 1 % PARSED.length; if (level <= 9) return 2 % PARSED.length;
    return Math.floor((level - 10) / 4) % PARSED.length;
  }

  /* ---------- game setup ---------- */
  function newGame(opts = {}) {
    const mode = opts.mode === 'easy' ? 'easy' : 'classic';
    const pick = opts.maze && (opts.maze === 'mix' || PARSED.some(m => m.id === opts.maze)) ? opts.maze : 'mix';
    const G = {
      mode, mazePick: pick, level: 1, score: 0, lives: mode === 'easy' ? CONFIG.easy.lives : CONFIG.lives,
      rs: (opts.seed >>> 0) || 20240601, ev: [], acc: 0, time: 0, extraGiven: false, fast: !!opts.fast,
      fruitsEaten: [], over: false, dotsEatenTotal: 0, gloopsEaten: 0, levelsCleared: 0,
      munch: { x: 0, y: 0, dir: 'left', next: null, pause: 0, moving: false, travel: 0 },
      gloops: CONFIG.gloops.map((c, id) => ({ id, name: c.name, x: 0, y: 0, dir: 'left', state: 'house', fright: false, reverse: false, dotCounter: 0 }))
    };
    startLevel(G, Math.max(1, Math.floor(+opts.level) || 1));
    G.phaseT = G.fast ? 0 : CONFIG.readySeconds;
    G.ev.push({ type: 'start' });
    return G;
  }
  function startLevel(G, level) {
    G.level = level;
    G.maze = PARSED[mazeIndexFor(G.mazePick, level)];
    G.dots = G.maze.dots.slice(); G.dotsLeft = G.maze.total; G.dotsEaten = 0;
    G.spd = speedTable(level); G.modes = modeTable(level); G.houseLimits = houseLimits(level);
    const k = G.maze.total / 244; G.fruitAt = CONFIG.fruitAtDots.map(n => Math.round(n * k)); G.fruitsSpawned = 0;
    G.elroy1 = elroyDots(level); G.elroy2 = G.elroy1 / 2; G.elroyOff = false; G.globalCounter = null;
    G.levelFruit = fruitIndex(level);
    for (const g of G.gloops) g.dotCounter = 0;
    resetActors(G);
    G.phase = 'ready'; G.phaseT = G.fast ? 0 : CONFIG.readyAgainSeconds;
    G.ev.push({ type: 'level', level, maze: G.maze.name });
  }
  /** Everyone back to their start spots (new level or after Munch is caught). */
  function resetActors(G) {
    const M = G.maze, m = G.munch;
    m.x = M.start.x; m.y = M.start.y; m.dir = 'left'; m.next = null; m.pause = 0; m.moving = false;
    for (const g of G.gloops) {
      g.fright = false; g.reverse = false;
      if (g.id === 0) { g.state = 'active'; g.x = M.homeX; g.y = M.exitY; g.dir = 'left'; }
      else { g.state = 'house'; g.x = M.homeX + (g.id === 2 ? -2 : g.id === 3 ? 2 : 0); g.y = M.houseY; g.dir = g.id === 1 ? 'down' : 'up'; }
    }
    G.modeIdx = 0; G.modeT = 0; G.frightT = 0; G.frightTotal = 0; G.chain = 0;
    G.fruit = null; G.noDotT = 0; G.freezeT = 0; G.eaten = null; G.caughtBy = -1;
  }

  /* ---------- the clock ---------- */
  /** Real time in (seconds); runs as many fixed steps as fit. */
  function update(G, dt) { G.acc += Math.min(Math.max(dt, 0), 0.25); let n = 0; while (G.acc >= STEP - 1e-9 && n < 40) { G.acc -= STEP; tick(G, STEP); n++; } }
  /** Exactly `seconds` of game time, for tests. */
  function advance(G, seconds) { let n = Math.round(seconds / STEP); while (n-- > 0) tick(G, STEP); }
  function tick(G, dt) {
    G.time += dt;
    switch (G.phase) {
      case 'ready': G.phaseT -= dt; if (G.phaseT <= 0) { G.phase = 'play'; G.ev.push({ type: 'go' }); } break;
      case 'play': play(G, dt); break;
      case 'eat': G.freezeT -= dt; if (G.freezeT <= 0) { G.phase = 'play'; G.eaten = null; } break;
      case 'caught': G.phaseT += dt; if (G.phaseT >= (G.fast ? 0.05 : CAUGHT_LEN)) afterCaught(G); break;
      case 'clear': G.phaseT += dt; if (G.phaseT >= (G.fast ? 0.05 : CLEAR_LEN)) afterClear(G); break;
      case 'intermission': G.phaseT += dt; if (G.fast || G.phaseT >= INTER_LEN) startLevel(G, G.level + 1); break;
      default: break;   // 'over'
    }
  }
  function afterCaught(G) {
    G.lives--;
    G.ev.push({ type: 'lifeLost', lives: G.lives });
    if (G.lives <= 0) { G.phase = 'over'; G.over = true; G.ev.push({ type: 'over', score: G.score, level: G.level }); return; }
    resetActors(G);
    G.globalCounter = 0; G.elroyOff = true;   // the house now uses one shared dot counter; Zippy calms down until Dozy is out
    G.phase = 'ready'; G.phaseT = G.fast ? 0 : CONFIG.readyAgainSeconds;
  }
  function afterClear(G) {
    G.levelsCleared++;
    const k = CONFIG.intermissionAfter.indexOf(G.level);
    if (k >= 0 && !G.fast) { G.phase = 'intermission'; G.phaseT = 0; G.interKind = k % 3; G.ev.push({ type: 'intermission', kind: G.interKind }); }
    else startLevel(G, G.level + 1);
  }
  function skipIntermission(G) { if (G.phase === 'intermission') startLevel(G, G.level + 1); }

  const isScatter = G => G.modeIdx % 2 === 0;
  function elroyLevel(G) { if (G.elroyOff) return 0; return G.dotsLeft <= G.elroy2 ? 2 : G.dotsLeft <= G.elroy1 ? 1 : 0; }

  /* ---------- one step of play ---------- */
  function play(G, dt) {
    // Super Snack power counts down; the scatter/chase clock waits while it lasts.
    if (G.frightT > 0) {
      G.frightT -= dt;
      if (G.frightT <= 0) { G.frightT = 0; for (const g of G.gloops) g.fright = false; G.ev.push({ type: 'frightEnd' }); }
    } else if (G.modeIdx < G.modes.length - 1) {
      G.modeT += dt;
      if (G.modeT >= G.modes[G.modeIdx]) {
        G.modeT = 0; G.modeIdx++;
        for (const g of G.gloops) if (g.state === 'active') g.reverse = true;   // every switch turns the Gloops around
        G.ev.push({ type: 'mode', scatter: isScatter(G) });
      }
    }
    if (G.fruit) { G.fruit.t -= dt; if (G.fruit.t <= 0) { G.fruit = null; G.ev.push({ type: 'fruitGone' }); } }
    G.noDotT += dt;
    releaseCheck(G);
    const m = G.munch;
    if (m.pause > 0) m.pause -= dt;
    else moveMunch(G, munchSpeed(G) * CONFIG.baseSpeed * dt);
    eatHere(G);
    if (collide(G)) return;
    for (const g of G.gloops) moveGloop(G, g, dt);
    if (collide(G)) return;
    if (G.dotsLeft <= 0) { G.phase = 'clear'; G.phaseT = 0; G.ev.push({ type: 'clear', level: G.level }); }
  }

  function munchSpeed(G) {
    let f = G.frightT > 0 ? G.spd.munchFright : G.spd.munch;
    if (G.mode === 'easy') f = Math.max(f, CONFIG.easy.munchMin);
    return f;
  }
  function inTunnel(G, g) { const M = G.maze, rx = Math.round(g.x), ry = Math.round(g.y); if (rx < 0 || rx >= M.W) return true; return M.grid[ry * M.W + rx] === T_TUNNEL; }
  function gloopSpeed(G, g) {
    if (g.state === 'eyes' || g.state === 'entering') return CONFIG.eyesSpeed;
    let f;
    if (g.state === 'house' || g.state === 'leaving') f = CONFIG.houseSpeed;
    else if (inTunnel(G, g)) f = G.spd.tunnel;
    else if (g.fright) f = G.spd.fright;
    else if (g.id === 0 && elroyLevel(G)) f = elroyLevel(G) === 2 ? G.spd.elroy2 : G.spd.elroy1;
    else f = G.spd.gloop;
    if (G.mode === 'easy') f *= CONFIG.easy.gloopSpeed;
    return f;
  }

  /** Munch: tile-based with smooth sub-tile motion, instant reversing, buffered turns and cornering
      (an early or late turn within CONFIG.cornerWindow of a junction slides diagonally into the new lane). */
  function moveMunch(G, dist) {
    const M = G.maze, m = G.munch;
    if (m.next === m.dir) m.next = null;
    if (m.next && m.next === OPP[m.dir]) { m.dir = m.next; m.next = null; }
    let guard = 0;
    while (dist > EPS && guard++ < 8) {
      const cx = Math.round(m.x), cy = Math.round(m.y);
      let [dx, dy] = DIRS[m.dir];
      const off = dx ? m.x - cx : m.y - cy;
      if (m.next && m.next !== OPP[m.dir] && Math.abs(off) <= CONFIG.cornerWindow) {
        const [nx, ny] = DIRS[m.next];
        if (open(M, cx + nx, cy + ny)) {
          G.ev.push({ type: 'turn', x: m.x, y: m.y, dir: m.next });
          m.dir = m.next; m.next = null; [dx, dy] = DIRS[m.dir];
        }
      }
      const along = dx ? m.x - cx : m.y - cy;
      if (Math.abs(along) < EPS && !open(M, cx + dx, cy + dy)) {   // at a centre facing a wall: stop here
        if (dx) m.x = cx; else m.y = cy;
        // finish any corner slide so Munch sits neatly in the lane
        if (dx) m.y = approach(m.y, cy, dist); else m.x = approach(m.x, cx, dist);
        m.moving = false; break;
      }
      m.moving = true;
      const p = dx ? m.x : m.y, s = dx || dy;
      const toNext = s > 0 ? Math.floor(p + EPS) + 1 - p : p - (Math.ceil(p - EPS) - 1);
      const step = Math.min(dist, toNext);
      if (dx) { m.x += dx * step; m.y = approach(m.y, cy, step); }
      else { m.y += dy * step; m.x = approach(m.x, cx, step); }
      m.travel += step;
      dist -= step;
      if (m.x < -0.5) m.x += M.W; else if (m.x >= M.W - 0.5) m.x -= M.W;
    }
  }
  const approach = (v, t, d) => v < t ? Math.min(t, v + d) : Math.max(t, v - d);

  function eatHere(G) {
    const M = G.maze, m = G.munch;
    const tx = wrapX(M, Math.round(m.x)), ty = Math.round(m.y), i = ty * M.W + tx;
    const d = G.dots[i];
    if (d) {
      G.dots[i] = 0; G.dotsLeft--; G.dotsEaten++; G.dotsEatenTotal++; G.noDotT = 0;
      if (G.globalCounter !== null) G.globalCounter++; else { const p = preferred(G); if (p) p.dotCounter++; }
      if (d === 1) { addScore(G, CONFIG.points.dot); m.pause = Math.max(m.pause, CONFIG.dotPause); G.ev.push({ type: 'dot', x: tx, y: ty }); }
      else { addScore(G, CONFIG.points.snack); m.pause = Math.max(m.pause, CONFIG.snackPause); frighten(G); G.ev.push({ type: 'snack', x: tx, y: ty }); }
      if (G.fruitsSpawned < 2 && G.dotsEaten >= G.fruitAt[G.fruitsSpawned]) spawnFruit(G);
      releaseCheck(G);
    }
    const f = G.fruit;
    if (f && Math.abs(m.y - f.y) < 0.5 && wrapDist(M, m.x, f.x) < 0.75) {
      addScore(G, f.points); G.fruitsEaten.push(f.kind);
      G.ev.push({ type: 'fruit', kind: f.kind, points: f.points, x: f.x, y: f.y });
      G.fruit = null;
    }
  }
  function addScore(G, n) {
    const before = G.score; G.score += n;
    if (!G.extraGiven && before < CONFIG.extraLifeAt && G.score >= CONFIG.extraLifeAt) { G.extraGiven = true; G.lives++; G.ev.push({ type: 'extraLife', lives: G.lives }); }
  }
  function spawnFruit(G) {
    const k = G.levelFruit, F = CONFIG.fruits[k];
    G.fruit = { kind: k, id: F.id, points: F.points, x: G.maze.fruit.x, y: G.maze.fruit.y, t: CONFIG.fruitSeconds + rnd(G) };
    G.fruitsSpawned++;
    G.ev.push({ type: 'fruitSpawn', kind: k });
  }
  /** A Super Snack: every Gloop that is not just eyes turns blue (frightened); the ones out in the maze turn around. */
  function frighten(G) {
    const s = frightSeconds(G); G.chain = 0;
    for (const g of G.gloops) {
      if (g.state === 'eyes' || g.state === 'entering') continue;
      if (g.state === 'active') g.reverse = true;
      if (s > 0) g.fright = true;
    }
    G.frightT = s; G.frightTotal = s;
  }
  function collide(G) {
    const m = G.munch, M = G.maze, r = CONFIG.hitRadius;
    for (const g of G.gloops) {
      if (g.state !== 'active') continue;
      const dx = wrapDist(M, m.x, g.x), dy = Math.abs(m.y - g.y);
      if (dx * dx + dy * dy >= r * r) continue;
      if (g.fright) {   // munch it! 200, 400, 800, 1600 in a row
        const pts = CONFIG.points.gloops[Math.min(G.chain, CONFIG.points.gloops.length - 1)];
        G.chain++; G.gloopsEaten++;
        addScore(G, pts);
        g.fright = false; g.state = 'eyes'; g.reverse = false;
        G.eaten = { id: g.id, x: g.x, y: g.y, points: pts };
        G.ev.push({ type: 'eatGloop', id: g.id, x: g.x, y: g.y, points: pts, chain: G.chain });
        G.phase = 'eat'; G.freezeT = G.fast ? 0 : CONFIG.eatFreeze;
        return true;
      }
      G.phase = 'caught'; G.phaseT = 0; G.caughtBy = g.id; G.fruit = null;
      G.ev.push({ type: 'caught', id: g.id });
      return true;
    }
    return false;
  }

  /* ---------- the house ---------- */
  /** The first Gloop (Sneaky, then Tricky, then Dozy) still waiting in the house. */
  function preferred(G) { for (let i = 1; i < G.gloops.length; i++) if (G.gloops[i].state === 'house') return G.gloops[i]; return null; }
  function releaseCheck(G) {
    const p = preferred(G); if (!p) return;
    let go = false;
    if (G.globalCounter !== null) { if (G.globalCounter >= GLOBAL_LIMITS[p.id]) { go = true; if (p.id === 3) G.globalCounter = null; } }
    else if (p.dotCounter >= G.houseLimits[p.id]) go = true;
    if (!go && G.noDotT >= (G.level < 5 ? 4 : 3)) { go = true; G.noDotT = 0; }   // Munch stopped eating: let one out anyway
    if (go) { p.state = 'leaving'; G.ev.push({ type: 'release', id: p.id }); }
  }

  /* ---------- Gloops ---------- */
  function moveGloop(G, g, dt) {
    const M = G.maze;
    const dist = gloopSpeed(G, g) * CONFIG.baseSpeed * dt;
    if (g.state === 'house') {             // bob up and down in place
      const top = M.houseY - 0.4, bot = M.houseY + 0.4;
      if (g.dir === 'up') { g.y -= dist; if (g.y <= top) { g.y = top; g.dir = 'down'; } }
      else { g.y += dist; if (g.y >= bot) { g.y = bot; g.dir = 'up'; } }
    } else if (g.state === 'leaving') {    // to the middle, then up and out of the door
      if (Math.abs(g.x - M.homeX) > EPS) {
        if (Math.abs(g.y - M.houseY) > EPS) { g.dir = g.y < M.houseY ? 'down' : 'up'; g.y = approach(g.y, M.houseY, dist); }
        else { g.dir = g.x < M.homeX ? 'right' : 'left'; g.x = approach(g.x, M.homeX, dist); }
      } else {
        g.dir = 'up'; g.y = approach(g.y, M.exitY, dist);
        if (g.y <= M.exitY + EPS) {
          g.y = M.exitY; g.x = M.homeX; g.state = 'active'; g.dir = 'left'; g.reverse = false;
          if (g.id === 3) G.elroyOff = false;
          G.ev.push({ type: 'leave', id: g.id });
        }
      }
    } else if (g.state === 'entering') {   // eyes drop back in through the door, then the Gloop comes back to life
      if (Math.abs(g.x - M.homeX) > EPS) { g.dir = g.x < M.homeX ? 'right' : 'left'; g.x = approach(g.x, M.homeX, dist); }
      else {
        g.dir = 'down'; g.y = approach(g.y, M.houseY, dist);
        if (Math.abs(g.y - M.houseY) < EPS) { g.state = 'leaving'; g.fright = false; G.ev.push({ type: 'revive', id: g.id }); }
      }
    } else tileMove(G, g, dist);
  }
  function tileMove(G, g, dist) {
    const M = G.maze;
    if (g.reverse) { g.reverse = false; g.dir = OPP[g.dir]; }
    let guard = 0;
    while (dist > EPS && guard++ < 6) {
      const rx = Math.round(g.x), ry = Math.round(g.y);
      if (Math.abs(g.x - rx) < EPS && Math.abs(g.y - ry) < EPS) {   // at a tile centre: pick the next way
        g.x = rx; g.y = ry;
        const tx = wrapX(M, rx);
        if (g.state === 'eyes' && ry === M.exitY && Math.abs(tx - M.homeX) < 1) { g.x = tx; g.state = 'entering'; return; }
        g.dir = chooseDir(G, g, tx, ry);
      }
      const [dx, dy] = DIRS[g.dir];
      const p = dx ? g.x : g.y, s = dx || dy;
      const toNext = s > 0 ? Math.floor(p + EPS) + 1 - p : p - (Math.ceil(p - EPS) - 1);
      const step = Math.min(dist, toNext);
      if (dx) g.x += dx * step; else g.y += dy * step;
      dist -= step;
      if (g.x < -0.5) g.x += M.W; else if (g.x >= M.W - 0.5) g.x -= M.W;
    }
  }
  /** Classic rule: never turn back; of the open ways, take the one whose next tile is closest (straight line)
      to the target. Frightened Gloops pick at random. */
  function chooseDir(G, g, tx, ty) {
    const M = G.maze, back = OPP[g.dir];
    let n = 0, only = null;
    for (const d of ORDER) { if (d === back) continue; const v = DIRS[d]; if (open(M, tx + v[0], ty + v[1])) { n++; only = d; } }
    if (!n) return back;
    if (n === 1) return only;
    if (g.fright && g.state === 'active') {
      let k = Math.floor(rnd(G) * n);
      for (const d of ORDER) { if (d === back) continue; const v = DIRS[d]; if (open(M, tx + v[0], ty + v[1]) && k-- === 0) return d; }
    }
    const t = targetOf(G, g);
    let best = only, bd = Infinity;
    for (const d of ORDER) {
      if (d === back) continue; const v = DIRS[d];
      if (!open(M, tx + v[0], ty + v[1])) continue;
      const ex = tx + v[0] - t[0], ey = ty + v[1] - t[1], dd = ex * ex + ey * ey;
      if (dd < bd - 1e-9) { bd = dd; best = d; }
    }
    return best;
  }
  /** Each Gloop's target tile right now: its personality. */
  function targetOf(G, g) {
    const M = G.maze;
    if (g.state === 'eyes' || g.state === 'entering') return [Math.floor(M.homeX), M.exitY];
    const corner = CONFIG.gloops[g.id].corner;
    if (isScatter(G) && !(g.id === 0 && elroyLevel(G) > 0)) return [corner[0], corner[1]];
    const m = G.munch, mx = wrapX(M, Math.round(m.x)), my = Math.round(m.y), v = DIRS[m.dir];
    switch (g.id) {
      case 0: return [mx, my];                                          // Zippy: straight at Munch
      case 1: return [mx + 4 * v[0], my + 4 * v[1]];                    // Sneaky: 4 tiles ahead of Munch
      case 2: {                                                          // Tricky: from Zippy through 2 ahead of Munch, doubled
        const z = G.gloops[0], zx = wrapX(M, Math.round(z.x)), zy = Math.round(z.y);
        const px = mx + 2 * v[0], py = my + 2 * v[1];
        return [2 * px - zx, 2 * py - zy];
      }
      default: {                                                         // Dozy: chases from far away, wanders home when close
        const d = G.gloops[g.id], ddx = wrapX(M, Math.round(d.x)) - mx, ddy = Math.round(d.y) - my;
        return ddx * ddx + ddy * ddy > 64 ? [mx, my] : [corner[0], corner[1]];
      }
    }
  }

  /* ---------- controls and test helpers ---------- */
  function input(G, dir) { if (DIRS[dir]) G.munch.next = dir; }
  function eatAllDots(G) {
    G.dots.fill(0); G.dotsLeft = 0;
    if (G.phase === 'play' || G.phase === 'ready') { G.phase = 'clear'; G.phaseT = 0; G.ev.push({ type: 'clear', level: G.level }); }
  }
  function placeMunch(G, x, y) { G.munch.x = x; G.munch.y = y; G.munch.next = null; }
  function gloopMode(G, g) {
    if (g.state === 'eyes' || g.state === 'entering') return 'eyes';

      case 'snack': sfx('powerup'); munchPop = 1; burst(e.x, e.y, 10, G.maze.colors.snack, 6, 2); spawn(3, e.x, e.y, 0, 0, 0.5, 0.6, CREAM); break;
      case 'eatGloop': Sound.gulp(e.chain); burst(e.x, e.y, 12, C('sky', 'light'), 6, 2); break;
      case 'fruitSpawn': Sound.ding(); spawn(3, G.maze.fruit.x, G.maze.fruit.y, 0, 0, 0.6, 0.6, CREAM); break;
      case 'fruit': sfx('coin'); popup(fmt(e.points), e.x, e.y, SPARK, 1.6, 0.85); burst(e.x, e.y, 10, SPARK, 5, 2); break;
      case 'fruitGone': burst(G.maze.fruit.x, G.maze.fruit.y, 6, CREAM, 3, 0); break;
      case 'extraLife': sfx('jump'); toast(TX.toastLife); break;
      case 'turn': if (!REDUCED) { const v = Engine.DIRS[G.munch.dir]; spawn(0, e.x - v[0] * 0.5, e.y - v[1] * 0.5 + 0.3, -v[0] * 1.5, -v[1] * 1.5 - 0.5, 0.35, 0.16, 'rgba(255,253,242,.45)'); } break;
      case 'caught': sfx('hit'); Sound.whoops(); if (!REDUCED) { try { Oomba.juice.shake(0.45, $('board')); } catch (err) { /* ignore */ } } break;
      case 'clear': sfx('win'); save.dots += G.maze.total; persist(); break;

}

function drawDemo(t) {

  if (UI.screen !== 'play' || UI.paused || Oomba.ui.open || e.target.closest('button,.pad')) return;
  if (G && G.phase === 'intermission') { skipCartoon(); return; }
  swipe = { id: e.pointerId, x: e.clientX, y: e.clientY };
});
addEventListener('pointermove', e => {
  if (!swipe || e.pointerId !== swipe.id) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < CONFIG.swipeMin) return;
  steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  swipe.x = e.clientX; swipe.y = e.clientY;   // keep sliding to steer again without lifting the finger
}, { passive: true });
const endSwipe = e => { if (swipe && e.pointerId === swipe.id) swipe = null; };
addEventListener('pointerup', endSwipe); addEventListener('pointercancel', endSwipe);
// D-pad (slide between the buttons without lifting); its pictures are the kit's arrow icons
const pad = $('pad');
for (const b of pad.querySelectorAll('[data-dir]')) b.innerHTML = Oomba.icon(b.dataset.dir);
let padDir = null, padPointer = null;
function setPad(dir) {
  if (dir === padDir) return;
  if (padDir) { const i = held.indexOf(padDir); if (i >= 0) held.splice(i, 1); }
  padDir = dir;
  for (const b of pad.querySelectorAll('[data-dir]')) b.classList.toggle('on', b.dataset.dir === dir);
  if (dir) { held.push(dir); steer(dir); }
}
pad.addEventListener('pointerdown', e => { const b = e.target.closest('[data-dir]'); e.preventDefault(); padPointer = e.pointerId; try { pad.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } setPad(b ? b.dataset.dir : null); });
pad.addEventListener('pointermove', e => {
  if (e.pointerId !== padPointer) return;
  const el = document.elementFromPoint(e.clientX, e.clientY), b = el && el.closest && el.closest('[data-dir]');
  if (b && b.parentElement === pad) setPad(b.dataset.dir);
});
const padUp = e => { if (e.pointerId === padPointer) { padPointer = null; setPad(null); } };
pad.addEventListener('pointerup', padUp); pad.addEventListener('pointercancel', padUp);
pad.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- buttons (the kit's: Ink-edged stickers with its icons) ---------- */
function syncMute() {
  const m = BRB.sfx.muted;
  for (const b of document.querySelectorAll('.mute')) { b.innerHTML = Oomba.icon(m ? 'mute' : 'sound'); b.setAttribute('aria-label', m ? TX.soundOn : TX.soundOff); }
}
function toggleMute() { BRB.sfx.mute(); if (BRB.sfx.muted) Sound.hum('', 0, 0); else sfx('click'); syncMute(); }
function syncPadToggles() {
  for (const id of ['padToggle', 'padToggle2']) { const b = $(id); if (!b) continue; b.setAttribute('aria-pressed', String(!!save.pad)); b.querySelector('span').textContent = save.pad ? TX.padOn : TX.padOff; }
}
function togglePad() { save.pad = !save.pad; save.padChosen = true; persist(); syncPadToggles(); sfx('select'); if (UI.screen !== 'title') layout(); }
$('pauseSlot').replaceWith(iconBtn(t('pause'), 'pause', () => { setPaused(true); const b = $('pauseBtn'); if (b) b.blur(); }, 'pauseBtn'));
$('muteSlot').replaceWith(muteButton());
{
  const again = Oomba.ui.button(t('playAgain'), { kind: 'hot', big: true, icon: 'restart', onPress: () => startGame(UI.mode) }); again.id = 'againBtn';
  const menu = Oomba.ui.button(t('menu'), { kind: 'quiet', icon: 'home', onPress: () => quitToTitle() }); menu.id = 'menuBtn';
  $('overBtns').append(again, menu);
  const m = muteButton(); m.style.cssText = 'position:absolute;top:10px;inset-inline-end:10px'; $('overScreen').querySelector('.ok-card').append(m);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && UI.screen === 'play' && G && !G.over) setPaused(true); });
addEventListener('resize', () => { if (UI.screen !== 'title') layout(); });
Oomba.theme.on('change', () => { hudCache.lives = -1; hudCache.fruitLevel = -1; });

/* =====================================================================================
   The main loop (requestAnimationFrame). The engine catches up in fixed steps; drawing uses real time.
   ===================================================================================== */
const GAPS = new Float32Array(600); let gapN = 0, lastNow = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const gap = lastNow ? now - lastNow : 16.7; lastNow = now;
  GAPS[gapN % GAPS.length] = gap; gapN++;
  const dt = Math.min(0.1, gap / 1000), t = now / 1000;
  if (UI.screen === 'title') { if (demo.isConnected) drawDemo(t); return; }
  if (!G) return;
  if (UI.screen === 'play' && !UI.paused && !UI.manual) {
    if (held.length) Engine.input(G, held[held.length - 1]);   // holding a key or button works like a joystick
    Engine.update(G, dt);
  }
  handleEvents();
  renderBoard(t, UI.paused ? 0 : dt);
  updateHud();
  updateHum(t);
}

/* ---------- Language: fill every fixed label once ---------- */
function applyLanguage() {
  try { document.documentElement.lang = LANG; } catch (e) { /* ignore */ }
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-ta]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.ta)); });
  // Right-to-left languages: cards and hints read right to left; the maze, the D-pad and the HUD keep their places.
  if (RTL) document.querySelectorAll('#overScreen .ok-card, #keysHint, .stat, #levelEl').forEach(el => { el.dir = 'rtl'; });
}
applyLanguage();
syncMute();
openTitle();
layout();
requestAnimationFrame(frame);

/* =====================================================================================
   window.__brbTest: hooks for automated play tests (harmless in production). Merged into the kit's hooks
   (setTheme, setLang, setTier ...): the game's own names below win and behave as before.
   Positions are in tiles (x = column, y = row; a whole number is the middle of a tile).
     state()            -> { screen, paused, mode, phase, level, score, high, lives, dotsLeft, totalDots, maze, mazeName,
                             munch: {x, y, dir, next, moving}, gloops: [{name, x, y, dir, mode: 'scatter'|'chase'|'frightened'|'eyes'|'house',
                             state, fright, target: [x, y], speed}], fruit: {kind, points, x, y, secondsLeft} | null,
                             fruitsSpawned, fruitsEaten, scatter, frightLeft, chain, extraGiven, over }
     start({ mode: 'classic'|'easy', seed, level, maze: 'mix'|'candy'|'mint'|'starry' }) -> state()
     input(dir)         -> buffer a turn: 'up' | 'down' | 'left' | 'right'
     step(ms)           -> advance the game exactly ms of game time (fixed steps), then state()
     manual(on = true)  -> stop real time; only step() moves the game (for exact tests)
     eatAllDots()       -> clear the maze (the level-clear sequence follows)
     placeMunch(x, y)   -> move Munch to a tile
     skipAnimations(on = true) -> no READY wait, no cartoons, instant catch / clear animations
     seed(n)            -> reset the game's random numbers (frightened wandering, fruit timers)
     maze()             -> the current maze as rows of text (# wall, . dot, o Super Snack, t tunnel, - door, _ house; eaten dots are spaces)
     frighten()         -> as if Munch ate a Super Snack;  setScore(n);  pause(on);  quit();  skipCartoon()
     placeGloop(nameOrIndex, x, y, dir) -> put a Gloop out in the maze at a tile, heading dir
     fps()              -> { median, worst, frames } rAF gaps in ms over the last ~600 frames
   ===================================================================================== */
window.__brbTest = Object.assign(window.__brbTest || {}, {
  state() {
    if (!G) return { screen: UI.screen, paused: false, mode: UI.mode, phase: null, level: 0, score: 0, high: save.best[UI.mode] || 0, lives: 0, dotsLeft: 0, munch: null, gloops: [], fruit: null, over: false };
    return {
      screen: UI.screen, paused: UI.paused, mode: G.mode, phase: G.phase, level: G.level, score: G.score, high: currentBest(), lives: G.lives,
      dotsLeft: G.dotsLeft, totalDots: G.maze.total, maze: G.maze.id, mazeName: G.maze.name,
      munch: { x: G.munch.x, y: G.munch.y, dir: G.munch.dir, next: G.munch.next, moving: G.munch.moving },
      gloops: G.gloops.map(g => ({ name: g.name, x: g.x, y: g.y, dir: g.dir, mode: Engine.gloopMode(G, g), state: g.state, fright: g.fright, target: Engine.targetOf(G, g), speed: Engine.gloopSpeed(G, g) * CONFIG.baseSpeed })),
      fruit: G.fruit ? { kind: G.fruit.id, points: G.fruit.points, x: G.fruit.x, y: G.fruit.y, secondsLeft: G.fruit.t } : null,
      fruitsSpawned: G.fruitsSpawned, fruitsEaten: G.fruitsEaten.map(k => CONFIG.fruits[k].id), scatter: Engine.isScatter(G), frightLeft: G.frightT,
      chain: G.chain, extraGiven: G.extraGiven, over: G.over, munchSpeed: Engine.munchSpeed(G) * CONFIG.baseSpeed
    };
  },
  start(opts) { opts = opts || {}; startGame(opts.mode, opts); return this.state(); },
  input(dir) { if (G) Engine.input(G, dir); return this.state(); },
  step(ms) { if (G) { Engine.advance(G, (+ms || 0) / 1000); handleEvents(); } return this.state(); },
  manual(on) { UI.manual = on !== false; return UI.manual; },
  eatAllDots() { if (G) { Engine.eatAllDots(G); handleEvents(); } return this.state(); },
  placeMunch(x, y) { if (G) Engine.placeMunch(G, +x, +y); return this.state(); },
  skipAnimations(on) { UI.fast = on !== false; if (G) { G.fast = UI.fast; if (UI.fast && G.phase === 'ready') G.phaseT = 0; } return UI.fast; },
  seed(n) { if (G) G.rs = (n >>> 0) || 1; return this.state(); },
  maze() {
    if (!G) return MAZES[0].rows.slice();
    const M = G.maze;
    return M.rows.map((r, y) => r.split('').map((ch, x) => (ch === '.' || ch === 'o') && !G.dots[y * M.W + x] ? ' ' : ch).join(''));
  },
  frighten() { if (G) Engine.frighten(G); return this.state(); },
  placeGloop(which, x, y, dir) {
    if (!G) return this.state();
    const g = typeof which === 'number' ? G.gloops[which] : G.gloops.find(q => q.name.toLowerCase() === String(which).toLowerCase());
    if (g) { g.x = +x; g.y = +y; g.state = 'active'; g.reverse = false; if (Engine.DIRS[dir]) g.dir = dir; }
    return this.state();
  },
  setScore(n) { if (G) G.score = Math.max(0, Math.floor(+n) || 0); return this.state(); },
  pause(on) { setPaused(on !== false); return this.state(); },
  quit() { quitToTitle(); return this.state(); },
  skipCartoon() { skipCartoon(); return this.state(); },
  fps() {
    const n = Math.min(gapN, GAPS.length), a = Array.from(GAPS.slice(0, n)).sort((x, y) => x - y);
    return { median: a[Math.floor(n / 2)] || 0, worst: a[n - 1] || 0, frames: n };
  },
  resetFps() { gapN = 0; lastNow = 0; },
  engine: Engine
});
</script>
