<title>Tug of Math</title>
<style>
/* Tug of Math on the Oomba Kit: two teams answer maths questions on their own keypads; every right answer pulls the
   rope one step to that side. Screens: the kit's title (the two crews already tugging behind it) -> the setup card
   (grade, players, the computer's level, time) -> 3, 2, 1 -> the match -> the kit's results card.
   Layout: landscape (smartboard, tablet on its side, desktop, a phone on its side) is Blue | tug | Red; a portrait
   phone or tablet stacks them, with Red's half turned round for the player across the table (two players) or a small
   card for the computer (vs Computer). Every key is at least 48px; colours come from the kit (--ok-*) plus the two
   team colours, and each team also has a shape and a name, so colour is never the only cue. */
html,body{height:100%}
html.tm-play .ok-hud{display:none!important}
body{margin:0;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.tm,.tm *,.tms,.tms *{box-sizing:border-box}
.tm{--blue:#0B6BB0;--blueTint:#D7EBFA;--red:#C8372D;--redTint:#FBE0DC;--good:#2FB774;--goodTint:#D8F5E4;--bad:#E8604C;--ink:#1D2340;--key:#FFFFFF;--keyEdge:#1D2340;
  --sky1:#BFE6FF;--sky2:#E8F6FF;--grass:#7CCB6B;--grass2:#5DAF55;--soil:#C9A36B;
  position:fixed;inset:0;display:flex;flex-direction:column;background:var(--ok-bg2);color:var(--ok-text);font-family:var(--ok-font,system-ui,sans-serif);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.ok-night .tm{--blueTint:#173A5C;--redTint:#55221E;--goodTint:#164A33;--sky1:#26305E;--sky2:#3B3F78;--grass:#2F7445;--grass2:#245C37;--soil:#6B5235;--key:#FFFDF2}
.tm button{font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tm svg{display:block}
.tm-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tm-field{flex:1;min-height:0;display:grid;gap:8px;padding:8px}
/* landscape: Blue | tug | Red */
.tm-field{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"blue mid red"}
.side{grid-area:blue;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:24px;border:3px solid var(--ok-edge);box-shadow:0 5px 0 var(--ok-edge);background:var(--blueTint)}
.side.red{grid-area:red;background:var(--redTint)}
.mid{grid-area:mid;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
.team{display:flex;align-items:center;justify-content:center;gap:8px;min-height:34px;padding:2px 12px;border-radius:999px;background:var(--blue);color:#fff;font-weight:800;font-size:1.05rem;flex:none;
  border:2.5px solid var(--ok-edge);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.red .team{background:var(--red)}
.team .shape{width:18px;height:18px;flex:none}
.qcard{position:relative;flex:0 1 auto;height:clamp(64px,19vh,170px);min-height:56px;border-radius:20px;background:var(--ok-card);color:var(--ok-text);border:3px solid var(--ok-edge);box-shadow:0 4px 0 var(--ok-edge);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 8px;overflow:hidden;transition:background .15s}
.qcard .q{font-weight:800;font-size:clamp(26px,min(4.2vw,6.4vh),64px);line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:center}
.qcard .q .x{font-style:italic;font-family:Georgia,'Times New Roman',serif;font-weight:700}
.qcard .q .box{display:inline-block;min-width:1.2em;height:1em;vertical-align:-.1em;border:3px dashed currentColor;border-radius:8px}
.qcard .sub{font-weight:700;font-size:clamp(14px,min(2vw,2.6vh),24px);opacity:.75;line-height:1.1}
.qcard.right{background:var(--goodTint)}
.qcard.wrong{background:var(--redTint);animation:tmShake .35s ease}
.arow{display:flex;gap:8px;flex:none}
.ans{flex:1;min-width:0;height:clamp(48px,7.5vh,72px);border-radius:16px;background:var(--ok-card);border:3px solid var(--ok-edge);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:clamp(26px,min(3.6vw,5.4vh),52px);font-variant-numeric:tabular-nums;color:var(--ok-text);overflow:hidden}
.ans:empty::after{content:'';width:3px;height:.9em;background:currentColor;opacity:.45;animation:tmBlink 1s steps(2) infinite}
.ans.ok{background:var(--good);color:#fff}
.ans.no{background:var(--bad);color:#fff}
.keys{display:grid;gap:8px;flex:1 1 auto;min-height:0;max-height:62vh;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(44px,1fr)}
.key{position:relative;min-width:0;min-height:44px;border:3px solid var(--keyEdge);border-radius:18px;background:var(--key);color:var(--ink);font-weight:800;font-size:clamp(24px,min(3vw,4.6vh),46px);
  box-shadow:0 5px 0 var(--keyEdge);display:flex;align-items:center;justify-content:center;padding:0;transition:transform 70ms ease-out,box-shadow 70ms ease-out;font-variant-numeric:tabular-nums}
.key svg{width:.9em;height:.9em}
.key.down,.key:active{transform:translateY(4px);box-shadow:0 1px 0 var(--keyEdge)}
.key[data-k="ok"]{background:var(--good);color:#fff}
.key[data-k="back"]{background:#EDE7D6}
.key[data-k="pm"]{flex:none;width:clamp(56px,7vw,96px);height:auto;font-size:clamp(22px,min(2.6vw,4vh),40px)}
.key[disabled]{opacity:.45;cursor:default}
.ok-night .tm .key[data-k="back"]{background:#D9D2BF}
.tm-field.done .keys,.tm-field.done .arow{opacity:.5;pointer-events:none}
.side.lock .keys{opacity:.6}
/* the computer's side: its question, its face and what it answers */
.bot{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800}
.bot canvas{width:auto;height:min(150px,90%);max-height:150px}
.think{display:flex;gap:6px}
.think i{width:12px;height:12px;border-radius:50%;background:var(--ok-text);opacity:.25;animation:tmDot 1.2s infinite}
.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
.think.off i{animation:none;opacity:.1}
/* the middle: time and pulls, then the tug */
.mbar{display:flex;align-items:center;gap:8px;flex:none}
.mbtn{flex:none;width:var(--bh);height:var(--bh);border-radius:16px;border:3px solid var(--ok-edge);background:var(--ok-card);color:var(--ok-text);box-shadow:0 4px 0 var(--ok-edge);display:grid;place-items:center;padding:0}
.mbtn svg{width:50%;height:50%}
.mbar{--bh:clamp(46px,6.4vh,84px)}
.mid{container-type:inline-size}
.board{flex:1;min-width:0;display:flex;align-items:stretch;justify-content:center;gap:6px;height:var(--bh)}
.board .pts{min-width:52px;border-radius:16px;border:3px solid var(--ok-edge);display:flex;align-items:center;justify-content:center;gap:4px;padding:0 8px;color:#fff;font-weight:900;font-size:clamp(1.3rem,3.6vh,2.6rem);font-variant-numeric:tabular-nums}
.board .pts svg{width:.55em;height:.55em}
.board .pb{background:var(--blue)}.board .pr{background:var(--red)}
.clock{min-width:78px;border-radius:16px;border:3px solid var(--ok-edge);background:var(--ok-card);display:flex;align-items:center;justify-content:center;gap:4px;padding:0 8px;font-weight:900;font-size:clamp(1.3rem,3.6vh,2.6rem);font-variant-numeric:tabular-nums}
.clock svg{width:.8em;height:.8em}
.clock.low{background:#FFE07A;color:#1D2340}
/* a narrow middle (a small window on its side): the score board on a row of its own, pause and new game under it */
@container (max-width:310px){.mbar{flex-wrap:wrap;justify-content:space-between;row-gap:6px}.board{order:-1;flex-basis:100%}.board .pts{min-width:44px}.clock{min-width:0}}
.scene{position:relative;flex:1 1 auto;min-height:96px;border-radius:24px;border:3px solid var(--ok-edge);overflow:hidden;box-shadow:0 5px 0 var(--ok-edge);container-type:size;background:var(--sky1)}
/* The tug's sizes, worked out inside the scene (cq units): --ch a figure's height (its width --cw is .8 of it), --gap
   from the flag to the first figure, --rs how far the rope reaches (in figure widths), and --S how far the whole tug
   moves at the line. The lines are drawn at 50% ± --S, and --S is kept small enough that the outer figure of the
   winning crew (leaning back: .12 of its height wider) stays inside the scene at the line (never slides out of the picture). A tall, narrow scene (the middle
   of a smartboard or a tablet) shows one big figure a side instead of two small ones, standing a little higher. */
.scene>*{--gy:72cqh;--ch:min(46cqh,22cqw);--cw:calc(var(--ch) * .8);--gap:2cqw;--rs:1.75;
  --S:clamp(8cqw,calc(46cqw - var(--gap) - var(--cw) * 1.55 - var(--ch) * .12),24cqw)}
@container (max-aspect-ratio:6/5){
  .scene>*{--gy:66cqh;--ch:min(40cqh,34cqw);--rs:1.2;--S:clamp(8cqw,calc(46cqw - var(--gap) - var(--cw) - var(--ch) * .12),24cqw)}
  .crew.cb canvas:nth-child(1),.crew.cr canvas:nth-child(2){display:none}
}
.scene .bg{position:absolute;inset:0;background:linear-gradient(var(--sky1),var(--sky2) var(--gy),var(--grass) var(--gy),var(--grass2))}
.scene .sun{position:absolute;right:8cqw;top:8cqh;width:min(16cqw,22cqh);aspect-ratio:1;border-radius:50%;background:#FFE07A;box-shadow:0 0 0 min(2cqw,3cqh) rgba(255,224,122,.35)}
.ok-night .tm .scene .sun{background:#F4F1E6;box-shadow:0 0 0 min(2cqw,3cqh) rgba(244,241,230,.18)}
.scene .cloud{position:absolute;height:min(7cqw,9cqh);aspect-ratio:3;border-radius:999px;background:rgba(255,255,255,.85);border:2px solid rgba(29,35,64,.25)}
.ok-night .tm .scene .cloud{background:rgba(255,255,255,.18)}
.scene .cloud.c1{left:7cqw;top:12cqh}.scene .cloud.c2{left:40cqw;top:26cqh;height:min(5cqw,7cqh)}
.scene .mark{position:absolute;top:var(--gy);bottom:0;width:0;border-inline-start:4px dashed rgba(29,35,64,.55)}
.scene .mark.c{left:50%;border-inline-start-style:solid;border-color:rgba(255,255,255,.8)}
.scene .mark.lb{left:calc(50% - var(--S));border-color:var(--blue)}.scene .mark.lr{left:calc(50% + var(--S));border-color:var(--red)}
.scene .mark.lb,.scene .mark.lr{border-inline-start-width:6px}
.scene .mark.lb,.scene .mark.lr,.scene .mark.c{margin-inline-start:-2px}
.tug{position:absolute;inset:0;transform:translateX(calc(var(--p,0) * -1 * var(--S)));transition:transform .35s cubic-bezier(.3,1.25,.5,1)}
.tug .rope{position:absolute;left:calc(50% - var(--gap) - var(--cw) * var(--rs));right:calc(50% - var(--gap) - var(--cw) * var(--rs));top:calc(var(--gy) - var(--ch) * .42);height:max(6px,1.4cqh);transform:translateY(-50%);visibility:hidden}
/* the loose ends' room: past the last puller on each side the rope hangs down and lies on the grass, like a real rope */
.tug .tail{position:absolute;top:calc(var(--gy) - var(--ch) * .42);width:min(calc(var(--ch) * .36),calc(50% - var(--gap) - var(--cw) * var(--rs) - 2cqw));height:calc(var(--ch) * .4);visibility:hidden}
.tug .tail.l{right:calc(50% + var(--gap) + var(--cw) * var(--rs))}
.tug .tail.r{left:calc(50% + var(--gap) + var(--cw) * var(--rs))}
/* the rope itself: one line (the middle and both loose ends), so there is no seam where it starts to droop */
.tug .ropeline{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.tug .ropeline path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.tug .ropeline .o{stroke:#6B4A1E}.tug .ropeline .i{stroke:#E9C178}.tug .ropeline .s{stroke:#B07A30;stroke-linecap:butt}
.tug .flag{position:absolute;left:50%;top:calc(var(--gy) - var(--ch) * .42 - var(--ch) * .36);width:4px;height:calc(var(--ch) * .38);margin-left:-2px;background:#1D2340;border-radius:2px}
.tug .flag::after{content:'';position:absolute;left:4px;top:0;width:calc(var(--ch) * .22);height:calc(var(--ch) * .15);background:#FFC83D;border:2px solid #1D2340;border-radius:0 6px 6px 0}
.crew{position:absolute;inset:0}
.crew canvas{position:absolute;top:calc(var(--gy) - var(--ch) * 1.02);height:var(--ch);width:auto;transform-origin:50% 100%}
.crew.cb canvas{transform:rotate(-8deg)}
.crew.cr canvas{transform:scaleX(-1) rotate(-8deg)}
/* the crews hold the rope near the flag (the losing crew is dragged over the middle, the winners walk back) */
.crew.cb canvas:nth-child(2){left:calc(50% - var(--gap) - var(--cw))}.crew.cb canvas:nth-child(1){left:calc(50% - var(--gap) - var(--cw) * 1.55)}
.crew.cr canvas:nth-child(1){right:calc(50% - var(--gap) - var(--cw));z-index:1}.crew.cr canvas:nth-child(2){right:calc(50% - var(--gap) - var(--cw) * 1.55)}
.crew.pull{animation:tmPullL .32s ease-out}
.crew.cr.pull{animation-name:tmPullR}
.say{flex:none;min-height:30px;margin:0;text-align:center;font-weight:800;font-size:clamp(15px,min(1.8vw,2.6vh),24px);line-height:1.2}
.banner{position:absolute;left:50%;top:10%;transform:translateX(-50%);max-width:92%;background:var(--ok-card);border:3px solid var(--ok-edge);border-radius:18px;padding:6px 16px;font-weight:900;
  font-size:clamp(18px,min(2.6vw,4vh),40px);text-align:center;box-shadow:0 4px 0 var(--ok-edge);pointer-events:none}
@keyframes tmShake{0%,100%{transform:translateX(0)}30%{transform:translateX(-7px)}70%{transform:translateX(6px)}}
@keyframes tmBlink{50%{opacity:0}}
@keyframes tmDot{0%,100%{opacity:.2;transform:none}50%{opacity:.9;transform:translateY(-4px)}}
@keyframes tmPullL{40%{transform:translateX(-2%)}}
@keyframes tmPullR{40%{transform:translateX(2%)}}
.tm.rm .tug{transition:transform .25s linear}
.tm.rm .crew.pull,.tm.rm .qcard.wrong,.tm.rm .think i,.tm.rm .ans:empty::after{animation:none}
.kbhint{display:none;text-align:center;font-size:.9rem;font-weight:700;opacity:.75;margin:0;flex:none}
@media (hover:hover) and (pointer:fine) and (min-height:700px) and (orientation:landscape){.kbhint{display:block}}

/* 4 keys a row: the digits keep the phone's order (1 2 3 / 4 5 6 / 7 8 9), with delete, 0 and the tick on the right */
@media (orientation:landscape) and (max-height:560px){
  .keys .key[data-k="4"],.keys .key[data-k="5"],.keys .key[data-k="6"]{order:2}.keys .key[data-k="0"]{order:3}
  .keys .key[data-k="7"],.keys .key[data-k="8"],.keys .key[data-k="9"]{order:4}.keys .key[data-k="ok"]{order:5}
  .keys .key[data-k="1"],.keys .key[data-k="2"],.keys .key[data-k="3"],.keys .key[data-k="back"]{order:1}
}
/* two players, short landscape (a phone on its side): one row less of keys */
@media (orientation:landscape) and (max-height:560px){
  .tm-field{gap:6px;padding:6px}
  .side{gap:6px;padding:6px;border-radius:18px}
  .team{min-height:28px;font-size:.92rem}
  .qcard{min-height:56px;border-radius:16px}
  .keys{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .key{border-radius:14px;font-size:24px}
  .ans{height:46px}
  .mbar{--bh:46px}
  .board .pts,.clock{font-size:1.3rem}
  .say{min-height:22px;font-size:15px}
}
/* portrait: stacked. Two players: Red's half turned round at the top; vs Computer: the computer's card on top */
@media (orientation:portrait){
  .tm-field{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"red" "mid" "blue";gap:6px;padding:6px}
  .tm-field.two .side.red{transform:rotate(180deg)}
  .tm-field.cpu{grid-template-rows:auto clamp(170px,30vh,330px) minmax(0,1fr)}
  .key{font-size:clamp(22px,min(5vw,3.6vh),44px)}
  .qcard .q{font-size:clamp(24px,min(7vw,4.6vh),60px)}
  .ans{font-size:clamp(24px,min(6vw,4vh),52px)}
  .mid{min-height:150px}
  .scene{min-height:70px}
  .tm-field.two .mid{height:clamp(150px,20vh,230px)}
  .side{gap:6px;padding:6px;border-radius:20px}
  .qcard{height:clamp(56px,9vh,120px)}
  .tm-field.two .keys{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;max-height:240px}
  .tm-field.cpu .side.red{flex-direction:row;align-items:stretch;flex-wrap:wrap}
  .tm-field.cpu .side.red .team{width:100%}
  .tm-field.cpu .side.red .qcard{flex:1 1 0;min-width:0;height:64px}
  .tm-field.cpu .side.red .bot{flex:0 0 auto;gap:4px}
  .tm-field.cpu .side.red .bot canvas{height:60px}
  .tm-field.cpu .side.red .arow{flex:0 0 26%}
  .tm-field.cpu .side.red .ans{height:64px}
}
@media (orientation:portrait) and (max-height:1000px){
  .tm-field.two .keys{gap:5px}
  .tm-field.two .key{font-size:24px;border-radius:14px}
  .tm-field.two .qcard{min-height:58px}
  .tm-field.two .ans{height:48px}
  .tm-field.two .team{min-height:28px;font-size:.92rem}
}
@media (orientation:portrait) and (max-height:800px){
  .tm-field.cpu .keys{grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
  .tm-field.cpu .key{font-size:24px;border-radius:14px}
  .tm-field.cpu{grid-template-rows:auto clamp(160px,34vh,330px) minmax(0,1fr)}
  /* question and answer side by side, then the keys fill all the height that is left (up to a comfortable size) */
  .tm-field.cpu .side.blue{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);align-content:start}
  .tm-field.cpu .side.blue>*{grid-column:1/-1}
  .tm-field.cpu .side.blue .qcard{grid-column:1;min-width:0;height:60px}
  .tm-field.cpu .side.blue .arow{grid-column:2;min-width:0}
  .tm-field.cpu .side.blue .ans{height:60px}
  .tm-field.cpu .side.blue .keys{height:100%;max-height:min(200px,calc((100vw - 40px) * .45));align-self:start}
  .tm-field.cpu .say{display:none}
}
@media (orientation:portrait) and (max-width:379px){.tm-field.two .keys{gap:3px}.tm-field.two .side{padding:5px 4px}}
/* portrait: the keypad always fits above the bottom edge, with room for the keys' shadow; on short screens the
   keys and the rope scene give up height first (keys stay at least 36px, a comfortable tap) */
@media (orientation:portrait){
  .tm-field{padding-bottom:14px}
  .tm-field .keys{grid-auto-rows:minmax(36px,1fr);max-height:none}
  .tm-field .key{min-height:36px}
}
@media (orientation:portrait) and (max-height:740px){
  .tm-field.two .mid{height:clamp(110px,17vh,150px);min-height:0}
  .tm-field.two .qcard{height:52px;min-height:0}
  .tm-field.two .ans{height:42px}
  .tm-field.two .side{gap:5px}
}
@media (orientation:portrait) and (max-height:600px){
  .tm-field.cpu{grid-template-rows:auto clamp(110px,24vh,170px) minmax(0,1fr)}
  .tm-field .mid{min-height:0}
  .tm-field.cpu .side.red .qcard,.tm-field.cpu .side.red .ans{height:50px}
  .tm-field.cpu .side.red .bot canvas{height:46px}
  .tm-field.cpu .side.blue .qcard,.tm-field.cpu .side.blue .ans{height:50px}
  .tm-field .team{min-height:26px;font-size:.9rem}
  .tm-field.two .mid{height:clamp(84px,15vh,110px)}
  .tm-field.two .qcard{height:42px}
  .tm-field.two .qcard .q{font-size:24px}
  .tm-field.two .ans{height:36px;font-size:24px}
  .tm-field.two .team{min-height:24px}
  .tm-field.two .side{gap:4px;padding:4px}
  .tm-field.two .keys{gap:4px}
  .tm-field.two{gap:4px}
}
@media (orientation:portrait) and (max-height:520px){.tm-field.two .keys{grid-auto-rows:minmax(30px,1fr)}.tm-field.two .key{min-height:30px;font-size:20px}.tm-field.two .mid{height:76px}}

/* ---------- the setup card ---------- */
.tms{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));background:var(--ok-scrim)}
.tms-card{width:min(760px,100%);max-height:100%;overflow:auto;background:var(--ok-card);color:var(--ok-text);border:3px solid var(--ok-edge);border-radius:28px;box-shadow:0 6px 0 var(--ok-edge);
  padding:14px 16px 16px;display:grid;gap:10px;grid-template-columns:minmax(0,1fr);font-family:var(--ok-font,system-ui,sans-serif)}
.tms h2{margin:0;text-align:center;font-size:clamp(1.4rem,4vmin,2rem);line-height:1.1}
.tms fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:6px}
.tms legend{padding:0;font-weight:800;font-size:1rem;margin-bottom:4px}

      var go = function () { var left = Math.ceil((e.at - L.now()) / 1000); if (phase !== 'countdown') { overlay(phase === 'paused' ? t('paused') : ''); return; } overlay(left > 0 ? String(left) : t('go')); if (left > 0) setTimeout(go, 200); };
      go(); if (!host) sfx('count', { volume: 0.4 });
    });
    L.on('start', function () { overlay(''); draw(); if (!host) L.send('need', null, { toHost: true }); announce(t('pull')); });
    // (a player who came back during the pause gets their question now: the server sends none while paused)
    L.on('resume', function () { draw(); if (!host && !myQ) L.send('need', null, { toHost: true }); });
    L.on('state', onState);
    L.on('teams', draw); L.on('join', draw); L.on('leave', draw); L.on('update', draw); L.on('names', draw);
    L.on('welcome', function () { phase = L.phase; draw(); if (!host && (phase === 'playing' || phase === 'paused')) L.send('need', null, { toHost: true }); });
    L.on('event', function (ev) {
      if (host || ev.from !== 0) return;
      if (ev.kind === 'tq') onQuestion(ev.data);
      else if (ev.kind === 'tr' && ev.data) result(ev.data);
    });
    L.on('end', function () { phase = 'ended'; overlay(''); draw(); });
    L.ready({ lobby: true, hostView: true, teams: true, words: ['ans', 'need'] });
    draw(); requestAnimationFrame(tick);

    O.test({
      state: function () {
        var x = tug();
        return { tugLive: true, role: L.role, phase: phase, started: L.started, team: myTeam(), tug: x,
          question: myQ ? { i: myQ.i, e: myQ.e.slice(), text: qText({ e: myQ.e }), locked: lock } : null, typed: (neg ? '-' : '') + typed,
          minusKey: !host && P && !P.pm.hidden, right: myRight, answered: myN, banner: host ? !H.banner.hidden : null };
      },
      start: function () { return true; },
    });
    // the e2e test types like a player: the digits, then Enter
    window.__brbTest.answer = function (v) {
      if (host || !myQ || lock) return false;
      typed = String(Math.abs(Math.round(+v || 0))); neg = +v < 0; showTyped(); liveSubmit(); return true;
    };
    window.__brbTest.press = function (k) { livePress(String(k)); return true; };
  }
  // (the scripts run in the head: the live view goes in once there is a body)
  if (LIVE) { if (document.body) liveGame(); else document.addEventListener('DOMContentLoaded', liveGame); }

  /* ---------- test hooks (the covers, the e2e tests, the playtest) ---------- */
  function testState() {
    return { tug: true, screen: setupOpen ? 'setup' : M ? (M.running ? 'play' : 'end') : 'none', mode: M ? (M.two ? 'two' : 'cpu') : CFG.mode, grade: M ? M.grade : CFG.grade, diff: CFG.diff, len: CFG.len,
      rope: M ? M.pos : 0, line: M ? M.line : 0, scores: M ? [M.p[0].right, M.p[1].right] : [0, 0], answered: M ? [M.p[0].n, M.p[1].n] : [0, 0],
      q: M ? { A: M.p[0].q && { text: qText(M.p[0].q), k: M.p[0].q.k }, B: M.p[1].q && { text: qText(M.p[1].q), k: M.p[1].q.k } } : null,
      typed: M ? [M.p[0].typed, M.p[1].typed] : null, timeLeft: M ? Math.round(M.left * 10) / 10 : null, winner: lastResult ? lastResult.winner : null, result: lastResult, minusKey: !!(D && !D.side[0].pm.hidden && M), saved: load() };
  }
  if (!LIVE) Object.assign(window.__brbTest, {
    setup: function (o) { o = o || {}; if (o.grade) CFG.grade = G.grade(o.grade); if (o.mode) CFG.mode = o.mode === 'two' ? 'two' : 'cpu'; if (DIFFS.indexOf(o.diff) >= 0) CFG.diff = o.diff; if (o.len != null && LENS.indexOf(+o.len) >= 0) CFG.len = +o.len; return testState(); },
    start: function (o) { if (o) window.__brbTest.setup(o); if (o && o.seed != null) pendingSeed = +o.seed; lastResult = null; if (setupApi) setupApi.close(); game.start(); return testState(); },
    state: function () { return Object.assign(game ? {} : {}, testState()); },
    answer: function (side, v) { if (!M) return false; var s = side ? 1 : 0, P = M.p[s]; if (P.lock) return false; P.typed = String(Math.abs(v)); P.neg = v < 0; showAnswer(s); submit(s); return true; },
    answerOf: function (side) { var P = M && M.p[side ? 1 : 0]; return P && P.q ? P.q.a : null; },
    solve: function (side) { if (!M) return false; var s = side ? 1 : 0, P = M.p[s]; if (!P.q || P.lock) return false; return window.__brbTest.answer(s, P.q.a); },
    press: function (side, k) { press(side ? 1 : 0, String(k)); return testState(); },
    setTime: function (s) { if (M) M.left = Math.max(0, +s || 0); return testState(); },
    skipAnimations: function () { fastEnd = true; return true; },
    gen: function (grade, n) { var d = G.deck(grade, 7), out = []; for (var i = 0; i < (n || 10); i++) out.push(qText(d.next(i % 2))); return out; },
    unlock: function () { if (M) [0, 1].forEach(function (s) { if (M.p[s].lock) next(s); }); return true; },
  });
})();
</script>
