<title>Tug of Math</title>
<style>
/* Tug of Math in the look of the classroom dashboard's widgets (as Crossword): cream cards with a group color on the top
   edge and the icon chip, the schedule's dark "Now" bar for the score strip, a dotted mint board under everything,
   Bricolage Grotesque, light and dark (BRB.theme). Two teams answer maths questions on their own keypads; every right
   answer pulls the rope one step to that side. Screens: the setup card (grade, players, the computer's level, time) ->
   3, 2, 1 -> the match -> the results card; pause (P, Esc or the pause button) opens its own card.
   Layout: landscape (smartboard, tablet on its side, desktop, a phone on its side) is Blue | tug | Red; a portrait
   phone or tablet stacks them, with Red's half turned round for the player across the table (two players) or a small
   card for the computer (vs Computer). Every key is at least 44px (36px on the shortest portrait screens); each team
   has a color, a shape and a name, so color is never the only cue. */
@font-face{font-family:"Bricolage Grotesque";src:url(/vendor/oomba-classroom/1.0.0/fonts/bricolage-latin.woff2) format("woff2");font-weight:200 800;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Bricolage Grotesque";src:url(/vendor/oomba-classroom/1.0.0/fonts/bricolage-latin-ext.woff2) format("woff2");font-weight:200 800;font-display:swap;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
/* the classroom dashboard's tokens (Crossword's): cream cards on a dotted mint board */
:root{--paper:#E1F1E1;--dots:#66C792;--card:#FFFDF2;--card2:#F9F6EB;--hover:#EFEBDC;--ink:#141414;--line:#E2DDCB;--muted:#5B584F;
  --green:#1F9D63;--on-green:#fff;--accent:#66C792;--mint-t:#E1F1E1;--current:#141414;--on-current:#FFFDF2;
  --coral:#C8432F;--coral-t:#FBE0DA;--spark:#FFD23F;--focus:#2563EB;--g-class:#66C792;
  --blue:#0B6BB0;--blueTint:#DCEDF7;--red:#C8372D;--redTint:#FBE0DA;--good:#1F9D63;--goodTint:#DDF1E4;--bad:#C8432F;
  --scrim:rgba(20,20,20,.38);--shadow:0 1px 0 rgba(20,20,20,.04),0 4px 16px rgba(20,20,20,.06);--r:20px;--r-sm:12px;
  --font:'Bricolage Grotesque',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
:root[data-theme="dark"]{--paper:#141414;--dots:#2E5A41;--card:#1E1E1B;--card2:#262622;--hover:#2C2C27;--ink:#FFFDF2;--line:#36352F;--muted:#B8B3A1;
  --green:#66C792;--on-green:#10261A;--mint-t:#1F3A2B;--current:#66C792;--on-current:#141414;--coral:#FF8A7D;--coral-t:#4A2420;--focus:#8AB4FF;
  --blue:#2F8FD8;--blueTint:#1B3342;--red:#E0574A;--redTint:#4A2420;--good:#66C792;--goodTint:#1F3A2B;--bad:#FF8A7D;
  --scrim:rgba(0,0,0,.55);--shadow:0 1px 0 rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.32);color-scheme:dark}
html,body{height:100%}
html,body{margin:0;background-color:var(--paper);background-image:radial-gradient(var(--dots) 1.5px,transparent 1.6px);background-size:22px 22px;color:var(--ink);font-family:var(--font);line-height:1.3;-webkit-text-size-adjust:100%}
body{overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.tm,.tm *,.tms,.tms *,.tmo,.tmo *,.tm-head,.tm-head *{box-sizing:border-box}
:where(.tm,.tms,.tmo,.tm-head) button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:where(.tm,.tms,.tmo,.tm-head) button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.tm svg{display:block}
.tm-sr,.tl-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* the page head (the setup card's screen): the logo and the sound button, as Crossword's */
.tm-head{position:fixed;left:0;right:0;top:0;z-index:25;display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 6px;max-width:1100px;margin:0 auto}
html.tm-play .tm-head{display:none}
.tm-logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0;font-weight:800;font-size:1.25em;letter-spacing:-.01em}
.tm-logo svg{width:36px;height:36px;flex:none}
.tm-icon{width:46px;height:46px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:1.15em;flex:none}

/* a widget: the dashboard's card, its color on the top edge and the icon chip only (never on text) */
.tw{--g:var(--g-class);background:var(--card);color:var(--ink);border-radius:var(--r);
  box-shadow:inset 0 4px 0 color-mix(in srgb,var(--g) 75%,var(--card)),0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent),var(--shadow)}
.tw-chip{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--g) 26%,var(--card));font-size:1.3rem;line-height:1}
.tw-chip svg{width:22px;height:22px}
.tw-wh{display:flex;align-items:center;gap:10px;min-width:0}
.tw-wh h2{flex:1;min-width:0;margin:0;font-size:1.3rem;font-weight:800;line-height:1.15;overflow-wrap:anywhere}

/* buttons: Crossword's pills (ink edge on a cream card; the main one green, a chosen one dark) */
.tb{min-height:48px;padding:6px 18px;border-radius:999px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.1;overflow-wrap:anywhere}
.tb:hover{background:var(--card2)}
.tb:active{transform:translateY(1px)}
.tb svg{width:1.15em;height:1.15em;flex:none}
.tb.go{background:var(--green);border-color:var(--green);color:var(--on-green)}
.tb.go:hover{filter:brightness(1.05)}
.tb.quiet{border-color:var(--line)}
.tb.main{width:100%;min-height:56px;font-size:1.12em}
/* an on/off switch (sound, less motion): a pill with a small track */
.tsw{justify-content:space-between;gap:12px;border-color:var(--line)}
.tsw i{position:relative;flex:none;width:40px;height:24px;border-radius:999px;background:var(--line);transition:background .15s}
.tsw i::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.tsw[aria-checked="true"] i{background:var(--green)}
.tsw[aria-checked="true"] i::after{transform:translateX(16px)}
[dir="rtl"] .tsw[aria-checked="true"] i::after{transform:translateX(-16px)}
[dir="rtl"] .tsw i::after{left:auto;right:3px}

/* ---------- the match ---------- */
html.tm-play .tm-head{display:none}
.tm{position:fixed;inset:0;display:flex;flex-direction:column;background:transparent;color:var(--ink);font-family:var(--font);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.tm-field{flex:1;min-height:0;display:grid;gap:10px;padding:10px}
/* landscape: Blue | tug | Red */
.tm-field{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"blue mid red"}
.side{--g:var(--blue);grid-area:blue;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;padding:12px 10px 10px;border-radius:var(--r);background:var(--card);
  box-shadow:inset 0 5px 0 var(--g),0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent),var(--shadow)}
.side.red{--g:var(--red);grid-area:red}
.mid{grid-area:mid;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
/* a team's widget head: its shape in the icon chip, its name */
.team{display:flex;align-items:center;gap:8px;min-height:34px;flex:none;font-weight:800;font-size:1.05rem;color:var(--ink);white-space:nowrap;overflow:hidden}
.team .tchip{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--g) 24%,var(--card));color:var(--g)}
.team .shape{width:18px;height:18px;flex:none}
.team .tn{min-width:0;overflow:hidden;text-overflow:ellipsis}
.qcard{position:relative;flex:0 1 auto;height:clamp(64px,19vh,170px);min-height:56px;border-radius:var(--r-sm);background:var(--card2);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 8px;overflow:hidden;transition:background .15s}
.qcard .q{font-weight:800;font-size:clamp(26px,min(4.2vw,6.4vh),64px);line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:-.01em}
.qcard .q .x{font-style:italic;font-family:Georgia,'Times New Roman',serif;font-weight:700}
.qcard .q .box{display:inline-block;min-width:1.2em;height:1em;vertical-align:-.1em;border:3px dashed currentColor;border-radius:8px}
.qcard .sub{font-weight:700;font-size:clamp(14px,min(2vw,2.6vh),24px);color:var(--muted);line-height:1.1}
.qcard.right{background:var(--goodTint)}
.qcard.wrong{background:var(--redTint);animation:tmShake .35s ease}
.tm-field.counting .qcard .q,.tm-field.counting .qcard .sub{visibility:hidden}
.arow{display:flex;gap:8px;flex:none}
.ans{flex:1;min-width:0;height:clamp(48px,7.5vh,72px);border-radius:var(--r-sm);background:var(--card);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:clamp(26px,min(3.6vw,5.4vh),52px);font-variant-numeric:tabular-nums;color:var(--ink);overflow:hidden}
.ans:empty::after{content:'';width:3px;height:.9em;background:currentColor;opacity:.45;animation:tmBlink 1s steps(2) infinite}
.ans.ok{background:var(--good);border-color:var(--good);color:var(--on-green)}
.ans.no{background:var(--bad);border-color:var(--bad);color:#fff}
:root[data-theme="dark"] .ans.no{color:#2A100C}
.keys{display:grid;gap:8px;flex:1 1 auto;min-height:0;max-height:62vh;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(44px,1fr)}
/* a key: Crossword's button (an ink edge on the cream card), squared off a little for a keypad */
.key{position:relative;min-width:0;min-height:44px;border:2px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);font-weight:800;font-size:clamp(24px,min(3vw,4.6vh),46px);
  display:flex;align-items:center;justify-content:center;padding:0;transition:transform 70ms ease-out,background 70ms ease-out;font-variant-numeric:tabular-nums}
.key svg{width:.9em;height:.9em}
.key:hover{background:var(--card2)}
.key.down,.key:active{transform:translateY(1px);background:var(--hover)}
.key[data-k="ok"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.key[data-k="ok"].down,.key[data-k="ok"]:active{filter:brightness(.92)}
.key[data-k="back"]{background:var(--card2);border-color:var(--line)}
.key[data-k="pm"]{flex:none;width:clamp(56px,7vw,96px);height:auto;font-size:clamp(22px,min(2.6vw,4vh),40px)}
.key[disabled]{opacity:.45;cursor:default}
.tm-field.done .keys,.tm-field.done .arow{opacity:.5;pointer-events:none}
.side.lock .keys{opacity:.6}
/* the computer's side: its question, its face and what it answers */
.bot{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800}
.bot canvas{width:auto;height:min(150px,90%);max-height:150px}
.think{display:flex;gap:6px}
.think i{width:12px;height:12px;border-radius:50%;background:var(--ink);opacity:.25;animation:tmDot 1.2s infinite}
.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
.think.off i{animation:none;opacity:.1}
/* the middle: the dark Now bar (pause, the two scores and the clock, new game), then the tug on the board */
.mbar{display:flex;align-items:center;gap:8px;flex:none;padding:6px;border-radius:var(--r-sm);background:var(--current);color:var(--on-current)}
.mbtn{flex:none;width:var(--bh);height:var(--bh);border-radius:50%;border:2px solid color-mix(in srgb,var(--on-current) 40%,transparent);background:transparent;color:var(--on-current);display:grid;place-items:center;padding:0}
.mbtn:hover{background:color-mix(in srgb,var(--on-current) 14%,transparent)}
.mbtn svg{width:46%;height:46%}
.mbar{--bh:clamp(44px,6.4vh,84px)}
.mid{container-type:inline-size}
.board{flex:1;min-width:0;display:flex;align-items:stretch;justify-content:center;gap:6px;height:var(--bh)}
.board .pts{min-width:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 12px;color:#fff;font-weight:800;font-size:clamp(1.3rem,3.6vh,2.6rem);font-variant-numeric:tabular-nums}
.board .pts svg{width:.55em;height:.55em}
.board .pb{background:var(--blue)}.board .pr{background:var(--red)}
.clock{min-width:78px;border-radius:999px;background:transparent;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 8px;font-weight:800;font-size:clamp(1.3rem,3.6vh,2.6rem);font-variant-numeric:tabular-nums}
.clock svg{width:.8em;height:.8em}
.clock.low{background:var(--spark);color:#141414}
/* a narrow middle (a small window on its side): the score board on a row of its own, pause and new game under it */
@container (max-width:310px){.mbar{flex-wrap:wrap;justify-content:space-between;row-gap:6px}.board{order:-1;flex-basis:100%}.board .pts{min-width:44px}.clock{min-width:0}}
/* the tug: a cream frame round a patch of the dotted board, a floor band, the middle line and each team's line */
.scene{position:relative;flex:1 1 auto;min-height:96px;border-radius:var(--r);overflow:hidden;container-type:size;background:var(--card);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent),var(--shadow)}
/* The tug's sizes, worked out inside the scene (cq units): --ch a figure's height (its width --cw is .8 of it), --gap
   from the flag to the first figure, --rs how far the rope reaches (in figure widths), and --S how far the whole tug
   moves at the line. The lines are drawn at 50% ± --S, and --S is kept small enough that the outer figure of the
   winning crew (leaning back: .12 of its height wider) stays inside the scene at the line (never slides out of the picture). A tall, narrow scene (the middle
   of a smartboard or a tablet) shows one big figure a side instead of two small ones, standing a little higher. */
.scene>*{--gy:74cqh;--ch:min(46cqh,22cqw);--cw:calc(var(--ch) * .8);--gap:2cqw;--rs:1.75;
  --S:clamp(8cqw,calc(46cqw - var(--gap) - var(--cw) * 1.55 - var(--ch) * .12),24cqw)}
@container (max-aspect-ratio:6/5){
  .scene>*{--gy:68cqh;--ch:min(40cqh,34cqw);--rs:1.2;--S:clamp(8cqw,calc(46cqw - var(--gap) - var(--cw) - var(--ch) * .12),24cqw)}
  .crew.cb canvas:nth-child(1),.crew.cr canvas:nth-child(2){display:none}
}
.scene .bg{position:absolute;inset:6px;border-radius:calc(var(--r) - 6px);background-color:var(--paper);background-image:radial-gradient(var(--dots) 1.5px,transparent 1.6px);background-size:22px 22px;background-position:center}
/* the floor: a band of the board a shade deeper, with an ink edge the figures stand on */
.scene .floor{position:absolute;left:6px;right:6px;bottom:6px;top:var(--gy);border-radius:0 0 calc(var(--r) - 6px) calc(var(--r) - 6px);border-top:3px solid color-mix(in srgb,var(--ink) 55%,transparent);
  background:color-mix(in srgb,var(--accent) 22%,transparent)}
/* (the board's two halves: a tint of each team's color, so the side the flag is on reads at a glance) */
.scene .half{position:absolute;top:6px;bottom:6px;width:calc(50% - 6px);opacity:.5}
.scene .half.hb{left:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--blue) 20%,transparent),transparent 70%);border-radius:calc(var(--r) - 6px) 0 0 calc(var(--r) - 6px)}
.scene .half.hr{right:6px;background:linear-gradient(270deg,color-mix(in srgb,var(--red) 20%,transparent),transparent 70%);border-radius:0 calc(var(--r) - 6px) calc(var(--r) - 6px) 0}
.scene .mark{position:absolute;top:12%;bottom:6px;width:0;border-inline-start:3px dashed color-mix(in srgb,var(--ink) 45%,transparent)}
.scene .mark.c{left:50%;border-inline-start-style:solid;border-color:var(--ink);opacity:.55}
.scene .mark.lb{left:calc(50% - var(--S));border-color:var(--blue)}.scene .mark.lr{left:calc(50% + var(--S));border-color:var(--red)}
.scene .mark.lb,.scene .mark.lr{border-inline-start-width:5px}
.scene .mark.lb,.scene .mark.lr,.scene .mark.c{margin-inline-start:-2px}
/* each team's line has its shape at the top, so the two lines differ by more than their color */
.scene .mark .shape{position:absolute;top:-4px;left:50%;width:min(5cqh,22px);height:min(5cqh,22px);transform:translate(-50%,-100%)}
.scene .mark.lb .shape{color:var(--blue)}.scene .mark.lr .shape{color:var(--red)}
.tug{position:absolute;inset:0;transform:translateX(calc(var(--p,0) * -1 * var(--S)));transition:transform .35s cubic-bezier(.3,1.25,.5,1)}
.tug .rope{position:absolute;left:calc(50% - var(--gap) - var(--cw) * var(--rs));right:calc(50% - var(--gap) - var(--cw) * var(--rs));top:calc(var(--gy) - var(--ch) * .42);height:max(6px,1.4cqh);transform:translateY(-50%);visibility:hidden}
/* the loose ends' room: past the last puller on each side the rope hangs down and lies on the floor, like a real rope */
.tug .tail{position:absolute;top:calc(var(--gy) - var(--ch) * .42);width:min(calc(var(--ch) * .36),calc(50% - var(--gap) - var(--cw) * var(--rs) - 2cqw));height:calc(var(--ch) * .4);visibility:hidden}
.tug .tail.l{right:calc(50% + var(--gap) + var(--cw) * var(--rs))}
.tug .tail.r{left:calc(50% + var(--gap) + var(--cw) * var(--rs))}
/* the rope itself: one line (the middle and both loose ends), so there is no seam where it starts to droop */
.tug .ropeline{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.tug .ropeline path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.tug .ropeline .o{stroke:#5A3D17}.tug .ropeline .i{stroke:#E9C178}.tug .ropeline .s{stroke:#B07A30;stroke-linecap:butt}
.tug .flag{position:absolute;left:50%;top:calc(var(--gy) - var(--ch) * .42 - var(--ch) * .36);width:4px;height:calc(var(--ch) * .38);margin-left:-2px;background:var(--ink);border-radius:2px}
.tug .flag::after{content:'';position:absolute;left:4px;top:0;width:calc(var(--ch) * .22);height:calc(var(--ch) * .15);background:var(--spark);border:2px solid var(--ink);border-radius:0 6px 6px 0}
.crew{position:absolute;inset:0}
.crew canvas{position:absolute;top:calc(var(--gy) - var(--ch) * 1.02);height:var(--ch);width:auto;transform-origin:50% 100%}
.crew.cb canvas{transform:rotate(-8deg)}
.crew.cr canvas{transform:scaleX(-1) rotate(-8deg)}
/* the crews hold the rope near the flag (the losing crew is dragged over the middle, the winners walk back) */
.crew.cb canvas:nth-child(2){left:calc(50% - var(--gap) - var(--cw))}.crew.cb canvas:nth-child(1){left:calc(50% - var(--gap) - var(--cw) * 1.55)}
.crew.cr canvas:nth-child(1){right:calc(50% - var(--gap) - var(--cw));z-index:1}.crew.cr canvas:nth-child(2){right:calc(50% - var(--gap) - var(--cw) * 1.55)}
.crew.pull{animation:tmPullL .32s ease-out}
.crew.cr.pull{animation-name:tmPullR}
.say{flex:none;min-height:30px;margin:0;text-align:center;font-weight:700;color:var(--muted);font-size:clamp(15px,min(1.8vw,2.6vh),24px);line-height:1.2}
/* the winner: the dark Now block over the board */
.banner{position:absolute;left:50%;top:9%;transform:translateX(-50%);max-width:92%;background:var(--current);color:var(--on-current);border-radius:var(--r-sm);padding:8px 18px;font-weight:800;
  font-size:clamp(18px,min(2.6vw,4vh),40px);text-align:center;box-shadow:var(--shadow);pointer-events:none}
@keyframes tmShake{0%,100%{transform:translateX(0)}30%{transform:translateX(-7px)}70%{transform:translateX(6px)}}
@keyframes tmBlink{50%{opacity:0}}
@keyframes tmDot{0%,100%{opacity:.2;transform:none}50%{opacity:.9;transform:translateY(-4px)}}
@keyframes tmPullL{40%{transform:translateX(-2%)}}
@keyframes tmPullR{40%{transform:translateX(2%)}}
.tm.rm .tug{transition:transform .25s linear}
.tm.rm .crew.pull,.tm.rm .qcard.wrong,.tm.rm .think i,.tm.rm .ans:empty::after{animation:none}
.kbhint{display:none;text-align:center;font-size:.9rem;font-weight:600;color:var(--muted);margin:0;flex:none}

    var rsz = 0; window.addEventListener('resize', function () { clearTimeout(rsz); rsz = setTimeout(draw, 120); });
    L.on('phase', function (e) {
      phase = e.phase;
      if (phase === 'paused') { overlay(t('paused')); }
      draw();
    });
    L.on('countdown', function (e) {
      var go = function () { var left = Math.ceil((e.at - L.now()) / 1000); if (phase !== 'countdown') { overlay(phase === 'paused' ? t('paused') : ''); return; } overlay(left > 0 ? String(left) : t('go')); if (left > 0) setTimeout(go, 200); };
      go(); if (!host) sfx('count', { volume: 0.4 });
    });
    L.on('start', function () { overlay(''); draw(); if (!host) L.send('need', null, { toHost: true }); announce(t('pull')); });
    // (a player who came back during the pause gets their question now: the server sends none while paused)
    L.on('resume', function () { draw(); if (!host && !myQ) L.send('need', null, { toHost: true }); });
    L.on('state', onState);
    L.on('teams', draw); L.on('join', draw); L.on('leave', draw); L.on('update', draw); L.on('names', draw);
    L.on('welcome', function () { phase = L.phase; draw(); if (!host && (phase === 'playing' || phase === 'paused')) L.send('need', null, { toHost: true }); });
    L.on('event', function (ev) {
      if (host || ev.from !== 0) return;
      if (ev.kind === 'tq') onQuestion(ev.data);
      else if (ev.kind === 'tr' && ev.data) result(ev.data);
    });
    L.on('end', function () { phase = 'ended'; overlay(''); draw(); });
    L.ready({ lobby: true, hostView: true, teams: true, words: ['ans', 'need'] });
    draw(); requestAnimationFrame(tick);

    O.test({
      state: function () {
        var x = tug();
        return { tugLive: true, role: L.role, phase: phase, started: L.started, team: myTeam(), tug: x,
          question: myQ ? { i: myQ.i, e: myQ.e.slice(), text: qText({ e: myQ.e }), locked: lock } : null, typed: (neg ? '-' : '') + typed,
          minusKey: !host && P && !P.pm.hidden, right: myRight, answered: myN, banner: host ? !H.banner.hidden : null };
      },
      start: function () { return true; },
    });
    // the e2e test types like a player: the digits, then Enter
    window.__brbTest.answer = function (v) {
      if (host || !myQ || lock) return false;
      typed = String(Math.abs(Math.round(+v || 0))); neg = +v < 0; showTyped(); liveSubmit(); return true;
    };
    window.__brbTest.press = function (k) { livePress(String(k)); return true; };
  }
  // (the scripts run in the head: the live view goes in once there is a body)
  if (LIVE) { if (document.body) liveGame(); else document.addEventListener('DOMContentLoaded', liveGame); }

  /* ---------- test hooks (the covers, the e2e tests, the playtest) ---------- */
  function testState() {
    return { tug: true, screen: setupOpen ? 'setup' : M ? (M.counting ? 'count' : M.running ? 'play' : 'end') : 'none', paused: paused, results: !!(OV && OV.classList.contains('tmr')), mode: M ? (M.two ? 'two' : 'cpu') : CFG.mode, grade: M ? M.grade : CFG.grade, diff: CFG.diff, len: CFG.len,
      rope: M ? M.pos : 0, line: M ? M.line : 0, scores: M ? [M.p[0].right, M.p[1].right] : [0, 0], answered: M ? [M.p[0].n, M.p[1].n] : [0, 0],
      q: M ? { A: M.p[0].q && { text: qText(M.p[0].q), k: M.p[0].q.k }, B: M.p[1].q && { text: qText(M.p[1].q), k: M.p[1].q.k } } : null,
      typed: M ? [M.p[0].typed, M.p[1].typed] : null, timeLeft: M ? Math.round(M.left * 10) / 10 : null, winner: lastResult ? lastResult.winner : null, result: lastResult, minusKey: !!(D && !D.side[0].pm.hidden && M), saved: load() };
  }
  if (!LIVE) {
    try { O.test({ state: testState }); } catch (e) { /* no kit test hooks */ }
    if (!window.__brbTest || typeof window.__brbTest !== 'object') window.__brbTest = {};
  }
  if (!LIVE) Object.assign(window.__brbTest, {
    setup: function (o) { o = o || {}; if (o.grade) CFG.grade = G.grade(o.grade); if (o.mode) CFG.mode = o.mode === 'two' ? 'two' : 'cpu'; if (DIFFS.indexOf(o.diff) >= 0) CFG.diff = o.diff; if (o.len != null && LENS.indexOf(+o.len) >= 0) CFG.len = +o.len; return testState(); },
    start: function (o) { if (o) window.__brbTest.setup(o); if (o && o.seed != null) pendingSeed = +o.seed; lastResult = null; if (setupOpen && setupApi) setupApi.close(); else startMatch(); return testState(); },
    state: function () { return testState(); },
    pause: function () { pause(); return testState(); },
    resume: function () { resume(); return testState(); },
    answer: function (side, v) { if (!M || !M.running) return false; var s = side ? 1 : 0, P = M.p[s]; if (P.lock) return false; P.typed = String(Math.abs(v)); P.neg = v < 0; showAnswer(s); submit(s); return true; },
    answerOf: function (side) { var P = M && M.p[side ? 1 : 0]; return P && P.q ? P.q.a : null; },
    solve: function (side) { if (!M) return false; var s = side ? 1 : 0, P = M.p[s]; if (!P.q || P.lock) return false; return window.__brbTest.answer(s, P.q.a); },
    press: function (side, k) { press(side ? 1 : 0, String(k)); return testState(); },
    setTime: function (s) { if (M) M.left = Math.max(0, +s || 0); return testState(); },
    skipAnimations: function () { fastEnd = true; return true; },
    gen: function (grade, n) { var d = G.deck(grade, 7), out = []; for (var i = 0; i < (n || 10); i++) out.push(qText(d.next(i % 2))); return out; },
    unlock: function () { if (M) [0, 1].forEach(function (s) { if (M.p[s].lock) next(s); }); return true; },
  });
})();
</script>
