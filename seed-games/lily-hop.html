<title>Lily Hop</title>
<!-- Lily Hop: Number Quest Launchpad Unit 2, The Joining Pond (kindergarten to grade 1, ages 5-7). A calm pond on
     Oomba3D 1.2.0 in the Sky Islands theme, with the sea: the helper hops across lily pads to the pad with the
     answer. Three chapters of six rounds, one per course step:
       join   (2.1) two groups of frogs come together (3 and 2 make 5), then some hop away (5 take away 2 is 3), to 10;
       apart  (2.2) number partners: one number split two ways (5 is 2 and 3, 5 is 1 and 4), then what makes 10 with 7;
       twenty (2.3) a number line of pads: start on 8, hop on 5; over ten by making ten first, forward and back to 20,
                    and one round that turns the two numbers round (5 and 8 is the same as 8 and 5).
     Made for a child who cannot read yet: every instruction is short, shown and spoken (BRB.speak, the shared path;
     the speaker button says it again), the numbers are big, and everything is done by tapping a pad or a big number
     button. No timer, no lives, no fail state: a wrong pad wobbles and the helper gives a spoken hint, then another try.
     Lesson mode: BRB.params { chapter: join | apart | twenty, lock: 1 } opens that chapter only; finishing its six
     rounds reports game over, won, once (the course step's completion signal). With no parameters the game offers the
     three chapters from a picture menu. Saves only which chapters are finished (BRB.storage 'lily-hop-v1'). The import
     map below is exactly kit2ImportMap() (server/services/vendor.js); tests/unit/lily-hop.test.js fails if a library
     bump leaves it behind. English only, like Number Quest's other lesson games. Test handle: window.__lh (also
     window.__brbTest, the name the picture scripts wait for). -->

/* ===== Lily Hop's rounds: plain data and functions (no DOM, no 3D), so tests/unit/lily-hop.test.js can run this
   block on its own. A round is made from its chapter, its number (1-6) and the lap (0 the first time through, so
   the first six rounds are always the same; a replay gets new numbers). Every round ends in three number pads:
   the answer and two numbers near it, smallest first. ===== */

  function choices(r, answer, lo, hi) {

  var JOIN = [[2, 4], [4, 6], [6, 8], [8, 10]], AWAY = [{ a: [4, 6], b: [1, 2] }, { a: [7, 10], b: [2, 5] }];
  // apart: rounds 1 and 2 split the same number (4-6) two different ways, round 3 splits a bigger one (7-9); rounds
  // 4-6 ask what makes 10 with a number that is near ten, then in the middle, then small.
  var SPLIT = [7, 9], TEN = [[7, 9], [4, 6], [1, 3]];

    var ci = CHAPTERS.indexOf(chapter);
    if (ci < 0 || !(n >= 1 && n <= ROUNDS)) return null;
    lap = lap || 0;
    var r = rng((ci + 1) * 7919 + n * 104729 + lap * 1299709), out = { chapter: chapter, n: n };
    if (chapter === 'join') {
      if (n <= 4) { var t = pick(r, JOIN[n - 1][0], JOIN[n - 1][1]); out.kind = 'join'; out.a = pick(r, 1, t - 1); out.b = t - out.a; out.answer = t; out.choices = choices(r, t, 1, 10); }
      else { var w = AWAY[n - 5]; out.kind = 'away'; out.a = pick(r, w.a[0], w.a[1]); out.b = pick(r, w.b[0], Math.min(w.b[1], out.a - 1)); out.answer = out.a - out.b; out.choices = choices(r, out.answer, 0, 10); }
    } else if (chapter === 'apart') {
      if (n <= 2) {
        // the same whole in rounds 1 and 2 (made from the lap alone), and two different pairs of partners for it
        var r0 = rng((ci + 1) * 7919 + lap * 1299709 + 17), whole = pick(r0, 4, 6), parts = [];
        for (var p = 1; p <= whole / 2; p++) parts.push(p);
        for (var i = parts.length - 1; i > 0; i--) { var j = Math.floor(r0() * (i + 1)), s = parts[i]; parts[i] = parts[j]; parts[j] = s; }
        out.kind = 'split'; out.whole = whole; out.a = r() < 0.5 ? parts[n - 1] : whole - parts[n - 1];
      } else if (n === 3) { out.kind = 'split'; out.whole = pick(r, SPLIT[0], SPLIT[1]); out.a = pick(r, 2, out.whole - 2); }
      else { out.kind = 'ten'; out.whole = 10; out.a = pick(r, TEN[n - 4][0], TEN[n - 4][1]); }
      out.b = out.whole - out.a; out.answer = out.b; out.choices = choices(r, out.b, 1, out.kind === 'ten' ? 9 : out.whole);
    } else {
      // twenty: 1 ten and some more; 2 over ten; 3 round 2 turned round; 4 back inside the teens; 5 back over ten; 6 over ten again
      out.kind = 'hop'; out.op = n === 4 || n === 5 ? 'sub' : 'add';

const targets = [];   // { at: () => Vector3, r: world radius, go }
g.renderer.domElement.addEventListener('pointerdown', ev => {
  const cam = g.camera, r = g.renderer.domElement.getBoundingClientRect(), v = V3(0, 0, 0), right = V3(1, 0, 0).applyQuaternion(cam.quaternion);
  const px = p => { v.copy(p).project(cam); return [(v.x + 1) / 2 * r.width + r.left, (1 - v.y) / 2 * r.height + r.top]; };
  let best = null, bd = 1e9;
  for (const t of targets) {
    const p = t.at(), [sx, sy] = px(p), [ex, ey] = px(p.clone().addScaledVector(right, t.r));
    const reach = Math.max(24, Math.hypot(ex - sx, ey - sy) * 1.15), dist = Math.hypot(sx - ev.clientX, sy - ev.clientY);
    if (dist <= reach && dist < bd) { bd = dist; best = t; }
  }
  if (best) best.go();
});

/* ---------- the helper ---------- */
let lineup = [];
async function showHeroes() {
  S.screen = 'hero';
  const L = LAY.heroes();
  if (!lineup.length) lineup = await Promise.all(HEROES.map(id => g.hero(id, { x: 0, y: TOP, z: 0 })));
  clearStage();
  lineup.forEach((h, i) => { h.object.visible = true; h.object.scale.setScalar(1); h.position.set(L.spots[i][0], TOP, L.spots[i][1]); h.object.rotation.y = 0; h.play(i % 2 ? 'wave' : 'idle'); put(pad(L.spots[i][0], L.spots[i][1], 2.3)); });
  lineup.forEach(h => targets.push({ at: () => h.position.clone().setY(1.4), r: 1.2, go: () => chooseHero(h.id) }));
  Object.assign(view, { rect: L.rect, high: L.high, back: tall ? -6 : -8 });
  card('pick', { title: fmt('title'), line: 'hero.pick', buttons: lineup.map(h => ({ id: 'hero-' + h.id, label: h.name, go: () => chooseHero(h.id) })) });
  frame();
}
function chooseHero(id) {
  if (S.screen !== 'hero') return;
  S.hero = lineup.find(h => h.id === id);
  for (const h of lineup) if (h !== S.hero) h.object.visible = false;
  sfx('coin');
  if (P.chapter) startChapter(P.chapter); else showMenu();
}
let heroBack = 0;
function heroMove(move, ms = 1500) {
  const h = S.hero; if (!h || reduced) return;
  h.play(move, { once: true }); clearTimeout(heroBack); heroBack = setTimeout(() => h.play('idle'), ms);
}
function placeHero(at, scale = 0.82) { const h = S.hero; if (!h) return; pathId++; drop(h.object); h.object.scale.setScalar(scale); h.position.set(at[0], TOP, at[1]); h.object.rotation.y = 0; }
/** The helper hops from pad to pad along `points` ([x, z] each), turning to face the way it goes; `each(i)` after
 *  every landing, `done()` after the last. With reduced motion it is simply there. */
let pathId = 0;
function heroPath(points, { each, done } = {}) {
  const h = S.hero; if (!h) { if (done) done(); return; }
  const id = ++pathId; let i = 0;
  const step = () => {
    if (id !== pathId) return;
    if (i >= points.length) { h.object.rotation.y = 0; if (!reduced) { clearTimeout(heroBack); h.play('idle'); } if (done) done(); return; }
    const to = points[i++], dx = to[0] - h.position.x, dz = to[1] - h.position.z;
    if (!reduced && !S.fast) { if (Math.abs(dx) + Math.abs(dz) > 0.01) h.object.rotation.y = Math.atan2(dx, dz); clearTimeout(heroBack); h.play('jump', { once: true, fade: 0.05 }); sfx('jump'); }
    fly(h.object, V3(to[0], TOP, to[1]), { dur: 0.36, arc: 0.9, then: () => { if (id !== pathId) return; if (!reduced && !S.fast) h.play('jumpLand', { once: true, fade: 0.05 }); if (each) each(i); step(); } });
  };
  step();
}

/* ---------- cards: the helper picker, the picture menu, the end of a chapter ---------- */
function button({ id, label, icon, big, cls, go, aria }) {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'lh-btn' + (cls ? ' ' + cls : ''); if (id) b.id = id;
  if (icon) { const i = document.createElement('span'); i.className = 'i'; i.setAttribute('aria-hidden', 'true'); i.textContent = icon; b.append(i); }
  if (big != null) { const n = document.createElement('span'); n.className = 'big'; n.textContent = big; b.append(n); }
  if (label && big == null) { const l = document.createElement('span'); l.className = 'l'; l.textContent = label; b.append(l); }
  b.setAttribute('aria-label', aria || label || String(big));
  b.addEventListener('click', () => go(b));
  return b;
}
function card(kind, { title, line, buttons, star }) {
  el.bar.hidden = true; el.sum.hidden = true; el.dots.hidden = true; el.ask.hidden = true; hint();
  const top = document.createElement('div'), row = document.createElement('div');
  if (star) { const s = document.createElement('div'); s.className = 'lh-star'; s.setAttribute('aria-hidden', 'true'); s.textContent = '⭐'; top.append(s); }
  const h = document.createElement('h1'); h.textContent = title; top.append(h);
  const a = document.createElement('div'); a.className = 'lh-ask'; a.style.display = 'inline-flex';
  const sb = document.createElement('button'); sb.type = 'button'; sb.className = 'lh-say'; sb.textContent = '🔊'; sb.setAttribute('aria-label', fmt('btn.say'));
  sb.addEventListener('click', () => speak(line, null, { auto: false }));
  const t = document.createElement('span'); t.className = 'lh-askt'; t.textContent = fmt(line); a.append(sb, t); top.append(a);
  row.className = kind === 'menu' ? 'lh-menu' : 'lh-pick'; row.append(...buttons.map(button));
  el.card.className = 'lh-card';
  el.card.replaceChildren(top, row); el.card.hidden = false;
  S.line = [line, null]; speak(line);
}
/** The helper alone on one pad, with a flower: the menu and the end of a chapter. */
function solo() {
  clearStage(); put(pad(0, 0, 3)); put(flower(-0.95, 0.5)); put(flower(1, -0.3));
  placeHero([0, 0], 1); Object.assign(view, { ...LAY.solo(), back: tall ? -7 : -8 });
}
function showMenu() {
  clearTimers(); S.screen = 'menu'; S.chapter = ''; S.phase = 'idle'; solo();
  if (S.hero) S.hero.play('wave');
  card('menu', { title: fmt('title'), line: 'menu.pick', buttons: LH.CHAPTERS.map(c => ({ id: 'ch-' + c, icon: ICON[c] + (S.done[c] ? '⭐' : ''), label: fmt('ch.' + c), go: () => startChapter(c) })) });
  frame();
}

/* ---------- a chapter: six rounds ---------- */
function startChapter(chapter) {
  if (!LH.CHAPTERS.includes(chapter)) return showMenu();
  S.chapter = chapter; S.round = 0; S.screen = 'play'; el.card.hidden = true; el.card.replaceChildren();
  if (S.hero) S.hero.play('idle');
  nextRound();
}
function dots() {
  el.dots.replaceChildren(...Array.from({ length: LH.ROUNDS }, (_, i) => { const d = document.createElement('i'); if (i < S.round - 1) d.className = 'on'; else if (i === S.round - 1) d.className = 'now'; return d; }));
  el.dots.setAttribute('aria-label', fmt('round', { n: S.round, m: LH.ROUNDS })); el.dots.hidden = false;
}
const ASK = { join: 'join.ask', away: 'away.ask', split: 'split.ask', ten: 'ten.ask' };
/** The sum for the round: with "?" where the answer goes while it is asked, the number once it is found. */
function showSum(R, found) {
  const q = found ? R.answer : '?';
  if (R.kind === 'join') sum('show.join', { a: R.a, b: R.b, c: q });
  else if (R.kind === 'away') sum('show.away', { a: R.a, b: R.b, c: q });
  else if (R.kind === 'split') sum('show.split', { n: R.whole, a: R.a, b: q });
  else if (R.kind === 'ten') sum('show.ten', { a: R.a, b: q });
  else sum('show.' + R.op, { a: R.a, b: R.b, c: q });
}
function nextRound() {
  clearTimers();
  if (S.round >= LH.ROUNDS) return finish();
  S.round++; S.R = LH.round(S.chapter, S.round, S.lap); S.phase = 'play'; S.at = 'home'; S.shown = false;
  const R = S.R;
  hint(); dots(); showSum(R, false);
  say(R.kind === 'hop' ? R.op + '.ask' : ASK[R.kind], { a: R.a, b: R.b, n: R.whole });   // the words first: the camera fits the pond under them
  redraw(); frame();
}
/** The round is right: cheer and say what is true, then the next round (or the end). */
function right(key, vars, ms, then) {
  sfx('cheer');
  showSum(S.R, true); say(key, vars, { queue: true });
  if (then) then();
  later(ms, nextRound);
}
function finish() {
  S.screen = 'end'; S.phase = 'idle'; S.done[S.chapter] = true; store();
  // The course step's completion signal: once for each chapter finished, never before its sixth round is right.
  S.reported++;
  try { if (window.BRB && BRB.gameOver) BRB.gameOver({ won: true }); } catch (e) { /* no page */ }
  solo();
  g.celebrate(S.hero, '');   // the cheer and the confetti; the words are on the card
  const buttons = [{ id: 'again', icon: '🔁', label: fmt('btn.again'), cls: 'go', go: () => { S.lap++; startChapter(S.chapter); } }];
  if (!S.lock) buttons.push({ id: 'menu', icon: '🐸', label: fmt('btn.menu'), go: showMenu });
  card('end', { title: fmt('win'), line: 'win.card', buttons, star: true });
  frame();
}

/** Draw the round from its state (also after the screen turns): the pads, the frogs, the helper, the buttons. */
function redraw() {
  if (S.screen === 'hero') return void showHeroes();
  if (S.screen === 'menu' || S.screen === 'end') { solo(); return void frame(); }
  if (S.screen !== 'play' || !S.R) return void frame();
  const keys = el.bar.contains(document.activeElement);
  clearStage();
  const R = S.R, L = S.L = R.kind === 'hop' ? LAY.line(R) : LAY.frogs();
  Object.assign(view, { rect: L.rect, high: L.high, back: R.kind === 'hop' ? (tall ? 4 : 2) : (tall ? -3 : -5) });
  el.card.hidden = true; el.bar.hidden = false;
  if (R.kind === 'hop') drawLine(R, L); else drawFrogs(R, L);
  el.bar.replaceChildren(...R.choices.map(v => button({ id: 'lh-n' + v, big: v, aria: fmt('btn.pad', { n: v }), cls: S.phase === 'right' && v === R.answer ? 'go' : '', go: b => answer(v, b) })));
  if (keys) { const b = el.bar.querySelector('button'); if (b) b.focus(); }   // a keyboard player stays on the buttons
  S.shown = true;
}
const HINT = R => (R.kind === 'hop' ? R.op + '.hint' + (R.cross ? '.ten' : '') : R.kind + '.hint');
/** The child picks a number: a tap on a pad in the pond or on a big number button. */
function answer(v, b) {
  if (S.phase !== 'play') return;
  const R = S.R;
  if (v !== R.answer) {
    wobble(b || document.getElementById('lh-n' + v)); dip(S.pads[v]);
    // the helper tries the pad and hops back (the frog pads); on the number line it stays where it is
    if (R.kind !== 'hop' && S.L.ans[R.choices.indexOf(v)]) heroPath([S.L.ans[R.choices.indexOf(v)], S.L.home]);
    return hint(HINT(R), { a: R.a });
  }
  S.phase = 'right'; S.at = v; hint(); sfx('coin');
  const btn = document.getElementById('lh-n' + v); if (btn) btn.classList.add('go');
  retone(S.signs[v], 'green');
  if (R.kind === 'hop') return hopHome(R);
  heroPath([S.L.ans[R.choices.indexOf(v)]], { done: () => heroMove('cheer', 1600) });
  if (R.kind === 'join') { S.frogsB.forEach((f, i) => fly(f, slot(S.L.A, R.a + i), { dur: 0.5 + i * 0.05, arc: 1.3 })); right('join.sum', { a: R.a, b: R.b, c: R.answer }, 3000); }
  else if (R.kind === 'away') right('away.sum', { a: R.a, b: R.b, c: R.answer }, 3000);
  else if (R.kind === 'split') right('split.sum', { n: R.whole, a: R.a, b: R.b }, R.n === 2 ? 5600 : 3000, () => { if (R.n === 2) speak('split.ways', { n: R.whole }, { queue: true }); });
  else { for (let i = R.a; i < 10; i++) { const f = put(frog('orange')); f.position.copy(slot(S.L.A, i)); pop(f); } right('ten.sum', { a: R.a, b: R.b }, 3000); }
}

/* ----- chapters 1 and 2, the frog pads: two groups come together, some hop away, a number splits, what makes ten ----- */
function drawFrogs(R, L) {
  const found = S.phase === 'right', first = !S.shown && !reduced;
  put(pad(L.A[0], L.A[1], 4.9, 2.9));
  if (R.kind === 'join' || R.kind === 'split') put(pad(L.B[0], L.B[1], 4.9, 2.9));
  if (R.kind === 'ten') for (let i = 0; i < 10; i++) { const p = slot(L.A, i), m = new THREE.Mesh(GEO.disc, M.spot); m.scale.set(0.62, 0.03, 0.62); m.position.set(p.x, TOP + 0.015, p.z); put(m); }
  const sit = (kind, at) => { const f = put(frog(kind)); f.position.copy(at); return f; };
  const stay = R.kind === 'away' ? R.answer : R.a;
  for (let i = 0; i < stay; i++) sit('blue', slot(L.A, i));
  S.frogsB = [];
  if (R.kind === 'join') for (let i = 0; i < R.b; i++) S.frogsB.push(sit('orange', found ? slot(L.A, R.a + i) : slot(L.B, i)));
  else if (R.kind === 'split') {
    // the whole number sits together, then the orange frogs hop across to their own pad
    for (let i = 0; i < R.b; i++) { const f = sit('orange', first ? slot(L.A, R.a + i) : slot(L.B, i)); if (first) later(700 + i * 120, () => fly(f, slot(L.B, i), { arc: 1.3, dur: 0.55 })); }
  } else if (R.kind === 'away') {
    // the frogs that hop away swim off beside the pad: still in sight, no longer on it
    for (let i = 0; i < R.b; i++) {
      const to = V3(L.swim[0] + (i % 3 - 1) * 1.0 + (tall ? 0 : 0.6), -0.3, L.swim[1] + Math.floor(i / 3) * 0.95 - 0.4), f = sit('blue', first ? slot(L.A, stay + i) : to);
      f.rotation.y = 2.4;
      if (first) later(700 + i * 160, () => { sfx('jump'); fly(f, to, { arc: 1.5, dur: 0.6 }); });
    }
  } else if (found) for (let i = R.a; i < 10; i++) sit('orange', slot(L.A, i));
  // the helper's pad and the three number pads, each with its number floating over it
  put(pad(L.home[0], L.home[1], 2.1)); put(flower(L.home[0] - 0.7, L.home[1] + 0.45));
  R.choices.forEach((v, i) => {
    const at = L.ans[i]; S.pads[v] = put(pad(at[0], at[1], 2.2));
    const s = S.signs[v] = put(sign(v, 1.45, found && v === R.answer ? 'green' : 'cream')); s.position.set(at[0], 2.95, at[1]);
    targets.push({ at: () => V3(at[0], 0.3, at[1]), r: 1.2, go: () => answer(v) }, { at: () => V3(at[0], 2.95, at[1]), r: 0.8, go: () => answer(v) });
  });
  placeHero(found ? L.ans[R.choices.indexOf(R.answer)] : L.home);
}

/* ----- chapter 3, the number line: start on a pad, hop on or hop back, over ten by way of ten ----- */
function drawLine(R, L) {
  const found = S.phase === 'right';
  for (let v = L.lo; v <= L.hi; v++) {
    const x = L.x(v); S.pads[v] = put(pad(x, L.z, 1.16));
    const s = S.signs[v] = put(sign(v, tall ? 1.2 : 1.06, found && v === R.answer ? 'green' : v === R.a ? 'gold' : 'cream')); s.position.set(x, 0.42, L.z + 0.86);
    if (v !== R.a) targets.push({ at: () => V3(x, 0.3, L.z + 0.4), r: 0.62, go: () => answer(v) });
  }
  if (L.lo <= 10 && L.hi >= 10) { const f = flagT.clone(true); f.scale.setScalar(1.5); f.position.set(L.x(10) + 0.38, TOP, L.z - 0.38); f.rotation.y = -0.5; put(f); }   // ten: the pad with the flag
  // loose lily pads and flowers on the water behind the line (nothing to tap: the pond is not bare)
  const w = L.x(L.hi) - L.x(L.lo);
  for (const [fx, dz, size, bloom] of [[-0.42, -2.6, 1.5, 1], [-0.12, -3.9, 1.1, 0], [0.2, -2.9, 1.7, 1], [0.47, -4.3, 1.3, 1], [-0.3, -5.2, 1.2, 0], [0.05, -5.6, 0.9, 0]]) {
    put(pad(fx * w, L.z + dz, size)); if (bloom) put(flower(fx * w + size * 0.2, L.z + dz + size * 0.15)).scale.setScalar(1.5);
  }
  for (const [fx, dz, kind] of [[-0.42, -2.75, 'orange'], [0.2, -3.1, 'blue']]) { const f = put(frog(kind)); f.position.set(fx * w - 0.25, TOP, L.z + dz); f.rotation.y = fx > 0 ? -0.5 : 0.5; }
  placeHero([L.x(found ? R.answer : R.a), L.z]);
}
/** The right pad on the number line: the helper hops there one pad at a time. Over ten, it stops on 10 and the sum
 *  is said in two steps (8 and 2 make 10; 3 more makes 13), then whole. */
function hopHome(R) {
  const dir = R.op === 'add' ? 1 : -1, way = (from, to) => { const p = []; for (let v = from + dir; dir > 0 ? v <= to : v >= to; v += dir) p.push([S.L.x(v), S.L.z]); return p; };
  const whole = () => right(R.op + '.sum', { a: R.a, b: R.b, c: R.answer }, R.turn ? 6200 : 3200, () => { heroMove('cheer', 1600); if (R.turn) speak('add.turn', { a: R.a, b: R.b }, { queue: true }); });
  if (!R.cross) return heroPath(way(R.a, R.answer), { done: whole }), undefined;
  const first = Math.abs(10 - R.a), rest = R.b - first;
  sum('show.' + R.op, { a: R.a, b: first, c: 10 }); say(R.op + '.ten', { a: R.a, b: first });
  heroPath(way(R.a, 10));
  later(first * 380 + 2300, () => {
    sum('show.' + R.op, { a: 10, b: rest, c: R.answer }); say(R.op + '.more', { b: rest, c: R.answer }, { queue: true });
    heroPath(way(10, R.answer));
    later(rest * 380 + 2500, whole);
  });
}

/* ---------- the test handle: what the round asks and what is on screen (tests, covers, slide pictures) ---------- */
window.__lh = window.__brbTest = {
  state: () => ({ game: 'lily-hop', screen: S.screen, chapter: S.chapter, lock: S.lock, round: S.round, rounds: LH.ROUNDS, phase: S.phase, at: S.at, hero: S.hero ? S.hero.id : null,
    reported: S.reported, tall, ...(S.R && S.screen === 'play' ? { kind: S.R.kind, a: S.R.a, b: S.R.b, whole: S.R.whole, op: S.R.op, cross: S.R.cross, turn: S.R.turn, answer: S.R.answer, choices: S.R.choices, pads: Object.keys(S.pads).map(Number) } : {}) }),
  fast: on => { S.fast = on !== false; },
  hero: id => chooseHero(id || HEROES[0]),
  act: (name, arg) => (name === 'answer' ? answer(arg) : undefined),
  /** The helper's place: [x, how far above its pad, z]. */
  heroAt: () => (S.hero ? [+S.hero.position.x.toFixed(2), +(S.hero.position.y - TOP).toFixed(2), +S.hero.position.z.toFixed(2)] : null),
  /** Where a pad is on the screen (CSS pixels), for a test that taps the pond itself. */
  spot: v => { const p = S.pads[v]; if (!p) return null; const q = p.position.clone().setY(0.3).project(g.camera), r = g.renderer.domElement.getBoundingClientRect(); return [(q.x + 1) / 2 * r.width + r.left, (1 - q.y) / 2 * r.height + r.top]; },
};

el.load.hidden = true; el.load.remove(); el.lh.hidden = false;
await showHeroes();
window.__ready = true;
</script>
