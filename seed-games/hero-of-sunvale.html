<title>Hero of Sunvale</title>
<style>
/* ===== Hero of Sunvale: one full-screen 3D canvas, a DOM HUD on top, overlay screens and touch controls. ===== */
:root{--ink:#1d2340;--soft:#55607a;--panel:rgba(255,255,255,.93);--gold:#ffbf1f;--gold-dark:#c98a00;--pink:#ff5c9e;--pink-dark:#c23a74;
  --blue:#3e7bfa;--blue-dark:#2350b8;--green:#3fb950;--green-dark:#25803a;--plum:#4a2f6b;--r:22px;
  --font:ui-rounded,"Arial Rounded MT Bold","Nunito",system-ui,"Segoe UI",sans-serif;
  --st:max(10px,env(safe-area-inset-top));--sl:max(10px,env(safe-area-inset-left));--sr:max(10px,env(safe-area-inset-right));--sb:max(12px,env(safe-area-inset-bottom))}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#9fd8ff;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{margin:0;font-family:var(--font);color:var(--ink)}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:4px solid #fff;outline-offset:2px;box-shadow:0 0 0 7px var(--blue)}
kbd{display:inline-block;min-width:26px;padding:3px 7px;border-radius:8px;background:var(--ink);color:#fff;font:800 15px/1.2 var(--font);text-align:center}
.fade{position:fixed;inset:0;background:#10142a;opacity:0;pointer-events:none;transition:opacity .25s linear;z-index:30}
.fade.on{opacity:1}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;background:radial-gradient(ellipse at center,rgba(255,60,60,0) 55%,rgba(255,40,40,.55) 100%);transition:opacity .5s ease-out}
.world-ui{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.wtag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:rgba(20,26,56,.72);color:#fff;font:800 15px/1.2 var(--font);padding:4px 10px;border-radius:999px;white-space:nowrap}
.wpop{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font:900 24px/1 var(--font);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 10px rgba(255,210,80,.8);white-space:nowrap}
/* HUD */
.hud{position:fixed;top:var(--st);left:var(--sl);right:var(--sr);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:5;direction:ltr}
.hud-l{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0;max-width:52vw}
.vitals{display:flex;align-items:center;gap:8px}
.hearts{width:190px;height:38px;display:block;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.potion{pointer-events:auto;position:relative;width:52px;height:52px;flex:none;border-radius:50%;border:0;background:var(--panel);font-size:26px;line-height:1;box-shadow:0 4px 0 rgba(0,0,0,.2);display:grid;place-items:center;padding:0}
.potion b{position:absolute;right:-4px;bottom:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--pink);color:#fff;font:900 14px/22px var(--font);padding:0 5px}
.potion.none{filter:grayscale(.8);opacity:.75}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--panel);font:800 16px/1 var(--font);padding:7px 11px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.15);white-space:nowrap}
.tracker{pointer-events:auto;display:flex;flex-direction:column;align-items:flex-start;text-align:start;gap:2px;max-width:min(46vw,340px);border:0;border-radius:16px;background:rgba(255,255,255,.9);box-shadow:0 4px 0 rgba(0,0,0,.15);padding:9px 13px;font-family:var(--font)}
.trk-t{font:900 14px/1.2 var(--font);color:var(--gold-dark);text-transform:uppercase;letter-spacing:.3px}
.trk-o{font:800 16px/1.25 var(--font)}
.trk-d{font:700 14px/1.2 var(--font);color:var(--soft)}
.hud-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ibtns{display:flex;gap:8px}
.ibtn{pointer-events:auto;width:48px;height:48px;flex:none;border-radius:50%;border:0;background:var(--panel);font-size:22px;line-height:1;box-shadow:0 4px 0 rgba(0,0,0,.2);display:grid;place-items:center;padding:0}
.ibtn:active,.potion:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.minimap{pointer-events:auto;width:112px;height:112px;border-radius:50%;border:4px solid rgba(255,255,255,.95);padding:0;background:#6fbf5a;box-shadow:0 4px 0 rgba(0,0,0,.2);overflow:hidden}
.minimap canvas{width:100%;height:100%;display:block;border-radius:50%}
@media (max-width:480px){.wide-only{display:none!important}.minimap{width:88px;height:88px}.hearts{width:120px;height:52px}}
.bossbar{position:fixed;top:calc(var(--st) + 4px);left:50%;transform:translateX(-50%);z-index:6;width:min(440px,60vw);text-align:center;pointer-events:none}
.boss-name{font:900 18px/1.2 var(--font);color:#fff;text-shadow:0 2px 0 var(--plum),0 0 8px rgba(0,0,0,.5)}
.boss-track{display:flex;gap:5px;margin-top:4px}
.boss-track i{flex:1;height:16px;border-radius:8px;background:#a776e8;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 2px 0 rgba(0,0,0,.25)}
.boss-track i.done{background:rgba(255,255,255,.35)}
.banner{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;font:900 clamp(30px,7vw,54px)/1.1 var(--font);color:#fff;text-align:center;max-width:92vw;text-shadow:0 4px 0 var(--gold-dark),0 0 18px rgba(255,190,40,.7);opacity:0}
.banner.show{animation:bannerIn 2.4s ease-out forwards}
.banner.small{font-size:clamp(24px,5.5vw,40px)}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.toasts{position:fixed;left:var(--sl);bottom:calc(var(--sb) + 150px);z-index:8;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none;max-width:min(70vw,420px)}
body:not(.touch) .toasts{bottom:calc(var(--sb) + 12px)}
.toast{background:rgba(20,26,56,.84);color:#fff;font:800 16px/1.3 var(--font);padding:9px 14px;border-radius:14px;animation:toastIn 3.2s ease-out forwards}
@keyframes toastIn{0%{opacity:0;transform:translateY(8px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.badges{position:fixed;right:var(--sr);bottom:calc(var(--sb) + 200px);z-index:8;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
body:not(.touch) .badges{bottom:calc(var(--sb) + 12px)}
.badge{background:linear-gradient(#ffe066,#ffbf1f);color:#5a3b00;font:900 16px/1.3 var(--font);padding:10px 16px;border-radius:16px;box-shadow:0 4px 0 var(--gold-dark);animation:toastIn 4s ease-out forwards}
.keyhint{position:fixed;left:50%;bottom:calc(var(--sb) + 40px);transform:translateX(-50%);z-index:7;background:var(--panel);border-radius:999px;padding:8px 16px 8px 8px;font:800 17px/1.2 var(--font);display:flex;gap:10px;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.18);pointer-events:none}
body.touch .keyhint{display:none!important}
.turn-tip{display:none}
/* Touch controls */
#stickBase{position:fixed;width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.75);display:none;z-index:6;pointer-events:none;transform:translate(-50%,-50%)}
#stickKnob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.tbtns{display:none}
body.touch.playing .tbtns{display:block}
.tbtn{position:fixed;z-index:6;border:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#fff;touch-action:none;padding:0 4px;overflow:hidden;font:900 13px/1.05 var(--font);text-shadow:0 1px 0 rgba(0,0,0,.3)}
.tbtn span{font-size:26px;line-height:1}
.tbtn b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn.down{transform:translateY(4px)}
.t-attack{right:calc(var(--sr) + 8px);bottom:calc(var(--sb) + 14px);width:88px;height:88px;background:linear-gradient(#ff8a7a,#ef4b3c);box-shadow:0 6px 0 #a8281c}
.t-attack span{font-size:34px}
.t-jump{right:calc(var(--sr) + 108px);bottom:calc(var(--sb) + 8px);width:68px;height:68px;background:linear-gradient(#7fb2ff,var(--blue));box-shadow:0 5px 0 var(--blue-dark)}
.t-roll{right:calc(var(--sr) + 100px);bottom:calc(var(--sb) + 92px);width:64px;height:64px;background:linear-gradient(#a8e88a,var(--green));box-shadow:0 5px 0 var(--green-dark)}
.t-ctx{right:calc(var(--sr) + 16px);bottom:calc(var(--sb) + 118px);width:72px;height:72px;background:linear-gradient(#ffe066,var(--gold));box-shadow:0 5px 0 var(--gold-dark);color:#5a3b00;text-shadow:none}
.t-attack.down{box-shadow:0 2px 0 #a8281c}.t-jump.down{box-shadow:0 1px 0 var(--blue-dark)}.t-roll.down{box-shadow:0 1px 0 var(--green-dark)}.t-ctx.down{box-shadow:0 1px 0 var(--gold-dark)}
.t-attack.charged{background:linear-gradient(#fff3a0,#ffbf1f)}
/* Dialog */
.dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 12px);z-index:12;width:min(640px,calc(100% - 24px));background:#fff;border-radius:var(--r);box-shadow:0 8px 0 rgba(0,0,0,.14),0 18px 40px rgba(0,0,0,.25);display:flex;gap:12px;align-items:flex-start;padding:14px 14px 14px 12px}
body.touch .dialog{bottom:calc(var(--sb) + 112px)}
.dlg-portrait{flex:none;width:64px;height:64px;border-radius:50%;background:#fff3c4;display:grid;place-items:center;font-size:40px;line-height:1}
.dlg-body{flex:1;min-width:0}
.dlg-name{font:900 16px/1.2 var(--font);color:var(--gold-dark);margin-bottom:4px}
.dlg-text{margin:0;font:700 18px/1.4 var(--font);min-height:2.8em}
.dlg-next{flex:none;align-self:flex-end;min-height:48px;min-width:48px;border:0;border-radius:14px;background:linear-gradient(#ffe066,var(--gold));box-shadow:0 4px 0 var(--gold-dark);font:900 16px/1 var(--font);color:#5a3b00;padding:0 14px}
/* Overlay screens */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));z-index:20;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.08),rgba(20,30,70,.5))}
.screen.clear{background:none}
.card{background:#fff;border-radius:28px;padding:22px 20px 20px;max-width:440px;width:100%;max-height:100%;overflow:auto;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.12),0 20px 50px rgba(0,0,0,.25)}
.card.wide{max-width:640px}
.card .emo{font-size:44px;line-height:1.1}
h1{margin:6px 0;font:900 clamp(30px,8vw,46px)/1.05 var(--font);letter-spacing:-.5px}
h2{margin:4px 0 12px;font:900 26px/1.15 var(--font)}
.sub{margin:0 0 16px;color:var(--soft);font:700 17px/1.35 var(--font)}
.btns{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.btns.row{flex-direction:row;justify-content:center;flex-wrap:wrap}
.big{font:900 22px/1.1 var(--font);color:#5a3b00;background:linear-gradient(#ffe066,#ffbf1f);border:0;border-radius:20px;padding:14px 26px;min-height:60px;box-shadow:0 7px 0 var(--gold-dark)}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--gold-dark)}
.big:disabled{filter:grayscale(.7);cursor:default;transform:none}
.big.alt{background:linear-gradient(#9cc2ff,#5d93ff);color:#fff;box-shadow:0 7px 0 var(--blue-dark)}
.big.alt:active{box-shadow:0 2px 0 var(--blue-dark)}
.big.soft{background:#eef1f8;color:var(--ink);box-shadow:0 6px 0 #c9cfdf}
.big.soft:active{box-shadow:0 2px 0 #c9cfdf}
.hint{color:var(--soft);font:700 15px/1.4 var(--font);margin:14px 0 0}
.loadbar{height:14px;border-radius:7px;background:#eef1f8;overflow:hidden;margin:6px 0 4px}
.loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff9f1c);border-radius:7px;transition:width .2s linear}
#titleScreen{align-items:flex-end;background:linear-gradient(rgba(20,30,70,0) 40%,rgba(20,30,70,.45))}
#titleScreen .card{background:rgba(255,255,255,.94)}
.logo{font:900 clamp(34px,9vw,54px)/1 var(--font);color:#ffbf1f;-webkit-text-stroke:2px #8a5200;text-shadow:0 4px 0 #8a5200;margin:4px 0 6px}
/* Hero maker */
#heroScreen{justify-content:flex-end;align-items:stretch;background:none;padding:0}
.maker{width:min(440px,52vw);height:100%;overflow:auto;background:rgba(255,255,255,.95);padding:max(16px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom));box-shadow:-8px 0 30px rgba(0,0,0,.18);text-align:start}
@media (max-aspect-ratio:4/5){#heroScreen{align-items:flex-end}.maker{width:100%;height:58%;border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18)}}
.mrow{margin:10px 0 4px;font:900 16px/1.2 var(--font)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:48px;height:48px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #c9cfdf;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--blue)}
.chip{min-height:48px;padding:0 14px;border-radius:14px;border:0;background:#eef1f8;font:800 16px/1.1 var(--font);box-shadow:0 4px 0 #c9cfdf}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-dark)}
.diffs{display:flex;flex-direction:column;gap:8px}
.diff{display:flex;flex-direction:column;align-items:flex-start;text-align:start;min-height:56px;padding:9px 14px;border-radius:16px;border:0;background:#eef1f8;box-shadow:0 4px 0 #c9cfdf}
.diff b{font:900 17px/1.2 var(--font)}.diff span{font:700 14px/1.3 var(--font);color:var(--soft)}
.diff[aria-pressed="true"]{background:#dfe9ff;box-shadow:0 0 0 3px var(--blue),0 4px 0 var(--blue-dark)}
.maker .big{width:100%;margin-top:14px}
/* Settings, controls */
.setlist{display:flex;flex-direction:column;gap:10px;text-align:start;margin-bottom:14px}
.setrow{display:flex;flex-direction:column;gap:6px}
.setrow>span{font:800 16px/1.2 var(--font)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .chip{min-height:44px;padding:0 12px;font-size:15px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{min-width:2ch;text-align:center;font:900 20px/1 var(--font)}
.ctl-list{text-align:start;margin:0 0 16px;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ctl-list li{font:700 16px/1.35 var(--font);background:#f4f6fb;border-radius:12px;padding:8px 12px}
/* Map */
.mapwrap{position:relative;width:min(84vh,92vw,620px);aspect-ratio:1;margin:0 auto 12px;border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(0,0,0,.1)}
.mapwrap canvas{width:100%;height:100%;display:block}
.mapmarks{position:absolute;inset:0}
.mk{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-size:20px;line-height:1}
.mk-way{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:3px solid #fff;background:#6c7a99;color:#fff;font-size:20px;display:grid;place-items:center;padding:0;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mk-way.on{background:linear-gradient(#ffe066,#ffbf1f);color:#5a3b00}
.mk-label{font:900 13px/1.1 var(--font);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8),0 0 4px rgba(0,0,0,.6);white-space:nowrap}
#mapScreen .card{max-width:680px;padding:16px}
@media (prefers-reduced-motion:reduce){.banner.show{animation:fadeOnly 2.4s linear forwards}.toast,.badge{animation:fadeOnly 3.2s linear forwards}}
@keyframes fadeOnly{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}
/* Combat + loot (builder 2): foe health bars, knocked-out card, loot card, bag + shop */
.hpbar{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.hpbar b{font:900 15px/1.1 var(--font);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.75),0 0 6px rgba(0,0,0,.4);white-space:nowrap}
.hpbar i{display:block;width:58px;height:9px;border-radius:6px;background:rgba(20,26,56,.62);border:2px solid rgba(255,255,255,.9);overflow:hidden}
.hpbar u{display:block;height:100%;width:100%;background:linear-gradient(#ffb36b,#ef6b3c);text-decoration:none;transition:width .15s linear}
.hpbar.boss i{width:130px;height:13px}
.hearts.wobble{animation:heartWob .45s ease-out}
@keyframes heartWob{0%{transform:none}25%{transform:rotate(-4deg) scale(1.05)}55%{transform:rotate(3deg)}80%{transform:rotate(-1deg)}100%{transform:none}}
.fxpill{letter-spacing:.5px}
.kocard{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:31;background:#fff;border-radius:26px;padding:20px 28px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;max-width:min(420px,88vw);box-shadow:0 8px 0 rgba(0,0,0,.14),0 18px 40px rgba(0,0,0,.3)}
.kocard .emo{font-size:46px;line-height:1}
.kocard b{font:900 23px/1.2 var(--font)}
.kocard span{font:700 17px/1.3 var(--font);color:var(--soft)}
.lootcard{position:fixed;left:50%;top:15%;transform:translateX(-50%);z-index:9;background:rgba(255,255,255,.96);border-radius:22px;padding:12px 16px 14px;text-align:center;width:max-content;max-width:min(560px,92vw);pointer-events:none;box-shadow:0 6px 0 var(--gold-dark),0 14px 30px rgba(0,0,0,.25)}
.lootcard.show{animation:lootIn 4.8s ease-out forwards}
@keyframes lootIn{0%{opacity:0;transform:translateX(-50%) scale(.8)}8%{opacity:1;transform:translateX(-50%) scale(1.04)}14%{transform:translateX(-50%) scale(1)}86%{opacity:1}100%{opacity:0}}
.lootcard>b{display:block;font:900 23px/1.2 var(--font);color:var(--gold-dark);margin-bottom:8px}
#lootList{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lc{display:flex;align-items:center;gap:7px;background:#fff7d6;border-radius:999px;padding:4px 13px 4px 4px;font:800 16px/1.2 var(--font)}
.lc i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:20px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.card.bag{max-width:620px;text-align:start;background:rgba(255,255,255,.95)}
.card.bag h2{text-align:center}
.card.bag>.big{display:block;margin:0 auto;min-width:min(240px,100%)}
@media (min-aspect-ratio:5/4){#bagScreen{justify-content:flex-end;background:linear-gradient(90deg,rgba(20,30,70,0) 35%,rgba(20,30,70,.35))}#bagScreen .card.bag{width:min(560px,56vw);max-height:100%}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;justify-content:center}
.tab{min-height:48px;padding:0 15px;border-radius:14px;border:0;background:#eef1f8;font:900 16px/1 var(--font);box-shadow:0 4px 0 #c9cfdf}
.tab[aria-selected="true"]{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-dark)}
.bagstats{margin:0 0 6px;font:900 17px/1.3 var(--font);color:var(--ink);text-align:center}
.bagmsg{min-height:1.3em;margin:0 0 8px;font:800 16px/1.3 var(--font);color:var(--green-dark);text-align:center}
.bagbody{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.bagrow>span{display:block;font:900 14px/1.2 var(--font);margin:0 0 6px;color:var(--soft);text-transform:uppercase;letter-spacing:.3px}
.cards{display:flex;flex-wrap:wrap;gap:8px}
.icard{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;row-gap:1px;align-items:center;min-height:64px;flex:1 1 160px;max-width:280px;padding:8px 12px 8px 8px;border-radius:16px;border:0;background:#f4f6fb;box-shadow:0 4px 0 #d5dae6;text-align:start}
.icard[aria-pressed="true"]{background:#fff4cc;box-shadow:0 0 0 3px var(--gold),0 4px 0 var(--gold-dark)}
.icard i{grid-row:1/3;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:24px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.icard b{font:900 16px/1.15 var(--font)}
.icard span{font:700 14px/1.25 var(--font);color:var(--soft)}
.icard:disabled{cursor:default}
.icard:disabled i{filter:grayscale(.3)}
.bagempty{margin:0;color:var(--soft);font:700 15px/1.3 var(--font)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{background:#f4f6fb;border-radius:999px;padding:7px 13px;font:800 15px/1.2 var(--font)}

/* Projectiles: pooled, simulation-driven. Puffballs lob in a slow 1.4 s arc to where the hero stood, with the

  list: [], kinds: {}, klist: [],

  init() {

/* ==== 23. CUTSCENES ==== */
// A cutscene is a clear overlay (letterbox bars, a caption, Next and Skip) that pauses the simulation while a few
// camera shots play. Shots ease between two camera poses (calm motion: the final pose only, after a soft fade);
// `follow` shots compute the camera every frame (the flight home). update(k, t, dt) moves the world; onEnd runs once
// (also on Skip, after update(1, dur)). Real time drives it; with manual(true) step(seconds) does (deterministic).
const CUT = {
  on: false, id: null, t: 0, dur: 0, shots: null, lines: null, li: -1, update: null, onEnd: null, mem: 0, shotI: -1, fadeT: 0,
  pos: new THREE.Vector3(), look: new THREE.Vector3(), a: new THREE.Vector3(), b: new THREE.Vector3(),
  play(o) {
    if (this.on) this.end(true);
    Object.assign(this, { on: true, id: o.id || 'cut', t: 0, dur: o.dur || 4, shots: o.shots || [], lines: o.lines || [], li: -1, update: o.update || null, onEnd: o.onEnd || null, mem: 0, shotI: -1, fadeT: 0 });
    if (UI.dialog.open) { UI.dialog.open = false; $('dialog').hidden = true; UI.dialog.done = null; }
    $('cutCap').hidden = true; document.body.classList.add('cut'); UI.setPrompt(null);
    UI.open('cutScreen'); CAM.shot = { pos: this.pos, look: this.look };
    this.apply(0);
    GAME.emit('cutscene', this.id, 'start');
  },
  /** Move the clock on (only while the cutscene is the top overlay: a pause menu stops it). */
  advance(dt) {
    if (!this.on || UI.top() !== 'cutScreen') return;
    this.t = Math.min(this.dur, this.t + dt); this.apply(dt);
    if (this.t >= this.dur - 1e-6) this.end(false);
  },
  apply(dt) {
    const tm = this.t, cm = calm();
    // camera
    let si = this.shots.length - 1; for (let i = 0; i < this.shots.length; i++) if (tm < this.shots[i].t1) { si = i; break; }
    const sh = this.shots[si];
    if (sh) {
      if (si !== this.shotI) { if (this.shotI >= 0 && cm) { $('fade').classList.add('on'); this.fadeT = 0.3; } this.shotI = si; }
      if (sh.follow) sh.follow(this.pos, this.look, tm, dt);
