<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
  /* Word Hunt: a word search in the look of Crossword and the classroom dashboard's widgets (cream cards with the group
     colour on the top edge and the icon chip, the dark "Now" block for what to do next, a dotted mint board), light and
     dark. No game engine: every screen is this page's own DOM; the found words' bands are one SVG under the letters. */
  /* The classroom dashboard's tokens (public/css/app.css, public/css/dash.css): cream cards on a dotted mint board. */
  :root {
    --paper: #E1F1E1; --dots: #66C792; --card: #FFFDF2; --card2: #F9F6EB; --hover: #EFEBDC; --ink: #141414; --line: #E2DDCB; --muted: #5B584F;
    --green: #1F9D63; --accent: #66C792; --mint-t: #E1F1E1; --accent-ink: #0F5A37; --current: #141414; --on-current: #FFFDF2;
    --sky: #5AA9D6; --sky-t: #DCEDF7; --sky-s: #A8D2EC; --coral: #C8432F; --coral-t: #FBE0DA; --grape: #6E56C9; --grape-t: #ECE7FA; --grape-l: #C9BDF0; --spark: #FFD23F; --focus: #2563EB;
    --g-time: #5AA9D6; --g-class: #66C792; --g-tools: #FFD23F; --g-show: #F28C6B; --g-check: #9B8CE0; --g-join: #4FB6A8;
    --shadow: 0 1px 0 rgba(20,20,20,.04), 0 4px 16px rgba(20,20,20,.06); --r: 20px; --r-sm: 12px;
    --font: 'Bricolage Grotesque', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --paper: #141414; --dots: #2E5A41; --card: #1E1E1B; --card2: #262622; --hover: #2C2C27; --ink: #FFFDF2; --line: #36352F; --muted: #B8B3A1;
    --green: #66C792; --accent: #66C792; --mint-t: #1F3A2B; --accent-ink: #8FDDB0; --current: #66C792; --on-current: #141414;
    --sky-t: #1B3342; --sky-s: #2C5A75; --coral: #FF8A7D; --coral-t: #4A2420; --grape: #B9A2FF; --grape-t: #342A52; --grape-l: #5B4A8F; --focus: #8AB4FF;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.32);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background-color: var(--paper); background-image: radial-gradient(var(--dots) 1.5px, transparent 1.6px); background-size: 22px 22px; color: var(--ink); font-family: var(--font); line-height: 1.3; -webkit-text-size-adjust: 100%; }
  body { padding: 0 12px calc(16px + env(safe-area-inset-bottom)); }
  :where(button, input, textarea) { font: inherit; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  button { touch-action: manipulation; cursor: pointer; }
  :where(button, input, textarea, a):focus-visible, .wh-file:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
  [tabindex="-1"]:focus { outline: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* the page head */
  .wh-head { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 0; }
  .wh-logo { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; font-weight: 800; font-size: 1.25em; letter-spacing: -.01em; }
  .wh-logo svg { width: 36px; height: 36px; flex: none; }
  .wh-icon { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 1.15em; }

  .cw { max-width: 1100px; margin: 0 auto; }
  /* a widget: the dashboard's card, its group colour on the top edge and the icon chip only (never on text) */
  .wh-widget { --g: var(--g-class); background: var(--card); color: var(--ink); border-radius: var(--r); padding: 16px;
    box-shadow: inset 0 4px 0 color-mix(in srgb, var(--g) 75%, var(--card)), 0 0 0 1px color-mix(in srgb, var(--line) 70%, transparent), var(--shadow); }
  .wh-wh { display: flex; align-items: center; gap: 10px; min-height: 40px; flex-wrap: wrap; }
  .wh-wicon { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: color-mix(in srgb, var(--g) 26%, var(--card)); font-size: 1.3rem; line-height: 1; }
  .cw .wh-wt { flex: 1 1 8em; min-width: 0; margin: 0; font-size: 1.2rem; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; letter-spacing: 0; }
  .wh-card { width: min(100%, 580px); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .wh-card.wh-wide { width: min(100%, 900px); }
  .cw h2 { margin: 0; font-size: 1.45em; font-weight: 800; line-height: 1.15; letter-spacing: -.01em; }
  .cw h3 { margin: 0; font-size: 1.08em; font-weight: 800; }
  .wh-sub { margin: -6px 0 0; color: var(--muted); font-weight: 600; }
  .wh-lead { margin: 0; text-align: center; font-weight: 700; font-size: 1.1em; }
  .wh-note { margin: 0; font-weight: 600; font-size: .92em; color: var(--muted); }
  .wh-msg { margin: 0; font-weight: 700; }
  .wh-msg:empty { display: none; }
  .wh-err { color: var(--coral); }
  .wh-ok { color: var(--green); }
  .wh-row { display: flex; gap: 8px; align-items: center; }
  .wh-wrap { flex-wrap: wrap; }
  .wh-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .wh-top h2 { flex: 1; min-width: 0; overflow-wrap: anywhere; }

  .wh-big { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 72px; padding: 12px 16px; border-radius: 18px;
    border: 0; background: var(--card2); text-align: start; }
  .wh-big:hover { background: var(--hover); }
  .wh-big .wh-emo { font-size: 1.8em; flex: none; }
  .wh-big span:last-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .wh-big b { font-size: 1.12em; font-weight: 800; }
  .wh-big small, .wh-code small { font-weight: 600; color: var(--muted); }
  .wh-big.wh-go { background: var(--current); color: var(--on-current); }
  .wh-big.wh-go small { color: inherit; opacity: .85; }
  .wh-btn { min-height: 46px; padding: 6px 18px; border-radius: 999px; border: 2px solid var(--ink); background: var(--card); font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; overflow-wrap: anywhere; }
  .wh-btn:hover { background: var(--card2); }
  .wh-btn.wh-go { background: var(--green); border-color: var(--green); color: #fff; }
  :root[data-theme="dark"] .wh-btn.wh-go { color: #10261A; }
  .wh-btn.wh-quiet { border-color: var(--line); }
  .wh-btn:active, .wh-big:active { transform: translateY(1px); }
  .wh-btn:disabled { opacity: .55; cursor: default; }
  .wh-main { width: 100%; min-height: 56px; font-size: 1.1em; }
  .wh-code { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: var(--r-sm); background: var(--card2); }
  .wh-code label { font-weight: 800; font-size: 1.12em; }
  .wh-in { min-height: 46px; padding: 8px 12px; border-radius: var(--r-sm); border: 2px solid var(--line); background: var(--card); min-width: 0; }
  .wh-in:focus { border-color: var(--ink); }
  .wh-code .wh-in { flex: 1; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
  .wh-mine { display: flex; flex-direction: column; gap: 8px; border-top: 2px solid var(--line); padding-top: 14px; }
  .wh-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .wh-list li { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: var(--r-sm); background: var(--card2); }
  .wh-name { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-wrap: anywhere; }
  .wh-name small { font-weight: 600; color: var(--muted); }
  .wh-acts2 { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .wh-btn.wh-sm { min-height: 44px; padding: 4px 14px; font-size: .95em; }
  .wh-btn.wh-danger { background: var(--coral-t); border-color: var(--coral); color: var(--coral); }
  .wh-sheets { border-top: 0; padding-top: 0; }
  /* My worksheets: one quiet row each (the row opens it), and only Print and More at the end, as plain icons */
  .wh-sheets .wh-list li.wh-sheet { flex-direction: column; align-items: stretch; gap: 4px; padding: 4px; }
  .wh-sheet:has(.wh-wsopen:hover) { background: var(--hover); }
  .wh-wsrow { display: flex; align-items: center; gap: 2px; }
  .wh-wsopen { flex: 1; min-width: 0; min-height: 52px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px;
    padding: 6px 10px; border: 0; border-radius: 10px; background: none; text-align: start; }
  .wh-wstitle { font-weight: 800; font-size: 1.05em; overflow-wrap: anywhere; }
  .wh-wsmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-weight: 600; font-size: .92em; color: var(--muted); }
  .wh-wscode { padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: .9em; font-weight: 800; letter-spacing: 1px; white-space: nowrap; }
  .wh-wstools { flex: none; display: flex; align-items: center; }
  .wh-ibtn { flex: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--muted); display: grid; place-items: center; }
  .wh-ibtn svg { width: 20px; height: 20px; }
  .wh-ibtn:hover, .wh-ibtn[aria-expanded="true"] { background: var(--hover); color: var(--ink); }
  .wh-wsmore { position: relative; display: flex; }
  .wh-menu { position: absolute; top: calc(100% + 4px); inset-inline-end: 0; z-index: 30; width: max-content; min-width: 12em; max-width: min(18em, calc(100vw - 40px));
    display: flex; flex-direction: column; padding: 6px; border-radius: var(--r-sm); background: var(--card);
    box-shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(20,20,20,.18); }
  .wh-mitem { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 12px; border: 0; border-radius: 8px; background: none; font-weight: 700; text-align: start; }
  .wh-mitem:hover, .wh-mitem:focus { background: var(--hover); }
  .wh-mitem:focus-visible { outline-offset: -3px; }
  .wh-memo { width: 1.3em; flex: none; text-align: center; }
  .wh-mitem.wh-mdel { color: var(--coral); }
  .wh-msep { height: 1px; margin: 4px 6px; background: var(--line); }
  .wh-wsmsg:empty { display: none; }
  .wh-wsmsg { margin: 0 10px 6px; }
  .wh-rename { margin: 0 6px 6px; }
  .wh-rename .wh-in { flex: 1 1 14em; }
  .wh-wsconfirm { display: flex; flex-direction: column; gap: 6px; margin: 0 6px 6px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--coral-t); }
  .wh-wsconfirm p { margin: 0; font-weight: 800; }
  .wh-empty-ws { display: flex; flex-direction: column; gap: 12px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .wh-foot { gap: 10px; flex-wrap: wrap; }
  .wh-foot .wh-main { flex: 1 1 14em; width: auto; }
  .wh-foot > .wh-btn:first-child { min-height: 56px; }
  .wh-saved { margin-top: -6px; }
  .wh-file.wh-busy { opacity: .75; cursor: progress; }
  @media (max-width: 560px) { .wh-list li { flex-wrap: wrap; } .wh-acts2 { width: 100%; justify-content: flex-start; } }
  .wh-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .wh-meta > :only-child { grid-column: 1 / -1; }
  .wh-field { display: flex; flex-direction: column; gap: 4px; }
  .wh-field label { font-weight: 800; }
  .wh-sec { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: var(--r-sm); background: var(--card2); }
  .wh-paste { width: 100%; resize: vertical; min-height: 110px; }
  .wh-file { position: relative; cursor: pointer; }
  .wh-file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .wh-lhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .wh-lhead h3 { flex: 1 1 10em; }
  /* AI in the widget look: a dark pill and chip, the AI step a cream card with a Spark top edge */
  .wh-btn.wh-ai { background: var(--ink); border-color: var(--ink); color: var(--card); }
  .wh-btn.wh-ai:hover { background: var(--ink); opacity: .88; }
  /* Step 1 with the AI: the site's AI look, calm (a cream card with a Spark top edge, a dark ✨ AI chip, the upload in the AI style) */
  .wh-sec.wh-aisec { background: var(--card); box-shadow: inset 0 4px 0 var(--spark), 0 0 0 1px var(--line), 0 4px 14px rgba(20,20,20,.07); }
  .wh-aichip { display: inline-block; margin-inline-start: 4px; padding: 1px 10px; border-radius: 999px; border: 0; background: var(--ink); color: var(--card);
    font-size: .74em; font-weight: 800; line-height: 1.5; vertical-align: middle; white-space: nowrap; }
  .wh-aisec .wh-note { color: var(--ink); opacity: .82; }
  .wh-in[aria-invalid="true"] { border-color: var(--coral); }
  .wh-words { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .wh-wrow { display: grid; grid-template-columns: 2em minmax(0, 1fr) 44px; gap: 6px; align-items: start; }
  .wh-n { font-weight: 800; text-align: center; padding-top: 12px; color: var(--muted); }
  .wh-x { width: 44px; height: 46px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-weight: 800; }
  .wh-x:hover { border-color: var(--coral); color: var(--coral); }
  .wh-toggle { display: flex; align-items: center; gap: 10px; font-weight: 700; min-height: 44px; cursor: pointer; }
  .wh-toggle input { width: 24px; height: 24px; accent-color: var(--green); }
  .wh-acts { justify-content: center; }
  .wh-printask { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--card2); }
  .wh-printask[hidden] { display: none; }
  .wh-mineprint { display: flex; flex-direction: column; gap: 4px; width: 100%; max-width: 560px; margin: 0 auto; }
  .wh-mineprint label { font-weight: 800; }
  .wh-mineprint textarea { width: 100%; box-sizing: border-box; resize: vertical; font: inherit; line-height: 1.35; }
  .wh-printask p { margin: 0; font-weight: 800; }
  .wh-share { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px; border-radius: var(--r-sm); background: var(--mint-t); }
  .wh-share:empty { display: none; }
  .wh-share .wh-row { width: 100%; justify-content: center; }
  .wh-link { flex: 1; min-width: 12em; font-size: .9em; }
  .wh-codebig { margin: 0; display: flex; flex-direction: column; align-items: center; font-weight: 700; }
  .wh-codebig b { font-size: 1.8em; letter-spacing: 3px; }
  canvas.wh-qr { width: 180px; height: 180px; image-rendering: pixelated; border-radius: 12px; border: 2px solid var(--line); }

  /* home: Play (daily, levels, themes, relax, Play and Race) and Your own words, side by side on a wide screen */
  .wh-home { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; max-width: 1100px; margin: 0 auto; }
  .wh-home > .wh-card { width: 100%; }
  .wh-pick { display: flex; flex-direction: column; gap: 6px; }
  .wh-pick > b { font-weight: 800; }
  .wh-levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .wh-pill { min-height: 52px; padding: 6px 8px; border-radius: var(--r-sm); border: 2px solid var(--line); background: var(--card); font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1.15; text-align: center; }
  .wh-pill small { font-weight: 700; color: var(--muted); font-size: .82em; }
  .wh-pill:hover { background: var(--hover); }
  .wh-pill[aria-pressed="true"], .wh-pill[aria-checked="true"] { border-color: var(--ink); background: var(--mint-t); box-shadow: inset 0 0 0 1px var(--ink); }
  .wh-lvstars { color: var(--spark); letter-spacing: 1px; -webkit-text-stroke: .6px rgba(0,0,0,.25); }
  .wh-themes { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .wh-theme { min-height: 64px; padding: 4px 2px; border-radius: var(--r-sm); border: 2px solid var(--line); background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 700; font-size: .78rem; line-height: 1.1; text-align: center; overflow-wrap: anywhere; }
  .wh-theme .wh-temo { font-size: 1.6rem; line-height: 1; }
  .wh-theme:hover { background: var(--hover); }
  .wh-theme[aria-pressed="true"] { border-color: var(--ink); background: var(--mint-t); box-shadow: inset 0 0 0 1px var(--ink); }
  .wh-optrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
  .wh-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 999px; background: var(--card2); font-weight: 800; white-space: nowrap; font-size: .92rem; }
  .wh-chip.wh-good { background: var(--mint-t); color: var(--accent-ink); }
  .wh-playrow { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.2fr); gap: 8px; }
  .wh-playrow .wh-btn { min-height: 56px; font-size: 1.08em; }
  .wh-big.wh-done small { opacity: .85; }
  .wh-big.wh-daily:not(.wh-go) { background: var(--mint-t); }
  .wh-group { display: flex; flex-direction: column; gap: 10px; }

  /* the board: letters on the card, the found words' bands under them (an SVG), one picture for both */
  .wh-boardwrap { width: 100%; display: flex; justify-content: center; }
  .wh-board { --n: 10; --cell: 40px; position: relative; width: calc(var(--n) * var(--cell)); height: calc(var(--n) * var(--cell)); border-radius: 14px;
    background: var(--card); box-shadow: 0 0 0 2px var(--ink); touch-action: none; user-select: none; -webkit-user-select: none; flex: none; }
  .wh-board:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
  .wh-bands { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .wh-letters { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--n), 1fr); grid-template-rows: repeat(var(--n), 1fr); cursor: pointer; }
  .wh-letters span { display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: calc(var(--cell) * .54); line-height: 1; color: var(--ink); }
  .wh-letters span.wh-on { color: #141414; }
  .wh-board.wh-hide .wh-letters { visibility: hidden; }
  .wh-pausecard { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; text-align: center; border-radius: 14px; background: var(--card); z-index: 2; }
  .wh-pausecard[hidden] { display: none; }
  .wh-pausecard h2 { margin: 0; }
  .wh-pausecard p { margin: 0; font-weight: 600; color: var(--muted); }
  .wh-band-hint { animation: wh-glow 1.1s ease-in-out infinite alternate; }
  @keyframes wh-glow { from { opacity: .35; } to { opacity: 1; } }
  .wh-band-fail { transition: opacity .6s ease; }

  /* play */
  .wh-hud { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .wh-ibtn.wh-pausebtn { color: var(--ink); background: var(--card2); }
  .wh-words { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: row; flex-wrap: wrap; gap: 6px; }
  .wh-wchip { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px 4px 10px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); font-weight: 800; font-size: 1.05rem; letter-spacing: .02em; }
  .wh-wchip .wh-wemo { font-size: 1.2em; line-height: 1; }
  .wh-wchip:hover { background: var(--hover); }
  .wh-wchip.wh-found { border-color: var(--bandDark, var(--green)); background: var(--band, var(--mint-t)); color: #141414; }
  .wh-wchip.wh-found .wh-ww { text-decoration: line-through; text-decoration-thickness: 2px; }
  .wh-wchip.wh-hinted:not(.wh-found) { border-color: var(--grape); background: var(--grape-t); }
  .wh-wchip.wh-speaking { box-shadow: 0 0 0 3px var(--focus); }
  .wh-wchip .wh-tick { display: none; }
  .wh-wchip.wh-found .wh-tick { display: inline; }
  .wh-hidden { margin: 0; font-weight: 700; color: var(--muted); }
  .wh-resnotes { margin: 0; display: flex; flex-direction: column; gap: 2px; font-weight: 700; }
  .wh-reschips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .wh-resart { font-size: 3rem; line-height: 1; }
  .wh-dirs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .wh-sizes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .wh-prevwords { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .wh-prevwords li { padding: 3px 12px; border-radius: 999px; background: var(--card2); font-weight: 700; }

  /* play */

const THEME_BY_ID = Object.fromEntries(THEMES.map(t => [t.id, t]));
// The 8 directions as [row step, column step]. Easy uses E + S, Medium adds SE, Hard uses all 8 (incl. backwards).
const DIRS = { E: [0, 1], S: [1, 0], SE: [1, 1], NE: [-1, 1], W: [0, -1], N: [-1, 0], NW: [-1, -1], SW: [1, -1] };

const AXIS = (dr, dc) => dr === 0 ? 0 : dc === 0 ? 1 : dr === dc ? 2 : 3;   // which line a direction runs along

// Words that must never appear by accident in the filler letters, in any direction (ROT13 so the source stays clean).
const BLOCKED = 'shpx fuvg ovgpu phag qvpx pbpx chffl cbea frk anmv uvgyre encr avtt snt juber fyhg cravf intvan obbo ergneq fhvpvqr xlf onfgneq jnax gjng ahqr anxrq ubeal zvys phz wvmm nany qvyqb xxx urebva pbpnvar zrgu nff gvg shx shp cvff pebc xvyy'
  .split(' ').map(w => w.replace(/[a-z]/g, ch => String.fromCharCode((ch.charCodeAt(0) - 97 + 13) % 26 + 97)).toUpperCase());

/** Does any line of the grid (any of the 8 directions) contain a blocked word? grid is a flat array of n*n letters. */
function hasBlocked(grid, n) {
  const lines = [];
  for (let i = 0; i < n; i++) {
    let row = '', col = ''; for (let j = 0; j < n; j++) { row += grid[i * n + j]; col += grid[j * n + i]; } lines.push(row, col);
  }
  for (let k = -(n - 1); k < n; k++) {   // both diagonal families
    let d1 = '', d2 = '';
    for (let r = 0; r < n; r++) { const c1 = r + k, c2 = n - 1 - r + k; if (c1 >= 0 && c1 < n) d1 += grid[r * n + c1]; if (c2 >= 0 && c2 < n) d2 += grid[r * n + c2]; }
    lines.push(d1, d2);
  }
  for (const line of lines) {
    if (line.length < 3) continue; const back = reverse(line);
    for (const b of BLOCKED) if (line.includes(b) || back.includes(b)) return true;
  }

/** Every place a word can be read in the grid, in all 8 directions. A palindrome read both ways counts once. */
function findAll(grid, n, word) {
  const seen = new Set(), out = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (grid[r * n + c] !== word[0]) continue;
    for (const [dr, dc] of ALL_DIRS) {

}

/**
 * generatePuzzle(themeId, difficulty, seed) -> { theme, difficulty, seed, size, grid: [row strings], words: [{word, emoji, say, start, end, dir}], tries }
 * Places the words (longest first, crossing over shared letters when it can), fills the gaps with random letters,
 * then checks: no blocked word anywhere and every word can be found exactly once. Anything wrong -> refill or
 * re-place with the next random numbers. Deterministic: same (theme, difficulty, seed) -> same puzzle.
 */
function generatePuzzle(themeId, difficulty, seed) {
  const theme = THEME_BY_ID[themeId] || THEMES[0];
  const L = LEVELS[difficulty] || LEVELS.easy;
  const n = L.size, dirNames = L.dirs;
  seed = (seed >>> 0);
  const rng = mulberry32(seed ^ hashStr(theme.id + '|' + difficulty));
  const pick = arr => arr[Math.floor(rng() * arr.length)];
  const pool = theme.words.filter(w => w.word.length >= L.minLen && w.word.length <= Math.min(L.maxLen, n));
  let tries = 0;
  for (let attempt = 0; attempt < 3000; attempt++) {
    // 1. choose the words: shuffled, and never one word hiding inside another (CAT inside CATERPILLAR)
    const want = L.words[0] + Math.floor(rng() * (L.words[1] - L.words[0] + 1));
    const shuffled = pool.slice(); for (let i = shuffled.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
    const chosen = [];
    for (const w of shuffled) {
      if (chosen.length >= want) break;
      if (chosen.some(x => x.word.includes(w.word) || w.word.includes(x.word) || x.word.includes(reverse(w.word)) || w.word.includes(reverse(x.word)))) continue;
      chosen.push(w);
    }
    if (chosen.length < L.words[0]) continue;
    chosen.sort((a, b) => b.word.length - a.word.length);
    for (let placeTry = 0; placeTry < 6; placeTry++) {
      tries++;
      // 2. place them
      const grid = new Array(n * n).fill(''), axes = new Array(n * n).fill(0); // axes: bit mask of lines through each cell
      const placed = []; let failed = false;
      for (const w of chosen) {
        const len = w.word.length, byDir = {}, crossDir = {};
        for (const dn of dirNames) {
          const [dr, dc] = DIRS[dn], ax = 1 << AXIS(dr, dc);
          for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
            const er = r + dr * (len - 1), ec = c + dc * (len - 1);
            if (er < 0 || er >= n || ec < 0 || ec >= n) continue;
            let ok = true, cross = 0;
            for (let i = 0; i < len && ok; i++) {
              const k = (r + dr * i) * n + c + dc * i, g = grid[k];
              if (g === '') continue;
              if (g !== w.word[i] || (axes[k] & ax)) ok = false; else cross++;   // share a letter only across another line
            }
            if (!ok) continue;
            (byDir[dn] = byDir[dn] || []).push([r, c]);
            if (cross) (crossDir[dn] = crossDir[dn] || []).push([r, c]);
          }
        }
        const useCross = Object.keys(crossDir).length && rng() < OVERLAP;
        const src = useCross ? crossDir : byDir, names = Object.keys(src);
        if (!names.length) { failed = true; break; }
        const dn = pick(names), [r, c] = pick(src[dn]), [dr, dc] = DIRS[dn];   // a random direction first, so all directions get used
        for (let i = 0; i < len; i++) { const k = (r + dr * i) * n + c + dc * i; grid[k] = w.word[i]; axes[k] |= 1 << AXIS(dr, dc); }
        placed.push({ word: w.word, emoji: w.emoji, say: w.say, start: [r, c], end: [r + dr * (len - 1), c + dc * (len - 1)], dir: dn });
      }
      if (failed) continue;
      // 3. fill the gaps; check for blocked words and for words that show up twice
      for (let fillTry = 0; fillTry < 10; fillTry++) {
        const full = grid.map(g => g || FILLER[Math.floor(rng() * FILLER.length)]);
        if (hasBlocked(full, n)) continue;
        if (!placed.every(p => findAll(full, n, p.word).length === 1)) continue;
        const rows = []; for (let r = 0; r < n; r++) rows.push(full.slice(r * n, r * n + n).join(''));
        // the word list is shown in a friendly order: shortest first, then A-Z
        const words = placed.slice().sort((a, b) => a.word.length - b.word.length || (a.word < b.word ? -1 : 1));
        return { theme: theme.id, difficulty, seed, size: n, grid: rows, words, tries };
      }
    }
  }
  return null;   // never happens (the tests run tens of thousands of seeds); the caller retries with another seed
}

  /* ---------- a teacher's own word list ---------- */
  // At most 25 words of 2 to 15 letters (a word may be typed with spaces, hyphens or apostrophes, which the grid leaves
  // out, up to 24 characters); grids of 8, 10, 12 or 15 squares a side.
  const LIMITS = { minWords: 3, maxWords: 25, minLetters: 2, maxLetters: 15, typed: 24, title: 60 };
  const SIZES = [8, 10, 12, 15];
  /** The grid letters of a typed word: ["P","H","O",...] (capital letters in any script; spaces, hyphens and
   *  apostrophes left out). */
  function letters(word) { return Array.from(String(word || '').normalize('NFC').replace(/[\s'’\-]/g, '').toLocaleUpperCase()); }
  const keyOf = w => letters(w).join('');
  /** May this be a word in a word hunt? Letters (any script) with spaces, hyphens or apostrophes; 2 to 15 letters. */
  function okWord(w) {

/** The ISO penalty score of a finished symbol (lower is easier to read). */
function penalty(m) {
  const size = m.length;
  let p = 0, dark = 0;
  const lines = [];
  for (let y = 0; y < size; y++) { lines.push(m[y]); lines.push(m.map(r => r[y])); }
  for (const line of lines) {
    let run = 1;
    for (let i = 1; i <= size; i++) {

/** Whether text fits a code of at most this version. */
const fits = (text, max = 6) => utf8(String(text)).length <= capacity(Math.min(MAX_VERSION, max));

function qr(text, { max = 6, version: want = 0, mask: only = -1 } = {}) {

    const score = penalty(modules);

}

  root.HuntQR = { qr: qr, fits: fits };

  }
  function onNext() {
    if (S.race && S.race.turn === 0 && S.race.results[0]) { S.race.turn = 1; return startPuzzle({ theme: S.theme, difficulty: S.difficulty, seed: S.seed, race: 'next' }); }
    if (S.race) return startPuzzle({ theme: S.pickTheme === 'surprise' ? 'surprise' : S.theme, difficulty: S.difficulty, race: 'new' });
    if (S.P) return startPuzzle({ custom: S.P });
    startPuzzle({ theme: S.daily ? S.theme : S.pickTheme === 'surprise' ? 'surprise' : S.theme, difficulty: S.difficulty });
  }
  function onChange() { S.race = null; clearTimeout(resultsTimer); if (S.P) { S.screen = 'play'; return leavePlay(); } S.backTo = 'home'; showHome(); }
  function celebrate() {
    if (reduced() || fast) return;
    var box = el('div', 'wh-confetti'), cols = ['var(--green)', 'var(--sky)', 'var(--spark)', 'var(--coral)', 'var(--grape)'];
    box.setAttribute('aria-hidden', 'true');
    for (var i = 0; i < 70; i++) {
      var p = el('i'); p.style.left = (Math.random() * 100) + '%'; p.style.background = cols[i % cols.length];
      p.style.setProperty('--x', ((Math.random() - 0.5) * 240) + 'px'); p.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg');
      p.style.setProperty('--d', (Math.random() * 0.5) + 's'); p.style.setProperty('--t', (1.4 + Math.random() * 1.2) + 's');
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(function () { box.remove(); }, 3500);
  }

  /* =====================================================================================
     window.__brbTest: hooks for automated play tests (harmless in production).
       state()        -> { screen, theme, difficulty, seed, daily, grid (row strings), words: [{word, emoji, found, start:[r,c], end:[r,c], dir}],
                           found, timeMs, hintsUsed, done, paused, pending, cell (px), points, stars, race, save, custom }
       start({ theme, difficulty, seed, daily, race })  -> starts a puzzle -> state()
       startOwn({ t, w, s, d, r, b })  -> plays a teacher's word hunt -> state()
       next()         -> presses the results card's main button (next puzzle / player 2's turn / race again / play again)
       select([r,c], [r,c])  -> true if that line was a new word (either direction works)
       solveAll()     -> finds every word that is left (shows the results)
       skipAnimations(on = true) -> no delays (the results show at once)
       generate(theme, difficulty, seed) -> the puzzle the generator makes, without starting it
       layout(words, { s, d, r }) -> a teacher's word hunt, without starting it
       hint(), readWords(), pause(on), quit(), today('YYYY-MM-DD' | null), daily(date)
       cellCenter(r, c) -> { x, y } of a letter box in page pixels inside the game frame (for real drag tests)
       whState()      -> the make-your-own side: { screen, draft (words), draftSet, mine, sheets, size, unplaced }
     ===================================================================================== */
  function state() {
    return { screen: S.screen, theme: S.theme, pickTheme: S.pickTheme, difficulty: S.difficulty, seed: S.seed, daily: S.daily,
      grid: S.letters.map(function (r) { return r.join(''); }), words: S.words.map(function (w) { return { word: w.word, emoji: w.emoji, found: w.found, start: w.start.slice(), end: w.end.slice(), dir: w.dir }; }),
      found: S.found, timeMs: Math.round(S.timeMs), hintsUsed: S.hintsUsed, done: S.done, paused: S.paused, pending: S.pending ? S.pending.slice() : null,
      cell: cellPx, points: S.lastPoints, stars: S.lastStars || 0, relax: !!save.relax, race: S.race ? JSON.parse(JSON.stringify(S.race)) : null,
      save: JSON.parse(JSON.stringify(save)), custom: S.P ? { t: S.P.t, set: S.P.set || '', b: S.P.b, unplaced: (S.puzzle && S.puzzle.unplaced || []).length } : null };
  }
  window.__brbTest = Object.assign(window.__brbTest || {}, {
    state: state,
    start: function (opts) { opts = opts || {}; startPuzzle(Object.assign({}, opts, { race: opts.race ? 'new' : undefined })); return state(); },
    startOwn: function (P) { startPuzzle({ custom: Object.assign({ t: '', s: 0, d: 'medium', r: 1, b: true, set: '', mine: false }, P) }); return state(); },
    next: function () { var b = document.getElementById('wh-next'); if (b) b.click(); return state(); },
    select: function (a, b) { return trySelect([a[0], a[1]], [b[0], b[1]]); },
    solveAll: function () { S.words.filter(function (w) { return !w.found; }).forEach(function (w) { trySelect(w.start, w.end); }); return state(); },
    skipAnimations: function (on) { fast = on !== false; return fast; },
    generate: function (theme, difficulty, seed) { return H.generatePuzzle(theme, difficulty, seed >>> 0); },
    layout: function (words, o) { return H.layout(words, o || {}); },
    hint: function () { return useHint(); },
    readWords: function () { return readWords(); },
    pause: function (on) { setPaused(on !== false); return state(); },
    quit: function () { S.race = null; clearTimeout(resultsTimer); stopSpeaking(); showHome(); return state(); },
    today: function (d) { todayOverride = d || null; if (S.screen === 'home') showHome(); return todayStr(); },
    daily: function (d) { return dailyFor(d || todayStr()); },
    cellCenter: function (r, c) { var b = D.board.getBoundingClientRect(); return { x: b.left + (c + 0.5) * cellPx, y: b.top + (r + 0.5) * cellPx }; },
    whState: function () {
      return { screen: S.screen, draft: S.draft ? S.draft.w.length : 0, draftSet: S.draft ? S.draft.set || '' : '', mine: save.mine.length, sheets: SHEETS.list ? SHEETS.list.length : -1,
        size: S.screen === 'preview' && S.prevL ? S.prevL.size : S.n, unplaced: S.screen === 'preview' && S.prevL ? S.prevL.unplaced.length : 0 };
    }
  });
  begin();
})();
</script>
