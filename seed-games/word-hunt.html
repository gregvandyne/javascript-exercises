<title>Word Hunt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Word Hunt: a kid-friendly word search.
   Layout (portrait): HUD (pause / theme + timer / mute), the letter grid on a notebook card, the word list
   (emoji + word chips), and a tools row (Hint, Read to me). In wide screens (landscape phones, desktops) the grid
   sits on the left and everything else stacks in a side column so the letters stay big.
   A full-screen canvas behind everything draws the theme's scene (bubbles + a whale for Ocean, stars + a rocket
   for Space...). Overlays: title screen, pause and results. */
:root{
  --th1:#ffe7a8; --th2:#ffd08a; --acc:#e8892b; --accDark:#b45f12; --accSoft:#fff1dc;
  --ink:#23324a; --paper:#fffdf4; --card:#ffffff; --muted:#5d6b80;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --letters:"Andika","Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;font-family:var(--display);color:var(--ink);background:linear-gradient(180deg,var(--th1),var(--th2));
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--ink);outline-offset:2px}

/* ---------- play screen ---------- */
.app{position:relative;z-index:1;height:100%;max-width:1200px;margin:0 auto;display:grid;gap:8px;
  padding:8px max(8px,env(safe-area-inset-right)) 10px max(8px,env(safe-area-inset-left));
  grid-template-areas:"hud" "board" "words" "tools";grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-columns:minmax(0,1fr)}
.app.offstage{visibility:hidden} /* the title screen covers the game; keep the live HUD out of sight */
.hud{grid-area:hud;display:flex;align-items:center;gap:8px;min-width:0}
.icon-btn{width:46px;height:46px;flex:none;border:0;border-radius:50%;background:#fff;font-size:1.3rem;box-shadow:0 4px 0 rgba(0,0,0,.18);display:grid;place-items:center;padding:0}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.info{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:3px 14px 3px 4px;box-shadow:0 3px 0 rgba(0,0,0,.14);min-height:46px}
.info canvas{width:40px;height:40px;flex:none;display:block}
.infoText{min-width:0;display:flex;flex-direction:column;line-height:1.1}
.infoText b{font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.infoText span{font-size:.95rem;color:var(--muted);font-weight:600;white-space:nowrap}
.boardWrap{grid-area:board;position:relative;min-height:0;min-width:0}
.card{position:absolute;background:var(--paper);border-radius:16px;padding:5px;box-shadow:0 0 0 4px #fff,0 8px 0 4px rgba(0,0,0,.13)}
.card::before,.card::after{content:"";position:absolute;top:-10px;width:58px;height:20px;background:rgba(255,226,120,.85);border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.card::before{left:14px;transform:rotate(-8deg)} .card::after{right:14px;transform:rotate(7deg)} /* two bits of sticky tape: the notebook look */
canvas#grid{display:block;touch-action:none;outline:none;border-radius:10px}
.card:focus-within{box-shadow:0 0 0 4px var(--ink),0 8px 0 4px rgba(0,0,0,.13)}
.hud{position:relative}
/* Messages pop up over the HUD's middle pill (never over the letters). */
.toast{position:absolute;left:54px;right:54px;top:50%;transform:translateY(-50%) scale(.9);min-height:46px;display:flex;align-items:center;justify-content:center;
  background:var(--ink);color:#fff;font-weight:600;font-size:1rem;line-height:1.2;text-align:center;padding:5px 12px;border-radius:18px;pointer-events:none;
  opacity:0;transition:opacity .2s,transform .2s;z-index:3;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateY(-50%) scale(1)}
.toast.long{font-size:.9rem;line-height:1.15}
.words{grid-area:words;list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;align-content:flex-start}
.words li{display:contents}
.wchip{display:flex;align-items:center;gap:5px;min-height:38px;border:3px solid transparent;background:#fff;border-radius:14px;padding:2px 10px 2px 6px;
  font:700 1.08rem/1 var(--letters);letter-spacing:.04em;box-shadow:0 3px 0 rgba(0,0,0,.12);position:relative}
.wchip .em{font-size:1.25rem;line-height:1}
.wchip.found{background:linear-gradient(var(--band,#dcfce7),var(--band,#dcfce7)) #fff;border-color:var(--bandDark,#16a34a);color:#2b3445}
.wchip.found .w{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--bandDark,#16a34a)}
.wchip.found::after{content:"✓";position:absolute;top:-9px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--bandDark,#16a34a);color:#fff;font:700 .8rem/20px var(--display);text-align:center}
.wchip.pop{animation:pop .45s ease-out}
.wchip.speaking{border-color:var(--acc);transform:translateY(-2px)}
.wchip.hinted:not(.found){border-color:#f5b400;border-style:dashed}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.22) rotate(-4deg)}70%{transform:scale(.95)}100%{transform:scale(1)}}
.tools{grid-area:tools;display:flex;gap:8px;justify-content:center}
.words.many .wchip{min-height:34px;font-size:1rem;padding:1px 8px 1px 4px;border-width:2px}
.words.many .wchip .em{font-size:1.1rem}
.words.many{gap:5px}
.tool{flex:1;max-width:220px;min-height:48px;border:0;border-radius:16px;font-weight:700;font-size:1.05rem;color:#fff;padding:6px 10px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tool .cost{font-size:.8rem;opacity:.9;font-weight:600}
.tool.hint{background:#f59f00;box-shadow:0 4px 0 #b66d00}
.tool.read{background:#7c4dff;box-shadow:0 4px 0 #5129c2}
.tool:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.tool:disabled{opacity:.45;cursor:default}

/* Short portrait phones: tighter spacing and smaller word chips, so a long Hard list never shrinks the letters. */
@media (max-aspect-ratio:5/4) and (max-height:720px){
  .app{gap:6px;padding-top:6px;padding-bottom:8px}
  .words.many{gap:4px}
  .words.many .wchip{min-height:30px;font-size:.95rem;padding:0 7px 0 4px;gap:3px;border-radius:12px}
  .words.many .wchip .em{font-size:1rem}
  .words.many .wchip.found::after{top:-7px;right:-5px;width:17px;height:17px;font-size:.7rem;line-height:17px}
  .tool{min-height:44px}
}
/* Wide screens (landscape phones, tablets, desktops): grid on the left, the rest in a side column. */
@media (min-aspect-ratio:5/4){
  .app{grid-template-areas:"board hud" "board words" "board tools";grid-template-columns:minmax(0,1fr) minmax(250px,360px);
    grid-template-rows:auto minmax(0,1fr) auto;column-gap:16px;padding-top:10px}
  .words{align-content:center;overflow:auto;padding:8px 2px}
  .tools{flex-wrap:wrap}
}
@media (min-aspect-ratio:5/4) and (min-width:1000px) and (min-height:640px){
  .app{grid-template-columns:minmax(0,1fr) minmax(300px,440px)}
  .words .wchip,.words.many .wchip{min-height:46px;font-size:1.3rem;padding:3px 12px 3px 8px;border-width:3px}
  .words .wchip .em,.words.many .wchip .em{font-size:1.5rem}
  .words,.words.many{gap:8px}
  .tool{min-height:56px;font-size:1.15rem}
}
.app.paused canvas#grid{filter:blur(7px)} /* no peeking while the timer is stopped */
@media (min-aspect-ratio:5/4) and (max-height:430px){
  .card::before,.card::after{display:none}
  .wchip{min-height:34px;font-size:1rem;padding:1px 8px 1px 4px}
  .wchip .em{font-size:1.1rem}
  .tool{min-height:44px;font-size:1rem}
}

/* ---------- overlays ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
.screen.dim{background:rgba(35,50,74,.42)}
.screen.results{align-items:flex-end;pointer-events:none;background:rgba(35,50,74,.12)} /* the solved grid stays visible above the panel */
.screen.results .panel{pointer-events:auto;margin:0 auto}
.panel{position:relative;background:var(--card);border-radius:28px;padding:14px 16px 16px;width:min(100%,460px);max-height:100%;overflow:auto;text-align:center;
  box-shadow:0 10px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;gap:8px;margin:auto}
.panel h1{margin:0;font-size:clamp(2.2rem,10vw,3rem);line-height:1;color:var(--acc);letter-spacing:.01em;text-shadow:0 3px 0 rgba(0,0,0,.08)}
.panel h2{margin:0;font-size:clamp(1.5rem,7vw,2rem);line-height:1.1;color:var(--acc)}
.panel p{margin:0;font-size:1.05rem;line-height:1.3}
.panel .sub{font-size:.95rem;color:var(--muted)}
.corner{position:absolute;top:10px;inset-inline-end:10px}
.big-btn{border:0;border-radius:20px;background:var(--acc);color:#fff;font-weight:700;font-size:1.45rem;padding:12px 30px;min-height:58px;min-width:200px;box-shadow:0 6px 0 var(--accDark)}
.big-btn.alt{background:var(--accSoft);color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.14);font-size:1.15rem;min-height:52px}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accDark)}
.chip{font-weight:700;background:#fff4cc;border-radius:999px;padding:6px 14px;font-size:1rem;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

/* Title screen */
.titlePanel{display:grid;width:min(100%,480px);grid-template-columns:minmax(0,1fr);justify-items:center;gap:8px;
  grid-template-areas:"art" "name" "tag" "daily" "diff" "themes" "opts" "play"}
.nameBox{grid-area:name;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.practise{margin:0;font-size:1rem;font-weight:600;line-height:1.2;color:var(--ink)}
/* Not in English: the "practise English words" line takes the tagline's place on phones, so the menu still fits. */
@media (max-height:800px){.titlePanel.hasPractise .tag{display:none}}
/* Long words (German, Russian, Japanese) stay on one line and shrink to fit (fitLabels). */
.daily{white-space:nowrap;overflow:hidden;min-width:0}
.daily .streak{font-size:.86em}
.row button{overflow:hidden}
.row button .dn{white-space:nowrap}
.row button small{font-size:.72em}
.titleArt{grid-area:art;width:140px;height:96px;display:block}
.tag{grid-area:tag}
.daily{grid-area:daily;width:100%;min-height:52px;border:3px solid #ffd43b;background:#fff9db;border-radius:18px;font-weight:700;font-size:1.1rem;
  display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 10px;box-shadow:0 4px 0 #f0c419}
.daily .streak{background:#fff;border-radius:999px;padding:3px 10px;font-size:.95rem;white-space:nowrap}
.daily.done{background:#ebfbee;border-color:#8ce99a;box-shadow:0 4px 0 #69db7c}
.row{grid-area:diff;display:flex;gap:6px;width:100%}
.row button,.themes button,.opt{border:3px solid rgba(0,0,0,.08);background:#f7f7fb;border-radius:16px;font-weight:700}
.row button{flex:1;min-width:0;min-height:48px;font-size:1.05rem;padding:4px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.row button small{font-size:.75rem;font-weight:600;opacity:.75}
.row button[aria-pressed="true"],.themes button[aria-pressed="true"]{background:var(--acc);border-color:var(--accDark);color:#fff}
.themes{grid-area:themes;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:100%}
.themes button{min-height:56px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.8rem;line-height:1.05;min-width:0}
.themes button .te{font-size:1.5rem;line-height:1}
.themes button .tn{max-width:100%;overflow:hidden;white-space:nowrap}   /* long names shrink to fit (fitLabels) */
.opts{grid-area:opts;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.opt{min-height:44px;padding:4px 14px;font-size:1rem}
.opt[aria-pressed="true"]{background:#d3f9d8;border-color:#40c057}
.playRow{grid-area:play;display:flex;gap:8px;width:100%;justify-content:center;align-items:stretch}
.playRow .big-btn{flex:1.3;min-width:0;padding:10px 12px}
.playRow .big-btn.race{flex:1;font-size:1rem;line-height:1.1;white-space:normal;padding:6px 8px}
@media (max-height:680px){.tag{display:none}.titleArt{height:80px}}
@media (min-aspect-ratio:5/4) and (max-height:600px){
  .titlePanel{width:min(100%,820px);grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);column-gap:16px;align-items:center;
    grid-template-areas:"art themes" "name themes" "daily themes" "diff opts" "play opts"}
  .titleArt{width:120px;height:66px}
  .tag{display:none}
  .themes button{min-height:50px}
  .titlePanel .corner{inset-inline-end:auto;inset-inline-start:10px}
  .titlePanel h1{font-size:2.2rem}
}
@media (min-aspect-ratio:5/4) and (max-height:400px){.titleArt{display:none}.titlePanel{grid-template-areas:"name themes" "daily themes" "diff themes" "play opts"}}

/* Results */
.resPanel .resArt{width:120px;height:80px;display:block}
.stars{font-size:2.6rem;line-height:1;letter-spacing:.08em}
.stars .off{filter:grayscale(1);opacity:.35}
.stars span{display:inline-block}
.stars span.pop{animation:starPop .5s ease-out both}
@keyframes starPop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1)}}
.btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
.btns .big-btn{width:100%;min-width:0;font-size:1.2rem;padding:8px 12px;min-height:52px;white-space:nowrap}
@media (min-aspect-ratio:5/4){
  .screen.results{align-items:center;justify-content:flex-end}
  .screen.results .panel{width:min(100%,360px);margin:0}
  .app.over .hud,.app.over .words,.app.over .tools{visibility:hidden} /* the results panel takes the side column */
}
@media (min-aspect-ratio:5/4) and (max-height:430px){.resPanel .resArt{display:none}.resPanel{gap:6px;padding:12px}.stars{font-size:2.1rem}}
@media (max-aspect-ratio:5/4){.app.over .words,.app.over .tools{visibility:hidden}}
@media (max-width:374px){
  .screen{padding:8px}
  .panel{padding:12px 10px 14px}
  .themes{gap:5px}
  .themes button{font-size:.74rem;border-width:2px}
  .opt{padding:4px 10px;font-size:.92rem}
  .chip{padding:5px 10px;font-size:.92rem}
  .row button{font-size:.95rem}
  .wchip{font-size:1rem;padding:2px 8px 2px 5px}
  .tool{font-size:.98rem}
}
@media (prefers-reduced-motion:reduce){
  .wchip.pop,.stars span.pop{animation:none}
  .toast{transition:none}
}
</style>

<canvas id="bg" aria-hidden="true"></canvas>

<div class="app offstage" id="app">
  <div class="hud" id="hud">
    <button class="icon-btn" id="pauseBtn" aria-label="Pause" data-i18n-aria="pause">⏸️</button>
    <div class="info">
      <canvas id="hudArt" aria-hidden="true"></canvas>
      <div class="infoText"><b id="themeName">Animals</b><span id="hudSub" aria-live="off">⏱ 0:00 · 0 of 6</span></div>
    </div>
    <button class="icon-btn mute" aria-label="Turn sound off">🔊</button>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <div class="boardWrap" id="boardWrap">
    <div class="card" id="card"><canvas id="grid" tabindex="0" data-i18n-aria="gridLabel" aria-label="Letter grid. Drag across a word, or tap its first letter and then its last letter. With a keyboard, use the arrow keys and press Enter on the first and last letter."></canvas></div>
  </div>
  <ul class="words" id="words" aria-label="Words to find" data-i18n-aria="wordsLabel" dir="ltr"></ul>
  <div class="tools" id="tools">
    <button class="tool hint" id="hintBtn">💡 <span data-i18n="hint">Hint</span> <span class="cost" id="hintCost" dir="ltr"></span></button>
    <button class="tool read" id="readBtn">🗣️ <span data-i18n="read">Read to me</span></button>
  </div>
</div>

<section class="screen" id="titleScreen">
  <div class="panel titlePanel">
    <canvas class="titleArt" id="titleArt" aria-hidden="true"></canvas>
    <div class="nameBox"><h1 dir="ltr">Word Hunt</h1><p class="practise" id="practise" hidden></p></div>
    <p class="tag" data-i18n="tag">Find the hidden words!</p>
    <button class="daily" id="dailyBtn"><span id="dailyTxt">📅 Daily puzzle</span> <span class="streak" id="streakChip">🔥 0</span></button>
    <div class="row" role="group" aria-label="How hard" data-i18n-aria="howHard">
      <button data-diff="easy" aria-pressed="true"><span class="dn">🐣 <span data-i18n="lvl_easy">Easy</span></span><small dir="ltr">8 × 8</small></button>
      <button data-diff="medium" aria-pressed="false"><span class="dn">🦊 <span data-i18n="lvl_medium">Medium</span></span><small dir="ltr">10 × 10</small></button>
      <button data-diff="hard" aria-pressed="false"><span class="dn">🦁 <span data-i18n="lvl_hard">Hard</span></span><small dir="ltr">12 × 12</small></button>
    </div>
    <div class="themes" id="themes" role="group" aria-label="Pick a theme" data-i18n-aria="pickTheme"></div>
    <div class="opts">
      <button class="opt" id="relaxBtn" aria-pressed="false">🌿 <span data-i18n="relaxOpt">Relax (no timer)</span></button>
      <span class="chip" id="pointsChip">⭐ 0 points</span>
    </div>
    <div class="playRow">
      <button class="big-btn" id="playBtn">▶ <span data-i18n="play">Play</span></button>
      <button class="big-btn alt race" id="raceBtn">👫 <span data-i18n="race">Race a friend</span></button>
    </div>
    <button class="icon-btn mute corner" aria-label="Turn sound off">🔊</button>
  </div>
</section>

<section class="screen dim" id="pauseScreen" hidden>
  <div class="panel">
    <h2 data-i18n="paused">Paused</h2>
    <p data-i18n="pausedMsg">Take a little break. The timer is stopped.</p>
    <button class="big-btn" id="resumeBtn">▶ <span data-i18n="resume">Keep playing</span></button>
    <button class="big-btn alt" id="quitBtn">🏠 <span data-i18n="changeTheme">Change theme</span></button>
    <button class="icon-btn mute corner" aria-label="Turn sound off">🔊</button>
  </div>
</section>

<section class="screen results" id="resultsScreen" hidden>
  <div class="panel resPanel" role="dialog" aria-labelledby="resTitle">
    <canvas class="resArt" id="resArt" aria-hidden="true"></canvas>
    <h2 id="resTitle">You found them all!</h2>
    <div class="stars" id="resStars" aria-label="3 stars"></div>
    <div class="chips" id="resChips"></div>
    <p class="sub" id="resNote"></p>
    <div class="btns">
      <button class="big-btn" id="nextBtn">▶ Next puzzle</button>
      <button class="big-btn alt" id="changeBtn">🎨 Change theme</button>
    </div>
  </div>
</section>

<script>
/* =====================================================================================
   CONFIG: change these to make the game your own!
   ===================================================================================== */
const CONFIG = {
  title: 'Word Hunt',
  saveKey: 'word-hunt-v1',
  levels: {
    // size: grid is size x size. words: [min, max] words per puzzle. maxLen: longest word allowed.
    // points: base points for solving. targetSec: finish faster than this (with no hints) for 3 stars.
    easy:   { name: 'Easy',   emoji: '🐣', size: 8,  words: [5, 6],   minLen: 3, maxLen: 5,  dirs: ['E', 'S'],             points: 10, targetSec: 120 },
    medium: { name: 'Medium', emoji: '🦊', size: 10, words: [8, 8],   minLen: 3, maxLen: 8,  dirs: ['E', 'S', 'SE'],       points: 20, targetSec: 210 },
    hard:   { name: 'Hard',   emoji: '🦁', size: 12, words: [10, 12], minLen: 3, maxLen: 11, dirs: ['E', 'S', 'SE', 'NE', 'W', 'N', 'NW', 'SW'], points: 30, targetSec: 360 }
  },
  hintCost: 3,            // points taken off for each hint
  minPoints: 5,           // a solved puzzle is always worth at least this much
  timeBonusMax: 1,        // time bonus: up to (level points x this) for a fast finish
  overlapChance: 0.65,    // how often the generator tries to cross words over a shared letter
  maxCellPx: 64,          // biggest letter box on large screens
  dailyDifficulty: 'medium',
  speechRate: 0.9,        // a found word read aloud: a touch slower than talking (1) so a young reader hears every sound
  talkRate: 1,            // messages and cheers: normal talking speed sounds the most natural
  race: { players: [['🦊', 'Player 1'], ['🐸', 'Player 2']], hintSeconds: 15 },   // "Race a friend": each hint adds this many seconds
  // Colour-blind-safe highlight colours (Okabe-Ito family). Each band also gets a pattern and a dark outline.
  bands: [
    ['#f5b942', '#a86b00'], ['#7cc6f0', '#1f6f9e'], ['#3fc39a', '#0b6b4f'], ['#f2e85c', '#8f8600'],
    ['#5b9be0', '#0a4f94'], ['#f08a4b', '#a5420b'], ['#e29bc6', '#9c3f76'], ['#a3dd6b', '#4a7f1a']
  ],
  cheers: ['Great job!', 'You found it!', 'Super!', 'Wow!', 'Nice one!', 'Yes!', 'Awesome!', 'Way to go!']   // English; other languages: I18N below
};
// Level names, player names, cheers and theme names above are the English originals; what the player sees comes from I18N.

   LANGUAGES: every word the player sees (and every message the game says) in the 13 site languages.

/**
 * generatePuzzle(themeId, difficulty, seed) -> { theme, difficulty, seed, size, grid: [row strings], words: [{word, emoji, say, start, end, dir}], tries }
 * Places the words (longest first, crossing over shared letters when it can), fills the gaps with random letters,
 * then checks: no blocked word anywhere and every word can be found exactly once. Anything wrong -> refill or
 * re-place with the next random numbers. Deterministic: same (theme, difficulty, seed) -> same puzzle.
 */
function generatePuzzle(themeId, difficulty, seed) {
  const theme = THEME_BY_ID[themeId] || THEMES[0];

  const pool = theme.words.filter(w => w.word.length >= L.minLen && w.word.length <= Math.min(L.maxLen, n));
  let tries = 0;
  for (let attempt = 0; attempt < 3000; attempt++) {
    // 1. choose the words: shuffled, and never one word hiding inside another (CAT inside CATERPILLAR)
    const want = L.words[0] + Math.floor(rng() * (L.words[1] - L.words[0] + 1));
    const shuffled = pool.slice(); for (let i = shuffled.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
    const chosen = [];
    for (const w of shuffled) {
      if (chosen.length >= want) break;
      if (chosen.some(x => x.word.includes(w.word) || w.word.includes(x.word) || x.word.includes(reverse(w.word)) || w.word.includes(reverse(x.word)))) continue;
      chosen.push(w);
    }
    if (chosen.length < L.words[0]) continue;
    chosen.sort((a, b) => b.word.length - a.word.length);
    for (let placeTry = 0; placeTry < 6; placeTry++) {
      tries++;

      const grid = new Array(n * n).fill(''), axes = new Array(n * n).fill(0); // axes: bit mask of lines through each cell
      const placed = []; let failed = false;

            const er = r + dr * (len - 1), ec = c + dc * (len - 1);
            if (er < 0 || er >= n || ec < 0 || ec >= n) continue;
            let ok = true, cross = 0;
            for (let i = 0; i < len && ok; i++) {
              const k = (r + dr * i) * n + c + dc * i, g = grid[k];
              if (g === '') continue;
              if (g !== w.word[i] || (axes[k] & ax)) ok = false; else cross++;   // share a letter only across another line
            }
            if (!ok) continue;
            (byDir[dn] = byDir[dn] || []).push([r, c]);
            if (cross) (crossDir[dn] = crossDir[dn] || []).push([r, c]);
          }

      }
      if (failed) continue;
      // 3. fill the gaps; check for blocked words and for words that show up twice
      for (let fillTry = 0; fillTry < 10; fillTry++) {
        const full = grid.map(g => g || FILLER[Math.floor(rng() * FILLER.length)]);
        if (hasBlocked(full, n)) continue;
        if (!placed.every(p => findAll(full, n, p.word).length === 1)) continue;
        const rows = []; for (let r = 0; r < n; r++) rows.push(full.slice(r * n, r * n + n).join(''));

}

/** Draw a mascot into a small canvas (HUD, title, results). bob > 0 makes it bounce gently. */
function paintArt(cv, themeId, cssW, cssH, opts = {}) {
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  if (cv.width !== Math.round(cssW * dpr) || cv.height !== Math.round(cssH * dpr)) { cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr); }
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, cssW, cssH);
  const draw = ART[themeId] || ART.surprise, t = opts.t || 0;
  if (opts.lens) {   // the title logo: the theme mascot seen through a magnifying glass
    const R = cssH * 0.4, cx = cssW / 2 - R * 0.25, cy = cssH * 0.46 + (REDUCED ? 0 : Math.sin(t * 2.2) * 2);
    c.save(); c.translate(cx, cy); c.rotate(-0.2);
    c.strokeStyle = '#7a4b1f'; c.lineWidth = R * 0.32; c.lineCap = 'round'; c.beginPath(); c.moveTo(R * 0.95, R * 0.4); c.lineTo(R * 1.6, R * 0.95); c.stroke();
    c.restore();

    g.addColorStop(0, th ? th.sky[0] : '#e7f5ff'); g.addColorStop(1, th ? th.sky[1] : '#a5d8ff');

    c.save(); circ(c, cx, cy, R); c.clip(); c.translate(cx, cy + R * 0.08 + (REDUCED ? 0 : Math.sin(t * 3) * R * 0.05)); draw(c, R * 1.7); c.restore();
    c.globalAlpha = 0.35; ell(c, cx - R * 0.45, cy - R * 0.45, R * 0.28, R * 0.14, -0.7, '#fff'); c.globalAlpha = 1;
    c.strokeStyle = '#ffb703'; c.lineWidth = R * 0.16; circ(c, cx, cy, R); c.stroke();

}

/** The full-screen theme scene behind the game (redrawn on resize / theme change only). */
function paintBackground() {
  const cv = $('bg'), dpr = Math.min(2, window.devicePixelRatio || 1), w = innerWidth, h = innerHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const id = S.screen === 'title' ? (S.pickTheme === 'surprise' ? 'surprise' : S.pickTheme) : S.theme;
  const th = THEME_BY_ID[id] || { sky: ['#e7f5ff', '#b2f2bb'] };
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]); c.fillStyle = g; c.fillRect(0, 0, w, h);
  const rng = mulberry32(hashStr(id)), motif = MOTIF[id] || MOTIF.surprise, count = Math.round(w * h / 7000);
  c.globalAlpha = id === 'space' ? 0.85 : 0.3;
  for (let i = 0; i < count; i++) motif(c, rng() * w, rng() * h, 14 + rng() * 22, i);
  c.globalAlpha = 1;

  if (id === 'ocean') { c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.moveTo(0, h); for (let x = 0; x <= w + 40; x += 40) c.lineTo(x, h - 40 - Math.sin(x / 50) * 10); c.lineTo(w, h); c.fill(); }

  // two big mascots peeking in from the corners

  c.save(); c.globalAlpha = 0.92; c.translate(big * 0.42, h - big * 0.38); c.rotate(-0.12); art(c, big); c.restore();
  c.save(); c.globalAlpha = 0.92; c.translate(w - big * 0.4, big * 0.42); c.rotate(0.15); art(c, big * 0.8); c.restore();
}

/* =====================================================================================
   Sound + speech (speechSynthesis may be missing: every use is guarded)
   ===================================================================================== */
function sfx(name) { try { BRB.sfx.play(name); } catch (e) { /* ignore */ } }
/* Voices: BRB.speak picks the most natural voice for the language and speaks at the normal pitch.
   The game needs the SDK (it is always there on Oomba Academy). With an older SDK that has no BRB.speak, nothing is
   spoken (the word is shown instead): a lang-only utterance would let the browser pick a voice itself, often its
   most robotic one. Rates (1 = normal talking): see CONFIG.speechRate / CONFIG.talkRate. */
function canSpeak() { try { return !!(window.speechSynthesis && window.SpeechSynthesisUtterance); } catch (e) { return false; } }
function speakLine(text, lang, rate, queue) {
  try {
    return typeof BRB.speak === 'function' ? BRB.speak(text, { lang, rate, queue }) : false;
  } catch (e) { return false; }
}
/** Speaks an English word (always an en-US voice, whatever the menu language). */
function say(text, queue) { return speakLine(text, 'en-US', CONFIG.speechRate, queue); }
/** Says a message in the menu language. Placeholders named in enKeys are English words: they get the English voice.
    With no voice on the device for the menu language, only the English words are spoken. */
function sayT(key, vars = {}, enKeys = ['w', 'l']) {
  if (IS_EN) return speakLine(t(key, vars), LANG, CONFIG.talkRate, false);
  const local = Object.assign({}, vars); enKeys.forEach(k => { delete local[k]; });
  let first = true, any = false;
  const go = (text, lang) => { if (speakLine(text, lang, CONFIG.talkRate, !first)) any = true; first = false; };
  t(key, local).split(/(\{\w+\})/).forEach(seg => {
    const m = /^\{(\w+)\}$/.exec(seg);
    if (m) { if (vars[m[1]] != null) go(String(vars[m[1]]), 'en-US'); }
    else if (/\p{L}/u.test(seg)) go(seg.replace(/^[\s\p{P}]+/u, '').trim(), LANG);
  });
  return any;
}
function stopSpeaking() {
  try { if (typeof BRB.stopSpeaking === 'function') BRB.stopSpeaking(); else if (canSpeak()) window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
  clearReadTimers();
}
let readTimers = [];
function clearReadTimers() { readTimers.forEach(clearTimeout); readTimers = []; document.querySelectorAll('.wchip.speaking').forEach(b => b.classList.remove('speaking')); }

/* =====================================================================================
   Starting a puzzle
   ===================================================================================== */
function startPuzzle(opts = {}) {
  let theme = opts.theme || S.pickTheme, difficulty = LEVEL_IDS.includes(opts.difficulty) ? opts.difficulty : S.difficulty;
  let seed = opts.seed != null ? (opts.seed >>> 0) : randSeed(), daily = !!opts.daily;
  if (daily) { const d = dailyFor(todayStr()); theme = d.theme; difficulty = d.difficulty; seed = d.seed; }
  if (theme === 'surprise' || !THEME_BY_ID[theme]) {   // "Surprise me": a different theme from last time
    const others = THEMES.filter(t => t.id !== S.theme); theme = others[Math.floor(Math.random() * others.length)].id;
  }
  let p = generatePuzzle(theme, difficulty, seed);
  while (!p) { seed = (seed + 1) >>> 0; p = generatePuzzle(theme, difficulty, seed); }   // (never needed; belt and braces)
  stopSpeaking();
  if (opts.race === 'new') S.race = { turn: 0, results: [] };
  else if (opts.race !== 'next') S.race = null;
  if (S.race) daily = false;
  Object.assign(S, { screen: 'play', theme, difficulty, seed, daily, puzzle: p, n: p.size, letters: p.grid.map(r => r.split('')),
    words: p.words.map((w, i) => Object.assign({}, w, { found: false, band: -1, idx: i })),
    found: 0, timeMs: 0, hintsUsed: 0, done: false, paused: false, pending: null, drag: null, cursor: [0, 0], hint: null,
    bands: [], fails: [], parts: [], lastPoints: 0 });
  applyThemeColours(theme);
  $('titleScreen').hidden = true; $('resultsScreen').hidden = true; $('pauseScreen').hidden = true;
  $('app').classList.remove('offstage', 'over', 'paused');
  const racer = S.race ? [CONFIG.race.players[S.race.turn][0], playerName(S.race.turn)] : null;
  $('themeName').textContent = racer ? racer[0] + ' ' + racer[1] + ' · ' + themeName(theme) : (daily ? '📅 ' : '') + themeName(theme);
  buildWordList();
  $('hintCost').textContent = '−' + CONFIG.hintCost;
  paintBackground(); layout(); updateHud(true);
  paintArt($('hudArt'), theme, 40, 40, { scale: 0.95 });
  sfx('powerup');
  if (racer) toast(t('raceGo', { p: racer[0] + ' ' + racer[1], n: S.words.length }), 2400);
  else if (save.seenHelp < 2) { toast(t('toastHelp'), 3800); save.seenHelp++; persist(); }
  else toast(t('toastFind', { n: S.words.length, theme: IS_EN ? themeName(theme).toLowerCase() : themeName(theme) }), 2000);
  lastTick = performance.now(); dirty = true;
  focusIfKeys(gridCv);
}
function applyThemeColours(id) {
  const th = THEME_BY_ID[id]; if (!th) return; const st = document.documentElement.style;
  accCache = null;   // the drag band colour follows the theme
  st.setProperty('--th1', th.sky[0]); st.setProperty('--th2', th.sky[1]); st.setProperty('--acc', th.acc[0]); st.setProperty('--accDark', th.acc[1]); st.setProperty('--accSoft', th.acc[2]);
}

/* ---------- the word list (real buttons, so screen readers can read it; a tap reads the word aloud) ---------- */
function buildWordList() {
  const ul = $('words'); ul.innerHTML = ''; ul.classList.toggle('many', S.words.length > 8);
  S.words.forEach((w, i) => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.className = 'wchip'; b.dataset.i = i; b.dir = 'ltr';   // the words are English
    b.innerHTML = '<span class="em" aria-hidden="true">' + w.emoji + '</span><span class="w">' + w.word + '</span>';
    b.setAttribute('aria-label', t('chipNotFound', { w: w.word.toLowerCase() }));
    b.addEventListener('click', () => { if (!say(w.say)) toast('🔈 ' + w.word); sfx('click'); b.classList.remove('pop'); void b.offsetWidth; if (!REDUCED) b.classList.add('pop'); });
    li.appendChild(b); ul.appendChild(li);

function chipFor(w) { return $('words').querySelector('[data-i="' + w.idx + '"]'); }

/* =====================================================================================
   Layout: the grid always fits. The canvas takes the largest square that fits its area.
   ===================================================================================== */
let cell = 40;            // CSS pixels per letter box
const gridCv = $('grid'), gctx = gridCv.getContext('2d');
function layout() {
  if (S.screen === 'title') return;
  const wrap = $('boardWrap'), W = wrap.clientWidth, H = wrap.clientHeight, pad = 5 * 2 + 8;   // card padding + the white ring
  const n = S.n;
  cell = Math.max(18, Math.min(CONFIG.maxCellPx, Math.floor((Math.min(W, H) - pad) / n)));
  const side = cell * n, dpr = Math.min(3, window.devicePixelRatio || 1);
  gridCv.style.width = side + 'px'; gridCv.style.height = side + 'px';
  gridCv.width = Math.round(side * dpr); gridCv.height = Math.round(side * dpr);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const card = $('card'), cw = side + 10;
  const wide = innerWidth >= innerHeight * 1.25;
  card.style.left = Math.max(4, Math.round((W - cw) / 2)) + 'px';
  card.style.top = Math.max(4, wide ? Math.round((H - cw) / 2) : Math.round((H - cw) / 2)) + 'px';
  dirty = true; draw(performance.now());

/* =====================================================================================
   Drawing the grid: paper, found-word bands (colour + pattern + outline), the drag band, letters, hint glow, sparkles
   ===================================================================================== */
let dirty = true;
const center = (r, c) => [(c + 0.5) * cell, (r + 0.5) * cell];
function capsulePath(c, len, rad) {   // a rounded band along the x axis from 0 to len (local, rotated coordinates)
  c.beginPath(); c.arc(0, 0, rad, Math.PI / 2, Math.PI * 1.5); c.arc(len, 0, rad, -Math.PI / 2, Math.PI / 2); c.closePath();
}
function capsule(c, x1, y1, x2, y2, rad) {   // a rounded band from one cell centre to another; call done() afterwards
  const a = Math.atan2(y2 - y1, x2 - x1), len = Math.hypot(x2 - x1, y2 - y1);
  c.save(); c.translate(x1, y1); c.rotate(a); capsulePath(c, len, rad);
  return { len, again: () => capsulePath(c, len, rad), done: () => c.restore() };
}
function drawBand(c, b, t) {
  const [fill, dark] = CONFIG.bands[b.color % CONFIG.bands.length];
  const p = b.born == null || fast || REDUCED ? 1 : Math.min(1, (t - b.born) / 260);
  const ease = 1 - Math.pow(1 - p, 3);
  const [x1, y1] = center(b.start[0], b.start[1]), [x2f, y2f] = center(b.end[0], b.end[1]);
  const x2 = x1 + (x2f - x1) * ease, y2 = y1 + (y2f - y1) * ease, rad = cell * 0.4;

  c.save(); c.clip(); c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = Math.max(1.5, cell * 0.06);
  const kind = (b.color + Math.floor(b.color / CONFIG.bands.length)) % 4;
  if (kind === 0) { c.beginPath(); for (let x = -rad * 2; x < len + rad * 2; x += cell * 0.32) { c.moveTo(x, -rad); c.lineTo(x + rad * 1.2, rad); } c.stroke(); }

  else if (kind === 2) { c.beginPath(); for (let x = -rad; x < len + rad; x += cell * 0.3) { c.moveTo(x, -rad * 0.55); c.lineTo(x + cell * 0.15, -rad * 0.2); c.lineTo(x + cell * 0.3, -rad * 0.55); c.moveTo(x, rad * 0.55); c.lineTo(x + cell * 0.15, rad * 0.2); c.lineTo(x + cell * 0.3, rad * 0.55); } c.stroke(); }

function draw(t) {

  // found-word bands
  for (const b of S.bands) drawBand(c, b, t);
  // wrong tries fade away with a little wobble
  S.fails = S.fails.filter(f => t - f.born < 520);
  for (const f of S.fails) {
    const k = (t - f.born) / 520, wob = REDUCED ? 0 : Math.sin(k * 30) * (1 - k) * cell * 0.08;
    const [x1, y1] = center(f.start[0], f.start[1]), [x2, y2] = center(f.end[0], f.end[1]);
    const cap = capsule(c, x1 + wob, y1, x2 + wob, y2, cell * 0.4); c.globalAlpha = 0.45 * (1 - k); c.fillStyle = '#868e96'; c.fill(); c.globalAlpha = 1; cap.done();

  if (sel) {

    c.setLineDash([cell * 0.18, cell * 0.12]); c.strokeStyle = getAcc(); c.lineWidth = Math.max(2, cell * 0.07); c.stroke(); c.setLineDash([]); cap.done();
  }

    const g = c.createRadialGradient(x, y, cell * 0.1, x, y, cell * (0.55 + pulse * 0.25));

  c.font = '700 ' + Math.round(cell * 0.6) + 'px Andika, Fredoka, "Trebuchet MS", sans-serif';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) c.fillText(S.letters[r][k], (k + 0.5) * cell, (r + 0.5) * cell + cell * 0.03);

  }

  c.globalAlpha = 1;

}
function getAcc() { if (!accCache) accCache = getComputedStyle(document.documentElement).getPropertyValue('--acc').trim() || '#e8590c'; return accCache; }

/* =====================================================================================
   Selecting words
   ===================================================================================== */
function inLine(a, b) { const dr = b[0] - a[0], dc = b[1] - a[1]; return (dr || dc) && (dr === 0 || dc === 0 || Math.abs(dr) === Math.abs(dc)); }

/** Try the letters from a to b (either way round). Returns true if that found a new word. */
function trySelect(a, b) {

  const w = S.words.find(x => (same(x.start, a) && same(x.end, b)) || (same(x.start, b) && same(x.end, a)));
  if (w && !w.found) { markFound(w); return true; }

  toast(letters.length > 2 ? t('notOnList', { w: isoEn(letters) }) : t('longer'), 1600);
  sfx('click'); dirty = true;

    chip.classList.add('found'); chip.classList.remove('hinted', 'pop'); void chip.offsetWidth; if (!REDUCED) chip.classList.add('pop');

  if (!REDUCED && !fast) for (const [r, c] of cellsOf(w.start, w.end)) for (let i = 0; i < 3; i++) {
    const [x, y] = center(r, c), a = Math.random() * TAU, sp = 0.4 + Math.random() * 0.8;

/* =====================================================================================
   Pointer input: drag in a straight line (touch, pen or mouse), or tap the first and then the last letter
   ===================================================================================== */
function pointCell(e) {
  const r = gridCv.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top;
  return { x, y, cell: [Math.max(0, Math.min(S.n - 1, Math.floor(y / cell))), Math.max(0, Math.min(S.n - 1, Math.floor(x / cell)))] };
}
/** The end cell nearest to the pointer along any of the 8 straight lines from the start (forgiving for small fingers). */
function snapEnd(start, x, y) {
  const n = S.n, [sx, sy] = center(start[0], start[1]);
  let best = start, bestD = Math.hypot(x - sx, y - sy);
  for (const [dr, dc] of ALL_DIRS) {
    let max = n; if (dr > 0) max = Math.min(max, n - 1 - start[0]); if (dr < 0) max = Math.min(max, start[0]); if (dc > 0) max = Math.min(max, n - 1 - start[1]); if (dc < 0) max = Math.min(max, start[1]);
    const stx = dc * cell, sty = dr * cell, k = Math.max(0, Math.min(max, Math.round(((x - sx) * stx + (y - sy) * sty) / (stx * stx + sty * sty))));
    if (k < 1) continue;
    const d = Math.hypot(x - (sx + k * stx), y - (sy + k * sty));
    if (d < bestD) { bestD = d; best = [start[0] + k * dr, start[1] + k * dc]; }

}
gridCv.addEventListener('pointerdown', e => {
  if (S.screen !== 'play' || S.done) return;
  if (S.drag) return;   // a second finger is ignored
  e.preventDefault();
  const p = pointCell(e);
  S.drag = { id: e.pointerId, start: p.cell, end: p.cell, moved: false, x0: p.x, y0: p.y };
  S.kb = false;
  try { gridCv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  dirty = true;
});
gridCv.addEventListener('pointermove', e => {
  const d = S.drag; if (!d || e.pointerId !== d.id) return;
  const p = pointCell(e);
  if (!d.moved && Math.hypot(p.x - d.x0, p.y - d.y0) < cell * 0.45) return;   // tiny wiggles are still a tap
  const end = snapEnd(d.start, p.x, p.y);
  if (!d.moved || end[0] !== d.end[0] || end[1] !== d.end[1]) { d.moved = true; d.end = end; dirty = true; }
});
function endDrag(e, cancel) {
  const d = S.drag; if (!d || e.pointerId !== d.id) return;
  S.drag = null; dirty = true;
  if (cancel) return;
  const same = d.end[0] === d.start[0] && d.end[1] === d.start[1];
  if (d.moved && !same) { S.pending = null; trySelect(d.start, d.end); return; }
  tapCell(d.start);
}
gridCv.addEventListener('pointerup', e => endDrag(e, false));
gridCv.addEventListener('pointercancel', e => endDrag(e, true));
gridCv.addEventListener('lostpointercapture', e => { if (S.drag && S.drag.id === e.pointerId) endDrag(e, false); });
/** Tap-tap selection: first tap marks the first letter, second tap (in a straight line) picks the last letter. */
function tapCell(rc) {
  if (!S.pending) { S.pending = rc; sfx('click'); toast(t('tapLast'), 1300); dirty = true; return; }
  const a = S.pending;
  if (a[0] === rc[0] && a[1] === rc[1]) { S.pending = null; dirty = true; return; }   // tap the same letter again to cancel
  if (!inLine(a, rc)) { S.pending = rc; sfx('click'); toast(t('straight'), 1500); dirty = true; return; }
  S.pending = null; trySelect(a, rc); dirty = true;
}

/* ---------- keyboard: arrows move a cursor, Enter / Space marks the first and the last letter ---------- */
gridCv.addEventListener('keydown', e => {
  if (S.screen !== 'play' || S.done) return;
  const k = e.key, mv = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[k];
  if (mv) {
    e.preventDefault(); S.kb = true;
    S.cursor = [Math.max(0, Math.min(S.n - 1, S.cursor[0] + mv[0])), Math.max(0, Math.min(S.n - 1, S.cursor[1] + mv[1]))];
    announce(t('kbCell', { r: S.cursor[0] + 1, c: S.cursor[1] + 1, l: S.letters[S.cursor[0]][S.cursor[1]] }));
    dirty = true; return;
  }
  if (k === 'Enter' || k === ' ') {
    e.preventDefault(); S.kb = true;
    if (!S.pending) { S.pending = S.cursor.slice(); sfx('click'); announce(t('kbFirst', { l: S.letters[S.cursor[0]][S.cursor[1]] })); }
    else if (S.pending[0] === S.cursor[0] && S.pending[1] === S.cursor[1]) { S.pending = null; announce(t('kbCancel')); }
    else if (!inLine(S.pending, S.cursor)) { announce(t('kbNotStraight')); sfx('click'); }

gridCv.addEventListener('focus', () => { dirty = true; });
gridCv.addEventListener('blur', () => { dirty = true; });
function announce(text) { toast(text, 1800); }

/* =====================================================================================
   HUD, toast, hint, read-aloud

let lastShownSec = -1;
function updateHud(force) {

  const count = t('count', { a: S.found, b: S.words.length });

}
let toastTimer = null;
function hideToast() { clearTimeout(toastTimer); $('toast').classList.remove('show'); }
function toast(text, ms = 1800) {
  const el = $('toast'); el.textContent = text; el.classList.add('show'); el.classList.toggle('long', text.length > 48);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), ms);

  const fresh = left.filter(w => !w.hinted), pool = fresh.length ? fresh : left;
  const w = pool[Math.floor(Math.random() * pool.length)];

}

  stopSpeaking();
  if (!canSpeak()) { toast(t('noTalk'), 2200); sfx('click'); }

/* =====================================================================================
   Finishing a puzzle: points, stars, saving, streak, results screen
   ===================================================================================== */
let resultsTimer = null;
function finishPuzzle() {
  S.done = true; S.pending = null; S.drag = null; stopSpeaking();
  if (S.race) return finishRaceTurn();
  const L = CONFIG.levels[S.difficulty], sec = S.timeMs / 1000;
  const fastEnough = save.relax || sec <= L.targetSec;
  const stars = 1 + (S.hintsUsed === 0 ? 1 : 0) + (fastEnough ? 1 : 0);
  const timeBonus = save.relax ? 0 : Math.round(Math.max(0, 1 - sec / (L.targetSec * 2)) * L.points * CONFIG.timeBonusMax);
  const points = Math.max(CONFIG.minPoints, L.points + timeBonus - S.hintsUsed * CONFIG.hintCost);
  S.lastPoints = points; S.lastStars = stars;
  const prevBest = save.best[S.difficulty];
  const newBest = !save.relax && (prevBest == null || S.timeMs < prevBest);
  if (newBest) save.best[S.difficulty] = Math.round(S.timeMs);
  save.total += points; save.puzzles++; save.stars += stars;
  save.solved[S.theme] = (save.solved[S.theme] || 0) + 1;
  let streakMsg = '';
  if (S.daily) {
    const today = todayStr();
    if (save.daily.last !== today) {
      save.daily.streak = save.daily.last === todayStr(-1) ? save.daily.streak + 1 : 1;
      save.daily.last = today; save.daily.bestStreak = Math.max(save.daily.bestStreak, save.daily.streak);
      streakMsg = save.daily.streak === 1 ? t('streakNew', { n: 1 }) : t('streakRow', { n: save.daily.streak });
    } else streakMsg = t('alreadyDaily', { n: save.daily.streak });
  }
  persist();
  BRB.score.submit(save.total, 'puzzle points');   // the leaderboard label stays English: everyone shares one leaderboard
  BRB.gameOver({ won: true, score: save.total });
  $('app').classList.add('over');
  const show = () => {
    S.screen = 'results';
    $('resTitle').textContent = stars === 3 ? t('resSuper') : t('resAll');
    $('resStars').innerHTML = [0, 1, 2].map(i => '<span class="' + (i < stars ? 'pop' : 'off') + '" style="animation-delay:' + (i * 0.18) + 's">⭐</span>').join('');
    $('resStars').setAttribute('aria-label', t('stars', { n: stars }));
    $('resChips').innerHTML = (save.relax ? '<span class="chip">🌿 ' + t('relax') + '</span>' : '<span class="chip">⏱ <span dir="ltr">' + fmtTime(S.timeMs) + '</span></span>') +
      '<span class="chip">💡 ' + t('hints', { n: S.hintsUsed }) + '</span><span class="chip good">' + t('plusPoints', { n: points }) + '</span>';
    const tips = [];
    if (streakMsg) tips.push(streakMsg);
    if (newBest && prevBest != null) tips.push(t('newBest', { level: levelName(S.difficulty) }));
    if (stars < 3 && !streakMsg) tips.push(S.hintsUsed ? t('tipNoHints') : t('tipFaster'));

  clearTimeout(resultsTimer);

/** Race a friend: player 1 solves, passes the phone, player 2 solves the same grid. Fastest wins (each hint adds time). */
function finishRaceTurn() {
  const R = S.race, me = [CONFIG.race.players[R.turn][0], playerName(R.turn)];
  R.results[R.turn] = { timeMs: Math.round(S.timeMs), hints: S.hintsUsed };
  $('app').classList.add('over');
  const total = r => r.timeMs + r.hints * CONFIG.race.hintSeconds * 1000;
  const line = (i) => { const r = R.results[i], pl = CONFIG.race.players[i]; return '<span class="chip" dir="ltr">' + pl[0] + ' ' + fmtTime(r.timeMs) + (r.hints ? ' + 💡' + r.hints : '') + '</span>'; };
  let winner = -1;
  if (R.turn === 1) { const a = total(R.results[0]), b = total(R.results[1]); winner = a === b ? 2 : (a < b ? 0 : 1); BRB.gameOver({ won: true, score: save.total }); }
  const show = () => {
    S.screen = 'results';
    if (R.turn === 0) {
      $('resTitle').textContent = t('raceDone', { p: me[0] + ' ' + me[1] });
      $('resStars').innerHTML = '<span>⏱️</span>'; $('resStars').setAttribute('aria-label', t('raceAria'));
      $('resChips').innerHTML = line(0);
      $('resNote').textContent = t('passPhone', { p: playerName(1) });
      $('nextBtn').textContent = '📱 ' + t('pGo', { p: playerName(1) }); $('changeBtn').textContent = '🏠 ' + t('stopRace');
      sayT('sayPass', { p: playerName(1) }, []);
    } else {
      const w = winner === 2 ? null : [CONFIG.race.players[winner][0], playerName(winner)];
      $('resTitle').textContent = winner === 2 ? t('tie') : t('wins', { p: w[0] + ' ' + w[1] });
      $('resStars').innerHTML = '<span class="pop">🏆</span>'; $('resStars').setAttribute('aria-label', t('raceOver'));
      $('resChips').innerHTML = line(0) + line(1);
      $('resNote').textContent = t('hintAdds', { n: CONFIG.race.hintSeconds });
      $('nextBtn').textContent = '🔁 ' + t('raceAgain'); $('changeBtn').textContent = '🎨 ' + t('changeTheme');
      if (winner === 2) sayT('tie'); else sayT('sayWins', { p: w[1] }, []);
    }
    paintArt($('resArt'), S.theme, 120, 80, { bob: true, t: 0 });
    hideToast(); $('resultsScreen').hidden = false; focusIfKeys($('nextBtn'));
  };
  if (!fast && R.turn === 1) setTimeout(() => BRB.fx.confetti({ colors: CONFIG.bands.map(b => b[0]) }), 300);
  clearTimeout(resultsTimer);
  if (fast) show(); else resultsTimer = setTimeout(show, 1100);
}

/* =====================================================================================
   Main loop: timer + animations (requestAnimationFrame, time based; the grid only redraws when something changed)
   ===================================================================================== */
let lastTick = performance.now(), artT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(100, now - lastTick); lastTick = now;
  if (S.screen === 'play' && !S.done && !S.paused) { S.timeMs += dt; updateHud(false); }
  if (S.screen === 'title') {   // the logo bobs gently
    artT += dt / 1000; paintArt($('titleArt'), S.pickTheme, titleArtSize.w, titleArtSize.h, { lens: true, t: artT });
  } else if (S.screen === 'results' && !REDUCED) { artT += dt / 1000; paintArt($('resArt'), S.theme, 120, 80, { bob: true, t: artT }); }
  if (S.screen === 'play' || S.screen === 'results') {
    const animating = S.parts.length || S.fails.length || S.pending || (S.hint && now - S.hint.t < 3200) || S.bands.some(b => now - b.born < 300);
    if (dirty || animating) { dirty = false; draw(now); }
  }
}

addEventListener('resize', relayout);
if (window.ResizeObserver) { const ro = new ResizeObserver(() => { if (S.screen !== 'title') layout(); }); ro.observe($('boardWrap')); }
try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { dirty = true; relayout(); }); } catch (e) { /* ignore */ }

/* ---------- language: fill in the page's words, set the reading direction, make long words fit ---------- */
function applyI18n() {
  try { document.documentElement.lang = LANG; document.documentElement.dir = DIR; } catch (e) { /* ignore */ }
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  const pr = $('practise'); pr.textContent = t('practise'); pr.hidden = IS_EN;   // "Practise English words!" for everyone not playing in English
  document.querySelector('.titlePanel').classList.toggle('hasPractise', !IS_EN);
  resetResultButtons();
}
/** Shrinks a label until it fits on one line (German and Russian run long), down to a readable minimum. */
function fitLabels() {
  const fit = (el, min) => {
    el.style.fontSize = ''; if (!el.offsetParent) return;
    let fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth + 1 && fs > min) { fs -= 0.5; el.style.fontSize = fs + 'px'; }
  };
  document.querySelectorAll('.themes .tn').forEach(el => {
    el.style.whiteSpace = ''; fit(el, 9.5);
    if (el.scrollWidth > el.clientWidth + 1) {   // CJK: wrap onto 2 lines (at the marked spot when the name has one)
      el.style.whiteSpace = 'normal'; el.style.fontSize = '10.5px'; el.style.wordBreak = el.textContent.includes('\u200b') ? 'keep-all' : '';
    }
  });
  document.querySelectorAll('.row button').forEach(el => fit(el, 11));
  fit($('dailyBtn'), 11);
}
addEventListener('resize', fitLabels);
try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLabels); } catch (e) { /* ignore */ }

applyI18n();
buildThemeButtons(); refreshTitle(); measureTitleArt(); paintBackground(); fitLabels();
requestAnimationFrame(frame);

/* =====================================================================================
   window.__brbTest: hooks for automated play tests (harmless in production).
     state()        -> { screen, theme, difficulty, seed, daily, grid (row strings), words: [{word, emoji, found, start:[r,c], end:[r,c], dir}],
                         found, timeMs, hintsUsed, done, paused, pending, cell (px), points, stars, race, save }
     start({ theme, difficulty, seed, daily, race })  -> starts a puzzle (theme may be 'surprise'; daily:true = today's daily puzzle;
                       race:true = "Race a friend", player 1's turn) -> state()
     next()         -> presses the results screen's main button (next puzzle / player 2's turn / race again)
     select([r,c], [r,c])  -> true if that line was a new word (either direction works)
     solveAll()     -> finds every word that is left (shows the results)
     skipAnimations(on = true) -> no sweeps, sparkles or delays (the results show at once)
     generate(theme, difficulty, seed) -> the puzzle the generator makes, without starting it
     hint()         -> uses a hint, returns { word, cell }
     readWords()    -> runs "Read to me", returns the words it reads
     pause(on), quit(), today('YYYY-MM-DD' | null) -> pretend it is another date (daily puzzle + streak tests)
     cellCenter(r, c) -> { x, y } of a letter box in page pixels inside the game frame (for real drag tests)
     daily(date)    -> { theme, difficulty, seed } of the daily puzzle for that date
   ===================================================================================== */
window.__brbTest = {
  state() {
    return { screen: S.screen, theme: S.theme, pickTheme: S.pickTheme, difficulty: S.difficulty, seed: S.seed, daily: S.daily,
      grid: S.letters.map(r => r.join('')), words: S.words.map(w => ({ word: w.word, emoji: w.emoji, found: w.found, start: w.start.slice(), end: w.end.slice(), dir: w.dir })),
      found: S.found, timeMs: Math.round(S.timeMs), hintsUsed: S.hintsUsed, done: S.done, paused: S.paused, pending: S.pending ? S.pending.slice() : null,
      cell, points: S.lastPoints, stars: S.lastStars || 0, relax: !!save.relax, race: S.race ? JSON.parse(JSON.stringify(S.race)) : null, save: JSON.parse(JSON.stringify(save)) };
  },
  start(opts = {}) { resetResultButtons(); startPuzzle(Object.assign({}, opts, { race: opts.race ? 'new' : undefined })); return this.state(); },
  next() { $('nextBtn').click(); return this.state(); },
  select(a, b) { return trySelect([a[0], a[1]], [b[0], b[1]]); },
  solveAll() { S.words.filter(w => !w.found).forEach(w => trySelect(w.start, w.end)); return this.state(); },
  skipAnimations(on = true) { fast = on !== false; return fast; },
  generate(theme, difficulty, seed) { return generatePuzzle(theme, difficulty, seed >>> 0); },
  hint() { return useHint(); },
  readWords() { return readWords(); },
  pause(on = true) { setPaused(!!on); return this.state(); },
  quit() { toTitle(); return this.state(); },
  today(d) { todayOverride = d || null; refreshTitle(); return todayStr(); },
  daily(d) { return dailyFor(d || todayStr()); },
  cellCenter(r, c) { const b = gridCv.getBoundingClientRect(); return { x: b.left + (c + 0.5) * cell, y: b.top + (r + 0.5) * cell }; }
};
</script>
