<title>Word Hunt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@700&display=swap">
<style>
/* Word Hunt on the Oomba Kit: a kid-friendly word search.
   Layout (portrait): HUD (pause / theme + timer / sound), the letter grid on a notebook card, the word list
   (picture + word chips), and a tools row (Hint, Read to me). In wide screens (landscape phones, desktops) the grid
   sits on the left and everything else stacks in a side column so the letters stay big.
   Behind everything a kit stage draws the theme's world (the reef for Ocean, the alien planet for Space, the stadium
   for Sports...; night in the dark theme). The title, pause and settings screens are the kit's; the results card is
   the game's own, in the kit's look, so the solved grid stays in view above it.
   Colours come from the kit (set as --wh-* variables from Oomba.color at start and on every theme change). */
.wh,.wh-tcard{--acc:var(--wh-acc);--accDark:var(--wh-accDark);--accSoft:var(--wh-accSoft);--ink:var(--wh-ink);--rim:var(--wh-ink);
  --soft:color-mix(in srgb,var(--ok-text) 66%,transparent)}
.wh{position:absolute;inset:0;pointer-events:auto;user-select:none;-webkit-user-select:none;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;color:var(--ok-text)}
.ok-night .wh,.ok-night .wh-tcard{--rim:color-mix(in srgb,var(--wh-cream) 40%,transparent)}
[hidden]{display:none!important}
.wh button,.wh-tcard button{font-family:inherit;color:inherit;cursor:pointer}
.wh .ok-btn,.wh-tcard .ok-btn{color:var(--wh-ink)}
.ic{display:inline-flex;vertical-align:-.18em}.ic svg{width:1.15em;height:1.15em}
.pic{display:block;flex:none}

/* ---------- play screen ---------- */
.app{position:relative;height:100%;max-width:1200px;margin:0 auto;display:grid;gap:8px;box-sizing:border-box;
  padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
  grid-template-areas:"hud" "board" "words" "tools";grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-columns:minmax(0,1fr)}
.app.offstage{visibility:hidden} /* the title screen covers the game; keep the live HUD out of sight */
.hud{grid-area:hud;position:relative;display:flex;align-items:center;gap:8px;min-width:0}
.hud .ok-btn.ok-icon{width:48px;min-height:48px;flex:none}
.info{flex:1;min-width:0;height:52px;box-sizing:border-box;display:flex;align-items:center;gap:8px;background:var(--ok-card);color:var(--ok-text);
  border:2.5px solid var(--rim);border-radius:999px;padding:2px 14px 2px 6px;box-shadow:0 3px 0 var(--wh-ink)}
.info .pic{width:40px;height:40px}
.infoText{min-width:0;display:flex;flex-direction:column;line-height:1.1}
.infoText b{font-size:1.08rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.infoText span{font-size:.92rem;color:var(--soft);font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:4px}
.boardWrap{grid-area:board;position:relative;min-height:0;min-width:0}
.card{position:absolute;background:var(--wh-cream);border:3px solid var(--rim);border-radius:22px;padding:5px;box-shadow:0 7px 0 var(--wh-ink)}
.card::before,.card::after{content:"";position:absolute;top:-12px;width:58px;height:20px;background:var(--wh-tape);border:2px solid var(--wh-ink);border-radius:4px;opacity:.92}
.card::before{left:14px;transform:rotate(-8deg)} .card::after{right:14px;transform:rotate(7deg)} /* two bits of sticky tape: the notebook look */
.ok-night .card{border-color:var(--wh-cream);box-shadow:0 7px 0 black}
.ok-night .card::before,.ok-night .card::after{opacity:.8}
canvas#grid{display:block;touch-action:none;outline:none;border-radius:14px}
.card:focus-within{box-shadow:0 0 0 4px var(--ok-focus),0 7px 0 var(--wh-ink)}
/* Messages pop up over the HUD's middle pill (never over the letters). */
.toast{position:absolute;left:56px;right:56px;top:50%;transform:translateY(-50%) scale(.9);min-height:48px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:6px;
  background:var(--wh-ink);color:var(--wh-cream);font-weight:700;font-size:1rem;line-height:1.2;text-align:center;padding:5px 12px;border-radius:20px;pointer-events:none;
  opacity:0;transition:opacity .2s,transform .2s;z-index:3;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.ok-night .toast{background:var(--wh-cream);color:var(--wh-ink)}
.toast .ic{--ok-fill:var(--wh-spark)}
.toast.show{opacity:1;transform:translateY(-50%) scale(1)}
.toast.long{font-size:.9rem;line-height:1.15}
.toast{text-wrap:balance} /* a long hint breaks into even lines (never one word alone on the last line) */
.words{grid-area:words;list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;align-content:flex-start}
.words li{display:contents}
.wchip{font-family:Andika,var(--ok-font);display:flex;align-items:center;gap:5px;min-height:40px;border:2.5px solid var(--rim);background:var(--ok-card);color:var(--ok-text);border-radius:14px;padding:2px 10px 2px 6px;
  font-weight:800;font-size:1.08rem;line-height:1;letter-spacing:.05em;box-shadow:0 3px 0 var(--wh-ink);position:relative}
.wchip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wh-ink)}
.wchip .em{font-size:1.25rem;line-height:1;letter-spacing:0}
.wchip.found{background:linear-gradient(var(--band),var(--band)) var(--wh-cream);border-color:var(--bandDark);color:var(--wh-ink)}
.wchip.found .w{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--bandDark)}
.wchip .tick{position:absolute;top:-10px;inset-inline-end:-8px;width:22px;height:22px;border-radius:50%;background:var(--bandDark);color:var(--wh-cream);border:2px solid var(--wh-ink);
  display:none;place-items:center;box-sizing:border-box}
.wchip .tick svg{width:14px;height:14px}
.wchip.found .tick{display:grid}
.wchip.speaking{border-color:var(--acc);box-shadow:0 0 0 3px var(--accSoft),0 3px 0 var(--wh-ink);transform:translateY(-2px)}
.wchip.hinted:not(.found){border-color:var(--wh-sparkDark);border-style:dashed;background:var(--wh-sparkTint);color:var(--wh-ink)}
.tools{grid-area:tools;display:flex;gap:10px;justify-content:center}
.words.many .wchip{min-height:34px;font-size:1rem;padding:1px 8px 1px 4px;border-width:2px}
.words.many .wchip .em{font-size:1.1rem}
.words.many{gap:5px}
.wh .tool{flex:1;max-width:240px;min-height:52px;padding:0 12px;white-space:nowrap;font-size:1.05rem}
.tool .cost{font-size:.82rem;opacity:.85;font-weight:700}
.tool.hint .ic,.tool.hint svg{--ok-fill:var(--wh-spark)}
.tool:disabled{opacity:.45;cursor:default}

/* Short portrait phones: tighter spacing and smaller word chips, so a long Hard list never shrinks the letters. */
@media (max-aspect-ratio:5/4) and (max-height:720px){
  .app{gap:6px}
  .info{height:48px}
  .words.many{gap:4px}
  .words.many .wchip{min-height:30px;font-size:.95rem;padding:0 7px 0 4px;gap:3px;border-radius:12px}
  .words.many .wchip .em{font-size:1rem}
  .words.many .wchip .tick{top:-7px;width:18px;height:18px}
  .wh .tool{min-height:46px}
}
/* Wide screens (landscape phones, tablets, desktops): grid on the left, the rest in a side column. */
@media (min-aspect-ratio:5/4){
  .app{grid-template-areas:"board hud" "board words" "board tools";grid-template-columns:minmax(0,1fr) minmax(250px,360px);
    grid-template-rows:auto minmax(0,1fr) auto;column-gap:18px;padding-top:max(12px,env(safe-area-inset-top))}
  .words{align-content:center;overflow:auto;padding:12px 4px}
  .tools{flex-wrap:wrap}
  /* the side column sits on one card, so the chips and the HUD never sit on the world's props or sky pictures */
  .app::before{content:"";grid-column:2;grid-row:1/-1;margin:-6px -10px 0;border-radius:26px;border:3px solid var(--rim);
    background:var(--ok-card);box-shadow:0 7px 0 var(--wh-ink)}
  .ok-night .app::before{box-shadow:0 7px 0 black}
  .info{box-shadow:none}
}
@media (min-aspect-ratio:5/4) and (min-width:1000px) and (min-height:640px){
  .app{grid-template-columns:minmax(0,1fr) minmax(300px,440px)}
  .words .wchip,.words.many .wchip{min-height:48px;font-size:1.3rem;padding:3px 12px 3px 8px;border-width:2.5px}
  .words .wchip .em,.words.many .wchip .em{font-size:1.5rem}
  .words,.words.many{gap:9px}
  .wh .tool{min-height:58px;font-size:1.15rem}
}
.app.paused canvas#grid{filter:blur(7px)} /* no peeking while the timer is stopped */
.app.paused .info,.app.paused .toast{visibility:hidden} /* the pause card says it all; no washed-out HUD behind the dim */
@media (min-aspect-ratio:5/4) and (max-height:430px){
  .card::before,.card::after{display:none}
  .info{height:46px}
  .wchip{min-height:34px;font-size:1rem;padding:1px 8px 1px 4px}
  .wchip .em{font-size:1.1rem}
  .wh .tool{min-height:46px;font-size:1rem}
}

/* ---------- results: the game's card in the kit's look (the solved grid stays visible above it) ---------- */
.wh-res{position:fixed;inset:0;z-index:15;display:flex;align-items:flex-end;justify-content:center;padding:12px;box-sizing:border-box;pointer-events:none;
  background:linear-gradient(transparent 40%,color-mix(in srgb,var(--wh-ink) 22%,transparent))}
.wh-res .ok-card{pointer-events:auto;width:min(100%,460px);max-height:100%;overflow:auto;box-sizing:border-box;padding:16px 16px 18px;gap:8px;display:flex;flex-direction:column;align-items:center;text-align:center;
  animation:whUp .38s cubic-bezier(.34,1.56,.64,1) both}
@keyframes whUp{from{transform:translateY(40px);opacity:0}}
.wh-res .ok-h2{margin:0;font-size:clamp(1.5rem,7vw,2rem);line-height:1.1}
.resArt{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:84px;margin-top:-4px}
.resArt canvas{height:100%!important;width:auto!important} /* the card's height sets the picture's size */
.stars{display:flex;gap:10px;justify-content:center;line-height:1}
.stars span{display:inline-grid;width:46px;height:46px;--ok-fill:var(--wh-spark)}
.stars span svg,.stars span canvas{width:100%;height:100%}
.stars span.off{--ok-fill:var(--wh-stone);opacity:.5} /* an unearned star: a clear grey star */
.stars span.tm{--ok-fill:var(--wh-spark)}
.stars span.pop{animation:starPop .5s ease-out both}
@keyframes starPop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1)}}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:800;background:var(--ok-bg2);color:var(--ok-text);border:2px solid var(--ok-line);border-radius:999px;padding:5px 12px;font-size:1rem;white-space:nowrap}
.chip.good{background:var(--wh-sparkTint);border-color:var(--wh-sparkDark);color:var(--wh-ink)}
.chip.good .ic{--ok-fill:var(--wh-spark)}
.chip canvas{height:34px;width:34px;margin:-7px 0 -7px -6px}
.notes{display:flex;flex-direction:column;gap:3px;align-items:center;font-size:.95rem;font-weight:700;color:var(--ok-text);line-height:1.25;margin:0}
.notes span{display:inline-flex;align-items:center;gap:5px}
.notes .ic{--ok-fill:var(--wh-spark)}
.btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:330px;margin-top:4px}
.btns .ok-btn{width:100%;white-space:nowrap}
@media (min-aspect-ratio:5/4){
  .wh-res{align-items:center;justify-content:flex-end;background:none;padding-inline-end:max(16px,calc((100vw - 1200px) / 2 + 12px))}
  .wh-res .ok-card{width:min(100%,380px);border-color:transparent;box-shadow:none;background:transparent} /* it sits on the side column's card */
  .app.over .hud,.app.over .words,.app.over .tools{visibility:hidden} /* the results card takes the side column */
}
@media (min-aspect-ratio:5/4) and (min-height:431px){.resArt{height:112px}.resArt canvas{max-height:112px}.chip canvas{height:40px!important;width:40px!important;margin:-9px 0 -9px -6px}}
/* landscape phones: the results card is wider than the side column, so it keeps its own card there */
@media (min-aspect-ratio:5/4) and (max-height:430px){.app.over::before{visibility:hidden}
  .wh-res .ok-card{background:var(--ok-card);border-color:var(--rim);box-shadow:0 7px 0 var(--wh-ink)}}
@media (min-aspect-ratio:5/4) and (max-height:430px){.resArt{display:none}.wh-res .ok-card{gap:5px;padding:10px 12px 12px}.stars span{width:36px;height:36px}.btns{gap:8px}}
@media (max-aspect-ratio:5/4){.app.over .words,.app.over .tools{visibility:hidden}}
/* Portrait: a compact card so most of the solved grid and the world stay in view above it. */
@media (max-aspect-ratio:5/4){
  .wh-res{padding:10px;background:linear-gradient(transparent 60%,color-mix(in srgb,var(--wh-ink) 14%,transparent))}
  .wh-res .ok-card{padding:12px 14px 14px;gap:6px}
  .wh-res .ok-h2{font-size:clamp(1.35rem,6vw,1.8rem)}
  .resArt{height:64px}.resArt canvas{max-height:64px}
  .stars span{width:38px;height:38px}
  .btns{gap:8px}
  .btns .ok-btn{min-height:50px;font-size:1.08rem}
  .btns .ok-btn.ok-quiet{min-height:44px;font-size:1rem}
}
@media (max-aspect-ratio:5/4) and (max-height:740px){.resArt{height:52px}.resArt canvas{max-height:52px}.stars span{width:32px;height:32px}}

/* ---------- the title card (inside the kit's title screen, under the "Word Hunt" lockup) ---------- */
.ok-ui .ok-title-screen .ok-title-block{max-height:none}
.wh-tcard{display:grid;width:min(480px,calc(100vw - 28px));box-sizing:border-box;grid-template-columns:minmax(0,1fr);justify-items:center;gap:8px;
  background:var(--ok-card);color:var(--ok-text);border:3px solid var(--rim);border-radius:26px;box-shadow:0 7px 0 var(--wh-ink);padding:12px 12px 14px;
  grid-template-areas:"tag" "daily" "diff" "themes" "opts" "play";--rim:var(--wh-ink)}
.ok-night .wh-tcard{box-shadow:0 7px 0 black}
.ok-ui .ok-title-screen .wh-tcard .ok-p{grid-area:tag;margin:0;border:0;box-shadow:none;background:none;padding:0 6px;font-size:1.05rem;font-weight:700;text-align:center}
.wh-tcard .practise{display:block;font-size:.95rem;color:var(--soft);margin-top:2px}
.wh-tcard .daily{grid-area:daily;width:100%;min-height:52px;border:2.5px solid var(--wh-ink);background:var(--wh-sparkTint);color:var(--wh-ink);border-radius:18px;font-weight:800;font-size:1.08rem;
  display:flex;align-items:center;justify-content:center;gap:8px;padding:5px 10px;box-shadow:0 4px 0 var(--wh-ink);white-space:nowrap;overflow:hidden;min-width:0}
.wh-tcard .daily:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wh-ink)}
.daily .ic{--ok-fill:var(--wh-spark)}
.daily .streak{display:inline-flex;align-items:center;gap:4px;background:var(--wh-cream);border:2px solid var(--wh-ink);border-radius:999px;padding:2px 10px;font-size:.88em;white-space:nowrap}
.daily.done{background:var(--wh-mintTint)}
.row{grid-area:diff;display:flex;gap:6px;width:100%}
.row button,.themes button,.opt{border:2.5px solid var(--rim);background:var(--ok-bg2);color:var(--ok-text);border-radius:16px;font-weight:800;box-shadow:0 3px 0 var(--wh-ink)}
.row button:active,.themes button:active,.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wh-ink)}
.row button{flex:1;min-width:0;min-height:52px;font-size:1.02rem;padding:3px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;overflow:hidden}
.row button .dn{white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.row button .pic{width:24px;height:24px}
.row button .lvStars{display:inline-flex;gap:0;--ok-fill:var(--wh-spark)}.row button .lvStars svg{width:17px;height:17px}
.row button small{font-size:.74em;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.row button[aria-pressed="true"],.themes button[aria-pressed="true"]{background:var(--acc);border-color:var(--wh-ink);color:var(--wh-ink)}
.ok-night .row button[aria-pressed="true"],.ok-night .themes button[aria-pressed="true"]{color:var(--wh-ink)}
.themes{grid-area:themes;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:100%}
.themes button{min-height:62px;padding:3px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.76rem;line-height:1.05;min-width:0;overflow:hidden}
.themes button .pic{width:34px;height:34px}
.themes button .tn{max-width:100%;overflow:hidden;white-space:nowrap}   /* long names shrink to fit (fitLabels) */
.opts{grid-area:opts;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.opt{min-height:46px;padding:3px 14px 3px 8px;font-size:1rem;display:inline-flex;align-items:center;gap:6px}
.opt .pic{width:26px;height:26px}
.opt[aria-pressed="true"]{background:var(--wh-mintTint);color:var(--wh-ink)}
.opt .box{width:20px;height:20px;border:2px solid currentColor;border-radius:6px;display:grid;place-items:center;box-sizing:border-box}
.opt .box svg{width:14px;height:14px;visibility:hidden}
.opt[aria-pressed="true"] .box svg{visibility:visible}
.pts{display:inline-flex;align-items:center;gap:6px;font-weight:800;background:var(--wh-sparkTint);color:var(--wh-ink);border:2px solid var(--wh-sparkDark);border-radius:999px;padding:5px 14px 5px 9px;white-space:nowrap}
.pts .ic{--ok-fill:var(--wh-spark)}
.playRow{grid-area:play;display:flex;gap:10px;width:100%;justify-content:center;align-items:center}
.playRow .ok-cta{flex:1.25;min-width:0}
.playRow .ok-cta .ok-btn{width:100%;min-width:0;padding:0 10px}
.playRow .ok-cta::before{display:none}
.playRow .race{flex:1;min-width:0;min-height:56px;font-size:1rem;line-height:1.1;white-space:normal;padding:4px 10px}
.ok-title-screen .ok-corner .mute{width:48px}
/* right-to-left: the wordmark (always LTR inside) goes to the right, away from the corner buttons on the left */
html[dir=rtl] .ok-ui .ok-title-screen .ok-brand{left:auto;right:14px}
.ok-title-badge canvas{max-height:min(84px,10vh)!important}
@media (max-height:900px) and (max-aspect-ratio:5/4){
  .ok-ui .ok-title-screen{padding-top:6px}
  .ok-ui .ok-title-screen .ok-h1{font-size:clamp(2.3rem,12vw,3.2rem);margin:0}
  .ok-ui .ok-title-screen .ok-title-word{display:inline-block}
  .ok-ui .ok-title-screen .ok-title-block{gap:6px;padding:46px 0 0}
  .ok-ui .ok-title-screen .ok-title-badge{margin:-.4em 0 -.3em}
}
@media (max-height:760px) and (max-aspect-ratio:5/4){
  .ok-ui .ok-title-screen .ok-title-badge{display:none}
  .wh-tcard{gap:6px;padding:10px 10px 12px}
  .themes button{min-height:54px}.themes button .pic{width:28px;height:28px}
  .wh-tcard .practise{display:none}
}
@media (max-height:640px) and (max-aspect-ratio:5/4){.ok-ui .ok-title-screen .wh-tcard .ok-p{display:none}}
/* Wide screens: the card goes in two columns (the themes on the end side) under a one-line lockup. */
@media (min-aspect-ratio:5/4){
  .ok-ui .ok-title-screen .ok-title-block{gap:6px;padding-top:6px}
  .ok-ui .ok-title-screen .ok-h1{font-size:clamp(2.4rem,min(11vmin,9vw),5.4rem);margin:0}
  .wh-tcard{width:min(880px,calc(100vw - 28px));grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);column-gap:16px;align-items:center;
    grid-template-areas:"tag themes" "daily themes" "diff themes" "opts themes" "play themes"}
}
@media (min-aspect-ratio:5/4) and (max-height:820px){.ok-ui .ok-title-screen .ok-title-badge{margin:-.5em 0 -.4em}.ok-title-badge canvas{max-height:64px!important}}
/* Wide but short (landscape phones): smaller still. */
@media (min-aspect-ratio:5/4) and (max-height:600px){
  .ok-ui .ok-title-screen{padding-top:4px;padding-bottom:4px}
  .ok-ui .ok-title-screen .ok-title-block{padding:20px 0 4px;gap:4px}
  .ok-ui .ok-title-screen .ok-h1{font-size:2rem;margin:0;white-space:nowrap}
  .ok-ui .ok-title-screen .ok-h1 .ok-title-word{display:inline-block}
  .ok-ui .ok-title-screen .ok-title-badge,.ok-ui .ok-title-screen .wh-tcard .ok-p{display:none}
  .wh-tcard{width:min(820px,calc(100vw - 150px));grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);column-gap:12px;align-items:center;
    grid-template-areas:"daily themes" "diff themes" "play opts";padding:8px 10px 10px;gap:6px}
  .themes{grid-template-columns:repeat(7,minmax(0,1fr))}
  .daily{min-height:44px;font-size:1rem}
  .row button{min-height:44px;font-size:.95rem}
  .themes{gap:5px}.themes button{min-height:44px;font-size:.7rem;padding:2px 2px}.themes button .pic{width:22px;height:22px}
  .row button .lvStars svg{width:13px;height:13px}.row button small{gap:2px}
  .opt{min-height:40px}.pts{padding:3px 10px 3px 7px}
  .playRow .ok-btn{min-height:50px;font-size:1.1rem}
  .playRow .race{min-height:46px}

  tPlain(key, local).split(/(\{\w+\})/).forEach(seg => {

}

/* =====================================================================================

   ===================================================================================== */

  let seed = opts.seed != null ? (opts.seed >>> 0) : randSeed(), daily = !!opts.daily;
  if (daily) { const d = dailyFor(todayStr()); theme = d.theme; difficulty = d.difficulty; seed = d.seed; }
  if (theme === 'surprise' || !THEME_BY_ID[theme]) {   // "Surprise me": a different theme from last time
    const others = THEMES.filter(t => t.id !== S.theme); theme = others[Math.floor(Math.random() * others.length)].id;
  }
  let p = generatePuzzle(theme, difficulty, seed);
  while (!p) { seed = (seed + 1) >>> 0; p = generatePuzzle(theme, difficulty, seed); }   // (never needed; belt and braces)
  stopSpeaking(); closeTitle(); dismissKitPause();
  if (opts.race === 'new') S.race = { turn: 0, results: [] };
  else if (opts.race !== 'next') S.race = null;
  if (S.race) daily = false;
  Object.assign(S, { screen: 'play', theme, difficulty, seed, daily, puzzle: p, n: p.size, letters: p.grid.map(r => r.split('')),
    words: p.words.map((w, i) => Object.assign({}, w, { found: false, band: -1, idx: i })),
    found: 0, timeMs: 0, hintsUsed: 0, done: false, paused: false, pending: null, drag: null, cursor: [0, 0], hint: null,
    bands: [], fails: [], parts: [], lastPoints: 0 });
  Oomba.scene = 'play';

  cancelResults();

  $('app').classList.remove('offstage', 'over', 'paused');
  const racer = S.race ? playerName(S.race.turn) : null;
  $('themeName').textContent = racer ? racer + ' · ' + themeName(theme) : themeName(theme);
  if (daily) $('themeName').insertAdjacentHTML('afterbegin', icon('flag') + ' ');
  putPic($('hudArt'), S.race ? RACERS[S.race.turn] : WORLD(theme).pic, 40);
  buildWordList();

  layout(); updateHud(true);

  else if (save.seenHelp < 2) { toast(tHtml('toastHelp'), 3800); save.seenHelp++; persist(); }
  else toast(tHtml('toastFind', { n: S.words.length, theme: IS_EN ? themeName(theme).toLowerCase() : themeName(theme) }), 2000);
  lastTick = performance.now(); dirty = true;

}

/* ---------- the word list (real buttons, so screen readers can read it; a tap reads the word aloud) ---------- */

/* =====================================================================================
   Layout: the grid always fits. The canvas takes the largest square that fits its area.
   ===================================================================================== */

/* =====================================================================================

  const ease = 1 - Math.pow(1 - p, 3);

// The letters use Andika, a face made for early readers (every letter distinct: its Q has a real tail), then the kit's.
let fontCache = '';
function letterFont() { if (!fontCache) fontCache = 'Andika, ' + ((getComputedStyle(Oomba.ui.root()).getPropertyValue('--ok-font') || '').trim() || 'system-ui, sans-serif'); return fontCache; }

/* =====================================================================================
   Selecting words
   ===================================================================================== */

function trySelect(a, b) {

  const same = (p, q) => p[0] === q[0] && p[1] === q[1];
  const w = S.words.find(x => (same(x.start, a) && same(x.end, b)) || (same(x.start, b) && same(x.end, a)));
  if (w && !w.found) { markFound(w); return true; }
  if (w && w.found) { toast(tHtml('already', { w: isoEn(w.word) })); sfx('select'); return false; }
  // not a word: grey band that wobbles away, gently
  S.fails.push({ start: a, end: b, born: performance.now() });
  const letters = cellsOf(a, b).map(([r, c]) => S.letters[r][c]).join('');
  toast(letters.length > 2 ? tHtml('notOnList', { w: isoEn(letters) }) : tHtml('longer'), 1600);
  sfx('pop', { volume: 0.6 }); dirty = true;

  if (S.hint && S.hint.word === w) S.hint = null;

    chip.classList.add('found'); chip.classList.remove('hinted');

    const [x, y] = center(r, c), a = Math.random() * TAU, sp = 0.4 + Math.random() * 0.8;
    S.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.4, s: cell * (0.14 + Math.random() * 0.1), col: C(SPARKS[i % SPARKS.length], 'light'), born: now + Math.random() * 120, life: 650 });
  }

  if (!last) {
    const cheers = raw('cheers');
    toast(esc(w.emoji + ' ' + isoEn(w.word + '!') + ' ' + cheers[Math.floor(Math.random() * cheers.length)]), 1500);
    if (!BRB.sfx.muted) say(w.say);

/* =====================================================================================

   ===================================================================================== */
function pointCell(e) {

function tapCell(rc) {

  const a = S.pending;
  if (a[0] === rc[0] && a[1] === rc[1]) { S.pending = null; dirty = true; return; }   // tap the same letter again to cancel

  const k = e.key, mv = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[k];
  if (mv) {

    const animating = S.parts.length || S.fails.length || S.pending || (S.hint && now - S.hint.t < 3200) || S.bands.some(b => now - b.born < 300);

/** Shrinks a label until it fits on one line (German and Russian run long), down to a readable minimum. */
function fitLabels() {

    if (!el) return; el.style.fontSize = ''; if (!el.offsetParent) return;
    let fs = parseFloat(getComputedStyle(el).fontSize);
    const box = () => { if (room == null) return el.clientWidth + 1; const p = el.parentNode, cs = getComputedStyle(p); return p.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - room; };
    while (el.scrollWidth > box() && fs > min) { fs -= 0.5; el.style.fontSize = fs + 'px'; }
  };
  document.querySelectorAll('.themes .tn').forEach(el => {
    el.style.whiteSpace = ''; fit(el, 9, 3);
    if (el.scrollWidth > el.clientWidth + 1) {   // CJK: wrap onto 2 lines (at the marked spot when the name has one)
      el.style.whiteSpace = 'normal'; el.style.fontSize = '10.5px'; el.style.wordBreak = el.textContent.includes('​') ? 'keep-all' : '';
    }
  });
  document.querySelectorAll('.row button').forEach(el => fit(el, 11));
  fit($('dailyBtn'), 11);
  fit($('raceBtn'), 11);
  fit($('nextBtn'), 11); fit($('changeBtn'), 11);
}
addEventListener('resize', fitLabels);

applyI18n();
applyThemeColours(S.pickTheme); setWorld(S.pickTheme === 'surprise' ? 'surprise' : S.pickTheme);
openTitle();
requestAnimationFrame(frame);

/* =====================================================================================
   window.__brbTest: hooks for automated play tests (harmless in production). Merged into the kit's own hooks
   (setTheme, setLang, ...): the game's names win.
     state()        -> { screen, theme, difficulty, seed, daily, grid (row strings), words: [{word, emoji, found, start:[r,c], end:[r,c], dir}],
                         found, timeMs, hintsUsed, done, paused, pending, cell (px), points, stars, race, save }
     start({ theme, difficulty, seed, daily, race })  -> starts a puzzle (theme may be 'surprise'; daily:true = today's daily puzzle;
                       race:true = "Race a friend", player 1's turn) -> state()
     next()         -> presses the results screen's main button (next puzzle / player 2's turn / race again)
     select([r,c], [r,c])  -> true if that line was a new word (either direction works)
     solveAll()     -> finds every word that is left (shows the results)
     skipAnimations(on = true) -> no sweeps, sparkles or delays (the results show at once)
     generate(theme, difficulty, seed) -> the puzzle the generator makes, without starting it
     hint()         -> uses a hint, returns { word, cell }
     readWords()    -> runs "Read to me", returns the words it reads
     pause(on), quit(), today('YYYY-MM-DD' | null) -> pretend it is another date (daily puzzle + streak tests)
     cellCenter(r, c) -> { x, y } of a letter box in page pixels inside the game frame (for real drag tests)
     daily(date)    -> { theme, difficulty, seed } of the daily puzzle for that date
   ===================================================================================== */
window.__brbTest = Object.assign(window.__brbTest || {}, {
  state() {
    return { screen: S.screen, theme: S.theme, pickTheme: S.pickTheme, difficulty: S.difficulty, seed: S.seed, daily: S.daily,
      grid: S.letters.map(r => r.join('')), words: S.words.map(w => ({ word: w.word, emoji: w.emoji, found: w.found, start: w.start.slice(), end: w.end.slice(), dir: w.dir })),
      found: S.found, timeMs: Math.round(S.timeMs), hintsUsed: S.hintsUsed, done: S.done, paused: S.paused, pending: S.pending ? S.pending.slice() : null,
      cell, points: S.lastPoints, stars: S.lastStars || 0, relax: !!save.relax, race: S.race ? JSON.parse(JSON.stringify(S.race)) : null, save: JSON.parse(JSON.stringify(save)) };
  },
  start(opts = {}) { startPuzzle(Object.assign({}, opts, { race: opts.race ? 'new' : undefined })); return this.state(); },
  next() { $('nextBtn').click(); return this.state(); },
  select(a, b) { return trySelect([a[0], a[1]], [b[0], b[1]]); },
  solveAll() { S.words.filter(w => !w.found).forEach(w => trySelect(w.start, w.end)); return this.state(); },
  skipAnimations(on = true) { fast = on !== false; return fast; },
  generate(theme, difficulty, seed) { return generatePuzzle(theme, difficulty, seed >>> 0); },
  hint() { return useHint(); },
  readWords() { return readWords(); },
  pause(on = true) { setPaused(!!on); return this.state(); },
  quit() { toTitle(); return this.state(); },
  today(d) { todayOverride = d || null; refreshTitle(); return todayStr(); },
  daily(d) { return dailyFor(d || todayStr()); },
  cellCenter(r, c) { const b = gridCv.getBoundingClientRect(); return { x: b.left + (c + 0.5) * cell, y: b.top + (r + 0.5) * cell }; }
});
</script>
