/* ---------- entering a chapter and a level ---------- */
function enterChapter(chId, ix, range) {
  const ls = levelsFor(chId, S.band);
  if (!ls.length) { toast(tr('Coming soon')); return S.lock ? null : showMap(); }
  S.chapter = chId; S.range = range || null; S.daily = null;
  if (S.lesson && !S.projector) {
    const main = S.lockedChapter || chId;
    // the session's check count covers the step's whole required set (the locked chapter plus its chained
    // chapter): derive each part once per entry, so a resumed lesson shows what is still missing truthfully
    const addDerived = (c, r) => { const key = c + ':' + (r ? r.join('-') : 'all'); if (!S.derivedCh) S.derivedCh = new Set(); if (S.derivedCh.has(key)) return; S.derivedCh.add(key); const d = deriveChecks(c, r); S.checks.ok += d.ok; S.checks.n += d.n; };
    if (chId === main && !range) {
      S.checks = { ok: 0, n: 0 }; S.derivedCh = new Set(); addDerived(main, null);
      const then = (D.THEN[S.band] || {})[main];
      if (S.lock && then && levelsFor(then.ch, S.band).length) addDerived(then.ch, then.levels || null);
    } else addDerived(chId, range);
    if (S.lock && ix == null && !range && chId === main) { const plan = catchUpPlan(chId); if (plan) return runCatchUp(chId, plan); }
  }
  let at = ix == null ? firstUnfinished(chId, S.band) : Math.max(0, Math.min(ls.length - 1, ix));
  if (S.range) { const lo = S.range[0] - 1, hi = Math.min(ls.length, S.range[1]) - 1; at = Math.max(lo, Math.min(hi, ix == null ? lo : at)); for (let k = lo; k <= hi; k++) if (!starsOf(ls[k].id) && !SAVE.skipped[ls[k].id]) { at = k; break; } }
  startLevel(chId, at, {});   // an explicit level (a teacher's level param, a test) opens even when earlier ones are unfinished
}
/* A lesson entry whose required work (the locked chapter plus its chained chapter) is partly or fully done
   with checks unanswered needs a catch-up; the plan is decided synchronously so a plain entry is untouched. */
function catchUpPlan(main) {
  const band = S.band, then = (D.THEN[band] || {})[main];
  const req = levelsFor(main, band).map(l => [main, l]);
  if (then && levelsFor(then.ch, band).length) { const tls = levelsFor(then.ch, band); const sub = then.levels ? tls.slice(then.levels[0] - 1, then.levels[1]) : tls; for (const l of sub) req.push([then.ch, l]); }
  const allDone = req.every(([, l]) => levelDone(l));
  const missing = req.filter(([, l]) => l.check && levelDone(l) && !checkRecorded(l.id));
  return (missing.length || allDone) ? { then, allDone, missing } : null;
}
async function runCatchUp(main, plan) {

      if (S.level !== l) await startLevel(c, levelsFor(c, band).indexOf(l), { noLearn: true });
      const ok = await caseClosed(l.check); recordCheck(l.id, !!ok); S.checks.n++; if (ok) S.checks.ok++;

}
async function rideIn(n, flow) {

  const el = $('div', 'pp-pk'); el.appendChild(pieceEl(n)); const b = $('b', '', num(n)); b.dir = 'ltr'; el.appendChild(b); const n0 = I.nodes[path[0]]; el.style.left = pct(n0.x); el.style.top = pct(n0.y); UI.board.appendChild(el);

/** A failed run: Pim explains, Try again (same map) and, after two, Skip. */

}
function startOver() { if (!S.run || S.run.done) return; startLevel(S.chapter, S.levelIx, { noLearn: true, keepSeed: true, fails: S.fails, runs: S.runs, hint: S.hint, tier3: S.tier3 }); }

/* ---------- hints: a question, then a glow, then one move (the third star goes) ---------- */
function giveHint() {

  S.hint++; const tier = S.hint, text = tr(level.hints[tier - 1] || level.hints[level.hints.length - 1], { n: run.s.i || 1 });
  pimSay(text); sfx('spark', { volume: 0.5 });

}
function glowAdvice() {
  const run = S.run, a = run.advice(); if (!a) return;

  for (const el of UI.panel.querySelectorAll('.pp-glow')) el.classList.remove('pp-glow');
  let el = null;
  if (a.t === 'hop') el = UI.links[a.id]; else if (a.t === 'place') el = UI.tray && UI.tray.querySelector(`[data-packet="${a.n}"]`);
  else if (a.t === 'ack' || a.t === 'discard') el = UI.inbox && UI.inbox.querySelector(`[data-card="${a.id}"]`); else if (a.t === 'resend') el = UI.slotBtns && UI.slotBtns[a.n];

}

/* ---------- the learn card ---------- */
function learnCard(learn) {
  return new Promise(res => {
    const { card, inner } = openCard('learn');
    inner.appendChild(portrait(96, 'happy'));
    inner.appendChild($('h2', '', tr(learn.title)));
    if (learn.pic) { const c = pic(learn.pic, 96); c.className = 'pp-pic'; c.setAttribute('aria-hidden', 'true'); inner.appendChild(c); }
    inner.appendChild($('p', '', tr(learn.text)));
    const go = btn(tr("Let's go"), { kind: 'hot', big: true, icon: 'play', onPress: () => { card.closeCard(); res(true); } }); go.setAttribute('data-pp-focus', ''); inner.appendChild(go);
    card.onEscape = () => { card.closeCard(); res(true); };

}

/* ---------- solved: stars, the Case-closed card in lesson mode, the results card, the next level ---------- */
async function solved(flow) {

  pimSay(tr('Delivered!'), { speak: false }); sfx('win'); O.juice.confetti();
  for (const b of UI.board.querySelectorAll('button')) b.disabled = true;
  if (S.daily) {
    const d = S.daily, best = SAVE.daily && SAVE.daily.day === d.day && SAVE.daily.band === S.band ? SAVE.daily.stars : 0;
    SAVE.daily = { day: d.day, band: S.band, stars: Math.max(best, stars) }; save();
    const v = await O.ui.win({ stars, score: stars, best, hero: window.innerHeight < 520 ? false : PIM, title: tr('Daily Crew Challenge'), next: true });
    if (flow !== S.flow) return;
    if (v === 'again') return startDaily(d.day);
    S.daily = null; return showMap();
  }
  if (!S.projector) {
    const old = SAVE.stars[level.id] || { n: 0 }; if (stars > old.n || (stars === old.n && S.band === '2' && old.band !== '2')) SAVE.stars[level.id] = { n: stars, band: S.band }; delete SAVE.skipped[level.id]; save();
    crownCheck();
  }

  if (S.lesson && !S.projector && level.check && !checkRecorded(level.id)) {
    await O.wait(ms(600)); if (flow !== S.flow) return;
    check = (await caseClosed(level.check)) ? 1 : 0; recordCheck(level.id, !!check); if (flow !== S.flow) return;
    S.checks.n++; if (check) S.checks.ok++;
    conf = await confidence(); if (flow !== S.flow) return;
  }
  report(level, stars, check, conf, false);
  const v = await O.ui.win({ stars, score: stars, best: null, hero: window.innerHeight < 520 ? false : PIM, title: tr('Delivered!'), next: true });
  if (flow !== S.flow) return;

}
function caseClosed(check) {

  const order = E.rng(E.seedOf((S.level ? S.level.id : '') + ':check:' + S.seed0 + ':' + S.attempt)).shuffle(tiles.map((_, k) => k));
  return O.ui.ask({ q: tr(check.q), choices: order.map(k => tiles[k]), index: order.indexOf(check.answer), tries: 1, who }).catch(() => false);
}
function confidence() {
  return O.ui.dialog({ title: tr('How sure were you?'), portrait: PIM, buttons: [{ label: tr('Not sure'), kind: 'quiet', value: 1 }, { label: tr('Fairly sure'), kind: 'quiet', value: 2 }, { label: tr('Very sure'), kind: 'go', value: 3 }] }).then(v => (v == null ? 2 : v));
}
function skipLevel() {
  const level = S.level; if (!level) return;
  SAVE.skipped[level.id] = true; save(); sfx('whoosh'); toast(tr('Skipped. You can come back to it later.'));

}
function nextLevel() {
  const ls = levelsFor(S.chapter, S.band), last = S.range ? Math.min(ls.length, S.range[1]) - 1 : ls.length - 1;
  if (S.levelIx < last) return startLevel(S.chapter, S.levelIx + 1, {});
  chapterComplete();
}
/** Full stars on every level of the chapter: the chapter crown, which recolors Pim's outfit. */
function crownCheck() {

  if (SAVE.crowns[key] || !ls.length || !ls.every(l => starsOf(l.id) === 3)) return false;

}

/* ---------- the wheel tool: a free cipher wheel for the unplugged twin ---------- */
let shift = 3;
function showWheel() {
  const pp = screen('wheel'), map = $('div', 'pp-map'); pp.appendChild(map);
  const bar = $('div', 'pp-bar'); map.appendChild(bar);
  if (!S.lock) bar.appendChild(btn(tr('Map'), { kind: 'quiet', icon: 'home', onPress: () => { S.mode = 'play'; showMap(); } }));
  const pill = $('div', 'pp-pill'); pill.appendChild(iconEl('key')); pill.appendChild($('span', '', tr('Key wheel'))); bar.appendChild(pill);
  map.insertAdjacentHTML('beforeend', wheelMarkup('pp-wheel'));
  const svg = map.querySelector('.pp-wheel');
  const row = $('div', 'pp-row pp-center'); map.appendChild(row);
  const minus = btn(tr('Turn back'), { kind: 'quiet', icon: 'minus', onPress: () => turn(-1) }), label = $('div', 'pp-shift'); label.dir = 'ltr';
  const plus = btn(tr('Turn forward'), { kind: 'quiet', icon: 'plus', onPress: () => turn(1) });
  row.append(minus, label, plus);
  const ex = $('p', 'pp-lesson-note'); map.appendChild(ex);
  const sync = () => { setWheel(svg, shift); label.textContent = tr('Shift {n}', { n: shift }); ex.textContent = tr('{a} becomes {b}', { a: 'A', b: E.caesar('A', shift) }) + ' · ' + tr('{a} becomes {b}', { a: 'E', b: E.caesar('E', shift) }); };
  const turn = d => { shift = ((shift + d) % 26 + 26) % 26; sfx('select'); sync(); announce(tr('Shift {n}', { n: shift })); };
  S.wheelTurn = turn;
  sync();
}
/** Arrow keys turn the wheel: the free wheel tool, and the cipher levels that have a wheel (one listener, registered once). */
document.addEventListener('keydown', e => {
  const d = e.key === 'ArrowRight' || e.key === 'ArrowUp' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowDown' ? -1 : 0;
  if (!d || e.defaultPrevented || cardPause || e.altKey || e.ctrlKey || e.metaKey) return;
  if (S.screen === 'wheel' && S.wheelTurn) { e.preventDefault(); return S.wheelTurn(d); }
  const run = S.run; if (S.screen !== 'level' || !run || run.type !== 'cipher' || run.inst.kind === 'keyed' || run.inst.choices || run.done || run.failed || S.busy) return;
  if (document.querySelector('.ok-modal')) return;   // a kit card (dialog, quiz, results, pause) owns the keys
  e.preventDefault(); doAction({ t: 'shiftTo', n: run.s.shift + d });
});

/* ---------- test hooks (covers, the playtest, the unit test's Chromium run) ---------- */
function testState() {
  const run = S.run;
  return { pp: true, screen: S.screen, chapter: S.chapter, level: S.chapter ? S.levelIx + 1 : 0, levelId: S.level ? S.level.id : null, band: S.band, mode: S.mode, lesson: S.lesson, lock: S.lock,
    phase: run ? run.s.phase : S.screen, stars: S.chapter ? chapterStars(S.chapter, S.band) : 0, levelStars: S.level ? starsOf(S.level.id) : 0, ppScore: S.lastScore, label: S.lastLabel, hops: run && run.s.hops || 0,
    placed: run && run.s.placed ? run.s.placed.length : 0, fails: S.fails, hint: S.hint, checks: S.checks, ready: true, busy: S.busy, cards: cardPause, daily: S.daily ? S.daily.day : null, crowns: Object.keys(SAVE.crowns).length, silver: S.level ? silverOf(S.level.id) : false, report: S.lastReport || null };

Object.assign(window.__brbTest, {
  start(o = {}) { S.pending = Object.assign({}, o); S.fast = S.fast || !!o.fast; game.start(); return testState(); },
  skipAnimations() { S.fast = true; return true; },
  act(a) { return doAction(a); },
  advice() { return S.run ? S.run.advice() : null; },
  hint() { giveHint(); return S.hint; },
  /** play(record, {band, seed}): run one level record that is not in the chapters yet (the engine's other level types). */
  play(rec, o = {}) {
    const band = o.band === '2' ? '2' : '1b';
    const r = Object.assign({ ch: 'locks', bands: ['1b', '2'], csta: ['1B-NI-05'], par: 99, intro: 'Test level', hints: ['One', 'Two', 'Three'], check: { q: 'Which?', tiles: ['This', 'That', 'Other'], answer: 0 } }, rec);
    if (!LEVELS.includes(r)) LEVELS.push(r);
    S.fast = true; S.pending = { chapter: r.ch, band, level: levelsFor(r.ch, band).length, seed: o.seed != null ? o.seed : 1, lesson: !!o.lesson };
    game.start(); return testState();
  },
  run() { return S.run ? S.run.snapshot() : null; },
  /** The roads as drawn (the arrow check): each road's ends, whether it is lit, its chevron's turn, and screen centers. */
  roads() {
    const run = S.run; if (!run || run.type !== 'route') return null; const I = run.inst;
    const mid = el => { const r = el.getBoundingClientRect(); return [r.x + r.width / 2, r.y + r.height / 2]; };
    const nodes = {}; for (const id of I.nodeOrder) nodes[id] = mid(UI.nodes[id].querySelector('.pp-ico') || UI.nodes[id]);
    const links = I.linkOrder.map(id => { const bt = UI.links[id], svg = bt.querySelector('svg'), m = svg && /rotate\((-?\d+)deg\)/.exec(svg.style.transform || '');
      return { id, a: I.links[id].a, b: I.links[id].b, sealed: !!I.links[id].sealed, lit: UI.lines[id].classList.contains('pp-lit'), arrow: bt.classList.contains('pp-ok'), aim: bt.dataset.aim || null, deg: m ? +m[1] : null, glyph: svg ? svg.outerHTML : '' }; });
    return { at: run.s.at, from: I.from, to: I.to, phase: run.s.phase, nodes, links };
  },
  async solve() { S.fast = true; let guard = 0; while (S.run && !S.run.done && !S.run.failed && guard++ < 300) { while (S.busy) await O.time.real.wait(16); const a = S.run.advice(); if (!a) break; if (S.run.type === 'ack' && UI.sel == null) { /* the UI needs no selection for act() */ } await doAction(a); } return S.run ? S.run.snapshot() : null; },
  closeCards() { if (S.dom) for (const c of [...S.dom.pp.querySelectorAll('.pp-card')]) { if (c.onEscape) c.onEscape(); else if (c.closeCard) c.closeCard(); } return true; },   // Escape: a learn card's promise resolves too
  async cover() {
    S.fast = true; S.pending = { chapter: 'packets', band: '1b', level: 5, seed: 7, lesson: false }; game.start();
    await O.time.real.wait(50); closeCards();
    const run = S.run; if (!run) return false;
    for (let k = 0; k < 2; k++) { let g = 0; while (run.s.phase === 'play' && run.s.i === k + 1 && g++ < 10) { const a = run.advice(); if (!a) break; await doAction(a); } }
    const I = run.inst, roads = I.linkOrder.slice(0, 3);
    for (let k = 0; k < 6; k++) { const l = I.links[roads[k % roads.length]], a = I.nodes[l.a], b = I.nodes[l.b], f = 0.3 + 0.4 * (k % 2); const el = $('div', 'pp-pk'); el.appendChild(pieceEl((k % I.n) + 1)); const nb = $('b', '', num((k % I.n) + 1)); nb.dir = 'ltr'; el.appendChild(nb); el.style.left = pct(a.x + (b.x - a.x) * f); el.style.top = pct(a.y + (b.y - a.y) * f); UI.board.appendChild(el); }

    return true;
  },
});
