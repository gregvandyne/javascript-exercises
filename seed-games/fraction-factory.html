/* ---------- test hooks (covers, the playtest, the unit test's Chromium run) ---------- */
function testState() {
  const run = S.run, snap = run ? run.snapshot() : null;
  return { ff: true, screen: S.screen, chapter: S.chapter, level: S.chapter ? S.levelIx + 1 : 0, levelId: S.level ? S.level.id : null, band: S.band, mode: S.mode, lesson: S.lesson, lock: S.lock,
    denom: snap ? snap.denom : 0, takenCount: snap ? snap.takenCount : 0, placed: snap ? snap.placed : -1, picked: snap ? snap.picked : -1, wrong: snap ? snap.wrong : 0, done: snap ? snap.done : false,
    stars: S.chapter ? chapterStars(S.chapter, S.band) : 0, levelStars: S.level ? starsOf(S.level.id) : 0, ffScore: S.lastScore, label: S.lastLabel, hint: S.hint, checks: S.checks, ready: true, busy: S.busy, cards: cardPause, report: S.lastReport || null };
}
Object.assign(window.__brbTest, {
  start(o = {}) { S.pending = Object.assign({}, o); S.fast = S.fast || !!o.fast; game.start(); return testState(); },
  skipAnimations() { S.fast = true; return true; },
  state() { return testState(); },
  act(a) { return doAction(a); },
  advice() { return S.run ? S.run.advice() : null; },
  hint() { return giveHint(); },
  run() { return S.run ? S.run.snapshot() : null; },
  levels() { return LEVELS.map(l => ({ id: l.id, ch: l.ch, type: l.type })); },
  chapters() { return CHAPTERS.map(c => ({ id: c.id, index: c.index, title: c.title })); },
  code(digits) {
    const q = E.questCode(digits, CHAPTERS); if (!q || !q.chapter) return false;
    S.lesson = true; if (q.mode) S.mode = q.mode; S.projector = S.mode === 'projector';
    S.lockedChapter = q.chapter; S.pending = { chapter: q.chapter, band: q.band, level: q.level || undefined, lesson: true };
    game.start(); return true;
  },
  async solve() {
    S.fast = true; let guard = 0;
    while (S.run && !S.run.s.done && guard++ < 200) { const a = S.run.advice(); if (!a) break; doAction(a); if (cardPause) { closeCards(); } await O.time.real.wait(5); }
    return S.run ? S.run.snapshot() : null;
  },
  closeCards() { closeCards(); return true; },
  async cover() {
    S.fast = true; S.pending = { chapter: 'first-cuts', band: '1b', level: 3, seed: 7, lesson: false }; game.start();
    await O.time.real.wait(50); closeCards();
    if (!S.run) return false;
    doAction({ t: 'cut', n: 4 }); doAction({ t: 'tap', i: 0 }); doAction({ t: 'tap', i: 1 }); doAction({ t: 'tap', i: 2 });
    return true;
  },
});
</script>
