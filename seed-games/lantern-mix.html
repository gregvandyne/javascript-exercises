<!-- Lantern Mix: Number Quest Unit 1 of the grades 6-8 street, The Mixing Tower (ages 11-14). Night in Spooky Hollow,
     on Oomba3D 1.2.0 in the Spooky Hollow theme: a lamplighter's workbench where a lantern's glow comes from the
     ratio of two oils. The player plans with dials (a slider and plus and minus buttons, never typing), then lights
     the lantern: the plan is run and its result is shown, right or wrong. Three chapters of six rounds:
       mix     (1.1) match the gate lantern's glow (2 : 3), make the same glow bigger with one oil set, fill a lantern
                     that holds 15 parts, mix the missing lantern of a ratio table, work back from the other oil, and
                     use every part to glow more amber (or more blue) than the gate;
       rate    (1.2) a burn rate for 1 hour, a tank for 7 hours, 6 ml in 4 hours stretched to 10 hours on a double
                     number line, how long a tank lasts, two lanterns' unit rates, and a steady walking pace;
       percent (1.3) fill a tank to a percent, name the percent a tank is full, find the whole tank from a part and
                     its percent, change kilometers, liters and hours into smaller units, and count the lanterns a
                     path needs.
     A match is decided by the ratio (LanternMix.judge), never by the color on screen, and color is never the only
     signal: every lantern has a parts gauge (amber is striped, blue is dotted) with its numbers. Read-aloud is on by
     default: every instruction, hint and answer line is shown and spoken (BRB.speak, the shared path; the speaker
     button says it again). No timer, no lives, no fail state, nothing bought or sold: a wrong plan lights the wrong
     glow, the board shows what the plan really made, and a spoken hint says why; then another try. Nothing moves about
     on its own or stands in the way: the hollow is a quiet night garden. Lesson mode: BRB.params { chapter: mix | rate | percent,
     lock: 1 } opens that chapter only; finishing its six rounds reports game over, won, once (the course step's
     completion signal). With no parameters the game offers the three chapters from a menu. Saves only which chapters
     are finished (BRB.storage 'lantern-mix-v1'). The import map below is exactly kit2ImportMap()
     (server/services/vendor.js); tests/unit/lantern-mix.test.js fails if a library bump leaves it behind. English
     only, like Number Quest's other lesson games. Test handle: window.__lm (also window.__brbTest, the name the
     picture scripts wait for). -->

/* ---------- the stage: the board, and the lanterns on the rack ---------- */

const haloTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'), gr = x.createRadialGradient(64, 64, 4, 64, 64, 62); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = gr; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();
function rackLamp(i, css, trial) {
  const o = new THREE.Group(), body = PT.lantern.clone(true), halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, color: new THREE.Color(css), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
  halo.scale.setScalar(trial ? 0.8 : 1.05); halo.position.y = 0.42; o.add(body, halo); o.userData = { i, trial: !!trial, css };
  return o;
}
function clearStage() {
  for (const o of [...stage.children]) stage.remove(o);
  tweens.length = 0; targets.length = 0;
  sizeBoard(); board.visible = true;
  placeRack();
}
function putBoard(R, mode, first) {
  paint(R, mode); stage.add(board);
  if (first) pop(board, { wait: 0.1, from: 0.6 });
}
/** The glow a finished round leaves on the rack: the mix it made, or (rate and percent) a warm glow of its own. */
const roundGlow = (R, v) => (R && R.chapter === 'mix' ? LM.glow(v.a, v.b) : LM.glow(6 - ((R ? R.n : 1) - 1), (R ? R.n : 1) - 1)) || LM.glow(1, 0);
const dropTrial = () => { for (const o of [...rack.children]) if (o.userData.trial) rack.remove(o); };
/** Lanterns on the rack: one for each round already finished (their glows are kept). */
function setLit(n) {
  dropTrial();
  while (rack.children.length > n) rack.remove(rack.children[rack.children.length - 1]);
  for (let i = rack.children.length; i < n; i++) rack.add(rackLamp(i, (S.glows[i] || LM.glow(1, 0)).css));
  S.lit = n; placeRack();
}
S.glows = [];

/* ---------- the lamplighter ---------- */
let lineup = [];
function placeHero() { const h = S.hero; if (!h) return; drop(h.object); g.scene.add(h.object); h.object.visible = true; h.object.scale.setScalar(heroSize()); h.position.copy(heroSpot()); h.object.rotation.y = tall ? 0 : 0.5; }
let heroBack = 0;
function heroMove(move, ms = 1500) {
  const h = S.hero; if (!h || reduced) return;
  h.play(move, { once: true }); clearTimeout(heroBack); heroBack = setTimeout(() => h.play('idle'), ms);
}
async function showHeroes() {
  S.screen = 'hero';
  if (!lineup.length) lineup = await Promise.all(HEROES.map(id => g.hero(id, { x: 0, y: 0, z: 0 })));
  clearStage(); setLit(0); bench.visible = false;
  const k = tall ? 0.82 : 1.0, at = tall ? [[-1.3, 0.3], [-0.65, 1.7], [0, 0.3], [0.65, 1.7], [1.3, 0.3]] : [-2, -1, 0, 1, 2].map(i => [i * 1.85, 0.9]), far = Math.max(...at.map(q => q[0])) + 0.95 * k;
  lineup.forEach((h, i) => { h.object.visible = true; h.object.scale.setScalar(k); h.position.set(at[i][0], 0, at[i][1]); h.object.rotation.y = 0; h.play(i % 2 ? 'wave' : 'idle'); });
  lineup.forEach(h => targets.push({ at: () => h.position.clone().setY(1.1 * k), r: 0.7 * k, go: () => chooseHero(h.id) }));
  view.pts = [V3(-far, 0, at[1][1]), V3(far, 0, at[1][1]), V3(-far, 2.3 * k, at[0][1]), V3(far, 2.3 * k, at[0][1])];
  card('pick', { title: fmt('title'), line: 'hero.pick', buttons: lineup.map(h => ({ id: 'hero-' + h.id, label: h.name, go: () => chooseHero(h.id) })) });
  frame();
}
function chooseHero(id) {
  if (S.screen !== 'hero') return;
  S.hero = lineup.find(h => h.id === id);
  for (const h of lineup) if (h !== S.hero) h.object.visible = false;
  sfx('coin');
  if (P.chapter) startChapter(P.chapter); else showMenu();
}

/* ---------- cards: the lamplighter picker, the menu, the end of a chapter ---------- */
function button({ id, label, icon, cls, go }) {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'lm-btn' + (cls ? ' ' + cls : ''); if (id) b.id = id;
  const span = (c, s) => { const e = document.createElement('span'); e.className = c; e.textContent = s; return e; };
  if (icon) { const i = span('i', icon); i.setAttribute('aria-hidden', 'true'); b.append(i); }
  b.append(span('l', label)); b.setAttribute('aria-label', label);
  b.addEventListener('click', () => go(b));
  return b;
}
function card(kind, { title, line: key, buttons, star }) {
  el.bar.hidden = true; el.row2.hidden = true; el.ask.hidden = true; hint();
  const head = document.createElement('div'), row = document.createElement('div');
  if (star) { const s = document.createElement('div'); s.className = 'lm-star'; s.setAttribute('aria-hidden', 'true'); s.textContent = '🏮'; head.append(s); }
  const h = document.createElement('h1'); h.textContent = title; head.append(h);
  const a = document.createElement('div'); a.className = 'lm-ask'; a.style.display = 'inline-flex';
  const sb = document.createElement('button'); sb.type = 'button'; sb.className = 'lm-say'; sb.textContent = '🔊'; sb.setAttribute('aria-label', fmt('btn.say'));
  sb.addEventListener('click', () => speak(key, null, { auto: false }));
  const t = document.createElement('span'); t.className = 'lm-askt'; t.textContent = fmt(key); a.append(sb, t); head.append(a);
  row.className = kind === 'menu' ? 'lm-menu' : 'lm-pick'; row.append(...buttons.map(button));
  el.card.className = 'lm-card';
  el.card.replaceChildren(head, row); el.card.hidden = false;
  S.line = [key, null]; speak(key);
}
/** The lamplighter in the hollow by the board and the rack: the menu and the end of a chapter. */
function solo(lit) {
  clearStage(); S.vals = {}; putBoard(null, 'ask'); bench.visible = true; setLit(lit); placeHero();
  view.pts = stagePts();
}
function showMenu() {
  S.screen = 'menu'; S.chapter = ''; S.phase = 'idle'; S.R = null; S.tick++; S.glows = []; solo(0);
  if (S.hero) S.hero.play('wave');
  card('menu', { title: fmt('title'), line: 'menu.pick', buttons: LM.CHAPTERS.map(c => ({ id: 'ch-' + c, icon: ICON[c] + (S.done[c] ? '⭐' : ''), label: fmt('ch.' + c), go: () => startChapter(c) })) });
  frame();
}

/* ---------- the dials: a slider with a minus and a plus button each (no typing). A locked dial shows its value only. ---------- */
function unitText(d, v) { const u = fmt('unit.' + d.unit); return num(v) + (u ? (d.unit === 'pct' ? '' : ' ') + u : ''); }
function setDial(id, v, from) {
  const d = S.R && S.R.dials.find(q => q.id === id); if (!d || d.lock || S.phase !== 'play') return;
  v = Math.max(d.min, Math.min(d.max, d.min + Math.round((v - d.min) / d.step) * d.step));
  if (v === S.vals[id]) return;
  S.vals[id] = v;
  const r = document.getElementById('dial-' + id + '-range'), o = document.getElementById('dial-' + id + '-val');
  if (r && from !== 'range') r.value = String(v);
  if (r) r.setAttribute('aria-valuetext', unitText(d, v));
  if (o) o.textContent = unitText(d, v);
  dropTrial();   // a new plan: the last trial's glow goes out; the hint stays until the plan is run
  paint(S.R, 'ask');
}
function dialEl(d) {
  const box = document.createElement('div'), name = fmt(d.key); box.className = 'lm-dial' + (d.lock ? ' lock' : ''); box.id = 'dial-' + d.id;
  box.dataset.tone = d.key === 'dial.amber' ? 'amber' : d.key === 'dial.blue' ? 'blue' : 'plain';
  const lab = document.createElement('label'); lab.className = 'lm-dl'; lab.htmlFor = 'dial-' + d.id + '-range';
  const nm = document.createElement('span'); nm.textContent = name + (d.lock ? ' 🔒' : '');
  const out = document.createElement('output'); out.className = 'lm-dv'; out.id = 'dial-' + d.id + '-val'; out.textContent = unitText(d, S.vals[d.id]);
  lab.append(nm, out); box.append(lab);
  if (d.lock) return box;
  const step = (cls, sign, label, by) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'lm-step ' + cls; b.id = 'dial-' + d.id + '-' + cls; b.textContent = sign; b.setAttribute('aria-label', fmt(label, { name }));
    b.addEventListener('click', () => setDial(d.id, S.vals[d.id] + by * d.step)); return b; };
  const r = document.createElement('input'); r.type = 'range'; r.id = 'dial-' + d.id + '-range'; r.min = String(d.min); r.max = String(d.max); r.step = String(d.step); r.value = String(S.vals[d.id]);
  r.setAttribute('aria-valuetext', unitText(d, S.vals[d.id]));
  r.addEventListener('input', () => setDial(d.id, +r.value, 'range'));
  box.append(step('dn', '−', 'btn.less', -1), r, step('up', '+', 'btn.more', 1));
  return box;
}

/* ---------- a chapter: six rounds ---------- */
/* Each play of a chapter (the first, and every Play again) takes its own lap: a random one whose rounds all ask
   different things and none of what the last play of that chapter asked (its lap is kept in the game's save, BRB.storage,
   best effort). The fixed lap 0 only when a test pins it (window.__brbTest.lap). */
const LAPS_KEY = 'lantern-mix.laps';
// fresh numbers from the browser; without them a plain stream, which still never gives the last play's lap (lapOf)
let spare = 0x9E3779B9;
function rand01() { try { return crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296; } catch (e) { spare = (Math.imul(spare, 1664525) + 1013904223) >>> 0; return spare / 4294967296; } }
function playLap(chapter) {
  if (S.pin != null) { const p = S.pin; S.pin = null; return p; }
  let last = null;
  try { last = B && B.storage ? B.storage.get(LAPS_KEY) : null; } catch (e) { last = null; }
  if (!last || typeof last !== 'object' || Array.isArray(last)) last = {};
  const lap = LM.lapOf(chapter, +last[chapter] || 0, rand01);
  last[chapter] = lap;
  try { if (B && B.storage) B.storage.set(LAPS_KEY, last); } catch (e) { /* no save here: the lap is still new */ }
  return lap;
}
function startChapter(chapter) {
  if (!LM.CHAPTERS.includes(chapter)) return showMenu();
  S.chapter = chapter; S.lap = playLap(chapter); S.round = 0; S.screen = 'play'; S.glows = []; el.card.hidden = true; el.card.replaceChildren();
  bench.visible = true; setLit(0);
  if (S.hero) S.hero.play('idle');
  nextRound();
}
function dots2() {
  el.dots.replaceChildren(...Array.from({ length: LM.ROUNDS }, (_, i) => { const d = document.createElement('i'); if (i < S.round - 1) d.className = 'on'; else if (i === S.round - 1) d.className = 'now'; return d; }));
  el.dots.setAttribute('aria-label', fmt('round', { n: S.round, m: LM.ROUNDS })); el.dots.hidden = false; el.row2.hidden = false;
}
function nextRound() {
  if (S.round >= LM.ROUNDS) return finish();
  S.round++; S.R = LM.round(S.chapter, S.round, S.lap); S.phase = 'play'; S.mode = 'ask'; S.shown = false; S.runs = 0; S.tick++;
  S.vals = Object.fromEntries(S.R.dials.map(d => [d.id, d.start]));
  const R = S.R;
  hint(); dots2(); chip(R.show);
  say(R.ask[0], R.ask[1]);   // the words first: the camera fits the hollow under them
  redraw(); frame();
}
function finish() {
  S.screen = 'end'; S.phase = 'idle'; S.done[S.chapter] = true; store(); S.tick++;
  // The course step's completion signal: once for each chapter finished, never before its sixth round is right.
  S.reported++;
  try { if (window.BRB && BRB.gameOver) BRB.gameOver({ won: true }); } catch (e) { /* no page */ }
  S.R = null; solo(LM.ROUNDS);
  g.celebrate(S.hero, '');   // the cheer and the confetti; the words are on the card
  const buttons = [{ id: 'again', icon: '🔁', label: fmt('btn.again'), cls: 'go', go: () => startChapter(S.chapter) }];
  if (!S.lock) buttons.push({ id: 'menu', icon: '🏠', label: fmt('btn.menu'), go: showMenu });
  card('end', { title: fmt('win'), line: 'win.card', buttons, star: true });
  frame();
}
/** Draw the round from its state (also after the screen turns): the board, the lamplighter, the rack, the dials. */
function redraw() {
  if (S.screen === 'hero') return void showHeroes();
  if (S.screen === 'menu' || S.screen === 'end') { solo(S.screen === 'end' ? LM.ROUNDS : 0); return void frame(); }
  if (S.screen !== 'play' || !S.R) return void frame();
  const focus = el.bar.contains(document.activeElement) ? document.activeElement.id : '';
  const R = S.R, found = S.phase === 'right', first = !S.shown && !found;
  clearStage(); S.tick++;
  el.card.hidden = true; el.bar.classList.toggle('wait', found);
  putBoard(R, found ? 'found' : S.mode, first); setLit(S.round - 1 + (found ? 1 : 0));
  placeHero(); view.pts = stagePts();
  el.bar.hidden = false;
  el.dials.replaceChildren(...R.dials.map(dialEl));
  el.light.className = 'lm-btn go' + (found ? ' ok' : ''); el.light.replaceChildren(Object.assign(document.createElement('span'), { className: 'i', textContent: '🔥' }), Object.assign(document.createElement('span'), { className: 'l', textContent: fmt('btn.light') }));
  el.light.firstChild.setAttribute('aria-hidden', 'true'); el.light.setAttribute('aria-label', fmt('btn.light'));
  if (focus) { const b = document.getElementById(focus) || el.light; if (b) b.focus(); }   // a keyboard player stays on the workbench
  S.shown = true;
  if (found) pauseForSpeech(1.6, guard(nextRound));   // the screen turned while the answer was showing: the round ends here
}
/** A step that only runs if the round it belongs to is still the one on screen. */
const guard = fn => { const tick = S.tick; return (...a) => { if (tick === S.tick) fn(...a); }; };

/** The player lights the lantern: the plan on the dials is run, and what it really makes is shown. */
function light() {
  if (S.phase !== 'play' || !S.R || S.screen !== 'play') return;
  const R = S.R, v = { ...S.vals }, res = LM.judge(R, v), i = S.round - 1;
  S.runs++; dropTrial();
  if (!res.ok) {
    // a plan that does not work: the lantern lights in the glow the plan made (a small, wrong light on the rack), the
    // board shows what the plan really did, and the hint says why. The round stays open.
    S.last = res.why;
    const G = R.chapter === 'mix' ? LM.glow(v.a, v.b) : null;
    if (G || R.chapter !== 'mix') { const o = rackLamp(i, G ? G.css : '#8f9bb8', true); rack.add(o); placeRack(); }
    wobble(el.light); hint(res.hint);
    paint(R, 'hint'); drop(board); board.position.copy(BOARD); board.scale.set(BW, BH, 1); board.visible = true; shake(board);
    frame();
    return;
  }
  S.phase = 'right'; S.tick++; hint(); sfx('coin'); S.last = '';
  el.light.classList.add('ok'); el.bar.classList.add('wait');
  chip(res.shown, 'ok');
  say(res.said[0][0], res.said[0][1], { queue: true });
  for (const [key, vars] of res.said.slice(1)) speak(key, vars, { queue: true });
  paint(R, 'found'); drop(board); board.position.copy(BOARD); board.scale.set(BW, BH, 1); pop(board, { from: 0.9 });
  // the round's lantern stays lit on the rack, the lamplighter cheers, and only then the next round
  S.glows[i] = roundGlow(R, v);
  const o = rackLamp(i, S.glows[i].css); rack.add(o); S.lit = i + 1; placeRack(); frame();
  pop(o, { then: guard(() => { sfx('cheer'); heroMove('cheer', 1700); pauseForSpeech(reduced ? 3.4 : 2.1, guard(nextRound)); }) });
}
el.light.addEventListener('click', light);

/* ---------- the test handle: what the round asks and what is on screen (tests, covers, slide pictures) ---------- */
function boxOf(o) {
  const cam = g.camera, right = V3(1, 0, 0).applyQuaternion(cam.quaternion), up = V3(0, 1, 0).applyQuaternion(cam.quaternion), [w, h] = o.userData.size;
  const mid = o.getWorldPosition(V3(0, 0, 0));
  const [sx, sy] = scr(mid), [rx] = scr(mid.clone().addScaledVector(right, w / 2)), [, uy] = scr(mid.clone().addScaledVector(up, h / 2));
  return [sx - (rx - sx), uy, rx, sy + (sy - uy)].map(n => Math.round(n));
}
const shown = o => { for (let q = o; q; q = q.parent) if (!q.visible) return false; return true; };
const ray = new THREE.Raycaster();
/** Whether nothing of the hollow stands between the camera and a point (the scenery never hides the board). */
function clearTo(p) {
  const from = g.camera.position, dir = p.clone().sub(from), dist = dir.length();
  ray.set(from, dir.normalize()); ray.near = 0.1; ray.far = dist - 0.12;
  return !ray.intersectObjects([room, props], true).some(hit => shown(hit.object));
}
const boxPts = pts => { const p = pts.map(scr); return [Math.min(...p.map(q => q[0])), Math.min(...p.map(q => q[1])), Math.max(...p.map(q => q[0])), Math.max(...p.map(q => q[1]))].map(n => Math.round(n)); };
window.__lm = window.__brbTest = {
  state: () => ({ game: 'lantern-mix', screen: S.screen, chapter: S.chapter, lock: S.lock, round: S.round, lap: S.lap, rounds: LM.ROUNDS, phase: S.phase, hero: S.hero ? S.hero.id : null, reported: S.reported, tall,
    ...(S.R && S.screen === 'play' ? { ...S.R, mode: S.mode, vals: { ...S.vals }, runs: S.runs, last: S.last || '', moving: tweens.length,
      onStage: { board: stage.children.includes(board) && board.visible, lit: rack.children.filter(o => !o.userData.trial).length, trial: rack.children.filter(o => o.userData.trial).map(o => o.userData.css), glows: rack.children.filter(o => !o.userData.trial).map(o => o.userData.css) } } : {}) }),
  fast: on => { S.fast = on !== false; },
  /** lap(n): the next play takes lap n (0: the fixed lap) instead of a random one. */
  lap: n => { S.pin = Math.max(0, Math.floor(+n) || 0); },
  hero: id => chooseHero(id || HEROES[0]),
  /** act('set', { a, b }) turns the dials; act('light') runs the plan; act('solve') sets a right plan and runs it. */
  act: (name, arg) => { if (name === 'set') { for (const k in arg) setDial(k, arg[k]); } else if (name === 'solve') { for (const k in S.R.want) setDial(k, S.R.want[k]); light(); } else light(); },
  /** Where things are on the screen (CSS pixels): the box round the lamplighter, the board (its box, whether the
   *  hollow leaves it in full view, and the smallest words on it in screen pixels) and the lantern rack. */
  spot: () => {
    const bx = boxOf(board), k = 0.46;
    return {
      hero: S.hero ? boxPts(heroBox(S.hero.position, S.hero.object.scale.x)) : null,
      board: { box: bx, small: Math.round(S.small * (bx[2] - bx[0]) / CW * 10) / 10,
        clear: [[0, 0], [-k, -k], [k, -k], [k, k], [-k, k], [0, -k], [0, k]].every(([dx, dy]) => clearTo(V3(BOARD.x + dx * BW, BOARD.y + dy * BH, BOARD.z))) },
      rack: bench.visible ? (() => { const s = rackSize(), t = rackSpot(); return boxPts([V3(t.x - 1.1 * s, 0, t.z), V3(t.x + 1.1 * s, 0, t.z), V3(t.x - 1.1 * s, 1.4 * s, t.z), V3(t.x + 1.1 * s, 1.4 * s, t.z)]); })() : null,
    };
  },
};

el.lm.hidden = false;
await showHeroes();
// One frame drawn of the first screen (two animation frames, or 300 ms in a tab that draws none), then the loading
// screen fades away.
await Promise.race([new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))), new Promise(r => setTimeout(r, 300))]);
el.load.classList.add('out'); setTimeout(() => el.load.remove(), reduced ? 0 : 400);
window.__ready = true;
</script>
