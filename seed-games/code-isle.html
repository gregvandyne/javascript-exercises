/* ---------- Pip's world ---------- */
const BLOCKS = ['grass', 'dirt', 'sand', 'stone', 'wood', 'brick', 'glass', 'gold', 'snow', 'lamp', 'red', 'orange', 'yellow', 'green', 'blue', 'purple', 'pink', 'white', 'black'];
const PLANTS = ['tree', 'pine', 'palm', 'flower', 'bush', 'mushroom'];
const BLOCKERS = new Set(['rock', 'tree', 'pine', 'palm', 'bush', 'mushroom']);
const DIRS = ['N', 'E', 'S', 'W'];
const DV = { N: [0, -1], E: [1, 0], S: [0, 1], W: [-1, 0] };
const FACING = { N: 'north', E: 'east', S: 'south', W: 'west' };
const MAX_H = 14, MAX_ACTIONS = 3000;
const L = (t, h, extra) => Object.assign({ t, h }, extra || {});
const LEGEND = {
  '~': {}, ' ': {}, '.': {},
  g: L('grass', 1), G: L('grass', 2), H: L('grass', 3),
  s: L('sand', 1), S: L('sand', 2), d: L('dirt', 1),
  r: L('stone', 1), R: L('stone', 2), M: L('stone', 3), w: L('wood', 1), n: L('snow', 1),
  P: L('grass', 1, { pip: 1 }), p: L('sand', 1, { pip: 1 }),
  F: L('grass', 1, { flag: 1 }), f: L('sand', 1, { flag: 1 }), Q: L('grass', 1, { flag: 1, pip: 1 }),
  '*': L('grass', 1, { gem: 1 }), '+': L('sand', 1, { gem: 1 }),
  o: L('grass', 1, { item: 'rock' }), T: L('grass', 1, { item: 'tree' }), '^': L('grass', 1, { item: 'pine' }),
  b: L('grass', 1, { item: 'bush' }), m: L('grass', 1, { item: 'mushroom' }), v: L('grass', 1, { item: 'flower' }),
  N: L('grass', 1, { npc: 1 }),
  '=': { bp: [{ y: 0, t: 'wood' }] }, '#': { bp: [{ y: 0, t: '*' }] },
};
for (let d = 2; d <= 9; d++) LEGEND[String(d)] = L('stone', d);
function colBlocks(Lg) {
  const h = Lg.h || 0; if (!h) return [];
  if (Lg.t === 'grass' || Lg.t === 'snow') return Array(h - 1).fill('dirt').concat(Lg.t);
  return Array(h).fill(Lg.t);
}

class Sim {
  constructor(level, vi = 0) {
    const map = (level.maps || [level.map])[vi];
    this.level = level; this.vi = vi;
    this.D = map.length; this.W = Math.max(...map.map(r => r.length));
    this.cols = []; this.goals = { build: [], paint: [], plant: [] };
    this.gemTotal = 0; this.gems = 0; this.flag = null; this.npc = null;
    const lg = Object.assign({}, LEGEND, level.legend || {});
    for (let z = 0; z < this.D; z++) for (let x = 0; x < this.W; x++) {
      const ch = map[z][x] === undefined ? '~' : map[z][x];
      const Lg = lg[ch];
      if (!Lg) throw new Error(`Level ${level.id}: unknown map letter "${ch}"`);
      const c = { blocks: colBlocks(Lg), item: Lg.item || null, gem: !!Lg.gem, flag: !!Lg.flag, npc: !!Lg.npc };
      this.cols.push(c);
      if (Lg.pip) this.pip = { x, z, y: c.blocks.length, dir: level.dir || 'E' };
      if (Lg.flag) this.flag = { x, z };
      if (Lg.npc) this.npc = { x, z };
      if (Lg.gem) this.gemTotal++;
      if (Lg.bp) for (const b of Lg.bp) this.goals.build.push({ x, y: b.y, z, t: b.t });
      if (Lg.paint) this.goals.paint.push({ x, z, t: Lg.paint });
      if (Lg.plant) this.goals.plant.push({ x, z, k: Lg.plant });
    }
    if (!this.pip) this.pip = { x: 0, z: 0, y: 1, dir: 'E' };
    const add = (list, into, f) => { for (const g of (typeof list === 'function' ? list(this) : list) || []) into.push(f(g)); };
    add(level.build, this.goals.build, g => ({ x: g[0], y: g[1], z: g[2], t: g[3] || '*' }));
    add(level.paint, this.goals.paint, g => ({ x: g[0], z: g[1], t: g[2] }));
    add(level.plants, this.goals.plant, g => ({ x: g[0], z: g[1], k: g[2] }));
    this.events = []; this.said = []; this.logs = []; this.actions = 0; this.error = null;
    this.start = { x: this.pip.x, z: this.pip.z, y: this.pip.y, dir: this.pip.dir };
  }
  col(x, z) { return (x >= 0 && z >= 0 && x < this.W && z < this.D) ? this.cols[z * this.W + x] : null; }
  front() { const d = DV[this.pip.dir]; const x = this.pip.x + d[0], z = this.pip.z + d[1]; return { x, z, c: this.col(x, z) }; }
  here() { return this.col(this.pip.x, this.pip.z); }
  ev(o) { this.events.push(o); }
  act(line) { if (++this.actions > MAX_ACTIONS) throw new CodeError(`Pip is tired! That's over ${MAX_ACTIONS} actions. Is a loop running forever?`, line, 'loop'); }
  fail(msg, line, kind, at) { this.ev({ k: 'fail', msg, line, kind, x: at ? at.x : this.pip.x, z: at ? at.z : this.pip.z }); throw new CodeError(msg, line, 'pip'); }
  whyBlocked(f) {
    const c = f.c;
    if (!c) return ['edge', 'Pip stopped at the edge of the island. There\'s nothing out there!'];
    if (c.npc) return ['bump', 'Oops! A friend is standing there. Pip can\'t walk through them.'];
    if (c.item && BLOCKERS.has(c.item)) return ['bump', `Bonk! A ${c.item} is in the way.`];
    if (!c.blocks.length) return ['water', 'Splash! Pip can\'t swim. Build a block on the water first.'];
    if (c.blocks.length - this.pip.y > 1) return ['high', `That's too high to climb! Pip can only step up 1 block at a time (this is ${c.blocks.length - this.pip.y} higher).`];
    return null;
  }
  step(line) {
    this.act(line);
    const f = this.front(); const why = this.whyBlocked(f);
    if (why) this.fail(why[1], line, why[0], f);
    const from = { x: this.pip.x, z: this.pip.z, y: this.pip.y };
    this.pip.x = f.x; this.pip.z = f.z; this.pip.y = f.c.blocks.length;
    let gem = false;
    if (f.c.gem) { f.c.gem = false; this.gems++; gem = true; }
    this.ev({ k: 'move', x: f.x, z: f.z, y: this.pip.y, from, gem, line });
  }
  turn(by, line) {
    this.act(line);
    this.pip.dir = DIRS[(DIRS.indexOf(this.pip.dir) + by + 4) % 4];
    this.ev({ k: 'turn', dir: this.pip.dir, by, line });
  }
  build(type, line) {
    this.act(line);
    const f = this.front(); const c = f.c;
    if (!c) this.fail('Pip can\'t build past the edge of the island.', line, 'edge', f);
    if (c.npc) this.fail('A friend is standing there! Pip can\'t build on top of them.', line, 'bump', f);
    if (c.item) this.fail(`There's a ${c.item} in the way, so Pip can't build there.${c.item === 'rock' ? ' Try pip.dig() first.' : ''}`, line, 'bump', f);
    if (c.flag) this.fail('Don\'t cover the flag! Pip needs to reach it.', line, 'bump', f);
    if (c.gem) this.fail('There\'s a gem there! Walk onto it to collect it instead.', line, 'bump', f);
    if (c.blocks.length >= MAX_H) this.fail(`That tower is as tall as Pip can reach (${MAX_H} blocks)!`, line, 'high', f);
    c.blocks.push(type);
    this.ev({ k: 'build', x: f.x, z: f.z, y: c.blocks.length - 1, t: type, line });
  }
  plant(kind, line) {
    this.act(line);
    const f = this.front(); const c = f.c;
    if (!c) this.fail('Pip can\'t plant past the edge of the island.', line, 'edge', f);
    if (!c.blocks.length) this.fail('Plants can\'t grow in water!', line, 'water', f);
    if (c.npc || c.item || c.flag || c.gem) this.fail(`There's ${c.npc ? 'a friend' : c.item ? 'a ' + c.item : c.flag ? 'the flag' : 'a gem'} there already, so Pip can't plant.`, line, 'bump', f);
    c.item = kind;
    this.ev({ k: 'plant', x: f.x, z: f.z, y: c.blocks.length, kind, line });
  }
  dig(line) {
    this.act(line);
    const f = this.front(); const c = f.c;
    if (!c) this.fail('There\'s nothing to dig past the edge.', line, 'edge', f);
    if (c.npc) this.fail('That\'s a friend! No digging.', line, 'bump', f);
    if (c.flag) this.fail('Pip can\'t dig up the flag!', line, 'bump', f);
    if (c.item) { const was = c.item; c.item = null; this.ev({ k: 'dig', x: f.x, z: f.z, item: was, y: c.blocks.length, line }); return; }
    if (c.blocks.length <= 1) this.fail(c.blocks.length ? 'The ground here is too hard to dig any deeper.' : 'You can\'t dig water!', line, 'bump', f);
    const t = c.blocks.pop();
    this.ev({ k: 'dig', x: f.x, z: f.z, y: c.blocks.length, t, line });
  }
  paint(color, line) {
    this.act(line);
    const c = this.here();
    c.blocks[c.blocks.length - 1] = color;
    this.ev({ k: 'recolor', x: this.pip.x, z: this.pip.z, y: c.blocks.length - 1, t: color, line });
  }
  jumpTo(x, z, line) {
    this.act(line);
    const c = this.col(x, z);
    if (!c || !c.blocks.length) this.fail(`Pip can't jump to (${x}, ${z}) — there's no ground there.`, line, 'edge', { x, z });
    if (c.item && BLOCKERS.has(c.item) || c.npc) this.fail(`Something is already standing at (${x}, ${z}).`, line, 'bump', { x, z });
    const from = { x: this.pip.x, z: this.pip.z, y: this.pip.y };
    this.pip.x = x; this.pip.z = z; this.pip.y = c.blocks.length;
    if (c.gem) { c.gem = false; this.gems++; }

  }
  say(text, line) {
    this.act(line);
    this.said.push(text);
    this.ev({ k: 'say', text, line });
  }
  aheadName() {
    const f = this.front(); const c = f.c;
    if (!c) return 'edge';
    if (c.npc) return 'friend';
    if (c.item) return c.item;
    if (c.gem) return 'gem';
    if (c.flag) return 'flag';
    if (!c.blocks.length) return 'water';
    return c.blocks[c.blocks.length - 1];
  }
}

const PIP_DOCS = [
  ['forward', 'pip.forward(steps)', 'Walk forward. Leave the ( ) empty for 1 step, or put a number inside.'],
  ['turnLeft', 'pip.turnLeft()', 'Turn a quarter turn to the left.'],
  ['turnRight', 'pip.turnRight()', 'Turn a quarter turn to the right.'],
  ['turnAround', 'pip.turnAround()', 'Turn to face the other way.'],
  ['build', 'pip.build(block, count)', 'Put a block on the spot in front of Pip. The count is how many to stack (1 if you leave it out).'],
  ['plant', 'pip.plant(kind)', 'Plant something in front of Pip: "tree", "pine", "palm", "flower", "bush" or "mushroom".'],
  ['dig', 'pip.dig()', 'Clear the spot in front: take away a rock or plant, or the top block of a stack.'],
  ['paint', 'pip.paint(color)', 'Paint the block Pip is standing on.'],
  ['say', 'pip.say(message)', 'Pip says something in a speech bubble.'],
  ['ahead', 'pip.ahead()', 'Tells you what is in front of Pip: "water", "rock", "gem", "flag", "edge", "friend", a plant, or the top block\'s name like "grass".'],
  ['here', 'pip.here()', 'Tells you the name of the block under Pip, like "grass" or "red".'],
  ['isBlocked', 'pip.isBlocked()', 'true if Pip can\'t step forward (water, edge, something in the way, or too high).'],
  ['onFlag', 'pip.onFlag()', 'true if Pip is standing on the flag.'],
  ['height', 'pip.height()', 'How high Pip is standing (the ground is 1).'],
  ['heightAhead', 'pip.heightAhead()', 'How tall the spot in front of Pip is (water is 0).'],
  ['facing', 'pip.facing()', 'Which way Pip faces: "north", "east", "south" or "west".'],
  ['jumpTo', 'pip.jumpTo(x, z)', 'Free Build only: jump straight to a spot. x goes left→right, z goes back→front, starting at 0.'],
];

function makePip(sim, interp, sandbox) {
  const N = (name, fn) => new NativeFn(name, fn);
  const L = () => interp.line;
  const count = (v, name, def, max) => {
    if (v === undefined) return def;
    const n = Number(prim(v));
    if (typeof v === 'string' && /^\s*\d+\s*$/.test(v)) return Math.floor(n);
    if (typeof v !== 'number' || !Number.isFinite(n)) throw new CodeError(`${name} needs a number, like ${name === 'build' ? 'pip.build("stone", 3)' : 'pip.forward(3)'}, but got ${typeName(v)}.`, L());
    if (n < 0) throw new CodeError(`${name} can't use a number below 0.`, L());
    if (n > max) throw new CodeError(`${n} is a lot! ${name} can do up to ${max} at a time.`, L());
    return Math.floor(n);
  };
  const blockName = (v, def) => {
    if (v === undefined) return def;
    if (typeof v !== 'string') throw new CodeError(`Block names are text in quotes, like pip.build("stone"). You gave ${typeName(v)}${typeof v === 'number' ? ' — the number goes second: pip.build("stone", ' + v + ')' : ''}.`, L());
    const k = v.trim().toLowerCase();
    if (BLOCKS.includes(k)) return k;
    throw new CodeError(`Pip doesn't have "${v}" blocks.${didYouMean(k, BLOCKS) || ' Try one of: ' + BLOCKS.join(', ') + '.'}`, L(), 'name');
  };
  const m = {
    forward: N('forward', a => { const n = count(a[0], 'forward', 1, 50); for (let i = 0; i < n; i++) sim.step(L()); }),
    turnLeft: N('turnLeft', () => { sim.turn(-1, L()); }),
    turnRight: N('turnRight', () => { sim.turn(1, L()); }),
    turnAround: N('turnAround', () => { sim.turn(2, L()); }),
    build: N('build', a => { const t = blockName(a[0], 'stone'); const n = count(a[1], 'build', 1, MAX_H); for (let i = 0; i < n; i++) sim.build(t, L()); }),
    plant: N('plant', a => {
      const v = a[0] === undefined ? 'tree' : a[0];
      if (typeof v !== 'string') throw new CodeError(`Plant names are text in quotes, like pip.plant("tree"). You gave ${typeName(v)}.`, L());
      const k = v.trim().toLowerCase();
      if (!PLANTS.includes(k)) throw new CodeError(`Pip can't plant "${v}".${didYouMean(k, PLANTS) || ' Try: ' + PLANTS.join(', ') + '.'}`, L(), 'name');
      sim.plant(k, L());
    }),
    dig: N('dig', () => { sim.dig(L()); }),
    paint: N('paint', a => { sim.paint(blockName(a[0], 'red'), L()); }),
    say: N('say', a => { sim.say(a.length ? a.map(x => show(x)).join(' ') : '…', L()); }),
    ahead: N('ahead', () => sim.aheadName()),
    here: N('here', () => { const c = sim.here(); return c.blocks[c.blocks.length - 1] || 'water'; }),
    isBlocked: N('isBlocked', () => !!sim.whyBlocked(sim.front())),
    onFlag: N('onFlag', () => !!sim.flag && sim.pip.x === sim.flag.x && sim.pip.z === sim.flag.z),
    height: N('height', () => sim.pip.y),
    heightAhead: N('heightAhead', () => { const c = sim.front().c; return c ? c.blocks.length : 0; }),
    facing: N('facing', () => FACING[sim.pip.dir]),
  };
  if (sandbox) m.jumpTo = N('jumpTo', a => {
    const x = Number(prim(a[0])), z = Number(prim(a[1]));
    if (!Number.isInteger(x) || !Number.isInteger(z)) throw new CodeError('jumpTo needs two whole numbers, like pip.jumpTo(3, 5).', L());
    sim.jumpTo(x, z, L());
  });
  return new Host('pip', m);
}

/* ---------- Running and checking ---------- */
function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function countLines(code) {
  let n = 0; let inBlock = false;
  for (let raw of String(code).split('\n')) {
    let s = raw;
    if (inBlock) { const e = s.indexOf('*/'); if (e < 0) continue; s = s.slice(e + 2); inBlock = false; }
    s = s.replace(/\/\*.*?\*\//g, '');
    const b = s.indexOf('/*'); if (b >= 0) { s = s.slice(0, b); inBlock = true; }
    s = s.replace(/\/\/.*$/, '').trim();
    if (!s || /^[})\];,]+$/.test(s)) continue;
    n++;
  }
  return n;
}

function runVariant(level, prog, vi, opts = {}) {
  const sim = new Sim(level, vi);

  starter: 'for (let i = 0; i < 8; i++) {\n  // dig the bumps, fill the holes\n\n  pip.forward();\n}\n',
  sol: 'for (let i = 0; i < 8; i++) {\n  if (pip.heightAhead() > 1) {\n    pip.dig();\n  } else if (pip.heightAhead() < 1) {\n    pip.build("stone");\n  }\n  pip.forward();\n}',
  par: 6, concept: ['compare'], conceptLabel: 'Used > or <',
  check: sim => { for (let x = 2; x <= 8; x++) if (sim.col(x, 2).blocks.length !== 1) return 'The road isn\'t flat yet: every square should be exactly 1 block high.'; return null; },
  maps: [
    ['~~~~~~~~~~~', '~ggggggggg~', '~PgR~gR~gF~', '~gNggggggg~', '~~~~~~~~~~~'],
    ['~~~~~~~~~~~', '~ggggggggg~', '~PR~gRR~gF~', '~gNggggggg~', '~~~~~~~~~~~'],
    ['~~~~~~~~~~~', '~ggggggggg~', '~P~RgR~R~F~', '~gNggggggg~', '~~~~~~~~~~~']] },
{ id: '5-5', ch: 5, title: 'Gem Counter',
  story: 'How many gems are on my path? It\'s different in every world! Count them and tell me.',
  goal: 'Walk to the flag, count the gems as Pip finds them, and say the number.',
  learn: { title: 'Counting with if', text: 'Make a counter variable at 0. Each time you see a gem ahead, add 1 with count++. At the end, the counter holds the answer!', code: 'let count = 0;\nif (pip.ahead() === "gem") {\n  count++;\n}' },

/* ---------------- Chapter 6: Nested loops & patterns ---------------- */
{ id: '6-1', ch: 6, title: 'Sunny Road',
  story: 'Let\'s brighten my garden path! pip.paint colors the tile Pip is standing on.',
  goal: 'Paint the 6 path tiles yellow and reach the flag.',
  learn: { title: 'Painting', text: 'pip.paint("yellow"); paints the block under Pip. Paint, then move, then paint again… sounds like a loop!', code: 'pip.paint("yellow");\npip.forward();' },
  hints: ['Paint first, then step forward.', 'Put paint and forward in a loop.', 'The loop runs 6 times.'],
  starter: '',
  sol: 'for (let i = 0; i < 6; i++) {\n  pip.paint("yellow");\n  pip.forward();\n}',
  par: 3, concept: ['for'], conceptLabel: 'Used a loop',
  paint: [1, 2, 3, 4, 5, 6].map(x => [x, 2, 'yellow']),
  map: ['~~~~~~~~~', '~vgvgvg~~', '~PgggggF~', '~gNgggvg~', '~~~~~~~~~'] },
{ id: '6-2', ch: 6, title: 'Pink Patch',
  story: 'Paint me a pink square, 4 tiles by 4 tiles. Paint one row, go back, paint the next row…',
  goal: 'Paint the 4 × 4 square pink.',
  learn: { title: 'Loops inside loops', text: 'A loop inside another loop is called a nested loop. The inside loop paints one row. The outside loop repeats that for every row. 4 rows × 4 tiles = 16 tiles!', code: 'for (let row = 0; row < 4; row++) {\n  for (let col = 0; col < 4; col++) {\n    pip.paint("pink");\n    pip.forward();\n  }\n  nextRow();\n}' },
  hints: ['nextRow() is ready for you. It takes Pip to the start of the next row.', 'The inside loop paints and steps 4 times.', 'The outside loop runs the inside loop and then nextRow(), 4 times.'],
  starter: NEXT_ROW(4) + '\n// Paint one row:\nfor (let col = 0; col < 4; col++) {\n  pip.paint("pink");\n  pip.forward();\n}\nnextRow();\n',
  sol: NEXT_ROW(4) + 'for (let row = 0; row < 4; row++) {\n  for (let col = 0; col < 4; col++) {\n    pip.paint("pink");\n    pip.forward();\n  }\n  nextRow();\n}',
  par: 12, concept: ['nestedLoop'], conceptLabel: 'Used a loop inside a loop',
  paint: grid(1, 1, ['pppp', 'pppp', 'pppp', 'pppp'], () => 'pink'),
  map: ['~~~~~~~~', '~Pgggggg~'.slice(0, 8), '~gggggg~', '~gggggg~', '~gggggg~', '~ggggggN~'.slice(0, 7) + '~', '~~~~~~~~'] },
{ id: '6-3', ch: 6, title: 'Checkerboard',
  story: 'A chess garden! Black and white tiles, every other one. Here\'s a trick: if row + col is even, paint black.',
  goal: 'Paint the 6 × 6 checkerboard.',
  learn: { title: 'Remainder %', text: '% gives the remainder after dividing. 7 % 2 is 1, and 8 % 2 is 0. So if (n % 2 === 0) means "if n is even". It\'s perfect for every-other patterns!', code: 'if ((row + col) % 2 === 0) {\n  pip.paint("black");\n} else {\n  pip.paint("white");\n}' },
  hints: ['Use two loops: row and col, each from 0 to 5.', 'Inside: if ((row + col) % 2 === 0) paint black, else paint white.', 'Then forward, and nextRow() after each row.'],
  starter: NEXT_ROW(6) + '\nfor (let row = 0; row < 6; row++) {\n  for (let col = 0; col < 6; col++) {\n    pip.paint("black");\n    pip.forward();\n  }\n  nextRow();\n}\n',
  sol: NEXT_ROW(6) + 'for (let row = 0; row < 6; row++) {\n  for (let col = 0; col < 6; col++) {\n    if ((row + col) % 2 === 0) {\n      pip.paint("black");\n    } else {\n      pip.paint("white");\n    }\n    pip.forward();\n  }\n  nextRow();\n}',
  par: 15, concept: ['%'], conceptLabel: 'Used %',
  paint: grid(1, 1, Array(6).fill('xxxxxx'), (c, x, z) => (x + z) % 2 === 0 ? 'black' : 'white'),
  map: ['~~~~~~~~~~', '~Pgggggggg'.slice(0, 9) + '~', '~gggggggg~', '~gggggggg~', '~gggggggg~', '~gggggggg~', '~gggggggg~', '~ggggggggN', '~~~~~~~~~~'].map(r => r.slice(0, 10)) },
{ id: '6-4', ch: 6, title: 'Picture Frame',
  story: 'Paint a gold frame around my flower bed: only the outside edge of a 5 × 5 square. Leave the middle green!',
  goal: 'Paint the border gold and leave the inside as grass.',
  learn: { title: 'OR ||', text: '|| means "or". The if is true when ANY part is true. A tile is on the edge if it\'s in the first row OR the last row OR the first column OR the last column.', code: 'if (row === 0 || row === 4 || col === 0 || col === 4) {\n  pip.paint("gold");\n}' },
  hints: ['Edges are where row is 0 or 4, or col is 0 or 4.', 'Join the 4 checks with ||.', 'Only paint inside the if. Always step forward.'],
  starter: NEXT_ROW(5) + '\nfor (let row = 0; row < 5; row++) {\n  for (let col = 0; col < 5; col++) {\n    // paint gold only on the edges\n\n    pip.forward();\n  }\n  nextRow();\n}\n',
  sol: NEXT_ROW(5) + 'for (let row = 0; row < 5; row++) {\n  for (let col = 0; col < 5; col++) {\n    if (row === 0 || row === 4 || col === 0 || col === 4) {\n      pip.paint("gold");\n    }\n    pip.forward();\n  }\n  nextRow();\n}',
  par: 13, concept: ['||'], conceptLabel: 'Used ||',
  paint: grid(1, 1, ['#####', '#...#', '#...#', '#...#', '#####'], c => c === '#' ? 'gold' : 'grass'),
  map: ['~~~~~~~~~', '~Pggggggg~'.slice(0, 8) + '~', '~ggggggg~', '~ggggggg~', '~ggggggg~', '~ggggggg~', '~gggggggN'.slice(0, 8) + '~', '~~~~~~~~~'] },
{ id: '6-5', ch: 6, title: 'X Marks the Spot',
  story: 'The Glitch hid a treasure! Paint a big red X across a 5 × 5 square to mark it.',
  goal: 'Paint the two red diagonals of the X. Leave the rest as grass.',
  learn: { title: 'Diagonals', text: 'On one diagonal, the row and column are the same (row === col). On the other, they add up to 4 (row + col === 4). Use || to paint both!', code: 'if (row === col || row + col === 4) {\n  pip.paint("red");\n}' },
  hints: ['The X has two lines. One is where row === col.', 'The other is where row + col === 4.', 'if (row === col || row + col === 4) paint red.'],
  starter: NEXT_ROW(5) + '\nfor (let row = 0; row < 5; row++) {\n  for (let col = 0; col < 5; col++) {\n\n    pip.forward();\n  }\n  nextRow();\n}\n',
  sol: NEXT_ROW(5) + 'for (let row = 0; row < 5; row++) {\n  for (let col = 0; col < 5; col++) {\n    if (row === col || row + col === 4) {\n      pip.paint("red");\n    }\n    pip.forward();\n  }\n  nextRow();\n}',
  par: 13, concept: ['||', 'nestedLoop'], conceptLabel: 'Used || in a nested loop',
  paint: grid(1, 1, ['#...#', '.#.#.', '..#..', '.#.#.', '#...#'], c => c === '#' ? 'red' : 'grass'),
  map: ['~~~~~~~~~', '~Pgggggg~', '~ggggggg~', '~ggggggg~', '~ggggggg~', '~ggggggg~', '~ggggggN~', '~~~~~~~~~'] },

/* ---------------- Chapter 7: While loops ---------------- */
{ id: '7-1', ch: 7, title: 'Tunnel Run',
  story: 'My tunnels are all different lengths. Keep walking WHILE Pip is not on the flag!',
  goal: 'Reach the flag in all 3 tunnels with the same code.',
  learn: { title: 'while loops', text: 'A while loop repeats as long as its condition is true. ! means "not", so !pip.onFlag() is true while Pip is NOT on the flag. When Pip reaches the flag, the loop stops.', code: 'while (!pip.onFlag()) {\n  pip.forward();\n}' },
  hints: ['A for loop can\'t work here: the tunnels are different lengths!', 'Use while (!pip.onFlag()) { … }', 'Inside the while loop, just step forward.'],
  starter: '// The tunnels are different lengths!\n',
  sol: 'while (!pip.onFlag()) {\n  pip.forward();\n}',
  par: 2, concept: ['while'], conceptLabel: 'Used a while loop',
  legend: { P: { t: 'stone', h: 1, pip: 1 }, F: { t: 'stone', h: 1, flag: 1 } },
  maps: [
    ['~~~~~~~~~~~~', 'MMMMMMMMMMMM', 'MPrrFMMMMMMM', 'MNMMMMMMMMMM', '~~~~~~~~~~~~'],

    ['~~~~~~~~~~~~', 'MMMMMMMMMMMM', 'MPrrrrrrrrFM', 'MNMMMMMMMMMM', '~~~~~~~~~~~~']] },
{ id: '7-2', ch: 7, title: 'Bridge to Anywhere',
  story: 'The underground river is a different width in each cave. Build WHILE there\'s water ahead!',
  goal: 'Bridge the river and reach the flag in all 3 caves.',
  learn: { title: 'Two while loops', text: 'You can use as many loops as you like, one after another. The first while builds the bridge. The second while walks to the flag.', code: 'while (pip.ahead() === "water") {\n  pip.build("wood");\n  pip.forward();\n}' },

  sol: 'while (pip.ahead() === "water") {\n  pip.build("wood");\n  pip.forward();\n}\nwhile (!pip.onFlag()) {\n  pip.forward();\n}',
  par: 5, concept: ['while'], conceptLabel: 'Used while loops',
  legend: { P: { t: 'stone', h: 1, pip: 1 }, F: { t: 'stone', h: 1, flag: 1 } },
  maps: [
    ['MMMMMMMMMMM', 'MN~~MMMMMMM', 'rP##rrrrrFM', 'Mr~~MMMMMMM', 'MMMMMMMMMMM'],
    ['MMMMMMMMMMM', 'MN~~~~MMMMM', 'rP####rrrFM', 'Mr~~~~MMMMM', 'MMMMMMMMMMM'],
    ['MMMMMMMMMMM', 'MN~~~~~~MMM', 'rP######rFM', 'Mr~~~~~~MMM', 'MMMMMMMMMMM']] },
{ id: '7-3', ch: 7, title: 'Cave Maze',
  story: 'A real maze! Here\'s an old explorer trick: keep your right hand on the wall and you\'ll always find the way out.',
  goal: 'Solve all 3 mazes with the same code.',
  learn: { title: 'Loops inside while', text: 'The right-hand rule: try to turn right. If that way is blocked, turn left until it\'s open. Then step. Repeat until you\'re on the flag! pip.isBlocked() is true if Pip can\'t step forward.', code: 'while (!pip.onFlag()) {\n  pip.turnRight();\n  while (pip.isBlocked()) {\n    pip.turnLeft();\n  }\n  pip.forward();\n}' },
  hints: ['The outside loop runs while Pip is not on the flag.', 'Inside: turn right, then while blocked, turn left. Then forward.', 'This works for any maze that has walls all around it!'],
  starter: 'while (!pip.onFlag()) {\n  pip.turnRight();\n  // while blocked, turn left\n\n  pip.forward();\n}\n',
  sol: 'while (!pip.onFlag()) {\n  pip.turnRight();\n  while (pip.isBlocked()) {\n    pip.turnLeft();\n  }\n  pip.forward();\n}',
  par: 6, concept: ['while', 'nestedLoop'], conceptLabel: 'Used a while inside a while',
  legend: { P: { t: 'stone', h: 1, pip: 1 }, F: { t: 'stone', h: 1, flag: 1 } },
  maps: [
    ['MMMMMMMMM', 'MPrrMrrFM', 'MMMrMrMMM', 'MrrrrrrrM', 'MrMMMMMrM', 'MrrrMrrrM', 'MMMMMMMMM'],
    ['MMMMMMMMM', 'MPMrrrrrM', 'MrMrMMMrM', 'MrrrMFMrM', 'MMMMMrMrM', 'MrrrrrrrM', 'MMMMMMMMM'],
    ['MMMMMMMMM', 'MPrrrrrrM', 'MMMMMMMrM', 'MFrrMrrrM', 'MMMrMrMMM', 'MMMrrrMMM', 'MMMMMMMMM']] },
{ id: '7-4', ch: 7, title: 'Rubble Pile',
  story: 'A rock pile blocks the tunnel! Dig WHILE it\'s taller than the floor, count your digs, and tell me how many it took.',
  goal: 'Clear the pile, say how many digs it took, and reach the flag in all 3 caves.',
  learn: { title: 'while + counting', text: 'A while loop is great when you don\'t know how many times something will happen. Add 1 to a counter inside the loop to find out!', code: 'let digs = 0;\nwhile (pip.heightAhead() > 1) {\n  pip.dig();\n  digs++;\n}' },

  starter: 'let digs = 0;\n\n// dig while the pile is taller than 1\n\n// say how many digs it took, then walk to the flag\n',
  sol: 'let digs = 0;\nwhile (pip.heightAhead() > 1) {\n  pip.dig();\n  digs++;\n}\npip.say(digs);\nwhile (!pip.onFlag()) {\n  pip.forward();\n}',
  par: 8, concept: ['while', 'assign'], conceptLabel: 'Counted inside a while loop',
  legend: { P: { t: 'stone', h: 1, pip: 1 }, F: { t: 'stone', h: 1, flag: 1 } },
  check: sim => { const want = [3, 5, 2][sim.vi]; return saidNumber(sim, want) ? null : `Pip needs to say how many digs it took (in this cave it was ${want}).`; },
  maps: [
    ['MMMMMMM', 'MNMMMMM', 'MP4rFMM', 'MMMMMMM'],
    ['MMMMMMM', 'MNMMMMM', 'MP6rFMM', 'MMMMMMM'],
    ['MMMMMMM', 'MNMMMMM', 'MP3rFMM', 'MMMMMMM']] },

/* ---------------- Chapter 8: Arrays ---------------- */
{ id: '8-1', ch: 8, title: 'Rainbow Bridge',
  story: 'Build me a rainbow bridge! The colors are all in a list, in order.',
  goal: 'Build the bridge with the colors from the array, then reach the flag.',
  learn: { title: 'Arrays', text: 'An array is a list inside [ ]. for (const color of colors) goes through the list one item at a time: first "red", then "orange", and so on.', code: 'const colors = ["red", "orange", "yellow"];\nfor (const color of colors) {\n  pip.build(color);\n  pip.forward();\n}' },

  build: ['red', 'orange', 'yellow', 'green', 'blue', 'purple'].map((c, i) => [2 + i, 0, 2, c]),
  map: ['~~~~~~~~~~~', 'gN~~~~~~ggg', 'gP~~~~~~Fgg', 'gg~~~~~~ggg', '~~~~~~~~~~~'] },
{ id: '8-2', ch: 8, title: 'Skyline',
  story: 'My market needs a skyline! The tower heights are in an array. Use each number in order.',
  goal: 'Build a blue tower for each number in heights.',
  learn: { title: 'Index and length', text: 'Each item in an array has a position number called an index. The first is 0! heights[0] is the first item. heights.length is how many items there are.', code: 'const heights = [3, 5, 2];\nheights[0];      // 3\nheights.length;  // 3' },
  hints: ['Loop with i from 0 while i < heights.length.', 'Build heights[i] blue blocks on Pip\'s left.', 'Then turn back and step forward.'],
  starter: 'const heights = [3, 5, 2, 6, 4, 1];\n\nfor (let i = 0; i < heights.length; i++) {\n  pip.turnLeft();\n  // build heights[i] blue blocks\n  pip.turnRight();\n  pip.forward();\n}\n',

  map: ['~~~~~~~~~', '~~~~~~~~~', '~gggggg~~', '~Pgggggg~', '~ggNgggg~', '~~~~~~~~~'] },
{ id: '8-3', ch: 8, title: 'Copy Cat',
  story: 'Copy my top row of tiles onto the bottom row. Read each color into a list, then paint them back in order!',
  goal: 'Make the bottom row match the top row, in all 3 worlds.',
  learn: { title: 'push', text: 'list.push(thing) adds a new item to the end of an array. Start with an empty array [ ] and push things in as you find them. pip.here() tells you the color under Pip.', code: 'const seen = [];\nseen.push(pip.here());\nseen.length;  // 1' },
  hints: ['Walk the top row. At each tile, push pip.here() into seen.', 'The walk to the bottom row is ready for you.', 'On the bottom row: step, then paint seen[i].'],
  starter: 'const seen = [];\n\n// 1. Read the top row\nfor (let i = 0; i < 5; i++) {\n  pip.forward();\n  // remember this tile\'s color\n}\n\n// 2. Go to the bottom row (ready for you)\npip.turnRight();\npip.forward(2);\npip.turnRight();\npip.forward(5);\npip.turnAround();\n\n// 3. Paint the colors in the same order\nfor (let i = 0; i < seen.length; i++) {\n  pip.forward();\n\n}\n',
  sol: 'const seen = [];\nfor (let i = 0; i < 5; i++) {\n  pip.forward();\n  seen.push(pip.here());\n}\npip.turnRight();\npip.forward(2);\npip.turnRight();\npip.forward(5);\npip.turnAround();\nfor (let i = 0; i < seen.length; i++) {\n  pip.forward();\n  pip.paint(seen[i]);\n}',
  par: 13, concept: ['push'], conceptLabel: 'Used push',
  legend: { A: { t: 'red', h: 1 }, B: { t: 'blue', h: 1 }, C: { t: 'yellow', h: 1 }, D: { t: 'green', h: 1 }, E: { t: 'purple', h: 1 } },
  check: (sim, h) => { for (let x = 1; x <= 5; x++) if (h.topOf(sim.col(x, 3)) !== h.topOf(sim.col(x, 1))) return 'The bottom row doesn\'t match the top row yet.'; return null; },
  maps: [
    ['~~~~~~~~', 'PABACDg~', 'ggggggg~', 'gggggggN', '~~~~~~~~'],
    ['~~~~~~~~', 'PCCBEAg~', 'ggggggg~', 'gggggggN', '~~~~~~~~'],
    ['~~~~~~~~', 'PDEDBCg~', 'ggggggg~', 'gggggggN', '~~~~~~~~']] },
{ id: '8-4', ch: 8, title: 'Pixel Heart',

{ id: '9-2', ch: 9, title: 'Castle Wall',

    const ev = anim.evs[anim.i];
    if (!ev) { finishAnim(); return; }
    const dur = DUR[ev.k] || 0.2;
    if (!anim.started) { startEv(ev); anim.started = true; anim.t = 0; }
    const use = Math.min(budget, dur - anim.t); anim.t += use; budget -= use;
    tickEv(ev, Math.min(1, anim.t / dur));
    if (anim.t >= dur - 1e-6) { endEv(ev); anim.i++; anim.started = false; }
  }
}
function skipAnim() {
  if (!anim.on) return;
  while (anim.i < anim.evs.length) { const ev = anim.evs[anim.i]; if (!anim.started) startEv(ev, true); tickEv(ev, 1); endEv(ev, true); anim.i++; anim.started = false; }
  finishAnim();
}
function finishAnim() {
  anim.on = false; live.popT = 1; rebuildLive(); setRunning(false);
  const d = anim.done; anim.done = null; if (d) d();
}
function startEv(ev, quick) {
  if (ev.line) showRunLine(ev.line);
  const s = live.sim;
  switch (ev.k) {
    case 'move': {
      anim.from.copy(anim.pipPos); cellWorld(ev.x, ev.z, ev.y, anim.to);
      if (ev.jump) sfx('jump'); else if (!quick) sfx('step');
      break;
    }
    case 'turn': anim.angFrom = anim.ang; anim.angTo = anim.ang - (ev.by || 0) * Math.PI / 2; break;
    case 'build': {
      s.col(ev.x, ev.z).blocks.push(ev.t);
      live.pop = { x: ev.x, z: ev.z, y: ev.y, t: ev.t }; live.popT = quick ? 1 : 0; rebuildLive(); if (!quick) sfx('build');
      break;
    }
    case 'plant': s.col(ev.x, ev.z).item = ev.kind; rebuildLive(); if (!quick) { sfx('plant'); const w = cellWorld(ev.x, ev.z, ev.y + 0.3); burst(w.x, w.y, w.z, C('mint', 'light'), 8, 1.2, 1.6); } break;
    case 'dig': {
      const c = s.col(ev.x, ev.z); if (ev.item) c.item = null; else c.blocks.pop(); rebuildLive();
      if (!quick) { sfx('dig'); const w = cellWorld(ev.x, ev.z, ev.y + 0.4); burst(w.x, w.y, w.z, ev.item === 'rock' ? C('stone') : COLORS[ev.t] || C('cocoa'), 12, 2, 2.4); }
      break;
    }
    case 'recolor': { const c = s.col(ev.x, ev.z); c.blocks[ev.y] = ev.t; rebuildLive(); if (!quick) { const w = cellWorld(ev.x, ev.z, ev.y + 1.05); burst(w.x, w.y, w.z, COLORS[ev.t], 6, 1.4, 1.4); sfx('build'); } break; }
    case 'say': if (!quick) bubble(ev.text, 1600 / speed()); else bubble(ev.text, 1600); break;
    case 'print': logOut(ev.text); break;
    case 'fail': {
      anim.from.copy(anim.pipPos); cellWorld(ev.x, ev.z, anim.pipPos.y, anim.to);
      if (!quick) sfx(ev.kind === 'water' ? 'splash' : 'fail', true);
      break;
    }
    case 'error': break;
  }
}
function tickEv(ev, t) {
  switch (ev.k) {
    case 'move': {
      const e = easeIO(t);
      anim.pipPos.lerpVectors(anim.from, anim.to, e);
      const climb = Math.max(0, anim.to.y - anim.from.y);
      anim.pipPos.y += Math.sin(Math.PI * t) * (ev.jump ? 2.5 : 0.18 + climb * 0.5);
      pip.position.copy(anim.pipPos); pipBody.rotation.x = Math.sin(Math.PI * t) * 0.12;
      break;
    }
    case 'turn': anim.ang = anim.angFrom + (anim.angTo - anim.angFrom) * easeIO(t); pip.rotation.y = anim.ang; break;
    case 'build': case 'plant': case 'dig': {
      const a = Math.sin(Math.PI * t) * 1.4; pip.userData.arms.forEach(m => { m.rotation.x = -a; });
      if (ev.k === 'build') { live.popT = t; if (t < 1) rebuildLive(); }
      break;
    }
    case 'recolor': pipBody.position.y = Math.sin(Math.PI * t) * 0.15; break;
    case 'fail': {
      if (ev.kind === 'water' || ev.kind === 'edge') {
        const k = Math.min(1, t * 2.2);
        pip.position.lerpVectors(anim.from, anim.to, 0.45 * easeOut(k)); pip.position.y = anim.from.y - (ev.kind === 'water' ? 0.55 * k : 0);
        pipBody.rotation.z = Math.sin(t * 24) * 0.12 * (1 - t);
        if (t > 0.3 && !ev._sp) { ev._sp = 1; burst(pip.position.x, 0.9, pip.position.z, C('sky', 'tint'), 16, 2, 2.6); }
      } else {
        const k = Math.sin(Math.min(1, t * 2.5) * Math.PI);
        pip.position.lerpVectors(anim.from, anim.to, 0.22 * k); pipBody.rotation.z = Math.sin(t * 30) * 0.15 * (1 - t);
      }
      break;
    }
  }
}
function endEv(ev, quick) {
  switch (ev.k) {
    case 'move': {
      anim.pipPos.copy(anim.to); pip.position.copy(anim.pipPos); pipBody.rotation.x = 0;
      if (ev.gem) { live.sim.col(ev.x, ev.z).gem = false; rebuildLive(); if (!quick) { sfx('gem', true); burst(anim.pipPos.x, anim.pipPos.y + 0.6, anim.pipPos.z, C('sky', 'light'), 14, 2, 2.5); } }
      break;
    }
    case 'turn': anim.ang = anim.angTo; pip.rotation.y = anim.ang; break;
    case 'build': live.popT = 1; live.pop = null; rebuildLive(); pip.userData.arms.forEach(m => { m.rotation.x = 0; }); if (!quick) { const w = cellWorld(ev.x, ev.z, ev.y + 0.1); burst(w.x, w.y, w.z, C('snow'), 6, 1.6, 1); } break;
    case 'plant': case 'dig': pip.userData.arms.forEach(m => { m.rotation.x = 0; }); break;
    case 'recolor': pipBody.position.y = 0; break;
    case 'fail': pipBody.rotation.z = 0; bubble(ev.msg, 4200, true); break;
  }
}

/* Speech bubbles follow Pip on screen. */
const bubbles = [];
function bubble(text, ms, bad) {
  const b = el('div', 'ci-bubble' + (bad ? ' bad' : '')); b.textContent = String(text).slice(0, 160);
  $('#labels').appendChild(b);
  while (bubbles.length > 1) bubbles.shift().el.remove();
  bubbles.push({ el: b, until: performance.now() + ms });
}
const PV = new THREE.Vector3();
function project(v) { PV.copy(v).project(camera); return { x: (PV.x + 1) / 2 * viewW, y: (1 - PV.y) / 2 * viewH, vis: PV.z < 1 }; }
function updateBubbles() {
  const now = performance.now();
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    if (now > b.until || !pip.visible) { b.el.remove(); bubbles.splice(i, 1); continue; }
    const s = project(PV.set(pip.position.x, pip.position.y + 1.35, pip.position.z));
    b.el.style.transform = `translate(${Math.max(90, Math.min(viewW - 90, s.x))}px,${Math.max(80, s.y)}px) translate(-50%,-100%)`;
  }
}

    b.addEventListener('click', () => { if (p.id === 'free' || unlocked(p.id)) { sfx('click'); startLevel(p.id, mode === 'walk' ? 'walk' : 'map'); } else Oomba.ui.toast(t('locked')); });

{

function stepFolks(dt, t) {
  for (const sp of folks.children) {

    if ((u.wait -= dt) > 0) continue;

    const nx = sp.position.x + dx / d * 1.3 * dt, nz = sp.position.z + dz / d * 1.3 * dt, gr = groundAt(nx, nz);

}
async function talkTo(chId) {
  const ch = CHAPTERS.find(c => c.id === chId), lv = LEVELS.filter(l => l.ch === chId);
  const next = lv.find(l => !SAVE.done[l.id] && unlocked(l.id)), got = lv.reduce((a, l) => a + ((SAVE.done[l.id] || {}).s || 0), 0);
  const text = lv.every(l => SAVE.done[l.id]) ? `${ch.outro} You have ${got} of ${lv.length * 3} stars here.`
    : next ? `${ch.intro} Next up is ${next.id}: ${next.title}. Walk to its sign, or play it from here!` : 'Finish the levels before mine and come back to see me!';
  const r = await say(ch.npc, text, next ? [{ label: 'Bye!', kind: 'quiet', value: 0 }, { label: `Play ${next.id}`, kind: 'hot', value: 1, icon: 'play' }] : undefined);
  if (r === 1 && next) startLevel(next.id, 'walk');

addEventListener('keydown', e => {
  if (mode !== 'walk' || /INPUT|TEXTAREA/.test(e.target.tagName) || Oomba.ui.open || !$('#scrim').hidden) return;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space' && !e.repeat) walk.jump = true;
  if ((e.code === 'Enter' || e.code === 'KeyE') && !e.repeat && !(e.target.closest && e.target.closest('button'))) doAct();

});
addEventListener('keyup', e => walk.keys.delete(e.code));
addEventListener('blur', () => walk.keys.clear());
{
  const pad = $('#walkStick'), knob = pad.firstElementChild; let id = -1, cx = 0, cy = 0;
  const set = (x, y) => { const l = Math.hypot(x, y), k = l > 48 ? 48 / l : 1; x *= k; y *= k; knob.style.transform = `translate(${x}px,${y}px)`; walk.sx = x / 48; walk.sy = y / 48; };
  pad.addEventListener('pointerdown', e => { id = e.pointerId; const r = pad.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; try { pad.setPointerCapture(id); } catch { /* fine */ } set(e.clientX - cx, e.clientY - cy); pad.classList.add('on'); e.preventDefault(); });
  pad.addEventListener('pointermove', e => { if (e.pointerId === id) set(e.clientX - cx, e.clientY - cy); });
  const end = e => { if (e.pointerId !== id) return; id = -1; set(0, 0); pad.classList.remove('on'); };
  pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);
  const jb = $('#walkJump'); jb.innerHTML = ICON('jump');
  jb.addEventListener('pointerdown', e => { walk.jump = true; jb.classList.add('on'); e.preventDefault(); });
  const up = () => jb.classList.remove('on'); jb.addEventListener('pointerup', up); jb.addEventListener('pointercancel', up);
}
function stepWalk(dt) {
  if (Oomba.ui.open || !$('#scrim').hidden) { walk.jump = false; return; }
  const K = walk.keys;
  let ix = (K.has('ArrowRight') || K.has('KeyD') ? 1 : 0) - (K.has('ArrowLeft') || K.has('KeyA') ? 1 : 0) + walk.sx;
  let iz = (K.has('ArrowUp') || K.has('KeyW') ? 1 : 0) - (K.has('ArrowDown') || K.has('KeyS') ? 1 : 0) - walk.sy;
  const l = Math.hypot(ix, iz); if (l > 1) { ix /= l; iz /= l; }
  const fx = -Math.sin(rig.theta), fz = -Math.cos(rig.theta), rx = -fz, rz = fx;
  const speed = 4.6, vx = (fx * iz + rx * ix) * speed, vz = (fz * iz + rz * ix) * speed, moving = Math.hypot(vx, vz) > 0.3;
  const canGo = (x, z) => { const g = groundAt(x, z); if (!g || g.solid || hitsSolid(x, z)) return false; return g.h - walk.y <= (walk.ground ? 1.1 : 0.55); };
  if (moving) {
    const nx = walk.x + vx * dt, nz = walk.z + vz * dt;
    if (canGo(nx, walk.z)) walk.x = nx;
    if (canGo(walk.x, nz)) walk.z = nz;
    const want = Math.atan2(vx, vz); let d = want - walk.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); walk.yaw += d * Math.min(1, dt * 12);
    walk.step += dt * 11;
  }
  const g = groundAt(walk.x, walk.z), gh = g ? g.h : walk.y;
  if (walk.jump && walk.ground) { walk.vy = 8.6; walk.ground = false; sfx('jump'); }
  walk.jump = false;
  if (!walk.ground || walk.y > gh + 0.01) { walk.vy -= 24 * dt; walk.y += walk.vy * dt; walk.ground = false; if (walk.y <= gh) { walk.y = gh; walk.vy = 0; walk.ground = true; } }
  else if (gh > walk.y) walk.y = gh;

  pip.position.set(walk.x, walk.shownY, walk.z); pip.rotation.y = walk.yaw;
  const sw = moving && walk.ground && !REDUCED ? Math.sin(walk.step) : 0;
  pip.userData.arms[0].rotation.x = sw * 0.7; pip.userData.arms[1].rotation.x = -sw * 0.7; pipBody.rotation.x = moving ? 0.12 : 0;

  goal.tx = rig.tx = rig.tx + (walk.x - rig.tx) * Math.min(1, dt * 8); goal.tz = rig.tz = rig.tz + (walk.z - rig.tz) * Math.min(1, dt * 8); goal.ty = walk.shownY + 0.8;
  // sparkles
  const f = found();

    const opens = opensCount(); SAVE.found = [...f, s.i]; save(); noteUnlocks(opens); buildSparkles(); renderWalkBar(); sfx('star', true); burst(s.x, 1.8, s.z, C('spark'), 18, 2.4, 2.6);
    const n = SAVE.found.length, all = VILLAGE.sparkles.length;
    if (n === all) { Oomba.ui.toast('You found every sparkle on Code Isle!'); try { if (!REDUCED) Oomba.juice.confetti(); } catch { /* fine */ } } else Oomba.ui.toast(`Sparkle ${n} of ${all}!`);
    break;
  }
  // what is near: a level's sign, or a friend
  let best = null, bd = 2.3;
  for (const s of VILLAGE.signs) { const d = Math.hypot(s.x - walk.x, s.z - walk.z); if (d < bd) { bd = d; best = s; } }
  if (best) { const L = BYID[best.id]; setAct(unlocked(best.id) ? { kind: 'play', id: best.id, label: best.id === 'free' ? `Play ${t('free')}` : `Play ${best.id}: ${L.title}` } : { kind: 'locked', id: best.id, label: `${best.id} is locked` }); return; }
  for (const sp of folks.children) { if (Math.hypot(sp.position.x - walk.x, sp.position.z - walk.z) < 1.7) { setAct({ kind: 'chat', id: sp.userData.f.name, label: `Say hi to ${sp.userData.f.name}` }); return; } }
  for (const sp of npcs.children) { const d = Math.hypot(sp.position.x - walk.x, sp.position.z - walk.z); if (d < 2.2) { const ch = CHAPTERS.find(c => c.id === sp.userData.ch); setAct({ kind: 'talk', ch: ch.id, label: `Talk to ${ch.npc.name}` }); return; } }
  setAct(null);
}

/* ---------- Main loop (three.js draws every frame; the kit's screens run on the kit's clock) ---------- */
let last = performance.now(), blinkT = 3, frameMs = 16, slow = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  frameMs = frameMs * 0.95 + (dt * 1000) * 0.05;
  if (frameMs > 34 && sun.castShadow) { if (++slow > 120) { renderer.shadowMap.enabled = false; sun.castShadow = false; } } else slow = 0;
  if (mode === 'title' && !REDUCED) goal.theta += dt * 0.05;
  if (mode === 'walk') stepWalk(dt);
  if (mode !== 'level') stepFolks(dt, now / 1000);
  folks.visible = mode !== 'level';
  updateCam(dt);
  stepAnim(dt);
  const t2 = now / 1000;
  if (pip.visible) {
    if (!anim.on) { pipBody.position.y = REDUCED ? 0 : (mode === 'walk' ? Math.abs(Math.sin(walk.step)) * 0.06 : Math.sin(t2 * 3) * 0.04 + 0.03); }
    blinkT -= dt; const fm = pip.userData.faceMat;
    if (blinkT < 0) { fm.map = pipFace[1]; if (blinkT < -0.14) { fm.map = pipFace[0]; blinkT = 2 + Math.random() * 3; } }
    pip.userData.bulb.material.emissiveIntensity = 0.6 + Math.sin(t2 * 4) * 0.3;
  }
  for (const [layer, list] of [[staticItems, gemList.static], [liveItems, gemList.live]]) {
    const m = layer.meshes.gem; if (!m || !list.length) continue;
    for (let i = 0; i < list.length; i++) { const g = list[i]; Q.setFromEuler(EU.set(0, t2 * 2 + i, 0)); m.setMatrixAt(i, M4.compose(V.set(g[0], g[1] + (REDUCED ? 0 : Math.sin(t2 * 2.5 + i) * 0.08), g[2]), Q, S3.set(1, 1, 1))); }

    clouds.children.forEach(c => { c.position.x += c.userData.v * dt; if (c.position.x > 240) c.position.x = -240; });
    waterTex.offset.set(t2 * 0.004, t2 * 0.006);

  sun.target.position.set(rig.tx, 0, rig.tz); sun.position.set(rig.tx + 22, 40, rig.tz + 16);
  scene.fog.near = near ? 80 : 260; scene.fog.far = near ? 300 : 820;
  updateBubbles(); updatePlotLabels();

}

/* ---------- Test hooks: the kit's (setTheme, setLang, ...) plus the game's own ---------- */
