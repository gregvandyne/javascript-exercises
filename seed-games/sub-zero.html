<title>Sub Zero</title>
<!-- Sub Zero: Number Quest Pro Unit 2, The Cold Store (grades 6-7, ages 11-13). A food-science lab at night, on
     Oomba3D 1.2.0 in the Busy Kitchen theme washed in steel: no meals, a lab screen on the wall, a deep freezer
     with a rack of sample vials. The thermometer on the screen is a number line that stands up, with zero in the
     middle. Three chapters of six rounds:
       pour   (2.1) dividing by a fraction: a pot poured into jars of a fraction of a liter (how many jars, which
                    division it is, one liter into jars of 2/3, less than one jar, and decimals);
       below  (2.2) numbers below zero: place a negative number and a negative half, the opposite of a number,
                    which reading is colder, which is farther from zero (absolute value), colder than a limit;
       change (2.3) operations with negatives as moves on the thermometer: reach a target across zero, take out a
                    cold pack (subtracting a negative), a cooling rate over minutes, a drop in equal steps, and
                    the film run backward (negative times negative).
     Made for ages 11 to 14: plan first, then run. The player sets a stepper (or drags the marker) and runs the
     plan, or picks one of three tiles; a wrong plan is shown as it really turns out (jars left empty, the pot
     not empty, the reading landing somewhere else) with a spoken hint, and the round stays open. No timer, no
     lives, no fail state, nothing typed, nothing bought or sold. Read-aloud is on by default (BRB.speak, the
     shared path; the speaker button says a line again): lines are written the way they are said and printed with
     the real signs. Keys: arrows or + and - move the stepper, Enter runs, 1 to 3 pick a tile. Lesson mode:
     BRB.params { chapter: pour | below | change, lock: 1 } opens that chapter only; finishing its six rounds
     reports game over, won, once (the course step's completion signal). With no parameters the game offers the
     three chapters from a menu. Saves only which chapters are finished (BRB.storage 'sub-zero-v1'). The import
     map below is exactly kit2ImportMap() (server/services/vendor.js); tests/unit/sub-zero.test.js fails if a
     library bump leaves it behind. English only, like Number Quest's other lesson games. Test handle:
     window.__sz (also window.__brbTest, the name the picture scripts wait for). -->

cnv.addEventListener('pointerdown', ev => { const v = boardValue(ev); if (v != null) { dragging = true; setValue(v); } });
cnv.addEventListener('pointermove', ev => { if (!dragging) return; const v = boardValue(ev); if (v != null && v !== S.value) setValue(v); });
for (const name of ['pointerup', 'pointercancel', 'pointerleave']) cnv.addEventListener(name, () => { dragging = false; });

/* ---------- the stage: the lab screen on the wall, and the vials in the deep freezer ---------- */
function clearStage() {
  for (const o of [...stage.children]) stage.remove(o);
  tweens.length = 0;
  sizeBoard(); board.visible = true;
  placeChest();
  rack.children.forEach(o => { o.visible = true; });
}
function putBoard(Rd, mode, first) {
  paint(Rd, mode); stage.add(board);
  if (first) pop(board, { wait: 0.1, from: 0.6 });
}
/** Vials in the freezer's rack: one for each round already finished. */
function setVials(n) {
  while (rack.children.length > n) rack.remove(rack.children[rack.children.length - 1]);
  for (let i = rack.children.length; i < n; i++) { const o = vial(); o.position.copy(slot(i)); rack.add(o); }
  S.vials = n;
}
/** A finished round's sample goes from the screen into the deep freezer. */
function storeVial(then) {
  const i = S.vials; if (i >= SZ.ROUNDS) return then();
  const o = vial(), to = slot(i); rack.add(o); S.vials = i + 1;
  o.position.set(to.x - 2.2, 2.4, to.z - 0.6);
  fly(o, to, { dur: 0.6, arc: 0.9, then: () => { sfx('land'); then(); } });
}

/* ---------- the helper: one lab partner in an ice-blue cape (no picker: the lab starts at once) ---------- */
function placeHero() { const h = S.hero; if (!h) return; drop(h.object); g.scene.add(h.object); h.object.visible = true; h.object.scale.setScalar(heroSize()); h.position.copy(heroSpot()); h.object.rotation.y = tall ? 0 : 0.5; }
let heroBack = 0;
function heroMove(move, ms = 1500) {
  const h = S.hero; if (!h || reduced) return;
  h.play(move, { once: true }); clearTimeout(heroBack); heroBack = setTimeout(() => h.play('idle'), ms);
}

/* ---------- cards: the start of a lesson, the menu, the end of a chapter ---------- */
/** Maths on a button, its fractions set one number over the other. */
function mathsNode(s) {
  const out = document.createElement('span'); out.className = 'big';
  for (const p of String(s).split(/(\d+\/\d+)/).filter(x => x !== '')) {
    if (/^\d+\/\d+$/.test(p)) { const f = document.createElement('span'); f.className = 'fr'; for (const n of p.split('/')) { const b = document.createElement('b'); b.textContent = n; f.append(b); } out.append(f); } else out.append(p.trim());
  }
  return out;
}
function button({ id, label, icon, big, cls, go, aria }) {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'sz-btn' + (cls ? ' ' + cls : ''); if (id) b.id = id;
  const span = (c, t) => { const s = document.createElement('span'); s.className = c; if (t != null) s.textContent = t; return s; };
  if (icon) { const i = span('i', icon); i.setAttribute('aria-hidden', 'true'); b.append(i); }
  if (big != null) b.append(mathsNode(big));
  if (label) b.append(span('l', label));
  b.setAttribute('aria-label', aria || label || String(big));
  b.addEventListener('click', () => go(b));
  return b;
}
function card(kind, { title, sub, line, buttons }) {
  el.bar.hidden = true; el.row2.hidden = true; el.ask.hidden = true; hint();
  const top = document.createElement('div'), row = document.createElement('div');
  const h = document.createElement('h1'); h.textContent = title; top.append(h);
  if (sub) { const h2 = document.createElement('h2'); h2.textContent = sub; top.append(h2); }
  const a = document.createElement('div'); a.className = 'sz-ask'; a.style.display = 'inline-flex';
  const sb = document.createElement('button'); sb.type = 'button'; sb.className = 'sz-say'; sb.textContent = '🔊'; sb.setAttribute('aria-label', fmt('btn.say'));
  sb.addEventListener('click', () => speak(line, null, { auto: false }));
  const t = document.createElement('span'); t.className = 'sz-askt'; t.textContent = fmt(line); a.append(sb, t); top.append(a);
  row.className = kind === 'menu' ? 'sz-menu' : 'sz-pick'; row.append(...buttons.map(button));
  el.card.className = 'sz-card';
  el.card.replaceChildren(top, row); el.card.hidden = false;
  S.lines = [[line, null]]; speak(line);
}
/** The helper in the lab by the screen and the freezer: the start, the menu and the end of a chapter. */
function solo(vials) {
  clearStage(); putBoard(null, 'ask'); setVials(vials); placeHero();
  view.pts = stagePts();
}
function showStart() {
  S.screen = 'start'; S.phase = 'idle'; S.R = null; S.tick++; solo(0);
  card('start', { title: fmt('title'), sub: fmt('ch.' + P.chapter), line: 'start.line', buttons: [{ id: 'start', icon: ICON[P.chapter], label: fmt('btn.start'), cls: 'go', go: () => startChapter(P.chapter) }] });
  frame();
}
function showMenu() {
  S.screen = 'menu'; S.chapter = ''; S.phase = 'idle'; S.R = null; S.tick++; solo(0); g.weather('clear');
  if (S.hero) S.hero.play('wave');
  card('menu', { title: fmt('title'), line: 'menu.pick', buttons: SZ.CHAPTERS.map(c => ({ id: 'ch-' + c, icon: ICON[c] + (S.done[c] ? '⭐' : ''), label: fmt('ch.' + c), go: () => startChapter(c) })) });
  frame();
}

/* ---------- a chapter: six rounds ---------- */
function startChapter(chapter) {
  if (!SZ.CHAPTERS.includes(chapter)) return showMenu();
  S.chapter = chapter; S.round = 0; S.screen = 'play'; el.card.hidden = true; el.card.replaceChildren(); g.weather('clear');
  setVials(0);
  if (S.hero) S.hero.play('idle');
  nextRound();
}
function dots2() {
  el.dots.replaceChildren(...Array.from({ length: SZ.ROUNDS }, (_, i) => { const d = document.createElement('i'); if (i < S.round - 1) d.className = 'on'; else if (i === S.round - 1) d.className = 'now'; return d; }));
  el.dots.setAttribute('aria-label', fmt('round', { n: S.round, m: SZ.ROUNDS })); el.dots.hidden = false; el.row2.hidden = false;
}
function nextRound() {
  if (S.round >= SZ.ROUNDS) return finish();
  S.round++; S.R = SZ.round(S.chapter, S.round, S.lap); S.phase = 'play'; S.mode = 'ask'; S.draw = null; S.shown = false; S.tick++;
  const Rd = S.R; S.value = Rd.input === 'step' ? Rd.step.start : null;
  hint(); dots2(); chip(Rd.chip);
  say(Rd.ask);   // the words first: the camera fits the lab under them
  redraw(); frame();
}
function finish() {
  S.screen = 'end'; S.phase = 'idle'; S.done[S.chapter] = true; store(); S.tick++;
  // The course step's completion signal: once for each chapter finished, never before its sixth round is right.
  S.reported++;
  try { if (window.BRB && BRB.gameOver) BRB.gameOver({ won: true }); } catch (e) { /* no page */ }
  S.R = null; solo(SZ.ROUNDS);
  g.celebrate(S.hero, ''); g.weather('snow');   // the cheer, and frost in the air; the words are on the card
  const buttons = [{ id: 'again', icon: '🔁', label: fmt('btn.again'), cls: 'go', go: () => { S.lap++; startChapter(S.chapter); } }];
  if (!S.lock) buttons.push({ id: 'menu', icon: '🧊', label: fmt('btn.menu'), go: showMenu });
  card('end', { title: fmt('win'), sub: fmt('ch.' + S.chapter), line: 'win.card', buttons });
  frame();
}

/** What the stepper shows for its value: a reading, a change with its sign, or a count of jars. */
function valueText(Rd, v) { const k = Rd.step.show; return k === 'deg' ? SZ.deg(v) : k === 'chg' ? SZ.chg(v) : fmt('show.count.' + k + (v === 1 ? '.1' : ''), { n: v }); }
/** The controls of a round: a stepper and its run button, or three tiles. */
function controls(Rd, found) {
  if (Rd.input === 'tiles') return Rd.opts.map((o, i) => button({ id: 'sz-n' + i, big: o.t, aria: o.t, cls: found && i === Rd.answer ? 'right' : '', go: b => answer(i, b) }));
  const val = document.createElement('output'); val.id = 'sz-val'; val.className = 'sz-val'; val.setAttribute('aria-live', 'polite'); val.textContent = valueText(Rd, S.value);
  const live = Rd.step.live;
  return [button({ id: 'sz-dn', big: '−', aria: fmt('btn.down'), cls: 'step', go: () => bump(-1) }), val, button({ id: 'sz-up', big: '+', aria: fmt('btn.up'), cls: 'step', go: () => bump(1) }),
    button({ id: 'sz-go', icon: '▶', label: fmt(live === 'jars' ? 'btn.pour' : live === 'marker' ? 'btn.set' : 'btn.run'), cls: 'go', go: b => run(b) })];
}
/** Draw the round from its state (also after the screen turns): the lab screen, the helper, the vials, the controls. */
function redraw() {
  if (S.screen === 'start' || S.screen === 'menu' || S.screen === 'end') { solo(S.screen === 'end' ? SZ.ROUNDS : 0); return void frame(); }
  if (S.screen !== 'play' || !S.R) return void frame();
  const focus = el.bar.contains(document.activeElement) ? document.activeElement.id : '';
  const Rd = S.R, found = S.phase === 'right', first = !S.shown && !found;
  clearStage(); S.tick++;
  el.card.hidden = true;
  putBoard(Rd, found ? 'found' : S.mode, first); setVials(S.round - 1 + (found ? 1 : 0));
  placeHero(); view.pts = stagePts();
  el.bar.hidden = false; el.bar.className = 'sz-bar ' + Rd.input;
  el.bar.replaceChildren(...controls(Rd, found));
  if (focus) { const b = document.getElementById(focus) || el.bar.querySelector('button'); if (b) b.focus(); }   // a keyboard player stays on the controls
  S.shown = true;
  if (found) pauseForSpeech(1.6, guard(nextRound));   // the screen turned while the answer was showing: the round ends here
}
/** A step that only runs if the round it belongs to is still the one on screen. */
const guard = fn => { const tick = S.tick; return (...a) => { if (tick === S.tick) fn(...a); }; };
const still = () => { drop(board); board.position.copy(BOARD); board.scale.set(BW, BH, 1); board.visible = true; };

/** The stepper: a new value is a new plan, so the screen goes back to the question with the plan on it. */
function setValue(v) {
  const Rd = S.R; if (!Rd || S.screen !== 'play' || S.phase !== 'play' || Rd.input !== 'step') return;
  v = Math.max(Rd.step.min, Math.min(Rd.step.max, Math.round(v / Rd.step.by) * Rd.step.by));
  if (v === S.value && S.mode === 'ask') return;
  S.value = v; S.draw = null; hint();
  const out = document.getElementById('sz-val'); if (out) out.textContent = valueText(Rd, v);
  still(); paint(Rd, 'ask');
}
function bump(dir) { const Rd = S.R; if (Rd && Rd.input === 'step') setValue(S.value + dir * Rd.step.by); }
/** Run the plan the stepper holds. */
function run(b) { const Rd = S.R; if (Rd && Rd.input === 'step') settle(SZ.judge(Rd, S.value), b || document.getElementById('sz-go')); }
/** Pick a tile. */
function answer(i, b) { const Rd = S.R; if (Rd && Rd.input === 'tiles') settle(SZ.judge(Rd, i), b || document.getElementById('sz-n' + i)); }
function settle(res, b) {
  if (S.phase !== 'play' || !S.R || S.screen !== 'play' || !res) return;
  const Rd = S.R;
  if (!res.ok) {
    // a wrong plan: the screen shows what it really does, the hint says why, and the round stays open
    wobble(b); S.draw = res.draw || null; hint(res.lines);
    paint(Rd, 'hint'); still(); shake(board);
    return;
  }
  S.phase = 'right'; S.tick++; S.draw = null; hint(); sfx('coin');
  if (b) b.classList.add('right');
  chip(Rd.chipDone, 'ok');
  say(Rd.said, { queue: true });
  paint(Rd, 'found'); still(); pop(board, { from: 0.9 });
  // the round's sample goes into the deep freezer, the helper cheers, and only then the next round
  storeVial(guard(() => { sfx('cheer'); heroMove('cheer', 1700); pauseForSpeech(reduced ? 3.6 : 2.4, guard(nextRound)); }));
}
// Keys: the arrows (or + and −) move the stepper, Enter runs the plan, 1 to 3 pick a tile. Every control is also a
// button, so Tab, Enter and Space work too.
addEventListener('keydown', ev => {
  const Rd = S.R; if (!Rd || S.screen !== 'play' || S.phase !== 'play' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key, onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
  if (Rd.input === 'step') {
    if (k === 'ArrowUp' || k === 'ArrowRight' || k === '+' || k === '=') { bump(1); ev.preventDefault(); }
    else if (k === 'ArrowDown' || k === 'ArrowLeft' || k === '-' || k === '_') { bump(-1); ev.preventDefault(); }
    else if (k === 'Enter' && !onButton) { run(); ev.preventDefault(); }
  } else if (/^[1-3]$/.test(k) && +k <= Rd.opts.length) { answer(+k - 1); ev.preventDefault(); }
});

/* ---------- the test handle: what the round asks and what is on screen (tests, covers, slide pictures) ---------- */
const shownIn = o => { for (let q = o; q; q = q.parent) if (!q.visible) return false; return true; };
const ray = new THREE.Raycaster();
/** Whether nothing of the lab stands between the camera and a point (the furniture never hides the screen). */
function clearTo(p) {
  const from = g.camera.position, dir = p.clone().sub(from), dist = dir.length();
  ray.set(from, dir.normalize()); ray.near = 0.1; ray.far = dist - 0.12;
  return !ray.intersectObjects([room, props], true).some(hit => shownIn(hit.object));
}
const boxPts = pts => { const p = pts.map(scr); return [Math.min(...p.map(q => q[0])), Math.min(...p.map(q => q[1])), Math.max(...p.map(q => q[0])), Math.max(...p.map(q => q[1]))].map(n => Math.round(n)); };
window.__sz = window.__brbTest = {
  state: () => ({ game: 'sub-zero', screen: S.screen, chapter: S.chapter, lock: S.lock, round: S.round, rounds: SZ.ROUNDS, phase: S.phase, hero: S.hero ? S.hero.id : null, reported: S.reported, tall,
    ...(S.R && S.screen === 'play' ? { ...S.R, mode: S.mode, value: S.value, tried: S.draw, moving: tweens.length, onStage: { board: stage.children.includes(board) && board.visible, vials: rack.children.length } } : {}) }),
  fast: on => { S.fast = on !== false; },
  /** 'set' a stepper value, 'run' the plan, 'answer' a tile, or 'solve' the round the right way. */
  act: (name, arg) => {
    const Rd = S.R; if (!Rd) return;
    if (name === 'set') setValue(arg); else if (name === 'run') run(); else if (name === 'answer') answer(arg);
    else if (name === 'solve') { if (Rd.input === 'step') { setValue(Rd.answer); run(); } else answer(Rd.answer); }
  },
  /** Where things are on the screen (CSS pixels): the helper, the lab screen (its box, whether the lab leaves it in
   *  full view, and the smallest words on it in screen pixels) and the freezer. */
  spot: () => {
    const bx = boxOf(board), k = 0.46;
    return {
      hero: S.hero ? boxPts(heroBox(S.hero.position, S.hero.object.scale.x)) : null,
      board: { box: bx, small: Math.round(S.small * (bx[2] - bx[0]) / CW * 10) / 10,
        clear: [[0, 0], [-k, -k], [k, -k], [k, k], [-k, k], [0, -k], [0, k]].every(([dx, dy]) => clearTo(V3(BOARD.x + dx * BW, BOARD.y + dy * BH, BOARD.z))) },
      chest: boxPts(chestBox()),
    };
  },
  /** The point of the page (CSS pixels) that stands for a value on the thermometer: where a finger would put the marker. */
  at: v => { const m = S.R && S.R.pic.th, bx = boxOf(board); return m ? [Math.round(bx[0] + TX / CW * (bx[2] - bx[0])), Math.round(bx[1] + yOf(m, v) / CH * (bx[3] - bx[1]))] : null; },
};

S.hero = await g.hero('rogue-hooded', { x: 0, y: 0, z: 0, outfit: '#7FD3FF' });
el.load.hidden = true; el.load.remove(); el.sz.hidden = false;
if (P.chapter) showStart(); else showMenu();
window.__ready = true;
</script>
