<title>Word Peek</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Word Peek: a daily five-letter word-guessing game with Pip the owl.
   Layout (portrait): HUD (home / mode + try count / stats / settings / mute), the letter grid on a cream card
   with Pip peeking over its top edge (Pip's speech bubble shows the messages), then the on-screen keyboard.
   Short wide screens (landscape phones) put the grid on the left and the keyboard on the right.
   Overlays: home screen (modes), how to play, stats, settings, the result panel and the "set a word for a friend" hand-off.
   Colours: right spot = teal + a tick badge, wrong spot = amber + a dot badge, not in the word = dimmed slate.
   High contrast swaps to orange + blue. Every mark also has a shape, so colour is never the only clue. */
:root{
  --sky1:#fff1c4; --sky2:#ffd98a; --sky3:#ffbf7a;
  --ink:#3a2a1c; --ink2:#6b5440; --card:#fffaf0; --cardEdge:#f1d9a6; --paper:#fffdf7;
  --hit:#0e8f88; --hitInk:#ffffff; --near:#f2a627; --nearInk:#3a2a1c; --miss:#7d8698; --missInk:#ffffff;
  --keyBg:#fff6e2; --keyInk:#3a2a1c; --accent:#e46b2c; --accentDark:#a8460f;
  --font:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --tile:56px; --gap:6px; --keyH:52px;
  color-scheme:light;
}
.hc{ --hit:#d9480f; --hitInk:#ffffff; --near:#1971c2; --nearInk:#ffffff; --miss:#5f6673; --missInk:#ffffff; }
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;font-family:var(--font);color:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  background:
    radial-gradient(3px 3px at 12% 14%,rgba(255,255,255,.9),transparent 70%),
    radial-gradient(2px 2px at 84% 9%,rgba(255,255,255,.85),transparent 70%),
    radial-gradient(3px 3px at 70% 30%,rgba(255,255,255,.6),transparent 70%),
    radial-gradient(2px 2px at 24% 46%,rgba(255,255,255,.55),transparent 70%),
    radial-gradient(circle at 110% 105%,rgba(255,140,90,.45),transparent 45%),
    radial-gradient(circle at -10% 110%,rgba(255,200,90,.5),transparent 45%),
    linear-gradient(175deg,var(--sky1),var(--sky2) 55%,var(--sky3));}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accentDark);outline-offset:2px}

/* ---------- play layout ---------- */
.app{position:relative;height:100%;max-width:560px;margin:0 auto;box-sizing:border-box;display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"hud" "board" "kb";gap:6px;
  padding:8px max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.app.side{max-width:1100px;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"board hud" "board kb";column-gap:14px}
.app.offstage{visibility:hidden}
.hud{grid-area:hud;display:flex;align-items:center;gap:6px;min-width:0}
.icon-btn{width:44px;height:44px;flex:none;border:0;border-radius:50%;background:#fffdf6;font-size:1.25rem;padding:0;display:grid;place-items:center;
  box-shadow:0 3px 0 rgba(120,70,20,.28)}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(120,70,20,.28)}
.pill{flex:1;min-width:0;height:44px;box-sizing:border-box;border-radius:999px;background:rgba(255,253,246,.85);box-shadow:inset 0 0 0 2px rgba(160,100,40,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:0 8px;text-align:center}
.pill b{font-weight:600;font-size:clamp(.82rem,3.8vw,1.02rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pill span{font-size:clamp(.72rem,3.2vw,.86rem);color:var(--ink2);font-weight:500;white-space:nowrap;overflow:hidden;max-width:100%}

.boardWrap{grid-area:board;position:relative;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
.card{position:relative;background:var(--card);border-radius:20px;padding:10px;box-shadow:0 0 0 4px var(--cardEdge),0 10px 24px rgba(140,80,20,.22);
  margin-top:calc(var(--tile) * .82)}
.grid{display:grid;gap:var(--gap)}
.row{display:grid;grid-auto-flow:column;gap:var(--gap)}
.tile{position:relative;width:var(--tile);height:var(--tile);box-sizing:border-box;border-radius:calc(var(--tile) * .22);display:grid;place-items:center;
  font-weight:600;font-size:calc(var(--tile) * .56);text-transform:uppercase;background:var(--paper);border:2px dashed #e7d3ac;color:var(--ink);
  transform-style:preserve-3d;line-height:1}
.tile.filled{border:3px solid #6b5440;animation:pop .14s ease-out}
.tile.hit,.tile.near,.tile.miss{border:0;box-shadow:inset 0 -4px 0 rgba(0,0,0,.16)}
.tile.hit{background:var(--hit);color:var(--hitInk)}
.tile.near{background:var(--near);color:var(--nearInk)}
.tile.miss{background:var(--miss);color:var(--missInk);opacity:.82}
.tile .mk{position:absolute;top:calc(var(--tile) * .05);right:calc(var(--tile) * .05);width:calc(var(--tile) * .26);height:calc(var(--tile) * .26);
  border-radius:50%;display:none;place-items:center;font-size:calc(var(--tile) * .18);line-height:1;font-weight:700}
.tile.hit .mk{display:grid;background:#fff;color:var(--hit)}
.tile.hit .mk::before{content:"✓"}
.tile.near .mk{display:grid;background:transparent}
.tile.near .mk::before{content:"";width:42%;height:42%;border-radius:50%;background:var(--nearInk)}
.tile.flip{animation:flip var(--flipMs,420ms) ease-in-out}
.tile.bounce{animation:bounce .5s ease-out}
.row.shake{animation:shake .4s ease-in-out}
.tile.cursor{border-color:#c79a55;border-style:solid}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}35%{transform:translateY(-34%)}60%{transform:translateY(4%)}80%{transform:translateY(-6%)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}

/* Pip the owl peeks over the card's top edge; the speech bubble shows messages. */
.owl{position:absolute;left:50%;bottom:calc(100% - 6px);width:calc(var(--tile) * 1.62);height:calc(var(--tile) * 1.05);transform:translateX(-50%);
  z-index:3;pointer-events:none;overflow:visible}
.owl svg{width:100%;height:100%;overflow:visible;display:block}
.owl .bodyG{transform-origin:50% 100%;transition:transform .25s ease}
.owl.cheer .bodyG{animation:hop .55s ease-out 3}
.owl.happy .bodyG{transform:translateY(-4px)}
.owl.sad .bodyG{transform:translateY(5px)}
.owl.tilt .bodyG{transform:rotate(-8deg)}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22%)}}
.owl .wingL,.owl .wingR{transition:transform .25s ease}
.owl .wingL{transform-origin:28px 62px}.owl .wingR{transform-origin:92px 62px}
.owl.cheer .wingL{transform:rotate(55deg)}.owl.cheer .wingR{transform:rotate(-55deg)}
.owl .pupil{transition:transform .18s ease}
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);transition:transform .09s linear}
.owl.blink .lid{transform:scaleY(1)}
.owl.sad .lid,.resOwl.sad .lid{transform:scaleY(.45)}
.happyEye{display:none}
.owl.happy .happyEye,.owl.cheer .happyEye,.resOwl.happy .happyEye,.logoOwl .happyEye{display:block}
.owl.happy .eyeOpen,.owl.cheer .eyeOpen,.resOwl.happy .eyeOpen,.logoOwl .eyeOpen{display:none}
.bubble{position:absolute;left:50%;top:18px;transform:translate(-50%,-6px);z-index:4;background:#fff;color:var(--ink);
  border-radius:16px;padding:9px 16px;font-weight:600;font-size:clamp(.95rem,4.2vw,1.1rem);white-space:normal;width:max-content;text-align:center;line-height:1.2;box-shadow:0 4px 0 rgba(120,70,20,.25),0 0 0 3px #ffd88a;
  opacity:0;transition:opacity .2s ease,transform .2s ease;pointer-events:none;max-width:calc(100% - 8px);box-sizing:border-box;text-overflow:ellipsis;overflow:visible}
.bubble::before{content:"";position:absolute;left:50%;top:-9px;margin-left:-9px;border:9px solid transparent;border-top:0;border-bottom-color:#fff}
.bubble.show{opacity:1;transform:translate(-50%,0)}
.grid.secret .row:not(:first-child){display:none}
.secretHelp{margin:0 0 10px;text-align:center;font-weight:600;font-size:1.05rem;line-height:1.3;max-width:calc(var(--tile) * 6.4)}
.secretHelp .sub{display:block;font-weight:500;font-size:.92rem;color:var(--ink2)}

/* ---------- keyboard ---------- */
.kb{grid-area:kb;display:flex;flex-direction:column;gap:6px;width:100%;max-width:540px;margin:0 auto;align-self:end}
.app.side .kb{align-self:center}
/* Keys have no gaps between their tap areas: the visible key is drawn by ::before, inset a little. */
.krow{display:flex;gap:0;justify-content:center}
.key{--kbg:var(--keyBg);flex:1 1 0;min-width:0;max-width:57px;height:var(--keyH);border:0;background:transparent;color:var(--keyInk);font-weight:600;
  font-size:clamp(1rem,4.6vw,1.3rem);text-transform:uppercase;padding:0 0 3px;position:relative;z-index:0}
.key::before{content:"";position:absolute;inset:0 2.5px 3px;border-radius:10px;background:var(--kbg);box-shadow:0 3px 0 rgba(120,70,20,.3);z-index:-1}
.key:active::before,.key.press::before{transform:translateY(2px);box-shadow:0 1px 0 rgba(120,70,20,.3)}
.key.wide{flex:1.55 1 0;max-width:86px;font-size:clamp(.78rem,3.4vw,1rem)}
.key.hit{--kbg:var(--hit);color:var(--hitInk)}
.key.near{--kbg:var(--near);color:var(--nearInk)}
.key.miss{--kbg:var(--miss);color:var(--missInk);opacity:.62}
.key .km{position:absolute;top:3px;right:6px;font-size:.62rem;line-height:1}
.key.hit .km::before{content:"✓"}
.key.near .km::before{content:"●";font-size:.5rem}
.krow.spacer::before,.krow.spacer::after{content:"";flex:.5 1 0;max-width:28px}

/* ---------- overlays ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box;overflow:auto}
.screen.dim{background:rgba(70,40,10,.45)}
.screen.solid{background:inherit;
  background:radial-gradient(circle at 110% 105%,rgba(255,140,90,.45),transparent 45%),radial-gradient(circle at -10% 110%,rgba(255,200,90,.5),transparent 45%),linear-gradient(175deg,var(--sky1),var(--sky2) 55%,var(--sky3))}
.panel{position:relative;background:var(--card);border-radius:22px;box-shadow:0 0 0 4px var(--cardEdge),0 14px 30px rgba(110,60,10,.3);
  width:min(440px,100%);max-height:100%;overflow:auto;box-sizing:border-box;padding:18px 18px 16px;text-align:center;animation:panelIn .25s ease-out}
@keyframes panelIn{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.panel h2{margin:2px 0 8px;font-size:1.55rem;font-weight:700}
.panel p{margin:6px 0;line-height:1.35;font-size:1.02rem}
.close{position:absolute;top:8px;inset-inline-end:8px}
.btn{min-height:50px;border:0;border-radius:16px;padding:10px 16px;font-size:1.08rem;font-weight:600;background:#fff;color:var(--ink);white-space:normal;line-height:1.15;
  box-shadow:0 4px 0 rgba(120,70,20,.3),inset 0 0 0 2px rgba(160,100,40,.18)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,70,20,.3)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accentDark)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1 1 auto}

/* home */
.home{width:min(460px,100%);display:flex;flex-direction:column;align-items:center;gap:10px;padding:4px 0}
.logo{position:relative;display:flex;flex-direction:column;align-items:center;margin-top:4px}
.logoOwl{width:150px;height:96px;margin-bottom:-12px;position:relative;z-index:2}
.logoTiles{display:flex;gap:6px;position:relative;z-index:1}
.logoTiles .tile{--tile:52px;border:0;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.16)}
.logoWord{font-size:2.3rem;font-weight:700;letter-spacing:.5px;margin:2px 0 0;line-height:1;color:var(--ink)}
.tag{margin:0;color:var(--ink2);font-weight:500;font-size:1.05rem;text-align:center}
.tag,.mode .md,.resMsg,.def,.secretHelp{text-wrap:balance}
:lang(ja){word-break:auto-phrase}   /* Japanese: break lines between phrases, not inside words */
.tag .practise{display:block;margin-top:3px;font-size:.92rem;font-weight:600;color:var(--accentDark)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.mode{border:0;border-radius:18px;background:var(--card);box-shadow:0 4px 0 rgba(120,70,20,.3),0 0 0 3px var(--cardEdge);padding:10px 10px 9px;text-align:start;
  display:flex;flex-direction:column;gap:2px;min-height:86px;color:var(--ink)}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,70,20,.3),0 0 0 3px var(--cardEdge)}
.mode .mt{font-size:1.12rem;font-weight:600;display:flex;align-items:center;gap:6px}
.mode .mt i{font-style:normal;font-size:1.45rem}
.mode .md{font-size:.88rem;color:var(--ink2);line-height:1.2}
.mode.daily{grid-column:1 / -1;background:linear-gradient(135deg,#fff8e6,#ffe7b5);min-height:78px}
.mode.daily .md b{color:var(--accentDark)}
.mode.daily{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;align-content:center}
.mode.daily .mt{grid-column:1;grid-row:1}.mode.daily .md{grid-column:1;grid-row:2}
.mode .go{grid-column:2;grid-row:1 / span 2;align-self:center;background:var(--accent);color:#fff;font-weight:600;font-size:1.05rem;border-radius:999px;
  padding:9px 14px;box-shadow:0 3px 0 var(--accentDark);white-space:nowrap}
.mode.friend{grid-column:1 / -1;min-height:62px;flex-direction:row;align-items:center;gap:10px}
.homeBar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.homeBar .btn{min-height:46px;padding:8px 14px;font-size:1rem}
.points{font-weight:600;color:var(--ink2);font-size:1rem}
.corner{position:fixed;top:8px;inset-inline-end:max(8px,env(safe-area-inset-right));display:flex;gap:6px;z-index:2}
@media (max-height:700px) and (orientation:portrait){
  .home{gap:8px}
  .logoOwl{width:124px;height:79px;margin-bottom:-10px}.logoTiles .tile{--tile:46px}.logoWord{font-size:2rem}
  .mode{min-height:74px;padding:8px 10px}.mode.daily{min-height:64px}.mode.friend{min-height:54px}
  .homeBar .btn{min-height:44px}
}

/* help */
.ex{display:flex;gap:5px;justify-content:center;margin:8px 0 2px}
.ex .tile{--tile:42px}
.exNote{font-size:.95rem!important;color:var(--ink2)}
.help{text-align:start}
.help h2{text-align:center}
.help ul{margin:6px 0;padding-inline-start:20px;padding-inline-end:0;line-height:1.4}
@media (max-height:740px){
  .help{padding:14px 14px 12px}.help h2{margin-bottom:10px}.help p{font-size:.95rem;margin:4px 0}
  .ex{margin:4px 0 0}.ex .tile{--tile:36px}.exNote{font-size:.88rem!important;margin:2px 0 4px!important}
  .help ul{font-size:.9rem;line-height:1.3;margin:4px 0}.help .btns{margin-top:6px}
}

/* stats */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 10px}
.tab{min-height:52px;border:0;border-radius:14px;padding:4px 2px;background:#fff;font-weight:600;font-size:.86rem;line-height:1.1;box-shadow:inset 0 0 0 2px rgba(160,100,40,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab i{font-style:normal;font-size:1.2rem}
.tab.on{background:var(--accent);color:#fff;box-shadow:none}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 10px}
.nums div{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.nums b{font-size:1.6rem;font-weight:700}
.nums span{font-size:.78rem;color:var(--ink2)}
.dist{display:flex;flex-direction:column;gap:4px;text-align:start}
.bar{display:flex;align-items:center;gap:6px;font-weight:600}
.bar i{font-style:normal;width:14px;text-align:end}
.bar b{display:block;min-width:26px;padding:3px 7px;border-radius:7px;background:var(--miss);color:#fff;text-align:end;font-size:.9rem;box-sizing:border-box;transition:width .4s ease}
.bar.last b{background:var(--hit)}
.totalPts{margin-top:10px;font-weight:600}

/* settings */
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:2px dashed #efdcb6;text-align:start}
.set:last-of-type{border-bottom:0}
.set div{display:flex;flex-direction:column;line-height:1.2}
.set b{font-size:1.06rem}
.set span{font-size:.86rem;color:var(--ink2)}
.switch{width:64px;height:44px;flex:none;border:0;border-radius:999px;background:#d9cbb2;position:relative;padding:0}
.switch::after{content:"";position:absolute;top:6px;left:6px;width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.2);transition:left .18s ease}
.switch[aria-checked="true"]{background:var(--hit)}
.switch[aria-checked="true"]::after{left:26px}

/* result */
.resPanel{padding-top:12px}
.resOwl{width:104px;height:66px;margin:0 auto 6px;display:block;overflow:visible}
.resTitle{font-size:1.8rem!important;margin:0 0 2px!important}
.resMsg{margin:2px 0!important}
.wordCard{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 0}
.wordCard .big{font-size:1.9rem;font-weight:700;letter-spacing:3px;text-transform:uppercase}
.say{width:48px;height:48px}
.def{font-size:.98rem;color:var(--ink2);margin:2px 6px 6px!important}
.resMid{display:flex;align-items:center;justify-content:center;gap:12px;background:#fff6e0;border-radius:16px;padding:8px 10px;margin:4px 0}
.emojis{font-size:1rem;line-height:1.2;letter-spacing:1px;white-space:pre;flex:none}
.resNums{grid-template-columns:repeat(2,minmax(54px,1fr));margin:0;row-gap:6px}
.resNums b{font-size:1.35rem}
.ptsLine{font-weight:600;color:var(--accentDark);margin:6px 0 0!important}
.countdown{font-weight:600;margin-top:6px}
.countdown b{font-variant-numeric:tabular-nums;font-size:1.2rem;color:var(--accentDark)}
@media (orientation:landscape) and (max-height:560px){
  .resPanel{width:min(780px,100%);display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;align-items:center;text-align:center}
  .resPanel .resB{padding-top:30px}
  .home{width:min(820px,100%);display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);grid-template-areas:"logo modes" "tag modes" "bar modes" "pts modes";
    align-items:center;column-gap:20px;row-gap:6px}
  .logo{grid-area:logo}.tag{grid-area:tag;text-align:center}.modes{grid-area:modes}.homeBar{grid-area:bar}.points{grid-area:pts;text-align:center}
  .mode{min-height:64px}.mode.daily{min-height:60px}.mode.friend{min-height:52px}
  .logoOwl{width:120px;height:76px}.logoTiles .tile{--tile:44px}.logoWord{font-size:2rem}
}

/* friend */
.secretRow{display:flex;gap:6px;justify-content:center;margin:10px 0}
.secretRow .tile{--tile:44px}

@media (prefers-reduced-motion: reduce){
  .tile.filled,.tile.flip,.tile.bounce,.row.shake,.owl.cheer .bodyG,.panel{animation:none}
  .owl .bodyG,.owl .wingL,.owl .wingR,.bubble{transition:none}
}
</style>

<!-- ======================= play screen ======================= -->
<!-- Every player-visible string comes from the I18N table in the script: data-t = text, data-th = text with <b> markup, data-ta = aria-label. -->
<div class="app offstage" id="app">
  <div class="hud">
    <button class="icon-btn" id="homeBtn" data-ta="a_home">🏠</button>
    <div class="pill"><b id="modeName"></b><span id="tryText"></span></div>
    <button class="icon-btn" id="statsBtn" data-ta="a_stats">📊</button>
    <button class="icon-btn" id="setBtn" data-ta="a_settings">⚙️</button>
    <button class="icon-btn" id="muteBtn" data-ta="a_soundOff">🔊</button>
  </div>
  <div class="boardWrap" id="boardWrap">
    <div class="card" id="card">
      <div class="owl" id="owl" aria-hidden="true"></div>
      <div class="bubble" id="bubble" role="status" aria-live="polite"></div>
      <p class="secretHelp" id="secretHelp" hidden><span data-t="secret1"></span><span class="sub" data-t="secret2"></span></p>
      <div class="grid" id="grid" dir="ltr" lang="en" data-ta="a_guesses"></div>
    </div>
  </div>
  <div class="kb" id="kb" dir="ltr" data-ta="a_keyboard"></div>
</div>

<!-- ======================= home ======================= -->
<section class="screen solid" id="homeScreen">
  <div class="home">

const rot13 = s => s.replace(/[a-z]/g, c => String.fromCharCode((c.charCodeAt(0) - 97 + 13) % 26 + 97));
const BLOCKED = new Set(BLOCKED_ROT.split(' ').map(rot13));

function isBlocked(w) { w = String(w).toLowerCase(); return BLOCKED.has(w) || BLOCKED_PARTS.some(p => w.includes(p)); }

// Parse the answer lists ("word|meaning" per line) into sorted arrays + a glossary.
const ANSWER_LIST = {}, GLOSSARY = {}, ALLOWED = {};
for (const L of [4, 5, 6]) {
  ANSWER_LIST[L] = [];
  for (const line of ANSWERS[L].split('\n')) {
    const bar = line.indexOf('|'); if (bar < 1) continue;
    const w = line.slice(0, bar).trim(); if (w.length !== L || isBlocked(w)) continue;
    ANSWER_LIST[L].push(w); GLOSSARY[w] = line.slice(bar + 1).trim();
  }
  ANSWER_LIST[L].sort();

/** Is this a word you may guess? */

  const n = answer.length, marks = new Array(n).fill('miss'), left = {};

  for (let i = 0; i < n; i++) if (marks[i] !== 'hit' && left[guess[i]] > 0) { marks[i] = 'near'; left[guess[i]]--; }
  return marks;

const RANK = { miss: 1, near: 2, hit: 3 };
/** The best mark each letter has earned so far (for the keyboard). */
function keyboardMarks(guesses) {
  const k = {};

  return k;
}
/** Hard-mode messages come from I18N; when this block runs on its own (the Node tests) they fall back to English. */
const tHM = (key, vars, en) => (typeof t === 'function' ? t(key, vars) : en);

  word = word.toLowerCase();
  for (const g of guesses) {
    for (let i = 0; i < g.word.length; i++) if (g.marks[i] === 'hit' && word[i] !== g.word[i]) return tHM('hard_spot', { n: i + 1, l: g.word[i].toUpperCase() }, `Letter ${i + 1} must be ${g.word[i].toUpperCase()}`);
    const need = {};
    g.word.split('').forEach((ch, i) => { if (g.marks[i] !== 'miss') need[ch] = (need[ch] || 0) + 1; });
    for (const ch in need) {
      const have = word.split('').filter(c => c === ch).length;
      if (have < need[ch]) return need[ch] > 1 ? tHM('hard_many', { n: need[ch], l: ch.toUpperCase() }, `Use ${need[ch]} ${ch.toUpperCase()}s`)

/** Seeded random numbers (mulberry32) and a string hash, so the same seed always gives the same word. */

function dayIndex(dateStr) {

// A new cycle moves any word that was used in the last noRepeatDays of the previous cycle away from its start.
const cycleCache = [];

  const list = ANSWER_LIST[5], n = list.length, K = Math.min(CONFIG.noRepeatDays, Math.floor(n / 3));

    for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }

      let j = K;
      for (let i = 0; i < K; i++) if (tail.has(perm[i])) {
        while (tail.has(perm[j])) j++;

  s.points = Math.max(0, Math.floor(+s.points || 0));
  s.stats = s.stats || {};
  for (const m of MODE_IDS) s.stats[m] = Object.assign(blankStats(), s.stats[m] || {});
  s.recent = Object.assign({ practice: [], little: [], big: [] }, s.recent || {});
  s.daily = s.daily && typeof s.daily === 'object' ? s.daily : null;

/* =====================================================================================

function pickAnswer(mode, seed) {

}
/** opts: { mode, answer?, seed?, date?, resume? }. Daily: the date's word; if that day is already finished the result shows again. */

      S.over = !!d.over; S.won = !!d.won;

    else toast(t(mode === 'little' ? 't_find4' : mode === 'big' ? 't_find6' : mode === 'friend' ? 't_friend' : 't_find'), 1500);

/* =====================================================================================

/** Enter: checks the typed word. Returns the marks, or an error message. */

/** Flips the row's tiles one by one, then colours the keyboard. */

  S.busy = true;

  row.style.setProperty('--flipMs', flip + 'ms');
  [...row.children].forEach((t, c) => {
    setTimeout(() => {
      if (!REDUCED) { t.classList.remove('filled', 'cursor'); t.classList.add('flip'); }
      setTimeout(() => {
        setTile(t, g.word[c], g.marks[c]); if (!REDUCED) t.classList.add('flip');
        sfx(g.marks[c] === 'hit' ? 'coin' : 'click');

      over: S.over, won: S.won, hard: S.hard, busy: S.busy, panel: S.panel, date: S.date, friendSetup: S.friendSetup,
      points: save.points, lastPoints: S.lastPoints, stats: JSON.parse(JSON.stringify(save.stats)), dailyStreak: dailyStreakNow(),
      daily: save.daily ? JSON.parse(JSON.stringify(save.daily)) : null, settings: Object.assign({}, save.settings, { muted: isMuted() }) };
  },
  start(opts = {}) { $('homeScreen').hidden = true; startRound(opts); return this.state(); },
  type(word) { String(word).toLowerCase().split('').forEach(ch => typeLetter(ch)); return S.typed; },
  enter() { return submit(); },
  guess(word) { while (S.typed && backspace()) { /* clear the row */ } this.type(word); return submit(); },
  score: (g, a) => scoreGuess(g, a),
  isAllowed: w => isAllowed(w),
  isBlocked: w => isBlocked(w),
  dailyAnswer: d => dailyAnswer(d || todayStr()),
  skipAnimations(on = true) { fast = on !== false; return fast; },
  lists() {
    return { answers: { 4: ANSWER_LIST[4].length, 5: ANSWER_LIST[5].length, 6: ANSWER_LIST[6].length },
      allowed: { 4: ALLOWED[4].size, 5: ALLOWED[5].size, 6: ALLOWED[6].size }, glossary: Object.keys(GLOSSARY).length };
  },
  today(d) { todayOverride = d || null; refreshHome(); return todayStr(); },
  home() { toHome(); return this.state(); },
  panel(name) { if (name) openPanel(name); else closePanel(); return S.panel; },
  settings(o = {}) { if ('contrast' in o) setContrast(o.contrast); if ('hard' in o) setHard(o.hard); if ('muted' in o) setMuted(o.muted); return Object.assign({}, save.settings); },
  hardError: w => hardModeError(w, S.guesses)
};
</script>
