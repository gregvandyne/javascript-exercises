<title>Launch Lab</title>
<!-- Launch Lab: Number Quest Pro Unit 7, The Test Range (grades 6 to 8, ages 11-14). A test range on a red planet at
     sunset, on Oomba3D 1.2.0 in the Space Base theme 1.0.0: a data board shows dot plots, box plots, histograms, the
     drop tower's bins, a table of outcomes, a random sample and scatter plots; a lab tester stands by it, a launcher
     sends a probe out over the range on every run, and a cargo pod is set on the results rack for each finished
     round. Three chapters of six rounds:
       spread (7.1) center and spread: the median and the mean of the landings, which launcher is more consistent,
                    the interquartile range from a box plot, the mean absolute deviation, and a count from a
                    histogram;
       chance (7.2) the drop tower: a probability from equal bins, a prediction from a run's rate, a probability
                    estimated from results, the chance of not, two stages in a table of outcomes, and a model's
                    prediction beside a real run;
       trend  (7.3) two launchers' medians apart, means apart in mean absolute deviations, a random sample and its
                    batch, the pattern of a scatter plot, its outlier, and a prediction from a trend line;
     and the finale, seven rounds, one for each tower's gear:
       clock  (7.4) The Great Clock: a unit rate (the lantern's oil), a signed change (the cold store), an equation
                    (the machine line), a percent error (the survey map), a slope (the zip wire), a span (the ladder to
                    the clock face) and a data read (the missing landing), each a problem of more than one step; the
                    clock on the results deck gains a gear for each round solved, and turns when all seven are in.
     Made for ages 11 to 14: plan first, then run. The player sets a stepper or picks one of three tiles and runs the
     plan; the board shows only the question until then. A wrong plan is run too and shown as it really turns out
     (a median line with more probes on one side, a total that does not match, a rate that is not the run's, a
     point off the trend line) with a spoken hint, and the round stays open. Nothing is bought, sold, bet or won: the
     contexts are probes, launchers, bins and fins. No timer, no lives, no fail state, nothing typed. Read-aloud is on
     by default (BRB.speak, the shared path; the speaker button says a line again): lines are written the way they
     are said. Keys: arrows or + and - move the stepper, Enter runs, 1 to 3 pick a tile. Lesson mode: BRB.params
     { chapter: spread | chance | trend | clock, lock: 1 } opens that chapter only; finishing its six rounds (the
     clock's seven) reports game over, won, once (the course step's completion signal). With no parameters the game offers the four chapters
     from a menu. Saves only which chapters are finished (BRB.storage 'launch-lab-v1'). The import map below is
     exactly kit2ImportMap() (server/services/vendor.js); tests/unit/launch-lab.test.js fails if a library bump leaves
     it behind. English only, like Number Quest's other lesson games. Test handle: window.__ll (also
     window.__brbTest, the name the picture scripts wait for). -->

}
function showMenu() {
  S.screen = 'menu'; S.chapter = ''; S.phase = 'idle'; S.R = null; S.tick++; solo(0);
  if (S.hero) S.hero.play('wave');
  card('menu', { title: fmt('title'), line: 'menu.pick', buttons: LL.CHAPTERS.map(c => ({ id: 'ch-' + c, icon: ICON[c] + (S.done[c] ? '⭐' : ''), label: fmt('ch.' + c), go: () => startChapter(c) })) });
  frame();
}

/* ---------- a chapter: six rounds (the clock: seven) ---------- */
function startChapter(chapter) {
  if (!LL.CHAPTERS.includes(chapter)) return showMenu();
  S.chapter = chapter; S.round = 0; S.screen = 'play'; el.card.hidden = true; el.card.replaceChildren();
  setPods(0);
  if (S.hero) S.hero.play('idle');
  nextRound();
}
function dots2() {
  el.dots.replaceChildren(...Array.from({ length: roundsNow() }, (_, i) => { const d = document.createElement('i'); if (i < S.round - 1) d.className = 'on'; else if (i === S.round - 1) d.className = 'now'; return d; }));
  el.dots.setAttribute('aria-label', fmt('round', { n: S.round, m: roundsNow() })); el.dots.hidden = false; el.row2.hidden = false;
}
function nextRound() {
  if (S.round >= roundsNow()) return finish();
  S.round++; S.R = LL.round(S.chapter, S.round, S.lap); S.phase = 'play'; S.mode = 'ask'; S.draw = null; S.shown = false; S.tick++;
  const Rd = S.R; S.value = Rd.input === 'step' ? Rd.step.start : null;
  hint(); dots2(); chip(Rd.chip);
  say(Rd.ask);   // the words first: the camera fits the range under them
  redraw(); frame();
}
function finish() {
  S.screen = 'end'; S.phase = 'idle'; S.done[S.chapter] = true; store(); S.tick++;
  // The course step's completion signal: once for each chapter finished, never before its sixth round is right.
  S.reported++;
  try { if (window.BRB && BRB.gameOver) BRB.gameOver({ won: true }); } catch (e) { /* no page */ }
  S.R = null; solo(roundsNow());
  g.celebrate(S.hero, '');   // the cheer; the words are on the card
  const buttons = [{ id: 'again', icon: '🔁', label: fmt('btn.again'), cls: 'go', go: () => { S.lap++; startChapter(S.chapter); } }];
  if (!S.lock) buttons.push({ id: 'menu', icon: '🚀', label: fmt('btn.menu'), go: showMenu });
  const clock = S.chapter === 'clock';
  card('end', { title: fmt(clock ? 'win.clock.title' : 'win'), sub: fmt('ch.' + S.chapter), line: clock ? 'win.clock' : 'win.card', buttons });
  frame();
}

/** What the stepper shows for the plan: the number and its unit. */
function valueText(Rd, v) { return LL.sg(v) + (Rd.unit ? (/^[°%]$/.test(Rd.unit) ? '' : ' ') + Rd.unit : ''); }
/** The controls of a round: three tiles, or a stepper and a run button. */
function controls(Rd, found) {
  if (Rd.input === 'tiles') return Rd.opts.map((o, i) => button({ id: 'll-n' + i, big: o.t, aria: o.t, cls: (o.t.length > 4 ? 'long' : '') + (found && i === Rd.answer ? ' right' : ''), go: b => answer(i, b) }));
  const go = button({ id: 'll-go', icon: '▶', label: fmt('btn.run'), cls: 'go', go: b => run(b) });
  const stepBtn = (id, sign, key, dir) => {
    const b = button({ id, big: sign, aria: fmt(key), cls: 'step', go: () => { if (held) { held = false; return; } bump(dir); } });
    b.addEventListener('pointerdown', () => { held = false; hold = { dir, t: 0.5 }; });
    for (const name of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(name, () => { hold = null; });
    return b;
  };
  const val = document.createElement('output'); val.id = 'll-val'; val.className = 'll-val'; val.setAttribute('aria-live', 'polite'); val.textContent = valueText(Rd, S.value);
  return [stepBtn('ll-dn', '−', 'btn.down', -1), val, stepBtn('ll-up', '+', 'btn.up', 1), go];
}
/** Draw the round from its state (also after the screen turns): the board, the helper, the pods, the controls. */
function redraw() {
  if (S.screen === 'start' || S.screen === 'menu' || S.screen === 'end') { solo(S.screen === 'end' ? roundsNow() : 0); return void frame(); }
  if (S.screen !== 'play' || !S.R) return void frame();
  const focus = el.bar.contains(document.activeElement) ? document.activeElement.id : '';
  const Rd = S.R, found = S.phase === 'right', first = !S.shown && !found;
  clearStage(); S.tick++; hold = null;
  el.card.hidden = true;
  putBoard(Rd, found ? 'found' : S.mode, first); setPods(S.round - 1 + (found ? 1 : 0));
  placeHero(); view.pts = stagePts();
  el.bar.hidden = false; el.bar.className = 'll-bar ' + Rd.input;
  el.bar.replaceChildren(...controls(Rd, found));
  if (focus) { const b = document.getElementById(focus) || el.bar.querySelector('button'); if (b) b.focus(); }   // a keyboard player stays on the controls
  S.shown = true;
  if (found) pauseForSpeech(1.6, guard(nextRound));   // the screen turned while the answer was showing: the round ends here
}
/** A step that only runs if the round it belongs to is still the one on screen. */
const guard = fn => { const tick = S.tick; return (...a) => { if (tick === S.tick) fn(...a); }; };
const still = () => { drop(board); board.position.copy(BOARD); board.scale.set(BW, BH, 1); board.visible = true; };

/** A new plan (a number on the stepper): the board goes back to the question, and the number stays on the stepper
 *  until it is run, so the board never shows a result the plan has not earned. */
function setPlan(v) {
  const Rd = S.R; if (!Rd || S.screen !== 'play' || S.phase !== 'play' || Rd.input !== 'step' || typeof v !== 'number') return;
  v = Math.max(Rd.step.min, Math.min(Rd.step.max, Math.round(Math.round(v / Rd.step.by) * Rd.step.by * 100) / 100));
  S.value = v; S.draw = null; hint();
  const out = document.getElementById('ll-val'); if (out) out.textContent = valueText(Rd, v);
  still(); paint(Rd, 'ask');
}
function bump(dir) { const Rd = S.R; if (Rd && Rd.input === 'step' && S.phase === 'play') setPlan(S.value + dir * Rd.step.by); }
/** Run the plan. */
function run(b) { const Rd = S.R; if (Rd && Rd.input === 'step') settle(LL.judge(Rd, S.value), b || document.getElementById('ll-go')); }
/** Pick a tile. */
function answer(i, b) { const Rd = S.R; if (Rd && Rd.input === 'tiles') settle(LL.judge(Rd, i), b || document.getElementById('ll-n' + i)); }
function settle(res, b) {
  if (S.phase !== 'play' || !S.R || S.screen !== 'play' || !res) return;
  const Rd = S.R; hold = null;
  launch();
  if (!res.ok) {
    // a wrong plan: the board shows what it really gives, the hint says why, and the round stays open
    wobble(b); S.draw = res.draw || null; hint(res.lines);
    paint(Rd, 'hint'); still(); shake(board);
    return;
  }
  S.phase = 'right'; S.tick++; S.draw = null; hint(); sfx('coin');
  if (b) b.classList.add('right');
  chip(Rd.chipDone, 'ok');
  say(Rd.said, { queue: true });
  paint(Rd, 'found'); still(); pop(board, { from: 0.9 });
  // the round's pod is set down on the rack, the helper cheers, and only then the next round
  setDown(guard(() => { sfx('coin'); heroMove('cheer', 1700); pauseForSpeech(reduced ? 3.6 : 2.4, guard(nextRound)); }));
}
// Keys: the arrows (or + and −) move the stepper and Enter runs the plan; 1 to 3 pick a tile. Every control is also a
// button, so Tab, Enter and Space work too.
addEventListener('keydown', ev => {
  const Rd = S.R; if (!Rd || S.screen !== 'play' || S.phase !== 'play' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key, onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
  if (Rd.input === 'tiles') { if (/^[1-3]$/.test(k) && +k <= Rd.opts.length) { answer(+k - 1); ev.preventDefault(); } return; }
  if (k === 'Enter' && !onButton) { run(); ev.preventDefault(); }
  else if (k === 'ArrowUp' || k === 'ArrowRight' || k === '+' || k === '=') { bump(1); ev.preventDefault(); }
  else if (k === 'ArrowDown' || k === 'ArrowLeft' || k === '-' || k === '_') { bump(-1); ev.preventDefault(); }
});

/* ---------- the test handle: what the round asks and what is on screen (tests, covers, slide pictures) ---------- */
const shownIn = o => { for (let q = o; q; q = q.parent) if (!q.visible) return false; return true; };
const caster = new THREE.Raycaster();
/** Whether nothing of the base stands between the camera and a point (the scenery never hides the board). */
function clearTo(p) {
  const from = g.camera.position, dir = p.clone().sub(from), dist = dir.length();
  caster.set(from, dir.normalize()); caster.near = 0.1; caster.far = dist - 0.12;
  return !caster.intersectObjects([room, props, posts], true).some(hit => shownIn(hit.object));
}
const boxPts = pts => { const p = pts.map(scr); return [Math.min(...p.map(q => q[0])), Math.min(...p.map(q => q[1])), Math.max(...p.map(q => q[0])), Math.max(...p.map(q => q[1]))].map(n => Math.round(n)); };
window.__ll = window.__brbTest = {
  state: () => ({ game: 'launch-lab', screen: S.screen, chapter: S.chapter, lock: S.lock, round: S.round, rounds: S.chapter ? roundsNow() : LL.ROUNDS, phase: S.phase, hero: S.hero ? S.hero.id : null, reported: S.reported, tall, deck: rack.children.length,
    ...(S.R && S.screen === 'play' ? { ...S.R, mode: S.mode, value: S.value, tried: S.draw, moving: tweens.length, onStage: { board: stage.children.includes(board) && board.visible, pods: rack.children.length } } : {}) }),
  /** Fast: nothing waits and nothing moves. Turning it on also finishes whatever is moving now. */
  fast: on => { S.fast = on !== false; for (let n = 0; S.fast && tweens.length && n < 50; n++) { const w = tweens.shift(); w.o.visible = true; w.step(1); if (w.then) w.then(); } },
  /** 'set' a plan, 'run' it, 'answer' a tile, or 'solve' the round the right way. */
  act: (name, arg) => {
    const Rd = S.R; if (!Rd) return;
    if (name === 'set') setPlan(arg); else if (name === 'run') run(); else if (name === 'answer') answer(arg);
    else if (name === 'solve') { if (Rd.input === 'tiles') answer(Rd.answer); else { setPlan(Rd.answer); run(); } }
  },
  /** Where things are on the screen (CSS pixels): the helper, the board (its box, whether the base leaves it in full
   *  view, and the smallest words on it in screen pixels) and the rack. */
  spot: () => {
    const bx = boxOf(board), k = 0.46;
    return {
      hero: S.hero ? boxPts(heroBox(S.hero.position, S.hero.object.scale.x)) : null,
      board: { box: bx, small: Math.round(S.small * (bx[2] - bx[0]) / CW * 10) / 10,
        clear: [[0, 0], [-k, -k], [k, -k], [k, k], [-k, k], [0, -k], [0, k]].every(([dx, dy]) => clearTo(V3(BOARD.x + dx * BW, BOARD.y + dy * BH, BOARD.z))) },
      chest: boxPts(chestBox()),
    };
  },
};

S.hero = await g.hero('rogue', { x: 0, y: 0, z: 0, outfit: '#3A6EA5' });
el.load.hidden = true; el.load.remove(); el.ll.hidden = false;
if (P.chapter) showStart(); else showMenu();
window.__ready = true;
</script>
