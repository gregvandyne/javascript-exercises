<!-- Shape Hunt: Number Quest Launchpad Unit 6, The Shape Shed (grades K-2, ages 5-8). A tidy-up treasure hunt in a
     cosy house, on Oomba3D 1.1.0 in the Cosy Home theme: shapes hide among the furniture, and the helper finds them,
     builds with them and shares them. Three chapters of six rounds, one per course step:
       find  (6.1) tap the shape that is named (a triangle, a turned square, a cone), then the shape with an
                   attribute (3 sides, no corners), then the one that is NOT a triangle (an open or curved
                   look-alike). Colour, size and turn are never the clue;
       build (6.2) a ghost outline on the board (a square, a rectangle, a house, a hexagon) or a ghost tower on the
                   table: pick the pieces that make it, and they fly in and snap together;
       share (6.3) pizzas, pies, rugs, cakes and blankets shared in equal shares: are the shares equal, which one
                   shows halves or fourths, what one share is called, how many make the whole, and which piece is
                   bigger, a half or a fourth.
     Made for a child who is only starting to read: every instruction is short, shown and spoken (BRB.speak, the
     shared path; the speaker button says it again), and everything is done with big taps. Flat shapes are always
     shown face on, as cards, so the room's perspective never turns one shape into another. No timer, no lives, no
     fail state: a wrong tap wobbles and gets a spoken hint that names the attribute, then another try. Lesson mode:
     BRB.params { chapter: find | build | share, lock: 1 } opens that chapter only; finishing its six rounds reports
     game over, won, once (the course step's completion signal). With no parameters the game offers the three
     chapters from a picture menu. Saves only which chapters are finished (BRB.storage 'shape-hunt-v1'). The import
     map below is exactly kit2ImportMap() (server/services/vendor.js); tests/unit/shape-hunt.test.js fails if a
     library bump leaves it behind. English only, like Number Quest's other lesson games. Test handle: window.__sh
     (also window.__brbTest, the name the picture scripts wait for). -->

const inRoom = Rd => Rd.chapter === 'find' || Rd.kind === 'pick';
function nextRound() {
  if (S.round >= SH.ROUNDS) return finish();
  S.round++; S.R = SH.round(S.chapter, S.round, S.lap); S.phase = 'play'; S.shown = false; S.trial = null; S.tick++;
  const Rd = S.R;
  hint(); dots(); chip(Rd.show);
  say(Rd.ask[0], Rd.ask[1]);   // the words first: the camera fits the room under them
  redraw(); frame();
}
function finish() {
  S.screen = 'end'; S.phase = 'idle'; S.done[S.chapter] = true; store(); S.tick++;
  // The course step's completion signal: once for each chapter finished, never before its sixth round is right.
  S.reported++;
  try { if (window.BRB && BRB.gameOver) BRB.gameOver({ won: true }); } catch (e) { /* no page */ }
  solo();
  g.celebrate(S.hero, '');   // the cheer and the confetti; the words are on the card
  const buttons = [{ id: 'again', icon: '🔁', label: fmt('btn.again'), cls: 'go', go: () => { S.lap++; startChapter(S.chapter); } }];
  if (!S.lock) buttons.push({ id: 'menu', icon: '🏠', label: fmt('btn.menu'), go: showMenu });
  card('end', { title: fmt('win'), line: 'win.card', buttons, star: true });
  frame();
}

/** Draw the round from its state (also after the screen turns): the room's things, the helper, the buttons. */
function redraw() {
  if (S.screen === 'hero') return void showHeroes();
  if (S.screen === 'menu' || S.screen === 'end') { solo(); return void frame(); }
  if (S.screen !== 'play' || !S.R) return void frame();
  const focus = (el.bar.contains(document.activeElement) || el.spots.contains(document.activeElement)) ? document.activeElement.id : '';
  const Rd = S.R, found = S.phase === 'right', first = !S.shown && !found;
  clearStage(); S.tick++; S.trial = null; if (S.phase === 'try') S.phase = 'play';
  el.card.hidden = true; el.bar.classList.remove('wait');
  if (Rd.chapter === 'find') drawFind(Rd, first); else if (Rd.chapter === 'build') drawBuild(Rd, found); else drawShare(Rd, first, found);
  placeHero(); view.pts = stagePts();
  const id = v => 'sh-' + (typeof v === 'number' ? 'n' + v : v), cls = v => (found && v === Rd.answer ? 'go' : '');
  el.bar.hidden = inRoom(Rd);
  el.bar.className = 'sh-bar' + (Rd.choices.length === 2 ? ' two' : '');
  if (Rd.chapter === 'build') el.bar.replaceChildren(...Rd.choices.map(v => button({ id: id(v), pic: setIcon(Rd.sets[v]), cls: cls(v), aria: Rd.sets[v].map(k => fmt('show.piece.' + k)).join(', '), go: b => answer(v, b) })));
  else if (Rd.kind === 'equal') el.bar.replaceChildren(...Rd.choices.map(v => button({ id: id(v), icon: v === 'yes' ? '✔️' : '✖️', label: fmt('btn.' + v), cls: cls(v), go: b => answer(v, b) })));
  else if (Rd.kind === 'whole') el.bar.replaceChildren(...Rd.choices.map(v => button({ id: id(v), big: v, aria: fmt('btn.num', { n: v }), cls: cls(v), go: b => answer(v, b) })));
  else if (Rd.kind === 'name' || Rd.kind === 'bigger') el.bar.replaceChildren(...Rd.choices.map(v => button({ id: id(v), big: { half: '½', third: '⅓', fourth: '¼', quarter: '¼' }[v], label: fmt('btn.' + v), cls: cls(v), go: b => answer(v, b) })));
  else el.bar.replaceChildren();
  if (found && inRoom(Rd)) markFound(Rd);
  if (focus) { const b = document.getElementById(focus) || el.bar.querySelector('button') || el.spots.querySelector('button'); if (b) b.focus(); }   // a keyboard player stays on the buttons
  S.shown = true;
  if (found) pause(1.6, guard(nextRound));   // the screen turned while the answer was showing: the round ends here
}
/** A step that only runs if the round it belongs to is still the one on screen. */
const guard = fn => { const tick = S.tick; return (...a) => { if (tick === S.tick) fn(...a); }; };
/** The thing that was found gets a green tick (and its clear button a green ring). */
function markFound(Rd) {
  const c = cands.find(q => q.v === Rd.answer); if (!c) return;
  c.btn.classList.add('go');
  const t = sprite(tickTex(), 0.46, 0.46, 4); t.position.set(c.at.x + c.w * 0.42, c.at.y + c.h * 0.42, c.at.z + 0.06); stage.add(t); pop(t);
}

/** The child picks: a thing in the room, a set of pieces, a word or a number. */
function answer(v, b) {
  if (S.phase !== 'play' || !S.R || S.screen !== 'play') return;
  const Rd = S.R;
  if (!Rd.choices.includes(v)) return;
  b = b || document.getElementById('sh-' + (typeof v === 'number' ? 'n' + v : v));
  const c = cands.find(q => q.v === v);
  if (v !== Rd.answer) {
    wobble(b); hint(Rd.hints[v]);
    if (c) shake(c.o);
    if (Rd.chapter !== 'build' || reduced || S.fast) return;
    // the pieces are tried on the outline: they fly in, do not fit, and go again
    S.phase = 'try'; S.tick++; S.trial = v; el.bar.classList.add('wait');
    const away = guard(list => {
      let left = list.length;
      const end = guard(() => { S.trial = null; S.phase = 'play'; el.bar.classList.remove('wait'); });
      list.forEach(({ o }, i) => fly(o, V3(o.position.x + (i - (list.length - 1) / 2) * 0.7, o.position.y - 2.6, o.position.z + 1.8), { dur: 0.45, arc: 0.3, wait: 0.9, then: () => { stage.remove(o); if (--left === 0) end(); } }));
    });
    return void putPieces(Rd, Rd.sets[v], false, 'in', list => { list.forEach(({ o }) => shake(o)); pause(0.55, guard(() => away(list))); });
  }
  S.phase = 'right'; S.tick++; hint(); sfx('coin');
  if (b) b.classList.add('go');
  chip(Rd.shown, Rd.answer === 'no' ? 'bad' : 'ok');
  say(Rd.said[0][0], Rd.said[0][1], { queue: true });
  for (const [key, vars] of Rd.said.slice(1)) speak(key, vars, { queue: true });
  const done = guard(() => { sfx('cheer'); heroMove('cheer', 1700); pause(reduced ? 3.4 : 2.1, guard(nextRound)); });
  if (Rd.chapter === 'build') return void putPieces(Rd, Rd.recipe, true, 'in', () => { for (const o of stage.children) if (o.userData.ghost) o.visible = false; done(); });
  if (inRoom(Rd)) markFound(Rd);
  else if (Rd.kind === 'whole') { const s = stage.children.find(o => o.userData.share); if (s) { s.material.map = shareCard(Rd.cards[0], true); pop(s); } }   // the shares come back together: one whole
  done();
}

/* ---------- the test handle: what the round asks and what is on screen (tests, covers, slide pictures) ---------- */
/** The screen box (left, top, right, bottom in CSS pixels) of a picture or a solid in the room. */
function boxOf(o) {
  const cam = g.camera, right = V3(1, 0, 0).applyQuaternion(cam.quaternion), up = V3(0, 1, 0).applyQuaternion(cam.quaternion), [w, h] = o.userData.size;
  const mid = o.getWorldPosition(V3(0, 0, 0)); if (!o.isSprite) mid.y += o.userData.lift;
  const [sx, sy] = scr(mid), [rx] = scr(mid.clone().addScaledVector(right, w / 2)), [, uy] = scr(mid.clone().addScaledVector(up, h / 2));
  return [sx - (rx - sx), uy, rx, sy + (sy - uy)].map(n => Math.round(n));
}
const shown = o => { for (let q = o; q; q = q.parent) if (!q.visible) return false; return true; };
const ray = new THREE.Raycaster();
/** Whether nothing of the room stands between the camera and a point (the furniture never hides a shape). */
function clearTo(p) {
  const from = g.camera.position, dir = p.clone().sub(from), dist = dir.length();
  ray.set(from, dir.normalize()); ray.near = 0.1; ray.far = dist - 0.12;
  return !ray.intersectObjects([room, props], true).some(hit => shown(hit.object));
}
window.__sh = window.__brbTest = {
  state: () => ({ game: 'shape-hunt', screen: S.screen, chapter: S.chapter, lock: S.lock, round: S.round, rounds: SH.ROUNDS, phase: S.phase, hero: S.hero ? S.hero.id : null, reported: S.reported, tall,
    ...(S.R && S.screen === 'play' ? { ...S.R, trial: S.trial, snapped: S.snapped, moving: tweens.length,
      onStage: { cards: stage.children.filter(o => o.isSprite && !o.userData.board && !o.userData.piece && o.userData.size[0] > 0.6).length, solids: stage.children.filter(o => o.userData.solid && !o.userData.ghost && !o.userData.piece).length,
        ghosts: stage.children.filter(o => o.userData.ghost && o.visible).length, board: !!S.board, pieces: stage.children.filter(o => o.userData.piece).map(o => o.userData.piece) } } : {}) }),
  fast: on => { S.fast = on !== false; },
  hero: id => chooseHero(id || HEROES[0]),
  act: (name, arg) => answer(arg),
  /** Where things are on the screen (CSS pixels): the box round the helper (as wide as the Wizard's hat), each thing
   *  to tap (its clear button, the box of the thing itself, and whether the room's furniture leaves it in full view),
   *  and every other picture a round shows (the board, its pieces, the share cards). */
  spot: () => ({
    hero: S.hero ? (() => { const p = heroBox(S.hero.position, S.hero.object.scale.x).map(scr); return [Math.min(...p.map(q => q[0])), Math.min(...p.map(q => q[1])), Math.max(...p.map(q => q[0])), Math.max(...p.map(q => q[1]))].map(n => Math.round(n)); })() : null,
    cands: cands.map(c => { const r = c.btn.getBoundingClientRect(), k = 0.4; return { v: c.v, btn: [r.left, r.top, r.right, r.bottom].map(n => Math.round(n)), box: boxOf(c.o),
      clear: [[0, 0], [-k, -k], [k, -k], [k, k], [-k, k]].every(([dx, dy]) => clearTo(V3(c.at.x + dx * c.w, c.at.y + dy * c.h, c.at.z))) }; }),
    things: stage.children.filter(o => o.visible && o.userData.size && !o.userData.ghost && !cands.some(c => c.o === o)).map(o => ({ box: boxOf(o), clear: clearTo(o.getWorldPosition(V3(0, 0, 0)).add(V3(0, o.isSprite ? 0 : o.userData.lift, 0))) })),
  }),
};

el.load.hidden = true; el.load.remove(); el.sh.hidden = false;
await showHeroes();
window.__ready = true;
</script>
