<title>Atlas Quest (Live)</title>
<style>

  html, body { margin: 0; height: 100%; overflow: hidden; font-family: var(--ok-font, system-ui, sans-serif); color: var(--ink); background: var(--sea); touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

  .al-board, .al-end { touch-action: pan-y; }
  [hidden] { display: none !important; }

  .al-top .sp { flex: 1; }
  .al-pill { background: var(--card); border: 3px solid var(--ink); border-radius: 999px; padding: 3px 12px; box-shadow: 0 3px 0 var(--ink); font-weight: 800; font-size: clamp(13px, min(2.6vw, 2.6vh), 22px); white-space: nowrap; }
  .al-ring { width: clamp(40px, 7vh, 60px); height: clamp(40px, 7vh, 60px); position: relative; flex: none; }
  .al-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .al-ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(14px, 2.6vh, 22px); }
  .al-q { flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 12px; background: var(--card); border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 5px 0 var(--ink); padding: clamp(6px, 1.2vh, 12px) 16px; max-width: 1100px; width: 100%; margin: 0 auto; box-sizing: border-box; }
  .al-q img { height: clamp(40px, 9vh, 110px); width: auto; border-radius: 6px; border: 2px solid var(--ink); flex: none; }
  .host .al-q img.big { height: clamp(90px, 24vh, 300px); border-width: 4px; border-radius: 10px; }
  .al-pickbar { display: flex; align-items: center; gap: 8px; background: var(--card); border: 3px solid var(--ink); border-radius: 18px; padding: 4px 14px 4px 8px; box-shadow: 0 3px 0 var(--ink); font-weight: 900; font-size: clamp(14px, 2.2vh, 20px); max-width: 100%; min-width: 0; }
  .al-pickbar img { height: 30px; width: auto; border-radius: 4px; border: 2px solid var(--ink); flex: none; }
  .al-pickbar span { min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
  .al-q p { margin: 0; font-weight: 900; font-size: clamp(17px, min(4.2vw, 4.4vh), 44px); text-align: center; overflow-wrap: anywhere; line-height: 1.15; }

  .al-zoom button { width: 44px; height: 44px; border-radius: 12px; border: 3px solid var(--ink); background: var(--card); color: var(--ink); font: inherit; font-weight: 900; font-size: 20px; box-shadow: 0 3px 0 var(--ink); cursor: pointer; padding: 0; }

  .al-board h2 { margin: 0 0 6px; font-size: clamp(16px, 2.4vh, 24px); text-align: center; }
  .al-board ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .al-board li { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: clamp(14px, 2.2vh, 21px); background: rgba(0,0,0,.05); border-radius: 12px; padding: 4px 10px; }

  .al-note { margin: 0; font-weight: 800; font-size: clamp(15px, 2.4vh, 24px); text-align: center; overflow-wrap: anywhere; }
  .al-btn { min-height: 52px; min-width: 52px; border: 3px solid var(--ink); border-radius: 999px; background: var(--go); color: #1d2340; font: inherit; font-weight: 900; font-size: clamp(17px, 2.6vh, 22px); padding: 8px 26px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; }

  .al-end { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .al-end h2 { margin: 0; font-size: clamp(22px, 4vh, 42px); text-align: center; }
  .al-end ol { list-style: none; margin: 0; padding: 0; width: min(560px, 100%); display: flex; flex-direction: column; gap: 8px; }

  .al-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    if (L.active && L.teamsOn) L.teams().filter(function (x) { return x.rank; }).slice(0, 3).forEach(function (x) { var li = document.createElement('li'); li.innerHTML = '<span class="rk"></span><span class="nm"></span><span class="sc"></span>'; li.children[0].textContent = x.icon || '★'; li.children[1].textContent = x.name; li.children[2].textContent = O.num(x.score); li.style.background = x.color; li.style.color = x.ink; ol.appendChild(li); });
    $('again').hidden = L.active; $('again').textContent = t('again');
    sfx('win');
  }
  $('again').addEventListener('click', function () { startPractice(); });

  // ---- the session ----------------------------------------------------------------------------------------------------
  L.on('phase', function (e) {
    phase = e.phase;
    if (phase === 'lobby') { banner(host ? t('title') : t('wait')); }
    if (phase === 'loading' || phase === 'countdown') banner(t('ready'));
    if (phase === 'paused') clearInterval(ringTimer);
  });
  // 3, 2, 1, Go! (the Go! goes away by itself, and never covers a question that is already open)
  L.on('countdown', function (e) { var tick = function () { var left = Math.ceil((e.at - L.now()) / 1000); if (left > 0) { banner(String(left)); setTimeout(tick, 250); } else { if (!Q || phase !== 'playing') banner(t('go')); setTimeout(function () { if ($('banner').textContent === t('go')) banner(''); }, 900); } }; tick(); });
  L.on('question', function (q) { show(q); });
  // the flag or the region came after the question: show them (keeps the player's pick)
  L.on('state', function () { if (!Q || state.answer >= 0) return; var a = atl(Q.i); if (a && ((host && flagOf(Q.i) && $('flag').hidden) || a.reg !== state.region)) show(Q, a); });
  L.on('answers', function (a) { if (host && Q && a.i === Q.i) $('count').textContent = t('answered', { n: a.n, total: Math.max(a.n, connected()) }); });
  L.on('reveal', function (r) { if (r.skipped) { clearInterval(ringTimer); return; } reveal(r); });
  L.on('result', result);
  L.on('end', function (e) { theEnd(e.top || []); });
  L.on('welcome', function () { if (L.quiz.current) show(L.quiz.current); });

  // ---- alone: 5 famous countries, scored like the class game ---------------------------------------------------------
  var practice = { list: [], i: 0, timer: 0, score: 0, at: 0 };
  function startPractice() {
    var pool = []; C.forEach(function (c, i) { if (c[6]) pool.push(i); });
    for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = pool[i]; pool[i] = pool[j]; pool[j] = x; }
    practice.list = pool.slice(0, 5); practice.i = 0; practice.score = 0; myScore = 0; history = [];
    $('score').hidden = false; $('score').textContent = t('score', { n: 0 });
    banner(t('practice')); setTimeout(practiceNext, 1200);
  }
  function practiceNext() {
    if (practice.i >= practice.list.length) return theEnd([{ name: t('picked'), score: practice.score }]);
    var a = practice.list[practice.i];
    practice.at = performance.now();
    show({ i: practice.i, n: practice.list.length, q: t('find', { name: name(C[a][0]) }), choices: CODES, secs: 20, at: practice.at }, { k: 'find', reg: 'world' });
    clearTimeout(practice.timer); practice.timer = setTimeout(function () { practiceReveal(-1); }, 20000);
  }
  function practiceAnswer(i) { clearTimeout(practice.timer); var el = performance.now() - practice.at; setTimeout(function () { practiceReveal(i, el); }, 400); }
  function practiceReveal(i, el) {
    var a = practice.list[practice.i], ok = i === a, pts = ok ? Math.round(500 + 500 * (1 - Math.min(1, (el || 0) / 20000))) : closePoints(i, a);
    practice.score += pts;
    var counts = CODES.map(function () { return 0; }); if (i >= 0) counts[i] = 1;
    reveal({ i: practice.i, answer: a, counts: counts });
    if (i >= 0) result({ ok: ok, points: pts, score: practice.score }); else $('note').textContent = t('timeUp');
    practice.i++; practice.timer = setTimeout(practiceNext, 3200);
  }

  window.addEventListener('resize', function () { size(); if (Q && state.answer < 0) fit(REGION_BOX[state.region] || REGION_BOX.world); });
  size(); fit(REGION_BOX.world); requestAnimationFrame(loop);
  var titled = function () { return t('title') + (L.active ? ' (' + t('live') + ')' : ''); };
  $('title').textContent = titled();
  document.title = t('title');
  L.ready({ quiz: true, hostView: true, words: [] });
  loadNames(function () { $('title').textContent = titled(); });
  document.body.classList.toggle('host', host);
  if (!L.active) { $('zoom').hidden = false; L.on('start', function () { loadNames(startPractice); }); }
  else { $('zoom').hidden = host; if (phase === 'lobby') banner(host ? t('title') : t('wait')); }
  O.test({
    state: function () { return { role: L.role, phase: phase, question: Q ? { i: Q.i, q: Q.q } : null, pick: state.pick, picked: state.pick >= 0 ? CODES[state.pick] : null, locked: state.locked, answer: state.answer >= 0 ? CODES[state.answer] : null, region: state.region, score: myScore, board: !$('board').hidden, end: !$('end').hidden, view: { cx: view.cx, cy: view.cy, k: view.k },
      // alone only (no class): the practice question's country, for tests and the cover picture
      practiceAnswer: !L.active && Q && practice.list[practice.i] != null ? CODES[practice.list[practice.i]] : null }; },
    start: function () { return true; },
  });
  /** tests: pick a country by code (as a tap would) and lock it in */
  window.__brbTest.pick = function (cc) { if (IDX[cc] == null || !Q || state.locked || state.answer >= 0) return false; state.pick = IDX[cc]; dirty = true; $('lock').disabled = false; return true; };
  window.__brbTest.lock = lockIn;
  /** tests and the layout audit: answer with the k-th country of the list */
  window.__brbTest.answer = function (k) { if (window.__brbTest.pick(CODES[k | 0])) lockIn(); };
  window.__brbTest.tapAt = function (lat, lng) { var s = toScreen(lng, lat); tapAt(s[0], s[1]); return state.pick >= 0 ? CODES[state.pick] : null; };
  /** tests: where (lat, lng) is on the page (client px); the country a point is inside (the hit-test's own shapes) */
  window.__brbTest.clientOf = function (lat, lng) { var s = toScreen(lng, lat), r = cv.getBoundingClientRect(); return { x: r.left + s[0] * r.width / W0, y: r.top + s[1] * r.height / H0 }; };
  window.__brbTest.inside = function (lat, lng) { var i = countryAt(lat, lng); return i >= 0 ? CODES[i] : null; };
  /** tests: n random points well inside drawn shapes, in view, clear of tiny countries' dots and of borders by 3 px */
  window.__brbTest.samples = function (n, seed) {
    var out = [], x = seed || 7, rnd = function () { x = (x * 16807) % 2147483647; return x / 2147483647; }, tries = 0;
    while (out.length < n && tries++ < n * 600) {
      var c = C[Math.floor(rnd() * C.length)], sh = SH[c[0]]; if (!sh || TINY[c[0]]) continue;
      var b = sh.box, lng = b[0] + rnd() * (b[2] - b[0]), lat = b[1] + rnd() * (b[3] - b[1]);
      if (countryAt(lat, lng) !== IDX[c[0]]) continue;
      var sc = toScreen(lng, lat); if (sc[0] < 6 || sc[1] < 6 || sc[0] > W0 - 64 || sc[1] > H0 - 6) continue;
      if (C.some(function (d) { if (!TINY[d[0]]) return false; var p = toScreen(d[3], d[2]); return Math.hypot(p[0] - sc[0], p[1] - sc[1]) < dotR() + 9; })) continue;
      var ok = [[3, 0], [-3, 0], [0, 3], [0, -3]].every(function (o) { var mm = toMap(sc[0] + o[0], sc[1] + o[1]); return countryAt(mm[1], mm[0]) === IDX[c[0]]; });
      if (ok) out.push({ cc: c[0], lat: lat, lng: lng });
    }
    return out;
  };
  window.__brbTest.practice = function () { startPractice(); };
  /** tests: a country's own point (its dot, or its label place) on the page, and a sea point px off its east coast */
  window.__brbTest.centreOf = function (cc) { var c = C[IDX[cc]]; return window.__brbTest.clientOf(c[2], c[3]); };
  window.__brbTest.offCoast = function (cc, px) {
    var c = C[IDX[cc]], s = toScreen(c[3], c[2]), x = s[0];
    while (x < W0 && pickInside(x, s[1]) === IDX[cc]) x += 1;
    x += px; if (x >= W0 || pickInside(x, s[1]) >= 0) return null;
    var r = cv.getBoundingClientRect(); return { x: r.left + x * r.width / W0, y: r.top + s[1] * r.height / H0 };
  };
  function pickInside(x, y) { var m = toMap(x, y); return countryAt(m[1], m[0]); }
  window.__brbTest.fitTo = function (b) { fit(b, 0.05); };
})();
