<title>Robo Route</title>
<style>
/* ===== Robo Route on the Oomba Kit: a meadow stage behind, and the board, block shelf, program and cards as kit DOM
   inside Oomba.ui.root() (kit font, day and night variables, text size, reduced motion). Colors come from the kit's
   --ok-* variables plus --rr-* set once from Oomba.color() in the script. ===== */
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{margin:0;touch-action:manipulation}
#game{font-family:var(--ok-font);color:var(--ok-text)}
#game button{font:inherit}
/* the title's Bolt (the kit's title card has no slot for a hand-drawn hero) */
.rr-titlebolt{position:fixed;bottom:max(3vh,14px);inset-inline-start:max(4vw,14px);width:clamp(96px,18vmin,180px);pointer-events:none;z-index:2}
.rr-titlebolt svg{width:100%;height:auto;display:block;animation:rr-bob 2.4s ease-in-out infinite}
/* ---- the chapter map ---- */
.rr-map{position:fixed;inset:0;top:calc(14px + env(safe-area-inset-top));padding:0 calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:10px;overflow:auto}
.rr-maphead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rr-maphead h2{margin:0;font-weight:800;font-size:1.5em;line-height:1.1;flex:1;min-width:8ch}
.rr-seg{display:inline-flex;border:2px solid var(--ok-edge);border-radius:999px;overflow:hidden;background:var(--ok-card)}
.rr-seg button{min-height:48px;min-width:48px;padding:0 16px;border:0;background:transparent;color:var(--ok-text);font-weight:800;cursor:pointer}
.rr-seg button[aria-pressed=true]{background:var(--rr-go)}
.rr-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px;align-content:start}
.rr-tile{min-height:64px;padding:10px 12px;border-radius:20px;border:2px solid var(--ok-edge);background:var(--ok-card);color:var(--ok-text);text-align:start;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 4px 0 var(--ok-edge)}
.rr-tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ok-edge)}
.rr-tile[disabled]{opacity:.55;cursor:default}
.rr-tile .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--rr-tint);display:grid;place-items:center}
.rr-tile .ic svg{width:26px;height:26px}
.rr-tile b{display:block;font-weight:800;font-size:1.05em;line-height:1.15;overflow-wrap:normal;word-break:normal;hyphens:auto}
/* a phone: two narrow tiles a row, the icon above the title, so whole words fit */
@media (max-width:520px){.rr-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.rr-tile{flex-direction:column;align-items:flex-start;gap:6px}}
.rr-tile small{display:block;font-weight:600;font-size:.85em;opacity:.85;line-height:1.2}
.rr-tile .st{display:inline-flex;gap:1px;vertical-align:middle}.rr-tile .st svg{width:14px;height:14px}
.rr-tile.crown{background:var(--rr-go-tint)}
/* ---- the level screen: board and work panel ---- */
.rr-play{position:fixed;left:calc(6px + env(safe-area-inset-left));right:calc(6px + env(safe-area-inset-right));top:var(--ok-safe-top);bottom:calc(6px + env(safe-area-inset-bottom));display:flex;gap:8px}
.rr-play.portrait{flex-direction:column}
.rr-play.landscape{flex-direction:row}
.rr-board{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
.rr-play.landscape .rr-board{flex:0 0 52%}
.rr-play.portrait .rr-board{flex:0 0 46%}
.rr-play.short.landscape .rr-board{flex:0 0 40%}
/* the verdict line: the last run's sentence stays under the board after the kit banner has gone */
.rr-verdict{font-weight:700;font-size:.92em;line-height:1.3;padding:4px 10px;border-radius:10px;background:var(--rr-tint);margin:0}
.rr-verdict:empty{display:none}
.rr-verdict.wrong{background:var(--rr-wrong-tint)}.rr-verdict.good{background:var(--rr-go-tint)}
.rr-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rr-pill{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;border:2px solid var(--ok-edge);background:var(--ok-card);font-weight:800;font-size:.92em;white-space:nowrap}
.rr-pill svg{width:18px;height:18px}
.rr-pill.quest{background:var(--rr-tint)}
.rr-gridwrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.rr-gridbox{position:relative;width:200px;height:200px}
.rr-grid{position:absolute;inset:0;display:grid;gap:2px;padding:4px;border-radius:14px;background:var(--rr-frame);border:3px solid var(--ok-edge);box-sizing:border-box}
.rr-cell{position:relative;border-radius:6px;background:var(--ok-bg2);overflow:hidden;min-width:0;min-height:0}
.rr-cell.wall{background:var(--rr-wall);background-image:repeating-linear-gradient(45deg,transparent 0 6px,var(--rr-wall2) 6px 8px)}
.rr-cell.water{background:var(--rr-water);background-image:repeating-linear-gradient(0deg,transparent 0 7px,var(--rr-water2) 7px 9px)}
.rr-cell.paint{background:var(--rr-paint);background-image:radial-gradient(var(--rr-paint2) 18%,transparent 20%);background-size:10px 10px}
.rr-cell.plate{background:var(--rr-plate)}
.rr-cell.plate::after{content:"";position:absolute;inset:22%;border-radius:50%;border:3px solid var(--ok-edge)}
.rr-cell.goal{background:var(--rr-go-tint)}
.rr-cell.door{background:var(--rr-door)}
.rr-cell.door.open{background:var(--rr-go-tint);opacity:.9}
.rr-cell.ghost::before{content:"";position:absolute;inset:34%;border-radius:50%;border:3px dotted var(--ok-edge);opacity:.55}
.rr-cell .it{position:absolute;inset:12%;display:grid;place-items:center}
.rr-cell .it svg{width:100%;height:100%}
.rr-cell .it.gone{display:none}
.rr-cell .num{position:absolute;left:3px;top:1px;font-size:.62em;font-weight:700;opacity:.5;line-height:1}
.rr-cell .word{position:absolute;inset:auto 0 2px 0;text-align:center;font-size:.6em;font-weight:800;line-height:1;color:var(--ok-text)}
.rr-cell.door .dr{position:absolute;inset:14% 22%;border-radius:4px 4px 0 0;border:3px solid var(--ok-edge);border-bottom:0;box-sizing:border-box}
.rr-bolt{position:absolute;pointer-events:none;z-index:2}
.rr-bolt svg{position:absolute;inset:8%;width:84%;height:84%;display:block;overflow:visible;transform-origin:50% 50%}
.rr-bolt.bump svg{animation:rr-wobble 360ms ease-out}
.rr-bolt.splash{opacity:.35}
.rr-b1{fill:var(--rr-bolt);stroke:var(--ok-edge);stroke-width:2.5;stroke-linejoin:round}
.rr-b2{fill:var(--rr-visor);stroke:var(--ok-edge);stroke-width:2}
.rr-b3{fill:var(--rr-paintjob);stroke:var(--ok-edge);stroke-width:1.5}
.rr-eye{fill:var(--ok-card)}
.rr-watch{display:flex;gap:6px;flex-wrap:wrap;min-height:0}
.rr-watch .rr-pill{background:var(--rr-var-tint)}
/* work panel */
.rr-panel{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--ok-card);border:3px solid var(--ok-edge);border-radius:20px;padding:8px 8px 0;box-sizing:border-box}
#mkPanel{padding:8px;gap:6px}
/* the footer holds the run bar, the tray and the edit row under the program box (one box, so nothing shows through) */
.rr-foot{display:flex;flex-direction:column;gap:6px;padding:6px 0 8px;order:2}
#shelf{order:0;padding-bottom:6px}#prog{order:1}#runbar{order:3}
.rr-shelf{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.rr-shelf .ok-btn{min-height:48px;padding:0 12px;font-size:1em}
.rr-shelf .ok-btn[aria-disabled=true]{opacity:.45}
.rr-blk,.rr-shelf .ok-btn{border-inline-start-width:8px}
.rr-k-move{border-inline-start-color:var(--rr-k-move)}.rr-k-loop{border-inline-start-color:var(--rr-k-loop)}.rr-k-if{border-inline-start-color:var(--rr-k-if)}.rr-k-event{border-inline-start-color:var(--rr-k-event)}.rr-k-var{border-inline-start-color:var(--rr-k-var)}.rr-k-proc{border-inline-start-color:var(--rr-k-proc)}
.rr-shape{display:inline-block;width:.7em;height:.7em;flex:none;border:2px solid currentColor}
.rr-k-move .rr-shape{border-radius:50%}.rr-k-loop .rr-shape{border-radius:2px;border-style:dashed}.rr-k-if .rr-shape{transform:rotate(45deg) scale(.85)}.rr-k-event .rr-shape{border-radius:0 50% 50% 0}.rr-k-var .rr-shape{border-radius:3px;border-bottom-width:5px}.rr-k-proc .rr-shape{border-radius:40% 40% 0 0}
.rr-prog{flex:1;min-height:48px;overflow:auto;border-radius:12px;background:var(--ok-bg2);padding:6px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;scrollbar-width:thin}
.rr-list{display:flex;flex-direction:column;gap:4px;align-items:flex-start;width:100%}
.rr-list.inner{padding-inline-start:14px;border-inline-start:4px solid var(--rr-rail);margin-inline-start:12px;width:auto;align-self:stretch}
.rr-blk{min-height:48px;padding:0 12px;border-radius:12px;border:2px solid var(--ok-edge);background:var(--ok-card);color:var(--ok-text);font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-align:start;max-width:100%}
.rr-blk svg{width:1.2em;height:1.2em;flex:none}
.rr-blk .n{font-weight:800;background:var(--rr-tint);border-radius:8px;padding:0 6px;min-width:1.2em;text-align:center}
.rr-blk.sel{outline:3px solid var(--ok-focus);outline-offset:2px;background:var(--rr-sel)}
.rr-blk.running{background:var(--rr-go)}
.rr-blk.hl,.rr-shelf .hl{animation:rr-pulse 1s ease-in-out infinite;box-shadow:0 0 0 4px var(--rr-hot)}
.rr-slot{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:48px;border-radius:8px;border:2px dashed var(--ok-line);background:transparent;color:var(--ok-text);opacity:.7;font-weight:700;font-size:.85em;padding:0 8px;cursor:pointer}
.rr-slot.cur{border-color:var(--ok-focus);opacity:1;border-style:solid}
.rr-empty{font-weight:600;opacity:.7;font-size:.92em;padding:6px 4px}
.rr-tray{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rr-tray .ok-btn.ok-icon,.rr-run .ok-btn.ok-icon{width:48px}
.rr-edit{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px;border-radius:12px;background:var(--rr-tint)}
.rr-edit .ok-btn{min-height:48px;min-width:48px;padding:0 12px;font-size:.95em}
.rr-edit .lbl{font-weight:700;opacity:.85;font-size:.9em}
.rr-edit .ok-btn[aria-pressed=true]{background:var(--rr-go)}
.rr-edit .val{font-weight:800;min-width:2ch;text-align:center;font-size:1.2em}
.rr-run{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* the run bar sits before the program in the DOM (Run is a few tabs from the shelf) and last on the screen */
.rr-run .ok-btn[aria-disabled=true]{opacity:.45}
.rr-spacer{flex:1}
/* cards (learn, plan, quest card, case closed) share the kit's modal look */
.rr-card{text-align:start;align-items:stretch;gap:12px;max-width:520px}
.rr-card h2{margin:0;font-weight:800;font-size:1.5em;line-height:1.1;text-align:center}
.rr-card p{margin:0;font-weight:600;line-height:1.4}
.rr-card .pic{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.rr-card .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.rr-card .col{display:flex;flex-direction:column;gap:8px}
.rr-tile2{min-height:52px;padding:8px 14px;border-radius:14px;border:2px solid var(--ok-edge);background:var(--ok-card);color:var(--ok-text);font-weight:700;text-align:start;display:flex;align-items:center;gap:10px;cursor:pointer;line-height:1.25}
.rr-tile2 .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--rr-tint);display:grid;place-items:center;font-weight:800;font-size:.9em}
.rr-tile2.right{background:var(--rr-go-tint)}.rr-tile2.wrong{background:var(--rr-wrong-tint)}
.rr-tile2[disabled]{cursor:default}
.rr-tile2 svg{width:22px;height:22px;flex:none}
.rr-plan ol{margin:0;padding-inline-start:22px;font-weight:700;line-height:1.5}
.rr-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:260px;margin:0 auto}
.rr-keypad .ok-btn{min-height:52px;padding:0}
.rr-code{font-size:2em;font-weight:800;letter-spacing:.3em;text-align:center;min-height:1.3em}
.rr-faces{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.rr-faces p{width:100%;text-align:center}
.rr-faces .ok-btn{min-height:52px}
.rr-shake{animation:rr-shake 320ms}
.rr-projector #game{font-size:1.25em}
/* projector: the board and blocks large for the back row, thick outlines, and no side controls the class does not need */
.rr-projector .rr-play:not(.narrow) .rr-board{flex:1.4 1 0}
.rr-projector .rr-blk{min-height:56px;font-size:1.1em;border-width:3px}
.rr-projector .rr-cell{outline:2px solid var(--ok-text);outline-offset:-1px}
.rr-projector .rr-pairpill,.rr-projector #pairPill,.rr-projector #runbar [data-map]{display:none}
@keyframes rr-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes rr-wobble{0%{transform:rotate(var(--r)) translateX(0)}30%{transform:rotate(var(--r)) translateX(-8%)}60%{transform:rotate(var(--r)) translateX(8%)}100%{transform:rotate(var(--r)) translateX(0)}}
@keyframes rr-pulse{50%{transform:scale(1.04)}}
@keyframes rr-shake{25%,75%{translate:-6px}50%{translate:6px}}
.ok-rm .rr-titlebolt svg,.ok-rm .rr-bolt.bump svg,.ok-rm .rr-blk.hl,.ok-rm .rr-shelf .hl,.ok-rm .rr-shake{animation:none}
/* stage 2: pair mode, test tabs, the compare view, flowchart tiles, the Level Maker, the symbol pad */
.rr-pairbtn{position:fixed;bottom:max(3vh,14px);inset-inline-end:max(4vw,14px);z-index:21;min-height:48px}
.rr-pairbtn[aria-pressed=true]{background:var(--rr-go)}
.rr-pairpill{display:inline-flex;align-items:center;gap:4px;min-height:34px;padding:0 8px;border-radius:999px;border:2px solid var(--ok-edge);background:var(--ok-card);font-weight:800;font-size:.85em}
.rr-pairpill .av{width:30px;height:30px;border-radius:50%;overflow:hidden;opacity:.45;display:grid;place-items:center;background:var(--ok-bg2)}
.rr-pairpill .av canvas{width:100%;height:100%;display:block}
.rr-pairpill .av.on{opacity:1;outline:3px solid var(--rr-go);outline-offset:1px}
.rr-tabs{display:flex;gap:6px;flex-wrap:wrap}
.rr-tabs .ok-btn{min-height:48px;padding:0 12px;font-size:.92em}
.rr-tabs .ok-btn[aria-pressed=true]{background:var(--rr-tint)}
.rr-tabs .ok-btn svg{width:1.1em;height:1.1em}
.rr-pill.edits{background:var(--rr-var-tint)}
.rr-pill.over{background:var(--rr-wrong-tint)}
.rr-code-err{margin:0;min-height:1.3em;font-weight:800;color:var(--ok-text);text-align:center}.rr-code-err:empty{min-height:0}
.rr-cmp{display:flex;gap:8px;width:100%;min-height:0;flex:1}
.rr-cmp .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;border-radius:12px;border:2px solid var(--ok-edge);padding:6px;background:var(--ok-card)}
.rr-cmp h3{margin:0;font-size:1em;font-weight:800}
.rr-cmp .rr-list{flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px;flex:1;align-content:flex-start}
.rr-cmp .rr-list.inner{width:auto;align-self:auto;margin-inline-start:2px;padding-inline-start:6px}
.rr-cmp .rr-blk{min-height:30px;padding:0 8px;font-size:.84em;cursor:default}
.rr-cmp .blocks{flex:1;min-height:0;overflow:auto}
.rr-cmp .row{justify-content:flex-start}
.rr-cmp .rr-list .rr-slot{display:none}
.rr-cmp .ok-btn{min-height:48px}
.rr-tag{display:inline-block;font-size:.72em;font-weight:700;opacity:.85;border-radius:6px;padding:1px 6px;background:var(--rr-tint)}
.rr-tag.chip{background:var(--rr-go-tint)}
.rr-fc.diamond .k{border-radius:4px;transform:rotate(45deg)}
.rr-fc.round .k{border-radius:999px}
.rr-tile2.rr-fc.diamond{border-style:dashed;border-radius:6px}.rr-tile2.rr-fc.round{border-radius:999px}
.rr-plan ol.flow li{list-style:none;position:relative;padding:4px 10px;margin:2px 0;border:2px solid var(--ok-edge);border-radius:10px;background:var(--ok-card)}
.rr-plan ol.flow li.diamond{border-radius:4px;border-style:dashed}
.rr-plan ol.flow li.round{border-radius:999px;text-align:center}
.rr-plan ol.flow{padding:0;max-height:34vh;overflow:auto}
.rr-task{margin:0;font-weight:700;line-height:1.3;font-size:.95em}
.rr-mgrid .rr-cell{appearance:none;border:0;padding:0;font:inherit;color:var(--ok-text);cursor:pointer;min-width:0;min-height:0}
.rr-mgrid .rr-cell:focus-visible{outline:3px solid var(--ok-focus);outline-offset:-3px;z-index:1}
.rr-mgrid .rr-cell .bt{position:absolute;inset:14%;display:grid;place-items:center;border-radius:50%;background:var(--rr-bolt);border:2px solid var(--ok-edge)}
.rr-mgrid .rr-cell .bt svg{width:70%;height:70%}
#mkPalette .ok-btn[aria-pressed=true]{background:var(--rr-sel);outline:3px solid var(--ok-focus);outline-offset:1px}
#mkResult .rr-pill{white-space:normal;min-height:34px;padding:4px 12px}
#mkResult .rr-pill.good{background:var(--rr-go-tint)}#mkResult .rr-pill.bad{background:var(--rr-wrong-tint)}
.rr-sym{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.rr-sym .ok-btn{min-height:48px;min-width:48px;padding:0 10px}
.rr-sym .ok-btn[aria-pressed=true]{background:var(--rr-tint)}
.rr-code.small{font-size:1.4em;letter-spacing:.15em;word-break:break-all}
.rr-codes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.rr-codes .ok-btn{justify-content:flex-start;letter-spacing:.12em}
.rr-tile.daily .ic{background:var(--rr-go-tint)}
.rr-tile .st.silver{color:var(--rr-silver)}
.rr-tile .crownic{flex:none;width:26px;height:26px;color:var(--rr-k-loop)}
.rr-grid.fog .rr-cell:not(.seen)::after{content:"";position:absolute;inset:0;background:var(--rr-fog);opacity:.75;border-radius:inherit}
.rr-grid.fog .rr-cell.seen{transition:none}
/* a phone (on its side or upright): the program flows as wrapped chips, the tray takes the run bar's row; on its side the
   panel also starts right under the HUD */
.rr-play.short .rr-prog .rr-list,.rr-play.narrow .rr-prog .rr-list{flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px}
.rr-play.short .rr-list.inner,.rr-play.narrow .rr-list.inner{width:auto;align-self:auto;margin-inline-start:2px;padding-inline-start:6px;border-inline-start-width:4px}
.rr-play.narrow.portrait .rr-board{flex:0 0 38%}
/* the Level Maker on a phone: the board takes the width (its cells stay at least 28 px), the actions panel shrinks */
.rr-maker.narrow.portrait .rr-board{flex:1 1 auto;min-height:0}.rr-maker.narrow.portrait #mkPanel{flex:0 0 auto;overflow:visible}
.rr-play.narrow .rr-grid{padding:3px;gap:1px}
/* phones (upright or on their side): the whole work panel scrolls (more than eight buttons, so the audit allows it); the
   shelf stays stuck at the top and the run bar at the bottom, each with a band that hides the chips sliding under */
.rr-play.narrow .rr-panel,.rr-play.short .rr-panel{overflow:auto;scrollbar-width:thin;padding-top:0}
.rr-play.narrow .rr-prog,.rr-play.short .rr-prog{flex:none;overflow:visible;min-height:0}
.rr-play.narrow #shelf,.rr-play.short #shelf{position:sticky;top:0;z-index:2;background:var(--ok-card);padding:8px 0 20px}
.rr-play.narrow .rr-foot,.rr-play.short .rr-foot{position:sticky;bottom:0;z-index:2;background:var(--ok-card);padding:20px 0 24px;margin-top:auto}
.rr-play.narrow .rr-blk,.rr-play.short .rr-blk{scroll-margin:80px 0 90px}
/* upright screens, and a long program (seven blocks or more) anywhere, flow the program as wrapped chips */
.rr-play.portrait .rr-prog .rr-list,.rr-prog.long .rr-list{flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px}
.rr-play.portrait .rr-list.inner,.rr-prog.long .rr-list.inner{width:auto;align-self:auto;margin-inline-start:2px;padding-inline-start:6px;border-inline-start-width:4px}
.rr-play.narrow .rr-shelf .ok-btn{padding:0 10px;font-size:.92em}
.rr-play.narrow .rr-foot{gap:5px}
@media (max-height:460px){.rr-play{gap:6px}.rr-panel{padding:6px 6px 0}#mkPanel{padding:6px;gap:4px}.rr-foot{gap:4px;padding:4px 0 6px}#shelf{padding-bottom:4px}.rr-play.short #shelf{padding:6px 0 20px}.rr-play.short .rr-foot{padding:20px 0 24px}.rr-shelf .ok-btn{min-height:48px;padding:0 10px;font-size:.92em}.rr-top .rr-pill{min-height:30px;font-size:.85em}}
</style>
<div id="game">
  <div class="rr-titlebolt" id="titleBolt" aria-hidden="true"></div>
  <button type="button" class="ok-btn ok-quiet rr-pairbtn" id="pairBtn" hidden></button>
  <section class="rr-map" id="map" hidden>
    <div class="rr-maphead">

  for (const [k, ch] of Object.entries(marks)) { const [x, y] = k.split(',').map(Number); put(rows, x, y, ch); }
  const [x0, y0] = cells[0], [x1, y1] = cells[1];
  put(rows, x0, y0, '^>v<'[D4.findIndex(d => d[0] === x1 - x0 && d[1] === y1 - y0)]);

/** An L: east `a` squares from the bottom-left corner, then north `b` squares. */
const lPath = (n, a, b) => { const cells = []; for (let x = 0; x <= a; x++) cells.push([x, n - 1]); for (let y = n - 2; y >= n - 1 - b; y--) cells.push([a, y]); return cells; };

const G = {
  // the gap: east a random way, then north to the goal (the turn comes at a different square each time)
  gapL: n => r => { const a = r.int(2, n - 2), b = r.int(2, n - 2); return pathBoard(n, lPath(n, a, b), '~'); },
  // a clockwise spiral cut short at a random length; paint on every turn square
  paintSpiral: n => r => { const cells = spiral(n, r.int(n * 2, 4 * n - 4), true); const marks = {}; for (const i of corners(cells)) marks[cells[i].join(',')] = 'P'; return pathBoard(n, cells, '~', marks); },
  // a counter-clockwise spiral in solid wall: Bolt bumps at every turn
  bumpSpiral: n => r => { const cells = spiral(n, r.int(n * 2, 4 * n - 4), false); return pathBoard(n, cells, '#'); },
  // a straight corridor with gems on some squares (never the same ones)
  gemRow: n => r => { const y = Math.floor(n / 2), rows = blank(n, '~'); for (let x = 0; x < n; x++) put(rows, x, y, '.'); const slots = []; for (let x = 1; x < n - 1; x++) slots.push(x); for (const x of r.shuffle(slots).slice(0, r.int(2, n - 3))) put(rows, x, y, '*'); put(rows, 0, y, '>'); put(rows, n - 1, y, 'G'); return rows; },
  // a clockwise spiral maze in wall (right turns only), random length
  rightMaze: n => r => { const cells = spiral(n, r.int(n * 2 + 2, 4 * n - 4), true); return pathBoard(n, cells, '#'); },
  // gems and a door that counts them: a corridor east with 1-3 gems, the door before the goal
  countRow: n => r => { const y = Math.floor(n / 2), rows = blank(n, '~'); for (let x = 0; x < n; x++) put(rows, x, y, '.'); const slots = []; for (let x = 1; x < n - 2; x++) slots.push(x); for (const x of r.shuffle(slots).slice(0, r.int(1, Math.min(3, n - 3)))) put(rows, x, y, '*'); put(rows, 0, y, '>'); put(rows, n - 2, y, 'D'); put(rows, n - 1, y, 'G'); return rows; },
  // an L with gems scattered on it and a door before the goal; a wall at the corner makes Bolt bump there
  countL: n => r => { const a = r.int(2, n - 2), b = r.int(2, n - 2); const cells = lPath(n, a, b); const rows = pathBoard(n, cells, '#'); const slots = cells.slice(1, -2).filter(([x, y]) => !(x === a && y === n - 1)); for (const [x, y] of r.shuffle(slots).slice(0, r.int(1, 3))) put(rows, x, y, '*'); const [dx, dy] = cells[cells.length - 2]; put(rows, dx, dy, 'D'); return rows; },
  // Pro: a right-turn path where some corners are open ground marked with paint and the others are walls
  paintOrWall: n => r => { const cells = spiral(n, r.int(n * 2, 4 * n - 4), true); const rows = blank(n, '.'); const marks = {}; const cs = corners(cells); for (const i of cs) { const [x, y] = cells[i]; if (r.chance(0.5)) marks[x + ',' + y] = 'P'; else { const [px, py] = cells[i - 1]; const wx = x + (x - px), wy = y + (y - py); if (wx >= 0 && wy >= 0 && wx < n && wy < n) put(rows, wx, wy, '#'); else marks[x + ',' + y] = 'P'; } } const out = pathBoard(n, cells, '.', marks); for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (rows[y][x] === '#' && !cells.some(c => c[0] === x && c[1] === y)) put(out, x, y, '#'); return out; },
  // Pro: a key somewhere on a right-turn spiral, the door at the end
  keyMaze: n => r => { const cells = spiral(n, r.int(n * 2 + 2, 4 * n - 4), true); const rows = pathBoard(n, cells, '#'); const [kx, ky] = cells[r.int(2, cells.length - 4)]; put(rows, kx, ky, 'K'); const [dx, dy] = cells[cells.length - 2]; put(rows, dx, dy, 'D'); return rows; },
  // a right-turn spiral maze with gems on some squares of the way
  gemSpiral: n => r => { const cells = spiral(n, r.int(n * 2 + 2, 4 * n - 4), true); const marks = {}; for (const [x, y] of r.shuffle(cells.slice(1, -1)).slice(0, r.int(2, 4))) marks[x + ',' + y] = '*'; return pathBoard(n, cells, '#', marks); },
  // the gap L (east, then north) with gems along the way
  gemGapL: n => r => { const a = r.int(2, n - 2), b = r.int(2, n - 2); const cells = lPath(n, a, b); const marks = {}; for (const [x, y] of r.shuffle(cells.slice(1, -1)).slice(0, r.int(1, 3))) marks[x + ',' + y] = '*'; return pathBoard(n, cells, '~', marks); },
  // Pro: corners with a gem mean "turn right", bare corners mean "turn left" (a zigzag down the board)
  gemCorners: n => r => {
    // runs on even rows, a two-square drop between them; a corner that turns right (east then down, or down then
    // west) gets a gem, a corner that turns left stays bare
    const cells = [[0, 0]]; let x = 0, y = 0, d = 1; const marks = {};
    while (true) {
      const room = d === 1 ? n - 1 - x : x; const run = Math.min(room, r.int(1, 3));
      for (let k = 0; k < run; k++) { x += d; cells.push([x, y]); }
      if (y >= n - 2) break;
      if (d === 1) marks[x + ',' + y] = '*';
      cells.push([x, y + 1], [x, y + 2]); y += 2;
      const canW = x >= 1, canE = x <= n - 2;
      d = canW && canE ? (r.chance(0.5) ? -1 : 1) : canW ? -1 : 1;
      if (d === -1) marks[x + ',' + y] = '*';
    }
    return pathBoard(n, cells, '#', marks);
  },
};

Oomba.fonts.ready.then(() => { goTitle(); });

/* ---------- test hooks: the kit's (step, setLang, ...) plus the game's own; deterministic from a seed ---------- */
const stateObj = () => ({ screen: S.screen, chapter: S.chapter ? S.chapter.id : null, level: S.li + 1, levelId: S.level ? S.level.id : null, stars: S.chapter ? chapterStars() : 0, band: S.band, mode: S.mode, lesson: S.lesson, lock: S.lock,
  phase: S.playing ? 'running' : cardOpen ? 'card' : S.screen, card: cardOpen, blocks: E.blocks(S.prog), runs: S.runs, fails: S.fails, hint: S.hint, done: S.chapter ? chapterDone() : 0, total: S.levels.length, label: S.lastLabel || null, checks: Object.assign({}, S.checks), layout: S.layout, bolt: Object.assign({}, BOLT), planDone: S.planDone,
  edits: S.starter0 ? E.edits(S.starter0, S.prog) : 0, compare: S.compare ? S.compare.picked : null, testing: !!S.testing, pair: !!SAVE.pair, driver: S.driver, crowns: crownCount(), tabs: $('#tabs').hidden ? 0 : $('#tabs').children.length,
  maker: S.screen === 'maker' ? { task: M.task ? M.task.id : null, free: M.free, tool: M.tool, rows: M.rows.slice(), result: M.result ? { ok: M.result.ok, why: M.result.why, n: M.result.n } : null, base: M.base, made: Object.keys(M.made).length, tested: Object.keys(M.tested).length, feedback: M.feedback || null, improved: !!M.improved } : null, locked: S.locked ? S.locked.chapter.id : null, ready: true });
Oomba.test({ state: stateObj, start: () => { closeKitScreens(); closeCard(); S.lesson = false; S.lock = false; startChapter('sequences'); } });
Object.assign(window.__brbTest, {
  start: (o = {}) => {
    closeKitScreens(); closeCard();
    if (o.seed != null) { S.seed = o.seed | 0; S.rng = E.rng(S.seed); }
    if (o.day != null) S.dayOverride = o.day | 0;
    if (o.band) { S.band = o.band === '2' ? '2' : '1b'; }
    S.lesson = !!o.lesson; S.lock = !!o.lock; S.mode = o.mode || 'play'; S.checks = { ok: 0, n: 0 }; S.chained = 0;
    document.documentElement.classList.toggle('rr-projector', S.mode === 'projector');
    startChapter(o.chapter || 'sequences', { level: o.level || null });
  },
  skipAnimations: () => { S.instant = true; },
  program: p => { const list = typeof p === 'string' ? parse(p) : JSON.parse(JSON.stringify(p)); S.prog = withIds(list); S.sel = null; S.cur = null; renderProgram(); renderTray(); return E.blocks(S.prog); },
  run: () => runProgram(),
  stepOnce: () => stepOnce(),
  verdict: () => (S.lastRun ? S.lastRun.verdict : null),
  tap: id => { const b = document.querySelector(`.rr-blk[data-id="${id}"]`); if (b) b.click(); return !!b; },
  shelf: i => { const b = document.querySelectorAll('#shelf .ok-btn')[i]; if (b) b.click(); return !!b; },
  tray: label => { const b = [...document.querySelectorAll('#tray .ok-btn')].find(x => (x.getAttribute('aria-label') || x.textContent).trim() === label); if (b) b.click(); return !!b; },
  levels: () => S.levels.map(l => l.id),
  solve: async () => { window.__brbTest.program(S.level.sol); S.planDone = true; S.predicted = true; await runProgram(); return stateObj(); },
  hint: () => { S.fails = Math.max(S.fails, 2); openHint(); return S.hint; },
  skip: () => { S.fails = 2; skipLevel(); },
  check: i => { const b = document.querySelector(`#modal .rr-tile2[data-tile="${i}"]`); if (b) b.click(); return !!b; },
  confidence: i => { const b = document.querySelectorAll('#modal .rr-faces .ok-btn')[(i | 0) - 1]; if (b) b.click(); return !!b; },
  plan: () => { const lines = S.level.plan || []; for (const line of lines) { const t = [...document.querySelectorAll('#modal .rr-tile2')].find(x => !x.disabled && x.textContent.includes(tr(line))); if (t) t.click(); } return S.planDone; },
  closeModal: () => { closeKitScreens(); const wasLearn = cardOpen === 'learn'; closeCard(); if (wasLearn && S.screen === 'play' && S.level.plan && !S.planDone) openPlan(); },
  closeDialog: () => closeKitScreens(),
  map: () => { closeKitScreens(); S.lock = false; goMap(); },
  title: () => { goTitle(); },
  questCode: d => { openQuestCard(); applyQuestCode(String(d).replace(/\D/g, '').padStart(4, '0').slice(0, 4)); },
  band: b => { S.band = b === '2' ? '2' : '1b'; if (S.screen === 'map') renderMap(); },
  unlockAll: () => { for (const ch of CHAPTERS) for (const b of ['1b', '2']) { const r = rec(b, ch.id); levelsFor(ch.id, b).forEach((_, i) => { r.d[i] = true; r.s[i] = r.s[i] || 1; }); } },
  // stage 2 hooks: the Level Maker, routes, tests, the daily, pair mode
  tool: t => { M.tool = t; renderPalette(); return M.tool; },
  paint: (x, y) => { if (S.screen !== 'maker') return false; paintCell(x, y); return M.rows.slice(); },
  mkRows: rows => { if (S.screen !== 'maker') return false; M.rows = rows.slice(); M.result = null; renderMaker(); return true; },
  mkCheck: () => { mkCheck(); return M.result ? { ok: M.result.ok, why: M.result.why, n: M.result.n } : null; },
  mkCode: () => codeOf(M.rows),
  mkLoad: code => mkLoad(code),
  mkTest: async () => { mkTest(); await Oomba.time.real.wait(80); const b = [...document.querySelectorAll('.ok-ui .ok-modal:not(#scrim) .ok-hot')].pop(); if (b) b.click(); await Oomba.time.real.wait(80); return !!S.testing; },
  mkSave: () => { mkSave(); return SAVE.levels.slice(); },
  maker: i => { closeKitScreens(); closeCard(); if (!S.chapter || S.chapter.id !== 'level-maker') { S.chapter = CHAPTERS.find(c => c.id === 'level-maker'); S.levels = levelsFor('level-maker', S.band); if (!S.hud) S.hud = Oomba.ui.hud(['progress', 'count:star'], {}); } startMaker(i == null ? 'free' : i); return stateObj(); },
  route: i => { useRoute(i); return S.compare ? S.compare.picked : null; },
  previewRoute: i => previewRoute(i),
  test: i => { const b = document.querySelectorAll('#tabs .ok-btn')[i]; if (b) b.click(); return S.layout; },
  daily: day => { if (day != null) S.dayOverride = day | 0; closeKitScreens(); closeCard(); startDaily(); return stateObj(); },
  pair: on => { SAVE.pair = !!on; renderPairBtn(); renderPair(); return SAVE.pair; },
  chip: (id, k) => { const f = find(id); if (!f || f.b.t !== 'proc') return false; f.b.chip = k; renderProgram(); return true; },
  verdictText: () => ($('#' + (S.screen === 'maker' ? 'mkNote' : 'verdict')).textContent || ''),
  banner: () => { const b = document.querySelector('.ok-ui .ok-banner'); return b ? b.textContent.trim() : ''; },
  editTiles: () => [...document.querySelectorAll('#edit .ok-btn')].map(b => b.textContent.trim()),
  key: (key, o = {}) => { document.dispatchEvent(new KeyboardEvent('keydown', Object.assign({ key, bubbles: true, cancelable: true }, o))); return stateObj(); },
  tester: (fun, hard) => { const bs = [...document.querySelectorAll('#modal .row .ok-btn')]; const f = bs[fun | 0], h = bs[4 + (hard | 0)]; if (f) f.click(); if (h) h.click(); const go = document.querySelector('#modal .ok-hot'); if (go) go.click(); return !!go; },
  cover: () => {
    closeKitScreens(); closeCard(); S.instant = true; S.lesson = false; S.lock = false; S.band = '1b';
    startChapter('loops', { level: 4 });
    window.__brbTest.program('repeat 4 { move; pick }');
    const r = E.run(S.level, S.prog, { planMatch: true }); const ev = r.results[0].events.filter(e => VISIBLE.has(e.k)).slice(0, 4);
    S.watchVars = {}; for (const e of ev) applyEvent(e, 0);
    if (STAGE) try { STAGE.burst('sparkle', STAGE.camera.x, STAGE.camera.y, { n: 24 }); } catch (e) { /* ignore */ }
    S.instant = false;
  },
});
</script>
