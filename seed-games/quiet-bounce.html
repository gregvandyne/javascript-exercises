<title>Quiet Bounce</title>
<style>
/* Quiet Bounce on the Oomba Kit: a classroom noise meter. A big glass jar of bouncy balls stands on a table: while the
   class keeps quiet the balls rest in a calm pile, near the line they jiggle and rattle, and when it is too loud they
   jump (some bump the lid). The play page measures how loud the room is and passes the game one number at a time
   (BRB.loudness); nothing is recorded. Screens: the kit's title (the jar already resting behind it) -> the setup card
   (how quiet, the goal, the room's quiet, the privacy note) -> the jar with the gauge and the quiet-time clock -> the
   kit's results card. Layout: landscape (projector, laptop, tablet on its side) puts the gauge on the right edge;
   portrait puts it along the bottom. Colour is never the only cue: each zone has an icon, the loud zone stripes, and the
   balls' faces show the mood. */
html,body{height:100%}
body{margin:0;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.ok-hud{display:none!important}
.qb,.qb *,.qbs,.qbs *{box-sizing:border-box}
.qb{position:fixed;inset:0;overflow:hidden;color:var(--ok-text);font-family:var(--ok-font,system-ui,sans-serif);--top:110px;
  --ink:#2A1B22;--calm:#4CB860;--near:#F2C230;--loud:#E8483C;--card:#FFFDF5}
.qb button{font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.qb-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}
.qb-cv{position:absolute;inset:0;width:100%;height:100%;display:block}

/* the top bar: the quiet-time clock in the middle, pause and teacher settings at the end */
.qb-top{position:absolute;inset-inline:0;top:0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));pointer-events:none}
.qb-top>*{pointer-events:auto}
.qb-spacer{pointer-events:none}
.qb-clock{justify-self:center;display:flex;flex-direction:column;align-items:center;padding:6px 22px 8px;border-radius:24px;background:var(--card);color:var(--ink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);min-width:min(300px,48vw)}
.qb-clock .lab{font-weight:800;font-size:clamp(.95rem,min(2.2vw,2.6vh),1.7rem);line-height:1.1;display:flex;align-items:center;gap:6px}
.qb-clock .lab::before{content:'🤫';font-size:.95em}
.qb-clock .time{font-weight:900;font-size:clamp(34px,min(8vw,8.4vh),118px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.qb-clock .sub{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:clamp(.85rem,min(1.8vw,2.2vh),1.5rem);opacity:.85}
.qb-clock .bounces::before{content:'💥 '}
.qb-clock.run .time{color:#2E8B4A}
.qb-btns{justify-self:end;display:flex;gap:8px}
/* the kit fills its gear with --ok-icon-card (dark at night): these buttons stay light, so the gear does too */
.qb-ib{width:clamp(48px,min(6vw,7vh),76px);height:clamp(48px,min(6vw,7vh),76px);border-radius:18px;border:3px solid var(--ink);background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;padding:0;--ok-icon-card:var(--card)}
/* "Listening (only how loud)": the microphone is on (the page's own pill says so too, with Stop) */
.qb-chip{display:flex;align-items:center;gap:8px;height:clamp(48px,min(6vw,7vh),76px);padding:0 16px;border-radius:18px;border:3px solid var(--ink);background:#C93A2F;color:#fff;box-shadow:0 4px 0 var(--ink);
  font-weight:800;font-size:clamp(.85rem,min(1.35vw,2.2vh),1.4rem);white-space:nowrap}
.qb-chip .dot{flex:none;width:.75em;height:.75em;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35);animation:qbBlink 1.4s ease-in-out infinite}
@keyframes qbBlink{50%{opacity:.35}}
.ok-rm .qb-chip .dot{animation:none}
@media (max-width:900px){.qb-chip .tx{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.qb-chip{padding:0;width:clamp(48px,min(6vw,7vh),76px);justify-content:center}.qb-chip .dot{display:none}}
.qb-ib svg{width:55%;height:55%}
.qb-ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.qb button:focus-visible,.qb input:focus-visible{outline:4px solid var(--ok-focus,#2E7CF6);outline-offset:3px}
.qb:not(.playing) .qb-top,.qb:not(.playing) .qb-gauge,.qb:not(.playing) .qb-demo{visibility:hidden}

/* the gauge (landscape: up the right edge) */
.qb-gauge{position:absolute;right:calc(18px + env(safe-area-inset-right));top:calc(var(--top) + 30px);bottom:calc(40px + env(safe-area-inset-bottom));width:clamp(56px,6.4vw,124px);
  display:flex;flex-direction:column;align-items:center;gap:8px}
.g-track{position:relative;flex:1;width:100%;border-radius:999px;border:4px solid var(--ink);background:#FFFDF5;overflow:hidden;box-shadow:0 5px 0 var(--ink)}
.g-zone{position:absolute;left:0;right:0;bottom:0;opacity:.38}
.g-calm{background:var(--calm)}.g-near{background:var(--near)}
.g-loud{background:var(--loud);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 8px,transparent 8px 16px)}
.g-fill{position:absolute;left:0;right:0;bottom:0;transition:background-color .2s}
.g-fill.calm{background:var(--calm)}.g-fill.near{background:var(--near)}
.g-fill.loud{background:var(--loud);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 8px,transparent 8px 16px)}
.g-peak{position:absolute;left:0;right:0;height:5px;margin-bottom:-2px;background:var(--ink);opacity:.6}
.g-line{position:absolute;left:-4px;right:-4px;height:8px;margin-bottom:-4px;background:var(--ink)}
.g-ic{flex:none;width:clamp(44px,min(5vw,7vh),96px);height:clamp(44px,min(5vw,7vh),96px);line-height:0}.g-ic svg{width:100%;height:100%;display:block;overflow:visible}
/* the zones named inside the track: Shh, Getting loud (the "Too loud" tag marks the line) */
.g-lab{position:absolute;left:3px;right:3px;transform:translateY(50%);z-index:2;text-align:center;font-weight:900;font-size:clamp(.7rem,min(1.15vw,1.9vh),1.4rem);line-height:1.05;color:var(--ink);
  text-shadow:0 0 3px #FFFDF5,0 0 3px #FFFDF5,0 0 2px #FFFDF5;pointer-events:none;overflow-wrap:anywhere;hyphens:auto}
.g-line{z-index:3}.g-peak{z-index:1}
.qb-gauge.near .g-line{animation:qbLine .6s ease-in-out infinite alternate}
@keyframes qbLine{from{box-shadow:0 0 0 0 rgba(232,72,60,0)}to{box-shadow:0 0 0 7px rgba(232,72,60,.8)}}
.ok-rm .qb-gauge.near .g-line{animation:none;box-shadow:0 0 0 5px rgba(232,72,60,.8)}
.g-tag{position:absolute;right:calc(100% + 8px);transform:translateY(-50%);display:flex;align-items:center;gap:4px;white-space:nowrap;padding:4px 12px;border-radius:999px;
  background:var(--loud);color:#fff;border:3px solid var(--ink);font-weight:800;font-size:clamp(.9rem,min(1.6vw,2.4vh),1.5rem);box-shadow:0 3px 0 var(--ink)}
/* while the jar's own sound plays the meter is not listening: the note sits where the "Too loud" tag is (the tag hides) */
.g-held{position:absolute;right:calc(100% + 8px);transform:translateY(-50%);white-space:nowrap;padding:4px 12px;border-radius:999px;background:var(--card);color:var(--ink);border:3px solid var(--ink);font-weight:800;
  font-size:clamp(.9rem,min(1.6vw,2.4vh),1.5rem);box-shadow:0 3px 0 var(--ink)}
.qb-gauge.held .g-track{opacity:.55}
.qb-gauge.loud .g-track{animation:qbThrob .8s ease-in-out infinite}
@keyframes qbThrob{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.ok-rm .qb-gauge.loud .g-track{animation:none}

/* portrait: the gauge lies along the bottom */
.qb.portrait .qb-gauge{left:calc(16px + env(safe-area-inset-left));right:calc(16px + env(safe-area-inset-right));top:auto;bottom:calc(64px + env(safe-area-inset-bottom));width:auto;height:58px;flex-direction:row}
.qb.portrait .g-track{height:100%;flex:1;width:auto}
.qb.portrait .g-zone,.qb.portrait .g-fill{top:0;bottom:0;left:0}
.qb.portrait .g-lab{top:50%;bottom:auto;left:auto;right:auto;transform:translate(-50%,-50%);white-space:nowrap}
.qb.portrait .g-peak{top:0;bottom:0;width:5px;height:auto;margin:0 -2px}
.qb.portrait .g-line{top:-4px;bottom:-4px;width:8px;height:auto;margin:0 -4px}
.qb.portrait .g-tag{right:auto;bottom:calc(100% + 8px);transform:translateX(-50%)}
.qb.portrait .g-held{right:auto;bottom:calc(100% + 8px);transform:translateX(-50%)}
.qb.portrait .g-icbot{order:-1}.qb.portrait .g-ictop{order:3}
.qb.portrait.demo .qb-gauge{bottom:calc(158px + env(safe-area-inset-bottom))}

/* "Too loud!" and the little "!" of a rattle, over the jar */
.qb-bubble{position:absolute;transform:translate(-50%,-100%);padding:10px 22px;border-radius:26px;background:var(--card);color:var(--ink);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);
  font-weight:900;font-size:clamp(1.3rem,min(3.4vw,5vh),3.4rem);white-space:nowrap;pointer-events:none}
.qb-bubble::after{content:'';position:absolute;left:24%;bottom:-18px;border:14px solid transparent;border-top:18px solid var(--ink);border-bottom:0}
.qb-bubble.pop{animation:qbPop .42s cubic-bezier(.34,1.56,.64,1) both}
/* rattling, readable from the back of the room: a big "!" by the jar for as long as they rattle, and a warm tint */
.qb-mark{position:absolute;transform:translate(-50%,-100%);font-weight:900;font-size:clamp(56px,10vh,124px);line-height:1;color:#FFC83D;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;pointer-events:none}
.qb-mark.wob{animation:qbWob 1.1s ease-in-out infinite}
@keyframes qbWob{0%,100%{transform:translate(-50%,-100%) rotate(-7deg)}50%{transform:translate(-50%,-104%) rotate(7deg)}}
.qb-tint{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 80% at 50% 70%,rgba(255,190,70,.1),rgba(255,150,30,.34));opacity:0;transition:opacity .6s}
.qb.stir .qb-tint{opacity:1}
.qb-mark.pop{animation:qbPop .35s cubic-bezier(.34,1.56,.64,1) both}
@keyframes qbPop{from{transform:translate(-50%,-100%) scale(.2);opacity:0}to{transform:translate(-50%,-100%) scale(1);opacity:1}}
.ok-rm .qb-bubble.pop,.ok-rm .qb-mark.pop,.ok-rm .qb-mark.wob{animation:none}

/* demo mode: the stand-in for the room */
.qb-demo{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  padding:10px 14px;border-radius:24px;background:var(--card);color:var(--ink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);max-width:calc(100vw - 32px);width:max-content}
.qb-ribbon{font-weight:900;padding:4px 12px;border-radius:999px;background:#B27CF0;color:#fff;border:3px solid var(--ink);text-transform:uppercase;letter-spacing:.05em;font-size:.9rem}
.qb-noise{display:flex;align-items:center;gap:8px;font-weight:800}
.qb-noise input{width:clamp(140px,22vw,320px);height:44px;accent-color:#E8483C;margin:0}
.qb-db{min-height:48px;padding:4px 16px;border-radius:16px;border:3px solid var(--ink);background:#FFE7A0;color:var(--ink);font-weight:800;font-size:1rem;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--ink)}
.qb-db[aria-pressed="true"]{background:#5DB548;color:#fff}
.qb-db .em{font-size:1.3em}
.qb.portrait .qb-demo{width:calc(100vw - 32px);max-width:560px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;padding:8px 10px}
.qb.portrait .qb-noise .tx{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.qb.portrait .qb-noise input{width:100%}
.qb.portrait .qb-demo .qb-db{justify-content:center}
.qb.portrait .qb-ribbon{align-self:center}
/* a narrow screen: a smaller clock, the two buttons stacked at the end */
@media (max-width:600px){
  .qb-clock{min-width:0;padding:4px 12px 6px;border-radius:18px}
  .qb-clock .sub{gap:2px 8px;font-size:.8rem}
  .qb-btns{flex-direction:column}
}

/* the setup card and the no-mic card */
.qbs{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));background:var(--ok-scrim)}
.qbs-card{width:min(860px,100%);max-height:100%;overflow:auto;background:var(--ok-card);color:var(--ok-text);border:3px solid var(--ok-edge);border-radius:28px;box-shadow:0 6px 0 var(--ok-edge);
  padding:16px 18px;display:grid;gap:12px 18px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"h h" "l r" "f f"}
.qbs h2{grid-area:h;margin:0;text-align:center;font-size:clamp(1.4rem,4vmin,2.2rem);line-height:1.1}
.qbs .left{grid-area:l}.qbs .right{grid-area:r}.qbs .foot{grid-area:f}
.qbs .left,.qbs .right,.qbs .foot{display:flex;flex-direction:column;gap:10px;min-width:0}
.qbs fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:6px}
.qbs legend{padding:0;font-weight:800;font-size:1rem;margin-bottom:4px}
.qbs .row{display:grid;gap:6px;grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
.qbs .goals{grid-template-columns:repeat(4,minmax(0,1fr))}
.qbs .opt{min-height:48px;min-width:0;border:3px solid var(--ok-edge);border-radius:16px;background:var(--ok-bg2);color:var(--ok-text);font-weight:800;font-size:1rem;padding:4px 6px;line-height:1.1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.qbs .opt .em{font-size:1.3em}
.qbs .opt[aria-checked="true"]{background:#FFC83D;color:#1D2340;box-shadow:0 3px 0 var(--ok-edge)}
.qbs .opt:focus-visible,.qbs button:focus-visible,.qbs input:focus-visible{outline:4px solid var(--ok-focus);outline-offset:2px}
.qbs .frow{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.85rem}
.qbs .frow .end{flex:0 0 auto;max-width:28%;line-height:1.1;text-align:center}
.qbs .frow input{flex:1;min-width:0;height:44px;margin:0;accent-color:#E0662A}
.qbs .mini{position:relative;height:14px;border-radius:999px;border:2.5px solid var(--ok-edge);background:linear-gradient(90deg,#4CB86066,#F2C23066,#E8483C66);overflow:hidden}
.qbs .mini .mf{position:absolute;left:0;top:0;bottom:0;background:#4CB860;width:0}
.qbs .mini .ml{position:absolute;top:-3px;bottom:-3px;width:5px;margin-left:-2px;background:var(--ok-edge)}
.qbs .linetx,.qbs .calt{margin:0;font-weight:700;font-size:.9rem;opacity:.85;min-height:1.2em}
.qbs .cal{display:flex;flex-direction:column;gap:10px}
.qbs .calb{min-height:52px;border:3px solid var(--ok-edge);border-radius:16px;--p:0%;background:linear-gradient(90deg,#8FD0FF var(--p),#D9F1FF var(--p));color:#1D2340;font-weight:800;font-size:1rem;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 12px;box-shadow:0 3px 0 var(--ok-edge)}
[dir=rtl] .qbs .calb{background:linear-gradient(270deg,#8FD0FF var(--p),#D9F1FF var(--p))}
.qbs .calb[disabled]{cursor:progress}
.qbs .privacy{margin:0;text-align:center;font-weight:700;font-size:.95rem;padding:8px 12px;border-radius:14px;background:var(--ok-bg2)}
.qbs .go{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.qbs .go .ok-btn{min-width:min(300px,100%)}
.qbs .go .em{margin-inline-end:6px}
.qbn .qbs-card{width:min(780px,100%);display:flex;flex-direction:column;align-items:stretch;text-align:center}
.qbn h2{font-size:clamp(1.4rem,4vmin,2.4rem)}
.qbn .big{font-size:3rem;line-height:1}
.qbn .why{margin:0;font-weight:600;font-size:1.1rem;line-height:1.35}
.qbn .go{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:12px}
.qbn .go .ok-btn{width:100%;min-width:0}
/* the results: a headline and two big numbers like the clock; the card beside the jar (wide) or under it (tall) */
.qb-end{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.qb-end .sub{margin:0;font-weight:900;font-size:1.35rem;line-height:1.15}
.qb-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.qb-stat{border:3px solid var(--ok-edge);border-radius:20px;background:var(--ok-bg2);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.qb-stat .n{font-weight:900;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.qb-stat .l{font-weight:700;font-size:.95rem;line-height:1.15}
html.qb-ended .ok-win .ok-score,html.qb-ended .ok-win .ok-best{display:none}
html.qb-ended .ok-win .ok-card{width:min(500px,100%)}
html.qb-ended.qb-side .ok-win{padding-right:calc(max(3vw,16px) + env(safe-area-inset-right))}
html.qb-ended.qb-side .ok-win .ok-card{margin-left:auto;margin-right:0}   /* on the right in every language: the jar stands on the left */
html.qb-ended.qb-side .ok-win.ok-scrim{background:linear-gradient(90deg,rgba(10,12,12,0) 30%,var(--ok-scrim))}
html.qb-ended.qb-low .ok-win{align-items:flex-end}
html.qb-ended.qb-low .ok-win.ok-scrim{background:linear-gradient(180deg,rgba(10,12,12,0) 30%,var(--ok-scrim))}
html.qb-ended.qb-low .ok-win .ok-card{gap:8px;padding-top:18px}
@media (max-height:560px){
  html.qb-ended .ok-win .ok-card{padding:12px 16px 14px;gap:6px}
  html.qb-ended .ok-win .ok-h2{font-size:1.3rem;margin:0}
  html.qb-ended .ok-win .ok-sparks .ok-slot{width:40px;height:40px}
  .qb-end{gap:6px}.qb-end .sub{font-size:1.05rem}.qb-stat{padding:4px 6px;border-radius:16px}.qb-stat .n{font-size:1.7rem}.qb-stat .l{font-size:.85rem}
  html.qb-ended .ok-win .ok-row{flex-wrap:nowrap}html.qb-ended .ok-win .ok-btn{min-height:44px;padding:0 14px;font-size:1rem}
}
@media (min-width:1400px) and (min-height:860px){
  html.qb-ended .ok-win .ok-card{width:min(760px,44vw);padding:34px 34px 30px;gap:20px}
  html.qb-ended .ok-win .ok-h2{font-size:clamp(2.4rem,4.8vmin,3.8rem)}
  .qb-end .sub{font-size:clamp(1.8rem,3.6vmin,3rem)}
  .qb-stat{padding:14px 10px;border-radius:26px}.qb-stat .n{font-size:clamp(3.4rem,7.4vmin,6rem)}.qb-stat .l{font-size:clamp(1.1rem,2.3vmin,1.8rem)}
  html.qb-ended .ok-win .ok-btn{font-size:clamp(1.2rem,2.6vmin,2.1rem);min-height:clamp(52px,7vmin,86px);padding:0 32px}
  .ok-pause .ok-card{zoom:1.45}
}
@media (orientation:portrait),(max-width:640px){
  .qbs-card{grid-template-columns:1fr;grid-template-areas:"h" "l" "r" "f";gap:10px}
}
@media (orientation:landscape) and (max-height:560px){
  .qbs-card{padding:10px 12px;gap:6px 12px}
  .qbs h2{font-size:1.2rem}
  .qbs .opt{min-height:44px;font-size:.92rem;flex-direction:row}
  .qbs .calt,.qbs .linetx{font-size:.8rem}
  .qbs .privacy{font-size:.82rem;padding:4px 8px}
  .qbs .goals{grid-template-columns:repeat(7,minmax(0,1fr))}
  .qbs .goals .opt{font-size:.82rem;padding:2px}
  .qbs legend{font-size:.9rem;margin-bottom:0}
  .qbs .calb{min-height:44px}
}
@media (min-width:1400px) and (min-height:860px){
  .qbs-card{width:min(1180px,92vw);padding:28px 34px;gap:22px 34px}
  .qbs h2{font-size:clamp(2rem,4.4vmin,3.4rem)}
  .qbs legend{font-size:clamp(1rem,2.4vmin,1.9rem)}
  .qbs .opt{min-height:clamp(48px,7vmin,96px);font-size:clamp(1.05rem,2.4vmin,2rem);border-radius:22px}
  .qbs .frow{font-size:clamp(.9rem,1.8vmin,1.4rem)}
  .qbs .linetx,.qbs .calt,.qbs .privacy{font-size:clamp(1rem,2vmin,1.5rem)}
  .qbs .calb{min-height:clamp(52px,7vmin,92px);font-size:clamp(1.05rem,2.4vmin,1.9rem)}

  var PRESETS = { whisper: 10, quiet: 18, group: 30 }; // how far above the room's own quiet the "too loud" line sits
  var PRESET_IDS = ['whisper', 'quiet', 'group'];
  var BASE = 30, FINE = 25, LINE_MIN = 15, LINE_MAX = 95;
  var GOALS = [120, 300, 600, 900, 1200, 1800, 0];   // seconds of quiet time; 0 = no goal
  var T = {
    near: 10,        // a level within this of the line counts as "getting loud"
    rattleIn: 0.3,   // seconds of near-the-line before the balls rattle
    rattleOut: 1.2,  // seconds below the near band before rattling balls lie still again
    rattleCool: 2.5, // seconds between two rattles (a jiggle, a hop, a roll, a click)
    jump: 1.5,       // seconds over the line (leaky) before the balls jump: a big bounce
    leak: 0.5,       // how fast the over-the-line count drains while it is quieter (x dt)
    seq: 2.0,        // the big bounce: up they all go, they hit the lid (0.35 s), clatter down (1.0 s), then bouncy
    bonk: 0.35, clatter: 1.0,
    calmBand: 5,     // bouncy balls calm while the level is this far under the line
    calm: 4,         // seconds of calm before they settle back into the pile
    settle: 2.0,     // settling takes this long
    reBounce: 0.6,   // noise this long while they settle makes them bouncy again (no extra big bounce)

   * States: rest (a calm pile; the quiet clock runs), rattle (near the line: still counts as quiet), jump (the big bounce,
   * a fixed 2 s), bouncy (they keep hopping while it is loud), settling (back into the pile), celebrate (the goal).

      }

      var mini = el('div', 'mini'); mini.dir = 'ltr'; var mfill = el('i', 'mf'), mline = el('b', 'ml'); mini.append(mfill, mline); fs2.appendChild(mini);
      var lineTx = el('p', 'linetx'); fs2.appendChild(lineTx);
      left.appendChild(fs2);
      // the line, once, under the slider: "Room: 24 · Bounces above: 42", or "Room: not set yet" before the room was measured
      function showLine() { var l = lineNow(); mline.style.left = l + '%'; mfill.style.width = Math.round(S.level) + '%'; lineTx.textContent = CFG.calibrated ? t('calibDone', { room: CFG.base, line: l }) : t('calibNone', { line: l }); }
      showLine(); var lineT = setInterval(function () { mfill.style.width = Math.round(S.level) + '%'; }, 120);
      group(t('goalH'), 'goals', CORE.GOALS.map(function (g) { return { v: g, label: g ? t('min', { n: g / 60 }) : t('noGoal') }; }),
        function () { return CFG.goal; }, function (v) { CFG.goal = +v; }, right);
      // "Set to the room's quiet": 3 seconds of the room, then the line sits above it
      var cal = el('div', 'cal');
      var cb = el('button', 'calb'); cb.type = 'button'; cb.appendChild(el('span', 'em', '🎚️')); cb.appendChild(el('span', '', t('calib')));
      var ct = el('p', 'calt', t('calibHint')); ct.setAttribute('role', 'status');
      cb.addEventListener('click', function () {
        if (S.calib) return;
        cb.disabled = true; ct.textContent = t('calibListen', { n: 3 }); cb.style.setProperty('--p', '0%');
        // the button fills from one end to the other over the 3 seconds
        var go = function () { startCalib(function (left) { ct.textContent = t('calibListen', { n: Math.ceil(left) }); cb.style.setProperty('--p', Math.round(100 * (1 - left / 3)) + '%'); }, function (r) {
          cb.disabled = false; cb.style.setProperty('--p', '0%');
          if (r.ok) { CFG.base = r.base; CFG.calibrated = true; showLine(); ct.textContent = t('calibOk'); }
          else ct.textContent = r.why === 'tooLoud' ? t('calibLoud') : t('calibNoMic');
        }); };
        if (S.demo || S.forced != null) go();
        else micStart().then(function (st) { if (st === 'on') go(); else { cb.disabled = false; ct.textContent = t('calibNoMic'); } });
      });
      cal.append(cb, ct); right.appendChild(cal);
      var foot = el('div', 'foot'); card.appendChild(foot);
      foot.appendChild(el('p', 'privacy', '🔒 ' + t('privacy')));
      var go = el('div', 'go'); foot.appendChild(go);
      function close(how) {
        if (!setupOpen) return; setupOpen = false; save(); clearInterval(lineT); wrap.remove(); document.removeEventListener('keydown', keys, true);
        if (S.calib) { S.calib = null; }
        resolve(how);
      }
      var start = O.ui.button(opt.edit ? t('backToJar') : t('startMic'), { kind: 'hot', big: true, icon: opt.edit ? 'play' : undefined, onPress: function () {
        // the tap that lets the page open the microphone: asked for right now, inside the tap
        if (!(opt.edit && S.demo)) startP = micStart();
        close('start');
      } });
      if (!opt.edit) start.insertBefore(el('span', 'em', '🎤'), start.firstChild);
      start.id = 'qbStart'; start.setAttribute('data-start', ''); go.appendChild(start);
      var demoB = O.ui.button(opt.edit ? t('startOver') : t('tryDemo'), { kind: 'quiet', onPress: function () { if (!opt.edit) { S.demo = true; startP = Promise.resolve('demo'); } close(opt.edit ? 'restart' : 'demo'); } });
      demoB.id = opt.edit ? 'qbRestart' : 'qbDemo'; go.appendChild(demoB);
      function keys(e) {
        if (e.key === 'Tab') { var f = [].slice.call(card.querySelectorAll('button:not([tabindex="-1"]),input')).filter(function (b) { return b.offsetParent; }), i = f.indexOf(document.activeElement); e.preventDefault(); (f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length] || start).focus(); }
        if (e.key === ' ' || e.key === 'Escape' || e.key === 'p' || e.key === 'P') e.stopPropagation();
      }
      document.addEventListener('keydown', keys, true);
      O.ui.root().appendChild(wrap);
      setTimeout(function () { try { start.focus({ preventScroll: true }); } catch (e) { /* gone */ } }, 30);
      setupApi = { close: function () { if (setupOpen) start.click(); }, demo: function () { if (setupOpen) demoB.click(); } };
    });
  }
  function startCalib(onTick, onDone) { S.calib = { samples: [], left: 3, onTick: onTick, onDone: onDone }; }
  /** the microphone stopped (or went quiet) mid-measure: nothing is kept, so a half-measured room can't set the line */
  function calibCancel() {
    var c = S.calib; if (!c) return; S.calib = null;
    if (c.onDone) c.onDone({ ok: false, why: 'noInput' });
  }
  function calibDone() {
    var c = S.calib; S.calib = null; if (!c) return;
    var r = CORE.calibrate(c.samples);
    if (!S.demo && S.screen === 'setup') micStop();
    if (c.onDone) c.onDone(r);
  }

  /* the no-mic card: why, how to fix it, and the demo. 'tap': the page wants one more tap (a tablet that kept audio
     asleep, or the prompt was left when the tab was hidden), which is not a refusal: Start listening asks again. */
  function noMic(st) {
    setScreen('nomic'); S.paused = true;
    var k = st === 'needsTap' || st === 'stopped' ? 'tap' : ['denied', 'nodevice', 'busy', 'unavailable', 'off'].indexOf(st) >= 0 ? st : 'unavailable';
    var wrap = el('div', 'qbs qbn'); wrap.dir = O.dir || 'ltr';
    var card = el('div', 'qbs-card'); wrap.appendChild(card); card.setAttribute('role', 'alertdialog'); card.setAttribute('aria-modal', 'true'); card.setAttribute('aria-labelledby', 'qbnH'); card.setAttribute('aria-describedby', 'qbnP');
    card.appendChild(el('div', 'big', k === 'off' ? '🎧' : '🎤'));
    var h = el('h2', '', t('noMic_' + k)); h.id = 'qbnH'; card.appendChild(h);
    var p = el('p', 'why', t('noMic_' + k + '_p')); p.id = 'qbnP'; card.appendChild(p);
    card.appendChild(el('p', 'privacy', '🔒 ' + t('privacy')));
    var go = el('div', 'go'); card.appendChild(go);
    function done() { wrap.remove(); }
    var again = O.ui.button(k === 'tap' ? t('startMic') : t('retry'), { kind: 'hot', big: true, icon: k === 'tap' ? 'play' : 'restart', onPress: function () {
      done(); setScreen('play'); micStart().then(function (s2) { if (s2 === 'on') { setDemo(false); S.paused = false; announce(t('ballsRest'), true); } else noMic(s2); });
    } });
    again.id = 'qbRetry';
    // in a classroom the demo is often the way forward: the same size as Try again, side by side when there is room
    var demo = O.ui.button(t('tryDemo'), { kind: 'go', big: true, icon: 'play', onPress: function () { done(); setScreen('play'); setDemo(true); S.paused = false; announce(t('ballsRest'), true); } });
    demo.id = 'qbDemo';
    go.append(again, demo);
    O.ui.root().appendChild(wrap);
    setTimeout(function () { try { (k === 'off' ? demo : again).focus({ preventScroll: true }); } catch (e) { /* gone */ } }, 30);
  }

  /* pause: our button, Space, P or Esc, a hidden page, or the page's Stop. The microphone is off while paused. */
  var pauseOpen = false;
  function pauseGame(why) {
    if (S.screen !== 'play' || S.paused || S.ended) return;
    S.paused = true; micStop(); setScreen('play'); R.root.classList.add('paused');
    pauseOpen = true;
    announce(t('paused'), true);
    O.ui.pause().then(function (r) {
      pauseOpen = false; R.root.classList.remove('paused');
      if (r === 'restart') { newSession(); resume(); }
      else if (r === 'quit') teacherSettings(true);
      else resume();
    });
  }
  function resume() {
    if (S.demo) { S.paused = false; return; }
    // Resume is a tap: the page may open the microphone again
    micStart().then(function (st) { if (st === 'on') S.paused = false; else noMic(st); });
  }
  function teacherSettings(fromPause) {
    if (S.screen !== 'play' || S.ended) return;
    S.paused = true; micStop();
    setupCard({ edit: true }).then(function (how) {
      setScreen('play');
      if (how === 'restart') newSession();
      if (S.core) S.core.goal = CFG.goal;
      var p = startP; startP = null;
      if (S.demo) { S.paused = false; return; }
      (p || micStart()).then(function (st) { if (st === 'on') S.paused = false; else noMic(st); });
    });
  }
  document.addEventListener('keydown', function (e) {
    if (setupOpen || pauseOpen || S.screen !== 'play' || S.ended) return;
    if (O.ui.open) return;
    var tg = e.target && e.target.tagName;
    if (e.code === 'Space' && (tg === 'BUTTON' || tg === 'INPUT')) return;
    if (e.code === 'Space' || e.key === 'p' || e.key === 'P' || e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); pauseGame('key'); }
  }, true);
  document.addEventListener('visibilitychange', function () { if (document.hidden) pauseGame('hidden'); });

  /* the happy ending: the balls hop all together, a chime and confetti, then the results card */
  function celebrate() {
    S.ended = true; micStop(); setScreen('end'); A.celebrate = now(); A.hops = 0;
    R.bubble.hidden = true;
    announce(t('endTitle'), true);
    setTimeout(function () { snd('chime'); sfx('win'); confetti(); }, 300);
    try { if (window.BRB) BRB.gameOver({ won: true, score: null }); } catch (e) { /* offline */ }
    setTimeout(results, A.skip ? 50 : 3000);
  }
  function results() {
    document.documentElement.classList.add('qb-ended');
    var c = S.core, stars = CORE.stars(c ? c.bounces : 0);
    var done = O.ui.win({ stars: stars, title: t('endTitle'), next: false, hero: false });
    setTimeout(function () {
      var card = document.querySelector('.ok-win .ok-card');
      if (card && !card.querySelector('.qb-stats')) {
        // "Great quiet work!" and the quiet time and big bounces as two big numbers, like the clock
        var box = el('div', 'qb-end'), sub = el('p', 'sub', t('endSub')), st = el('div', 'qb-stats');
        st.setAttribute('role', 'group'); st.setAttribute('aria-label', t('endStats', { time: clock(c ? c.quiet : 0), n: c ? c.bounces : 0 }));
        [[clock(c ? c.quiet : 0), '🤫 ' + t('quietTime')], [O.num(c ? c.bounces : 0), '💥 ' + t('bigBounces')]].forEach(function (x) {
          var b = el('div', 'qb-stat'), n = el('div', 'n', x[0]); n.dir = 'ltr'; b.append(n, el('div', 'l', x[1])); st.appendChild(b);
        });
        box.append(sub, st);
        var sp = card.querySelector('.ok-sparks'); if (sp && sp.nextSibling) card.insertBefore(box, sp.nextSibling); else card.appendChild(box);
        // "Another quiet time" (the setup card again) and "Same settings" (straight back to the jar)
        var again = card.querySelector('.ok-row .ok-btn');
        if (again) {
          var tx = again.lastChild; if (tx && tx.nodeType === 3) tx.nodeValue = t('another');
          again.classList.remove('ok-hot'); again.classList.add('ok-quiet'); again.classList.remove('ok-big');
          var same = O.ui.button(t('sameSettings'), { kind: 'hot', big: true, icon: 'play', onPress: function () {
            S.same = true; if (!S.demo) startP = micStart();   // inside the tap: the page may listen again
            again.click();
          } });
          same.id = 'qbSame'; again.parentNode.insertBefore(same, again);
          setTimeout(function () { try { same.focus({ preventScroll: true }); } catch (e) { /* gone */ } }, 60);
        }
      }
      layout(); setTimeout(layout, 450);
    }, 0);
    Promise.resolve(done).then(function () {
      document.documentElement.classList.remove('qb-ended', 'qb-side', 'qb-low');
      A.celebrate = null; S.core = null;
      if (S.same) { S.same = false; begin(); return; }
      startP = null; setScreen('setup');
      setupCard().then(function () { begin(); });
    });
  }

  /* ---------- the kit game: the title over our resting jar, then the setup card ---------- */
  var SET = ['          ', '          ', '          ', '          ', 'P         ', '##########'];
  O.game({
    api: 1, title: t('title'), subtitle: t('tag'), titleHue: 'mint',
    controls: 'none', camera: 'fixed', hero: 'me', hud: [], countdown: 0,
    level: O.level.grid(SET, {}),
    intro: function () { return setupCard(); },
    setup: function () { build(); },
    testState: function () { return testState(); },
    on: { start: function () { begin(); }, title: function () { build(); setScreen('title'); } },
  });
  build();
  requestAnimationFrame(frame);

  /* ---------- test hooks (the covers, the e2e tests, the playtest) ---------- */
  function testState() {
    var c = S.core, top = ART.topOf(JAR);
    return { bounce: true, screen: S.screen, state: c ? c.state : 'rest', bounces: c ? c.bounces : 0, quiet: c ? Math.round(c.quiet * 10) / 10 : 0, goal: CFG.goal,
      line: lineNow(), level: Math.round(S.level * 10) / 10, held: heldNow(), mic: S.mic, demo: S.demo, preset: CFG.preset, fine: CFG.fine, base: CFG.base,
      paused: S.paused, stars: c ? CORE.stars(c.bounces) : 3, bubble: !!R.bubble && !R.bubble.hidden, mark: !!R.mark && !R.mark.hidden, calibrated: CFG.calibrated,
      measuring: measuring(), saved: load(), balls: JAR.balls.length, rise: Math.round(JAR.rest - top), lidHits: JAR.lidHits, face: lookNow().face };
  }
  Object.assign(window.__brbTest, {
    state: function () { return testState(); },
    setup: function (o) { o = o || {}; if (CORE.PRESET_IDS.indexOf(o.preset) >= 0) CFG.preset = o.preset; if (o.fine != null) CFG.fine = Math.max(-25, Math.min(25, +o.fine || 0)); if (o.goal != null) CFG.goal = Math.max(0, +o.goal || 0); if (o.base != null) { CFG.base = +o.base; CFG.calibrated = true; } return testState(); },
    closeSetup: function () { if (setupApi) setupApi.close(); return true; },
    demoStart: function () { if (setupApi) setupApi.demo(); return true; },
    demo: function (on) { if (S.screen === 'play' || S.screen === 'nomic') { var n = document.querySelector('.qbn'); if (n) n.remove(); setScreen('play'); setDemo(on !== false); S.paused = false; } else S.demo = on !== false; return testState(); },
    level: function (v) { S.forced = v == null ? null : Math.max(0, Math.min(100, +v)); if (v != null) { S.level = S.forced; S.peak = S.forced; } return testState(); },
    setGoal: function (sec) { CFG.goal = Math.max(0, +sec || 0); if (S.core) S.core.goal = CFG.goal; return testState(); },
    step: function (ms) { var n = Math.ceil((+ms || 0) / 50); for (var i = 0; i < n; i++) { if (S.heldUntil > now()) S.heldUntil -= 50; tick(0.05); } return testState(); },
    skipAnimations: function () { A.skip = true; return true; },
    calibrate: function (samples) { var r = CORE.calibrate(samples || []); if (r.ok) { CFG.base = r.base; CFG.calibrated = true; } return Object.assign({ line: lineNow() }, r); },
    sounds: function () { return S.sounds.slice(); },
    pause: function () { pauseGame('test'); return testState(); },
  });
})();
</script>
