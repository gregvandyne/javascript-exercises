<title>Garden Count</title>
<!-- Garden Count: Number Quest Launchpad Unit 1, The Counting Patch (kindergarten, ages 5-6). A calm counting garden
     on Oomba3D 1.1.0 in the Medieval Village theme. Three chapters of six rounds, one per course step:
       count   (1.1) pick the asked number of apples into the basket, each one counted aloud, then Done;
       compare (1.2) which bed has more or fewer, or are they the same: rows matched one to one, then numbers to 10;
       teens   (1.3) a ten-frame and loose ones: make a teen number, or say how many, always "10 and 4 make 14".
     Made for a child who cannot read yet: every instruction is one short sentence, shown and spoken (BRB.speak, the
     shared path; the speaker button says it again), the numbers are big, and everything is done by tapping big
     targets. No timer, no lives, no fail state: a wrong tap gets a small wobble and a spoken hint, then another try.
     Lesson mode: BRB.params { chapter: count | compare | teens, lock: 1 } opens that chapter only; finishing its six
     rounds reports game over, won, once (the course step's completion signal). With no parameters the game
     offers the three chapters from a picture menu. Saves only which chapters are finished (BRB.storage
     'garden-count-v1'). The import map below is exactly kit2ImportMap() (server/services/vendor.js);
     tests/unit/garden-count.test.js fails if a library bump leaves it behind. English only, like Number Quest's other
     lesson games. Test handle: window.__gc (also window.__brbTest, the name the picture scripts wait for). -->

/* ===== Garden Count's rounds: plain data and functions (no DOM, no 3D), so tests/unit/garden-count.test.js can run
   this block on its own. A round is made from its chapter, its number (1-6) and the lap (0 the first time through,

  var TEENS = [[11, 13], [13, 16], [15, 19], [11, 14], [13, 17], [15, 19]];

// Moving things: a short hop from where a thing is to where it belongs (none with reduced motion).
const tweens = [];
function fly(o, to, { dur = 0.42, arc = 1.1, from } = {}) {
  for (let i = tweens.length - 1; i >= 0; i--) if (tweens[i].o === o) tweens.splice(i, 1);
  if (reduced || S.fast) { o.position.copy(to); return; }
  tweens.push({ o, from: (from || o.position).clone(), to: to.clone(), t: 0, dur, arc });
}
function pop(o) { if (reduced || S.fast) return; o.scale.setScalar(0.01); tweens.push({ o, pop: true, t: 0, dur: 0.3 }); }
g.onUpdate(dt => {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const w = tweens[i]; w.t = Math.min(1, w.t + dt / w.dur);
    const k = w.t * w.t * (3 - 2 * w.t);

    else { w.o.position.lerpVectors(w.from, w.to, k); w.o.position.y += Math.sin(Math.PI * k) * w.arc; }
    if (w.t >= 1) tweens.splice(i, 1);

/* ---------- where things go: one layout for wide screens, one for tall phones ---------- */
const PITCH = 1.15, TOP = 0.16;
const portrait = () => innerWidth < innerHeight * 0.9;
let tall = portrait();
const LAY = {
  heroes: () => (tall
    ? { spots: [[-2.5, -2.3], [0, -2.3], [2.5, -2.3], [-1.25, 1.7], [1.25, 1.7]], rect: [-3.7, 3.7, -3.1, 2.6], high: 3.4, tilt: 0.8 }

  // count: the garden bed and the basket, each just big enough for the round's apples (the basket in rows of five)
  count: R => {
    const cols = tall ? 5 : 6, gRows = Math.max(2, Math.ceil(R.total / cols)), bRows = Math.max(2, Math.ceil(R.total / 5));

    return { cols, gRows, bRows, garden: [-wide / 2 + PITCH / 2, z], basket: [bx, z], rect: [-wide / 2 - 0.4, wide / 2 + 0.8, z - 0.9, -z + 1.1], hero: [bx + 2 * PITCH, z - 2.3] };
  },
  // compare: two beds side by side in rows (wide) or in columns going away (tall), so partners sit next to each other

    return { n, a: i => [x0 + i * PITCH, -1.05], b: i => [x0 + i * PITCH, 1.05], signA: [x0 - 1.9, -1.05], signB: [x0 - 1.9, 1.05], beds: [[0.9, -1.05, len + 0.3, 1.3], [0.9, 1.05, len + 0.3, 1.3]], rect: [x0 - 2.9, x0 + (n - 1) * PITCH + 0.9, -1.9, 1.9], hero: [0.9, -4.2] };
  },
  teens: () => (tall
    ? { frame: [-2.3, -2.4], loose: [-2.3, 1.1], rect: [-3.3, 3.3, -3.4, 3.1], hero: [0, -5.6] }

};

// The camera looks down on the garden and backs off until the play area (and the helper) fits between the words
// at the top and the buttons at the bottom, on any screen shape.
const view = { rect: [-6, 6, -2, 2], high: 0, hero: null, tilt: 0.8 };   // tilt: radians above the ground
function frame() {
  if (!g) return;
  const cam = g.camera, [x0, x1, z0, z1] = view.rect, Wd = innerWidth, Hd = innerHeight;
  const topPx = (S.screen === 'play' ? el.line.getBoundingClientRect().bottom : Hd * 0.2) + 6;   // the words, the big number and the round dots
  const botPx = (el.bar.hidden ? (S.screen === 'play' ? 12 : Hd * 0.24) : Hd - el.bar.getBoundingClientRect().top) + 10;
  const safe = { l: -1 + 16 / Wd, r: 1 - 16 / Wd, t: 1 - 2 * topPx / Hd, b: -1 + 2 * botPx / Hd };
  const pts = [];
  for (const x of [x0, x1]) for (const z of [z0, z1]) pts.push(V3(x, 0, z), V3(x, 1, z));
  if (view.hero) pts.push(V3(view.hero[0] - 1, 0, view.hero[1]), V3(view.hero[0] + 1, 2.6, view.hero[1]));
  if (view.high) pts.push(V3(x0, view.high, z0), V3(x1, view.high, z0));
  const look = V3((x0 + x1) / 2, 0, (z0 + z1) / 2), v = V3(0, 0, 0);
  let d = 18; const TILT = view.tilt;
  if (cam.fov !== 42) { cam.fov = 42; cam.updateProjectionMatrix(); }   // a long lens on every screen shape: rows stay rows, far apples stay apple-sized
  for (let i = 0; i < 16; i++) {
    cam.position.set(look.x, look.y + Math.sin(TILT) * d, look.z + Math.cos(TILT) * d); cam.lookAt(look); cam.updateMatrixWorld(true);
    let a = 9, b = -9, c = 9, e = -9;
    for (const p of pts) { v.copy(p).project(cam); a = Math.min(a, v.x); b = Math.max(b, v.x); c = Math.min(c, v.y); e = Math.max(e, v.y); }
    const k = Math.max((b - a) / (safe.r - safe.l), (e - c) / (safe.t - safe.b));
    const half = d * Math.tan(cam.fov * Math.PI / 360);
    look.z += ((e + c) / 2 - (safe.t + safe.b) / 2) * half / Math.sin(TILT) * -0.9;
    d = Math.max(6, Math.min(90, d * (0.35 + 0.65 * k)));
  }
  cam.position.set(look.x, look.y + Math.sin(TILT) * d, look.z + Math.cos(TILT) * d); cam.lookAt(look);
}
addEventListener('resize', () => { const t = portrait(); if (t !== tall) { tall = t; redraw(); } frame(); });

/* ---------- tapping things in the garden: the nearest target under the finger, with a generous reach ---------- */
const targets = [];   // { at: () => Vector3, r: world radius, go }
g.renderer.domElement.addEventListener('pointerdown', ev => {
  const cam = g.camera, r = g.renderer.domElement.getBoundingClientRect(), v = V3(0, 0, 0), right = V3(1, 0, 0).applyQuaternion(cam.quaternion);
  const px = p => { v.copy(p).project(cam); return [(v.x + 1) / 2 * r.width + r.left, (1 - v.y) / 2 * r.height + r.top]; };
  let best = null, bd = 1e9;

    const p = t.at(), [sx, sy] = px(p), [ex, ey] = px(p.clone().addScaledVector(right, t.r));
    const reach = Math.max(26, Math.hypot(ex - sx, ey - sy) * 1.25), dist = Math.hypot(sx - ev.clientX, sy - ev.clientY);
    if (dist <= reach && dist < bd) { bd = dist; best = t; }

/* ---------- the helper ---------- */
let lineup = [];

    lineup = await Promise.all(HEROES.map(id => g.hero(id, { x: 0, y: 0, z: 0 })));

}

/* ---------- a chapter: six rounds ---------- */
function startChapter(chapter) {
  if (!GC.CHAPTERS.includes(chapter)) return showMenu();
  S.chapter = chapter; S.round = 0; S.screen = 'play'; el.card.hidden = true;
  if (S.hero) S.hero.play('idle');
  nextRound();
}
function dots() {
  el.dots.replaceChildren(...Array.from({ length: GC.ROUNDS }, (_, i) => { const d = document.createElement('i'); if (i < S.round - 1) d.className = 'on'; else if (i === S.round - 1) d.className = 'now'; return d; }));
  el.dots.setAttribute('aria-label', fmt('round', { n: S.round, m: GC.ROUNDS })); el.dots.hidden = false;
}
function nextRound() {
  clearTimers();

  S.round++; S.R = GC.round(S.chapter, S.round, S.lap); S.count = 0; S.phase = 'play'; S.basket = []; S.shown = false;
  hint(); dots(); redraw();
  const R = S.R;
  if (R.kind === 'count') ask('count.ask', { n: R.target });
  else if (R.kind === 'compare') ask(R.form === 'numbers' ? (R.same ? 'compare.num.same' : R.ask === 'more' ? 'compare.num.more' : 'compare.num.less') : (R.same ? 'compare.same' : 'compare.' + R.ask));
  else if (R.kind === 'make') ask('teens.make', { n: R.target });
  else ask('teens.howmany');
  frame();
}
/** The round is right: cheer, say what is true, then the next round (or the end). */
function right(key, vars) {
  S.phase = 'right'; hint();
  sfx('cheer'); heroMove('cheer', 1500);
  S.line = [key, vars]; el.askt.textContent = fmt(key, vars); speak(key, vars);
  later(S.R.kind === 'compare' && S.R.form === 'numbers' ? 2600 : 2000, nextRound);
}
function finish() {
  S.screen = 'end'; S.phase = 'idle'; S.done[S.chapter] = true; store();
  // The course step's completion signal: once for each chapter finished, never before its sixth round is right.
  S.reported++;
  try { if (window.BRB && BRB.gameOver) BRB.gameOver({ won: true }); } catch (e) { /* no page */ }
  clearStage(); placeHero([0, 0]); Object.assign(view, { rect: [-4, 4, -1.5, 1.5], high: 3.4, tilt: 0.5 });
  g.celebrate(S.hero, '');   // the cheer and the confetti; the words are on the card
  const buttons = [{ id: 'again', icon: '🔁', label: fmt('btn.again'), cls: 'go', go: () => { S.lap++; startChapter(S.chapter); } }];
  if (!S.lock) buttons.push({ id: 'menu', icon: '🌻', label: fmt('btn.menu'), go: showMenu });
  card('end', { title: fmt('win'), line: 'win.card', buttons, star: true });
  frame();
}

/** Draw the round from its state (also after the screen turns): the beds, the fruit, the buttons. */
function redraw() {
  if (S.screen === 'hero') return void showHeroes();
  if (S.screen !== 'play' || !S.R) return void frame();
  const keys = el.bar.contains(document.activeElement);
  clearStage();
  const R = S.R, L = LAY[S.chapter](R);
  Object.assign(view, { rect: L.rect, high: 0, tilt: 0.8 }); placeHero(L.hero);
  el.card.hidden = true; el.bar.hidden = false;
  if (R.kind === 'count') drawCount(R, L); else if (R.kind === 'compare') drawCompare(R, L); else drawTeens(R, L);
  if (keys) { const b = el.bar.querySelector('button'); if (b) b.focus(); }   // a keyboard player stays on the buttons
}
function showNum() { el.num.textContent = String(S.count); el.num.hidden = false; }
/** Too many: the helper hands them back one at a time, counting down, until the number asked for is left. */
function handBack(target, back, nowKey) {
  S.phase = 'busy';
  const step = () => {
    if (S.count > target) { back(); speak('n.' + S.count, null, { queue: true }); heroMove('use', 700); later(850, step); }
    else { S.phase = 'play'; hint(nowKey, { n: target }, { queue: true }); }
  };
  later(1500, step);
}

/* ----- chapter 1, count: pick the number asked for into the basket ----- */
function drawCount(R, L) {
  const gSlot = grid(L.garden, L.cols), bSlot = grid(L.basket, 5), gr = gridRect(L.garden, L.cols, L.gRows), br = gridRect(L.basket, 5, L.bRows);
  put(slab(gr[0], gr[1], gr[2], gr[3], TOP, M.soil));
  put(slab(br[0], br[1], br[2], br[3], TOP, M.tan));   // the basket: a pale floor with a wooden rim round it
  for (const [dx, dz, w, d] of [[0, -(br[3] + 0.3) / 2, br[2] + 0.6, 0.3], [0, (br[3] + 0.3) / 2, br[2] + 0.6, 0.3], [-(br[2] + 0.3) / 2, 0, 0.3, br[3]], [(br[2] + 0.3) / 2, 0, 0.3, br[3]]]) put(slab(br[0] + dx, br[1] + dz, w, d, TOP * 2.6, M.wood));
  const all = Array.from({ length: R.total }, (_, i) => { const f = put(fruit('apple')); f.userData.slot = i; f.position.copy(gSlot(i)); return f; });
  S.basket = S.basket.map(f => all[f.userData.slot]);   // the same apples after the screen turns
  S.basket.forEach((f, j) => f.position.copy(bSlot(j)));
  const settle = () => S.basket.forEach((f, j) => { if (f.position.distanceTo(bSlot(j)) > 0.01) fly(f, bSlot(j), { arc: 0.3 }); });
  const pick = f => {
    if (S.phase !== 'play') return;
    f = f || all.find(x => !S.basket.includes(x)); if (!f || S.basket.includes(f)) return;
    S.basket.push(f); S.count = S.basket.length; fly(f, bSlot(S.count - 1)); showNum(); sfx('coin'); heroMove('pickUp', 900); speak('n.' + S.count);
  };
  const back = (f, quiet) => {
    f = f || S.basket[S.basket.length - 1]; if (!f) return;
    S.basket.splice(S.basket.indexOf(f), 1); S.count = S.basket.length; fly(f, gSlot(f.userData.slot)); settle(); showNum();
    if (!quiet) speak('n.' + S.count);
  };
  const done = b => {
    if (S.phase !== 'play') return;
    if (S.count === R.target) return right('count.right', { n: R.target });
    wobble(b || document.getElementById('gc-done'));
    if (S.count < R.target) return hint('count.few', { n: R.target });
    hint('count.many'); handBack(R.target, () => back(null, true), 'count.now');
  };
  for (const f of all) targets.push({ at: fruitAt(f), r: 0.55, go: () => (S.basket.includes(f) ? (S.phase === 'play' && back(f)) : pick(f)) });
  S.act = { pick: () => pick(), back: () => S.phase === 'play' && back(), done: () => done() };
  S.basketIds = () => S.basket.map(f => f.userData.slot);
  el.bar.replaceChildren(
    button({ id: 'gc-pick', icon: '🍎', label: fmt('btn.pick'), cls: 'pick', go: () => pick() }),
    button({ id: 'gc-back', icon: '↩️', label: fmt('btn.back'), aria: fmt('btn.back.say'), go: () => S.phase === 'play' && back() }),
    button({ id: 'gc-done', icon: '✅', label: fmt('btn.done'), cls: 'go', go: done }));
  showNum(); el.sum.hidden = true;
}

/* ----- chapter 2, compare: which bed has more or fewer, or are they the same ----- */
function drawCompare(R, L) {
  for (const b of L.beds) put(slab(b[0], b[1], b[2], b[3], TOP, M.soil));
  const numbers = R.form === 'numbers';
  const fill = animate => {
    S.shown = true;
    for (const [kind, n, at] of [['apple', R.a, L.a], ['lemon', R.b, L.b]]) for (let i = 0; i < n; i++) { const f = put(fruit(kind)); const p = at(i); f.position.set(p[0], TOP, p[1]); if (animate) pop(f); }
  };
  const signs = () => { for (const [n, at] of [[R.a, L.signA], [R.b, L.signB]]) { const s = put(sign(n, tall ? 1.5 : 1.7)); s.position.set(at[0], 1.0, at[1]); } };
  if (!numbers || S.shown) fill(false);
  if (numbers || S.phase === 'right') signs();
  const answer = (x, b) => {
    if (S.phase !== 'play') return;
    if (x !== R.answer) {
      wobble(b || document.getElementById('gc-' + x));
      return hint(R.same && R.answer === 'same' ? 'compare.hint.same' : numbers ? 'compare.hint.num.' + (R.ask === 'more' ? 'more' : 'less') : 'compare.hint.' + R.ask);
    }
    if (numbers) fill(true); else signs();
    const hi = Math.max(R.a, R.b), lo = Math.min(R.a, R.b);
    if (R.answer === 'same') right('compare.right.same', { a: R.a, b: R.b });
    else if (R.ask === 'more') right('compare.right.more', { a: hi, b: lo });
    else right(numbers ? 'compare.right.less' : 'compare.right.fewer', { a: lo, b: hi });
  };
  // a tap anywhere along a bed picks it
  for (const [x, at] of [['a', L.a], ['b', L.b]]) for (let i = 0; i < L.n; i++) targets.push({ at: () => V3(at(i)[0], 0.5, at(i)[1]), r: 0.62, go: () => answer(x) });
  S.act = { answer: x => answer(x) };
  const bs = [button({ id: 'gc-a', icon: '🍎', big: numbers ? R.a : undefined, label: fmt('btn.apples'), aria: fmt('btn.apples') + (numbers ? ': ' + R.a : ''), go: b => answer('a', b) })];
  if (R.same) bs.push(button({ id: 'gc-same', icon: '🟰', label: fmt('btn.same'), go: b => answer('same', b) }));
  bs.push(button({ id: 'gc-b', icon: '🍋', big: numbers ? R.b : undefined, label: fmt('btn.lemons'), aria: fmt('btn.lemons') + (numbers ? ': ' + R.b : ''), go: b => answer('b', b) }));
  el.bar.replaceChildren(...bs);
  el.num.hidden = true; el.sum.hidden = true;
}

/* ----- chapter 3, teens: a full ten and some more ones ----- */
function drawTeens(R, L) {
  const fSlot = grid(L.frame, 5), lSlot = grid(L.loose, 5), fr = gridRect(L.frame, 5, 2), lr = gridRect(L.loose, 5, 2);
  put(slab(fr[0], fr[1], fr[2] + 0.1, fr[3] + 0.1, TOP * 0.7, M.inkFlat));
  for (let i = 0; i < 10; i++) { const p = fSlot(i), c = new THREE.Mesh(GEO.box, M.cream); c.scale.set(PITCH - 0.12, TOP, PITCH - 0.12); c.position.set(p.x, TOP / 2, p.z); c.receiveShadow = true; put(c); }
  put(slab(lr[0], lr[1], lr[2], lr[3], TOP * 0.5, M.soil));
  const slot = i => (i < 10 ? fSlot(i) : lSlot(i - 10).setY(TOP * 0.5));
  const fruits = [];
  const sum = () => {
    const n = S.count;
    el.sum.textContent = n > 10 ? fmt('teens.sum', { a: 10, b: n - 10, c: n }).replace(/\.$/, '') : n === 10 ? '10' : '';
    el.sum.hidden = !el.sum.textContent; showNum();
  };
  const set = (n, animate) => {
    n = Math.max(0, Math.min(20, n));
    while (fruits.length > n) stage.remove(fruits.pop());
    while (fruits.length < n) { const f = put(fruit('apple')); f.position.copy(slot(fruits.length)); if (animate) pop(f); fruits.push(f); }
    S.count = n; sum();
  };
  if (R.kind === 'howmany') {
    S.count = R.target; set(R.target, false); el.num.hidden = true; el.sum.hidden = true;
    const answer = (v, b) => {
      if (S.phase !== 'play') return;
      if (v !== R.target) { wobble(b || document.getElementById('gc-n' + v)); return hint('teens.hint'); }
      el.sum.textContent = fmt('teens.sum', { a: 10, b: R.target - 10, c: R.target }).replace(/\.$/, ''); el.sum.hidden = false;
      right('teens.sum', { a: 10, b: R.target - 10, c: R.target });
    };
    S.act = { answer: v => answer(v) };
    el.bar.replaceChildren(...R.choices.map(v => button({ id: 'gc-n' + v, big: v, go: b => answer(v, b) })));
    return;
  }
  set(S.count, false);
  const fill = b => {
    if (S.phase !== 'play') return;
    if (S.count >= 10) { wobble(b || document.getElementById('gc-fill')); return hint('teens.full'); }
    set(10, true); sfx('coin'); heroMove('pickUp', 900); speak('n.10');
  };
  const one = () => { if (S.phase !== 'play' || S.count >= 20) return; set(S.count + 1, true); sfx('coin'); speak('n.' + S.count); };
  const back = quiet => { if (S.count <= 0) return; set(S.count - 1, false); if (!quiet) speak('n.' + S.count); };
  const done = b => {
    if (S.phase !== 'play') return;
    if (S.count === R.target) return right('teens.sum', { a: 10, b: R.target - 10, c: R.target });
    wobble(b || document.getElementById('gc-done'));
    if (S.count < R.target) return hint('teens.few', { n: R.target });
    hint('teens.many'); handBack(R.target, () => back(true), 'teens.now');
  };
  for (let i = 0; i < 10; i++) targets.push({ at: () => fSlot(i).setY(0.4), r: 0.6, go: () => (S.count < 10 ? fill() : null) });
  S.act = { fill: () => fill(), one, back: () => S.phase === 'play' && back(), done: () => done() };
  el.bar.replaceChildren(
    button({ id: 'gc-fill', icon: '🔟', label: fmt('btn.fill'), cls: 'pick', go: fill }),
    button({ id: 'gc-one', icon: '🍎', label: fmt('btn.one'), cls: 'pick', go: one }),
    button({ id: 'gc-back', icon: '↩️', label: fmt('btn.back'), aria: fmt('btn.back.say'), go: () => S.phase === 'play' && back() }),
    button({ id: 'gc-done', icon: '✅', label: fmt('btn.done'), cls: 'go', go: done }));
}

/* ---------- the test handle: what the round asks and what is on screen (tests, covers, slide pictures) ---------- */
window.__gc = window.__brbTest = {
  state: () => ({ game: 'garden-count', screen: S.screen, chapter: S.chapter, lock: S.lock, round: S.round, rounds: GC.ROUNDS, phase: S.phase, count: S.count, hero: S.hero ? S.hero.id : null,
    reported: S.reported, tall, ...(S.R && S.screen === 'play' ? { kind: S.R.kind, target: S.R.target, answer: S.R.answer, ask: S.R.ask, form: S.R.form, same: S.R.same, a: S.R.a, b: S.R.b, choices: S.R.choices, total: S.R.total } : {}) }),
  fast: on => { S.fast = on !== false; },
  hero: id => chooseHero(id || HEROES[0]),
  act: (name, arg) => (S.act && S.act[name] ? S.act[name](arg) : undefined),
};

el.load.hidden = true; el.load.remove(); el.gc.hidden = false;
await showHeroes();
window.__ready = true;
</script>
