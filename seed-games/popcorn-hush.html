<title>Popcorn Hush</title>
<style>
/* Popcorn Hush on the Oomba Kit: a classroom noise meter. A cheerful pot full of golden kernels sits on a little stove
   with a striped bowl beside it. While the class keeps quiet the kernels rest and the quiet-time clock runs; near the
   line the heat glows and the kernels sizzle; too loud for too long and the popcorn POPS (the pot gets flustered, the
   clock stops) until the room has been calm for a few seconds. The play page measures how loud the room is and passes
   the game one number at a time (BRB.loudness); nothing is recorded. Screens: the kit's title (the calm pot behind it)
   -> the setup card (how quiet, the goal, the room's quiet, the privacy note) -> the kitchen with the gauge and the
   quiet-time clock -> the kit's results card. Layout: landscape (projector, laptop, tablet on its side) puts the gauge
   on the right edge; portrait puts it along the bottom and the bowl in front of the stove. Colour is never the only
   cue: each zone has an icon and the loud zone stripes. */
html,body{height:100%}
body{margin:0;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.ok-hud{display:none!important}
.ph,.ph *,.phs,.phs *{box-sizing:border-box}
.ph{position:fixed;inset:0;overflow:hidden;color:var(--ok-text);font-family:var(--ok-font,system-ui,sans-serif);--top:110px;
  --ink:#141414;--calm:#66C792;--near:#FFD23F;--loud:#E8483C;--card:#FFFDF2;background:#FFF3DC}
.ok-night .ph{background:#1E2A33}
.ph button{font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ph-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}
/* the kitchen, the pot, the bowl and the popcorn: one canvas, drawn every frame by our own loop */
.ph-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
/* the top bar: the quiet-time clock in the middle, pause and teacher settings at the end */
.ph-top{position:absolute;inset-inline:0;top:0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));pointer-events:none}
.ph-top>*{pointer-events:auto}
.ph-spacer{pointer-events:none}
.ph-clock{justify-self:center;display:flex;flex-direction:column;align-items:center;padding:6px 22px 8px;border-radius:24px;background:var(--card);color:var(--ink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);min-width:min(300px,48vw)}
.ph-clock .lab{font-weight:800;font-size:clamp(.95rem,min(2.2vw,2.6vh),1.7rem);line-height:1.1;display:flex;align-items:center;gap:6px}
.ph-clock .lab::before{content:'🤫';font-size:.95em}
.ph-clock.stopped .lab::before{content:'⏸️'}
.ph-clock .time{font-weight:900;font-size:clamp(34px,min(8vw,8.4vh),118px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ph-clock .sub{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:clamp(.85rem,min(1.8vw,2.2vh),1.5rem);opacity:.85}
.ph-clock .pops::before{content:'💥 '}.ph-clock .corn::before{content:'🍿 '}
.ph-clock.run .time{color:#2E8B4A}
/* popping: the clock visibly stops (grey, a stop badge, a red edge) */
.ph-clock.stopped{border-color:#C93A2F;box-shadow:0 5px 0 #C93A2F}
.ph-clock.stopped .time{color:#8A8A8A}
.ph-clock.stopped .lab{color:#C93A2F}
/* the way to the goal: a bar that fills while the class keeps the popcorn calm */
.ph-clock .bar{width:100%;height:clamp(8px,1.2vh,14px);border-radius:999px;border:2.5px solid var(--ink);background:#EDE6D2;overflow:hidden;margin:4px 0 2px}
.ph-clock .bar i{display:block;height:100%;width:0;background:var(--calm);transition:width .4s}
.ph-clock.stopped .bar i{background:#B9B9B9}
.ph-btns{justify-self:end;display:flex;gap:8px}
/* the kit fills its gear with --ok-icon-card (dark at night): these buttons stay light, so the gear does too */
.ph-ib{width:clamp(48px,min(6vw,7vh),76px);height:clamp(48px,min(6vw,7vh),76px);border-radius:18px;border:3px solid var(--ink);background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;padding:0;--ok-icon-card:var(--card)}
/* "Listening (only how loud)": the microphone is on (the page's own pill says so too, with Stop) */
.ph-chip{display:flex;align-items:center;gap:8px;height:clamp(48px,min(6vw,7vh),76px);padding:0 16px;border-radius:18px;border:3px solid var(--ink);background:#C93A2F;color:#fff;box-shadow:0 4px 0 var(--ink);
  font-weight:800;font-size:clamp(.85rem,min(1.35vw,2.2vh),1.4rem);white-space:nowrap}
.ph-chip .dot{flex:none;width:.75em;height:.75em;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35);animation:phBlink 1.4s ease-in-out infinite}
@keyframes phBlink{50%{opacity:.35}}
.ok-rm .ph-chip .dot{animation:none}
@media (max-width:900px){.ph-chip .tx{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.ph-chip{padding:0;width:clamp(48px,min(6vw,7vh),76px);justify-content:center}.ph-chip .dot{display:none}}
.ph-ib svg{width:55%;height:55%}
.ph-ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ph button:focus-visible,.ph input:focus-visible{outline:4px solid var(--ok-focus,#2E7CF6);outline-offset:3px}
.ph:not(.playing) .ph-top,.ph:not(.playing) .ph-gauge,.ph:not(.playing) .ph-demo{visibility:hidden}

/* the gauge (landscape: up the right edge) */
.ph-gauge{position:absolute;right:calc(18px + env(safe-area-inset-right));top:calc(var(--top) + 30px);bottom:calc(40px + env(safe-area-inset-bottom));width:clamp(56px,6.4vw,124px);
  display:flex;flex-direction:column;align-items:center;gap:8px}
.g-track{position:relative;flex:1;width:100%;border-radius:999px;border:4px solid var(--ink);background:#FFFDF5;overflow:hidden;box-shadow:0 5px 0 var(--ink)}
.g-zone{position:absolute;left:0;right:0;bottom:0;opacity:.38}
.g-calm{background:var(--calm)}.g-near{background:var(--near)}
.g-loud{background:var(--loud);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 8px,transparent 8px 16px)}
.g-fill{position:absolute;left:0;right:0;bottom:0;transition:background-color .2s}
.g-fill.calm{background:var(--calm)}.g-fill.near{background:var(--near)}
.g-fill.loud{background:var(--loud);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 8px,transparent 8px 16px)}
.g-peak{position:absolute;left:0;right:0;height:5px;margin-bottom:-2px;background:var(--ink);opacity:.6}
.g-line{position:absolute;left:-4px;right:-4px;height:8px;margin-bottom:-4px;background:var(--ink)}
.g-ic{flex:none;width:clamp(44px,min(5vw,7vh),96px);height:clamp(44px,min(5vw,7vh),96px);line-height:0}.g-ic svg{width:100%;height:100%;display:block;overflow:visible}
/* the zones named inside the track: Shh, Getting loud (the "Too loud" tag marks the line) */
.g-lab{position:absolute;left:3px;right:3px;transform:translateY(50%);z-index:2;text-align:center;font-weight:900;font-size:clamp(.7rem,min(1.15vw,1.9vh),1.4rem);line-height:1.05;color:var(--ink);
  text-shadow:0 0 3px #FFFDF5,0 0 3px #FFFDF5,0 0 2px #FFFDF5;pointer-events:none;overflow-wrap:anywhere;hyphens:auto}
.g-line{z-index:3}.g-peak{z-index:1}
.ph-gauge.near .g-line{animation:phLine .6s ease-in-out infinite alternate}
@keyframes phLine{from{box-shadow:0 0 0 0 rgba(232,72,60,0)}to{box-shadow:0 0 0 7px rgba(232,72,60,.8)}}
.ok-rm .ph-gauge.near .g-line{animation:none;box-shadow:0 0 0 5px rgba(232,72,60,.8)}
.g-tag{position:absolute;right:calc(100% + 8px);transform:translateY(-50%);display:flex;align-items:center;gap:4px;white-space:nowrap;padding:4px 12px;border-radius:999px;
  background:var(--loud);color:#fff;border:3px solid var(--ink);font-weight:800;font-size:clamp(.9rem,min(1.6vw,2.4vh),1.5rem);box-shadow:0 3px 0 var(--ink)}
/* while the pot's own sounds play the meter is not listening: the note sits where the "Too loud" tag is (the tag hides) */
.g-held{position:absolute;right:calc(100% + 8px);transform:translateY(-50%);white-space:nowrap;padding:4px 12px;border-radius:999px;background:var(--card);color:var(--ink);border:3px solid var(--ink);font-weight:800;
  font-size:clamp(.9rem,min(1.6vw,2.4vh),1.5rem);box-shadow:0 3px 0 var(--ink)}
.ph-gauge.held .g-track{opacity:.55}
.ph-gauge.loud .g-track{animation:phThrob .8s ease-in-out infinite}
@keyframes phThrob{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.ok-rm .ph-gauge.loud .g-track{animation:none}

/* portrait: the gauge lies along the bottom */
.ph.portrait .ph-gauge{left:calc(16px + env(safe-area-inset-left));right:calc(16px + env(safe-area-inset-right));top:auto;bottom:calc(64px + env(safe-area-inset-bottom));width:auto;height:58px;flex-direction:row}
.ph.portrait .g-track{height:100%;flex:1;width:auto}
.ph.portrait .g-zone,.ph.portrait .g-fill{top:0;bottom:0;left:0}
.ph.portrait .g-lab{top:50%;bottom:auto;left:auto;right:auto;transform:translate(-50%,-50%);white-space:nowrap}
.ph.portrait .g-peak{top:0;bottom:0;width:5px;height:auto;margin:0 -2px}
.ph.portrait .g-line{top:-4px;bottom:-4px;width:8px;height:auto;margin:0 -4px}
.ph.portrait .g-tag{right:auto;bottom:calc(100% + 8px);transform:translateX(-50%)}
.ph.portrait .g-held{right:auto;bottom:calc(100% + 8px);transform:translateX(-50%)}
.ph.portrait .g-icbot{order:-1}.ph.portrait .g-ictop{order:3}
.ph.portrait.demo .ph-gauge{bottom:calc(158px + env(safe-area-inset-bottom))}

/* "Too loud!" over the pot while it pops, and the big "!" while the kernels sizzle */
.ph-bubble{position:absolute;transform:translate(-50%,-100%);padding:10px 22px;border-radius:26px;background:var(--card);color:var(--ink);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);
  font-weight:900;font-size:clamp(1.3rem,min(3.4vw,5vh),3.4rem);white-space:nowrap;pointer-events:none}
.ph-bubble::after{content:'';position:absolute;left:24%;bottom:-18px;border:14px solid transparent;border-top:18px solid var(--ink);border-bottom:0}
.ph-bubble.pop{animation:phPop .42s cubic-bezier(.34,1.56,.64,1) both}
/* sizzling, readable from the back of the room: a big "!" over the lid for as long as it sizzles, and a warm tint */
.ph-mark{position:absolute;transform:translate(-50%,-100%);font-weight:900;font-size:clamp(56px,10vh,124px);line-height:1;color:#FFC83D;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;pointer-events:none}
.ph-mark.wob{animation:phWob 1.1s ease-in-out infinite}
@keyframes phWob{0%,100%{transform:translate(-50%,-100%) rotate(-7deg)}50%{transform:translate(-50%,-104%) rotate(7deg)}}
.ph-tint{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 80% at 50% 70%,rgba(255,190,70,.1),rgba(255,150,30,.34));opacity:0;transition:opacity .6s}
.ph.stir .ph-tint{opacity:1}
.ph.hot .ph-tint{opacity:1;background:radial-gradient(ellipse 70% 80% at 50% 70%,rgba(255,120,60,.12),rgba(232,72,60,.38))}
.ph-mark.pop{animation:phPop .35s cubic-bezier(.34,1.56,.64,1) both}
@keyframes phPop{from{transform:translate(-50%,-100%) scale(.2);opacity:0}to{transform:translate(-50%,-100%) scale(1);opacity:1}}
.ok-rm .ph-bubble.pop,.ok-rm .ph-mark.pop,.ok-rm .ph-mark.wob{animation:none}

/* demo mode: the stand-in for the room */
.ph-demo{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  padding:10px 14px;border-radius:24px;background:var(--card);color:var(--ink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);max-width:calc(100vw - 32px);width:max-content}
.ph-ribbon{font-weight:900;padding:4px 12px;border-radius:999px;background:#B27CF0;color:#fff;border:3px solid var(--ink);text-transform:uppercase;letter-spacing:.05em;font-size:.9rem}
.ph-noise{display:flex;align-items:center;gap:8px;font-weight:800}
.ph-noise input{width:clamp(140px,22vw,320px);height:44px;accent-color:#E8483C;margin:0}
.ph-db{min-height:48px;padding:4px 16px;border-radius:16px;border:3px solid var(--ink);background:#FFE7A0;color:var(--ink);font-weight:800;font-size:1rem;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--ink)}
.ph-db[aria-pressed="true"]{background:#5DB548;color:#fff}
.ph-db .em{font-size:1.3em}
.ph.portrait .ph-demo{width:calc(100vw - 32px);max-width:560px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;padding:8px 10px}
.ph.portrait .ph-noise .tx{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ph.portrait .ph-noise input{width:100%}
.ph.portrait .ph-demo .ph-db{justify-content:center}
.ph.portrait .ph-ribbon{align-self:center}
/* a narrow screen: a smaller clock, the two buttons stacked at the end */
@media (max-width:600px){
  .ph-clock{min-width:0;padding:4px 12px 6px;border-radius:18px}
  .ph-clock .sub{gap:2px 8px;font-size:.8rem}
  .ph-btns{flex-direction:column}
}

/* the setup card and the no-mic card */
.phs{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));background:var(--ok-scrim)}
.phs-card{width:min(860px,100%);max-height:100%;overflow:auto;background:var(--ok-card);color:var(--ok-text);border:3px solid var(--ok-edge);border-radius:28px;box-shadow:0 6px 0 var(--ok-edge);
  padding:16px 18px;display:grid;gap:12px 18px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"h h" "l r" "f f"}
.phs h2{grid-area:h;margin:0;text-align:center;font-size:clamp(1.4rem,4vmin,2.2rem);line-height:1.1}
.phs .left{grid-area:l}.phs .right{grid-area:r}.phs .foot{grid-area:f}
.phs .left,.phs .right,.phs .foot{display:flex;flex-direction:column;gap:10px;min-width:0}
.phs fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:6px}
.phs legend{padding:0;font-weight:800;font-size:1rem;margin-bottom:4px}
.phs .row{display:grid;gap:6px;grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
.phs .goals{grid-template-columns:repeat(4,minmax(0,1fr))}
.phs .opt{min-height:48px;min-width:0;border:3px solid var(--ok-edge);border-radius:16px;background:var(--ok-bg2);color:var(--ok-text);font-weight:800;font-size:1rem;padding:4px 6px;line-height:1.1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.phs .opt .em{font-size:1.3em}
.phs .opt[aria-checked="true"]{background:#FFC83D;color:#1D2340;box-shadow:0 3px 0 var(--ok-edge)}
.phs .opt:focus-visible,.phs button:focus-visible,.phs input:focus-visible{outline:4px solid var(--ok-focus);outline-offset:2px}
.phs .frow{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.85rem}
.phs .frow .end{flex:0 0 auto;max-width:28%;line-height:1.1;text-align:center}
.phs .frow input{flex:1;min-width:0;height:44px;margin:0;accent-color:#E0662A}
.phs .mini{position:relative;height:14px;border-radius:999px;border:2.5px solid var(--ok-edge);background:linear-gradient(90deg,#4CB86066,#F2C23066,#E8483C66);overflow:hidden}
.phs .mini .mf{position:absolute;left:0;top:0;bottom:0;background:#4CB860;width:0}
.phs .mini .ml{position:absolute;top:-3px;bottom:-3px;width:5px;margin-left:-2px;background:var(--ok-edge)}
.phs .linetx,.phs .calt{margin:0;font-weight:700;font-size:.9rem;opacity:.85;min-height:1.2em}
.phs .cal{display:flex;flex-direction:column;gap:10px}
.phs .calb{min-height:52px;border:3px solid var(--ok-edge);border-radius:16px;--p:0%;background:linear-gradient(90deg,#8FD0FF var(--p),#D9F1FF var(--p));color:#1D2340;font-weight:800;font-size:1rem;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 12px;box-shadow:0 3px 0 var(--ok-edge)}
[dir=rtl] .phs .calb{background:linear-gradient(270deg,#8FD0FF var(--p),#D9F1FF var(--p))}
.phs .calb[disabled]{cursor:progress}
.phs .privacy{margin:0;text-align:center;font-weight:700;font-size:.95rem;padding:8px 12px;border-radius:14px;background:var(--ok-bg2)}
.phs .go{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.phs .go .ok-btn{min-width:min(300px,100%)}
.phs .go .em{margin-inline-end:6px}
.phn .phs-card{width:min(780px,100%);display:flex;flex-direction:column;align-items:stretch;text-align:center}
.phn h2{font-size:clamp(1.4rem,4vmin,2.4rem)}
.phn .big{font-size:3rem;line-height:1}
.phn .why{margin:0;font-weight:600;font-size:1.1rem;line-height:1.35}
.phn .go{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:12px}
.phn .go .ok-btn{width:100%;min-width:0}
/* the results: a headline and two big numbers like the clock; the card beside the pot (wide) or under it (tall) */
.ph-end{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.ph-end .sub{margin:0;font-weight:900;font-size:1.35rem;line-height:1.15}
.ph-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.ph-stat{border:3px solid var(--ok-edge);border-radius:20px;background:var(--ok-bg2);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.ph-stat .n{font-weight:900;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.ph-stat .l{font-weight:700;font-size:.95rem;line-height:1.15}
html.ph-ended .ok-win .ok-score,html.ph-ended .ok-win .ok-best{display:none}
html.ph-ended .ok-win .ok-card{width:min(500px,100%)}
html.ph-ended.ph-side .ok-win{padding-right:calc(max(3vw,16px) + env(safe-area-inset-right))}
html.ph-ended.ph-side .ok-win .ok-card{margin-left:auto;margin-right:0}   /* on the right in every language: the pot stands on the left */
html.ph-ended.ph-side .ok-win.ok-scrim{background:linear-gradient(90deg,rgba(10,12,12,0) 30%,var(--ok-scrim))}
html.ph-ended.ph-low .ok-win{align-items:flex-end}
html.ph-ended.ph-low .ok-win.ok-scrim{background:linear-gradient(180deg,rgba(10,12,12,0) 30%,var(--ok-scrim))}
html.ph-ended.ph-low .ok-win .ok-card{gap:8px;padding-top:18px}
@media (max-height:560px){
  html.ph-ended .ok-win .ok-card{padding:12px 16px 14px;gap:6px}
  html.ph-ended .ok-win .ok-h2{font-size:1.3rem;margin:0}
  html.ph-ended .ok-win .ok-sparks .ok-slot{width:40px;height:40px}
  .ph-end{gap:6px}.ph-end .sub{font-size:1.05rem}.ph-stat{padding:4px 6px;border-radius:16px}.ph-stat .n{font-size:1.7rem}.ph-stat .l{font-size:.85rem}
  html.ph-ended .ok-win .ok-row{flex-wrap:nowrap}html.ph-ended .ok-win .ok-btn{min-height:44px;padding:0 14px;font-size:1rem}
}
@media (min-width:1400px) and (min-height:860px){
  html.ph-ended .ok-win .ok-card{width:min(760px,44vw);padding:34px 34px 30px;gap:20px}
  html.ph-ended .ok-win .ok-h2{font-size:clamp(2.4rem,4.8vmin,3.8rem)}
  .ph-end .sub{font-size:clamp(1.8rem,3.6vmin,3rem)}
  .ph-stat{padding:14px 10px;border-radius:26px}.ph-stat .n{font-size:clamp(3.4rem,7.4vmin,6rem)}.ph-stat .l{font-size:clamp(1.1rem,2.3vmin,1.8rem)}
  html.ph-ended .ok-win .ok-btn{font-size:clamp(1.2rem,2.6vmin,2.1rem);min-height:clamp(52px,7vmin,86px);padding:0 32px}
  .ok-pause .ok-card{zoom:1.45}
}
@media (orientation:portrait),(max-width:640px){
  .phs-card{grid-template-columns:1fr;grid-template-areas:"h" "l" "r" "f";gap:10px}
}
@media (orientation:landscape) and (max-height:560px){
  .phs-card{padding:10px 12px;gap:6px 12px}
  .phs h2{font-size:1.2rem}
  .phs .opt{min-height:44px;font-size:.92rem;flex-direction:row}
  .phs .calt,.phs .linetx{font-size:.8rem}
  .phs .privacy{font-size:.82rem;padding:4px 8px}
  .phs .goals{grid-template-columns:repeat(7,minmax(0,1fr))}
  .phs .goals .opt{font-size:.82rem;padding:2px}
  .phs legend{font-size:.9rem;margin-bottom:0}
  .phs .calb{min-height:44px}
}

  'use strict';
  var DB_LO = -70, DB_HI = -10;                       // -70 dBFS is 0 on the gauge, -10 dBFS is 100
  var ATTACK = 0.12, RELEASE = 0.5;                   // seconds: the gauge jumps up fast and settles slowly
  var PRESETS = { whisper: 10, quiet: 18, group: 30 }; // how far above the room's own quiet the "too loud" line sits
  var PRESET_IDS = ['whisper', 'quiet', 'group'];
  var BASE = 30, FINE = 25, LINE_MIN = 15, LINE_MAX = 95;
  var GOALS = [120, 300, 600, 900, 1200, 1800, 0];   // seconds of quiet time; 0 = no goal
  var T = {
    near: 10,        // a level within this of the line counts as "getting warm"
    sizzleIn: 0.3,   // seconds of near-the-line before the kernels sizzle
    sizzleOut: 1.2,  // seconds below the near band before sizzling kernels rest again
    sizzleCool: 2.5, // seconds between two sizzles (a wiggle, a hiss, a hop, a puff of steam)
    pop: 1.5,        // seconds over the line (leaky) that make the popcorn pop: one clap only makes it sizzle
    leak: 0.5,       // how fast the over-the-line count drains while it is quieter (x dt)
    burst: 1.2,      // the first popping the room cannot cut short (the pop-out is always seen)
    calmBand: 5,     // popping calms down while the level is this far under the line
    calm: 4,         // seconds of calm before the pot cools
    cool: 2.0,       // cooling down takes this long
    reheat: 0.6,     // noise this long while it cools makes it pop again (no extra pop-out)
    heatUp: 0.25,    // seconds: the heat follows a louder room fast...
    heatDown: 0.7,   // ...and a quieter one more slowly, so the last few kernels still pop
    burstHeat: 0.6,  // the heat of the first burst
    minHeat: 0.08,   // under this heat nothing pops
    maxRate: 12,     // pops a second at full heat (just over the line it is about 6)
  };
  var SIZZLES = ['wiggle', 'hiss', 'hop', 'steam'];
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  /** One smoothing step: fast up (attack), slow down (release), using the real dt so any frame rate behaves the same. */

    var tau = x > prev ? ATTACK : RELEASE, a = 1 - Math.exp(-Math.max(0, dt) / tau);

  function pops(s, dt, ev) {
    s.acc += rate(s.heat) * dt;

    if (rate(s.heat) === 0) s.acc = 0;

  /**
   * One step. inp: { level (smoothed, 0..100), line, held (the pot's own sound is playing: the room is not listened to),
   * dt (seconds), rnd (0..1, for the sizzle it picks) }. -> { s, events: [{ type, ... }] }
   * Events: sizzle {act}, popout {popouts}, pop {n, heat}, cooldown, reheat, calm, goal.

        go(s, 'popping', { type: 'popout', popouts: s.popouts }, ev); return { s: s, events: ev };

        if (!held && (s.nearT >= T.sizzleIn || s.over > 0)) { go(s, 'sizzle', null, ev); s.lowT = 0; st = 'sizzle'; }
      }

        if (s.cool <= 0 && !held && (s.nearT > 0 || s.over > 0)) {
          var act = SIZZLES[Math.min(SIZZLES.length - 1, Math.floor(rnd * SIZZLES.length))];

      }

    }
    if (st === 'popping') {

      if (!held) s.heat = towards(s.heat, heatFor(L, line0), dt, T.heatUp, T.heatDown);

    ATTACK: ATTACK, RELEASE: RELEASE, presetOf: presetOf };

      var ct = el('p', 'calt', t('calibHint')); ct.setAttribute('role', 'status');
      cb.addEventListener('click', function () {
        if (S.calib) return;
        cb.disabled = true; ct.textContent = t('calibListen', { n: 3 }); cb.style.setProperty('--p', '0%');
        // the button fills from one end to the other over the 3 seconds
        var go = function () { startCalib(function (left) { ct.textContent = t('calibListen', { n: Math.ceil(left) }); cb.style.setProperty('--p', Math.round(100 * (1 - left / 3)) + '%'); }, function (r) {
          cb.disabled = false; cb.style.setProperty('--p', '0%');
          if (r.ok) { CFG.base = r.base; CFG.calibrated = true; showLine(); ct.textContent = t('calibOk'); }
          else ct.textContent = r.why === 'tooLoud' ? t('calibLoud') : t('calibNoMic');
        }); };
        if (S.demo || S.forced != null) go();
        else micStart().then(function (st) { if (st === 'on') go(); else { cb.disabled = false; ct.textContent = t('calibNoMic'); } });
      });
      cal.append(cb, ct); right.appendChild(cal);
      var foot = el('div', 'foot'); card.appendChild(foot);
      foot.appendChild(el('p', 'privacy', '🔒 ' + t('privacy')));
      var go = el('div', 'go'); foot.appendChild(go);
      function close(how) {
        if (!setupOpen) return; setupOpen = false; save(); clearInterval(lineT); wrap.remove(); document.removeEventListener('keydown', keys, true);
        if (S.calib) { S.calib = null; }
        resolve(how);
      }
      var start = O.ui.button(opt.edit ? t('backToPot') : t('startMic'), { kind: 'hot', big: true, icon: opt.edit ? 'play' : undefined, onPress: function () {
        // the tap that lets the page open the microphone: asked for right now, inside the tap
        if (!(opt.edit && S.demo)) startP = micStart();
        close('start');
      } });
      if (!opt.edit) start.insertBefore(el('span', 'em', '🎤'), start.firstChild);
      start.id = 'phStart'; start.setAttribute('data-start', ''); go.appendChild(start);
      var demoB = O.ui.button(opt.edit ? t('startOver') : t('tryDemo'), { kind: 'quiet', onPress: function () { if (!opt.edit) { S.demo = true; startP = Promise.resolve('demo'); } close(opt.edit ? 'restart' : 'demo'); } });
      demoB.id = opt.edit ? 'phRestart' : 'phDemo'; go.appendChild(demoB);
      function keys(e) {
        if (e.key === 'Tab') { var f = [].slice.call(card.querySelectorAll('button:not([tabindex="-1"]),input')).filter(function (b) { return b.offsetParent; }), i = f.indexOf(document.activeElement); e.preventDefault(); (f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length] || start).focus(); }
        if (e.key === ' ' || e.key === 'Escape' || e.key === 'p' || e.key === 'P') e.stopPropagation();
      }
      document.addEventListener('keydown', keys, true);
      O.ui.root().appendChild(wrap);
      setTimeout(function () { try { start.focus({ preventScroll: true }); } catch (e) { /* gone */ } }, 30);
      setupApi = { close: function () { if (setupOpen) start.click(); }, demo: function () { if (setupOpen) demoB.click(); } };
    });
  }
  function startCalib(onTick, onDone) { S.calib = { samples: [], left: 3, onTick: onTick, onDone: onDone }; }
  /** the microphone stopped (or went quiet) mid-measure: nothing is kept, so a half-measured room can't set the line */
  function calibCancel() {
    var c = S.calib; if (!c) return; S.calib = null;
    if (c.onDone) c.onDone({ ok: false, why: 'noInput' });
  }
  function calibDone() {
    var c = S.calib; S.calib = null; if (!c) return;
    var r = CORE.calibrate(c.samples);
    if (!S.demo && S.screen === 'setup') micStop();
    if (c.onDone) c.onDone(r);
  }

  /* the no-mic card: why, how to fix it, and the demo. 'tap': the page wants one more tap (a tablet that kept audio
     asleep, or the prompt was left when the tab was hidden), which is not a refusal: Start listening asks again. */
  function noMic(st) {
    setScreen('nomic'); S.paused = true;
    var k = st === 'needsTap' || st === 'stopped' ? 'tap' : ['denied', 'nodevice', 'busy', 'unavailable', 'off'].indexOf(st) >= 0 ? st : 'unavailable';
    var wrap = el('div', 'phs phn'); wrap.dir = O.dir || 'ltr';
    var card = el('div', 'phs-card'); wrap.appendChild(card); card.setAttribute('role', 'alertdialog'); card.setAttribute('aria-modal', 'true'); card.setAttribute('aria-labelledby', 'phnH'); card.setAttribute('aria-describedby', 'phnP');
    card.appendChild(el('div', 'big', k === 'off' ? '🎧' : '🎤'));
    var h = el('h2', '', t('noMic_' + k)); h.id = 'phnH'; card.appendChild(h);
    var p = el('p', 'why', t('noMic_' + k + '_p')); p.id = 'phnP'; card.appendChild(p);
    card.appendChild(el('p', 'privacy', '🔒 ' + t('privacy')));
    var go = el('div', 'go'); card.appendChild(go);
    function done() { wrap.remove(); }
    var again = O.ui.button(k === 'tap' ? t('startMic') : t('retry'), { kind: 'hot', big: true, icon: k === 'tap' ? 'play' : 'restart', onPress: function () {
      done(); setScreen('play'); micStart().then(function (s2) { if (s2 === 'on') { setDemo(false); S.paused = false; announce(t('potCalm'), true); } else noMic(s2); });
    } });
    again.id = 'phRetry';
    // in a classroom the demo is often the way forward: the same size as Try again, side by side when there is room
    var demo = O.ui.button(t('tryDemo'), { kind: 'go', big: true, icon: 'play', onPress: function () { done(); setScreen('play'); setDemo(true); S.paused = false; announce(t('potCalm'), true); } });
    demo.id = 'phDemo';
    go.append(again, demo);
    O.ui.root().appendChild(wrap);
    setTimeout(function () { try { (k === 'off' ? demo : again).focus({ preventScroll: true }); } catch (e) { /* gone */ } }, 30);
  }

  /* pause: our button, Space, P or Esc, a hidden page, or the page's Stop. The microphone is off while paused. */
  var pauseOpen = false;
  function pauseGame(why) {
    if (S.screen !== 'play' || S.paused || S.ended) return;
    S.paused = true; micStop(); setScreen('play'); R.root.classList.add('paused');
    pauseOpen = true;
    announce(t('paused'), true);
    O.ui.pause().then(function (r) {
      pauseOpen = false; R.root.classList.remove('paused');
      if (r === 'restart') { newSession(); resume(); }
      else if (r === 'quit') teacherSettings(true);
      else resume();
    });
  }
  function resume() {
    if (S.demo) { S.paused = false; return; }
    // Resume is a tap: the page may open the microphone again
    micStart().then(function (st) { if (st === 'on') S.paused = false; else noMic(st); });
  }
  function teacherSettings(fromPause) {
    if (S.screen !== 'play' || S.ended) return;
    S.paused = true; micStop();
    setupCard({ edit: true }).then(function (how) {
      setScreen('play');
      if (how === 'restart') newSession();
      if (S.core) S.core.goal = CFG.goal;
      var p = startP; startP = null;
      if (S.demo) { S.paused = false; return; }
      (p || micStart()).then(function (st) { if (st === 'on') S.paused = false; else noMic(st); });
    });
  }
  document.addEventListener('keydown', function (e) {
    if (setupOpen || pauseOpen || S.screen !== 'play' || S.ended) return;
    if (O.ui.open) return;
    var tg = e.target && e.target.tagName;
    if (e.code === 'Space' && (tg === 'BUTTON' || tg === 'INPUT')) return;
    if (e.code === 'Space' || e.key === 'p' || e.key === 'P' || e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); pauseGame('key'); }
  }, true);
  document.addEventListener('visibilitychange', function () { if (document.hidden) pauseGame('hidden'); });

  /* the happy ending: the pot does a cheerful shimmy and tips its lid, popcorn and confetti rain, a chime, then the results card */
  function celebrate() {
    S.ended = true; micStop(); setScreen('end'); A.celebrate = now();
    R.bubble.hidden = true;
    announce(t('endTitle'), true);
    setTimeout(function () { snd('chime'); sfx('win'); confetti(); }, 500);
    try { if (window.BRB) BRB.gameOver({ won: true, score: null }); } catch (e) { /* offline */ }
    setTimeout(results, A.skip ? 50 : 3000);
  }
  function results() {
    document.documentElement.classList.add('ph-ended');
    var c = S.core, stars = CORE.stars(c ? c.popouts : 0);
    var done = O.ui.win({ stars: stars, title: t('endTitle'), next: false, hero: false });
    setTimeout(function () {
      var card = document.querySelector('.ok-win .ok-card');
      if (card && !card.querySelector('.ph-stats')) {
        // "Popcorn party!" and the quiet time and pop-outs as two big numbers, like the clock
        var box = el('div', 'ph-end'), sub = el('p', 'sub', t('endSub')), st = el('div', 'ph-stats');
        st.setAttribute('role', 'group'); st.setAttribute('aria-label', t('endStats', { time: clock(c ? c.quiet : 0), n: c ? c.popouts : 0 }));
        [[clock(c ? c.quiet : 0), '🤫 ' + t('quietTime')], [O.num(c ? c.popouts : 0), '💥 ' + t('popOuts')]].forEach(function (x) {
          var b = el('div', 'ph-stat'), n = el('div', 'n', x[0]); n.dir = 'ltr'; b.append(n, el('div', 'l', x[1])); st.appendChild(b);
        });
        box.append(sub, st);
        var sp = card.querySelector('.ok-sparks'); if (sp && sp.nextSibling) card.insertBefore(box, sp.nextSibling); else card.appendChild(box);
        // "Another quiet time" (the setup card again) and "Same settings" (straight back to the kitchen)
        var again = card.querySelector('.ok-row .ok-btn');
        if (again) {
          var tx = again.lastChild; if (tx && tx.nodeType === 3) tx.nodeValue = t('another');
          again.classList.remove('ok-hot'); again.classList.add('ok-quiet'); again.classList.remove('ok-big');
          var same = O.ui.button(t('sameSettings'), { kind: 'hot', big: true, icon: 'play', onPress: function () {
            S.same = true; if (!S.demo) startP = micStart();   // inside the tap: the page may listen again
            again.click();
          } });
          same.id = 'phSame'; again.parentNode.insertBefore(same, again);
          setTimeout(function () { try { same.focus({ preventScroll: true }); } catch (e) { /* gone */ } }, 60);
        }
      }
      layout(); setTimeout(layout, 450);
    }, 0);
    Promise.resolve(done).then(function () {
      document.documentElement.classList.remove('ph-ended', 'ph-side', 'ph-low');
      A.celebrate = null; S.core = null;
      if (S.same) { S.same = false; begin(); return; }
      startP = null; setScreen('setup');
      setupCard().then(function (how) { begin(); });
    });
  }

  /* ---------- the kit game: the title over our calm kitchen, then the setup card ---------- */
  var SET = ['          ', '          ', '          ', '          ', 'P         ', '##########'];
  var game = O.game({
    api: 1, title: t('title'), subtitle: t('tag'), titleHue: 'spark',
    controls: 'none', camera: 'fixed', hero: 'me', hud: [], countdown: 0,
    level: O.level.grid(SET, {}),
    intro: function () { return setupCard(); },
    setup: function () { build(); },
    testState: function () { return testState(); },
    on: { start: function () { begin(); }, title: function () { build(); setScreen('title'); } },
  });
  build();
  requestAnimationFrame(frame);

  /* ---------- test hooks (the covers, the e2e tests, the playtest) ---------- */
  function testState() {
    var c = S.core;
    return { popcorn: true, screen: S.screen, state: c ? c.state : 'calm', look: A.to, popouts: c ? c.popouts : 0, popped: c ? c.popped : 0, heat: c ? Math.round(c.heat * 100) / 100 : 0,
      pile: PILE.length, flying: FLY.length, quiet: c ? Math.round(c.quiet * 10) / 10 : 0, goal: CFG.goal,
      line: lineNow(), level: Math.round(S.level * 10) / 10, held: heldNow(), mic: S.mic, demo: S.demo, preset: CFG.preset, fine: CFG.fine, base: CFG.base,
      paused: S.paused, stars: c ? CORE.stars(c.popouts) : 3, bubble: !!R.bubble && !R.bubble.hidden, mark: !!R.mark && !R.mark.hidden, calibrated: CFG.calibrated,
      measuring: measuring(), saved: load() };
  }
  Object.assign(window.__brbTest, {
    state: function () { return testState(); },
    setup: function (o) { o = o || {}; if (CORE.PRESET_IDS.indexOf(o.preset) >= 0) CFG.preset = o.preset; if (o.fine != null) CFG.fine = Math.max(-25, Math.min(25, +o.fine || 0)); if (o.goal != null) CFG.goal = Math.max(0, +o.goal || 0); if (o.base != null) { CFG.base = +o.base; CFG.calibrated = true; } return testState(); },
    closeSetup: function () { if (setupApi) setupApi.close(); return true; },
    demoStart: function () { if (setupApi) setupApi.demo(); return true; },
    demo: function (on) { if (S.screen === 'play' || S.screen === 'nomic') { var n = document.querySelector('.phn'); if (n) n.remove(); setScreen('play'); setDemo(on !== false); S.paused = false; } else S.demo = on !== false; return testState(); },
    level: function (v) { S.forced = v == null ? null : Math.max(0, Math.min(100, +v)); if (v != null) { S.level = S.forced; S.peak = S.forced; } return testState(); },
    setGoal: function (sec) { CFG.goal = Math.max(0, +sec || 0); if (S.core) S.core.goal = CFG.goal; return testState(); },
    step: function (ms) { var n = Math.ceil((+ms || 0) / 50); for (var i = 0; i < n; i++) { if (S.heldUntil > now()) S.heldUntil -= 50; tick(0.05); } return testState(); },
    pose: function (name) { A.forced = name && ART.LOOKS[name] ? name : null; return testState(); },
    skipAnimations: function () { A.skip = true; return true; },
    calibrate: function (samples) { var r = CORE.calibrate(samples || []); if (r.ok) { CFG.base = r.base; CFG.calibrated = true; } return Object.assign({ line: lineNow() }, r); },
    sounds: function () { return S.sounds.slice(); },
    pause: function () { pauseGame('test'); return testState(); },
  });
})();
</script>
