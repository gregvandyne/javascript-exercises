    var ranked = tms.filter(function (x) { return x.size > 0; }).sort(function (a, b) { return (a.rank || 99) - (b.rank || 99) || a.team - b.team; });
    var ranks = ranked.some(function (x) { return x.rank > 0; });
    if (podium && ranks) [1, 0, 2].forEach(function (k) {
      var tm = ranked[k]; if (!tm || !tm.rank) return;
      var st = document.createElement('div'); st.className = 'qb-step';
      st.appendChild(shapeCanvas(tm, 40));
      var nm = document.createElement('span'); nm.textContent = tm.icon + ' ' + tm.name; st.appendChild(nm);
      var bar = document.createElement('i'); bar.style.height = Math.round([96, 68, 46][k] * Math.min(1.4, innerHeight / 720)) + 'px'; bar.style.background = tm.color; bar.style.color = tm.ink; bar.textContent = tm.rank; st.appendChild(bar);
      pd.appendChild(st);
    });
    ranked.forEach(function (tm) {
      var li = document.createElement('li'); li.style.background = tm.color; li.style.color = tm.ink;
      var r = document.createElement('span'); r.className = 'r'; r.textContent = ranks && tm.rank ? tm.rank : '';
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = tm.icon + ' ' + tm.name + (tm.mine ? ' ★' : '');
      var sc = document.createElement('span'); sc.textContent = ranks ? tm.score + (L.teamScoring === 'avg' ? ' ' + t('perPlayer') : '') : '';
      li.append(r, shapeCanvas(tm, 30, true), nm, sc); ol.appendChild(li);
    });
    layout();
  }
  // The top five, animated: rows slide from where they were (an overtake slides up), a ▲ for places gained, 🔥 for a
  // streak bonus (a question worth more than 1000), and a star line for the biggest jump this question.
  var prevRank = new Map(), prevScore = new Map();
  function portraitOf(seat, px) {
    var c = flat.portrait(seat); if (!c) return null;
    var img = document.createElement('canvas'); img.width = c.width; img.height = c.height; img.getContext('2d').drawImage(c, 0, 0); img.setAttribute('aria-hidden', 'true'); return img;
  }
  function board(top, title, podium) {
    $('card').hidden = true; var b = $('board'); b.hidden = false; $('board-h').textContent = title;
    if (!podium) $('tboard').hidden = true;
    var ol = $('board-list'), pd = $('podium'); pd.textContent = '';
    var before = new Map(); [].forEach.call(ol.children, function (li) { before.set(li.dataset.seat, li.getBoundingClientRect().top); });
    ol.textContent = ''; $('mvp').textContent = '';
    if (podium) [1, 0, 2].forEach(function (k) {
      var p = top[k]; if (!p) return;
      var st = document.createElement('div'); st.className = 'qb-step';
      var img = portraitOf(p.seat, 84); if (img) st.appendChild(img);
      var nm = document.createElement('span'); nm.textContent = p.name; st.appendChild(nm);
      var bar = document.createElement('i'); bar.style.height = Math.round([96, 68, 46][k] * Math.min(1.4, innerHeight / 720)) + 'px'; bar.textContent = k + 1; st.appendChild(bar);
      pd.appendChild(st);
    });
    var best = null;
    top.slice(podium ? 3 : 0, podium && !host ? 3 : 5).forEach(function (p, i) {
      var rank = (podium ? 3 : 0) + i + 1, li = document.createElement('li'); li.dataset.seat = String(p.seat);
      var r = document.createElement('span'); r.className = 'r'; r.textContent = rank;
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = p.name;
      var gain = prevScore.has(p.seat) ? p.score - prevScore.get(p.seat) : 0;
      if (gain > 1000) nm.textContent += ' 🔥';
      li.append(r);
      var img = portraitOf(p.seat, 40); if (img) li.append(img);
      li.append(nm);
      var was = prevRank.get(p.seat);
      if (!podium && was && was > rank) { var up = document.createElement('span'); up.className = 'up'; up.textContent = '▲' + (was - rank); li.append(up); if (!best || was - rank > best.d) best = { d: was - rank, p: p }; }
      var sc = document.createElement('span'); sc.textContent = p.score; li.append(sc);
      ol.appendChild(li);
    });
    ol.start = podium ? 4 : 1;
    if (!podium) {
      var lead = top[0];
      $('mvp').textContent = best ? '⭐ ' + t('up', { name: best.p.name }) : lead ? '⭐ ' + t('mvp', { name: lead.name }) : '';
      top.forEach(function (p, i) { prevRank.set(p.seat, i + 1); prevScore.set(p.seat, p.score); });
    }
    layout();
    if (!REDUCED) [].forEach.call(ol.children, function (li) {
      var y0 = before.get(li.dataset.seat), y1 = li.getBoundingClientRect().top;
      var from = y0 != null ? 'translateY(' + (y0 - y1) + 'px)' : 'translateX(' + (RTL ? '-' : '') + '60px)';
      try { li.animate([{ transform: from, opacity: y0 != null ? 1 : 0 }, { transform: 'none', opacity: 1 }], { duration: 700, easing: 'cubic-bezier(.2,.9,.3,1.2)' }); } catch (e) { /* old browser */ }
    });
  }

  L.on('phase', function (e) {
    phase = e.phase;
    if (phase === 'lobby') { banner(host ? t('arrives', { boss: t('boss' + boss.kind) }) : t('wait')); $('card').hidden = true; }
    if (phase === 'playing' || phase === 'lobby') $('tboard').hidden = true;
    if (phase === 'loading') banner(t('ready'));
    if (phase === 'paused') banner(t('paused'));
    if (phase === 'playing') banner('');
    layout();
  });
  var cd = 0;
  L.on('countdown', function (e) { clearInterval(cd); var tick = function () { var left = Math.ceil((e.at - L.now()) / 1000); banner(left > 0 ? String(left) : t('go'), left <= 0); if (left <= 0) { clearInterval(cd); setTimeout(function () { if (phase === 'playing') banner(''); }, 700); } }; tick(); cd = setInterval(tick, 200); });
  L.on('question', showCard);
  L.on('answers', function (a) { if (host) $('note').textContent = t('answers', { n: a.n }); });
  L.on('reveal', showReveal);
  L.on('result', showResult);
  L.on('end', function (e) { theEnd(e.top || [], e.teams || []); });
  /** The end: the finishing blow (if the last reveal didn't land it), the boss turns happy, then the podiums. */
  function theEnd(top, teams) {
    clearInterval(ringTimer); phase = 'ended';
    var wasUp = boss.hpTo > 0;
    boss.hpTo = 0; boss.mood = 'beaten'; boss.beatT = now() + (wasUp ? 900 : 300);
    if (wasUp && !REDUCED) { var b = bossBox(); for (var m = 0; m < 10; m++) launch(innerWidth / 2 + (m - 5) * 30, innerHeight - 40, 1.6, m * 70, POWER[7]); }
    $('card').hidden = true; $('board').hidden = true; $('tboard').hidden = true; layout();
    later(function () {
      banner('🏆 ' + t('defeated'), true); say(t('defeated'));
      if (!REDUCED) { try { BRB.fx.confetti(); } catch (er) { /* none */ } }
      try { O.sfx('win'); } catch (er) { /* none */ }
    }, wasUp ? 700 : 300);
    later(function () {
      // team mode: the team podium first, then the players' podium under it (none when the leaderboard is off)
      banner(''); if (!host) banner(t('defeated'));
      if (teams.length) teamBoard(teams, t('teamPodium'), true);
      if (top.length) board(top, L.active ? t('podium') : t('done'), L.active);
      layout();
    }, wasUp ? 2200 : 1500);
  }

  // ---- practice (played alone): five questions against the boss ---------------------------------------------------
  var practice = { i: -1, items: [], deadline: 0, score: 0, rnd: O.rand(11) };
  function practiceNext() {
    practice.i++;
    if (practice.i >= practice.items.length) { theEnd([{ seat: 0, name: BRB.user.displayName || '', score: practice.score }], []); return; }
    var it = practice.items[practice.i]; phase = 'playing'; practice.deadline = now() + it.secs * 1000;
    showCard({ i: practice.i, n: practice.items.length, q: it.q, choices: it.choices, secs: it.secs, at: 0 });
    clearTimeout(practice.to); practice.to = setTimeout(function () { if (myPick < 0) { myPick = 9; practiceAnswer(-1); } }, it.secs * 1000);
  }
  function practiceAnswer(i) {
    clearTimeout(practice.to);
    var it = practice.items[practice.i], ok = i === it.answer, pts = ok ? 500 + Math.round(500 * Math.max(0, practice.deadline - now()) / (it.secs * 1000)) + Math.min(200, 50 * myStreak) : 0;
    practice.score += pts; phase = 'between'; layout();
    var counts = it.choices.map(function (c, k) { return k === i ? 1 : 0; });
    myPick = i;
    showReveal({ i: practice.i, answer: it.answer, counts: counts }); showResult({ i: practice.i, ok: ok, points: pts, score: practice.score, none: i < 0 });
    setTimeout(practiceNext, 2400);
  }

  // players see their team on the question card's top bar
  function myTeamPill() { var mt = L.myTeam, el = $('team'); if (!el) return; el.hidden = !mt; if (mt) { el.textContent = ''; el.style.background = mt.color; el.style.color = mt.ink; el.append(shapeCanvas(mt, 20, true), ' ' + t('yourTeam', { team: mt.name })); } }
  L.on('teams', myTeamPill); L.on('welcome', myTeamPill);
  // the boss: the host picks one and shares it; everyone else follows the shared state
  L.on('state', function (s) { if (s && typeof s.boss === 'number') { setKind(s.boss); if (phase === 'lobby' && host) banner(t('arrives', { boss: t('boss' + boss.kind) })); } });
  L.on('welcome', function () { if (L.state && typeof L.state.boss === 'number') setKind(L.state.boss); });
  setKind(L.state && typeof L.state.boss === 'number' ? L.state.boss : host || !L.active ? Math.floor(Math.random() * 3) : 0);
  hpBar(); layout();
  L.ready({ lobby: true, quiz: true, hostView: true, teams: true });
  if (host && !(L.state && typeof L.state.boss === 'number')) L.setState({ boss: boss.kind });
  if (!L.active) {
    for (var k = 0; k < 5; k++) { var a = practice.rnd.int(2, 9), b = practice.rnd.int(2, 9), ans = a * b, sh = practice.rnd.shuffle([ans, ans + a, ans - b, ans + 1]); practice.items.push({ q: a + ' × ' + b + ' = ?', choices: sh.map(String), answer: sh.indexOf(ans), secs: 15 }); }
    total = practice.items.length;
    // Playing alone: choose the questions first (subject, level, how many), then the boss arrives.
    L.on('start', function () {
      window.SoloBank.choose({}, function (items) {
        if (items && items.length) { practice.items = items; total = items.length; }
        banner(t('arrives', { boss: t('boss' + boss.kind) })); setTimeout(function () { banner(t('practice')); }, 1800); setTimeout(practiceNext, 3000);
      });
    });
  } else if (phase === 'lobby') banner(host ? t('arrives', { boss: t('boss' + boss.kind) }) : t('wait'));
  O.test({
    state: function () { return { role: L.role, phase: phase, question: Q ? { i: Q.i, q: Q.q, choices: Q.choices.slice(), answered: myPick >= 0 } : null, score: myScore, streak: myStreak, boss: { kind: boss.kind, hp: Math.round(boss.hpTo), mood: boss.mood }, board: !$('board').hidden, teamBoard: !$('tboard').hidden, teams: L.teams().map(function (x) { return { team: x.team, name: x.name, rank: x.rank, score: x.score, size: x.size, mine: x.mine }; }), myTeam: L.myTeam ? L.myTeam.team : 0, note: $('note').textContent, players: L.players().length }; },
    start: function () { return true; },
  });
  window.__brbTest.answer = function (i) { choose(i); };
})();
</script>
