      b.addEventListener('click', function () { choose(i); });
      pad.appendChild(b);
    });
    banner(''); say(q.q);
    clearInterval(ringTimer); ringTimer = setInterval(ring, 100); ring();
    if (!host && !q.answered && pad.firstChild) pad.firstChild.focus({ preventScroll: true });
  }
  function ring() {
    if (!Q || phase !== 'playing') return;
    var left = L.active ? L.quiz.left() : Math.max(0, practice.deadline - performance.now()), f = Math.max(0, Math.min(1, left / (Q.secs * 1000)));
    $('ring').setAttribute('stroke-dashoffset', String(94.25 * (1 - f))); $('secs').textContent = Math.ceil(left / 1000);
  }
  function choose(i) {
    if (host || !Q || myPick >= 0) return;
    if (L.active) { if (!L.quiz.answer(i)) return; } else practiceAnswer(i);
    myPick = i;
    [].forEach.call($('pad').children, function (b, k) { b.disabled = true; b.classList.toggle('pick', k === i); });
    $('note').textContent = t('locked'); O.sfx('select');
  }
  function showReveal(rv) {
    clearInterval(ringTimer);
    if (rv.skipped) { $('note').textContent = t('skipped'); return; }
    [].forEach.call($('pad').children, function (b, k) {
      b.disabled = true; b.classList.toggle('right', k === rv.answer);
      if (host && rv.counts) { var n = document.createElement('span'); n.className = 'n'; n.textContent = rv.counts[k] || 0; b.appendChild(n); }
    });
    // the host's view: the answer bars, then the team board (team mode), then the top five (none when the leaderboard is off)
    var tms = rv.teams || [], at = 2500;
    if (host && tms.length) { setTimeout(function () { if (phase === 'between') teamBoard(tms, t('teams'), false); }, at); at += 2500; }
    if (host && rv.top && rv.top.length) setTimeout(function () { if (phase === 'between') board(rv.top, t('top'), false); }, at);
  }
  var lastResult = null;
  // team scores can land just after my result: the note follows them while the question is revealed
  L.on('teams', function (e) { if (e.why === 'scores' && lastResult && phase === 'between') showResult(lastResult, true); });
  function showResult(r, again) {
    if (host) return;
    lastResult = r;
    if (r.none) { $('note').textContent = t('timeUp'); return; }
    myScore = r.score || myScore + (r.points || 0);
    var mt = L.myTeam;
    $('note').textContent = (r.ok ? t('right', { points: r.points }) : t('wrong')) + (r.rank ? ' · ' + t('rank', { rank: r.rank }) : '') + (mt && mt.rank ? ' · ' + t('teamRank', { team: mt.name, rank: mt.rank }) : '');
    $('score').hidden = false; $('score').textContent = t('score', { n: myScore });
    if (!again) { say($('note').textContent); O.sfx(r.ok ? 'correct' : 'wrong'); }
  }
  // a team's shape; onTeam: drawn on the team's own colour, so it takes the team's ink (text colour) instead
  function shapeCanvas(tm, px, onTeam) {
    var c = document.createElement('canvas'), k = Math.min(2, devicePixelRatio || 1); c.width = c.height = Math.round(px * k); c.setAttribute('aria-hidden', 'true');
    var x = c.getContext('2d'); x.scale(k, k); L.drawShape(x, tm.shape, px / 2, px / 2, px * 0.42, onTeam ? tm.ink : tm.color, onTeam ? null : '#1d2340'); return c;
  }
  /** The team board (host, between questions) or the team podium (the end): shape, icon, name, score; ranks only when
   *  the leaderboard allows them (rank 0 = hidden or no players). */
  function teamBoard(tms, title, podium) {
    $('card').hidden = true; $('tboard').hidden = false; $('tboard-h').textContent = title;
    if (!podium) $('board').hidden = true;
    var ol = $('tboard-list'), pd = $('tpodium'); ol.textContent = ''; pd.textContent = '';
    var ranked = tms.filter(function (x) { return x.size > 0; }).sort(function (a, b) { return (a.rank || 99) - (b.rank || 99) || a.team - b.team; });
    var ranks = ranked.some(function (x) { return x.rank > 0; });
    if (podium && ranks) [1, 0, 2].forEach(function (k) {
      var tm = ranked[k]; if (!tm || !tm.rank) return;
      var st = document.createElement('div'); st.className = 'qb-step';
      st.appendChild(shapeCanvas(tm, 40));
      var nm = document.createElement('span'); nm.textContent = tm.icon + ' ' + tm.name; st.appendChild(nm);
      var bar = document.createElement('i'); bar.style.height = [90, 64, 44][k] + 'px'; bar.style.background = tm.color; bar.style.color = tm.ink; bar.textContent = tm.rank; st.appendChild(bar);
      pd.appendChild(st);
    });
    ranked.forEach(function (tm) {
      var li = document.createElement('li'); li.style.background = tm.color; li.style.color = tm.ink;
      var r = document.createElement('span'); r.className = 'r'; r.textContent = ranks && tm.rank ? tm.rank : '';
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = tm.icon + ' ' + tm.name + (tm.mine ? ' ★' : '');
      var sc = document.createElement('span'); sc.textContent = ranks ? tm.score + (L.teamScoring === 'avg' ? ' ' + t('perPlayer') : '') : '';
      li.append(r, shapeCanvas(tm, 30, true), nm, sc); ol.appendChild(li);
    });
  }
  function board(top, title, podium) {
    $('card').hidden = true; var b = $('board'); b.hidden = false; $('board-h').textContent = title;
    if (!podium) $('tboard').hidden = true;
    var ol = $('board-list'), pd = $('podium'); ol.textContent = ''; pd.textContent = '';
    if (podium) [1, 0, 2].forEach(function (k) {
      var p = top[k]; if (!p) return;
      var st = document.createElement('div'); st.className = 'qb-step';
      var c = flat.portrait(p.seat); if (c) { var img = document.createElement('canvas'); img.width = c.width; img.height = c.height; img.getContext('2d').drawImage(c, 0, 0); img.setAttribute('aria-hidden', 'true'); st.appendChild(img); }
      var nm = document.createElement('span'); nm.textContent = p.name; st.appendChild(nm);
      var bar = document.createElement('i'); bar.style.height = [90, 64, 44][k] + 'px'; st.appendChild(bar);
      pd.appendChild(st);
    });
    top.slice(podium ? 3 : 0, 5).forEach(function (p) { var li = document.createElement('li'); li.textContent = p.name + ' · ' + p.score; ol.appendChild(li); });
    if (podium) ol.start = 4; else ol.removeAttribute('start');
  }

  L.on('phase', function (e) {
    phase = e.phase;
    if (phase === 'lobby') { banner(host ? '' : t('wait')); $('card').hidden = true; }
    if (phase === 'playing' || phase === 'lobby') $('tboard').hidden = true;
    if (phase === 'loading') banner(t('ready'));
    if (phase === 'paused') banner(t('paused'));
    if (phase === 'playing') banner('');
  });
  var cd = 0;
  L.on('countdown', function (e) { clearInterval(cd); var tick = function () { var left = Math.ceil((e.at - L.now()) / 1000); banner(left > 0 ? String(left) : t('go')); if (left <= 0) { clearInterval(cd); setTimeout(function () { if (phase === 'playing') banner(''); }, 700); } }; tick(); cd = setInterval(tick, 200); });
  L.on('question', showCard);
  L.on('answers', function (a) { if (host) $('note').textContent = t('answers', { n: a.n }); });
  L.on('reveal', showReveal);
  L.on('result', showResult);
  L.on('end', function (e) {
    clearInterval(ringTimer);
    // team mode: the team podium first, then the players' podium under it (none when the leaderboard is off)
    if (e.teams && e.teams.length) teamBoard(e.teams, t('teamPodium'), true); else $('tboard').hidden = true;
    if (e.top && e.top.length) board(e.top, t('podium'), true); else $('board').hidden = true;
    banner(t('done'));
    if (!(O.settings && O.settings.reduced)) { try { BRB.fx.confetti(); } catch (er) { /* none */ } }
    O.sfx('win');
  });

  // ---- practice (played alone) ----
  var practice = { i: -1, items: [], deadline: 0, score: 0, rnd: O.rand(11) };
  function practiceNext() {
    practice.i++;
    if (practice.i >= practice.items.length) { phase = 'ended'; board([{ seat: 0, name: BRB.user.displayName || '', score: practice.score }], t('done'), false); return; }
    var it = practice.items[practice.i]; phase = 'playing'; practice.deadline = performance.now() + it.secs * 1000;
    showCard({ i: practice.i, n: practice.items.length, q: it.q, choices: it.choices, secs: it.secs, at: 0 });
    clearTimeout(practice.to); practice.to = setTimeout(function () { if (myPick < 0) { myPick = 9; practiceAnswer(-1); } }, it.secs * 1000);
  }
  function practiceAnswer(i) {
    clearTimeout(practice.to);
    var it = practice.items[practice.i], ok = i === it.answer, pts = ok ? 500 + Math.round(500 * Math.max(0, practice.deadline - performance.now()) / (it.secs * 1000)) : 0;
    practice.score += pts; phase = 'between';
    showReveal({ answer: it.answer }); showResult({ ok: ok, points: pts, score: practice.score, none: i < 0 });
    setTimeout(practiceNext, 1800);
  }

  // players see their team on the question card's top bar
  function myTeamPill() { var mt = L.myTeam, el = $('team'); if (!el) return; el.hidden = !mt; if (mt) { el.textContent = ''; el.style.background = mt.color; el.style.color = mt.ink; el.append(shapeCanvas(mt, 20, true), ' ' + t('yourTeam', { team: mt.name })); } }
  L.on('teams', myTeamPill); L.on('welcome', myTeamPill);
  L.ready({ lobby: true, quiz: true, hostView: true, teams: true });
  if (!L.active) {
    for (var k = 0; k < 5; k++) { var a = practice.rnd.int(2, 9), b = practice.rnd.int(2, 9), ans = a * b, sh = practice.rnd.shuffle([ans, ans + a, ans - b, ans + 1]); practice.items.push({ q: a + ' × ' + b + ' = ?', choices: sh.map(String), answer: sh.indexOf(ans), secs: 15 }); }
    L.on('start', function () { banner(t('practice')); setTimeout(practiceNext, 1200); });
  } else if (phase === 'lobby' && !host) banner(t('wait'));
  O.test({
    state: function () { return { role: L.role, phase: phase, question: Q ? { i: Q.i, q: Q.q, choices: Q.choices.slice(), answered: myPick >= 0 } : null, score: myScore, board: !$('board').hidden, teamBoard: !$('tboard').hidden, teams: L.teams().map(function (x) { return { team: x.team, name: x.name, rank: x.rank, score: x.score, size: x.size, mine: x.mine }; }), myTeam: L.myTeam ? L.myTeam.team : 0, note: $('note').textContent, players: L.players().length }; },
    start: function () { return true; },
  });
  window.__brbTest.answer = function (i) { choose(i); };
})();
</script>
