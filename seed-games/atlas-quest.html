mes call their home the land of the eagles, and golden eagles still soar over its mountains."],["life","Which Albanian town is nicknamed the City of a Thousand Windows?","Berat","Gjirokaster","Shkoder","Durres","Berat's white old houses climb up a hillside, their many windows stacked one above another, looking down on the river."]],"AD":[["food","Which hearty Andorran mountain dish is mashed cabbage and potato fried with bacon?","Trinxat","Rosti","Colcannon","Bubble and squeak","Trinxat means chopped in Catalan. It warms people up after a cold day in the snowy Pyrenees mountains."],["party","On 8 September, Andorrans celebrate their national day and patron saint. What is it called?","Meritxell Day","Sant Jordi Day","La Merce","Bastille Day","Many people visit the Sanctuary of Meritxell, a striking stone church in the mountains, to celebrate together."],["arts","Andorra's little stone churches with tall bell towers were built about 1,000 years ago in which style?","Romanesque","Gothic","Baroque","Art Nouveau","Andorra has dozens of these tiny churches, many with painted walls and bell towers dotted with arched windows."],["words","Andorra is the only country where which language is the one official language?","Catalan","Basque","Occitan","Galician","To say thank you in Catalan you say gracies. Catalan is also spoken in Barcelona and on the Balearic Islands."],["nature","Which nimble goat-antelope, called the isard by locals, leaps around Andorra's rocky peaks?","Pyrenean chamois","Mouflon","Markhor","Saiga antelope","Chamois have soft, grippy hooves that work like climbing shoes, so they can run across steep rock and snow."],["life","Which winter sport brings huge numbers of visitors to Andorra's resorts like Grandvalira?","Skiing","Ice hockey","Curling","Bobsleigh","Grandvalira is the biggest ski area in the Pyrenees, with more than 200 kilometres of snowy slopes."]],"AT":[["food","Which chocolate cake with a layer of apricot jam was invented in Vienna in 1832?","Sachertorte","Black Forest gateau","Tiramisu","Pavlova","It was created by Franz Sacher, a 16-year-old kitchen apprentice, and is served with a spoonful of whipped cream."],["party","What is the Austrian festival where cows wearing flower headdresses walk down from summer mountain meadows?","Almabtrieb","Oktoberfest","Fasching","Krampusnacht","Cowbells clang as the herds parade through villages, and everyone celebrates the farmers' safe return with music and food."],["arts","Which spinning ballroom dance became hugely popular in Vienna in the 1800s?","Waltz","Tango","Foxtrot","Flamenco","Johann Strauss II, the Waltz King, wrote The Blue Danube, which is played at Vienna's famous New Year's Day concert."],["words","Which friendly word do many Austrians use to say both hello and goodbye?","Servus","Moin","Hej","Ahoj","Servus comes from Latin and means at your service. Another common Austrian greeting is Gruss Gott."],["nature","Which fuzzy, white, star-shaped flower that grows high in the Alps is a symbol of Austria?","Edelweiss","Gentian","Alpine rose","Primrose","Its petals are covered in woolly hairs that protect it from cold and strong sun. It appears on Austria's 2 cent coin."],["life","Which wintry toy, full of swirling snow, was invented in Vienna around 1900?","Snow globe","Music box","Teddy bear","Kaleidoscope","Erwin Perzy was trying to make a brighter lamp when he got the idea. His relatives still make snow globes in Vienna today."]],"BY":[["food","Which thick sauce of meat and sour cream do Belarusians scoop up with rolled pancakes?","Machanka","Borscht","Goulash","Stroganoff","Its name comes from a Belarusian word meaning to dip, and people eat it with their hands using the pancakes."],["party","During Kupalle, a midsummer festival in Belarus, what magical flower do people search for in the forest?","Fern flower","Lotus","Edelweiss","Moonflower","Legend says the fern blooms only on this one night. People also jump over bonfires and float flower wreaths on rivers."],["arts","Belarusian craftspeople weave dolls, animals and even little houses from what golden material?","Straw","Copper wire","Bamboo","Felt","Straw weaving is a very old Belarusian craft, and the figures are thought to bring luck and warmth to a home."],["words","How do you say thank you in Belarusian?","Dziakuj","Spasibo","Dekuji","Hvala","Belarusian uses the Cyrillic alphabet and has a special letter, a u with a little curve on top, called short u."],["nature","Which tall white bird with red legs is a beloved symbol of Belarus, nesting on roofs and poles?","White stork","Grey heron","Flamingo","Common crane","Many Belarusians believe a stork nest on your house brings luck. Storks fly all the way to Africa for the winter."],["life","Which artist, famous for painting floating people and blue cows, was born in Vitebsk, Belarus?","Marc Chagall","Pablo Picasso","Wassily Kandinsky","Salvador Dali","Chagall often painted his hometown, with violin players on rooftops and couples flying high over the houses."]],"BE":[["food","Which dish of mussels with crispy chips is often called Belgium's national dish?","Moules-frites","Fish and chips","Paella","Bouillabaisse","The mussels are steamed in a big pot, and Belgians love dipping their fries in mayonnaise rather than ketchup."],["party","At the Carnival of Binche, costumed dancers called Gilles throw what to the crowd?","Oranges","Tomatoes","Flowers","Waffles","The Gilles wear tall hats of ostrich feathers and wooden clogs, and catching an orange is said to bring good luck."],["arts","Which delicate craft, made by twisting fine threads with lots of little bobbins, is Bruges famous for?","Lace making","Glass blowing","Pottery","Origami","Lace makers twist dozens of tiny wooden bobbins at once to create patterns as fine as snowflakes."],["words","How many official languages does Belgium have?","Three","One","Two","Four","Dutch is spoken in the north, French in the south, and a small area in the east speaks German."],["nature","The Belgian Brabant is a famous breed of which big, strong farm animal?","Horse","Ox","Cow","Pig","Brabant horses can weigh about a tonne. In Oostduinkerke they still help fishers catch shrimp in the sea!"],["life","Which giant shiny Brussels building is shaped like an iron crystal made 165 billion times bigger?","Atomium","Space Needle","Gherkin","Shard","It was built for the 1958 World's Fair. Its nine huge metal balls are joined by tubes with escalators inside."]],"BA":[["food","Which small grilled meat sausages, served in fluffy bread with chopped onions, are a Bosnian favourite?","Cevapi","Bratwurst","Souvlaki","Chorizo","Cevapi are tucked into a soft flatbread called somun, and the best are said to be found in Sarajevo's old market."],["party","When Bosnians share coffee with friends, what sweet treat is usually served alongside it?","Turkish delight","Biscotti","Churros","Macarons","Bosnian coffee is brewed in a small copper pot called a dzezva and is meant to be sipped slowly while chatting."],["arts","What are the soulful traditional love songs of Bosnia and Herzegovina called?","Sevdah","Fado","Flamenco","Rebetiko","Sevdah is a Bosnian word for a deep, dreamy longing, and the songs are often played on the accordion."],["words","Bosnian, Croatian and Serbian can be written in which two alphabets?","Latin and Cyrillic","Latin and Greek","Greek and Cyrillic","Latin and Georgian","These three languages are so similar that speakers easily understand each other. Hello is zdravo!"],["nature","Which wide waterfall in Bosnia and Herzegovina tumbles about 25 metres into a pool where people swim?","Kravica","Skradinski buk","Rhine Falls","Krimml Falls","The Trebizat river spreads out into a curve of white water, and visitors can paddle in the green pool below."],["life","Sarajevo hosted the 1984 Winter Olympics. What animal was its friendly mascot, Vucko?","Wolf","Bear","Fox","Lynx","Vucko was chosen to show that wolves need not be scary, and he is still loved by people in Sarajevo today."]],"BG":[["food","Which flaky Bulgarian pastry, filled with cheese and eggs, hides lucky notes on New Year's Eve?","Banitsa","Spanakopita","Strudel","Baklava","Bulgarians bake little paper fortunes inside, with wishes like health or travel, and everyone hunts for theirs."],["party","On 1 March, Bulgarians give each other red and white tassels for spring. What are they called?","Martenitsa","Rakhi","Omamori","Lei","People wear them until they spot a stork or a blossoming tree, then tie them to a branch to welcome spring."],["arts","A Bulgarian folk song was sent into space in 1977 aboard which spacecraft?","Voyager","Apollo 11","Sputnik 1","Mir","Singer Valya Balkanska's voice is on the Golden Record, a message for any aliens who might find Voyager one day."],["words","Which alphabet, now used by about 250 million people, was created in Bulgaria over 1,000 years ago?","Cyrillic","Greek","Georgian","Armenian","Bulgarians celebrate their alphabet every 24 May with flowers and parades, honouring the saints Cyril and Methodius."],["nature","In Bulgaria's Rila Mountains, a famous group of glacier lakes is named after their number. How many?","Seven","Five","Nine","Twelve","Each lake has a name, such as the Kidney, the Eye and the Tear, and they sit one above another like giant steps."],["life","Which colourful striped monastery, tucked in the mountains, is Bulgaria's most famous?","Rila Monastery","Meteora","Mount Athos","Studenica","It was founded over 1,000 years ago, and its main church is covered with more than 1,000 bright wall paintings."]],"HR":[["food","Which Croatian dish is meat and vegetables slow-cooked under a metal bell covered in hot embers?","Peka","Tagine","Goulash","Paella","The bell-shaped lid traps heat and steam, so the food cooks slowly for hours and becomes very tender."],["party","Which Croatian city holds one of Europe's biggest carnivals, with thousands in costume each winter?","Rijeka","Split","Zadar","Dubrovnik","Bell-ringers called zvoncari join in, wearing sheepskins and wild masks, and clang their bells to chase winter away."],["arts","What is the Croatian style of harmony singing by small groups, with no instruments at all?","Klapa","Fado","Yodel","Rebetiko","Klapa means a group of friends. Singers often perform in old stone streets where the echoes make it sound magical."],["words","The word cravat, for a knotted neck scarf, comes from the name of which people?","Croatians","Czechs","Cossacks","Hungarians","In the 1600s, Croatian horsemen in Paris wore knotted scarves, and the French loved them. Croatia now has a Cravat Day."],["nature","Which furry animal gave its name to Croatia's old money, the kuna?","Pine marten","Squirrel","Otter","Fox","Long ago marten furs were traded like money. Croatia used the kuna until it switched to the euro in 2023."],["life","Which famous inventor of electrical machines was born in the village of Smiljan, Croatia?","Nikola Tesla","Thomas Edison","Alexander Graham Bell","Guglielmo Marconi","Tesla helped develop alternating current, the kind of electricity that flows from the sockets in our walls today."]],"CY":[["food","In Cyprus, what do you get if you order a meze?","Many small shared dishes","One big stew","A sweet pastry","A cold fruit drink","A Cypriot meze can have 20 or more little plates, from dips and salads to grilled meats, arriving one after another."],["party","Which Cypriot seaside festival, held around Pentecost, is famous for splashing water and boat races?","Kataklysmos","Songkran","La Tomatina","Holi","Its name means flood, and towns like Larnaca hold fairs, rhyming song contests and swimming races by the sea."],["arts","Which Cypriot village is famous for lace that, legend says, Leonardo da Vinci took home?","Lefkara","Bruges","Burano","Alencon","Lefkara lace is stitched by hand with neat geometric patterns, and UNESCO lists it as a treasure of world culture."],["words","Cyprus has two official languages. How do you say hello in Greek?","Yia sou","Merhaba","Ciao","Shalom","Turkish-speaking Cypriots say merhaba, so on this island you might hear two different hellos in one street!"],["nature","Which sea creatures crawl onto Cyprus's Lara Beach at night to lay eggs in the sand?","Sea turtles","Seals","Penguins","Iguanas","Both green and loggerhead turtles nest there, and the tiny hatchlings scamper down to the sea by moonlight."],["life","Petra tou Romiou, a sea rock in Cyprus, is said to be the birthplace of which Greek goddess?","Aphrodite","Athena","Artemis","Hera","The legend says she rose from the sea foam beside this rock. Some say swimming around it brings good luck."]],"CZ":[["food","Which Czech dish is beef in a creamy vegetable sauce, served with dumplings and cranberries?","Svickova","Goulash","Stroganoff","Sauerbraten","Czech bread dumplings are boiled like big fluffy loaves, then cut into slices, sometimes with a piece of thread."],["party","Before Christmas, which fish do many Czechs buy alive and sometimes keep in the bathtub?","Carp","Salmon","Trout","Cod","Carp is the classic Czech Christmas Eve dinner, and some people keep a fish scale in their wallet for good luck."],["arts","Which kind of puppets, worked with strings from above, are a famous Czech tradition?","Marionettes","Shadow puppets","Hand puppets","Finger puppets","Prague has whole theatres for marionettes, and the puppet duo Spejbl and Hurvinek have made Czech kids laugh for 100 years."],["words","The Czech tongue twister strc prst skrz krk is famous because it has no what?","Vowels","Consonants","Spaces","Capital letters","It means stick your finger through your throat! In Czech, r and l can act like vowels, so words can sound very crunchy."],["nature","Pravcicka Gate in Czechia is the biggest natural what in Europe?","Sandstone arch","Waterfall","Ice cave","Sand dune","This giant rock bridge is about 26 metres wide, and it appeared as a setting in a Narnia movie."],["life","What animal is Krtek, the cheerful Czech cartoon star loved by kids since 1957?","Mole","Hedgehog","Mouse","Beaver","Krtek hardly speaks, he mostly giggles, so kids anywhere can follow his adventures. A Krtek toy even flew into space!"]],"DK":[["food","What are Denmark's famous open sandwiches on dark rye bread called?","Smorrebrod","Smorgasbord","Bruschetta","Tartine","They are piled high with toppings like egg, shrimp or herring, and you eat them with a knife and fork, not your hands."],["party","At Fastelavn, Danish kids dress up and whack a barrel until what falls out?","Sweets","Confetti","Toys","Apples","The kid who makes the sweets spill out is crowned cat queen, and whoever knocks down the last piece becomes cat king."],["arts","Which Danish writer gave us The Little Mermaid and The Ugly Duckling?","Hans Christian Andersen","The Brothers Grimm","Charles Perrault","Roald Dahl","A bronze statue of the Little Mermaid sits on a rock by Copenhagen harbour, gazing out to sea."],["words","Which Danish word means a cosy, happy feeling, like candles and hot cocoa with friends?","Hygge","Lagom","Sisu","Gemutlichkeit","Danes light lots of candles in the dark winter months, and they burn more candles per person than almost anyone."],["nature","Which graceful white bird is Denmark's national bird?","Mute swan","White stork","Snowy owl","Herring gull","Mute swans are not really silent: they hiss and snort, and their wings make a loud whooshing sound as they fly."],["life","Copenhagen's Tivoli Gardens, opened in 1843, is one of the oldest what in the world?","Amusement parks","Zoos","Libraries","Toy shops","Walt Disney visited Tivoli before building Disneyland, and it still has a wooden roller coaster from 1914."]],"EE":[["food","Which powdery mix of roasted grains do Estonians stir into buttermilk or yogurt?","Kama","Muesli","Granola","Semolina","Kama is a blend of roasted barley, rye, oats and peas, and it is a favourite Estonian breakfast or snack."],["party","Every five years, over 20,000 Estonians sing together in one giant choir at which event?","Song Festival","Midsummer Eve","Eurovision","Christmas Market","The singers stand on a huge arched stage in Tallinn, and the crowd watching can reach nearly 100,000 people!"],["arts","What is the kannel, Estonia's national instrument?","A plucked zither","A bagpipe","A drum","A flute","Players rest the wooden kannel on their lap and pluck its strings, a sound heard in Estonian songs for centuries."],["words","The Estonian word jäääär has four vowels in a row. What does it mean?","Edge of the ice","Ice cream","Snowstorm","Frozen lake","Estonian is a cousin of Finnish, not of its neighbours Latvian or Russian, and it has 14 noun cases."],["nature","In Estonia's Soomaa National Park, spring floods are so big they are called what?","The fifth season","The big melt","Water winter","Super spring","Roads and meadows go under water, so for a few weeks people get around by canoe and wooden dugout boat."],["life","In the Estonian sport of kiiking, what do people try to do on a giant swing?","Swing in a full circle","Jump the farthest","Stand on one leg","Swing with eyes shut","Riders are strapped to the swing by their feet. The longer the swing arms, the harder it is to loop the loop!"]],"FI":[["food","Which Finnish rye-crust pastries are filled with rice porridge and topped with egg butter?","Karelian pies","Pierogi","Empanadas","Cornish pasties","They have crinkly edges pinched by hand, and Finns enjoy them warm for breakfast or as a snack."],["party","On Vappu, 1 May, what do many Finns wear while picnicking in the parks?","White student caps","Paper crowns","Flower wreaths","Santa hats","Finns get the cap when they finish upper secondary school, and they eat swirly fried treats called tippaleipa."],["arts","What is the name of Finland's national epic of heroes, magic and a wonder-machine called the Sampo?","Kalevala","Beowulf","Edda","Odyssey","Its hero Vainamoinen is a wise old singer who works magic with his songs. Tolkien loved the Kalevala!"],["words","Which Finnish word means a never-give-up kind of grit and courage?","Sisu","Hygge","Lagom","Ikigai","Finns use sisu to describe pushing on through tough times, like a long, dark and freezing winter."],["nature","Which rare seal lives only in Finland's Lake Saimaa, a freshwater lake?","Saimaa ringed seal","Harp seal","Elephant seal","Monk seal","These seals dig snow caves on the ice to raise their pups, and fans watch them on a live webcam called Norppalive."],["life","Which hit mobile game, with birds flung from a slingshot, was made in Finland?","Angry Birds","Flappy Bird","Candy Crush","Minecraft","The Finnish company Rovio released it in 2009, and it became one of the most downloaded games ever."]],"FR":[["food","Which long, crusty French bread was added to UNESCO's list of cultural treasures in 2022?","Baguette","Ciabatta","Pretzel","Focaccia","A traditional French baguette may only be made from flour, water, salt and yeast, and many people buy one every day."],["party","On 1 April, what do French kids secretly stick on people's backs as a joke?","A paper fish","A paper crown","A paper star","A paper heart","The prank is called Poisson d'avril, meaning April fish, and shops sell chocolate fish for the day too."],["arts","Which French painter is famous for his dreamy pictures of water lilies in his garden at Giverny?","Claude Monet","Vincent van Gogh","Pablo Picasso","Leonardo da Vinci","Monet painted his lily pond around 250 times, trying to capture how the light changed through the day."],["words","What do French people say before a meal, meaning enjoy your food?","Bon appetit","Gesundheit","Salud","Prost","Hello in French is bonjour, and friends often greet each other with a kiss on each cheek, called la bise."],["nature","Which giant sand dune on France's Atlantic coast is the tallest in Europe?","Dune of Pilat","Rubjerg Knude","Maspalomas Dunes","Curonian Spit","It is over 100 metres tall, with pine forest on one side and ocean on the other. Kids love sliding down it!"],["life","Which famous bike race zooms around France every July?","Tour de France","Giro d'Italia","Vuelta a Espana","Tour of Flanders","The race leader wears a yellow jersey, and after three weeks of riding the race usually finishes in Paris."]],"DE":[["food","Which German cake has layers of chocolate sponge, cherries and whipped cream?","Black Forest gateau","Sachertorte","Tiramisu","Red velvet cake","It is named after the Black Forest region, and it is decorated with chocolate shavings and cherries on top."],["party","On St Martin's Day in November, what do German kids carry through the streets?","Paper lanterns","Flags","Pumpkins","Balloons","They sing lantern songs as they walk, often following a rider dressed as St Martin on a horse."],["arts","Which German brothers collected fairy tales like Hansel and Gretel and Snow White?","The Brothers Grimm","The Wright Brothers","The Lumiere Brothers","The Marx Brothers","Jacob and Wilhelm Grimm gathered over 200 stories, and a German Fairy Tale Route now visits towns from the tales."],["words","Which German word, meaning children's garden, do English speakers use for early school?","Kindergarten","Gymnasium","Rucksack","Wanderlust","Teacher Friedrich Frobel came up with it in 1840. He believed kids should grow like plants in a garden."],["nature","Which UNESCO area on Germany's North Sea coast lets you walk on the seabed at low tide?","Wadden Sea","Black Forest","Lake Constance","Spreewald","On guided mudflat hikes you can spot crabs, worms and shells, and seals rest on sandbanks nearby."],["life","Which chewy sweets shaped like little bears were invented in Germany in 1922?","Gummy bears","Jelly beans","Marshmallows","Liquorice","Hans Riegel of Bonn made the first ones, called Dancing Bears. His company Haribo is named after him and his town."]],"GR":[["food","Which salty white cheese, made mostly from sheep's milk, crowns a Greek salad?","Feta","Halloumi","Mozzarella","Ricotta","Feta is stored in salty water called brine, and in Europe only cheese made in Greece in this way can be called feta."],["party","At Greek Easter, people tap eggs together in a game. What colour are the eggs dyed?","Red","Blue","Gold","Green","Players knock their eggs against each other, and the person whose egg stays uncracked is said to have good luck."],["arts","Which long-necked string instrument gives Greek music its bright, twangy sound?","Bouzouki","Balalaika","Sitar","Banjo","The famous sirtaki dance, made popular by the film Zorba the Greek, starts slowly and gets faster and faster."],["words","The word alphabet comes from alpha and beta, the first two letters of which language?","Greek","Latin","Arabic","Russian","Greek letters are still used in maths and science today, like pi, the symbol for the number 3.14."],["nature","Which mountain, the highest in Greece, was said to be the home of the ancient gods?","Mount Olympus","Mount Etna","Mount Ararat","Mount Vesuvius","Zeus was said to rule from its peak. It is about 2,900 metres high and is often hidden in the clouds."],["life","Which ancient temple for the goddess Athena stands on the Acropolis hill in Athens?","Parthenon","Pantheon","Colosseum","Karnak Temple","It was built about 2,500 years ago, and its columns bulge slightly in the middle so they look perfectly straight from afar."]],"HU":[["food","Which red spice, made from dried peppers, gives Hungarian goulash its colour?","Paprika","Saffron","Turmeric","Cinnamon","Goulash comes from gulyas, meaning cattle herder, because herders cooked it in pots over open fires."],["party","At the Busojaras carnival in Mohacs, people in wooden masks and sheepskins chase away what?","Winter","Wolves","Rain","Summer","The masked busos arrive by rowing boats across the Danube, making a racket with rattles and horns for six days."],["arts","Which Hungarian folk dance starts slow and then speeds up into fast, whirling steps?","Csardas","Polka","Flamenco","Waltz","Csardas comes from csarda, an old roadside inn where people gathered to dance to violins and the cimbalom."],["words","Hungarian is not related to its neighbours' languages. Which faraway language is its cousin?","Finnish","Spanish","Greek","Irish","Hungarian belongs to the Uralic language group. To say thank you in Hungarian, you say koszonom."],["nature","Which Hungarian dog breed has a coat of long cords that look like dreadlocks?","Puli","Poodle","Afghan Hound","Old English Sheepdog","Pulis were bred to herd sheep, and their corded coats keep them warm and dry in any weather."],["life","Hungary has won more Olympic gold medals than any other country in which pool sport?","Water polo","Diving","Artistic swimming","Synchronised diving","Hungary's men's team has won Olympic water polo gold nine times. Players must tread water for the whole match!"]],"IS":[["food","Which thick, creamy Icelandic dairy food looks like yogurt but is really a kind of soft cheese?","Skyr","Kefir","Labneh","Ayran","Vikings brought skyr to Iceland over 1,000 years ago, and Icelanders often eat it with berries."],["party","In Iceland, kids put a shoe on the windowsill before Christmas for visits from how many Yule Lads?","13","3","7","12","Each lad has a silly habit, like Spoon-Licker or Door-Slammer, and leaves a small gift in good kids' shoes."],["arts","What is a lopapeysa, a classic piece of Icelandic clothing?","A wool sweater","A fur hat","A sealskin boot","A long raincoat","It has a round pattern circling the neck and shoulders, and Icelandic wool stays warm even when it gets wet."],["words","In Iceland, if a man called Jon has a daughter named Anna, what is her last name?","Jonsdottir","Jonsson","Jonsen","Annasdottir","Most Icelanders have no surname. Their last name says whose child they are, so the phone book is sorted by first name!"],["nature","Which bird with a colourful beak, nicknamed the clown of the sea, nests in huge numbers in Iceland?","Atlantic puffin","Toucan","Penguin","Kingfisher","Around 60 percent of the world's Atlantic puffins nest in Iceland, digging burrows in grassy clifftops."],["life","Icelandic horses have a smooth extra gait that most horses cannot do. What is it called?","Tolt","Canter","Gallop","Trot","The tolt is so smooth riders barely bounce. No other horses may be brought into Iceland, so the breed stays pure."]],"IE":[["food","Which Irish bread rises with bread soda instead of yeast and has a cross cut on top?","Soda bread","Sourdough","Bagel","Brioche","Folk tales say the cross lets the fairies out, but it really helps the thick loaf bake evenly all the way through."],["party","On St Brigid's Day in February, what do many Irish people weave from rushes?","A cross","A basket","A hat","A mat","St Brigid's crosses have four arms and a woven square middle, and are hung in homes to welcome spring."],["arts","In traditional Irish step dancing, what do dancers famously keep very still?","Their arms","Their feet","Their legs","Their toes","Hard-shoe dancers tap out rhythms like drummers, and the show Riverdance made Irish dancing famous worldwide."],["words","Which Irish greeting means a hundred thousand welcomes?","Cead mile failte","Slainte","Dia duit","Go raibh maith agat","Irish is one of Europe's oldest written languages, and road signs in Ireland are written in both Irish and English."],["nature","Which towering Atlantic sea cliffs in County Clare rise over 200 metres from the waves?","Cliffs of Moher","White Cliffs of Dover","Cliffs of Etretat","Preikestolen","Thousands of seabirds, including puffins, nest on the cliffs, and on clear days you can see the Aran Islands."],["life","Which super-fast Irish sport uses a wooden stick and a small leather ball called a sliotar?","Hurling","Hockey","Lacrosse","Cricket","Hurling is said to be over 3,000 years old, and players can balance the ball on their stick as they run."]],"IT":[["food","Which cold Italian treat is like ice cream but denser, with less air whipped in?","Gelato","Sorbet","Frozen yogurt","Kulfi","Gelato is served a little warmer than ice cream, so it feels softer and the flavours taste stronger."],["party","During the Carnival of Venice, what do people famously wear on their faces?","Decorated masks","Face paint","Veils","Fake beards","Some masks have long beaks or golden glitter, and people stroll through Venice in costumes from centuries ago."],["arts","Which wooden puppet, whose nose grows when he tells a lie, comes from an Italian story?","Pinocchio","Mr Punch","The Nutcracker","Petrushka","Carlo Collodi wrote the story in 1883, and the name Pinocchio means pine nut in the Tuscan dialect."],["words","Which Italian word can mean both hello and goodbye?","Ciao","Grazie","Prego","Bravo","Prego is another handy word: it can mean you're welcome, please, or go ahead!"],["nature","Which volcano on the Italian island of Sicily is one of the most active in the world?","Mount Etna","Mount Vesuvius","Mount Fuji","Mount Teide","Etna is the tallest active volcano in Europe, and farmers grow oranges and pistachios on its rich slopes."],["life","Which Italian genius painted the Mona Lisa and sketched flying machines over 500 years ago?","Leonardo da Vinci","Michelangelo","Galileo Galilei","Raphael","Leonardo wrote many notes in mirror writing, from right to left, so you need a mirror to read them easily."]],"LV":[["food","Which sweet Latvian dessert is made from dark rye bread, dried fruit and whipped cream?","Bread soup","Trifle","Rice pudding","Apple crumble","Latvians love their dark rye bread so much that leftover crusts are soaked and turned into this sweet, fruity treat."],["party","On Jani, Latvia's midsummer festival, what do people wear on their heads?","Wreaths of leaves","Paper crowns","Fur hats","Feathers","Men wear oak leaves and women wear flowers, and everyone eats caraway cheese and stays up by the bonfire until sunrise."],["arts","Latvian folk songs called dainas were collected in a famous wooden cabinet. About how many?","Over 200,000","About 500","About 5,000","About 20,000","The Cabinet of Folksongs, made by Krisjanis Barons, is on a UNESCO list. Most dainas are just four lines long."],["words","Latvian has only one close living relative language. Which one?","Lithuanian","Estonian","Russian","Polish","Latvian and Lithuanian are the last two living Baltic languages. Hello in Latvian is sveiki!"],["nature","Which small black-and-white bird that bobs its long tail is Latvia's national bird?","White wagtail","Barn swallow","Magpie","Great tit","Wagtails often run along riverbanks and roads, flicking their tails up and down as they hunt insects."],["life","Riga has one of the world's biggest collections of buildings in which decorated style?","Art Nouveau","Gothic","Baroque","Brutalist","About a third of the buildings in central Riga are Art Nouveau, with stone faces, dragons and peacocks on the walls."]],"LI":[["food","Which cheesy little dumplings, often served with apple sauce, are Liechtenstein's national dish?","Kasknopfle","Gnocchi","Pierogi","Pelmeni","They are tossed with strong local cheese and topped with crispy fried onions, and the apple sauce adds a sweet surprise."],["party","On National Day, 15 August, Liechtenstein's prince invites everyone to what?","A party at his castle","A boat race","A ski race","A cheese fair","People join the prince in the castle garden above Vaduz, and the day ends with fireworks over the Rhine valley."],["arts","Liechtenstein's national anthem uses the same tune as which other country's anthem?","United Kingdom","Germany","Switzerland","Austria","The song is called Oben am jungen Rhein, meaning up on the young Rhine, and it praises the country's mountains."],["words","The name Liechtenstein comes from old German words meaning what?","Light stone","Little mountain","Green valley","River castle","The name came from a castle near Vienna owned by the princes, long before they bought land beside the Rhine."],["nature","Which river forms Liechtenstein's western border with Switzerland?","Rhine","Danube","Rhone","Inn","The Rhine starts in the Swiss Alps nearby, then flows all the way to the North Sea through Germany and the Netherlands."],["life","Which winter sport made Liechtenstein's Hanni Wenzel an Olympic champion?","Alpine skiing","Figure skating","Ski jumping","Biathlon","Wenzel won two golds in 1980, and her brother Andreas also won medals, making them heroes in this tiny country."]],"LT":[["food","Which big Lithuanian potato dumplings are named after a kind of airship because of their shape?","Cepelinai","Pierogi","Kalduny","Knodel","They are stuffed with meat or curd cheese and usually topped with sour cream and crispy bacon bits."],["party","At Uzgavenes, a Lithuanian festival before Lent, which food do people eat lots of?","Pancakes","Chocolate eggs","Fruit cake","Mooncakes","People dress up in funny masks, and a play-fight between a fat and a skinny character shows that winter is over."],["arts","Which golden fossilised tree resin, washed up on Lithuania's beaches, is used to make jewellery?","Amber","Jade","Coral","Pearl","Amber can be millions of years old, and some pieces even have tiny ancient insects trapped inside."],["words","How do you say thank you in Lithuanian?","Aciu","Paldies","Spasibo","Dekuji","Lithuanian is one of the oldest living languages in Europe and still shares some words with ancient Sanskrit from India."],["nature","Which long, thin strip of sand dunes separates a lagoon from the Baltic Sea in Lithuania?","Curonian Spit","Dune of Pilat","Hel Peninsula","Wadden Sea","It is nearly 100 kilometres long, and its giant drifting sand dunes are among the tallest in Europe."],["life","In 1989, French map experts named a spot just north of Vilnius as the centre of what?","Europe","The world","The Baltic Sea","The Northern Hemisphere","Today a white stone column topped with a crown of stars marks the spot, and visitors love taking photos there."]],"LU":[["food","Luxembourg's national dish is smoked pork collar served with which vegetable?","Broad beans","Sauerkraut","Green peas","Red cabbage","The dish is called Judd mat Gaardebounen, and the beans are cooked in a creamy sauce with bits of bacon."],["party","Which giant funfair, first held in 1340, fills Luxembourg City every summer?","Schueberfouer","Oktoberfest","Tivoli","Kermis","It began as a market for farmers and now has roller coasters, a big wheel and crispy fried fish."],["arts","On Easter Monday in Luxembourg, people buy clay whistles shaped like what?","Birds","Fish","Rabbits","Frogs","The whistles are called Peckvillercher, and the old market where they are sold is called Emaischen."],["words","How do people say hello in Luxembourgish?","Moien","Servus","Hej","Gruezi","Most people in Luxembourg speak at least three languages, often switching between them in one conversation!"],["nature","Which rocky, forested region of Luxembourg is nicknamed Little Switzerland?","Mullerthal","Black Forest","Jura","Vosges","Hikers squeeze through narrow rock passages covered in moss and pass the Schiessentumpel, a waterfall with a stone bridge."],["life","Under Luxembourg City lies a maze of tunnels dug into the rock. What are they called?","The Casemates","The Catacombs","The Labyrinth","The Grottoes","About 17 kilometres of passages survive, and visitors can explore parts of them with views out over the valley."]],"MT":[["food","Which flaky pastry filled with ricotta or mushy peas is a favourite snack in Malta?","Pastizzi","Empanadas","Samosas","Pierogi","Pastizzi are shaped like little diamonds and cost very little. Maltese people grab them warm from local bakeries."],["party","What are the summer village feasts in Malta called, with brass bands, decorated streets and fireworks?","Festa","Fasching","Mardi Gras","Hogmanay","Each village honours its own patron saint, and teams spend all year building fireworks to light up the night sky."],["arts","Malta's colourful fishing boats, called luzzu, have what painted on the front?","A pair of eyes","A shining sun","A seashell","A dolphin","The eyes are thought to go back to the ancient Phoenicians and are meant to watch over fishermen at sea."],["words","Maltese grew from Arabic, but which alphabet is it written in?","Latin alphabet","Arabic script","Greek alphabet","Cyrillic alphabet","Maltese is the only official EU language that grew from Arabic. Hello in Maltese is Bongu, borrowed from Italian!"],["nature","What is the national bird of Malta, a songbird with blue feathers?","Blue rock thrush","Kingfisher","Blue tit","Peacock","In Maltese it is called il-Merill. It loves rocky cliffs by the sea, and its song echoes off old stone walls."],["life","In Malta you can visit a colourful seaside village built as a film set for which cartoon sailor?","Popeye","Captain Hook","Sinbad","Jack Sparrow","Popeye Village was built in 1979 and 1980 for a Popeye movie, and visitors can still wander through its wooden houses."]],"MD":[["food","Which golden cornmeal dish, served with cheese and sour cream, is a Moldovan favourite?","Mamaliga","Goulash","Pilaf","Couscous","Mamaliga is cooked so thick that it is often sliced with a piece of thread instead of a knife!"],["party","On 1 March, people in Moldova give each other a red and white charm. What is it called?","Martisor","Rakhi","Pysanka","Kolach","Martisor welcomes spring. People wear the little red and white tassel for weeks, then often tie it to a blossoming tree."],["arts","Which lively circle dance, where everyone holds hands, is danced at Moldovan weddings?","Hora","Flamenco","Sirtaki","Tarantella","In the hora, dancers move round and round in a big ring, and the circle keeps growing as more guests join in."],["words","How do you say thank you in Romanian, the main language of Moldova?","Multumesc","Dziekuje","Spasibo","Hvala","Romanian has letters with little tails, like s and t with a comma underneath, which make sh and ts sounds."],["nature","Which ancient wild ox appears on Moldova's coat of arms and flag?","Aurochs","Bison","Yak","Water buffalo","Aurochs were huge wild cattle that once roamed the forests of Europe. They are the ancestors of today's farm cows."],["life","Which catchy 2003 song by the Moldovan band O-Zone became a worldwide hit?","Dragostea din tei","Macarena","Gangnam Style","Despacito","Kids around the world sang its numa numa chorus, and a funny video of it became one of the first big hits online."]],"MC":[["food","Which little fried pastry filled with Swiss chard and cheese is Monaco's national snack?","Barbajuan","Pastizzi","Empanada","Samosa","Its name means Uncle John in the local language. People eat piles of them on Monaco's national day, 19 November."],["party","Each January, Monaco honours its patron saint, Devota. What do people set alight by the harbour?","An old boat","A straw man","A wooden horse","A paper dragon","A legend says a dove guided Saint Devota's little boat to Monaco's shore, so a boat is lit by the harbour each year."],["arts","Monaco hosts a famous circus festival every winter. What is its top prize?","The Golden Clown","The Golden Lion","The Golden Bear","The Golden Palm","Prince Rainier III, who loved the circus, started the festival in 1974. Acrobats and jugglers come from all over the world."],["words","Besides French, which local language do children in Monaco learn at school?","Monegasque","Catalan","Basque","Breton","Monegasque is close to the old language of Genoa in Italy. Street signs in the old town show names in French and Monegasque."],["nature","Monaco's Oceanographic Museum sits on a cliff above which sea?","Mediterranean Sea","Black Sea","Baltic Sea","Red Sea","Ocean explorer Jacques Cousteau ran the museum for over 30 years. Its tanks hold sharks, turtles and coral reef fish."],["life","Which Hollywood film star married Prince Rainier and became a princess of Monaco?","Grace Kelly","Audrey Hepburn","Marilyn Monroe","Elizabeth Taylor","Grace Kelly married Prince Rainier III in 1956. Today a beautiful rose garden in Monaco is named after Princess Grace."]],"ME":[["food","Which hearty dish of cornmeal and potatoes, mixed with cheese and cream, warms Montenegro's mountain villages?","Kacamak","Moussaka","Goulash","Paella","Kacamak is stirred for a long time until it is thick and smooth, and is often eaten with a cup of sour milk."],["party","Each winter, the town of Herceg Novi in Montenegro holds a festival for which yellow flower?","Mimosa","Sunflower","Daffodil","Tulip","The Mimosa Festival has run since 1969, with parades, music and fish feasts to welcome the first signs of spring."],["arts","Which one-stringed instrument, played with a bow, is used to sing old hero tales in Montenegro?","Gusle","Balalaika","Bouzouki","Sitar","The player rests the gusle on the knee. Its single string was once made of horse hair, and the songs can last for hours."],["words","Montenegrin can be written in two alphabets. One is Latin. What is the other?","Cyrillic","Greek","Arabic","Georgian","Montenegrin even added two extra letters, an S and a Z with accents, that nearby languages do not officially use."],["nature","Which river carves Europe's deepest canyon, about 1,300 metres deep, in Montenegro?","Tara","Danube","Rhine","Seine","Rafters zoom down the Tara's clear blue-green water, and a tall white arched bridge crosses high above the canyon."],["life","Which Montenegrin monastery is built right into the face of a tall cliff?","Ostrog","Meteora","Rila","Studenica","Ostrog's bright white walls seem to grow out of the rock, high up on a mountain, and visitors come from all over the world."]],"NL":[["food","Which Dutch treat is two thin waffles stuck together with gooey caramel syrup?","Stroopwafel","Churro","Crepe","Baklava","Dutch people often rest a stroopwafel on top of a hot cup of tea or coffee so the warm syrup inside goes soft."],["party","On King's Day in the Netherlands, what colour do people dress in from head to toe?","Orange","Red","Blue","Green","The whole country turns into a giant street market, and kids sell their old toys on blankets along the pavement."],["arts","Which Dutch city gave its name to famous blue and white pottery?","Delft","Rotterdam","Utrecht","Haarlem","Delft Blue began in the 1600s, when Dutch potters tried to copy precious porcelain that ships brought from China."],["words","Which Dutch word means cosy, friendly and nice to be with?","Gezellig","Hygge","Lagom","Fika","There is no single English word for gezellig. A warm evening chatting with friends over cake is very gezellig!"],["nature","At low tide, people in the Netherlands can walk across the sea floor of which sea?","Wadden Sea","Baltic Sea","Irish Sea","Adriatic Sea","Mudflat walking, called wadlopen, lets you hike to islands with a guide. You might even spot seals resting on sandbanks!"],["life","Which way of getting around do the Dutch love so much that there are more of them than people?","Bicycles","Scooters","Skateboards","Roller skates","The Netherlands has about 23 million bikes for 18 million people, and many kids cycle to school on their own."]],"MK":[["food","Which baked bean dish, cooked in a clay pan, is North Macedonia's national dish?","Tavce gravce","Moussaka","Paella","Cassoulet","Tavce gravce means beans in a pan. They are baked with onions, peppers and paprika until thick and bubbly."],["party","Every July, the village of Galicnik in North Macedonia holds a festival around what event?","A traditional wedding","A grape harvest","A cheese race","A kite contest","One real couple marries in old-style clothes, with drums, pipes, folk dancing and the whole village watching."],["arts","The famous Ohrid pearls of North Macedonia do not come from oysters. What are they made from?","Fish scales","Seashells","Coloured glass","Tree resin","The secret recipe uses scales of a tiny lake fish called plasica, and it is handed down in only a few Ohrid workshops."],["words","How do you say thank you in Macedonian?","Blagodaram","Efharisto","Dziekuje","Spasibo","Macedonian uses the Cyrillic alphabet with 31 letters, including a couple that no other language uses."],["nature","Which rare wild cat, shown on North Macedonia's 5 denar coin, lives in its mountains?","Balkan lynx","Snow leopard","Cheetah","Ocelot","Only a few dozen Balkan lynx are left. They have tufted ears and big furry paws that work like snowshoes."],["life","Which famous nun, known for helping poor people in India, was born in Skopje?","Mother Teresa","Florence Nightingale","Joan of Arc","Hildegard of Bingen","Skopje has a memorial house where her childhood home once stood, and she won the Nobel Peace Prize in 1979."]],"NO":[["food","Which sweet brown cheese, tasting a bit like caramel, is a Norwegian favourite?","Brunost","Feta","Gouda","Halloumi","Norwegians cut thin slices of brunost with a cheese slicer, a handy tool invented in Norway in 1925!"],["party","On 17 May, Norway's national day, who march at the front of the big parades?","Children","Fishermen","Firefighters","Farmers","Kids march with flags and school bands, the royals wave from the palace balcony in Oslo, and lots of ice cream is eaten!"],["arts","What is the name of Norway's embroidered folk costume, worn on special days?","Bunad","Kimono","Dirndl","Sari","Each area has its own bunad pattern, often with shiny silver brooches. Some take a year or more to sew by hand!"],["words","Which English word for a winter sport comes from Norwegian?","Ski","Sledge","Skate","Toboggan","Ski comes from an old Norse word for a split piece of wood. Norwegians joke that kids are born with skis on their feet!"],["nature","What are the swirling green lights seen in the winter sky over northern Norway called?","Northern lights","Shooting stars","Moonbows","Comet tails","They glow when tiny bits from the Sun hit the air high above the Earth. Tromso is one of the best places to see them."],["life","Which Norwegian explorer was the first person to reach the South Pole, in 1911?","Roald Amundsen","Ernest Shackleton","Edmund Hillary","Robert Peary","Amundsen's team used dog sleds and skis, and planted Norway's flag at the pole on 14 December 1911."]],"PL":[["food","Which smoked sheep's cheese, with pretty patterns on it, comes from Poland's Tatra Mountains?","Oscypek","Halloumi","Feta","Brie","Mountain shepherds press oscypek into carved wooden moulds, which give each spindle-shaped cheese its patterned crust."],["party","On Christmas Eve in Poland, the big supper begins when someone spots what?","The first star","The first snowflake","A full moon","A rainbow","Polish homes also set an extra place at the table, in case a surprise guest or traveller knocks at the door."],["arts","Which colourful Polish folk art is made by cutting patterns out of paper?","Wycinanki","Origami","Batik","Quilling","Long ago, villagers cut wycinanki with sheep shears and used them to brighten their walls for holidays like Easter."],["words","How do you say good day, or hello, in Polish?","Dzien dobry","Guten Tag","Bonjour","Buongiorno","Polish loves clusters of letters, as in the tongue twister W Szczebrzeszynie chrzaszcz brzmi w trzcinie, about a buzzing beetle."],["nature","Which huge animal, Europe's heaviest land mammal, roams Poland's Bialowieza Forest?","European bison","Brown bear","Musk ox","Yak","Wild bison almost vanished about 100 years ago, but bison from zoos were bred and brought back to this ancient forest."],["life","Which astronomer, born in Torun in Poland, put the Sun at the centre of his map of the planets?","Nicolaus Copernicus","Galileo Galilei","Isaac Newton","Johannes Kepler","His famous book came out in 1543. His home town of Torun is also known for its tasty gingerbread, called pierniki!"]],"PT":[["food","Which salted fish do people in Portugal say can be cooked 365 ways, one for each day?","Cod","Salmon","Tuna","Herring","Salted cod, called bacalhau, is soaked in water before cooking, and it is the star of many Christmas Eve dinners."],["party","During Porto's Saint John festival in June, people playfully bop each other with what?","Plastic hammers","Pillows","Feathers","Balloons","On the night of 23 June, Porto fills with music, grilled sardines and fireworks over the Douro River."],["arts","What are Portugal's painted blue and white wall tiles called?","Azulejos","Talavera","Majolica","Zellige","Tiles cover whole churches and stations. Porto's Sao Bento station has about 20,000 of them showing old stories."],["words","In Portuguese, a boy says obrigado for thank you. What does a girl say?","Obrigada","Gracias","Grazie","Merci","The word means obliged, so it matches the speaker. Portuguese is spoken by over 250 million people around the world."],["nature","Which Portuguese beach town is famous for some of the biggest waves ever surfed?","Nazare","Malibu","Biarritz","Waikiki","A huge underwater canyon pushes ocean swells up into giant walls of water, some over 25 metres high!"],["life","Which football superstar was born on Portugal's island of Madeira?","Cristiano Ronaldo","Lionel Messi","Neymar","Kylian Mbappe","Madeira's airport is named after him, and he has scored more official goals than any other men's player in history."]],"RO":[["food","Which Romanian dish is minced meat and rice rolled up in cabbage leaves?","Sarmale","Pierogi","Goulash","Moussaka","Sarmale are slow-cooked for hours and served with sour cream and golden mamaliga, especially at Christmas."],["party","At Easter in Romania, especially in Bucovina, people decorate what with fine wax patterns?","Eggs","Candles","Bread loaves","Bells","Artists draw with melted beeswax, then dip the egg in dye. Red eggs are tapped together in a friendly cracking game."],["arts","Which Romanian folk instrument is a curved row of pipes that you blow across?","Nai pan flute","Bagpipes","Ocarina","Harmonica","The nai has about 20 pipes. The musician Gheorghe Zamfir made its sweet, breathy sound famous worldwide."],["words","Romanian is the only big language in Eastern Europe that comes from which ancient language?","Latin","Ancient Greek","Old Slavonic","Gothic","That is why Romanian sounds a bit like Italian. Hello is buna ziua, and zi, meaning day, comes from Latin."],["nature","Romania's Danube Delta has Europe's biggest colonies of which big-beaked bird?","Pelicans","Flamingos","Toucans","Puffins","The delta is a maze of reeds, lakes and channels where the Danube meets the Black Sea, home to over 300 kinds of birds."],["life","Which Romanian gymnast scored the first ever perfect 10 at the Olympics, in 1976?","Nadia Comaneci","Simone Biles","Olga Korbut","Mary Lou Retton","She was just 14! The scoreboard could not show 10.00, so it showed 1.00 instead, and the crowd was puzzled at first."]],"RU":[["food","Which little Russian dumplings, filled with meat, were once frozen outside in the Siberian snow?","Pelmeni","Gyoza","Ravioli","Momos","Siberian cooks made hundreds at once and kept them frozen in the snow. They are served with sour cream or butter."],["party","During Maslenitsa, Russia's week-long goodbye to winter, which food do people eat lots of?","Blini pancakes","Doughnuts","Waffles","Pretzels","Round golden blini are like little suns. The week ends with sledging, games and burning a straw figure of winter."],["arts","Which famous ballet, with music by Russian composer Tchaikovsky, is about a princess turned into a bird?","Swan Lake","Giselle","Coppelia","Cinderella","Swan Lake first opened in Moscow in 1877. Dancers in white tutus flutter their arms like wings."],["words","How do you say thank you in Russian?","Spasibo","Dziekuje","Danke","Arigato","Russian is written in the Cyrillic alphabet, which has 33 letters. Some look like English ones but sound different!"],["nature","Which is the biggest cat in the world, living in the snowy forests of Russia's Far East?","Amur tiger","Snow leopard","Lion","Jaguar","Also called the Siberian tiger, it has thick fur and a layer of fat to stay warm when it is minus 40 degrees outside."],["life","Which Russian became the first person ever to fly into space, in 1961?","Yuri Gagarin","Neil Armstrong","Buzz Aldrin","John Glenn","His trip around the Earth took 108 minutes. As he blasted off he cheerfully shouted Poyekhali, which means Let's go!"]],"SM":[["food","Which layered wafer and chocolate cake from San Marino is named after its three peaks?","Torta Tre Monti","Tiramisu","Sachertorte","Panettone","Its thin, crispy wafer layers are filled with hazelnut chocolate cream, and the name means cake of the three mountains."],["party","On 1 April and 1 October, San Marino celebrates as new leaders take charge. How many share the top job?","Two","One","Three","Seven","They are called Captains Regent and lead for six months. Crowds watch a parade of guards in bright old-style uniforms."],["arts","According to legend, San Marino was founded by Saint Marinus. What was his job?","Stonemason","Fisherman","Baker","Shepherd","Marinus came from the island of Rab, across the sea in today's Croatia, and climbed Mount Titano to live a quiet life."],["words","Which Latin word, meaning freedom, is written on San Marino's flag?","Libertas","Veritas","Fortuna","Pax","The flag is white and light blue, for the clouds and the sky. Most people in San Marino speak Italian."],["nature","From the top of San Marino's mountain on a clear day, which sea can you see?","Adriatic Sea","Black Sea","Baltic Sea","Caspian Sea","Mount Titano rises about 739 metres, and the whole small country is surrounded on every side by Italy."],["life","San Marino is famous among collectors for printing beautiful what?","Postage stamps","Comic books","Trading cards","Board games","Its stamps first came out in 1877, and visitors still buy them as souvenirs. Its rare euro coins are loved by collectors too."]],"RS":[["food","Which large, spiced grilled meat patty is Serbia's own kind of burger?","Pljeskavica","Kofta","Schnitzel","Gyros","The town of Leskovac holds a big grill festival every year, where cooks have made giant pljeskavicas for the record books."],["party","Every summer, the Serbian village of Guca hosts a huge festival for which instrument?","Trumpet","Violin","Bagpipes","Accordion","Brass bands play from morning to night, and hundreds of thousands of visitors come to listen and dance in the streets."],["arts","What is the Serbian folk dance where people hold hands in a chain or circle?","Kolo","Sirtaki","Polka","Tarantella","Kolo means wheel. Dancers do quick, bouncy little steps with their feet while their upper bodies stay almost still."],["words","How do you say thank you in Serbian?","Hvala","Danke","Spasibo","Efharisto","Serbian is written in both Cyrillic and Latin letters, and you can see both on signs, menus and newspapers."],["nature","Which great river cuts through the Iron Gates gorge on Serbia's border?","Danube","Rhine","Volga","Elbe","In Djerdap National Park the river squeezes between tall cliffs, and an ancient Roman plaque is carved into the rock."],["life","Which inventor, famous for his work on electricity, has Belgrade's airport named after him?","Nikola Tesla","Thomas Edison","Alessandro Volta","Michael Faraday","Belgrade has a Tesla museum, and the unit used to measure magnetic strength, the tesla, is named after him."]],"SK":[["food","Slovakia's national dish is little potato dumplings with sheep's cheese. What is it called?","Bryndzove halusky","Pierogi","Gnocchi","Spaetzle","It is topped with crispy bits of bacon and often enjoyed with a glass of zincica, a sheep's whey drink."],["party","On Easter Monday in Slovakia, boys playfully splash girls with what?","Water","Flour","Paint","Confetti","It is said to keep the girls fresh and healthy all year. The girls thank them with painted eggs or sweet treats."],["arts","Which very long Slovak shepherd's flute can be taller than the person playing it?","Fujara","Didgeridoo","Alphorn","Bagpipe","The fujara can be almost 2 metres long, and its deep, breathy sound is honoured by UNESCO as a world treasure."],["words","Which neighbouring country's language is so close to Slovak that people understand each other easily?","Czech","Hungarian","German","Romanian","The two countries were once joined as Czechoslovakia. Slovaks often say hi with Ahoj, just like a sailor's greeting!"],["nature","Which nimble goat-like animal leaps across the rocky slopes of Slovakia's High Tatras?","Tatra chamois","Bighorn sheep","Mountain goat","Markhor","Tatra chamois live only in these mountains, and their special hooves grip slippery rock like rubber shoes."],["life","Which life-saving invention was patented in 1914 by Slovak inventor Stefan Banic?","Parachute","Seat belt","Life jacket","Fire escape","Banic tested his umbrella-like parachute himself by jumping from a tall building in Washington, in the United States."]],"SI":[["food","Which rolled cake with a swirl of walnut filling is a must at Slovenian holidays?","Potica","Baklava","Panettone","Stollen","Potica is baked in a round pan with a hole in the middle, and Slovenians say there are over 80 kinds of filling!"],["party","At Slovenia's Kurentovanje carnival, furry costumed figures ring bells to chase away what?","Winter","Summer","Rain","Wolves","Kurents wear sheepskin coats, masks with long red tongues and heavy cowbells on their belts as they hop through Ptuj."],["arts","Slovenian farmers have long painted bright little pictures on the fronts of what?","Beehives","Bird boxes","Milk churns","Sleds","The painted panels helped bees find home. Slovenia even started World Bee Day, held every year on 20 May."],["words","Slovene has a special word form for talking about exactly how many things?","Two","Three","Ten","Zero","It is called the dual. The Slovene words for two friends are different from those for one friend or many friends!"],["nature","Which three-peaked mountain, Slovenia's highest, appears on its flag?","Triglav","Matterhorn","Mont Blanc","Olympus","Triglav means three heads. Many Slovenians say you are not a true Slovenian until you have climbed to its top!"],["life","The valley of Planica in Slovenia is famous for record-breaking jumps in which sport?","Ski jumping","Bungee jumping","Long jump","Trampolining","Ski flyers there have soared more than 250 metres through the air, about as far as two and a half football pitches!"]],"ES":[["food","In Spain, which fried dough sticks are dipped in thick hot chocolate?","Churros","Doughnuts","Pretzels","Breadsticks","Many Spanish people enjoy churros con chocolate for breakfast, and cafes are packed with them on New Year's morning."],["party","At midnight on New Year's Eve in Spain, people eat 12 of what?","Grapes","Olives","Cherries","Almonds","They eat one grape on each of the 12 clock chimes, for luck in every month. It is tricky to finish in time!"],["arts","In a famous Spanish story, which knight charges at windmills he thinks are giants?","Don Quixote","Robin Hood","King Arthur","El Cid","Miguel de Cervantes wrote the story over 400 years ago. Don Quixote rides a skinny old horse called Rocinante."],["words","Besides Spanish, which language is spoken in Barcelona and seen on its street signs?","Catalan","Basque","Portuguese","Italian","Spain has several regional languages, including Basque, which is not related to any other language on Earth!"],["nature","Spain's highest mountain is a volcano on the Canary Islands. What is it called?","Mount Teide","Mount Etna","Vesuvius","Mont Blanc","Teide is 3,715 metres tall, and its rocky slopes look so much like Mars that scientists test space rovers there."],["life","In Catalonia, Spain, teams called castellers build tall towers out of what?","People","Sand","Ice","Playing cards","A small child wearing a helmet climbs to the very top and raises a hand, and the whole crowd cheers!"]],"SE":[["food","Sweden has a special day, 4 October, to celebrate which sweet bun?","Cinnamon bun","Hot cross bun","Croissant","Doughnut","Swedes enjoy buns during fika, a cosy break for coffee and cake with friends that many take every single day."],["party","On 13 December in Sweden, Lucia leads a procession wearing what on her head?","A crown of candles","A crown of flowers","A golden helmet","A paper hat","Lucia and her helpers wear long white gowns and sing in the dark winter morning, handing out saffron buns."],["arts","Which red wooden horse, painted with flowers, is a famous Swedish craft?","Dala horse","Rocking horse","Hobby horse","Carousel horse","Dala horses come from the Dalarna region, where woodcarvers once whittled them by the fire on long winter nights."],["words","Which Swedish word means not too much, not too little, just right?","Lagom","Hygge","Gezellig","Sisu","There is no exact English word for lagom. Swedes use it for everything from food portions to how warm a bath should be."],["nature","Which is the largest wild animal in Sweden's forests, with huge flat antlers?","Moose","Reindeer","Red deer","Roe deer","Sweden has around 300,000 moose, and drivers watch out for yellow warning signs with a moose on them."],["life","Which super-strong red-haired girl was created by Swedish author Astrid Lindgren?","Pippi Longstocking","Anne of Green Gables","Matilda","Heidi","Pippi lives in Villa Villekulla with a horse and a monkey called Mr Nilsson, and she is strong enough to lift her horse!"]],"CH":[["food","Which crispy Swiss dish is made from grated potatoes fried in a pan?","Rosti","Gnocchi","Pierogi","Gratin","Rosti was once a farmers' breakfast around Bern. Today it is eaten all over Switzerland, often with a fried egg on top."],["party","Basel's famous carnival in Switzerland begins with lanterns and drums at what time?","4 in the morning","Noon","Midnight","Sunset","At exactly 4am the city lights go out, and players with glowing lanterns and piccolo flutes march through the dark streets."],["arts","Which very long wooden horn, once used to call cows, is a symbol of Switzerland?","Alphorn","Didgeridoo","Tuba","Bugle","An alphorn can be over 3 metres long! It is traditionally made from spruce wood and has no valves or finger holes."],["words","How do people say hello in Swiss German, in places like Zurich?","Gruezi","Bonjour","Hola","Ahoj","Swiss German sounds quite different from the German spoken in Germany, and many valleys have their own way of speaking."],["nature","Which big rescue dog breed comes from a snowy Swiss mountain pass?","St Bernard","Husky","Labrador","Newfoundland","Monks at the Great St Bernard Pass kept these dogs to find lost travellers. The most famous, Barry, saved over 40 people!"],["life","Which pointed Swiss mountain is said to have inspired the shape of Toblerone chocolate?","Matterhorn","Mont Blanc","Everest","Kilimanjaro","The Matterhorn is about 4,478 metres tall, and climbers come from all over the world to try to reach its sharp peak."]],"UA":[["food","Which bright red soup made with beetroot is a favourite dish in Ukraine?","Borscht","Gazpacho","Goulash","Minestrone","Ukrainian borscht is often served with sour cream and soft garlic bread rolls called pampushky."],["party","On Christmas Eve in Ukraine, how many dishes are traditionally served at supper?","Twelve","Seven","Three","Twenty","None of them have meat, and the first is kutia, a sweet wheat porridge with honey, poppy seeds and nuts."],["arts","What is the traditional Ukrainian embroidered shirt called?","Vyshyvanka","Kimono","Dirndl","Poncho","Each region has its own colours and patterns, and on Vyshyvanka Day each May people proudly wear them to school and work."],["words","How do you say hi to a friend in Ukrainian?","Pryvit","Ciao","Salut","Hej","Ukrainian uses a Cyrillic alphabet with 33 letters, including a letter that looks like an i with two dots on top."],["nature","Ukraine has some of the world's richest farming soil. What colour is it?","Black","Red","Yellow","White","This soil, called chornozem, is full of rotted plant matter, which helps farmers grow huge crops of wheat and corn."],["life","Igor Sikorsky, born in Kyiv, built the first practical version of which flying machine?","Helicopter","Hot air balloon","Glider","Jet plane","Sikorsky dreamed of flying as a boy after reading Jules Verne. His VS-300 helicopter took off in America in 1939."]],"GB":[["food","Which British meal of battered fish and fried potatoes is often eaten at the seaside?","Fish and chips","Bangers and mash","Shepherd's pie","Toad in the hole","Fish and chips have been sold in Britain since the 1860s, often with mushy peas and a splash of vinegar."],["party","On Pancake Day in parts of the UK, people run races while flipping pancakes in what?","A frying pan","A basket","A bucket","A hat","The town of Olney says it has held its pancake race since 1445, with runners tossing pancakes all the way to the church."],["arts","Which patterned cloth of criss-cross stripes is used for Scottish kilts?","Tartan","Gingham","Batik","Polka dots","Scottish clans, big groups of relatives, each have their own tartan, and thousands of patterns are now registered."],["words","Which UK nation has its own language with the word croeso for welcome?","Wales","Scotland","England","Northern Ireland","Wales has a village with one of the longest place names in the world, 58 letters long!"],["nature","Which coastline in Northern Ireland is made of about 40,000 six-sided stone columns?","Giant's Causeway","Cliffs of Moher","White Cliffs of Dover","Durdle Door","The columns formed when hot lava cooled and cracked. A legend says a giant called Finn McCool built them as stepping stones."],["life","Which British scientist invented the World Wide Web in 1989?","Tim Berners-Lee","Bill Gates","Steve Jobs","Alan Turing","He shared his invention for free so everyone could use it, and the very first web page went online in 1991."]],"VA":[["food","The pope's farm at Castel Gandolfo, near Rome, sends what fresh food to Vatican City?","Milk and eggs","Bananas and pineapples","Rice and tea","Coconuts","The farm has cows, hens and olive trees, and its products are sold in the Vatican's own little supermarket."],["party","When a new pope has been chosen, what rises from a chimney on the Sistine Chapel?","White smoke","Black smoke","Blue smoke","Gold confetti","Crowds waiting in St Peter's Square cheer at the white smoke, and church bells ring out to share the happy news."],["arts","What colours are the stripy uniforms of the Vatican's Swiss Guards?","Blue, red and yellow","Green, white and red","Black and gold","Purple and silver","The guards have served the pope since 1506, and every one of them must come from Switzerland."],["words","Vatican City's cash machines offer instructions in which ancient language?","Latin","Ancient Greek","Hebrew","Sanskrit","Latin is an official language there, and Vatican experts even invent Latin words for new things like computers."],["nature","About how much of tiny Vatican City is covered by green gardens?","About half","Almost none","About a tenth","Almost all","The Vatican Gardens have fountains, tall old trees, a little grotto and plants given as gifts from around the world."],["life","Who designed the giant dome of St Peter's Basilica in Vatican City?","Michelangelo","Leonardo da Vinci","Raphael","Donatello","Visitors can climb 551 steps to the top of the dome for an amazing view over the whole city of Rome."]],"AG":[["food","Antigua and Barbuda's national dish is pepperpot stew with fungee. What is fungee mainly made from?","Cornmeal","Rice","Cassava","Breadfruit","Fungee is cornmeal stirred with okra until smooth, then shaped into balls. Pepperpot is a thick, rich vegetable stew."],["party","At Antigua's Carnival, when does the early morning street party called J'ouvert begin?","Before sunrise","At noon","At sunset","At teatime","Steel bands and soca music fill Saint John's, and people dance through the streets in bright costumes."],["arts","Which Caribbean instrument, made from an oil drum, is played in Antigua's steel bands?","Steelpan","Bongos","Maracas","Marimba","Antigua has some of the oldest steel bands in the Caribbean, playing calypso and soca tunes at every Carnival."],["words","English is the official language. What is the main local language spoken in Antigua and Barbuda?","Antiguan Creole","Papiamento","Haitian Creole","Sranan Tongo","Antiguan Creole is based on English mixed with words from West African languages, and it has its own lively rhythm."],["nature","Which rare sea turtle, with a beak like a bird, nests on Antigua's beaches?","Hawksbill turtle","Galapagos tortoise","Snapping turtle","Box turtle","Volunteers watch over nests on Antigua's beaches so the tiny hatchlings can scuttle safely down to the sea."],["life","Which cricket legend from Antigua is famous for his powerful batting?","Viv Richards","Brian Lara","Sachin Tendulkar","Don Bradman","The Sir Vivian Richards Stadium is named after him, and he was famous for batting without wearing a helmet."]],"BS":[["food","Which big sea snail, served in salads or fried in fritters, is a favourite food in the Bahamas?","Conch","Octopus","Lobster","Oyster","Conch shells are a beautiful pink inside, and fresh conch salad is made with lime juice, peppers and onions."],["party","Which Bahamian street parade, on Boxing Day and New Year, has costumes, cowbells and goatskin drums?","Junkanoo","Crop Over","Mardi Gras","Hogmanay","Junkanoo starts in the middle of the night, and teams spend months making giant costumes from crepe paper and cardboard."],["arts","In Bahamian rake and scrape music, which tool is played as an instrument?","A carpenter's saw","A hammer","A garden rake","A spade","A player bends the saw and scrapes it with a screwdriver or knife, while an accordion and goatskin drum join in."],["words","The name Bahamas is thought to come from the Spanish baja mar. What does it mean?","Shallow sea","Blue island","Sunny beach","Big wave","The water around the Bahamas is so shallow and clear that astronauts can see its bright turquoise colour from space."],["nature","What is the national bird of the Bahamas, a tall pink wading bird?","Flamingo","Scarlet ibis","Roseate spoonbill","Pelican","Great Inagua island has tens of thousands of flamingos, which get their pink colour from the tiny shrimp they eat."],["life","Dean's Blue Hole in the Bahamas is a top spot for which sport, where people dive deep on one breath?","Freediving","Surfing","Water polo","Kayaking","The blue hole plunges about 200 metres deep, and divers from around the world hold record contests there each year."]],"BB":[["food","Which sweet treat of cornmeal, coconut and pumpkin is steamed in banana leaves in Barbados?","Conkies","Johnny cakes","Fritters","Turnovers","Conkies are made around Independence Day on 30 November, and are spiced with nutmeg and studded with raisins."],["party","Which summer festival in Barbados began as a party for the end of the sugar cane harvest?","Crop Over","Junkanoo","Mardi Gras","Diwali","It ends with Grand Kadooment Day, when bands in sparkly costumes dance through the streets to soca music."],["arts","Which Barbadian folk band plays a bass drum, a snare drum and a penny whistle?","Tuk band","Mariachi band","Steel band","Brass band","Tuk bands are joined by fun costumed characters like the Shaggy Bear, Mother Sally and tall stilt walkers."],["words","What name do people from Barbados use for themselves and their way of speaking?","Bajan","Yardie","Trini","Vincy","Bajan dialect mixes English with West African words, and it has its own fun sayings and a sing-song rhythm."],["nature","Which small monkeys with olive-gold fur live wild in the forests of Barbados?","Green monkeys","Howler monkeys","Spider monkeys","Capuchins","Their ancestors came from West Africa over 300 years ago. At a wildlife reserve you can see them up close."],["life","Which world-famous singer grew up in Barbados and is a National Hero there?","Rihanna","Beyonce","Shakira","Taylor Swift","She was named a National Hero of Barbados in 2021, and the street where she grew up is now called Rihanna Drive."]],"BZ":[["food","Which Garifuna dish from Belize is fish in coconut soup served with mashed plantain?","Hudut","Ceviche","Jollof rice","Tamales","The plantains are pounded in a big wooden mortar, and the coconut fish soup that goes with them is called sere."],["party","On 19 November, Garifuna people in Belize act out their ancestors' arrival. How did they arrive?","By boat","On horseback","By train","On foot","The town of Dangriga comes alive with drumming, dancing and canoes landing on the beach, decorated with palm leaves."],["arts","Which fast, hip-shaking dance and music comes from Belize's Garifuna people?","Punta","Salsa","Samba","Merengue","Punta is played on hand drums made from hollow logs, and UNESCO honours Garifuna music, dance and language."],["words","Belize is the only country in Central America where the official language is what?","English","Spanish","French","Dutch","Many Belizeans also speak Kriol, Spanish, Garifuna or Maya languages, so lots of kids grow up speaking two or three!"],["nature","Which animal with a short, bendy snout is Belize's national animal, nicknamed the mountain cow?","Baird's tapir","Anteater","Capybara","Manatee","Tapirs are great swimmers. They can hide underwater and poke their bendy snout above the surface like a snorkel!"],["life","Which ancient people built the great stone pyramids of Caracol and Xunantunich in Belize?","The Maya","The Aztecs","The Inca","The Egyptians","Caracol's tallest temple, Caana, is still one of the tallest buildings in all of Belize today!"]],"CA":[["food","Which Canadian dish is fries topped with cheese curds and gravy?","Poutine","Nachos","Fish and chips","Tartiflette","Poutine comes from Quebec in the 1950s. Fresh cheese curds are so springy that they squeak when you bite them!"],["party","On which date do Canadians celebrate Canada Day, their country's birthday?","July 1","July 4","May 5","September 16","Canada Day marks 1867, when Canada was formed. People dress in red and white and watch fireworks."],["arts","What are the human-shaped stone landmarks built by Inuit people in Canada called?","Inuksuk","Moai","Dolmen","Totem pole","Inuksuit help travellers find their way across the snowy Arctic. One was even the logo of the 2010 Vancouver Winter Olympics."],["words","The name Canada comes from kanata, an Iroquoian word meaning what?","Village","Big land","Maple tree","Cold river","Explorer Jacques Cartier heard the word in 1535. Today Canada has two official languages, English and French."],["nature","Which dam-building animal is a national symbol of Canada and appears on its 5-cent coin?","Beaver","Otter","Muskrat","Raccoon","A beaver's front teeth never stop growing, so it keeps them short by chewing through trees and branches."],["life","Which sport did Canadian James Naismith invent in 1891?","Basketball","Volleyball","Netball","Handball","Naismith used peach baskets as the first hoops, so someone had to climb up and fetch the ball after every basket!"]],"CR":[["food","Which Costa Rican breakfast of rice and black beans has a name meaning spotted rooster?","Gallo pinto","Pupusas","Ropa vieja","Mole","The beans speckle the white rice like a rooster's feathers. Ticos often eat it with eggs, sweet plantains and sour cream."],["party","On the night before Independence Day, what do Costa Rican kids carry in parades?","Homemade lanterns","Paper kites","Flower crowns","Painted eggs","The lanterns are called faroles. At the same time, runners carry a Freedom Torch all the way across Central America."],["arts","What brightly painted wooden vehicles are a famous craft of Costa Rica?","Ox carts","Jeepneys","Tuk-tuks","Rickshaws","Each cart is covered in star and flower patterns. Long ago, each wheel made its own ringing sound so owners could tell carts apart."],["words","Which Costa Rican phrase meaning pure life is used for hello, thanks and goodbye?","Pura vida","Buen provecho","Hasta luego","Qué chévere","Costa Ricans call themselves Ticos because they love adding the little ending -tico to words to make things sound small and cute."],["nature","Which plain brown bird is Costa Rica's national bird, because its song signals the rainy season?","Clay-colored thrush","Scarlet macaw","Keel-billed toucan","Resplendent quetzal","Locals call it the yigüirro. When farmers hear its sweet song in April and May, they know the rains are on the way."],["life","Costa Rica makes almost all of its electricity from what?","Water, wind and volcanoes","Coal","Oil","Nuclear power","Rushing rivers, windy hills and the heat deep inside volcanoes power the country. Most years nearly 99 percent of its power is clean."]],"CU":[["food","Which Cuban dish of shredded beef has a name meaning old clothes?","Ropa vieja","Gallo pinto","Carnitas","Feijoada","The thin strips of beef look like rags. It is usually served with white rice, black beans and fried sweet plantains."],["party","At the Parrandas of Remedios in Cuba each Christmas Eve, what happens?","Two neighborhoods compete with floats","People race in boats","Kids hunt for eggs","Everyone throws tomatoes","The two sides, San Salvador and El Carmen, build giant glowing floats in secret, then light up the night with fireworks."],["arts","Which slow, elegant dance is called Cuba's national dance?","Danzón","Tango","Merengue","Cumbia","Danzón began in the city of Matanzas in 1879. During breaks in the music, dancers pause and the ladies fan themselves!"],["words","In Cuba, if you want to ride a bus, what Spanish word do you use?","Guagua","Colectivo","Micro","Camión","Guagua is also used for buses in Puerto Rico and the Canary Islands. Cuban Spanish mixes in words from African and Taíno languages."],["nature","Which bird, red, white and blue like the Cuban flag, is Cuba's national bird?","Tocororo","Flamingo","Scarlet macaw","Toucan","The tocororo, or Cuban trogon, lives only in Cuba. People say it cannot live in a cage, so it is a symbol of freedom."],["life","Which sport, called la pelota, is the most popular in Cuba?","Baseball","Soccer","Basketball","Volleyball","Kids play it in streets and parks, and Cuba has won Olympic gold in baseball three times, in 1992, 1996 and 2004."]],"DM":[["food","Which green soup made from dasheen leaves is Dominica's national dish?","Callaloo","Pepperpot","Oil down","Gumbo","Dominica's national dish used to be a giant frog called mountain chicken, but the frogs became rare, so callaloo took over."],["party","Which music festival fills Dominica with bouyon and zouk music every October?","World Creole Music Festival","Reggae Sumfest","Crop Over","Spicemas","It is part of the Independence season, when kids wear colorful madras plaid outfits to school on Creole Day."],["arts","The Kalinago people of Dominica are famous for weaving what?","Baskets","Carpets","Lace","Tapestries","They weave with larouma reeds dyed in earthy colors. Dominica is home to the largest Kalinago community in the Caribbean."],["words","Many Dominicans speak Kwéyòl as well as English. Which language is Kwéyòl mostly based on?","French","Spanish","Dutch","Portuguese","In Kwéyòl, good morning is bonjou. French settlers lived on Dominica long ago, and many villages still have French names."],["nature","Which parrot appears on the flag of Dominica?","Sisserou parrot","Scarlet macaw","St Vincent parrot","Blue-and-gold macaw","The Sisserou, or imperial amazon, lives only in Dominica's mountain rainforests and is one of the biggest amazon parrots."],["life","Why is Champagne Reef in Dominica called that?","Bubbles rise from the seabed","The water is golden","The coral glows at night","Fish make fizzing sounds","Warm volcanic gas seeps up through the sand, so snorkelers swim through curtains of tiny silver bubbles."]],"DO":[["food","What is the Dominican lunch of rice, beans and meat called?","La bandera","Gallo pinto","Ropa vieja","Pabellón cri
