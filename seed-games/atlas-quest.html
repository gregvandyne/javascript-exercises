ollo","Its name means the flag. Lunch is the biggest meal of the day, and mangú, mashed green plantains, is a favorite breakfast."],["party","Which masked characters with horns star in the carnival of La Vega?","Diablos cojuelos","Moko jumbies","Catrinas","Gigantes","They wear bright masks with pointy horns and teeth, and playfully swat people with bouncy balloon-like balls!"],["arts","Which fast dance with a two-step beat is the national dance of the Dominican Republic?","Merengue","Salsa","Cumbia","Samba","Merengue is played with an accordion, a two-sided tambora drum and a metal scraper called a güira."],["words","Which Dominican slang phrase means what's up?","Qué lo que","Qué onda","Qué bolá","Pura vida","Dominicans speak fast and often drop the s at the end of words, so más can sound like má."],["nature","Which giant animals visit Samaná Bay each winter to have their babies?","Humpback whales","Blue whales","Whale sharks","Manatees","Thousands swim down from the North Atlantic, and the males sing long songs that travel for miles underwater."],["life","Pico Duarte in the Dominican Republic is the highest what?","Mountain in the Caribbean","Waterfall in the Caribbean","Volcano in the Americas","Cliff in the Caribbean","It is over 3,000 metres tall, and hikers sometimes find frost at the top, even though it is in the tropics!"]],"SV":[["food","In El Salvador, what is a quesadilla?","A sweet cheese cake","A folded cheese tortilla","A corn drink","A bean soup","It is baked with rice flour, sour cream and cheese, topped with sesame seeds, and eaten with coffee in the afternoon."],["party","During Panchimalco's Flower and Palm Festival in El Salvador, what do people carry?","Palms covered in flowers","Giant paper puppets","Candles in pumpkins","Painted eggs","It happens in May, and the colorful parade welcomes the rainy season with music and dancing in the streets."],["arts","The village of La Palma is famous for what bright craft started by artist Fernando Llort?","Painted wooden crafts","Woven rugs","Silver jewelry","Glass bottles","Llort taught villagers to paint simple, cheerful scenes of houses, birds and hills, and now much of the town paints them."],["words","What was El Salvador's old Nahuat name, meaning land of precious things?","Cuscatlán","Tenochtitlán","Tikal","Copán","The Pipil people spoke Nahuat, a cousin of the Aztec language, and some people in El Salvador still speak it today."],["nature","Which bird with a swinging tail is El Salvador's national bird?","Torogoz","Resplendent quetzal","Scarlet macaw","Keel-billed toucan","The torogoz, or turquoise-browed motmot, swings its long tail like a clock pendulum. Mum and dad share the work of raising chicks."],["life","El Salvador's coast, with beaches like El Tunco, is world famous for which sport?","Surfing","Water skiing","Rowing","Sailing","Long, even waves roll in along the Pacific coast, and the country even calls one stretch of shore Surf City."]],"GD":[["food","What is the name of Grenada's national dish, cooked in one big pot with coconut milk?","Oil down","Pepperpot","Jerk chicken","Cou-cou","It has breadfruit, dumplings and callaloo. It cooks until the coconut milk soaks in, leaving a little oil at the bottom."],["party","At Grenada's Spicemas carnival, what do Jab Jab revellers cover themselves in?","Shiny black oil","Colored powder","White flour","Feathers","Spicemas happens in August, and Jab Jabs dance through the streets at dawn on J'ouvert morning."],["arts","On Grenada's island of Carriacou, which drum dance keeps African traditions alive?","Big Drum Dance","Bomba","Junkanoo","Limbo","The drums were once made from old rum barrels and goat skin, and the dances honor the African peoples of their ancestors."],["words","How do Grenadians say the name of their country?","Gruh-NAY-dah","Gruh-NAH-dah","GREN-ah-dah","Gree-NAH-dah","It is spelled differently from Granada in Spain, and many think Spanish sailors named it after that city long ago."],["nature","Which monkeys live in the forest around Grand Etang crater lake in Grenada?","Mona monkeys","Howler monkeys","Spider monkeys","Capuchin monkeys","Mona monkeys came from West Africa about 300 years ago, and now they leap through Grenada's misty mountain rainforest."],["life","Kirani James won Grenada's first Olympic gold in 2012 in which race?","400 metres","100 metres","Marathon","1500 metres","Grenada celebrated with a national holiday, and the national stadium was later renamed the Kirani James Athletic Stadium."]],"GT":[["food","Which thick, spicy stew is one of Guatemala's best-loved national dishes?","Pepián","Mole poblano","Sancocho","Ropa vieja","Pepián is made with roasted seeds, chilies and tomatoes, and mixes old Mayan and Spanish cooking."],["party","On 1 November, what giant things do people fly in Sumpango, Guatemala?","Giant kites","Hot air balloons","Paper lanterns","Paper dragons","Some barriletes are over 15 metres wide! They are made from tissue paper and bamboo to remember loved ones."],["arts","What is the colorful hand-woven blouse worn by Mayan women in Guatemala called?","Huipil","Poncho","Sari","Kimono","Each village has its own patterns and colors, so you can often tell which town a woman comes from by her huipil."],["words","Besides Spanish, about how many Mayan languages are spoken in Guatemala?","About 22","About 2","About 5","About 100","K'iche' is the biggest, and the famous Mayan book of stories, the Popol Vuh, was written in it."],["nature","Lake Atitlán in Guatemala is surrounded by how many volcanoes?","Three","One","Seven","Twelve","Writer Aldous Huxley called it the most beautiful lake in the world, and Mayan villages sit all around its shores."],["life","Which tiny handmade dolls from Guatemala are told your troubles at bedtime?","Worry dolls","Matryoshka dolls","Kokeshi dolls","Kachina dolls","Kids tell each little doll a worry and tuck them under the pillow. By morning, the dolls have taken the worries away."]],"HT":[["food","Which Haitian dish is crispy fried pork served with spicy pikliz?","Griot","Jerk pork","Lechón","Carnitas","Pikliz is a crunchy slaw of cabbage, carrots and hot peppers soaked in vinegar, which makes it zingy."],["party","Which soup do Haitians share on 1 January to celebrate independence?","Soup joumou","Callaloo","Sancocho","Pepperpot","Soup joumou is made from squash. In 2021 it was added to UNESCO's list of the world's living cultural treasures."],["arts","In Croix-des-Bouquets, Haitian artists cut beautiful art out of what?","Recycled oil drums","Coconut shells","Driftwood","Glass bottles","They flatten the drums, cut out trees, birds, fish and mermaids, then hammer in tiny details by hand."],["words","In Haitian Creole, how do friends ask what's up?","Sak pase","Wah gwaan","Qué lo que","Qué bolá","The usual reply is N'ap boule, which means we're cooking, or all good. Nearly everyone in Haiti speaks Haitian Creole."],["nature","Which tree stands in the middle of the coat of arms on Haiti's flag?","Royal palm","Baobab","Coconut palm","Mango tree","The royal palm is Haiti's national tree, and on the flag it wears a cap of liberty on top as a symbol of freedom."],["life","What are Haiti's brightly painted shared taxis called?","Tap taps","Jeepneys","Tuk-tuks","Matatus","They are covered in art and slogans, and riders tap on the side when they want to stop, which is how they got their name."]],"HN":[["food","Which Honduran favorite is a thick flour tortilla folded around beans, cheese and cream?","Baleada","Pupusa","Arepa","Gordita","Hondurans eat baleadas any time of day, often adding eggs, avocado or meat to the simple bean and cheese filling."],["party","Which Honduran city hosts one of the biggest carnivals in Central America each May?","La Ceiba","Tegucigalpa","San Pedro Sula","Roatán","The Gran Carnaval honors San Isidro, with floats and costumes, and the whole week is full of street parties called carnavalitos."],["arts","Which lively dance of the Garifuna people of Honduras is famous for fast hip moves?","Punta","Merengue","Cumbia","Samba","Punta is danced to drums made from hollow logs, and Garifuna music and dance are on UNESCO's list of world treasures."],["words","What nickname do Hondurans proudly call themselves?","Catrachos","Ticos","Chapines","Nicas","Honduras means depths in Spanish, said to come from the deep waters off its northern coast."],["nature","Which bright red parrot is the national bird of Honduras?","Scarlet macaw","Resplendent quetzal","Torogoz","Keel-billed toucan","The ancient Maya of Copán honored the macaw, and the ball court there is decorated with stone macaw heads."],["life","What strange event do people in Yoro, Honduras, say happens almost every year?","A rain of fish","Snow in summer","Glowing rain","A rain of frogs","After big storms in May or June, small live fish are found on the ground, and the town holds a festival to celebrate."]],"JM":[["food","Jamaica's national dish pairs salted cod with which yellow fruit?","Ackee","Mango","Papaya","Breadfruit","When it is cooked, ackee looks a lot like scrambled eggs! It grows in bright red pods that split open when ripe."],["party","Which Christmas street masquerade in Jamaica has characters like Pitchy-Patchy?","Jonkonnu","Crop Over","J'ouvert","Spicemas","Pitchy-Patchy wears a costume of colorful cloth strips, and dancers parade through the streets with drums and fifes."],["arts","Which fast Jamaican music style came before reggae, in the early 1960s?","Ska","Calypso","Soca","Zouk","Ska has a bouncy beat. It slowed down into rocksteady, and rocksteady slowed again into reggae."],["words","In Jamaican Patois, what does wah gwaan mean?","What's going on","Thank you","Goodbye","Good night","Jamaicans also say irie for feeling great, and if you ask someone to small up yourself, it means make room!"],["nature","Which hummingbird with long tail streamers is Jamaica's national bird?","Doctor bird","Bee hummingbird","Ruby-throated hummingbird","Sword-billed hummingbird","Its real name is the red-billed streamertail. It lives only in Jamaica, and its tail feathers can be longer than its body."],["life","Jamaica, a hot island, surprised the world in 1988 by competing in which Winter Olympic sport?","Bobsleigh","Ski jumping","Ice hockey","Figure skating","Their story inspired the film Cool Runnings, and Jamaica has sent bobsled teams to many Winter Games since."]],"MX":[["food","Which rich Mexican sauce is made with chilies, spices and a little chocolate?","Mole","Salsa verde","Guacamole","Pico de gallo","Some moles use more than 20 ingredients ground together for hours. Puebla and Oaxaca are especially famous for them."],["party","During Day of the Dead, which orange flowers decorate altars across Mexico?","Marigolds","Sunflowers","Roses","Poinsettias","They are called cempasúchil. People believe their bright color and smell guide the spirits of loved ones home for a happy visit."],["arts","What are the brightly painted fantasy creatures made by artists in Oaxaca called?","Alebrijes","Piñatas","Matryoshkas","Kachinas","Pedro Linares first made them from paper in the 1930s after dreaming of strange creatures. Oaxaca carvers later made them from wood."],["words","The English words chocolate, tomato and avocado come from which Mexican language?","Nahuatl","Quechua","Guaraní","Taíno","Nahuatl was the language of the Aztecs, and more than a million people in Mexico still speak it today."],["nature","Which butterflies fly up to 4,000 km to spend the winter in Mexico's forests?","Monarch butterflies","Blue morphos","Swallowtails","Painted ladies","Millions cluster on fir trees in Michoacán, so thick that the branches bend under their weight."],["life","Mexican inventor Guillermo González Camarena helped create which invention?","Color television","Telephone","Radio","Light bulb","He was only 23 when he patented his color TV system in 1940, and he had built his first camera as a teenager."]],"NI":[["food","Which Nicaraguan street dish of yucca, crispy pork and cabbage salad is served on a banana leaf?","Vigorón","Baleada","Pupusa","Tamale","Vigorón comes from the city of Granada, where it has been sold in the central park for about 100 years."],["party","During La Gritería in Nicaragua each December, what do people receive at decorated altars?","Sweets and fruit","Flowers","Lanterns","Coins","People call out a joyful question to honor the Virgin Mary, and hosts hand out sugarcane, oranges and candies."],["arts","Which masked play with music and dance is a treasure of Nicaraguan culture?","El Güegüense","Rabinal Achí","Popol Vuh","La Diablada","It tells of a clever old trader who outwits a governor with jokes, and dancers wear masks with pink faces and big moustaches."],["words","In the 1980s, deaf kids in Nicaragua did something amazing. What?","Invented a new sign language","Wrote a dictionary","Built a radio station","Made a new alphabet","Scientists were amazed to watch a brand new language grow from nothing, with each younger group of kids making it richer."],["nature","What is the Nicaraguan name of its national bird, which has a long racket-tipped tail?","Guardabarranco","Yigüirro","Tocororo","Resplendent quetzal","Its name means guard of the ravine, because it nests in tunnels dug into the sides of ravines and riverbanks."],["life","On Cerro Negro in Nicaragua, adventurers ride boards down what?","A black volcano","A snowy mountain","A sand dune","A waterfall","Riders zoom down slopes of black volcanic gravel. Cerro Negro is one of the youngest volcanoes in Central America, born in 1850."]],"PA":[["food","Which chicken soup flavored with culantro is Panama's national dish?","Sancocho","Ajiaco","Pozole","Callaloo","Panamanians say it can fix almost anything, even tiredness after a party, and it is thickened with ñame, a kind of yam."],["party","During Panama's carnival, what do trucks spray on the dancing crowds?","Water","Confetti","Flour","Paint","These soakings are called culecos. In Las Tablas, two streets, Calle Arriba and Calle Abajo, compete with queens and floats."],["arts","What colorful layered cloth panels do Guna women of Panama sew?","Molas","Huipiles","Kente cloth","Batik","They cut through layers of cloth to show colors underneath, making animals and patterns, and wear them on their blouses."],["words","The Guna people run their own islands off Panama. What do they call their homeland?","Guna Yala","Rapa Nui","Ayiti","Tierra del Fuego","Guna Yala means Land of the Guna. It has hundreds of small islands, and many Guna still speak their own language."],["nature","Which huge rainforest eagle is the national bird of Panama?","Harpy eagle","Bald eagle","Golden eagle","Philippine eagle","Its talons can be as big as a grizzly bear's claws, and it snatches sloths and monkeys from the treetops."],["life","Panama hats are famous worldwide, but in which country are they actually woven?","Ecuador","Peru","Colombia","Mexico","Workers building the Panama Canal wore the light straw hats to keep cool, so people started calling them Panama hats."]],"KN":[["food","Which salted fish is stewed for the national dish of St Kitts and Nevis?","Saltfish","Flying fish","Tuna","Mahi-mahi","It comes with spicy plantains, coconut dumplings and seasoned breadfruit, all piled on one big plate."],["party","When is Sugar Mas, the big carnival of St Kitts?","Christmas and New Year","Easter","Midsummer","Halloween","The name honors the islands' sugar cane history, and the fun lasts from late November into early January."],["arts","Which St Kitts folk dancers wear bright costumes and tall hats with peacock feathers?","The Masquerades","Jab Jabs","Jonkonnu","Diablos cojuelos","They dance to fifes and drums, and their costumes are decorated with ribbons, mirrors and bells."],["words","The island of Nevis is said to get its name from the Spanish word for what?","Snow","Island","Sugar","Monkey","Sailors thought the white clouds around Nevis Peak looked like a snowy mountaintop."],["nature","Which tree with flaming red-orange flowers is the national flower of St Kitts and Nevis?","Flamboyant","Jacaranda","Cherry blossom","Frangipani","Its flowers cover the whole tree in summer, and its long dry seed pods rattle like maracas."],["life","Which US founding father, on the ten-dollar bill, was born on Nevis?","Alexander Hamilton","George Washington","Benjamin Franklin","Thomas Jefferson","He was born in Charlestown, Nevis, in the 1750s, and the hit musical Hamilton tells his life story."]],"LC":[["food","In Saint Lucia's national dish, green fig and saltfish, what are green figs?","Unripe bananas","Green apples","Fresh figs","Limes","Saint Lucians call bananas figs. The green ones are boiled and served with salted cod cooked with peppers and onions."],["party","Saint Lucia has two singing societies with festivals named after which flowers?","Rose and Marguerite","Lily and Orchid","Tulip and Daisy","Hibiscus and Jasmine","La Rose is celebrated in August and La Marguerite in October, with songs, feasts and members dressed as kings and queens."],["arts","Saint Lucia's national dress, the wob dwiyet, uses which bright checked cotton?","Madras","Kente","Batik","Ikat","Women wear it with a matching headscarf, and you see it everywhere on Jounen Kwéyòl, Creole Day."],["words","In Saint Lucian Kwéyòl, how do you ask how are you?","Sa ka fèt","Wah gwaan","Qué lo que","Kia ora","Most Saint Lucians speak both English and Kwéyòl, a French-based Creole, and they celebrate it every October."],["nature","Which colorful parrot, found only on the island, is Saint Lucia's national bird?","Saint Lucia amazon","Sisserou parrot","Scarlet macaw","St Vincent parrot","Locals call it the Jacquot. In the 1970s only about 100 were left, but careful protection helped them bounce back."],["life","Saint Lucia is said to be the only country named after a woman. Who?","Saint Lucy","Saint Helena","Queen Victoria","Saint Mary","Saint Lucia is also home to two Nobel Prize winners, the poet Derek Walcott and the economist Arthur Lewis."]],"VC":[["food","Saint Vincent's national dish is roasted breadfruit with which fried fish?","Jackfish","Flying fish","Salmon","Catfish","Breadfruit trees arrived in 1793 with Captain Bligh, and a tree grown from those first plants stands in the Botanic Gardens."],["party","What is the big summer carnival of Saint Vincent and the Grenadines called?","Vincy Mas","Crop Over","Spicemas","Sugar Mas","It ends with J'ouvert and Mardi Gras street parades, and soca and calypso singers compete to be crowned monarch."],["arts","On the island of Bequia, craftspeople are famous for making what?","Model sailboats","Steel drums","Clay pots","Woven hats","Each tiny ship is carved and painted by hand, copying real schooners and yachts right down to the sails."],["words","What is the old Kalinago name for Saint Vincent, said to mean land of the blessed?","Hairouna","Xaymaca","Ayiti","Liamuiga","Today Vincentians speak English and a lively Vincentian Creole, and they proudly call themselves Vincies."],["nature","In the Tobago Cays of the Grenadines, which animals can snorkelers swim beside?","Sea turtles","Penguins","Seals","Manatees","Green turtles graze on sea grass in the calm lagoon, and the cays are protected as a marine park."],["life","About how many islands and cays make up Saint Vincent and the Grenadines?","About 32","About 2","About 7","About 300","Only around nine of them have people living on them, and most Vincentians live on the main island, Saint Vincent."]],"TT":[["food","Which Trinidad street snack is two soft fried breads filled with curried chickpeas?","Doubles","Pupusas","Baleadas","Samosas","Doubles were first sold in the 1930s. Sellers ask how much pepper sauce you want: slight, medium or heavy!"],["party","On J'ouvert morning in Trinidad's Carnival, what do revellers cover themselves in?","Mud and paint","Flour","Feathers","Flowers","J'ouvert begins before dawn on Carnival Monday, and later huge bands parade in glittering feathered costumes."],["arts","Which dance, where you bend backwards under a low bar, began in Trinidad?","Limbo","Twist","Conga","Hula","The bar gets lower after every round, and dancers lean further and further back as the crowd cheers them on."],["words","In Trinidad, what does it mean to go for a lime?","Hang out with friends","Eat sour fruit","Go fishing","Take a nap","Trinis love liming at the beach or on the street, and a big party is called a fete."],["nature","Which bright red bird flocks to Trinidad's Caroni Swamp at sunset?","Scarlet ibis","Flamingo","Cardinal","Scarlet macaw","Its red color comes from eating red crabs and shrimp, and thousands roost together in the mangrove trees."],["life","Which Trinidad cricketer holds the record for the highest score in a Test match, 400 runs?","Brian Lara","Viv Richards","Chris Gayle","Sachin Tendulkar","He scored 400 not out against England in 2004, and a big cricket stadium in Trinidad is named after him."]],"US":[["food","Which treat, now loved worldwide, was invented by Ruth Wakefield in Massachusetts?","Chocolate chip cookies","Brownies","Doughnuts","Cupcakes","Around 1938 she chopped a chocolate bar into her cookie dough at the Toll House Inn, and a classic was born."],["party","Which giant floating things star in New York's Thanksgiving Day parade?","Character balloons","Paper dragons","Hot air balloons","Kites","The Macy's parade began in 1924. Some balloons are so big that dozens of handlers hold ropes to guide them."],["arts","Which music style was born in New Orleans over 100 years ago?","Jazz","Reggae","Tango","Samba","Jazz grew from African American music like blues and ragtime, and Louis Armstrong made its trumpet sound famous."],["words","The name Mississippi comes from an Ojibwe word meaning what?","Great river","Muddy water","Long road","Tall trees","More than half of US states have names from Native American languages, such as Alaska, Texas and Ohio."],["nature","In 2016, which animal became the national mammal of the United States?","American bison","Grizzly bear","Moose","Gray wolf","Bison are the heaviest land animals in North America, and Yellowstone has had wild bison since prehistoric times."],["life","Which brothers made the first powered airplane flight in the US in 1903?","The Wright brothers","The Montgolfier brothers","The Lumière brothers","The Warner brothers","Their first flight at Kitty Hawk, North Carolina, lasted just 12 seconds and covered about 37 metres."]],"AU":[["food","Which salty dark spread do Australians love on their toast?","Vegemite","Nutella","Marmite","Tahini","Vegemite is made from yeast left over from brewing. Aussies spread it thinly over lots of butter."],["party","In Australia, Christmas falls in which season?","Summer","Winter","Spring","Autumn","Many Aussies have a seafood lunch or a barbecue on Christmas Day, and some head to the beach in Santa hats."],["arts","Which long wooden wind instrument comes from Aboriginal Australians?","Didgeridoo","Alphorn","Bagpipes","Pan flute","It is made from a branch hollowed out by termites, and players breathe in through the nose while blowing to keep the drone going."],["words","What does an Australian mean by arvo?","Afternoon","Breakfast","Weekend","Holiday","Aussies love shortening words: a barbie is a barbecue, brekkie is breakfast and sunnies are sunglasses."],["nature","Which Australian animal has a duck bill, lays eggs and is a mammal?","Platypus","Wombat","Koala","Quokka","A platypus hunts underwater with its eyes shut, finding food by sensing the tiny electric signals that animals give off."],["life","Which giant red rock in central Australia is sacred to Aboriginal people?","Uluru","Table Mountain","Ben Nevis","Mount Kosciuszko","Uluru seems to change color at sunset, glowing orange and red, and it rises about 348 metres above the desert."]],"FJ":[["food","Which Fijian dish is raw fish soaked in lime juice and coconut milk?","Kokoda","Poke","Ceviche","Sashimi","The lime juice firms up the fish without any heat, then coconut milk, chili and chopped veggies are mixed in."],["party","People from Beqa island in Fiji are famous for which amazing tradition?","Walking on hot stones","Diving from towers","Racing on stilts","Riding giant turtles","Sawau men walk barefoot over white-hot stones without getting burned, a skill legend says was a gift from a spirit god."],["arts","What is the traditional Fijian dance that tells stories with song and movement?","Meke","Haka","Hula","Siva","Men often perform with spears or clubs, women with fans, while singers and slit drums called lali keep the beat."],["words","Which Fijian word means hello and is called out with a big smile?","Bula","Aloha","Kia ora","Talofa","Bula means life, so you are wishing people good health. To say thank you in Fijian, you say vinaka."],["nature","Which red-and-white flower grows only on Fiji's island of Taveuni?","Tagimoucia","Hibiscus","Frangipani","Bird of paradise","It is Fiji's national flower and grows on vines high in the mountains near Lake Tagimoucia. People have tried to grow it elsewhere and failed."],["life","Which drink made from the root of a pepper plant is shared at Fijian welcome ceremonies?","Kava","Coconut water","Mate","Chai","Fijians call it yaqona. It is served from a big wooden bowl in coconut shell cups, and people clap before and after drinking."]],"KI":[["food","What giant root crop do people in Kiribati grow in pits dug into the coral sand?","Babai","Potato","Cassava","Yam","Babai is a giant swamp taro that takes years to grow, and big babai roots are proud gifts at feasts."],["party","In Kiribati, where do villages gather for feasts, dances and meetings?","The maneaba","The longhouse","The pagoda","The igloo","A maneaba is a huge open-sided meeting house with a tall thatched roof, and each group has its own place to sit inside."],["arts","Kiribati dancers stretch out their arms to copy which bird?","Frigatebird","Penguin","Flamingo","Hummingbird","A frigatebird flies over the rising sun on Kiribati's flag, and dancers move their heads in quick, sharp bird-like jerks."],["words","How do people from Kiribati say the name of their country?","Kiri-bass","Kiri-bah-tee","Kee-ree-bat","Kai-ri-bat","In Gilbertese, ti sounds like s, and Kiribati is their way of saying Gilberts, the old name of the islands."],["nature","Kiritimati, part of Kiribati, is the world's largest what by land area?","Coral atoll","Volcano","Sand desert","Salt lake","Captain Cook landed there on Christmas Eve in 1777, and Kiritimati is the Gilbertese way of saying Christmas."],["life","In Kiribati, what sweet drink do people collect from the flower stems of coconut trees?","Toddy","Maple syrup","Kava","Mate","Toddy cutters climb the palms twice a day. The sap is drunk fresh or boiled into a sweet syrup called kamwaimwai."]],"MH":[["food","Which big round fruit, roasted or made into chips, is a staple food in the Marshall Islands?","Breadfruit","Durian","Jackfruit","Papaya","Roasted breadfruit tastes a bit like potato, and one tree can grow well over 100 fruits in a single year."],["party","In the Marshall Islands, which birthday gets the biggest party, called kemem?","A baby's first birthday","The sixteenth birthday","The twenty-first birthday","The hundredth birthday","Hundreds of relatives and friends may come to feast, sing and give gifts to celebrate the little one."],["arts","What do skilled Marshallese weavers use to make mats, fans and handbags?","Pandanus leaves","Bamboo","Wool","Silk","Weavers dry and soften the long leaves, and the handbags made on Kili island are famous across the Pacific."],["words","Which Marshallese greeting is said to mean you are a rainbow?","Iakwe","Bula","Aloha","Mauri","Iakwe is used for hello, goodbye and love. To say thank you in Marshallese, you say kommol."],["nature","In 2011, the Marshall Islands created the world's largest sanctuary for which animals?","Sharks","Whales","Dolphins","Seahorses","It covers about 2 million square km of ocean, and catching sharks for sale is banned in all of it."],["life","Kwajalein in the Marshall Islands has one of the world's largest what?","Lagoons","Waterfalls","Caves","Deserts","Its ring of about 97 small islands circles a lagoon of more than 2,000 square km of calm blue water."]],"FM":[["food","What drink made from pounded pepper plant roots is shared on Pohnpei, Micronesia?","Sakau","Toddy","Mate","Chai","The roots are pounded on big flat stones, and in the evening the ringing sound of pounding drifts across the villages."],["party","On Yap Day each March, what do people on the island of Yap celebrate?","Their traditional culture","The first snowfall","A space launch","The cherry blossoms","People wear traditional dress, perform dances and play old games, and visitors come from across the Pacific to watch."],["arts","In Yap's famous stick dance, what do dancers strike together?","Bamboo poles","Coconut shells","Wooden spoons","Stones","Dancers swing and clack the bamboo in a fast rhythm while chanting, which takes lots of practice to get right."],["words","Which word means hello in Pohnpeian, a language of Micronesia?","Kaselehlie","Iakwe","Bula","Mauri","Micronesia has four states, Yap, Chuuk, Pohnpei and Kosrae, and each has its own language as well as English."],["nature","Which giant gliding fish can divers meet in the channels of Yap all year?","Manta rays","Whale sharks","Sailfish","Hammerhead sharks","Manta rays can be wider than a car, and they visit cleaning stations where tiny fish nibble them clean."],["life","Kosrae in Micronesia is nicknamed the Island of the Sleeping what?","Lady","Giant","Turtle","Dragon","From the sea, its mountain ridges look like a woman lying on her back, with her long hair spread out."]],"NR":[["food","Which seabird do Nauruans traditionally catch with nets as it flies home at dusk?","Noddy","Puffin","Penguin","Albatross","Catching noddies is a proud old Nauruan tradition, and skilled catchers swing their nets on long poles from the shore."],["party","On Angam Day, Nauru celebrates its population reaching what number?","1,500 people","100 people","10,000 people","1 million people","Angam means homecoming. The population first reached 1,500 in 1932, and the happy day is celebrated every 26 October."],["arts","Nauruans are famous for making amazing figures with what?","A loop of string","Folded paper","Clay","Shells","Nauru has hundreds of traditional string figures, often made while telling chants and stories, like a fancy cat's cradle."],["words","Most people in Nauru speak Nauruan. Which other language is used in schools and offices?","English","French","Japanese","Spanish","Nauruan is spoken by only a few thousand people in the whole world, and in it the island's own name is Naoero."],["nature","What is the only native songbird of Nauru?","Nauru reed warbler","Robin","Nightingale","Canary","It lives nowhere else on Earth, and its cheerful songs can be heard from bushes all around the island."],["life","Which sport, first played in Australia, is the most popular in Nauru?","Australian rules football","Cricket","Baseball","Basketball","Players kick an oval ball through tall posts, and Nauru has its own local league with teams from across the island."]],"NZ":[["food","Which Māori way of cooking food in a pit of hot stones under the ground is used in New Zealand?","Hāngī","Umu","Imu","Lovo","Meat, kūmara sweet potatoes and pumpkin are wrapped up and buried for hours, so everything comes out smoky and tender."],["party","Which Māori New Year celebration in New Zealand begins when a star cluster rises in midwinter?","Matariki","Songkran","Nowruz","Tết","Matariki is the Pleiades star cluster. Since 2022 it has been a public holiday, with feasts, kite flying and remembering loved ones."],["arts","What is the Māori dance with stamping, chanting and fierce faces that the All Blacks perform before rugby games?","Haka","Hula","Siva","Meke","Haka are also performed at welcomes, weddings and celebrations. Performers often widen their eyes and stick out their tongues."],["words","How do you say hello in the Māori language, te reo Māori?","Kia ora","Talofa","Bula","Mālō e lelei","Kia ora literally means be well or be healthy. You hear it all over New Zealand, on the radio, in shops and in schools."],["nature","Which reptile found only in New Zealand belongs to a group that lived alongside the dinosaurs?","Tuatara","Komodo dragon","Frilled lizard","Gila monster","Tuatara can live over 100 years and have a third eye on top of their head, which gets covered by skin as they grow."],["life","Which New Zealander was one of the first two people to reach the top of Mount Everest in 1953?","Edmund Hillary","Roald Amundsen","Ernest Shackleton","Reinhold Messner","He reached the top with Tenzing Norgay from Nepal. Hillary's face now appears on New Zealand's five dollar note."]],"PW":[["food","Which root crop, grown by women in wet, swampy patches, is Palau's most important traditional food?","Taro","Cassava","Yam","Sweet potato","Taro patches are tended with great pride by Palauan women, and big platters of taro are a must at every special feast."],["party","In Palau's ceremony for a new mum after her first baby, what is her skin coated with?","Turmeric and coconut oil","Red clay and ash","Henna patterns","White rice flour","After days of hot herbal baths, she steps out glowing golden yellow to be greeted by relatives, who bring gifts of food and money."],["arts","What are Palau's carved wooden boards that show old legends in pictures called?","Storyboards","Totem poles","Tapa cloths","Scrimshaw","The carvings began on the beams of the bai, Palau's tall, painted meeting houses with steep pointed roofs."],["words","Which word means hello in the Palauan language?","Alii","Kia ora","Talofa","Hafa adai","To say thank you in Palauan you say mesulang. Most people in Palau speak both Palauan and English."],["nature","In 2009, Palau created the world's first sanctuary to protect which sea animals?","Sharks","Dolphins","Sea turtles","Seahorses","Divers come from all over the world to swim with Palau's sharks, so keeping them alive helps the islands earn a living."],["life","What are Palau's hundreds of small mushroom-shaped islands with green tops called?","The Rock Islands","The Phi Phi Islands","The Whitsunday Islands","The Spice Islands","The sea slowly nibbles away at their bases, giving them a mushroom shape. They are a UNESCO World Heritage Site."]],"PG":[["food","Which starchy food, scraped from inside a palm tree trunk, is a staple in Papua New Guinea's lowlands?","Sago","Tapioca","Taro","Breadfruit","People pound the soft inside of the palm and wash it with water. The starch settles out and is cooked into pancakes or jelly."],["party","What is the Tok Pisin name for a big gathering in Papua New Guinea where groups dance in feathers and face paint?","Sing-sing","Powwow","Corroboree","Fiesta","At the Goroka Show each September, over 100 groups dance and sing, many wearing bright bird-of-paradise feathers."],["arts","What is the hourglass-shaped hand drum of Papua New Guinea, often covered with lizard skin?","Kundu","Djembe","Tabla","Bodhrán","A kundu drum and a spear appear beneath the bird-of-paradise on Papua New Guinea's national emblem."],["words","How do you say thank you very much in Tok Pisin?","Tenkyu tru","Vinaka vakalevu","Muchas gracias","Merci beaucoup","Many Tok Pisin words come from English said a new way, like haus for house and pikinini for child."],["nature","Which butterfly, the biggest in the world, lives only in Papua New Guinea?","Queen Alexandra's birdwing","Monarch butterfly","Blue morpho","Painted lady","Females can have wings more than 25 cm across, wider than a dinner plate! They live in one small patch of rainforest."],["life","Which sport is so loved in Papua New Guinea that it is the national sport?","Rugby league","Cricket","Basketball","Baseball","Papua New Guinea is the only country where rugby league is the national sport. Its team is called the Kumuls, a word for bird-of-paradise."]],"WS":[["food","Which Samoan dish is made of taro leaves wrapped around thick coconut cream and baked?","Palusami","Laulau","Kokoda","Poke","The leaf parcels are cooked in an umu, a Samoan oven of hot stones, and are a favourite at big Sunday lunches."],["party","Which festival, Samoa's biggest, is held each September in Apia and named after a red flower?","Teuila Festival","Heiva","Hibiscus Festival","Merrie Monarch","The teuila is the red ginger flower. The festival has fire knife dancing, outrigger canoe races, singing and crafts."],["arts","Which daring Samoan dance is performed by twirling a blade wrapped in flaming cloth?","Fire knife dance","Haka","Hula","Kecak","Dancers spin the flaming knife around their bodies, toss it high and catch it, all in time to fast drum beats."],["words","Which English word comes from the Samoan word tatau?","Tattoo","Canoe","Kayak","Ukulele","A traditional Samoan tattoo for men, called a pe'a, covers the body from waist to knees and can take weeks to finish."],["nature","Samoa's national bird is a rare pigeon found nowhere else. What is it called?","Tooth-billed pigeon","Kererū","Kagu","Nicobar pigeon","Samoans call it the manumea. It is a close cousin of the dodo and has a hooked beak with little jagged notches."],["life","Which author of Treasure Island spent his last years living in Samoa?","Robert Louis Stevenson","Mark Twain","Jules Verne","Charles Dickens","Samoans called him Tusitala, the teller of tales. His big house near Apia is now a museum you can visit."]],"SB":[["food","Which nut, with a taste a bit like almonds, is a much-loved treat in Solomon Islands markets?","Ngali nut","Macadamia","Pistachio","Brazil nut","Ngali nuts grow in hard shells on tall forest trees. They are eaten roasted or baked into sweet puddings with coconut."],["party","On which date do Solomon Islanders celebrate Independence Day each year?","7 July","4 July","16 September","1 October","Celebrations in Honiara include parades, traditional dancing and panpipe music, with flags of blue, green and yellow."],["arts","Which bamboo instrument do Solomon Islands bands play in big groups?","Panpipes","Didgeridoo","Steel drum","Ukulele","Some bands play giant bamboo tubes by slapping the open ends with rubber sandals, making a deep, bouncy bong sound!"],["words","How do you say thank you in Solomon Islands Pijin?","Tanggio","Tenkyu","Vinaka","Mālō","Solomon Islands has more than 60 local languages, so Pijin helps people from different islands chat with each other."],["nature","Which big lizard from Solomon Islands grips branches with its tail, like a monkey?","Monkey-tailed skink","Frilled lizard","Komodo dragon","Green iguana","It is the biggest skink in the world and munches leaves. Its babies are born live instead of hatching from eggs."],["life","Which big sports event did Honiara host for the very first time in 2023?","Pacific Games","Commonwealth Games","Olympic Games","Asian Games","Thousands of athletes from 24 Pacific nations came to compete, and a brand new national stadium was built in Honiara."]],"TO":[["food","Which Tongan feast dish is corned beef and coconut cream wrapped in taro leaves?","Lu pulu","Laulau","Kokoda","Hāngī","Lu pulu is baked in an umu, an earth oven. Tongan feasts also lay out whole roast pigs along long tables."],["party","Which Tongan festival is named after the country's sweet-smelling red national flower?","Heilala Festival","Teuila Festival","Hibiscus Festival","Matariki","Held in Nuku'alofa around July, it has dancing, parades, music, and a contest for the Miss Heilala crown."],["arts","What is the name of the decorated bark cloth Tongan women make for weddings and special gifts?","Ngatu","Kente","Batik","Siapo","Women beat strips of mulberry tree bark until thin, then glue them together. Some ngatu are longer than a bus!"],["words","How do you say hello in Tongan?","Mālō e lelei","Talofa","Kia ora","Bula","Mālō on its own means thank you, so in Tonga you can greet and thank people with almost the same word!"],["nature","Which large animals hang in their hundreds from the trees in Kolovai village, Tonga?","Flying foxes","Sloths","Parrots","Koalas","These big fruit bats are seen as special and belong to the king, so they are protected and snooze upside down all day."],["life","What woven mat do Tongans wrap around their waist for church and special days?","Ta'ovala","Sarong","Kilt","Lavalava","Wearing a ta'ovala shows respect. Some old ones are precious treasures, handed down through relatives for many years."]],"TV":[["food","Which giant swamp taro do Tuvaluans grow in deep pits dug down to the water?","Pulaka","Kūmara","Yam","Cassava","The coral soil is so thin that people dig deep pits and fill them with compost and leaves so the pulaka can grow."],["party","In Tuvalu, which kind of community hall do islanders gather in for feasts, dancing and big meetings?","Maneapa","Bai","Marae","Nakamal","Each island has its own maneapa. People sit on mats in set spots around the edges, and feasts can go on late with singing."],["arts","What is Tuvalu's lively dance, where singers drum on a wooden box and the song speeds up?","Fatele","Haka","Meke","Tamure","Each fatele song starts slow and gets faster and louder until the very end, while dancers move their arms to tell a story."],["words","How do you say thank you in Tuvaluan?","Fakafetai","Vinaka","Mahalo","Mesulang","To say hello, Tuvaluans say talofa. Tuvaluan is a close cousin of the Samoan language."],["nature","What kind of ring-shaped coral islands make up most of Tuvalu?","Atolls","Fjords","Volcanoes","Sand dunes","An atoll is a ring of coral islets around a calm lagoon. Tuvalu's name means eight standing together, after its islands."],["life","What do kids in Funafuti, Tuvalu, often use as a big sports field when no planes are due?","The airport runway","The harbour wharf","The parliament lawn","A cruise ship deck","Planes land only a few times a week, so the runway is one of the biggest flat open spaces, great for football and volleyball."]],"VU":[["food","What is Vanuatu's national dish, a baked pudding of grated root vegetables and coconut cream?","Laplap","Palusami","Lu pulu","Poi","Grated yam, taro or manioc is spread on banana leaves, topped with coconut cream, and baked on hot stones."],["party","Which festival on Tanna island in Vanuatu has groups dancing all night and swapping gifts of pigs?","Nekowiar","Teuila","Heiva","Heilala","The big Toka dance is the highlight, and the festival helps keep good friendships going between neighbouring villages."],["arts","Which art from Vanuatu is drawn in one unbroken line with a finger in the sand or soil?","Sand drawing","Rangoli","Henna painting","Calligraphy","Sand drawings tell stories and share messages. UNESCO lists them as a treasure of the world's culture."],["words","About how many local languages are spoken in Vanuatu, a country of only around 300,000 people?","More than 100","About 5","About 20","About 50","That makes it one of the most language-rich places per person. Bislama, full of English-based words, helps everyone chat."],["nature","Which volcano on Tanna in Vanuatu glows so often it was nicknamed the Lighthouse of the Pacific?","Mount Yasur","Mount Fuji","Kilauea","Mauna Loa","Visitors can walk up near its rim at night to watch glowing lava bursts. It has been erupting for hundreds of years."],["life","In 2006, Vanuatu came top of a world list ranking countries for what?","Happiness","Fastest internet","Tallest people","Most rainfall","The Happy Planet Index looked at how long and happy people's lives are, while using few of Earth's resources."]],"AR":[["food","Which herbal drink do Argentinians sip from a gourd through a metal straw called a bombilla?","Mate","Chicha","Horchata","Chai","Friends pass one gourd around a circle, each one refilled with hot water. Saying gracias means you have had enough!"],["party","On Día de la Tradición, Argentinians celebrate which horse riders of the grasslands?","Gauchos","Huasos","Llaneros","Charros","On 10 November, towns hold parades of riders in baggy trousers and berets, with folk music and grilled meat."],["arts","Which dance, famous all over the world, was born in Buenos Aires over 100 years ago?","Tango","Salsa","Samba","Flamenco","Tango music is played on the bandoneón, a kind of squeezebox with buttons on both ends, along with violins and piano."],["words","Which short word do Argentinians use all the time to mean hey or mate?","Che","Güey","Parce","Pana","Argentinians also say vos instead of tú for the word you, which makes their Spanish sound different."],["nature","Argentina's national bird builds a mud nest shaped like an oven. What is it called?","Rufous hornero","Andean condor","Toco toucan","Quetzal","Hornero means baker in Spanish, because its round mud nest looks just like an old clay bread oven!"],["life","Which Argentine footballer led his team to win the 2022 World Cup?","Lionel Messi","Neymar","Cristiano Ronaldo","Luis Suárez","Messi has won the Ballon d'Or, the top award for a footballer, a record eight times."]],"BO":[["food","Which juicy baked pastry do Bolivians eat mid-morning, often with a spoon?","Salteña","Arepa","Pupusa","Tamale","Salteñas are so full of juicy stew inside that people bite carefully from the top, trying not to spill a drop!"],["party","At Bolivia's Alasitas fair in La Paz, what do people buy to wish for good luck?","Tiny miniature objects","Paper lanterns","Painted eggs","Sugar skulls","People buy tiny houses, cars and even mini money, hoping Ekeko, the spirit of plenty, will make their wishes come true."],["arts","What kind of hat do many Aymara women in La Paz wear perched on top of their heads?","Bowler hat","Sombrero","Beret","Panama hat","The hats sit up high and are worn with long braids and wide, layered skirts called polleras."],["words","How many official languages does Bolivia's constitution list?","37","3","12","50","Besides Spanish, it names 36 native languages, from Aymara and Quechua to Guaraní, spoken all around the country."],["nature","Which frog with baggy, wrinkly skin lives only in Lake Titicaca, between Bolivia and Peru?","Titicaca water frog","Poison dart frog","Glass frog","Goliath frog","Its loose skin folds soak up oxygen from the cold water, so it hardly ever needs to swim up for air."],["life","What do many people in La Paz ride to get around, high above the city streets?","Cable cars","Monorails","Trams","Water taxis","Mi Teleférico is the biggest city cable car network in the world, with lines named by colour joining La Paz and El Alto."]],"BR":[["food","Which chocolate fudge balls rolled in sprinkles are a must at Brazilian birthday parties?","Brigadeiros","Alfajores","Churros","Macarons","They are made from condensed milk, cocoa and butter, and are named after a Brazilian air force brigadier from the 1940s."],["party","During Rio's Carnival, which groups compete with giant floats and thousands of dancers?","Samba schools","Steel bands","Mariachi bands","Mardi Gras krewes","The parades take place in the Sambadrome, a long avenue lined with stands where tens of thousands of fans cheer."],["arts","Which Brazilian mix of dance, music and acrobatics is played in a circle to the twang of a berimbau?","Capoeira","Breakdancing","Tango","Kung fu","Players cartwheel, kick and dodge without touching, while everyone around them claps, sings and plays instruments."],["words","How does a boy say thank you in Brazilian Portuguese?","Obrigado","Gracias","Merci","Grazie","Girls and women say obrigada instead, with an a at the end. It comes from a word meaning obliged."],["nature","Which Amazon plant has round floating leaves up to 3 metres wide?","Giant water lily","Lotus","Rafflesia","Venus flytrap","The leaves have spiky undersides and turned-up ed   const list = SAVE.settings.diff === 'easy' ? COUNTRIES.filter(c => EASY.has(c.cc)) : COUNTRIES;
  const picks = shuffle(list.slice()).slice(0, 8), out = [];
  for (const c of picks) {
    const nb = c.borders.filter(b => BY[b]);
    const kinds = ['flag', 'famous', 'cap', ...(nb.length >= 2 ? ['border'] : [])].filter(k => k !== 'cap' || !NO_CAP_Q.has(c.cc));
    const k = pickOne(kinds), q = { kind: 'find', c, tries: 0, daily: true };
    if (k === 'flag') { q.ask = tr('Fly to the country with this flag'); q.flag = c.cc; }
    if (k === 'famous') q.ask = tr('Fly to the country famous for {thing}', { thing: c.famous });
    if (k === 'cap') q.ask = tr('Fly to the country whose capital is {city}', { city: c.capital });
    if (k === 'border') { const [a, b] = shuffle(nb.slice()).slice(0, 2).map(x => BY[x].name); q.ask = tr('Fly to the country next to {a} and {b}', { a, b }); }
    q.sub = tr('Tap it on the globe.');
    out.push(q);
  }
  rng = Math.random;
  return out;
}

function startMode(kind, extra = {}) {
  closeCard(); closeKitScreens(); clearMarks(); clearTags();
  sfx('pick', true);
  game = { kind, i: 0, qs: kind === 'daily' ? dailyQuestions() : kind === 'speed' ? [] : extra.qs || buildQuestions(kind), right: 0, res: [], streak: 0, best: 0, extra, t0: performance.now() };
  if (kind === 'speed') { game.end = performance.now() + 60000; game.qs.push(speedQ()); }
  mode = 'quiz'; showOnly('quiz');
  $('#qTimer').hidden = kind !== 'speed';
  nextQuestion(true);
}
function speedQ() { const c = weighted(pool(), new Set(game ? game.qs.slice(-6).map(q => q.c.cc) : [])); return makeQ(rng() < 0.5 ? 'flag2name' : NO_CAP_Q.has(c.cc) ? 'flag2name' : 'cap', c); }
function clearMarks() { for (const k in MARK) delete MARK[k]; drawMap(); }
function qTitle() {
  const g = game;
  if (g.kind === 'speed') return tr('{mode} · {n} right', { mode: tr(MODES.speed.name), n: g.right });
  if (g.extra.fileOf) return tr('Quiz: {name}', { name: g.extra.fileOf.name });
  return tr('{mode} · {i} of {n}', { mode: tr(MODES[g.kind].name), i: g.i + 1, n: g.qs.length });
}
function nextQuestion(first) {
  const g = game; clearTags();
  for (const k in MARK) delete MARK[k];
  if (g.kind !== 'speed' && g.i >= g.qs.length) { finish(); return; }
  const q = g.qs[g.i]; q.answered = false; q.tries = 0;
  $('#qHead').textContent = qTitle();
  $('#qProg').hidden = g.kind === 'speed';
  $('#qProg').innerHTML = g.qs.map((x, i) => `<i class="${i < g.i ? (g.res[i] ? 'ok' : 'no') : i === g.i ? 'now' : ''}"></i>`).join('');
  $('#qBox').innerHTML = (q.flag ? flagImg(q.flag, q.kind === 'flag2name' ? 'big' : '') : '') + `<div class="txt">${esc(q.ask)}${q.sub ? `<small>${esc(q.sub)}</small>` : ''}</div>`;
  const opts = $('#qOpts'); opts.innerHTML = ''; opts.hidden = !q.opts;
  if (q.opts) q.opts.forEach((o, n) => {
    const b = el('button', 'aq-opt' + (o.flag ? ' fl' : ''), o.flag ? flagImg(o.flag) : esc(o.t)); b.type = 'button';
    if (o.flag) b.setAttribute('aria-label', tr('Flag {n}', { n: n + 1 }));
    b.addEventListener('click', () => choose(o, b)); opts.appendChild(b);
  });
  $('#qFeed').textContent = ''; $('#qFeed').className = 'aq-feed';
  const acts = $('#qActs'); acts.innerHTML = '';
  q.hints = 0; hintRing.visible = false;
  if (g.kind !== 'speed' && (q.kind === 'find' || q.kind === 'capfind' || (q.opts && q.opts.length > 2))) { const hb = Oomba.ui.button(tr('Hint'), { kind: 'quiet', icon: 'hint', onPress: () => hint(hb) }); hb.dataset.k = 'hint'; acts.appendChild(hb); }
  if (q.kind === 'find' || q.kind === 'capfind') acts.appendChild(Oomba.ui.button(tr('Show me'), { kind: 'quiet', icon: 'eye', onPress: () => giveUp() }));
  // Show the country on the globe when that doesn't give the answer away.
  if (q.show) { MARK[q.c.cc] = 'hot'; flyTo(q.c); }
  else if ((q.kind === 'find' || q.kind === 'capfind') && SAVE.settings.diff === 'easy' && !q.daily) { const r = q.c; flyCam(r.lab[0] + (rng() - 0.5) * 18, r.lab[1] + (rng() - 0.5) * 30, 3.0, 900); }
  else if (q.kind === 'find' || q.kind === 'capfind') flyCam(cam.lat, cam.lng, Math.max(cam.dist, 2.9), 600);
  drawMap();
  if (!first) requestAnimationFrame(placeCam);
}
function flyTo(c, dist) { const at = TINY.has(c.cc) ? c.cap : c.lab; const span = SHAPES[c.cc] ? Math.max(SHAPES[c.cc].box[2] - SHAPES[c.cc].box[0], SHAPES[c.cc].box[3] - SHAPES[c.cc].box[1]) : 2; flyCam(at[0], at[1], dist || Math.max(1.6, Math.min(3.2, 1.45 + span / 40))); }

function choose(o, b) {
  const g = game, q = g.qs[g.i]; if (!q || q.answered) return;
  q.answered = true;
  const btns = [...$('#qOpts').children];
  btns.forEach((x, n) => { x.disabled = true; const oo = q.opts[n]; if (oo.ok) x.classList.add('good'); else if (x === b) x.classList.add('bad'); else x.classList.add('dim'); });
  answer(o.ok, o.cc);
}
/** Hints: on the globe, three steps (the continent, a neighbour, a circle); for four answers, two wrong ones go. */
function hint(btn) {
  const g = game, q = g && g.qs[g.i]; if (!q || q.answered) return;
  const c = q.c, fb = $('#qFeed'); fb.className = 'aq-feed'; sfx('pick', true);
  if (q.opts) {
    const wrong = shuffle([...$('#qOpts').children].filter((b, n) => !q.opts[n].ok && !b.disabled)).slice(0, 2);
    wrong.forEach(b => { b.disabled = true; b.classList.add('dim'); });
    q.hints = 2; fb.textContent = tr('Two wrong answers are gone!'); btn.disabled = true; return;
  }
  q.hints++;
  const at = TINY.has(c.cc) ? c.cap : c.lab, island = !c.borders.some(b => BY[b]);
  if (q.hints === 1) {
    for (const x of COUNTRIES) if (x.reg === c.reg && !MARK[x.cc]) MARK[x.cc] = 'reg';
    drawMap();
    const cs = COUNTRIES.filter(x => x.reg === c.reg), lat = cs.reduce((a, x) => a + x.lab[0], 0) / cs.length, lng = cs.reduce((a, x) => a + x.lab[1], 0) / cs.length;
    const mid = c.reg === 'oc' ? [-15, 150] : [lat, lng]; let dl = at[1] - mid[1]; dl = ((dl + 540) % 360) - 180;
    flyCam((mid[0] + at[0]) / 2, mid[1] + dl / 2, 2.8);
    fb.textContent = island ? tr('It is an island country, in {region}.', { region: tr(REG[c.reg].name) }) : tr('It is in {region}.', { region: tr(REG[c.reg].name) });
  } else if (q.hints === 2 && !island) {
    const nbs = c.borders.filter(b => BY[b]).map(b => BY[b]).sort((a, b) => (EASY.has(b.cc) - EASY.has(a.cc)) || b.area - a.area);
    const nb = nbs[0]; for (const k in MARK) if (MARK[k] === 'reg') delete MARK[k];
    MARK[nb.cc] = 'near'; drawMap(); tag(nb.cc, nb.name, '', 4000);
    flyCam(at[0], at[1], 2.2);
    fb.textContent = tr('It is next to {name}.', { name: nb.name });
  } else {
    q.hints = 3; for (const k in MARK) if (MARK[k] === 'reg') delete MARK[k]; drawMap();
    const km = TINY.has(c.cc) ? 350 : 650, off = rng() * 0.45 * km / 111, ang = rng() * Math.PI * 2;
    const lat = at[0] + Math.sin(ang) * off, lng = at[1] + Math.cos(ang) * off / Math.max(0.3, Math.cos(at[0] * DEG));
    showRing(lat, lng, km); flyCam(lat, lng, 1.9);
    fb.textContent = tr('It is inside the yellow circle!');
    btn.disabled = true;
  }
}
/** Record an answer: mastery, lighting up, the plane, then the next question. */
function answer(ok, wrongCc) {
  const g = game, q = g.qs[g.i], c = q.c;
  g.res[g.i] = ok;
  let litNow = false;
  if (ok) {
    g.right++; g.streak++; g.best = Math.max(g.best, g.streak);
    const was = isLit(c.cc); if ((q.hints || 0) < 2) SAVE.m[c.cc] = Math.min(9, (SAVE.m[c.cc] || 0) + 1); litNow = !was && isLit(c.cc);
    if (SAVE.miss[c.cc]) SAVE.miss[c.cc]--;
    if (q.kind === 'culture') SAVE.cult[c.cc] = cultureFound(c.cc) | (1 << q.item.i);
    sfx(litNow ? 'lit' : 'good', true);
    const fb = $('#qFeed'); fb.className = 'aq-feed good';
    fb.textContent = litNow ? tr('{name} lights up on your map!', { name: c.name }) : g.streak >= 3 ? tr('Right! {n} in a row!', { n: g.streak }) : tr('Right!');
  } else {
    g.streak = 0; SAVE.miss[c.cc] = Math.min(5, (SAVE.miss[c.cc] || 0) + 1);
    sfx('bad', true);
    const fb = $('#qFeed'); fb.className = 'aq-feed bad';
    const w = wrongCc && BY[wrongCc];
    fb.textContent = q.kind === 'culture' ? tr('Not quite! The answer is {answer}.', { answer: q.item.a }) : !w ? tr('Not quite. Here is the answer.')
      : q.kind === 'name2flag' ? tr('Not quite: that is the flag of {name}.', { name: w.name })
      : q.kind === 'cap' ? tr('Not quite: {city} is the capital of {name}.', { city: w.capital, name: w.name })
      : tr('Not quite: that was {name}.', { name: w.name });
  }
  if (q.why) $('#qFeed').appendChild(el('div', 'aq-why', `${ICON(CATS[q.cat].icon)}<span>${esc(q.why)}</span>`));
  save(); hintRing.visible = false;
  for (const k in MARK) if (MARK[k] === 'reg' || MARK[k] === 'near') delete MARK[k];
  MARK[c.cc] = ok ? 'got' : 'hot'; drawMap();
  if (ok) { flyPlane(c.cc, { roll: litNow }); if (litNow) { syncPins(c.cc); celebrate(c); } }
  else flyTo(c);
  tag(c.cc, c.name, ok ? 'good' : 'hot', 0);
  if (g.kind === 'speed') { after(ok ? 450 : 900, () => { if (game !== g || mode !== 'quiz' || g.over) return; g.i++; g.qs.push(speedQ()); nextQuestion(); }); return; }
  const acts = $('#qActs'); acts.innerHTML = '';
  acts.appendChild(Oomba.ui.button(tr('About {name}', { name: c.name }), { kind: 'quiet', icon: 'book', onPress: () => fileCard(c) }));
  const nb = Oomba.ui.button(g.i + 1 >= g.qs.length ? tr('Finish') : tr('Next'), { kind: 'go', icon: 'next', onPress: () => { if (game === g) { g.i++; nextQuestion(); } } });
  acts.appendChild(nb); nb.focus({ preventScroll: true });
  requestAnimationFrame(() => { const sh = $('#quizSheet'); sh.scrollTop = sh.scrollHeight; });
  if (ok && !litNow && !q.why) after(1500, () => { if (game === g && g.qs[g.i] === q && $('#scrim').hidden) { g.i++; nextQuestion(); } });
}
function celebrate(c) {
  tag(c.cc, tr('{name} is lit!', { name: c.name }), 'hot', 3000);
  const reg = REG[c.reg];
  if (COUNTRIES.filter(x => x.reg === c.reg).every(x => isLit(x.cc)) && !SAVE.badges[c.reg]) {
    SAVE.badges[c.reg] = 1; save();
    after(900, () => { try { if (!reduced()) Oomba.juice.confetti(); } catch { /* fine */ } Oomba.ui.toast(tr('You lit up all of {region}! New badge in your passport.', { region: tr(reg.name) }), { ms: 3600 }); });
  }
  const before = PAINTS.filter(p => litCount() - 1 >= p[1]).length, now = PAINTS.filter(p => litCount() >= p[1]).length;
  if (now > before) after(1600, () => Oomba.ui.toast(tr('New plane paint in your passport!'), { ms: 3000 }));
  renderLit();
  try { if (HAS_BRB) BRB.score.submit(litCount(), 'countries'); } catch { /* fine */ }
  if (litCount() === COUNTRIES.length) try { if (HAS_BRB) BRB.gameOver({ won: true, score: litCount() }); } catch { /* fine */ }
}
/* Tapping the globe: answers find questions, or opens a country file. */
function tapAt(x, y) {
  const hit = pickAt(x, y); if (!hit) return;
  if (mode === 'quiz' && game) {
    const q = game.qs[game.i];
    if (q && (q.kind === 'find' || q.kind === 'capfind') && !q.answered) { guess(q, hit); return; }
    if (hit.cc && BY[hit.cc]) { const c = BY[hit.cc]; tag(c.cc, c.name, '', 1600); sfx('pick'); }
    return;
  }
  if (mode === 'home' && hit.cc && BY[hit.cc]) { sfx('pick'); fileCard(BY[hit.cc]); }
}
function guess(q, hit) {
  const c = q.c;
  if (hit.cc === c.cc) { q.answered = true; answer(true, null); if (q.tries >= 2) game.res[game.i] = false; return; }
  q.tries++;
  const at = TINY.has(c.cc) ? c.cap : c.lab, km = Math.round(kmBetween(hit.ll, at) / 50) * 50, dir = tr(dirWord(bearing(hit.ll, at)));
  if (hit.cc && BY[hit.cc]) { MARK[hit.cc] = 'wrong'; drawMap(); tag(hit.cc, BY[hit.cc].name, 'bad', 2000); after(1400, () => { if (MARK[hit.cc] === 'wrong') { delete MARK[hit.cc]; drawMap(); } }); }
  sfx('bad', true);
  const fb = $('#qFeed'); fb.className = 'aq-feed bad';
  const name = q.kind === 'capfind' ? c.capital : c.name;
  fb.textContent = (hit.cc && BY[hit.cc] ? tr('That is {name}.', { name: BY[hit.cc].name }) + ' ' : '') + tr('{place} is about {km} km to the {dir}.', { place: name, km, dir });

}
function giveUp() { const q = game && game.qs[game.i]; if (!q || q.answered) return; q.answered = true; answer(false, null); $('#qFeed').textContent = tr('Here it is: {name}.', { name: q.c.name }); }
async function finish() {
  const g = game, n = g.qs.length, right = g.res.filter(Boolean).length;
  mode = 'done';
  if (g.extra.fileOf) { showOnly('none'); goHome(); fileCard(g.extra.fileOf, tr('You got {a} of {b} right!', { a: right, b: n })); return; }
  const stars = g.kind === 'speed' ? (right >= 25 ? 3 : right >= 16 ? 2 : right >= 8 ? 1 : 0) : right >= n - 1 ? 3 : right >= Math.ceil(n * 0.7) ? 2 : right >= Math.ceil(n * 0.4) ? 1 : 0;
  let best = null;
  if (g.kind === 'speed') { best = SAVE.best.speed; SAVE.best.speed = Math.max(best, right); }
  else { best = SAVE.modes[g.kind] || null; SAVE.modes[g.kind] = Math.max(best || 0, stars); }
  if (g.kind === 'daily') SAVE.daily[todayKey()] = Math.max(SAVE.daily[todayKey()] || 0, stars + 1);
  save();
  showOnly('none');
  const title = g.kind === 'speed' ? tr('{n} in 60 seconds!', { n: right }) : g.kind === 'daily' ? tr('Expedition done: {a} of {b}', { a: right, b: n }) : tr('{a} of {b} right!', { a: right, b: n });
  const v = await Oomba.ui.win({ stars, score: g.kind === 'speed' ? right : right * 100, best: g.kind === 'speed' ? best : null, hero: SKYE.spec, title, next: g.kind !== 'daily' });

function quit() { hintRing.visible = false; game = null; clearMarks(); clearTags(); goHome(); }

/* ---------- Country files ---------- */
function fileCard(c, note) {
  const m = SAVE.m[c.cc] || 0, lit = isLit(c.cc);
  MARK[c.cc] = 'pick'; drawMap(); if (mode === 'home') flyTo(c);
  const html = `<div class="aq-file"><div class="top">${flagImg(c.cc)}<div><h2>${esc(c.name)}</h2><div>${esc(tr(REG[c.reg].name))} · <span class="aq-dots" role="img" aria-label="${esc(tr('{n} of 3 to light it up', { n: Math.min(3, m) }))}">${[0, 1, 2].map(i => `<i class="${i < m ? 'on' : ''}"></i>`).join('')}</span> ${lit ? esc(tr('Lit!')) : ''}</div></div></div>
    ${note ? `<p class="aq-fact"><b>${esc(note)}</b></p>` : ''}
    <dl><dt>${esc(tr('Capital'))}</dt><dd>${esc(c.capital)}</dd><dt>${esc(tr('People'))}</dt><dd>${esc(bigNum(c.pop))}</dd>
    <dt>${esc(tr('Languages'))}</dt><dd>${esc(listOf(c.langs))}</dd><dt>${esc(tr('Famous for'))}</dt><dd>${esc(c.famous)}</dd>
    <dt>${esc(tr('Neighbours'))}</dt><dd>${c.borders.length ? esc(listOf(c.borders.filter(b => BY[b]).map(b => BY[b].name).sort(collator.compare))) : esc(c.landlocked ? '—' : tr('None: only the sea!'))}</dd></dl>
    <div class="aq-fact"><b>${esc(tr('Did you know?'))}</b> ${esc(c.fact)}</div>
    ${cultureHtml(c)}
    <div class="aq-acts"><i data-say></i><i data-x></i><i data-quiz></i></div></div>`;
  const md = openCard(html, () => { if (MARK[c.cc] === 'pick') { delete MARK[c.cc]; drawMap(); } });
  cardBtn(md, '[data-say]', tr('Read it to me'), { kind: 'icon', icon: 'speak', onPress: () => { Oomba.say(`${c.name}. ${tr('Capital')}: ${c.capital}. ${c.fact}`).catch(() => {}); } });
  cardBtn(md, '[data-x]', tr('Close'), { kind: 'quiet', onPress: closeCard });
  cardBtn(md, '[data-quiz]', tr('Quiz me'), { kind: 'go', icon: 'play', onPress: () => { const cq = shuffle((CULTURE[c.cc] || []).slice()).sort((a, b) => ((cultureFound(c.cc) >> a.i) & 1) - ((cultureFound(c.cc) >> b.i) & 1)).slice(0, 3).map(t => cultureQ(c, t)); const qs = cq.length >= 3 ? cq : shuffle(triviaFor(c)).slice(0, 3); startMode('files-quiz', { qs, fileOf: c }); } }).setAttribute('data-ok-focus', '');
}
MODES['files-quiz'] = { name: 'Country files', n: 3 };
/** The culture finds in a country file: what you've discovered, and how many are left. */
function cultureHtml(c) {
  const list = CULTURE[c.cc]; if (!list) return '';
  const got = list.filter(x => cultureFound(c.cc) & (1 << x.i));
  return `<h3 class="aq-ch">${esc(tr('Culture finds'))} <small class="aq-num">${got.length} / ${list.length}</small></h3>` +
    (got.length ? got.map(x => `<div class="aq-find">${ICON(CATS[x.cat].icon)}<div><small>${esc(tr(CATS[x.cat].name))} · ${esc(x.q)}</small><b>${esc(x.a)}</b><span>${esc(x.why)}</span></div></div>`).join('') : '') +
    (got.length < list.length ? `<p class="aq-hint">${esc(tr('Press Quiz me to discover more about {name}!', { name: c.name }))}</p>` : '');
}

/* ---------- Passport: badges, stamps (flags) and plane paint ---------- */
const PAINTS = [['sky', 0], ['coral', 5], ['mint', 15], ['grape', 30], ['spark', 50], ['peach', 80], ['cocoa', 120], ['snow', 160]];
const PAINT_NAMES = { sky: 'Sky blue', coral: 'Coral red', mint: 'Mint green', grape: 'Grape purple', spark: 'Sunny yellow', peach: 'Peach', cocoa: 'Cocoa', snow: 'Snow white' };
function applyLook() { const p = SAVE.look.paint; planeMat.color.set(C(p)); planeEdge.color.set(p === 'snow' ? C('stone', 'tint') : C(p, 'tint')); planeStripe.color.set(p === 'spark' || p === 'peach' ? C('coral') : p === 'snow' ? C('sky') : C('spark')); trailMat.color.set(PAL.night ? C('spark', 'light') : C(SAVE.look.paint, 'shade')); }

  const streak = dailyStreak();
  const m = openCard(`<h2 class="ok-h2">${esc(tr('Your passport'))}</h2><p>${esc(tr('{n} of {all} countries lit up.', { n: lit, all: COUNTRIES.length }))} ${esc(tr('Get a country right 3 times to light it up.'))}</p>
    <p>${ICON('heart')} ${esc(tr('Culture finds: {n} of {all}', { n: cultureCount(), all: CULTURE_ALL }))}</p>
    <p>${ICON('timer')} ${esc(tr('Best speed round: {n}', { n: SAVE.best.speed }))} · ${ICON('gem')} ${esc(tr('Expedition streak: {n} days', { n: streak }))}</p>
    <h3>${esc(tr('Plane paint'))}</h3><div class="aq-paints">${paints}</div>
    <div class="aq-acts" style="justify-content:flex-start"><i data-t="stamps"></i><i data-t="bars"></i></div>${body}<div class="aq-acts"><i data-x></i></div>`);
  m.querySelectorAll('[data-paint]').forEach(b => b.addEventListener('click', () => { SAVE.look.paint = b.dataset.paint; save(); applyLook(); sfx('pick'); passportCard(tab); }));
  m.querySelectorAll('[data-cc]').forEach(b => b.addEventListener('click', () => fileCard(BY[b.dataset.cc])));
  cardBtn(m, '[data-t="stamps"]', tr('Stamps'), { kind: 'quiet', onPress: () => passportCard('stamps') }).setAttribute('aria-pressed', String(tab === 'stamps'));

  cardBtn(m, '[data-x]', tr('Done'), { kind: 'go', icon: 'check', onPress: closeCard }).setAttribute('data-ok-focus', '');
}

/* ---------- Settings: the game's choices, then the kit's (sound, captions, text size, motion) ---------- */
function settingsCard() {
  const m = openCard(`<h2 class="ok-h2">${esc(tr('Atlas Quest settings'))}</h2>
    <div class="ok-srow"><div>${esc(tr('Start over'))}<small>${esc(tr('Clears your lit countries, stamps and paint'))}</small></div><i data-reset></i></div>
    <div class="aq-acts"><i data-more></i><i data-x></i></div>`);
  cardBtn(m, '[data-reset]', tr('Start over'), { kind: 'quiet', icon: 'restart', onPress: () => {
    const c = openCard(`<h2 class="ok-h2">${esc(tr('Start over?'))}</h2><p>${esc(tr('Your map goes back to grey. This cannot be undone.'))}</p><div class="aq-acts"><i data-no></i><i data-yes></i></div>`);
    cardBtn(c, '[data-no]', tr('Keep my map'), { kind: 'go', onPress: settingsCard }).setAttribute('data-ok-focus', '');
    cardBtn(c, '[data-yes]', tr('Yes, start over'), { kind: 'quiet', onPress: () => {
      Object.assign(SAVE, { m: {}, miss: {}, best: { speed: 0 }, daily: {}, trail: [], badges: {}, modes: {}, cult: {} }); SAVE.look.paint = 'sky'; save();
      for (const k in pins) { pinGroup.remove(pins[k]); delete pins[k]; } trailGroup.clear(); plane.visible = false; planeAt = null; applyLook(); drawMap(); renderLit(); closeCard(); goHome();
      Oomba.ui.toast(tr('A fresh grey map. Off you go!'));
    } });
  } });
  cardBtn(m, '[data-more]', tr('Sound and more'), { kind: 'quiet', icon: 'settings', onPress: () => Oomba.ui.settings() });
  cardBtn(m, '[data-x]', tr('Done'), { kind: 'go', icon: 'check', onPress: closeCard }).setAttribute('data-ok-focus', '');
}

/* ---------- Screens ---------- */
function showOnly(name) {
  $('#aqBar').hidden = name === 'title';
  $('#homeSheet').hidden = name !== 'home';
  $('#quizSheet').hidden = name !== 'quiz';
  requestAnimationFrame(placeCam);
}
function renderLit() { $('#litPill').innerHTML = `${ICON('flag')}<span class="aq-num">${litCount()} / ${COUNTRIES.length}</span>`; $('#litPill').setAttribute('aria-label', tr('{n} of {all} countries lit up', { n: litCount(), all: COUNTRIES.length })); }
function renderHome() {
  const lit = litCount();
  $('#homeTitle').textContent = tr('Where to, pilot?');
  $('#homeSub').textContent = lit ? tr('{n} countries lit up. Keep going!', { n: lit }) : tr('Light up the world: get a country right 3 times to colour it in.');
  const rr = $('#regionRow'); rr.innerHTML = '';
  for (const id of ['all', ...REGIONS.map(r => r.id)]) {
    const b = Oomba.ui.button(regionName(id), { kind: 'quiet', onPress: () => { SAVE.settings.region = id; save(); renderHome(); if (id !== 'all') { const cs = COUNTRIES.filter(c => c.reg === id); const lat = cs.reduce((a, c) => a + c.lab[0], 0) / cs.length, lng = cs.reduce((a, c) => a + c.lab[1], 0) / cs.length; flyCam(lat, lng, 2.6); } } });
    b.setAttribute('aria-pressed', String(SAVE.settings.region === id)); rr.appendChild(b);
  }
  const dr = $('#diffRow'); dr.innerHTML = '';
  for (const [id, label] of [['easy', tr('Easy: famous countries')], ['explorer', tr('Explorer: every country')]]) {
    const b = Oomba.ui.button(label, { kind: 'quiet', onPress: () => { SAVE.settings.diff = id; save(); renderHome(); } });
    b.setAttribute('aria-pressed', String(SAVE.settings.diff === id)); dr.appendChild(b);
  }
  const g = $('#modeGrid'); g.innerHTML = '';
  for (const k of ['find', 'flags', 'caps', 'culture', 'daily', 'speed']) {
    const md = MODES[k];
    let extra = esc(tr(md.about));
    if (k === 'daily') extra = SAVE.daily[todayKey()] ? esc(tr('Done today! Streak: {n}', { n: dailyStreak() })) : esc(tr(md.about));
    if (k === 'speed' && SAVE.best.speed) extra = esc(tr('Best: {n}', { n: SAVE.best.speed }));
    const b = el('button', 'aq-mode ' + md.cls, `${ICON(md.icon)}<span>${esc(tr(md.name))}</span><small>${extra}</small>`); b.type = 'button'; b.dataset.mode = k;
    b.addEventListener('click', () => startMode(k)); g.appendChild(b);
  }
  $('#homeHint').textContent = tr('Drag to spin the globe, pinch to zoom, tap a country to read its file.');
  renderLit();
}
function goHome() { closeKitScreens(); game = null; mode = 'home'; clearTags(); renderHome(); showOnly('home'); if (cam.dist < 2.6) flyCam(cam.lat, cam.lng, 2.9, 700); }
let titleOpen = false;
async function goTitle() {
  closeCard(); game = null; mode = 'title'; showOnly('title'); flyCam(20, cam.lng, 3.6, 1200);
  if (titleOpen) return; titleOpen = true;
  await Oomba.ui.title({ title: 'Atlas Quest', subtitle: tr('Fly round the world and light up every country!'), hero: SKYE.spec, titleHue: 'sky' });
  titleOpen = false;
  if (mode === 'title') onPlay();
}
async function onPlay() {
  if (!SAVE.intro) {
    SAVE.intro = 1; save();
    await say(tr('Welcome aboard, pilot! I am Captain Skye. The world map has gone all grey, and we need a sharp-eyed explorer to colour it back in.'));
    await say(tr('Every time you get a country right, our paper plane flies there and paints it with its flag. Get it right 3 times and it lights up in full colour!'));
    await say(tr('Pick a game below, or tap any country on the globe to open its file and discover its culture. Ready for take-off?'), [{ label: tr('Let\'s fly!'), kind: 'hot', value: 0, icon: 'play' }]);
  }
  goHome();
}

/* ---------- Buttons ---------- */
mkBtn('home', tr('Title screen'), { kind: 'icon', icon: 'home', onPress: () => goTitle() });
mkBtn('passport', tr('Your passport'), { kind: 'icon', icon: 'book', onPress: () => passportCard() });
mkBtn('settings', tr('Settings'), { kind: 'icon', icon: 'settings', onPress: settingsCard });
mkBtn('quit', tr('Back'), { kind: 'icon', icon: 'back', onPress: quit });
if (!IS_EN) for (const e of document.querySelectorAll('[aria-label]')) e.setAttribute('aria-label', tr(e.getAttribute('aria-label')));

/* ---------- Main loop ---------- */
let last = performance.now(), idleT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (cam.tw) {
    const w = cam.tw; w.t += dt * 1000; const k = Math.min(1, w.t / w.ms), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    cam.lat = w.a.lat + (w.b.lat - w.a.lat) * e; cam.lng = w.a.lng + (w.b.lng - w.a.lng) * e; cam.dist = w.a.dist + (w.b.dist - w.a.dist) * e;
    if (k >= 1) cam.tw = null;
  } else if (!drag && !pinch) {
    cam.lng += cam.vlng; cam.lat = Math.max(-75, Math.min(78, cam.lat + cam.vlat)); cam.vlng *= 0.9; cam.vlat *= 0.9;
    idleT += dt; if ((mode === 'title' || (mode === 'home' && idleT > 8)) && !reduced()) cam.lng += dt * 4;
  }
  if (flight.on) {
    flight.t += dt / flight.dur; const t = Math.min(1, flight.t), e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    placeAlong(flight.from, flight.to, e, flight.h);
    if (t >= 1) { flight.on = false; const d = flight.done; flight.done = null; if (d) d(); }
  } else if (plane.visible && !reduced()) { plane.position.normalize().multiplyScalar(ALT + 0.004 + Math.sin(now / 600) * 0.003); }
  stepPlaneFx(dt, now);
  // flags turn to face you as the globe spins
  for (const p of Object.values(pins)) {
    const u = p.userData, t = camera.position.clone().sub(p.position); t.sub(u.up.clone().multiplyScalar(t.dot(u.up)));
    const z0 = new THREE.Vector3(0, 0, 1).applyQuaternion(u.q0), ang = Math.atan2(z0.clone().cross(t).dot(u.up), z0.dot(t)) - 0.5;
    p.quaternion.copy(u.q0).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), ang));
  }
  for (const p of Object.values(pins)) if (p.userData.grow < 1) { p.userData.grow = Math.min(1, p.userData.grow + dt * 1.8); const g = p.userData.grow; p.scale.setScalar(Math.max(0.001, g < 0.7 ? g / 0.7 * 1.25 : 1.25 - (g - 0.7) / 0.3 * 0.25)); }
  if (mode === 'quiz' && game && game.kind === 'speed' && !game.over) {
    const left = Math.max(0, Math.ceil((game.end - performance.now()) / 1000));
    if ($('#qTimer').textContent !== String(left)) { $('#qTimer').textContent = String(left); if (left <= 5 && left > 0) sfx('tick', true); }
    if (left <= 0) { game.over = true; finish(); }
  }
  if (hintRing.visible) hintRing.material.opacity = reduced() ? 0.9 : 0.55 + Math.sin(now / 220) * 0.35;
  placeCam(); updateTags();
  renderer.render(scene, camera);
}

/* ---------- Start ---------- */
applyTheme(); applyLook(); syncPins(); restoreTrail(); renderLit();
placeCam();
requestAnimationFrame(frame);
goTitle();

/* ---------- Test hooks: the kit's (setTheme, setLang, ...) plus the game's own ---------- */
Oomba.test({
  state: () => ({ mode, kind: game && game.kind, q: game && game.qs[game.i] ? { kind: game.qs[game.i].kind, cc: game.qs[game.i].c.cc } : null, lit: litCount(), right: game ? game.right : 0 }),
  start: () => { closeKitScreens(); goHome(); },
});
Object.assign(window.__brbTest, {
  home: () => goHome(),
  mode: k => startMode(k),
  answer: ok => { const q = game && game.qs[game.i]; if (!q) return false; if (q.opts) { const i = q.opts.findIndex(o => !!o.ok === !!ok); const b = $('#qOpts').children[i]; choose(q.opts[i], b); } else if (ok) guess(q, { cc: q.c.cc, ll: q.c.lab }); else { const o = COUNTRIES.find(x => x.reg !== q.c.reg); guess(q, { cc: o.cc, ll: o.lab }); } return true; },
  hint: () => { const b = document.querySelector('#qActs [data-k=hint]'); if (b && !b.disabled) b.click(); return $('#qFeed').textContent; },
  planeCam: () => { const ll = v2ll(plane.position); cam.tw = null; Object.assign(cam, { lat: ll[0] - 9, lng: ll[1] + 4, dist: 1.75 }); },
  culture: cc => { const c = BY[cc]; return (CULTURE[cc] || []).map(x => ({ cat: x.cat, q: x.q, a: x.a })); },
  next: () => { if (game) { game.i++; nextQuestion(); } },
  tapCountry: cc => { const c = BY[cc]; if (mode === 'home') fileCard(c); else if (game) guess(game.qs[game.i], { cc, ll: c.lab }); },
  file: cc => fileCard(BY[cc]),
  passport: () => passportCard(),
  lightAll: n => { for (const c of COUNTRIES.slice(0, n || COUNTRIES.length)) SAVE.m[c.cc] = 3; syncPins(); drawMap(); renderLit(); },
  camera: o => { cam.tw = null; Object.assign(cam, o); },
  closeModal: () => { closeKitScreens(); closeCard(); },
  closeDialog: () => closeKitScreens(),
  pickAt: (x, y) => pickAt(x, y),
  countryAt: (lat, lng) => countryAt(lat, lng),
  screenOf: cc => { const c = BY[cc], at = TINY.has(cc) ? c.cap : c.lab; return project(ll2v(at[0], at[1], 1)); },
  countries: () => COUNTRIES.length,
  cover: () => {   // the store picture: a half-lit world with pins, a trail and the plane in flight, no sheet
    closeKitScreens(); closeCard(); game = null; mode = 'home';
    for (const c of COUNTRIES) if (['eu', 'af'].includes(c.reg) || EASY.has(c.cc)) SAVE.m[c.cc] = 3;
    syncPins(); drawMap(); renderLit(); showOnly('none'); $('#aqBar').hidden = false;
    for (const cc of ['BR', 'GB', 'FR', 'EG', 'KE', 'NG']) flyPlane(cc, { follow: false });
    flight.on = false; placeAlong(flight.from, flight.to, 0.55, flight.h); cam.tw = null; Object.assign(cam, { lat: 22, lng: 8, dist: 3.35 });
  },
});
</script>
