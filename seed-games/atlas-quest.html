es?","Toob","Kimono","Poncho","Kilt","A toob is a long piece of light cloth wrapped around the body and over the head, in every colour you can imagine."],["words","Which Arabic greeting do people in Sudan say when they meet?","Salaam alaykum","Shalom","Namaste","Jambo","It means peace be upon you. The reply is wa alaykum as-salaam, and handshakes can go on for a long time!"],["nature","Which two rivers meet in Khartoum, Sudan, to form the great Nile?","Blue and White Nile","Tigris and Euphrates","Niger and Benue","Congo and Ubangi","From a bridge you can see the two different colours of water flowing side by side before they mix."],["life","In Sudan, coffee brewed in a clay pot called a jebena is often flavoured with which spice?","Ginger","Vanilla","Nutmeg","Chilli","The beans are roasted in a pan, ground by hand and served in tiny cups to guests at a friendly afternoon get-together."]],"TZ":[["food","What stiff maize porridge is eaten with almost every meal in Tanzania?","Ugali","Couscous","Polenta","Injera","You roll a small ball of ugali in your hand, press a dent with your thumb and use it to scoop up stew or greens."],["party","Which music festival, whose name means sounds of wisdom, is held in Zanzibar?","Sauti za Busara","Lake of Stars","FESPAM","Felabration","Every February, musicians from all over Africa play in the old stone fort in Stone Town, and the crowds dance all night."],["arts","Which bright painting style, full of animals and birds, began in Dar es Salaam in the 1960s?","Tingatinga","Dot painting","Pop art","Ndebele painting","It is named after the artist Edward Saidi Tingatinga, who painted with shiny bicycle paint!"],["words","Which Swahili phrase, famous from The Lion King, means no worries?","Hakuna matata","Pole pole","Karibu sana","Jambo bwana","Many Lion King names are Swahili too: simba means lion, and rafiki means friend."],["nature","Which animals make up most of the Great Migration across Tanzania's Serengeti?","Wildebeest","Elephants","Giraffes","Flamingos","Over a million wildebeest, along with zebras and gazelles, follow the rains in a giant loop every year."],["life","Which blue-violet gemstone is found in only one place on Earth, near Kilimanjaro?","Tanzanite","Sapphire","Amethyst","Emerald","It was found in 1967 in the Merelani Hills, and jewellers named it after Tanzania, the only place it comes from."]],"TG":[["food","Which spongy steamed cakes, made from maize or rice, are a Togolese favourite?","Ablo","Idli","Mochi","Crumpets","Ablo is often eaten with spicy pepper sauce and fried fish or shrimp, especially along Togo's coast."],["party","What do young Kabye men do during Evala, a big July festival in northern Togo?","Wrestle","Race horses","Climb palm trees","Row canoes","Evala marks growing up. Crowds sing and drum as the young wrestlers try to throw each other to the ground."],["arts","Ewe weavers in Togo make which colourful cloth from narrow woven strips?","Kente","Bogolan","Gara","Tartan","The narrow strips are woven on a loom and then sewn together side by side to make one big, bright cloth."],["words","How do Ewe speakers in Togo say welcome?","Woezor","Akwaaba","Karibu","Mbote","French is the official language, but Ewe and Kabiye are spoken by millions, and Togo has around 40 languages."],["nature","What is the highest mountain in Togo, with farms of coffee and cocoa on its slopes?","Mount Agou","Mount Kenya","Mount Cameroon","Mount Elgon","Mount Agou is just under 1,000 metres tall, and its green slopes are dotted with villages and banana trees."],["life","Which Togolese striker was named African Footballer of the Year in 2008?","Emmanuel Adebayor","Didier Drogba","Samuel Eto'o","Yaya Toure","He played for big clubs like Arsenal and Real Madrid, and helped Togo reach its first World Cup in 2006."]],"TN":[["food","Which spicy red chilli paste is a must in kitchens all over Tunisia?","Harissa","Wasabi","Pesto","Tahini","Harissa is made from roasted red peppers, garlic and spices. Tunisians spread it on bread and stir it into soups and couscous."],["party","In Tunisia's desert town of Douz, which animals race at the yearly Festival of the Sahara?","Camels","Horses","Ostriches","Donkeys","The festival is held in winter and also has poetry, music, and people dressed in traditional desert clothes."],["arts","What is the red felt cap that is a traditional hat in Tunisia called?","Chechia","Beret","Stetson","Panama hat","Chechia makers in Tunis knit the wool, then shrink it and brush it by hand until it becomes soft, thick felt."],["words","Most people in Tunisia speak Arabic. How do you say thank you in Arabic?","Shukran","Gracias","Danke","Asante","Arabic is written from right to left, and Tunisians often mix French words into their everyday chats."],["nature","Which small desert fox with giant ears lives in the Sahara in southern Tunisia?","Fennec fox","Arctic fox","Kit fox","Grey fox","Its huge ears let out heat to keep it cool, and its furry feet stop it from burning on the hot sand."],["life","Which Tunisian seaside village is famous for its white houses with bright blue doors?","Sidi Bou Said","Tozeur","Kairouan","Tataouine","The village sits on a cliff above the sea near Tunis, and local rules keep its colours blue and white."]],"UG":[["food","In Uganda, what is the name of the popular street snack of an omelette rolled up in a chapati?","Rolex","Samosa","Mandazi","Burrito","The name comes from saying rolled eggs very fast. Street cooks make them fresh on hot griddles."],["party","In Buganda, Uganda, which ceremony before a wedding introduces the groom to the bride's relatives?","Kwanjula","Lobola","Quinceanera","Henna night","Guests dress up, women in a puffy-shouldered gomesi dress and men in a long white kanzu robe, and gifts are brought."],["arts","Which traditional cloth in Uganda is made by beating the inner bark of a fig tree?","Barkcloth","Kente","Batik","Silk","Makers soak the bark and pound it with wooden mallets until it stretches into a soft, rusty-brown sheet."],["words","How do you say thank you in Luganda, a language spoken in Uganda?","Webale","Ngiyabonga","Obrigado","Danke","Uganda has over 40 local languages. In Luganda, webale nnyo means thank you very much!"],["nature","Which bird with a golden crown of feathers stands in the middle of Uganda's flag?","Grey crowned crane","Bald eagle","Flamingo","Peacock","It stands on one leg on the flag, and in real life it dances by bowing, jumping and flapping its wings."],["life","Which imaginary line crosses Uganda, letting tourists stand with one foot in each half of the world?","The Equator","Tropic of Cancer","Prime Meridian","Arctic Circle","At equator monuments by the road, visitors take photos with one foot in the north and one in the south."]],"ZM":[["food","What thick maize porridge, eaten with the hands, is the main food in Zambia?","Nshima","Injera","Couscous","Polenta","People roll a ball of nshima in their right hand and use it to scoop up stews of greens, beans or fish."],["party","In Zambia's Kuomboka ceremony, how does the Lozi king travel to higher ground when the plains flood?","On a giant boat","On an elephant","In a hot air balloon","On a camel","The royal barge, the Nalikwanda, is painted with black and white stripes and paddled by about 100 men as drums boom."],["arts","What are Zambia's masked dancers called, who wear knitted costumes and painted masks?","Makishi","Zangbeto","Egungun","Gelede","Each Makishi mask is a different character. They dance to celebrate boys finishing a special coming-of-age camp."],["words","About how many local languages and dialects are spoken in Zambia?","More than 70","Only 2","About 5","About 15","English is used in schools and offices, while Bemba and Nyanja are heard most often on the streets."],["nature","Which bird soars above the coloured stripes on Zambia's flag?","African fish eagle","Crowned crane","Ostrich","Flamingo","Its loud, ringing cry is one of the best-known sounds of Africa's rivers and lakes."],["life","Zambia is one of the world's biggest producers of which metal?","Copper","Gold","Silver","Tin","The mines are in a region called the Copperbelt, and copper ends up in wires inside phones and computers."]],"ZW":[["food","Sadza is the main food of Zimbabwe. What is it made from?","Maize meal","Rice","Potatoes","Plantains","Sadza is stirred in a pot until thick, then eaten by hand with greens and a stew that people call relish."],["party","At a bira, an all-night Shona gathering in Zimbabwe, which instrument is played to honour the ancestors?","Mbira","Kora","Sitar","Bagpipes","Relatives sing, clap and dance until sunrise while the mbira's plucked metal keys ring out."],["arts","Which art from Zimbabwe, made by Shona artists, is shown in museums around the world?","Stone sculpture","Glass blowing","Paper folding","Ice carving","Artists carve smooth people, birds and animals from serpentine, a hard stone polished to a glassy shine."],["words","How do you say hello in Shona, a main language of Zimbabwe?","Mhoro","Jambo","Bonjour","Hola","Zimbabwe has 16 official languages, one of the highest numbers of any country in the world!"],["nature","Which red and yellow flower, shaped like flickering flames, is Zimbabwe's national flower?","Flame lily","Tulip","Lotus","Protea","Its petals curl backwards like a fire's flames, and it climbs by holding on with tendrils at the tips of its leaves."],["life","Zimbabwe is named after Great Zimbabwe. What is Great Zimbabwe?","An ancient stone city","A waterfall","A mountain","A river","Its tall walls were built from granite blocks with no cement at all, fitted together like a giant puzzle."]],"AF":[["food","Which Afghan national dish is rice cooked with lamb, carrots and raisins?","Kabuli pulao","Paella","Jollof rice","Nasi goreng","It is often served on a big shared platter at weddings and celebrations, topped with almonds and pistachios."],["party","Afghans celebrate Nowruz on the first day of spring. What does Nowruz mean?","New day","Big feast","Bright moon","Last snow","Relatives make haft mewa, a sweet treat of seven dried fruits and nuts soaked in water."],["arts","Which lute carved from a single piece of mulberry wood is Afghanistan's national instrument?","Rubab","Sitar","Banjo","Ukulele","Its body is covered with goatskin. UNESCO listed the art of making and playing the rubab in 2021."],["words","In Dari and Pashto, the main languages of Afghanistan, what word do people use to greet each other?","Salaam","Namaste","Ni hao","Konnichiwa","The full greeting means peace be with you, and people often place a hand on their heart as they say it."],["nature","Which wild sheep with huge curly horns lives high in Afghanistan's Wakhan mountains?","Marco Polo sheep","Bighorn sheep","Mouflon","Dall sheep","Its spiralling horns can grow over 1.5 metres long, the longest of any wild sheep on Earth."],["life","Which Afghan national sport has horse riders scrambling to grab a heavy goat hide and score with it?","Buzkashi","Polo","Kabaddi","Lacrosse","Buzkashi means goat grabbing. Its star riders, called chapandaz, train for years, and the horses are specially raised."]],"AM":[["food","Which thin flatbread, baked on the hot wall of a clay oven, is a symbol of Armenia?","Lavash","Pita","Tortilla","Injera","Lavash dough is rolled paper-thin and baked in a tonir oven in under a minute. UNESCO listed it in 2014."],["party","On Vardavar, a summer festival in Armenia, what do people playfully throw at each other?","Water","Coloured powder","Tomatoes","Flower petals","Kids wait with buckets and water pistols, and even strangers walking down the street get a happy soaking!"],["arts","Which Armenian wind instrument, carved from apricot wood, has a soft and mellow voice?","Duduk","Bagpipes","Didgeridoo","Saxophone","Duduk music is on UNESCO's list, and you can hear its haunting sound in many Hollywood film soundtracks."],["words","The Armenian alphabet was invented around the year 405. Who created it?","Mesrop Mashtots","Saint Patrick","Saint Nicholas","King Sejong","He first made 36 letters. In Yerevan, a museum called the Matenadaran guards thousands of old handwritten books."],["nature","What is the name of Armenia's big blue mountain lake, about 1,900 metres above sea level?","Lake Sevan","Lake Baikal","Lake Titicaca","Lake Geneva","It is Armenia's largest lake, and an old monastery called Sevanavank stands on a rocky peninsula above its shore."],["life","Armenia was the first country to make which game a school subject for young kids?","Chess","Checkers","Go","Dominoes","Since 2011 Armenian kids have had chess lessons in primary school, and Armenia has won the Chess Olympiad three times."]],"AZ":[["food","In Azerbaijan, tea is served in small glasses shaped like which fruit?","Pear","Apple","Banana","Lemon","These armudu glasses help keep tea hot, and people sip it with fruit jam or sugar cubes on the side."],["party","During Novruz in Azerbaijan, what do people grow on a plate to welcome the spring?","Wheat sprouts","Tulips","Mushrooms","Cactuses","People also jump over small bonfires, and kids leave hats at neighbours' doors to be filled with sweets."],["arts","Which style of music from Azerbaijan mixes poetry with long, swirling melodies played on the tar?","Mugham","Flamenco","Reggae","Fado","A mugham trio has a singer, the tar, a long-necked lute, and the kamancha, a fiddle played standing upright."],["words","Which alphabet does Azerbaijan use to write its language today?","Latin alphabet","Arabic script","Cyrillic","Georgian script","It has a special upside-down e, written like this: ə. You can spot it in the country's own name, Azərbaycan."],["nature","Azerbaijan's coast is on which body of water, the largest lake in the world?","Caspian Sea","Black Sea","Dead Sea","Lake Victoria","Even though it is a lake, it is called a sea because its water is a little salty. Seals even live in it!"],["life","Which three skyscrapers in Baku, shaped like fire, glow with moving lights at night?","Flame Towers","Petronas Towers","Burj Khalifa","Marina Bay Sands","At night thousands of LED lights cover them with dancing flames, and sometimes show Azerbaijan's flag."]],"BH":[["food","What is the name of Bahrain's national dish of spiced rice with chicken or fish?","Machboos","Paella","Risotto","Jollof rice","It is flavoured with dried black limes called loomi, which give it a tangy, smoky taste."],["party","On Gergaoun night in Bahrain, what do kids collect as they go door to door singing?","Sweets and nuts","Flowers","Painted eggs","Seashells","Children wear traditional clothes and carry cloth bags. It happens in the middle of the holy month of Ramadan."],["arts","Which traditional wooden sailing boats are still built by hand in Bahrain?","Dhows","Gondolas","Junks","Canoes","Builders shape the curved hulls by eye. Dhows once carried pearl divers out to the oyster beds."],["words","How do you say hello in Arabic, the language of Bahrain?","Marhaba","Shalom","Namaste","Ciao","Bahrain means two seas in Arabic. One story says it is because fresh water springs bubble up under the salty sea."],["nature","For thousands of years, divers in Bahrain searched the sea floor for which treasure?","Pearls","Amber","Gold nuggets","Sea glass","Divers held their breath and wore a clip on their nose. Bahrain's Pearling Path is now a UNESCO World Heritage site."],["life","Bahrain was the first Middle East country to host which motor race?","A Formula One Grand Prix","The Indianapolis 500","The Monte Carlo Rally","The 24 Hours of Le Mans","The first race was in 2004 at the Bahrain International Circuit, and today it runs at night under bright floodlights."]],"BD":[["food","Which silvery fish, often cooked in mustard sauce, is the national fish of Bangladesh?","Hilsa","Salmon","Tuna","Catfish","People say fish and rice make a Bengali. The hilsa swims up the rivers from the sea to lay its eggs."],["party","On Pohela Boishakh, the Bengali New Year, which two colours do many people in Bangladesh wear?","Red and white","Green and gold","Black and orange","Blue and silver","In Dhaka, crowds join a cheerful parade with giant masks of owls, tigers and fish, and eat rice with hilsa."],["arts","Which vehicles in Bangladesh are famous for their bright hand-painted pictures?","Rickshaws","Gondolas","Cable cars","Trams","Dhaka's rickshaws are painted with film stars, birds and flowers, and this art joined UNESCO's list in 2023."],["words","Which world day, held on 21 February, began with Bangladesh's love of its Bengali language?","International Mother Language Day","World Book Day","Earth Day","Children's Day","UNESCO made it a world day in 1999. In Bangladesh people lay flowers and sing songs in Bangla."],["nature","Which flower, floating on ponds, is the national flower of Bangladesh?","Water lily","Rose","Sunflower","Tulip","The white shapla blooms in ponds all over Bangladesh, and it sits in the middle of the national emblem."],["life","Which tag-and-tackle team sport, where raiders chant without taking a breath, is Bangladesh's national sport?","Kabaddi","Rugby","Lacrosse","Hockey","A raider dashes over the line, tags players and races back while chanting kabaddi, kabaddi in one long breath!"]],"BT":[["food","Bhutan's national dish, ema datshi, is a stew of cheese and what?","Chillies","Bananas","Carrots","Fish","In Bhutan chillies are eaten as a vegetable, not just a spice, and you often see them drying red on rooftops."],["party","At Bhutan's Tshechu festivals, what kind of dances do monks perform?","Masked dances","Tap dances","Line dances","Ballet","At dawn on the last day, a giant painted cloth called a thongdrel, as tall as a building, is unrolled on a wall."],["arts","What is the knee-length robe that men in Bhutan wear, tied with a belt?","Gho","Kimono","Poncho","Toga","Women wear an ankle-length dress called a kira, and both are worn to school and to work every day."],["words","Bhutan's national language is Dzongkha. What does its name mean?","Language of the fortress","Language of the dragon","Language of the sky","Language of the king","Dzongs are huge white fortresses that hold both monks and offices. People call Bhutan the Land of the Thunder Dragon."],["nature","Which odd-looking animal, like a mix of a goat and a moose, is Bhutan's national animal?","Takin","Yak","Red panda","Snow leopard","A legend says a holy man made the first takin by putting a goat's head on a cow's bones."],["life","What is the national sport of Bhutan, where players aim at targets about 145 metres away?","Archery","Darts","Football","Golf","Teams sing and dance when someone hits the target, and they playfully tease the other team to put them off!"]],"BN":[["food","Brunei's national dish, ambuyat, is a gooey paste made from which plant?","Sago palm","Rice","Wheat","Potato","People twirl it on a two-pronged bamboo fork called a candas, dip it in sour sauce and swallow it without chewing!"],["party","During Hari Raya in Brunei, which building opens its doors for anyone to visit for a few days?","The Sultan's palace","The national museum","The airport","The water village school","Istana Nurul Iman has about 1,700 rooms, and visitors queue up to greet the royal hosts and get a small gift."],["arts","What is Brunei's traditional cloth, woven with gold and silver threads, called?","Jong sarat","Kente","Tartan","Tweed","Weavers can take weeks to make one piece by hand, and it is worn as a sarong at weddings and special events."],["words","How do you say thank you in Malay, the main language of Brunei?","Terima kasih","Kop khun","Salamat","Cam on","It means receive love! Malay in Brunei can also be written in Jawi, a script based on Arabic letters."],["nature","Which monkey with a huge droopy nose lives in Brunei's mangrove forests?","Proboscis monkey","Mandrill","Snub-nosed monkey","Howler monkey","The males have the biggest noses, which make their honking calls louder. They are also great swimmers!"],["life","In Brunei's Ulu Temburong rainforest, what lets visitors walk high above the treetops?","A canopy walkway","A glass elevator","A hot air balloon","A monorail","The metal walkway climbs about 50 metres up, so you can watch the sun rise over the misty jungle."]],"KH":[["food","Which Cambodian dish of fish in a creamy curry is steamed in a banana leaf cup?","Fish amok","Pad thai","Pho","Laksa","A paste called kroeung, made of lemongrass, turmeric and galangal, gives it a yellow colour and fresh smell."],["party","During Bon Om Touk, Cambodia's Water Festival, what races on the river in Phnom Penh?","Long rowing boats","Jet skis","Tyre rafts","Surfers","Each boat can hold dozens of rowers, and the festival comes as the Tonle Sap river turns to flow the other way."],["arts","Which graceful Cambodian dance, where dancers bend their fingers far backwards, comes from Angkor's carvings?","Apsara dance","Hula","Flamenco","Tango","Dancers wear golden crowns and shiny silk, and they are often sewn into their costumes before each show."],["words","Cambodia's Khmer alphabet holds which record?","Most letters of any alphabet","Oldest alphabet","Fewest letters","Written in circles","Guinness World Records says it has 74 letters. Khmer writing has no spaces between words, only between phrases."],["nature","Which rare dolphin with a round head and no beak lives in the Mekong River in Cambodia?","Irrawaddy dolphin","Bottlenose dolphin","Pink river dolphin","Orca","Near the town of Kratie, visitors take boats to spot them puffing and splashing as they come up to breathe."],["life","In Battambang, Cambodia, what can visitors ride along old railway tracks?","A bamboo train","A steam train","A monorail","A horse tram","The norry is a bamboo platform on wheels with a small motor. If two meet, one is lifted off the tracks!"]],"CN":[["food","Which half-moon dumplings do people in northern China make together for Chinese New Year?","Jiaozi","Pierogi","Empanadas","Samosas","They are shaped like old gold coins to bring luck, and sometimes a real coin is hidden inside one!"],["party","During China's Mid-Autumn Festival, what round treats do people share while admiring the full moon?","Mooncakes","Fortune cookies","Doughnuts","Macarons","They are filled with sweet lotus paste or red beans, and some hide a salty egg yolk inside, like a little moon."],["arts","Which Chinese art uses scissors to cut red paper into lacy pictures for windows?","Paper cutting","Origami","Batik","Mosaic","Red stands for luck in China, and paper cuts of animals and the character for happiness decorate windows at New Year."],["words","About how many characters do you need to know to read a Chinese newspaper?","About 3,000","26","About 300","About 500,000","Chinese has no alphabet. Each character stands for a word or idea, and there are tens of thousands in all."],["nature","Which river, the longest in Asia, flows across China to the sea at Shanghai?","Yangtze","Danube","Ganges","Nile","It is over 6,300 kilometres long and home to the Yangtze finless porpoise, which looks like it is smiling."],["life","Which of these was invented in ancient China?","Paper","Telephone","Light bulb","Steam engine","Around 2,000 years ago, an official named Cai Lun made paper from tree bark, old rags and fishing nets."]],"GE":[["food","Which juicy Georgian dumplings are eaten by holding the twisted knob at the top?","Khinkali","Pierogi","Gyoza","Ravioli","Take a small bite, slurp the hot soup inside, then eat the rest. The doughy top knob is left on the plate!"],["party","At a Georgian feast called a supra, who leads the toasts and speeches?","The tamada","The chef","The youngest child","The mayor","A supra can last for hours. The tamada makes speeches about friendship and peace, and guests often burst into song."],["arts","Georgia is famous for which singing, where several voices sing different tunes at the same time?","Polyphonic singing","Yodelling","Throat singing","Rapping","A Georgian song called Chakrulo was sent into space on the Voyager Golden Record in 1977!"],["words","How do people in Georgia say hello?","Gamarjoba","Privet","Merhaba","Barev","Gamarjoba means may you be victorious! The reply, gagimarjos, means may you be victorious too."],["nature","Which mountain range runs along Georgia's northern border?","Caucasus","Alps","Andes","Himalayas","Its peaks top 5,000 metres, and Ushguli, with its old stone towers, is one of Europe's highest villages lived in all year."],["life","Georgia's old village ball game, lelo burti, is a lot like which sport Georgians love today?","Rugby","Baseball","Tennis","Golf","In lelo, whole villages push a heavy ball to their side of a stream. Georgia's rugby team is nicknamed the Lelos!"]],"IN":[["food","Which thin, crispy pancake from south India is made from rice and lentil batter?","Dosa","Crepe","Tortilla","Injera","A paper dosa can be longer than your arm! It comes with coconut chutney and a lentil soup called sambar."],["party","During Holi, the festival of colours, what do people in India throw at each other?","Coloured powder","Tomatoes","Snowballs","Feathers","Holi welcomes spring. People also dance, eat sweets like gujiya, and squirt coloured water from pichkaris."],["arts","What are the colourful patterns made on floors from coloured powder, rice or flowers in India?","Rangoli","Mosaic","Origami","Batik","People draw rangoli at doorways to welcome guests and good luck, especially for Diwali, the festival of lights."],["words","Which English word comes from the Hindi word champo, meaning to press or massage?","Shampoo","Soap","Towel","Bubble","Lots of English words come from India, including jungle, bungalow and bandana!"],["nature","Which bird, famous for its shimmering fan of tail feathers, is India's national bird?","Peacock","Flamingo","Parrot","Swan","Only the males have the big tail. They shake it to make a rustling sound when they show off."],["life","Which board game began in India long ago as Moksha Patam, teaching that good deeds lift you up?","Snakes and ladders","Monopoly","Checkers","Scrabble","Ladders stood for kindness and good deeds, while snakes stood for bad habits that pulled players back down."]],"ID":[["food","Which food, made of soybeans pressed into a firm cake, was invented in Indonesia?","Tempeh","Tofu","Natto","Hummus","Tempeh comes from Java. A friendly mould grows around cooked soybeans and binds them into a nutty cake."],["party","On Nyepi in Bali, Indonesia, what does almost everyone do for a whole day?","Stay quiet at home","Have water fights","Fly kites","Dance in the streets","Even the airport closes! The night before, people parade giant monster statues called ogoh-ogoh."],["arts","Which Indonesian orchestra is made mostly of bronze gongs and metal xylophones?","Gamelan","Mariachi","Steel band","Brass band","Gamelan players sit on the floor, and nobody steps over the instruments, as a sign of respect."],["words","About how many languages are spoken in Indonesia?","More than 700","About 10","About 50","About 200","Bahasa Indonesia is shared by everyone, and lots of people also speak a local language at home, like Javanese."],["nature","Which giant flower in Indonesia's rainforests is the biggest single flower on Earth?","Rafflesia","Sunflower","Lotus","Orchid","It can be about a metre wide and smells like rotten meat, which attracts the flies that help it make seeds."],["life","Which huge temple on the island of Java is the largest Buddhist temple in the world?","Borobudur","Prambanan","Wat Arun","Potala Palace","It has 504 Buddha statues and over 2,600 carved stone panels that tell stories as you climb to the top."]],"IR":[["food","Iran grows most of the world's supply of which red spice, picked from crocus flowers?","Saffron","Paprika","Cinnamon","Turmeric","Each flower has only three red threads, picked by hand. Iranians use saffron to turn rice a bright golden colour."],["party","On Yalda Night, the longest night of the year, which fruits do people in Iran eat?","Watermelon and pomegranate","Apples and pears","Bananas and mangoes","Grapes and figs","Relatives stay up late together, telling stories and reading poems by the poet Hafez until after midnight."],["arts","Which long Persian poem by Ferdowsi tells tales of heroes like Rostam?","Shahnameh","The Odyssey","Mahabharata","Beowulf","It has about 50,000 couplets and took Ferdowsi around 30 years to write. Rostam's loyal horse is named Rakhsh."],["words","Which of these English words comes from Persian?","Bazaar","Kindergarten","Tsunami","Igloo","Persian also gave English caravan, checkmate and paradise, which first meant a walled garden."],["nature","Iran is the last home in Asia of which rare big cat?","Asiatic cheetah","Bengal tiger","Jaguar","Clouded leopard","Iran's cheetahs live in dry deserts and hills, and one even appeared on the shirts of Iran's football team in 2014."],["life","Which sport, played on horseback with mallets and a ball, began in ancient Persia?","Polo","Lacrosse","Croquet","Cricket","Isfahan's huge Naqsh-e Jahan Square was once a polo field, and its old stone goalposts still stand there."]],"IQ":[["food","Which Iraqi dish is a whole fish, split open and slowly grilled beside a wood fire?","Masgouf","Fish and chips","Sushi","Ceviche","Masgouf is usually made with carp. It is a favourite along the Tigris River in Baghdad, served with bread and lemon."],["party","Which date-filled cookies do people in Iraq bake to celebrate Eid?","Kleicha","Macarons","Gingerbread","Fortune cookies","Kleicha are shaped like little rolls or crescents and flavoured with cardamom. Many call them Iraq's national cookie."],["arts","Which pear-shaped stringed instrument with no frets is loved in Iraqi music?","Oud","Banjo","Harp","Ukulele","Its name means wood in Arabic. The European lute grew from the oud, and Iraqi oud players are famous worldwide."],["words","Which school subject's name comes from a book written in Baghdad over 1,000 years ago?","Algebra","Geometry","Biology","History","The scholar al-Khwarizmi worked at Baghdad's House of Wisdom. His name also gave us the word algorithm!"],["nature","Which two great rivers flow through Iraq?","Tigris and Euphrates","Nile and Congo","Ganges and Indus","Volga and Don","The land between them is called Mesopotamia, meaning between rivers, and in the south they form huge marshes."],["life","What is the giant stepped temple, over 4,000 years old, in the ancient city of Ur in Iraq called?","Ziggurat","Pagoda","Castle","Colosseum","It was built from mud bricks, and its huge staircases led up to a shrine for the moon god Nanna."]],"IL":[["food","Which peanut-flavoured puffed corn snack is a favourite of kids in Israel?","Bamba","Doritos","Cheetos","Pringles","Bamba has been made since 1964, and many babies in Israel munch it as one of their very first snacks."],["party","During Hanukkah in Israel, which jam-filled treat is sold in bakeries everywhere?","Jam doughnuts","Chocolate eggs","Mooncakes","Candy canes","Fried foods remember the Hanukkah story of oil that lasted eight days. Kids also spin a top called a dreidel."],["arts","Which lively circle dance is danced at Israeli celebrations, with everyone holding hands?","Hora","Tango","Waltz","Salsa","At weddings, dancers often lift the bride and groom high up on chairs in the middle of the circle!"],["words","Which Hebrew word means hello, goodbye and peace all at once?","Shalom","Ciao","Namaste","Aloha","Hebrew is read from right to left. It became an everyday spoken language again in the last 150 years."],["nature","About how many birds fly over Israel each year on their long migrations?","Around 500 million","About 1,000","About 50,000","About 1 million","Israel is on a bird highway between Europe and Africa, and thousands of cranes spend the winter in the Hula Valley."],["life","Which way of watering crops, drop by drop through thin pipes, was developed in Israel?","Drip irrigation","Sprinklers","Hosepipes","Water wheels","Farmers use it to grow food in the desert, saving lots of water by giving each plant only what it needs."]],"JP":[["food","What are Japan's rice balls, often wrapped in seaweed and packed for lunch, called?","Onigiri","Tempura","Dim sum","Arancini","Onigiri often hide a filling like salmon or pickled plum, and they are sold in every convenience store."],["party","What is hanami, a much-loved tradition in Japan each spring?","Picnics under cherry blossoms","Building snow sculptures","Floating paper lanterns","Throwing beans","Weather reports track the cherry blossom front as it moves north across Japan, so people can plan their picnic."],["arts","Which Japanese art folds a single square of paper into shapes like cranes?","Origami","Calligraphy","Ikebana","Bonsai","A legend says folding 1,000 paper cranes grants a wish, and strings of them are given as good luck gifts."],["words","How many different scripts are used together to write Japanese?","Three","One","Two","Five","Hiragana and katakana are sound symbols, and kanji are characters from China. Kids learn over 1,000 kanji at school."],["nature","Which animals in Japan are famous for soaking in steamy hot springs in winter?","Snow monkeys","Sika deer","Red foxes","Brown bears","At Jigokudani, Japanese macaques warm up in the pools. No other monkey lives farther north."],["life","Which quick meal was invented in Japan by Momofuku Ando in 1958?","Instant noodles","Hot dogs","Sandwiches","Cornflakes","He worked in a little shed behind his house. Later he also invented Cup Noodles, made just by adding hot water."]],"JO":[["food","What is Jordan's national dish of lamb cooked in a tangy dried-yogurt sauce, served on rice?","Mansaf","Kebab","Moussaka","Biryani","It is served on a giant platter, and traditionally people stand around it and eat using their right hand."],["party","Jordan's summer Jerash Festival puts on music and dance shows in what kind of place?","Ancient Roman ruins","A football stadium","An ice rink","A shopping mall","Singers perform in a Roman theatre nearly 2,000 years old, and the stone streets still have grooves from old carts."],["arts","Which craft from Jordan fills glass bottles with layers of coloured sand to make pictures?","Sand bottle art","Stained glass","Snow globes","Glass blowing","Artists use thin sticks to push natural coloured sand into camels and desert scenes, with no glue at all."],["words","What do Jordanians say in Arabic to welcome guests?","Ahlan wa sahlan","Bienvenue","Karibu","Willkommen","It is said with a smile, often with a tiny cup of Arabic coffee flavoured with cardamom."],["nature","Which dark purple flower is Jordan's national flower?","Black iris","Red rose","Lotus","Tulip","It blooms for only a short time in spring, and its petals are so dark they look almost black."],["life","Jordan's shore of the Dead Sea holds which Earth record?","Lowest land on Earth","Hottest place","Windiest place","Highest waterfall","It is over 400 metres below sea level, and its mud is so full of minerals that people coat themselves in it."]],"KZ":[["food","Kazakhstan's national dish beshbarmak gets its name from how it is eaten. What does it mean?","Five fingers","Big pot","Hot soup","Horse rider","It is flat noodles with boiled meat and onions, eaten by hand from a big shared dish."],["party","In the Kazakh tradition of tusau kesu, what is celebrated?","A baby's first steps","A first tooth","Starting school","A wedding","A cord is tied around the baby's legs, and a respected guest cuts it so the child will walk through life with ease."],["arts","Which two-stringed instrument with a long neck is Kazakhstan's national instrument?","Dombra","Sitar","Banjo","Balalaika","Musicians play kuy, tunes that tell stories without words, like a galloping horse or a flying swan."],["words","Kazakhstan is changing how it writes Kazakh. Which alphabet is it switching to?","Latin","Arabic","Greek","Chinese characters","Kazakh has been written with Arabic and Cyrillic letters in the past, and the switch is happening step by step."],["nature","Which antelope with a big, floppy, bouncy nose roams Kazakhstan's grasslands?","Saiga","Impala","Gazelle","Springbok","Its strange nose warms cold air in winter and filters out dust in summer. Their numbers have grown a lot again."],["life","Which space first happened from Baikonur in Kazakhstan in 1961?","First human in space","First Moon landing","First space station","First Mars rover","Yuri Gagarin blasted off from Baikonur, and rockets still carry astronauts to the space station from there."]],"KW":[["food","Which flat silvery fish, called zubaidi, is a favourite food in Kuwait?","Pomfret","Salmon","Cod","Trout","Zubaidi is often fried until crispy or served with spiced rice, and it is caught in the Gulf waters near Kuwait."],["party","During Kuwait's national celebrations each February, what do people playfully spray in the streets?","Foam","Coloured powder","Tomato juice","Rice","Streets fill with flags, fireworks and cars decorated in green, white, red and black, the colours of Kuwait's flag."],["arts","Which Bedouin weaving from Kuwait uses camel and goat hair in bold red and black patterns?","Sadu","Tartan","Kente","Batik","Bedouin women wove sadu on simple ground looms to make tents, rugs and cushions, with patterns showing desert life."],["words","In Kuwait, what is a diwaniya?","A room for meeting guests","A sweet pastry","A sailing boat","A desert storm","Men gather in the diwaniya in the evening to drink tea and chat. It is a big part of everyday life in Kuwait."],["nature","After winter rains in Kuwait, people search the desert sand for which prized treat?","Desert truffles","Wild strawberries","Birds' eggs","Seashells","Desert truffles grow hidden under the sand, and people find them by looking for small cracks."],["life","Kuwait's money holds which world record?","Most valuable currency unit","Oldest coins","Smallest coins","First plastic notes","One Kuwaiti dinar is worth more than three US dollars, and it is split into 1,000 smaller coins called fils."]],"KG":[["food","Which puffy pieces of fried dough are served at almost every celebration in Kyrgyzstan?","Boorsok","Churros","Beignets","Mandazi","Boorsok are piled onto the dastorkon, a cloth spread with food for guests, along with tea, jam and nuts."],["party","Which big international festival of horse sports and nomad games did Kyrgyzstan start in 2014?","World Nomad Games","Commonwealth Games","Highland Games","Olympic Games","Athletes compete in horseback games, eagle hunting and wrestling on horses, while visitors stay in yurt villages."],["arts","What is the name of the giant Kyrgyz epic poem about a hero, sung from memory?","Manas","Shahnameh","The Odyssey","Beowulf","Singers called manaschi can perform it for hours, and it is far longer than the Iliad and the Odyssey put together."],["words","Which alphabet is used to write the Kyrgyz language today?","Cyrillic","Latin","Arabic","Georgian","Kyrgyz is a Turkic language, a cousin of Kazakh and Turkish, and many people in Kyrgyzstan also speak Russian."],["nature","Which big cat with a long thick tail lives in Kyrgyzstan's Tian Shan mountains?","Snow leopard","Cheetah","Jaguar","Lion","It wraps its long fluffy tail around its face like a scarf to keep warm while it sleeps in the snow."],["life","In Kyrgyzstan, hunters called berkutchi train which large bird to hunt foxes?","Golden eagle","Owl","Vulture","Pelican","Each eagle lives with its trainer for years, and a golden eagle's wings can stretch more than two metres wide."]],"LA":[["food","Which kind of rice do people in Laos eat more of than anyone else in the world?","Sticky rice","Brown rice","Wild rice","Basmati rice","It is kept warm in little woven baskets called tip khao, and people roll it into balls with their fingers."],["party","At Boun Bang Fai in Laos, what do villagers launch into the sky to call for rain?","Homemade rockets","Paper lanterns","Kites","Balloons","The bamboo rockets are decorated and paraded with music and dancing before they whoosh into the air."],["arts","Which Lao instrument is made of bamboo pipes and sounds a bit like a harmonica?","Khene","Bagpipes","Didgeridoo","Panpipes","The khene has pipes tied in two rows, and players breathe in and out to make its bright, buzzing sound."],["words","How do people say hello in Laos?","Sabaidee","Sawasdee","Xin chao","Ni hao","Lao people often say it with a nop, pressing their palms together and giving a small bow."],["nature","Laos was once the kingdom of Lan Xang. What does that name mean?","Land of a Million Elephants","Land of Golden Rice","Land of Tall Mountains","Land of Smiles","Wild Asian elephants still roam Laos, and elephants appear on many temples and in old Lao art."],["life","Which golden stupa in Vientiane is a national symbol shown on the emblem of Laos?","Pha That Luang","Shwedagon Pagoda","Wat Arun","Angkor Wat","Its name means Great Stupa, and every November it hosts a big festival with candlelit processions."]],"LB":[["food","Which parsley salad with bulgur wheat, tomato and mint is a favourite in Lebanon?","Tabbouleh","Tzatziki","Couscous","Shakshuka","Lebanon even has a National Tabbouleh Day each July, and people often scoop it up with crisp lettuce leaves."],["party","Which summer festival in Lebanon puts on concerts inside giant ancient Roman temples?","Baalbek Festival","Jerash Festival","Carthage Festival","Edinburgh Festival","It began in 1956. Singers and dancers perform at night with huge temple columns lit up behind them."],["arts","Which line dance, with lots of stamping feet, is danced at Lebanese weddings?","Dabke","Sirtaki","Flamenco","Hora","Dancers hold hands or shoulders in a row, and the leader at the front twirls a handkerchief in the air."],["words","Many people in Lebanon mix three languages in one greeting. Which three?","Arabic, French, English","Arabic, Turkish, English","Arabic, Spanish, French","Persian, French, English","A famous Lebanese hello is Hi, kifak, ça va? It uses English, Arabic and French all in one go!"],["nature","Which huge cave in Lebanon do visitors explore partly by boat on an underground river?","Jeita Grotto","Postojna Cave","Waitomo Caves","Son Doong Cave","Its upper cave holds one of the longest stalactites in the world, more than 8 metres long!"],["life","What did the ancient Phoenicians of Lebanon's coast spread around the Mediterranean Sea?","An alphabet","Paper","The wheel","Gunpowder","The Phoenician alphabet had 22 letters, and it is an ancestor of the Greek and Latin letters you read today."]],"MY":[["food","Which dish of rice cooked in coconut milk, with spicy sambal, is a favourite breakfast in Malaysia?","Nasi lemak","Jollof rice","Biryani","Bibimbap","It is often wrapped in a banana leaf and comes with crunchy fried anchovies, peanuts and a boiled egg."],["party","Which Hindu festival sees huge crowds climb 272 steps up to Malaysia's Batu Caves?","Thaipusam","Holi","Onam","Navratri","Many pilgrims carry pots of milk up the steps, past a giant golden statue of Lord Murugan at the bottom."],["arts","What is the wau, a traditional craft from Malaysia's east coast?","A decorated kite","A wooden drum","A silk scarf","A shadow puppet","The famous wau bulan, or moon kite, has a crescent-shaped tail and is painted with bright flower patterns."],["words","How do you say thank you in Malay?","Terima kasih","Arigato","Xie xie","Salamat","Word for word it means I receive your kindness: terima means receive and kasih means love or kindness."],["nature","Which striped big cat is Malaysia's national animal and appears on its coat of arms?","Malayan tiger","Snow leopard","Lion","Cheetah","Two tigers hold up Malaysia's coat of arms, and the national football team is nicknamed Harimau Malaya."],["life","Which sport played in Malaysia is like volleyball, but players use their feet, knees and head?","Sepak takraw","Kabaddi","Hurling","Jai alai","The ball was first woven from rattan, and players do amazing flying kicks high above the net to score."]],"MV":[["food","Which Maldives breakfast mixes shredded tuna, grated coconut, onion and chilli?","Mas huni","Poke","Ceviche","Sashimi","It is eaten with roshi, a thin flatbread, and a cup of sweet tea. Tuna is the best-loved fish in the Maldives."],["party","In the Maldives, Eid al-Adha has a local name meaning big Eid. What is it?","Bodu Eid","Kuda Eid","Hari Raya","Bayram","Bodu means big in Dhivehi. People dress up, visit neighbours, play games and share sweet treats and feasts."],["arts","What is bodu beru, a famous kind of music from the Maldives?","Big drum music","Steel pan music","Bagpipe music","Flute music","Drums carved from coconut tree wood beat faster and faster while singers chant and dancers sway and leap."],["words","The Dhivehi language of the Maldives is written in which script?","Thaana","Devanagari","Hangul","Cyrillic","Thaana is written from right to left, and some of its first letters came from the shapes of Arabic numbers!"],["nature","Which gentle giant, the biggest fish in the world, swims all year round off the Maldives?","Whale shark","Great white shark","Manta ray","Hammerhead shark","Whale sharks eat tiny plankton, and each one has its own pattern of spots, just like a fingerprint."],["life","What is a dhoni, seen all over the Maldives?","A wooden boat","A fishing net","A straw house","A coconut drink","Dhonis were once sailboats built from coconut wood. Today many have motors and carry people between islands."]],"MN":[["food","Which steamed dumplings filled with mutton are a favourite festive food in Mongolia?","Buuz","Pierogi","Gyoza","Ravioli","For Lunar New Year, relatives may fold hundreds or even thousands of buuz together, ready for visitors."],["party","What is Mongolia's Lunar New Year festival called?","Tsagaan Sar","Songkran","Nowruz","Tet","Its name means White Moon. Younger people greet elders by gently holding them up under their arms."],["arts","What is Mongolian khoomei, a famous kind of music?","Throat singing","Yodelling","Beatboxing","Opera singing","Singers make two notes at once, a deep hum and a high whistle, a bit like wind blowing across the grasslands."],["words","Traditional Mongolian script is special because it is written in which direction?","Top to bottom","Right to left","Bottom to top","Left to right","Most Mongolians now use Cyrillic letters, but the old up-and-down script is on banknotes and taught in schools."],["nature","In the 1920s, explorers made which famous find in Mongolia's Gobi Desert?","Dinosaur eggs","Mammoth bones","A lost city","Giant crystals","Roy Chapman Andrews found the first nests of dinosaur eggs known to science at a place called the Flaming Cliffs."],["life","What do people in Mongolia call their round felt tent home?","Ger","Igloo","Tipi","Wigwam","A ger's door usually faces south, and a stove sits right in the middle to keep everyone warm in winter."]],"MM":[["food","Which fish noodle soup is often called the national dish of Myanmar?","Mohinga","Pho","Laksa","Ramen","It is usually eaten for breakfast, and it is made with rice noodles, fish broth and the soft heart of a banana tree stem!"],["party","What is Myanmar's New Year water festival in April called?","Thingyan","Songkran","Holi","Diwali","For several days people splash water on each other, which is meant to wash away the old year's bad luck."],["arts","What is the longyi, worn by both men and women in Myanmar?","A long wrap skirt","A wide straw hat","A silk jacket","A beaded necklace","Men usually tie theirs with a knot at the front, while women tuck theirs in neatly at the side."],["words","How do people in Myanmar say hello in Burmese?","Mingalaba","Sawasdee","Namaste","Konnichiwa","Burmese letters are made of round circles, partly because straight lines could tear the palm leaves people once wrote on."],["nature","Which dolphin, named after a river in Myanmar, helps some fishermen catch fish?","Irrawaddy dolphin","Amazon river dolphin","Bottlenose dolphin","Ganges river dolphin","Fishermen tap their boats, and the dolphins herd fish towards the nets, then gobble up the ones that escape."],["life","In chinlone, a game from Myanmar, players keep a woven cane ball in the air using what?","Feet, knees and head","Only their hands","Wooden bats","Long sticks","There is no other team to beat. Players stand in a circle and try to pass the ball as beautifully as they can."]],"NP":[["food","Which steamed dumplings are the most popular snack in Nepal?","Momo","Dim sum","Gyoza","Pierogi","Momos are dipped in a spicy tomato sauce called achar, and you can find them on almost every street corner."],["party","During which Nepali festival are dogs given flower garlands and tasty treats?","Tihar","Holi","Losar","Teej","Tihar lasts five days. Crows, dogs and cows each get their own special day, and homes glow with oil lamps."],["arts","What is the madal, heard in Nepali folk music?","A hand drum","A bamboo flute","A stringed lute","A brass horn","The madal is a barrel-shaped drum played on both ends, and it keeps the beat for lively Nepali folk dances."],["words","How do people in Nepal say hello while pressing their palms together?","Namaste","Mingalaba","Salam","Sawasdee","It roughly means I bow to you, and you can use it to say both hello and goodbye."],["nature","What do people in Nepal call Mount Everest?","Sagarmatha","Annapurna","Kanchenjunga","Dhaulagiri","Sagarmatha is often explained as forehead of the sky. At 8,849 metres, Everest is the highest point on Earth."],["life","Which famous teacher was born in Lumbini, in Nepal, about 2,500 years ago?","The Buddha","Confucius","Socrates","Laozi","A temple marks the spot, and pilgrims from all over the world visit the peaceful gardens around it."]],"KP":[["food","Which dish of cold buckwheat noodles in icy broth is the most famous food of Pyongyang?","Naengmyeon","Ramen","Pho","Udon","The noodles are long and chewy. In Korea, long noodles are a wish for a long life, so people try not to cut them!"],["party","Which autumn harvest festival do people in North Korea celebrate under the full moon?","Chuseok","Songkran","Diwali","Thanksgiving","Relatives share songpyeon, little half-moon rice cakes that are steamed on a bed of pine needles."],["arts","Which very old folk song is loved by Korean people in both the north and the south?","Arirang","Sakura Sakura","Jasmine Flower","Greensleeves","There are thousands of versions of Arirang, and the song is named after a mountain pass."],["words","How many basic letters does the Korean alphabet used in North Korea have?","24","26","33","46","There are 14 consonants and 10 vowels, which are stacked together into neat square blocks, one per syllable."],["nature","Which white flower is the national flower of North Korea?","Magnolia","Lotus","Hibiscus","Cherry blossom","This mountain magnolia has white petals around a bright red centre, and it smells sweet in early summer."],["life","What is ssireum, a traditional sport in North Korea?","Korean wrestling","Horseback archery","Kite flying","Stick fighting","Wrestlers grab a cloth band tied around each other's waist and thigh. Winners were once given a bull as a prize!"]],"OM":[["food","Which Omani feast dish is meat wrapped in leaves and cooked in an underground pit for up to two days?","Shuwa","Kebab","Tagine","Mansaf","Shuwa is made for Eid. Whole villages bring their wrapped meat to cook in the same big sand oven."],["party","When guests visit a home in Oman, they are usually welcomed with dates and what?","Spiced coffee","Mint tea","Hot chocolate","Mango juice","Omani coffee, called kahwa, is flavoured with cardamom. Gently shake your little cup to say no more, thanks!"],["arts","What is the kumma, worn by many men in Oman?","An embroidered cap","A woven belt","A silk scarf","A leather sandal","Each kumma is stitched by hand with colourful patterns, and it is worn with a long robe called a dishdasha."],["words","How do you say thank you in Arabic, the language of Oman?","Shukran","Asante","Grazie","Spasibo","Arabic is written from right to left, and most of its letters join up like flowing handwriting."],["nature","At Ras al Jinz in Oman, visitors can watch which animals lay eggs on the beach at night?","Green turtles","Crocodiles","Penguins","Flamingos","Thousands of turtle mums dig nests there each year, and tiny hatchlings scurry down to the sea."],["life","What are Oman's aflaj, some of them over 1,000 years old?","Water channels","Mountain roads","Sand forts","Camel markets","Aflaj carry water from springs to farms. Villagers take turns using it, timed by sundials and the stars."]],"PK":[["food","Which slow-cooked beef stew, first eaten for breakfast, is a favourite in Pakistan?","Nihari","Goulash","Tagine","Rendang","Its name comes from the Arabic word nahar, meaning morning, and it simmers gently all night long."],["party","On Chaand Raat, the night before Eid in Pakistan, what do girls put on their hands?","Henna patterns","Gold paint","Flower petals","Chalk drawings","Chaand Raat means night of the moon. Markets stay open late selling glass bangles in every colour."],["arts","Pakistan is famous for brightly painted what, covered with flowers, birds and tiny mirrors?","Trucks","Canal boats","Trams","Kites","Many of these trucks also have jingling chains and bells hanging at the bottom, so you can hear them coming!"],["words","How do you say thank you in Urdu, Pakistan's national language?","Shukriya","Asante","Arigato","Spasibo","Urdu is written right to left in a flowing, slanting style of handwriting called Nastaliq."],["nature","Which wild goat with twisting corkscrew horns is Pakistan's national animal?","Markhor","Ibex","Yak","Chamois","It lives high in the mountains, and the male's spiral horns can grow longer than a child's arm!"],["life","Which racket sport did Pakistan's Jahangir Khan play, winning 555 matches in a row?","Squash","Tennis","Badminton","Table tennis","His winning streak lasted over five years, from 1981 to 1986, one of the longest in any sport."]],"PS":[["food","Which Palestinian rice dish is flipped upside down onto a big plate before serving?","Maqluba","Paella","Biryani","Kabsa","Maqluba means upside down. Everyone gathers round to watch, hoping the tower comes out in one piece!"],["party","Each autumn, many Palestinian relatives gather together to pick which crop?","Olives","Apples","Cherries","Coffee beans","Some olive trees there are hundreds of years old, and the fresh golden oil is used in cooking all year."],["arts","What is tatreez, a traditional Palestinian art?","Cross-stitch embroidery","Mosaic tiling","Pottery painting","Basket weaving","The patterns on a dress could show which village a woman came from, with cypress trees, stars and flowers."],["words","What does the Arabic word sahtein, said at Palestinian meals, mean?","Enjoy your meal","Good morning","See you soon","Happy birthday","Sahtein means two healths. A polite reply is ala qalbak, which means and to your heart!"],["nature","Which tiny, shimmering bird is the national bird of Palestine?","Palestine sunbird","Hummingbird","Kingfisher","Bee-eater","Males shine blue, green and purple, and they sip nectar from flowers with their long curved beaks."],["life","Which city in Palestine is famous for its hand-blown blue glass?","Hebron","Nablus","Bethlehem","Jenin","Glassmakers there have blown glass by hand for centuries, shaping glowing hot glass in big furnaces."]],"PH":[["food","Which dish of meat stewed in vinegar, soy sauce, garlic and bay leaves is a Filipino favourite?","Adobo","Rendang","Teriyaki","Vindaloo","The vinegar helped keep food fresh in the hot weather, and every home has its own adobo recipe."],["party","The Philippines has one of the longest Christmas seasons. In which month do carols often begin?","September","June","November","December","Homes hang glowing star lanterns called parol, and the fun lasts until early January."],["arts","Which Filipino dance has dancers hopping between two bamboo poles as they clap together?","Tinikling","Flamenco","Hula","Dabke","It copies the tikling bird stepping between rice stalks. The poles clap faster and faster as the music speeds up!"],["words","How do you say thank you in Filipino?","Salamat","Terima kasih","Arigato","Kamsahamnida","Filipinos add po to be extra polite to older people, so salamat po is a very respectful thank you."],["nature","Which huge bird of prey is the national bird of the Philippines?","Philippine eagle","Bald eagle","Harpy eagle","Golden eagle","It is one of the biggest eagles in the world, with a shaggy crest of feathers like a lion's mane."],["life","What are the brightly decorated jeepneys of the Philippines?","Shared minibuses","Fishing boats","Street food carts","Paper kites","The first jeepneys were made from old jeeps, then painted with bright colours, shiny horses and names."]],"QA":[["food","Which spiced rice dish with meat or fish is Qatar's national dish?","Machboos","Paella","Risotto","Jambalaya","It gets a tangy flavour from loomi, small limes that are dried in the sun until they turn black."],["party","During Garangao in Qatar, children go door to door collecting what?","Sweets and nuts","Painted eggs","Flower garlands","Toy boats","It happens in the middle of Ramadan. Kids wear traditional clothes and sing a special Garangao song."],["arts","Which traditional Qatari dance has men in two rows chanting poetry to the beat of big drums?","Al Ardah","Dabke","Tinikling","Haka","It is performed on Qatar National Day and at weddings, with drums, tambourines and swords held high."],["words","In Qatar, what does the Arabic greeting as-salamu alaykum mean?","Peace be upon you","Good morning","Welcome home","Happy holiday","The usual reply is wa alaykum as-salam, which means and upon you be peace."],["nature","Which white antelope with long straight horns is Qatar's national animal?","Arabian oryx","Impala","Springbok","Gazelle","Its white coat reflects the hot sun, and the Qatar Airways logo shows an oryx in purple."],["life","Before oil was found, many people in Qatar earned a living by diving for what?","Pearls","Sponges","Gold","Coral","Divers held their breath for over a minute, with a clip on their nose, to gather oysters from the seabed."]],"SA":[["food","Which spiced rice dish with chicken or lamb is the national dish of Saudi Arabia?","Kabsa","Jollof rice","Paella","Nasi goreng","Kabsa is often served on one huge platter, and guests sit around it on the floor to share."],["party","Saudi Arabia holds a huge festival where camels compete in what kind of contest?","A beauty contest","A jumping contest","A dancing contest","A swimming contest","Judges look at the shape of the lips, the hump and the neck. The most beautiful camels win big prizes!"],["arts","In Saudi Arabia's Asir region, women paint bright patterns on what?","Walls inside homes","Their camels","Pottery jars","Fishing boats","This art is called al-qatt al-asiri. Bold stripes and triangles in red, yellow and green cover whole rooms."],["words","How do you say hello in Arabic, the language of Saudi Arabia?","Marhaba","Namaste","Jambo","Hola","Arabic has 28 letters, and most of them change shape depending on where they sit in a word."],["nature","The mountain city of Taif in Saudi Arabia is famous for growing which flowers?","Roses","Tulips","Orchids","Sunflowers","Each spring, millions of pink roses are picked by hand and turned into sweet-smelling rose oil and rose water."],["life","Hegra, Saudi Arabia's first World Heritage Site, was built by the same people as which famous city?","Petra","Babylon","Troy","Pompeii","The Nabataeans carved more than 100 grand tombs with fancy doorways straight into golden sandstone rocks."]],"SG":[["food","Which Singapore favourite is crab cooked in a sweet, spicy tomato and chilli sauce?","Chilli crab","Crab cakes","Lobster roll","Crab rangoon","People mop up the extra sauce with fried buns called mantou. It gets so messy that bibs are handed out!"],["party","At Lunar New Year in Singapore, people toss a raw fish salad high into the air. What is this called?","Lo hei","Dragon dance","Lion dance","Hongbao","Everyone stands round the table and tosses with chopsticks. The higher you toss, the more luck you get!"],["arts","Singapore's Esplanade arts centre has spiky roofs that look like which fruit?","Durian","Pineapple","Jackfruit","Rambutan","The spikes are really sunshades. Inside, the Esplanade hosts concerts, dance shows and plays all year."],["words","Singaporeans often end sentences with which little word in Singlish, as in OK ___?","Lah","Eh","Mate","Innit","Singlish mixes English with words from Malay, Chinese and Tamil. Lah adds feeling, like come on lah!"],["nature","Singapore's national flower is which kind of flower?","An orchid","A lotus","A hibiscus","A rose","It is called Vanda Miss Joaquim, after the woman who grew this purple orchid in her garden in the 1890s."],["life","Singapore's food courts full of cheap cooked-food stalls, now on a UNESCO list, are called what?","Hawker centres","Food trucks","Night bazaars","Diners","Some hawker stalls in Singapore have even won Michelin stars for their tasty, cheap dishes!"]],"KR":[["food","Which Korean dish is a bowl of rice topped with vegetables, egg and chilli paste, all mixed together?","Bibimbap","Donburi","Nasi goreng","Poke bowl","Bibimbap means mixed rice. In a hot stone bowl, the rice at the bottom turns golden and crispy!"],["party","Every July, which seaside town in South Korea holds a festival where people play in mud?","Boryeong","Busan","Jeju","Incheon","The mud comes from nearby tidal flats and is said to be good for skin. There are mud slides and mud wrestling!"],["arts","What is the hanbok, worn in South Korea on special days?","A traditional outfit","A painted paper fan","A wooden mask","A silk lantern","A hanbok has a short jacket and a high, flowing skirt or roomy trousers in bright, cheerful colours."],["words","Which king created hangul, the Korean alphabet, in the 1440s?","King Sejong","King Taejo","King Gwanggaeto","Queen Seondeok","He wanted everyone to be able to read, not just scholars. Korea celebrates Hangul Day every 9 October!"],["nature","What is South Korea's national flower, the mugunghwa?","Rose of Sharon","Cherry blossom","Lotus","Magnolia","It blooms from summer to autumn with fresh flowers every day, and it is even mentioned in the national anthem."],["life","Which martial art with high, spinning kicks comes from Korea?","Taekwondo","Karate","Kung fu","Judo","Taekwondo became a full Olympic sport in 2000, and students wear white uniforms called dobok."]],"LK":[["food","What are hoppers, a favourite food in Sri Lanka?","Bowl-shaped pancakes","Rice dumplings","Spicy crab cakes","Coconut biscuits","They are made from rice flour and coconut milk. An egg hopper has a whole egg cooked in the middle!"],["party","In which Sri Lankan festival do dozens of decorated elephants parade through Kandy at night?","Esala Perahera","Onam","Thingyan","Songkran","The elephants wear glittering cloaks lit with lights, while drummers, dancers and fire twirlers march alongside."],["arts","Which dance from Sri Lanka's hill country has dancers in shining silver headdresses leaping to drums?","Kandyan dance","Kathakali","Bharatanatyam","Tinikling","The dancers' special costume is called ves, and this energetic dance is now a national symbol of Sri Lanka."],["words","How do Sri Lankans say hello in Sinhala, with palms pressed together?","Ayubowan","Namaste","Mingalaba","Sawasdee","Ayubowan means may you live long. Sinhala letters are curly, with lots of round loops."],["nature","Yala National Park in Sri Lanka is one of the best places on Earth to spot which big cat?","Leopards","Cheetahs","Jaguars","Snow leopards","Sri Lanka has its own kind of leopard found only on the island, and it is the top hunter there."],["life","Along Sri Lanka's south coast, some fishermen sit on what while they fish?","Poles in the sea","Bamboo rafts","Floating baskets","Sea rocks","They balance on a small crossbar tied to a pole for hours, catching small fish with a simple rod."]],"SY":[["food","Which Syrian dish is a football-shaped shell of bulgur wheat stuffed with spiced meat?","Kibbeh","Falafel","Arancini","Samosa","The city of Aleppo is said to have dozens of kinds of kibbeh, and one is even cooked in a cherry sauce!"],["party","During Ramadan in Syria, a musaharati walks the streets before dawn doing what?","Drumming to wake people","Selling fresh bread","Lighting street lamps","Sweeping the streets","He wakes everyone for suhoor, the meal before sunrise, sometimes calling out people's names one by one."],["arts","In old cafes in Damascus, what does a hakawati do?","Tells stories","Makes coffee","Sells sweets","Plays the oud","He reads old adventure tales aloud, often stopping at the most exciting part so listeners come back tomorrow!"],["words","In the Syrian village of Maaloula, some people still speak which very ancient language?","Aramaic","Latin","Sanskrit","Ancient Greek","Aramaic was spoken across the Middle East over 2,000 years ago, and only a few places still use it today."],["nature","Which popular pet first came from the wild fields near Aleppo in Syria?","Golden hamster","Guinea pig","Gerbil","Chinchilla","Most pet golden hamsters in the world come from a few hamsters found near Aleppo in 1930!"],["life","The city of Hama in Syria is famous for giant wooden what, some about 20 metres tall?","Water wheels","Windmills","Clock towers","Ferris wheels","These wheels, called norias, creak and groan as they turn, lifting river water up to fields and gardens."]],"TJ":[["food","Which Tajik dish is torn flatbread soaked in a salty yogurt sauce, topped with fried onions?","Qurutob","Shakshuka","Fattoush","Khachapuri","It is eaten with hands from a big shared wooden plate, and people sit around it on cushions."],["party","Which spring festival marks the new year in Tajikistan on about 21 March?","Navruz","Songkran","Holi","Diwali","Women stir sumanak, a sweet wheat pudding, all night long, taking turns and singing songs as they go."],["arts","What is chakan, a traditional art from Tajikistan?","Embroidery","Wood carving","Pottery","Carpet weaving","Women stitch flowers, suns and moons onto dresses and scarves, and the patterns are believed to bring good luck."],["words","Tajik is a form of which language, also spoken in Iran?","Persian","Arabic","Turkish","Hindi","Tajik is written with Cyrillic letters, while people in Iran write Persian with Arabic letters."],["nature","Which wild sheep with huge curling horns lives high in Tajikistan's mountains?","Marco Polo sheep","Bighorn sheep","Mouflon","Dall sheep","It is named after the explorer Marco Polo, and its spiral horns can be longer than a grown-up is tall!"],["life","Iskanderkul, a turquoise mountain lake in Tajikistan, is named after which famous king?","Alexander the Great","Genghis Khan","Julius Caesar","King Solomon","Iskander is the local way of saying Alexander, and kul means lake. Legend says his horse still swims there."]],"TH":[["food","Which Thai dessert is sweet coconut sticky rice served with slices of fresh fruit?","Mango sticky rice","Mochi","Halo-halo","Kheer","Thai sticky rice is so sticky that people often roll it into little balls and eat it with their fingers."],["party","What do people in Thailand float on rivers and lakes during Loy Krathong?","Lotus-shaped baskets","Paper dragons","Painted eggs","Wooden ducks","Made from banana leaves, they carry candles and flowers. People make a wish as they push them off."],["arts","What is khon, a famous art form in Thailand?","Masked dance drama","Paper lantern making","Drum music","Rice painting","Dancers wear golden masks and act out the Ramakien, a long tale of heroes, demons and a monkey king."],["words","How many consonant letters does the Thai alphabet have?","44","26","33","22","Thai also has many vowel signs written above, below and around letters, and five tones that change meaning."],["nature","Which animal is Thailand's national animal?","Thai elephant","Tiger","Water buffalo","Gibbon","Thailand has a National Elephant Day every 13 March, when elephants are treated to a giant fruit buffet!"],["life","Which sport from Thailand is called the art of eight limbs?","Muay Thai","Karate","Kung fu","Taekwondo","Boxers use fists, elbows, knees and shins. Before a bout they do a slow dance to honour their teacher."]],"TL":[["food","Which Timor-Leste dish is fish cooked in a tangy sauce of tamarind, tomato and chilli?","Ikan sabuko","Fish amok","Ceviche","Kokoda","Ikan means fish. The sauce gets its sour, zingy taste from tamarind, and the fish is often mackerel caught off the coast."],["party","At celebrations in Timor-Leste, people join hands in a big circle for which stepping dance?","Tebe","Tinikling","Dabke","Hora","Dancers sing songs back and forth as they step and kick, and a tebe can go on late into the night."],["arts","What is tais, made by women in Timor-Leste?","Hand-woven cloth","Clay pottery","Bamboo baskets","Silver jewellery","Each region has its own colours and patterns, and a tais is given to honour and welcome visitors."],["words","How do you say thank you in Tetum, a language of Timor-Leste?","Obrigadu","Terima kasih","Salamat","Gracias","Tetum borrowed many words from Portuguese, so it sounds a lot like obrigado in Portugal and Brazil!"],["nature","A legend from Timor-Leste says the island of Timor was formed from which giant animal?","A crocodile","A whale","A turtle","A dragon","In the story, a boy helped a little crocodile. When it grew old it became the island, so people call it grandfather."],["life","A tall statue of Jesus stands on a hill above Dili. What is it called?","Cristo Rei","Christ the Redeemer","Cristo de la Concordia","Cristo Blanco","Its name means Christ the King. Visitors climb hundreds of steps to reach it and enjoy wide views of the sea."]],"TR":[["food","Which soft, chewy sweet from Türkiye is dusted with powdered sugar and often flavoured with rose?","Lokum","Mochi","Marshmallow","Nougat","In English it is called Turkish delight. In a Narnia book, Edmund is tempted by a whole box of it!"],["party","On 23 April, Türkiye celebrates a special day for whom?","Children","Teachers","Doctors","Farmers","On this day kids take over important seats, even in parliament, and children from many countries come to dance."],["arts","Which dancers from Türkiye spin round and round in long white skirts?","Whirling dervishes","Flamenco dancers","Morris dancers","Kathak dancers","They wear tall hats and spin with one hand up and one hand down, as a kind of peaceful moving prayer."],["words","In 1928, Türkiye changed to writing Turkish in which alphabet?","Latin alphabet","Cyrillic alphabet","Greek alphabet","Arabic alphabet","It added letters like ç, ş and ğ. The soft g, ğ, is silent and just makes the vowel before it longer!"],["nature","Which fluffy white cat from Türkiye loves to swim and may have one blue and one amber eye?","Van cat","Persian cat","Siamese cat","Maine Coon","It comes from around Lake Van, the biggest lake in Türkiye, and its silky fur is almost waterproof."],["life","Which funny folk hero from Türkiye is famous for riding his donkey backwards?","Nasreddin Hodja","Aladdin","Sinbad","Robin Hood","Nasreddin's short, silly stories always hide a clever lesson, and kids around the world still tell them."]],"TM":[["food","Which Turkmen dish is bread torn into little bits and mixed with meat, onion and broth?","Dograma","Goulash","Borscht","Minestrone","Dograma means chopped up. People often sit together tearing the bread, so making it is part of the fun."],["party","Turkmenistan has a national holiday every August to celebrate which fruit?","Melons","Grapes","Apricots","Pomegranates","Turkmen melons are famous for being huge and sweet, and the country grows hundreds of different kinds."],["arts","Turkmenistan's flag includes patterns from which traditional craft?","Carpets","Pottery","Embroidery","Woodwork","The flag shows five carpet patterns called guls. Each pattern belongs to one of the main Turkmen tribes."],["words","Turkmen is closely related to which other language?","Turkish","Russian","Persian","Arabic","Turkmen and Turkish share many words. Salam is hello in Turkmen, and sag bol means thank you."],["nature","Which huge desert covers most of Turkmenistan?","Karakum","Gobi","Sahara","Thar","Karakum means black sand, and this desert covers about 70 percent of the whole country."],["life","Turkmenistan's capital holds a world record for having the most buildings covered in what?","White marble","Gold leaf","Glass mirrors","Blue tiles","Ashgabat has over 500 marble-covered buildings, so the whole city gleams white in the sunshine."]],"AE":[["food","Which Emirati sweet is little balls of fried dough drizzled with date syrup?","Luqaimat","Churros","Gulab jamun","Beignets","They are crunchy outside and soft inside, and they are a favourite treat on Ramadan evenings."],["party","In 1971, seven emirates joined to form the UAE. On which date is National Day celebrated?","2 December","1 January","14 July","4 July","People wave flags, watch fireworks and air shows, and decorate their cars in red, green, white and black."],["arts","What is Al Sadu, a traditional Emirati craft?","Bedouin weaving","Pottery","Glass blowing","Wood carving","Women spin wool from camels, goats and sheep, then weave bright red and black patterns for tents and rugs."],["words","In the UAE, what is a majlis?","A sitting room for guests","A covered market","A desert fort","A sailing boat","Guests sit on cushions round the walls, sharing coffee, dates and chat. Majlis means a place for sitting."],["nature","Abu Dhabi's waters are home to one of the world's biggest groups of which gentle sea cow?","Dugongs","Walruses","Sea lions","Narwhals","Dugongs munch seagrass on the seabed and can live for 70 years. They come up to breathe every few minutes."],["life","In camel races in the UAE, what rides on the camels' backs today?","Small robot jockeys","Trained monkeys","Grown-up riders","Toy dolls","Owners drive cars alongside the track and use remote controls to tap the camels and cheer them on."]],"UZ":[["food","Which rice dish with carrots and lamb, cooked in a huge pot, is Uzbekistan's national dish?","Plov","Paella","Biryani","Risotto","Uzbek plov is on a UNESCO list, and cooks make it in giant pots called kazans to feed whole weddings."],["party","Which festival in the old city of Bukhara celebrates the crafts of the ancient Silk Road?","Silk and Spices Festival","Lantern Festival","Harvest Moon Festival","Rose Festival","Craftspeople show off silk, pottery and metalwork in the streets, with music, dancing and puppet shows."],["arts","Which lively dance from Uzbekistan's Khorezm region starts slowly and gets faster and faster?","Lazgi","Tinikling","Dabke","Hula","Dancers flick their wrists and fingers, and the dance is said to show the soul waking up and finding joy."],["words","How do you say thank you in Uzbek?","Rahmat","Spasibo","Shukriya","Arigato","Uzbeks often say it with a hand on the heart. Uzbek is written in both Latin and Cyrillic letters today."],["nature","Which desert, whose name means red sand, covers much of Uzbekistan?","Kyzylkum","Karakum","Gobi","Sahara","Its sand has a reddish colour, and tortoises, jerboas and big desert monitor lizards live there."],["life","The word algorithm comes from the name of a maths genius from what is now Uzbekistan. Who?","Al-Khwarizmi","Pythagoras","Euclid","Archimedes","Al-Khwarizmi lived about 1,200 years ago, and one of his books also gave us the word algebra!"]],"VN":[["food","Which noodle soup with fresh herbs is Vietnam's most famous dish?","Pho","Ramen","Laksa","Mohinga","Pho broth simmers for hours with star anise and cinnamon, and people add lime, chilli and bean sprouts."],["party","What is Tet, the biggest festival of the year in Vietnam?","Lunar New Year","Water festival","Kite festival","Rice planting day","Kids get lucky money in red envelopes, and homes are decorated with peach blossoms and kumquat trees."],["arts","Vietnam has a famous kind of puppet show where the stage is what?","A pool of water","A tall tree","A sand pit","A rooftop","Puppeteers hide behind a screen, standing waist-deep in water, and move the puppets with long rods underneath."],["words","Vietnamese has six of these, so the sound ma can mean ghost, mother or horse. What are they?","Tones","Alphabets","Plurals","Silent letters","Each tone is shown with a little mark above or below a letter, so ma, má and mã all sound different."],["nature","Which rare forest animal, nicknamed the Asian unicorn, was discovered in Vietnam in 1992?","Saola","Okapi","Tapir","Pangolin","Saola have two long straight horns and are so shy that scientists have hardly ever seen one in the wild."],["life","Vietnam's cone-shaped hat, the non la, is made from what?","Palm leaves","Felt","Rice paper","Cotton cloth","The leaves are stretched over thin bamboo rings. It shades you from the sun and keeps off the rain too!"]],"YE":[["food","Which bubbling stew, topped with a frothy fenugreek foam, is often called Yemen's national dish?","Saltah","Tagine","Mansaf","Harira","Saltah is served sizzling hot in a stone pot and scooped up with pieces of flatbread instead of a spoon."],["party","Before a wedding in Yemen, what is painted in swirly patterns on the bride's hands at a special party?","Henna","Turmeric paste","Gold paint","Charcoal","The henna night is full of singing and drumming, and the orange-brown patterns can last for weeks."],["arts","What are the half-moon stained-glass windows above the windows of houses in Sana'a called?","Qamariya","Mashrabiya","Zellige","Azulejo","Qamariya means moon-like. At night the coloured glass glows from inside, so the houses look like giant lanterns."],["words","Yemenis speak Arabic. In which direction is Arabic written?","Right to left","Left to right","Top to bottom","Bottom to top","Arabic letters join up like handwriting, and most letters change shape depending on where they sit in a word."],["nature","Which lizard with a tall helmet-like crest on its head is also known as the Yemen chameleon?","Veiled chameleon","Frilled lizard","Green iguana","Komodo dragon","It can change colour and shoot out a sticky tongue longer than its own body to snatch up insects."],["life","Which drink was shipped around the world from Yemen's port of Mocha hundreds of years ago?","Coffee","Tea","Cocoa","Lemonade","Yemen was one of the first places to grow coffee as a crop, and the word mocha for chocolatey coffee comes from this port."]],"AL":[["food","Which Albanian dish is lamb and rice baked under a creamy layer of yogurt and eggs?","Tave kosi","Moussaka","Goulash","Pastitsio","It comes from the city of Elbasan, and the yogurt topping bakes into a golden, wobbly crust."],["party","On Summer Day, 14 March, which crumbly cookies do Albanians bake to welcome spring?","Ballokume","Baklava","Kourabiedes","Lebkuchen","Summer Day is an ancient spring festival with picnics and music, and ballokume cookies come from the city of Elbasan."],["arts","Which Albanian folk singing style has a group humming one long note under the main singers?","Iso-polyphony","Yodelling","Throat singing","Fado","The iso is the steady humming note. UNESCO lists this very old singing style as a treasure of world culture."],["words","How do you say thank you in Albanian?","Faleminderit","Hvala","Efharisto","Tesekkur ederim","Albanian sits on its own branch of the language tree with no close cousins, and its alphabet has 36 letters."],["nature","Which bird appears with two heads on Albania's red flag?","Eagle","Falcon","Swan","Owl","Albanians someti
