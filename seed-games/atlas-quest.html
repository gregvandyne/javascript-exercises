<title>Atlas Quest</title>
<style>
/* ===== Atlas Quest on the Oomba Kit: the 3D globe fills the screen; the bars, sheets and cards are kit DOM inside

[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--aq-sky);-webkit-tap-highlight-color:transparent}

.aq-tag{position:absolute;left:0;top:0;background:var(--ok-card);color:var(--ok-text);font-weight:800;font-size:14px;line-height:1.2;padding:5px 10px;border-radius:12px;
  border:3px solid var(--ok-edge);box-shadow:0 3px 0 var(--ok-edge);white-space:nowrap;transform:translate(-50%,-130%)}

.aq-bar{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 12px;pointer-events:none}
.aq-bar>*{pointer-events:auto}
.aq-spacer{flex:1}
.aq-pill{display:inline-flex;align-items:center;gap:6px;font-weight:800}
.aq-pill svg{width:20px;height:20px}
.aq-sheet.ok-card{position:fixed;display:block;text-align:start;left:10px;right:10px;margin:0 auto;bottom:10px;width:auto;max-width:560px;z-index:6;box-sizing:border-box;
  max-height:min(62vh,560px);overflow:auto;padding:14px 14px 12px}
.aq-sheet h2{margin:0 0 4px;font-size:22px}
.aq-sub{margin:0 0 10px;opacity:.85;font-size:15px}
.aq-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.aq-chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.aq-chips::-webkit-scrollbar{display:none}
.aq-chips button{flex:none}
.aq-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.aq-mode{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;padding:8px 6px;border-radius:18px;
  border:3px solid var(--ok-edge);box-shadow:0 4px 0 var(--ok-edge);background:var(--ok-card);color:var(--ok-text);font:inherit;font-weight:800;font-size:15px;cursor:pointer;text-align:center;line-height:1.15}
.aq-mode svg{width:28px;height:28px}
.aq-mode small{font-weight:600;font-size:12px;opacity:.8}
.aq-mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ok-edge)}
.aq-mode.m-find{background:var(--aq-sky-tint)}.aq-mode.m-flag{background:var(--aq-coral-tint)}.aq-mode.m-cap{background:var(--aq-grape-tint)}
.aq-mode.m-daily{background:var(--aq-spark-tint)}.aq-mode.m-speed{background:var(--aq-peach-tint)}.aq-mode.m-file{background:var(--aq-go-tint)}
.aq-mode .done{font-size:12px}
.aq-q{display:flex;gap:12px;align-items:center;margin:2px 0 10px}
.aq-q .txt{flex:1;font-size:19px;font-weight:800;line-height:1.25}
.aq-q .txt small{display:block;font-size:14px;font-weight:600;opacity:.8;margin-top:2px}
.aq-flag{display:block;border-radius:6px;border:2px solid var(--ok-edge);object-fit:cover;background:var(--aq-sym);aspect-ratio:4/3}
.aq-q .aq-flag{width:96px;flex:none}
.aq-q .aq-flag.big{width:150px}
.aq-opts{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.aq-opt{min-height:56px;padding:6px 10px;border-radius:16px;border:3px solid var(--ok-edge);box-shadow:0 4px 0 var(--ok-edge);background:var(--ok-card);color:var(--ok-text);
  font:inherit;font-weight:800;font-size:16px;cursor:pointer;line-height:1.15;display:flex;align-items:center;justify-content:center;text-align:center}
.aq-opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ok-edge)}
.aq-opt.fl{padding:6px}
.aq-opt.fl .aq-flag{width:100%;max-width:150px}
.aq-opt.good{background:var(--aq-go-tint)}.aq-opt.bad{background:var(--aq-wrong-tint)}.aq-opt.dim{opacity:.55}
.aq-opt:disabled{cursor:default}
.aq-prog{display:flex;gap:5px;align-items:center;margin:0 0 8px}
.aq-prog i{flex:1;height:8px;border-radius:5px;background:var(--aq-sym)}
.aq-prog i.ok{background:var(--aq-go)}.aq-prog i.no{background:var(--aq-wrong)}.aq-prog i.now{background:var(--aq-spark)}
.aq-feed{min-height:22px;margin:8px 2px 0;font-weight:700;font-size:15px;line-height:1.3}
.aq-feed.good{color:var(--aq-go-ink)}.aq-feed.bad{color:var(--aq-wrong-ink)}
.aq-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.aq-head .t{flex:1;font-weight:800;font-size:15px;opacity:.85}
.aq-timer{font-weight:900;font-size:22px;min-width:52px;text-align:center}
.aq-card{width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;box-sizing:border-box}
.aq-file{text-align:start}
.aq-file .top{display:flex;gap:14px;align-items:center}
.aq-file .top .aq-flag{width:120px;flex:none}
.aq-file h2{margin:0;font-size:24px}
.aq-file dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:12px 0;font-size:16px}
.aq-file dt{font-weight:800;opacity:.75}.aq-file dd{margin:0;font-weight:700}
.aq-fact{padding:10px 12px;border-radius:14px;background:var(--aq-spark-tint);font-size:16px;line-height:1.35;margin:8px 0}
.aq-dots{display:inline-flex;gap:4px;vertical-align:middle}
.aq-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ok-edge);background:var(--ok-card)}
.aq-dots i.on{background:var(--aq-spark)}
.ci-acts,.aq-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:10px}
.aq-stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;margin:6px 0 12px}
.aq-stamps button{padding:0;border:0;background:none;cursor:pointer}
.aq-stamps .aq-flag{width:100%;filter:grayscale(1) opacity(.35)}
.aq-stamps .lit .aq-flag{filter:none}
.aq-cont{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-weight:800}
.aq-cont .bar{flex:1;height:10px;border-radius:6px;background:var(--aq-sym);overflow:hidden}
.aq-cont .bar i{display:block;height:100%;background:var(--aq-go)}
.aq-cont svg{width:20px;height:20px}
.aq-paints{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.aq-paint{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:62px;padding:6px;border-radius:14px;border:3px solid var(--ok-edge);background:var(--ok-card);color:var(--ok-text);font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.aq-paint i{width:28px;height:28px;border-radius:50%;border:2px solid var(--ok-edge)}
.aq-paint.on{background:var(--aq-spark-tint)}
.aq-paint:disabled{opacity:.6;cursor:default}
.aq-paint svg{width:14px;height:14px}
.aq-hint{font-size:14px;opacity:.85;margin:6px 0 0}
.aq-num{direction:ltr;unicode-bidi:isolate}

/* tinted pieces keep dark text in both themes */
.aq-mode,.aq-opt.good,.aq-opt.bad,.aq-fact,.aq-tag.good,.aq-tag.bad,.aq-tag.hot,.aq-paint.on{color:var(--aq-ink)}
/* culture: the "why" after an answer, and the finds in a country file */
.aq-why{display:flex;gap:8px;align-items:flex-start;margin-top:6px;padding:8px 10px;border-radius:12px;background:var(--aq-spark-tint);color:var(--aq-ink);font-weight:600;font-size:15px;line-height:1.35}
.aq-why svg,.aq-find svg{width:20px;height:20px;flex:none;margin-top:1px}
.aq-ch{margin:14px 0 6px;font-size:18px}.aq-ch small{font-size:14px;opacity:.75;margin-inline-start:6px}
.aq-find{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;margin:6px 0;border-radius:12px;background:var(--aq-go-tint);color:var(--aq-ink);font-size:15px;line-height:1.35}
.aq-find b{display:block}.aq-find span{font-weight:500}
.aq-find small{display:block;font-size:13px;font-weight:600;opacity:.75;margin-bottom:2px}

 meal, often couscous with chicken, and children may get sweets and dried fruits for a lucky year ahead."],["arts","Which style of popular music was born in the Algerian city of Oran?","Rai","Reggae","Highlife","Samba","Rai mixes old folk songs with modern instruments. The singer Khaled, called the King of Rai, made it famous around the world."],["words","Which ancient alphabet is used to write Tamazight, the Berber language of Algeria?","Tifinagh","Ge'ez","Cyrillic","Devanagari","Tifinagh letters are made from simple shapes like circles, lines and dots. The Tuareg people have used it for a very long time."],["nature","Which tiny desert fox with huge ears is Algeria's national animal?","Fennec fox","Arctic fox","Red fox","Grey fox","Its giant ears let heat escape and help it hear insects under the sand. Algeria's football team is nicknamed the Fennecs!"],["life","Which valley in the Algerian Sahara has old hilltop towns of pastel houses, like Ghardaia?","M'zab Valley","Rift Valley","Nile Valley","Death Valley","These towns were built about 1,000 years ago, and their clever, simple designs later inspired famous modern architects."]],"AO":[["food","What is Angola's chicken stew made with palm oil, often eaten with a porridge called funge?","Muamba de galinha","Doro wat","Jollof rice","Bobotie","Funge is a thick, smooth porridge made from cassava flour, and people use it to scoop up the tasty orange sauce."],["party","Which colourful street party fills the seafront of Luanda with dancing groups every February or March?","Carnival","Timkat","Homowo","Durbar","Dance groups parade along the seafront in bright costumes, competing with songs and dances like semba."],["arts","Which smooth partner dance, now loved all around the world, began in Angola?","Kizomba","Tango","Salsa","Flamenco","Kizomba grew out of an older Angolan dance called semba in the 1980s. Its name means party in the Kimbundu language."],["words","Angola's official language is Portuguese. How do you say thank you in it?","Obrigado","Merci","Gracias","Asante","A man says obrigado and a woman says obrigada. Many Angolans also speak African languages like Umbundu and Kimbundu at home."],["nature","Which strange desert plant in southern Angola grows only two long leaves and can live over 1,000 years?","Welwitschia","Baobab","Aloe vera","Saguaro cactus","Its two leaves keep growing its whole life, splitting into ribbons that sprawl across the sand of the Namib Desert."],["life","What are the eroded red and white cliffs near Luanda, which look like an alien world, called?","Viewpoint of the Moon","Valley of the Kings","Giant's Causeway","Garden of the Gods","Wind and rain carved the cliffs into spikes and ridges, so standing there feels like visiting the surface of the Moon."]],"BJ":[["food","Which Beninese dish is cornmeal dough cooked in a red tomato sauce, often served with chicken?","Amiwo","Fufu","Ugali","Couscous","The cornmeal soaks up the tomato, onion and spices as it cooks, so amiwo turns a lovely reddish-orange colour."],["party","Which festival on 10 January brings drummers, dancers and costumes to the town of Ouidah in Benin?","Vodun Day","Timkat","Homowo","Umhlanga","Benin is the birthplace of Vodun, an old religion. Egungun dancers spin in colourful costumes that hide them completely."],["arts","Which craft from Abomey in Benin tells stories with bright cut-out cloth shapes sewn onto fabric?","Applique","Batik","Kente weaving","Mudcloth","Each king of the old kingdom of Dahomey had symbols, like a shark or a lion, that appear on these colourful banners."],["words","About how many languages are spoken in Benin?","About 50","About 5","About 500","Only 1","French is the official language, but most people speak African languages like Fon, Yoruba or Bariba at home."],["nature","Which national park in northern Benin is one of the last homes of the West African lion?","Pendjari","Serengeti","Kruger","Etosha","Pendjari is also home to elephants, hippos, buffaloes and baboons, and its waterholes get busy with animals in the dry season."],["life","Which singer from Benin has won five Grammy Awards?","Angelique Kidjo","Miriam Makeba","Youssou N'Dour","Oumou Sangare","She sings in Fon, Yoruba, French and English, and she works as a UNICEF Goodwill Ambassador to help children."]],"BW":[["food","What is Botswana's national dish of slow-boiled beef that is pounded until it falls apart?","Seswaa","Biltong","Bobotie","Nyama choma","Seswaa is cooked at weddings and big celebrations, usually by men, and is served with a thick maize porridge called pap."],["party","On Botswana Day, people wear light blue. What does the blue on Botswana's flag stand for?","Water and rain","The night sky","The ocean","Diamonds","The black and white stripes in the middle of the flag stand for people of all colours living together in peace."],["arts","Women in Botswana are famous for weaving baskets from the leaves of which plant?","Mokola palm","Bamboo","Willow","Coconut palm","They dye the palm leaves with roots and bark to make brown patterns with names like Tears of the Giraffe."],["words","Botswana's money is called the pula. What does pula mean in Setswana?","Rain","Gold","Sun","Cattle","Rain is so precious in this dry land that people shout Pula! at big events as a cheer for good luck."],["nature","Botswana is home to the world's biggest population of which wild animal?","African elephants","Lions","Giraffes","Rhinos","About 130,000 elephants live there, and big herds gather to drink and swim along the Chobe River."],["life","Which precious stone, dug from mines like Jwaneng, helped Botswana grow rich?","Diamonds","Gold","Emeralds","Rubies","In 2024 a giant diamond of 2,492 carats, about the size of a fist, was found in Botswana. It is one of the biggest ever found."]],"BF":[["food","What is the thick porridge of millet or corn eaten with sauce almost every day in Burkina Faso?","To","Sadza","Banku","Polenta","People pinch off a piece with their right hand and dip it in sauces made from okra, baobab leaves or peanuts."],["party","At which festival in Dedougou, Burkina Faso, do dancers wear masks of leaves, fibres and wood?","FESTIMA","Carnival","Durbar","Timkat","Masked dancers from villages across West Africa come to perform. The masks are often connected to the spirits of ancestors."],["arts","Which wooden xylophone with gourds hanging underneath is played in Burkina Faso?","Balafon","Kora","Djembe","Mbira","The gourds make each wooden key buzz and boom. Legends say balafons were played for West African kings 800 years ago."],["words","What does the name Burkina Faso mean?","Land of honest people","Land of rivers","Land of gold","Land of the sun","Burkina is a Moore word for upright or honest, and Faso is a Dyula word for homeland, so two languages make one name!"],["nature","At the pond of Bazoule near Ouagadougou, visitors can sit right next to which animals?","Crocodiles","Hippos","Turtles","Manatees","Local people believe the crocodiles are sacred and feed them chickens, so the big reptiles have grown calm around humans."],["life","Francis Kere from Burkina Faso won architecture's top prize. What did he first build in his village?","A school","A bridge","A football stadium","A hospital","He built the school in Gando with clay bricks made by villagers, plus a big floating roof that keeps the classrooms cool."]],"BI":[["food","Ibiharage, a favourite dish in Burundi, is made by frying which food with onions and garlic?","Beans","Lentils","Chickpeas","Peanuts","Burundians eat beans with nearly every meal, often alongside bananas, cassava or sweet potatoes."],["party","What is the name of Burundi's harvest festival, when the first sorghum of the year is shared?","Umuganuro","Homowo","Incwala","Timkat","Long ago the king opened the planting season at this festival. Today people share food, sing and dance to celebrate the harvest."],["arts","Which Burundian string instrument, shaped like a long wooden bowl, is played while the singer whispers?","Inanga","Kora","Balafon","Sitar","Inanga singers whisper their songs very softly, so the gentle strings and the voice blend together like one sound."],["words","Which Kirundi word, meaning peace, is also used to say hello in Burundi?","Amahoro","Jambo","Sawubona","Mbote","Almost everyone in Burundi speaks Kirundi, which is unusual in Africa, where most countries have many different languages."],["nature","A small stone pyramid in Burundi marks the southern source of which famous river?","The Nile","The Congo","The Zambezi","The Niger","Water from a spring there travels about 6,700 kilometres north, all the way to the Mediterranean Sea in Egypt."],["life","In 1996, Venuste Niyongabo won Burundi's first Olympic gold medal in which sport?","Running","Swimming","Boxing","Cycling","He won the 5,000 metres race at the Atlanta Olympics, and the whole country celebrated its first ever Olympic medal."]],"CM":[["food","Which Cameroonian dish is a stew of bitter leaves and peanuts, cooked with fish or meat?","Ndole","Jollof rice","Thieboudienne","Egusi soup","The bitter leaves are washed many times to soften the taste, and ndole is often eaten with fried plantains."],["party","At Cameroon's Ngondo festival, a diver goes into which river to bring back messages from the ancestors?","Wouri River","Niger River","Congo River","Nile River","The Sawa people of the coast also hold canoe races during Ngondo, with teams paddling long carved boats."],["arts","Which dance music from Douala was made famous around the world by saxophonist Manu Dibango?","Makossa","Highlife","Soukous","Mbalax","His 1972 song Soul Makossa was a worldwide hit, and its catchy chant has been borrowed by many pop stars since."],["words","About how many languages are spoken in Cameroon?","About 250","About 10","About 50","About 2,000","French and English are official, and many young people chat in Camfranglais, a fun mix of French, English and local words!"],["nature","Which giant animal, as heavy as a house cat, lives in the rivers of Cameroon?","Goliath frog","Cane toad","Bullfrog","Axolotl","It is the largest frog in the world, over 30 centimetres long. Some even push rocks around to build little ponds for their eggs!"],["life","What is the nickname of Cameroon's national football team?","Indomitable Lions","Super Eagles","Black Stars","Pharaohs","In 1990 they became the first African team to reach a World Cup quarter-final, and Roger Milla danced by the corner flag!"]],"CV":[["food","What is Cape Verde's national dish, a slow-cooked stew of corn, beans and fish or meat?","Cachupa","Feijoada","Paella","Moqueca","Leftover cachupa is fried in a pan the next morning, often with an egg on top, to make a tasty breakfast."],["party","Which big street celebration fills the town of Mindelo in Cape Verde with floats and costumes each year?","Carnival","Timkat","Homowo","Diwali","Groups spend months making floats and costumes, and the parade dances to drums all through the streets of the town."],["arts","Which fast Cape Verdean dance music is played on an accordion and a scraped iron bar called a ferrinho?","Funana","Samba","Tango","Fado","Funana was once played mostly in the countryside of Santiago island. Now it fills dance floors all over Cape Verde."],["words","Which Cape Verdean word describes the warm, welcoming friendliness of the islands?","Morabeza","Saudade","Hygge","Aloha","Cape Verdeans are very proud of their morabeza, and you will see the word on hotels, shops and in lots of songs."],["nature","The beaches of Boa Vista in Cape Verde are a top nesting place for which sea animal?","Loggerhead turtles","Penguins","Sea lions","Flamingos","Every summer thousands of mother turtles crawl onto the sand at night to dig nests and lay around 100 eggs each."],["life","At Pedra de Lume on Sal island, visitors float in a very salty lake inside what?","A volcano crater","A cave","A glacier","A coral reef","The water is so salty that you bob like a cork. The island's name, Sal, means salt in Portuguese."]],"CF":[["food","Which root is the main food in the Central African Republic, pounded into a dough called gozo?","Cassava","Potato","Carrot","Taro","Cassava leaves are eaten too. They are pounded and cooked into a green stew called ngunza, sometimes with peanut paste."],["party","On which date does the Central African Republic celebrate becoming a republic, with parades in Bangui?","1 December","4 July","14 July","1 January","People wave the flag, with stripes of blue, white, green, yellow and a red band, plus a yellow star, and watch marches and music."],["arts","The Aka people of the Central African Republic's forests are famous for what kind of music?","Many-voiced singing","Solo violin","Brass bands","Bagpipe music","Each singer sings a different tune at the same time, yodelling up and down, and together they weave one rich song."],["words","Which language is spoken by nearly everyone in the Central African Republic, alongside French?","Sango","Swahili","Zulu","Hausa","Sango began as a trading language along the Ubangi River, and now it is an official language of the whole country."],["nature","Which great apes can visitors meet in the Dzanga-Sangha forests, with help from Aka trackers?","Western lowland gorillas","Orangutans","Bonobos","Mountain gorillas","It takes years for gorillas to get used to people. Aka trackers know the forest so well they can follow the gorillas' trails."],["life","Which waterfalls, about 50 metres tall, are a favourite day trip from Bangui?","Boali Falls","Victoria Falls","Kalandula Falls","Murchison Falls","In the rainy season the Mbali River roars over the rocky cliff in a wide white curtain of water."]],"TD":[["food","What is the name of Chad's everyday food, a ball of millet or sorghum dough eaten with sauce?","Boule","Fufu","Injera","Couscous","Boule means ball in French. People share it from one big bowl, tearing off pieces to dip in okra or meat sauce."],["party","At Chad's Gerewol festival, Wodaabe men wear make-up and roll their eyes to win what kind of contest?","A beauty contest","A wrestling match","A camel race","A cooking contest","The men dance for hours with painted faces and feathers, and young women choose who is the most handsome."],["arts","Which ancient people near Lake Chad left behind small clay figures and bronze objects?","The Sao","The Maya","The Vikings","The Aztecs","The Sao lived around Lake Chad over 1,000 years ago, and local legends say they were giants!"],["words","Chad has two official languages. One is French. What is the other?","Arabic","English","Portuguese","Swahili","Around 120 local languages are spoken too, and many people use Chadian Arabic at markets to understand each other."],["nature","The Ounianga Lakes in Chad are surprising because they are found in the middle of what?","The Sahara Desert","A rainforest","A volcano","An ice field","There are 18 lakes, some salty and some fresh, fed by water stored deep underground since the Sahara was green."],["life","What was Toumai, found in the Chad desert in 2001?","A very old skull","A lost city","A meteorite","A dinosaur egg","It is about 7 million years old and belongs to one of the oldest known human relatives. Toumai means hope of life."]],"KM":[["food","Which sweet-smelling spice, used to flavour ice cream, is a top crop in the Comoros?","Vanilla","Saffron","Paprika","Turmeric","Each vanilla flower must be pollinated by hand on the one day it opens, so farmers check their vines every morning."],["party","What is the Grand Marriage, a famous tradition in the Comoros?","A huge wedding party","A boat race","A harvest festival","A New Year parade","Relatives save for years for it. Guests dance and feast for days, and the groom earns great respect in his town."],["arts","Comorian women paint their faces with a pale yellow paste called msindzano. What is it made from?","Sandalwood","Clay","Charcoal","Chalk","Women grind the wood on a piece of coral with water. The paste protects the skin from the sun and keeps it soft."],["words","Comorian, the main language of the Comoros, is a close cousin of which East African language?","Swahili","Amharic","Zulu","Malagasy","Each island has its own way of speaking Comorian, but people from different islands can still chat together."],["nature","Which huge fruit bat, with wings about 1.4 metres wide, lives only in the Comoros?","Livingstone's fruit bat","Vampire bat","Egyptian fruit bat","Little brown bat","It roosts in mountain forests on Anjouan and Moheli and helps new trees grow by spreading seeds from the fruit it eats."],["life","What is the name of the big active volcano on Grande Comore island?","Mount Karthala","Mount Kilimanjaro","Mount Etna","Mount Fuji","Its summit crater is about 3 by 4 kilometres wide, and old black lava from it covers much of the island's coast."]],"DJ":[["food","What is Djibouti's national dish of spiced rice cooked with lamb or goat?","Skoudehkaris","Paella","Jollof rice","Couscous","It is spiced with cardamom, cloves and black pepper, showing how traders from Yemen and India shaped Djibouti's cooking."],["party","Most people in Djibouti are Muslim. Which festival marks the end of the fasting month of Ramadan?","Eid al-Fitr","Diwali","Hanukkah","Nowruz","People wear new clothes, visit relatives and share sweet treats like halwo, a sticky, shiny Somali sweet."],["arts","What is the light, flowing dress often worn by Somali women in Djibouti called?","Dirac","Sari","Kimono","Kente","The dirac is made of thin, colourful cloth, which is perfect for Djibouti, one of the hottest countries on Earth."],["words","Besides French and Arabic, which two languages are spoken by most people in Djibouti?","Somali and Afar","Swahili and Amharic","Hausa and Yoruba","Zulu and Xhosa","Afar and Somali are cousin languages, and for centuries both kept their history alive through poems and songs."],["nature","Which gentle giant fish visits the Gulf of Tadjoura near Djibouti each winter?","Whale shark","Great white shark","Swordfish","Sunfish","Whale sharks are the biggest fish in the world, yet they eat tiny plankton, and snorkellers can swim right beside them."],["life","At Lake Abbe in Djibouti, what tall rock shapes puff out steam?","Limestone chimneys","Ice towers","Sand dunes","Coral reefs","Some are 50 metres tall. The strange landscape was used as an alien world in the 1968 film Planet of the Apes."]],"CD":[["food","In DR Congo, what is pondu, a favourite dish eaten with fufu?","Stewed cassava leaves","Grilled fish","Fried plantains","Peanut soup","The leaves are pounded and slowly cooked with onions, palm oil and sometimes fish, until they turn soft and dark green."],["party","In Kinshasa, what do the stylish sapeurs love to do?","Dress in fancy suits","Race canoes","Paint murals","Juggle fire","Sapeurs strut through the streets in bright suits, hats and shiny shoes, posing like movie stars to show off their style."],["arts","Which Congolese music and dance, with sweet guitars, joined UNESCO's list of world treasures in 2021?","Congolese rumba","Highlife","Makossa","Kizomba","Stars like Papa Wemba and Koffi Olomide made it famous, and its twinkly guitars shaped music across Africa."],["words","How do you say hello in Lingala, a language spoken in Kinshasa?","Mbote","Jambo","Sawubona","Akwaaba","Lingala is the language of many rumba songs, so people across Africa sing along even if they don't speak it."],["nature","The Congo River, which flows past Kinshasa, holds which world record?","Deepest river","Longest river","Widest waterfall","Saltiest river","In places it is over 220 metres deep, so deep that sunlight never reaches the bottom, where some fish have no eyes."],["life","What unusual helpers have directed traffic on some busy streets in Kinshasa?","Giant robots","Trained dogs","Talking parrots","Flying drones","The tall metal robots were designed by Congolese engineers. They turn and raise their arms to tell cars and people when to go."]],"EG":[["food","Which Egyptian street food mixes rice, pasta, lentils and chickpeas with tomato sauce?","Koshari","Falafel","Shakshuka","Hummus","It is topped with crispy fried onions, and shops in Cairo serve it so fast that it is like Egypt's own fast food."],["party","On which spring holiday do Egyptians picnic outdoors and colour eggs, a custom from the time of the pharaohs?","Sham el-Nessim","Nowruz","Holi","Songkran","The name means smelling the breeze. People eat salty fish, green onions and coloured eggs in parks and gardens."],["arts","In which Egyptian dance does a performer spin for many minutes in a huge, colourful skirt?","Tanoura","Flamenco","Hula","Sirtaki","Tanoura dancers can spin non-stop for half an hour, lifting their layered skirts so they twirl like flying plates."],["words","Which stone, found in 1799, helped people finally read Egyptian hieroglyphs?","Rosetta Stone","Blarney Stone","Stone of Destiny","Plymouth Rock","It has the same message in three scripts, so experts could compare them. Jean-Francois Champollion cracked the code in 1822."],["nature","Which Egyptian desert has chalk rocks shaped like giant mushrooms and ice cream cones?","White Desert","Atacama Desert","Gobi Desert","Namib Desert","Wind and sand carved the soft white chalk over thousands of years, and at night the rocks can glow silver in the moonlight."],["life","Which footballer from Egypt became a goal-scoring star for Liverpool?","Mohamed Salah","Riyad Mahrez","Didier Drogba","Samuel Eto'o","Fans call him the Egyptian King. He has won the Premier League Golden Boot for top scorer several times."]],"GQ":[["food","Which spicy soup of fish or meat, cooked with hot peppers, is popular in Equatorial Guinea?","Pepesup","Gazpacho","Borscht","Miso soup","Its name comes from the English words pepper soup, carried by traders and sailors along the West African coast."],["party","Which lively dance of the Bubi people is performed on Bioko island, especially at Christmas?","Balele","Kizomba","Umhlanga","Samba","Groups dance through the streets to drums in colourful costumes, and crowds come out to watch and join the fun."],["arts","Masks of the Fang people, from Equatorial Guinea and nearby, inspired which famous painter?","Pablo Picasso","Vincent van Gogh","Leonardo da Vinci","Claude Monet","Fang carvings, with calm faces and smooth shapes, helped inspire the bold, blocky Cubist style of artists in Paris."],["words","Equatorial Guinea's motto is Unidad, Paz, Justicia. What does paz mean in Spanish?","Peace","Freedom","Strength","Hope","Unidad means unity and justicia means justice. The motto sits on the coat of arms, under a big silk cotton tree."],["nature","Which monkey with a black face and red lip, a cousin of the mandrill, lives on Bioko island?","Drill","Gibbon","Lemur","Howler monkey","Drills live in big troops and spend lots of time on the forest floor, searching for fruit, seeds and insects."],["life","What is the name of the highest mountain in Equatorial Guinea, on Bioko island?","Pico Basile","Mount Cameroon","Mount Kenya","Mount Elgon","It is an old volcano over 3,000 metres high, and on clear days you can see Mount Cameroon across the sea."]],"ER":[["food","Which spicy stew, eaten on spongy injera bread, is a favourite in Eritrea?","Zigni","Goulash","Gumbo","Tagine","It is flavoured with berbere, a red spice mix. People eat with their right hand, tearing off injera to scoop it up."],["party","During the Meskel festival in Eritrea, what do people light in the evening?","Giant bonfires","Paper lanterns","Fireworks","Candles on trees","The bonfire, called a demera, is decorated with yellow daisy flowers, and people sing and dance around it."],["arts","Which bowl-shaped string instrument, similar to a lyre, is played in Eritrea?","Krar","Kora","Sitar","Banjo","The krar usually has five or six strings, and it is played to go along with singing and dancing at celebrations."],["words","Tigrinya, Eritrea's main language, is written in which script?","Ge'ez","Latin","Cyrillic","Tifinagh","Each Ge'ez letter stands for a whole syllable, like ba or mi, and there are over 200 letters to learn!"],["nature","Which spiny cactus fruit, called beles, do people in Eritrea snack on in summer?","Prickly pear","Dragon fruit","Kiwano","Star fruit","Street sellers peel the spiky fruits with a knife so you don't get prickled, then you eat the sweet, seedy inside."],["life","Which sport is hugely popular in Eritrea, with races through the streets of Asmara?","Cycling","Cricket","Ice hockey","Baseball","In 2024 Eritrean rider Biniam Girmay won the green jersey at the Tour de France, and huge crowds welcomed him home."]],"SZ":[["food","Which thick sour milk, often mixed with maize porridge, is loved in Eswatini?","Emasi","Lassi","Kefir","Ayran","Milk is left to ferment until thick and tangy, then mixed with crumbly maize porridge for a filling meal."],["party","Which sacred ceremony around December, often called the first fruits festival, is Eswatini's most important?","Incwala","Homowo","Timkat","Durbar","Men in traditional dress sing and dance for days, and the king tastes the first fruits of the new harvest season."],["arts","What is the bright printed cloth wrapped around the body in traditional Swazi dress called?","Emahiya","Kente","Sari","Kimono","Men and women both wear emahiya, often with red patterns, and men may carry a stick or shield at big ceremonies."],["words","How do you say thank you in siSwati, Eswatini's language?","Ngiyabonga","Asante","Merci","Obrigado","SiSwati is a close cousin of Zulu, so people from Eswatini and South Africa can often understand each other."],["nature","Sibebe, near Mbabane, is one of the biggest of what kind of giant natural rock in the world?","Granite dome","Sandstone arch","Salt dome","Ice cave","Its rock is about 3 billion years old, and hikers can climb its smooth grey slopes for a view over the green hills."],["life","What was Eswatini's name until 2018?","Swaziland","Basutoland","Zululand","Bechuanaland","The king changed it on the country's 50th birthday. Eswatini is the siSwati name and means land of the Swati."]],"ET":[["food","Which tiny grain is used to make injera, Ethiopia's spongy sourdough flatbread?","Teff","Quinoa","Rice","Barley","Teff seeds are so small that about 150 of them weigh the same as a single grain of wheat!"],["party","At which Ethiopian festival in January do priests carry holy tablets and splash crowds with blessed water?","Timkat","Holi","Songkran","Carnival","Timkat celebrates the baptism of Jesus. People dress in white, and in Gondar some jump into a big stone pool."],["arts","In which Ethiopian dance do dancers bounce and shake their shoulders very fast?","Eskista","Kizomba","Tanoura","Haka","Eskista dancers move their shoulders, neck and chest to the beat while keeping their feet almost still."],["words","Which Amharic word, meaning peace, is used to say hello in Ethiopia?","Selam","Jambo","Mbote","Sawubona","Ethiopia has more than 80 languages! Amharic is used across the country, and Oromo is spoken by the most people."],["nature","Which grass-eating monkey with a red heart-shaped patch on its chest lives only in Ethiopia?","Gelada","Mandrill","Proboscis monkey","Capuchin","Geladas live in huge groups in the Simien Mountains and sleep on cliff ledges at night to stay safe."],["life","What is special about the old churches of Lalibela in Ethiopia?","Carved from solid rock","Built on stilts","Made of mud brick","Covered in gold","Workers carved them down into the ground about 800 years ago. The Church of St George is shaped like a giant cross."]],"GA":[["food","What is Gabon's national dish of chicken cooked in a palm nut sauce?","Poulet nyembwe","Doro wat","Jollof rice","Bobotie","Nyembwe sauce is made from the orange pulp of palm nuts and is often served with rice or sticks of cassava."],["party","Gabon celebrates its Independence Day in which month, with parades and music in Libreville?","August","January","April","December","The big day is 17 August. People wave flags of green, yellow and blue, standing for forest, sunshine and sea."],["arts","Which Fang instrument from Gabon is a long stick harp played by storytellers?","Mvet","Kora","Balafon","Krar","Mvet players are storytellers too, and one performance of an old adventure tale can last all night long!"],["words","Gabon's official language is French. How do you say thank you in French?","Merci","Gracias","Obrigado","Danke","Gabon also has around 40 local languages, like Fang, Myene and Punu, often spoken at home with grandparents."],["nature","Gabon's Lope National Park has record-breaking groups of which colourful monkey?","Mandrills","Geladas","Snub-nosed monkeys","Howler monkeys","Mandrill groups there can have over 800 members, and the grown-up males have bright red and blue faces."],["life","Which goal-scoring football star, who played for Arsenal, is from Gabon?","Pierre-Emerick Aubameyang","Didier Drogba","Sadio Mane","Samuel Eto'o","He loves wearing superhero masks to celebrate goals, and he was named African Footballer of the Year in 2015."]],"GM":[["food","What is the Gambia's national dish, a rich stew made with peanut butter?","Domoda","Ndole","Egusi soup","Moambe","Domoda is served over rice. Peanuts, called groundnuts there, have long been one of the Gambia's most important crops."],["party","Which masked figure, covered in reddish tree bark and leaves, appears at some Gambian ceremonies?","Kankurang","Egungun","Zangbeto","Lion dancer","The Kankurang is a Mandinka tradition. It watches over young people and is believed to chase away bad spirits."],["arts","Which 21-string harp made from a big calabash gourd is played by griots in the Gambia?","Kora","Balafon","Krar","Banjo","Griots are musicians and storytellers who keep history alive in songs, passing them down for hundreds of years."],["words","Which Wolof phrase is used to ask How are you? in the Gambia?","Nanga def","Hakuna matata","Mbote","Selam","A friendly reply is Mangi fi rek, which means I am just here, a polite way of saying I'm fine."],["nature","Which great apes live free on the Baboon Islands in the River Gambia?","Chimpanzees","Gorillas","Orangutans","Bonobos","Rescued chimps were brought to the islands to learn to live wild again, and now chimps born there live on them too."],["life","What mysterious ancient monuments can be found at Wassu in the Gambia?","Stone circles","Pyramids","Rock-cut churches","Giant statues","The circles are over 1,000 years old and made of carved stone pillars, some taller than a grown-up."]],"GH":[["food","Ghana and Nigeria have a friendly contest over who makes the best version of which dish?","Jollof rice","Paella","Biryani","Risotto","Jollof is rice cooked in a spicy tomato and pepper sauce, and the jollof wars are a running joke online and at parties."],["party","What is the Ga people's harvest festival in Accra, whose name means hooting at hunger?","Homowo","Timkat","Umhlanga","Durbar","People sprinkle a special corn dish called kpokpoi around town for their ancestors, then share it with everyone."],["arts","Which Ghanaian symbols, like Gye Nyame, are printed on cloth and each have a special meaning?","Adinkra","Hieroglyphs","Runes","Kanji","Craftspeople stamp the symbols with carved pieces of calabash dipped in a dark dye made from tree bark."],["words","Which Twi word do Ghanaians say to welcome visitors?","Akwaaba","Karibu","Aloha","Sawubona","You will see Akwaaba on signs at the airport and in shops, because Ghanaians are famous for their warm welcome."],["nature","In Ghana's Kakum National Park, visitors walk high above the rainforest on what?","Rope bridges","Glass bridges","Cable cars","Hot-air balloons","The canopy walkway hangs about 40 metres up among the treetops, where monkeys and colourful birds live."],["life","Which ancient board game with 12 pits and 48 seeds is played across Ghana?","Oware","Chess","Go","Backgammon","Players sow seeds around the board, one per pit, and try to capture more than 24 seeds to win."]],"GN":[["food","Which tiny ancient grain, one of the oldest in Africa, is grown in Guinea's highlands?","Fonio","Quinoa","Teff","Spelt","Guinea grows more fonio than any other country. It grows well in poor soil and cooks in just a few minutes."],["party","What do people in Guinea call Eid al-Adha, the big festival when meat is shared with neighbours?","Tabaski","Diwali","Hanukkah","Timkat","People put on new clothes, pray together, then visit relatives and share the meat with neighbours and people in need."],["arts","Which goblet-shaped hand drum, now played all over the world, comes from Guinea and its neighbours?","Djembe","Bongos","Tabla","Taiko","Its name is said to come from a saying meaning everyone gather together in peace. One drum can make deep and sharp sounds."],["words","Which alphabet for Manding languages was invented in Guinea in 1949?","N'Ko","Tifinagh","Ge'ez","Cyrillic","Solomana Kante created N'Ko, which means I say. It is written from right to left, like Arabic."],["nature","In Bossou, Guinea, wild chimpanzees are famous for using what to crack open nuts?","Stones","Their teeth","Sticks","Their feet","The chimps put a palm nut on a flat stone and hit it with another, and young chimps learn by watching for years."],["life","Guinea has the world's biggest supply of bauxite. Which metal is made from it?","Aluminium","Copper","Iron","Gold","That means some drink cans and kitchen foil around the world may have started as rock dug up in Guinea!"]],"GW":[["food","Guinea-Bissau is one of the world's biggest growers of which nut?","Cashew","Almond","Walnut","Hazelnut","Each cashew nut grows under a juicy fruit called a cashew apple, which is eaten fresh or made into juice."],["party","Which festival in Bissau features dancers in masks shaped like bulls, sharks and other animals?","Carnival","Timkat","Homowo","Diwali","Groups from different regions and islands bring their own dances, music and masks to the big parade in the capital."],["arts","Which lively style of music, played with drums and singing, is Guinea-Bissau's best known?","Gumbe","Makossa","Highlife","Morna","Gumbe songs are usually sung in Kriol, and people dance to them at parties and festivals all over the country."],["words","Which language do most people in Guinea-Bissau use to chat with each other?","Kriol","Swahili","Afrikaans","Lingala","Portuguese is official, but Kriol mixes Portuguese words with African languages and helps over 20 groups understand each other."],["nature","Which gentle sea cow swims in the rivers and mangroves of Guinea-Bissau?","West African manatee","Walrus","Sea lion","Dugong","Manatees munch on water plants for hours each day and can weigh over 400 kilograms, yet they are very gentle."],["life","Guinea-Bissau's football team is nicknamed the Djurtus. What animal is a djurtu?","African wild dog","Lion","Eagle","Elephant","African wild dogs hunt as a team and share their food. The team first played at the Africa Cup of Nations in 2017."]],"CI":[["food","Which Ivorian side dish looks like couscous but is made from cassava?","Attieke","Fufu","Ugali","Injera","In 2024, the skill of making attieke joined UNESCO's list of world treasures. It is often served with grilled fish and onions."],["party","Which week-long festival of the N'zima people in Grand-Bassam is full of drums and dancing?","Abissa","Homowo","Timkat","Umhlanga","During Abissa, people can poke fun at anyone, even chiefs, to clear the air before the new year begins."],["arts","In which Ivorian mask dance do the dancer's feet move so fast they almost blur?","Zaouli","Eskista","Kizomba","Tanoura","The Zaouli dancer wears a colourful mask and costume, and moves in time with drums and flutes. It comes from the Guro people."],["words","What is the fun mix of French and local words spoken by young people in Abidjan called?","Nouchi","Camfranglais","Kriol","Sango","Nouchi words keep changing, and some, like enjailler, meaning to have fun, are now used across French-speaking Africa."],["nature","Which small, shy cousin of the hippo lives in the Tai Forest of Ivory Coast?","Pygmy hippo","Tapir","Capybara","Warthog","Pygmy hippos weigh about a tenth as much as big hippos, and they hide in the forest by day and come out at night."],["life","Which giant building in Yamoussoukro is said to be the largest church in the world?","Our Lady of Peace Basilica","Hassan II Mosque","Great Mosque of Djenne","Church of St George","Its huge dome can be seen from far away, and it has around 7,000 square metres of stained glass windows!"]],"KE":[["food","Which dish of grilled meat, often goat, is a favourite at Kenyan get-togethers?","Nyama choma","Biltong","Bobotie","Doro wat","Nyama choma means roasted meat in Swahili. It is often shared with ugali and a fresh tomato salad called kachumbari."],["party","Which animals race through the streets at the Lamu Cultural Festival, since cars are rare on Lamu island?","Donkeys","Camels","Ostriches","Horses","Lamu town has narrow lanes where donkeys carry loads. The festival also has races of dhows, wooden sailing boats."],["arts","In the Maasai adumu dance, what do the young warriors do?","Jump very high","Spin in circles","Walk on stilts","Twirl long ribbons","They take turns leaping straight up while the others sing, and the highest jumpers win the most admiration."],["words","Which Swahili phrase, made famous by The Lion King, means no worries?","Hakuna matata","Asante sana","Karibu sana","Habari gani","Lots of Lion King names are Swahili: Simba means lion, rafiki means friend and pumbaa can mean silly."],["nature","Which pink birds gather in huge flocks on Kenya's Rift Valley lakes, like Bogoria and Nakuru?","Flamingos","Parrots","Peacocks","Pink pigeons","They get their pink colour from the tiny algae and shrimp they eat, and a flock can turn a whole lake shore pink."],["life","Which way of paying with a mobile phone was launched in Kenya in 2007?","M-Pesa","PayPal","Apple Pay","Venmo","Pesa means money in Swahili. Millions of Kenyans send money by text message, even to buy a snack!"]],"LS":[["food","What is the stiff maize porridge eaten with most meals in Lesotho called?","Papa","Injera","Couscous","Jollof rice","Papa is rolled into a ball with your fingers and dipped into meat stew or moroho, a dish of cooked leafy greens."],["party","Which holiday each March honours the king who founded the Basotho nation in Lesotho?","Moshoeshoe Day","Shaka Day","Mandela Day","Sobhuza Day","King Moshoeshoe I gathered his people on the flat-topped mountain Thaba Bosiu. Today there are horse races, songs and speeches."],["arts","What is the cone-shaped straw hat that appears on Lesotho's flag called?","Mokorotlo","Fez","Sombrero","Kufi","Its pointy shape is said to copy Qiloane, a cone-shaped hill. Many people also wear colourful, warm Basotho blankets."],["words","How do you say hello to one person in Sesotho, the language of Lesotho?","Lumela","Jambo","Sawubona","Molo","To greet a whole group you say Lumelang instead. Almost everyone in Lesotho speaks Sesotho."],["nature","Which waterfall in Lesotho plunges about 190 metres into a gorge in one single drop?","Maletsunyane Falls","Victoria Falls","Tugela Falls","Murchison Falls","It is one of the highest single-drop waterfalls in Africa, and in very cold winters it can partly freeze into ice!"],["life","Which sturdy animal do many people in Lesotho ride along steep mountain paths?","Basotho pony","Camel","Llama","Yak","Basotho ponies are tough and sure-footed on rocky slopes. Riders often wrap a thick blanket around their shoulders like a cape."]],"LR":[["food","Which rich, orange-red Liberian stew is made from palm nuts and eaten with rice?","Palm butter","Egusi soup","Gumbo","Bobotie","Rice is so loved in Liberia that many people feel they have not had a proper meal until they have eaten some rice!"],["party","Liberia became Africa's first republic in 1847. On which date is its Independence Day?","26 July","4 July","6 March","1 October","People wave red, white and blue flags, watch parades and dress up in their best clothes to celebrate."],["arts","What is the name of Liberia's own style of hip hop, rapped in Liberian English?","Hipco","Afrobeat","Kwaito","Bongo Flava","Hipco songs often tell stories about everyday life, using fun Liberian English words and phrases that everyone knows."],["words","Which people of Liberia invented their own writing script in the 1830s?","The Vai","The Zulu","The Maasai","The Ashanti","The Vai script was created by Momolu Duwalu Bukele. It has around 200 symbols, each standing for a whole syllable."],["nature","Which shy animal from Liberia's rainforests looks like a hippo, but much smaller?","Pygmy hippo","Okapi","Tapir","Capybara","It is about the size of a big pig. It hides in the forest by day and comes out at night to munch on plants."],["life","Which Liberian footballer is the only African player to win the Ballon d'Or?","George Weah","Didier Drogba","Samuel Eto'o","Mohamed Salah","He won it in 1995 while playing for AC Milan, and many years later he became President of Liberia."]],"LY":[["food","Which Libyan dish is a smooth dome of barley dough served in a spicy tomato sauce?","Bazeen","Tagine","Shakshuka","Ful medames","Bazeen is shared from one big plate, often with eggs and potatoes around it. People pinch off pieces with their right hand."],["party","Before a Libyan wedding, the bride's hands are decorated with patterns using which plant dye?","Henna","Indigo","Saffron","Turmeric","The henna night is a big party for women, full of music and singing, with the bride in a sparkly traditional outfit."],["arts","Which style of old Andalusian music, played with oud and drums, is loved in Libya?","Malouf","Flamenco","Rai","Gnawa","Malouf came across the sea from Andalusia in Spain centuries ago. Groups sing long poems in Arabic together."],["words","Libya's main language is Arabic. Which direction is Arabic written in?","Right to left","Left to right","Top to bottom","Bottom to top","Arabic letters join up like joined-up handwriting, and many letters change shape depending on where they sit in a word."],["nature","Which salty, palm-fringed lakes lie hidden among giant sand dunes in Libya's Sahara?","Ubari Lakes","Lake Chad","Lake Nasser","Lake Victoria","The lakes are much saltier than the sea, so swimmers float easily. Date palms grow all around them in the sand."],["life","Which old desert town in Libya, called the Pearl of the Desert, has cool covered streets?","Ghadames","Timbuktu","Marrakesh","Petra","Its whitewashed houses are joined together, and long ago women walked between them on their own paths across the rooftops."]],"MG":[["food","What is Madagascar's national dish, a stew of beef and leafy greens?","Romazava","Bobotie","Feijoada","Goulash","It often includes paracress, a herb whose flowers make your tongue tingle! It is served with rice, which many people eat three times a day."],["party","On the night before Madagascar's Independence Day, what do children carry through the streets?","Paper lanterns","Flower crowns","Kites","Painted eggs","Independence Day is on 26 June. The night before, streets glow with lanterns, and there are fireworks and parades."],["arts","Which tube-shaped instrument made from bamboo is the national instrument of Madagascar?","Valiha","Kora","Mbira","Sitar","Strings are stretched all the way around the bamboo tube, and players pluck them with their fingers, a bit like a harp."],["words","The Malagasy language is most closely related to languages spoken on which island?","Borneo","Sicily","Iceland","Cuba","Sailors crossed the Indian Ocean from Southeast Asia over 1,000 years ago and brought their language to Madagascar."],["nature","Which giant trees, with trunks shaped like bottles, line a famous avenue in Madagascar?","Baobabs","Redwoods","Oaks","Banyans","Six kinds of baobab grow wild only in Madagascar. Their thick trunks store water to help them survive the dry season."],["life","Which sport is a huge favourite in Madagascar, where the national team is called the Makis?","Rugby","Cricket","Baseball","Ice hockey","Maki is the local name for the ring-tailed lemur. Big matches can pack the stadium in Antananarivo with cheering fans."]],"MW":[["food","Which tasty fish from Lake Malawi is a favourite meal across Malawi?","Chambo","Salmon","Cod","Tuna","Chambo is often grilled or fried and eaten with nsima, a thick maize porridge that you roll into balls with your hand."],["party","Which music festival has been held on the sandy shores of Lake Malawi?","Lake of Stars","Glastonbury","Coachella","Tomorrowland","Musicians from Malawi and around the world play on stages near the water, and people dance under the starry sky."],["arts","What is the name of the Chewa people's famous masked dance in Malawi?","Gule Wamkulu","Haka","Indlamu","Adumu","Gule Wamkulu means the great dance. Dancers wear carved masks and costumes made of straw, cloth and feathers."],["words","How do you say thank you in Chichewa, Malawi's most widely spoken local language?","Zikomo","Asante","Ngiyabonga","Merci","To say thank you very much, Malawians say zikomo kwambiri. Zikomo can also mean excuse me."],["nature","Which tree, growing wild only on Mount Mulanje, is Malawi's national tree?","Mulanje cedar","Baobab","Jacaranda","Cedar of Lebanon","Mount Mulanje rises so high above the plains that its top is often in the clouds. People call it the island in the sky."],["life","Which board game, played by moving seeds around four rows of holes, is popular in Malawi?","Bawo","Chess","Go","Backgammon","Bawo is a kind of mancala game. Players scoop up seeds or pebbles and sow them one by one into the holes of a wooden board."]],"ML":[["food","Which drink do people in Mali brew strong, pour from high up and serve in three rounds?","Green mint tea","Coffee","Hot chocolate","Ginger beer","Pouring from high up makes a frothy top. Sharing all three little glasses can take hours of friendly chatting."],["party","Which yearly festival is held each February on the river banks in Ségou, Mali?","Festival on the Niger","Lake of Stars","Carnival of Venice","Felabration","Musicians from all over Africa play on stages beside the Niger River, and there are art and craft markets too."],["arts","Which Malian cloth gets its dark patterns from being painted with fermented mud?","Bogolan","Kente","Batik","Tartan","The cloth is first dyed with leaves, then painted with river mud. Each pattern can have a meaning or tell a story."],["words","In Bambara, Mali's most spoken language, how do people say hello?","I ni ce","Jambo","Sawubona","Akwaaba","Greetings in Mali are long and friendly. People ask about your health, your home and your relatives before anything else."],["nature","Which big animals in Mali walk a huge loop through the desert edge every year to find water?","Elephants","Giraffes","Rhinos","Zebras","The desert elephants of Gourma make one of the longest yearly journeys of any elephants on Earth, moving from lake to lake."],["life","Which king of old Mali is often called one of the richest people who ever lived?","Mansa Musa","Shaka Zulu","Tutankhamun","Haile Selassie","On his journey to Mecca in 1324 he gave away so much gold in Cairo that its price there dropped for years."]],"MR":[["food","Milk from which animal is a favourite drink in Mauritania?","Camel","Yak","Reindeer","Water buffalo","A dairy in Nouakchott was one of the first in the world to make cheese from camel milk, and sold it in shops!"],["party","What is the summer date-harvest season in Mauritania's oases called, when relatives gather to feast?","Guetna","Diwali","Hanami","Songkran","During the Guetna, people camp among the palm trees in towns like Atar, eating fresh dates, chatting and playing music."],["arts","Which small lute is played by male griot musicians in Mauritania?","Tidinit","Banjo","Balalaika","Ukulele","Women griots play the ardin, a big harp made from a gourd, while the men play the tidinit. Together they sing old poems."],["words","What is the name of the kind of Arabic spoken in Mauritania?","Hassaniya","Darija","Egyptian Arabic","Maltese","Hassaniya is also spoken by desert peoples in nearby countries, and poets love to recite verses in it."],["nature","Which national park on Mauritania's coast hosts millions of birds flying in from Europe?","Banc d'Arguin","Serengeti","Kruger","Etosha","Local Imraguen fishermen work together with wild dolphins, which help chase mullet fish towards their nets."],["life","Which desert town in Mauritania is famous for old libraries full of handwritten books?","Chinguetti","Ghadames","Agadez","Marrakesh","Some books in Chinguetti's libraries are centuries old and are kept in wooden chests to protect them from sand."]],"MU":[["food","Which Mauritian street snack is a soft flatbread filled with ground yellow split peas?","Dholl puri","Naan","Tortilla","Injera","Dholl puri is served with bean curry and chutney. They often come in pairs wrapped in paper, and are best eaten warm!"],["party","During which festival do many Mauritians walk to the holy lake of Grand Bassin?","Maha Shivaratri","Diwali","Chinese New Year","Christmas","Pilgrims carry kanwars, colourful arches made of bamboo, flowers and mirrors, and many walk through the night."],["arts","Which Mauritian music and dance is played with a big, flat drum called the ravanne?","Sega","Samba","Salsa","Tango","Sega dancers sway their hips and shuffle their feet. Players warm the ravanne by a fire to tighten its goatskin."],["words","How do you ask how are you in Mauritian Creole?","Ki manier?","Como estas?","Habari gani?","Wie gehts?","Most Mauritians speak Creole at home. Its words mostly come from French, mixed with words from India, Africa and Madagascar."],["nature","Which rare bird, once down to about ten in the wild, lives only in Mauritius?","Pink pigeon","Kakapo","Flamingo","Puffin","Scientists bred them carefully and set them free, so now there are hundreds flying in the island's forests."],["life","Which place in Mauritius has rolling sand dunes striped in seven colours?","Chamarel","Sossusvlei","Wadi Rum","Uluru","The colours come from volcanic rock that broke down into red, brown, purple and blue sands that stay in stripes."]],"MA":[["food","Which Moroccan stew is named after the clay pot with a cone-shaped lid it is cooked in?","Tagine","Paella","Goulash","Biryani","The cone lid catches steam and drips it back down, keeping the food soft. Many tagines mix meat with prunes or olives."],["party","In Kelaat M'Gouna, Morocco, people hold a festival each spring to celebrate which harvest?","Roses","Tulips","Cherries","Lavender","The petals are turned into sweet-smelling rose water. A Rose Queen is chosen, and there are parades and dancing."],["arts","What is Morocco's colourful mosaic art, made from small hand-cut tiles, called?","Zellige","Azulejo","Origami","Batik","Craftsmen chip each tiny tile by hand and fit them together into star patterns. Some designs use thousands of pieces."],["words","Which ancient alphabet, used to write Berber languages, appears on signs in Morocco?","Tifinagh","Cyrillic","Hangul","Devanagari","One Tifinagh letter looks like a little person with arms raised. It is a proud symbol of the Amazigh people."],["nature","Which animals climb up argan trees in Morocco to munch on the fruit?","Goats","Sheep","Camels","Donkeys","Argan nuts are pressed to make a precious oil used in cooking and on hair. The trees grow mainly in southwest Morocco."],["life","At the 2022 World Cup, Morocco became the first African team to reach which stage?","The semi-finals","The final","The quarter-finals","The round of 16","Players celebrated by hugging their mums on the pitch, and fans danced in the streets all across Morocco."]],"MZ":[["food","Which Mozambican dish is made from cassava leaves cooked with peanuts and coconut milk?","Matapa","Bobotie","Jollof rice","Couscous","Matapa is often served with rice or xima, a stiff maize porridge, and sometimes cooked with crab or prawns."],["party","At the M'Saho festival in Mozambique, Chopi orchestras play which wooden instruments?","Timbila","Steel drums","Bagpipes","Kora","Timbila are xylophones with gourds under the wooden keys. Big orchestras play while dancers move to the music."],["arts","What is the bright cloth that women in Mozambique wrap as a skirt or use to carry babies?","Capulana","Kimono","Sari","Kilt","Capulanas come in bold patterns and are also used as headscarves, tablecloths and even beach towels!"],["words","Mozambique's official language is Portuguese. How do you say thank you in it?","Obrigado","Gracias","Merci","Asante","Mozambicans also speak over 40 local languages, like Makhuwa and Changana. Portuguese helps everyone understand each other."],["nature","Which Mozambique national park has lions, elephants and a mountain with rainforest on top?","Gorongosa","Serengeti","Kruger","Etosha","Mount Gorongosa catches rain clouds, and water flowing down its slopes fills the rivers and lake in the park below."],["life","Which small island with old stone buildings gave the country of Mozambique its name?","Mozambique Island","Zanzibar","Madagascar","Mauritius","It is only about 3 km long but has a little chapel from 1522, said to be the oldest European building south of the equator."]],"NA":[["food","What do Namibians call strips of spicy beef grilled and sold at busy street stalls?","Kapana","Suya","Satay","Churrasco","At kapana markets you pick your meat straight off the grill and dip it into a mix of salt and chilli before eating."],["party","Namibia's capital holds a yearly carnival first brought by German settlers. What is it called?","Karneval","Fiesta","Mardi Gras","Junkanoo","The Windhoek Karneval started in 1953 and has parades, music, floats and people dressed up in fancy costumes."],["arts","Herero women in Namibia wear long, colourful dresses and a hat shaped like what?","Cow horns","A crown","A boat","A flower","Cattle are very important to the Herero. The hats are made from rolled-up cloth, often matching the dress."],["words","Which special sounds are used in Namibian languages like Khoekhoe and written with signs like the exclamation mark?","Click sounds","Whistled sounds","Sung sounds","Humming sounds","A ! stands for a sharp pop made by pulling your tongue down from the roof of your mouth. Khoekhoe has four kinds of click."],["nature","Which strange Namibian desert plant grows just two leaves and can live over 1,000 years?","Welwitschia","Baobab","Saguaro cactus","Aloe vera","Its two leaves keep growing all its life and get torn into ribbons by the wind. It even appears on Namibia's coat of arms."],["life","The Hoba, lying in the ground where it landed in Namibia, is the world's biggest known what?","Meteorite","Diamond","Fossil","Crystal","It weighs around 60 tonnes and is mostly iron. It is so heavy that it has never been moved from where it fell."]],"NE":[["food","Which spicy dried meat, a thin and crispy kind of jerky, is a favourite snack in Niger?","Kilishi","Biltong","Prosciutto","Pemmican","Thin slices of meat are dried in the sun, coated in a paste of peanuts and spices, then roasted over a fire."],["party","At which yearly gathering in Ingall, Niger, do herders bring their animals to salty pastures?","Cure Salée","Timkat","Fantasia","Ngondo","After the rains, camels and cattle feed on salty grass. There are camel races, music and dances by the Wodaabe and Tuareg."],["arts","Which famous silver pendant is made by Tuareg silversmiths in Niger?","Agadez cross","Celtic knot","Ankh","Claddagh ring","There are many different Tuareg crosses, each named after a town or oasis. They are often given as special gifts."],["words","How do Hausa speakers in Niger say hello?","Sannu","Jambo","Lumela","Sawubona","Hausa is the most widely spoken language in Niger and is understood by tens of millions of people across West Africa."],["nature","Which rare, pale desert antelope with long twisting horns survives in Niger?","Addax","Springbok","Impala","Kudu","Addax hardly ever need to drink. They get water from the plants they eat and can live in the hottest sand seas."],["life","Which sport is a huge favourite in Niger, with a big national championship each year?","Traditional wrestling","Cricket","Ice hockey","Baseball","Wrestlers from every region compete. Crowds cheer, drummers play and the champion becomes a national star."]],"NG":[["food","Which tomato-red rice dish do Nigeria and Ghana playfully argue about making best?","Jollof rice","Paella","Biryani","Risotto","Jollof is cooked in a sauce of tomato, pepper and onion. Party jollof gets a smoky taste from the bottom of the pot."],["party","At Nigeria's Argungu Festival, crowds jump into a river to do what?","Catch fish","Swim a race","Search for pearls","Throw coloured powder","Thousands of fishermen leap in with nets and gourds, and whoever catches the biggest fish wins a prize."],["arts","Which hourglass-shaped Yoruba drum in Nigeria can copy the sounds of speech?","Talking drum","Djembe","Bongo","Tabla","Players squeeze the strings on its sides to change the pitch, so it can copy the rise and fall of Yoruba words."],["words","Roughly how many languages are spoken in Nigeria?","More than 500","About 5","About 20","About 50","The three biggest are Hausa, Yoruba and Igbo, and English helps people from different areas talk to each other."],["nature","Which very rare kind of gorilla lives in the hilly forests along Nigeria's border with Cameroon?","Cross River gorilla","Mountain gorilla","Eastern lowland gorilla","Western lowland gorilla","Only around 300 are left, and they are so shy that even scientists who study them hardly ever see one."],["life","Which giant rock near Abuja appears on Nigeria's 100 naira banknote?","Zuma Rock","Uluru","Sugarloaf Mountain","Table Mountain","Zuma Rock towers about 300 metres above the land. Some people say it looks like it has a face with eyes and a mouth!"]],"CG":[["food","Which Congolese bread made from cassava is steamed while wrapped in leaves?","Chikwangue","Naan","Injera","Baguette","Cassava roots are soaked, pounded and wrapped in leaves before cooking, so chikwangue stays good for days."],["party","Which big Pan-African music festival is held in Brazzaville?","FESPAM","Lake of Stars","Felabration","Sauti za Busara","Musicians from all over Africa come to play, and the festival celebrates Congolese rumba and many other styles."],["arts","What are the stylish Congolese dressers who wear bright suits and shiny shoes called?","Sapeurs","Mods","Cowboys","Samurai","Sapeurs show off colourful suits, hats and ties, and strut through Brazzaville's streets as if they were on a catwalk."],["words","How do you say hello in Lingala, spoken in the Republic of the Congo?","Mbote","Jambo","Sannu","Lumela","Lingala is the language of many famous Congolese rumba songs, so people all over Africa know some Lingala words."],["nature","Which monkey with a bright red and blue face lives in the Republic of the Congo's forests?","Mandrill","Gelada","Proboscis monkey","Golden snub-nosed monkey","Mandrills are the biggest monkeys in the world, and the grown-up males have the brightest colours of all."],["life","Brazzaville sits right across the Congo River from which other capital city?","Kinshasa","Luanda","Libreville","Yaoundé","Apart from Rome and Vatican City, they are the two closest capital cities in the world. People cross by boat."]],"RW":[["food","What is ikivuguto, a drink that is loved in Rwanda?","Thick fermented milk","Sugarcane juice","Hot ginger tea","Coconut water","Cows are very special in Rwanda. One old greeting even wishes that you may own great herds of cattle!"],["party","What is Rwanda's harvest festival, held each August, called?","Umuganura","Homowo","Incwala","Thanksgiving","People share the first sorghum and millet of the harvest, and celebrate with songs, dances and big meals."],["arts","What unusual material is used to make imigongo, Rwanda's black and red patterned art?","Cow dung","Clay","Seashells","Banana leaves","The dung is shaped into swirls and zigzags, then painted with natural colours. Once it dries it does not smell at all!"],["words","How do you say hello in Kinyarwanda?","Muraho","Jambo","Mbote","Sawubona","Almost everyone in Rwanda speaks Kinyarwanda, which is rare in Africa, where most countries have many languages."],["nature","Which apes are given names at Rwanda's yearly Kwita Izina ceremony?","Mountain gorillas","Orangutans","Bonobos","Gibbons","Each baby gorilla born in Volcanoes National Park gets a name, often chosen by special guests, at a joyful ceremony."],["life","Rwanda was the first country to use what to fly blood supplies to hospitals?","Drones","Hot-air balloons","Motorbikes","Paper planes","Since 2016, small Zipline drones have zoomed over the hills and dropped packages by parachute to hospitals."]],"ST":[["food","Around 1900, São Tomé and Príncipe grew more of which crop than any other country?","Cocoa","Tea","Rice","Wheat","Today some chocolate makers turn the beans into bars right there, and people call the islands the Chocolate Islands."],["party","Each August on Príncipe island, the whole town joins in the Auto de Floripes. What is it?","A street play","A boat race","A kite contest","A food fair","The town of Santo António becomes one big stage for an old tale of knights, with drums, music and colourful costumes."],["arts","Tchiloli, São Tomé's famous street theatre, tells an old story from which continent?","Europe","Asia","South America","Australia","It tells a tale from the court of Emperor Charlemagne, with actors in masks, capes and crowns, moving to flutes and drums."],["words","Forro, the main local language of São Tomé, is a creole mostly based on which language?","Portuguese","Spanish","French","English","Forro mixes Portuguese words with words from African languages, and it has been spoken on the island for about 500 years."],["nature","Which bird, the biggest of all sunbirds, lives only on the island of São Tomé?","Giant sunbird","Bald eagle","Kingfisher","Peacock","It uses its long curved beak to sip nectar from flowers and catch insects high up in the rainforest trees."],["life","What relaxed saying sums up life on São Tomé and Príncipe, meaning take it easy?","Leve-leve","Hakuna matata","Pura vida","Pole pole","It means something like lightly-lightly. Nobody rushes on the islands, and people always find time to stop and chat."]],"SN":[["food","What is Senegal's national dish of fish and rice cooked in a tomato sauce with vegetables?","Thieboudienne","Paella","Biryani","Bobotie","The crispy rice stuck to the bottom of the pot, called xoon, is a treat that many people love most of all."],["party","What do people in Senegal call Eid al-Adha, when relatives share a big sheep feast?","Tabaski","Nowruz","Diwali","Timkat","People dress in brand-new clothes, visit neighbours and say Baal ma aq to ask forgiveness for anything unkind."],["arts","Which lively Senegalese music, made famous by Youssou N'Dour, uses sabar drums?","Mbalax","Highlife","Reggae","Rai","Sabar drums are played with one hand and one stick, and dancers kick their legs fast to the drumbeat."],["words","Which Wolof word for warm welcome and kindness is Senegal's proud nickname?","Teranga","Ubuntu","Aloha","Hygge","The national football team is called the Lions of Teranga, and guests are always offered food and a seat."],["nature","Which big cat is Senegal's national animal?","Lion","Leopard","Cheetah","Tiger","A few West African lions still live in Niokolo-Koba National Park, and a lion appears on Senegal's coat of arms."],["life","Which giant statue in Dakar is even taller than the Statue of Liberty?","African Renaissance Monument","Christ the Redeemer","Spring Temple Buddha","The Little Mermaid","The bronze statue is about 49 metres tall and shows a man, a woman and a child looking out to sea from a hill."]],"SC":[["food","What is ladob, a favourite sweet dish in Seychelles?","Plantain in coconut milk","Fried fish cakes","Mango ice cream","Rice pudding","Ripe plantain or breadfruit is cooked slowly in coconut milk with nutmeg, cinnamon and vanilla, which grow on the islands."],["party","Which October festival celebrates the music, food and Creole culture of Seychelles?","Festival Kreol","Mardi Gras","Oktoberfest","Junkanoo","There are street parades, art shows and dancing to moutya and sega music, and the Creole language is celebrated too."],["arts","Which slow, drum-filled dance is performed around a bonfire in Seychelles?","Moutya","Samba","Haka","Tango","Drummers warm their goatskin drums by the fire to tighten them. Long ago, moutya songs let people share their feelings."],["words","How many official languages does Seychelles have?","Three","One","Two","Five","They are Seychellois Creole, English and French. Most people speak Creole, called Kreol Seselwa, at home."],["nature","Which giant animal, often living over 100 years, roams Aldabra Atoll in Seychelles?","Giant tortoise","Komodo dragon","Elephant seal","Marine iguana","Around 100,000 giant tortoises live on Aldabra, more than anywhere else on Earth. Big ones weigh as much as a piano!"],["life","Which silver landmark in Victoria, the capital of Seychelles, is a copy of one in London?","Clock tower","Bridge","Ferris wheel","Stone gate","Locals call it Lorloz. Victoria is one of the smallest capital cities in the world, so you can easily walk across it."]],"SL":[["food","In Sierra Leone, what is a stew made with greens like cassava or potato leaves called?","Plasas","Callaloo","Egusi","Gumbo","Plasas is cooked with palm oil and fish or meat, and it is almost always served on a big plate of rice."],["party","At the end of Ramadan, Freetown in Sierra Leone holds a night parade of what?","Giant lanterns","Decorated boats","Kites","Elephants","Groups build huge glowing floats shaped like ships, animals and buildings, and parade them through the night streets."],["arts","What is the colourful tie-dyed cloth of Sierra Leone called?","Gara","Kente","Tartan","Bogolan","Gara is often dyed with indigo. The cloth is tied, stitched or folded before dyeing to make swirling patterns."],["words","How do people say hello in Krio, the language most Sierra Leoneans share?","Kushe","Mbote","Jambo","Muraho","Krio mixes English with words from African languages. To say thank you, people say tenki."],["nature","Which odd bird with a bald yellow head builds mud nests on rocks in Sierra Leone's forests?","White-necked rockfowl","Toucan","Shoebill","Hornbill","It sticks its cup-shaped mud nest onto rock walls in caves, and it hops along the forest floor instead of flying far."],["life","What is the nickname of Sierra Leone's national football team?","Leone Stars","Super Eagles","Black Stars","Bafana Bafana","The name comes from Sierra Leone, which is Portuguese for Lion Mountains, given by an explorer in 1462."]],"SO":[["food","Which Italian-style food do many Somalis enjoy eating with a banana on the side?","Pasta","Pizza","Risotto","Gelato","Somalis call it baasto and serve it with a spiced meat sauce. A bite of banana with each mouthful is a favourite!"],["party","What do people light during Dab-shid, the old Somali new year festival?","Bonfires","Fireworks","Lanterns","Candles","Dab-shid means lighting the fire. People jump over the flames for good luck to welcome the new year."],["arts","Somalia is often called a nation of what, because so many people love to recite their work?","Poets","Painters","Dancers","Sculptors","Somali poems are often learned by heart and recited aloud, and good poets become famous all across the country."],["words","In 1972, Somali was first officially written using which alphabet?","Latin alphabet","Cyrillic","Greek","Ge'ez","Before that, most poems and stories were passed on by speaking. Now Somali uses letters like the ones in this sentence."],["nature","Which sweet-smelling tree resin, a famous ancient gift, comes from Somalia?","Frankincense","Vanilla","Cinnamon","Maple syrup","Workers gently cut the tree bark, and the sap dries into little drops of resin, which are burned for their lovely smell."],["life","Which Somali-born singer wrote Wavin' Flag, a 2010 World Cup anthem?","K'naan","Akon","Shakira","Youssou N'Dour","K'naan grew up in Mogadishu. His song was sung by fans in many languages when the World Cup came to Africa."]],"ZA":[["food","Which Durban food is a hollowed-out loaf of bread filled with curry?","Bunny chow","Bobotie","Biltong","Boerewors","There is no rabbit in it! It was created by Indian South Africans in Durban, and you eat the bread lid with your hands."],["party","What is Tweede Nuwe Jaar, celebrated on 2 January in Cape Town, South Africa?","A minstrel carnival","A boat race","A kite festival","A food fair","Thousands of minstrels in shiny satin suits and hats sing, play banjos and dance through the streets of the city."],["arts","Ndebele women in South Africa are famous for painting bold patterns on what?","Their house walls","Canoes","Kites","Shields","Esther Mahlangu, a famous Ndebele artist, even painted her bright patterns all over a BMW car!"],["words","How many official languages does South Africa have?","12","2","5","20","South African Sign Language joined the list in 2023. The national anthem uses five languages in one song!"],["nature","Which leaping antelope is South Africa's national animal?","Springbok","Impala","Gazelle","Kudu","Springboks pronk: they bounce high into the air on stiff legs. The national rugby team is named after them."],["life","In 1967, a doctor in Cape Town carried out the world's first what?","Heart transplant","Kidney transplant","X-ray scan","Vaccine","Dr Christiaan Barnard led the operation at Groote Schuur Hospital, and the news amazed people all around the world."]],"SS":[["food","What thin, slightly sour pancake made from sorghum flour is eaten in South Sudan?","Kisra","Crepe","Tortilla","Chapati","Kisra batter is left to turn a little sour, then spread thin on a hot plate. It is eaten with stews like okra."],["party","On which date does South Sudan celebrate its Independence Day with music and dancing?","9 July","1 January","4 July","25 December","South Sudan became independent in 2011, which makes it the newest country in the world."],["arts","Young Dinka men in South Sudan often make up songs about which favourite animal?","Their ox","Their horse","Their camel","Their goat","A young man may take a name from the colours of his special ox, and he decorates its long horns with tassels."],["words","About how many languages are spoken in South Sudan?","More than 60","About 3","About 10","More than 400","Dinka and Nuer are spoken by the most people, and English is the official language used in schools."],["nature","Which huge grey bird with a giant shoe-shaped beak lives in South Sudan's swamps?","Shoebill","Pelican","Flamingo","Toucan","Shoebills stand still like statues for ages, then pounce on fish, frogs and even baby crocodiles."],["life","Which sport has made South Sudan famous, with very tall stars like Manute Bol?","Basketball","Rugby","Cricket","Tennis","The national team, the Bright Stars, played at the Olympic Games in 2024 for the very first time."]],"SD":[["food","Which flower is used to make karkade, Sudan's ruby-red drink?","Hibiscus","Rose","Lavender","Jasmine","Karkade is drunk hot in winter and icy cold in summer, and it tastes a little like sour cranberries."],["party","Every Friday in Omdurman, Sudan, crowds gather to watch Sufi dervishes do what?","Spin and dance","Race camels","Fly kites","Sail boats","Dancers in green and red robes spin, chant and drum to the beat as the sun goes down."],["arts","What is the long, colourful wrap that many Sudanese women wear over their cloth
