<title>Sum Racer</title>
<style>
/* Sum Racer on the Oomba Kit: answer maths questions to power your kart. Screens: the kit's title (a demo race drives
   behind it) -> track picker -> race (canvas race view + question panel; two halves in two-player mode) -> results
   (the kit's podium world behind the card). The kit's pause screen and settings; the practice-table picker is a kit
   card. Every button is at least 56px tall. Colours are the kit's (CSS variables --sr-* set at start, and the kit's
   --ok-* day/night variables); the font is the kit's. */
.sr{--rim:var(--sr-ink);--soft:color-mix(in srgb,var(--ok-text) 65%,transparent)}
.ok-night .sr{--rim:color-mix(in srgb,var(--sr-cream) 40%,transparent)}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.sr button{font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.sr .ok-btn{color:var(--sr-ink);--ok-icon-card:var(--sr-cream)}
.sr .ok-btn.ok-icon{width:56px;min-height:56px;flex:none}
.sr .ok-btn.ok-icon svg{width:28px;height:28px}
.sr svg{display:block}
.sr{position:fixed;inset:0}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.bgcanvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:800;background:var(--ok-card);color:var(--ok-text);border:2.5px solid var(--rim);box-shadow:0 3px 0 var(--sr-ink);
  border-radius:999px;padding:5px 14px 5px 8px;font-size:1rem;line-height:1.2}
.chip svg{width:22px;height:22px;flex:none}
.chip.good{background:var(--sr-mintTint);color:var(--sr-ink);border-color:var(--sr-ink)}
.chip.star{background:var(--sr-sparkTint);color:var(--sr-ink);border-color:var(--sr-ink)}
.chip.kindc{background:var(--sr-grapeTint);color:var(--sr-ink);border-color:var(--sr-ink)}
.signs{display:flex;gap:8px;justify-content:center}
.signs span{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:1.6rem;color:var(--sr-ink);border:2.5px solid var(--sr-ink);box-shadow:0 3px 0 var(--sr-ink)}

/* ---------- Track picker (over the demo race) ---------- */
.picker{flex-direction:column;justify-content:flex-start;overflow:hidden;background:linear-gradient(color-mix(in srgb,var(--ok-bg2) 82%,transparent),color-mix(in srgb,var(--ok-bg2) 35%,transparent))}
.pickHead{flex:none;width:100%;max-width:980px;display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 12px 6px;box-sizing:border-box}
.pickHead h2{flex:1;margin:0;text-align:center;font-size:1.8rem;font-weight:800;color:var(--sr-cream);-webkit-text-stroke:.12em var(--sr-ink);paint-order:stroke fill;text-shadow:0 .09em 0 var(--sr-ink)}
.pickBody{flex:1;min-height:0;width:100%;max-width:980px;overflow-y:auto;overflow-x:hidden;padding:6px 12px 22px;box-sizing:border-box}
.toggles{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.seg{flex:1 1 300px;display:flex;gap:6px;background:var(--ok-card);border:2.5px solid var(--rim);box-shadow:0 3px 0 var(--sr-ink);border-radius:22px;padding:5px}
.seg button{flex:1;min-width:0;border:0;border-radius:16px;background:transparent;color:var(--ok-text);min-height:56px;font-weight:800;font-size:1.02rem;padding:4px 6px;line-height:1.1;
  display:flex;align-items:center;justify-content:center;gap:6px}
.seg button svg{width:22px;height:22px;flex:none}
.seg button[aria-pressed="true"]{background:var(--sr-mint);color:var(--sr-ink);box-shadow:inset 0 0 0 2.5px var(--sr-ink),0 3px 0 var(--sr-ink)}
.tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tcard{position:relative;border:3px solid var(--rim);border-radius:22px;background:var(--ok-card);color:var(--ok-text);padding:0 0 8px;text-align:start;overflow:hidden;
  box-shadow:0 5px 0 var(--sr-ink);display:flex;flex-direction:column;min-height:56px;font:inherit;transition:transform 80ms ease-out,box-shadow 80ms ease-out}
.tcard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sr-ink)}
.tcard canvas{display:block;width:100%;aspect-ratio:21/9;border-bottom:2.5px solid var(--sr-ink)}
.tcard .tnum{position:absolute;top:7px;inset-inline-start:7px;width:32px;height:32px;box-sizing:border-box;border-radius:50%;background:var(--sr-cream);color:var(--sr-ink);border:2.5px solid var(--sr-ink);
  font-weight:800;display:grid;place-items:center;font-size:1.05rem}
.tcard .tnum svg{width:18px;height:18px}
.tcard .tname{font-weight:800;font-size:1.12rem;padding:7px 10px 0;line-height:1.1}
.tcard .tskill{font-size:.92rem;padding:2px 10px 0;color:var(--soft);font-weight:600;line-height:1.15}
.tcard .tmeta{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 10px 0;font-size:.95rem;font-weight:700}
.tcard .tstars{display:flex;gap:1px}
.tcard .tstars svg{width:22px;height:22px}
.tcard .tstars .off{--ok-fill:var(--sr-stoneTint)}
.ok-night .sr .tcard .tstars .off{--ok-fill:var(--sr-nightOff)}
.tcard .tbadge{position:absolute;top:7px;inset-inline-end:7px;background:var(--sr-mint);color:var(--sr-ink);font-weight:800;border-radius:999px;padding:3px 11px;font-size:.9rem;
  border:2.5px solid var(--sr-ink);box-shadow:0 2px 0 var(--sr-ink);transform:rotate(3deg)}
.pickHint{text-align:center;font-weight:700;margin:14px auto 0;max-width:640px;background:var(--ok-card);color:var(--ok-text);border:2.5px solid var(--rim);border-radius:18px;padding:8px 14px;box-shadow:0 3px 0 var(--sr-ink)}
.pickHint,.ok-card p,.practise,.moveUp{text-wrap:balance}
:lang(ja){word-break:auto-phrase}

/* ---------- kit cards ---------- */
.sr .ok-card{gap:12px}
.sr .ok-card p{margin:0;font-size:1.08rem;line-height:1.35;font-weight:600}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.btns .ok-btn{flex:1 1 auto;min-width:0;min-height:56px;white-space:nowrap}
.tables{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.tables button{min-height:60px;border:2.5px solid var(--rim);background:var(--ok-bg2);color:var(--ok-text);border-radius:16px;font-weight:800;font-size:1.45rem}
.tables button[aria-pressed="true"]{background:var(--sr-mint);color:var(--sr-ink);border-color:var(--sr-ink);box-shadow:0 3px 0 var(--sr-ink)}

/* ---------- Race ---------- */
.race{display:grid;background:var(--ok-bg2);align-items:stretch;justify-content:stretch}
.race.one{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"bar" "h0"}
.race.one .h1{display:none}
.race.two{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"h1" "bar" "h0"}
.race.two .h1{transform:rotate(180deg)}  /* the top player sits on the other side of the phone */
.bar{grid-area:bar;display:flex;align-items:center;gap:10px;padding:5px 10px;background:var(--ok-bg2);min-height:64px;box-sizing:border-box;border-bottom:3px solid var(--rim)}
.bar .tname{flex:1;min-width:0;text-align:center;color:var(--ok-text);font-weight:800;font-size:1.15rem;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tname b,.bar .tname small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tname small{font-size:.85rem;font-weight:600;color:var(--soft)}
.race.two .bar .tname small{display:none}
.race.two .bar{border-top:3px solid var(--rim)}
.half{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.h0{grid-area:h0}.h1{grid-area:h1}
.view{position:relative;min-height:0;overflow:hidden;background:var(--ok-bg2)}
.view canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.qpanel{background:var(--ok-bg2);padding:10px 10px 12px;display:flex;flex-direction:column;gap:10px;min-width:0;box-sizing:border-box;border-top:3px solid var(--rim)}
.qline{position:relative;height:80px;flex:none;box-sizing:border-box;border-radius:22px;background:var(--ok-card);color:var(--ok-text);border:3px solid var(--rim);box-shadow:0 4px 0 var(--sr-ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:background .2s}
.qlabel{font-size:1.02rem;font-weight:700;line-height:1.1;color:var(--soft);white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.qlabel svg{width:1.15em;height:1.15em;flex:none}
.qmain{font-size:40px;font-weight:800;line-height:1.1;white-space:nowrap;max-width:98%;display:flex;align-items:center;justify-content:center;gap:.25em;font-variant-numeric:tabular-nums}
.qmain svg{width:.9em;height:.9em;flex:none}
.qbox{display:inline-block;min-width:1.6em;padding:0 .2em;border-radius:12px;background:var(--sr-sparkTint);color:var(--sr-ink);border:2.5px solid var(--sr-ink);text-align:center;line-height:1.1}
.qline.right{background:var(--sr-mint);color:var(--sr-ink);border-color:var(--sr-ink)}
.qline.right .qlabel{color:var(--sr-ink)}
.qline.wrong{background:var(--sr-grapeTint);color:var(--sr-ink);border-color:var(--sr-ink)}
.qline.wrong .qlabel{color:var(--sr-grapeShade)}
.qline.done{background:var(--sr-sparkTint);color:var(--sr-ink);border-color:var(--sr-ink)}
.qline.done .qlabel{color:var(--sr-ink)}
.answers{display:grid;gap:10px;min-width:0}
.choices{grid-template-columns:1fr 1fr}
.ans,.key{position:relative;border:3px solid var(--sr-ink);border-radius:20px;background:var(--sr-cream);color:var(--sr-ink);font-weight:800;min-height:56px;min-width:0;padding:0;
  box-shadow:0 5px 0 var(--sr-ink);transition:transform 80ms ease-out,box-shadow 80ms ease-out,background .15s,opacity .15s;font-variant-numeric:tabular-nums}
.ans{font-size:36px;height:clamp(60px,10.5vh,96px)}
.ans .n{position:absolute;top:5px;inset-inline-start:9px;font-size:.36em;font-weight:700;opacity:.5}
.ans:active,.key:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sr-ink)}
.mk{position:absolute;top:-12px;inset-inline-end:-10px;width:34px;height:34px;box-sizing:border-box;border:2.5px solid var(--sr-ink);display:flex;align-items:center;justify-content:center;
  animation:srPop 320ms cubic-bezier(.34,1.56,.64,1);color:var(--sr-ink)}
.mk svg{width:22px;height:22px;stroke-width:3.2}
.ans.isRight{background:var(--sr-mintLight)}.ans.isRight .mk{background:var(--sr-mint);border-radius:50%}
/* each answer tile has its own colour (a tint and a coloured base edge), so kids find answers fast */
.ans[data-i="0"]{--tile:var(--sr-peach);background:var(--sr-peachTint)}.ans[data-i="1"]{--tile:var(--sr-sky);background:var(--sr-skyTint)}
.ans[data-i="2"]{--tile:var(--sr-coral);background:var(--sr-coralTint)}.ans[data-i="3"]{--tile:var(--sr-grape);background:var(--sr-grapeTint)}
.choices .ans{box-shadow:inset 0 -9px 0 var(--tile),0 5px 0 var(--sr-ink)}.choices .ans:active{box-shadow:inset 0 -9px 0 var(--tile),0 1px 0 var(--sr-ink)}
.choices .ans.isRight,.choices .ans.isOops{box-shadow:0 5px 0 var(--sr-ink)}.choices .ans.isRight{background:var(--sr-mintLight)}.choices .ans.isOops{background:var(--sr-coralTint)}
/* the title: a solid card behind the tagline, Play and the stats (the street scenery never shows through them), and a
   coloured second word so the logo reads against the clouds */
.sr-tcard{display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--ok-card);border:3px solid var(--sr-ink);border-radius:28px;box-shadow:0 6px 0 var(--sr-ink);padding:14px 16px 16px;max-width:min(420px,calc(100vw - 32px))}
.sr-tcard .ok-p{border:0!important;box-shadow:none!important;background:transparent!important;padding:0!important}
.sr-tcard .chips .chip{box-shadow:none}
.ans.isOops{background:var(--sr-coralTint);animation:nudge .35s ease}.ans.isOops .mk{background:var(--sr-coral);border-radius:7px;transform:rotate(45deg)}.ans.isOops .mk svg{transform:rotate(-45deg)}
.answers.locked .ans:not(.isRight):not(.isOops){opacity:.45}
.answers.locked{pointer-events:none}
/* the question dock: deep grape (the panel reads apart from the bright world), the question in cream, white answer
   tiles each with a coloured lip; the right tile punches, a wrong one shakes */
.qpanel{background:linear-gradient(#3D2775,#2B1F5C);border-color:var(--sr-ink)}
.qline{background:#2B1F5C;color:#FFFDF2;border-color:#120C2C;box-shadow:0 4px 0 #120C2C}
.qlabel{color:#FFE27A;font-size:1.1rem}.qmain{font-size:46px}
.qbox{background:#FFFDF2}
.ans[data-i]{background:#FFFFFF}.key{background:#FFFFFF;box-shadow:0 5px 0 #120C2C}
.choices .ans{box-shadow:inset 0 -7px 0 var(--tile),0 5px 0 #120C2C}.choices .ans:active{box-shadow:inset 0 -7px 0 var(--tile),0 1px 0 #120C2C}
.ans.isRight{animation:srPunch 220ms ease-out}.qpanel .kbhint{color:#C6A9F3}
@keyframes srPunch{50%{transform:scale(1.1)}}
/* two players: the bar between the halves in both players' colours at full strength (player 1 coral, player 2 sky) */
.race.two .bar{background:linear-gradient(90deg,var(--sr-coral) 50%,var(--sr-sky) 50%)}
@media (orientation:portrait){.race.two .bar{background:linear-gradient(180deg,var(--sr-sky) 50%,var(--sr-coral) 50%)}}
.sr-tcard{background:#2B1F5C;color:#FFFDF2;border-color:var(--sr-ink)}.sr-tcard .ok-p{color:#FFFDF2!important}
.signs span{width:52px;height:52px;border-radius:50%;font-size:2rem;color:#FFFFFF;-webkit-text-stroke:5px var(--sr-ink);paint-order:stroke fill}
#resTitle.ok-h2{font-size:clamp(2.4rem,7vmin,3.8rem)!important;line-height:1;margin:6px 0 8px}
/* wide screens: the logo and Play on the start side, the karts racing in on the other */
@media (min-aspect-ratio:6/5){.ok-title-screen .ok-title-block{align-self:flex-start;margin-inline-start:3vw}}
.resStats{background:#2B1F5C;border:3px solid var(--sr-ink);border-radius:20px;padding:10px}
@keyframes nudge{0%,100%{transform:translateX(0)}30%{transform:translateX(-6px)}70%{transform:translateX(5px)}}
@keyframes srPop{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
.keypad{grid-template-columns:repeat(3,1fr);grid-template-areas:"k1 k2 k3" "k4 k5 k6" "k7 k8 k9" "kb k0 ko"}
.key{font-size:30px;height:clamp(56px,8vh,80px);display:flex;align-items:center;justify-content:center}
.key svg{width:.95em;height:.95em}
.key[data-k="ok"]{background:var(--sr-mint)}
.key[data-k="back"]{background:var(--sr-stoneTint)}
.qpanel.racing-off .answers{opacity:.4;pointer-events:none}
.kbhint{color:var(--soft);text-align:center;font-size:.9rem;font-weight:600;margin:-2px 0 0;display:none}
@media (hover:hover) and (pointer:fine) and (min-height:720px){.race.one .kbhint{display:block}}

/* Two players: smaller panels, answers in one row, a two-row keypad. */
.race.two .qline{height:60px;border-radius:16px}
.race.two .qlabel{font-size:.9rem}
.race.two .qmain{font-size:32px}
.race.two .choices{grid-template-columns:repeat(4,1fr)}
.race.two .ans{height:62px;font-size:32px}
.race.two .keypad{grid-template-columns:repeat(6,1fr);grid-template-areas:"k1 k2 k3 k4 k5 kb" "k6 k7 k8 k9 k0 ko"}
.race.two .key{height:56px;font-size:28px}
.race.two .qpanel{padding:6px 8px 9px;gap:7px}
.race.two .bar{min-height:64px;justify-content:center}

@media (orientation:portrait) and (max-width:379px){.race.two .qpanel{padding:6px 3px 8px}.race.two .keypad{gap:3px}}
@media (orientation:landscape){
  .race.one .half{grid-template-columns:minmax(0,1fr) clamp(300px,36vw,480px);grid-template-rows:minmax(0,1fr)}
  .race.one .qpanel{border-top:0;border-inline-start:3px solid var(--rim);justify-content:center}
  .race.one .keypad{grid-template-columns:repeat(4,1fr);grid-template-areas:"k1 k2 k3 k4" "k5 k6 k7 k8" "k9 k0 kb ko"}
  .race.two{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"h0 bar h1"}
  .race.two .h1{transform:none}
  .race.two .bar{flex-direction:column;min-height:0;width:74px;padding:8px 6px;border:0;border-inline:3px solid var(--rim)}
  .race.two .bar .tname{display:none}
  .race.two .qpanel{padding:6px 6px 8px}
  .race.two .keypad,.race.two .choices{gap:6px}
}
@media (orientation:landscape) and (max-height:500px){
  .bar{min-height:60px;padding:2px 10px}
  .qline{height:64px}
  .qmain{font-size:34px}
  .race.one .ans{height:clamp(58px,17vh,80px)}
  .race.one .key{height:56px;font-size:28px}
  .race.one .qpanel{gap:7px;padding:6px 8px}
}

/* ---------- Results: the card sits beside (wide) or below (tall) the podium in the kit's world ---------- */
.resModal{background:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;align-items:flex-end!important}
.resPanel{width:min(100%,520px)!important;gap:8px!important;padding:20px 16px 16px!important;max-height:62%!important}
@media (min-aspect-ratio:5/4){.resModal{justify-content:flex-end!important;align-items:center!important}.resPanel{max-height:100%!important;margin-inline-end:2vw}}
.resPanel h2{font-size:clamp(1.6rem,6.5vw,2.1rem)!important}
.resPanel .ok-sparks .ok-slot{width:clamp(44px,11vmin,62px);height:clamp(44px,11vmin,62px)}
.ok-night .resPanel .ok-sparks .ok-on{--ok-fill:var(--sr-spark)}   /* the kit's night rule outweighs its own lit spark */
.resStats{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.practise{font-size:1.05rem;font-weight:700;color:var(--soft);line-height:1.3}
.moveUp{font-weight:800;display:flex;align-items:center;gap:6px;justify-content:center}
.moveUp svg{width:22px;height:22px;flex:none}
.resRows{display:flex;flex-direction:column;gap:6px;width:100%}
.resRow{display:flex;align-items:center;gap:10px;background:var(--ok-bg2);border:2px solid var(--ok-line);border-radius:16px;padding:6px 10px;font-weight:700;text-align:start;font-size:1rem;line-height:1.2}
.resRow canvas{flex:none;width:40px;height:40px}
.resRow b{font-size:1.2rem}
@media (orientation:landscape) and (max-height:560px){
  .resPanel{width:min(60%,560px)!important;padding:12px 14px!important;gap:6px!important}
  .resPanel .ok-sparks .ok-slot{width:40px;height:40px}
  .resPanel .btns .ok-btn{flex-basis:110px;min-height:56px}
}
@media (max-width:379px){.btns .ok-btn{font-size:1rem;padding:0 10px}}
.ok-rm .sr .ans,.ok-rm .sr .key,.ok-rm .sr .qline{transition:none}.ok-rm .sr .ans.isOops,.ok-rm .sr .mk{animation:none}
/* round 2: one theme for the whole race screen. The top bar is the same deep grape as the question dock (cream
   text, the kit's cream icon buttons), so the bright world sits framed between two dark bands. */
.race .bar{background:linear-gradient(#3D2775,#2B1F5C);border-color:#120C2C}
.race .bar .tname{color:#FFFDF2}.race .bar .tname small{color:#C6A9F3}
.race.one .qline{height:clamp(84px,12vh,104px)}.race.one .qmain{font-size:clamp(44px,6.4vh,54px)}
/* wide screens: the dock fills its column, the question on top and the four tiles sharing the rest, so no empty purple
   is left above or below them */
@media (orientation:landscape) and (min-height:501px){
  .race.one .qpanel{justify-content:stretch;padding:18px 18px 20px;gap:16px}
  .race.one .qline{height:clamp(120px,20vh,170px);border-radius:28px}
  .race.one .qlabel{font-size:clamp(1.1rem,2.4vh,1.4rem)}
  .race.one .qmain{font-size:clamp(56px,9vh,84px)}
  .race.one .answers{flex:1;min-height:0;gap:16px}
  .race.one .choices{grid-template-rows:1fr 1fr}
  .race.one .choices .ans{height:auto;min-height:96px;font-size:clamp(52px,9vh,88px);border-radius:26px}
  .race.one .keypad{grid-auto-rows:1fr}.race.one .key{height:auto;min-height:60px;font-size:clamp(30px,5vh,44px)}
  .race.one .kbhint{flex:none}
}
/* the title: Play is bigger with one ring, the stats sit in one row, the card has room on every side */
.sr-tcard{padding:16px 22px 18px;margin-inline:16px}

   Zippy the bunny, Bolt and Rex the frog); the kart is a sticker in the kart's kit colour with an Ink outline.
   The body and driver are drawn once into a cached sprite; wheels, flames and wobble are live.
   ===================================================================================== */

let save = freshSave();

/** A tap on the correction moves on (after a moment, so it can be read). */
function skipFeedback(pi) { const p = S.P[pi]; if (p && p.fb === 'wrong' && p.fbAge >= CONFIG.feedback.minWrongMs / 1000) p.fbT = 0; }

function update(dt) {
  if (S.screen !== 'race' && S.screen !== 'results') return;
  if (S.phase === 'countdown') {
    const before = Math.floor(S.cd / CD_STEP); S.cd += dt; const after = Math.floor(S.cd / CD_STEP);
    if (S.cd >= CD_TOTAL) beginRacing(); else if (after !== before) { sfx('count'); S.P.forEach(renderPanel); }
    return;
  }
  if (S.goT > 0) S.goT -= dt;
  const race = S.race;
  let left = dt; while (left > 1e-6) { const h = Math.min(left, 1 / 60); race.step(h); left -= h; }
  if (S.phase === 'done') return;
  for (const p of S.P) {
    if (p.fb) { p.fbAge += dt; if (p.fbT > 0) { p.fbT -= dt; if (p.fbT <= 0) nextQuestion(p); } }
    const v = VIEWS[p.idx], ki = race.karts.indexOf(p.kart), place = race.placeOf(p.kart);
    if (p.passT > 0) p.passT -= dt;
    if (place < p.prevPlace && !p.kart.finished && p.passT <= 0) {
      const passed = race.standings()[place]; if (passed) { addPop(v, ki, t('passed', { name: S.infos[race.karts.indexOf(passed)].short }), ''); sfx('whoosh'); p.passT = 1.2; }
    }
    p.prevPlace = place;
    const lap = race.lapOf(p.kart);
    if (lap > p.lap) { p.lap = lap; addPop(v, ki, lap === CONFIG.laps ? t('lastLap') : t('lapPop', { n: lap }), 'reward', true); sfx('spark'); }
    if (p.kart.finished && !p.finishedShown) {
      p.finishedShown = true; p.q = null; p.locked = true; p.fb = ''; renderPanel(p);
      sfx(p.kart.place === 1 ? 'win' : 'correct', { caption: undefined });
    }
  }
  if (S.P.every(p => p.kart.finished)) {
    if (S.phase === 'racing') { S.phase = 'finishing'; S.resultT = S.fast ? 0 : 2.6; }
    S.resultT -= dt; if (S.resultT <= 0) endRace();
  }
}

/** Everyone human is home: finish the rivals, score, save, show the podium. */
function endRace() {
  const race = S.race; race.finishAll(); S.phase = 'done';
  const tc = CONFIG.tracks[S.track - 1], p1 = S.P[0], place = p1.kart.place;
  const points = p1.correct * tc.mult + (place === 1 ? CONFIG.winBonus : 0);
  const stars = place === 1 ? 3 : place === 2 ? 2 : 1;
  const ts = trackSave(S.track), firstWins = ts.wins;
  ts.races++; if (place === 1) ts.wins++; ts.best = ts.best ? Math.min(ts.best, place) : place; ts.stars = Math.max(ts.stars, stars); ts.points = Math.max(ts.points, points);
  save.totalCorrect += p1.correct; save.races++; persist();
  const per = S.P.map(p => ({ place: p.kart.place, correct: p.correct, wrong: p.wrong, acc: p.correct + p.wrong ? Math.round(100 * p.correct / (p.correct + p.wrong)) : 0,
    fastest: p.times.length ? Math.min(...p.times) : null, bestStreak: p.bestStreak, missed: p.missed.slice() }));
  S.results = { place, points, stars, per, moveUp: place === 1 && S.track < 7 && ts.wins >= CONFIG.moveUpAfterWins && firstWins < CONFIG.moveUpAfterWins + 3, standings: race.standings().map(k => race.karts.indexOf(k)), shownAt: S.time };
  try { BRB.score.submit(points, 'race points'); BRB.gameOver({ won: place === 1, score: points }); } catch (e) { /* ignore */ }
  showResults();
}

/* =====================================================================================
   The question panel (DOM, kit tiles: a tick or a cross shape marks right and oops, never colour alone)
   ===================================================================================== */
function setMain(ui, text, box, icon) {
  ui.qmain.textContent = ''; if (icon) ui.qmain.insertAdjacentHTML('beforeend', Oomba.icon(icon));
  const t = document.createElement('span'); t.className = 'qt'; t.textContent = text; ui.qmain.append(t);
  if (box != null) { const b = document.createElement('span'); b.className = 'qbox'; b.textContent = box; ui.qmain.append(b); }
  // shrink a long line to fit (never below 28px)
  ui.qmain.style.fontSize = ''; let size = parseFloat(getComputedStyle(ui.qmain).fontSize) || 36;
  while (ui.qmain.scrollWidth > ui.qmain.clientWidth + 1 && size > 28) { size -= 2; ui.qmain.style.fontSize = size + 'px'; }
}
function setLabel(ui, text, icon) { ui.qlabel.textContent = text; if (icon) ui.qlabel.insertAdjacentHTML('afterbegin', Oomba.icon(icon)); }
function renderPanel(p) {
  const ui = HALVES[p.idx], q = p.q, cls = ui.qline.classList;
  cls.remove('right', 'wrong', 'done');
  ui.choices.classList.remove('locked'); ui.keypad.classList.remove('locked');
  ui.ans.forEach(b => { b.classList.remove('isRight', 'isOops'); const m = b.querySelector('.mk'); if (m) m.remove(); });
  ui.qpanel.classList.toggle('racing-off', S.phase === 'countdown' || p.kart.finished);
  if (S.phase === 'countdown') {
    const n = Math.min(3, Math.floor(S.cd / CD_STEP) + 1);
    setLabel(ui, t('q_ready')); fitText(ui.qlabel, 11); setMain(ui, NF.format(4 - n) + '…');
    ui.ans.forEach(b => { b.textContent = '?'; }); return;
  }
  if (p.kart.finished) {
    cls.add('done'); setLabel(ui, t(S.players === 2 ? 'q_finished2' : 'q_finished')); fitText(ui.qlabel, 11);
    ui.qmain.dir = 'auto'; setMain(ui, placeName(p.kart.place), null, p.kart.place === 1 ? 'trophy' : 'flag'); ui.qmain.dir = 'ltr'; return;
  }
  if (!q) return;
  if (p.fb === 'right') {
    cls.add('right'); setLabel(ui, p.streak >= 3 ? t('inrow', { n: p.streak }) : pickOne(tRaw('right_words')), p.streak >= 3 ? 'spark' : 'check');
    setMain(ui, q.text + ' = ' + q.answer, null, 'check');
  } else if (p.fb === 'wrong') {
    cls.add('wrong'); setLabel(ui, t('remember', { kind: pickOne(tRaw('kind_words')) }), 'hint');
    setMain(ui, t('is', { q: q.text, a: String(q.answer), n: q.answer }));   // the kind correction: "7 + 5 is 12"
  } else {
    setLabel(ui, q.tricky ? t('tricky') : q.review ? t('again1') : p.streak >= 2 ? t('inrowGo', { n: p.streak }) : t('question', { n: q.n }), q.tricky ? 'star' : q.review ? 'restart' : p.streak >= 2 ? 'spark' : '');
    setMain(ui, q.text + ' =', p.typed || '?');
  }
  fitText(ui.qlabel, 11);
  ui.ans.forEach((b, j) => { b.textContent = q.choices[j]; b.insertAdjacentHTML('afterbegin', '<span class="n" aria-hidden="true">' + (j + 1) + '</span>'); b.setAttribute('aria-label', t('ans_aria', { n: q.choices[j] })); });
  if (p.fb) {
    ui.choices.classList.add('locked'); ui.keypad.classList.add('locked');
    ui.ans.forEach((b, j) => { const n = q.choices[j]; if (n === q.answer) { b.classList.add('isRight'); b.insertAdjacentHTML('beforeend', '<span class="mk">' + MARK.right + '</span>'); } else if (p.fb === 'wrong' && n === p.picked) { b.classList.add('isOops'); b.insertAdjacentHTML('beforeend', '<span class="mk">' + MARK.oops + '</span>'); } });
  }
}

/* ---------- Results: the cast on a podium in the track's kit world, and the card ---------- */
let podium = [];
function clearPodium() { for (const e of podium) e.remove(null); podium = []; WORLD.setBiome('none'); }
function buildPodium() {
  clearPodium(); const R = S.results; if (!R) return;
  const tc = CONFIG.tracks[S.track - 1], cell = 64;
  WORLD.setBiome(tc.biome); if (!NIGHT()) WORLD.setTimeOfDay(tc.dusk ? 0.55 : 0, 0);
  // the podium: big blocks in the place colours (1st spark, 2nd sky, 3rd peach) on the track's ground
  podium = WORLD.ground(['####################', '####################'], { cell, x: -11 * cell, y: 0 });
  for (const [c0, n, hue] of [[-2, 3, 'spark'], [-4, 2, 'sky'], [0, 1, 'peach']]) for (let c = c0; c < c0 + 2; c++) for (let r = 1; r <= n; r++) podium.push(WORLD.add('block', { x: (c + 0.5) * cell, y: -(r - 0.5) * cell, size: cell + 1, variant: ':' + hue, shadow: false }));
  const spots = [[-1, -3], [-3, -2], [1, -1], [3.2, 0]];   // 1st, 2nd, 3rd (on the steps), 4th (beside 3rd), in cells
  for (const fx of [-5.4, 4.9]) podium.push(WORLD.add('flag', { x: fx * cell, y: 0, size: cell * 2.2, shadow: false }));
  R.standings.forEach((ki, i) => {
    const info = S.infos[ki], [cx, cy] = spots[i];
    const e = WORLD.add(info.char, { x: cx * cell, y: cy * cell, size: i === 0 ? 170 : 120, flip: false });
    e.state(i === 0 ? 'cheer' : i === 3 ? 'wave' : 'idle').mood(i === 0 ? 'happy' : 'happy'); podium.push(e);
    if (i < 3) podium.push(WORLD.add('tile', { x: cx * cell, y: cy * cell + cell * 0.6, size: cell * 0.9, variant: (i + 1) + ':' + ['spark', 'sky', 'peach'][i] }));
  });
  framePodium();
}
/** The camera frames the podium in the part of the screen the card leaves free. */
function framePodium() {
  if (!podium.length) return;
  const V = WORLD.view, f = WORLD.fit, card = $('resultScreen').querySelector('.ok-card'), cell = 64;
  if (!V || !f || !card) return;
  const r = card.getBoundingClientRect(), wide = innerWidth / innerHeight >= 1.25;
  const fx0 = 0, fx1 = wide ? Math.max(innerWidth * 0.4, r.left - 16) : innerWidth, fy0 = Math.min(innerHeight * 0.14, 92), fy1 = wide ? innerHeight : Math.max(innerHeight * 0.3, r.top - 8);
  const W = 11.6 * cell, H = 6.2 * cell, z = Math.max(0.3, Math.min(1.6, ((fx1 - fx0) / f.k) / W, ((fy1 - fy0) / f.k) / H));
  const midX = ((fx0 + fx1) / 2 - f.offX) / f.k, midY = ((fy0 + fy1) / 2 - f.offY) / f.k;
  const cam = WORLD.camera; cam.bounds(null); cam.zoom = z;
  cam.x = -0.25 * cell - (midX - V.vw / 2) / z; cam.y = -2.3 * cell - (midY - V.vh / 2) / z;
}
function chip(text, cls, icon) { const c = document.createElement('span'); c.className = 'chip' + (cls ? ' ' + cls : ''); if (icon) c.innerHTML = Oomba.icon(icon); c.append(text); return c; }

  demo.next = 1; demo.t = 0;
}
function drawDemo(dt, time) {
  const v = demo.view; if (!v.fit) fitView(v); if (!v.m) return;
  if (!demo.race || demo.t > 16) newDemo();
  const race = demo.race; demo.t += dt;
  race.step(dt); demo.next -= dt; const me = race.karts[0];
  if (demo.next <= 0) { race.right(me, 2); demo.next = 1.6 + visRng() * 1.4; }
  if (!v.tiles) buildTiles(v);
  const cam = race.karts.reduce((a, k) => a + k.dist, 0) / race.karts.length;
  v.g.setTransform(v.dpr, 0, 0, v.dpr, 0, 0); drawScene(v, cam);
  emitKartParts(v, race, dt); stepParts(v, dt); drawParts(v, cam, false);
  const lead = race.karts.reduce((a, k) => (k.dist > a.dist ? k : a), race.karts[0]);
  if (!REDUCED) motionLines(v, sx(v, cam, lead.dist), laneY(v, lead.lane), time);
  for (const i of demo.order) { const k = race.karts[i]; drawKart(v, k, demo.infos[i], sx(v, cam, k.dist), laneY(v, k.lane), time); }
  drawAmbient(v, dt, time, 20);
}

/* =====================================================================================
   Layout and the main loop
   ===================================================================================== */
function layoutViews() {
  VIEWS.forEach(v => { const box = v.cv.parentElement; if (box.offsetParent === null) return; fitView(v); });
  if (!$('titleCanvas').hidden) fitView(demo.view);
  if (S.screen === 'results') framePodium();
}
if (window.ResizeObserver) { const ro = new ResizeObserver(layoutViews); VIEWS.forEach(v => ro.observe(v.cv.parentElement)); }
window.addEventListener('resize', layoutViews);
Oomba.theme.on('change', () => { thumbsDrawn = false; layoutViews(); });
Oomba.fonts.ready.then(() => { FONTSTACK = getComputedStyle(Oomba.ui.root()).getPropertyValue('--ok-font') || FONTSTACK; spriteCache.clear(); VIEWS.concat(demo.view).forEach(v => { v.tiles = null; }); });

let last = performance.now(), frameGaps = null;
function frame(now) {
  // a slow device (or a busy one) skips ahead up to 0.1 s a frame, so the race never drifts into slow motion
  const raw = now - last, dt = Math.min(0.1, Math.max(0, raw / 1000)); last = now; S.time += dt;
  if (frameGaps) frameGaps.push(raw);
  if (S.screen === 'title' || S.screen === 'pick') drawDemo(dt, S.time);
  else if (S.screen === 'race' || S.screen === 'results') {
    if (!S.paused && !S.manual) update(dt);
    const vdt = S.paused ? 0 : dt;
    if (S.screen === 'race') for (let i = 0; i < S.players; i++) drawRaceView(VIEWS[i], vdt, S.time);
  }
  requestAnimationFrame(frame);
}

/* =====================================================================================
   Buttons and keys
   ===================================================================================== */
function muteButton() { const b = document.createElement('button'); b.className = 'ok-btn ok-icon mute'; b.type = 'button'; b.addEventListener('click', toggleMute); return b; }
function updateMute() { const m = BRB.sfx.muted; document.querySelectorAll('.mute').forEach(b => { b.innerHTML = Oomba.icon(m ? 'mute' : 'sound'); b.setAttribute('aria-label', t(m ? 'a_soundOn' : 'a_soundOff')); }); }
function toggleMute() { BRB.sfx.mute(); updateMute(); sfx('select'); }
document.querySelectorAll('.mute').forEach(b => b.addEventListener('click', toggleMute));
const tap = (id, fn, s = 'select') => $(id).addEventListener('click', () => { sfx(s); fn(); });
tap('backBtn', () => showScreen('title'));
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { S.mode = b.dataset.mode; save.mode = S.mode; persist(); showPicker(); sfx('select'); }));
document.querySelectorAll('[data-players]').forEach(b => b.addEventListener('click', () => { S.players = +b.dataset.players; save.players = S.players; persist(); showPicker(); sfx('select'); }));
tap('practiceGo', () => startRace(8), 'whoosh');
tap('practiceBack', () => { $('practiceScreen').hidden = true; });
$('pauseBtn').addEventListener('click', () => setPaused(true));
tap('againBtn', () => startRace(S.track));
tap('nextBtn', () => startRace(Math.min(7, S.track + 1)), 'whoosh');
tap('menuBtn', () => quitToPicker());
document.addEventListener('visibilitychange', () => { if (document.hidden && S.screen === 'race' && S.phase !== 'done') setPaused(true); });

document.addEventListener('keydown', e => {
  if (Oomba.ui.open) return;   // the kit's own screens (pause, settings) own the keys while they are open
  const k = e.key;
  if (k === 'p' || k === 'P' || k === 'Escape') {
    if (S.screen === 'race' && !S.paused && S.phase !== 'done') { setPaused(true); e.preventDefault(); }
    else if (!$('practiceScreen').hidden && k === 'Escape') $('practiceScreen').hidden = true;
    return;
  }
  if (k === 'm' || k === 'M') { BRB.sfx.mute(); updateMute(); return; }
  if (S.screen !== 'race' || S.paused || S.phase !== 'racing') return;
  // Player 1 types answers in both modes: digits, Backspace, then Enter.
  const p = S.P[0]; if (!p) return;
  if (/^[0-9]$/.test(k)) { keyIn(0, k); e.preventDefault(); }
  else if (k === 'Backspace') { keyIn(0, 'back'); e.preventDefault(); }
  else if (k === 'Enter' && p.typed) { keyIn(0, 'ok'); e.preventDefault(); }
  else if ((k === 'Enter' || k === ' ') && p.fb === 'wrong') { skipFeedback(0); e.preventDefault(); }
});

applyI18n();
updateMute();
showScreen('title');
requestAnimationFrame(frame);

/* =====================================================================================
   window.__brbTest: hooks for automated play tests (harmless in production). Merged into the kit's hooks
   (setTheme, setLang, setTier ...): the game's own names below win and behave as before.
     state()            -> { screen, track, mode, players, phase, paused, question: {text, answer, choices} | null (player 1),
                             place, lap, progress: [0..1 per kart], correct, wrong, streak, finished (player 1),
                             p: [per player { question, place, lap, correct, wrong, streak, finished, typed, feedback, missed }],
                             karts: [{ id, name, human, dist, v, place, finished, lane }], countdown, results }
     start({ track: 1-8, mode: 'choice'|'keypad', players: 1|2, seed, tables: [2..12], manual })
                        -> starts a race (countdown first unless skipAnimations() is on). manual: true stops the
                           real-time clock so only step() moves the race.
     answer(value, player = 0) -> true (right) / false (wrong) / null (not taking answers right now)
     step(ms)           -> advance the game by ms in 1/60 s steps (also switches to the manual clock)
     realtime()         -> back to the real-time clock
     skipAnimations(on = true) -> no countdown, no feedback pauses, results straight away
     finish({ every = 3, accuracy = 1 } = {}) -> fast-forward: every human answers every `every` race-seconds,
                           right with probability `accuracy` (seeded), until the podium shows. Returns state().
     questionsFor(track, n, seed, opts) -> n questions from a fresh deck (progress runs 0..1 every 30
                           questions, all answered right), each { text, answer, choices, op, x, y, regroup }
     deck(track, seed)  -> a raw deck { next(progress), report(q, ok), due } for repeat tests
     seed(n)            -> the seed for the next start() without one
     pause(on), quit(), tricky() (the saved tricky facts), save() (a copy of the whole save),
     frameStats(start)  -> start collecting rAF gaps; frameStats() returns them
   ===================================================================================== */
let nextSeed = null;
window.__brbTest = Object.assign(window.__brbTest || {}, {
  /** cover(on): frame the race closer for the library cover (bigger kart and driver; the cover script calls it). */
  cover(on = true) { COVER = on !== false; for (const v of VIEWS) { v.w = 0; v.h = 0; fitView(v); } return COVER; },
  state() {
    const race = S.race, p1 = S.P[0];
    const pq = p => p && p.q ? { text: p.q.text, answer: p.q.answer, choices: p.q.choices.slice(), key: p.q.key, review: !!p.q.review, tricky: !!p.q.tricky } : null;
    return {
      screen: S.screen, track: S.track, mode: S.mode, players: S.players, phase: S.phase, paused: S.paused,
      question: pq(p1),
      place: race && p1 ? race.placeOf(p1.kart) : 0, lap: race && p1 ? race.lapOf(p1.kart) : 0,
      progress: race ? race.karts.map(k => Math.min(1, k.dist / race.total)) : [],
      correct: p1 ? p1.correct : 0, wrong: p1 ? p1.wrong : 0, streak: p1 ? p1.streak : 0, finished: !!(p1 && p1.kart.finished),
      p: !race ? [] : S.P.map(p => ({ question: pq(p), place: race.placeOf(p.kart), lap: race.lapOf(p.kart), correct: p.correct, wrong: p.wrong, streak: p.streak, finished: p.kart.finished, typed: p.typed, feedback: p.fb, locked: p.locked, missed: p.missed.map(m => m.text) })),
      karts: race ? race.karts.map((k, i) => ({ id: k.id, name: S.infos[i].name, human: k.human, dist: +k.dist.toFixed(1), v: +k.v.toFixed(2), place: race.placeOf(k), finished: k.finished, finishTime: k.finishTime, lane: k.lane })) : [],
      raceTime: race ? race.t : 0, total: race ? race.total : 0, countdown: S.phase === 'countdown' ? S.cd : 0,
      results: S.results ? JSON.parse(JSON.stringify(S.results)) : null
    };
  },
  start(opts = {}) {
    if (opts.mode === 'choice' || opts.mode === 'keypad') S.mode = opts.mode;
    if (opts.players === 1 || opts.players === 2) S.players = opts.players;
    if (Array.isArray(opts.tables) && opts.tables.length) save.tables = opts.tables.filter(n => n >= 2 && n <= 12);
    const track = Math.max(1, Math.min(8, opts.track | 0 || S.track || 1));
    startRace(track, { seed: opts.seed != null ? opts.seed : nextSeed, manual: !!opts.manual });
    return this.state();
  },
  answer(value, player = 0) { return answer(player, value); },
  step(ms) { S.manual = true; let left = ms / 1000; while (left > 1e-9) { const h = Math.min(1 / 60, left); update(h); left -= h; } return this.state(); },
  realtime() { S.manual = false; },
  skipAnimations(on = true) { S.fast = on !== false; if (S.fast && S.phase === 'countdown') beginRacing(); return S.fast; },
  finish(opts = {}) {
    if (!S.race || S.phase === 'done') return this.state();
    const every = opts.every || 3, acc = opts.accuracy == null ? 1 : opts.accuracy, r = makeRng((S.seed ^ 0x5eed) >>> 0), was = S.fast;
    S.fast = true; if (S.phase === 'countdown') beginRacing();
    const nextAt = S.P.map(() => S.race.t + every);
    for (let guard = 0; S.phase !== 'done' && guard < 60 * 900; guard++) {
      update(1 / 30);
      S.P.forEach((p, i) => { if (p.q && !p.locked && S.race.t >= nextAt[i]) { const right = r() < acc; answer(i, right ? p.q.answer : p.q.choices.find(c => c !== p.q.answer)); nextAt[i] = S.race.t + every; } });
    }
    S.fast = was; return this.state();
  },
  questionsFor(track, n = 100, seed = 1, opts = {}) {
    const deck = makeDeck(track, makeRng(seed), { tables: opts.tables || save.tables }), out = [];
    for (let i = 0; i < n; i++) { const q = deck.next((i % 30) / 30); deck.report(q, true); out.push({ text: q.text, answer: q.answer, choices: q.choices, op: q.op, x: q.x, y: q.y, regroup: q.regroup }); }
    return out;
  },
  deck(track, seed = 1) { return makeDeck(track, makeRng(seed), { tables: save.tables }); },
  seed(n) { nextSeed = n >>> 0; return nextSeed; },
  pause(on = true) { setPaused(on); return this.state(); },
  quit() { quitToPicker(); return this.state(); },
  tricky() { return JSON.parse(JSON.stringify(save.tricky)); },
  save() { return JSON.parse(JSON.stringify(save)); },
  frameStats(start) { if (start) { frameGaps = []; return true; } const g = frameGaps || []; frameGaps = null; return g; }
});
</script>
