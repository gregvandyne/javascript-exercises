<title>Sum Racer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Sum Racer: answer maths questions to power your kart. Screens: title (animated race behind a card) ->
   track picker -> race (canvas race view + question panel; two halves in two-player mode) -> results podium.
   Pause and practice-table picker are overlays. Every button is at least 56px tall. */
:root{
  --ink:#2a1846; --accent:#ff6a1a; --accentDark:#c44a00; --sun:#ffd23f; --sunDark:#d9a400;
  --good:#1fb35a; --goodDark:#12803f; --kind:#7c4dff; --kindSoft:#efe8ff; --oops:#ffb38a;
  --dash1:#2b1b52; --dash2:#3d2775; --card:#fff; --soft:#fff4e8; --softEdge:#ffd2ad;
  --font:"Fredoka","Trebuchet MS",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;font-family:var(--font);color:var(--ink);background:#2b1b52;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid #fff;outline-offset:2px}
.panel button:focus-visible,.picker button:focus-visible{outline-color:var(--kind)}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.icon-btn{width:56px;height:56px;flex:none;border:0;border-radius:50%;background:#fff;font-size:1.5rem;box-shadow:0 4px 0 rgba(0,0,0,.22);display:grid;place-items:center;padding:0}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.big-btn{border:0;border-radius:20px;background:var(--accent);color:#fff;font-weight:700;font-size:1.5rem;padding:12px 30px;min-height:64px;min-width:200px;box-shadow:0 6px 0 var(--accentDark);line-height:1.1}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accentDark)}
.big-btn.alt{background:var(--soft);color:var(--ink);box-shadow:0 6px 0 var(--softEdge);font-size:1.15rem}
.big-btn.alt:active{box-shadow:0 2px 0 var(--softEdge)}
.big-btn.go{background:var(--good);box-shadow:0 6px 0 var(--goodDark)}
.big-btn.go:active{box-shadow:0 2px 0 var(--goodDark)}
.chip{font-weight:600;background:#fff4cc;border-radius:999px;padding:6px 14px;font-size:1rem;line-height:1.2}

/* ---------- Title ---------- */
.bgcanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.titleCard{position:relative;margin:auto;margin-top:max(14px,4vh);align-self:flex-start;width:min(92%,420px);background:rgba(255,255,255,.94);border-radius:30px;
  padding:18px 18px 20px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;gap:10px}
.logo{margin:4px 0 0;font-weight:700;font-size:clamp(3rem,15vw,4.4rem);line-height:.9;letter-spacing:.01em;color:var(--sun);
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center}
.logo .l2{color:var(--accent);font-size:1.08em}
.signs{display:flex;gap:8px;justify-content:center}
.signs span{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:1.6rem;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.tag{margin:0;font-size:1.15rem;font-weight:600;line-height:1.3}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.titleCard .mute{position:absolute;top:10px;right:10px}
.titleCard .big-btn{min-width:230px;font-size:1.8rem}

/* ---------- Track picker ---------- */
.picker{flex-direction:column;justify-content:flex-start;background:linear-gradient(#ffb15c,#ff7a45 55%,#e0457b);overflow:hidden}
.pickHead{flex:none;width:100%;max-width:980px;display:flex;align-items:center;gap:10px;padding:10px 12px 6px;box-sizing:border-box}
.pickHead h2{flex:1;margin:0;text-align:center;color:#fff;font-size:1.7rem;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.pickBody{flex:1;min-height:0;width:100%;max-width:980px;overflow-y:auto;overflow-x:hidden;padding:4px 12px 18px;box-sizing:border-box}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.seg{flex:1 1 300px;display:flex;gap:6px;background:rgba(255,255,255,.35);border-radius:20px;padding:5px}
.seg button{flex:1;min-width:0;border:0;border-radius:16px;background:rgba(255,255,255,.75);min-height:56px;font-weight:700;font-size:1.05rem;padding:4px 6px;line-height:1.1}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);color:var(--accentDark)}
.tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tcard{position:relative;border:0;border-radius:20px;background:#fff;padding:0 0 8px;text-align:left;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;min-height:56px}
.tcard:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.tcard canvas{display:block;width:100%;aspect-ratio:21/9;background:#9ad}
.tcard .tnum{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;display:grid;place-items:center;font-size:1.05rem}
.tcard .tname{font-weight:700;font-size:1.1rem;padding:6px 10px 0;line-height:1.1}
.tcard .tskill{font-size:.92rem;padding:2px 10px 0;opacity:.8;line-height:1.15}
.tcard .tmeta{display:flex;justify-content:space-between;align-items:center;padding:4px 10px 0;font-size:.95rem;font-weight:600}
.tcard .tstars{color:#f2a900;letter-spacing:1px;font-size:1.1rem}
.tcard .tbadge{position:absolute;top:6px;right:6px;background:var(--good);color:#fff;font-weight:700;border-radius:999px;padding:3px 10px;font-size:.9rem;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.pickHint{color:#fff;text-align:center;font-weight:600;margin:12px 0 0;text-shadow:0 2px 0 rgba(0,0,0,.2)}

/* ---------- Overlays ---------- */
.modal{z-index:30;background:rgba(25,12,50,.55);padding:12px;box-sizing:border-box}
.panel{position:relative;background:var(--card);border-radius:28px;padding:16px;width:min(100%,460px);max-height:100%;overflow:auto;box-sizing:border-box;text-align:center;
  box-shadow:0 10px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;gap:10px}
.panel h2{margin:0;font-size:clamp(1.6rem,7vw,2.1rem);line-height:1.1;color:var(--accent)}
.panel p{margin:0;font-size:1.1rem;line-height:1.35}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.btns .big-btn{flex:1 1 140px;min-width:0;font-size:1.25rem;padding:10px 10px}
.tables{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.tables button{min-height:60px;border:3px solid var(--softEdge);background:var(--soft);border-radius:16px;font-weight:700;font-size:1.5rem}
.tables button[aria-pressed="true"]{background:var(--accent);border-color:var(--accentDark);color:#fff}
.panel .mute{position:absolute;top:10px;right:10px}

/* ---------- Race ---------- */
.race{display:grid;background:var(--dash1);align-items:stretch;justify-content:stretch}
.race.one{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"bar" "h0"}
.race.one .h1{display:none}
.race.two{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"h1" "bar" "h0"}
.race.two .h1{transform:rotate(180deg)}  /* the top player sits on the other side of the phone */
.bar{grid-area:bar;display:flex;align-items:center;gap:10px;padding:4px 10px;background:var(--dash1);min-height:60px;box-sizing:border-box}
.bar .tname{flex:1;min-width:0;text-align:center;color:#fff;font-weight:700;font-size:1.15rem;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tname small{display:block;font-size:.85rem;font-weight:500;opacity:.8}
.race.two .bar .tname small{display:none}
.half{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.h0{grid-area:h0}.h1{grid-area:h1}
.view{position:relative;min-height:0;overflow:hidden;background:#7cc8ff}
.view canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.qpanel{background:linear-gradient(var(--dash2),var(--dash1));padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px;min-width:0;box-sizing:border-box;border-top:4px solid #5a3fa6}
.qline{height:78px;flex:none;border-radius:18px;background:rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;overflow:hidden;transition:background .2s}
.qlabel{font-size:1.05rem;font-weight:600;line-height:1.1;opacity:.9;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}
.qmain{font-size:40px;font-weight:700;line-height:1.1;white-space:nowrap;max-width:98%;display:flex;align-items:center;justify-content:center;gap:.25em}
.qbox{display:inline-block;min-width:1.6em;padding:0 .2em;border-radius:12px;background:#fff;color:var(--ink);text-align:center;line-height:1.15}
.qline.right{background:var(--good)}
.qline.wrong{background:var(--kindSoft);color:var(--ink)}
.qline.wrong .qlabel{color:var(--kind);opacity:1}
.qline.done{background:rgba(255,210,63,.95);color:var(--ink)}
.answers{display:grid;gap:8px;min-width:0}
.choices{grid-template-columns:1fr 1fr}
.ans,.key{border:0;border-radius:18px;background:#fff;color:var(--ink);font-weight:700;min-height:56px;min-width:0;padding:0;box-shadow:0 5px 0 var(--edge,#b9a6e8);transition:transform .08s,background .15s,opacity .15s}
.ans{font-size:36px;height:clamp(60px,10.5vh,96px)}
.ans:nth-child(1){--edge:#ffcf33}.ans:nth-child(2){--edge:#47d4ff}.ans:nth-child(3){--edge:#ff7cc4}.ans:nth-child(4){--edge:#a98bff}
.ans:active,.key:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge,#b9a6e8)}
.ans.isRight{background:var(--good);color:#fff;--edge:var(--goodDark)}
.ans.isOops{background:var(--oops);animation:nudge .35s ease}
.answers.locked .ans:not(.isRight):not(.isOops){opacity:.45}
.answers.locked{pointer-events:none}
@keyframes nudge{0%,100%{transform:translateX(0)}30%{transform:translateX(-6px)}70%{transform:translateX(5px)}}
.keypad{grid-template-columns:repeat(3,1fr);grid-template-areas:"k1 k2 k3" "k4 k5 k6" "k7 k8 k9" "kb k0 ko"}
.key{font-size:30px;height:clamp(56px,8vh,80px)}
.key[data-k="ok"]{background:var(--good);color:#fff;--edge:var(--goodDark)}
.key[data-k="back"]{background:#ffe1cc;--edge:#ffb38a}
.qpanel.racing-off .answers{opacity:.4;pointer-events:none}
.kbhint{color:#fff;opacity:.7;text-align:center;font-size:.9rem;margin:-2px 0 0;display:none}
@media (hover:hover) and (pointer:fine) and (min-height:720px){.race.one .kbhint{display:block}}

/* Two players: smaller panels, answers in one row, a two-row keypad. */
.race.two .qline{height:60px;border-radius:14px}
.race.two .qlabel{font-size:.9rem}
.race.two .qmain{font-size:32px}
.race.two .choices{grid-template-columns:repeat(4,1fr)}
.race.two .ans{height:62px;font-size:32px}
.race.two .keypad{grid-template-columns:repeat(6,1fr);grid-template-areas:"k1 k2 k3 k4 k5 kb" "k6 k7 k8 k9 k0 ko"}
.race.two .key{height:56px;font-size:28px}
.race.two .qpanel{padding:6px 8px 8px;gap:6px}
.race.two .bar{min-height:64px;justify-content:center;background:linear-gradient(90deg,#3a7bff,#2b1b52 30%,#2b1b52 70%,#ff5a2a)}

@media (orientation:portrait) and (max-width:379px){.race.two .qpanel{padding:6px 3px 8px}.race.two .keypad{gap:3px}} /* six keys of 56px still fit across a 360px phone */
@media (orientation:landscape){
  .race.one .half{grid-template-columns:minmax(0,1fr) clamp(300px,36vw,480px);grid-template-rows:minmax(0,1fr)}
  .race.one .qpanel{border-top:0;border-left:4px solid #5a3fa6;justify-content:center}
  .race.one .keypad{grid-template-columns:repeat(4,1fr);grid-template-areas:"k1 k2 k3 k4" "k5 k6 k7 k8" "k9 k0 kb ko"}
  .race.two{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"h0 bar h1"}
  .race.two .h1{transform:none}
  .race.two .bar{flex-direction:column;min-height:0;width:68px;padding:8px 6px;background:linear-gradient(#2b1b52,#3d2775)}
  .race.two .bar .tname{display:none}
  .race.two .qpanel{padding:6px 6px 8px}
  .race.two .keypad,.race.two .choices{gap:5px}
}
@media (orientation:landscape) and (max-height:500px){
  .bar{min-height:58px;padding:2px 10px}
  .qline{height:64px}
  .qmain{font-size:34px}
  .race.one .ans{height:clamp(58px,17vh,80px)}
  .race.one .key{height:56px;font-size:28px}
  .race.one .qpanel{gap:6px;padding:6px 8px}
}

/* ---------- Results ---------- */
.resPanel{width:min(100%,520px);gap:8px}
.resPanel h2{font-size:clamp(1.6rem,7vw,2.2rem)}
#podium{width:100%;height:170px;display:block;flex:none}
.resStats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.resStats .chip{font-size:1rem}
.chip.good{background:#dcfce7}.chip.star{background:#fff1b8}.chip.kindc{background:var(--kindSoft)}
.practise{font-size:1.05rem;font-weight:600;color:var(--kind);line-height:1.3}
.moveUp{font-weight:700;color:var(--goodDark)}
.resRows{display:flex;flex-direction:column;gap:4px;width:100%}
.resRow{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:14px;padding:6px 10px;font-weight:600;text-align:left;font-size:1rem;line-height:1.2}
.resRow b{font-size:1.2rem}
@media (orientation:landscape) and (max-height:560px){
  .resPanel{width:min(100%,820px);display:grid;grid-template-columns:1fr 1fr;align-items:center;column-gap:16px;row-gap:6px;padding:12px 16px}
  .resPanel h2{grid-column:1 / -1}
  .resPanel #podium{grid-column:1;grid-row:2 / span 4;height:200px}
  .resPanel > :not(h2):not(#podium):not(.mute){grid-column:2}
  .resPanel .btns .big-btn{flex-basis:120px;min-height:58px;font-size:1.1rem}
}
@media (min-width:1000px) and (min-height:700px){
  .qline{height:116px}.qlabel{font-size:1.3rem}.qmain{font-size:58px}
  .race.one .ans{height:clamp(96px,15vh,140px);font-size:56px}
  .race.one .key{height:clamp(72px,10vh,100px);font-size:40px}
  .race.one .qpanel{gap:12px;padding:16px}
}
@media (max-height:520px){
  .titleCard{margin-top:8px;padding:10px 16px 14px;gap:8px}
  .logo{flex-direction:row;gap:.22em;font-size:clamp(2.4rem,12vh,3.4rem)}
  .signs{display:none}
  .titleCard .big-btn{min-height:60px}
  .tables{grid-template-columns:repeat(6,1fr)}
  #practiceScreen .panel{gap:8px;padding:12px 16px}
}
@media (max-width:379px){.btns .big-btn{font-size:1.1rem;padding:10px 6px}}
@media (prefers-reduced-motion:reduce){.ans,.key{transition:none}.ans.isOops{animation:none}.qline{transition:none}}
</style>

<!-- Title -->
<section class="screen" id="titleScreen">
  <canvas class="bgcanvas" id="titleCanvas" aria-hidden="true"></canvas>
  <div class="titleCard">
    <h1 class="logo" aria-label="Sum Racer"><span>Sum</span><span class="l2">Racer</span></h1>
    <div class="signs" aria-hidden="true"><span style="background:#ff6a1a">+</span><span style="background:#1fbfae">−</span><span style="background:#7c4dff">×</span><span style="background:#ff5fa8">÷</span></div>
    <p class="tag">Answer maths questions to zoom your kart to the finish!</p>
    <button class="big-btn" id="playBtn">▶ Play</button>
    <div class="chips"><span class="chip" id="starChip">⭐ 0 stars</span><span class="chip" id="rightChip">✅ 0 right answers</span></div>
    <button class="icon-btn mute" aria-label="Turn sound off">🔊</button>
  </div>
</section>

<!-- Track picker -->
<section class="screen picker" id="pickScreen" hidden>
  <header class="pickHead">
    <button class="icon-btn" id="backBtn" aria-label="Back">⬅️</button>
    <h2>Pick a track</h2>
    <button class="icon-btn mute" aria-label="Turn sound off">🔊</button>
  </header>
  <div class="pickBody">
    <div class="toggles">
      <div class="seg" role="group" aria-label="How to answer">
        <button data-mode="choice" aria-pressed="true">👆 Tap answers</button>
        <button data-mode="keypad" aria-pressed="false">🔢 Type answers</button>
      </div>
      <div class="seg" role="group" aria-label="How many players">
        <button data-players="1" aria-pressed="true">🧒 1 player</button>
        <button data-players="2" aria-pressed="false">👫 2 players</button>
      </div>
    </div>
    <div class="tracks" id="trackGrid"></div>
    <p class="pickHint" id="pickHint">Tap a track to race!</p>
  </div>
</section>

<!-- Practice tables -->
<section class="screen modal" id="practiceScreen" hidden>
  <div class="panel">
    <h2>Practice Loop</h2>
    <p>Pick the times tables you want to practise.</p>
    <div class="tables" id="tableGrid"></div>
    <div class="btns">
      <button class="big-btn alt" id="practiceBack">⬅️ Back</button>
      <button class="big-btn go" id="practiceGo">🏁 Race!</button>
    </div>
  </div>
</section>

<!-- Race -->
<section class="screen race one" id="raceScreen" hidden>
  <div class="bar" id="raceBar">
    <button class="icon-btn" id="pauseBtn" aria-label="Pause">⏸️</button>
    <div class="tname" id="raceName">Number Lane<small>Adding to 10</small></div>
    <button class="icon-btn mute" aria-label="Turn sound off">🔊</button>
  </div>
  <div class="half h0" id="half0"></div>
  <div class="half h1" id="half1"></div>
</section>

<!-- Pause -->
<section class="screen modal" id="pauseScreen" hidden>
  <div class="panel">
    <h2>Paused</h2>
    <p>Take a breather. Your kart will wait.</p>
    <button class="big-btn go" id="resumeBtn">▶ Keep racing</button>
    <div class="btns">
      <button class="big-btn alt" id="restartBtn">🔄 Start again</button>
      <button class="big-btn alt" id="quitBtn">🏁 Tracks</button>
    </div>
    <button class="icon-btn mute" aria-label="Turn sound off">🔊</button>
  </div>
</section>

<!-- Results -->
<section class="screen modal" id="resultScreen" hidden>
  <div class="panel resPanel">
    <h2 id="resTitle">You won!</h2>
    <canvas id="podium" aria-hidden="true"></canvas>
    <div class="resRows" id="resRows" hidden></div>
    <div class="resStats" id="resStats"></div>
    <div class="practise" id="resPractise"></div>
    <div class="moveUp" id="resMoveUp" hidden></div>
    <div class="btns">
      <button class="big-btn" id="againBtn">🔄 Race again</button>
      <button class="big-btn go" id="nextBtn">➡️ Next track</button>
      <button class="big-btn alt" id="menuBtn">🏁 Tracks</button>
    </div>
  </div>
</section>

<template id="halfTpl">
  <div class="view"><canvas aria-hidden="true"></canvas></div>
  <div class="qpanel">
    <div class="qline" aria-live="polite"><div class="qlabel">Get ready!</div><div class="qmain"><span class="qt">Ready…</span></div></div>
    <div class="answers choices">
      <button class="ans" data-i="0">1</button><button class="ans" data-i="1">2</button><button class="ans" data-i="2">3</button><button class="ans" data-i="3">4</button>
    </div>
    <div class="answers keypad" hidden>
      <button class="key" data-k="1" style="grid-area:k1">1</button><button class="key" data-k="2" style="grid-area:k2">2</button><button class="key" data-k="3" style="grid-area:k3">3</button>
      <button class="key" data-k="4" style="grid-area:k4">4</button><button class="key" data-k="5" style="grid-area:k5">5</button><button class="key" data-k="6" style="grid-area:k6">6</button>
      <button class="key" data-k="7" style="grid-area:k7">7</button><button class="key" data-k="8" style="grid-area:k8">8</button><button class="key" data-k="9" style="grid-area:k9">9</button>
      <button class="key" data-k="back" style="grid-area:kb" aria-label="Rub out">⌫</button><button class="key" data-k="0" style="grid-area:k0">0</button><button class="key" data-k="ok" style="grid-area:ko" aria-label="Go">✓</button>
    </div>
    <p class="kbhint">Keys: type the answer, then press Enter.</p>
  </div>
</template>

<script>
/* @@PURE-BEGIN: CONFIG + maths + race model. No DOM in here (the Node tests run this block on its own). */
const CONFIG = {
  title: 'Sum Racer',
  saveKey: 'sum-racer-v1',
  laps: 3,
  race: {
    cruise: 11,          // metres per second with no answers at all (you always keep rolling)
    boost: 19,           // metres per second added by each right answer
    boostFade: 2.5,      // seconds for a boost to fade most of the way
    maxBoost: 44,        // boosts stack up to this much extra speed

    for (let r = 0; r < rows; r++) for (let c = 0; c < 2; c++) { g.fillStyle = (r + c) % 2 ? '#222' : '#fff'; g.fillRect(x + c * sq, m.roadTop + r * sq, sq, Math.min(sq, m.roadBot - m.roadTop - r * sq)); }
    if (k === 0 && v.kind === 'race' && (S.phase === 'countdown' || S.goT > 0)) continue;   // the traffic lights hang here instead

    const bh = Math.max(16, Math.min(34, m.roadTop * 0.18)), bw = bh * (label.length * 0.62 + 1.2), by = Math.max(m.hud + 4, m.roadTop - bh * 2.6);
    g.fillStyle = '#5b5f73'; g.fillRect(x - 3, by, 6, m.roadTop - by); g.fillRect(x + bw - 3, by, 6, m.roadTop - by);

    g.fillStyle = '#fff'; g.font = '700 ' + Math.round(bh * 0.66) + 'px ' + FONT; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(label, x + bw / 2, by + bh * 0.54);

      g.fillStyle = '#c0c6d6'; g.fillRect(x0, base - standH, standW, standH); g.fillStyle = '#9aa2b8'; for (let r = 1; r < 4; r++) g.fillRect(x0, base - standH + r * standH / 4, standW, 1.5);
      const cols = ['#ff5d8f', '#ffd23f', '#3a7bff', '#2ec4b6', '#ff8c42', '#a06cd5'];

function drawParts(v, cam, front) {

/* =====================================================================================
   Saving (BRB.storage is the per-player cloud save). Only player 1 (the device owner) is saved.
   ===================================================================================== */
const freshSave = () => ({ v: 1, mode: 'choice', players: 1, lastTrack: 1, tables: CONFIG.practiceTables.slice(), totalCorrect: 0, races: 0, tracks: {}, tricky: [] });
let save = freshSave();
try {
  const s = BRB.storage.get(CONFIG.saveKey);
  if (s && s.v === 1 && typeof s.tracks === 'object' && Array.isArray(s.tricky)) save = Object.assign(freshSave(), s);
} catch (e) { /* fresh start */ }
if (save.mode !== 'choice' && save.mode !== 'keypad') save.mode = 'choice';
if (save.players !== 1 && save.players !== 2) save.players = 1;
save.tables = (Array.isArray(save.tables) ? save.tables : []).filter(n => Number.isInteger(n) && n >= 2 && n <= 12);
if (!save.tables.length) save.tables = CONFIG.practiceTables.slice();
save.tricky = save.tricky.filter(f => f && SYM[f.op] && Number.isInteger(f.x) && Number.isInteger(f.y) && f.t >= 1 && f.t <= 8).slice(-40);

function trackSave(id) { return save.tracks[id] || (save.tracks[id] = { best: 0, stars: 0, wins: 0, races: 0, points: 0 }); }
const totalStars = () => Object.values(save.tracks).reduce((a, t) => a + (t.stars || 0), 0);
/** The track to suggest next: after 3 wins on a track, the one after it. */
function suggestedTrack() { let s = 1; for (let t = 1; t < 7; t++) if ((trackSave(t).wins || 0) >= CONFIG.moveUpAfterWins) s = t + 1; return s; }
function trickyFor(track) {

}
/** A missed fact goes on the tricky list (up to 3 "misses owed") and comes back in the next races.
    A right answer pays one back only in a LATER race than the last miss, so a quick retry in the same
    race (short-term memory) does not clear it: it has to stick until next time. */
function noteTricky(q, ok) {
  const i = save.tricky.findIndex(f => f.t === q.track && f.op === q.op && f.x === q.x && f.y === q.y);
  if (!ok) {
    if (i >= 0) { save.tricky[i].n = Math.min(3, save.tricky[i].n + 1); save.tricky[i].r = save.races; }
    else { save.tricky.push({ t: q.track, op: q.op, x: q.x, y: q.y, n: 1, r: save.races }); if (save.tricky.length > 40) save.tricky.shift(); }
  } else if (i >= 0 && save.tricky[i].r !== save.races && --save.tricky[i].n <= 0) save.tricky.splice(i, 1);
}

const S = {

  track: save.lastTrack || 1, mode: save.mode, players: save.players,
  race: null, seed: 0, phase: 'idle', cd: 0, goT: 0, resultT: 0, P: [], infos: [], laneOrder: [0, 1, 2, 3], results: null
};
const VIEWS = [];   // the race views (index = player)
const HALVES = [0, 1].map(i => {
  const el = $('half' + i); el.appendChild($('halfTpl').content.cloneNode(true));

function playerInfo(i) {

  let face = i === 0 ? own : pc.fallback; if (i === 1 && face === own) face = '🐯';

function rivalInfo(r, n) { return { key: r.kind, kind: r.kind, color: r.color, dark: r.dark, face: '', num: String(n), name: r.name, short: r.name }; }
function infosFor(race) { return race.karts.map(k => k.human ? playerInfo(k.player) : rivalInfo(CONFIG.rivals[k.rival], k.rival + 3)); }

/* =====================================================================================
   Starting, answering and finishing a race
   ===================================================================================== */
function startRace(track, opts) {

  const rr = makeRng(S.seed);

  S.P = S.race.karts.filter(k => k.human).map((k, i) => ({
    idx: i, kart: k, deck: makeDeck(track, makeRng(S.seed * 31 + i * 977 + 5), { tables: save.tables, tricky: i === 0 ? trickyFor(track) : [] }),
    q: null, typed: '', locked: true, fb: '', fbT: 0, fbAge: 0, picked: null, correct: 0, wrong: 0, streak: 0, bestStreak: 0, times: [], missed: [],
    askedAt: 0, lap: 1, prevPlace: 0, passT: 0, finishedShown: false

  S.phase = 'countdown'; S.cd = 0; S.goT = 0; S.resultT = 0; S.results = null; S.paused = false;
  S.manual = !!opts.manual;
  save.lastTrack = track; save.mode = S.mode; save.players = S.players; persist();
  const scr = $('raceScreen'); scr.classList.toggle('one', S.players === 1); scr.classList.toggle('two', S.players === 2);
  const tc = CONFIG.tracks[track - 1]; $('raceName').innerHTML = ''; $('raceName').append(tc.name); const sm = document.createElement('small'); sm.textContent = tc.skill; $('raceName').append(sm);
  HALVES.forEach(u => { u.choices.hidden = S.mode !== 'choice'; u.keypad.hidden = S.mode !== 'keypad'; });
  VIEWS.forEach(v => { v.scene = sceneOf(track); v.tiles = null; v.pn = 0; v.pops.length = 0; v.lead = 0; });
  showScreen('race'); layoutViews();
  S.P.forEach(p => renderPanel(p));
  if (S.fast) beginRacing(); else sfx('click');
}
function beginRacing() {
  S.phase = 'racing'; S.goT = S.fast ? 0 : 0.9; sfx('powerup');
  S.P.forEach(p => { p.prevPlace = S.race.placeOf(p.kart); nextQuestion(p); });
}
function nextQuestion(p) {
  if (p.kart.finished) { p.q = null; p.locked = true; renderPanel(p); return; }
  p.q = p.deck.next(p.kart.dist / S.race.total); p.askedAt = S.race.t; p.locked = false; p.typed = ''; p.fb = ''; p.picked = null;
  renderPanel(p);
}
/** Answer the current question for player pi. Returns true (right), false (wrong) or null (not taking answers now). */
function answer(pi, value) {
  const p = S.P[pi]; if (!p || !p.q || p.locked || S.phase !== 'racing' || S.paused || p.kart.finished) return null;
  const q = p.q, ok = Number(value) === q.answer, took = S.race.t - p.askedAt, v = VIEWS[pi], ki = S.race.karts.indexOf(p.kart);
  p.locked = true; p.picked = Number(value); p.deck.report(q, ok);

    S.race.right(p.kart, p.streak);
    p.fb = 'right'; p.fbT = S.fast ? 0 : CONFIG.feedback.rightMs / 1000;
    const milestone = CONFIG.race.combo.some(c => c[0] === p.streak);
    sfx(milestone ? 'powerup' : 'coin');
    const turbo = ['Turbo!', 'Super turbo!', 'Mega turbo!'][CONFIG.race.combo.findIndex(c => c[0] === p.streak)];
    addPop(v, ki, milestone ? turbo : pickOne(['Zoom!', 'Vroom!', 'Whoosh!', 'Yes!', 'Super!']), milestone ? '#ffd23f' : '#fff', milestone);
    for (let j = 0; j < (REDUCED ? 3 : 10); j++) addPart(v, 2, p.kart.dist + (visRng() - 0.3) * 6, p.kart.lane + 0.2 + visRng() * 0.6, p.kart.v * 0.9 + (visRng() - 0.5) * 8, (visRng() - 0.7) * 2, 0.6, 0.18 + visRng() * 0.14);

    p.fb = 'wrong'; p.fbT = S.fast ? 0 : (S.track === 1 ? CONFIG.feedback.wrongMsEasy : CONFIG.feedback.wrongMs) / 1000; p.fbAge = 0;
    sfx('click');
    for (let j = 0; j < 4; j++) addPart(v, 3, p.kart.dist + (visRng() - 0.5) * 4, p.kart.lane + 0.5 + visRng() * 0.3, p.kart.v * 0.6, -0.4, 0.8, 0.25);

function tapChoice(pi, j) { const p = S.P[pi]; if (!p || !p.q || p.locked) return; answer(pi, p.q.choices[j]); }
function keyIn(pi, k) {

  else if (k === 'ok') { if (p.typed) answer(pi, +p.typed); return; }
  else if (p.typed.length < 3) { p.typed = (p.typed === '0' ? '' : p.typed) + k; sfx('click'); }

}
/** A tap on the correction moves on (after a moment, so it can be read). */
function skipFeedback(pi) { const p = S.P[pi]; if (p && p.fb === 'wrong' && p.fbAge >= CONFIG.feedback.minWrongMs / 1000) p.fbT = 0; }

function update(dt) {

  if (S.phase === 'countdown') {
    const before = Math.floor(S.cd / CD_STEP); S.cd += dt; const after = Math.floor(S.cd / CD_STEP);
    if (S.cd >= CD_TOTAL) beginRacing(); else if (after !== before) { sfx('click'); S.P.forEach(renderPanel); }
    return;
  }
  if (S.goT > 0) S.goT -= dt;
  const race = S.race;
  let left = dt; while (left > 1e-6) { const h = Math.min(left, 1 / 60); race.step(h); left -= h; }
  if (S.phase === 'done') return;

    if (p.fb) { p.fbAge += dt; if (p.fbT > 0) { p.fbT -= dt; if (p.fbT <= 0) nextQuestion(p); } }
    const v = VIEWS[p.idx], ki = race.karts.indexOf(p.kart), place = race.placeOf(p.kart);
    if (p.passT > 0) p.passT -= dt;
    if (place < p.prevPlace && !p.kart.finished && p.passT <= 0) {
      const passed = race.standings()[place]; if (passed) { addPop(v, ki, 'You passed ' + S.infos[race.karts.indexOf(passed)].short + '!', '#7ff0ff'); sfx('jump'); p.passT = 1.2; }
    }
    p.prevPlace = place;

/** Everyone human is home: finish the rivals, score, save, show the podium. */
function endRace() {
  const race = S.race; race.finishAll(); S.phase = 'done';
  const tc = CONFIG.tracks[S.track - 1], p1 = S.P[0], place = p1.kart.place;
  const points = p1.correct * tc.mult + (place === 1 ? CONFIG.winBonus : 0);
  const stars = place === 1 ? 3 : place === 2 ? 2 : 1;
  const ts = trackSave(S.track), firstWins = ts.wins;
  ts.races++; if (place === 1) ts.wins++; ts.best = ts.best ? Math.min(ts.best, place) : place; ts.stars = Math.max(ts.stars, stars); ts.points = Math.max(ts.points, points);
  save.totalCorrect += p1.correct; save.races++; persist();
  const per = S.P.map(p => ({ place: p.kart.place, correct: p.correct, wrong: p.wrong, acc: p.correct + p.wrong ? Math.round(100 * p.correct / (p.correct + p.wrong)) : 0,
    fastest: p.times.length ? Math.min(...p.times) : null, bestStreak: p.bestStreak, missed: p.missed.slice() }));
  S.results = { place, points, stars, per, moveUp: place === 1 && S.track < 7 && ts.wins >= CONFIG.moveUpAfterWins && firstWins < CONFIG.moveUpAfterWins + 3, standings: race.standings().map(k => race.karts.indexOf(k)), shownAt: S.time };

/* =====================================================================================
   The question panel (DOM)
   ===================================================================================== */
const RIGHT_WORDS = ['Zoom!', 'Yes!', 'Super!', 'Great!', 'Vroom!', 'Nice one!'];
const KIND_WORDS = ['Good try!', 'Nearly!', 'Nice try!', 'Almost!'];
function setMain(ui, text, box) {
  ui.qmain.textContent = ''; const t = document.createElement('span'); t.className = 'qt'; t.textContent = text; ui.qmain.append(t);
  if (box != null) { const b = document.createElement('span'); b.className = 'qbox'; b.textContent = box; ui.qmain.append(b); }
  // shrink a long line to fit (never below 28px)
  ui.qmain.style.fontSize = ''; let size = parseFloat(getComputedStyle(ui.qmain).fontSize) || 36;
  while (ui.qmain.scrollWidth > ui.qmain.clientWidth + 1 && size > 28) { size -= 2; ui.qmain.style.fontSize = size + 'px'; }
}
function renderPanel(p) {
  const ui = HALVES[p.idx], q = p.q, cls = ui.qline.classList;
  cls.remove('right', 'wrong', 'done');
  ui.choices.classList.remove('locked'); ui.keypad.classList.remove('locked');
  ui.ans.forEach(b => b.classList.remove('isRight', 'isOops'));
  ui.qpanel.classList.toggle('racing-off', S.phase === 'countdown' || p.kart.finished);

  }

}

    const b = document.createElement('button'); b.textContent = '×' + n; b.dataset.t = n; b.setAttribute('aria-label', n + ' times table');
    b.addEventListener('click', () => {
      const i = save.tables.indexOf(n); if (i >= 0) { if (save.tables.length > 1) save.tables.splice(i, 1); } else save.tables.push(n);
      save.tables.sort((a, c) => a - c); persist(); refreshTables(); sfx('click');
    });
    grid.append(b);
  }
  refreshTables(); $('practiceScreen').hidden = false;
}
function refreshTables() { $('tableGrid').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(save.tables.includes(+b.dataset.t)))); }

/* ---------- Results ---------- */
function chip(text, cls) { const c = document.createElement('span'); c.className = 'chip' + (cls ? ' ' + cls : ''); c.textContent = text; return c; }
function showResults() {
  const R = S.results, tc = CONFIG.tracks[S.track - 1], two = S.players === 2;
  showScreen('results');
  let title;
  if (!two) title = R.place === 1 ? 'You won! 🏆' : R.place === 2 ? 'So close! 2nd place!' : R.place === 3 ? '3rd place! Nice racing!' : 'You finished! Well done!';
  else { const a = R.per[0].place, b = R.per[1].place; title = a < b ? 'Player 1 wins! 🏆' : 'Player 2 wins! 🏆'; }
  $('resTitle').textContent = title;
  const stats = $('resStats'); stats.textContent = ''; const rows = $('resRows'); rows.textContent = ''; rows.hidden = !two;
  if (!two) {
    const p = R.per[0];
    stats.append(chip('✅ ' + p.correct + ' right (' + p.acc + '%)', 'good'));
    if (p.fastest != null) stats.append(chip('⚡ Fastest ' + p.fastest.toFixed(1) + ' s'));
    if (p.bestStreak >= 3) stats.append(chip('🔥 ' + p.bestStreak + ' in a row'));
    stats.append(chip('⭐'.repeat(R.stars) + ' ' + R.points + ' points', 'star'));
  } else {
    R.per.forEach((p, i) => {
      const r = document.createElement('div'); r.className = 'resRow';
      r.innerHTML = '<b></b><span></span>';
      r.querySelector('b').textContent = S.infos[S.race.karts.indexOf(S.P[i].kart)].face + ' ' + ordinal(p.place);
      r.querySelector('span').textContent = 'Player ' + (i + 1) + ': ' + p.correct + ' right (' + p.acc + '%)' + (p.fastest != null ? ' ⚡' + p.fastest.toFixed(1) + ' s' : '');
      rows.append(r);
    });
    stats.append(chip('⭐ Player 1: ' + R.points + ' points', 'star'));
  }
  const missed = R.per[0].missed.concat(two ? R.per[1].missed : []).filter((m, i, a) => a.findIndex(o => o.key === m.key) === i).slice(0, 3);
  $('resPractise').textContent = missed.length ? "Let's practise " + missed.map(m => m.text + ' = ' + m.answer).join(',  ') + '!' : 'No mistakes at all. Super maths!';
  const mu = $('resMoveUp'); mu.hidden = !R.moveUp; if (R.moveUp) mu.textContent = 'You have won ' + CONFIG.moveUpAfterWins + ' races here! Ready for ' + CONFIG.tracks[S.track].name + '?';
  const hasNext = S.track < 7; $('nextBtn').hidden = !hasNext;
  $('againBtn').className = 'big-btn' + (R.moveUp ? ' alt' : ''); $('nextBtn').className = 'big-btn ' + (R.moveUp || R.place === 1 ? 'go' : 'alt');
  if (R.place === 1 || (two && Math.min(R.per[0].place, R.per[1].place) === 1)) { try { BRB.fx.confetti(); } catch (e) { /* ignore */ } }
  else sfx('coin');
  sizePodium(); ($('nextBtn').hidden ? $('againBtn') : (R.moveUp ? $('nextBtn') : $('againBtn'))).focus({ preventScroll: true });
}
function sizePodium() { const cv = $('podium'), w = Math.round(cv.clientWidth), h = Math.round(cv.clientHeight), d = DPR(); if (w && (cv.width !== Math.round(w * d) || cv.height !== Math.round(h * d))) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); } }
function drawPodium(time) {
  const cv = $('podium'), R = S.results; if (!R || !cv.width) return;
  const g = cv.getContext('2d'), d = DPR(), w = cv.width / d, h = cv.height / d, t = time - R.shownAt;
  g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, w, h);
  g.save(); rrect(g, 0, 0, w, h, 18); g.clip();
  g.fillStyle = vgrad(g, 0, h, ['#8fd3ff', '#d9f2ff']); g.fillRect(0, 0, w, h);
  // cheering crowd at the back
  const cols = ['#ff5d8f', '#ffd23f', '#3a7bff', '#2ec4b6', '#ff8c42', '#a06cd5'];
  for (let i = 0; i < 16; i++) { const x = (i + 0.5) * w / 16, jump = REDUCED ? 0 : Math.max(0, Math.sin(time * 6 + i * 1.3)) * 5, y = h * 0.42 - jump; disc(g, x, y + 10, 9, cols[i % 6]); disc(g, x, y, 7, '#ffd9b3'); if (i % 2 === 0) { g.strokeStyle = cols[(i + 2) % 6]; g.lineWidth = 3; g.lineCap = 'round'; g.beginPath(); g.moveTo(x + 6, y + 6); g.lineTo(x + 12, y - 8 - jump); g.stroke(); } }
  g.fillStyle = '#7bd26b'; g.fillRect(0, h * 0.5, w, h * 0.5);
  const bw = Math.min(110, w * 0.24), cx = w * 0.42, base = h - 6;
  const steps = [{ place: 2, x: cx - bw, hgt: h * 0.3 }, { place: 1, x: cx, hgt: h * 0.4 }, { place: 3, x: cx + bw, hgt: Math.max(40, h * 0.23) }];
  for (const st of steps) {
    const ki = R.standings[st.place - 1], info = S.infos[ki], top = base - st.hgt;
    g.fillStyle = PLACE_COL[st.place - 1]; rrect(g, st.x - bw / 2 + 2, top, bw - 4, st.hgt, 8); g.fill();
    g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(st.x - bw / 2 + 2, top + st.hgt * 0.75, bw - 4, st.hgt * 0.25);
    g.fillStyle = '#2a1846'; g.font = '700 ' + Math.round(Math.min(28, st.hgt * 0.42)) + 'px ' + FONT; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(st.place), st.x, top + Math.min(st.hgt * 0.32, 20));
    const hs = Math.min(bw * 0.7, h * 0.34), drop = REDUCED ? 0 : Math.max(0, 1 - t * 2.2 + (st.place - 1) * 0.25), bounce = REDUCED ? 0 : Math.abs(Math.sin(time * 3 + st.place)) * (st.place === 1 ? 4 : 2);
    const sp = headSprite(info, hs, d); g.drawImage(sp.c, st.x - hs / 2, top - hs - 4 - drop * h * 0.6 - bounce, hs, hs);
    g.font = '700 ' + Math.round(Math.min(15, bw * 0.16)) + 'px ' + FONT; g.fillStyle = '#2a1846'; g.fillText(info.short, st.x, base - 9);
  }
  // 4th place waves from the side
  const k4 = R.standings[3], i4 = S.infos[k4], hs4 = Math.min(bw * 0.5, h * 0.26), x4 = Math.min(w - hs4 / 2 - 8, cx + bw * 2.05);
  g.drawImage(headSprite(i4, hs4, d).c, x4 - hs4 / 2, base - hs4 - 18, hs4, hs4);
  g.fillStyle = '#2a1846'; g.font = '700 ' + Math.round(Math.min(15, hs4 * 0.32)) + 'px ' + FONT; g.textAlign = 'center'; g.fillText('4th ' + i4.short, x4, base - 7);
  g.restore();
}

/* =====================================================================================
   Title screen demo race (rivals and your kart zooming past, a new scenery each time)
   ===================================================================================== */
const demo = { view: makeView($('titleCanvas'), 'title'), race: null, infos: null, next: 0, sceneIdx: 0 };
function newDemo() {
  demo.sceneIdx = demo.sceneIdx % 7 + 1; demo.view.scene = demo.sceneIdx; demo.view.tiles = null; demo.view.pn = 0;
  const saved = S.players; S.players = 1; demo.race = makeRace(1, 1, makeRng(demo.sceneIdx * 99)); demo.infos = infosFor(demo.race); S.players = saved;
  demo.race.karts.forEach(k => { k.dist = 40 + k.lane * 6; });
  demo.next = 1; demo.t = 0;
}
function drawDemo(dt, time) {
  const v = demo.view; sizeView(v, innerWidth, innerHeight); if (!v.m) return;
  if (!demo.race || demo.t > 16) newDemo();
  const race = demo.race; demo.t += dt;
  race.step(dt); demo.next -= dt; const me = race.karts[0];
  if (demo.next <= 0) { race.right(me, 2); demo.next = 1.6 + visRng() * 1.4; }
  if (!v.tiles) buildTiles(v);
  const cam = race.karts.reduce((a, k) => a + k.dist, 0) / race.karts.length;
  v.g.setTransform(v.dpr, 0, 0, v.dpr, 0, 0); drawScene(v, cam);
  const savedOrder = S.laneOrder; S.laneOrder = race.karts.map((k, i) => i).sort((a, b) => race.karts[a].lane - race.karts[b].lane);
  emitKartParts(v, race, dt); stepParts(v, dt); drawParts(v, cam, false);
  for (const i of S.laneOrder) { const k = race.karts[i]; drawKart(v, k, demo.infos[i], sx(v, cam, k.dist), laneY(v, k.lane), time); }
  S.laneOrder = savedOrder; drawAmbient(v, dt, time, 20);
}

/* =====================================================================================
   Layout and the main loop
   ===================================================================================== */
function layoutViews() {
  VIEWS.forEach((v, i) => { const box = v.cv.parentElement; if (box.offsetParent === null) return; sizeView(v, box.clientWidth, box.clientHeight); });
  if (S.screen === 'results') sizePodium();
}
if (window.ResizeObserver) { const ro = new ResizeObserver(layoutViews); VIEWS.forEach(v => ro.observe(v.cv.parentElement)); ro.observe($('podium')); }
window.addEventListener('resize', layoutViews);

let last = performance.now(), frameGaps = null;
function frame(now) {
  const raw = now - last, dt = Math.min(0.05, Math.max(0, raw / 1000)); last = now; S.time += dt;
  if (frameGaps) frameGaps.push(raw);
  if (S.screen === 'title') drawDemo(dt, S.time);
  else if (S.screen === 'race' || S.screen === 'results') {
    if (!S.paused && !S.manual) update(dt);
    const vdt = S.paused ? 0 : dt;
    for (let i = 0; i < S.players; i++) drawRaceView(VIEWS[i], vdt, S.time);
    if (S.screen === 'results') drawPodium(S.time);
  }
  requestAnimationFrame(frame);
}

/* =====================================================================================
   Buttons and keys
   ===================================================================================== */
function updateMute() { const m = BRB.sfx.muted; document.querySelectorAll('.mute').forEach(b => { b.textContent = m ? '🔇' : '🔊'; b.setAttribute('aria-label', m ? 'Turn sound on' : 'Turn sound off'); }); }
document.querySelectorAll('.mute').forEach(b => b.addEventListener('click', () => { BRB.sfx.mute(); updateMute(); sfx('click'); }));
$('playBtn').addEventListener('click', () => { sfx('powerup'); showPicker(); });
$('backBtn').addEventListener('click', () => { sfx('click'); showScreen('title'); });
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { S.mode = b.dataset.mode; save.mode = S.mode; persist(); showPicker(); sfx('click'); }));
document.querySelectorAll('[data-players]').forEach(b => b.addEventListener('click', () => { S.players = +b.dataset.players; save.players = S.players; persist(); showPicker(); sfx('click'); }));
$('practiceGo').addEventListener('click', () => { sfx('powerup'); startRace(8); });
$('practiceBack').addEventListener('click', () => { sfx('click'); $('practiceScreen').hidden = true; });
$('pauseBtn').addEventListener('click', () => setPaused(true));
$('resumeBtn').addEventListener('click', () => setPaused(false));
$('restartBtn').addEventListener('click', () => { sfx('click'); startRace(S.track); });
$('quitBtn').addEventListener('click', () => { sfx('click'); quitToPicker(); });
$('againBtn').addEventListener('click', () => { sfx('click'); startRace(S.track); });
$('nextBtn').addEventListener('click', () => { sfx('powerup'); startRace(Math.min(7, S.track + 1)); });
$('menuBtn').addEventListener('click', () => { sfx('click'); quitToPicker(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && S.screen === 'race' && S.phase !== 'done') setPaused(true); });

document.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'p' || k === 'P' || k === 'Escape') {
    if (S.screen === 'race' && !S.paused && S.phase !== 'done') { setPaused(true); e.preventDefault(); }
    else if (S.paused) { setPaused(false); e.preventDefault(); }
    else if (!$('practiceScreen').hidden && k === 'Escape') $('practiceScreen').hidden = true;
    return;
  }
  if (k === 'm' || k === 'M') { BRB.sfx.mute(); updateMute(); return; }
  if (S.screen !== 'race' || S.paused || S.phase !== 'racing') return;
  // Player 1 types answers in both modes: digits, Backspace, then Enter.
  const p = S.P[0]; if (!p) return;
  if (/^[0-9]$/.test(k)) { keyIn(0, k); e.preventDefault(); }
  else if (k === 'Backspace') { keyIn(0, 'back'); e.preventDefault(); }
  else if (k === 'Enter' && p.typed) { keyIn(0, 'ok'); e.preventDefault(); }
  else if ((k === 'Enter' || k === ' ') && p.fb === 'wrong') { skipFeedback(0); e.preventDefault(); }
});

updateMute();
showScreen('title');
requestAnimationFrame(frame);

/* =====================================================================================
   window.__brbTest: hooks for automated play tests (harmless in production).
     state()            -> { screen, track, mode, players, phase, paused, question: {text, answer, choices} | null (player 1),
                             place, lap, progress: [0..1 per kart], correct, wrong, streak, finished (player 1),
                             p: [per player { question, place, lap, correct, wrong, streak, finished, typed, feedback, missed }],
                             karts: [{ id, name, human, dist, v, place, finished, lane }], countdown, results }
     start({ track: 1-8, mode: 'choice'|'keypad', players: 1|2, seed, tables: [2..12], manual })
                        -> starts a race (countdown first unless skipAnimations() is on). manual: true stops the
                           real-time clock so only step() moves the race.
     answer(value, player = 0) -> true (right) / false (wrong) / null (not taking answers right now)
     step(ms)           -> advance the game by ms in 1/60 s steps (also switches to the manual clock)
     realtime()         -> back to the real-time clock
     skipAnimations(on = true) -> no countdown, no feedback pauses, results straight away
     finish({ every = 3, accuracy = 1 } = {}) -> fast-forward: every human answers every `every` race-seconds,
                           right with probability `accuracy` (seeded), until the podium shows. Returns state().
     questionsFor(track, n, seed, opts) -> n questions from a fresh deck (progress runs 0..1 every 30
                           questions, all answered right), each { text, answer, choices, op, x, y, regroup }
     deck(track, seed)  -> a raw deck { next(progress), report(q, ok), due } for repeat tests
     seed(n)            -> the seed for the next start() without one
     pause(on), quit(), tricky() (the saved tricky facts), save() (a copy of the whole save),
     frameStats(start)  -> start collecting rAF gaps; frameStats() returns them
   ===================================================================================== */
let nextSeed = null;
window.__brbTest = {
  state() {
    const race = S.race, p1 = S.P[0];
    const pq = p => p && p.q ? { text: p.q.text, answer: p.q.answer, choices: p.q.choices.slice(), key: p.q.key, review: !!p.q.review, tricky: !!p.q.tricky } : null;
    return {
      screen: S.screen, track: S.track, mode: S.mode, players: S.players, phase: S.phase, paused: S.paused,
      question: pq(p1),
      place: race && p1 ? race.placeOf(p1.kart) : 0, lap: race && p1 ? race.lapOf(p1.kart) : 0,
      progress: race ? race.karts.map(k => Math.min(1, k.dist / race.total)) : [],
      correct: p1 ? p1.correct : 0, wrong: p1 ? p1.wrong : 0, streak: p1 ? p1.streak : 0, finished: !!(p1 && p1.kart.finished),
      p: !race ? [] : S.P.map(p => ({ question: pq(p), place: race.placeOf(p.kart), lap: race.lapOf(p.kart), correct: p.correct, wrong: p.wrong, streak: p.streak, finished: p.kart.finished, typed: p.typed, feedback: p.fb, locked: p.locked, missed: p.missed.map(m => m.text) })),
      karts: race ? race.karts.map((k, i) => ({ id: k.id, name: S.infos[i].name, human: k.human, dist: +k.dist.toFixed(1), v: +k.v.toFixed(2), place: race.placeOf(k), finished: k.finished, finishTime: k.finishTime, lane: k.lane })) : [],
      raceTime: race ? race.t : 0, total: race ? race.total : 0, countdown: S.phase === 'countdown' ? S.cd : 0,
      results: S.results ? JSON.parse(JSON.stringify(S.results)) : null
    };
  },
  start(opts = {}) {
    if (opts.mode === 'choice' || opts.mode === 'keypad') S.mode = opts.mode;
    if (opts.players === 1 || opts.players === 2) S.players = opts.players;
    if (Array.isArray(opts.tables) && opts.tables.length) save.tables = opts.tables.filter(n => n >= 2 && n <= 12);
    const track = Math.max(1, Math.min(8, opts.track | 0 || S.track || 1));
    startRace(track, { seed: opts.seed != null ? opts.seed : nextSeed, manual: !!opts.manual });
    return this.state();
  },
  answer(value, player = 0) { return answer(player, value); },
  step(ms) { S.manual = true; let left = ms / 1000; while (left > 1e-9) { const h = Math.min(1 / 60, left); update(h); left -= h; } return this.state(); },
  realtime() { S.manual = false; },
  skipAnimations(on = true) { S.fast = on !== false; if (S.fast && S.phase === 'countdown') beginRacing(); return S.fast; },
  finish(opts = {}) {
    if (!S.race || S.phase === 'done') return this.state();
    const every = opts.every || 3, acc = opts.accuracy == null ? 1 : opts.accuracy, r = makeRng((S.seed ^ 0x5eed) >>> 0), was = S.fast;
    S.fast = true; if (S.phase === 'countdown') beginRacing();
    const nextAt = S.P.map(() => S.race.t + every);
    for (let guard = 0; S.phase !== 'done' && guard < 60 * 900; guard++) {
      update(1 / 30);
      S.P.forEach((p, i) => { if (p.q && !p.locked && S.race.t >= nextAt[i]) { const right = r() < acc; answer(i, right ? p.q.answer : p.q.choices.find(c => c !== p.q.answer)); nextAt[i] = S.race.t + every; } });
    }
    S.fast = was; return this.state();
  },
  questionsFor(track, n = 100, seed = 1, opts = {}) {
    const deck = makeDeck(track, makeRng(seed), { tables: opts.tables || save.tables }), out = [];
    for (let i = 0; i < n; i++) { const q = deck.next((i % 30) / 30); deck.report(q, true); out.push({ text: q.text, answer: q.answer, choices: q.choices, op: q.op, x: q.x, y: q.y, regroup: q.regroup }); }
    return out;
  },
  deck(track, seed = 1) { return makeDeck(track, makeRng(seed), { tables: save.tables }); },
  seed(n) { nextSeed = n >>> 0; return nextSeed; },
  pause(on = true) { setPaused(on); return this.state(); },
  quit() { quitToPicker(); return this.state(); },
  tricky() { return JSON.parse(JSON.stringify(save.tricky)); },
  save() { return JSON.parse(JSON.stringify(save)); },
  frameStats(start) { if (start) { frameGaps = []; return true; } const g = frameGaps || []; frameGaps = null; return g; }
};
</script>
