<title>Sky Lines</title>
<!-- Sky Lines: Number Quest Pro Unit 5, The Sky Wires (grade 8, ages 13-14). Floating islands at sunset, on
     Oomba3D 1.2.0 in the Sky Islands theme 1.0.1: a big board on the deck shows a grid of 12 by 8 squares with
     islands on it, a wire is a straight line across it, and a flag is planted on the far island for each finished
     round. Three chapters of six rounds:
       slope (5.1) the steepness of a wire: up over across from island A to island B (also going down, in all four
                   quadrants), two stairs of different sizes under one wire, a steady rate as a wire through the
                   start, and two rates compared;
       rule  (5.2) a wire as a rule, y = mx + b: where it is after so many steps, its start height and steepness
                   from a table, a story, two islands and a drawn wire, and the table that is not a straight wire;
       meet  (5.3) where two wires meet: the step where two rules are equal, the platform on the point of both
                   wires, wires that never meet, two rules for one wire, and an equation with brackets and x on
                   both sides.
     Made for ages 11 to 14: plan first, then run. The player sets a wire's numbers with a stepper, puts a platform
     on a grid point, or picks one of three tiles, and runs the plan; the board never draws a wire before it is run,
     and a wrong plan is run too and shown as it really turns out (the wire as set, and by how much it misses) with
     a spoken hint, and the round stays open. No timer, no lives, no fail state, nothing typed, nothing bought or
     sold. Read-aloud is on by default (BRB.speak, the shared path; the speaker button says a line again): lines are
     written the way they are said. Keys: arrows or + and - move the stepper, F changes which dial it turns, the
     four arrows move the platform, Enter runs, 1 to 3 pick a tile. Lesson mode: BRB.params { chapter: slope | rule
     | meet, lock: 1 } opens that chapter only; finishing its six rounds reports game over, won, once (the course
     step's completion signal). With no parameters the game offers the three chapters from a menu. Saves only which
     chapters are finished (BRB.storage 'sky-lines-v1'). The import map below is exactly kit2ImportMap()
     (server/services/vendor.js); tests/unit/sky-lines.test.js fails if a library bump leaves it behind.
     English only, like Number Quest's other lesson games. Test handle: window.__sl (also window.__brbTest, the

/** The controls say the plan again: the stepper's number, or the dial button. */
function showValue(Rd) {

  if (b) { b.querySelector('.big').textContent = valueText(Rd, S.value); b.querySelector('.l').textContent = '⇄ ' + dialName(Rd); b.setAttribute('aria-label', dialName(Rd) + ' ' + valueText(Rd, S.value) + '. ' + fmt('btn.dial')); }

  shipFlag(guard(() => { sfx('cheer'); heroMove('cheer', 1700); pauseForSpeech(reduced ? 3.6 : 2.4, guard(nextRound)); }));
}
// Keys: the arrows (or + and −) move the stepper, and F changes which dial it turns; the four arrows move the
// platform; Enter runs the plan; 1 to 3 pick a tile. Every control is also a button, so Tab, Enter and Space work too.
addEventListener('keydown', ev => {

  if (k === 'Enter' && !onButton) { run(); ev.preventDefault(); }

const shownIn = o => { for (let q = o; q; q = q.parent) if (!q.visible) return false; return true; };
const ray = new THREE.Raycaster();

window.__sl = window.__brbTest = {
  state: () => ({ game: 'sky-lines', screen: S.screen, chapter: S.chapter, lock: S.lock, round: S.round, rounds: SL.ROUNDS, phase: S.phase, hero: S.hero ? S.hero.id : null, reported: S.reported, tall,
    ...(S.R && S.screen === 'play' ? { ...S.R, mode: S.mode, value: S.value, dial: S.dial, tried: S.draw, moving: tweens.length, onStage: { board: stage.children.includes(board) && board.visible, flags: rack.children.length } } : {}) }),
  fast: on => { S.fast = on !== false; },
  /** 'set' a plan, 'run' it, 'answer' a tile, or 'solve' the round the right way. */

  spot: () => {

      board: { box: bx, small: Math.round(S.small * (bx[2] - bx[0]) / CW * 10) / 10,
        clear: [[0, 0], [-k, -k], [k, -k], [k, k], [-k, k], [0, -k], [0, k]].every(([dx, dy]) => clearTo(V3(BOARD.x + dx * BW, BOARD.y + dy * BH, BOARD.z))) },

  at: (x, y) => { const bx = boxOf(board); return [Math.round(bx[0] + gx(x) / CW * (bx[2] - bx[0])), Math.round(bx[1] + gy(y) / CH * (bx[3] - bx[1]))]; },
};
