<title>Gulp City</title>
<style>
/* Gulp City: a tiny black hole that swallows a whole city. Its own Three.js world (no Oomba Kit): one full-screen canvas,
   its own screens (title, how to play, settings, pause, swallowed, results) and HUD. Colours are the tokens below. */
:root{--g-card:#fffdf7;--g-text:#1c1a33;--g-edge:#1c1a33;--g-go:#7c5cff;--g-go-text:#ffffff;--g-hot:#ff7a59;--g-soft:#efeaff;--g-dim:rgba(28,26,51,.42);--g-good:#2fbf71;--g-bar:#e3dcff;--ts:1}
:root.dark{--g-card:#221f3d;--g-text:#fff8ee;--g-edge:#07061a;--g-soft:#2f2a55;--g-dim:rgba(5,4,18,.55);--g-bar:#3b3566}
:root.hc{--g-edge:#000;--g-dim:rgba(0,0,0,.7)}
:root.hc.dark{--g-card:#000;--g-text:#fff;--g-edge:#fff}
:root.hc:not(.dark){--g-card:#fff;--g-text:#000}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#a8dcff;touch-action:none;user-select:none;-webkit-user-select:none}
body{font:700 calc(16px * var(--ts))/1.3 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;color:var(--g-text)}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font:inherit;font-weight:800;cursor:pointer;color:var(--g-text)}
.btn{min-height:48px;min-width:48px;padding:8px 20px;border-radius:999px;border:3px solid var(--g-edge);background:var(--g-go);color:var(--g-go-text);box-shadow:0 4px 0 var(--g-edge);font-size:calc(19px * var(--ts));line-height:1.1}
.btn small{display:block;font-size:.62em;font-weight:700;opacity:.9}
.btn.ghost{background:var(--g-card);color:var(--g-text)}
.btn.hot{background:var(--g-hot);color:#1c1a33}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--g-edge)}
.btn:focus-visible,.icon:focus-visible,.seg button:focus-visible{outline:3px solid var(--g-hot);outline-offset:2px}
.icon{width:48px;height:48px;padding:0;border-radius:50%;border:3px solid var(--g-edge);background:var(--g-card);box-shadow:0 3px 0 var(--g-edge);font-size:20px;line-height:1;flex:none}
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:var(--g-dim);padding:12px;box-sizing:border-box}
#titleScreen{background:linear-gradient(180deg,rgba(28,26,51,.05),rgba(28,26,51,.45))}
.card{background:var(--g-card);border:3px solid var(--g-edge);border-radius:24px;box-shadow:0 7px 0 var(--g-edge);padding:18px 20px 20px;max-width:min(460px,100%);max-height:100%;overflow:auto;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.card h1{margin:0;font-size:calc(clamp(26px,6vw,40px) * var(--ts));line-height:1.05;letter-spacing:-.5px}
.card h2{margin:0;font-size:calc(26px * var(--ts));line-height:1.1}
.card p{margin:0}
.logo{display:flex;align-items:center;gap:10px;justify-content:center}
.swirl{width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle at 50% 50%,#000 0 34%,#3a1f7a 46%,#7c5cff 60%,#5cf2ff 72%,transparent 74%);box-shadow:0 0 0 3px var(--g-edge)}
.tag{opacity:.85;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.seg{display:flex;border:3px solid var(--g-edge);border-radius:999px;overflow:hidden;background:var(--g-card)}
.seg button{min-height:42px;min-width:64px;padding:4px 12px;border:0;background:transparent;font-size:calc(16px * var(--ts))}
.seg button+button{border-inline-start:3px solid var(--g-edge)}
.seg button[aria-pressed=true]{background:var(--g-go);color:var(--g-go-text)}
.seglabel{font-size:calc(14px * var(--ts));opacity:.8}
.how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;text-align:start}
.how li{display:flex;gap:10px;align-items:center}
.how li span:first-child{font-size:26px;flex:none;width:34px;text-align:center}
.set{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;width:100%;text-align:start}
.toggle{min-height:44px;min-width:76px;border-radius:999px;border:3px solid var(--g-edge);background:var(--g-soft);padding:4px 12px;font-size:calc(16px * var(--ts))}
.toggle[aria-pressed=true]{background:var(--g-good);color:#08210f}
.stars{font-size:34px;letter-spacing:4px;line-height:1}
.big{font-size:calc(20px * var(--ts))}
.btn:disabled{opacity:.5;cursor:default;box-shadow:0 4px 0 var(--g-edge);transform:none}
.load{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-size:calc(15px * var(--ts))}
.load[hidden]{display:none!important}
.lbar{flex:1;max-width:200px;height:10px;border-radius:10px;background:var(--g-bar);border:2px solid var(--g-edge);overflow:hidden}
#loadFill{display:block;height:100%;width:3%;background:linear-gradient(90deg,#7c5cff,#5cf2ff);transition:width .25s}
#loadPct{min-width:3ch;text-align:end;font-variant-numeric:tabular-nums}
.failicon{font-size:48px;line-height:1}
#hud{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;align-items:flex-start;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));pointer-events:none}
#hud .gap{flex:1}
#hud button{pointer-events:auto}
.pill{background:var(--g-card);border:3px solid var(--g-edge);border-radius:16px;padding:4px 12px;box-shadow:0 3px 0 var(--g-edge);white-space:nowrap}
#sizeBox{display:flex;flex-direction:column;gap:3px;min-width:118px;padding-inline:13px 15px;flex:none}
#sizeTop{display:flex;justify-content:space-between;gap:8px;font-size:calc(17px * var(--ts))}
#barRow{display:flex;align-items:center;gap:6px;font-size:14px}
#bar{flex:1;height:9px;border-radius:9px;background:var(--g-bar);overflow:hidden;min-width:60px}
#barFill{height:100%;width:0;background:linear-gradient(90deg,#7c5cff,#5cf2ff);border-radius:9px}
#clock{font-size:calc(19px * var(--ts));align-self:flex-start}
#clock.low{background:var(--g-hot);color:#1c1a33}
#side{position:fixed;z-index:9;top:calc(max(8px,env(safe-area-inset-top)) + 58px);inset-inline-end:max(10px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
#board{background:var(--g-card);border:3px solid var(--g-edge);border-radius:14px;box-shadow:0 3px 0 var(--g-edge);padding:5px 9px;min-width:132px;font-size:calc(13px * var(--ts))}
#board h3{margin:0 0 2px;font-size:calc(12px * var(--ts));opacity:.75;text-transform:uppercase;letter-spacing:.4px}
#board ol{list-style:none;margin:0;padding:0}
#board li{display:flex;gap:6px;align-items:center;line-height:1.35}
#board li .dot{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid var(--g-edge)}
#board li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:84px}
#board li.me{color:var(--g-go);font-weight:900}
:root.dark #board li.me{color:#b9a8ff}
#mapBox{position:fixed;z-index:9;bottom:max(10px,env(safe-area-inset-bottom));inset-inline-end:max(10px,env(safe-area-inset-right));width:104px;height:104px;border-radius:16px;border:3px solid var(--g-edge);box-shadow:0 3px 0 var(--g-edge);overflow:hidden;background:#4fb6e8;pointer-events:none}
#map{width:100%;height:100%;display:block}
#banner{position:fixed;z-index:12;left:50%;top:22%;transform:translate(-50%,-50%);pointer-events:none;background:var(--g-card);border:3px solid var(--g-edge);border-radius:20px;box-shadow:0 5px 0 var(--g-edge);padding:10px 18px;font-size:calc(21px * var(--ts));text-align:center;max-width:min(86vw,520px);opacity:0;transition:opacity .25s,transform .25s}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1.04)}
#tip{position:fixed;z-index:11;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 4px);transform:translateX(-50%);pointer-events:none;color:#fffdf7;font-size:calc(17px * var(--ts));text-shadow:0 2px 4px rgba(0,0,0,.6),0 0 2px #000;white-space:nowrap;opacity:0;transition:opacity .3s}
#tip.on{opacity:1}
#stickBase{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,253,247,.25);border:3px solid rgba(28,26,51,.8);display:none;z-index:8;pointer-events:none;transform:translate(-50%,-50%)}
#stickKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#7c5cff;border:3px solid #1c1a33}
@media (max-height:460px){.card{gap:7px;padding:12px 16px 14px}.card h1{font-size:calc(28px * var(--ts))}.swirl{width:34px;height:34px}.btn{min-height:44px;padding:6px 16px;font-size:calc(17px * var(--ts))}#side{top:calc(max(8px,env(safe-area-inset-top)) + 54px)}#mapBox{width:84px;height:84px}}
@media (max-width:420px){#sizeBox{min-width:0;padding-inline:9px 11px}#sizeTop{font-size:calc(15px * var(--ts))}#clock{font-size:calc(16px * var(--ts));padding:4px 8px}#hud .icon{width:44px;height:44px}#hud{gap:6px}#board{min-width:112px}#board li .nm{max-width:64px}}
@media (max-width:380px){#sizeLabel{display:none}}
@media (max-width:560px){#tip{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 124px)}}
@media (min-width:768px) and (min-height:700px){#board{font-size:calc(15px * var(--ts));min-width:160px}#mapBox{width:136px;height:136px}}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}#banner,#banner.on{transition:none;transform:translate(-50%,-50%)}}
