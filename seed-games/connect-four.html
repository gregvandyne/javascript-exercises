<title>Drop Four</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
/* Drop Four: the classic connect-four game. Layout: HUD (pause / whose turn / mute), the match score chips,
   the board (one canvas; discs + plate + preview drawn by script), a message line and a small controls row.
   Overlays for the title screen, pause and results. In short landscape the board sits left and everything
   else stacks in a side column so the cells stay big. */
:root{
  --bg1:#ffe9f4; --bg2:#ffb8dc; --bg3:#b8a4ff;
  --ink:#3b1f47; --accent:#ff3d8b; --accentDark:#c21463; --card:#fff; --soft:#fff0f7; --softEdge:#ffc2dd;
  --board:#2f62e6; --font:"Fredoka","Trebuchet MS",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;font-family:var(--font);color:var(--ink);
  background:radial-gradient(circle at 20% 0%,var(--bg1),var(--bg2) 45%,var(--bg3));
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
.app{position:relative;height:100%;max-width:980px;margin:0 auto;display:grid;gap:8px;align-content:center;
  padding:10px max(12px,env(safe-area-inset-left)) 12px max(12px,env(safe-area-inset-right));
  grid-template-areas:"hud" "scores" "board" "msg" "ctrl";grid-template-rows:auto auto auto auto auto;grid-template-columns:minmax(0,1fr);
  transition:transform .45s ease}
.app.offstage{visibility:hidden} /* the title screen covers the game; keep the live HUD out of sight */
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #fff;outline-offset:2px}
.panel button:focus-visible{outline-color:var(--ink)} /* the panels are white, so a white ring would be invisible there */
.hud{grid-area:hud;display:flex;align-items:center;gap:8px}
.turn{flex:1;min-width:0;display:flex;justify-content:center}
.turn div{background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:1.1rem;line-height:1.15;box-shadow:0 3px 0 rgba(0,0,0,.15);
  text-align:center;overflow-wrap:break-word;border:3px solid var(--who,#fff);max-width:100%;transition:border-color .2s}
.turn div.long{font-size:.95rem}   /* long names wrap to a second line instead of being cut off */
.turn div.thinking{animation:breathe 1.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.icon-btn{width:46px;height:46px;flex:none;border:0;border-radius:50%;background:#fff;font-size:1.35rem;box-shadow:0 4px 0 rgba(0,0,0,.18);display:grid;place-items:center;padding:0}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.scores{grid-area:scores;display:flex;align-items:stretch;justify-content:center;gap:8px} /* both chips the same height, even when one name is shrunk */
/* A chip is a small grid: the name (and, in a series, the win dots under it) on the left, the win count on the right.
   Putting the dots under the name instead of beside it keeps even a 12-letter name on one line at phone width. */
.pchip{max-width:300px;flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:6px;row-gap:3px;align-items:center;align-content:center;background:#fff;border-radius:16px;padding:5px 9px;border:3px solid var(--pc,#fff);
  box-shadow:0 3px 0 rgba(0,0,0,.12);font-weight:700;font-size:1rem;transition:transform .2s,box-shadow .2s}
.pchip.active{transform:translateY(-2px) scale(1.03);box-shadow:0 5px 0 rgba(0,0,0,.18)}
.pchip .pname{grid-column:1;min-width:0;line-height:1.1;overflow-wrap:break-word}
.pchip .pname.long{font-size:.8rem}
.pchip .pwins{grid-column:2;font-size:1.35rem;min-width:1.2em;text-align:end}
.pchip.series .pwins{grid-row:1 / span 2} /* the number stays centred beside both lines */
.pchip .sdots{grid-column:1;display:flex;gap:4px} /* "First to 3": one dot per win needed, under the name */
.pchip .sdots i{width:13px;height:13px;border-radius:50%;background:#e9d5f5;display:block;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.pchip .sdots i.on{background:var(--pc)}
.vs{font-weight:700;opacity:.7;flex:none;align-self:center;font-size:.9rem}
@media (max-width:374px){.vs{display:none}.pchip{padding:5px 7px}} /* a 360px phone: the chips need that room for a 12-letter name */
.boardWrap{grid-area:board;position:relative;min-height:0;display:grid;place-items:start center}
canvas#board{display:block;touch-action:none;outline:none;border-radius:16px;transform-origin:top center;transition:transform .45s ease} /* keyboard focus shows as the hovering disc... */
canvas#board.ring:focus-visible{outline:4px solid #fff;outline-offset:3px} /* ...and as a ring whenever no disc is hovering (the robot's turn, the results) */
/* No min-height here: an explicit one would become the row's minimum in the grid and let a two-line message
   spill over the Undo row on a very short screen. An empty message keeps one line with a blank instead. */
.msg{grid-area:msg;text-align:center;font-weight:700;font-size:1.1rem;line-height:1.25;margin:0;text-shadow:0 1px 0 rgba(255,255,255,.6);overflow-wrap:break-word}
.msg:empty::before{content:"\00a0"}
.ctrl{grid-area:ctrl;display:flex;justify-content:center;gap:10px}
.mini{border:0;border-radius:16px;background:#fff;font-weight:700;font-size:1.05rem;padding:10px 18px;min-height:48px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.mini:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.mini:disabled{opacity:.45;cursor:default}
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(59,31,71,.38)}
.screen.results{background:rgba(59,31,71,.14);align-items:flex-end;pointer-events:none} /* the HUD's mute button stays live behind the thin tint */
.screen.results .panel{pointer-events:auto}
.app.over #pauseBtn{visibility:hidden} /* nothing to pause once the game is over */
.panel{position:relative;background:var(--card);border-radius:28px;padding:14px 16px 16px;width:min(100%,440px);max-height:100%;overflow:auto;text-align:center;
  box-shadow:0 10px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;gap:8px}
.panel h1{margin:0;font-size:clamp(2rem,9vw,2.7rem);line-height:1.05;color:var(--accent);letter-spacing:.01em}
.panel h2{margin:0;font-size:clamp(1.5rem,7vw,2rem);line-height:1.1;color:var(--accent)}
.panel p{margin:0;font-size:1.05rem;line-height:1.35}
.panel .hint{font-size:.92rem;opacity:.75}
.logo{width:150px;height:60px;flex:none;display:block} /* flex:none so the panel never squashes the logo */
.kbhint{display:none} /* the keyboard hint only fits on tall screens */
@media (min-height:760px){.kbhint{display:block}}
.row{display:flex;gap:8px;width:100%;justify-content:center}
.row button{flex:1;border:3px solid var(--softEdge);background:var(--soft);border-radius:16px;min-height:44px;font-weight:700;font-size:1rem;padding:6px 5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row button[aria-pressed="true"]{background:var(--accent);border-color:var(--accentDark);color:#fff}
@media (max-width:374px){.row button{font-size:.9rem;padding:6px 3px}} /* three level buttons still fit on a 360px phone */
/* Translated labels: fitButtons() shrinks a label that is too wide; one that still does not fit wraps (never "…"). */
.row button.wrap,.btns .big-btn.wrap,.big-btn.wrap{white-space:normal;line-height:1.1;overflow-wrap:anywhere;text-overflow:clip}
:lang(ar) *{letter-spacing:0!important} /* letter spacing breaks joined Arabic letters */
:lang(ja) .panel p,:lang(ja) .msg,:lang(ja) .turn div{word-break:keep-all;overflow-wrap:anywhere} /* Japanese lines break at the spaces between phrases */
.setup,.setupL,.setupR{display:contents}
.seats{display:flex;flex-direction:column;gap:8px;width:100%}
.seat{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:18px;padding:6px}
.seat .who{flex:none;font-size:1rem;font-weight:700;opacity:.8;width:2.8em;text-align:start;padding-inline-start:4px}
.seat button{border:3px solid var(--softEdge);background:#fff;border-radius:14px;min-height:44px;font-weight:700;font-size:1.1rem;padding:4px 10px}
.seat button.fixed{cursor:default;border-color:transparent;background:transparent} /* the robot's picture and name cannot change: shown as labels */
.seat button.fixed:active{animation:wiggle .35s ease} /* ...but a tap still gets a little beep and wiggle */
@keyframes wiggle{0%,100%{transform:rotate(0)}30%{transform:rotate(-10deg) scale(1.1)}70%{transform:rotate(8deg) scale(1.1)}}
.seat .emojiBtn{flex:none;width:52px;font-size:1.5rem;padding:0}
.seat .nameBtn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .nameBtn.long{font-size:.95rem;padding:4px 6px}
.seat .nameBtn.wrap{white-space:normal;overflow-wrap:anywhere;line-height:1.1} /* a name too wide even at the smallest size wraps instead of being cut */
.panel .mute.corner{position:absolute;top:10px;inset-inline-end:10px}
.seat .colorBtn{flex:none;width:52px;padding:0;display:grid;place-items:center}
.seat .colorBtn i{width:30px;height:30px;border-radius:50%;display:block;background:radial-gradient(circle at 35% 30%,var(--dl),var(--dm) 55%,var(--dd));box-shadow:0 2px 0 rgba(0,0,0,.2)}
.big-btn{border:0;border-radius:20px;background:var(--accent);color:#fff;font-weight:700;font-size:1.5rem;padding:14px 34px;min-height:60px;min-width:200px;box-shadow:0 6px 0 var(--accentDark)}
.big-btn.alt{background:var(--soft);color:var(--ink);box-shadow:0 6px 0 var(--softEdge);font-size:1.15rem;min-height:52px;padding:10px 24px}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accentDark)}
.big-btn.alt:active{box-shadow:0 2px 0 var(--softEdge)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{font-weight:700;background:#fff4cc;border-radius:999px;padding:6px 14px;font-size:1rem}
.chip.good{background:#dcfce7}
.chip .sub{display:block;font-size:.85rem;opacity:.8;line-height:1.2} /* the per-level breakdown on its own line */
.score-line{font-size:1.4rem;font-weight:700}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.btns .big-btn{flex:1;min-width:140px;font-size:1.25rem;padding:10px 12px;min-height:54px;white-space:nowrap}
.btns .big-btn.alt{font-size:1rem}
@media (max-width:374px){.btns .big-btn{font-size:1.1rem;padding:10px 8px;min-width:120px}} /* "Play again" and "Pick players" stay on one line on a 360px phone */
.results .panel{padding:14px 14px 16px;gap:8px}
.results .chip{font-size:.95rem;padding:5px 12px}
.results .mute{display:none} /* in portrait the HUD's own mute button stays tappable above the panel; landscape hides the HUD and shows this one */
@media (orientation:landscape) and (max-height:560px){
  .app{grid-template-areas:"board hud" "board scores" "board msg" "board ctrl";grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr) 300px;column-gap:14px;align-content:stretch}
  .boardWrap{height:auto!important}
  .turn div{font-size:1rem;padding:7px 10px}
  .turn div.long{font-size:.85rem} /* a 12-letter name's turn still fits on one line beside the two round buttons */
  .setup{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;width:100%;align-items:start}
  .setupL,.setupR{display:flex;flex-direction:column;gap:8px;min-width:0}
  .panel{width:min(100%,620px)}
  .panel .hint,.logo,.seat .who{display:none}
  .seat button{font-size:1rem}
  .scores{flex-direction:column;align-items:stretch}
  .vs{display:none}
  .msg{white-space:normal;line-height:1.3;align-self:center} /* the message floats mid-column, so robot mode (no Undo row) has no empty tail */
  .ctrl{flex-direction:column;align-items:stretch}
  .screen.results{align-items:center;justify-content:flex-end}
  .screen.results .panel{width:min(100%,300px)} /* widened by script into the free space next to the board */
  .screen.results .panel h2{font-size:1.6rem}
  .results .mute{display:grid}
  .app.over .hud,.app.over .scores,.app.over .msg,.app.over .ctrl{visibility:hidden} /* the results panel takes the side column */
  .panel{padding:14px 16px;gap:8px}
  .boardWrap{place-items:center}
}
@media (prefers-reduced-motion:reduce){.app,canvas#board{transition:none}}
@media (prefers-reduced-motion:reduce){.turn div.thinking{animation:none}.pchip{transition:none}.seat button.fixed:active{animation:none}}
</style>

<div class="app offstage" id="app">
  <div class="hud" id="hud">
    <button class="icon-btn" id="pauseBtn" aria-label="Pause" data-i18n-aria="pause">⏸️</button>
    <div class="turn"><div id="turnEl"></div></div>
    <button class="icon-btn mute" aria-label="Turn sound off">🔊</button>
  </div>
  <div class="scores" id="scores">
    <div class="pchip" id="chip1"><span class="pname" id="chipName1"></span><span class="sdots" id="dots1" hidden></span><b class="pwins" id="chipWins1">0</b></div>
    <span class="vs" data-i18n="vs">vs</span>
    <div class="pchip" id="chip2"><span class="pname" id="chipName2"></span><span class="sdots" id="dots2" hidden></span><b class="pwins" id="chipWins2">0</b></div>
  </div>
  <div class="boardWrap" id="boardWrap"><canvas id="board" tabindex="0" aria-label="Game board. Use the arrow keys to pick a column and Enter to drop a disc." data-i18n-aria="boardAria"></canvas></div>
  <p class="msg" id="msgEl" aria-live="polite" data-i18n="tapColumn">Tap a column to drop a disc.</p>
  <div class="ctrl" id="ctrlRow">
    <button class="mini" id="undoBtn" data-i18n="undo" data-emoji="↩️">↩️ Undo</button>
  </div>
</div>

<section class="screen" id="titleScreen">
  <div class="panel">
    <svg class="logo" viewBox="0 0 150 60" aria-hidden="true">
      <rect x="3" y="6" width="144" height="50" rx="12" fill="#2f62e6"/>
      <rect x="6" y="9" width="138" height="44" rx="10" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
      <g>
        <circle cx="24" cy="31" r="14" fill="#1c3f9c"/><circle cx="24" cy="30" r="12" fill="#ff4b4b"/><ellipse cx="20" cy="25" rx="4" ry="2.4" fill="rgba(255,255,255,.6)"/>
        <circle cx="58" cy="31" r="14" fill="#1c3f9c"/><circle cx="58" cy="30" r="12" fill="#ffcf33"/><ellipse cx="54" cy="25" rx="4" ry="2.4" fill="rgba(255,255,255,.6)"/>
        <circle cx="92" cy="31" r="14" fill="#1c3f9c"/><circle cx="92" cy="30" r="12" fill="#ff4b4b"/><ellipse cx="88" cy="25" rx="4" ry="2.4" fill="rgba(255,255,255,.6)"/>
        <circle cx="126" cy="31" r="14" fill="#1c3f9c"/><circle cx="126" cy="30" r="12" fill="#ffcf33"/><ellipse cx="122" cy="25" rx="4" ry="2.4" fill="rgba(255,255,255,.6)"/>
      </g>
    </svg>
    <h1 id="titleText">Drop Four</h1>
    <p data-i18n="tagline">Drop discs. Get four in a row. Win!</p>
    <div class="setup">
      <div class="setupL">
        <div class="row" role="group" aria-label="Who plays" data-i18n-aria="whoPlays">
          <button data-mode="two" aria-pressed="false" data-i18n="twoPlayers" data-emoji="👫">👫 Two players</button>
          <button data-mode="robot" aria-pressed="true" data-i18n="vsRobot" data-emoji="🤖">🤖 Vs Robot</button>
        </div>
        <div class="row" id="levelRow" role="group" aria-label="Robot level" data-i18n-aria="robotLevel">
          <button data-level="easy" aria-pressed="false" data-i18n="easy" data-emoji="🌱">🌱 Easy</button>
          <button data-level="normal" aria-pressed="true" data-i18n="normal" data-emoji="⭐">⭐ Normal</button>
          <button data-level="hard" aria-pressed="false" data-i18n="hard" data-emoji="🔥">🔥 Hard</button>
        </div>
        <div class="row" role="group" aria-label="How many games" data-i18n-aria="howMany">
          <button data-series="single" aria-pressed="true" data-i18n="oneGame" data-emoji="🎮">🎮 1 game</button>
          <button data-series="three" aria-pressed="false" data-i18n="firstTo" data-emoji="🏆">🏆 First to 3</button>
        </div>
      </div>
      <div class="setupR">
        <div class="seats">
          <div class="seat"><span class="who">P1</span><button class="emojiBtn" data-p="0" aria-label="Change picture" data-i18n-aria="changePic">🦊</button><button class="nameBtn" data-p="0" aria-label="Change name" data-i18n-aria="changeName">Fox</button><button class="colorBtn" data-p="0" aria-label="Change disc color" data-i18n-aria="changeColor"><i></i></button></div>
          <div class="seat"><span class="who">P2</span><button class="emojiBtn" data-p="1" aria-label="Change picture" data-i18n-aria="changePic">🐸</button><button class="nameBtn" data-p="1" aria-label="Change name" data-i18n-aria="changeName">Frog</button><button class="colorBtn" data-p="1" aria-label="Change disc color" data-i18n-aria="changeColor"><i></i></button></div>
        </div>
        <p class="hint" id="setupHint">Tap your picture, name or disc to change it.</p>
        <div class="chip" id="bestChip">🏆 Robot points: 0</div>
      </div>
    </div>
    <button class="big-btn" id="playBtn" data-i18n="play" data-emoji="▶">▶ Play</button>
    <p class="hint kbhint" id="kbHint">Tap a column to drop. Keys 1–7, ← → and Enter work too.</p>
    <button class="icon-btn mute corner" aria-label="Turn sound off">🔊</button>
  </div>
</section>

<section class="screen" id="pauseScreen" hidden>
  <div class="panel">
    <h2 data-i18n="paused">Paused</h2>
    <p id="pauseInfo"></p>
    <button class="big-btn" id="resumeBtn" data-i18n="keepPlaying" data-emoji="▶">▶ Keep playing</button>
    <div class="btns">
      <button class="big-btn alt" id="restartBtn" data-i18n="startOver" data-emoji="🔄">🔄 Start over</button>
      <button class="big-btn alt" id="quitBtn" data-i18n="quit" data-emoji="🏠">🏠 Quit</button>
    </div>
    <button class="icon-btn mute" aria-label="Turn sound off">🔊</button>
  </div>
</section>

<section class="screen results" id="resultScreen" hidden>
  <div class="panel">
    <h2 id="resultTitle"></h2>
    <p id="resultSub"></p>
    <div class="score-line" id="resultScore"></div>
    <div class="chips" id="resultChips"></div>
    <div class="btns">
      <button class="big-btn" id="againBtn" data-i18n="playAgain" data-emoji="▶">▶ Play again</button>
      <button class="big-btn alt" id="changeBtn" data-i18n="pickPlayers" data-emoji="👫">👫 Pick players</button>
    </div>
    <button class="icon-btn mute" aria-label="Turn sound off">🔊</button>
  </div>
</section>

<script>
/* =====================================================================================
   CONFIG: change these to make the game your own!
   ===================================================================================== */
const CONFIG = {
  title: 'Drop Four',
  cols: 7, rows: 6, inARow: 4,
  saveKey: 'drop-four-v1',
  seriesWins: 3,            // "First to 3" series length
  gravity: 40,              // how fast a disc falls (cells per second, per second)
  bounce: 0.3,              // how bouncy a landing is (0 = thud, 0.5 = very bouncy)
  emojiOnDiscs: true,       // draw each player's picture on their discs
  robot: {
    name: 'Robo', emoji: '🤖',
    minThinkMs: 600,        // the robot always "thinks" at least this long so it feels fair
    hoverMs: 320,           // the robot shows its disc over the column before dropping
    sliceMs: 35,            // the search never blocks the screen longer than this
    maxNodes: 700000,       // safety cap for one robot move
    easy:   { depth: 0, blockChance: 1, carefulChance: 0.6 },     // mostly random, but always takes a win and always blocks one
    normal: { depth: 4, slipChance: 0.15 },                       // looks 4 moves ahead, sometimes plays its 2nd best move
    hard:   { depth: 7, slipChance: 0 },                          // looks 7 moves ahead with full pruning and a cache
    pointsPerWin: { easy: 1, normal: 2, hard: 4 }                 // leaderboard points for beating each level
  },
  discs: [
    { id: 'red',    name: 'Red',    main: '#ff4b4b', dark: '#c71f1f', light: '#ffb0b0' },
    { id: 'yellow', name: 'Yellow', main: '#ffcf33', dark: '#d19600', light: '#fff1b0' },
    { id: 'green',  name: 'Green',  main: '#45d47a', dark: '#17923f', light: '#b9f5cf' },
    { id: 'purple', name: 'Purple', main: '#a985ff', dark: '#6b2fd9', light: '#ddd2ff' },
    { id: 'orange', name: 'Orange', main: '#ff8a3d', dark: '#c75500', light: '#ffd0b0' },
    { id: 'pink',   name: 'Pink',   main: '#ff6fb5', dark: '#c2287a', light: '#ffc4e2' },
    { id: 'cyan',   name: 'Cyan',   main: '#3fd0e8', dark: '#0f88a3', light: '#bdf1fa' }
  ],
  emojis: ['🦊', '🐸', '🐼', '🦄', '🐯', '🐙', '🦖', '🐧', '🐱', '🐶', '🦋', '🐵'],
  // The nicknames players tap through (we never ask for real names). These English words are the ids kept in the
  // save; each language shows its own word for them (I18N[lang].nick), so a save works in every language.
  nicknames: ['Fox', 'Frog', 'Rocket', 'Star', 'Bubbles', 'Tiger', 'Pickle', 'Comet', 'Waffle', 'Ninja', 'Panda', 'Zippy', 'Mango', 'Sparky']
};

/* =====================================================================================
   Languages: every word the player sees, in each Oomba Academy language. The robot's lines are
   think / move / win / lose / draw; nick maps a nickname id to the word shown.
   Lookup order: the player's language, then its base language (en-GB -> en), then en.
   ===================================================================================== */
const LANG = (window.BRB && BRB.user && BRB.user.lang) || 'en';
const DIR = (window.BRB && BRB.user && BRB.user.dir) === 'rtl' ? 'rtl' : 'ltr';
const I18N = /*I18N:BEGIN*/{
"en": {
  "pause": "Pause",
  "soundOn": "Turn sound on",
  "soundOff": "Turn sound off",
  "vs": "vs",
  "boardAria": "Game board. Use the arrow keys to pick a column and Enter to drop a disc.",
  "tapColumn": "Tap a column to drop a disc.",

  } else idle = false;

/* =====================================================================================

  col = clamp(Math.round(col), 0, COLS - 1);

  S.busy = true; const player = S.turn; const token = thinkToken;

  } else { hoverOwner = S.turn; if (S.mode === 'robot') say(S.firstMoves < 2 ? t('yourTurnTap') : pick(tv('nudge'))); else say(t('nameTap', { name: S.players[S.turn - 1].emoji + ' ' + S.players[S.turn - 1].name })); }

/** The robot's move: think in slices, show the disc over its column, then drop. */
function robotMove() {
  if (robotPromise) return robotPromise;
  if (!isRobotTurn() || S.over || S.screen !== 'play') return Promise.resolve(false);
  const token = thinkToken, t0 = performance.now();
  S.thinking = true; hoverOwner = 2; S.previewCol = CENTRE; updateHud(); updateUndo();
  bubble(say4('think'));

    const col = await AI.choose(S.board, 2, S.difficulty, () => token !== thinkToken, () => S.paused);
    if (token !== thinkToken || col < 0) { if (token === thinkToken) S.thinking = false; return false; }
    if (!fast) { const left = CONFIG.robot.minThinkMs - (performance.now() - t0); if (left > 0) await wait(left); }
    if (token !== thinkToken) return false;
    S.previewCol = col;
    if (!fast) await wait(CONFIG.robot.hoverMs);
    // The game may have been paused during any wait above: hold the disc over the column until play resumes.
    while (S.paused && token === thinkToken) await wait(100);
    if (token !== thinkToken) return false;
    S.thinking = false; updateHud();
    const ok = await dropDisc(col);
    if (ok && token === thinkToken && !S.over && rng() < 0.3) bubble(say4('move'));
    return ok;

/* =====================================================================================
   Game flow
   ===================================================================================== */
function applyPlayers() {
  // S.players is never saved, so it holds the names as shown in this language (a nickname id becomes its word).
  S.players[0] = Object.assign({}, save.players[0], { name: showName(save.players[0].name) });
  if (S.mode === 'robot') {
    let color = save.robotColor; if (color === S.players[0].color) color = CONFIG.discs.find(d => d.id !== color).id;
    S.players[1] = { emoji: CONFIG.robot.emoji, name: robotName(), color };
  } else {
    S.players[1] = Object.assign({}, save.players[1], { name: showName(save.players[1].name) });
    if (S.players[1].color === S.players[0].color) S.players[1].color = CONFIG.discs.find(d => d.id !== S.players[0].color).id;
  }
  for (const pl of S.players) pl.disc = discById(pl.color);   // looked up once here, never per frame

  else if (!restart) { S.starter = 3 - S.starter; S.gameNo++; if (S.seriesOver) { S.wins = [0, 0]; S.gameNo = 1; S.seriesOver = false; } }

  S.busy = false; S.thinking = false; S.paused = false; S.over = false; S.previewCol = CENTRE; S.previewX = CENTRE;
  for (const p of PARTS) p.on = false;

  $('titleScreen').hidden = true; $('pauseScreen').hidden = true; $('resultScreen').hidden = true;
  const app = $('app'); app.classList.remove('offstage', 'over'); app.style.transform = ''; canvas.style.transform = '';
  $('ctrlRow').hidden = S.mode !== 'two';
  document.documentElement.style.setProperty('--p1', discById(S.players[0].color).main);
  document.documentElement.style.setProperty('--p2', discById(S.players[1].color).main);
  $('chip1').style.setProperty('--pc', discById(S.players[0].color).main);
  $('chip2').style.setProperty('--pc', discById(S.players[1].color).main);
  updateScores(); updateHud(); updateUndo();

  else { hoverOwner = S.turn; say(S.mode === 'robot' ? t('youStart') : t('nameStarts', { name: S.players[S.turn - 1].emoji + ' ' + S.players[S.turn - 1].name })); }
}

  for (const line of lines) for (const cell of line) { const k = cell[0] * COLS + cell[1]; if (!seen.has(k)) { seen.add(k); S.winningCells.push(cell); } }

    else { BRB.sfx.play('win'); const d = discById(S.players[winner - 1].color); setTimeout(() => BRB.fx.confetti({ colors: [d.main, d.light, '#fff', '#ffd23f', '#a855f7'] }), fast ? 0 : 350); if (robot) bubble(say4('lose')); }
  } else { say(t('tieRematch')); BRB.sfx.play('coin'); if (robot) bubble(say4('draw')); }

      : Object.assign({}, save.players[i], { name: showName(save.players[i].name) });
    const seat = seats[i];
    seat.querySelector('.who').textContent = t('seat', { n: i + 1 });   // the robot is still "P2" (its picture is already the 🤖 button)
    const e = seat.querySelector('.emojiBtn'), n = seat.querySelector('.nameBtn'), c = seat.querySelector('.colorBtn');
    // The robot's picture and name are fixed: shown as flat labels that still beep and wiggle when tapped.
    e.textContent = pl.emoji; e.classList.toggle('fixed', robot); e.setAttribute('aria-disabled', robot); e.setAttribute('aria-label', robot ? t('theRobot') : t('changePic'));
    n.textContent = pl.name; n.classList.toggle('fixed', robot); n.setAttribute('aria-disabled', robot); n.setAttribute('aria-label', robot ? t('robotCalled', { name: pl.name }) : t('changeName'));
    n.classList.toggle('long', pl.name.length > 9);
    const d = discById(pl.color); const dot = c.querySelector('i');
    dot.style.setProperty('--dm', d.main); dot.style.setProperty('--dd', d.dark); dot.style.setProperty('--dl', d.light);
    c.setAttribute('aria-label', t('changeColorNow', { color: t('c_' + d.id) }));
  }
  $('setupHint').textContent = t(save.mode === 'robot' ? 'hintRobot' : 'hintTwo');
  const pts = robotPoints(), st = save.stats, chip = $('bestChip');
  chip.textContent = '🏆 ' + (pts ? t('robotPoints', { n: pts }) : t('beatRobot'));
  if (pts) {   // the per-level wins on a second line, each "level number" pair kept together
    const sub = document.createElement('span'); sub.className = 'sub';
    sub.textContent = t('levelsLine', { e: st.easy.w, m: st.normal.w, h: st.hard.w });
    chip.appendChild(sub);
  }
  fitNameButtons(); fitButtons();
}
/** Shrink a long name until it fits its button on one line (landscape gives the seats less room). If it still does
    not fit at the smallest readable size, let it wrap rather than cut it off with "…". */
function fitNameButtons() {
  document.querySelectorAll('.seat .nameBtn').forEach(b => {
    b.style.fontSize = ''; b.classList.remove('wrap');
    if (!b.clientWidth) return;   // not on screen
    let size = parseFloat(getComputedStyle(b).fontSize) || 16;
    while (!labelFits(b) && size > 12) { size -= 1; b.style.fontSize = size + 'px'; }
    if (!labelFits(b)) b.classList.add('wrap');
  });
}
function cycle(list, cur, step) { const i = list.indexOf(cur); return list[(i < 0 ? 0 : i + step + list.length) % list.length]; }
// The names to tap through: the player's own Oomba Academy name first (so it can always be picked again), then the nicknames.
const NAME_LIST = (() => { const own = String(BRB.user.displayName || '').slice(0, 12).trim(); return own && !CONFIG.nicknames.includes(own) ? [own].concat(CONFIG.nicknames) : CONFIG.nicknames.slice(); })();
function nextFreeColor(cur, otherId) { let id = cur; do { id = cycle(CONFIG.discs.map(d => d.id), id, 1); } while (id === otherId); return id; }

document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { save.mode = b.dataset.mode; persist(); refreshTitle(); BRB.sfx.play('click'); }));
document.querySelectorAll('[data-level]').forEach(b => b.addEventListener('click', () => { save.difficulty = b.dataset.level; persist(); refreshTitle(); BRB.sfx.play('click'); }));
document.querySelectorAll('[data-series]').forEach(b => b.addEventListener('click', () => { save.series = b.dataset.series; persist(); refreshTitle(); BRB.sfx.play('click'); }));
/** Tapping the robot's picture or name: it cannot change, so it just beeps (the wiggle is CSS on :active). */
function robotSeatTap(b) { if (b.dataset.p !== '1' || save.mode !== 'robot') return false; BRB.sfx.play('click'); return true; }
document.querySelectorAll('.emojiBtn').forEach(b => b.addEventListener('click', () => {
  if (robotSeatTap(b)) return;
  const i = +b.dataset.p, other = save.players[1 - i].emoji;
  let e = save.players[i].emoji; do { e = cycle(CONFIG.emojis, e, 1); } while (e === other);
  save.players[i].emoji = e; persist(); refreshTitle(); BRB.sfx.play('coin');
}));
document.querySelectorAll('.nameBtn').forEach(b => b.addEventListener('click', () => {
  if (robotSeatTap(b)) return;
  const i = +b.dataset.p, other = save.players[1 - i].name;
  let n = save.players[i].name; do { n = cycle(NAME_LIST, n, 1); } while (n === other);
  save.players[i].name = n; persist(); refreshTitle(); BRB.sfx.play('click');
}));
document.querySelectorAll('.colorBtn').forEach(b => b.addEventListener('click', () => {
  const i = +b.dataset.p;
  if (i === 1 && save.mode === 'robot') save.robotColor = nextFreeColor(save.robotColor, save.players[0].color);
  else save.players[i].color = nextFreeColor(save.players[i].color, i === 1 ? save.players[0].color : (save.mode === 'robot' ? save.robotColor : save.players[1].color));
  persist(); refreshTitle(); BRB.sfx.play('powerup');
}));
$('playBtn').addEventListener('click', () => { S.mode = save.mode; S.difficulty = save.difficulty; S.series = save.series; BRB.sfx.play('powerup'); startGame(); });
$('againBtn').addEventListener('click', () => { BRB.sfx.play('click'); startGame({ keepScore: true }); });
$('changeBtn').addEventListener('click', () => { BRB.sfx.play('click'); quitToTitle(); });
$('pauseBtn').addEventListener('click', () => setPaused(true));
$('resumeBtn').addEventListener('click', () => setPaused(false));
$('restartBtn').addEventListener('click', () => { BRB.sfx.play('click'); startGame({ keepScore: true, restart: true }); });
$('quitBtn').addEventListener('click', () => { BRB.sfx.play('click'); quitToTitle(); });
$('undoBtn').addEventListener('click', undoMove);
document.addEventListener('visibilitychange', () => { if (document.hidden && S.screen === 'play' && !S.over) setPaused(true); });

/* =====================================================================================
   Input: tap/click or drag a finger over a column to preview, release to drop (slide away to
   cancel). Keyboard: arrows or A/D move the preview, Enter/Space drop, 1-7 drop in that column,
   U undo (two players), P or Esc pause, M mute.
   ===================================================================================== */
const canAct = () => S.screen === 'play' && !S.paused && !S.busy && !S.thinking && !S.over && !falling && !isRobotTurn();
let pointerDown = false;
function colFromEvent(e) { const r = canvas.getBoundingClientRect(); const x = (e.clientX - r.left) * (G.w / r.width); return clamp(Math.floor((x - G.pad) / G.cell), 0, COLS - 1); }
function preview(e) { if (!canAct()) return; S.previewCol = colFromEvent(e); hoverOwner = S.turn; }
canvas.addEventListener('pointerdown', e => { if (!canAct()) return; pointerDown = true; preview(e); try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } e.preventDefault(); });
canvas.addEventListener('pointermove', e => { if (pointerDown || e.pointerType === 'mouse') preview(e); });
canvas.addEventListener('pointerup', e => {
  if (!pointerDown) return; pointerDown = false;
  if (!canAct()) return;
  const r = canvas.getBoundingClientRect();
  if (e.clientY < r.top - 40 || e.clientY > r.bottom + 40) return;   // slid away: cancel
  dropDisc(colFromEvent(e));
});
canvas.addEventListener('pointercancel', () => { pointerDown = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'p' || k === 'P' || k === 'Escape') { if (S.screen === 'play' && !S.over) { setPaused(true); e.preventDefault(); } else if (S.screen === 'pause') { setPaused(false); e.preventDefault(); } return; }
  if (k === 'm' || k === 'M') { BRB.sfx.mute(); updateMute(); return; }
  if (S.screen !== 'play') return;
  if (e.target && e.target.tagName === 'BUTTON' && (k === 'Enter' || k === ' ')) return;   // let buttons be buttons
  if (k === 'u' || k === 'U') { undoMove(); return; }
  if (!canAct()) return;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { S.previewCol = (S.previewCol + COLS - 1) % COLS; hoverOwner = S.turn; BRB.sfx.play('click'); e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { S.previewCol = (S.previewCol + 1) % COLS; hoverOwner = S.turn; BRB.sfx.play('click'); e.preventDefault(); }
  else if (k === 'Enter' || k === ' ' || k === 'ArrowDown') { dropDisc(S.previewCol); e.preventDefault(); }
  else if (k.length === 1 && k >= '1' && k <= '9' && +k <= COLS) { dropDisc(+k - 1); e.preventDefault(); }   // 1..COLS drop straight into that column
});

// Keep the board sized to its box (the page, and the rows around the board, can change size).
const relayout = () => { if (S.screen !== 'title') layout(); else fitNameButtons(); fitButtons(); };
if (window.ResizeObserver) { const ro = new ResizeObserver(relayout); for (const id of ['app', 'hud', 'scores', 'msgEl', 'ctrlRow']) ro.observe($(id)); }
window.addEventListener('resize', relayout);
try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout); } catch (e) { /* ignore */ }

refreshTitle();

/* =====================================================================================
   window.__brbTest: hooks for automated play tests (harmless in production).
     state()                      -> { screen, board (6x7 of 0/1/2, row 0 = top), turn, winner (null | 0 tie | 1 | 2),
                                      winningCells [[row,col]...] (every winning cell), winLines [[[row,col]...]...] (one per
                                      completed four), mode, difficulty, thinking, wins, moves, previewCol }
     start({ mode:'two'|'robot', difficulty:'easy'|'normal'|'hard', series:'single'|'three', names:[a,b], starter:1|2 })
                                     (an unknown difficulty / mode / series is ignored and the saved one kept)
     drop(col)                    -> Promise of state() after the disc has landed (ignored when it is not a human's turn).
                                     The robot's reply, if any, starts on the next tick, so the state is the board as it landed.
     robotMove()                  -> Promise of state() after the robot has moved (starts a move if it is the robot's turn)
     setBoard(board, turn)        -> put a 6x7 position (0/1/2, row 0 = top) on the live board with `turn` to move; the
                                     robot does not start by itself (call robotMove()). Works from any screen: on the
                                     results or pause screen the current game is restarted first (same players, same
                                     score); on the title screen a game starts with the saved settings. Returns state().
     skipAnimations(on = true)    -> discs land instantly and the robot does not pause for show
     evaluateBoard(board, player) -> the robot's static evaluation of a 6x7 board for player 1 or 2
     seed(n)                      -> reset the game's random numbers (robot tie-breaks, Easy moves, taunts)
     undo(), pause(on), rematch(), quit()
   ===================================================================================== */
window.__brbTest = {
  state() {
    return { screen: S.screen, board: S.board.map(r => r.slice()), turn: S.turn, winner: S.winner, winningCells: S.winningCells.map(c => c.slice()),
      winLines: S.winLines.map(l => l.map(c => c.slice())), mode: S.mode, difficulty: S.difficulty, series: S.series, thinking: S.thinking, busy: S.busy, over: S.over, wins: S.wins.slice(), moves: S.moves.slice(), previewCol: S.previewCol, paused: S.paused };
  },
  start(opts = {}) {
    if (opts.mode === 'two' || opts.mode === 'robot') save.mode = opts.mode;
    if (LEVELS.includes(opts.difficulty)) save.difficulty = opts.difficulty;
    if (opts.series === 'single' || opts.series === 'three') save.series = opts.series;
    if (Array.isArray(opts.names)) opts.names.forEach((n, i) => { if (n && save.players[i]) save.players[i].name = String(n).slice(0, 12); });
    S.mode = save.mode; S.difficulty = save.difficulty; S.series = save.series;
    startGame();
    if (opts.starter === 2 || opts.starter === 1) { thinkToken++; robotPromise = null; S.starter = opts.starter; S.turn = opts.starter; hoverOwner = 0; updateHud(); if (isRobotTurn()) robotMove(); else hoverOwner = S.turn; }
    return this.state();
  },
  async drop(col) { if (!isRobotTurn()) await dropDisc(col); return this.state(); },
  setBoard(board, turn = 1) {
    if (S.screen === 'title') { S.mode = save.mode; S.difficulty = save.difficulty; S.series = save.series; startGame(); }
    else if (S.screen !== 'play') startGame({ keepScore: true, restart: true });   // results or pause: a fresh board, same game
    thinkToken++; robotPromise = null; falling = null; clearTimeout(resultsTimer);
    S.board = board.map(r => r.map(v => (v === 1 || v === 2) ? v : 0)); S.placed = S.board.flat().filter(Boolean).length;
    S.moves = []; S.turn = turn === 2 ? 2 : 1; S.winner = null; S.winningCells = []; S.winLines = []; S.over = false; S.busy = false; S.thinking = false;
    hoverOwner = isRobotTurn() ? 0 : S.turn; discDirty = true; updateHud(); updateUndo();
    return this.state();
  },
  async robotMove() { if (robotPromise) await robotPromise; else if (isRobotTurn()) await robotMove(); return this.state(); },
  skipAnimations(on = true) { fast = on !== false; return fast; },
  evaluateBoard(board, player) { return AI.evaluateBoard(board, player); },
  seed(n) { rngState = (n >>> 0) || 1; },
  undo() { undoMove(); return this.state(); },
  pause(on = true) { setPaused(on); return this.state(); },
  rematch() { startGame({ keepScore: true }); return this.state(); },
  quit() { quitToTitle(); return this.state(); },
  get nodes() { return AI.nodes; },
  get lastSearch() { return AI.lastSearch; }   // { col, score, depth, nodes } of the robot's last real search
};
</script>
