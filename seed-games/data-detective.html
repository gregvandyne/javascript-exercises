<title>Data Detective</title>
<!-- Data Detective (official, Oomba Kit 1.1.2; CS Quest unit 3): mysteries solved with data. Dot the fox detective
     hands you case files; every case has a data view (a table, grouped counts, bars or a pictograph, all real DOM with
     printed values), tools (sort by a header, Group, chart type, bar steppers, fix / merge / remove rows, percent,
     a prediction slider) and a claim card. The Show-me rule: a claim can be pinned only when the view on screen
     supports it, and it is accepted when you tap the evidence that proves it. Levels are data in the first script

function seedOf(s) { if (typeof s === 'number' && isFinite(s)) return s >>> 0; let h = 2166136261; const str = String(s); for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry(a) { return function () { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(arr, f) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

const colIndex = (level, id) => level.cols.findIndex(c => c.id === id);
const colOf = (level, id) => level.cols[colIndex(level, id)];
const timeVal = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(s)); return m ? +m[1] * 60 + +m[2] : 0; };

  const row = el('div', 'foot'); row.style.justifyContent = 'center';
  const again = el('button', 'btn hot'); again.type = 'button'; again.innerHTML = icon('restart', 22) + `<span>${esc(tr('Play it again'))}</span>`; again.addEventListener('click', () => { S.sessionStars = {}; startChapter(S.chapter, 1); }); row.appendChild(again);
  if (!S.lock) { const mapB = el('button', 'btn go'); mapB.type = 'button'; mapB.innerHTML = icon('home', 22) + `<span>${esc(tr('Chapter map'))}</span>`; mapB.addEventListener('click', () => { S.lesson = false; openMap(); }); row.appendChild(mapB); }
  card.appendChild(row);
  show('end');
  say(tr('All cases closed!'));
}

/* ---------- hints ---------- */
function giveHint() {
  const level = S.level, st = S.cs; if (!level || st.solved) return;
  const next = Math.min(3, st.hint + 1);
  if (st.hint >= 3) { dotSay(tr(level.hints[2])); return; }
  E.act(level, st, ['hint', next]);
  sfx('hint' === 'x' ? 'pop' : 'spark');
  renderCase();
  const text = tr(level.hints[next - 1]);
  dotSay(next === 3 ? text + ' ' + tr('(This hint costs the third star.)') : text);
  if (next === 3 && E.evidence(level, st) && st.picked == null) { /* the move is done: the claim card is ready */ }
}

/* ---------- Quest Card (gear): band, pairs, read-aloud, quest code, settings ---------- */
let MODAL = null;
function ownModal(title) {
  closeOwnModal();
  const root = el('div', 'dd-modal'); root.setAttribute('role', 'dialog'); root.setAttribute('aria-modal', 'true');
  const card = el('div', 'card pop'); root.appendChild(card);
  if (title) { const h = el('h2'); h.textContent = title; card.appendChild(h); root.setAttribute('aria-label', title); }
  const prev = document.activeElement;
  const keys = e => { if (e.key === 'Escape') { e.preventDefault(); closeOwnModal(); } e.stopPropagation(); };
  root.addEventListener('keydown', keys);
  $('game').appendChild(root);
  MODAL = { root, card, prev, onClose: null };
  realAfter(0, () => { const f = card.querySelector('button'); if (f) f.focus({ preventScroll: true }); });
  return MODAL;
}
function closeOwnModal() {
  if (!MODAL) return; const m = MODAL; MODAL = null;
  m.root.remove(); try { if (m.prev && m.prev.focus) m.prev.focus(); } catch (e) { /* gone */ }
  if (m.onClose) m.onClose();
}
function questCard() {
  const m = ownModal(tr('Quest Card'));
  const row = (label, ctl) => { const r = el('div', 'srow'); const s = el('span'); s.textContent = label; r.append(s, ctl); m.card.appendChild(r); };
  const seg = el('div', 'seg'); seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', tr('Band'));
  for (const b of ['1b', '2']) { const x = el('button'); x.type = 'button'; x.textContent = bandName(b); x.setAttribute('aria-pressed', String(S.band === b)); x.disabled = S.lock; x.addEventListener('click', () => { S.band = b; SAVE.band = b; save(); sfx('select'); [...seg.children].forEach(c => c.setAttribute('aria-pressed', String(c === x))); if (S.screen === 'map') renderMap(); }); seg.appendChild(x); }
  row(tr('Band'), seg);
  const sw = (on, label, fn) => { const b = el('button', 'ok-switch'); b.type = 'button'; b.setAttribute('role', 'switch'); b.setAttribute('aria-label', label); b.setAttribute('aria-checked', String(!!on)); b.addEventListener('click', () => { const v = b.getAttribute('aria-checked') !== 'true'; b.setAttribute('aria-checked', String(v)); sfx('select'); fn(v); }); return b; };
  row(tr('Two on one device'), sw(SAVE.pairs, tr('Two on one device'), v => { SAVE.pairs = v; save(); }));
  let ra = true; try { ra = !!Oomba.settings.readAloud; } catch (e) { /* ignore */ }
  row(tr('Read aloud'), sw(ra, tr('Read aloud'), v => { try { Oomba.settings.readAloud = v; } catch (e) { /* ignore */ } }));
  if (!LIVE) { const kb = el('button', 'btn'); kb.type = 'button'; kb.innerHTML = icon('key', 22) + `<span>${esc(tr('Enter a quest code'))}</span>`; kb.addEventListener('click', () => keypad()); m.card.appendChild(kb); }
  const st = el('button', 'btn'); st.type = 'button'; st.innerHTML = icon('settings', 22) + `<span>${esc(tr('Settings'))}</span>`; st.addEventListener('click', async () => { closeOwnModal(); try { await Oomba.ui.settings(); } catch (e) { /* ignore */ } syncMotion(); }); m.card.appendChild(st);
  const close = el('button', 'btn go'); close.type = 'button'; close.innerHTML = icon('check', 22) + `<span>${esc(tr('Close'))}</span>`; close.addEventListener('click', closeOwnModal); m.card.appendChild(close);
}
/** The 4-digit quest code: C B M L. Never seven digits; shown in groups with spaces. Hidden in live frames. */
function keypad() {
  const m = ownModal(tr('Enter a quest code'));
  const p = el('p'); p.textContent = tr('Four digits from your teacher: chapter, band, mode, case.'); m.card.appendChild(p);
  const digits = [];
  const disp = el('div', 'code'); disp.dir = 'ltr'; disp.setAttribute('aria-live', 'polite'); m.card.appendChild(disp);
  const draw = () => { disp.textContent = [0, 1, 2, 3].map(i => (digits[i] == null ? '_' : num(digits[i]))).join(' '); };
  draw();
  const keys = el('div', 'keys');
  const key = (label, fn, cls) => { const b = el('button', 'btn' + (cls ? ' ' + cls : '')); b.type = 'button'; if (typeof label === 'string' && label.charAt(0) === '<') b.innerHTML = label; else b.textContent = label; b.addEventListener('click', fn); keys.appendChild(b); return b; };
  for (let d = 1; d <= 9; d++) key(num(d), () => { if (digits.length < 4) { digits.push(d); draw(); sfx('pop'); } });
  key(icon('back', 24), () => { digits.pop(); draw(); sfx('select'); }).setAttribute('aria-label', tr('Delete'));
  key(num(0), () => { if (digits.length < 4) { digits.push(0); draw(); sfx('pop'); } });
  key(icon('play', 24), () => { if (digits.length === 4) { if (!applyCode(digits)) { sfx('wrong'); p.textContent = tr('That is not a case. Check the four digits with your teacher.'); } } else { sfx('wrong'); p.textContent = tr('Four digits, please.'); } }, 'hot').setAttribute('aria-label', tr('Go'));
  m.card.appendChild(keys);
}
/** Quest code C B M L -> the same settings as the URL params (params win over codes). */
function applyCode(d) {
  const [c, b, mo, l] = d.map(Number);
  if (!(b === 1 || b === 2) || ![0, 2, 3].includes(mo)) return false;
  const ch = c === 0 ? null : CHAPTERS.find(x => x.index === c);
  if (c !== 0 && !ch) return false;
  if (ch && !built(ch.id)) return false;
  if (Object.keys(PARAMS).length) { /* params win over codes */ return applyParams(PARAMS, true); }
  return applyParams({ chapter: ch ? ch.id : '', band: b === 2 ? '2' : '1b', mode: mo === 2 ? 'tally' : mo === 3 ? 'projector' : 'play', level: l, lock: 0 }, true);
}
/** BRB.params {chapter, band, mode, level, lock}: lesson mode = a chapter is named. lock=1 hides the map and the band toggle. */
function applyParams(p, start) {
  p = p || {};
  const chapter = String(p.chapter || '').toLowerCase(), band = String(p.band || '').toLowerCase(), mode = String(p.mode || 'play').toLowerCase();
  const level = Math.max(0, Math.min(CONFIG.maxLevelsPerChapter, parseInt(p.level, 10) || 0)), lock = String(p.lock) === '1' || p.lock === true;
  const ch = chapterOf(chapter);
  if (band === '2' || band === '1b') { S.band = band; if (!lock) { SAVE.band = band; save(); } }
  else if (ch && ch.band !== 'both') S.band = ch.band;
  S.mode = mode === 'tally' ? 'tally' : mode === 'projector' ? 'projector' : 'play';
  $('game').classList.toggle('proj', S.mode === 'projector');
  if (ch && built(ch.id)) { S.chapter = ch.id; S.lesson = true; S.lock = lock; S.startLevel = level || 0; }
  else { S.chapter = null; S.lesson = false; S.lock = false; S.startLevel = 0; if (ch && !built(ch.id)) return false; }
  if (start) { closeOwnModal(); closeKitScreens(); if (S.chapter) startChapter(S.chapter, S.startLevel); else openMap(); }
  return true;
}
applyParams(PARAMS, false);

/* ---------- buttons, keys, pause ---------- */
$('gearBtn').innerHTML = icon('menu'); $('gearBtn').setAttribute('aria-label', tr('Quest Card'));
$('gearBtn').addEventListener('click', () => { sfx('select'); questCard(); });
$('backBtn').addEventListener('click', () => { sfx('select'); if (S.screen === 'map' || S.lock) goTitle(); else { S.lesson = S.lesson && S.lock; openMap(); } });
$('hintBtn').addEventListener('click', giveHint);
$('learnBtn').addEventListener('click', () => { sfx('select'); learnCard(); });
async function openPause() {
  if (S.screen !== 'play') return;
  try { if (Oomba.ui.open) return; } catch (e) { /* ignore */ }
  let v = 'resume';
  try { v = await Oomba.ui.pause(); } catch (e) { v = 'resume'; }
  if (v === 'restart') startLevel();
  else if (v === 'quit') goTitle();
  syncMotion();
}
$('pauseBtn').addEventListener('click', openPause);
document.addEventListener('keydown', e => {
  if (e.repeat || MODAL) return;
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { openPause(); return; }
  if (S.screen !== 'play' || !S.claimsOpen) return;
  const n = +e.key; if (n >= 1 && n <= 4) { const b = document.querySelector(`.claimtile[data-i="${n - 1}"]`); if (b && !b.disabled) b.click(); }
});
syncMotion();

/* ---------- test hooks: the kit's (setTheme, setLang, step...) plus the game's own; deterministic from a seed ---------- */
Oomba.test({
  state: () => ({ screen: S.screen, phase: S.phase, chapter: S.chapter, level: S.level ? S.idx + 1 : 0, levelId: S.level && S.level.id, band: S.band, mode: S.mode, lesson: S.lesson, lock: S.lock,
    stars: S.chapter ? chapterStars(S.chapter) : 0, levelStars: S.level && S.cs ? E.stars(S.level, S.cs) : 0, evidence: !!(S.level && S.cs && E.evidence(S.level, S.cs)), solved: !!(S.cs && S.cs.solved), skipped: !!(S.cs && S.cs.skipped),
    wrong: S.cs ? S.cs.wrong : 0, edits: S.cs ? S.cs.edits : 0, runs: S.cs ? S.cs.runs : 0, hint: S.cs ? S.cs.hint : 0, view: S.cs && S.cs.view, sortBy: S.cs && S.cs.sortBy, groupBy: S.cs && S.cs.groupBy, pct: !!(S.cs && S.cs.pct), bars: S.cs && S.cs.bars, slider: S.cs && S.cs.slider,
    picked: S.cs ? S.cs.picked : null, claimsOpen: S.claimsOpen, label: S.lastLabel, scoreCalls: S.scoreCalls.slice(), checks: Object.assign({}, S.checks), seed: S.seed, say: S.lastSay, dir: $('game').dir, live: LIVE, pairs: SAVE.pairs }),
  start: (o = {}) => {
    closeOwnModal(); closeKitScreens(); titleOpen = false;
    S.seedFixed = o.seed != null ? +o.seed : null; S.sessionStars = {}; S.skippedIds = {}; S.scoreCalls = []; S.lastLabel = '';
    const chapter = o.chapter || (S.lesson && S.chapter) || 'sort';
    applyParams({ chapter, band: o.band || (chapterOf(chapter) && chapterOf(chapter).band !== 'both' ? chapterOf(chapter).band : S.band), mode: o.mode || 'play', level: o.level || 0, lock: o.lock ? 1 : 0 }, false);
    S.lesson = o.lesson != null ? !!o.lesson : o.lock ? true : o.chapter ? false : S.lesson;   // start() alone keeps the frame's lesson context
    startChapter(chapter, o.level || 0);
  },
});
Object.assign(window.__brbTest, {
  skipAnimations: () => { S.fast = true; try { Oomba.settings.set({ motion: 'reduce' }); } catch (e) { /* ignore */ } syncMotion(); closeKitScreens(); return true; },
  act: a => { const r = doAct(a); return E.act ? (S.cs ? { evidence: E.evidence(S.level, S.cs), solved: S.cs.solved, picked: S.cs.picked, wrong: S.cs.wrong } : r) : r; },
  tap: key => { if (/^c:/.test(key)) tapBar(key.slice(2)); else tapRow(key); return S.cs && S.cs.shown; },
  claim: i => { if (!S.claimsOpen && S.cs && E.evidence(S.level, S.cs)) { S.claimsOpen = true; renderClaims(); } doAct(['claim', i]); return S.cs && S.cs.lastClaim; },
  hint: () => { giveHint(); return S.cs && S.cs.hint; },
  skip: () => { doAct(['skip']); return true; },
  solve: () => { const l = S.level, cs = S.cs; if (!l || !cs) return false; S.claimsOpen = true; for (const a of l.sol) { if (a[0] === 'claim') doAct(a); else if (a[0] === 'show') prove(a[1]); else doAct(a); } return cs.solved; },   // cs: the next case may already be open
  closeDialog: () => { closeKitScreens(); closeOwnModal(); return true; },
  params: p => applyParams(p, true),
  code: digits => applyCode(String(digits).replace(/\D/g, '').split('').map(Number)),
  questCard: () => { questCard(); return true; },
  keypad: () => { keypad(); return true; },
  map: () => { S.lock = false; S.lesson = false; openMap(); return true; },
  levels: () => LEVELS.map(l => l.id),
  cover: () => {
    S.fast = true; closeOwnModal(); closeKitScreens(); titleOpen = false;
    S.seedFixed = 7; S.lesson = false; S.lock = false; S.band = '1b'; S.mode = 'play';
    startChapter('sort', 3);
    doAct(['group', 'pet']); S.claimsOpen = true; renderCase(); dotSay(tr('That view answers it. Pin your claim!'), false);
    try { if (DOT_ENT) DOT_ENT.mood('happy'); } catch (e) { /* ignore */ }
    return true;
  },
});

/* ---------- go ---------- */
goTitle();
</script>
