  if (!S.practice) { const back = O.ui.button(tr('Back to the door'), { kind: 'quiet', icon: 'home', onPress: () => showDoor() }); main.appendChild(back); }
  say(main, note || lock.intro[S.band]);
  const run = S.esc.run(lock.id), d = E.DATA[S.band];
  if (lock.id === 'sorting-gate') renderRoute(main, lock, run, d);
  else if (lock.id === 'sealed-note') renderCipher(main, lock, run, d);
  else if (lock.id === 'which-pim') renderCards(main, lock, run, d);
  else if (lock.id === 'trick-inbox') renderInbox(main, lock, run, d);
  else if (lock.id === 'five-moves') renderMoves(main, lock, run, d);
  else if (lock.id === 'layers') renderLayers(main, lock, run, d);
  if (run.s.note && note !== run.s.note) { const p = $('p', 'ep-h'); p.textContent = tr(run.s.note); main.appendChild(p); }
  hintButton(main, lock);
}
function renderRoute(main, lock, run, d) {
  const r = d.route;
  const board = $('div', 'ep-board'); main.appendChild(board);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('class', 'ep-roads'); svg.setAttribute('viewBox', '0 0 100 100'); svg.setAttribute('preserveAspectRatio', 'none');
  for (const [a, b] of r.links) { const line = document.createElementNS('http://www.w3.org/2000/svg', 'line'); const A = r.nodes.find(n => n.id === a), B = r.nodes.find(n => n.id === b); line.setAttribute('x1', A.x * 100); line.setAttribute('y1', A.y * 100); line.setAttribute('x2', B.x * 100); line.setAttribute('y2', B.y * 100); if (r.closed.includes(a + '-' + b) || r.closed.includes(b + '-' + a)) line.setAttribute('class', 'ep-closed'); svg.appendChild(line); }
  board.appendChild(svg);
  for (const nd of r.nodes) { const el = $('div', 'ep-node' + (run.s.at === nd.id ? ' ep-here' : '')); el.style.left = (nd.x * 100) + '%'; el.style.top = (nd.y * 100) + '%'; const ico = $('span', 'ep-ico', nd.icon); el.appendChild(ico); el.appendChild($('small', '', tr(nd.label))); board.appendChild(el); }
  const letter = $('div', 'ep-node'); letter.style.left = ((r.nodes.find(n => n.id === run.s.at) || {}).x * 100) + '%'; letter.style.top = ((r.nodes.find(n => n.id === run.s.at) || {}).y * 100 - 9) + '%'; const li = $('span', 'ep-ico', '✉️'); li.style.background = 'var(--ep-go)'; letter.appendChild(li); board.appendChild(letter);
  for (const id of run.linksAt(run.s.at)) { const other = run.other(id, run.s.at), nd = r.nodes.find(n => n.id === other), at = r.nodes.find(n => n.id === run.s.at); const b = $('button', 'ep-link' + (run.closed(id) ? ' ep-closed' : ' ep-ok'), run.closed(id) ? '✖' : '➜'); b.type = 'button'; b.style.left = ((at.x + nd.x) / 2 * 100) + '%'; b.style.top = ((at.y + nd.y) / 2 * 100) + '%'; b.setAttribute('aria-label', tr('Road to {place}', { place: tr(nd.label) })); b.addEventListener('click', () => doAct(lock, { t: 'hop', id }, b)); board.appendChild(b); }
}
function renderCipher(main, lock, run, d) {
  const card = $('div', 'ep-card'); main.appendChild(card);
  card.appendChild($('b', '', tr("The Magpie's sealed note")));
  const c = $('p', 'ep-cipher', run.cipher); c.dir = 'ltr'; card.appendChild(c);
  const dec = $('p', 'ep-decoded', E.caesar(run.cipher, -run.s.shift) || '····'); dec.dir = 'ltr'; card.appendChild(dec);
  if (d.cipher.given) { const g = $('p', 'ep-gift', tr('A gift from Pim: the first letter is {letter}.', { letter: d.cipher.plain[0] })); main.appendChild(g); }
  const row = $('div', 'ep-row ep-center'); main.appendChild(row);
  const minus = O.ui.button(tr('Turn back'), { kind: 'quiet', icon: 'minus', onPress: () => { doAct(lock, { t: 'shiftTo', n: run.s.shift - 1 }); } });
  const label = $('div', 'ep-shift', tr('Shift {n}', { n: run.s.shift })); label.dir = 'ltr';
  const plus = O.ui.button(tr('Turn forward'), { kind: 'quiet', icon: 'plus', onPress: () => { doAct(lock, { t: 'shiftTo', n: run.s.shift + 1 }); } });
  row.append(minus, label, plus);
  const open = O.ui.button(tr('Open the lock'), { kind: 'go', onPress: () => doAct(lock, { t: 'submit' }) }); main.appendChild(open);
}
function renderCards(main, lock, run, d) {
  const grid = $('div', 'ep-tiles'); main.appendChild(grid);
  for (const card of d.cards) {
    const el = $('div', 'ep-card');
    el.appendChild($('b', '', tr('From: {from}', { from: card.from })));
    el.appendChild($('p', '', tr(card.text)));
    const ul = $('ul'); for (const clue of card.clues) ul.appendChild($('li', '', tr(clue.text))); el.appendChild(ul);
    const b = O.ui.button(run.s.picked === card.id ? tr('This is the real Pim ✓') : tr('Pick this card'), { kind: run.s.picked === card.id ? 'go' : 'quiet', onPress: () => doAct(lock, { t: 'pick', id: card.id }) });
    el.appendChild(b); grid.appendChild(el);
  }
  const open = O.ui.button(tr('Open the lock'), { kind: 'go', onPress: () => doAct(lock, { t: 'submit' }) }); main.appendChild(open);
}
function renderInbox(main, lock, run, d) {
  const it = d.inbox[run.s.i];
  if (!it) return;
  const p = $('p', 'ep-h', tr('Message {n} of {total}', { n: run.s.i + 1, total: d.inbox.length })); main.appendChild(p);
  const card = $('div', 'ep-card'); main.appendChild(card);
  card.appendChild($('b', '', tr(it.subject)));
  card.appendChild($('p', '', tr('From: {from}', { from: it.from })));
  if (it.badge) card.appendChild($('p', '', tr(it.badge)));
  card.appendChild($('p', '', tr(it.body)));
  if (run.s.debrief) { const db = $('div', 'ep-card'); db.appendChild($('b', '', tr('Pim shows you the missed clue'))); db.appendChild($('p', '', tr(run.s.debrief))); main.appendChild(db); }
  const row = $('div', 'ep-tiles'); main.appendChild(row);
  for (const a of E.ACTIONS) { const b = $('button', 'ep-tile ep-wide', tr(a.label)); b.type = 'button'; b.addEventListener('click', () => doAct(lock, { t: 'act', id: a.id }, b)); row.appendChild(b); }
}
/* Lock 4 is a compact, self-contained round in the Trick Inbox idiom (same four responses, same debrief on a
   wrong call). When the standalone Trick Inbox game ships, this round can be swapped for its engine unchanged:
   the data shape above (from/subject/body/badge/action/accept/missed) is the interface. */
function renderMoves(main, lock, run, d) {
  const card = $('div', 'ep-card'); card.appendChild($('p', '', tr(d.moves.scenario))); main.appendChild(card);
  const seq = $('div', 'ep-seq'); main.appendChild(seq);
  for (const id of d.moves.order) { const done = run.s.placed.includes(id); const tile = d.moves.tiles.find(t => t.id === id); seq.appendChild($('span', done ? '' : 'ep-await', done ? '✓ ' + tr(tile.text) : '?')); }
  const row = $('div', 'ep-tiles'); main.appendChild(row);
  for (const id of run.s.shown) { if (run.s.placed.includes(id)) continue; const tile = d.moves.tiles.find(t => t.id === id); const b = $('button', 'ep-tile ep-wide', tr(tile.text)); b.type = 'button'; b.addEventListener('click', () => doAct(lock, { t: 'tap', id }, b)); row.appendChild(b); }
}
function renderLayers(main, lock, run, d) {
  const pair = d.layers.pairs[run.s.i];
  if (!pair) return;
  const p = $('p', 'ep-h', tr('Threat {n} of {total}', { n: run.s.i + 1, total: d.layers.pairs.length })); main.appendChild(p);
  const card = $('div', 'ep-card'); card.appendChild($('b', '', tr(pair.threat))); main.appendChild(card);
  const row = $('div', 'ep-tiles'); main.appendChild(row);
  for (const layer of d.layers.layers) { const b = $('button', 'ep-tile ep-wide', tr(layer.label)); b.type = 'button'; b.addEventListener('click', () => doAct(lock, { t: 'match', id: layer.id }, b)); row.appendChild(b); }
}

/* ---------- the shield: the debrief doubles as teacher evidence ---------- */
function showShield() {
  const main = screen('shield');
  const box = $('div', 'ep-shield'); main.appendChild(box);
  box.appendChild($('h2', '', '🛡️ ' + tr('Escaped — all six locks!')));
  box.appendChild($('p', '', tr('The sorting room door swings open. The town\'s real letters are delivered, every one. Pim offers the Magpie the junk-mail route: the one pile it may collect from, honestly. The Magpie takes the job.')));
  box.appendChild($('p', '', '🪶 ' + tr(S.esc.hintLine())));
  const tbl = $('table', 'ep-tbl');
  const head = $('tr'); for (const h of ['Lock', 'Stamp', 'Skill', 'Standards']) { const th = $('th', '', tr(h)); head.appendChild(th); } tbl.appendChild(head);
  for (const row of S.esc.shield()) { const trEl = $('tr'); for (const cell of [tr(row.lock), tr(row.stamp), tr(row.skill), row.standards.join(', ') + ' · ' + tr(row.topic)]) { const td = $('td', '', cell); td.lang = 'en'; td.dir = 'ltr'; trEl.appendChild(td); } tbl.appendChild(trEl); }
  box.appendChild(tbl);
  reportWin(6, '6/6 locks, ' + S.esc.hintsUsed + ' hints used');
  const again = O.ui.button(tr('Play again'), { kind: 'go', onPress: () => { S.esc = new E.Escape(S.band, 1); S.reported = false; persist(); showDoor(); } });
  box.appendChild(again);
}
/* ---------- a practice lock, opened: the lesson's one lock is done ---------- */
function showPracticeDone(lock, note) {
  const main = screen('practice');
  const box = $('div', 'ep-practice'); main.appendChild(box);
  box.appendChild($('h2', '', '🔓 ' + tr('Lock {n}: {name}', { n: lock.n, name: tr(lock.name) }) + ' — ' + tr('open!')));
  if (note) box.appendChild($('p', '', tr(note)));
  box.appendChild($('p', '', tr('Skill trained: {skill}.', { skill: tr(lock.skill) })));
  box.appendChild($('p', '', tr('On Spark Day this lock waits on the sorting room door with five others.')));
  reportWin(1, '1/1 locks, ' + S.esc.hintsUsed + ' hints used');
  const again = O.ui.button(tr('Play again'), { kind: 'go', onPress: () => { S.reported = false; newEscape(); renderLock(lock); } });
  box.appendChild(again);
}
/* The one place a win is reported (win-gated completion): the shield, once all six locks are open, or a lesson's
   practice lock, once that lock is open. Fires at most once per run. */
function reportWin(score, label) {
  if (S.reported) return;
  S.reported = true;
  try { if (window.BRB && BRB.score) BRB.score.submit(score, label); } catch (e) { /* no page */ }
  try { if (window.BRB && BRB.gameOver) BRB.gameOver({ won: true, score }); } catch (e) { /* no page */ }
  sfx('win'); if (!reduced()) { try { O.juice.confetti(); } catch (e) { /* quiet */ } }
}

/* ---------- test hooks ---------- */
function testState() {
  const cur = S.esc.current();
  return { ep: true, screen: S.screen, band: S.band, lesson: S.lesson, practice: S.practice, open: S.esc.open.slice(), hintsUsed: S.esc.hintsUsed, feathersLeft: S.esc.feathersLeft, escaped: S.esc.escaped, current: cur ? cur.id : null, lock: S.lockId, reported: S.reported, ready: true };
}
window.__brbTest = window.__brbTest || {};
Object.assign(window.__brbTest, {
  start(o = {}) { if (o.chapter !== undefined) S.practice = E.LOCKS.some(l => l.id === o.chapter) ? o.chapter : null; if (o.band) { S.band = o.band === '2' ? '2' : '1b'; newEscape(); } if (o.fresh) { S.esc = S.practice ? practiceEscape(S.practice, o.seed) : new E.Escape(S.band, o.seed || 1); S.reported = false; } game.start(); return testState(); },
  /** The current lock's run (screens for the course pictures step through a lock with this). */
  run() { const cur = S.esc.current(); return cur ? { lock: cur.id, s: JSON.parse(JSON.stringify(S.esc.run(cur.id).s)), advice: S.esc.run(cur.id).advice() } : null; },
  skipAnimations() { return true; },
  state: () => testState(),
  act(a) { const cur = S.esc.current(); if (!cur) return null; if (S.screen !== 'lock' || S.lockId !== cur.id) renderLock(cur); return doAct(cur, a); },
  hint() { const cur = S.esc.current(); return cur ? S.esc.useHint(cur.id) : null; },
  solveLock() { const cur = S.esc.current(); if (!cur) return null; const run = S.esc.run(cur.id); let guard = 0; while (!run.done && guard++ < 200) { const a = run.advice(); if (!a) break; S.esc.act(cur.id, a); } if (run.done) lockDone(cur); return testState(); },
  async solve() { let guard = 0; while (!S.esc.escaped && guard++ < 12) { const cur = S.esc.current(); if (!cur) break; const run = S.esc.run(cur.id); let g2 = 0; while (!run.done && g2++ < 200) { const a = run.advice(); if (!a) break; S.esc.act(cur.id, a); } if (!run.done) break; } persist(); if (S.esc.escaped) showShield(); return testState(); },
  cover() { S.esc = new E.Escape(S.band, 1); S.esc.open = ['sorting-gate', 'sealed-note']; S.reported = false; showDoor(); return true; },
});
try { if (window.BRB && BRB.ready) BRB.ready(); } catch (e) { /* ignore */ }
</script>
