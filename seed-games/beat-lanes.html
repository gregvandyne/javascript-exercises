<title>Beat Lanes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Beat Lanes: a neon concert stage. The canvas (#cv) fills the screen and draws the stage, the note
   highway, the gems and every spark. HTML sits on top for the HUD and the menu screens.
   Layout: portrait phones get the HUD across the top; wide, short screens (landscape phones) get it
   in a column on the left so the highway keeps its full height. Every tap target is at least 44 px. */
:root{
  --bg:#07041a; --ink:#fff; --soft:#c9bdff; --panel:rgba(22,12,58,.94); --edge:#5c3fd6; --chip:#2a1a66;
  --pink:#ff4fa3; --yellow:#ffd23f; --cyan:#3fe0ff; --lime:#7dff5a; --gold:#ffe36e;
  --font:"Fredoka","Trebuchet MS",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible,.card:focus-visible{outline:3px solid #fff;outline-offset:2px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- HUD ---------- */
.hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));pointer-events:none}
.hud>*{pointer-events:auto}
.ibtn{width:48px;height:48px;flex:none;border-radius:50%;background:rgba(30,18,80,.85);font-size:1.35rem;display:grid;place-items:center;padding:0;
  box-shadow:0 3px 0 rgba(0,0,0,.5),inset 0 0 0 2px var(--edge)}
.ibtn:active{transform:translateY(2px)}
.hmid{flex:1;min-width:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:5px;align-items:stretch}
.scorebox{display:flex;align-items:baseline;justify-content:center;gap:8px;line-height:1}
.scorebox b{font-size:1.7rem;font-variant-numeric:tabular-nums;letter-spacing:.02em;text-shadow:0 0 12px rgba(63,224,255,.6)}
.mult{font-weight:700;font-size:1.05rem;color:#1b0b33;background:var(--gold);border-radius:999px;padding:2px 9px;min-width:2.6em;text-align:center}
.mult.x1{background:rgba(255,255,255,.18);color:#fff}
.mult.star{background:linear-gradient(90deg,#ffe36e,#ff9de2)}
.meters{display:flex;gap:8px}
.meter{flex:1;display:flex;align-items:center;gap:4px;min-width:0}
.meter .mi{font-size:.85rem;line-height:1}
.bar{flex:1;height:10px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.bar i{display:block;height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,#ff5f8a,#ffd23f 50%,#7dff5a);transform-origin:left center;transform:scaleX(.5)}
.bar.groove i{background:linear-gradient(90deg,#8a6bff,#3fe0ff,#ffe36e);transform:scaleX(0)}
.bar.full{box-shadow:0 0 10px rgba(255,227,110,.8),inset 0 0 0 1px rgba(255,255,255,.4)}
.star-btn{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:calc(max(8px,env(safe-area-inset-top)) + 84px);
  min-height:52px;padding:0 20px;border-radius:999px;font-weight:700;font-size:1.2rem;color:#2b1100;
  background:linear-gradient(180deg,#fff3a6,#ffcf3f);box-shadow:0 5px 0 #b77d00,0 0 22px rgba(255,214,63,.7);white-space:nowrap;
  animation:starbob 1.4s ease-in-out infinite}
@keyframes starbob{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}
.star-btn:active{box-shadow:0 2px 0 #b77d00}
/* Wide, short screens: HUD becomes a column on the left, the star button sits on the right. */
body.wide .hud{right:auto;bottom:0;width:min(28vw,220px);flex-direction:column;align-items:stretch;justify-content:center;gap:12px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
body.wide .hud .ibtn{align-self:flex-start}
body.wide .hmid{flex:none}
body.wide .meters{flex-direction:column}
body.wide .scorebox{flex-direction:column;align-items:center}
body.wide .star-btn{left:auto;right:max(14px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);animation:starbob2 1.4s ease-in-out infinite;white-space:normal;max-width:min(26vw,200px);line-height:1.1;padding:8px 14px}
@keyframes starbob2{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.07)}}
body.wide #muteBtn{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top))}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom))}
.screen.dim{background:rgba(6,3,20,.6)}
.panel{position:relative;background:var(--panel);border-radius:26px;padding:14px 16px 16px;width:min(100%,460px);max-height:100%;overflow:auto;text-align:center;
  box-shadow:0 8px 0 rgba(0,0,0,.45),inset 0 0 0 3px var(--edge),0 0 40px rgba(124,77,255,.35);display:flex;flex-direction:column;align-items:center;gap:10px}
.panel h2{margin:0;font-size:clamp(1.5rem,7vw,2rem);line-height:1.1;color:var(--gold);text-shadow:0 3px 0 #8a5a00}
.panel p{margin:0;font-size:1rem;line-height:1.3}
.hint{font-size:.9rem;color:var(--soft)}
.big-btn{border-radius:20px;background:linear-gradient(180deg,#ff7ac0,#ff3f97);color:#fff;font-weight:700;font-size:1.4rem;padding:10px 22px;min-height:58px;
  box-shadow:0 6px 0 #a3125a,0 0 24px rgba(255,79,163,.45);text-shadow:0 2px 0 rgba(0,0,0,.25);line-height:1.15}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a3125a}
.big-btn.alt{background:var(--chip);box-shadow:0 6px 0 rgba(0,0,0,.45),inset 0 0 0 2px var(--edge);font-size:1.1rem;min-height:50px}
.big-btn.alt:active{box-shadow:0 2px 0 rgba(0,0,0,.45),inset 0 0 0 2px var(--edge)}
.big-btn[disabled]{opacity:.45;filter:grayscale(.6)}
.btns{display:flex;gap:10px;width:100%;justify-content:center;flex-wrap:wrap}
.btns .big-btn{flex:1;min-width:128px}
.pill{min-height:46px;border-radius:999px;background:var(--chip);box-shadow:inset 0 0 0 2px var(--edge);padding:0 16px;font-weight:600;font-size:1rem}
.chip{font-weight:700;background:var(--chip);border-radius:999px;padding:6px 12px;font-size:1rem;box-shadow:inset 0 0 0 2px var(--edge);white-space:nowrap}
.chip.gold{background:var(--gold);color:#3a2a00;box-shadow:none}
.toggle{min-height:48px;border-radius:16px;background:var(--chip);box-shadow:inset 0 0 0 2px var(--edge);padding:6px 14px;font-weight:600;font-size:1rem;line-height:1.15}
.toggle[aria-pressed=true]{background:#3b2a8f;box-shadow:inset 0 0 0 3px var(--lime)}
.back{font-size:1.6rem;font-weight:700}
[dir=rtl] .back{transform:scaleX(-1)}
.bar-head{display:flex;align-items:center;gap:10px;width:100%}
.bar-head h2{flex:1;min-width:0;font-size:clamp(1.3rem,6vw,1.8rem)}

/* title */
#scrTitle{flex-direction:column;justify-content:space-between;padding-top:max(22px,env(safe-area-inset-top));padding-bottom:max(22px,env(safe-area-inset-bottom))}
.logo{margin:0;font-size:clamp(3rem,15vw,5.2rem);line-height:.95;letter-spacing:.02em;text-align:center;font-weight:700}
.logo span{display:block}
.logo .a{color:#fff;text-shadow:0 0 6px #fff,0 0 18px var(--pink),0 0 36px var(--pink),0 5px 0 #a3125a}
.logo .b{color:#fff;text-shadow:0 0 6px #fff,0 0 18px var(--cyan),0 0 36px var(--cyan),0 5px 0 #0b6e8a}
.title-top{display:flex;flex-direction:column;align-items:center;gap:8px}
.tag{margin:0;max-width:340px;text-align:center;font-size:1.1rem;font-weight:600;color:#fff;text-shadow:0 2px 6px #000,0 0 12px rgba(0,0,0,.8)}
.title-bottom{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(100%,360px)}
.title-bottom .big-btn{width:100%;font-size:1.8rem;min-height:70px}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.corner{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:21}

/* song list */
.sheet{width:min(100%,520px);height:100%;display:flex;flex-direction:column;gap:10px;background:var(--panel);border-radius:26px;padding:12px;
  box-shadow:0 8px 0 rgba(0,0,0,.45),inset 0 0 0 3px var(--edge)}
.sheet h2{margin:0;color:var(--gold);text-shadow:0 3px 0 #8a5a00;text-align:start}
.cards{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:2px 2px 8px;touch-action:pan-y;overscroll-behavior:contain}
.card{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:18px;padding:8px;min-height:76px;cursor:pointer;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);text-align:start;position:relative;flex:none}
.card[aria-pressed=true]{background:rgba(124,77,255,.28);box-shadow:inset 0 0 0 3px var(--cyan)}
.card.locked{opacity:.62}
.cover{width:60px;height:60px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:1.9rem;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.cinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cinfo b{font-size:1.08rem;line-height:1.15}
.cinfo .by{font-size:.84rem;color:var(--soft);line-height:1.2}
.diffs{display:flex;gap:6px;flex-wrap:wrap}
.dchip{font-size:.8rem;background:rgba(0,0,0,.3);border-radius:999px;padding:2px 7px;white-space:nowrap;direction:ltr}
.dchip .st{color:var(--gold);letter-spacing:-1px}
.dchip .gr{font-weight:700;margin-inline-start:3px}
.card .go{flex:none;min-width:64px;min-height:56px;border-radius:16px;background:linear-gradient(180deg,#ff7ac0,#ff3f97);font-weight:700;font-size:1.05rem;box-shadow:0 4px 0 #a3125a;padding:4px 10px}
.card .lock{flex:none;font-size:.9rem;font-weight:700;color:var(--gold);text-align:center;max-width:92px;line-height:1.15}

/* difficulty */
.levels{display:flex;flex-direction:column;gap:9px;width:100%}
.lvl{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:start;border-radius:18px;padding:9px 14px;min-height:64px;
  background:var(--chip);box-shadow:0 5px 0 rgba(0,0,0,.45),inset 0 0 0 2px var(--edge)}
.lvl:active{transform:translateY(3px)}
.lvl .em{grid-row:1/3;font-size:1.9rem}
.lvl b{font-size:1.25rem}
.lvl small{grid-column:2;font-size:.85rem;color:var(--soft);line-height:1.2}
.lvl .lstars{grid-row:1/3;grid-column:3;font-size:1rem;color:var(--gold);white-space:nowrap;direction:ltr;text-align:end}
.lvl .lstars em{display:block;font-style:normal;font-weight:700;color:#fff;font-size:1.1rem}
.lvl.easy{background:linear-gradient(90deg,#1f5a3a,#2a1a66)} .lvl.normal{background:linear-gradient(90deg,#1d4a7a,#2a1a66)} .lvl.hard{background:linear-gradient(90deg,#7a1d4a,#2a1a66)}
[dir=rtl] .lvl.easy{background:linear-gradient(270deg,#1f5a3a,#2a1a66)} [dir=rtl] .lvl.normal{background:linear-gradient(270deg,#1d4a7a,#2a1a66)} [dir=rtl] .lvl.hard{background:linear-gradient(270deg,#7a1d4a,#2a1a66)}
.toggles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* results */
.rsong{font-size:.95rem;color:var(--soft)}
.gradewrap{display:flex;align-items:center;gap:14px}
.grade{font-size:5rem;line-height:1;font-weight:700;color:#fff;width:1.3em;height:1.3em;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#ff9de2,#7c4dff 70%);box-shadow:0 0 30px rgba(255,79,163,.6),inset 0 0 0 4px rgba(255,255,255,.5);text-shadow:0 4px 0 rgba(0,0,0,.3)}
.grade.none{font-size:3rem}
.grade.S{background:radial-gradient(circle at 35% 30%,#fff6b0,#ffb800 70%);color:#5a3a00;text-shadow:0 3px 0 rgba(255,255,255,.5)}
.rstars{font-size:1.8rem;color:var(--gold);letter-spacing:2px;direction:ltr}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.badge{font-weight:700;border-radius:999px;padding:4px 12px;background:linear-gradient(90deg,#3fe0ff,#7dff5a);color:#06261a}
.badge.ap{background:linear-gradient(90deg,#ffe36e,#ff9de2);color:#3a1a00}
.badge.nb{background:#ff4fa3;color:#fff}
.score-big{font-size:2.4rem;font-weight:700;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.score-big small{font-size:1rem;color:var(--soft);font-weight:600}
.stats{display:flex;gap:10px;width:100%}
.stats>div{flex:1;background:rgba(0,0,0,.25);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:2px}
.stats span{font-size:.85rem;color:var(--soft)}
.stats b{font-size:1.3rem}
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}
.counts>span{background:rgba(0,0,0,.25);border-radius:12px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.counts i{font-style:normal;font-size:.78rem;font-weight:600;max-width:100%;overflow-wrap:anywhere;line-height:1.1}
.counts b{font-size:1.15rem}
.c-perfect i{color:var(--gold)} .c-great i{color:var(--cyan)} .c-good i{color:var(--lime)} .c-miss i{color:#ff8fa8}
.unlock{font-weight:700;color:var(--lime)}
.pop-in{animation:popin .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes popin{0%{transform:scale(.2) rotate(-12deg)}100%{transform:scale(1) rotate(0)}}

/* settings + calibration */
.group{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(0,0,0,.22);border-radius:18px;padding:10px}
.group .lbl{font-weight:700;font-size:1.05rem}
.offrow{display:flex;align-items:center;gap:8px;width:100%}
.offrow input{flex:1;min-width:0;height:44px;accent-color:var(--pink)}
.ibtn.sm{width:46px;height:46px;font-size:1.5rem}
#offVal{font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;width:100%}
.seg button{flex:1;min-height:48px;border-radius:14px;background:var(--chip);box-shadow:inset 0 0 0 2px var(--edge);font-weight:600;font-size:1rem;padding:4px}
.seg button[aria-pressed=true]{background:#3b2a8f;box-shadow:inset 0 0 0 3px var(--lime)}
.tap-pad{width:min(56vw,190px);height:min(56vw,190px);border-radius:50%;font-size:1.8rem;font-weight:700;color:#fff;flex:none;
  background:radial-gradient(circle at 40% 35%,#ff9de2,#ff3f97 60%,#a3125a);box-shadow:0 8px 0 #6a0b3a,0 0 30px rgba(255,79,163,.6);touch-action:none}
.tap-pad:active{box-shadow:0 4px 0 #6a0b3a,0 0 30px rgba(255,79,163,.6)}
.dots{display:flex;gap:7px;direction:ltr}
.dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.18)}
.dots i.on{background:var(--lime);box-shadow:0 0 8px var(--lime)}
.toast{position:fixed;left:50%;top:24%;z-index:30;transform:translate(-50%,-50%);background:#fff;color:#2a1366;font-weight:700;font-size:1.15rem;padding:8px 18px;border-radius:999px;
  box-shadow:0 5px 0 rgba(0,0,0,.35);max-width:92vw;text-align:center;pointer-events:none;animation:toast 2s ease forwards}
@keyframes toast{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}12%{transform:translate(-50%,-50%) scale(1.06);opacity:1}20%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
.kbonly{display:none}
@media (hover:hover) and (pointer:fine){.kbonly{display:block}}
kbd{display:inline-block;min-width:1.4em;padding:0 .3em;border-radius:6px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--edge);font-family:inherit;font-weight:700;color:#fff}
@media (max-height:620px){.panel{gap:7px;padding:10px 14px}.big-btn{min-height:50px;font-size:1.2rem}.grade{font-size:3.4rem}.score-big{font-size:2rem}.logo{font-size:clamp(2.4rem,11vh,4rem)}.lvl{min-height:56px;padding:6px 12px}.tap-pad{width:150px;height:150px}}
/* Short landscape: results go two columns and the title spreads out so nothing needs scrolling. */
@media (orientation:landscape) and (max-height:500px){
  .panel.wideable{width:min(100%,760px);display:grid;grid-template-columns:1fr 1fr;align-items:center;column-gap:16px}
  .panel.wideable .colL,.panel.wideable .colR{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
  .panel.wideable>.bar-head{grid-column:1/-1}
  .panel.wideable>.group{align-self:stretch;justify-content:center}
  #scrTitle{flex-direction:row;align-items:center;justify-content:space-around}
  .title-bottom{width:min(44vw,340px)}
  .levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .lvl{grid-template-columns:1fr;grid-template-rows:auto;text-align:center;justify-items:center;row-gap:2px}
  .lvl .em,.lvl small,.lvl .lstars{grid-row:auto;grid-column:auto;text-align:center}
  .tap-pad{width:120px;height:120px}
}
.colL,.colR{display:contents}
html[lang="ar"] *{letter-spacing:0!important}
html[lang="ja"] .panel p,html[lang="ja"] .tag,html[lang="ja"] .panel h2,html[lang="ja"] button,html[lang="ja"] .lvl small,html[lang="ja"] .cinfo,html[lang="zh-Hant"] button{word-break:auto-phrase}
html[lang="ja"] .counts i,html[lang="ru"] .counts i{white-space:nowrap;font-size:.68rem;letter-spacing:-.02em}
@media (prefers-reduced-motion:reduce){.star-btn,body.wide .star-btn{animation:none}.pop-in{animation:none}.toast{animation:none}}
</style>

<canvas id="cv" aria-label="Note lanes. Tap a lane when its note reaches the line." data-ta="laneAria"></canvas>

<div class="hud" id="hud" hidden>
  <button class="ibtn" id="pauseBtn" aria-label="Pause" data-ta="pause">⏸️</button>
  <div class="hmid">
    <div class="scorebox"><b id="scoreEl" dir="ltr">0</b><span class="mult x1" id="multEl" dir="ltr">×1</span></div>
    <div class="meters">
      <div class="meter" id="healthBox"><span class="mi" aria-hidden="true">❤️</span><div class="bar" role="meter" aria-label="Health" data-ta="healthAria"><i id="healthFill"></i></div></div>
      <div class="meter"><span class="mi" aria-hidden="true">⭐</span><div class="bar groove" id="grooveBar" role="meter" aria-label="Groove" data-ta="groove"><i id="grooveFill"></i></div></div>
    </div>
  </div>
  <button class="ibtn" id="muteBtn" aria-label="Turn sound off">🔊</button>
</div>
<button class="star-btn" id="starBtn" hidden aria-label="Start Star Power" data-ta="starAria">⭐ <span data-t="starGo">Star Power!</span></button>

<section class="screen" id="scrTitle">
  <div class="title-top">
    <h1 class="logo" dir="ltr"><span class="a">Beat</span><span class="b">Lanes</span></h1>
    <p class="tag" data-t="tagline">Tap each lane when its note reaches the line!</p>
  </div>
  <div class="title-bottom">
    <button class="big-btn" id="playBtn">▶ <span data-t="play">Play</span></button>
    <div class="row">
      <button class="pill" id="setBtn">⚙️ <span data-t="settings">Settings</span></button>
      <span class="chip gold" id="titleStars" dir="ltr">★ 0</span>
    </div>
    <p class="hint kbonly" id="titleKeys"></p>
  </div>
  <button class="ibtn corner" id="muteBtn2" aria-label="Turn sound off">🔊</button>
</section>

<section class="screen" id="scrSongs" hidden>
  <div class="sheet">
    <div class="bar-head"><button class="ibtn back" id="songsBack" aria-label="Back" data-ta="back">‹</button><h2 data-t="pickSong">Pick a song</h2><span class="chip gold" id="songsStars" dir="ltr">★ 0</span></div>
    <div class="cards" id="cards"></div>
  </div>
</section>

<section class="screen" id="scrDiff" hidden>
  <div class="panel">
    <div class="bar-head"><button class="ibtn back" id="diffBack" aria-label="Back" data-ta="back">‹</button><h2 id="diffTitle"></h2></div>
    <p class="hint" data-t="chooseLevel">Choose a level</p>
    <div class="levels">
      <button class="lvl easy" data-diff="easy"><span class="em">🐣</span><b data-t="easy">Easy</b><small data-t="easyInfo"></small><span class="lstars"></span></button>
      <button class="lvl normal" data-diff="normal"><span class="em">🎵</span><b data-t="normal">Normal</b><small data-t="normalInfo"></small><span class="lstars"></span></button>
      <button class="lvl hard" data-diff="hard"><span class="em">🔥</span><b data-t="hard">Hard</b><small data-t="hardInfo"></small><span class="lstars"></span></button>
    </div>

<script>
/* =====================================================================================
   BEAT LANES: a note-highway rhythm game. Notes slide down glowing lanes; tap each lane when its
   note reaches the hit line. Every sound is synthesised live with WebAudio (no audio files).

   How the code is laid out:
     CONFIG ........ the numbers people like to change (timing windows, points, speeds)
     I18N .......... every word the player sees, in the 13 site languages
     Music core .... note/chord parsing, the SONGS table, the arrangement -> audio events, and the
                     chart generator that turns one hand-written chart into Easy, Normal and Hard
     Rules core .... judging (Perfect/Great/Good/Miss), combo, health, Groove and Star Power, grades
     Audio ......... one AudioContext: synth voices, drums, a look-ahead scheduler, and the master clock
     Render ........ the canvas: neon stage, perspective highway, gems, sparks, visualizer
     Game / UI ..... screens, input (multi-touch + keys), saves, SDK calls
     __brbTest ..... test hooks (documented at the bottom)

   Timing model: the AudioContext clock is the master clock. Music is scheduled a little ahead
   (look-ahead scheduler). "Song time" is derived from the time the speaker is playing right now
   (AudioContext time minus output latency), so the picture follows what you hear. A tap's own
   event timestamp is converted to song time the same way and judged against the chart, after the
   player's calibration offset is taken off.
   ===================================================================================== */

  lanes: 4, easyLanes: 3,
  // Judging windows in milliseconds, either side of the note. Taps a bit earlier than "good" (up to
  // earlyMiss) count as an early Miss; taps even earlier hit nothing. Easy multiplies them all.
  windows: { perfect: 45, great: 90, good: 140, earlyMiss: 200 },
  easyWindowScale: 1.35,
  points: { perfect: 300, great: 200, good: 100 },
  holdPointsPerBeat: 60,           // extra points for every beat a hold note is kept down
  comboSteps: [10, 20, 30],        // combo needed for x2, x3, x4
  accuracyWeight: { perfect: 1, great: 0.75, good: 0.4 },
  groove: { perfect: 3.2, great: 2.4, good: 1.2, holdBeat: 0.5 },   // the meter runs 0..100
  starSeconds: 8, starMultiplier: 2,
  health: { start: 0.7, perfect: 0.025, great: 0.02, good: 0.01, miss: 0.07, missHard: 0.085, drop: 0.04 },
  holdReleaseGrace: 0.16,          // letting go this many seconds before a tail ends still counts
  doubleTapGuard: 0.12,            // seconds after a hit in a lane when an extra tap is ignored
  grades: { S: 95, A: 85, B: 70 }, // accuracy % for each grade (C below B; no grade when you fail)
  stars: { S: 3, A: 2, B: 1 },
  viewSeconds: { easy: 2.1, normal: 1.75, hard: 1.45 },   // how long a note takes to slide down
  speedSteps: [0.8, 1, 1.25],      // the "note speed" setting multiplies the slide speed
  practiceRate: 0.75,
  offsetRange: 200, calibrationTaps: 8, calibrationBpm: 100,
  lookAhead: 0.12, schedulerMs: 25,                       // audio scheduling (seconds / milliseconds)
  previewSeconds: 10,
  countIn: 3,                      // beats of "3, 2, 1" before the song
  resumeBeats: 3,                  // resuming from pause replays this many beats with a countdown
  cheerEvery: 25,                  // crowd cheer on every 25 combo
  // Chart generator rules (see buildChart). Gaps are the closest two notes may be, in seconds and beats.
  chart: {
    minGapSec: { easy: 0.42, normal: 0.25, hard: 0.14 },
    minGapBeats: { easy: 1, normal: 0.5, hard: 0.25 },
    holdMinBeats: { easy: 2, normal: 2, hard: 1.5 },
    minHoldSec: 0.45,
    jackSec: 0.3                   // two quick notes in one lane closer than this move to a neighbour lane
  },
  maxDpr: 2
};

/** The player's language (from the platform; never from the URL) and helpers. Looked up once, never per frame. */
const LANG = (window.BRB && BRB.user && BRB.user.lang) || 'en';
const LANG_BASE = String(LANG).split('-')[0];
const RTL = ((window.BRB && BRB.user && BRB.user.dir) === 'rtl') || LANG_BASE === 'he' || LANG_BASE === 'ar';
const NUM_LOCALE = LANG_BASE === 'ar' ? 'ar-u-nu-latn' : LANG;      // Arabic text, Latin digits (like the site)
const I18N_CHAIN = [I18N[LANG], I18N[LANG_BASE], I18N.en].filter(Boolean);
let PLURAL = null, NUMF = null;
try { PLURAL = new Intl.PluralRules(NUM_LOCALE); } catch (e) { /* old browser: one/other below */ }
try { NUMF = new Intl.NumberFormat(NUM_LOCALE); } catch (e) { /* ignore */ }
const fmtNum = n => (NUMF ? NUMF.format(n) : String(n));
/** t('key', { n: 3 }): the string for this language, {name} placeholders filled; a plural set picks its form by n. */
function t(key, vars) {
  let s;
  for (let i = 0; i < I18N_CHAIN.length && s === undefined; i++) s = I18N_CHAIN[i][key];
  if (s === undefined) return key;
  if (s && typeof s === 'object') { const n = vars && typeof vars.n === 'number' ? vars.n : 0; s = (n === 0 && s.zero) || s[PLURAL ? PLURAL.select(n) : (n === 1 ? 'one' : 'other')] || s.other; }
  if (vars && typeof s === 'string') s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] === undefined ? m : typeof vars[k] === 'number' ? fmtNum(vars[k]) : vars[k]));
  return s;
}

/* CORE-BEGIN */
/* =====================================================================================
   MUSIC CORE
   Melodies are written as text, one token per note:  PITCH[:LENGTH][FLAGS]
     PITCH   C4, F#4, Bb3 ... or r for a rest
     LENGTH  in beats: 1, 2, 1/2, 3/2, 1/3 ... (sticky: a token without one keeps the last length)
     FLAGS   ^ two-lane chord on Hard   ~ make it a hold   ! accent (kept on Easy)
             ? ghost note (only charted on Hard)   * music only (never charted)
     |       a bar line; the parser checks every bar adds up (catches typos in the tunes)
   Harmony is written as CHORD:LENGTH tokens (C:2 G7:2 | ...) and drives the bass and the backing.
   ===================================================================================== */
const PITCH = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function noteMidi(name) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(name);
  if (!m) return NaN;
  return 12 * (+m[3] + 1) + PITCH[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
}
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
const near = (a, b) => Math.abs(a - b) < 1e-6;
function parseLen(s) { if (s.indexOf('/') >= 0) { const p = s.split('/'); return +p[0] / +p[1]; } return +s; }

/** Melody text -> { notes: [{ b (beat), d (beats), m (midi), fl (flags) }], len, bars, errors } */
function parsePhrase(src, barBeats) {
  const notes = [], errors = [];
  let pos = 0, dur = 1, barStart = 0, bars = 0;
  for (const tok of src.trim().split(/\s+/)) {
    if (tok === '|') {
      if (!near(pos - barStart, barBeats)) errors.push('bar ' + (bars + 1) + ' has ' + (+(pos - barStart).toFixed(3)) + ' beats');
      barStart = pos; bars++; continue;
    }
    const m = /^(r|[A-G][#b]?\d)(?::([\d./]+))?([\^~!?*]*)$/.exec(tok);
    if (!m) { errors.push('bad token ' + tok); continue; }
    if (m[2]) dur = parseLen(m[2]);
    if (m[1] !== 'r') notes.push({ b: pos, d: dur, m: noteMidi(m[1]), fl: m[3] || '' });
    pos += dur;
  }
  if (!near(pos, barStart)) errors.push('phrase does not end on a bar line');
  return { notes, len: pos, bars, errors };
}

/** Chord qualities as semitones above the root. */
const CHORDS = {
  '': [0, 4, 7], m: [0, 3, 7], '7': [0, 4, 7, 10], maj7: [0, 4, 7, 11], m7: [0, 3, 7, 10],
  m9: [0, 3, 7, 10, 14], maj9: [0, 4, 7, 11, 14], '9': [0, 4, 7, 10, 14], dim: [0, 3, 6], sus4: [0, 5, 7], '5': [0, 7]
};
/** Harmony text -> { spans: [{ b, d, root (0-11), iv: [semitones] }], len, errors } */
function parseHarmony(src, barBeats) {
  const spans = [], errors = [];
  let pos = 0, barStart = 0, bars = 0;
  for (const tok of src.trim().split(/\s+/)) {
    if (tok === '|') { if (!near(pos - barStart, barBeats)) errors.push('harmony bar ' + (bars + 1) + ' is wrong'); barStart = pos; bars++; continue; }
    const m = /^([A-G])([#b]?)([a-z0-9]*):([\d./]+)$/.exec(tok);
    if (!m || !CHORDS[m[3]]) { errors.push('bad chord ' + tok); continue; }
    const d = parseLen(m[4]);
    spans.push({ b: pos, d, root: (PITCH[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + 12) % 12, iv: CHORDS[m[3]] });
    pos += d;
  }
  if (!near(pos, barStart)) errors.push('harmony does not end on a bar line');
  return { spans, len: pos, errors };
}

/* ---------- Tempo map: a bpm per bar (constant, or a ramp from ramp[0] to ramp[1] bpm). ---------- */
function makeTempo(song, totalBars) {
  const bb = song.barBeats, bpms = [], barSec = [0];
  const n = totalBars + 16;
  for (let i = 0; i < n; i++) {
    const bpm = song.ramp ? song.ramp[0] + (song.ramp[1] - song.ramp[0]) * Math.min(1, i / Math.max(1, totalBars - 1)) : song.bpm;
    bpms.push(bpm); barSec.push(barSec[i] + bb * 60 / bpm);
  }
  return {
    bb, bpms, barSec,
    /** beats -> seconds */
    sec(b) { if (b <= 0) return b * 60 / bpms[0]; let i = Math.floor(b / bb + 1e-9); if (i >= n) i = n - 1; return barSec[i] + (b - i * bb) * 60 / bpms[i]; },
    /** seconds -> beats */
    beat(s) {
      if (s <= 0) return s * bpms[0] / 60;
      let lo = 0, hi = n - 1;
      while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (barSec[mid] <= s) lo = mid; else hi = mid - 1; }
      return lo * bb + (s - barSec[lo]) * bpms[lo] / 60;
    },
    bpmAtBeat(b) { const i = Math.max(0, Math.min(n - 1, Math.floor(b / bb))); return bpms[i]; }
  };
}

/** Metric strength of a beat position: 4 downbeat, 3 half bar, 2 beat, 1 eighth (or triplet in 6/8), 0 smaller. */
function strength(b, bb, triplet) {
  const x = ((b % bb) + bb) % bb;
  if (near(x, 0) || near(x, bb)) return 4;
  if (bb % 2 === 0 && bb > 2 && near(x, bb / 2)) return 3;
  if (near(x, Math.round(x))) return 2;
  if (triplet ? near(x * 3, Math.round(x * 3)) : near(x * 2, Math.round(x * 2))) return 1;
  return 0;
}

/** Voice a chord close to middle C: midi notes within [lo, lo+12). */
function voicing(root, iv, lo) {
  const out = [];
  for (let i = 0; i < iv.length && out.length < 4; i++) {
    let m = 48 + root + iv[i];
    while (m < lo) m += 12;
    while (m >= lo + 12) m -= 12;
    if (out.indexOf(m) < 0) out.push(m);
  }
  return out.sort((a, b) => a - b);
}

function compileSong(song) {

  for (const k in song.harmony) { const s = harmSrc(k); if (!s) { errors.push(song.id + ' harmony ' + k + ' missing'); continue; } const h = parseHarmony(s, bb); harm[k] = h; h.errors.forEach(e => errors.push(song.id + ' harmony ' + k + ': ' + e)); }

 * with a lane for 4 lanes (l4) and for 3 lanes (l3). Lanes follow the pitch: low notes on the left,
 * high notes on the right, ranked within each section so every lane gets used.

function buildCandidates(song, secs, phr, tempo) {
  const out = [], bb = song.barBeats;
  secs.forEach(sec => {
    const s = sec.def, mode = s.chart || (s.p ? 'melody' : 'none');
    if (mode === 'melody' && s.p) {
      const notes = phr[s.p].notes.filter(n => n.fl.indexOf('*') < 0);
      const pitches = Array.from(new Set(notes.map(n => n.m))).sort((a, b) => a - b), np = pitches.length;
      const laneOf = (m, lanes) => { const r = pitches.indexOf(m); return np <= 1 ? Math.floor(lanes / 2) : np < lanes ? Math.round(r * (lanes - 1) / (np - 1)) : Math.min(lanes - 1, Math.floor(r * lanes / np)); };

          for (let i = 0; i < pat.length; i++) {

/**
 * The chart generator: one hand-written chart (the melody plus its flags) -> Easy, Normal or Hard.
 *   Hard   4 lanes, everything incl. ghost notes, chords (^), holds from 1.5 beats.
 *   Normal 4 lanes, eighth-note grid, no ghosts, no chords, holds from 2 beats.
 *   Easy   3 lanes, notes on the beat (plus accents), holds from 2 beats.
 * Notes are kept strongest-beat first, so thinning never drops a downbeat for an off-beat. Two notes
 * are never closer than the gap for that level, and quick repeats in one lane alternate with a
 * neighbouring lane so they can be played with two fingers.

/* =====================================================================================

/** Attack-decay-sustain-release on a gain param. Returns the time the sound is silent. */

  g.setValueAtTime(0.0001, t);
  g.linearRampToValueAtTime(peak, t + a);
  g.setTargetAtTime(peak * s, t + a, d / 3 + 0.001);
  const off = t + Math.max(dur, a + 0.01);
  g.setTargetAtTime(0.0001, off, r / 3 + 0.001);
  return off + r * 1.4 + 0.02;
}
/** Plucked/struck envelope: fast attack, exponential fall. */
function strike(g, t, peak, decay) {
  g.setValueAtTime(0.0001, t);
  g.linearRampToValueAtTime(peak, t + 0.004);
  g.exponentialRampToValueAtTime(0.0001, t + decay);
  return t + decay + 0.02;
}
function vibrato(o, t, rate, depth, delay) {
  const l = ac.createOscillator(), lg = ac.createGain();
  l.frequency.value = rate; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(depth, t + delay + 0.15);
  l.connect(lg); lg.connect(o.frequency); l.start(t); return l;
}
function noiseSrc(t) { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(t, Math.random() * 1.5); return s; }

/* ---------- melodic voices: fn(t, dur, freq, vol, out) ---------- */
const VOICES = {
  bell(t, dur, f, v, out) {
    const c = oscAt('sine', f, t), m = oscAt('sine', f * 4, t), mg = ac.createGain(), g = ac.createGain();
    mg.gain.setValueAtTime(f * 1.6, t); mg.gain.exponentialRampToValueAtTime(f * 0.05, t + 0.5);
    m.connect(mg); mg.connect(c.frequency); c.connect(g); g.connect(out);
    const end = strike(g.gain, t, 0.2 * v, Math.max(0.9, dur + 0.5));
    c.start(t); m.start(t); c.stop(end); m.stop(end);
  },
  pluck(t, dur, f, v, out) {
    const o = oscAt('triangle', f, t), o2 = oscAt('sine', f * 2, t), g = ac.createGain(), g2 = ac.createGain();
    g2.gain.value = 0.25; o.connect(g); o2.connect(g2); g2.connect(g); g.connect(out);
    const end = strike(g.gain, t, 0.24 * v, Math.min(1.2, Math.max(0.35, dur + 0.25)));
    o.start(t); o2.start(t); o.stop(end); o2.stop(end);
  },
  marimba(t, dur, f, v, out) {
    const o = oscAt('sine', f, t), o2 = oscAt('sine', f * 4, t), g = ac.createGain(), g2 = ac.createGain();
    o2.connect(g2); g2.connect(out); strike(g2.gain, t, 0.08 * v, 0.07);
    o.connect(g); g.connect(out);
    const end = strike(g.gain, t, 0.3 * v, 0.5);
    o.start(t); o2.start(t); o.stop(end); o2.stop(t + 0.1);
  },
  flute(t, dur, f, v, out) {
    const o = oscAt('sine', f, t), o2 = oscAt('triangle', f * 2, t), g = ac.createGain(), g2 = ac.createGain();
    g2.gain.value = 0.06; o2.connect(g2); g2.connect(g); o.connect(g); g.connect(out);
    const l = vibrato(o, t, 5.2, f * 0.006, 0.12);
    const end = adsr(g.gain, t, dur, 0.2 * v, 0.045, 0.1, 0.85, 0.09);
    o.start(t); o2.start(t); o.stop(end); o2.stop(end); l.stop(end);
  },
  clarinet(t, dur, f, v, out) {
    const o = oscAt(A.waves.clarinet, f, t), lp = filt('lowpass', 2400), g = ac.createGain();
    o.connect(lp); lp.connect(g); g.connect(out);
    const end = adsr(g.gain, t, dur, 0.15 * v, 0.03, 0.1, 0.8, 0.08);
    o.start(t); o.stop(end);
  },
  brass(t, dur, f, v, out) {
    const o = oscAt('sawtooth', f, t), lp = filt('lowpass', 500, 1.2), g = ac.createGain();
    lp.frequency.setValueAtTime(400, t); lp.frequency.linearRampToValueAtTime(Math.min(5200, f * 7), t + 0.06); lp.frequency.setTargetAtTime(Math.min(3200, f * 4), t + 0.06, 0.12);
    o.connect(lp); lp.connect(g); g.connect(out);
    const end = adsr(g.gain, t, dur, 0.14 * v, 0.03, 0.12, 0.75, 0.09);
    o.start(t); o.stop(end);
  },
  strings(t, dur, f, v, out) { VOICES.violin(t, dur, f, v * 0.9, out, 0.07); },
  violin(t, dur, f, v, out, att) {
    const o = oscAt('sawtooth', f * 1.0035, t), o2 = oscAt('sawtooth', f * 0.9965, t), lp = filt('lowpass', Math.min(4200, f * 6)), g = ac.createGain();
    o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(out);
    const l1 = vibrato(o, t, 5.6, f * 0.005, 0.1), l2 = vibrato(o2, t, 5.6, f * 0.005, 0.1);
    const end = adsr(g.gain, t, dur, 0.085 * v, att || 0.03, 0.1, 0.85, 0.12);
    o.start(t); o2.start(t); o.stop(end); o2.stop(end); l1.stop(end); l2.stop(end);
  },
  organ(t, dur, f, v, out) {
    const o = oscAt(A.waves.organ, f, t), g = ac.createGain();
    o.connect(g); g.connect(out);
    const end = adsr(g.gain, t, dur, 0.1 * v, 0.012, 0.05, 0.9, 0.06);
    o.start(t); o.stop(end);
  },
  chip(t, dur, f, v, out) {
    const o = oscAt(A.waves.chip, f, t), g = ac.createGain();
    o.connect(g); g.connect(out);
    const end = adsr(g.gain, t, dur, 0.09 * v, 0.003, 0.08, 0.7, 0.03);
    o.start(t); o.stop(end);
  },
  synth(t, dur, f, v, out) {
    const o = oscAt('square', f, t), lp = filt('lowpass', 600, 7), g = ac.createGain();
    lp.frequency.setValueAtTime(300, t); lp.frequency.linearRampToValueAtTime(Math.min(4500, f * 8), t + 0.02); lp.frequency.setTargetAtTime(Math.min(2200, f * 3), t + 0.02, 0.08);
    o.connect(lp); lp.connect(g); g.connect(out);
    const end = adsr(g.gain, t, dur, 0.1 * v, 0.004, 0.1, 0.7, 0.05);
    o.start(t); o.stop(end);
  },
  keys(t, dur, f, v, out) {
    const c = oscAt('sine', f, t), m = oscAt('sine', f, t), mg = ac.createGain(), g = ac.createGain();
    mg.gain.setValueAtTime(f * 1.2, t); mg.gain.exponentialRampToValueAtTime(f * 0.02, t + 0.6);
    m.connect(mg); mg.connect(c.frequency); c.connect(g); g.connect(out);
    const end = strike(g.gain, t, 0.22 * v, Math.max(0.8, Math.min(2, dur + 0.6)));
    c.start(t); m.start(t); c.stop(end); m.stop(end);
  },
  rhodes(t, dur, f, v, out) { VOICES.keys(t, dur, f, v * 0.5, out); },
  bassoon(t, dur, f, v, out) {
    const o = oscAt(A.waves.bassoon, f, t), lp = filt('lowpass', 1500), g = ac.createGain();
    o.connect(lp); lp.connect(g); g.connect(out);
    const end = adsr(g.gain, t, dur, 0.16 * v, 0.025, 0.08, 0.7, 0.06);
    o.start(t); o.stop(end);
  },
  pad(t, dur, f, v, out) {
    const o = oscAt('triangle', f * 1.004, t), o2 = oscAt('triangle', f * 0.996, t), lp = filt('lowpass', 1800), g = ac.createGain();
    o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(out);
    const end = adsr(g.gain, t, dur, 0.07 * v, Math.min(0.3, dur * 0.4), 0.3, 0.8, 0.35);
    o.start(t); o2.start(t); o.stop(end); o2.stop(end);
  },
  pizz(t, dur, f, v, out) {
    const o = oscAt('triangle', f, t), g = ac.createGain();
    o.connect(g); g.connect(out);
    const end = strike(g.gain, t, 0.22 * v, 0.28);
    o.start(t); o.stop(end);
  },
  // ---- bass voices ----
  round(t, dur, f, v, out) {
    const o = oscAt('sine', f, t), o2 = oscAt('triangle', f, t), g = ac.createGain(), g2 = ac.createGain();
    g2.gain.value = 0.35; o2.connect(g2); g2.connect(g); o.connect(g); g.connect(out);
    const end = adsr(g.gain, t, dur, 0.32 * v, 0.01, 0.15, 0.75, 0.06);
    o.start(t); o2.start(t); o.stop(end); o2.stop(end);
  },
  bassPluck(t, dur, f, v, out) {
    const o = oscAt('sawtooth', f, t), lp = filt('lowpass', 1200, 2), g = ac.createGain();
    lp.frequency.setValueAtTime(1400, t); lp.frequency.setTargetAtTime(260, t, 0.08);
    o.connect(lp); lp.connect(g); g.connect(out);
    const end = adsr(g.gain, t, dur, 0.2 * v, 0.005, 0.12, 0.6, 0.05);
    o.start(t); o.stop(end);
  },
  funk(t, dur, f, v, out) {
    const o = oscAt('square', f, t), s = oscAt('sine', f, t), lp = filt('lowpass', 900, 5), g = ac.createGain(), sg = ac.createGain();
    lp.frequency.setValueAtTime(1600, t); lp.frequency.setTargetAtTime(380, t, 0.06);
    o.connect(lp); lp.connect(g); s.connect(sg); sg.gain.value = 1.2; sg.connect(g); g.connect(out);
    const end = adsr(g.gain, t, dur, 0.13 * v, 0.004, 0.1, 0.6, 0.04);
    o.start(t); s.start(t); o.stop(end); s.stop(end);
  },
  stick(t, dur, f, v, out) {
    const o = oscAt('sine', 1900, t), g = ac.createGain();
    o.frequency.exponentialRampToValueAtTime(1200, t + 0.03);
    o.connect(g); g.connect(out);

    o.start(t); o.stop(end);
  }

const BASS_VOICE = { round: 'round', pluck: 'bassPluck', funk: 'funk', pizz: 'pizz' };

/* ---------- drums: fn(t, vol, kit, out) ---------- */
const DRUM_VOICES = {
  k(t, v, kit, out) {
    const electro = kit === 'electro', soft = kit === 'soft' || kit === 'lofi';
    const o = oscAt('sine', electro ? 125 : 150, t), g = ac.createGain();
    o.frequency.exponentialRampToValueAtTime(42, t + (electro ? 0.22 : 0.12));
    o.connect(g); g.connect(out);
    const end = strike(g.gain, t, (soft ? 0.55 : 0.75) * v, electro ? 0.45 : 0.32);
    o.start(t); o.stop(end);
    const n = noiseSrc(t), hp = filt('highpass', 2500), ng = ac.createGain();
    n.connect(hp); hp.connect(ng); ng.connect(out); strike(ng.gain, t, 0.05 * v, 0.012); n.stop(t + 0.03);
  },
  s(t, v, kit, out) {
    const n = noiseSrc(t), bp = filt(kit === 'lofi' ? 'lowpass' : 'bandpass', kit === 'lofi' ? 2600 : 1900, 0.7), g = ac.createGain();
    n.connect(bp); bp.connect(g); g.connect(out);
    const end = strike(g.gain, t, (kit === 'soft' ? 0.22 : 0.34) * v, kit === 'electro' ? 0.2 : 0.16); n.stop(end);
    const o = oscAt('triangle', 195, t), og = ac.createGain();
    o.frequency.exponentialRampToValueAtTime(150, t + 0.07); o.connect(og); og.connect(out);
    o.start(t); o.stop(strike(og.gain, t, 0.2 * v, 0.09));
  },
  h(t, v, kit, out) {
    const n = noiseSrc(t), hp = filt('highpass', 7200), g = ac.createGain();
    n.connect(hp); hp.connect(g); g.connect(out);
    n.stop(strike(g.gain, t, (kit === 'lofi' ? 0.05 : 0.075) * v, 0.045));
  },
  o(t, v, kit, out) {
    const n = noiseSrc(t), hp = filt('highpass', 6500), g = ac.createGain();
    n.connect(hp); hp.connect(g); g.connect(out);
    n.stop(strike(g.gain, t, 0.07 * v, 0.25));
  },
  c(t, v, kit, out) {
    const n = noiseSrc(t), bp = filt('bandpass', 1250, 1.1), g = ac.createGain();
    n.connect(bp); bp.connect(g); g.connect(out);
    g.gain.setValueAtTime(0.0001, t);
    for (let i = 0; i < 3; i++) { g.gain.linearRampToValueAtTime(0.3 * v, t + i * 0.011 + 0.002); g.gain.linearRampToValueAtTime(0.06 * v, t + i * 0.011 + 0.01); }
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16); n.stop(t + 0.18);
  },
  t(t, v, kit, out) {
    const o = oscAt('sine', 98, t), g = ac.createGain();
    o.frequency.exponentialRampToValueAtTime(80, t + 0.4);
    o.connect(g); g.connect(out); o.start(t); o.stop(strike(g.gain, t, 0.55 * v, 0.6));
    const n = noiseSrc(t), lp = filt('lowpass', 900), ng = ac.createGain();
    n.connect(lp); lp.connect(ng); ng.connect(out); n.stop(strike(ng.gain, t, 0.08 * v, 0.18));
  },
  w(t, v, kit, out) {
    const o = oscAt('sine', 1300, t), g = ac.createGain();
    o.frequency.exponentialRampToValueAtTime(1100, t + 0.05);
    o.connect(g); g.connect(out); o.start(t); o.stop(strike(g.gain, t, 0.22 * v, 0.07));
  },
  r(t, v, kit, out) {
    const o = oscAt('triangle', 1650, t), g = ac.createGain();
    o.connect(g); g.connect(out); o.start(t); o.stop(strike(g.gain, t, 0.14 * v, 0.035));
    const n = noiseSrc(t), bp = filt('bandpass', 3200, 1.5), ng = ac.createGain();
    n.connect(bp); bp.connect(ng); ng.connect(out); n.stop(strike(ng.gain, t, 0.12 * v, 0.04));
  },
  y(t, v, kit, out) {
    const n = noiseSrc(t), hp = filt('highpass', 4200), g = ac.createGain();
    n.connect(hp); hp.connect(g); g.connect(out);
    n.stop(strike(g.gain, t, 0.15 * v, 1.5));
  }
};

/** Play one arrangement event at context time `at` (durations scaled by 1/rate). */
function playEvent(e, at, rate, out) {
  const dur = e.d / rate;
  if (e.kind === 'drum') { const f = DRUM_VOICES[e.drum]; if (f) f(at, e.v, e.inst, out); return; }
  if (e.kind === 'vinyl') { vinylBed(at, dur, out); return; }
  const vol = e.v * (e.kind === 'layer' ? 0.85 : e.kind === 'comp' ? 0.75 : 1);
  const fn = VOICES[e.kind === 'bass' ? (BASS_VOICE[e.inst] || 'round') : e.inst] || VOICES.pluck;
  fn(at, dur, e.kind === 'stick' ? 1 : midiHz(e.m), vol, out);
}
/** Lo-fi vinyl crackle: soft hiss with sparse pops, for the whole song. */
function vinylBed(t, dur, out) {
  const n = noiseSrc(t), bp = filt('bandpass', 3500, 0.5), g = ac.createGain();
  g.gain.value = 0.012; n.connect(bp); bp.connect(g); g.connect(out); n.stop(t + dur);
  for (let x = 0.3; x < dur; x += 0.35 + Math.random() * 0.9) {
    const p = noiseSrc(t + x), hp = filt('highpass', 2000), pg = ac.createGain();
    p.connect(hp); hp.connect(pg); pg.connect(out); p.stop(strike(pg.gain, t + x, 0.03 + Math.random() * 0.03, 0.01));
  }
}

/* ---------- sound effects that react to play (through the sfx bus, never cut by pause) ---------- */
const Sfx = {
  ok() { if (!(liveAc && liveAc.state === 'running' && !Sound.muted)) return false; ac = liveAc; A = liveA; return true; },
  /** The lead "hit" sound: a bright little pluck at the note's pitch. */
  hit(midi, kind) {
    if (!this.ok()) return;
    const t = liveAc.currentTime + 0.002, f = midiHz(Math.max(60, Math.min(96, midi + 12)));
    const o = oscAt('triangle', f, t), g = liveAc.createGain();
    o.connect(g); g.connect(liveA.sfx); o.start(t); o.stop(strike(g.gain, t, kind === 'perfect' ? 0.13 : 0.1, 0.16));
    if (kind === 'perfect') { const s = oscAt('sine', f * 2, t), sg = liveAc.createGain(); s.connect(sg); sg.connect(liveA.sfx); s.start(t); s.stop(strike(sg.gain, t, 0.05, 0.12)); }
  },
  /** A soft low "bump" for a miss - gentle, never harsh. */
  miss() {
    if (!this.ok()) return;
    const t = liveAc.currentTime + 0.002, o = oscAt('sine', 150, t), g = liveAc.createGain();
    o.frequency.exponentialRampToValueAtTime(85, t + 0.12); o.connect(g); g.connect(liveA.sfx); o.start(t); o.stop(strike(g.gain, t, 0.07, 0.14));
  },
  /** Star Power: a rising shimmer. */
  star() {
    if (!this.ok()) return;
    const t = liveAc.currentTime + 0.01;
    [0, 4, 7, 12, 16].forEach((s, i) => { const o = oscAt('triangle', midiHz(72 + s), t + i * 0.06), g = liveAc.createGain(); o.connect(g); g.connect(liveA.sfx); o.start(t + i * 0.06); o.stop(strike(g.gain, t + i * 0.06, 0.08, 0.5)); });
  },
  /** Crowd cheer: swelling filtered noise plus scattered claps and a few "whoo"s. */
  cheer(big) {
    if (!this.ok()) return;
    const t = liveAc.currentTime + 0.01, n = noiseSrc(t), bp = filt('bandpass', 900, 0.6), bp2 = filt('bandpass', 2100, 0.8), g = liveAc.createGain();
    n.connect(bp); n.connect(bp2); bp.connect(g); bp2.connect(g); g.connect(liveA.sfx);
    const v = big ? 0.14 : 0.1;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.35); g.gain.setTargetAtTime(v * 0.7, t + 0.35, 0.3); g.gain.setTargetAtTime(0.0001, t + 1.1, 0.35);
    n.stop(t + 2.6);
    for (let i = 0; i < (big ? 22 : 12); i++) {
      const ct = t + 0.05 + Math.random() * 1.4, c = noiseSrc(ct), cb = filt('bandpass', 1100 + Math.random() * 900, 1.2), cg = liveAc.createGain();
      c.connect(cb); cb.connect(cg); cg.connect(liveA.sfx); c.stop(strike(cg.gain, ct, 0.05 + Math.random() * 0.05, 0.05));
    }
    for (let i = 0; i < 3; i++) {
      const wt = t + 0.1 + i * 0.25, o = oscAt('sine', 520 + i * 90, wt), og = liveAc.createGain();
      o.frequency.linearRampToValueAtTime(900 + i * 80, wt + 0.4); o.connect(og); og.connect(liveA.sfx); o.start(wt); o.stop(adsr(og.gain, wt, 0.35, 0.012, 0.1, 0.1, 0.8, 0.2));
    }
  },
  /** Calibration metronome click at context time t. */
  click(t, accent) { if (!liveAc) return; ac = liveAc; A = liveA; VOICES.stick(t, 0.05, 1, accent ? 1 : 0.75, liveA.sfx); },
  /** Gentle "let's try again" phrase (no harsh fail sound). */
  softEnd() {
    if (!this.ok()) return;
    const t = liveAc.currentTime + 0.05;
    [67, 64, 65, 60].forEach((m, i) => VOICES.bell(t + i * 0.22, 0.3, midiHz(m), 0.8, liveA.sfx));
  },
  /** A happy little fanfare for a cleared song. */
  win() {
    if (!this.ok()) return;
    const t = liveAc.currentTime + 0.05;
    [60, 64, 67, 72, 76, 79, 84].forEach((m, i) => VOICES.bell(t + i * 0.07, 0.25, midiHz(m), 0.7, liveA.sfx));
  }
};

/* =====================================================================================
   THE MASTER CLOCK. Maps performance.now() milliseconds (the clock input events are stamped with)
   to the AudioContext time that is coming out of the speaker at that moment:
     heard(perfMs) = perfMs / 1000 + est
   est comes from AudioContext.getOutputTimestamp() where the browser supports it, otherwise from
   currentTime minus the reported output latency. currentTime moves in steps (one per audio
   callback), so est keeps the largest offset seen and creeps down very slowly to follow drift.
   ===================================================================================== */
const Clock = {
  est: NaN, mode: '', samples: 0, win: new Float64Array(32), wn: 0,
  latency() { return liveAc ? (liveAc.outputLatency || 0) + (liveAc.baseLatency || 0) : 0; },
  sample(now) {
    if (!liveAc || liveAc.state !== 'running') return;
    let raw = NaN;
    if (this.mode !== 'ct' && liveAc.getOutputTimestamp) {
      const ts = liveAc.getOutputTimestamp();
      if (ts.contextTime > 0 && ts.performanceTime > 0) { raw = ts.contextTime - ts.performanceTime / 1000; if (!this.mode && liveAc.currentTime > 0.3) this.mode = 'ts'; }
      else if (this.mode === 'ts') return;
    }
    if (isNaN(raw)) { raw = liveAc.currentTime - now / 1000 - this.latency(); if (!this.mode && liveAc.currentTime > 0.3) this.mode = 'ct'; }
    this.samples++;
    // Sliding window (the last ~0.5 s of frames): the largest offset is the moment just after an audio
    // callback, so the max filters the step jitter of currentTime while still following real changes fast.
    if (isNaN(this.est) || Math.abs(raw - this.est) > 0.25) { this.win.fill(raw); this.wn = 0; }
    this.win[this.wn] = raw; this.wn = (this.wn + 1) % this.win.length;
    let m = -Infinity; for (let i = 0; i < this.win.length; i++) if (this.win[i] > m) m = this.win[i];
    this.est = m;
  },
  /** AudioContext time being heard at performance time perfMs. */
  heard(perfMs) { if (isNaN(this.est)) this.sample(perfMs); return isNaN(this.est) ? (liveAc ? liveAc.currentTime : 0) : perfMs / 1000 + this.est; }
};

/* =====================================================================================
   THE PLAYER: look-ahead scheduler for one song. Chart time c plays at context time t0 + c / rate.
   tick() runs every ~25 ms (and every frame) and schedules everything due within CONFIG.lookAhead.
   ===================================================================================== */
const Player = {
  cs: null, bus: null, t0: 0, rate: 1, idx: 0, on: false, stopAt: Infinity, preview: false, timer: 0,
  start(cs, fromChart, rate, opts) {
    opts = opts || {};
    this.stop(0.02);
    if (!Sound.unlock()) return false;
    ac = liveAc; A = liveA;
    this.cs = cs; this.rate = rate || 1; this.preview = !!opts.preview;
    this.t0 = liveAc.currentTime + 0.1 - fromChart / this.rate;

/* ---------- live backdrop: beams, equalizer, crowd ---------- */
function drawStageFx(look, time, energy, star) {
  const W = V.w, H = V.h;
  // light beams (slow sweep)
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    const bx = W * (0.15 + i * 0.35), ang = REDUCED ? (i - 1) * 0.25 : Math.sin(time * (0.35 + i * 0.07) + i * 2) * 0.42;
    const len = H * 1.1, spread = 0.13;

    g.fillStyle = i === 1 ? (star ? '#ffe36e' : look.accent) : (i ? '#ff4fd8' : '#7c4dff');
    g.beginPath(); g.moveTo(bx, -10);
    g.lineTo(bx + Math.sin(ang - spread) * len, Math.cos(ang - spread) * len);

    g.closePath(); g.fill();

    g.globalAlpha = 0.18 + 0.3 * FX.eq[i];

}
/** Crowd silhouettes in the bottom corners; they bob with the beat and jump when cheering. */
function drawCrowd(time) {
  const W = V.w, H = V.h, left = V.cx - V.hw * scaleAtY(H) - 8, right = V.cx + V.hw * scaleAtY(H) + 8;

/* ---------- the highway ---------- */

/** Pads at the bottom and the hit line. */

/** Notes: hold ribbons first (far to near), then gems on top. */
function drawNotes(st) {
  const run = st.run; if (!run) return;
  const notes = run.notes, n = V.lanes, cols = n === 3 ? LANE_COLORS3 : LANE_COLORS, view = st.view, now = st.now;
  // first note that can still be on screen
  while (st.first < notes.length && notes[st.first].t + notes[st.first].len < now - view * 0.3) st.first++;
  let last = st.first;
  while (last < notes.length && notes[last].t < now + view * 1.02) last++;
  // ribbons
  for (let i = last - 1; i >= st.first; i--) {
    const nt = notes[i]; if (!(nt.len > 0)) continue;
    if (nt.res !== J.NONE && nt.hold !== 1 && nt.res !== J.MISS && nt.hold !== 3) continue;
    const holding = nt.hold === 1;
    const p0 = holding ? 0 : (nt.t - now) / view, p1 = Math.min(1, (nt.t + nt.len - now) / view);
    if (p1 < -0.25) continue;
    const a = Math.max(-0.2, p0), y0 = projY(a), y1 = projY(p1), s0 = projS(a), s1 = projS(p1);
    const lx = -V.hw + (nt.lane + 0.5) * V.laneW, hw0 = V.laneW * 0.22 * s0, hw1 = V.laneW * 0.22 * s1;
    const dead = nt.hold === 3 || nt.res === J.MISS;
    g.globalAlpha = dead ? 0.22 : holding ? 0.85 : 0.55;
    g.fillStyle = dead ? '#9a8fb8' : cols[nt.lane];
    g.beginPath(); g.moveTo(V.cx + lx * s0 - hw0, y0); g.lineTo(V.cx + lx * s1 - hw1, y1); g.lineTo(V.cx + lx * s1 + hw1, y1); g.lineTo(V.cx + lx * s0 + hw0, y0); g.closePath(); g.fill();
    if (!dead) { g.globalAlpha = holding ? 0.95 : 0.6; g.fillStyle = '#ffffff'; g.beginPath(); g.moveTo(V.cx + lx * s0 - hw0 * 0.25, y0); g.lineTo(V.cx + lx * s1 - hw1 * 0.25, y1); g.lineTo(V.cx + lx * s1 + hw1 * 0.25, y1); g.lineTo(V.cx + lx * s0 + hw0 * 0.25, y0); g.closePath(); g.fill(); }
    // tail cap
    g.globalAlpha = dead ? 0.25 : 0.9; g.fillStyle = dead ? '#9a8fb8' : cols[nt.lane];
    g.beginPath(); g.arc(V.cx + lx * s1, y1, hw1 * 1.3, 0, Math.PI * 2); g.fill();
    if (holding && !REDUCED) { g.globalAlpha = 0.6; const gs = V.laneW * 1.1; g.drawImage(SPR.glow[cols[nt.lane]], V.cx + lx - gs / 2, V.hitY - gs / 2, gs, gs); }
  }
  g.globalAlpha = 1;

  for (let i = last - 1; i >= st.first; i--) {
    const nt = notes[i];
    if (nt.res !== J.NONE && nt.res !== J.MISS) continue;
    const p = (nt.t - now) / view; if (p < -0.22 || p > 1.02) continue;
    const y = projY(p), s = projS(p), x = V.cx + (-V.hw + (nt.lane + 0.5) * V.laneW) * s;
    const w = V.laneW * 0.84 * s, h = w * GEM_H / GEM_W, k = (GEM_W + GEM_PAD * 2) / GEM_W;

      const x2 = V.cx + (-V.hw + (notes[i + 1].lane + 0.5) * V.laneW) * s;
      g.globalAlpha = 0.8; g.fillStyle = '#ffffff'; g.fillRect(Math.min(x, x2), y - 2.5 * s, Math.abs(x2 - x), 5 * s); g.globalAlpha = 1;

  }

}

/** Sparks, rings, judgement words, combo, countdown. */
function drawEffects(st, dt) {
  const n = V.lanes, cols = n === 3 ? LANE_COLORS3 : LANE_COLORS;
  // rings
  for (let k = 0; k < RMAX; k++) {
    if (RINGS.life[k] <= 0) continue;
    RINGS.life[k] -= dt; const a = Math.max(0, RINGS.life[k] / 0.32), grow = 1 + (1 - a) * 0.9;
    g.globalAlpha = a; g.strokeStyle = RINGS.col[k]; g.lineWidth = 3;

  }
  // sparks
  g.globalCompositeOperation = 'lighter';
  for (let k = 0; k < PMAX; k++) {
    if (P.life[k] <= 0) continue;
    P.life[k] -= dt; P.vy[k] += 620 * dt; P.x[k] += P.vx[k] * dt; P.y[k] += P.vy[k] * dt;

    g.save(); g.translate(V.cx, y); g.scale(pop, pop);
    g.font = FONT.judge; g.fillStyle = kind === 1 ? '#ffe36e' : kind === 2 ? '#3fe0ff' : kind === 3 ? '#7dff5a' : '#ff8fa8';
    g.lineWidth = 6; g.strokeStyle = 'rgba(10,4,30,0.85)'; g.strokeText(TX.judge[kind], 0, 0); g.fillText(TX.judge[kind], 0, 0);
    if (JUDGE.side) { g.font = FONT.small; g.fillStyle = '#ffffff'; const s2 = JUDGE.side === 2 ? TX.hold : JUDGE.side < 0 ? TX.early : TX.late; g.lineWidth = 4; g.strokeText(s2, 0, Math.round(V.hw * 0.17)); g.fillText(s2, 0, Math.round(V.hw * 0.17)); }
    g.restore();
  }
  g.globalAlpha = 1;

    g.font = FONT.mid; g.fillStyle = '#ffffff'; g.lineWidth = 6; g.strokeStyle = 'rgba(255,79,163,0.9)';
    g.strokeText(BANNER.text, 0, 0); g.fillText(BANNER.text, 0, 0);

  }

    FX.comboPop = Math.max(0, FX.comboPop - dt * 6);
    const y = projY(0.45), sc = 1 + FX.comboPop * 0.18;
    g.save(); g.translate(V.cx, y); g.scale(sc, sc);
    g.globalAlpha = 0.85; g.font = FONT.combo; g.fillStyle = st.star ? '#ffe36e' : '#ffffff';
    g.lineWidth = 6; g.strokeStyle = 'rgba(10,4,30,0.7)'; g.strokeText(FX.comboText, 0, 0); g.fillText(FX.comboText, 0, 0);
    g.font = FONT.label; g.fillStyle = '#c9bdff'; g.fillText(TX.combo, 0, Math.round(V.hw * 0.25));
    g.restore(); g.globalAlpha = 1;

    g.font = c.word ? FONT.big : FONT.count; g.lineWidth = 10; g.strokeStyle = '#7c4dff'; g.lineJoin = 'round';
    g.strokeText(c.text, 0, 0); g.fillStyle = '#ffffff'; g.fillText(c.text, 0, 0);
    g.restore(); g.globalAlpha = 1;
  }
}

/* =====================================================================================
   GAME: screens, input, the frame loop, saves and SDK calls.
   ===================================================================================== */
const $ = id => document.getElementById(id);
const COMPILED = {};
function getCompiled(id) { return COMPILED[id] || (COMPILED[id] = compileSong(SONG_BY_ID[id] || SONGS[0])); }

/* ---------- saves (ids and numbers only, never words) ---------- */
const SAVE_KEY = 'beat-lanes-v1';
const save = { v: 1, best: {}, offset: 0, speed: 1, last: 'twinkle', plays: 0 };
(function loadSave() {
  try {
    const s = window.BRB && BRB.storage.get(SAVE_KEY);
    if (s && typeof s === 'object') {
      if (s.best && typeof s.best === 'object') save.best = s.best;
      if (isFinite(s.offset)) save.offset = Math.max(-CONFIG.offsetRange, Math.min(CONFIG.offsetRange, Math.round(s.offset)));
      if (s.speed === 0 || s.speed === 1 || s.speed === 2) save.speed = s.speed;
      if (typeof s.last === 'string' && SONG_BY_ID[s.last]) save.last = s.last;
      if (isFinite(s.plays)) save.plays = s.plays;

})();

const DIFFS = ['easy', 'normal', 'hard'];
function bestOf(id, diff) { return (save.best[id] && save.best[id][diff]) || null; }

function totalStars() { return SONGS.reduce((a, s) => a + starsOf(s.id), 0); }
function isUnlocked(song) { return totalStars() >= song.need; }

/* ---------- game state ---------- */
const G = {
  screen: 'title', song: save.last, diff: 'normal', practice: false, slow: false, rate: 1,
  cs: null, run: null, phase: 'idle', paused: false, ended: false, startChart: 0, countFrom: -1e9,
  clock: 'audio', perf0: 0, chart0: 0,            // fallback clock when there is no audio
  manual: false, manualT: 0, auto: false, fast: false,
  now: 0, first: 0, endTimer: 0, results: null, lastCount: 99, missSfxAt: 0, lastMilestone: 0,
  selected: null, prevScreen: 'title', judgeLog: [], frames: new Float32Array(2400), frameN: 0, lastFrame: 0
};
const demo = { cs: null, run: null, t0: 0, first: 0 };
const ST = { cs: null, run: null, now: 0, view: 1.75, star: false, pulse: 0, count: null, first: 0 };   // what the renderer draws
const COUNT = { text: '', age: 9, word: false };

const viewSec = diff => CONFIG.viewSeconds[diff] / CONFIG.speedSteps[save.speed];
/** Song time (chart seconds) at a performance.now() timestamp: from the audio clock, else the fallback. */
function songTimeAt(perfMs) {
  if (G.manual) return G.manualT;
  if (G.paused) return G.pausedAt;
  if (G.clock === 'audio' && Player.on) return (Clock.heard(perfMs) - Player.t0) * Player.rate;
  return G.chart0 + (perfMs - G.perf0) / 1000 * G.rate;
}
/** Song time the picture should show: the calibration offset slides the notes so they cross the line when a tap is judged Perfect. */
const visualTime = perfMs => songTimeAt(perfMs) - save.offset / 1000 * G.rate;

/* ---------- screens ---------- */
const SCREENS = { title: 'scrTitle', songs: 'scrSongs', diff: 'scrDiff', pause: 'scrPause', results: 'scrResults', settings: 'scrSettings', calib: 'scrCalib' };
function show(name) {
  G.screen = name;
  const old = document.querySelector('.toast'); if (old) old.remove();
  for (const k in SCREENS) $(SCREENS[k]).hidden = k !== name;
  const playing = name === 'play' || name === 'pause';
  $('hud').hidden = !playing;

const pointers = new Map();           // pointerId -> lane

/** "Tap to the beat": a steady click; the average gap between your taps and the clicks becomes the offset. */
const Calib = {
  bus: null, clicks: [], taps: [], on: false, beat: 60 / CONFIG.calibrationBpm,
  start() {
    this.stop();
    if (!Sound.unlock()) { $('calMsg').textContent = ''; return; }
    this.taps = []; this.clicks = []; this.on = true;
    this.bus = liveAc.createGain(); this.bus.connect(liveA.sfx);
    const t0 = liveAc.currentTime + 0.6;
    ac = liveAc; A = liveA;
    for (let i = 0; i < 28; i++) { const at = t0 + i * this.beat; this.clicks.push(at); VOICES.stick(at, 0.05, 1, i % 4 === 0 ? 1 : 0.7, this.bus); }
    this.drawDots(); $('calMsg').textContent = t('calibCount', { n: 0, total: CONFIG.calibrationTaps });
  },
  stop() { this.on = false; if (this.bus) { const b = this.bus; b.gain.setTargetAtTime(0.0001, liveAc.currentTime, 0.02); setTimeout(() => { try { b.disconnect(); } catch (e) { /* ignore */ } }, 300); this.bus = null; } },
  tap(stamp) {

    if (Math.abs(best) > this.beat * 0.45) return;
    this.taps.push(best * 1000);
    this.drawDots();
    if (this.taps.length >= CONFIG.calibrationTaps) {

      const avg = mid.reduce((a, b) => a + b, 0) / mid.length;
      setOffset(avg);
      $('calMsg').textContent = t('calibResult', { n: (save.offset > 0 ? '+' : '') + fmtNum(save.offset) });
      this.stop();
    } else $('calMsg').textContent = t('calibCount', { n: this.taps.length, total: CONFIG.calibrationTaps });
  },
  drawDots() { const d = $('calDots'); d.textContent = ''; for (let i = 0; i < CONFIG.calibrationTaps; i++) { const s = document.createElement('i'); if (i < this.taps.length) s.className = 'on'; d.append(s); } },
  /** Pad size pulse on the clicks you hear (transform only, a slow fade - not a flash). */
  frame(perf) {

    const h = Clock.heard(perf); let k = 1;
    for (const c of this.clicks) { const d = h - c; if (d >= 0 && d < 0.35) k = 1 + 0.08 * (1 - d / 0.35); }

/* ---------- HUD ---------- */
const HUD = { score: -1, mult: -1, star: null, health: -1, groove: -1, starReady: null };
function updateHud(force) {
  const run = G.run; if (!run) return;
  const sc = runScore(run);
  if (sc !== HUD.score || force) { HUD.score = sc; $('scoreEl').textContent = fmtNum(sc); }
  const m = multOf(run.combo) * (run.starOn ? 2 : 1);
  if (m !== HUD.mult || run.starOn !== HUD.star || force) { HUD.mult = m; HUD.star = run.starOn; const el = $('multEl'); el.textContent = '×' + m; el.className = 'mult' + (m === 1 ? ' x1' : '') + (run.starOn ? ' star' : ''); }
  const h = Math.round(run.health * 100);
  if (h !== HUD.health || force) { HUD.health = h; $('healthFill').style.transform = 'scaleX(' + (h / 100) + ')'; }
  const gr = Math.round(run.groove);
  if (gr !== HUD.groove || force) { HUD.groove = gr; $('grooveFill').style.transform = 'scaleX(' + (gr / 100) + ')'; $('grooveBar').classList.toggle('full', gr >= 100); }
  const ready = run.groove >= 100 && !run.starOn && !G.ended && G.screen === 'play';
  if (ready !== HUD.starReady || force) { HUD.starReady = ready; $('starBtn').hidden = !ready; }
}

/* ---------- the frame loop ---------- */
function frame(ts) {
  requestAnimationFrame(frame);
  const perf = performance.now();
  const dt = Math.min(0.05, G.lastFrame ? (perf - G.lastFrame) / 1000 : 0.016);
  if (G.lastFrame) { G.frames[G.frameN % G.frames.length] = perf - G.lastFrame; G.frameN++; }
  G.lastFrame = perf;
  Sound.syncMute();
  Clock.sample(perf);
  if (Player.on) Player.tick();
  Sound.spectrum();
  if (G.screen === 'calib') Calib.frame(perf);

  // decide what to draw: the song being played, or the title demo
  let run = null, cs = null, now = 0, view = 1.75;
  const inSong = (G.screen === 'play' || G.screen === 'pause' || G.screen === 'results') && G.run;
  if (inSong) {
    run = G.run; cs = G.cs; view = viewSec(G.diff) * G.rate;
    if (G.screen === 'play' && !G.paused && !G.ended) {
      const tt = songTimeAt(perf);
      tickSong(tt);
      G.now = visualTime(perf);
      countdown(tt);
    }
    if (run.missQueue.length) { run.missQueue.length = 0; showJudge(4, 0); missSfx(); }
    now = G.paused ? G.pausedAt - save.offset / 1000 * G.rate : G.now;
    updateHud(false);
  } else {
    // title / menus: a quiet autoplayed demo of the selected (or first) song, no sound
    if (!demo.cs || (ST.cs && demo.cs !== ST.cs && G.screen !== 'title')) { demo.cs = ST.cs || getCompiled('twinkle'); demo.run = newRun(demo.cs.charts.hard, { diff: 'hard', practice: true }); demo.t0 = perf; demo.first = 0; setLanes(4); paintBackdrop(demo.cs.song.look); }
    cs = demo.cs; view = 1.6;
    let tt = (perf - demo.t0) / 1000 + cs.previewStart - 1;
    if (tt > cs.endSec) { demo.t0 = perf; demo.run = newRun(cs.charts.hard, { diff: 'hard', practice: true }); demo.first = 0; tt = cs.previewStart - 1; }
    run = demo.run; demoPlay(run, tt); updateRun(run, tt); run.missQueue.length = 0; now = tt;
    if (V.lanes !== 4) setLanes(4);
  }
  // beat pulse (smooth decay, at most one per beat; every other beat when beats are faster than 0.4 s)
  if (cs) {
    const b = cs.tempo.beat(now), spb = 60 / cs.tempo.bpmAtBeat(b), every = spb < 0.4 ? 2 : 1;
    const ph = (b / every) - Math.floor(b / every);
    FX.beatPulse = now < 0 && inSong ? 0 : Math.exp(-ph * every * spb * 7);
  }
  for (let l = 0; l < 4; l++) padGlow[l] = laneDown[l] ? Math.max(padGlow[l] - dt * 2, 0.55) : Math.max(0, padGlow[l] - dt * 5);
  if (FX.cheer > 0) FX.cheer -= dt;
  if (FX.shake > 0) FX.shake -= dt;
  // draw
  const look = (cs || getCompiled('twinkle')).song.look;
  paintBackdrop(look);
  g.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
  g.drawImage(bgc, 0, 0, V.w, V.h);
  const star = !!(run && run.starOn);
  let energy = 0; for (let i = 1; i < 6; i++) energy += freqData[i]; energy = energy / (5 * 255);
  drawStageFx(look, perf / 1000, energy, star);
  if (FX.shake > 0 && !REDUCED) { const s = FX.shake * 14; g.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s); }
  ST.cs = cs; ST.run = run; ST.now = now; ST.view = view; ST.star = star; ST.pulse = REDUCED ? FX.beatPulse * 0.4 : FX.beatPulse;
  ST.first = inSong ? G.first : demo.first;
  drawHighway(ST);
  drawCrowd(perf / 1000);
  drawPads(inSong && KEYS_HINT, V.lanes === 3 ? KEY_LABELS3 : KEY_LABELS4);
  drawNotes(ST);
  if (inSong) G.first = ST.first; else demo.first = ST.first;
  ST.count = COUNT.age < 1 && inSong ? COUNT : null;
  COUNT.age += dt;
  drawEffects(ST, dt);
}
const KEYS_HINT = (() => { try { return matchMedia('(hover:hover) and (pointer:fine)').matches; } catch (e) { return false; } })();
const KEY_LABELS4 = ['D', 'F', 'J', 'K'], KEY_LABELS3 = ['D', 'F J', 'K'];
/** 3-2-1-Go on the beats before beat 0 (and before the resume point after a pause). */
function countdown(tt) {
  const target = G.countFrom, tempo = G.cs.tempo;
  const bTo = tempo.beat(target), bNow = tempo.beat(tt), left = Math.ceil(bTo - bNow - 1e-6);
  if (bNow < bTo + 0.6 && left <= CONFIG.countIn && left !== G.lastCount) {
    G.lastCount = left;
    if (left >= 1) { COUNT.text = fmtNum(left); COUNT.word = false; COUNT.age = 0; }
    else if (left === 0) { COUNT.text = TX.go; COUNT.word = true; COUNT.age = 0; }
  }
}
/** The perfect bot (__brbTest.autoplay): hits every note exactly on time, holds to the end. */
function autoPlay(tt) {
  const run = G.run, off = save.offset / 1000 * G.rate;
  for (let l = 0; l < run.lanes; l++) {
    const list = run.byLane[l]; let i = run.ptr[l];
    while (i < list.length && list[i].res !== J.NONE) i++;
    const n = list[i];
    if (n && tt - off >= n.t) { const r = judgeTap(run, l, n.t + off); if (r.note) logJudge(l, r, 'auto', n.t + off); feedback(l, r); padGlow[l] = 1; }
    const h = run.holding[l];
    if (h && tt - off >= h.t + h.len) { releaseLane(run, l, h.t + h.len + off); }
    else if (h) padGlow[l] = Math.max(padGlow[l], 0.7);
  }
}
/** The title demo plays itself (no sound). */
function demoPlay(run, tt) {
  for (let l = 0; l < run.lanes; l++) {
    const list = run.byLane[l]; let i = run.ptr[l];
    while (i < list.length && list[i].res !== J.NONE) i++;
    const n = list[i];
    if (n && tt >= n.t) { const r = judgeTap(run, l, n.t); if (r.note) { const x = V.cx - V.hw + (l + 0.5) * V.laneW; spark(x, V.hitY, LANE_COLORS[l], 8, 0.8); padGlow[l] = 1; } }
    const h = run.holding[l]; if (h && tt >= h.t + h.len) releaseLane(run, l, h.t + h.len);
  }
}

/* ---------- language: fill every fixed label once ---------- */
function applyLanguage() {
  try { document.documentElement.lang = LANG; } catch (e) { /* ignore */ }
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-ta]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.ta)); });
  // Right-to-left languages: menus and text read right to left; the highway, pads and numbers stay left to right.
  if (RTL) document.querySelectorAll('.panel, .sheet, .title-top, .title-bottom, .toggles').forEach(el => { el.dir = 'rtl'; });
  TX = { judge: ['', t('perfect'), t('great'), t('good'), t('miss')], early: t('early'), late: t('late'), hold: t('hold'), combo: t('combo'), go: t('go') };
}
applyLanguage();
makeSprites();
layout();
syncMuteIcons();
show('title');
requestAnimationFrame(frame);

/* =====================================================================================
   window.__brbTest: hooks for automated play tests (harmless in production).
     state()        -> { screen, song, difficulty, time, score, combo, maxCombo, health, groove,
                         counts: {perfect, great, good, miss}, grade, over, practice, rate, starOn, paused, offset, lanes }
     songs()        -> [{ id, title, composer, bpm, bpmEnd, length, need, unlocked, notes: {easy, normal, hard},
                         charts: {easy|normal|hard: [{t, b, lane, len, chord}]} }]
     start({ song, difficulty, practice, rate }) -> state()   (rate 0.75 = practice at 75%)
     hit(lane, atTimeOffsetMs) -> { kind, delta }  judge the next note in that lane as if tapped at note time + offset
                                  (the calibration offset is applied on top, exactly like a real tap)
     autoplay(on)   -> a perfect bot plays the song
     manual(on)     -> stop real time; only step(ms) moves the song
     step(ms)       -> advance song time by ms of real time (manual clock), then state()
     skipAnimations(on) -> no delays before results / no grade animation
     setOffset(ms)  -> calibration offset (+ = you tap late), saved like the settings slider
     finish({ perfect }) -> end the song now (remaining notes are misses, or hit perfectly with perfect:true)
   Extra: timing() (song clock vs performance.now), notes(), laneXY(lane), judgeLog(), audioLog(on),
     renderAudio(song, from, dur, kinds, probeTimes), frameStats(), pause(on), show(screen), activateStar(), setGroove(n)
   ===================================================================================== */
/** One step of song rules at song time tt (shared by the frame loop and the manual clock). */
function tickSong(tt) {
  const run = G.run; if (!run || G.ended) return;
  if (G.auto) autoPlay(tt);
  updateRun(run, tt);
  if (run.failed) finishSong();
  else if (runDone(run) && tt >= G.cs.endSec + 0.3) finishSong();
}
function hookState() {
  const run = G.run, res = run && G.ended ? runResults(run) : null;
  return {
    screen: G.screen, song: G.song, difficulty: G.diff, time: run ? +songTimeAt(performance.now()).toFixed(4) : 0,
    score: run ? runScore(run) : 0, combo: run ? run.combo : 0, maxCombo: run ? run.maxCombo : 0,
    health: run ? +run.health.toFixed(4) : 0, groove: run ? +run.groove.toFixed(2) : 0,
    counts: run ? Object.assign({}, run.counts) : { perfect: 0, great: 0, good: 0, miss: 0 },
    grade: res ? res.grade : '', over: !!G.ended, passed: res ? res.passed : null, fullCombo: res ? res.fullCombo : false, allPerfect: res ? res.allPerfect : false,
    practice: G.practice, rate: G.rate, starOn: !!(run && run.starOn), paused: G.paused, offset: save.offset, lanes: run ? run.lanes : 0,
    notesTotal: run ? run.notes.length : 0, judged: run ? run.judged : 0, drops: run ? run.drops : 0, clock: G.manual ? 'manual' : G.clock
  };
}
const OUT = { sp: null, onsets: [], quiet: 0 };
window.__brbTest = {
  state: hookState,
  songs() {
    return SONGS.map(s => {
      const cs = getCompiled(s.id), ch = {};
      DIFFS.forEach(d => { ch[d] = cs.charts[d].map(n => ({ t: +n.t.toFixed(5), b: n.b, lane: n.lane, len: +n.len.toFixed(5), chord: !!n.chord })); });
      return { id: s.id, title: t(s.title), composer: t(s.by), bpm: Math.round(cs.startBpm), bpmEnd: Math.round(cs.endBpm), length: +cs.length.toFixed(2), endSec: +cs.endSec.toFixed(3),
        need: s.need, unlocked: isUnlocked(s), notes: { easy: ch.easy.length, normal: ch.normal.length, hard: ch.hard.length }, charts: ch, errors: cs.errors };
    });
  },
  start(o) { o = o || {}; Sound.unlock(); startSong(o.song || 'twinkle', o.difficulty || 'normal', { practice: !!o.practice, rate: o.rate }); return hookState(); },
  hit(lane, ms) {
    const run = G.run; if (!run) return null;
    const list = run.byLane[lane]; if (!list) return null;
    let i = run.ptr[lane]; while (i < list.length && list[i].res !== J.NONE) i++;
    const n = list[i]; if (!n) return { kind: 'none', delta: 0 };
    const tt = n.t + (+ms || 0) / 1000 * run.rate, r = judgeTap(run, lane, tt);
    if (r.note) logJudge(lane, r, 'hook', tt);
    feedback(lane, r);
    return { kind: r.kind, delta: Math.round(r.delta * 1000) / 1000, noteT: n.t };
  },
  autoplay(on) { G.auto = on !== false; return G.auto; },
  manual(on) {
    G.manual = on !== false;
    if (G.manual) { G.manualT = G.run ? songTimeAt(performance.now()) : 0; G.manual = true; Player.stop(0.05); }
    else if (G.run && !G.ended) beginClock(G.manualT);
    return G.manual;
  },
  step(ms) {
    if (!G.run) return hookState();
    const total = (+ms || 0) / 1000 * G.rate, stepS = 1 / 120;
    for (let done = 0; done < total - 1e-9; done += stepS) { G.manualT += Math.min(stepS, total - done); tickSong(G.manualT); }
    G.now = G.manualT - save.offset / 1000 * G.rate;
    return hookState();
  },
  skipAnimations(on) { G.fast = on !== false; return G.fast; },
  setOffset(ms) { setOffset(+ms || 0); return save.offset; },
  finish(o) {
    const run = G.run; if (!run || G.ended) return hookState();
    const perfect = o && o.perfect;
    run.notes.forEach(n => {
      if (n.res !== J.NONE) return;
      if (perfect) { const r = judgeTap(run, n.lane, n.t + run.offsetMs / 1000 * run.rate); if (r.note) logJudge(n.lane, r, 'hook', n.t); }
      else { n.res = J.MISS; run.counts.miss++; run.judged++; run.combo = 0; }
    });
    run.holding.forEach((h, l) => { if (h) releaseLane(run, l, h.t + h.len + run.offsetMs / 1000 * run.rate); });
    finishSong();
    return hookState();
  },
  timing() {
    const perf = performance.now();
    return { perf, chart: songTimeAt(perf), visual: visualTime(perf), rate: G.rate, offsetMs: save.offset, clock: G.manual ? 'manual' : G.clock,
      ctx: liveAc ? liveAc.currentTime : 0, heard: liveAc ? Clock.heard(perf) : 0, t0: Player.t0, mode: Clock.mode,
      latency: Clock.latency(), outputLatency: liveAc ? liveAc.outputLatency || 0 : 0, baseLatency: liveAc ? liveAc.baseLatency || 0 : 0, state: liveAc ? liveAc.state : 'none' };
  },
  notes() { return G.run ? G.run.notes.map(n => ({ t: n.t, lane: n.lane, len: n.len, chord: !!n.chord, res: J_NAMES[n.res] || '', hold: n.hold })) : []; },
  laneXY(l) { const c = laneCenter(l); return { x: c.x, y: c.y, laneW: V.laneW, hitY: V.hitY, padH: V.padH, lanes: V.lanes }; },
  judgeLog() { return G.judgeLog.slice(); },
  audioLog(on) { if (on === true) { AUDIO_LOG.length = 0; audioLogOn = true; } else if (on === false) audioLogOn = false; return AUDIO_LOG.slice(); },
  renderAudio(song, from, dur, kinds, probes) { return renderOffline(song, from, dur, kinds, probes); },
  frameStats() {
    const n = Math.min(G.frameN, G.frames.length), a = Array.from(G.frames.slice(0, n)).sort((x, y) => x - y);
    return { median: a[Math.floor(n / 2)] || 0, p95: a[Math.floor(n * 0.95)] || 0, p99: a[Math.floor(n * 0.99)] || 0, worst: a[n - 1] || 0, frames: n, over20: a.filter(x => x > 20).length, over34: a.filter(x => x > 34).length };
  },
  resetFrames() { G.frameN = 0; G.lastFrame = 0; },
  pause(on) { setPaused(on !== false); return hookState(); },
  show(name) {
    if (name === 'songs') openSongs(); else if (name === 'settings') openSettings(); else if (name === 'diff') openDiff(G.song);
    else if (name === 'calib') { show('calib'); Calib.start(); } else show(name);
    return hookState();
  },
  activateStar() { if (G.run) { G.run.groove = 100; useStar(); } return hookState(); },
  setGroove(n) { if (G.run) G.run.groove = Math.max(0, Math.min(100, +n)); return hookState(); },
  setBest(id, diff, score, grade) { if (!save.best[id]) save.best[id] = {}; save.best[id][diff] = { s: score, g: grade, a: 90, fc: false, ap: false }; persist(); return totalStars(); },
  /** Records onsets of the real mixed output (ScriptProcessor playbackTime), for timing tests. */
  tapOutput(on, size) {
    if (on === false) { if (OUT.sp) { OUT.sp.disconnect(); OUT.sp = null; } return OUT.onsets.slice(); }
    if (!Sound.unlock() || OUT.sp) return [];
    OUT.onsets.length = 0; OUT.quiet = 0;
    const sp = liveAc.createScriptProcessor(size || 512, 1, 1), z = liveAc.createGain(); z.gain.value = 0;
    sp.onaudioprocess = e => {
      const d = e.inputBuffer.getChannelData(0), sr = liveAc.sampleRate;
      for (let i = 0; i < d.length; i++) {
        const x = Math.abs(d[i]);
        if (x > 0.02) { if (OUT.quiet > sr * 0.08 && OUT.onsets.length < 400) OUT.onsets.push(e.playbackTime + i / sr); OUT.quiet = 0; } else OUT.quiet++;
      }
    };
    liveA.post.connect(sp); sp.connect(z); z.connect(liveAc.destination); OUT.sp = sp;
    return [];
  },
  ctxOfChart(c) { return Player.ctxOf(c); },
  calibClicks() { return { clicks: Calib.clicks.slice(), taps: Calib.taps.slice(), on: Calib.on, offset: save.offset }; },
  get config() { return CONFIG; }
};
</script>
