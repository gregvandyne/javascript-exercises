<title>Beat Lanes</title>
<style>
/* Beat Lanes on the Oomba Kit. Behind everything is a kit stage: each song plays in its own kit world at dusk or night
   (a city, a castle, a candy land ...) with the band standing beside the far end of the lanes: the player's own avatar
   and kit friends, lit by spotlights, cheering on combos. The game's canvas (#cv, transparent) draws the note highway,
   the gems, sparks and words in the Oomba Ink style (kit colours, Ink outlines, the kit font). The kit's title, pause
   and settings screens; the game's song list, levels, results and calibration are cards in the kit's look (kit
   buttons, icons and colours: --ok-* day/night variables).
   Layout: portrait phones get the HUD across the top; wide, short screens (landscape phones) get it in a column on the
   start side so the highway keeps its full height. Every tap target is at least 48 px. */
.bl{position:fixed;inset:0;--bl-ink:#141414;--soft:color-mix(in srgb,var(--ok-text) 68%,transparent);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.bl [hidden]{display:none!important}
.bl button{font-family:inherit;cursor:pointer}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.bl .ok-btn.ok-icon{flex:none}
.bl .ok-btn.ok-icon svg{width:26px;height:26px}
.bl .ok-btn{color:var(--bl-ink)}

/* ---------- HUD ---------- */
.hud{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));pointer-events:none}
.hud>*{pointer-events:auto}
.hmid{flex:1;min-width:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:6px;align-items:stretch;background:var(--ok-card);color:var(--ok-text);
  border:2.5px solid var(--bl-ink);border-radius:20px;box-shadow:0 4px 0 var(--bl-ink);padding:5px 10px 7px}
.scorebox{display:flex;align-items:center;justify-content:center;gap:8px;line-height:1}
.scorebox b{font-size:1.65rem;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.mult{font-weight:700;font-size:1.02rem;color:var(--bl-ink);background:var(--bl-spark);border:2px solid var(--bl-ink);border-radius:999px;padding:1px 9px;min-width:2.6em;text-align:center}
.mult.x1{background:var(--ok-bg2);color:var(--ok-text);border-color:var(--ok-line)}
.mult.star{background:var(--bl-spark);box-shadow:0 0 0 3px var(--bl-sparkTint)}
.meters{display:flex;gap:10px}
.meter{flex:1;display:flex;align-items:center;gap:5px;min-width:0}
.meter svg{width:18px;height:18px;flex:none}
.bar{flex:1;height:12px;border-radius:999px;background:var(--ok-bg2);overflow:hidden;border:2px solid var(--bl-ink)}
.bar i{display:block;height:100%;width:100%;background:var(--bl-mint);transform-origin:left center;transform:scaleX(.5)}
.bar.low i{background:var(--bl-coral)}
.bar.groove i{background:var(--bl-sky);transform:scaleX(0)}
.bar.full i{background:var(--bl-spark)}
.bar.full{box-shadow:0 0 0 3px var(--bl-sparkTint)}
.star-btn{position:absolute;z-index:6;left:50%;transform:translateX(-50%);top:calc(max(8px,env(safe-area-inset-top)) + 92px);white-space:nowrap;animation:starbob 1.4s ease-in-out infinite}
.star-btn svg{width:30px;height:30px}
@keyframes starbob{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}
/* Wide, short screens: the HUD becomes a column on the start side, the star button sits on the end side. */
.bl.wide .hud{right:auto;bottom:0;width:min(28vw,230px);flex-direction:column;align-items:stretch;justify-content:center;gap:12px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
[dir=rtl] .bl.wide .hud{left:auto;right:0}
.bl.wide .hud .ok-icon{align-self:flex-start}
.bl.wide .hmid{flex:none}
.bl.wide .meters{flex-direction:column;gap:6px}
.bl.wide .scorebox{flex-direction:column;align-items:center}
.bl.wide .star-btn{left:auto;right:max(14px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);animation:starbob2 1.4s ease-in-out infinite;white-space:normal;max-width:min(26vw,210px);line-height:1.1;padding:8px 14px}
[dir=rtl] .bl.wide .star-btn{right:auto;left:max(14px,env(safe-area-inset-left))}
@keyframes starbob2{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.07)}}
.bl.wide #muteBtn{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top))}
[dir=rtl] .bl.wide #muteBtn{right:auto;left:max(10px,env(safe-area-inset-left))}

/* ---------- screens (cards in the kit's look) ---------- */
.screen{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom))}
.screen.dim{background:var(--ok-scrim)}
.panel{position:relative;background:var(--ok-card);color:var(--ok-text);border:3px solid var(--bl-ink);border-radius:28px;padding:14px 16px 16px;width:min(100%,460px);max-height:100%;overflow:auto;text-align:center;
  box-shadow:0 6px 0 var(--bl-ink);display:flex;flex-direction:column;align-items:center;gap:10px;box-sizing:border-box}
.panel h2,.sheet h2{margin:0;font-size:clamp(1.5rem,7vw,2rem);line-height:1.1;font-weight:700}
.panel p{margin:0;font-size:1rem;line-height:1.3}
.hint{font-size:.92rem;color:var(--soft)}
.btns{display:flex;gap:10px;width:100%;justify-content:center;flex-wrap:wrap}
.btns .ok-btn{flex:1 1 128px;min-width:0;padding:0 12px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-weight:700;background:var(--ok-card);color:var(--ok-text);border:2.5px solid var(--bl-ink);border-radius:999px;padding:3px 12px 3px 7px;font-size:1rem;white-space:nowrap;box-shadow:0 3px 0 var(--bl-ink)}
.chip svg{width:22px;height:22px}
.chip.gold{background:var(--bl-spark);color:var(--bl-ink)}
.toggle{min-height:52px;border-radius:16px;background:var(--ok-bg2);color:var(--ok-text);border:2.5px solid var(--ok-line);padding:6px 14px;font-weight:700;font-size:1rem;line-height:1.15;display:inline-flex;align-items:center;gap:8px}
.toggle svg{width:24px;height:24px;flex:none}
.toggle[aria-pressed=true]{background:var(--bl-mintTint);color:var(--bl-ink);border-color:var(--bl-ink);box-shadow:inset 0 0 0 2px var(--bl-mint)}
.bar-head{display:flex;align-items:center;gap:10px;width:100%}
.bar-head h2{flex:1;min-width:0;font-size:clamp(1.3rem,6vw,1.8rem);text-align:start}
[dir=rtl] .back svg{transform:scaleX(-1)}
.kbonly{display:none}
@media (hover:hover) and (pointer:fine){.kbonly{display:block}}

/* title (the kit's): the game's stars, the keys and Settings go on a card under Play */
.bl-tcard{display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--ok-card);color:var(--ok-text);border:3px solid var(--bl-ink);border-radius:28px;box-shadow:0 6px 0 var(--bl-ink);padding:14px 16px 16px;max-width:min(400px,calc(100vw - 32px));box-sizing:border-box}
.bl-tcard .ok-p{border:0!important;box-shadow:none!important;background:transparent!important;padding:0!important;margin:0;font-weight:600}
.bl-tcard .row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.bl-tcard .ok-big{min-width:220px}
.bl-tcard .hint{margin:0;font-size:.85rem}
.ok-title-screen .ok-h1 .ok-title-word:nth-child(3){--ok-t1:#7FD3FF;--ok-t2:#2B8FD0}

/* song list */
.sheet{width:min(100%,540px);height:100%;display:flex;flex-direction:column;gap:10px;background:var(--ok-card);color:var(--ok-text);border:3px solid var(--bl-ink);border-radius:28px;padding:12px;
  box-shadow:0 6px 0 var(--bl-ink);box-sizing:border-box}
.cards{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:2px 2px 8px;touch-action:pan-y;overscroll-behavior:contain}
.card{display:grid;grid-template-columns:62px minmax(0,1fr);grid-template-areas:"cover info" "cover row" "go go";column-gap:10px;row-gap:5px;align-items:center;background:var(--ok-bg2);border:2.5px solid var(--ok-line);border-radius:20px;padding:8px 10px;min-height:76px;cursor:pointer;text-align:start;position:relative;flex:none}
.card[aria-pressed=true]{border-color:var(--bl-ink);box-shadow:0 4px 0 var(--bl-ink),inset 0 0 0 3px var(--bl-sky)}
.card.locked{opacity:.66}
.cover{grid-area:cover;align-self:start;width:62px;height:62px;flex:none;border-radius:16px;display:grid;place-items:center;border:2.5px solid var(--bl-ink);overflow:hidden}
.cover .cic{color:var(--bl-grape);display:grid;place-items:center}
.cover .cic svg{width:38px;height:38px}
.cover canvas{width:52px;height:52px;object-fit:contain}
.cover svg{width:30px;height:30px}
.cinfo{grid-area:info;min-width:0;display:flex;flex-direction:column;gap:2px}
.cinfo .nw{white-space:nowrap}
.cinfo b{font-size:1.08rem;line-height:1.15}
.cinfo .by{font-size:.84rem;color:var(--soft);line-height:1.2}
.diffs{grid-area:row;display:flex;gap:5px;flex-wrap:wrap;min-width:0}
.dchip{display:inline-flex;align-items:center;gap:2px;font-size:.76rem;background:var(--ok-card);border:1.5px solid var(--ok-line);border-radius:999px;padding:1px 6px 1px 4px;white-space:nowrap;direction:ltr}
.dchip .lv{width:15px;height:14px;flex:none}
.st{color:var(--bl-sparkText);letter-spacing:-1px}
.dchip .gr{font-weight:700;margin-inline-start:3px}
.card .go{grid-area:go;width:100%;min-height:52px;padding:0 14px;margin-top:3px}
.card .lock{grid-area:row;font-size:.88rem;font-weight:700;line-height:1.15;display:flex;align-items:center;gap:5px}
.card .lock svg{width:20px;height:20px;flex:none}

/* difficulty */
.levels{display:flex;flex-direction:column;gap:9px;width:100%}
.lvl{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:start;border-radius:20px;padding:6px 14px;min-height:66px;
  background:var(--lvl);color:var(--bl-ink);border:2.5px solid var(--bl-ink);box-shadow:0 5px 0 var(--bl-ink);font:inherit}
.lvl:active{transform:translateY(3px);box-shadow:0 2px 0 var(--bl-ink)}
.lvl .em{grid-row:1/3;width:52px;height:52px;display:grid;place-items:center}
.lvl .em canvas{width:52px;height:52px;object-fit:contain}
.lvl b{font-size:1.25rem}
.lvl small{grid-column:2;font-size:.86rem;line-height:1.2;font-weight:600;opacity:.85}
.lvl .lstars{grid-row:1/3;grid-column:3;font-size:1rem;white-space:nowrap;direction:ltr;text-align:end;color:var(--bl-ink)}
.lvl .lstars em{display:block;font-style:normal;font-weight:700;font-size:1.1rem}
.lvl.easy{--lvl:var(--bl-mintTint)} .lvl.normal{--lvl:var(--bl-skyTint)} .lvl.hard{--lvl:var(--bl-coralTint)}
.toggles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* results */
.rsong{font-size:.95rem;color:var(--soft)}
.gradewrap{display:flex;align-items:center;gap:14px;position:relative;isolation:isolate}
/* a cleared song: a warm top to the card and spark rays turning behind the grade */
.panel.win{background:linear-gradient(color-mix(in srgb,var(--bl-spark) 30%,var(--ok-card)),var(--ok-card) 48%)}
.panel.win .gradewrap::before{content:"";position:absolute;z-index:-1;left:calc(.675*4.6rem);top:50%;width:13rem;height:13rem;margin:-6.5rem 0 0 -6.5rem;border-radius:50%;
  background:repeating-conic-gradient(color-mix(in srgb,var(--bl-spark) 55%,transparent) 0 11deg,transparent 11deg 22deg);
  -webkit-mask:radial-gradient(closest-side,#000 30%,transparent);mask:radial-gradient(closest-side,#000 30%,transparent);animation:rays 14s linear infinite}
[dir=rtl] .panel.win .gradewrap::before{left:auto;right:calc(.675*4.6rem);margin:-6.5rem -6.5rem 0 0}
@keyframes rays{to{transform:rotate(360deg)}}
.grade{font-size:4.6rem;line-height:1;font-weight:700;color:var(--bl-ink);width:1.35em;height:1.35em;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--bl-skyTint);border:4px solid var(--bl-ink);box-shadow:0 5px 0 var(--bl-ink),inset 0 -8px 0 var(--bl-sky)}
.grade.S{background:var(--bl-spark);box-shadow:0 5px 0 var(--bl-ink),inset 0 -8px 0 var(--bl-sparkShade)}
.grade.A{background:var(--bl-mintTint);box-shadow:0 5px 0 var(--bl-ink),inset 0 -8px 0 var(--bl-mint)}
.grade.none svg{width:.6em;height:.6em}
.bl .ok-sparks{display:flex;gap:6px;direction:ltr}
.bl .ok-sparks .ok-slot{width:clamp(38px,10vmin,52px);height:clamp(38px,10vmin,52px)}
.ok-night .bl .ok-sparks .ok-on{--ok-fill:var(--bl-spark)}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.badge{font-weight:700;border-radius:999px;padding:3px 12px;background:var(--bl-mintTint);color:var(--bl-ink);border:2px solid var(--bl-ink)}
.badge.ap{background:var(--bl-spark)}
.badge.nb{background:var(--bl-coralTint)}
.score-big{font-size:2.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:10px;width:100%}
.stats>div{flex:1;background:var(--ok-bg2);border:2px solid var(--ok-line);border-radius:16px;padding:6px;display:flex;flex-direction:column;gap:2px}
.stats span{font-size:.85rem;color:var(--soft)}
.stats b{font-size:1.3rem}
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}
.counts>span{background:var(--ok-bg2);border:2px solid var(--ok-line);border-top:5px solid var(--c);border-radius:14px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.counts i{font-style:normal;font-size:.78rem;font-weight:700;max-width:100%;overflow-wrap:anywhere;line-height:1.1}
.counts b{font-size:1.15rem}
.c-perfect{--c:var(--bl-spark)} .c-great{--c:var(--bl-sky)} .c-good{--c:var(--bl-mint)} .c-miss{--c:var(--bl-coral)}
.unlock{font-weight:700;display:inline-flex;align-items:center;gap:6px}
.unlock svg{width:22px;height:22px;flex:none}
.pop-in{animation:popin .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes popin{0%{transform:scale(.2) rotate(-12deg)}100%{transform:scale(1) rotate(0)}}

/* settings + calibration */
.group{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--ok-bg2);border:2px solid var(--ok-line);border-radius:20px;padding:10px;box-sizing:border-box}
.group .lbl{font-weight:700;font-size:1.05rem}
.offrow{display:flex;align-items:center;gap:8px;width:100%}
.offrow input{flex:1;min-width:0;height:44px;accent-color:var(--bl-coral)}
#offVal{font-size:1.4rem;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;width:100%}
.seg button{flex:1;min-height:50px;border-radius:14px;background:var(--ok-card);color:var(--ok-text);border:2.5px solid var(--ok-line);font-weight:700;font-size:1rem;padding:4px}
.seg button[aria-pressed=true]{background:var(--bl-mintTint);color:var(--bl-ink);border-color:var(--bl-ink)}
.tap-pad{width:min(52vw,180px);height:min(52vw,180px);border-radius:50%;font-size:1.8rem;font-weight:700;color:var(--bl-ink);flex:none;touch-action:none;
  background:var(--bl-coral);border:4px solid var(--bl-ink);box-shadow:0 8px 0 var(--bl-ink),inset 0 -12px 0 var(--bl-coralShade)}
.tap-pad:active{box-shadow:0 3px 0 var(--bl-ink),inset 0 -12px 0 var(--bl-coralShade)}
.dots{display:flex;gap:7px;direction:ltr}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--ok-bg2);border:2px solid var(--ok-line)}
.dots i.on{background:var(--bl-mint);border-color:var(--bl-ink)}
kbd{display:inline-block;min-width:1.4em;padding:0 .3em;border-radius:6px;background:var(--ok-bg2);border:1.5px solid var(--ok-line);font-family:inherit;font-weight:700}
@media (max-height:620px){.panel{gap:7px;padding:10px 14px}.grade{font-size:3.2rem}.score-big{font-size:2rem}.lvl{min-height:56px;padding:4px 12px}.tap-pad{width:140px;height:140px}}
/* Short landscape: results go two columns so nothing needs scrolling. */
@media (orientation:landscape) and (max-height:500px){
  .panel.wideable{width:min(100%,760px);display:grid;grid-template-columns:1fr 1fr;align-items:center;column-gap:16px}
  .panel.wideable .colL,.panel.wideable .colR{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
  .panel.wideable>.bar-head{grid-column:1/-1}
  .panel.wideable>.group{align-self:stretch;justify-content:center}
  .levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .lvl{grid-template-columns:1fr;grid-template-rows:auto;text-align:center;justify-items:center;row-gap:2px}
  .lvl .em,.lvl small,.lvl .lstars{grid-row:auto;grid-column:auto;text-align:center}
  .tap-pad{width:120px;height:120px}
}
.colL,.colR{display:contents}
.ok-ui[lang|=ja] .panel p,.ok-ui[lang|=ja] .panel h2,.ok-ui[lang|=ja] button,.ok-ui[lang|=ja] .lvl small,.ok-ui[lang|=ja] .cinfo,.ok-ui[lang|=zh] button{word-break:auto-phrase}
.ok-ui[lang|=ja] .counts i,.ok-ui[lang|=ru] .counts i{white-space:nowrap;font-size:.68rem;letter-spacing:-.02em}
.ok-rm .star-btn,.ok-rm .bl.wide .star-btn{animation:none}.ok-rm .pop-in{animation:none}.ok-rm .panel.win .gradewrap::before{animation:none}
@media (prefers-reduced-motion:reduce){.star-btn,.bl.wide .star-btn{animation:none}.pop-in{animation:none}.panel.win .gradewrap::before{animation:none}}
/* Tall phones: results sit at the top so the band can cheer under the card */
@media (max-aspect-ratio:4/5){
  #scrResults{align-items:flex-start;background:linear-gradient(var(--ok-scrim) 55%,transparent 80%)}
  #scrResults .panel{gap:7px;padding:12px 14px 14px}
  #scrResults .grade{font-size:3.6rem}
  #scrResults .score-big{font-size:2.1rem}
  #scrResults .stats b{font-size:1.15rem}
  #scrResults .btns .ok-btn{min-height:50px}
}
</style>

<div id="game" class="bl">
<canvas id="cv" aria-label="Note lanes. Tap a lane when its note reaches the line." data-ta="laneAria"></canvas>

<div class="hud" id="hud" hidden>
  <button class="ok-btn ok-icon" id="pauseBtn" data-icon="pause" aria-label="Pause" data-ta="pause"></button>
  <div class="hmid">
    <div class="scorebox"><b id="scoreEl" dir="ltr">0</b><span class="mult x1" id="multEl" dir="ltr">×1</span></div>
    <div class="meters">
      <div class="meter" id="healthBox"><span data-icon="heart" aria-hidden="true"></span><div class="bar" id="healthBar" role="meter" aria-label="Health" data-ta="healthAria"><i id="healthFill"></i></div></div>
      <div class="meter"><span data-icon="spark" aria-hidden="true"></span><div class="bar groove" id="grooveBar" role="meter" aria-label="Groove" data-ta="groove"><i id="grooveFill"></i></div></div>
    </div>
  </div>
  <button class="ok-btn ok-icon mute" id="muteBtn" aria-label="Turn sound off"></button>
</div>
<button class="ok-btn ok-hot ok-big star-btn" id="starBtn" hidden aria-label="Start Star Power" data-ta="starAria" data-icon="spark"><span data-t="starGo">Star Power!</span></button>

<section class="screen" id="scrSongs" hidden>
  <div class="sheet">
    <div class="bar-head"><button class="ok-btn ok-icon back" id="songsBack" data-icon="back" aria-label="Back" data-ta="back"></button><h2 data-t="pickSong">Pick a song</h2><span class="chip gold" id="songsStars" dir="ltr"></span></div>
    <div class="cards" id="cards"></div>
  </div>
</section>

<section class="screen" id="scrDiff" hidden>
  <div class="panel">
    <div class="bar-head"><button class="ok-btn ok-icon back" id="diffBack" data-icon="back" aria-label="Back" data-ta="back"></button><h2 id="diffTitle"></h2></div>
    <p class="hint" data-t="chooseLevel">Choose a level</p>
    <div class="levels">
      <button class="lvl easy" data-diff="easy"><span class="em" data-pic="duck"></span><b data-t="easy">Easy</b><small data-t="easyInfo"></small><span class="lstars"></span></button>
      <button class="lvl normal" data-diff="normal"><span class="em" data-pic="bunny"></span><b data-t="normal">Normal</b><small data-t="normalInfo"></small><span class="lstars"></span></button>
      <button class="lvl hard" data-diff="hard"><span class="em" data-pic="fox"></span><b data-t="hard">Hard</b><small data-t="hardInfo"></small><span class="lstars"></span></button>
    </div>
    <div class="toggles">
      <button class="toggle" id="practiceTg" aria-pressed="false" data-icon="heart"><span data-t="practice">Practice</span></button>
      <button class="toggle" id="slowTg" aria-pressed="false" hidden data-icon="timer"><span data-t="slow">Slow</span></button>
    </div>
    <p class="hint" data-t="funNote"></p>
    <p class="hint kbonly" id="diffKeys"></p>
  </div>
</section>

<section class="screen dim" id="scrResults" hidden>
  <div class="panel wideable" id="resPanel">
    <div class="colL">

/** The player's language (from the platform; never from the URL) and helpers. Looked up once, never per frame. */
const LANG = (window.BRB && BRB.user && BRB.user.lang) || 'en';
const LANG_BASE = String(LANG).split('-')[0];
const RTL = ((window.BRB && BRB.user && BRB.user.dir) === 'rtl') || LANG_BASE === 'he' || LANG_BASE === 'ar';
const NUM_LOCALE = LANG_BASE === 'ar' ? 'ar-u-nu-latn' : LANG;      // Arabic text, Latin digits (like the site)
const I18N_CHAIN = [I18N[LANG], I18N[LANG_BASE], I18N.en].filter(Boolean);
let PLURAL = null, NUMF = null;
try { PLURAL = new Intl.PluralRules(NUM_LOCALE); } catch (e) { /* old browser: one/other below */ }
try { NUMF = new Intl.NumberFormat(NUM_LOCALE); } catch (e) { /* ignore */ }
const fmtNum = n => (NUMF ? NUMF.format(n) : String(n));
/** t('key', { n: 3 }): the string for this language, {name} placeholders filled; a plural set picks its form by n. */
function t(key, vars) {
  let s;
  for (let i = 0; i < I18N_CHAIN.length && s === undefined; i++) s = I18N_CHAIN[i][key];
  if (s === undefined) return key;
  if (s && typeof s === 'object') { const n = vars && typeof vars.n === 'number' ? vars.n : 0; s = (n === 0 && s.zero) || s[PLURAL ? PLURAL.select(n) : (n === 1 ? 'one' : 'other')] || s.other; }
  if (vars && typeof s === 'string') s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] === undefined ? m : typeof vars[k] === 'number' ? fmtNum(vars[k]) : vars[k]));
  return s;
}

/* CORE-BEGIN */
/* =====================================================================================
   MUSIC CORE
   Melodies are written as text, one token per note:  PITCH[:LENGTH][FLAGS]
     PITCH   C4, F#4, Bb3 ... or r for a rest
     LENGTH  in beats: 1, 2, 1/2, 3/2, 1/3 ... (sticky: a token without one keeps the last length)
     FLAGS   ^ two-lane chord on Hard   ~ make it a hold   ! accent (kept on Easy)
             ? ghost note (only charted on Hard)   * music only (never charted)
     |       a bar line; the parser checks every bar adds up (catches typos in the tunes)
   Harmony is written as CHORD:LENGTH tokens (C:2 G7:2 | ...) and drives the bass and the backing.
   ===================================================================================== */
const PITCH = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function noteMidi(name) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(name);
  if (!m) return NaN;
  return 12 * (+m[3] + 1) + PITCH[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
}
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
const near = (a, b) => Math.abs(a - b) < 1e-6;
function parseLen(s) { if (s.indexOf('/') >= 0) { const p = s.split('/'); return +p[0] / +p[1]; } return +s; }

/** Melody text -> { notes: [{ b (beat), d (beats), m (midi), fl (flags) }], len, bars, errors } */
function parsePhrase(src, barBeats) {
  const notes = [], errors = [];
  let pos = 0, dur = 1, barStart = 0, bars = 0;
  for (const tok of src.trim().split(/\s+/)) {
    if (tok === '|') {
      if (!near(pos - barStart, barBeats)) errors.push('bar ' + (bars + 1) + ' has ' + (+(pos - barStart).toFixed(3)) + ' beats');
      barStart = pos; bars++; continue;
    }
    const m = /^(r|[A-G][#b]?\d)(?::([\d./]+))?([\^~!?*]*)$/.exec(tok);
    if (!m) { errors.push('bad token ' + tok); continue; }
    if (m[2]) dur = parseLen(m[2]);
    if (m[1] !== 'r') notes.push({ b: pos, d: dur, m: noteMidi(m[1]), fl: m[3] || '' });
    pos += dur;
  }
  if (!near(pos, barStart)) errors.push('phrase does not end on a bar line');
  return { notes, len: pos, bars, errors };
}

/** Chord qualities as semitones above the root. */
const CHORDS = {
  '': [0, 4, 7], m: [0, 3, 7], '7': [0, 4, 7, 10], maj7: [0, 4, 7, 11], m7: [0, 3, 7, 10],
  m9: [0, 3, 7, 10, 14], maj9: [0, 4, 7, 11, 14], '9': [0, 4, 7, 10, 14], dim: [0, 3, 6], sus4: [0, 5, 7], '5': [0, 7]
};
/** Harmony text -> { spans: [{ b, d, root (0-11), iv: [semitones] }], len, errors } */
function parseHarmony(src, barBeats) {
  const spans = [], errors = [];
  let pos = 0, barStart = 0, bars = 0;
  for (const tok of src.trim().split(/\s+/)) {
    if (tok === '|') { if (!near(pos - barStart, barBeats)) errors.push('harmony bar ' + (bars + 1) + ' is wrong'); barStart = pos; bars++; continue; }
    const m = /^([A-G])([#b]?)([a-z0-9]*):([\d./]+)$/.exec(tok);
    if (!m || !CHORDS[m[3]]) { errors.push('bad chord ' + tok); continue; }
    const d = parseLen(m[4]);
    spans.push({ b: pos, d, root: (PITCH[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + 12) % 12, iv: CHORDS[m[3]] });
    pos += d;
  }
  if (!near(pos, barStart)) errors.push('harmony does not end on a bar line');
  return { spans, len: pos, errors };
}

  const events = buildEvents(song, secs, phr, tempo, totalBeats);

  const charts = { easy: buildChart(song, cands, 'easy', tempo), normal: buildChart(song, cands, 'normal', tempo), hard: buildChart(song, cands, 'hard', tempo) };
  const endSec = tempo.sec(totalBeats);
  const firstMelody = secs.find(s => s.def.p) || secs[0];
  return {
    song, id: song.id, secs, tempo, events, charts, cands, errors, totalBeats,
    endSec, length: endSec + 1.2,                         // song length in seconds (incl. the last ring-out)
    previewStart: tempo.sec(firstMelody.start),
    startBpm: tempo.bpms[0], endBpm: tempo.bpmAtBeat(totalBeats - 0.01)
  };
}

/** Every sound of the arrangement as { t, d (seconds), kind, inst, m (midi), v (volume), drum }. */
function buildEvents(song, secs, phr, tempo, totalBeats) {
  const ev = [], bb = song.barBeats, snd = song.sound;
  const add = (b, dB, kind, inst, m, v, drum) => {
    const t = tempo.sec(b);
    ev.push({ t, d: Math.max(0.03, tempo.sec(b + dB) - t), kind, inst, m, v, drum: drum || '' });
  };
  // Count-in sticks before the song (beats -countIn .. -1).
  for (let i = CONFIG.countIn; i >= 1; i--) add(-i, 0.1, 'stick', 'stick', 0, i === CONFIG.countIn ? 1 : 0.8);
  secs.forEach(sec => {
    const s = sec.def, b0 = sec.start, spans = sec.harmony.spans;
    // Melody (lead)
    if (s.p) {
      const inst = s.inst || snd.lead, oct = (s.oct || 0) * 12;
      phr[s.p].notes.forEach(n => add(b0 + n.b, n.d * 0.92, 'lead', inst, n.m + oct, n.fl.indexOf('?') >= 0 ? 0.75 : 1));
    }
    // Extra voices (rounds and counter-melodies), rotated by `shift` beats so they wrap inside the section.
    (s.layers || []).forEach(L => {
      const p = phr[L.p]; if (!p) return;
      const oct = (L.oct || 0) * 12, shift = L.shift || 0;
      p.notes.forEach(n => {
        let b = n.b + shift; while (b >= sec.len - 1e-6) b -= p.len;
        if (b < -1e-6 || b >= sec.len - 1e-6) return;
        const d = Math.min(n.d, sec.len - b);
        add(b0 + b, d * 0.92, 'layer', L.inst, n.m + oct, L.vol || 0.5);
      });
    });
    // Bass line
    const bl = BASSLINES[s.bass];
    if (bl) {
      const steps = bl.n.length, stepB = 1 / bl.st;
      for (let bar = 0; bar < sec.len / bb - 1e-6; bar++) {
        for (let i = 0; i < steps; i++) {
          const ch = bl.n[i]; if (ch === '.' || ch === '-') continue;
          let len = 1; while (i + len < steps && bl.n[i + len] === '-') len++;
          const b = bar * bb + i * stepB, sp = spanAt(spans, b);
          let m = 36 + sp.root;
          if (ch === 'F') m += 7; else if (ch === 'O') m += 12; else if (ch === 'T') m += sp.iv[1]; else if (ch === 'S') m += (sp.iv[3] || 10); else if (ch === 'L') m -= 5;
          add(b0 + b, len * stepB * 0.9, 'bass', snd.bass, m, 1);
        }
      }
    }
    // Backing chords
    const comp = s.comp;
    if (comp) spans.forEach(sp => {
      const v = voicing(sp.root, sp.iv, 55), sb = b0 + sp.b, inst = comp === 'pad' ? 'pad' : comp === 'fifth' ? 'pizz' : comp === 'rhodes' ? 'rhodes' : comp.indexOf('arp') === 0 ? 'pluck' : snd.comp;
      if (comp === 'pad') v.forEach(m => add(sb, sp.d * 0.98, 'comp', inst, m, 0.55));
      else if (comp === 'rhodes') { v.forEach(m => add(sb, Math.min(sp.d, 2) * 0.95, 'comp', inst, m, 0.6)); if (sp.d >= 4) v.forEach(m => add(sb + 2.5, 1.4, 'comp', inst, m, 0.4)); }
      else if (comp === 'arp' || comp === 'arp3') {
        const st = comp === 'arp3' ? 1 / 3 : 1 / 2, tones = v.concat([v[0] + 12]);
        let k = 0; for (let x = 0; x < sp.d - 1e-6; x += st, k++) add(sb + x, st * 1.8, 'comp', inst, tones[k % tones.length], 0.55);
      } else if (comp === 'stab') { for (let x = 0; x < sp.d - 1e-6; x += 1) v.forEach(m => add(sb + x + 0.5, 0.3, 'comp', inst, m, 0.5)); }
      else if (comp === 'keys') { for (let x = 0; x < sp.d - 1e-6; x += 1) v.forEach(m => add(sb + x, 0.8, 'comp', inst, m, 0.45)); }
      else if (comp === 'fifth') { const r = 48 + sp.root; for (let x = 0; x < sp.d - 1e-6; x += 1) { add(sb + x, 0.35, 'comp', inst, r, 0.6); add(sb + x, 0.35, 'comp', inst, r + 7, 0.5); } }
    });
    // Drums
    const dp = DRUMS[s.drums];
    if (dp) {
      const stepB = 1 / dp.st;
      for (let bar = 0; bar < sec.len / bb - 1e-6; bar++) {
        for (const voice of 'ksohctwry') {
          const pat = dp[voice]; if (!pat) continue;
          for (let i = 0; i < pat.length; i++) {
            const c = pat[i]; if (c !== 'x' && c !== 'X') continue;
            let b = bar * bb + i * stepB;
            if (dp.sw && voice === 'h' && i % 4 === 2) b += dp.sw;
            add(b0 + b, 0.1, 'drum', snd.kit, 0, c === 'X' ? 1 : 0.75, voice);
          }
        }
      }
    }
  });

  ev.sort((a, b) => a.t - b.t);
  return ev;
}

/**
 * Chart candidates: every melody note of every charted section (and drum hits of drum sections),
 * with a lane for 4 lanes (l4) and for 3 lanes (l3). Lanes follow the pitch: low notes on the left,
 * high notes on the right, ranked within each section so every lane gets used.
 */
function buildCandidates(song, secs, phr, tempo) {
  const out = [], bb = song.barBeats;
  secs.forEach(sec => {
    const s = sec.def, mode = s.chart || (s.p ? 'melody' : 'none');
    if (mode === 'melody' && s.p) {
      const notes = phr[s.p].notes.filter(n => n.fl.indexOf('*') < 0);
      const pitches = Array.from(new Set(notes.map(n => n.m))).sort((a, b) => a - b), np = pitches.length;
      const laneOf = (m, lanes) => { const r = pitches.indexOf(m); return np <= 1 ? Math.floor(lanes / 2) : np < lanes ? Math.round(r * (lanes - 1) / (np - 1)) : Math.min(lanes - 1, Math.floor(r * lanes / np)); };
      notes.forEach(n => out.push({ b: sec.start + n.b, d: n.d, m: n.m + (s.oct || 0) * 12, fl: n.fl, l4: laneOf(n.m, 4), l3: laneOf(n.m, 3), sec: sec.index, drum: false }));
    } else if (mode === 'drums') {
      const dp = DRUMS[s.drums]; if (!dp) return;
      const stepB = 1 / dp.st, seen = {};
      for (let bar = 0; bar < sec.len / bb - 1e-6; bar++) {
        for (const voice of 'yksctrw') {
          const pat = dp[voice]; if (!pat) continue;
          for (let i = 0; i < pat.length; i++) {
            if (pat[i] !== 'x' && pat[i] !== 'X') continue;
            const b = sec.start + bar * bb + i * stepB, key = Math.round(b * 48);
            if (seen[key]) continue; seen[key] = 1;
            const odd = bar % 2 === 1;
            if (voice === 'y') out.push({ b, d: 1, m: 79, fl: '^!', l4: 0, l3: 1, sec: sec.index, drum: true });
            else if (voice === 'k') out.push({ b, d: stepB, m: 60, fl: pat[i] === 'X' ? '!' : '', l4: odd ? 0 : 1, l3: 0, sec: sec.index, drum: true });
            else out.push({ b, d: stepB, m: 67, fl: '', l4: odd ? 3 : 2, l3: 2, sec: sec.index, drum: true });
          }
        }
      }
    }
  });
  out.sort((a, b) => a.b - b.b);

}

/**
 * The chart generator: one hand-written chart (the melody plus its flags) -> Easy, Normal or Hard.
 *   Hard   4 lanes, everything incl. ghost notes, chords (^), holds from 1.5 beats.
 *   Normal 4 lanes, eighth-note grid, no ghosts, no chords, holds from 2 beats.
 *   Easy   3 lanes, notes on the beat (plus accents), holds from 2 beats.
 * Notes are kept strongest-beat first, so thinning never drops a downbeat for an off-beat. Two notes
 * are never closer than the gap for that level, and quick repeats in one lane alternate with a
 * neighbouring lane so they can be played with two fingers.
 */
function buildChart(song, cands, diff, tempo) {
  const R = CONFIG.chart, bb = song.barBeats, lanes = diff === 'easy' ? CONFIG.easyLanes : CONFIG.lanes;
  const gapS = R.minGapSec[diff], gapB = R.minGapBeats[diff] * (song.triplet && diff !== 'easy' ? 2 / 3 : 1);
  const pool = [];
  cands.forEach((c, i) => {
    if (c.fl.indexOf('?') >= 0 && diff !== 'hard') return;
    const st = strength(c.b, bb, song.triplet);
    if (diff === 'easy' && st < 2 && c.fl.indexOf('!') < 0) return;
    if (diff === 'normal' && st < 1) return;
    pool.push({ c, i, st, t: tempo.sec(c.b) });
  });
  // Priority: strong beats, then accents, then long notes, then earlier.
  const order = pool.slice().sort((a, b) => (b.st - a.st) || ((b.c.fl.indexOf('!') >= 0) - (a.c.fl.indexOf('!') >= 0)) || (b.c.d - a.c.d) || (a.t - b.t));
  const kept = [];                                   // sorted by time
  const fits = p => {
    let lo = 0, hi = kept.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (kept[mid].t < p.t) lo = mid + 1; else hi = mid; }
    const prev = kept[lo - 1], next = kept[lo];
    if (prev && (p.t - prev.t < gapS - 1e-6 || p.c.b - prev.c.b < gapB - 1e-6)) return -1;
    if (next && (next.t - p.t < gapS - 1e-6 || next.c.b - p.c.b < gapB - 1e-6)) return -1;
    return lo;
  };
  order.forEach(p => { const at = fits(p); if (at >= 0) kept.splice(at, 0, p); });
  // Build notes in time order: lanes, holds, chords, jack breaking.
  const notes = [];
  let prevLanes = [], prevT = -1e9;
  kept.forEach(p => {
    const c = p.c;
    let lane = lanes === 3 ? c.l3 : c.l4;
    if (p.t - prevT < R.jackSec - 1e-6 && prevLanes.indexOf(lane) >= 0) {
      const options = lane < lanes / 2 ? [lane + 1, lane - 1, lane + 2] : [lane - 1, lane + 1, lane - 2];
      for (const o of options) if (o >= 0 && o < lanes && prevLanes.indexOf(o) < 0) { lane = o; break; }
    }
    let lenB = 0;
    const holdable = c.d >= R.holdMinBeats[diff] - 1e-6 || (c.fl.indexOf('~') >= 0 && diff !== 'easy');
    if (holdable && !c.drum) {
      lenB = c.d - (c.d >= 2 ? 0.5 : 0.25);
      if (tempo.sec(c.b + lenB) - p.t < R.minHoldSec) lenB = 0;
    }
    const len = lenB ? tempo.sec(c.b + lenB) - p.t : 0;
    const chord = diff === 'hard' && c.fl.indexOf('^') >= 0;
    notes.push({ t: p.t, b: c.b, lane, len, lenB, m: c.m, chord });
    prevLanes = [lane];
    if (chord) {
      const other = lane >= 2 ? lane - 2 : lane + 2;
      notes.push({ t: p.t, b: c.b, lane: other, len, lenB, m: c.m - 5, chord: true });
      prevLanes.push(other);
    }
    prevT = p.t;
  });
  notes.sort((a, b) => (a.t - b.t) || (a.lane - b.lane));
  notes.forEach((n, i) => { n.id = i; });
  return notes;
}

/* =====================================================================================
   RULES CORE: judging, combo, points, health, Groove meter and Star Power, holds, grades.
   All times are chart seconds. A tap's delta in real milliseconds is

function newRun(chart, o) {
  const lanes = o.diff === 'easy' ? CONFIG.easyLanes : CONFIG.lanes;
  const notes = chart.map((c, i) => ({ t: c.t, lane: c.lane, len: c.len, lenB: c.lenB, m: c.m, chord: c.chord, i, res: J.NONE, delta: 0, hold: 0, got: 0 }));
  const byLane = []; for (let l = 0; l < lanes; l++) byLane.push(notes.filter(n => n.lane === l));
  return {
    notes, byLane, lanes, ptr: new Int32Array(lanes), holding: new Array(lanes).fill(null), lastHit: new Float64Array(lanes).fill(-1e9),
    diff: o.diff, practice: !!o.practice, rate: o.rate || 1, offsetMs: o.offsetMs || 0,
    canFail: o.diff !== 'easy' && !o.practice,
    win: o.diff === 'easy' ? CONFIG.easyWindowScale : 1,
    score: 0, holdScore: 0, combo: 0, maxCombo: 0, health: CONFIG.health.start, groove: 0,
    starOn: false, starUntil: -1, starUses: 0,
    counts: { perfect: 0, great: 0, good: 0, miss: 0 }, drops: 0, judged: 0, failed: false, emptyTaps: 0,
    missQueue: [],                                      // lanes that just missed (the renderer reads and clears it)

  };
}
const multOf = combo => 1 + CONFIG.comboSteps.filter(s => combo >= s).length;
const runMult = run => multOf(run.combo) * (run.starOn ? CONFIG.starMultiplier : 1);
const runScore = run => Math.floor(run.score + run.holdScore);
/** Song time with the calibration offset taken off (what the judge compares with note times). */
const adjT = (run, t) => t - run.offsetMs / 1000 * run.rate;
const deltaMs = (run, note, t) => (adjT(run, t) - note.t) / run.rate * 1000;

function judgeName(run, absMs) {
  const w = CONFIG.windows, k = run.win, e = EPS_MS;
  if (absMs <= w.perfect * k + e) return J.PERFECT;
  if (absMs <= w.great * k + e) return J.GREAT;
  if (absMs <= w.good * k + e) return J.GOOD;
  return J.MISS;
}
function applyHit(run, note, j, delta, t) {

    run.combo = 0;
    if (run.canFail || run.practice) run.health = Math.max(0, run.health - (run.diff === 'hard' ? H.missHard : H.miss));
    if (note.len > 0) note.hold = 3;
    if (run.canFail && run.health <= 0) run.failed = true;
    return 0;
  }
  run.combo++; if (run.combo > run.maxCombo) run.maxCombo = run.combo;
  const pts = CONFIG.points[name] * runMult(run);

  if (!run.starOn) run.groove = Math.min(100, run.groove + CONFIG.groove[name]);

/** A tap in `lane` at song time t. Returns the reused result object { kind, delta, note, points }. */
function judgeTap(run, lane, t) {

  let i = run.ptr[lane];

    break;

/** Finger or key lifted in `lane`: ends a hold (early = dropped). Returns 'done' | 'drop' | ''. */

/** Advance the rules to song time t: late notes become misses, holds earn points, Star Power ticks. */

const runDone = run => run.judged >= run.notes.length && run.holding.every(h => !h);
/** Final numbers for the results screen. */
function runResults(run) {
  const n = Math.max(1, run.notes.length), c = run.counts, W = CONFIG.accuracyWeight;
  const acc = Math.round(1000 * (c.perfect * W.perfect + c.great * W.great + c.good * W.good) / n) / 10;

    score: runScore(run), acc, grade, passed, stars: CONFIG.stars[grade] || 0,
    fullCombo: passed && c.miss === 0 && run.drops === 0 && run.judged === run.notes.length,
    allPerfect: passed && c.perfect === run.notes.length && run.drops === 0,
    maxCombo: run.maxCombo, counts: { perfect: c.perfect, great: c.great, good: c.good, miss: c.miss }, drops: run.drops

/* CORE-END */

/* =====================================================================================
   AUDIO: one AudioContext for everything. Chain:
     song bus / sfx bus -> pre gain -> compressor (keeps peaks under 1.0) -> analyser (visualizer)
       -> mute gain (follows BRB.sfx.muted) -> speakers
   Every voice is built from oscillators, filtered noise and envelopes.
   `ac` can be swapped for an OfflineAudioContext while rendering a test clip (see renderOffline).
   ===================================================================================== */
let ac = null;                 // the AudioContext (or, briefly, an OfflineAudioContext)
let A = null;                  // nodes and waves of the current context: { pre, sfx, master, analyser, waves }
let liveA = null, liveAc = null;
let noiseBuf = null;           // 2 s of white noise, shared by every context
const freqData = new Uint8Array(64);      // analyser output for the visualizer (reused every frame)
const AUDIO_LOG = [];                     // scheduled melody/kick times for the timing tests (off unless asked)
let audioLogOn = false;

function makeNoise(ctx) {
  const len = Math.floor(ctx.sampleRate * 2), b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);

const Sound = {
  muted: false,
  /** Create the context (on the first tap or key, as browsers require) and resume it. */
  unlock() {
    if (!liveAc) {

        liveA.master.gain.value = this.muted ? 0 : 1;
        ac = liveAc; A = liveA;
      } catch (e) { liveAc = null; return null; }
    }

    return liveAc;
  },
  ready() { return !!liveAc && liveAc.state === 'running'; },
  /** Follow the platform mute (BRB.sfx.muted) - called every frame, cheap. */
  syncMute() {
    const m = !!(window.BRB && BRB.sfx.muted);
    if (m === this.muted || !liveA) { this.muted = m; return; }
    this.muted = m;

  /** Fill freqData from the analyser (for the visualizer). */
  spectrum() { if (liveA && liveAc.state === 'running') liveA.analyser.getByteFrequencyData(freqData); else freqData.fill(0); }

/* ---------- small building blocks ---------- */
function oscAt(type, f, t) {
  const o = ac.createOscillator();
  if (typeof type === 'string') o.type = type; else o.setPeriodicWave(type);
  o.frequency.setValueAtTime(f, t);
  return o;
}
/** Attack-decay-sustain-release on a gain param. Returns the time the sound is silent. */
function adsr(g, t, dur, peak, a, d, s, r) {
  g.setValueAtTime(0.0001, t);
  g.linearRampToValueAtTime(peak, t + a);
  g.setTargetAtTime(peak * s, t + a, d / 3 + 0.001);
  const off = t + Math.max(dur, a + 0.01);
  g.setTargetAtTime(0.0001, off, r / 3 + 0.001);
  return off + r * 1.4 + 0.02;
}
/** Plucked/struck envelope: fast attack, exponential fall. */
function strike(g, t, peak, decay) {
  g.setValueAtTime(0.0001, t);
  g.linearRampToValueAtTime(peak, t + 0.004);
  g.exponentialRampToValueAtTime(0.0001, t + decay);
  return t + decay + 0.02;
}
function vibrato(o, t, rate, depth, delay) {
  const l = ac.createOscillator(), lg = ac.createGain();
  l.frequency.value = rate; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(depth, t + delay + 0.15);
  l.connect(lg); lg.connect(o.frequency); l.start(t); return l;
}
function noiseSrc(t) { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(t, Math.random() * 1.5); return s; }
function filt(type, f, q) { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q) b.Q.value = q; return b; }

/* ---------- melodic voices: fn(t, dur, freq, vol, out) ---------- */
const VOICES = {
  bell(t, dur, f, v, out) {
    const c = oscAt('sine', f, t), m = oscAt('sine', f * 4, t), mg = ac.createGain(), g = ac.createGain();
    mg.gain.setValueAtTime(f * 1.6, t); mg.gain.exponentialRampToValueAtTime(f * 0.05, t + 0.5);
    m.connect(mg); mg.connect(c.frequency); c.connect(g); g.connect(out);
    const end = strike(g.gain, t, 0.2 * v, Math.max(0.9, dur + 0.5));
    c.start(t); m.start(t); c.stop(end); m.stop(end);
  },
  pluck(t, dur, f, v, out) {
    const o = oscAt('triangle', f, t), o2 = oscAt('sine', f * 2, t), g = ac.createGain(), g2 = ac.createGain();
    g2.gain.value = 0.25; o.connect(g); o2.connect(g2); g2.connect(g); g.connect(out);
    const end = strike(g.gain, t, 0.24 * v, Math.min(1.2, Math.max(0.35, dur + 0.25)));
    o.start(t); o2.start(t); o.stop(end); o2.stop(end);
  },
  marimba(t, dur, f, v, out) {
    const o = oscAt('sine', f, t), o2 = oscAt('sine', f * 4, t), g = ac.createGain(), g2 = ac.createGain();
    o2.connect(g2); g2.connect(out); strike(g2.gain, t, 0.08 * v, 0.07);
    o.connect(g); g.connect(out);
    const end = strike(g.gain, t, 0.3 * v, 0.5);
    o.start(t); o2.start(t); o.stop(end); o2.stop(t + 0.1);
  },
  flute(t, dur, f, v, out) {
    const o = oscAt('sine', f, t), o2 = oscAt('triangle', f * 2, t), g = ac.createGain(), g2 = ac.createGain();
    g2.gain.value = 0.06; o2.connect(g2); g2.connect(g); o.connect(g); g.connect(out);
    const l = vibrato(o, t, 5.2, f * 0.006, 0.12);
    const end = adsr(g.gain, t, dur, 0.2 * v, 0.045, 0.1, 0.85, 0.09);
    o.start(t); o2.start(t); o.stop(end); o2.stop(end); l.stop(end);
  },
  clarinet(t, dur, f, v, out) {
    const o = oscAt(A.waves.clarinet, f, t), lp = filt('lowpass', 2400), g = ac.createGain();
    o.connect(lp); lp.connect(g); g.connect(out);
    const end = adsr(g.gain, t, dur, 0.15 * v, 0.03, 0.1, 0.8, 0.08);
    o.start(t); o.stop(end);
  },
  brass(t, dur, f, v, out) {
    const o = oscAt('sawtooth', f, t), lp = filt('lowpass', 500, 1.2), g = ac.createGain();
    lp.frequency.setValueAtTime(400, t); lp.frequency.linearRampToValueAtTime(Math.min(5200, f * 7), t + 0.06); lp.frequency.setTargetAtTime(Math.min(3200, f * 4), t + 0.06, 0.12);
    o.connect(lp); lp.connect(g); g.connect(out);
    const end = adsr(g.gain, t, dur, 0.14 * v, 0.03, 0.12, 0.75, 0.09);
    o.start(t); o.stop(end);
  },
  strings(t, dur, f, v, out) { VOICES.violin(t, dur, f, v * 0.9, out, 0.07); },
  violin(t, dur, f, v, out, att) {
    const o = oscAt('sawtooth', f * 1.0035, t), o2 = oscAt('sawtooth', f * 0.9965, t), lp = filt('lowpass', Math.min(4200, f * 6)), g = ac.createGain();
    o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(out);
    const l1 = vibrato(o, t, 5.6, f * 0.005, 0.1), l2 = vibrato(o2, t, 5.6, f * 0.005, 0.1);
    const end = adsr(g.gain, t, dur, 0.085 * v, att || 0.03, 0.1, 0.85, 0.12);
    o.start(t); o2.start(t); o.stop(end); o2.stop(end); l1.stop(end); l2.stop(end);
  },
  organ(t, dur, f, v, out) {
    const o = oscAt(A.waves.organ, f, t), g = ac.createGain();
    o.connect(g); g.connect(out);
    const end = adsr(g.gain, t, dur, 0.1 * v, 0.012, 0.05, 0.9, 0.06);
    o.start(t); o.stop(end);
  },
  chip(t, dur, f, v, out) {
    const o = oscAt(A.waves.chip, f, t), g = ac.createGain();
    o.connect(g); g.connect(out);
    const end = adsr(g.gain, t, dur, 0.09 * v, 0.003, 0.08, 0.7, 0.03);
    o.start(t); o.stop(end);
  },
  synth(t, dur, f, v, out) {
    const o = oscAt('square', f, t), lp = filt('lowpass', 600, 7), g = ac.createGain();
    lp.frequency.setValueAtTime(300, t); lp.frequency.linearRampToValueAtTime(Math.min(4500, f * 8), t + 0.02); lp.frequency.setTargetAtTime(Math.min(2200, f * 3), t + 0.02, 0.08);
    o.connect(lp); lp.connect(g); g.connect(out);
    const end = adsr(g.gain, t, dur, 0.1 * v, 0.004, 0.1, 0.7, 0.05);
    o.start(t); o.stop(end);
  },
  keys(t, dur, f, v, out) {
    const c = oscAt('sine', f, t), m = oscAt('sine', f, t), mg = ac.createGain(), g = ac.createGain();
    mg.gain.setValueAtTime(f * 1.2, t); mg.gain.exponentialRampToValueAtTime(f * 0.02, t + 0.6);
    m.connect(mg); mg.connect(c.frequency); c.connect(g); g.connect(out);
    const end = strike(g.gain, t, 0.22 * v, Math.max(0.8, Math.min(2, dur + 0.6)));
    c.start(t); m.start(t); c.stop(end); m.stop(end);
  },
  rhodes(t, dur, f, v, out) { VOICES.keys(t, dur, f, v * 0.5, out); },
  bassoon(t, dur, f, v, out) {
    const o = oscAt(A.waves.bassoon, f, t), lp = filt('lowpass', 1500), g = ac.createGain();
    o.connect(lp); lp.connect(g); g.connect(out);
    const end = adsr(g.gain, t, dur, 0.16 * v, 0.025, 0.08, 0.7, 0.06);
    o.start(t); o.stop(end);
  },
  pad(t, dur, f, v, out) {
    const o = oscAt('triangle', f * 1.004, t), o2 = oscAt('triangle', f * 0.996, t), lp = filt('lowpass', 1800), g = ac.createGain();
    o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(out);
    const end = adsr(g.gain, t, dur, 0.07 * v, Math.min(0.3, dur * 0.4), 0.3, 0.8, 0.35);
    o.start(t); o2.start(t); o.stop(end); o2.stop(end);
  },
  pizz(t, dur, f, v, out) {
    const o = oscAt('triangle', f, t), g = ac.createGain();
    o.connect(g); g.connect(out);
    const end = strike(g.gain, t, 0.22 * v, 0.28);
    o.start(t); o.stop(end);
  },
  // ---- bass voices ----
  round(t, dur, f, v, out) {
    const o = oscAt('sine', f, t), o2 = oscAt('triangle', f, t), g = ac.createGain(), g2 = ac.createGain();
    g2.gain.value = 0.35; o2.connect(g2); g2.connect(g); o.connect(g); g.connect(out);
    const end = adsr(g.gain, t, dur, 0.32 * v, 0.01, 0.15, 0.75, 0.06);
    o.start(t); o2.start(t); o.stop(end); o2.stop(end);
  },
  bassPluck(t, dur, f, v, out) {
    const o = oscAt('sawtooth', f, t), lp = filt('lowpass', 1200, 2), g = ac.createGain();
    lp.frequency.setValueAtTime(1400, t); lp.frequency.setTargetAtTime(260, t, 0.08);
    o.connect(lp); lp.connect(g); g.connect(out);
    const end = adsr(g.gain, t, dur, 0.2 * v, 0.005, 0.12, 0.6, 0.05);
    o.start(t); o.stop(end);
  },
  funk(t, dur, f, v, out) {
    const o = oscAt('square', f, t), s = oscAt('sine', f, t), lp = filt('lowpass', 900, 5), g = ac.createGain(), sg = ac.createGain();
    lp.frequency.setValueAtTime(1600, t); lp.frequency.setTargetAtTime(380, t, 0.06);
    o.connect(lp); lp.connect(g); s.connect(sg); sg.gain.value = 1.2; sg.connect(g); g.connect(out);
    const end = adsr(g.gain, t, dur, 0.13 * v, 0.004, 0.1, 0.6, 0.04);
    o.start(t); s.start(t); o.stop(end); s.stop(end);
  },
  stick(t, dur, f, v, out) {
    const o = oscAt('sine', 1900, t), g = ac.createGain();
    o.frequency.exponentialRampToValueAtTime(1200, t + 0.03);
    o.connect(g); g.connect(out);
    const end = strike(g.gain, t, 0.3 * v, 0.06);
    o.start(t); o.stop(end);
  }
};
const BASS_VOICE = { round: 'round', pluck: 'bassPluck', funk: 'funk', pizz: 'pizz' };

/* ---------- drums: fn(t, vol, kit, out) ---------- */
const DRUM_VOICES = {
  k(t, v, kit, out) {
    const electro = kit === 'electro', soft = kit === 'soft' || kit === 'lofi';
    const o = oscAt('sine', electro ? 125 : 150, t), g = ac.createGain();
    o.frequency.exponentialRampToValueAtTime(42, t + (electro ? 0.22 : 0.12));
    o.connect(g); g.connect(out);
    const end = strike(g.gain, t, (soft ? 0.55 : 0.75) * v, electro ? 0.45 : 0.32);
    o.start(t); o.stop(end);
    const n = noiseSrc(t), hp = filt('highpass', 2500), ng = ac.createGain();
    n.connect(hp); hp.connect(ng); ng.connect(out); strike(ng.gain, t, 0.05 * v, 0.012); n.stop(t + 0.03);
  },
  s(t, v, kit, out) {
    const n = noiseSrc(t), bp = filt(kit === 'lofi' ? 'lowpass' : 'bandpass', kit === 'lofi' ? 2600 : 1900, 0.7), g = ac.createGain();
    n.connect(bp); bp.connect(g); g.connect(out);
    const end = strike(g.gain, t, (kit === 'soft' ? 0.22 : 0.34) * v, kit === 'electro' ? 0.2 : 0.16); n.stop(end);
    const o = oscAt('triangle', 195, t), og = ac.createGain();
    o.frequency.exponentialRampToValueAtTime(150, t + 0.07); o.connect(og); og.connect(out);
    o.start(t); o.stop(strike(og.gain, t, 0.2 * v, 0.09));
  },
  h(t, v, kit, out) {
    const n = noiseSrc(t), hp = filt('highpass', 7200), g = ac.createGain();
    n.connect(hp); hp.connect(g); g.connect(out);
    n.stop(strike(g.gain, t, (kit === 'lofi' ? 0.05 : 0.075) * v, 0.045));
  },
  o(t, v, kit, out) {
    const n = noiseSrc(t), hp = filt('highpass', 6500), g = ac.createGain();
    n.connect(hp); hp.connect(g); g.connect(out);
    n.stop(strike(g.gain, t, 0.07 * v, 0.25));
  },
  c(t, v, kit, out) {
    const n = noiseSrc(t), bp = filt('bandpass', 1250, 1.1), g = ac.createGain();
    n.connect(bp); bp.connect(g); g.connect(out);
    g.gain.setValueAtTime(0.0001, t);
    for (let i = 0; i < 3; i++) { g.gain.linearRampToValueAtTime(0.3 * v, t + i * 0.011 + 0.002); g.gain.linearRampToValueAtTime(0.06 * v, t + i * 0.011 + 0.01); }
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16); n.stop(t + 0.18);
  },
  t(t, v, kit, out) {
    const o = oscAt('sine', 98, t), g = ac.createGain();
    o.frequency.exponentialRampToValueAtTime(80, t + 0.4);
    o.connect(g); g.connect(out); o.start(t); o.stop(strike(g.gain, t, 0.55 * v, 0.6));
    const n = noiseSrc(t), lp = filt('lowpass', 900), ng = ac.createGain();
    n.connect(lp); lp.connect(ng); ng.connect(out); n.stop(strike(ng.gain, t, 0.08 * v, 0.18));
  },
  w(t, v, kit, out) {
    const o = oscAt('sine', 1300, t), g = ac.createGain();
    o.frequency.exponentialRampToValueAtTime(1100, t + 0.05);
    o.connect(g); g.connect(out); o.start(t); o.stop(strike(g.gain, t, 0.22 * v, 0.07));
  },
  r(t, v, kit, out) {
    const o = oscAt('triangle', 1650, t), g = ac.createGain();
    o.connect(g); g.connect(out); o.start(t); o.stop(strike(g.gain, t, 0.14 * v, 0.035));
    const n = noiseSrc(t), bp = filt('bandpass', 3200, 1.5), ng = ac.createGain();
    n.connect(bp); bp.connect(ng); ng.connect(out); n.stop(strike(ng.gain, t, 0.12 * v, 0.04));
  },
  y(t, v, kit, out) {
    const n = noiseSrc(t), hp = filt('highpass', 4200), g = ac.createGain();
    n.connect(hp); hp.connect(g); g.connect(out);
    n.stop(strike(g.gain, t, 0.15 * v, 1.5));
  }
};

/** Play one arrangement event at context time `at` (durations scaled by 1/rate). */
function playEvent(e, at, rate, out) {
  const dur = e.d / rate;
  if (e.kind === 'drum') { const f = DRUM_VOICES[e.drum]; if (f) f(at, e.v, e.inst, out); return; }
  if (e.kind === 'vinyl') { vinylBed(at, dur, out); return; }
  const vol = e.v * (e.kind === 'layer' ? 0.85 : e.kind === 'comp' ? 0.75 : 1);
  const fn = VOICES[e.kind === 'bass' ? (BASS_VOICE[e.inst] || 'round') : e.inst] || VOICES.pluck;
  fn(at, dur, e.kind === 'stick' ? 1 : midiHz(e.m), vol, out);
}
/** Lo-fi vinyl crackle: soft hiss with sparse pops, for the whole song. */
function vinylBed(t, dur, out) {
  const n = noiseSrc(t), bp = filt('bandpass', 3500, 0.5), g = ac.createGain();
  g.gain.value = 0.012; n.connect(bp); bp.connect(g); g.connect(out); n.stop(t + dur);
  for (let x = 0.3; x < dur; x += 0.35 + Math.random() * 0.9) {
    const p = noiseSrc(t + x), hp = filt('highpass', 2000), pg = ac.createGain();
    p.connect(hp); hp.connect(pg); pg.connect(out); p.stop(strike(pg.gain, t + x, 0.03 + Math.random() * 0.03, 0.01));
  }
}

/* ---------- sound effects that react to play (through the sfx bus, never cut by pause) ---------- */
const Sfx = {
  ok() { if (!(liveAc && liveAc.state === 'running' && !Sound.muted)) return false; ac = liveAc; A = liveA; return true; },
  /** The lead "hit" sound: a bright little pluck at the note's pitch. */
  hit(midi, kind) {
    if (!this.ok()) return;
    const t = liveAc.currentTime + 0.002, f = midiHz(Math.max(60, Math.min(96, midi + 12)));
    const o = oscAt('triangle', f, t), g = liveAc.createGain();
    o.connect(g); g.connect(liveA.sfx); o.start(t); o.stop(strike(g.gain, t, kind === 'perfect' ? 0.13 : 0.1, 0.16));
    if (kind === 'perfect') { const s = oscAt('sine', f * 2, t), sg = liveAc.createGain(); s.connect(sg); sg.connect(liveA.sfx); s.start(t); s.stop(strike(sg.gain, t, 0.05, 0.12)); }
  },
  /** A soft low "bump" for a miss - gentle, never harsh. */
  miss() {
    if (!this.ok()) return;
    const t = liveAc.currentTime + 0.002, o = oscAt('sine', 150, t), g = liveAc.createGain();
    o.frequency.exponentialRampToValueAtTime(85, t + 0.12); o.connect(g); g.connect(liveA.sfx); o.start(t); o.stop(strike(g.gain, t, 0.07, 0.14));
  },
  /** Star Power: a rising shimmer. */
  star() {
    if (!this.ok()) return;
    const t = liveAc.currentTime + 0.01;
    [0, 4, 7, 12, 16].forEach((s, i) => { const o = oscAt('triangle', midiHz(72 + s), t + i * 0.06), g = liveAc.createGain(); o.connect(g); g.connect(liveA.sfx); o.start(t + i * 0.06); o.stop(strike(g.gain, t + i * 0.06, 0.08, 0.5)); });
  },
  /** Crowd cheer: swelling filtered noise plus scattered claps and a few "whoo"s. */
  cheer(big) {
    if (!this.ok()) return;
    const t = liveAc.currentTime + 0.01, n = noiseSrc(t), bp = filt('bandpass', 900, 0.6), bp2 = filt('bandpass', 2100, 0.8), g = liveAc.createGain();
    n.connect(bp); n.connect(bp2); bp.connect(g); bp2.connect(g); g.connect(liveA.sfx);
    const v = big ? 0.14 : 0.1;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.35); g.gain.setTargetAtTime(v * 0.7, t + 0.35, 0.3); g.gain.setTargetAtTime(0.0001, t + 1.1, 0.35);
    n.stop(t + 2.6);
    for (let i = 0; i < (big ? 22 : 12); i++) {
      const ct = t + 0.05 + Math.random() * 1.4, c = noiseSrc(ct), cb = filt('bandpass', 1100 + Math.random() * 900, 1.2), cg = liveAc.createGain();
      c.connect(cb); cb.connect(cg); cg.connect(liveA.sfx); c.stop(strike(cg.gain, ct, 0.05 + Math.random() * 0.05, 0.05));
    }
    for (let i = 0; i < 3; i++) {
      const wt = t + 0.1 + i * 0.25, o = oscAt('sine', 520 + i * 90, wt), og = liveAc.createGain();
      o.frequency.linearRampToValueAtTime(900 + i * 80, wt + 0.4); o.connect(og); og.connect(liveA.sfx); o.start(wt); o.stop(adsr(og.gain, wt, 0.35, 0.012, 0.1, 0.1, 0.8, 0.2));
    }
  },
  /** Calibration metronome click at context time t. */
  click(t, accent) { if (!liveAc) return; ac = liveAc; A = liveA; VOICES.stick(t, 0.05, 1, accent ? 1 : 0.75, liveA.sfx); },
  /** Gentle "let's try again" phrase (no harsh fail sound). */
  softEnd() {
    if (!this.ok()) return;
    const t = liveAc.currentTime + 0.05;
    [67, 64, 65, 60].forEach((m, i) => VOICES.bell(t + i * 0.22, 0.3, midiHz(m), 0.8, liveA.sfx));
  },
  /** A happy little fanfare for a cleared song. */
  win() {
    if (!this.ok()) return;
    const t = liveAc.currentTime + 0.05;
    [60, 64, 67, 72, 76, 79, 84].forEach((m, i) => VOICES.bell(t + i * 0.07, 0.25, midiHz(m), 0.7, liveA.sfx));
  }
};

/* =====================================================================================
   THE MASTER CLOCK. Maps performance.now() milliseconds (the clock input events are stamped with)
   to the AudioContext time that is coming out of the speaker at that moment:
     heard(perfMs) = perfMs / 1000 + est
   est comes from AudioContext.getOutputTimestamp() where the browser supports it, otherwise from
   currentTime minus the reported output latency. currentTime moves in steps (one per audio
   callback), so est keeps the largest offset seen and creeps down very slowly to follow drift.
   ===================================================================================== */
const Clock = {
  est: NaN, mode: '', samples: 0, win: new Float64Array(32), wn: 0,
  latency() { return liveAc ? (liveAc.outputLatency || 0) + (liveAc.baseLatency || 0) : 0; },
  sample(now) {
    if (!liveAc || liveAc.state !== 'running') return;
    let raw = NaN;
    if (this.mode !== 'ct' && liveAc.getOutputTimestamp) {
      const ts = liveAc.getOutputTimestamp();
      if (ts.contextTime > 0 && ts.performanceTime > 0) { raw = ts.contextTime - ts.performanceTime / 1000; if (!this.mode && liveAc.currentTime > 0.3) this.mode = 'ts'; }
      else if (this.mode === 'ts') return;
    }

/* ---------- input: multi-touch pointers + keys ---------- */
const pointers = new Map();           // pointerId -> lane
const KEY_LANES4 = { d: 0, f: 1, j: 2, k: 3, arrowleft: 0, arrowdown: 1, arrowup: 2, arrowright: 3, '1': 0, '2': 1, '3': 2, '4': 3 };
const KEY_LANES3 = { d: 0, f: 1, j: 1, k: 2, arrowleft: 0, arrowdown: 1, arrowup: 1, arrowright: 2, '1': 0, '2': 1, '3': 2, '4': 2 };

function pressLane(lane, stamp, via) {

  const tt = songTimeAt(stamp), r = judgeTap(G.run, lane, tt);

  return r;
}

}
function logJudge(lane, r, via, tt) {

}
function feedback(lane, r) {

  const cols = V.lanes === 3 ? LANE_COLORS3 : LANE_COLORS, x = V.cx - V.hw + (lane + 0.5) * V.laneW;
  const k = r.kind === 'perfect' ? 1 : r.kind === 'great' ? 2 : r.kind === 'good' ? 3 : 4;
  showJudge(k, k === 1 ? 0 : r.delta < 0 ? -1 : 1);
  if (k < 4 && r.note.len > 0) JUDGE.side = 2;     // a hold started: say "Hold!" under the word
  if (k === 4) { missSfx(); return; }
  Sfx.hit(r.note.m, r.kind);

    BANNER.text = t('comboN', { n: c }); BANNER.age = 0;
    for (let i = 0; i < 2; i++) spark(i ? V.w - 30 : 30, V.h - 30, LANE_COLORS[(c / 25 + i) % 4], 24, 1.5);
    if (!REDUCED) Oomba.juice.pop($('scoreEl'));

}

  laneXY(l) { const c = laneCenter(l); return { x: c.x, y: c.y, laneW: V.laneW, hitY: V.hitY, padH: V.padH, lanes: V.lanes }; },
  judgeLog() { return G.judgeLog.slice(); },
  audioLog(on) { if (on === true) { AUDIO_LOG.length = 0; audioLogOn = true; } else if (on === false) audioLogOn = false; return AUDIO_LOG.slice(); },
  renderAudio(song, from, dur, kinds, probes) { return renderOffline(song, from, dur, kinds, probes); },
  frameStats() {
    const n = Math.min(G.frameN, G.frames.length), a = Array.from(G.frames.slice(0, n)).sort((x, y) => x - y);
    return { median: a[Math.floor(n / 2)] || 0, p95: a[Math.floor(n * 0.95)] || 0, p99: a[Math.floor(n * 0.99)] || 0, worst: a[n - 1] || 0, frames: n, over20: a.filter(x => x > 20).length, over34: a.filter(x => x > 34).length };
  },
  resetFrames() { G.frameN = 0; G.lastFrame = 0; },
  pause(on) { setPaused(on !== false); return hookState(); },
  show(name) {
    if (name === 'songs') openSongs(); else if (name === 'settings') openSettings(); else if (name === 'diff') openDiff(G.song);
    else if (name === 'calib') { show('calib'); Calib.start(); } else show(name);
    return hookState();
  },
  activateStar() { if (G.run) { G.run.groove = 100; useStar(); } return hookState(); },
  setGroove(n) { if (G.run) G.run.groove = Math.max(0, Math.min(100, +n)); return hookState(); },
  setBest(id, diff, score, grade) { if (!save.best[id]) save.best[id] = {}; save.best[id][diff] = { s: score, g: grade, a: 90, fc: false, ap: false }; persist(); return totalStars(); },
  /** Records onsets of the real mixed output (ScriptProcessor playbackTime), for timing tests. */
  tapOutput(on, size) {
    if (on === false) { if (OUT.sp) { OUT.sp.disconnect(); OUT.sp = null; } return OUT.onsets.slice(); }
    if (!Sound.unlock() || OUT.sp) return [];
    OUT.onsets.length = 0; OUT.quiet = 0;
    const sp = liveAc.createScriptProcessor(size || 512, 1, 1), z = liveAc.createGain(); z.gain.value = 0;
    sp.onaudioprocess = e => {
      const d = e.inputBuffer.getChannelData(0), sr = liveAc.sampleRate;
      for (let i = 0; i < d.length; i++) {
        const x = Math.abs(d[i]);
        if (x > 0.02) { if (OUT.quiet > sr * 0.08 && OUT.onsets.length < 400) OUT.onsets.push(e.playbackTime + i / sr); OUT.quiet = 0; } else OUT.quiet++;
      }
    };
    liveA.post.connect(sp); sp.connect(z); z.connect(liveAc.destination); OUT.sp = sp;
    return [];
  },
  ctxOfChart(c) { return Player.ctxOf(c); },
  calibClicks() { return { clicks: Calib.clicks.slice(), taps: Calib.taps.slice(), on: Calib.on, offset: save.offset }; },
  get config() { return CONFIG; }
});
</script>
