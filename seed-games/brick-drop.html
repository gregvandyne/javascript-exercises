<title>Brick Drop</title>
<style>
/* Brick Drop on the Oomba Kit: the classic falling-blocks puzzle with candy bricks.
   The kit draws the candy world behind the game (day, or night in the dark theme), the title lockup, the player's own
   character (their Me-page avatar, cheering on the title and the results card), the pause screen, the icons, buttons
   and the type. This file lays out the game's own pieces in the kit's sticker look (Cream cards, Ink edges):
   Layout (portrait): HUD row (pause / score chips / sound), then Hold | well | Next, then the touch pad.
   Short landscape: the well sits in the middle, HUD + Hold + the left-hand buttons on the left,
   Next + the right-hand buttons on the right. Desktop (mouse): no touch pad, a keys card instead.
   The well is one canvas drawn by script; Hold and Next are two small canvases redrawn only when they change.
   Colours come from the kit (set as --bd-* variables at start) and the brick colours from CONFIG; no fonts here. */
.bd{position:absolute;inset:0;--cell:24px;--side:58px;--pad:8px;--gap:6px}
.bd,.bd-tcard{--rim:var(--bd-ink);--soft:color-mix(in srgb,var(--ok-text) 66%,transparent)}
.ok-night .bd,.ok-night .bd-tcard{--rim:color-mix(in srgb,var(--bd-cream) 38%,transparent)}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.bd button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bd svg{display:block}

/* ---------- Game layout ---------- */
.app{position:relative;height:100%;box-sizing:border-box;display:grid;gap:var(--gap);justify-content:center;align-content:center;
  padding:max(var(--pad),env(safe-area-inset-top)) max(var(--pad),env(safe-area-inset-right)) max(var(--pad),env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-left));
  grid-template-columns:var(--side) auto var(--side);
  grid-template-rows:auto auto auto;
  grid-template-areas:"hud hud hud" "hold well next" "pad pad pad"}
.app.offstage{visibility:hidden}
.hud{grid-area:hud;display:flex;align-items:center;gap:8px;min-width:0}
.hud .ok-btn.ok-icon{width:46px;min-height:46px;flex:none}
.stats{flex:1;min-width:0;display:flex;gap:6px;justify-content:center}
.stat{flex:1;min-width:0;max-width:124px;box-sizing:border-box;background:var(--ok-card);color:var(--ok-text);border:2.5px solid var(--rim);border-radius:16px;
  padding:2px 6px 4px;text-align:center;box-shadow:0 3px 0 var(--bd-ink);line-height:1.1}
.stat .lab{display:block;font-size:.72rem;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.stat b{display:block;font-size:1.2rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.holdSide{grid-area:hold}
.nextSide{grid-area:next}
.box{background:var(--ok-card);color:var(--ok-text);border:2.5px solid var(--rim);border-radius:16px;padding:4px 4px 6px;box-shadow:0 3px 0 var(--bd-ink);
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:opacity .2s}
.box.used canvas{opacity:.5}
.boxLab{display:block;max-width:100%;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);white-space:nowrap;overflow:hidden;text-align:center}
.box canvas{display:block}
.app.wide .keys{display:block}
.keys{display:none;background:var(--ok-card);color:var(--ok-text);border:2.5px solid var(--rim);border-radius:16px;padding:8px 10px;font-size:.88rem;font-weight:600;line-height:1.7;box-shadow:0 3px 0 var(--bd-ink)}
.keys b{display:inline-block;min-width:1.6em;padding:0 5px;margin-right:4px;border-radius:7px;background:var(--ok-bg2);border:2px solid var(--rim);box-shadow:0 2px 0 var(--bd-ink);text-align:center;font-size:.8rem;line-height:1.35;font-weight:800}
/* the well: a candy-pink frame (Ink edge, Cream rim) around a deep grape night */
.wellWrap{grid-area:well;position:relative;align-self:start;justify-self:center;border-radius:16px;padding:5px;box-sizing:border-box;
  background:linear-gradient(180deg,var(--bd-pinkLight),var(--bd-pink));border:3px solid var(--bd-ink);box-shadow:inset 0 0 0 2px var(--bd-cream),0 6px 0 var(--bd-ink);transition:box-shadow .5s}
.wellWrap.danger{box-shadow:inset 0 0 0 2px var(--bd-cream),0 6px 0 var(--bd-ink),0 0 0 5px var(--bd-coral)}
.wellWrap::after{content:"";position:absolute;inset:5px;border-radius:10px;border:2.5px solid var(--bd-ink);pointer-events:none}
canvas#well{display:block;border-radius:10px;touch-action:none;background:var(--bd-well)}
/* banners: kit sticker words (Cream face, Ink edge) */
.banner{position:absolute;left:4px;right:4px;top:34%;pointer-events:none;text-align:center;font-weight:800;color:var(--bd-cream);line-height:1.15;white-space:nowrap;overflow:hidden;padding:8px 0;
  font-size:calc(var(--cell)*1.25);-webkit-text-stroke:calc(var(--cell)*.2) var(--bd-ink);paint-order:stroke fill;text-shadow:0 calc(var(--cell)*.14) 0 var(--bd-ink);opacity:0}
.banner.blast{color:var(--bd-spark)}
.banner.sub{top:56%;font-size:calc(var(--cell)*.8);color:var(--bd-skyLight);-webkit-text-stroke:calc(var(--cell)*.14) var(--bd-ink)}
.banner.show{animation:bannerPop 1.2s ease-out forwards}
@keyframes bannerPop{0%{opacity:0;transform:scale(.4) rotate(-4deg)}14%{opacity:1;transform:scale(1.18) rotate(-2deg)}26%{transform:scale(.96) rotate(0)}36%{transform:scale(1)}78%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-14px)}}
/* the touch pad: kit sticker buttons (Cream, Spark for Drop, Sky for Turn) */
.pad{grid-area:pad;display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:560px;justify-self:center}
.padL,.padR{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:52px 56px;gap:9px}
.pbtn{border:3px solid var(--bd-ink);border-radius:18px;background:var(--bd-cream);color:var(--bd-ink);font-weight:800;font-size:1.08rem;min-width:0;padding:0 4px;box-shadow:0 5px 0 var(--bd-ink);
  display:flex;align-items:center;justify-content:center;gap:6px;touch-action:none;-webkit-tap-highlight-color:transparent}
.pbtn svg{width:28px;height:28px;flex:none;pointer-events:none;stroke-width:2.6}
.pbtn span{pointer-events:none;display:block;min-width:0;white-space:nowrap;overflow:hidden}
.pbtn.wide{grid-column:span 2}
.pbtn.go{background:var(--bd-spark)}
.pbtn.turn{background:var(--bd-sky)}
.pbtn.down{transform:translateY(4px);box-shadow:0 1px 0 var(--bd-ink)}
.pbtn.off{opacity:.45}
/* tall phones: one side column (Hold over Next) on the right, so the well can be wider and use the height */
.app.oneSide{grid-template-columns:auto var(--side);grid-template-rows:auto auto auto;grid-template-areas:"hud hud" "well hold" "pad pad"}
.app.oneSide .nextSide{display:none}
/* left-handed (the kit's setting): Drop, Hold and Turn on the left */
.app.lefty .padL{order:2}.app.lefty .padR{order:1}

/* Desktop with a mouse: keys instead of the touch pad. */
@media (hover:hover) and (pointer:fine){
  .pad{display:none}
  .keys{display:block}
  .app{grid-template-areas:"hud hud hud" "hold well next";grid-template-rows:auto auto}
}

/* Short landscape phones: everything around the well. */
@media (orientation:landscape) and (max-height:560px){
  .app{grid-template-columns:var(--side) auto var(--side);grid-template-rows:auto auto minmax(0,1fr) auto;
    grid-template-areas:"hud well next" "hold well next" ". well next" "padL well padR";column-gap:14px;row-gap:8px;align-content:stretch}
  .hud{flex-wrap:wrap;justify-content:space-between;align-self:start}
  .stats{order:3;flex-basis:100%}
  .holdSide{flex-direction:row;align-items:flex-start}
  .holdSide .box{flex:none}
  .nextSide{align-items:flex-end}
  .pad{display:contents}
  .padL{grid-area:padL;align-self:end}
  .padR{grid-area:padR;align-self:end}
  .app.lefty .padL{grid-area:padR}.app.lefty .padR{grid-area:padL}
  .padL,.padR{grid-template-rows:50px 54px}
  .wellWrap{align-self:center}
}
@media (orientation:landscape) and (max-height:560px) and (hover:hover) and (pointer:fine){
  .app{grid-template-areas:"hud well next" "hold well next" ". well next" ". well ."}
}

/* ---------- Title (the kit's title screen; the game's card: tagline, the three modes, Play) ---------- */
.ok-ui .ok-title-screen .ok-title-block{max-height:none}
.bd-tcard{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(460px,calc(100vw - 32px));box-sizing:border-box;background:var(--ok-card);color:var(--ok-text);
  border:3px solid var(--bd-ink);border-radius:26px;box-shadow:0 6px 0 var(--bd-ink);padding:12px 12px 14px}
.ok-night .bd-tcard{border-color:color-mix(in srgb,var(--bd-cream) 34%,transparent);box-shadow:0 6px 0 black}
.ok-ui .ok-title-screen .bd-tcard .ok-p{border:0;box-shadow:none;background:none;padding:0 6px;font-size:clamp(1rem,2.4vmin,1.2rem)}
.ok-title-screen .bd-tcard .ok-big{margin-top:2px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.mode{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;min-height:56px;box-sizing:border-box;border:2.5px solid var(--ok-line);background:var(--ok-bg2);color:var(--ok-text);
  border-radius:18px;padding:8px 5px 7px;text-align:center;font:inherit;line-height:1.15}
.mode[aria-pressed="true"]{background:var(--bd-pinkTint);color:var(--bd-ink);border-color:var(--bd-ink);box-shadow:0 4px 0 var(--bd-ink)}
.mode .mi{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--bd-cream);border:2px solid var(--bd-ink);color:var(--bd-ink)}
.mode[aria-pressed="true"] .mi{background:var(--bd-pink)}
.mode .mi svg{width:20px;height:20px}
.mode .mt{min-width:0;max-width:100%;display:flex;flex-direction:column;line-height:1.15}
.mode .mt b{font-size:1.06rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode .mt small{font-size:.78rem;font-weight:600;opacity:.8;text-wrap:balance}
.mode .mb{max-width:100%;font-weight:800;font-size:.78rem;line-height:1.15;background:var(--bd-sparkTint);color:var(--bd-ink);border:2px solid var(--bd-ink);border-radius:999px;padding:2px 8px;margin-top:3px;
  text-wrap:balance;box-sizing:border-box}
.hint{margin:0;font-size:.9rem;font-weight:600;color:var(--soft);display:flex;align-items:center;gap:6px;justify-content:center;text-align:center}
.hint canvas{flex:none}
.kbhint{display:none}
@media (hover:hover) and (pointer:fine){.kbhint{display:flex}}

/* ---------- Pause (the kit's pause screen, with the game's note and Zen's Finish) ---------- */
.ok-pause .bd-note{margin:-4px 0 0;font-weight:600;line-height:1.35;max-width:32ch;text-wrap:balance}
.ok-pause .bd-phone{margin:0;font-size:.88rem;font-weight:600;line-height:1.35;opacity:.8;max-width:34ch;text-wrap:balance}

/* a calmer world behind the pause and results cards: more blur, less colour */
.ok-ui .ok-pause.ok-scrim,#resultsScreen.ok-scrim{-webkit-backdrop-filter:saturate(.4) blur(7px);backdrop-filter:saturate(.4) blur(7px)}

/* ---------- Results (a kit card: the player's character, the numbers, Play again / Menu) ---------- */
.bd .ok-card{width:min(440px,100%);padding:18px 16px 16px;gap:9px}
.bd .ok-card .ok-portrait{margin:-4px 0 -6px}
.bd .ok-card p{margin:0;font-size:1.05rem;font-weight:600;line-height:1.3;text-wrap:balance}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:800;background:var(--bd-sparkTint);color:var(--bd-ink);border:2px solid var(--bd-ink);border-radius:999px;padding:4px 12px;font-size:.98rem}
.chip svg{width:1.15em;height:1.15em;flex:none}
.chip.best{background:var(--bd-spark);transform:rotate(-3deg);animation:wob 1.4s ease-in-out 2}
@keyframes wob{0%,100%{transform:rotate(-3deg)}25%{transform:rotate(-6deg) scale(1.06)}75%{transform:rotate(0) scale(1.06)}}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.statGrid div{background:var(--ok-bg2);border:2px solid var(--ok-line);border-radius:16px;padding:5px 8px}
.statGrid span{display:block;font-size:.78rem;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.04em;overflow-wrap:anywhere}
.statGrid b{font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;margin-top:2px}
.btns .ok-btn{flex:1 1 auto}
/* Arabic letters must stay joined: no letter spacing. Japanese: break lines between phrases. */
html[lang="ar"] .bd *{letter-spacing:0!important}
html[lang="ja"] .bd p{word-break:auto-phrase}
@media (orientation:landscape) and (max-height:560px){
  .ok-ui .ok-title-screen{padding-top:8px}
  .ok-ui .ok-title-screen .ok-h1{font-size:clamp(2rem,10vmin,2.6rem);margin:0}
  .ok-ui .ok-title-screen .ok-title-word{display:inline-block}
  .ok-ui .ok-title-screen .ok-title-block{gap:6px;padding-top:0}
  .ok-ui .ok-title-badge{display:none}
  .ok-ui .ok-title-screen .bd-tcard .ok-p{font-size:.95rem}
  .bd-tcard{width:min(560px,calc(100vw - 32px));padding:8px 12px 10px;gap:6px}
  .bd-tcard{width:min(640px,calc(100vw - 220px))}
  .mode .mt small{font-size:.72rem;line-height:1.1}
  .ok-pause .bd-phone{display:none}
  .ok-title-screen .bd-tcard .ok-big{min-height:54px;margin-top:0}
  .mode{min-height:0;padding:5px}
  .mode .mi{width:24px;height:24px}.mode .mi svg{width:16px;height:16px}
  .bd .ok-card{width:min(680px,100%);padding:12px 16px 14px;gap:6px}
  .bd .ok-card .ok-portrait{display:none}
  .statGrid{grid-template-columns:repeat(4,1fr)}
}
/* phone title: the modes as three rows (icon, name and what it is, best) so nothing wraps into a tall tile; the lockup
   clears the sound and settings buttons; no brand badge in the corner */
@media (orientation:portrait) and (max-width:520px){
  .ok-ui .ok-title-screen .ok-brand{display:none}
  .ok-ui .ok-title-screen .ok-title-block{margin-top:30px}
  .ok-ui .ok-title-screen .ok-title-badge canvas{width:150px;height:auto}
  .modes{grid-template-columns:1fr;gap:6px}
  .bd-tcard{padding:12px 10px 14px}
  .mode{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;column-gap:8px;text-align:start;min-height:0;padding:6px 8px}
  .mode .mt{align-items:flex-start}
  .mode .mt small{text-wrap:wrap;font-size:.74rem}
  .mode .mb{margin-top:0;white-space:nowrap}
}
@media (max-width:374px){
  .mode .mt small{font-size:.72rem}
  .mode .mt b{font-size:.96rem}
  .stat .lab{font-size:.66rem}
  .stat b{font-size:1.04rem}
}
@media (prefers-reduced-motion:reduce){
  .banner.show{animation:bannerFade 1.2s ease-out forwards}
  .chip.best{animation:none}
  .wellWrap{transition:none}
}
.ok-rm .banner.show{animation:bannerFade 1.2s ease-out forwards}
.ok-rm .chip.best{animation:none}
@keyframes bannerFade{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
/* the banners run on the game's clock (tickFx scrubs them), so a slow frame never skips one */
.bd .banner.show{animation-play-state:paused}
</style>

<div class="bd" id="game">
<div class="app offstage" id="app">
  <div class="hud" id="hud">
    <span id="pauseSlot"></span>
    <div class="stats" id="stats">
      <div class="stat"><span class="lab" id="lab1">Score</span><b id="val1">0</b></div>
      <div class="stat"><span class="lab" id="lab2">Level</span><b id="val2">1</b></div>
      <div class="stat"><span class="lab" id="lab3">Lines</span><b id="val3">0</b></div>
    </div>
    <span id="muteSlot"></span>
  </div>
  <div class="side holdSide" id="holdSide">
    <div class="box" id="holdBox"><span class="boxLab" data-t="hold">Hold</span><canvas id="holdCv" aria-label="Held brick" data-ta="heldAria"></canvas></div>
    <div class="keys" id="keysHint" aria-label="Keys" data-ta="keysAria">
      <div><span dir="ltr"><b>←</b><b>→</b></span> <span data-t="kMove">move</span></div>
      <div><b>↓</b> <span data-t="kDown">go down</span></div>
      <div><b>Space</b> <span data-t="kDrop">drop</span></div>
      <div><span dir="ltr"><b>↑</b><b>X</b></span> <span data-t="kTurn">turn</span></div>
      <div><b>Z</b> <span data-t="kTurnBack">turn back</span></div>
      <div><b>C</b> <span data-t="kHold">hold</span></div>
      <div><b>P</b> <span data-t="kPause">pause</span></div>
    </div>
  </div>
  <div class="wellWrap" id="wellWrap">
    <canvas id="well" aria-label="The well. Bricks fall here. Tap to turn, swipe to move, swipe down fast to drop." data-ta="wellAria"></canvas>
    <div class="banner" id="banner" aria-live="polite"></div>
    <div class="banner sub" id="subBanner"></div>
  </div>
  <div class="side nextSide" id="nextSide">
    <div class="box" id="nextBox"><span class="boxLab" data-t="next">Next</span><canvas id="nextCv" aria-label="Next bricks" data-ta="nextAria"></canvas></div>
  </div>
  <div class="pad" id="pad">
    <div class="padL">
      <button class="pbtn wide" data-act="soft" data-icon="down" tabindex="-1" aria-label="Move down" data-ta="padDown"></button>
      <button class="pbtn" data-act="left" data-icon="left" tabindex="-1" aria-label="Move left" data-ta="padLeft"></button>
      <button class="pbtn" data-act="right" data-icon="right" tabindex="-1" aria-label="Move right" data-ta="padRight"></button>
    </div>
    <div class="padR">
      <button class="pbtn" data-act="hold" data-icon="swap" tabindex="-1" aria-label="Hold brick" data-ta="padHold"><span data-t="hold">Hold</span></button>
      <button class="pbtn go" data-act="hard" data-icon="drop" tabindex="-1" aria-label="Drop brick" data-ta="padDrop"><span data-t="drop">Drop</span></button>
      <button class="pbtn wide turn" data-act="rotateCW" data-icon="restart" tabindex="-1" aria-label="Turn brick" data-ta="padTurn"><span data-t="turn">Turn</span></button>
    </div>
  </div>
</div>


<section class="ok-modal ok-scrim" id="resultsScreen" role="dialog" aria-modal="true" aria-labelledby="resTitle" hidden>
  <div class="ok-card">
    <div id="resHero"></div>
    <h2 class="ok-h2" id="resTitle" data-t="resGreat">Great stacking!</h2>
    <p id="resSub" data-t="resTop">The bricks reached the top.</p>
    <div class="chips" id="resChips"></div>
    <div class="statGrid" id="resGrid"></div>
    <div class="btns" id="resBtns"></div>
  </div>
</section>
</div>

<script src="/vendor/oomba-kit/1.1.0/oomba-kit.js" integrity="sha384-GCejMN1YYamlsZNEJw6SRznGmZC2i6tppYwkLt8cv2gI3YTTsZq6l8eyUQuAM8qX" crossorigin="anonymous"></script>
<script src="/vendor/oomba-kit/1.1.0/packs/dress.js" integrity="sha384-ZCFgY98YAWY7Tcy+GfJLalmnJukKdzbVpg6j4ZljXuJSYgYzkWSWMPihVW/u8CqH" crossorigin="anonymous"></script>
<script src="/vendor/oomba-kit/1.1.0/packs/art-props.js" integrity="sha384-/RtKQ/ov2WG1EoCt4pJ98rHY07jOZjZ+lia901K+1BfS49MydEROuw7UaInBPHle" crossorigin="anonymous"></script>
<script>
/* =====================================================================================
   CONFIG: change these to make the game your own!
   ===================================================================================== */
/* ==== CONFIG START ==== */
const CONFIG = {
  title: 'Brick Drop',
  saveKey: 'brick-drop-v1',
  cols: 10,                 // well width in squares
  rows: 20,                 // visible well height
  hiddenRows: 4,            // extra rows above the top (bricks can poke up into them)
  nextCount: 3,             // how many upcoming bricks to show
  holdEnabled: true,
  lockDelayMs: 500,         // how long a brick can slide on the floor before it sticks
  maxLockResets: 15,        // moves/turns that restart that timer (per floor height)
  dasMs: 150,               // hold left/right this long before it starts repeating...
  arrMs: 40,                // ...then move one square this often
  softDropMs: 30,           // ms per row while going down fast
  gravity: { startMs: 1000, factor: 0.82, minMs: 25 },  // ms per row = startMs * factor^steps (steps grow with every cleared row), never below minMs
  linesPerLevel: 10,
  sprintLines: 40,
  zenClearRows: 10,         // Zen: when the stack hits the top, the top this-many rows melt away
  points: { lines: [0, 100, 300, 500, 800], softPerCell: 1, hardPerCell: 2, b2bMultiplier: 1.5, comboPerStep: 50 },
  clearDelayMs: 300,        // the sparkle sweep across cleared rows
  blastDelayMs: 460,        // ...a bit longer for a 4-line BRICK BLAST
  readyMs: 1300,            // "Ready?" before the first brick
  zenClearMs: 1000,
  // Touch gestures on the well
  swipeColumnPx: 30,        // drag this far sideways to move one column
  swipeRowPx: 24,           // drag this far down (slowly) to go down one row
  flickSpeed: 1.0,          // px per ms: a downward swipe faster than this drops the brick
  flickMinPx: 36,
  tapMaxMs: 260, tapMaxPx: 12,
  // Candy colours for the seven bricks (index = brick id): the kit's palette (Stick keeps the game's own candy pink).
  // Friendly names are only used for screen readers.
  bricks: [

  save.games++;
  const r = { mode: E.mode, kind, score: E.score, lines: E.lines, level: E.level, time: E.time, pieces: E.pieces, best: false, won: false };
  const confetti = () => { if (!REDUCED) { try { Oomba.juice.confetti(); } catch (e) { /* ignore */ } } };
  if (E.mode === 'marathon') {
    r.best = E.score > (save.bestMarathon || 0) && E.score > 0; if (r.best) save.bestMarathon = E.score;
    BRB.score.submit(E.score, 'points');            // labelled submit first; gameOver() repeats the score without a label
    BRB.gameOver({ won: false, score: E.score });
  } else if (E.mode === 'sprint') {
    if (kind === 'finish') {
      r.won = true; const secs = E.time / 1000, score = Math.max(0, Math.floor(600 - secs));
      r.best = !save.bestSprintMs || E.time < save.bestSprintMs; if (r.best) save.bestSprintMs = Math.round(E.time);
      r.sprintScore = score;
      // Sprint times stay on this device (best time above): the one leaderboard is for Marathon points,
      // so a ~580 Sprint score never competes with (or replaces) a player's Marathon best.
      BRB.gameOver({ won: true });
      Oomba.time.real.after(S.fast ? 0 : 200, confetti);
    } else BRB.gameOver({ won: false });               // no time, so nothing for the leaderboard
  } else {
    r.won = true; r.best = E.lines > (save.bestZenLines || 0); if (r.best) save.bestZenLines = E.lines;
    BRB.gameOver({ won: true });                       // Zen has no leaderboard
  }
  persist(); S.result = r;
  if (r.best && E.mode === 'marathon') Oomba.time.real.after(S.fast ? 0 : 900, confetti);
}
function showResults() {
  const r = S.result; if (!r) return;
  S.screen = 'results'; Oomba.scene = 'results'; clearBanners();
  let title, sub;
  if (r.mode === 'marathon') { title = t(r.best ? 'resNewBest' : 'resGreat'); sub = t('resTop'); }
  else if (r.mode === 'sprint') { if (r.won) { title = t('resDidIt'); sub = t('resSprint', { n: CONFIG.sprintLines, time: fmtTime(r.time) }); } else { title = t('resClose'); sub = t('resTopAgain'); } }
  else { title = t('resCalm'); sub = t('resZen', { n: r.lines }); }
  $('resTitle').textContent = title; $('resSub').textContent = sub;
  // the player's own character: cheering for a win or a best; a sad face for a top-out that soon cheers up again
  const happy = r.won || r.best, pic = $('resHero'); pic.innerHTML = '';
  if (happy) buddySays('cheer');
  pic.appendChild(Oomba.ui.portrait(ME, { size: 118, mood: happy ? 'cheer' : 'sad' }));
  if (!happy) { const gid = S.gameId; Oomba.time.real.after(S.fast ? 0 : 900, () => { if (S.screen === 'results' && gid === S.gameId) { pic.innerHTML = ''; pic.appendChild(Oomba.ui.portrait(ME, { size: 118, mood: 'happy' })); } }); }
  const chips = $('resChips'); chips.innerHTML = '';
  const addChip = (text, cls, ic) => { const c = document.createElement('div'); c.className = 'chip' + (cls ? ' ' + cls : ''); if (ic) c.innerHTML = Oomba.icon(ic); c.appendChild(document.createTextNode(text)); chips.appendChild(c); };
  // a new best says what it is ("New best: 834!"), so it never depends on the site's own toast
  if (r.best) { addChip(r.mode === 'zen' ? t('chipMostLines') : t('chipNewBestV', { v: r.mode === 'sprint' ? fmtTime(r.time) : fmtNum(r.score) }), 'best', 'trophy'); sfx('levelup'); }
  else if (r.mode === 'marathon' && save.bestMarathon) addChip(t('chipBest', { v: fmtNum(save.bestMarathon) }), '', 'star');
  else if (r.mode === 'sprint' && save.bestSprintMs) addChip(t('chipBest', { v: fmtTime(save.bestSprintMs) }), '', 'star');
  const grid = $('resGrid'); grid.innerHTML = '';
  const add = (lab, val) => { const d = document.createElement('div'); const sp = document.createElement('span'); sp.textContent = lab; const b = document.createElement('b'); b.textContent = val; d.append(sp, b); grid.appendChild(d); };
  if (r.mode === 'marathon') { add(TX.score, fmtNum(r.score)); add(TX.lines, fmtNum(r.lines)); add(TX.level, fmtNum(r.level)); add(TX.time, fmtTime(r.time)); }
  else if (r.mode === 'sprint') { add(TX.time, fmtTime(r.time)); add(TX.lines, Math.min(r.lines, CONFIG.sprintLines) + '/' + CONFIG.sprintLines); add(TX.score, fmtNum(r.score)); add(TX.bricks, fmtNum(r.pieces)); }
  else { add(TX.score, fmtNum(r.score)); add(TX.lines, fmtNum(r.lines)); add(TX.time, fmtTime(r.time)); add(TX.bricks, fmtNum(r.pieces)); }
  resultsScreen.hidden = false;
  Oomba.ui.announce(title + '. ' + sub);
  focusBtn('againBtn');
}

/* ---------- Buttons (the kit's: Ink-edged stickers with its icons; a kit button plays its own select sound) ---------- */
$('pauseSlot').replaceWith(iconBtn(t('pause'), 'pause', () => { setPaused(true); const b = $('pauseBtn'); if (b) b.blur(); }, 'pauseBtn'));
function muteButton() { const b = iconBtn(TX.soundOff, 'sound', () => { BRB.sfx.mute(); syncMute(); }); b.classList.add('mute'); return b; }
$('muteSlot').replaceWith(muteButton());
{
  const btns = $('resBtns');
  const again = Oomba.ui.button(t('playAgain'), { kind: 'hot', big: true, icon: 'restart', onPress: () => startGame() }); again.id = 'againBtn';
  const menu = Oomba.ui.button(t('menu'), { kind: 'quiet', icon: 'home', onPress: () => quitToTitle() }); menu.id = 'resMenuBtn';
  btns.append(again, menu);
  const m = muteButton(); m.style.cssText = 'position:absolute;top:10px;inset-inline-end:10px'; resultsScreen.querySelector('.ok-card').append(m);
}
function syncMute() {
  document.querySelectorAll('.mute').forEach(b => { b.innerHTML = Oomba.icon(BRB.sfx.muted ? 'mute' : 'sound'); b.setAttribute('aria-label', BRB.sfx.muted ? TX.soundOn : TX.soundOff); });
}
// the touch pad's pictures: the kit's icons (Drop: a brick landing on the floor)
const DROP_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15 5 7h14z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><rect x="4" y="17.4" width="16" height="3" rx="1.5" fill="currentColor"/></svg>';
document.querySelectorAll('.pbtn').forEach(b => { const n = b.dataset.icon; b.insertAdjacentHTML('afterbegin', n === 'drop' ? DROP_SVG : Oomba.icon(n)); });
/** The kit's left-handed setting puts Drop, Hold and Turn on the left. */
function applyHand() { app.classList.toggle('lefty', !!Oomba.settings.leftHanded); }
Oomba.settings.on('change', () => { REDUCED = !!Oomba.settings.reduced; applyHand(); });
applyHand();

/* ---------- Touch pad (pointer events: press = act now; left/right/down repeat while held) ---------- */
const HELD_ACTS = { left: 1, right: 1, soft: 1 };
const padButtons = Array.from(document.querySelectorAll('.pbtn'));
const btnPointer = new Map();   // button -> pointerId
let keyboardUser = false;   // move focus to panel buttons only for keyboard players (no ring on touch)
addEventListener('pointerdown', () => { keyboardUser = false; }, true);
function focusBtn(id) { if (keyboardUser) $(id).focus({ preventScroll: true }); }
function playing() { return S.screen === 'play' && !S.paused && !S.ending; }
padButtons.forEach(btn => {
  const act = btn.dataset.act;
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!playing()) return;
    try { btn.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    btnPointer.set(btn, e.pointerId); btn.classList.add('down');
    if (HELD_ACTS[act]) E.setHeld(act, true); else E.action(act);
  });
  const up = e => {
    if (btnPointer.get(btn) !== e.pointerId) return;
    btnPointer.delete(btn); btn.classList.remove('down');
    if (HELD_ACTS[act]) E.setHeld(act, false);
  };
  btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', up); btn.addEventListener('lostpointercapture', up);
  btn.addEventListener('contextmenu', e => e.preventDefault());
});
function releaseButtons() { padButtons.forEach(b => b.classList.remove('down')); btnPointer.clear(); }

/* ---------- Gestures on the well: tap = turn, drag sideways = move, slow drag down = go down,
   fast swipe down = drop, fast swipe up = hold ---------- */
const gest = { id: -1, x0: 0, y0: 0, ax: 0, ay: 0, t0: 0, moved: false, dead: false, held: false, pieces: 0, sx: new Float32Array(6), sy: new Float32Array(6), st: new Float32Array(6), si: 0 };
well.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!playing() || gest.id !== -1) return;
  try { well.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  gest.id = e.pointerId; gest.x0 = gest.ax = e.clientX; gest.y0 = gest.ay = e.clientY; gest.t0 = e.timeStamp;
  gest.moved = false; gest.dead = false; gest.held = false; gest.pieces = E.pieces; gest.si = 0;
  for (let i = 0; i < 6; i++) { gest.sx[i] = e.clientX; gest.sy[i] = e.clientY; gest.st[i] = e.timeStamp; }
});
well.addEventListener('pointermove', e => {
  if (e.pointerId !== gest.id || !playing()) return;
  const x = e.clientX, y = e.clientY, t = e.timeStamp;
  gest.si = (gest.si + 1) % 6; gest.sx[gest.si] = x; gest.sy[gest.si] = y; gest.st[gest.si] = t;
  if (Math.abs(x - gest.x0) > CONFIG.tapMaxPx || Math.abs(y - gest.y0) > CONFIG.tapMaxPx) gest.moved = true;
  if (E.pieces !== gest.pieces) gest.dead = true;      // the brick stuck mid-swipe: leave the next one alone
  if (gest.dead) return;
  // sideways: one column per swipeColumnPx
  const cp = CONFIG.swipeColumnPx;
  while (x - gest.ax >= cp) { gest.ax += cp; E.action('right'); }
  while (gest.ax - x >= cp) { gest.ax -= cp; E.action('left'); }
  // speed over the last ~90 ms
  let j = gest.si; for (let n = 0; n < 5; n++) { const k = (j + 5) % 6; if (t - gest.st[k] > 90) break; j = k; }
  const dtS = Math.max(1, t - gest.st[j]), vy = (y - gest.sy[j]) / dtS;
  const dy = y - gest.y0, dx = x - gest.x0;
  if (dy > CONFIG.flickMinPx && vy > CONFIG.flickSpeed && Math.abs(dy) > Math.abs(dx) * 1.5) { E.action('hard'); gest.dead = true; return; }
  if (-dy > CONFIG.flickMinPx && -vy > CONFIG.flickSpeed && Math.abs(dy) > Math.abs(dx) * 1.5 && !gest.held) { gest.held = true; E.action('hold'); gest.dead = true; return; }
  // slow drag down: one row per swipeRowPx
  if (Math.abs(dy) > Math.abs(dx)) while (y - gest.ay >= CONFIG.swipeRowPx) { gest.ay += CONFIG.swipeRowPx; if (!E.action('soft')) break; }
  if (y < gest.ay) gest.ay = y;      // moving back up re-arms the drag from here
});
function gestEnd(e) {
  if (e.pointerId !== gest.id) return;
  const quick = e.timeStamp - gest.t0 <= CONFIG.tapMaxMs;
  if (e.type === 'pointerup' && !gest.moved && quick && playing() && !gest.dead) E.action('rotateCW');
  gest.id = -1;
}
well.addEventListener('pointerup', gestEnd); well.addEventListener('pointercancel', gestEnd);
well.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- Keyboard (our own DAS/ARR, so the browser's key repeat is ignored) ---------- */
const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowDown: 'soft', ArrowUp: 'rotateCW', KeyX: 'rotateCW', KeyZ: 'rotateCCW',
  Space: 'hard', KeyC: 'hold', ShiftLeft: 'hold', ShiftRight: 'hold', KeyP: 'pause', Escape: 'pause',
  KeyA: 'left', KeyD: 'right', KeyS: 'soft', KeyW: 'rotateCW' };
// P while the kit's pause screen is open closes it again (Esc already does: the kit's own key).
addEventListener('keydown', e => {
  if (e.code === 'KeyP' && S.paused && S.screen === 'play' && !e.repeat) { e.preventDefault(); e.stopPropagation(); setPaused(false); }
}, true);
document.addEventListener('keydown', e => {
  keyboardUser = true;
  const act = KEYS[e.code];
  if (S.screen === 'title' || Oomba.ui.open) return;    // the kit's title and pause screens handle their own keys
  if (S.screen === 'results') { if ((e.code === 'Enter' || e.code === 'Space') && document.activeElement === document.body) { e.preventDefault(); startGame(); } return; }
  if (!act) return;
  if (act === 'pause') { e.preventDefault(); if (!e.repeat) setPaused(!S.paused); return; }
  if (S.paused) return;
  e.preventDefault();
  if (e.repeat || !playing()) return;
  if (HELD_ACTS[act]) E.setHeld(act, true); else E.action(act);
});
document.addEventListener('keyup', e => { const act = KEYS[e.code]; if (act && HELD_ACTS[act]) E.setHeld(act, false); });
addEventListener('blur', () => { E.releaseAll(); releaseButtons(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && S.screen === 'play' && !S.paused && !S.ending) setPaused(true); });
addEventListener('resize', layout);
if (mqLand.addEventListener) { mqLand.addEventListener('change', layout); mqPad.addEventListener('change', layout); }
// the kit's font arrives a moment after the page: the pop-up numbers use it, and the labels are re-fitted
Oomba.fonts.ready.then(() => { FONT = getComputedStyle(Oomba.ui.root()).getPropertyValue('--ok-font') || FONT; fitLabels(); });

/* ---------- Boot ---------- */
syncMute(); layout(); openTitle(); requestAnimationFrame(frame);

/* =====================================================================================
   window.__brbTest: hooks for automated play tests (harmless in production). Merged into the kit's hooks
   (setTheme, setLang, setTier ...): the game's own names below win and behave as before.
     state()            -> { screen ('title'|'play'|'pause'|'results'), mode, phase, board (20x10 visible rows, top first,
                             0 empty or brick id 1..7, 8 = stone), piece {type ('I','O','T','S','Z','J','L' or null), x, y, rot}
                             (x/y = the piece box's top-left in visible coordinates, y may be negative), hold (letter|null),
                             holdUsed, next [3 letters], score, lines, level, combo, b2b, over, won, time (ms), lockResets,
                             lockTimer, ghostY, paused, lastKick, gravityMs, pieces, quads, result }
     start({ mode: 'marathon'|'sprint'|'zen', seed, level, live })
                        -> starts a game. Time is frozen (only step(ms) moves it) unless live: true.
     input(action)      -> one press: 'left','right','rotateCW','rotateCCW','soft','hard','hold'. Returns { ok, state }.
     hold(name, on)     -> press/release a repeating key ('left','right','soft'); DAS/ARR then run on step().
     step(ms)           -> advance the game by ms in 1/60 s slices. Returns state().
     setBoard(rows)     -> fill the visible well: up to 20 strings or arrays, bottom-aligned ('.' empty, '1'-'8' ids, any other
                             letter = stone). Returns state().
     setQueue(types)    -> the current brick becomes types[0], the next ones types[1..] (letters or ids). Returns state().
     setLevel(n)        -> jump to level n (gravity follows). skipAnimations(on = true) -> no waits, sweeps or results delay.
     seed(n)            -> the seed for the next start() (and reseeds the bag now). pause(on), quit(), finishZen()
   ===================================================================================== */
function testState() {
  const board = [];
  for (let vy = 0; vy < VIS; vy++) { const row = []; for (let x = 0; x < W; x++) row.push(E.board[(vy + HID) * W + x]); board.push(row); }
  const p = E.piece;
  return {
    screen: S.screen === 'play' && S.paused ? 'pause' : S.screen, mode: E.mode, phase: E.phase, board,
    piece: { type: p.type ? TYPES[p.type] : null, x: p.x, y: p.y - HID, rot: p.rot },
    hold: E.hold ? TYPES[E.hold] : null, holdUsed: E.holdUsed, next: E.queue.slice(0, CONFIG.nextCount).map(t => TYPES[t]),
    score: E.score, lines: E.lines, level: E.level, combo: E.combo, b2b: E.b2b, over: E.over, won: E.won, time: Math.round(E.time),
    lockResets: E.lockResets, lockTimer: Math.round(E.lockTimer), ghostY: p.type ? E.ghostY() - HID : null, paused: S.paused,
    lastKick: E.last.kick, gravityMs: E.gravityMs(), pieces: E.pieces, quads: E.quads, result: S.result ? Object.assign({}, S.result) : null
  };
}
window.__brbTest = Object.assign(window.__brbTest || {}, {
  state: testState,
  start(opts = {}) {
    if (opts.seed != null) S.seed = opts.seed >>> 0;
    S.testClock = !opts.live;
    startGame(['marathon', 'sprint', 'zen'].includes(opts.mode) ? opts.mode : S.mode);
    if (opts.level && E.mode === 'marathon') { E.startLevel = E.level = Math.max(1, opts.level | 0); }
    return testState();
  },
  input(action) { const ok = playing() ? E.action(action) : false; return { ok, state: testState() }; },
  hold(name, on = true) { E.setHeld(name, on); return testState(); },
  step(ms) {
    let left = +ms || 0;
    while (left > 0) { const d = Math.min(left, 1000 / 60); if (S.screen === 'play' && !S.paused) { E.update(d); tickFx(d); } left -= d; }
    return testState();
  },
  setBoard(rows) { E.setBoard(rows); stackDirty = true; return testState(); },
  setQueue(types) { E.setQueue(types); nextKey = -1; return testState(); },
  setLevel(n) { E.setLevel(n); return testState(); },
  skipAnimations(on = true) { S.fast = on !== false; E.fast = S.fast; return S.fast; },
  seed(n) { S.seed = n >>> 0; E.seed(n); },
  pause(on = true) { setPaused(on); return testState(); },
  quit() { quitToTitle(); return testState(); },
  finishZen() { if (S.paused) closeKitPause(); finishZen(); return testState(); },
  layout() { return { cell: G.cell, side: G.side, mini: G.mini, dpr: G.dpr }; }
});
</script>
