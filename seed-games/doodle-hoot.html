<title>Doodle Hoot</title>
<style>
/* Doodle Hoot on the Oomba Kit: one player draws, the others spell the word with letter tiles (never typed text).
   Live (Oomba Live, mode 'doodle'): each player on their own device, anywhere; the host's screen shows the drawing, the
   scores and the podium. On its own: "Guess Pip's doodles" (Pip draws, you spell) or pass-and-play on one device.
   The board is a fixed 4:3 grid drawn on paper white in both themes, so a drawing looks the same on every screen.
   Layout: portrait stacks the top bar, the board and the tools or tiles; landscape puts the board left and the tools,
   tiles or scores right. Every control is at least 44px; colour is never the only cue (swatches have names, ticks have
   a mark). */
html,body{height:100%}
body{margin:0;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html.dh-play .ok-hud{display:none!important}
html.dh-live .ok-row{display:none!important}
.dh,.dh *{box-sizing:border-box}
.dh{--ink:#1D2340;--paper:#FFFFFF;--good:#2FA866;--goodTint:#D8F5E4;--bad:#E8604C;--badTint:#FBE0DC;--hint:#7E57D9;--hintTint:#ECE4FF;--chip:#FFF6D6;
  position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;gap:8px;padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
  background:var(--ok-bg2);color:var(--ok-text);font-family:var(--ok-font,system-ui,sans-serif)}
.dh.dh-dark{--goodTint:#164A33;--badTint:#55221E;--hintTint:#3A2D63;--chip:#3A3420}
.dh button{font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;color:inherit}
.dh-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* the top bar: round, who is drawing, the clock */
.dh-top{flex:none;display:flex;align-items:center;gap:8px;min-height:48px}
.dh-chip{flex:none;display:flex;align-items:center;gap:6px;min-height:40px;padding:2px 12px;border-radius:999px;background:var(--ok-card);border:3px solid var(--ok-edge);font-weight:800;font-size:clamp(13px,1.6vh + .4vw,20px);white-space:nowrap}
.dh-who{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:800;font-size:clamp(14px,1.8vh + .5vw,26px);overflow:hidden}
.dh-who canvas{flex:none;width:40px;height:40px}
.dh-who span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh-who.has-word>span:last-child{background:var(--chip);border:3px solid var(--ok-edge);border-radius:14px;padding:2px 10px}
.dh-who small{font-size:.65em;font-weight:700;opacity:.8}
.dh-theword{font-weight:900}
.dh-clock{flex:none;position:relative;width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p,1) * 360deg),var(--ok-card) 0);border:3px solid var(--ok-edge);display:grid;place-items:center}
.dh-clock b{width:36px;height:36px;border-radius:50%;background:var(--ok-card);display:grid;place-items:center;font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}
.dh-clock.low{background:conic-gradient(var(--bad) calc(var(--p,1) * 360deg),var(--ok-card) 0)}
/* the word the drawer draws (or a guesser who got it) */
.dh-word{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:4px 14px;border-radius:16px;background:var(--chip);border:3px solid var(--ok-edge);font-weight:900;font-size:clamp(18px,2.4vh + .8vw,34px);text-align:center}
.dh-word small{font-size:.55em;font-weight:700;opacity:.8}
.dh-word.got{background:var(--goodTint)}
/* the board and the side */
.dh-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.dh-boardbox{flex:1 1 auto;min-height:max(120px,46%);container-type:size;display:grid;place-items:center}
.dh-board{position:relative;width:min(100cqw,133.33cqh);aspect-ratio:4/3;border-radius:18px;background:var(--paper);border:4px solid var(--ok-edge);box-shadow:0 5px 0 var(--ok-edge);overflow:hidden}
.dh-board canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.dh-board.can-draw canvas{cursor:crosshair}
.dh-board.is-hidden canvas{filter:blur(22px) grayscale(1);opacity:.35}
.dh-veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center;color:#1D2340;font-weight:800;font-size:clamp(15px,2.2vh + .5vw,30px);pointer-events:none}
.dh-veil canvas{width:auto;height:min(40%,180px)}
.dh-veil .big{font-size:1.5em}
.dh-veil .emo{font-size:2.6em;line-height:1}
.dh-veil.rv{background:rgba(255,255,255,.86)}
.dh-side{flex:0 1 auto;display:flex;flex-direction:column;gap:8px;min-height:0;container-type:inline-size}
/* drawing tools */
.dh-tools{display:flex;flex-direction:column;gap:8px}
.dh-sw{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.dh-sw button{min-height:44px;border-radius:14px;border:3px solid var(--ok-edge);padding:0;position:relative}
.dh-sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ok-card),0 0 0 6px var(--ok-edge);transform:translateY(-2px)}
.dh-sw button[aria-pressed="true"]::after{content:'';position:absolute;inset:30%;border-radius:50%;background:currentColor}
.dh-row{display:flex;gap:6px;flex-wrap:wrap}
.dh-btn{flex:1 1 0;min-width:44px;min-height:44px;border-radius:14px;border:3px solid var(--ok-edge);background:var(--ok-card);box-shadow:0 3px 0 var(--ok-edge);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:15px;padding:2px 8px;white-space:nowrap}
.dh-btn svg{width:22px;height:22px;flex:none}
.dh-btn[aria-pressed="true"]{background:var(--chip);box-shadow:inset 0 3px 0 rgba(0,0,0,.18)}
.dh-btn:disabled{opacity:.45;cursor:default}
.dh-btn.hot{background:#FFC83D;color:#1D2340}
.dh-btn.warn{background:var(--badTint)}
.dh-size i{display:block;border-radius:50%;background:currentColor}
.dh-tools{position:relative}
.dh-cur i{display:block;border-radius:50%;border:2px solid var(--ok-edge)}
.dh-cur.dh-size i{border:0}
.dh-szs{display:contents}
/* a phone held upright: the colours and sizes fold into two buttons, each opening a small tray over the board */
@media (orientation:portrait){
  .dh-tools .dh-sw{display:none;position:absolute;left:0;right:0;bottom:calc(100% + 6px);z-index:3;padding:8px;border-radius:18px;background:var(--ok-card);border:3px solid var(--ok-edge);box-shadow:0 5px 0 var(--ok-edge)}
  .dh-tools.pal-open .dh-sw{display:grid}
  .dh-szs{display:none;position:absolute;left:0;right:0;bottom:calc(100% + 6px);z-index:3;gap:6px;padding:8px;border-radius:18px;background:var(--ok-card);border:3px solid var(--ok-edge);box-shadow:0 5px 0 var(--ok-edge)}
  .dh-tools.size-open .dh-szs{display:flex}
  .dh-tools .dh-note{display:none}
}
@media (orientation:landscape) and (min-height:501px){ .dh-cur{display:none!important} }
.dh-note{margin:0;font-size:13px;font-weight:700;opacity:.8;text-align:center}
/* slots and tiles */
.dh-guess{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-height:0;flex:0 1 auto;overflow-x:hidden;overflow-y:auto}
.dh-slots{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;min-height:44px}
.dh-wd{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.dh-slot{width:clamp(44px,11cqw,64px);height:clamp(44px,12cqw,68px);border-radius:10px;border:3px solid var(--ok-edge);border-style:dashed;background:transparent;font-weight:900;font-size:clamp(20px,5cqw,30px);display:grid;place-items:center;padding:0}
.dh-slot.full{border-style:solid;background:var(--ok-card)}
.dh-slot.lock{border-style:solid;background:var(--hintTint);cursor:default}
.dh-guess.ok .dh-slot{background:var(--goodTint);border-style:solid}
.dh-guess.no .dh-slots{animation:dhShake .35s ease}
.dh-preview{margin:0;text-align:center;font-size:24px;font-weight:800;min-height:1.3em}
.dh-tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(44px,14cqw,76px),1fr));gap:6px}
.dh-guess.ok .dh-tray{display:none}
.dh-tile{min-height:clamp(48px,14cqw,76px);font-size:clamp(22px,7cqw,36px);border-radius:12px;border:3px solid var(--ok-edge);background:var(--ok-card);box-shadow:0 4px 0 var(--ok-edge);font-weight:900;padding:0;transition:transform 70ms ease-out}
.dh-tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ok-edge)}
.dh-tile.used{opacity:.25;box-shadow:none}
.dh-tile.gone{visibility:hidden}
.dh-say{margin:0;min-height:1.3em;text-align:center;font-weight:800}
.dh-say.good{color:var(--good)}
/* scores */
.dh-scores{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;overflow-x:hidden;overflow-y:auto;min-height:0;flex:0 1 auto}
.dh-scores li{display:flex;align-items:center;gap:8px;min-height:44px;padding:2px 10px;border-radius:14px;background:var(--ok-card);border:3px solid var(--ok-edge);font-weight:800}

.dh-scores li .s{font-variant-numeric:tabular-nums}
.dh-scores li.got{background:var(--goodTint)}
.dh-scores li.dr{background:var(--chip)}
.dh-scores li .m{width:26px;text-align:center}
.dh-strip{flex:none;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;min-height:0;scrollbar-width:none}
.dh-strip b{font-weight:800;max-width:7em;overflow:hidden;text-overflow:ellipsis}
.dh-strip span{flex:none;display:flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--ok-card);border:2px solid var(--ok-edge);font-weight:800;font-size:13px;white-space:nowrap;min-height:30px}
.dh-strip span.got{background:var(--goodTint)}
.dh-strip span.me{outline:3px solid var(--ok-edge)}
.dh-strip canvas{width:22px;height:22px}
/* full-screen panels: the lobby, a pick, waiting, the podium, pass-and-play covers */
.dh-screen{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;justify-content:safe center;gap:12px;padding:16px;text-align:center;background:var(--ok-bg2);overflow-x:hidden;overflow-y:auto}
.dh-screen.below{top:calc(64px + env(safe-area-inset-top))}
.dh-screen h2{margin:0;font-size:clamp(22px,3vh + 1.2vw,52px);font-weight:900}
.dh-screen p{margin:0;font-weight:700;font-size:clamp(15px,1.6vh + .6vw,26px);max-width:44em}
.dh-screen .pip{height:min(28vh,220px);width:auto}
.dh-people{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:min(96vw,1400px);overflow-x:hidden;overflow-y:auto;min-height:0;flex:0 1 auto}
.dh-screen>*{flex-shrink:0}.dh-screen>.dh-people{flex-shrink:1}.dh-screen>.pip{flex-shrink:1;min-height:56px;object-fit:contain}
.dh-people li{display:flex;flex-direction:column;align-items:center;gap:2px;width:var(--cell,110px);font-weight:800;font-size:clamp(12px,calc(var(--cell,110px) * .13),20px)}
.dh-people li canvas{width:calc(var(--cell,110px) * .7);height:auto}
.dh-people li span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--ok-card);border-radius:999px;padding:0 8px}
.dh-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(96vw,900px)}
.dh-card{min-height:clamp(96px,22vh,200px);border-radius:20px;border:4px solid var(--ok-edge);background:var(--ok-card);box-shadow:0 6px 0 var(--ok-edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;font-weight:900;font-size:clamp(16px,2vh + 1vw,32px);overflow-wrap:anywhere}
.dh-card .emo{font-size:2em;line-height:1}
.dh-card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ok-edge)}
.dh-podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vw,30px);width:min(96vw,1000px)}
.dh-podium>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;min-width:0}
.dh-podium canvas{width:min(100%,180px);height:auto}
.dh-podium .blk{width:100%;border-radius:16px 16px 0 0;border:4px solid var(--ok-edge);background:var(--chip);display:flex;align-items:flex-start;justify-content:center;font-size:clamp(28px,5vh,64px);padding-top:6px}
.dh-podium .p1 .blk{height:22vh}.dh-podium .p2 .blk{height:15vh}.dh-podium .p3 .blk{height:10vh}
.dh-podium canvas{max-height:24vh;width:auto}
/* the blocks rise 3rd, 2nd, then 1st (not with reduced motion) */
.dh-podium>div{animation:dhRise .6s cubic-bezier(.2,1.4,.4,1) both}.dh-podium .p3{animation-delay:.2s}.dh-podium .p2{animation-delay:.9s}.dh-podium .p1{animation-delay:1.6s}
@keyframes dhRise{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
.dh-hint{position:absolute;inset-inline-end:10px;top:10px;z-index:2;background:var(--hint);color:#fff;border:3px solid var(--ok-edge);border-radius:999px;padding:4px 14px;font-weight:900;font-size:clamp(16px,2vh + .5vw,26px);animation:dhPop 1.6s ease-out both;pointer-events:none}
@keyframes dhPop{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.15);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.rm .dh-podium>div,.rm .dh-hint{animation:none!important}
.dh-podium .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(14px,2vh + .6vw,30px)}
.dh-big{min-height:56px;min-width:min(80vw,280px);border-radius:18px;border:4px solid var(--ok-edge);background:#FFC83D;color:#1D2340;box-shadow:0 6px 0 var(--ok-edge);font-weight:900;font-size:22px;padding:6px 20px}
.dh-who-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.dh-who-btns button{min-width:110px;min-height:56px;border-radius:16px;border:3px solid var(--ok-edge);background:var(--ok-card);box-shadow:0 4px 0 var(--ok-edge);display:flex;align-items:center;gap:6px;padding:4px 12px;font-weight:800;font-size:17px}
.dh-who-btns canvas{width:40px;height:40px}
.dh-over{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:var(--ok-scrim);pointer-events:none}
.dh-over b{background:var(--ok-card);color:var(--ok-text);border:4px solid var(--ok-edge);border-radius:24px;box-shadow:0 5px 0 var(--ok-edge);padding:10px 24px;font-size:clamp(28px,min(9vw,8vh),96px);font-weight:900;text-align:center;max-width:90%}
.dh-toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:7;background:var(--ok-card);border:3px solid var(--ok-edge);border-radius:16px;padding:8px 16px;font-weight:800;max-width:90vw;text-align:center}
/* the setup card (on its own) */
.dhs{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:12px;background:var(--ok-scrim)}
.dhs-card{width:min(96vw,560px);max-height:96vh;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:24px;background:var(--ok-card);color:var(--ok-text);border:4px solid var(--ok-edge);box-shadow:0 6px 0 var(--ok-edge)}
.dhs-card h2{margin:0;text-align:center;font-size:26px;font-weight:900}
.dhs-card fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.dhs-card legend{font-weight:800;margin-bottom:4px}
.dhs-card .opts{display:flex;gap:6px;flex-wrap:wrap}
.dhs-card .opt{flex:1 1 0;min-width:44px;min-height:48px;border-radius:14px;border:3px solid var(--ok-edge);background:var(--ok-bg2);font-weight:800;font-size:16px;padding:4px 10px}

.dhs-card p{margin:0;font-size:14px;font-weight:700;opacity:.85;text-align:center}
/* landscape: the board left, the side right */
@media (orientation:landscape){

  .dh-cur{display:flex!important}

  .dh-tools.pal-open .dh-sw{display:grid}
  .dh-szs{display:none;position:fixed;inset-inline-start:calc(8px + env(safe-area-inset-left));top:56px;z-index:8;gap:6px;padding:8px;border-radius:18px;background:var(--ok-card);border:3px solid var(--ok-edge);box-shadow:0 5px 0 var(--ok-edge)}

  .dh-seepod{min-height:48px;font-size:18px}
}
/* a narrow phone: the word in the top bar gets the room */
@media (max-width:420px){
  .dh-chip{padding:2px 8px;font-size:13px}

.dh-seepod{margin-top:6px}
.dh.rm *,.rm .dh-guess.no .dh-slots{animation:none!important;transition:none!important}

      else if (S.hidden) U.board.veilShow([el('div', 'big', t('hidden'))]);
      else if (host && S.hid) U.board.veilShow(null);
      else U.board.veilShow(null);
      if (host) { var hidEl = U.chip; if (S.hid) hidEl.textContent = t('round', { n: Math.max(1, x.rd), of: x.rds }) + ' · ' + t('hidCount', { n: S.hid }); }
      if (host && x.g && x.ph === 'draw') { U.word.hidden = false; U.word.classList.remove('got'); U.word.textContent = x.g.map(function (n) { return new Array(n + 1).join('_ ').trim(); }).join('   ') + (x.hint ? '  · ' + t('hints', { n: x.hint }) : ''); }
    }
    function tick() {
      var x = dd();
      if (x && (x.ph === 'pick' || x.ph === 'draw' || x.ph === 'reveal')) {
        var total = x.ph === 'pick' ? 15000 : x.ph === 'reveal' ? 5000 : x.secs * 1000;
        var ms = x.run ? Math.max(0, x.end - L.now()) : x.left;
        U.clock.set(ms, total);
        if (x.ph === 'draw' && x.run) { var s = Math.ceil(ms / 1000); if (s === 10 && S.said[x.tn] !== 10) { S.said[x.tn] = 10; U.announce(t('left10')); if (host) sfx('count', { volume: 0.4 }); } }
      } else U.clock.set(0, 0);
      requestAnimationFrame(tick);
    }
    var lastGot = 0, lastPh = '';
    function onState() {
      var x = dd(); if (!x) { draw(); return; }
      if (x.tn > S.tn) turn(x.tn);
      if (x.got && x.got.length > lastGot && x.tn === S.tn) { var who = x.got[x.got.length - 1]; if (who !== me()) { U.say(t('gotItName', { name: nameOf(who) })); sfx('spark', { volume: 0.5 }); } }
      lastGot = x.got ? x.got.length : 0;
      if (x.ph !== lastPh) {
        if (x.ph === 'reveal') { sfx(x.rv && x.rv.w ? 'whoosh' : 'select'); U.announce(x.rv && x.rv.w ? t('itWas') + ' ' + x.rv.w : t('skipped')); }
        if (x.ph === 'draw' && x.dr !== me()) U.announce(t('drawing', { name: nameOf(x.dr) }));
        if (x.ph === 'done') sfx('win');
        lastPh = x.ph;
      }
      draw();
    }

    L.on('phase', function (e) { phase = e.phase; U.overlay(phase === 'paused' ? t('paused') : ''); draw(); });
    L.on('countdown', function (e) {
      var go = function () { var left = Math.ceil((e.at - L.now()) / 1000); if (phase !== 'countdown') { U.overlay(phase === 'paused' ? t('paused') : ''); return; } U.overlay(left > 0 ? String(left) : t('go')); if (left > 0) setTimeout(go, 200); };
      go(); if (!host) sfx('count', { volume: 0.4 });
    });
    L.on('start', function () { U.overlay(''); draw(); if (!host) L.send('need', null, { toHost: true }); });
    L.on('resume', function () { U.overlay(''); draw(); });
    L.on('state', onState);
    L.on('event', onEvent);
    L.on('leaderboard', function (e) { if (e && e.you) S.myScore = e.you.score; draw(); });
    L.on('join', draw); L.on('leave', draw); L.on('update', draw); L.on('names', draw);
    L.on('welcome', function () { phase = L.phase; draw(); if (!host && (phase === 'playing' || phase === 'paused')) L.send('need', null, { toHost: true }); });
    L.on('end', function (e) { phase = 'ended'; U.overlay(''); var x = dd(); if (x && x.ph === 'done') results(x); draw(); });
    L.ready({ lobby: true, hostView: true, maxPlayers: 16, words: ['pk', 'ln', 'un', 'cl', 'gs', 'hide', 'need'] });
    var rsz = 0; window.addEventListener('resize', function () { clearTimeout(rsz); rsz = setTimeout(draw, 120); });
    draw(); requestAnimationFrame(tick);

    O.test({
      state: function () {
        var x = dd();
        return { doodleLive: true, mode: 'live', role: L.role, phase: phase, me: me(), ph: x ? x.ph : null, rd: x ? x.rd : 0, tn: x ? x.tn : 0, drawer: x ? x.dr : 0,
          word: S.word ? S.word.w : null, choices: S.choices ? S.choices.w.slice() : null, tray: tiles ? tiles.tray.slice() : [], slots: tiles ? tiles.slots.slice() : [],
          hintSlots: tiles ? Object.keys(tiles.locks).map(Number) : [], solved: S.solved, strokes: U.board.strokes.length, points: U.board.points(), hidden: S.hidden, hid: S.hid,
          got: x && x.got ? x.got.slice() : [], scores: scoreRows().map(function (r) { return [r.seat, r.score]; }), rv: x ? x.rv : null, top: x ? x.top : null, ended: phase === 'ended',
          canDraw: !!(pad && pad.on), queue: Q ? Q.size() : 0, results: S.results };
      },
      start: function () { return true; },
    });
    Object.assign(window.__brbTest, {
      pick: function (i) { var b = U.screen.querySelector('.dh-card[data-i="' + (i | 0) + '"]'); if (!b) return false; b.click(); return true; },
      draw: function (pts) { return !!pad && pad.feed(pts); },
      tap: function (i) { return !!tiles && tiles.tap(i); },
      spell: function (w) { return !!tiles && tiles.spell(w); },
      undo: function () { undo(); return true; },
      clear: function () { clearMine(); return true; },
      hide: function () { setHidden(true); return true; },
    });
  }
  // (the scripts run in the head: the live view goes in once there is a body)
  if (LIVE) { if (document.body) liveGame(); else document.addEventListener('DOMContentLoaded', liveGame); }

  /* ---------- on its own: Guess Pip's doodles, or pass and play on one device ---------- */
  var KEY = 'doodle-hoot-v1';
  /** The word languages offered (server/live/doodle.js LANGS): Japanese and Traditional Chinese words wait for a native
   *  speaker's review, so those pages play with English words for now. */
  var WORD_LANGS = ['en', 'en-GB', 'es', 'fr', 'de', 'it', 'pt', 'nl', 'ru', 'ar', 'he'];
  var WLANG = WORD_LANGS.indexOf(LANG) >= 0 ? LANG : 'en';
  function load() { try { return (window.BRB && BRB.storage && BRB.storage.get(KEY)) || {}; } catch (e) { return {}; } }
  var saved = load();
  var CFG = { mode: saved.mode === 'pass' ? 'pass' : 'practice', lvl: [1, 2, 3].indexOf(saved.lvl) >= 0 ? saved.lvl : 1, n: saved.n >= 2 && saved.n <= 6 ? saved.n : 2 };
  var BEST = +saved.best || 0;
  function save() { try { if (window.BRB && BRB.storage) BRB.storage.set(KEY, { mode: CFG.mode, lvl: CFG.lvl, n: CFG.n, best: BEST }); } catch (e) { /* no save */ } }
  var CREW = [{ species: 'fox' }, { species: 'bunny' }, { species: 'frog' }, { species: 'bear' }, { species: 'cat' }, { species: 'penguin' }];
  var game = null, M = null, setupApi = null, fast = false;
  var SET = ['                    ', '                    ', '                    ', '                    ', '                    ', '   P          o     ', '####################', '####################'];
  if (!LIVE) game = O.game({
    api: 1, title: t('title'), subtitle: t('tag'), theme: 'meadow', titleHue: 'spark',
    controls: 'none', camera: 'fixed', hero: 'me', heroSize: 1.6, hud: [], countdown: 0,
    level: O.level.grid(SET, { o: { kind: 'npc', species: 'owl', wear: ['scarf'], tag: 'pip', size: 1.6, flip: true } }),
    intro: function () { return setupCard(); },
    testState: function () { return soloState(); },
    on: { start: function (w) { begin(w); }, title: function () { stop(); }, results: function () { stop(); } },
  });

  /* the setup card (before every game; the last choice is remembered) */
  var setupOpen = false;
  function setupCard() {
    return new Promise(function (resolve) {
      setupOpen = true;
      var wrap = el('div', 'dhs'); wrap.dir = O.dir || 'ltr';
      var card = el('div', 'dhs-card'); card.setAttribute('role', 'dialog'); card.setAttribute('aria-modal', 'true'); card.setAttribute('aria-labelledby', 'dhsH'); wrap.appendChild(card);
      var h = el('h2', '', t('setup')); h.id = 'dhsH'; card.appendChild(h);
      var groups = [];
      function group(key, label, opts, get, set) {
        var fs = el('fieldset'); fs.dataset.k = key; fs.appendChild(el('legend', '', label));
        var row = el('div', 'opts'); row.setAttribute('role', 'radiogroup'); row.setAttribute('aria-label', label);
        var bs = opts.map(function (o) { var b = btn('opt', o.label, null, function () { set(o.v); sync(); sfx('select'); }); b.setAttribute('role', 'radio'); b.dataset.v = String(o.v); row.appendChild(b); return b; });
        fs.appendChild(row); card.appendChild(fs);
        var g = { fs: fs, sync: function () { bs.forEach(function (b) { var on = b.dataset.v === String(get()); b.setAttribute('aria-checked', String(on)); b.tabIndex = on ? 0 : -1; }); } };
        groups.push(g); return g;
      }
      function sync() { groups.forEach(function (g) { g.sync(); }); players.fs.hidden = CFG.mode !== 'pass'; note.textContent = CFG.mode === 'pass' ? t('passNote') : t('practiceNote'); if (CFG.mode === 'practice' && CFG.lvl === 3) { CFG.lvl = 2; sync(); } lv3.hidden = CFG.mode === 'practice'; }
      group('mode', t('howPlay'), [{ v: 'practice', label: t('practice') }, { v: 'pass', label: t('pass') }], function () { return CFG.mode; }, function (v) { CFG.mode = v; });
      var lv = group('lvl', t('level'), [{ v: 1, label: t('easy') }, { v: 2, label: t('medium') }, { v: 3, label: t('tricky') }], function () { return CFG.lvl; }, function (v) { CFG.lvl = +v; });
      var lv3 = lv.fs.querySelector('[data-v="3"]');
      var players = group('n', t('playersN'), [2, 3, 4, 5, 6].map(function (n) { return { v: n, label: O.num(n) }; }), function () { return CFG.n; }, function (v) { CFG.n = +v; });
      var note = el('p'); card.appendChild(note);
      var start = O.ui.button(t('start'), { kind: 'hot', big: true, icon: 'play', onPress: function () { if (!setupOpen) return; setupOpen = false; save(); wrap.remove(); resolve(); } });
      start.id = 'dhStart'; start.setAttribute('data-start', ''); card.appendChild(start);
      sync();
      O.ui.root().appendChild(wrap);
      O.time.real.after(30, function () { try { start.focus({ preventScroll: true }); } catch (e) { /* gone */ } });
      setupApi = { close: function () { if (setupOpen) start.click(); } };
    });
  }

  function stop() { if (M && M.timer) clearInterval(M.timer); if (M && M.U) M.U.root.remove(); M = null; document.documentElement.classList.remove('dh-play'); }
  function begin(w) {
    stop();
    document.documentElement.classList.add('dh-play');
    wordLang = WLANG;
    var U = Shell('solo'), r = C.rng((Date.now() ^ (Math.random() * 4294967295)) >>> 0);
    M = { w: w, U: U, r: r, mode: CFG.mode, lvl: CFG.lvl, score: 0, i: 0, ph: 'none', solvedN: 0 };
    if (CFG.mode === 'practice') practice(); else passPlay();
  }
  /** A guess round on this device: the tray, the hints over time, the clock. done(ok, left, hints) when it ends. */
  function round(word, ms, done) {
    var U = M.U, lang = WLANG, P = C.parts(word.w, lang), b = C.buildTray(word.w, lang, M.lvl, M.r, { pool: C.wordPool(DW, lang) });
    var plan = C.hintPlan(P.g.length, M.r), hints = [], step = 0, removed = {}, t0 = O.time.now, left = ms, over = false;
    var tiles = Tiles(function (picks) {
      var locks = {}; hints.forEach(function (h) { locks[h.i] = h.t; });
      if (C.check(b.tray, P.g, picks, locks)) { tiles.result(true, t('gotIt')); sfx('correct'); finish(true); }
      else { tiles.result(false, t('notQuite')); sfx('wrong', { volume: 0.5 }); }
    }, lang);
    tiles.set({ t: b.tray, g: P.groups, dir: C.dir(lang) }, lang);
    M.tiles = tiles; M.word = word; M.tray = b.tray;
    U.side.textContent = ''; U.side.appendChild(tiles.el);
    function finish(ok) { if (over) return; over = true; clearInterval(M.timer); M.timer = 0; done(ok, left, hints.length); }
    M.timer = setInterval(function () {
      if (over) return;
      if (O.time.paused) { t0 = O.time.now - (ms - left); return; }
      left = Math.max(0, ms - (O.time.now - t0));
      U.clock.set(left, ms);
      while (step < C.HINTS.length && ms - left >= ms * C.HINTS[step].at) {
        var h = C.HINTS[step++];
        if (h.min && P.g.length < h.min) continue;
        if (h.k === 'decoys') { var gone = b.decoys.filter(function (i) { return !removed[i]; }).slice(0, h.n); gone.forEach(function (i) { removed[i] = 1; }); tiles.removeDecoys(gone); if (gone.length) U.hintPop(); }
        else { var slot = plan.filter(function (i) { return !hints.some(function (q) { return q.i === i; }); })[0]; if (slot == null) continue; var used = hints.map(function (q) { return q.t; }); var ti = b.tray.findIndex(function (g, i) { return g === P.g[slot] && used.indexOf(i) < 0 && b.decoys.indexOf(i) < 0; }); if (ti < 0) continue; hints.push({ i: slot, t: ti }); tiles.hint(slot, ti); U.hintPop(); }
      }
      if (left <= 0) finish(false);
    }, 100);
    return tiles;
  }
  function reveal(word, extra, then) {
    var U = M.U, nodes = [el('div', '', t('itWas')), el('div', 'emo', word.e), el('div', 'big', caps(word.w, WLANG))];
    if (extra) nodes.push(el('div', '', extra));
    U.board.veilShow(nodes, 'rv');
    O.time.real.after(fast ? 10 : 2200, then);
  }

  /* Guess Pip's doodles: 8 doodles; Pip draws each stroke by stroke, the player spells it */
  var PRACTICE_N = 8, PRACTICE_MS = 45000;
  function practice() {
    var U = M.U, ws = C.words(DW, WLANG, 0).filter(function (x) { return ART[x.id] && x.lvl <= Math.max(1, M.lvl) && (M.lvl === 1 ? x.lvl === 1 : true); });
    M.list = M.r.shuffle(ws).slice(0, PRACTICE_N); M.i = -1;
    U.whoIs(PIP, t('pipDraws'));
    next();
    function next() {
      M.i++;
      if (M.i >= M.list.length) return end();
      var word = M.list[M.i]; M.ph = 'guess';
      U.chip.textContent = t('doodleN', { n: M.i + 1, of: M.list.length });
      U.board.veilShow(null); U.board.clear(); U.whoIs(PIP, t('pipDraws'));
      animate(ART[word.id]);
      round(word, PRACTICE_MS, function (ok, left, hints) {
        M.ph = 'reveal';
        var p = ok ? C.guessPoints(left, PRACTICE_MS, 2, hints) : 0;
        if (ok) { M.score += p; M.solvedN++; }
        if (M.anim) { M.anim(); }
        U.board.strokes = ART[word.id].map(function (s, i) { return { s: i, c: s.c, w: s.w, e: 0, pts: s.pts.slice() }; }); U.board.redraw();
        reveal(word, ok ? t('gotPts', { n: p }) : t('timeUp'), next);
      });
    }
    function animate(strokes) {
      var i = 0, k = 0, alive = true, per = Math.max(2, Math.round(strokes.reduce(function (a, s) { return a + s.pts.length / 2; }, 0) / 120));
      var cur = null, id = setInterval(function () {
        if (!alive || O.time.paused) return;
        for (var n = 0; n < per && i < strokes.length; n++) {
          var s = strokes[i];
          if (!cur) { cur = U.board.add({ s: i, c: s.c, w: s.w, e: 0, pts: [s.pts[0], s.pts[1]] }); k = 2; continue; }
          if (k < s.pts.length) { U.board.append(i, [s.pts[k], s.pts[k + 1]]); k += 2; } else { cur = null; i++; }
        }
        if (i >= strokes.length) { clearInterval(id); U.whoIs(PIP, t('spell')); }
      }, fast ? 1 : 33);
      M.anim = function () { alive = false; clearInterval(id); M.anim = null; };
    }
    function end() {
      var stars = M.score >= 600 ? 3 : M.score >= 350 ? 2 : M.score > 0 ? 1 : 0, best = BEST;
      if (M.score > BEST) { BEST = M.score; save(); }
      M.ph = 'end';
      M.w.win({ score: M.score, stars: stars, title: stars === 3 ? t('superSpeller') : t('wellPlayed'), best: best });
    }
  }

  /* Pass and play: each player draws once a round on this device while the others look away, then they guess */
  var PASS_DRAW_MS = 60000, PASS_GUESS_MS = 60000;
  function passPlay() {
    var U = M.U, n = CFG.n;
    M.players = []; for (var i = 0; i < n; i++) M.players.push({ i: i, name: t('player', { n: i + 1 }), spec: O.char(CREW[i]), score: 0 });
    M.turn = -1; M.used = {};
    var pad = Pad(U.board, { start: function () {}, more: function () {}, end: function () {} });
    var tools = Tools(pad, { undo: function () { var st = U.board.strokes[U.board.strokes.length - 1]; if (st) U.board.remove(st.s); }, clear: function () { U.board.clear(); } });
    M.pad = pad;
    nextTurn();
    function nextTurn() {
      M.turn++;
      if (M.turn >= M.players.length) return end();
      var p = M.players[M.turn]; M.ph = 'cover';
      U.board.clear(); U.board.veilShow(null); pad.set(false); pad.reset(0);
      U.chip.textContent = t('turnN', { n: M.turn + 1, of: M.players.length });
      U.whoIs(p.spec, t('drawing', { name: p.name }));
      var go = el('button', 'dh-big', t('imReady')); go.type = 'button'; press(go, pick);
      U.panel([figure(p.spec, 220), el('h2', '', t('passTo', { name: p.name })), el('p', '', t('passDraw')), go]);
      M.go = go;
    }
    function pick() {
      var p = M.players[M.turn], all = C.words(DW, WLANG, M.lvl).filter(function (x) { return !M.used[x.id]; });
      var ch = M.r.shuffle(all).slice(0, 3); M.choices = ch; M.ph = 'pick';
      U.panel([el('h2', '', t('pickWord')), cards(ch.map(function (x) { return x.w; }), ch.map(function (x) { return x.e; }), function (i) { drawTurn(ch[i]); }), el('p', '', t('notLetters'))]);
      M.cards = true; void p;
    }
    function drawTurn(word) {
      M.used[word.id] = 1; M.word = word; M.ph = 'draw';
      U.panel(null);
      U.word.hidden = false; U.word.textContent = ''; U.word.appendChild(el('small', '', t('drawThis'))); U.word.appendChild(el('span', '', word.e)); U.word.appendChild(el('span', '', caps(word.w, WLANG)));
      U.side.textContent = ''; U.side.appendChild(tools.el); var done = el('button', 'dh-btn hot', t('done')); done.type = 'button'; U.side.appendChild(done);
      pad.set(true);
      var t0 = O.time.now, over = false;
      function stopDraw() { if (over) return; over = true; clearInterval(M.timer); pad.set(false); U.word.hidden = true; toGuessers(); }
      press(done, stopDraw); M.doneBtn = done;
      M.timer = setInterval(function () { var left = Math.max(0, PASS_DRAW_MS - (O.time.now - t0)); U.clock.set(left, PASS_DRAW_MS); if (left <= 0) stopDraw(); }, 100);
    }
    function toGuessers() {
      M.ph = 'cover2';
      var go = el('button', 'dh-big', t('imReady')); go.type = 'button';
      press(go, function () { U.panel(null); guess(); });
      U.panel([pipPic(180), el('h2', '', t('passGuess')), el('p', '', t('passGuessP')), go]); M.go = go;
    }
    function guess() {
      M.ph = 'guess';
      var drawer = M.players[M.turn];
      U.whoIs(drawer.spec, t('drawing', { name: drawer.name }));
      round(M.word, PASS_GUESS_MS, function (ok, left, hints) {
        if (!ok) { M.ph = 'reveal'; reveal(M.word, t('timeUp'), nextTurn); return; }
        // who spelled it? (a tap on their picture: no names typed)
        M.ph = 'who';
        var row = el('div', 'dh-who-btns');
        M.players.forEach(function (p) {
          if (p === drawer) return;
          var b = btn('', p.name, null, function () {
            var pts = C.guessPoints(left, PASS_GUESS_MS, 2, hints); p.score += pts; drawer.score += C.drawPoints(1, 1); U.panel(null);
            M.ph = 'reveal'; reveal(M.word, t('gotItName', { name: p.name }), nextTurn);
          });
          b.insertBefore(figure(p.spec, 80), b.firstChild); row.appendChild(b);
        });
        U.panel([el('h2', '', t('whoGot')), row]);
      });
    }
    function end() {
      var best = M.players.slice().sort(function (a, b) { return b.score - a.score; }), top = best[0], tie = best[1] && best[1].score === top.score;
      M.ph = 'end';
      M.w.win({ title: tie ? t('tie') : t('wins', { name: top.name }), who: tie ? null : top.spec, score: top.score, stars: 3, submit: false });
    }
  }

  function soloState() {
    return { doodle: true, mode: CFG.mode, screen: setupOpen ? 'setup' : M ? M.ph : 'none', lvl: CFG.lvl, players: CFG.n, score: M ? M.score : 0, i: M ? M.i : 0, turn: M ? M.turn : null,
      word: M && M.word ? M.word.w : null, tray: M && M.tiles ? M.tiles.tray.slice() : [], slots: M && M.tiles ? M.tiles.slots.slice() : [], strokes: M ? M.U.board.strokes.length : 0,
      points: M ? M.U.board.points() : 0, choices: M && M.choices ? M.choices.map(function (x) { return x.w; }) : null,
      scores: M && M.players ? M.players.map(function (p) { return p.score; }) : null, best: BEST, saved: load() };
  }
  if (!LIVE) Object.assign(window.__brbTest, {
    setup: function (o) { o = o || {}; if (o.mode) CFG.mode = o.mode === 'pass' ? 'pass' : 'practice'; if ([1, 2, 3].indexOf(+o.lvl) >= 0) CFG.lvl = +o.lvl; if (o.players) CFG.n = Math.max(2, Math.min(6, +o.players)); return soloState(); },
    start: function (o) { if (o) window.__brbTest.setup(o); if (o && o.seed != null) { /* fixed rounds */ } if (setupApi) setupApi.close(); game.start(); return soloState(); },
    state: function () { return soloState(); },
    pick: function (i) { var b = M && M.U.screen.querySelector('.dh-card[data-i="' + (i | 0) + '"]'); if (!b) return false; b.click(); return true; },
    draw: function (pts) { return !!(M && M.pad) && M.pad.feed(pts); },
    ready: function () { if (M && M.go && M.go.isConnected) { M.go.click(); return true; } return false; },
    done: function () { if (M && M.doneBtn && M.doneBtn.isConnected) { M.doneBtn.click(); return true; } return false; },
    tap: function (i) { return !!(M && M.tiles) && M.tiles.tap(i); },
    spell: function (w) { return !!(M && M.tiles) && M.tiles.spell(w || (M.word && M.word.w)); },
    who: function (k) { var b = M && M.U.screen.querySelectorAll('.dh-who-btns button')[k | 0]; if (!b) return false; b.click(); return true; },
    skipAnimations: function () { fast = true; return true; },
  });
})();
