<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mistake Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
  /* Mistake Hunt: a plain page in Oomba's look (paper, ink, Leaf green and Spark yellow, Bricolage Grotesque, cream
     cards, pill buttons), light and dark. No game engine: every screen is this page's own DOM. */
  :root {
    --page: #F4F1E6; --card: #FFFDF2; --card2: #F7F3E6; --hover: #EFEADB; --ink: #141414; --line: #E4DFCC; --muted: #5B584F;
    --leaf: #1F9D63; --mint: #66C792; --mint-t: #E3F4EA; --leaf-ink: #0F5A37; --spark: #FFD23F; --spark-t: #FFF3C4; --spark-ink: #7A5C00;
    --rose: #B3372F; --rose-t: #FBE6E3; --sky-t: #DCEDF7; --focus: #2563EB; --on-leaf: #fff;
    --shadow: 0 1px 0 rgba(20,20,20,.04), 0 4px 16px rgba(20,20,20,.06); --r: 20px; --r-sm: 12px;
    --font: 'Bricolage Grotesque', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --page: #141414; --card: #1E1E1B; --card2: #262622; --hover: #2C2C27; --ink: #FFFDF2; --line: #36352F; --muted: #B8B3A1;
    --leaf: #66C792; --mint: #66C792; --mint-t: #1F3A2B; --leaf-ink: #8FDDB0; --spark: #FFD23F; --spark-t: #3D3311; --spark-ink: #FFE07A;
    --rose: #FF8A7D; --rose-t: #4A2420; --sky-t: #1B3342; --focus: #8AB4FF; --on-leaf: #10261A;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.32);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--ink); font-family: var(--font); line-height: 1.4; -webkit-text-size-adjust: 100%; }
  body { padding: 0 16px calc(24px + env(safe-area-inset-bottom)); }
  :where(button, input, textarea, select) { font: inherit; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  button { touch-action: manipulation; cursor: pointer; }
  :where(button, input, textarea, select, a, [tabindex]):focus-visible, .mh-file:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
  [tabindex="-1"]:focus { outline: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [hidden] { display: none !important; }
  :root[dir="rtl"] .flipx { transform: scaleX(-1); }

  .mh-head { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 0; }
  .mh-logo { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; font-weight: 800; font-size: 1.25em; letter-spacing: -.01em; }
  .mh-logo svg { width: 36px; height: 36px; flex: none; }
  .mh-round { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; font-size: 1.1em; flex: none; }
  .mh { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .mh h1, .mh h2, .mh h3 { margin: 0; line-height: 1.15; letter-spacing: -.01em; }
  .mh h1 { font-size: 1.6rem; font-weight: 800; }
  .mh h2 { font-size: 1.3rem; font-weight: 800; }
  .mh h3 { font-size: 1.05rem; font-weight: 800; }
  .mh p { margin: 0; }
  .mh > div:empty { display: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .card.spark { border-top: 5px solid var(--spark); }
  .narrow { width: min(100%, 620px); margin: 0 auto; }
  .muted { color: var(--muted); }
  .small { font-size: .9rem; }
  .row { display: flex; gap: 10px; align-items: center; }
  .wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .between { justify-content: space-between; }
  .msg { font-weight: 700; }
  .msg:empty { display: none; }
  .ok { color: var(--leaf); }
  .err { color: var(--rose); }

  .btn { min-height: 44px; padding: 8px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; white-space: normal; }
  .btn:hover { background: var(--hover); }
  .btn.go { background: var(--leaf); border-color: var(--leaf); color: var(--on-leaf); }
  .btn.go:hover { filter: brightness(1.05); }
  .btn.quiet { background: transparent; border-color: transparent; }
  .btn.quiet:hover { background: var(--hover); }
  .btn.icon { width: 44px; padding: 0; flex: none; }
  .btn.big { min-height: 52px; font-size: 1.05rem; }
  .btn.danger { color: var(--rose); border-color: var(--rose); background: var(--rose-t); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn svg, .mitem svg, .ibtn svg { width: 20px; height: 20px; flex: none; }
  .btn:active { transform: translateY(1px); }
  .linkbtn { border: 0; background: none; padding: 10px 4px; min-height: 44px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .big-choice { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 72px; padding: 12px 16px; border-radius: 18px; border: 1px solid var(--line); background: var(--card2); text-align: start; }
  .big-choice:hover { background: var(--hover); }
  .big-choice.go { background: var(--leaf); border-color: var(--leaf); color: var(--on-leaf); }
  .big-choice .emo { font-size: 1.7em; flex: none; }
  .big-choice span:last-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .big-choice b { font-size: 1.1em; font-weight: 800; }
  .big-choice small { font-weight: 600; opacity: .85; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field label, .lbl { font-weight: 700; font-size: .95rem; }
  .input { min-height: 44px; padding: 9px 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--card); min-width: 0; width: 100%; }
  .input:focus { border-color: var(--ink); }
  textarea.input { resize: vertical; line-height: 1.5; }
  select.input { width: auto; }
  .codebox { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: var(--r-sm); background: var(--card2); }
  .codebox .input { flex: 1; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }

  /* the builder */
  .bhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .bhead .titlein { flex: 1 1 16em; min-width: 0; font-size: 1.35rem; font-weight: 800; border-color: transparent; background: transparent; padding-inline: 6px; }
  .bhead .titlein:hover, .bhead .titlein:focus { border-color: var(--line); background: var(--card); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 14px; font-weight: 700; border: 1px dashed var(--line); background: transparent; color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--mint-t); color: var(--leaf-ink); border: 1px solid color-mix(in srgb, var(--leaf) 40%, var(--line)); }
  .chip small { font-weight: 600; opacity: .8; }
  .types { display: grid; grid-template-columns: repeat(auto-fill, minmax(15em, 1fr)); gap: 4px 14px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--card2); }
  .types h4 { grid-column: 1 / -1; margin: 6px 0 0; font-size: .95rem; }
  .tcheck { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 600; cursor: pointer; }
  .tcheck input { width: 22px; height: 22px; accent-color: var(--leaf); flex: none; }
  .tcheck code, .std { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .78rem; color: var(--muted); }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab { min-height: 44px; padding: 6px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-weight: 700; max-width: 100%; overflow-wrap: anywhere; }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .ptools { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
  .passage { font-size: 1.15rem; line-height: 2.15; overflow-wrap: anywhere; text-align: left; }
  .passage p { margin: 0 0 .5em; }
  .tok { display: inline; padding: 3px 1px; margin: 0; border: 0; border-radius: 6px; background: none; font: inherit; line-height: inherit; color: inherit; cursor: pointer; }
  @media (hover: hover) { .tok:hover { background: var(--hover); } }
  .tok.sel { background: var(--spark); color: #141414; box-shadow: 0 0 0 2px var(--ink); }
  .mk { background: var(--spark-t); border-bottom: 2.5px solid var(--spark); border-radius: 4px; }
  .mk sup, .mnum { font-weight: 800; color: var(--spark-ink); }
  .mk sup { font-size: .62em; margin-inline-start: 1px; }
  .mlist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .mrow { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .mnum { width: 28px; height: 28px; border-radius: 50%; background: var(--spark); color: #141414; display: grid; place-items: center; font-size: .85rem; }
  .fixline { font-weight: 700; overflow-wrap: anywhere; }
  .fixline s { color: var(--rose); text-decoration-thickness: 2px; }
  .fixline ins { text-decoration: none; color: var(--leaf); }
  .fixline .arr { color: var(--muted); margin: 0 6px; }
  .why { font-size: .92rem; color: var(--muted); margin-top: 2px; }
  .pinmark { font-size: .78rem; font-weight: 800; color: var(--leaf-ink); background: var(--mint-t); border-radius: 999px; padding: 1px 8px; margin-inline-start: 6px; }
  .markbox { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--r-sm); background: var(--card2); border: 1px solid var(--line); }
  .fits { display: flex; flex-wrap: wrap; gap: 8px; }
  .fits .btn { font-weight: 600; }
  .fits .btn s { color: var(--rose); }
  .keybox { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 14px; background: var(--card2); }
  .keybox summary { font-weight: 800; min-height: 44px; display: flex; align-items: center; cursor: pointer; }
  .keytext b { color: var(--leaf); text-decoration: underline; text-underline-offset: 3px; }
  .keytext sup { font-weight: 800; font-size: .65em; }
  .menuwrap { position: relative; display: inline-flex; }
  .menu { position: absolute; top: calc(100% + 4px); inset-inline-end: 0; z-index: 30; width: max-content; min-width: 13em; max-width: min(19em, calc(100vw - 40px));
    display: flex; flex-direction: column; padding: 6px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 12px 32px rgba(20,20,20,.16); }
  .mitem { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 12px; border: 0; border-radius: 10px; background: none; font-weight: 700; text-align: start; }
  .mitem:hover, .mitem:focus { background: var(--hover); }
  .mitem.del { color: var(--rose); }
  .msep { height: 1px; margin: 4px 6px; background: var(--line); }
  .ibtn { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 50%; background: var(--card); display: grid; place-items: center; flex: none; color: var(--ink); padding: 0; }
  .ibtn:hover, .ibtn[aria-expanded="true"] { background: var(--hover); }
  .ibtn.flat { border-color: transparent; background: none; color: var(--muted); }
  .opts { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--card2); }
  .share { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; border-radius: var(--r-sm); background: var(--mint-t); text-align: center; }
  .codebig { display: flex; flex-direction: column; align-items: center; font-weight: 700; }
  .codebig b { font-size: 1.9em; letter-spacing: 3px; }
  canvas.qr { width: 168px; height: 168px; image-rendering: pixelated; border-radius: 12px; border: 1px solid var(--line); background: #fff; }
  .linkline { font-size: .9rem; overflow-wrap: anywhere; }
  .printbox { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--r-sm); background: var(--card2); border: 1px solid var(--line); }

  /* My worksheets */
  .wslist { list-style: none; margin: 0; padding: 0; }
  .wsrow { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .wsrow:last-child { border-bottom: 0; }
  .wsic { width: 42px; height: 42px; border-radius: 12px; background: var(--mint-t); color: var(--leaf); display: grid; place-items: center; flex: none; }
  .wsopen { flex: 1; min-width: 0; min-height: 52px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 4px 6px; border: 0; border-radius: 10px; background: none; text-align: start; }
  .wsopen:hover { background: var(--hover); }
  .backlink { align-self: flex-start; }
  .wsopen b { font-size: 1.05rem; overflow-wrap: anywhere; }
  .wsmeta { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; font-weight: 600; font-size: .9rem; color: var(--muted); }
  .codechip { padding: 1px 9px; border-radius: 999px; background: var(--hover); color: var(--ink); font-family: ui-monospace, Menlo, monospace; font-size: .8rem; font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
  .wsextra { flex-basis: 100%; display: flex; flex-direction: column; gap: 8px; padding: 0 6px 6px; }
  .wsextra:empty { display: none; }
  .confirm { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: var(--r-sm); background: var(--rose-t); }

  /* student play */
  .ptop { display: flex; align-items: center; gap: 10px; }
  .ptop .grow b { display: block; font-size: 1.2rem; overflow-wrap: anywhere; }
  .count { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-weight: 700; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); display: block; }
  .dots i.f { background: var(--leaf); }
  .dots i.on { box-shadow: 0 0 0 2px var(--ink); }
  .play .passage { font-size: 1.2rem; line-height: 1.7; }
  /* line spacing stays tight; each word's tap area reaches 44 px through an invisible hit box, not through line gaps */
  .play .tok { padding: 2px 1px; position: relative; }
  .play .tok::after { content: ''; position: absolute; inset: -9px -3px; }
  .tok.fixed { color: var(--leaf); font-weight: 800; }
  .tok.fixed s { color: var(--muted); font-weight: 400; margin-inline-end: 4px; text-decoration-thickness: 1.5px; }
  .tok.good { background: var(--mint-t); }
  .tok.oops { background: var(--rose-t); }
  .tok.shown { color: var(--leaf-ink); font-weight: 800; background: var(--mint-t); }
  .tok.missed { box-shadow: inset 0 -3px 0 var(--rose); }
  /* the hint's sentence: one soft highlight behind its words, wrapping line to line */
  .hintline { background: var(--spark-t); border-radius: 6px; padding: 3px 0; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .tok.sel { background: var(--spark); }
  /* Power with AI (Phase 2): the switch, its fields, the "written with AI" label, Check my passage */
  .aihead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .switch { min-height: 44px; display: inline-flex; align-items: center; gap: 10px; border: 0; background: transparent; font: inherit; font-weight: 800; font-size: 1.1rem; color: var(--ink); cursor: pointer; padding: 0; }
  .switch .knob { width: 48px; height: 28px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .15s; }
  .switch .knob::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: inset-inline-start .15s; }
  .switch[aria-checked="true"] .knob { background: var(--leaf); }
  .switch[aria-checked="true"] .knob::after { inset-inline-start: 23px; }
  .aigrid { display: grid; grid-template-columns: minmax(0, 2fr) repeat(2, minmax(0, 1fr)); gap: 10px; }
  .ailabel { align-self: flex-start; font-size: .85rem; font-weight: 700; color: var(--muted); background: var(--hover); border-radius: 999px; padding: 4px 12px; }
  .aichip { font-size: .75rem; font-weight: 700; color: var(--muted); background: var(--hover); border-radius: 999px; padding: 1px 8px; margin-inline-start: 6px; }
  .scanlist { display: flex; flex-direction: column; gap: 8px; list-style: none; margin: 0; padding: 0; }
  .scanlist li { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; background: var(--card2); display: flex; flex-direction: column; gap: 6px; }
  .whyin { width: 100%; min-height: 44px; }
  .gradedbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .sumlist .pend { color: var(--muted); }
  @media (max-width: 560px) { .aigrid { grid-template-columns: 1fr 1fr; } .aigrid .wide { grid-column: 1 / -1; } }
  .result { padding: 12px 16px; border-radius: 16px; background: var(--mint-t); color: var(--leaf-ink); font-weight: 800; }
  .result.warn { background: var(--spark-t); color: var(--spark-ink); font-weight: 700; }
  .hintcard { border-inline-start: 6px solid var(--spark); }
  .hintcard h3 { display: flex; align-items: center; gap: 8px; }
  .omark { width: 30px; height: 30px; border-radius: 50%; background: var(--mint); color: #141414; display: grid; place-items: center; font-weight: 800; flex: none; }
  .band { display: flex; gap: 10px; }
  .band .btn { flex: 1; }
  .sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 40; width: min(100%, 620px); background: var(--card); border: 1px solid var(--line); border-bottom: 0;
    border-radius: 24px 24px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.14); padding: 12px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
  .sheet .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 2px; }
  .sheet .input { font-size: 1.25rem; font-weight: 700; }
  .sheet .band .btn { min-height: 50px; }
  .endstars { font-size: 2.6em; letter-spacing: 6px; color: var(--spark); text-align: center; }
  .endstars .off { color: var(--line); }
  .sumlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .sumlist li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: var(--r-sm); background: var(--card2); font-weight: 700; }
  .toast { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 60; max-width: min(92vw, 560px); padding: 10px 18px; border-radius: 16px;
    background: var(--ink); color: var(--page); font-weight: 700; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.2); pointer-events: none; }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
  .confetti i { position: absolute; top: -12px; width: 10px; height: 14px; border-radius: 2px; animation: mh-fall var(--t, 1.6s) ease-in var(--d, 0s) forwards; }
  @keyframes mh-fall { to { transform: translate(var(--x, 0), 105vh) rotate(var(--r, 360deg)); } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
  @media (max-width: 640px) {
    body { padding: 0 12px calc(20px + env(safe-area-inset-bottom)); }
    .card { padding: 14px; }
    .mh h1 { font-size: 1.35rem; }
    .bhead .titlein { font-size: 1.15rem; flex-basis: 100%; order: 2; }
    .passage { font-size: 1.08rem; }
    .play .passage { font-size: 1.12rem; line-height: 1.7; }
    .wsic { display: none; }
    .mrow { grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; }
  }
</style>
</head>
<body>
<header class="mh-head">
  <div class="mh-logo"><svg viewBox="0 0 36 36" aria-hidden="true"><rect x="1" y="1" width="34" height="34" rx="9" fill="#66C792"/><path d="M8 11h14M8 16h9M8 21h7" stroke="#141414" stroke-width="2.2" stroke-linecap="round"/><circle cx="23" cy="21" r="5.5" fill="#FFD23F" stroke="#141414" stroke-width="2.2"/><path d="M27 25l3.5 3.5" stroke="#141414" stroke-width="2.6" stroke-linecap="round"/></svg><span id="mh-apptitle">Mistake Hunt</span></div>
  <button class="mh-round" type="button" id="mh-sound" aria-pressed="true">🔊</button>
</header>
<main class="mh" id="mh" aria-live="off"></main>
<div class="toast" id="mh-toast" role="status" hidden></div>
<div class="sr" id="mh-say" aria-live="polite"></div>
<script>
/* proof-core:begin */
/* Mistake Hunt's planter and checker: plain functions, no DOM, so the unit test runs this block on its own (node:vm)
   and the server reads the same block from this page (server/services/proof-core.js) to check saved sets and print
   answer keys. A passage is the teacher's correct text, cut into tokens (runs of letters and their punctuation, as
   "library." or "Earth's"); a mistake is a token range [a, b) and the wrong text students see there (w). Mistakes are
   planted by fixed rules and our own word lists (never by AI), so the answer key is always the teacher's own text.
   The same text, types, count and seed always plant the same mistakes. US English. */
(function (root) {
  'use strict';
