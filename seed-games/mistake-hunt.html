<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mistake Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
  /* Mistake Hunt: a plain page in Oomba's look (paper, ink, Leaf green and Spark yellow, Bricolage Grotesque, cream
     cards, pill buttons), light and dark. No game engine: every screen is this page's own DOM. */
  :root {
    --page: #F4F1E6; --card: #FFFDF2; --card2: #F7F3E6; --hover: #EFEADB; --ink: #141414; --line: #E4DFCC; --muted: #5B584F;
    --leaf: #1F9D63; --mint: #66C792; --mint-t: #E3F4EA; --leaf-ink: #0F5A37; --spark: #FFD23F; --spark-t: #FFF3C4; --spark-ink: #7A5C00;
    --rose: #B3372F; --rose-t: #FBE6E3; --sky-t: #DCEDF7; --focus: #2563EB; --on-leaf: #fff;
    --shadow: 0 1px 0 rgba(20,20,20,.04), 0 4px 16px rgba(20,20,20,.06); --r: 20px; --r-sm: 12px;
    --font: 'Bricolage Grotesque', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --page: #141414; --card: #1E1E1B; --card2: #262622; --hover: #2C2C27; --ink: #FFFDF2; --line: #36352F; --muted: #B8B3A1;
    --leaf: #66C792; --mint: #66C792; --mint-t: #1F3A2B; --leaf-ink: #8FDDB0; --spark: #FFD23F; --spark-t: #3D3311; --spark-ink: #FFE07A;
    --rose: #FF8A7D; --rose-t: #4A2420; --sky-t: #1B3342; --focus: #8AB4FF; --on-leaf: #10261A;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.32);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--ink); font-family: var(--font); line-height: 1.4; -webkit-text-size-adjust: 100%; }
  body { padding: 0 16px calc(24px + env(safe-area-inset-bottom)); }
  :where(button, input, textarea, select) { font: inherit; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  button { touch-action: manipulation; cursor: pointer; }
  :where(button, input, textarea, select, a, [tabindex]):focus-visible, .mh-file:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
  [tabindex="-1"]:focus { outline: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [hidden] { display: none !important; }
  :root[dir="rtl"] .flipx { transform: scaleX(-1); }

  .mh-head { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 0; }
  .mh-logo { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; font-weight: 800; font-size: 1.25em; letter-spacing: -.01em; }
  .mh-logo svg { width: 36px; height: 36px; flex: none; }
  .mh-round { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; font-size: 1.1em; flex: none; }
  .mh { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .mh h1, .mh h2, .mh h3 { margin: 0; line-height: 1.15; letter-spacing: -.01em; }
  .mh h1 { font-size: 1.6rem; font-weight: 800; }
  .mh h2 { font-size: 1.3rem; font-weight: 800; }
  .mh h3 { font-size: 1.05rem; font-weight: 800; }
  .mh p { margin: 0; }
  .mh > div:empty { display: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .card.spark { border-top: 5px solid var(--spark); }
  .narrow { width: min(100%, 620px); margin: 0 auto; }
  .muted { color: var(--muted); }
  .small { font-size: .9rem; }
  .row { display: flex; gap: 10px; align-items: center; }
  .wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .between { justify-content: space-between; }
  .msg { font-weight: 700; }
  .msg:empty { display: none; }
  .ok { color: var(--leaf); }
  .err { color: var(--rose); }

  .btn { min-height: 44px; padding: 8px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; white-space: normal; }
  .btn:hover { background: var(--hover); }
  .btn.go { background: var(--leaf); border-color: var(--leaf); color: var(--on-leaf); }
  .btn.go:hover { filter: brightness(1.05); }
  .btn.quiet { background: transparent; border-color: transparent; }
  .btn.quiet:hover { background: var(--hover); }
  .btn.icon { width: 44px; padding: 0; flex: none; }
  .btn.big { min-height: 52px; font-size: 1.05rem; }
  .btn.danger { color: var(--rose); border-color: var(--rose); background: var(--rose-t); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn svg, .mitem svg, .ibtn svg { width: 20px; height: 20px; flex: none; }
  .btn:active { transform: translateY(1px); }
  .linkbtn { border: 0; background: none; padding: 10px 4px; min-height: 44px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .big-choice { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 72px; padding: 12px 16px; border-radius: 18px; border: 1px solid var(--line); background: var(--card2); text-align: start; }
  .big-choice:hover { background: var(--hover); }
  .big-choice.go { background: var(--leaf); border-color: var(--leaf); color: var(--on-leaf); }
  .big-choice .emo { font-size: 1.7em; flex: none; }
  .big-choice span:last-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .big-choice b { font-size: 1.1em; font-weight: 800; }
  .big-choice small { font-weight: 600; opacity: .85; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field label, .lbl { font-weight: 700; font-size: .95rem; }
  .input { min-height: 44px; padding: 9px 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--card); min-width: 0; width: 100%; }
  .input:focus { border-color: var(--ink); }
  textarea.input { resize: vertical; line-height: 1.5; }
  select.input { width: auto; }
  .codebox { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: var(--r-sm); background: var(--card2); }
  .codebox .input { flex: 1; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }

  /* the builder */
  .bhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .bhead .titlein { flex: 1 1 16em; min-width: 0; font-size: 1.35rem; font-weight: 800; border-color: transparent; background: transparent; padding-inline: 6px; }
  .bhead .titlein:hover, .bhead .titlein:focus { border-color: var(--line); background: var(--card); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  /* the sample library */
  [data-screen="samples"] .chips { margin: 10px 0; }
  .levels { margin: 8px 0; }
  .levels .chips { align-items: center; }
  .levels p { margin: 4px 0 0; }
  .samples { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
  .sample { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 14px; align-items: center; padding: 12px 14px; border-radius: var(--r-sm); background: var(--card2); }
  .sample .emo { font-size: 1.6rem; }
  .sample .stext { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .sample .spreview { margin: 2px 0 0; font-size: .9rem; color: var(--muted); }
  .sample .row { gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  @media (max-width: 560px) { .sample { grid-template-columns: auto 1fr; } .sample .row { grid-column: 1 / -1; justify-content: flex-start; } }
  .chip { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 14px; font-weight: 700; border: 1px dashed var(--line); background: transparent; color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--mint-t); color: var(--leaf-ink); border: 1px solid color-mix(in srgb, var(--leaf) 40%, var(--line)); }
  .chip small { font-weight: 600; opacity: .8; }
  .types { display: grid; grid-template-columns: repeat(auto-fill, minmax(15em, 1fr)); gap: 4px 14px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--card2); }
  .types h4 { grid-column: 1 / -1; margin: 6px 0 0; font-size: .95rem; }
  .tcheck { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 600; cursor: pointer; }
  .tcheck input { width: 22px; height: 22px; accent-color: var(--leaf); flex: none; }
  .tcheck code, .std { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .78rem; color: var(--muted); }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab { min-height: 44px; padding: 6px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-weight: 700; max-width: 100%; overflow-wrap: anywhere; }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .ptools { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
  .passage { font-size: 1.15rem; line-height: 2.15; overflow-wrap: anywhere; text-align: left; }
  .passage p { margin: 0 0 .5em; }
  .tok { display: inline; padding: 3px 1px; margin: 0; border: 0; border-radius: 6px; background: none; font: inherit; line-height: inherit; color: inherit; cursor: pointer; }
  @media (hover: hover) { .tok:hover { background: var(--hover); } }
  .tok.sel { background: var(--spark); color: #141414; box-shadow: 0 0 0 2px var(--ink); }
  .mk { background: var(--spark-t); border-bottom: 2.5px solid var(--spark); border-radius: 4px; }
  .mk sup, .mnum { font-weight: 800; color: var(--spark-ink); }
  .mk sup { font-size: .62em; margin-inline-start: 1px; }
  .mlist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .mrow { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .mnum { width: 28px; height: 28px; border-radius: 50%; background: var(--spark); color: #141414; display: grid; place-items: center; font-size: .85rem; }
  .fixline { font-weight: 700; overflow-wrap: anywhere; }
  .fixline s { color: var(--rose); text-decoration-thickness: 2px; }
  .fixline ins { text-decoration: none; color: var(--leaf); }
  .fixline .arr { color: var(--muted); margin: 0 6px; }
  .why { font-size: .92rem; color: var(--muted); margin-top: 2px; }
  .pinmark { font-size: .78rem; font-weight: 800; color: var(--leaf-ink); background: var(--mint-t); border-radius: 999px; padding: 1px 8px; margin-inline-start: 6px; }
  .markbox { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--r-sm); background: var(--card2); border: 1px solid var(--line); }
  .fits { display: flex; flex-wrap: wrap; gap: 8px; }
  .fits .btn { font-weight: 600; }
  .fits .btn s { color: var(--rose); }
  .keybox { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 14px; background: var(--card2); }
  .keybox summary { font-weight: 800; min-height: 44px; display: flex; align-items: center; cursor: pointer; }
  .keytext b { color: var(--leaf); text-decoration: underline; text-underline-offset: 3px; }
  .keytext sup { font-weight: 800; font-size: .65em; }
  .menuwrap { position: relative; display: inline-flex; }
  .menu { position: absolute; top: calc(100% + 4px); inset-inline-end: 0; z-index: 30; width: max-content; min-width: 13em; max-width: min(19em, calc(100vw - 40px));
    display: flex; flex-direction: column; padding: 6px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 12px 32px rgba(20,20,20,.16); }
  .mitem { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 12px; border: 0; border-radius: 10px; background: none; font-weight: 700; text-align: start; }
  .mitem:hover, .mitem:focus { background: var(--hover); }
  .mitem.del { color: var(--rose); }
  .msep { height: 1px; margin: 4px 6px; background: var(--line); }
  .ibtn { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 50%; background: var(--card); display: grid; place-items: center; flex: none; color: var(--ink); padding: 0; }
  .ibtn:hover, .ibtn[aria-expanded="true"] { background: var(--hover); }
  .ibtn.flat { border-color: transparent; background: none; color: var(--muted); }
  .opts { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--card2); }
  .share { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; border-radius: var(--r-sm); background: var(--mint-t); text-align: center; }
  .codebig { display: flex; flex-direction: column; align-items: center; font-weight: 700; }
  .codebig b { font-size: 1.9em; letter-spacing: 3px; }
  canvas.qr { width: 168px; height: 168px; image-rendering: pixelated; border-radius: 12px; border: 1px solid var(--line); background: #fff; }
  .linkline { font-size: .9rem; overflow-wrap: anywhere; }
  .printbox { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--r-sm); background: var(--card2); border: 1px solid var(--line); }

  /* My worksheets */
  .wslist { list-style: none; margin: 0; padding: 0; }
  .wsrow { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .wsrow:last-child { border-bottom: 0; }
  .wsic { width: 42px; height: 42px; border-radius: 12px; background: var(--mint-t); color: var(--leaf); display: grid; place-items: center; flex: none; }
  .wsopen { flex: 1; min-width: 0; min-height: 52px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 4px 6px; border: 0; border-radius: 10px; background: none; text-align: start; }
  .wsopen:hover { background: var(--hover); }
  .backlink { align-self: flex-start; }
  .wsopen b { font-size: 1.05rem; overflow-wrap: anywhere; }
  .wsmeta { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; font-weight: 600; font-size: .9rem; color: var(--muted); }
  .codechip { padding: 1px 9px; border-radius: 999px; background: var(--hover); color: var(--ink); font-family: ui-monospace, Menlo, monospace; font-size: .8rem; font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
  .wsextra { flex-basis: 100%; display: flex; flex-direction: column; gap: 8px; padding: 0 6px 6px; }
  .wsextra:empty { display: none; }
  .confirm { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: var(--r-sm); background: var(--rose-t); }

  /* student play */
  .ptop { display: flex; align-items: center; gap: 10px; }
  .ptop .grow b { display: block; font-size: 1.2rem; overflow-wrap: anywhere; }
  .count { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-weight: 700; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); display: block; }
  .dots i.f { background: var(--leaf); }
  .dots i.on { box-shadow: 0 0 0 2px var(--ink); }
  .play .passage { font-size: 1.2rem; line-height: 1.7; }
  /* a tap goes to the nearest word (the passage's own handler: no hit boxes laid over the next line), see "touch" below */
  .play .tok { padding: 2px 1px; }
  .tok.fixed { color: var(--leaf); font-weight: 800; }
  .tok.fixed s { color: var(--muted); font-weight: 400; margin-inline-end: 4px; text-decoration-thickness: 1.5px; }
  .tok.good { background: var(--mint-t); }
  .tok.oops { background: var(--rose-t); }
  .tok.shown { color: var(--leaf-ink); font-weight: 800; background: var(--mint-t); }
  .tok.missed { box-shadow: inset 0 -3px 0 var(--rose); }
  /* the hint's sentence: one soft highlight behind its words, wrapping line to line */
  .hintline { background: var(--spark-t); border-radius: 6px; padding: 3px 0; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .tok.sel { background: var(--spark); }
  /* Power with AI (Phase 2): the switch, its fields, the "written with AI" label, Check my passage */
  .aihead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .switch { min-height: 44px; display: inline-flex; align-items: center; gap: 10px; border: 0; background: transparent; font: inherit; font-weight: 800; font-size: 1.1rem; color: var(--ink); cursor: pointer; padding: 0; }
  .switch .knob { width: 48px; height: 28px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .15s; }
  .switch .knob::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: inset-inline-start .15s; }
  .switch[aria-checked="true"] .knob { background: var(--leaf); }
  .switch[aria-checked="true"] .knob::after { inset-inline-start: 23px; }
  .aigrid { display: grid; grid-template-columns: minmax(0, 2fr) repeat(2, minmax(0, 1fr)); gap: 10px; }
  .ailabel { align-self: flex-start; font-size: .85rem; font-weight: 700; color: var(--muted); background: var(--hover); border-radius: 999px; padding: 4px 12px; }
  .aichip { font-size: .75rem; font-weight: 700; color: var(--muted); background: var(--hover); border-radius: 999px; padding: 1px 8px; margin-inline-start: 6px; }
  .scanlist { display: flex; flex-direction: column; gap: 8px; list-style: none; margin: 0; padding: 0; }
  .scanlist li { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; background: var(--card2); display: flex; flex-direction: column; gap: 6px; }
  .whyin { width: 100%; min-height: 44px; }
  .gradedbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .sumlist .pend { color: var(--muted); }
  @media (max-width: 560px) { .aigrid { grid-template-columns: 1fr 1fr; } .aigrid .wide { grid-column: 1 / -1; } }
  .result { padding: 12px 16px; border-radius: 16px; background: var(--mint-t); color: var(--leaf-ink); font-weight: 800; }
  .result.warn { background: var(--spark-t); color: var(--spark-ink); font-weight: 700; }
  .hintcard { border-inline-start: 6px solid var(--spark); }
  .hintcard h3 { display: flex; align-items: center; gap: 8px; }
  .omark { width: 30px; height: 30px; border-radius: 50%; background: var(--mint); color: #141414; display: grid; place-items: center; font-weight: 800; flex: none; }
  .band { display: flex; gap: 10px; }
  .band .btn { flex: 1; }
  .sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 40; width: min(100%, 620px); background: var(--card); border: 1px solid var(--line); border-bottom: 0;
    border-radius: 24px 24px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.14); padding: 12px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
  .sheet .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 2px; }
  .sheet .input { font-size: 1.25rem; font-weight: 700; }
  .sheet .band .btn { min-height: 50px; }
  .endstars { font-size: 2.6em; letter-spacing: 6px; color: var(--spark); text-align: center; }
  .endstars .off { color: var(--line); }
  .sumlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .sumlist li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: var(--r-sm); background: var(--card2); font-weight: 700; }
  .toast { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 60; max-width: min(92vw, 560px); padding: 10px 18px; border-radius: 16px;
    background: var(--ink); color: var(--page); font-weight: 700; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.2); pointer-events: none; }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
  .confetti i { position: absolute; top: -12px; width: 10px; height: 14px; border-radius: 2px; animation: mh-fall var(--t, 1.6s) ease-in var(--d, 0s) forwards; }
  @keyframes mh-fall { to { transform: translate(var(--x, 0), 105vh) rotate(var(--r, 360deg)); } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
  /* Oomba's chat on a set (Phase 3): the Manipulatives chat's look (public/css/manip-chat.css) in this page's tokens.
     900 px and wider: a panel docked on the end side, the builder narrows beside it. Narrower: a sheet over the lower
     part of the page with Minimize and Close; minimized, a round Oomba bubble at the bottom end corner. */
  :root { --mhc-w: 380px; }
  @media (min-width: 900px) and (max-width: 1100px) { :root { --mhc-w: 340px; } }
  .mhc-open { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px 0 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-weight: 700; }
  .mhc-open:hover { background: var(--hover); }
  .mhc-open[aria-expanded="true"] { background: var(--mint-t); border-color: color-mix(in srgb, var(--leaf) 40%, var(--line)); }
  .mhc { position: fixed; z-index: 45; inset-inline-end: 0; top: 0; bottom: 0; width: var(--mhc-w); display: flex; flex-direction: column; min-height: 0; background: var(--card); border-inline-start: 1px solid var(--line); box-shadow: var(--shadow); }
  @media (min-width: 900px) { body.mhc-on { padding-inline-end: calc(var(--mhc-w) + 16px); } }

/** The 18 version information bits (versions 7 and up): BCH code of the version. */
function versionBits(version) {
  let rem = version;
  for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
  return (version << 12) | rem;
}
/** The 15 format bits for level M and a mask (BCH code, then the fixed XOR). */
function formatBits(mask) {
  const data = (0 << 3) | mask;   // level M is 00
  let rem = data;
  for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
  return ((data << 10) | rem) ^ 0x5412;
}

/** The data codewords: byte mode, length, the bytes, terminator, padding. */
function dataCodewords(bytes, version) {
  const cap = layout(version).data.reduce((a, b) => a + b, 0);
  const bits = [];
  const put = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
  put(4, 4); put(bytes.length, version < 10 ? 8 : 16);
  for (const b of bytes) put(b, 8);
  for (let i = 0; i < 4 && bits.length < cap * 8; i++) bits.push(0);

  for (let i = 0; i < bits.length; i += 8) out.push(bits.slice(i, i + 8).reduce((a, b) => (a << 1) | b, 0));
  for (let p = 0; out.length < cap; p++) out.push(p % 2 ? 0x11 : 0xec);

/** All codewords in order: data blocks interleaved, then their error correction interleaved. */
function codewords(bytes, version) {
  const { data: lens, ec } = layout(version);
  const data = dataCodewords(bytes, version);
  const parts = [];
  for (let b = 0, at = 0; b < lens.length; at += lens[b], b++) parts.push(data.slice(at, at + lens[b]));
  const ecs = parts.map(p => rsEncode(p, ec));
  const out = [];
  for (let i = 0; i < Math.max(...lens); i++) for (const p of parts) if (i < p.length) out.push(p[i]);
  for (let i = 0; i < ec; i++) for (const e of ecs) out.push(e[i]);

const MASKS = [
  (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, x => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
  (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
  (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0, (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0,
];

function build(version, words, mask) {
  const size = 17 + 4 * version;
  const m = Array.from({ length: size }, () => new Array(size).fill(false));
  const fn = Array.from({ length: size }, () => new Array(size).fill(false));
  const set = (x, y, v) => { m[y][x] = v; fn[y][x] = true; };
  // Finder patterns and their separators.
  for (const [cx, cy] of [[3, 3], [size - 4, 3], [3, size - 4]]) {
    for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
      const x = cx + dx, y = cy + dy;

  const drawFormat = bits => {
    const b = i => ((bits >>> i) & 1) === 1;
    for (let i = 0; i <= 5; i++) set(8, i, b(i));
    set(8, 7, b(6)); set(8, 8, b(7)); set(7, 8, b(8));
    for (let i = 9; i < 15; i++) set(14 - i, 8, b(i));

  let i = 0;
  const total = words.length * 8;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let vert = 0; vert < size; vert++) {
      for (let j = 0; j < 2; j++) {
        const x = right - j;
        const up = ((right + 1) & 2) === 0;
        const y = up ? size - 1 - vert : vert;
        if (fn[y][x]) continue;
        const bit = i < total ? ((words[i >>> 3] >>> (7 - (i & 7))) & 1) === 1 : false;
        i++;
        m[y][x] = bit !== MASKS[mask](x, y);
      }
    }
  }
  drawFormat(formatBits(mask));
  return m;
}

/** The ISO penalty score of a finished symbol (lower is easier to read). */
function penalty(m) {
  const size = m.length;
  let p = 0, dark = 0;
  const lines = [];
  for (let y = 0; y < size; y++) { lines.push(m[y]); lines.push(m.map(r => r[y])); }
  for (const line of lines) {
    let run = 1;
    for (let i = 1; i <= size; i++) {
      if (i < size && line[i] === line[i - 1]) run++;
      else { if (run >= 5) p += 3 + (run - 5); run = 1; }
    }
    const s = line.map(v => (v ? '1' : '0')).join('');
    // (the finder-like patterns, written as runs so no string of digits reads like a phone number)
    const F = (0x5d).toString(2), Z = '0'.repeat(4);   // the finder pattern and four light modules
    for (const pat of [F + Z, Z + F]) { let k = s.indexOf(pat); while (k >= 0) { p += 40; k = s.indexOf(pat, k + 1); } }
  }
  for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
    const v = m[y][x];
    if (v === m[y][x + 1] && v === m[y + 1][x] && v === m[y + 1][x + 1]) p += 3;
  }
  for (const r of m) for (const v of r) if (v) dark++;

}

/** Whether text fits a code of at most this version. */
const fits = (text, max = 6) => utf8(String(text)).length <= capacity(Math.min(MAX_VERSION, max));
/** text -> { version, size, mask, modules: boolean[][] } (true = dark). Throws when it doesn't fit version max (by

function qr(text, { max = 6, version: want = 0, mask: only = -1 } = {}) {
  const bytes = utf8(String(text));
  let version = 0;

    const score = penalty(modules);
    if (!best || score < best.score) best = { version, size: modules.length, mask, modules, score };
  }
  return best;
}

/** An inline SVG of the code (4 modules of quiet zone), for the host screen. title: the accessible name. */
  root.ProofQR = { qr: qr, fits: fits };
})(window);

  function ibtn(icon, label, fn, id, cls) { var b = btn('ibtn' + (cls ? ' ' + cls : ''), null, fn, id); b.innerHTML = ICON[icon]; b.setAttribute('aria-label', label); b.title = label; return b; }
  function iconBtn(cls, icon, text, fn, id) { var b = btn(cls, null, fn, id); b.innerHTML = ICON[icon]; b.appendChild(el('span', '', text)); return b; }
  var sayBox = document.getElementById('mh-say'), toastBox = document.getElementById('mh-toast'), toastTimer = 0;
  function announce(s) { sayBox.textContent = ''; setTimeout(function () { sayBox.textContent = s; }, 30); }
  function toast(s) { toastBox.textContent = s; toastBox.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastBox.hidden = true; }, 2800); }
  function tell(s, box) { if (box) box.textContent = s; toast(s); announce(s); }
  var plural = function (n, one, many) { return n === 1 ? t(one) : t(many, { n: n }); };
  var gradeName = function (g) { return +g === 0 ? t('gradeK') : t('gradeN', { n: g }); };

  /* ---------- saved: the teacher's draft and students' work in progress (BRB.storage, the game save) ---------- */
  function load() { try { var s = B.storage && B.storage.get(CONFIG.saveKey); return s && typeof s === 'object' ? s : {}; } catch (e) { return {}; } }
  var SAVE = load();
  SAVE = { draft: SAVE.draft && Array.isArray(SAVE.draft.p) ? SAVE.draft : null, prog: SAVE.prog && typeof SAVE.prog === 'object' ? SAVE.prog : {} };
  function persist() { try { if (B.storage) B.storage.set(CONFIG.saveKey, SAVE); } catch (e) { /* the save is full or off */ } }

  var S = { screen: 'home', draft: null, run: null, sel: null, fix: null, setDone: false, sheets: null };
  var D = { mh: document.getElementById('mh') };
  function screen(name) { closeMenu(); closeSheet(); D.mh.innerHTML = ''; D.mh.dataset.screen = name; S.screen = name; chatScreen(); window.scrollTo(0, 0); return D.mh; }
  function card(box, cls) { var c = el('section', 'card' + (cls ? ' ' + cls : '')); box.appendChild(c); return c; }
  function focusTop(x) { var h = x || D.mh.querySelector('h1, h2'); if (h) { if (!x) h.tabIndex = -1; try { h.focus({ preventScroll: true }); } catch (e) { /* gone */ } } }

  /* ---------- a small menu (More): items [label, fn, cls] or '-' for a line ---------- */
  var MENU = null;
  function closeMenu(back) { if (!MENU) return; var m = MENU; MENU = null; m.box.remove(); m.btn.setAttribute('aria-expanded', 'false'); document.removeEventListener('pointerdown', m.out, true); if (back) m.btn.focus(); }
  function menuButton(label, items, id) {
    var wrap = el('span', 'menuwrap'), b = ibtn('more', label, null, id);
    b.setAttribute('aria-haspopup', 'menu'); b.setAttribute('aria-expanded', 'false');
    b.addEventListener('click', function () {
      if (MENU && MENU.btn === b) return closeMenu(true);
      closeMenu();
      var box = el('div', 'menu'), list = typeof items === 'function' ? items() : items, btns = [];
      box.setAttribute('role', 'menu');
      list.forEach(function (it) {
        if (it === '-') { box.appendChild(el('div', 'msep')); return; }
        var x = btn('mitem' + (it[2] ? ' ' + it[2] : ''), it[0], function () { closeMenu(true); it[1](); });
        x.setAttribute('role', 'menuitem'); if (it[3]) x.id = it[3]; box.appendChild(x); btns.push(x);
      });
      box.addEventListener('keydown', function (e) {
        var i = btns.indexOf(document.activeElement);
        if (e.key === 'Escape') { e.preventDefault(); closeMenu(true); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); btns[(i + 1) % btns.length].focus(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); btns[(i - 1 + btns.length) % btns.length].focus(); }
        else if (e.key === 'Tab') closeMenu(false);
      });
      var out = function (e) { if (!wrap.contains(e.target)) closeMenu(false); };
      wrap.appendChild(box); b.setAttribute('aria-expanded', 'true');
      MENU = { box: box, btn: b, out: out }; document.addEventListener('pointerdown', out, true);
      if (btns[0]) btns[0].focus();
    });
    wrap.appendChild(b); return wrap;
  }

  /* ---------- start ---------- */
  function begin() {
    // A graded lesson step (Phase 2): the passages as students see them, handed in to the server, which marks them.
    if (B.proofStep && Array.isArray(B.proofStep.passages) && B.proofStep.passages.length) return playGraded(B.proofStep);
    var qs = B.questionSet;
    if (qs && !S.setDone) {
      S.setDone = true;
      if (qs.missing) return showMissing();
      if (Array.isArray(qs.items) && qs.items.length && typeof qs.items[0].x === 'string') return play({ id: qs.id, items: plainItems(qs.items), mine: !!qs.mine });
    }
    showHome();
  }
  var plainItems = function (items) { return JSON.parse(JSON.stringify(items)); };
  function showMissing() {
    var c = card(screen('missing'), 'narrow');
    c.appendChild(el('h1', '', t('title'))); c.appendChild(el('p', 'msg err', t('missing')));
    c.appendChild(btn('btn go', t('home'), function () { showHome(); }, 'mh-missing-home'));
    focusTop();
  }
  function bigChoice(cls, emo, title, sub, fn, id) {
    var b = btn('big-choice' + (cls ? ' ' + cls : ''), null, fn, id), e = el('span', 'emo', emo), s = el('span');
    e.setAttribute('aria-hidden', 'true'); s.appendChild(el('b', '', title)); if (sub) s.appendChild(el('small', '', sub));
    b.appendChild(e); b.appendChild(s); return b;
  }
  function showHome() {
    var c = card(screen('home'), 'narrow spark');
    c.appendChild(el('h1', '', t('homeH'))); c.appendChild(el('p', 'muted', t('tag')));
    c.appendChild(bigChoice('go', '✏️', t('make'), t('makeSub'), function () { sfx('select'); edit(null); }, 'mh-make'));
    if (SAVE.draft && SAVE.draft.p.some(function (p) { return p.x; })) c.appendChild(bigChoice('', '📝', t('draft'), SAVE.draft.T || '', function () { sfx('select'); edit(SAVE.draft); }, 'mh-draft'));
    // My worksheets: every set this teacher saved on Oomba (BRB.canListSets: school staff, never a student).
    if (B.canListSets && B.mySets) c.appendChild(bigChoice('', '📚', t('ws'), t('wsSub'), function () { sfx('select'); showSheets(); }, 'mh-ws'));
    // A class code (what a teacher hands out), not where the server would refuse the lookup (a family grown-up).
    if (B.findQuestionSet && B.canFindSet !== false) drawCode(c);
    if (SAMPLES.length) c.appendChild(bigChoice('', '📖', t('samplesH'), t('samplesSub', { n: SAMPLES.length }), function () { sfx('select'); showSamples(); }, 'mh-samples'));
    else c.appendChild(bigChoice('', '🌙', t('sample'), t('sampleSub'), function () { sfx('select'); playSample(); }, 'mh-sample'));
    focusTop();
  }
  function drawCode(c) {
    var box = el('div', 'codebox'), l = el('label', '', t('codeL')), r = el('div', 'row'), inp = el('input', 'input'), msg = el('p', 'msg err');
    l.htmlFor = 'mh-code'; inp.id = 'mh-code'; inp.placeholder = t('codePh'); inp.autocomplete = 'off'; inp.maxLength = 20; inp.setAttribute('autocapitalize', 'characters'); inp.spellcheck = false;
    msg.id = 'mh-code-msg'; msg.setAttribute('role', 'status');
    var go = btn('btn go', t('go'), function () {
      var code = inp.value.trim(); if (!code) { inp.focus(); return; }
      go.disabled = true; msg.textContent = '';
      B.findQuestionSet(code).then(function (r) {
        go.disabled = false;
        var it = r && r.items && r.items[0];
        if (!r || r.error || !it || typeof it.x !== 'string') { msg.textContent = t(r && r.error === 'offline' ? 'offline' : 'codeBad'); sfx('wrong', { volume: 0.4 }); return; }
        sfx('select'); play({ id: r.id, items: plainItems(r.items), mine: false });
      });
    }, 'mh-codego');
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); go.click(); } });
    r.appendChild(inp); r.appendChild(go); box.appendChild(l); box.appendChild(r); box.appendChild(msg); c.appendChild(box);
  }

  /* ---------- the sample: an English passage about the Moon, planted the same way every time ---------- */
  var SAMPLE = { t: 'A night under the Moon', x: 'Last night, my family went outside to look at the Moon. It was full and very bright. My little brother asked why the Moon changes shape. Dad said that the Moon does not make its own light. It reflects light from the Sun, and we see different parts of it as it travels around Earth. I could see dark spots on its surface. They are wide, flat plains made of old lava. When we went back inside, we drew pictures of the Moon in our notebooks.' };
  function playSample() {
    var m = P.plant(SAMPLE.x, { types: P.preset(4), n: 6, seed: 7 });
    play({ id: '', sample: true, items: [{ t: SAMPLE.t, x: SAMPLE.x, g: 4, m: m, o: { h: true, s: true, n: 'total' } }], mine: false });
  }

  /* ---------- the sample library: hundreds of passages for grades 1-8 (seed-games/mistake-hunt-samples/, written in
     by scripts/mistake-hunt-samples.mjs), each planted with its grade's kinds of mistake when it is opened ---------- */
  /* samples:begin */
  var SAMPLES = [
    {"id":"g1-001","g":1,"topic":"animals","t":"The Busy Ants","x":"Ants live in big groups. Their home is called a colony. Some ants dig tunnels, and some ants look for food. When an ant finds a crumb, it tells the other ants. Then they all come to help. I saw two ants carry a leaf that was bigger than them. Ants are small, but they are very strong."},
    {"id":"g1-002","g":1,"topic":"animals","t":"My Dog Max","x":"My dog Max likes to run in the park. Every morning, we go there with Mom. Max chases the ball, and I throw it again. He wags his tail when he is happy. After our walk, Max drinks lots of water. Then he takes a long nap on his bed. I love my dog, and he loves me too."},
    {"id":"g1-003","g":1,"topic":"animals","t":"Frogs Grow Up","x":"A frog starts as a tiny egg in a pond. The egg hatches into a tadpole. A tadpole has a tail and swims like a fish. Soon it grows back legs, and then it grows front legs. Its tail gets shorter and shorter. At last, it hops out of the water as a frog. Frogs eat bugs, flies, and worms."},
    {"id":"g1-004","g":1,"topic":"animals","t":"Penguins in the Cold","x":"Penguins are birds, but they cannot fly. They use their wings to swim fast in the sea. Many penguins live where it is very cold. Their feathers keep them warm and dry. Some penguin dads keep an egg warm on their feet. I saw penguins at the zoo, and they waddled to the water. Then they jumped in and swam away."},
    {"id":"g1-005","g":1,"topic":"science","t":"Ice and Water","x":"Ice is water that is very cold. When ice gets warm, it melts. Then it turns back into water. I put an ice cube in a cup on a sunny day. After a little while, the cube was gone. There was only water in the cup. We can put the water in the freezer, and it will be ice again."},
    {"id":"g1-006","g":1,"topic":"science","t":"Seeds Need Water","x":"Our class planted bean seeds in cups. We gave them water, soil, and sunlight. After a week, a small green sprout came up. Sam forgot to water his cup, so his seed did not grow. Plants need water to live. Now Sam waters his cup every day, and his bean is growing too."},
    {"id":"g1-007","g":1,"topic":"science","t":"Our Five Senses","x":"We have five senses. We see with our eyes and hear with our ears. We smell with our nose and taste with our tongue. We touch things with our skin. At lunch, I used all five senses. I saw a red apple, and I smelled it. Then I bit it and heard a crunch. It tasted sweet, and it felt smooth."},
    {"id":"g1-008","g":1,"topic":"science","t":"Magnets Stick","x":"A magnet can pull some things to it. Magnets stick to things made of iron, like nails and paper clips. They do not stick to paper, wood, or plastic. My teacher gave us a magnet to test. I tried a paper clip, a crayon, and a block. The paper clip stuck, but the crayon and the block did not."},
    {"id":"g1-009","g":1,"topic":"space","t":"The Sun Is a Star","x":"The Sun is a star. It is the closest star to Earth. It looks small in the sky because it is very far away. The Sun gives us light and heat. Plants need its light to grow. Never look right at the Sun, because it can hurt your eyes. At night, we can see other stars, but they are much farther away."},
    {"id":"g1-010","g":1,"topic":"space","t":"Going to the Moon","x":"Long ago, in 1969, people walked on the Moon for the first time. Their names were Neil Armstrong and Buzz Aldrin. They flew there in a spaceship. The Moon has no air, so they wore space suits. They picked up rocks and took pictures. Then they flew back home to Earth."},
    {"id":"g1-011","g":1,"topic":"space","t":"Day and Night","x":"Earth spins around and around. It takes one day to spin all the way. When our side of Earth faces the Sun, it is day. When our side faces away, it is night. I go to school in the day. At night, I look at the stars with my mom. Then I brush my teeth, and I go to bed."},
    {"id":"g1-012","g":1,"topic":"space","t":"Stars at Camp","x":"Last summer, I went camping with my family. At night, we lay on a big blanket. The sky was dark, and there were many stars. Dad showed me the Big Dipper. It looks like a giant spoon. My sister saw the Moon, and she waved at it. We counted stars until we fell asleep."},
    {"id":"g1-013","g":1,"topic":"earth","t":"A Rainy Monday","x":"It rained all day on Monday. Big gray clouds filled the sky. I wore my boots and my yellow coat. On the way to school, I jumped in a puddle. Rain gives plants and animals the water they need. After school, the sun came out. Then I saw a rainbow over the hill. It had red, orange, yellow, green, blue, and purple."},
    {"id":"g1-014","g":1,"topic":"earth","t":"Rocks Everywhere","x":"Rocks are all around us. Some rocks are big, and some are small. Some are smooth, and some are rough. I keep a box of rocks in my room. I found a white rock at the beach and a black rock by a river. My favorite rock is shiny. Mom says the shiny bits are crystals."},
    {"id":"g1-015","g":1,"topic":"earth","t":"The Big Ocean","x":"Oceans are very big and very deep. Their water is salty, so we cannot drink it. Fish, crabs, and whales live in the ocean. There is also a tall seaweed called kelp. When I went to the beach, I saw waves crash on the sand. I found two shells and a starfish. I put the starfish back in the water."},
    {"id":"g1-016","g":1,"topic":"earth","t":"Four Seasons","x":"There are four seasons in a year. They are spring, summer, fall, and winter. In spring, flowers bloom and birds sing. Summer is hot, so we swim in the lake. In fall, the leaves turn red and drop down. Winter can be cold and snowy. My favorite season is winter, because I like to build a snowman."},
    {"id":"g1-017","g":1,"topic":"history","t":"Stars and Stripes","x":"The flag of the United States has stars and stripes. It has 13 stripes for the first 13 states. It has 50 stars, one for each state today. The colors are red, white, and blue. Long ago, the flag had only 13 stars. Our class has a flag by the window, and we look at it every morning."},
    {"id":"g1-018","g":1,"topic":"history","t":"George Washington","x":"George Washington was the first president of the United States. He lived on a farm in Virginia called Mount Vernon. He liked to ride horses. Today his face is on the one dollar bill and the quarter. The city of Washington, D.C., is named after him. I saw his picture in my book, and he had white hair."},
    {"id":"g1-019","g":1,"topic":"history","t":"Toys From Long Ago","x":"Long ago, children did not have toys with batteries. They played with wooden tops, dolls, and marbles. Some kids made their own toys from sticks and string. My grandma played jump rope with her friends. She showed me how to play, and I jumped ten times. Old games are still fun to play today."},
    {"id":"g1-020","g":1,"topic":"history","t":"Abraham Lincoln","x":"Abraham Lincoln was the 16th president of the United States. He grew up in a small log cabin. He loved to read books, and he read by the light of the fire. He was very tall, and he often wore a tall black hat. His face is on the penny. I have a penny in my pocket right now."},
    {"id":"g1-021","g":1,"topic":"world","t":"Hello Around the World","x":"People say hello in many ways. In Mexico, people say hola. In France, they say bonjour. In Japan, people may bow to say hello. In the United States, we often wave or shake hands. My friend Mia speaks two languages. She taught me to say hello in Spanish, and now I say hola to her every day."},
    {"id":"g1-022","g":1,"topic":"world","t":"A Map of My Town","x":"A map is a drawing of a place. It shows where things are. Our class made a map of our town. We drew the school, the park, and the library. I drew the river in blue. Jake drew the roads in black. A map can help you find your way. Then you will not get lost."},
    {"id":"g1-023","g":1,"topic":"world","t":"Visiting Canada","x":"Canada is a country north of the United States. It is very big. Its flag is red and white, and it has a red maple leaf. Many people in Canada speak English, and some speak French. My uncle lives in Canada. When we visited him, we saw snow, lakes, and tall trees."},
    {"id":"g1-024","g":1,"topic":"world","t":"Seven Continents","x":"Earth has seven continents. They are Africa, Antarctica, Asia, Australia, Europe, North America, and South America. We live in North America. Asia is the biggest continent. Antarctica is the coldest, and it is covered with ice. Penguins live there, but very few people do."},
    {"id":"g1-025","g":1,"topic":"everyday","t":"My First Day of School","x":"On my first day of school, I felt a little shy. My mom walked me to the door. My teacher, Mrs. Lee, smiled and said hello. I sat next to a boy named Ben. We drew pictures, read a book, and played outside. At lunch, Ben shared his grapes with me. By the end of the day, I had a new friend."},
    {"id":"g1-026","g":1,"topic":"everyday","t":"Making a Jam Sandwich","x":"Here is how to make a jam sandwich. First, get two slices of bread. Next, spread jam on one slice. Then put the other slice on top. Cut it in half, so it is easy to hold. Now your sandwich is ready to eat. I like to make one for my little brother, and he says it is yummy."},
    {"id":"g1-027","g":1,"topic":"everyday","t":"Helping at Home","x":"I help my family at home. Every day, I make my bed and feed our cat. On Saturday, I help Dad wash the dishes. My sister sweeps the floor, and I put away the toys. When we all help, the work goes fast. Then we have time to play a game together."},
    {"id":"g1-028","g":1,"topic":"everyday","t":"A Birthday Party","x":"Today is my birthday, and I am seven. My friends came to my house for a party. We played games and ate cake. The cake was chocolate with blue frosting. I blew out all the candles at once. Then I opened my gifts. My grandpa gave me a kite. We flew it in the yard."},
    {"id":"g1-029","g":1,"topic":"sports","t":"Playing Soccer","x":"Soccer is a fun game. Two teams try to kick a ball into a net. You cannot use your hands, but the goalie can. On Saturday, I played soccer with my team. I ran fast and kicked the ball. It went into the net, and everyone cheered. After the game, we had orange slices."},
    {"id":"g1-030","g":1,"topic":"sports","t":"Learning to Swim","x":"This summer, I learned how to swim. At first, I was scared of the deep water. My coach, Mr. Diaz, showed me how to kick my legs. Then I learned to move my arms. I practiced every day at the pool. Now I can swim all the way across. I am proud of myself."},
    {"id":"g1-031","g":1,"topic":"sports","t":"Tag at Recess","x":"At recess, we like to play tag. One kid is it. That kid runs and tries to tag the others. If you get tagged, then you are it. Lily is very fast, so it is hard to tag her. I hid behind the slide, but Omar found me. We played until the bell rang."},
    {"id":"g1-032","g":1,"topic":"sports","t":"Riding My Bike","x":"I got a new bike for my birthday. It is red with a silver bell. At first, I used training wheels. Then my dad took them off. He held the seat while I rode. I wobbled, but I did not fall. Now I ride my bike to the park. I always wear my helmet to keep my head safe."},
    {"id":"g1-033","g":1,"topic":"arts","t":"Mixing Colors","x":"Red, yellow, and blue are called primary colors. You can mix them to make new colors. Red and yellow make orange. Blue and yellow make green. Red and blue make purple. In art class, I mixed paint on a plate. I painted a green tree and an orange sun. My teacher hung it on the wall."},
    {"id":"g1-034","g":1,"topic":"arts","t":"The Class Play","x":"Our class put on a play about three little pigs. I was the wolf, and I wore a gray mask. Ella, Max, and Rosa were the pigs. We practiced our lines for two weeks. On the big day, our families came to watch. I was nervous, but I said all my lines. At the end, everyone clapped."},
    {"id":"g1-035","g":1,"topic":"arts","t":"Drums and Bells","x":"Music can be loud or soft. It can be fast or slow. In music class, we play drums, bells, and shakers. I like the drum best, because it goes boom. My friend Kim plays the bells. When we play together, it sounds like a song. Then we sing, and our teacher plays the piano."},
    {"id":"g1-036","g":1,"topic":"arts","t":"A Trip to the Library","x":"On Friday, our class went to the library. There were so many books on the shelves. I found a book about sharks, and Leo found a book about trucks. The librarian read us a story about a lost duck. Then we got to check out books. I took my book home and read it to my dad."},
    {"id":"g1-037","g":1,"topic":"inventions","t":"The Wheel","x":"The wheel is a very old invention. People made wheels thousands of years ago. Wheels help us move heavy things. Cars, bikes, and buses all have wheels. A wagon has four wheels. I pull my little sister in our wagon. It is much easier than carrying her!"},
    {"id":"g1-038","g":1,"topic":"inventions","t":"The Telephone","x":"Long ago, Alexander Graham Bell made one of the first telephones. With a telephone, people can talk to someone far away. The first phones were big, and they hung on the wall. Today, many phones are small enough to fit in a pocket. I call my grandma on the phone every Sunday. She tells me jokes, and I laugh."},
    {"id":"g1-039","g":1,"topic":"inventions","t":"Light Bulbs","x":"A light bulb helps us see at night. Long ago, people used candles and oil lamps. Then Thomas Edison and other inventors worked on light bulbs. Edison made a bulb that could glow for a long time. Now we just flip a switch, and the room gets bright. I have a small lamp by my bed."},
    {"id":"g1-040","g":1,"topic":"inventions","t":"How Umbrellas Help","x":"An umbrella keeps you dry in the rain. It opens up like a big flower. The top is made of cloth that water cannot get through. The rain rolls off the edges. When the rain stops, you close it up. I have a green umbrella with frogs on it. I take it to school on rainy days."},
    {"id":"g2-001","g":2,"topic":"animals","t":"How Bees Make Honey","x":"Honeybees live together in a hive. A hive can have thousands of bees. The worker bees fly from flower to flower. They drink a sweet juice called nectar. Then they carry it back to the hive and turn it into honey. Bees also help flowers make seeds. When they visit a flower, they carry yellow dust called pollen to the next one. Without bees, we would have fewer apples, berries, and pumpkins."},
    {"id":"g2-002","g":2,"topic":"animals","t":"A Letter About Owls","x":"Dear Grandpa,\n\nToday our class learned about owls. Owls hunt at night, and they sleep in the day. They have big eyes, so they can see in the dark. An owl can turn its head very far to look behind it. Its feathers are soft, so it flies without making a sound. I drew a picture of a barn owl for you. I will bring it when we visit you in June.\n\nLove, Nora"},
    {"id":"g2-003","g":2,"topic":"animals","t":"Elephants and Their Trunks","x":"Elephants are the biggest animals that live on land. They use their long trunks in many ways. An elephant can pick up food, drink water, and spray dust on its back with its trunk. Elephants eat grass, leaves, fruit, and bark. They eat for many hours each day. Baby elephants stay close to their mothers. The whole family helps take care of them, so the babies are safe."},
    {"id":"g2-004","g":2,"topic":"animals","t":"Our Class Hamster","x":"Our class has a hamster named Peanut. He is brown and white, and he has tiny pink feet. Every week, a different student takes care of him. Last week, it was my turn. I gave Peanut fresh water and food, and I cleaned his cage. At night, Peanut likes to run on his wheel. He stuffs seeds in his cheeks to save them for later. I was sad when my week ended, but I will get another turn soon."},
    {"id":"g2-005","g":2,"topic":"science","t":"Sink or Float","x":"Some things float in water, and some things sink. Our class did a test with a tub of water. We dropped in a cork, a coin, a leaf, and a rock. The cork and the leaf floated on top. The coin and the rock sank to the bottom. Big ships are very heavy, but they float because of their shape. Next week, we will make little boats out of foil and see which one holds the most pennies."},
    {"id":"g2-006","g":2,"topic":"science","t":"Shadows on the Playground","x":"A shadow forms when something blocks light. In the morning, my shadow on the playground was very long. At lunch, the sun was high in the sky, and my shadow was short. After school, it was long again. My friend Jada and I made shadow shapes with our hands. She made a bird, and I made a dog. When a cloud covered the sun, our shadows went away."},
    {"id":"g2-007","g":2,"topic":"science","t":"Three Kinds of Water","x":"Water can be a solid, a liquid, or a gas. Ice is solid water. It is hard, and it keeps its shape. The water in your cup is a liquid, so it takes the shape of the cup. When water boils, it turns into a gas called water vapor. You cannot see it, but it goes up into the air. Water changes from one form to another when it gets hotter or colder."},
    {"id":"g2-008","g":2,"topic":"science","t":"Bones and Muscles","x":"Your body has more than 200 bones. Bones hold you up and give your body its shape. Muscles are attached to bones, and they pull on them to make you move. When you run, jump, or wave, your muscles are working. Your heart is a muscle too. It pumps blood all day and all night. To keep your bones and muscles strong, eat healthy food, drink water, and play outside."},
    {"id":"g2-009","g":2,"topic":"space","t":"The Red Planet","x":"Mars is the fourth planet from the Sun. People call it the Red Planet, because its dust and rocks are reddish. Mars is smaller than Earth, and it is much colder. It has the biggest volcano we know of in our solar system. Its name is Olympus Mons. Scientists have sent rovers to Mars. A rover is a robot car that drives around and takes pictures. Someday, people might visit Mars too."},
    {"id":"g2-010","g":2,"topic":"space","t":"The Changing Moon","x":"The Moon does not make its own light. It shines because sunlight bounces off it. As the Moon goes around Earth, we see different parts of its bright side. Sometimes we see a whole circle, and that is a full moon. Sometimes we see only a thin curve, and that is a crescent. It takes about a month for the Moon to go through all its shapes. I drew the Moon every night for two weeks, and I saw it change."},
    {"id":"g2-011","g":2,"topic":"space","t":"My Planetarium Trip","x":"Dear Diary,\n\nToday my family went to the planetarium. We sat in soft seats and looked up at a big round ceiling. The lights went off, and stars filled the dome. A guide showed us Saturn and its rings. She said Jupiter is the biggest planet, and it has a giant storm called the Great Red Spot. My brother liked the comets best, but I liked the part about the Sun. I want to go back next year."},
    {"id":"g2-012","g":2,"topic":"space","t":"Life on the Space Station","x":"The International Space Station flies high above Earth. Astronauts live and work there for months at a time. Inside, everything floats, so they strap themselves into sleeping bags at night. They drink from pouches, because water would float away from a cup. The station goes around Earth about 16 times every day. That means the astronauts can see many sunrises and sunsets."},
    {"id":"g2-013","g":2,"topic":"earth","t":"Inside a Volcano","x":"A volcano is an opening in the ground. Deep under Earth's surface, it is so hot that rock melts. This melted rock is called magma. When a volcano erupts, the magma comes out, and then it is called lava. Lava is very hot, and it glows orange and red. When it cools, it turns into hard rock. Some islands, like the islands of Hawaii, were made by volcanoes over a very long time."},
    {"id":"g2-014","g":2,"topic":"earth","t":"Where Rain Comes From","x":"The sun warms the water in lakes, rivers, and oceans. Some of the water turns into a gas and rises into the sky. High up, the air is cool, so the gas turns back into tiny drops. The drops come together and make clouds. When the drops get big and heavy, they fall as rain or snow. Then the water flows back to the lakes and oceans. This is called the water cycle, and it happens again and again."},
    {"id":"g2-015","g":2,"topic":"earth","t":"Trees Through the Year","x":"Many trees change with the seasons. In spring, small buds open into green leaves. In summer, the leaves are big, and the tree makes lots of shade. In fall, the leaves on some trees turn yellow, orange, and red. Then they drop to the ground. In winter, those trees have bare branches. Pine trees are different, because they keep their needles all year. That is why people call them evergreens."},
    {"id":"g2-016","g":2,"topic":"earth","t":"A Windy Day","x":"On Saturday, the wind was very strong. It blew the leaves across our yard, and it made the trees bend. My brother and I took our kite to the hill. The wind lifted it high into the air. It flew higher than the tallest tree. Then a big gust pulled the string out of my hand. We chased the kite down the hill. Luckily, it landed in a bush, and we got it back."},
    {"id":"g2-017","g":2,"topic":"history","t":"Martin Luther King Jr.","x":"Martin Luther King Jr. was a leader who worked to make laws fair for all people. He gave many speeches. In his most famous speech, he talked about his dream that all people would be treated the same. He believed in peaceful ways to make changes, and many people marched with him. Today, we remember him on a holiday in January. Our class read a book about his life, and then we wrote about our own dreams."},
    {"id":"g2-018","g":2,"topic":"history","t":"Sacagawea Helps Explorers","x":"Sacagawea was a Shoshone woman who helped explorers long ago. In 1804, Meriwether Lewis and William Clark set out to explore the land in the West. In 1805, Sacagawea joined their trip with her baby son. She knew some of the land, and she spoke the Shoshone language. That helped the explorers talk to the people they met. Today, her picture is on a gold dollar coin."},
    {"id":"g2-019","g":2,"topic":"history","t":"The Statue of Liberty","x":"The Statue of Liberty stands in New York Harbor. It was a gift from the people of France to the United States. It was finished in 1886. The statue is a woman holding a torch high in her right hand. In her left hand, she holds a tablet. The statue is made of copper. It used to be shiny and brown, but now it is green. Visitors can climb the steps inside it all the way up to the crown."},
    {"id":"g2-020","g":2,"topic":"history","t":"Schools Long Ago","x":"Long ago, many children went to school in a one-room schoolhouse. Kids of all ages sat in the same room with one teacher. They did not have paper notebooks, so they wrote on small slates with chalk. In winter, a big stove kept the room warm. Some children walked a long way to get there. My class visited an old schoolhouse, and I got to ring the bell."},
    {"id":"g2-021","g":2,"topic":"world","t":"Visiting Japan","x":"Japan is a country in Asia. It is made of many islands. Its biggest city is Tokyo, and it has very busy streets. Many people in Japan eat rice, fish, and noodles. They often eat with chopsticks. Mount Fuji is the tallest mountain in Japan, and it has snow on top for much of the year. In spring, people go to parks to see the pink cherry blossoms."},
    {"id":"g2-022","g":2,"topic":"world","t":"Using a Compass Rose","x":"Most maps have a compass rose. It shows which way is north, south, east, and west. North is usually at the top of the map. On a map of the United States, Canada is to the north, and Mexico is to the south. The Atlantic Ocean is to the east, and the Pacific Ocean is to the west. I used a compass rose to find my way on a map of the zoo. The lions were east of the gate."},
    {"id":"g2-023","g":2,"topic":"world","t":"A Pen Pal in Kenya","x":"Dear Amara,\n\nThank you for your letter! I liked learning about Kenya. You said that you can see giraffes and zebras near your town. That is so cool. Here in Ohio, we see deer, squirrels, and lots of birds. It snowed last week, and I built a fort. Do you ever get snow? Please tell me about your school and your favorite food.\n\nYour friend, Leo"},
    {"id":"g2-024","g":2,"topic":"world","t":"The Great Wall of China","x":"The Great Wall of China is very long. It winds over mountains, hills, and deserts. People built it a long time ago to protect their land. Many workers added to it over hundreds of years. Some parts are made of stone and brick. Others are made of dirt that was pressed down hard. Today, lots of visitors come from around the world to walk on the wall."},
    {"id":"g2-025","g":2,"topic":"everyday","t":"Our Family Garden","x":"This spring, my family started a garden in our backyard. First, we pulled out the weeds. Then we dug holes and planted tomatoes, carrots, and beans. My job is to water the plants after school. Last week, I saw the first red tomato. My mom picked it, and we cut it into slices. It tasted better than the tomatoes from the store. I can't wait to pick the carrots."},
    {"id":"g2-026","g":2,"topic":"everyday","t":"How to Make Lemonade","x":"Here is how to make lemonade with a grown-up. First, cut four lemons in half. Then squeeze the juice into a big pitcher. Next, add half a cup of sugar and four cups of cold water. Stir it with a long spoon until the sugar is gone. Taste it to see if you need more sugar. Last, add some ice. Pour a glass for yourself and your friends, and enjoy it on a hot day."},
    {"id":"g2-027","g":2,"topic":"everyday","t":"The Lost Lunchbox","x":"On Tuesday, I could not find my lunchbox. I looked in my backpack, under my desk, and in the coat room. It was not there. My stomach started to growl. Then my friend Sofia asked if I had checked the bus. I ran to the office, and the bus driver had left it there for me. I was so happy. I said thank you, and then I ate my lunch with Sofia."},
    {"id":"g2-028","g":2,"topic":"everyday","t":"Thanksgiving at Grandma's","x":"Every year, we go to my grandma's house for Thanksgiving. My aunts, uncles, and cousins come too. The house smells like turkey, bread, and pie. Before we eat, everyone says one thing they are thankful for. I said I was thankful for my cousins. After dinner, we played board games, and Grandpa told funny stories. It was late when we drove home, so I fell asleep in the car."},
    {"id":"g2-029","g":2,"topic":"sports","t":"Basketball Basics","x":"Basketball was invented in 1891 by James Naismith. The first hoops were peach baskets! Today, two teams play on a court. Players bounce the ball, and that is called dribbling. They pass it to their teammates and try to shoot it through the hoop. A basket usually counts for two points. A shot from far away counts for three. My team practices on Tuesdays, and I am getting better at free throws."},
    {"id":"g2-030","g":2,"topic":"sports","t":"Field Day Fun","x":"Field Day was the best day of the year. Our whole school went outside to play games. First, we ran a sack race. I fell down once, but I got up and finished. Next, we had a relay race, and my team came in second. Then we played tug of war against the other second grade class. We pulled as hard as we could, and we won! After that, we ate frozen treats in the shade."},
    {"id":"g2-031","g":2,"topic":"sports","t":"Learning Chess","x":"Chess is a game for two players. Each player has 16 pieces. There are pawns, rooks, knights, bishops, a queen, and a king. Each piece moves in its own way. The knight is the only piece that can jump over others. The goal is to trap the other player's king. My grandpa taught me how to play. At first, he won every game, but last night I beat him for the first time."},
    {"id":"g2-032","g":2,"topic":"sports","t":"Ice Skating With Dad","x":"In winter, our town turns the park into an ice rink. Last Sunday, I went skating with my dad. My skates were tight, and my ankles felt wobbly. I held on to the wall and took small steps. Dad showed me how to glide on one foot and then the other. Soon I could skate without holding on. I fell two times, but I laughed and got back up. Then we drank hot cocoa to warm up."},
    {"id":"g2-033","g":2,"topic":"arts","t":"Making a Clay Pot","x":"In art class, we made pots out of clay. First, I rolled the clay into a ball. Then I pushed my thumbs into the middle to make a hole. I pinched the sides to make them thin and even. My teacher put our pots in a hot oven called a kiln. The heat made the clay hard. The next week, I painted my pot blue and green. Now it sits on our kitchen table, and Mom keeps her keys in it."},
    {"id":"g2-034","g":2,"topic":"arts","t":"The Orchestra","x":"An orchestra is a big group of musicians who play together. The instruments are put into families. Violins and cellos are in the string family. Flutes and clarinets are in the woodwind family. Trumpets and tubas are brass, and drums are percussion. The leader is called the conductor. She stands in front and waves a thin stick called a baton. It helps everyone keep the same beat."},
    {"id":"g2-035","g":2,"topic":"arts","t":"We Made Our Own Books","x":"Our class wrote and made our own books. First, we thought of an idea for a story. My story was about a turtle who wanted to fly. Then I wrote the words on each page. Next, I drew pictures to go with them. I made the cover out of thick paper and used a stapler to hold it together. When we were done, we shared our books with the first graders. They laughed at my turtle."},
    {"id":"g2-036","g":2,"topic":"arts","t":"Who Was Mozart?","x":"Wolfgang Amadeus Mozart was a famous composer. A composer is a person who writes music. Mozart was born in Austria in 1756. He started playing music when he was very young. By the time he was five, he was writing his own songs. When he grew up, he wrote more than 600 pieces of music. People around the world still play his music today."},
    {"id":"g2-037","g":2,"topic":"inventions","t":"The Wright Brothers","x":"Orville and Wilbur Wright were brothers who loved to build things. They had a shop where they fixed bikes. They also wanted to make a machine that could fly. They tested gliders for years. On December 17, 1903, they flew the first airplane with an engine at Kitty Hawk, North Carolina. The first flight lasted only 12 seconds, but it changed the world. Today, planes carry people all over the globe."},
    {"id":"g2-038","g":2,"topic":"inventions","t":"The Printing Press","x":"Long ago, books were copied by hand. It took a very long time to make just one. Then, around 1440, a man named Johannes Gutenberg made a printing press in Germany. It used little metal letters that could be moved around to make words. Workers put ink on the letters and pressed paper on top. Now many copies of a page could be made fast. Soon books were cheaper, and more people learned to read."},
    {"id":"g2-039","g":2,"topic":"inventions","t":"Robots That Help","x":"A robot is a machine that can do jobs. A person writes instructions, called code, to tell the robot what to do. Some robots work in factories, and they put cars together. Some robots vacuum the floor. Others explore places that are hard for people to reach, like the bottom of the ocean or the surface of Mars. In our class, we built a small robot. We told it to move forward, turn left, and stop."},
    {"id":"g2-040","g":2,"topic":"inventions","t":"How a Pencil Works","x":"Pencils are simple tools, but they are very useful. The inside of a pencil is called the lead, but it is not really lead. It is made of graphite mixed with clay. When you press it on paper, tiny bits of graphite rub off and leave a mark. The outside is made of wood. Many pencils have an eraser on the end, so you can fix your mistakes. I use about three pencils every month at school."},
    {"id":"g3-001","g":3,"topic":"animals","t":"How Bats Find Their Food","x":"Bats come out at night to hunt for food. Most bats eat insects, like moths, beetles, and mosquitoes. But how do they find tiny bugs in the dark?\n\nMany bats use sound to help them. A bat makes high squeaks that people cannot hear. The sound bounces off a bug and comes back to the bat's ears. Then the bat knows where the bug is, and it flies over to catch it. This is called echolocation. One little bat can eat hundreds of insects in a single night, so bats are good friends to farmers."},
    {"id":"g3-002","g":3,"topic":"animals","t":"My Visit to the Penguins","x":"Last Saturday, my aunt took me to the aquarium in Boston. I wanted to see the penguins more than anything else. When we got there, the penguins were swimming fast in their tank. They looked like they were flying under the water!\n\nA helper told us that penguins are birds, but they cannot fly in the air. Their wings work like flippers instead. I watched one penguin dive, turn, and zoom back to the top. Before we left, I bought a small book about penguins. I read it in the car on the way home."},
    {"id":"g3-003","g":3,"topic":"animals","t":"Busy Honeybees","x":"Honeybees live together in a big group called a colony. Each colony has one queen bee. She lays all of the eggs. The worker bees do almost everything else. They clean the hive, feed the young bees, and make wax.\n\nWorker bees also fly from flower to flower to collect nectar. Back at the hive, they turn the nectar into honey. Bees need this honey for food in the winter. When a bee finds good flowers, it does a little dance. The dance tells the other bees where to go. Isn't that clever?"},
    {"id":"g3-004","g":3,"topic":"animals","t":"The Tallest Animal","x":"The giraffe is the tallest animal on land. A grown giraffe can be taller than a one-story house. Giraffes live in Africa, where they walk across wide, grassy plains.\n\nA giraffe uses its long neck to reach leaves at the tops of trees. Its favorite tree is the acacia, which has sharp thorns. That does not stop the giraffe! Its long, tough tongue can wrap around the leaves and pull them off. Giraffes only need to sleep a few hours each day. They often rest standing up, so they can run if they see danger."},
    {"id":"g3-005","g":3,"topic":"science","t":"Why Ice Floats","x":"Have you ever put ice cubes in a glass of water? The ice floats at the top. Most things get heavier for their size when they freeze, but water is different.\n\nWhen water freezes, it spreads out and takes up more space. That makes ice lighter than the same amount of water, so it floats. This is very important for fish. In winter, ice forms on top of ponds and lakes. The ice works like a lid, and the water below it stays liquid. The fish can keep swimming all winter long."},
    {"id":"g3-006","g":3,"topic":"science","t":"The Magnet Test","x":"On Monday, our class did a science test with magnets. Our teacher, Mr. Lopez, gave each group a bag of objects. We had a paper clip, a penny, a nail, a pencil, and a spoon.\n\nFirst, we guessed which things the magnet would pick up. Then we tried each one. The paper clip and the nail jumped right to the magnet. The pencil and the penny did not move at all. I was surprised that the spoon did not stick. Mr. Lopez said magnets only pull on some metals, like iron. Now I want to test everything in my house!"},
    {"id":"g3-007","g":3,"topic":"science","t":"How Plants Drink","x":"Plants need water to live, but they do not have mouths. So how do they drink? The answer is in their roots.\n\nRoots grow down into the soil. They have tiny hairs that soak up water. The water moves up through the stem, like juice going up a straw. Then it travels out to the leaves. You can see this for yourself. Put a stalk of celery in a cup of water with a few drops of food coloring. Wait a day, and then look at the leaves. They will turn the same color as the water!"},
    {"id":"g3-008","g":3,"topic":"science","t":"Sound Is Shaking","x":"Every sound you hear starts with something shaking. When you pluck a guitar string, it moves back and forth very fast. This is called vibrating. The string makes the air around it shake too, and the shaking air travels to your ears.\n\nTry this at home. Put your fingers on your throat and hum a song. Can you feel the buzzing? That is your voice box vibrating. Fast vibrations make high sounds, like a bird's chirp. Slow vibrations make low sounds, like a big drum. Sound can also travel through water, wood, and even walls."},
    {"id":"g3-009","g":3,"topic":"space","t":"Our Neighbor Mars","x":"Mars is the fourth planet from the Sun. People call it the Red Planet because its dirt and rocks are a rusty red color. Mars is smaller than Earth, and it is much colder there.\n\nMars has the biggest volcano in our solar system. It is called Olympus Mons, and it is more than twice as tall as Mount Everest. Scientists have sent robot rovers to drive around on Mars. The rovers take pictures, dig in the dirt, and send their findings back to Earth. Someday, people might visit Mars too."},
    {"id":"g3-010","g":3,"topic":"space","t":"The Night I Saw Saturn","x":"Last summer, my grandpa set up his telescope in the backyard. He pointed it at a bright dot in the sky. \"Take a look,\" he said. I closed one eye and looked through the tube.\n\nThere was Saturn, with its rings all around it! It looked like a tiny toy. Grandpa told me the rings are made of ice and rock. Some pieces are as small as sand, and some are as big as a house. We stayed outside until it was late. I will never forget the night I saw Saturn with my own eyes."},
    {"id":"g3-011","g":3,"topic":"space","t":"Why We Have Day and Night","x":"Earth is always spinning, like a top. It takes about 24 hours to spin around one time. As Earth turns, one side faces the Sun. On that side, it is day. The other side faces away from the Sun, so it is night there.\n\nThe Sun looks like it moves across the sky, but it does not really move. We are the ones moving! In the morning, our side of Earth turns toward the Sun, and we see it rise. In the evening, we turn away, and the Sun seems to set. Then the stars come out."},
    {"id":"g3-012","g":3,"topic":"space","t":"Footprints on the Moon","x":"In July 1969, two astronauts landed on the Moon. Their names were Neil Armstrong and Buzz Aldrin. Neil Armstrong was the first person to step onto the Moon's dusty ground.\n\nThe Moon has no wind or rain. Because of that, the footprints the astronauts made are still there today. The astronauts collected rocks, took pictures, and put up a flag. They also hopped around, because the Moon's pull is much weaker than Earth's. After their walk, they flew back home. Millions of people watched the landing on TV."},
    {"id":"g3-013","g":3,"topic":"earth","t":"What Makes a Rainbow","x":"After a rain shower, you might see a rainbow in the sky. A rainbow appears when sunlight shines through tiny drops of water in the air. Sunlight looks white, but it is really made of many colors mixed together.\n\nWhen light passes through a raindrop, the drop bends the light and splits it into colors. The colors always come in the same order. They are red, orange, yellow, green, blue, indigo, and violet. To see a rainbow, stand with the Sun behind you. You can even make one with a garden hose on a sunny day."},
    {"id":"g3-014","g":3,"topic":"earth","t":"A Volcano Wakes Up","x":"Deep under the ground, it is so hot that some rock melts. This melted rock is called magma. Sometimes the magma pushes up through a crack in Earth's crust. When it comes out, we call it lava, and the place where it comes out is a volcano.\n\nThe state of Hawaii is made of volcanoes. In fact, the islands were built by lava that cooled and hardened over a very long time. Some of Hawaii's volcanoes are still active today. Scientists watch them closely, so they can warn people before lava starts to flow."},
    {"id":"g3-015","g":3,"topic":"earth","t":"Our Class Garden","x":"This spring, our class planted a garden behind the school. We grew beans, carrots, and sunflowers. Every morning, two kids took turns watering the plants.\n\nAt first, nothing happened. Then tiny green sprouts poked out of the dirt. My friend Maya and I measured the sunflowers every week. By June, they were taller than our teacher! We learned that plants need sunlight, water, air, and good soil to grow. On the last day of school, we picked the beans and shared them with our families. I can't wait to plant again next year."},
    {"id":"g3-016","g":3,"topic":"earth","t":"Life in a Tide Pool","x":"When the ocean tide goes out, it leaves small pools of water in the rocks. These are called tide pools. Many little animals live there, like crabs, snails, and sea stars.\n\nLife in a tide pool is not easy. The water gets warm in the sun, and waves crash over the rocks. The animals have smart ways to stay safe. Crabs hide under rocks. Snails close up tight inside their shells. Sea stars hold on with hundreds of tiny tube feet. If you visit a tide pool, look closely, but leave the animals in their home."},
    {"id":"g3-017","g":3,"topic":"history","t":"Ben Franklin's Kite","x":"Benjamin Franklin lived in Philadelphia over 250 years ago. He was a printer, a writer, and an inventor. He also loved to ask questions about the world.\n\nFranklin wondered if lightning was a kind of electricity. In 1752, he tried a famous test with a kite during a storm. Franklin learned that lightning really is electricity. Then he invented the lightning rod. It is a metal pole on top of a building that carries lightning safely into the ground. Lightning rods still protect many buildings today."},
    {"id":"g3-018","g":3,"topic":"history","t":"A Letter from the Oregon Trail","x":"Dear Grandma,\n\nWe have been on the trail for two months now. Our wagon is pulled by four oxen, and I walk next to it most days. Yesterday, we crossed a wide river. Papa was worried, but we all made it across safely.\n\nAt night, the families park their wagons in a big circle. We cook beans and bread over the fire, and then we sing songs. I miss you and our old house in Missouri. Mama says we will reach Oregon before the snow comes. I will write again soon.\n\nLove, Sarah"},
    {"id":"g3-019","g":3,"topic":"history","t":"The First Thanksgiving","x":"In 1620, a group of people called the Pilgrims sailed from England to America. Their ship was named the Mayflower. They landed in a place that is now Massachusetts.\n\nThe first winter was very hard, and they did not have enough food. The Wampanoag people lived nearby. A man named Squanto showed the Pilgrims how to plant corn and catch fish. In the fall of 1621, the Pilgrims had a good harvest. They held a big feast, and the Wampanoag joined them. Today, many Americans remember this feast on Thanksgiving."},
    {"id":"g3-020","g":3,"topic":"history","t":"Harriet Tubman's Brave Trips","x":"Harriet Tubman was born into slavery in Maryland around 1822. When she was a young woman, she escaped to the North, where she could be free. But she did not stop there.\n\nTubman went back south many times to help others escape. She led them along a secret path called the Underground Railroad. It was not a real train. It was a group of safe houses and helpers. Tubman traveled at night and used the North Star to find her way. She helped about 70 people reach freedom, and she never lost a single one."},
    {"id":"g3-021","g":3,"topic":"world","t":"Hello from Japan","x":"Japan is a country in Asia made up of many islands. Its capital city is Tokyo, which is one of the biggest cities in the world. Japan also has a famous mountain called Mount Fuji.\n\nIn Japan, many people eat with chopsticks. Rice, fish, and noodles are popular foods. When people meet, they often bow instead of shaking hands. Every spring, cherry trees bloom with pink flowers all over the country. Families and friends have picnics under the trees to enjoy the blossoms. Would you like to visit Japan someday?"},
