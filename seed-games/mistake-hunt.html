    {"id":"g8-024","g":8,"topic":"world","t":"Market Day in Marrakech","x":"On the third day of our trip to Morocco, my mom and I explored the markets of Marrakech. The old part of the city is surrounded by thick red walls, and inside them, there is a maze of narrow, winding alleys called souks. Each section seemed to sell something different, and I quickly lost track of where we were.\n\nIn one alley, shopkeepers sold spices piled in colorful mounds, and the air smelled of ginger, cinnamon, and mint. In another, there were rows of leather bags, brass lamps, and handwoven rugs in every pattern you can imagine. A man showed us how he hammered designs into metal plates, and he let me try it. My design was crooked, but he smiled and said it was very good for a beginner.\n\nThat evening, we went to the city's huge main square. It was filled with food stalls, musicians, and storytellers, and the smoke from the grills drifted over the crowd. We drank sweet mint tea and watched the sun set behind the Atlas Mountains. It was the best day of the whole trip."},
    {"id":"g8-025","g":8,"topic":"everyday","t":"The Thanksgiving Kitchen Crew","x":"Every year, my grandmother hosts Thanksgiving dinner for our entire family, and that means twenty-two people squeezed into her house. This year, she decided I was old enough to join what she calls the kitchen crew, so I arrived at seven in the morning with my apron and a lot of nervous energy.\n\nMy first job was peeling potatoes, and there were more of them than I could count. Then my cousin Diego and I chopped celery and onions for the stuffing while my aunt made the cranberry sauce from scratch. Grandma was in charge of the turkey, and she checked on it every half hour like it was a baby.\n\nThings didn't go perfectly. I accidentally added sugar instead of salt to the mashed potatoes, and we had to start that batch over. However, by three o'clock, the table was covered with food, and everyone was gathered around it. Before we ate, Grandma thanked the kitchen crew by name. I've never been so tired, but I've also never been so proud of a bowl of potatoes."},
    {"id":"g8-026","g":8,"topic":"everyday","t":"Learning to Budget","x":"When I turned thirteen, my parents started giving me a weekly allowance of fifteen dollars. At first, I spent it as soon as I got it. I bought snacks after school, games for my phone, and things I didn't really need, so by the middle of the week, I usually had nothing left.\n\nThen I decided I wanted a new pair of running shoes, and they cost ninety dollars. My dad suggested that I try a simple budget. Every week, I put five dollars into a jar for savings, set aside three dollars to give to a local animal shelter, and kept the rest to spend. I also wrote down everything I bought in a small notebook.\n\nKeeping track was eye-opening. I realized that I was spending more on snacks than on anything else, so I started bringing them from home. It took me about four months, but I finally bought the shoes with my own money. Now I'm saving for a bike, and I feel much more in control than I did before."},
    {"id":"g8-027","g":8,"topic":"everyday","t":"How to Study for a Big Test","x":"A big test can feel overwhelming, but a good plan makes it much easier. Here are some strategies that really work.\n\nFirst, start early. Cramming the night before might help you remember facts for a few hours, but your brain learns better when you study in short sessions spread over several days. Try reviewing for twenty or thirty minutes a day for a week instead of studying for three hours at once.\n\nNext, test yourself instead of just rereading your notes. Make flash cards, answer the practice questions at the end of each chapter, or explain the topic out loud to a friend or family member. If you can teach it, you probably understand it.\n\nFind a quiet place to work, and put your phone in another room so it won't distract you. Take short breaks, drink water, and eat a healthy snack. Finally, get plenty of sleep, especially the night before the test. Your brain sorts and stores what you learned while you sleep, so rest is part of studying too."},
    {"id":"g8-028","g":8,"topic":"everyday","t":"A Letter to My Grandfather","x":"Dear Grandpa,\n\nThank you so much for the birthday card and the old fishing tackle box. Mom told me it was the same one you used when you were my age, so I'll take good care of it. I already put my hooks, lures, and extra line inside it.\n\nSchool has been busy this fall. I'm taking a coding class, and last week, we built a simple game where a cat has to catch falling fish. I thought you'd like that, since you're the one who taught me to fish in the first place. I'm also on the cross-country team, and at our last meet, I finished in eleventh place out of forty runners, which was my best time yet.\n\nI can't wait to visit you at the lake this summer. Could we try fishing at sunrise again, like we did last year? I still remember how calm and quiet the water was, and how we saw a heron standing in the reeds. Please tell Grandma that I miss her cooking, especially her blueberry pancakes.\n\nLove, Owen"},
    {"id":"g8-029","g":8,"topic":"sports","t":"The First Olympic Games","x":"The first recorded Olympic Games took place in 776 BC in Olympia, a site in southern Greece. At first, there was only one event, a short footrace of about 200 yards. Over time, the Greeks added longer races, wrestling, boxing, chariot races, and the pentathlon, which combined running, jumping, wrestling, and throwing the discus and the javelin.\n\nThe games were held every four years, and athletes traveled from all over the Greek world to compete. Winners didn't receive gold medals. Instead, they were crowned with wreaths made from olive branches, and they returned home as heroes.\n\nThe ancient games ended many centuries later, but they weren't forgotten. In the 1890s, a French educator named Pierre de Coubertin worked to bring them back, and the first modern Olympic Games were held in Athens in 1896. About 240 athletes from 14 countries competed. Today, thousands of athletes from more than 200 nations take part, and the Winter Games, which began in 1924, include sports such as skiing, skating, and hockey."},
    {"id":"g8-030","g":8,"topic":"sports","t":"The Science of a Curveball","x":"A good pitcher can make a baseball curve on its way to home plate, and the batter may swing at a ball that seems to drop or dart away at the last moment. This isn't magic. It's physics, and the secret is spin.\n\nWhen a pitcher throws a curveball, they flick their wrist so that the ball spins quickly as it leaves their hand. As the spinning ball flies forward, its raised red seams grab the air around it. On one side of the ball, the spin moves in the same direction as the passing air, and on the other side, it moves against it. This difference changes how the air flows around the ball, and it creates a force that pushes the ball sideways or down. Scientists call this the Magnus effect.\n\nThe same effect explains how soccer players bend a free kick around a wall of defenders and how tennis players use topspin to make the ball dip over the net. The faster the ball spins, the more it curves, so practice and a strong wrist make a big difference."},
    {"id":"g8-031","g":8,"topic":"sports","t":"Bottom of the Ninth","x":"It was the bottom of the ninth inning, and our team was losing by one run. There were two outs, a runner was on second base, and it was my turn to bat. As I walked to the plate, I could hear my teammates cheering, but my hands were shaking so much that I could barely hold the bat.\n\nThe first pitch was a fastball, and I swung too late. Strike one. The second pitch was low and outside, so I let it go. Then I stepped out of the batter's box and took a deep breath, just as Coach Romero had taught us. \"Watch the ball, and keep your swing short,\" I told myself.\n\nThe next pitch came straight down the middle. I swung, and I felt the solid crack of the bat before I even saw where the ball went. It flew over the shortstop's glove and bounced into left field. The runner on second raced around third and slid home just ahead of the throw. We had tied the game, and when Jasmine hit a double two pitches later, I ran home with the winning run."},
    {"id":"g8-032","g":8,"topic":"sports","t":"My First Climb","x":"For my thirteenth birthday, my aunt took me to an indoor climbing gym. I had always wanted to try rock climbing, but when I saw the walls, which were almost forty feet tall, my stomach did a flip.\n\nBefore we started, an instructor named Kayla taught us the basics. She showed us how to put on our harnesses, tie a figure-eight knot, and check each other's gear. She explained that a partner on the ground, called the belayer, holds the rope and catches you if you slip. \"Use your legs more than your arms,\" she said, \"because your legs are much stronger.\"\n\nMy first attempt didn't go well. I grabbed the holds too tightly, and my arms got tired halfway up, so I let go and swung gently back down. On my second try, I followed Kayla's advice, pushed with my legs, and took my time choosing each hold. When I finally slapped the top of the wall, I looked down and saw my aunt cheering below. Since then, I've climbed every weekend, and I'm already working on harder routes."},
    {"id":"g8-033","g":8,"topic":"arts","t":"Shakespeare's Globe Theatre","x":"William Shakespeare is one of the most famous writers in the English language, and many of his plays were first performed at the Globe Theatre in London. The Globe was built in 1599 near the south bank of the River Thames. It was a round, open-air building with three levels of seats and a stage that stuck out into the yard.\n\nGoing to a play at the Globe was a lively experience. The cheapest tickets cost a penny, and those audience members, called groundlings, stood in the yard right in front of the stage. Wealthier people paid more to sit in the covered galleries. There was no electric lighting, so plays were performed in the afternoon, and crowds often cheered, booed, and talked back to the actors.\n\nIn 1613, a cannon fired during a performance set the thatched roof on fire, and the theater burned down. Luckily, no one was hurt, and the Globe was rebuilt the next year. Centuries later, a careful reconstruction opened in 1997 close to the original site, and today, visitors can watch Shakespeare's plays there just as audiences did 400 years ago."},
    {"id":"g8-034","g":8,"topic":"arts","t":"Writing a Haiku","x":"A haiku is a very short poem that began in Japan. In English, haiku are often written in three lines, with five syllables in the first line, seven in the second, and five in the third. Many haiku describe a single moment in nature, and they often mention a season, such as the first snow of winter or a frog jumping into a pond.\n\nOne of the most famous haiku poets was Matsuo Basho, who lived in Japan in the 1600s. He traveled across the country on foot, and he wrote about the mountains, rivers, and people he saw along the way. His poems are simple, but they are full of feeling.\n\nWriting your own haiku is a good way to practice paying attention. First, go outside, or look out a window, and notice something small, like a leaf, a bird, or a puddle. Then describe it with clear, specific words instead of explaining how you feel. Count the syllables carefully, and don't be afraid to rewrite. A haiku is short, but choosing the right words can take time."},
    {"id":"g8-035","g":8,"topic":"arts","t":"Our Band's First Show","x":"My friends and I started a band last spring. Mateo plays the drums, Hannah plays the bass, and I play guitar and sing. For months, we practiced in Mateo's garage every Tuesday and Friday, and his neighbors were very patient with us.\n\nIn October, the school announced a talent show, and we decided to enter. We chose two songs, one that we wrote ourselves and one that we had loved for years. The week before the show, we practiced every single night. On the night of the show, though, I was so nervous that I almost forgot the words to the first verse.\n\nWhen the curtain opened, the lights were brighter than I expected, and I couldn't see the audience at all. Mateo counted us in, and as soon as we started playing, my nerves disappeared. Halfway through our second song, Hannah's bass string broke, but she kept playing on the other three strings, and nobody even noticed. When we finished, the crowd clapped and cheered so loudly that we just stood there grinning. We didn't win first place, but we've already started writing our next song."},
    {"id":"g8-036","g":8,"topic":"arts","t":"Making a Clay Bowl","x":"Making a bowl from clay takes patience, but the steps are easier than you might think. Here's how our art teacher, Ms. Okafor, taught us to do it with the pinch method.\n\nFirst, take a lump of clay about the size of a tennis ball, and knead it on the table for a few minutes. This pushes out air bubbles, which can cause the bowl to crack later. Then roll the clay into a smooth ball between your palms.\n\nNext, press your thumb into the center of the ball, but don't push all the way through. Hold the ball in one hand, and gently pinch the walls between your thumb and fingers as you turn it. Work your way around and up, little by little, until the walls are even and about as thick as a pencil.\n\nWhen you're happy with the shape, smooth the rim with a damp sponge, and carve your initials on the bottom. Let the bowl dry slowly for about a week. After that, it gets fired in a very hot oven called a kiln, and then you can paint it with glaze and fire it a second time to make it shiny."},
    {"id":"g8-037","g":8,"topic":"inventions","t":"Edison's Invention Factory","x":"Thomas Edison is one of the best-known inventors in American history. In 1876, he built a laboratory in Menlo Park, New Jersey, and he filled it with tools, chemicals, and a team of skilled workers. He wanted the lab to produce a new invention about every ten days, and some people called it an invention factory.\n\nIn 1877, Edison and his team built the phonograph, a machine that could record sound and play it back. The first words Edison recorded were from the nursery rhyme \"Mary Had a Little Lamb.\" People were amazed, and newspapers began calling him the Wizard of Menlo Park.\n\nEdison didn't invent the first electric light, but he worked hard to make one that was practical and long-lasting. His team tested thousands of materials for the thin thread inside the bulb, and in 1879, they found one that glowed for many hours. Edison then helped design power stations and wires to bring electricity into homes and businesses. By the end of his life, he held more than 1,000 patents in the United States."},
    {"id":"g8-038","g":8,"topic":"inventions","t":"How GPS Finds Your Location","x":"Whenever a phone or car shows your position on a map, it's probably using the Global Positioning System, or GPS. This system depends on about 30 satellites that circle Earth roughly 12,500 miles above the surface. They are arranged so that at least four of them are above the horizon almost anywhere on the planet.\n\nEach satellite carries a very precise atomic clock, and it constantly sends out signals that say what time it is and where the satellite is. A GPS receiver, like the one in your phone, picks up these signals. Since the signals travel at the speed of light, the receiver can measure how long each one took to arrive, and then it figures out how far away each satellite is.\n\nWith the distance to one satellite, the receiver knows only that it is somewhere on a giant sphere. With three satellites, it can narrow its position down to a single point, and a fourth satellite helps correct small timing errors. The whole process takes just a few seconds, and it can find your location to within a few feet."},
    {"id":"g8-039","g":8,"topic":"inventions","t":"The Telephone's First Words","x":"Alexander Graham Bell was born in Scotland in 1847, and he later moved to North America. His mother was deaf, and his father taught speech, so Bell grew up fascinated by sound and how people hear it. As a young man, he taught deaf students in Boston, and in his spare time, he experimented with ways to send sound through wires.\n\nBell worked with a skilled machinist named Thomas Watson, and together they built and tested many devices. In 1876, Bell received a patent for the telephone. A few days later, he spoke into his new invention while Watson waited in another room. According to Bell's notes, his first words were, \"Mr. Watson, come here, I want to see you.\" Watson heard him clearly and came running.\n\nAt first, some people thought the telephone was just a toy. Within a few years, however, telephone lines were being built in cities across the United States and Europe. Bell also went on to work on other inventions, including early flying machines and devices that sent sound using beams of light."},
    {"id":"g8-040","g":8,"topic":"inventions","t":"From Abacus to Laptop","x":"People have used tools to help them calculate for thousands of years. One of the earliest was the abacus, a frame with rows of beads that slide back and forth. Merchants in ancient China, Rome, and other places used it to add, subtract, and keep track of their goods.\n\nIn the 1830s, an English mathematician named Charles Babbage designed a machine that he called the Analytical Engine. It was meant to follow instructions punched into cards, and his friend Ada Lovelace wrote what many people consider the first computer program for it. The machine was never finished, but their ideas were far ahead of their time.\n\nThe first electronic computers appeared in the 1940s. One of them, called ENIAC, filled a large room and weighed about 30 tons. It used thousands of glass tubes that often burned out. Later, inventors replaced those tubes with tiny parts called transistors, and then they learned to place millions of transistors on a single chip of silicon. Today, a laptop or phone is far more powerful than ENIAC, and it fits in your backpack or your pocket."}

    if (k === 'use' && turn) { chatApply(turn); chatRender(); return; }
    if (k === 'retry' && turn) return chatSend(turn.text, turn.id);
    if (k === 'edit' && turn) { CH.el.input.value = turn.text; chatSize(); CH.el.input.focus(); }
  }
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function chatCard(x) {
    var ch = x.change, undone = !!CH.undone[x.id], can = !!CH.undo[x.id] || !!(CH.redo && CH.redo[x.id] && undone);
    var what = t(ch.passages === 1 ? 'nPassage1' : 'nPassages', { n: ch.passages }) + ' · ' + t(ch.mistakes === 1 ? 'nMistake1' : 'nMistakes', { n: ch.mistakes });
    var act = '';
    if (can && !undone) act = '<button type="button" class="mhc-link" data-c="undo" data-id="' + esc(x.id) + '">' + esc(t('chatUndo')) + '</button>';
    else if (can && undone) act = '<button type="button" class="mhc-link" data-c="redo" data-id="' + esc(x.id) + '">' + esc(t('chatRedo')) + '</button>';
    else if (ch.set && !ch.applied) act = '<button type="button" class="btn go" data-c="use" data-id="' + esc(x.id) + '">' + esc(t('chatUse')) + '</button>';
    var notes = (ch.written ? '<span class="mhc-note">' + esc(t('chatWritten', { n: ch.written })) + '</span>' : '') + (ch.dropped ? '<span class="mhc-note">' + esc(t('chatDropped', { n: ch.dropped })) + '</span>' : '');
    return '<div class="mhc-change' + (undone ? ' undone' : '') + '"><p><b>' + esc(t(undone ? 'chatUndoneTitle' : 'chatChangedTitle')) + '</b>' + (undone ? '' : '<br><span>' + esc(what) + '</span>') + '</p>' + (undone ? '' : notes) + act + '</div>';
  }
  function chatRender() {
    if (!CH.root || CH.mode !== 'open') return;
    var d = S.draft, has = !!(d && d.p.some(function (p) { return p.x; }));
    if (CH.el.sub) { var np = d ? d.p.filter(function (p) { return p.x; }).length : 0; CH.el.sub.textContent = has ? t('chatKnows', { what: t(np === 1 ? 'nPassage1' : 'nPassages', { n: np }) + ', ' + gradeName(d.g) }) : t('chatKnowsNone'); }
    var log = CH.el.log; if (!log) return;
    var atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 40, turns = CH.chat.turns, parts = [];
    var bot = function (inner, cls) { return '<div class="mhc-turn bot"><span class="mhc-av">' + OMARK(28) + '</span><div class="mhc-msg bot' + (cls || '') + '">' + inner + '</div></div>'; };
    if (!turns.length) {
      parts.push(bot(esc(t(has ? 'chatHello' : 'chatHelloEmpty'))));
      var ideas = has ? ['ideaFewer', 'ideaEasier', 'ideaAdd', 'ideaSpell'] : ['ideaTopic', 'ideaTopic2'];
      parts.push('<div class="mhc-chips" role="group" aria-label="' + esc(t('chatIdeas')) + '">' + ideas.map(function (k) { return '<button type="button" class="chip" data-c="chip" data-text="' + esc(t(k)) + '">' + esc(t(k)) + '</button>'; }).join('') + '</div>');
    }
    var lastBot = turns.slice().reverse().filter(function (x) { return x.role === 'oomba'; })[0];
    turns.forEach(function (x) {
      if (x.role === 'me') {
        var failed = lastBot && lastBot.failed && lastBot.for === x.id;
        parts.push('<div class="mhc-turn me"><div class="mhc-msg me" dir="auto">' + esc(x.text) + '</div>' + (failed ? '<div class="mhc-again"><button type="button" class="btn" data-c="retry" data-id="' + esc(x.id) + '">' + esc(t('chatRetry')) + '</button><button type="button" class="btn quiet" data-c="edit" data-id="' + esc(x.id) + '">' + esc(t('chatEdit')) + '</button></div>' : '') + '</div>');
      } else if (x.failed) {
        parts.push(bot(esc(t('chatFail.' + (CHAT_FAILS.indexOf(x.failed) >= 0 ? x.failed : 'error'))), ' calm'));
      } else {
        parts.push(bot('<span dir="auto">' + esc(x.text) + '</span>' + (x.note === 'notBuilt' ? '<span class="mhc-note">' + esc(t('chatNotBuilt')) + '</span>' : '') + (x.change ? chatCard(x) : '')));
      }
    });
    if (CH.chat.pending) parts.push('<div class="mhc-turn bot mhc-wait"><span class="mhc-av">' + OMARK(28) + '</span><div class="mhc-msg bot"><span class="mhc-wline"><span class="mhc-dots" aria-hidden="true"><i></i><i></i><i></i></span> <span data-time>' + esc(chatWait()) + '</span></span><span class="mhc-note">' + esc(t('chatLeave')) + '</span></div></div>');
    log.innerHTML = parts.join('');
    CH.el.input.placeholder = t(turns.length || has ? 'chatInput' : 'chatInputEmpty');
    CH.el.send.disabled = !!CH.chat.pending || !!CH.sending;
    if (atEnd || CH.chat.pending) chatDown();
  }

  function testState() {
    var R = S.run, d = S.draft;
    return {
      screen: S.screen,
      draft: d ? { set: d.set || '', T: d.T, cur: d.cur, passages: d.p.map(function (p) { return { t: p.t, x: p.x, m: p.m.length }; }), types: d.types.length, n: d.n } : null,
      run: R ? { i: R.i, n: R.set.items.length, st: R.st.slice(), f: R.f.slice(), edits: R.e[R.i].length, checks: R.checks, hints: R.hints, set: R.set.id || '', over: R.over, tap: !!(R.tap && R.tap.on), e: JSON.parse(JSON.stringify(R.e[R.i])) } : null,
      fix: S.fix && D.sheet ? { a: S.fix.a, b: S.fix.b } : null,
      sheets: S.sheets ? S.sheets.length : -1,
    };
  }
  window.__brbTest = Object.assign(window.__brbTest || {}, {
    mhState: testState,
    // The current passage's answer key over the words students see: [{ a, b, wrong, right, k }].
    mhKey: function () { var R = S.run; if (!R) return []; var x = it(); return P.key(x.x, x.m).map(function (k) { return { a: k.a, b: k.b, wrong: k.wrong, right: k.right, k: k.k }; }); },
    mhSample: function () { S.setDone = true; playSample(); },
    // Play these passages as a practice set (a preview: no saved progress, no game over).
    mhPlay: function (items) { S.setDone = true; play({ id: '', items: plainItems(items), mine: false, preview: true }); return testState(); },
    samples: function () { return SAMPLES.length; },
    // Put a fix in, as the fix sheet does (the cover's recipe), and Check.
    mhFix: function (a, b, s) { if (!S.run) return null; setEdit(a, b, s); drawText(); drawBand(); drawResult(); return testState(); },
    mhCheck: function () { if (S.run) check(); return testState(); },
    // The word (or comma gap) a tap at this point of the frame goes to, as the passage's own handler picks it.
    mhNearest: function (x, y) { return D.ptext ? nearest(D.ptext, x, y) : null; },
    // A graded step: what the frame holds (never the key before it is allowed).
    mhGraded: function () { return B.proofStep ? JSON.parse(JSON.stringify(B.proofStep)) : null; },
    // Oomba's chat (Phase 3): the panel's mode and what the conversation holds.
    mhChat: function () { return { mode: CH.mode, turns: CH.chat.turns.length, pending: !!CH.chat.pending, undo: Object.keys(CH.undo).length, undone: Object.keys(CH.undone).length }; },
  });
  begin();
})();
</script>
