    {"id":"g3-022","g":3,"topic":"world","t":"Reading a Map","x":"A map is a drawing of a place seen from above. Maps help us find our way. Most maps have a few special parts that make them easier to read.\n\nThe compass rose shows the directions north, south, east, and west. The key, or legend, tells what the symbols mean. A small tree might stand for a park, and a blue line might be a river. Some maps also have a scale. It shows how far apart places really are. Last week, I drew a map of my neighborhood. I put my house, my school, and the library on it."},
    {"id":"g3-023","g":3,"topic":"world","t":"A Trip to Mexico City","x":"Over winter break, my family visited Mexico City. It is the capital of Mexico, and it is a huge, busy city. My mom grew up there, so she was our tour guide.\n\nOn the first day, we went to a giant park called Chapultepec. It has a lake, a zoo, and a castle on a hill! The next day, we ate tacos, tamales, and sweet bread from a bakery. I practiced my Spanish with the waiter, and he smiled at me. My favorite part was riding a colorful boat on the canals of Xochimilco. I hope we go back soon."},
    {"id":"g3-024","g":3,"topic":"world","t":"The Longest River","x":"The Nile is one of the longest rivers in the world. It flows north through Africa for more than 4,000 miles. It ends at the Mediterranean Sea in the country of Egypt.\n\nMost of Egypt is a hot, dry desert. Long ago, the people of Egypt lived close to the Nile, because it gave them water. Every year, the river flooded and left rich mud on the land. Farmers used this mud to grow wheat and other crops. The ancient Egyptians also used the river like a road. They sailed boats up and down it to trade."},
    {"id":"g3-025","g":3,"topic":"everyday","t":"Pancake Saturday","x":"Every Saturday, my dad and I make pancakes. First, we get out the flour, milk, eggs, and a big bowl. I crack the eggs, and Dad measures the flour. Then I stir everything together until it is smooth.\n\nDad heats the pan, and I pour in a little circle of batter. When bubbles pop on top, it is time to flip it. Last week, I flipped one too high, and it landed on the floor! We both laughed. My little sister likes her pancakes with strawberries. I like mine with butter and syrup."},
    {"id":"g3-026","g":3,"topic":"everyday","t":"My New Puppy","x":"Two weeks ago, we brought home a new puppy. His name is Biscuit, and he is brown and white. He has big floppy ears and a tail that never stops wagging.\n\nTaking care of a puppy is a lot of work. Every morning, I fill his bowl with food and fresh water. After school, I take him for a walk around the block. Biscuit likes to chew on everything, so we bought him some chew toys. He still chewed one of my socks, though! At night, he sleeps in a basket next to my bed. I love him so much."},
    {"id":"g3-027","g":3,"topic":"everyday","t":"Chore Day","x":"On Sundays, everyone in our family helps clean the house. Mom calls it Chore Day. We each pick a job from a jar. This week, I got the job of folding the laundry.\n\nMy brother Jake had to sweep the kitchen, and my sister Lily dusted the shelves. Dad washed the windows, and Mom cleaned the bathroom. It took us about an hour. When we were done, the whole house looked bright and shiny. Then we all sat down to watch a movie together. Chore Day is more fun than it sounds, because we do it as a team."},
    {"id":"g3-028","g":3,"topic":"everyday","t":"Where Did My Lunch Go?","x":"Yesterday, I could not find my lunchbox anywhere. I looked in my backpack, under my desk, and in the coat closet. It was not there. My stomach was growling, and I started to worry.\n\nThen my friend Omar had an idea. \"Did you check the bus?\" he asked. I ran to the office, and the secretary called the bus driver. My lunchbox was sitting on a seat! The driver brought it to school after his route. I ate my sandwich, my apple, and my cookies a little late, but I was very happy."},
    {"id":"g3-029","g":3,"topic":"sports","t":"Our Soccer Game","x":"On Saturday, my soccer team, the Tigers, played against the Hawks. It was a sunny day, and lots of families came to watch. I play defense, so my job is to stop the other team from scoring.\n\nIn the first half, the Hawks scored a goal. We were sad, but our coach told us to keep trying. In the second half, my friend Ana kicked the ball into the net! Then I stopped a fast player, and Leo scored again. We won the game two to one. After the game, we shared orange slices and cheered for both teams."},
    {"id":"g3-030","g":3,"topic":"sports","t":"How to Play Hopscotch","x":"Hopscotch is a fun game you can play outside. All you need is chalk, a small stone, and a flat sidewalk. First, draw eight boxes on the ground and number them from 1 to 8.\n\nTo start, toss your stone into box 1. Then hop over that box and through the rest of the boxes. Use one foot for single boxes and two feet for side-by-side boxes. At the end, turn around and hop back. Pick up your stone on the way. If you step on a line or fall, your turn is over. Then it is your friend's turn."},
    {"id":"g3-031","g":3,"topic":"sports","t":"The Story of Basketball","x":"Basketball was invented in 1891 by a teacher named James Naismith. He taught at a school in Springfield, Massachusetts. In the winter, it was too cold for his students to play outside, so he needed an indoor game.\n\nNaismith nailed two peach baskets to the walls of the gym. The players tried to toss a soccer ball into the baskets. Every time someone scored, a person had to climb a ladder to get the ball out! Later, people cut holes in the bottom of the baskets. Today, basketball is played all over the world."},
    {"id":"g3-032","g":3,"topic":"sports","t":"Swimming Lessons at the Pool","x":"This summer, I took swimming lessons at the city pool. On the first day, I was scared to put my face in the water. My teacher, Ms. Kim, was very patient with me.\n\nFirst, we practiced blowing bubbles. Then we learned to float on our backs. Ms. Kim held my back until I felt safe. By the third week, I could kick my legs and move my arms at the same time. On the last day, I swam all the way across the pool by myself! My parents clapped and cheered. Now I want to swim every day."},
    {"id":"g3-033","g":3,"topic":"arts","t":"The School Play","x":"Our class put on a play about the three little pigs. I was the wolf, and I had to huff and puff very loudly. My friend Grace was the first pig, and she built a house of straw.\n\nWe practiced every day for three weeks. Our teacher painted the houses, and we made the costumes ourselves. On the night of the play, I was so nervous that my hands were shaking. But when the lights came on, I remembered all my lines. The audience laughed when I fell down the chimney. At the end, everyone stood up and clapped."},
    {"id":"g3-034","g":3,"topic":"arts","t":"The Primary Colors","x":"Did you know you can make lots of colors with just three? Red, yellow, and blue are called the primary colors. You can mix them to make new colors.\n\nIf you mix red and yellow, you get orange. Yellow and blue make green, and blue and red make purple. These are called secondary colors. You can also add white to make a color lighter, or add black to make it darker. Yesterday, I tried mixing paints at the kitchen table. I made a sky blue, a bright orange, and a muddy brown. Then I painted a picture of a sunset."},
    {"id":"g3-035","g":3,"topic":"arts","t":"A Book I Love","x":"My favorite book is about a girl who finds a secret door in her grandma's attic. Behind the door, there is a magical garden. The flowers can talk, and the trees tell jokes.\n\nI like this book because it is funny and exciting. The girl is brave, and she helps a lost rabbit find its family. I have read it four times! Every time I read it, I notice something new in the pictures. My brother says he likes comic books better than chapter books. I think he should give this book a try."},
    {"id":"g3-036","g":3,"topic":"arts","t":"Making Music with Jars","x":"You can make your own music at home with glass jars and water. First, line up five jars on a table. Pour a little water into the first jar. Pour a bit more into the next one, and keep going until the last jar is almost full.\n\nNow tap each jar gently with a metal spoon. Listen to the sounds. The jar with the most water makes the lowest note, and the jar with the least water makes the highest note. Try tapping them in different orders to play a song. My sister and I played a tune for our parents, and they loved it."},
    {"id":"g3-037","g":3,"topic":"inventions","t":"The Light Bulb","x":"Long ago, people used candles and oil lamps to see at night. These lights were dim, and they could start fires. Many inventors wanted to make a better light.\n\nIn 1879, Thomas Edison and his team made a light bulb that could glow for many hours. Inside the glass bulb was a thin thread called a filament. When electricity flowed through it, the filament got hot and gave off light. Edison tested thousands of materials before he found one that worked well. Soon, homes and streets all over the country had electric lights."},
    {"id":"g3-038","g":3,"topic":"inventions","t":"How a Bicycle Works","x":"A bicycle is a simple machine that helps you move faster than walking. When you push the pedals, they turn a wheel with teeth called a gear. A chain goes around this gear and another gear on the back wheel.\n\nAs the chain moves, it turns the back wheel, and the bike rolls forward. The handlebars let you steer left or right. When you squeeze the brakes, rubber pads press on the wheels and slow them down. Bikes don't need gas, so they are good for the air. My friends and I ride our bikes to the park every weekend."},
    {"id":"g3-039","g":3,"topic":"inventions","t":"How the Telephone Began","x":"Before the telephone, people sent letters or used telegraphs to share news. Letters could take weeks to arrive. Then, in 1876, Alexander Graham Bell got a patent for the telephone.\n\nThe first telephones turned a person's voice into an electric signal. The signal traveled through a wire to another phone, and that phone turned it back into sound. At first, only a few homes had phones. Over time, wires stretched across the whole country. Today, most phones don't need wires at all, and we can call people almost anywhere in the world."},
    {"id":"g3-040","g":3,"topic":"inventions","t":"My Robot Project","x":"For the science fair, I built a little robot with my older cousin Theo. We used a kit with wheels, a small motor, and a battery. Theo showed me how to connect the wires.\n\nThen we wrote a few simple directions on his laptop. We told the robot to go forward, turn left, and stop when it got close to a wall. The first time we tried it, the robot spun in circles! We fixed a mistake in our directions, and then it worked. At the fair, the judges liked our robot, and we won a blue ribbon."},
    {"id":"g4-001","g":4,"topic":"animals","t":"The Monarch Butterfly's Journey","x":"Every fall, millions of monarch butterflies leave Canada and the northern United States. They fly south to the mountains of central Mexico, where the winters are mild. Some of them travel more than 2,000 miles!\n\nWhen they arrive, the monarchs cluster together on fir trees. So many butterflies cover the branches that the trees look orange. In the spring, they start the long trip north again. Along the way, they lay eggs on milkweed plants. The caterpillars that hatch eat only milkweed, so this plant is very important to their survival."},
    {"id":"g4-002","g":4,"topic":"animals","t":"Octopus Tricks","x":"The octopus is one of the smartest animals in the ocean. It has eight long arms covered with suction cups, and it uses them to grab food and explore. An octopus also has three hearts and blue blood.\n\nOctopuses are famous for their clever tricks. Many of them can change the color of their skin in less than a second, so they blend in with rocks or sand. If a hungry fish gets too close, an octopus can squirt a cloud of dark ink and swim away. Some octopuses have even learned to open jars to reach a snack inside."},
    {"id":"g4-003","g":4,"topic":"animals","t":"A Diary Entry About Owls","x":"Dear Diary,\n\nTonight, I went on an owl walk at the nature center with my uncle. Our guide, Ms. Rivera, told us to be very quiet. Then she played a recording of an owl call. A few minutes later, a great horned owl answered from the trees!\n\nMs. Rivera explained that owls can turn their heads much farther than people can. Their feathers are soft at the edges, so they fly almost silently. That helps them sneak up on mice. I saw two big yellow eyes staring down at me. It was the coolest night of my whole year."},
    {"id":"g4-004","g":4,"topic":"animals","t":"Why Camels Have Humps","x":"Many people think a camel's hump is full of water, but that is not true. The hump is actually filled with fat. When food is hard to find, a camel's body can use that fat for energy.\n\nCamels are built for life in the desert. Their long eyelashes keep out blowing sand, and they can close their nostrils during a sandstorm. Their wide, padded feet help them walk on soft sand without sinking. A thirsty camel can drink a huge amount of water very quickly, more than 20 gallons at a time. Then it can go for days without drinking again."},
    {"id":"g4-005","g":4,"topic":"science","t":"States of Matter","x":"Everything around you is made of matter. Matter can be a solid, a liquid, or a gas. A rock, a book, and an ice cube are all solids. They keep their own shape. Liquids, like milk and juice, take the shape of the container they are in.\n\nGases spread out to fill any space. The air you breathe is a mix of gases. Matter can change from one state to another when it heats up or cools down. When you boil water on the stove, it turns into steam, which is a gas. When you put water in the freezer, it becomes ice. Then, if you leave the ice out, it melts back into a liquid."},
    {"id":"g4-006","g":4,"topic":"science","t":"The Food Chain","x":"All living things need energy to survive, and they get it from food. A food chain shows how energy passes from one living thing to the next.\n\nMost food chains begin with plants. Plants use sunlight to make their own food. Next, a plant eater, like a rabbit, eats the plants. Then a meat eater, like a fox, eats the rabbit. When plants and animals die, tiny living things called decomposers break them down. Mushrooms, worms, and bacteria are decomposers. They return nutrients to the soil, which helps new plants grow. Then the chain starts all over again."},
    {"id":"g4-007","g":4,"topic":"science","t":"My Science Fair Experiment","x":"For the science fair this year, I wanted to know which kind of paper towel soaks up the most water. I bought three different kinds at the store, and I called them Towel A, Towel B, and Towel C.\n\nFirst, I poured the same amount of water into three cups. Next, I dipped one towel into each cup for ten seconds. Then I measured how much water was left. Towel B soaked up the most, and Towel C soaked up the least. I had guessed that Towel A would win, so my guess was wrong. That was okay, though. Scientists learn from their mistakes too."},
    {"id":"g4-008","g":4,"topic":"science","t":"How Our Lungs Work","x":"Every time you breathe in, air rushes into your nose or mouth. It travels down a tube in your throat and into your two lungs. Your lungs look a little like sponges, and they are full of tiny air sacs.\n\nThe air you breathe in has oxygen, which your body needs to stay alive. In the air sacs, oxygen passes into your blood. Your heart pumps that blood to every part of your body. At the same time, your blood drops off a waste gas called carbon dioxide. When you breathe out, you push the carbon dioxide out of your body. You breathe about 20,000 times each day without even thinking about it!"},
    {"id":"g4-009","g":4,"topic":"space","t":"The Planets in Our Solar System","x":"Our solar system has eight planets that travel around the Sun. In order from the Sun, they are Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, and Neptune.\n\nThe first four planets are small and rocky. The next four are much bigger, and they are made mostly of gas and ice. Jupiter is the largest planet of all. It is so big that more than 1,000 Earths could fit inside it! Venus is the hottest planet, even though Mercury is closer to the Sun. That is because thick clouds on Venus trap the heat. Neptune is the farthest planet, and it is very cold and windy."},
    {"id":"g4-010","g":4,"topic":"space","t":"Living on the Space Station","x":"The International Space Station circles Earth about 250 miles above the ground. Astronauts from many countries live and work there for months at a time. The station zooms around Earth about 16 times each day, so the crew sees many sunrises and sunsets.\n\nLife in space is very different from life on Earth. Everything floats, so astronauts sleep in sleeping bags that are attached to the walls. They drink from pouches with straws, and they strap their feet down when they work. They also exercise for about two hours each day to keep their muscles and bones strong."},
    {"id":"g4-011","g":4,"topic":"space","t":"Phases of the Moon","x":"The Moon seems to change shape over the course of a month, but it does not really change at all. The Moon does not make its own light. Instead, it reflects light from the Sun.\n\nAs the Moon travels around Earth, we see different amounts of its sunny side. When the Moon is between Earth and the Sun, we can't see the lit side, so we call it a new moon. Over the next two weeks, we see more and more of it. Then the whole sunny side faces us, and we see a full moon. After that, it slowly shrinks again. The whole cycle takes about 29 days."},
    {"id":"g4-012","g":4,"topic":"space","t":"A Letter to an Astronaut","x":"Dear Astronaut,\n\nMy name is Jamal, and I am in the fourth grade in Ohio. Our class has been learning about space, and I chose you for my report. I read that you spent six months on the space station. That sounds amazing!\n\nI have a few questions for you. What did you miss most about Earth? How did you wash your hair when the water floated away? Did you ever get to see your town from the window? When I grow up, I want to be an astronaut too. Thank you for reading my letter.\n\nSincerely, Jamal"},
    {"id":"g4-013","g":4,"topic":"earth","t":"The Water Cycle","x":"The water on Earth has been around for a very long time. It moves in a never-ending path called the water cycle.\n\nFirst, the Sun warms water in oceans, lakes, and rivers. Some of the water turns into a gas called water vapor and rises into the sky. This is called evaporation. High up, the air is cooler, so the vapor turns into tiny drops that form clouds. This step is called condensation. When the drops get big and heavy, they fall back down as rain, snow, sleet, or hail. That is called precipitation. The water flows back into rivers and oceans, and the cycle begins again."},
    {"id":"g4-014","g":4,"topic":"earth","t":"Three Kinds of Rocks","x":"Scientists sort rocks into three main groups. The first group is igneous rock. It forms when melted rock from inside Earth cools and hardens. Granite is an igneous rock that people often use for kitchen counters.\n\nThe second group is sedimentary rock. It forms when sand, mud, and tiny shells pile up in layers over thousands of years. The layers press together until they turn into stone. Sandstone and limestone are examples. The third group is metamorphic rock. It forms when heat and pressure change one kind of rock into another. For example, limestone can slowly turn into marble."},
    {"id":"g4-015","g":4,"topic":"earth","t":"Our Hurricane Day","x":"Last September, a hurricane was heading toward our town in Florida. My parents watched the weather report closely. We brought our bikes and lawn chairs inside, and Dad covered the windows with boards.\n\nWe also packed a kit with water, flashlights, batteries, and canned food. When the storm arrived, the wind howled and the rain pounded on the roof. We played board games by flashlight when the power went out. By the next morning, the storm had moved away. There were branches all over our yard, but our house was safe. Our neighbors came over, and everyone helped clean up."},
    {"id":"g4-016","g":4,"topic":"earth","t":"The Great Barrier Reef","x":"The Great Barrier Reef is off the coast of Australia. It is the largest coral reef system in the world. It is so big that astronauts can see it from space!\n\nCoral may look like colorful rocks or plants, but it is really made of tiny animals. These animals build hard skeletons that pile up over many years. The reef is home to thousands of kinds of fish, as well as sea turtles, sharks, and dolphins. Scientists work hard to protect the reef, because warm water can harm the coral. Many people visit each year to snorkel and see its beauty."},
    {"id":"g4-017","g":4,"topic":"history","t":"The Wright Brothers Take Off","x":"Orville and Wilbur Wright were brothers who owned a bicycle shop in Dayton, Ohio. They loved to build things, and they dreamed of making a machine that could fly.\n\nThe brothers studied birds and tested many gliders. They chose a windy beach near Kitty Hawk, North Carolina, for their tests. On December 17, 1903, Orville climbed onto their airplane, the Flyer. It rose into the air and stayed up for 12 seconds. That was the first powered airplane flight in history! The brothers flew three more times that day, and Wilbur's flight lasted almost a minute."},
    {"id":"g4-018","g":4,"topic":"history","t":"Building the Pyramids","x":"More than 4,000 years ago, the people of ancient Egypt built giant pyramids. The biggest one is the Great Pyramid of Giza. It was built for a king named Khufu.\n\nThe Great Pyramid is made of more than two million stone blocks. Many of them weigh more than a car! Workers cut the blocks, dragged them on sleds, and pushed them up ramps. Scientists believe that thousands of skilled workers helped build it over about 20 years. For thousands of years, it was the tallest building in the world. Today, visitors from all over the world come to see it."},
    {"id":"g4-019","g":4,"topic":"history","t":"Sacagawea's Journey","x":"In 1804, Meriwether Lewis and William Clark set out to explore the land west of the Mississippi River. President Thomas Jefferson wanted to learn more about it. A young Shoshone woman named Sacagawea joined their group.\n\nSacagawea helped the explorers in many ways. She spoke with Native American groups they met along the way, and she knew which plants were safe to eat. She did all of this while carrying her baby son on her back. With her help, the group reached the Pacific Ocean in 1805. Today, Sacagawea is remembered on a United States coin."},
    {"id":"g4-020","g":4,"topic":"history","t":"A Gift From France","x":"The Statue of Liberty stands on an island in New York Harbor. It was a gift from the people of France to the United States. A French artist named Frederic Bartholdi designed it, and it was finished in 1886.\n\nThe statue is made of copper. When it was new, it was a shiny brown color, like a new penny. Over the years, wind and rain turned the copper green. Lady Liberty holds a torch in one hand and a tablet in the other. For many people arriving by ship, the statue was the first thing they saw in America. Visitors can climb up into its crown."},
    {"id":"g4-021","g":4,"topic":"world","t":"A Postcard from Kenya","x":"Dear Grandpa,\n\nGreetings from Kenya! This country is in East Africa, and its capital is Nairobi. Yesterday, we went on a safari in a big park. We saw zebras, elephants, and a family of lions resting under a tree. Our guide said the lions sleep for most of the day.\n\nThis morning, we visited a market. The sellers had baskets, beaded jewelry, and bright fabrics. I learned to say \"jambo,\" which means hello in Swahili. I bought you a small wooden giraffe. I can't wait to show you my pictures when we get home.\n\nLove, Emma"},
    {"id":"g4-022","g":4,"topic":"world","t":"Venice, the City on Water","x":"Venice is a city in Italy that is built on more than 100 small islands. Instead of streets, it has canals. People travel around the city by boat, or they walk across one of its hundreds of bridges.\n\nThe most famous boats in Venice are long, thin gondolas. A gondolier stands at the back and pushes the boat with a single long oar. Venice also has water buses and water taxis. Even the mail and the trash are carried by boat! Visitors come from all over the world to see the city's old churches, painted palaces, and busy squares."},
    {"id":"g4-023","g":4,"topic":"world","t":"Seasons in Australia","x":"In the United States, December is usually cold. But in Australia, December is in the middle of summer! That is because Australia is in the Southern Hemisphere, which is the half of Earth below the equator.\n\nEarth is tilted as it travels around the Sun. When the northern half tips toward the Sun, it has summer, and the southern half has winter. Six months later, it is the other way around. So many families in Australia spend the holidays at the beach. They might have a picnic, go swimming, or build sandcastles. Their winter comes in June, July, and August."},
    {"id":"g4-024","g":4,"topic":"world","t":"Chinese New Year","x":"Chinese New Year is one of the most important holidays in China. It is also celebrated in many other countries around the world. The date changes each year, but it always falls in January or February.\n\nBefore the holiday, families clean their homes to sweep away bad luck. They decorate with red paper, because red stands for good luck. On New Year's Eve, relatives gather for a big dinner with dumplings, fish, and noodles. Children often receive red envelopes with money inside. During the celebration, people watch fireworks and colorful dragon dances in the streets."},
    {"id":"g4-025","g":4,"topic":"everyday","t":"How to Make a Fruit Salad","x":"A fruit salad is a healthy snack that is easy to make. First, wash your hands and gather your fruit. I like to use strawberries, grapes, bananas, and a big orange. Ask an adult to help you with the knife.\n\nNext, cut the strawberries in half and peel the orange. Slice the banana into thin circles. Then put all of the fruit into a large bowl. If you want, you can squeeze a little lemon juice over it, so the bananas don't turn brown. Stir everything together gently with a big spoon. Finally, scoop it into small bowls and share it with your family."},
    {"id":"g4-026","g":4,"topic":"everyday","t":"Moving to a New School","x":"In August, my family moved from Texas to Colorado. I was nervous about starting at a new school. I didn't know anyone, and I worried that nobody would talk to me.\n\nOn my first day, my teacher, Mrs. Patel, asked a girl named Rosa to show me around. Rosa took me to the library, the gym, and the cafeteria. At lunch, she introduced me to her friends. We found out that we all like drawing and mystery books. By the end of the week, I felt much better. Now Rosa is my best friend, and I'm glad that we moved here."},
    {"id":"g4-027","g":4,"topic":"everyday","t":"Grandma's Birthday Surprise","x":"Last month, my cousins and I planned a surprise party for Grandma's 75th birthday. We had to keep it a secret for three whole weeks. That was harder than I thought it would be!\n\nMy job was to make the decorations. I cut out paper stars, painted a big banner, and blew up lots of balloons. My cousin Ben baked a lemon cake, which is Grandma's favorite. On the day of the party, Grandpa took her out for a walk. When they came back, we all jumped out and yelled, \"Surprise!\" Grandma laughed so hard that she cried happy tears."},
    {"id":"g4-028","g":4,"topic":"everyday","t":"Saving My Allowance","x":"Every week, I earn five dollars for doing my chores. I feed the cat, take out the trash, and set the table for dinner. For a long time, I spent my money on candy and small toys right away.\n\nThen I saw a skateboard at the store that I really wanted. It cost 60 dollars. My mom helped me make a plan. I put my money in a jar each week, and I made a chart to track my savings. Some weeks, it was hard not to spend it. After twelve weeks, I finally had enough. Buying the skateboard felt better than any candy ever did!"},
    {"id":"g4-029","g":4,"topic":"sports","t":"The First Modern Olympics","x":"The first Olympic Games were held in ancient Greece almost 3,000 years ago. After many centuries, the games stopped. Then a Frenchman named Pierre de Coubertin had an idea to bring them back.\n\nIn 1896, the first modern Olympics took place in Athens, Greece. About 240 athletes from 14 countries competed. There were events in running, swimming, cycling, and wrestling. An American named James Connolly won the first event, the triple jump. Today, the Summer and Winter Games each happen every four years. Thousands of athletes from more than 200 countries now take part."},
    {"id":"g4-030","g":4,"topic":"sports","t":"Field Day Relay Race","x":"Every June, our school has a field day on the big grassy field behind the gym. There are sack races, a tug-of-war, and a water balloon toss. My favorite event is the relay race.\n\nIn a relay, each team has four runners. The first runner carries a baton and passes it to the next runner, who runs the next part of the race. This year, I was the last runner on my team. When Priya handed me the baton, we were in third place. I ran as fast as I could, and I passed two kids right before the finish line! Our team won a ribbon, and then we all cooled off with ice pops."},
    {"id":"g4-031","g":4,"topic":"sports","t":"How to Play Chess","x":"Chess is a game for two players. It is played on a board with 64 squares. Each player starts with 16 pieces: a king, a queen, two rooks, two bishops, two knights, and eight pawns. One player uses the white pieces, and the other uses the black pieces.\n\nEach kind of piece moves in its own way. Rooks move in straight lines, and bishops move diagonally. Knights jump in an L shape. The goal is to trap the other player's king so that it can't escape. This is called checkmate. Chess takes practice, but it's a great way to learn to think ahead."},
    {"id":"g4-032","g":4,"topic":"sports","t":"My First Ski Trip","x":"Over winter break, my family went skiing in the mountains of Utah. I had never been on skis before, so I took a lesson with other kids my age. Our teacher's name was Coach Mike.\n\nFirst, he showed us how to put on our boots and skis. Then he taught us to make a pizza shape with our skis to slow down. I fell down at least ten times, but I always got back up. By the afternoon, I could ride the small lift and ski down the bunny hill by myself. My cheeks were red from the cold, but I couldn't stop smiling. I can't wait to go again."},
    {"id":"g4-033","g":4,"topic":"arts","t":"Learning the Violin","x":"When I was eight, I started taking violin lessons. At first, my violin sounded like a squeaky door! My teacher, Mr. Chen, told me to be patient and practice every day.\n\nA violin has four strings, and you play it with a bow made of wood and horsehair. To make a sound, you pull the bow across the strings. You press the strings with your other hand to change the notes. It took me months to play my first real song. Now I play in the school orchestra with twenty other kids. Last spring, we performed a concert for our families, and my parents said it was beautiful."},
    {"id":"g4-034","g":4,"topic":"arts","t":"Vincent van Gogh's Bright Colors","x":"Vincent van Gogh was a painter from the Netherlands. He lived in the 1800s, and he painted hundreds of pictures. He used thick paint and bold, swirling brushstrokes.\n\nVan Gogh loved to paint the things around him. He painted fields of wheat, bowls of fruit, his bedroom, and bright yellow sunflowers. One of his most famous paintings is called The Starry Night. It shows a small town under a sky full of swirling stars. During his life, van Gogh sold very few paintings. Today, though, his work hangs in museums around the world, and millions of people visit to see it."},
    {"id":"g4-035","g":4,"topic":"arts","t":"How to Fold a Paper Boat","x":"You can make a paper boat with just one sheet of paper. First, fold the paper in half from top to bottom. Then fold the top corners down to the middle, so they make a triangle.\n\nNext, fold the bottom strips up on both sides. Now open the shape from the bottom, and press it flat into a square. Fold the bottom corners of the square up to the top. Then open it again and flatten it into a smaller square. Finally, gently pull the two top points apart, and your boat will pop open. Try floating it in a tub of water!"},
    {"id":"g4-036","g":4,"topic":"arts","t":"Our Class Mural","x":"This year, our class painted a mural on a long wall outside the library. Our art teacher, Ms. Brooks, asked us to vote on a theme. We chose \"Our Community.\"\n\nFirst, each of us drew a small sketch. Then Ms. Brooks put the best parts of our sketches together into one big plan. We painted the park, the fire station, the farmers market, and the river that runs through town. I painted the ducks in the river, and my friend Kai painted the bridge. It took us six weeks to finish. Now, whenever I walk by, I feel proud of our work."},
    {"id":"g4-037","g":4,"topic":"inventions","t":"How a Refrigerator Keeps Food Cold","x":"A refrigerator doesn't really make cold. Instead, it moves heat from the inside of the fridge to the outside.\n\nA special liquid flows through tubes inside the walls. When this liquid turns into a gas, it soaks up heat from the food and the air inside. A machine called a compressor squeezes the gas and pumps it to coils on the back of the fridge. There, the heat escapes into the kitchen, and the gas turns back into a liquid. Then the cycle repeats. If you put your hand near the back of a fridge, you can feel that it's warm."},
    {"id":"g4-038","g":4,"topic":"inventions","t":"Books Before and After Printing","x":"Long ago, books were copied by hand. It could take months to make just one book, so books were very rare and expensive. Most people never owned one.\n\nAround 1440, a German man named Johannes Gutenberg built a printing press. He made small metal letters that could be moved around to spell words. Workers covered the letters with ink and pressed paper on top. A printing press could make many pages in a single day. Soon, books became cheaper, and more people learned to read. Gutenberg's invention helped spread new ideas all over Europe."},
    {"id":"g4-039","g":4,"topic":"inventions","t":"Velcro and the Burrs","x":"In 1941, a Swiss engineer named George de Mestral went for a walk with his dog in the mountains. When they got home, he noticed tiny burrs stuck all over his pants and his dog's fur. He was curious, so he looked at a burr under a microscope.\n\nHe saw that each burr was covered with tiny hooks. The hooks grabbed onto loops in the cloth. That gave him an idea for a new kind of fastener. After years of work, he made one strip with hooks and another with loops. Today, people use hook and loop fasteners on shoes, jackets, and backpacks."},
    {"id":"g4-040","g":4,"topic":"inventions","t":"How Wind Turbines Make Power","x":"Have you ever seen giant white towers with spinning blades? They are called wind turbines, and they make electricity from the wind.\n\nWhen the wind blows, it pushes on the long blades and makes them turn. The blades are connected to a shaft inside the turbine. The spinning shaft turns a machine called a generator, which makes electricity. Then wires carry the electricity to homes, schools, and stores. Wind power is clean, because it doesn't make smoke. However, turbines only work when the wind is blowing, so people use other kinds of power too."},
    {"id":"g5-001","g":5,"topic":"animals","t":"How Bats Find Their Way","x":"Bats are the only mammals that can truly fly, and many of them hunt at night. To find their way in the dark, most bats use a skill called echolocation. A bat makes high squeaks that are too high for people to hear. The sound bounces off trees, walls, and insects, and the echoes travel back to the bat's large ears. From these echoes, the bat can tell how far away something is and even how big it is.\n\nI once watched bats swoop over the pond near my grandmother's house in Ohio. They darted, turned, and dove faster than I could follow. A single bat can eat hundreds of insects in one night, so farmers are often glad to have them nearby."},
    {"id":"g5-002","g":5,"topic":"animals","t":"The Busy Life of Honeybees","x":"A honeybee colony is like a small, busy city. Most of the bees are workers, and they are all female. Young workers clean the hive, feed the babies, and build wax cells. Older workers fly out to collect nectar and pollen from flowers. When a worker finds a good patch of flowers, she returns to the hive and does a special dance. The dance tells the other bees which way to fly and how far to go.\n\nThe queen has one main job, which is laying eggs. In summer, she can lay more than a thousand eggs in a day. Without the work of bees, many fruits and vegetables, such as apples, cherries, and pumpkins, would be much harder to grow."},
    {"id":"g5-003","g":5,"topic":"animals","t":"Diary of a Penguin Watcher","x":"Dear Diary,\n\nToday our class visited the aquarium in Boston, and I finally saw the penguins up close. I was surprised by how fast they swam. On land they waddled slowly, but in the water they zipped around like tiny rockets. Our guide told us that penguins can't fly, but their wings work like flippers. She also said that almost all wild penguins live in the Southern Hemisphere, so you would never see one at the North Pole.\n\nMy favorite was a little penguin named Pebble. He kept diving for fish and then hopping onto a rock to shake off. I took notes, drew three sketches, and asked more questions than anyone else. I can't wait to go back."},
    {"id":"g5-004","g":5,"topic":"animals","t":"Why Elephants Need Their Trunks","x":"An elephant's trunk is one of the most useful body parts in the animal world. It is really a long nose joined with the upper lip, and it has thousands of muscles. Elephants use their trunks to breathe, smell, drink, and grab food. A thirsty elephant sucks water into its trunk and then sprays it into its mouth. On hot days, it may spray water or dust over its back to stay cool.\n\nTrunks are also used for saying hello. Two elephants often touch trunks when they meet, a bit like a handshake. African elephants have two small tips at the end of their trunks, but Asian elephants have only one. Those tips help them pick up things as small as a single peanut."},
    {"id":"g5-005","g":5,"topic":"science","t":"Why Ice Is Lighter Than Water","x":"Most things get smaller when they freeze, but water is different. When water turns into ice, its tiny particles line up in a pattern that takes up more space. That means ice is less dense than liquid water, so it floats. You can see this every time you drop ice cubes into a glass of juice.\n\nThis odd fact matters a lot to living things. In winter, a layer of ice forms on top of a lake, and the water below stays liquid. Fish, frogs, and turtles can survive there until spring. If ice sank, lakes could freeze from the bottom up, and many of the animals in them would have nowhere to go. I think it's amazing that something as simple as an ice cube can teach us so much."},
    {"id":"g5-006","g":5,"topic":"science","t":"A Simple Rainbow Experiment","x":"You can make your own rainbow with just a glass of water, a sunny window, and a sheet of white paper. First, fill the glass almost to the top. Next, set it on a table near the window so that sunlight passes through the water. Then hold the paper where the light lands, and move it slowly until you see colors appear.\n\nWhat is happening? Sunlight looks white, but it is really a mix of many colors. When light passes through water, it bends, and each color bends by a slightly different amount. The colors spread out into red, orange, yellow, green, blue, and violet. Real rainbows in the sky form the same way, when sunlight shines through tiny drops of rain."},
    {"id":"g5-007","g":5,"topic":"science","t":"Magnets at Work","x":"Last week, Ms. Rivera gave each of us a bar magnet and a tray of small objects. We tested paper clips, coins, a rubber band, a nail, and a plastic spoon. The paper clips and the nail jumped right to the magnet, but the rubber band and the spoon did not move at all. The coins did not stick either, which surprised me.\n\nMs. Rivera explained that magnets pull on certain metals, such as iron, nickel, and steel. Every magnet has two ends called poles. If you put two north poles together, they push apart. If a north pole faces a south pole, the two magnets pull together. By the end of class, Jamal and I had built a little car that rolled away when we pointed another magnet at it."},
    {"id":"g5-008","g":5,"topic":"science","t":"How Sound Travels","x":"Every sound you hear starts with something that vibrates, or moves back and forth very quickly. When you pluck a guitar string, it shakes the air around it. Those shakes pass from one bit of air to the next, like a wave moving through a crowd at a ball game. When the wave reaches your ear, your eardrum vibrates too, and your brain turns that into sound.\n\nSound can also travel through water and solid things. In fact, it moves faster through water than through air, and even faster through wood or steel. If you put your ear on a table and tap the other end, the knock sounds louder than it does through the air. Out in space, there is almost no air, so there is nothing to carry sound. Astronauts use radios to talk to each other."},
    {"id":"g5-009","g":5,"topic":"space","t":"Mars, the Red Planet","x":"Mars is the fourth planet from the Sun, and it is often called the Red Planet. Its color comes from rusty dust that covers much of its surface. Mars is smaller than Earth, and it is much colder. Its air is very thin, so people could not breathe there without special suits.\n\nMars has some amazing places. Olympus Mons is the tallest volcano in the solar system, and it is more than twice as tall as Mount Everest. Mars also has two tiny moons named Phobos and Deimos. Since the 1990s, NASA has sent several rovers to explore the planet. They have taken pictures, drilled into rocks, and found signs that water once flowed there long ago."},
    {"id":"g5-010","g":5,"topic":"space","t":"Letter From a Young Astronomer","x":"Dear Aunt Maya,\n\nThank you so much for the telescope you sent for my birthday! Dad and I set it up in the backyard on Saturday night. First, we looked at the Moon, and I could see craters all along its edge. Then we found Jupiter, which looked like a bright little ball. Next to it were four tiny dots in a line. Dad said they were Jupiter's biggest moons, and that Galileo first saw them more than 400 years ago. I wanted to look at Saturn's rings too, but it was too low in the sky that night. I'm keeping a log of everything I see, with the date and time. Maybe someday I'll discover a comet and name it after you.\n\nLove, Sofia"},
    {"id":"g5-011","g":5,"topic":"space","t":"Life Aboard the Space Station","x":"The International Space Station circles Earth about every ninety minutes. That means the astronauts on board see around sixteen sunrises and sunsets every day! The station is about as long as a football field, and people from many countries have lived and worked there since 2000.\n\nLife in space is very different from life at home. Because everything floats, astronauts strap themselves into sleeping bags attached to the walls. They drink from pouches with straws, and they eat food that won't crumble, since crumbs could drift into equipment. To keep their muscles and bones strong, they exercise for about two hours each day. They also run science experiments, take photos of Earth, and talk with students back on the ground."},
    {"id":"g5-012","g":5,"topic":"space","t":"The Sun, Our Nearest Star","x":"The Sun may look small in the sky, but it is huge. More than a million Earths could fit inside it. The Sun is a star, just like the tiny points of light we see at night. It looks so much bigger and brighter because it is much closer to us than any other star.\n\nThe Sun is a giant ball of hot gases, and its light takes about eight minutes to reach Earth. Without that light and heat, plants could not grow, and our planet would be frozen. People should never look straight at the Sun, even with sunglasses, because it can hurt their eyes. Scientists study it with special telescopes, and they have learned that it will keep shining for billions of years."},
    {"id":"g5-013","g":5,"topic":"earth","t":"From Magma to Lava","x":"Deep under the ground, it is so hot that some rock melts into a thick liquid called magma. Magma is lighter than the solid rock around it, so it slowly rises. Sometimes it collects in a chamber beneath a mountain. When enough pressure builds up, the magma bursts out through an opening, and the volcano erupts. Once magma reaches the surface, it is called lava.\n\nSome volcanoes, like Kilauea in Hawaii, ooze rivers of lava that flow fairly slowly. Others explode and send ash high into the sky. Over time, cooled lava can build new land. In fact, the Hawaiian Islands were formed by volcanoes rising from the floor of the Pacific Ocean, one island at a time."},
    {"id":"g5-014","g":5,"topic":"earth","t":"The Water Cycle Journey","x":"Imagine you are a tiny drop of water in the ocean. One sunny morning, the Sun warms you, and you rise into the air as an invisible gas. This step is called evaporation. High in the sky, the air is cold, so you cool down and join other drops to form a cloud. That step is called condensation.\n\nAs more drops crowd together, the cloud grows heavy. Soon you fall back to the ground as rain, snow, sleet, or hail. This is precipitation. You might land in a river, soak into the soil, or freeze on top of a mountain. Someday, you will flow back to the sea, and the whole trip will start again. The same water has been going around and around on Earth for billions of years."},
    {"id":"g5-015","g":5,"topic":"earth","t":"How Seeds Travel","x":"Plants can't walk, but their seeds still find ways to travel. Some seeds float on the wind. A dandelion seed has a soft, fluffy top that works like a tiny parachute. Maple seeds have wings, so they spin like helicopters as they fall. Other seeds ride along on animals. Burrs have little hooks that catch on fur, socks, and shoelaces.\n\nCoconuts can even travel across the ocean. Their hard shells hold air, so they float for weeks before washing up on a beach. Birds and squirrels help too. They eat berries and nuts, and then they drop or bury the seeds far from the parent plant. When I found a burr stuck to my dog after a hike, I realized she had been helping a plant spread its seeds."},
    {"id":"g5-016","g":5,"topic":"earth","t":"Rocks That Tell Stories","x":"Geologists sort rocks into three main groups. Igneous rocks form when melted rock cools and hardens. Granite and basalt are two examples. Sedimentary rocks form when layers of sand, mud, and tiny shells are pressed together over a very long time. Sandstone and limestone are in this group, and they often hold fossils.\n\nMetamorphic rocks begin as one kind of rock, but heat and pressure deep underground change them into something new. For example, limestone can turn into marble. At the Grand Canyon in Arizona, you can see layers of rock stacked like the pages of a book. Each layer tells part of the story of what the land was like millions of years ago."},
    {"id":"g5-017","g":5,"topic":"history","t":"Lewis and Clark Head West","x":"In 1804, Meriwether Lewis and William Clark set out from near St. Louis to explore the land west of the Mississippi River. President Thomas Jefferson wanted to learn about the plants, animals, rivers, and people of the West. The group traveled by boat, on foot, and on horseback. They kept careful journals and drew maps along the way.\n\nA young Shoshone woman named Sacagawea joined the group, and she helped them talk with Native American nations they met. After more than a year, the explorers finally reached the Pacific Ocean in 1805. They returned to St. Louis in 1806 with notes about hundreds of plants and animals that were new to them."},
    {"id":"g5-018","g":5,"topic":"history","t":"Ben Franklin's Busy Life","x":"Benjamin Franklin was one of the most curious people in American history. He was born in Boston in 1706, but he moved to Philadelphia when he was seventeen. There, he worked as a printer and published a popular yearly book called Poor Richard's Almanack. It was full of weather guesses, jokes, and wise sayings.\n\nFranklin loved science, too. He studied electricity and invented the lightning rod, which helps protect buildings during storms. He also invented bifocal glasses and a stove that heated rooms better than an open fire. Later, he helped write the Declaration of Independence. People still remember him as a writer, scientist, inventor, and leader."},
    {"id":"g5-019","g":5,"topic":"history","t":"A Day in Ancient Egypt","x":"Long ago, a boy named Ahmose lived near the Nile River in ancient Egypt. Every summer, the river flooded and spread rich, dark mud over the fields. When the water went down, Ahmose helped his father plant wheat and barley. His mother baked bread, and his sister wove linen cloth from flax plants.\n\nIn the afternoon, Ahmose sometimes went to the river to watch boats carry huge stones to the builders. Their work was slow and hard, but the great pyramids took shape year after year. Scribes wrote on sheets made from papyrus reeds, using little pictures called hieroglyphs. Ahmose hoped that someday he could learn to read them too."},
    {"id":"g5-020","g":5,"topic":"history","t":"The Pony Express Riders","x":"In 1860, sending a letter from Missouri to California could take weeks or even months. The Pony Express promised to do it in about ten days. Young riders carried the mail on fast horses across plains, deserts, and mountains. Every ten to fifteen miles, a rider reached a station where a fresh horse was waiting. He jumped onto the new horse and galloped off again in just a couple of minutes.\n\nThe riders traveled day and night, in rain, snow, and heat. However, the Pony Express lasted only about eighteen months. In 1861, a telegraph line was finished that could send messages across the country in minutes. After that, there was no need for horses to race the mail west."},
    {"id":"g5-021","g":5,"topic":"world","t":"A Letter From Paris","x":"Dear Grandpa,\n\nGreetings from Paris, France! Yesterday, we climbed the Eiffel Tower. We took the stairs to the second level, and then we rode an elevator to the top. From there, the cars looked like ants, and I could see the Seine River winding through the city. Mom said the tower was built for a world's fair in 1889. Today we ate warm croissants for breakfast and visited the Louvre, a huge art museum. I saw the Mona Lisa, but it was smaller than I expected, and there were lots of people in front of it. Tomorrow we're taking a boat ride on the river. I miss you, and I'll bring you a little model of the tower.\n\nYour grandson, Leo"},
    {"id":"g5-022","g":5,"topic":"world","t":"Japan, a Land of Islands","x":"Japan is a country in East Asia made up of thousands of islands. Most people live on the four largest ones, and the biggest of all is called Honshu. Tokyo, the capital, is one of the largest cities in the world. Trains there are famous for being fast and on time. The bullet train can travel at almost 200 miles per hour.\n\nJapan also has quiet gardens, old castles, and tall mountains. Mount Fuji is its highest peak, and on a clear day you can see it from Tokyo. Each spring, cherry trees bloom with pink and white flowers, and families gather in parks to enjoy them. Many people in Japan eat rice, fish, and vegetables, and they often use chopsticks."},
    {"id":"g5-023","g":5,"topic":"world","t":"Reading a Map Key","x":"A map is a drawing of a place as seen from above. To understand one, you need to read its key, which is sometimes called a legend. The key explains what each symbol means. For example, a small tent might stand for a campground, and a blue line might show a river. Most maps also have a compass rose that shows north, south, east, and west.\n\nLast summer, my cousin Ava and I used a trail map in Yellowstone National Park. We found our lodge, a picnic area, and a path that led to a waterfall. The map's scale showed that one inch stood for one mile, so we could tell how far we had to walk. Thanks to the map, we never got lost, and we made it back before dinner."},
    {"id":"g5-024","g":5,"topic":"world","t":"The Mighty Amazon River","x":"The Amazon River flows across South America, mostly through Brazil. It carries more water than any other river on Earth. In fact, it holds more water than the next several biggest rivers combined. During the rainy season, parts of the river spread out so wide that you can't see the other side.\n\nThe river runs through the Amazon rainforest, which is the largest rainforest in the world. More kinds of plants and animals live there than almost anywhere else. Pink river dolphins swim in its waters, and colorful parrots, sloths, and monkeys live in the trees. Many people live along the river too. They fish, farm, and travel by boat, since there are very few roads in some parts of the forest."},
    {"id":"g5-025","g":5,"topic":"everyday","t":"The Great Bake Sale","x":"Our fifth-grade class needed money for a trip to the science museum, so we decided to hold a bake sale. Everyone signed up to bring something. Priya made lemon bars, Marcus brought banana bread, and I baked two dozen oatmeal cookies with my dad. We set up tables in the front hall of the school on Friday morning.\n\nAt first, only a few people stopped by, and I was worried. Then the bell rang for lunch, and a long line formed. By two o'clock, we had sold almost everything. We counted the money three times to be sure. We had raised more than enough for the trip, so we gave the extra money to the school library for new books."},
    {"id":"g5-026","g":5,"topic":"everyday","t":"My Job List at Home","x":"In my family, everyone has chores, even my little sister, who is six. Every Sunday night, Mom writes a list on the kitchen whiteboard. My jobs usually include feeding our cat, taking out the trash, and folding the laundry. My brother washes the dishes, and my sister sets the table before dinner.\n\nI used to complain about chores, but now I don't mind them as much. Dad showed me that if I finish them quickly, I have more time to read or play outside. Last month, I also learned to make scrambled eggs, so now I cook breakfast on Saturdays. It feels good to help, and our house runs more smoothly when we all work together."},
    {"id":"g5-027","g":5,"topic":"everyday","t":"A Snow Day Surprise","x":"When I woke up on Tuesday, my room was strangely quiet. I looked out the window and saw that the whole street was covered in snow. Then Mom called up the stairs that school was closed for the day! I ran downstairs, ate a bowl of oatmeal, and pulled on my boots, coat, hat, and mittens.\n\nMy friend Nora and her brother met me at the park. We built a snowman with a carrot nose, and then we had a snowball battle that lasted almost an hour. Our fingers grew so cold that we went to Nora's house for hot cocoa. Her mom let us watch a movie, and we stayed warm by the fire. It was the best snow day I can remember."},
    {"id":"g5-028","g":5,"topic":"everyday","t":"Planning a Family Picnic","x":"A picnic is a fun way to spend a sunny afternoon, but it takes a little planning. First, choose a spot, such as a park, a beach, or your own backyard. Next, check the weather so you don't get caught in the rain. Then make a list of food that is easy to carry. Sandwiches, fruit, cheese, and crackers are all good choices, and they won't spill.\n\nPack a blanket, napkins, and plenty of water. Put cold foods in a cooler with ice so that they stay fresh. When you arrive, find a shady place to spread out your blanket. After you eat, play a game of catch or tag. Before you leave, pick up all your trash, so the park stays clean for the next family."},
    {"id":"g5-029","g":5,"topic":"sports","t":"How Basketball Began","x":"In 1891, a teacher named James Naismith had a problem. It was winter in Springfield, Massachusetts, and his students were stuck inside with too much energy. He needed a game they could play indoors. Naismith nailed two peach baskets to the railing of a balcony and gave the class a soccer ball. The goal was to toss the ball into the other team's basket.\n\nThe first games were a little clumsy. Every time someone scored, a person had to climb up and get the ball out of the basket! Years later, people cut holes in the bottoms of the nets. Basketball spread quickly to other schools, and today it is played by millions of people in countries around the world."},
    {"id":"g5-030","g":5,"topic":"sports","t":"My First Swim Meet","x":"On Saturday morning, I stood on the starting block at my first swim meet. My knees were shaking, and my stomach felt like it was full of butterflies. I looked up at the stands and saw my parents waving a sign with my name on it. Then the whistle blew, and I dove into the cool water.\n\nI swam the fifty-yard freestyle, which is two lengths of the pool. I kicked hard, kept my head down, and breathed every three strokes, just like Coach Lee had taught us. When I touched the wall, I looked at the clock. I didn't win, but I finished third and beat my best time by two seconds. Coach Lee gave me a high five, and I couldn't stop smiling."},
    {"id":"g5-031","g":5,"topic":"sports","t":"Learning the Game of Chess","x":"Chess is a game for two players, and it has been played for more than a thousand years. Each player begins with sixteen pieces, which are one king, one queen, two rooks, two bishops, two knights, and eight pawns. Each kind of piece moves in its own way. For example, bishops move diagonally, while knights jump in an L shape.\n\nThe goal of the game is to trap the other player's king so that it can't escape. This is called checkmate. Good players think several moves ahead, and they try to guess what their opponent will do next. My grandfather taught me to play when I was eight. At first, he won every game, but last week I finally beat him, and he said he was proud of me."},
    {"id":"g5-032","g":5,"topic":"sports","t":"Soccer Around the World","x":"Soccer is the most popular sport in the world. In most countries, people call it football, since players mainly use their feet. A team has eleven players on the field, and only the goalkeeper is allowed to touch the ball with his or her hands during play. The rest of the team must kick, pass, and head the ball toward the other team's goal.\n\nEvery four years, teams from many nations compete in the World Cup. The first World Cup was held in Uruguay in 1930. You don't need much to play, though. Kids in cities, villages, and farms play with a ball and two rocks for goalposts. My friends and I play every day after school, and our games often last until it gets dark."},
    {"id":"g5-033","g":5,"topic":"arts","t":"Making a Clay Pinch Pot","x":"A pinch pot is one of the easiest things to make with clay. First, roll a lump of clay into a smooth ball about the size of an orange. Next, push your thumb into the center, but don't go all the way through. Then pinch the sides gently between your thumb and fingers while you turn the ball in your hand. Keep pinching and turning until the walls are even.\n\nIf the clay starts to crack, dip your finger in a little water and smooth it over. When you're happy with the shape, you can press patterns into the sides with a pencil, a shell, or a leaf. Let the pot dry for several days. Finally, paint it with bright colors, and use it to hold paper clips, rings, or coins."},
    {"id":"g5-034","g":5,"topic":"arts","t":"Meet the Orchestra Families","x":"An orchestra is a large group of musicians who play together. The instruments are sorted into four families. The string family includes violins, violas, cellos, and basses. The woodwind family includes flutes, clarinets, oboes, and bassoons. Brass instruments, such as trumpets and tubas, are made of metal and are played by buzzing the lips. The percussion family includes drums, cymbals, and the xylophone.\n\nThe conductor stands in front and leads the group with a thin stick called a baton. Last spring, my class went to hear our city's orchestra. When all the instruments played at once, the sound filled the whole hall. I liked the cellos best, so I'm going to try one at school next year."},
    {"id":"g5-035","g":5,"topic":"arts","t":"A Visit From an Author","x":"Last Thursday, a children's book author came to visit our school. She told us that she wrote her first story when she was nine, and it was about a dragon who was afraid of the dark. Her teacher liked it so much that she hung it on the wall. After that, the author never stopped writing.\n\nShe showed us how she plans a book. First, she makes a list of ideas in a notebook. Then she writes a messy first draft, and later she fixes it again and again. She said that even famous writers make lots of mistakes, but they keep working until the story feels right. That night, I started my own story about a cat who sails across the ocean in a teacup."},
    {"id":"g5-036","g":5,"topic":"arts","t":"The Art of Origami","x":"Origami is the art of folding paper into shapes, and its name comes from two Japanese words meaning fold and paper. People in Japan have practiced it for hundreds of years. With just one square sheet and no scissors or glue, a skilled folder can make birds, frogs, flowers, and boats.\n\nOne of the most famous designs is the paper crane. In Japan, there is an old tradition that if you fold a thousand cranes, you may be granted a wish. My friend Kenji showed me how to make a crane during recess. My first try was crooked, and its wings were uneven. By the end of the week, though, I had folded twelve cranes, and I hung them over my desk."},
    {"id":"g5-037","g":5,"topic":"inventions","t":"The Bicycle Makers Who Flew","x":"Wilbur and Orville Wright ran a bicycle shop in Dayton, Ohio, but they dreamed of flying. For years, they studied birds, built gliders, and tested their ideas in a homemade wind tunnel. They learned how to steer a flying machine by twisting its wings, which was something no one else had figured out.\n\nOn December 17, 1903, they were ready. On a windy beach near Kitty Hawk, North Carolina, Orville climbed aboard their airplane, the Flyer. It rose into the air and stayed up for about twelve seconds. That doesn't sound like much, but it was the first powered, controlled airplane flight in history. The brothers made three more flights that day, and Wilbur's longest lasted almost a minute."},
    {"id":"g5-038","g":5,"topic":"inventions","t":"How a Refrigerator Keeps Cold","x":"A refrigerator doesn't really make cold. Instead, it moves heat out of the box and into the kitchen. Inside the walls and back of a fridge are thin tubes filled with a special liquid. When this liquid turns into a gas, it soaks up heat from the food and air inside. A pump called a compressor then squeezes the gas, and it gives off that heat through coils on the back.\n\nThat is why the back of a refrigerator often feels warm. Before people had refrigerators, families kept food cool with blocks of ice in wooden iceboxes. Someone had to deliver new ice every few days. Today, a fridge keeps milk, fruit, and leftovers fresh for days without any ice at all."},
    {"id":"g5-039","g":5,"topic":"inventions","t":"The Printing Press Changes Everything","x":"Long ago, books were copied by hand, one page at a time. A single book could take months to finish, so books were rare and very expensive. Around 1450, a German metalworker named Johannes Gutenberg built a printing press that used small metal letters. Workers arranged the letters into words, covered them with ink, and pressed paper on top.\n\nWith Gutenberg's press, a shop could print hundreds of pages in a day. Soon, printing presses spread across Europe, and books became much cheaper. More people learned to read, and new ideas traveled faster than ever before. Many people think the printing press was one of the most important inventions in history, and I agree with them."},
    {"id":"g5-040","g":5,"topic":"inventions","t":"The Story of the Telephone","x":"In 1876, Alexander Graham Bell received a patent for the telephone. A few days later, he spoke the first words ever heard over his invention. He called to his helper, Thomas Watson, who was in another room. Bell said, \"Mr. Watson, come here, I want to see you.\" Watson heard the words through the wire and rushed in.\n\nEarly telephones were heavy, and they had to be connected by wires. To make a call, you often had to speak to an operator, who plugged your line into the right place. Today, many people carry phones in their pockets that can send photos, play music, and show maps. Still, they all grew out of Bell's simple idea of sending a voice through a wire."},
    {"id":"g6-001","g":6,"topic":"animals","t":"The Remarkable Octopus","x":"The octopus may be one of the cleverest creatures in the ocean. It has eight flexible arms lined with suckers, and each sucker can taste as well as grip. An octopus has no bones, so it can squeeze through any gap larger than its beak. Scientists have watched octopuses open jars, solve simple puzzles, and even escape from their tanks at night.\n\nOctopuses are also masters of disguise. Special cells in their skin let them change color in less than a second, and some can change the texture of their skin to look like rocks or coral. If a predator gets too close, an octopus can squirt a cloud of dark ink and jet away. Surprisingly, an octopus has three hearts and blue blood. Most kinds live for only a year or two, but they pack a lot of learning into that short time."},
    {"id":"g6-002","g":6,"topic":"animals","t":"Monarchs on the Move","x":"Every fall, millions of monarch butterflies in the eastern United States and Canada begin an incredible journey. They fly south, sometimes traveling more than 2,000 miles, to reach the mountain forests of central Mexico. There, they cluster together on fir trees by the thousands, covering the branches like orange leaves. The cool mountain air helps them rest through the winter without using too much energy.\n\nWhat makes this trip so amazing is that no single butterfly has made it before. The monarchs that fly south are the great-grandchildren, or even great-great-grandchildren, of the ones that left Mexico the spring before. In March, they head north again, laying eggs on milkweed plants along the way. Scientists are still studying how monarchs find their way, but they think the butterflies use the position of the Sun as a guide."},
    {"id":"g6-003","g":6,"topic":"animals","t":"Field Notes on Backyard Birds","x":"Saturday, April 12\n\nThis morning, I set up the bird feeder that Grandpa and I built from scrap wood. I filled it with sunflower seeds and hung it from the maple tree outside the kitchen window. For almost an hour, nothing happened, and I began to think my plan had failed. Then a pair of chickadees appeared, followed by a bright red cardinal.\n\nBy lunchtime, I had counted seven different species. The blue jays were the loudest, and they chased the smaller birds away whenever they arrived. A downy woodpecker clung to the side of the feeder instead of perching on it. I sketched each bird in my notebook and wrote down the time I saw it. Tomorrow, I'm going to add a dish of water, because Grandpa says birds need a place to drink and bathe, too."},
    {"id":"g6-004","g":6,"topic":"animals","t":"How Camels Survive the Desert","x":"Camels are perfectly suited to life in the desert, where water is scarce and temperatures can swing from scorching days to chilly nights. Many people believe that a camel's hump stores water, but that isn't true. The hump is actually made of fat, which the camel's body can break down for energy when food is hard to find.\n\nA camel can go for days without drinking, and when it finally reaches water, it can gulp down more than 25 gallons in just a few minutes. Its long eyelashes and closable nostrils keep out blowing sand, while its wide, padded feet keep it from sinking into the dunes. For thousands of years, people in Africa and Asia have relied on camels to carry goods across vast deserts, so camels are sometimes called ships of the desert."},
    {"id":"g6-005","g":6,"topic":"science","t":"The Mystery of Static Electricity","x":"Have you ever rubbed a balloon on your hair and watched it stick to a wall? Have you felt a tiny shock when you touched a doorknob after walking across a carpet? Both of these surprises are caused by static electricity.\n\nEverything around us is made of atoms, and atoms contain tiny particles called electrons. When two materials rub together, some electrons can jump from one to the other. The object that gains extra electrons becomes negatively charged, while the one that loses them becomes positively charged. Opposite charges attract each other, so the balloon clings to the wall. When you touch a doorknob, the extra charge rushes away all at once, and you feel a spark. Static shocks happen more often in winter, because dry air lets charges build up more easily than damp air does."},
    {"id":"g6-006","g":6,"topic":"science","t":"Testing Paper Towels","x":"For the science fair, Elena and I decided to test which of three kinds of paper towels soaked up the most water. We called them Towel A, Towel B, and Towel C so that we wouldn't be influenced by the packages. First, we cut each towel into a square of the same size. Then we dipped each square into a cup of water for ten seconds and let it drip for another ten.\n\nAfter that, we squeezed each towel into an empty measuring cup and recorded how much water came out. We repeated the test five times for each towel, because one trial is never enough to trust. Towel B held the most water every single time, even though it was the cheapest. Our teacher, Mr. Okafor, said our best decision was keeping everything the same except the towel. Scientists call that a fair test."},
    {"id":"g6-007","g":6,"topic":"science","t":"Why Leaves Change Color","x":"In summer, most leaves are green because they are full of chlorophyll, a substance that helps plants turn sunlight, water, and air into food. Chlorophyll is so plentiful that it hides the other colors in the leaf. Yellow and orange pigments are there all summer long, but we simply can't see them.\n\nAs autumn arrives, the days grow shorter and the nights become cooler. Trees such as maples, oaks, and birches respond by slowly shutting down their food-making factories. The chlorophyll breaks down, and the hidden yellows and oranges finally appear. Some trees also make new red and purple pigments in the fall, especially when the days are sunny and the nights are crisp. Eventually, the leaves drop to the ground, and the trees rest until spring. Then they grow fresh green leaves, and the cycle begins again."},
    {"id":"g6-008","g":6,"topic":"science","t":"Germs and Handwashing","x":"Germs are living things so small that you need a microscope to see them. Many are harmless, and some even help us digest food. However, certain germs can make people sick, and they spread easily from hands to faces, doorknobs, and shared pencils.\n\nIn the 1840s, a Hungarian doctor named Ignaz Semmelweis noticed that fewer patients got sick when doctors washed their hands. At the time, many people didn't believe him, but later scientists proved he was right. Today, washing your hands is one of the best ways to stay healthy. Wet your hands, add soap, and scrub for at least twenty seconds, which is about as long as singing the birthday song twice. Don't forget the backs of your hands, between your fingers, and under your nails. Then rinse them well and dry them with a clean towel."},
    {"id":"g6-009","g":6,"topic":"space","t":"Saturn's Spectacular Rings","x":"Saturn is the sixth planet from the Sun, and its rings make it one of the most beautiful sights in the solar system. From far away, the rings look solid, but they are actually made of countless pieces of ice and rock. Some are as tiny as grains of sand, while others are as large as houses. The rings stretch out for many thousands of miles, yet in most places they are surprisingly thin.\n\nGalileo was the first person to see Saturn's rings through a telescope, in 1610, but his telescope was too weak to show them clearly. He thought the planet had two large moons on either side! Decades later, astronomers realized that the strange bulges were rings. Saturn is not the only planet with rings, though. Jupiter, Uranus, and Neptune have them too, but theirs are much fainter."},
    {"id":"g6-010","g":6,"topic":"space","t":"One Small Step on the Moon","x":"On July 20, 1969, millions of people around the world gathered around their televisions. They were watching the Apollo 11 mission, which had carried three astronauts to the Moon. While Michael Collins circled overhead in the command module, Neil Armstrong and Buzz Aldrin landed on the surface in a small craft called the Eagle.\n\nArmstrong climbed down the ladder first. As he stepped onto the dusty ground, he said, \"That's one small step for man, one giant leap for mankind.\" Aldrin soon joined him, and the two men collected rocks, took photographs, and set up experiments. Their footprints are probably still there today, because the Moon has no wind or rain to wash them away. The astronauts returned safely to Earth four days later, splashing down in the Pacific Ocean."},
    {"id":"g6-011","g":6,"topic":"space","t":"Comets, Icy Visitors","x":"Comets are sometimes called dirty snowballs, because they are made of ice, dust, and rock. Most of the time, they travel in the cold, distant parts of the solar system, far beyond Neptune. Every so often, however, a comet's long, oval path brings it close to the Sun. As it warms up, some of its ice turns into gas, and a glowing cloud forms around it. The Sun's energy pushes this material into a tail that can stretch for millions of miles.\n\nThe most famous comet is probably Halley's Comet. It returns to our part of the sky about every 75 or 76 years. The English astronomer Edmond Halley studied old records and correctly predicted that it would return in 1758. It was last seen from Earth in 1986, and it should appear again in 2061. I'll be pretty old by then, but I'm already planning to watch."},
    {"id":"g6-012","g":6,"topic":"space","t":"Why We Have Seasons","x":"Many people think that summer happens because Earth moves closer to the Sun, but that isn't the reason. In fact, Earth is closest to the Sun in early January, which is winter in the United States. The real cause of the seasons is the tilt of Earth's axis.\n\nEarth spins on an imaginary line that runs from the North Pole to the South Pole, and this line is tilted. As Earth travels around the Sun each year, the tilt stays pointed in the same direction. For part of the year, the Northern Hemisphere leans toward the Sun. Sunlight strikes it more directly, and the days are longer, so it's summer there. Six months later, the Northern Hemisphere leans away, and the days grow short and cold. Meanwhile, countries like Australia and Argentina have their seasons at the opposite times of year."},
    {"id":"g6-013","g":6,"topic":"earth","t":"A Reef Full of Life","x":"Off the northeast coast of Australia lies the Great Barrier Reef, the largest coral reef system on Earth. It stretches for about 1,400 miles and is made up of thousands of separate reefs and hundreds of islands. It is so large that astronauts can see it from space.\n\nAlthough coral may look like colorful rocks or plants, it is actually made of tiny animals called polyps. Each polyp builds a hard skeleton around itself, and over thousands of years, these skeletons pile up to form reefs. The Great Barrier Reef is home to an amazing variety of life, including sea turtles, sharks, and more than a thousand kinds of fish. Scientists work hard to protect it, because coral can be harmed by pollution and by water that becomes too warm."},
    {"id":"g6-014","g":6,"topic":"earth","t":"The Power of Glaciers","x":"A glacier is a huge, slow-moving river of ice. Glaciers form in places where more snow falls in winter than melts in summer. Year after year, the snow piles up and gets pressed into thick ice. Eventually, the ice becomes so heavy that it begins to slide downhill, usually moving only a few inches or feet each day.\n\nAs glaciers creep along, they act like giant bulldozers. They scrape the land, pick up rocks, and carve deep valleys. Thousands of years ago, during the last ice age, glaciers covered much of Canada and the northern United States. When they melted, they left behind hills, boulders, and lakes. In fact, the Great Lakes were shaped in part by glaciers. Today, you can still visit glaciers in Alaska, Montana, and many other places."},
    {"id":"g6-015","g":6,"topic":"earth","t":"Exploring a Tide Pool","x":"When the tide went out on the rocky coast of Maine, my sister Grace and I grabbed our notebooks and a magnifying glass and headed for the tide pools. These small pools of seawater get trapped among the rocks when the ocean pulls back. At first, they looked empty, but when we knelt down and watched quietly, they came alive.\n\nA green crab scuttled sideways under a ledge, and a periwinkle snail inched along the bottom. Grace spotted a purple sea star clinging to a rock, and I found a cluster of mussels with shiny blue shells. We were careful not to pull anything off the rocks, since many tide pool creatures can be hurt that way. Before the tide came back in, we filled our notebooks with drawings, and then we climbed back up to the beach to dry off."},
    {"id":"g6-016","g":6,"topic":"earth","t":"How Soil Is Made","x":"It's easy to walk across the ground without thinking about it, but soil is one of the most important materials on Earth. Nearly all the food we eat depends on it. Soil forms very slowly, sometimes taking hundreds of years to build up just one inch.\n\nThe process begins when rock is broken into smaller pieces by wind, water, ice, and the roots of plants. This is called weathering. Over time, the tiny bits of rock mix with dead leaves, twigs, and other once-living things. Earthworms, insects, fungi, and bacteria break down this material into a dark, rich substance. It holds water and gives plants the nutrients they need to grow. Healthy soil also contains air spaces, which let roots breathe and water drain. Farmers and gardeners take care of their soil, because once it washes away, it's very hard to replace."},
