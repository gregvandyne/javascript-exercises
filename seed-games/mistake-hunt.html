    {"id":"g6-017","g":6,"topic":"history","t":"Building the Great Wall","x":"The Great Wall of China is not just one wall but a long series of walls, towers, and forts built over many centuries. Different Chinese rulers added to it, beginning more than two thousand years ago. Most of the sections that visitors see today were built during the Ming dynasty, which ruled from 1368 to 1644.\n\nThe wall was built to protect China's northern border. Soldiers stood guard in watchtowers, and they used smoke and fire signals to warn each other when trouble was coming. Building the wall was extremely hard work, and workers used stone, brick, and even packed earth. If you added together all of its branches, the total length would be more than 13,000 miles. Despite a popular myth, though, you can't really see the wall from the Moon."},
    {"id":"g6-018","g":6,"topic":"history","t":"The California Gold Rush","x":"In January 1848, a carpenter named James Marshall noticed something shiny in a stream at Sutter's Mill in California. It was gold. News of the discovery spread slowly at first, but by 1849, thousands of people were rushing west to strike it rich. These fortune seekers were nicknamed forty-niners, after the year they arrived.\n\nThe forty-niners came from all over the United States and from countries as far away as China, Chile, and Australia. They traveled by wagon, by ship, and on foot. Most of them panned for gold by swirling sand and water in a shallow metal dish. A few found great fortunes, but many found very little. Still, the Gold Rush changed California forever. San Francisco grew from a small town into a busy city, and California became a state in 1850."},
    {"id":"g6-019","g":6,"topic":"history","t":"Building the Statue of Liberty","x":"The Statue of Liberty was a gift from the people of France to the United States. A French sculptor named Frederic Auguste Bartholdi designed it, and the engineer Gustave Eiffel planned the iron framework inside. Eiffel later became famous for building the Eiffel Tower in Paris.\n\nThe statue was built in France, then taken apart and shipped across the Atlantic Ocean in more than 200 crates. Meanwhile, Americans raised money to build the giant pedestal it would stand on. Many children donated their pennies to help. Finally, in 1886, the statue was put back together on an island in New York Harbor. Its copper skin was shiny brown at first, but over the years, it slowly turned the pale green color we see today."},
    {"id":"g6-020","g":6,"topic":"history","t":"Life in a Medieval Castle","x":"Many people picture castles as grand palaces, but life inside a medieval castle was often cold, dark, and crowded. Castles were built mainly for protection. Their thick stone walls, narrow windows, and deep moats made them hard to attack. The great hall was the center of daily life, where the lord, his family, and their servants ate together at long wooden tables.\n\nA castle was like a small village. Cooks prepared meals in the kitchen, blacksmiths made tools and horseshoes, and stable hands cared for the horses. Children of noble families learned to ride, read, and play music. Some boys trained to become knights, starting as pages around the age of seven. Without electricity or glass in many windows, people relied on candles, fireplaces, and heavy tapestries to keep their rooms warm and bright."},
    {"id":"g6-021","g":6,"topic":"world","t":"Market Day in Marrakesh","x":"The narrow streets of the old city of Marrakesh, in Morocco, were already crowded when my family arrived at the market. Stalls overflowed with spices, dates, olives, and colorful woven rugs. The air smelled of mint and cinnamon, and merchants called out to shoppers in Arabic, French, and English.\n\nMy father bargained with a seller for a brass lantern, which is a normal part of shopping there. They went back and forth until they agreed on a fair price, and then they both smiled and shook hands. Later, we sat at a small cafe and drank sweet mint tea from tiny glasses. As the sun set, the main square filled with musicians, storytellers, and food stands. It was louder and busier than any place I'd ever been, and I loved every minute of it."},
    {"id":"g6-022","g":6,"topic":"world","t":"Canada, From Coast to Coast","x":"Canada is the second-largest country in the world by area, stretching from the Atlantic Ocean to the Pacific Ocean and north to the Arctic. Even though it's so big, most Canadians live within a few hundred miles of the southern border with the United States. Its capital is Ottawa, and its largest city is Toronto.\n\nCanada has two official languages, English and French. In the province of Quebec, most people speak French as their first language. The country is known for its vast forests, sparkling lakes, and rugged mountains. In fact, Canada has more lakes than any other country. The maple leaf on its red and white flag is a national symbol, and Canada produces most of the world's maple syrup. Hockey is hugely popular there, and many kids learn to skate almost as soon as they can walk."},
    {"id":"g6-023","g":6,"topic":"world","t":"Understanding Time Zones","x":"When it's noon in New York, it's only nine in the morning in Los Angeles. That's because the world is divided into time zones. Earth makes one complete turn every 24 hours, so the Sun rises over different places at different times. If every city used the same clock, the Sun might be overhead at midnight in some places!\n\nBefore the 1880s, most towns in the United States set their clocks by the Sun, so nearby towns often had slightly different times. This caused confusion for railroads, which needed reliable schedules. In 1883, the railroads adopted standard time zones, and other countries soon created their own. Today, the world has about two dozen main time zones, roughly one for each hour of the day. The lower 48 states use four of them, which are Eastern, Central, Mountain, and Pacific."},
    {"id":"g6-024","g":6,"topic":"world","t":"The Canals of Venice","x":"Venice, Italy, is a city unlike any other. Instead of streets, it has canals, and instead of cars, people get around by boat or on foot. The city is built on more than one hundred small islands in a shallow lagoon, and they are linked by hundreds of bridges.\n\nThe largest waterway is the Grand Canal, which winds through the middle of the city in the shape of a backward S. Water buses carry passengers from stop to stop, and delivery boats bring groceries, packages, and even furniture. The most famous boats in Venice are gondolas, which are long, narrow, and painted black. A gondolier stands at the back and steers with a single oar. Because the city sits so low, high tides sometimes flood its squares, so the people of Venice have learned to live closely with the sea."},
    {"id":"g6-025","g":6,"topic":"everyday","t":"Learning to Bake Bread","x":"Last weekend, my grandmother taught me how to bake bread from scratch. We started by mixing warm water, sugar, and yeast in a large bowl. Within ten minutes, the mixture was foamy, which meant the yeast was alive and working. Then we added flour and salt, stirred everything together, and turned the sticky dough onto the counter.\n\nKneading was harder than I expected. Grandma showed me how to push the dough away with the heels of my hands, fold it over, and turn it. After about ten minutes, it felt smooth and stretchy. We left it in a warm spot to rise, and by the time we came back, it had doubled in size. Finally, we shaped it into a loaf and baked it. The whole house smelled wonderful, and the bread tasted even better than it smelled."},
    {"id":"g6-026","g":6,"topic":"everyday","t":"Starting at a New School","x":"When my family moved from Texas to Oregon in August, I was nervous about starting sixth grade at a school where I didn't know anyone. On the first day, I stood in the doorway of the cafeteria holding my tray, wondering where to sit. Then a girl with curly hair waved at me from a table near the window.\n\nHer name was Maya, and she had moved to town only a year earlier, so she knew exactly how I felt. She introduced me to her friends, showed me where the library was, and explained which teachers gave the most homework. By the end of the week, I had joined the art club and the robotics team. I still miss my old friends, and we talk on video every Sunday, but Oregon is starting to feel like home."},
    {"id":"g6-027","g":6,"topic":"everyday","t":"How to Write a Thank-You Note","x":"A handwritten thank-you note is a simple way to show someone that you appreciate them. It doesn't have to be long, but it should be sincere. Start with a greeting, such as \"Dear Uncle Ray,\" and then thank the person for the specific gift or kind deed. Instead of writing \"Thanks for the present,\" try something like \"Thank you for the book about sharks.\"\n\nNext, explain why it matters to you. You might say that you've already read three chapters or that you plan to use the gift on your next camping trip. Then add a friendly sentence about something else, such as an upcoming visit or a recent event in your life. Finally, sign your name with a warm closing, like \"Love\" or \"Your friend.\" Mail it within a week or two, while the gift is still fresh in everyone's mind."},
    {"id":"g6-028","g":6,"topic":"everyday","t":"Our Friday Game Night","x":"Every Friday, my family turns off the television and gathers around the kitchen table for game night. We take turns choosing the game, so everyone gets a fair chance to pick a favorite. My little brother always chooses a matching game, while my mom prefers word games, and my dad loves anything with dice.\n\nLast week, it was my turn, and I picked a strategy game where players build roads and trade resources. It took almost two hours to finish, and the lead changed hands several times. In the end, my mom won by a single point, and we all groaned and then laughed. Afterward, we made popcorn and talked about our week. Game night isn't really about winning, though. It's about spending time together, and I think that's why it's my favorite night of the week."},
    {"id":"g6-029","g":6,"topic":"sports","t":"The Olympics Return in 1896","x":"The ancient Olympic Games were held in Greece for more than a thousand years, but they ended long ago. In the 1890s, a Frenchman named Pierre de Coubertin decided to bring them back. He believed that sports could build character and bring nations together in friendly competition.\n\nThe first modern Olympic Games took place in Athens, Greece, in 1896. About 240 athletes from 14 countries competed in events such as running, swimming, cycling, wrestling, and fencing. A Greek runner named Spyridon Louis won the marathon, and the crowd cheered so loudly that people said the stadium shook. Today, the Summer and Winter Olympics each take place every four years, and they feature thousands of athletes from more than 200 nations."},
    {"id":"g6-030","g":6,"topic":"sports","t":"Learning to Skateboard","x":"I got my first skateboard for my eleventh birthday, along with a helmet, knee pads, and elbow pads. My cousin Diego, who has been skating for years, offered to teach me. He said the first thing I needed to learn wasn't how to ride, but how to fall safely.\n\nWe practiced in an empty parking lot near the park. At first, I could barely balance, and I fell more times than I could count. Diego showed me how to bend my knees, keep my weight centered, and push off with my back foot. After a week, I could glide across the whole lot without stopping. Then I learned to turn by leaning my body to one side. I'm still not ready for the ramps, but I'm improving every day, and my bruises are healing too."},
    {"id":"g6-031","g":6,"topic":"sports","t":"Baseball's Perfect Diamond","x":"A baseball field is often called a diamond, because the four bases form a square that looks like a diamond from home plate. The bases are exactly 90 feet apart in the major leagues, a distance that has stayed the same for well over a century. Many fans believe this distance is nearly perfect, because a ground ball to the infield and a fast runner often reach first base at almost the same moment.\n\nThe pitcher stands on a small hill called the mound, which is 60 feet, 6 inches from home plate. A batter has less than half a second to decide whether to swing at a fast pitch. Baseball has been called America's pastime since the 1800s, and it's also very popular in countries such as Japan, the Dominican Republic, and Cuba."},
    {"id":"g6-032","g":6,"topic":"sports","t":"The Marathon's Long Road","x":"A marathon is a footrace that covers 26.2 miles. According to a famous Greek legend, a messenger ran all the way from the town of Marathon to Athens to announce a victory. When the first modern Olympics were held in 1896, organizers created a long-distance race to honor that story.\n\nAt first, marathons were not all the same length. The distance of 26.2 miles was used at the 1908 Olympics in London, where the course ran from Windsor Castle to the stadium, and it became the official length in 1921. Today, cities such as Boston, New York, and Chicago host huge marathons each year. Runners train for months, slowly building up their distance. For most people, just crossing the finish line is a great achievement, whether they run, jog, or walk part of the way."},
    {"id":"g6-033","g":6,"topic":"arts","t":"Van Gogh's Swirling Night Sky","x":"The Dutch artist Vincent van Gogh painted The Starry Night in 1889, while he was living in the south of France. The painting shows a small village beneath a night sky filled with swirling clouds, glowing stars, and a bright crescent moon. A tall, dark cypress tree rises in the foreground like a flame.\n\nVan Gogh used thick, bold brushstrokes, and you can almost feel the movement in the sky. Although he created around 900 paintings in about ten years, he sold very few during his lifetime. Today, he is one of the most famous painters in history, and The Starry Night hangs in the Museum of Modern Art in New York City. Every year, millions of visitors come to see his colorful works in museums around the world."},
    {"id":"g6-034","g":6,"topic":"arts","t":"Putting On the School Play","x":"For months, our drama club rehearsed for the spring play, a comedy about a group of friends lost on a mysterious island. I played the captain, which meant I had more lines to memorize than I'd ever had before. I practiced at breakfast, on the bus, and while brushing my teeth, until my family could recite my lines too.\n\nThe night before the show, everything seemed to go wrong. A piece of scenery fell over, two actors forgot their entrances, and the lights flickered. Our director, Ms. Park, told us not to worry, since a rough dress rehearsal often means a great performance. She was right. On opening night, the audience laughed at all the jokes, and nobody missed a cue. When we took our bows, the applause was louder than I had ever imagined."},
    {"id":"g6-035","g":6,"topic":"arts","t":"How a Book Gets Made","x":"Have you ever wondered how a book travels from an author's imagination to a library shelf? The process usually takes a year or more. First, the author writes a manuscript, revising it many times. Then an editor reads it carefully and suggests ways to make the story clearer, stronger, or more exciting.\n\nOnce the words are finished, a designer chooses the fonts and lays out each page. If it's a picture book, an illustrator creates artwork that brings the characters to life. A copy editor checks for spelling and grammar mistakes, which is a lot like being a detective. Next, the pages are sent to a printer, where huge machines print, fold, and bind thousands of copies. Finally, the books are shipped to stores and libraries, where readers like you can discover them."},
    {"id":"g6-036","g":6,"topic":"arts","t":"Mozart, the Young Composer","x":"Wolfgang Amadeus Mozart was born in 1756 in Salzburg, a city that is now part of Austria, and he showed amazing musical talent from a very young age. By the time he was five, he was already writing short pieces for the keyboard. His father, Leopold, was also a musician, and he took Wolfgang and his older sister, Nannerl, on long tours across Europe. The two children performed for kings, queens, and crowds of fascinated listeners.\n\nAs an adult, Mozart wrote more than 600 works, including symphonies, operas, and concertos. Some of his pieces are cheerful and playful, while others are calm and serious. He worked incredibly fast and often composed whole pieces in his head before writing them down. Even though he lived only thirty-five years, his music is still performed all over the world, and many people consider him one of the greatest composers who ever lived."},
    {"id":"g6-037","g":6,"topic":"inventions","t":"How GPS Finds You","x":"When someone uses a map on a phone to find a new restaurant, they're relying on a system called GPS, which stands for Global Positioning System. GPS depends on a group of about thirty satellites that circle Earth high above the ground. Each satellite constantly sends out signals that include the exact time.\n\nA GPS receiver, such as the one inside a phone or car, picks up signals from several satellites at once. Because radio signals travel at a known speed, the receiver can figure out how far away each satellite is by measuring how long its signal took to arrive. By combining the distances from at least four satellites, it can pinpoint its location, often to within a few feet. The United States military first developed GPS, but today farmers, pilots, hikers, and drivers all depend on it every day."},
    {"id":"g6-038","g":6,"topic":"inventions","t":"The Invention of the Bicycle","x":"The first bicycles looked very different from the ones we ride today. In 1817, a German inventor named Karl Drais built a wooden machine with two wheels, but it had no pedals. Riders sat on it and pushed themselves along with their feet, a bit like a scooter.\n\nLater inventors added pedals to the front wheel. To make these bikes go faster, builders made the front wheel larger and larger. The result was the high-wheeler, which had a giant front wheel and a tiny back one. It was fast, but it was also tall and wobbly, and falling off was common. In the 1880s, the safety bicycle appeared, with two wheels of equal size and a chain that turned the back wheel. Its design was so successful that most bikes still follow it today."},
    {"id":"g6-039","g":6,"topic":"inventions","t":"Inside a Microwave Oven","x":"A microwave oven can heat a bowl of soup in a minute or two, much faster than a stove. It works by producing microwaves, which are invisible waves of energy similar to radio waves. A part called a magnetron creates the microwaves, and a small spinning fan spreads them around the inside of the oven. The metal walls reflect the waves, so they bounce back and forth through the food.\n\nMicrowaves make water particles in food spin and jiggle very quickly, and this motion creates heat. That is why foods with lots of water, like vegetables and soup, warm up quickly. The microwave oven was invented after an engineer named Percy Spencer noticed that a candy bar in his pocket had melted while he worked near radar equipment in the 1940s. Never put metal in a microwave, because it can cause sparks."},
    {"id":"g6-040","g":6,"topic":"inventions","t":"From Telegraph to Texting","x":"In the early 1800s, the fastest way to send a message across a country was by horse or by ship. That changed in 1844, when Samuel Morse sent a message over a telegraph wire from Washington to Baltimore. The telegraph used electricity to send pulses along a wire, and operators tapped out letters using Morse code, a system of dots and dashes.\n\nOver the next century, inventors kept finding faster and easier ways to communicate. The telephone let people hear each other's voices, and radio carried sound through the air without wires. Later, computers and cell phones made it possible to send text messages, photos, and videos almost instantly. Today, you can share a message with a friend on the other side of the world in less than a second, something Morse could only have dreamed about."},
    {"id":"g7-001","g":7,"topic":"animals","t":"How Octopuses Hide","x":"An octopus is one of the best hiders in the ocean. In less than a second, it can change the color of its skin to match the rocks, sand, or coral around it. Tiny cells in its skin hold sacs of colored pigment, and muscles squeeze or stretch those sacs to make new patterns. Some octopuses can even make bumps on their skin so they look like rough stones.\n\nOctopuses have other surprises too. Each one has three hearts and blue blood, and its eight arms are covered with suckers that can both touch and taste. When an octopus is in danger, it may squirt a cloud of dark ink and then shoot away. Scientists who study them say they are clever, curious, and very good at escaping from tanks."},
    {"id":"g7-002","g":7,"topic":"animals","t":"The Long Flight of Monarchs","x":"Every fall, millions of monarch butterflies leave Canada and the eastern United States and fly south. Their trip can be close to 3,000 miles long, and it ends in the mountain forests of central Mexico. There, the butterflies cluster on fir trees so thickly that the branches look orange.\n\nWhat makes this journey amazing is that no single monarch makes the whole round trip. In the spring, the butterflies head north, lay eggs on milkweed plants, and then die. Their children and grandchildren keep moving north, so it takes several generations to reach Canada again. Then a new group of butterflies, born at the end of summer, somehow finds its way back to the same forests in Mexico. Scientists think they use the sun to guide them, but they are still learning how it works."},
    {"id":"g7-003","g":7,"topic":"animals","t":"Diary of a Bird Watcher","x":"Saturday, January 14\n\nThis morning I filled the bird feeder in our backyard, and then I sat by the kitchen window with my notebook. At first nothing happened, so I almost gave up. After ten minutes, a pair of cardinals landed on the fence. The male was bright red, but the female was a soft brown with red on her wings and tail.\n\nNext, three chickadees came and grabbed seeds one at a time. They flew to a branch, cracked each seed, and came right back for more. Then a loud blue jay showed up and scared them all away. My grandpa told me that blue jays can copy the call of a hawk, which might be a trick to keep other birds away from the food. I counted nine birds in all, and I can't wait to try again next weekend."},
    {"id":"g7-004","g":7,"topic":"animals","t":"Why Beavers Build Dams","x":"Beavers are famous for their building skills. They cut down small trees with their strong front teeth, which never stop growing and are colored orange because they contain iron. Then they drag the branches to a stream and pile them up with mud and stones. Over time, the pile becomes a dam that slows the water and makes a pond.\n\nThe pond keeps the beavers safe. In the middle of it, they build a home called a lodge, and its entrances are hidden underwater where most predators can't reach. In winter, the beavers stay warm inside and swim out under the ice to eat bark from branches they stored earlier. Their dams also help other animals, because the new ponds and wetlands give homes to frogs, fish, ducks, and many insects."},
    {"id":"g7-005","g":7,"topic":"science","t":"The Strange Science of Ice","x":"Most substances get heavier for their size when they freeze, so their solid form sinks in their liquid form. Water is different. When water freezes, its molecules line up in a pattern that leaves more open space between them. That makes ice about nine percent less dense than liquid water, so ice cubes float to the top of your glass.\n\nThis odd fact matters a great deal for life on Earth. In winter, a lake freezes from the top down, and the layer of ice acts like a lid. It keeps the water below from losing heat too fast, so fish, frogs, and plants can survive until spring. If ice sank, many lakes would freeze solid from the bottom up. Next time you see a frozen pond, remember that its icy roof is actually protecting the life underneath."},
    {"id":"g7-006","g":7,"topic":"science","t":"The Paper Towel Test","x":"For the science fair, my friend Maya and I wanted to find out which brand of paper towel soaked up the most water. We bought four kinds and cut a square of the same size from each one. Then we poured exactly 100 milliliters of water into four cups.\n\nOur teacher, Mr. Ortiz, reminded us to change only one thing at a time. We dipped each square for ten seconds, let it drip for five seconds, and squeezed the water it held into a measuring cup. We did every test three times so that one mistake wouldn't ruin our results.\n\nThe thinnest towel held less water than we expected, but the thickest one wasn't the winner either. The best towel had a pattern of tiny pockets. We made a chart, wrote our conclusion, and learned that a good experiment needs careful steps more than lucky guesses."},
    {"id":"g7-007","g":7,"topic":"science","t":"Waves of Sound","x":"Sound is a kind of energy that moves in waves. When you clap your hands, the air around them is pushed together and pulled apart very quickly. Those vibrations spread out in every direction, and when they reach your ears, your brain hears them as a clap.\n\nIn air, sound travels about 343 meters per second, which is fast, but it is much slower than light. Sound moves even faster through water and faster still through solid materials like steel. In outer space, there is no air at all, so there is nothing to carry sound waves. That is why astronauts use radios to talk to each other during a spacewalk.\n\nAn echo happens when sound bounces off a hard surface, such as a cliff or a gym wall, and returns to you. Bats and dolphins use echoes to find their food in the dark."},
    {"id":"g7-008","g":7,"topic":"science","t":"Inside a Plant Cell","x":"Every plant is made of tiny building blocks called cells, and most are far too small to see without a microscope. A plant cell has a stiff outer layer called the cell wall. It gives the plant its shape and helps stems stand up straight.\n\nInside the wall, there are many smaller parts, and each one has a job. The nucleus holds the cell's instructions, much like a control center. Green parts called chloroplasts capture energy from sunlight and use it to turn water and carbon dioxide into sugar. This process is called photosynthesis, and it also releases the oxygen that we breathe. A large sac called a vacuole stores water. When a plant doesn't get enough water, its vacuoles shrink, and the leaves begin to droop. Give it a drink, and they fill up again."},
    {"id":"g7-009","g":7,"topic":"space","t":"Why Mars Is Red","x":"Mars is the fourth planet from the Sun, and it is often called the Red Planet. Its color comes from iron minerals in the dust and rocks, which have rusted over time. A day on Mars is only a little longer than a day on Earth, about 24 hours and 37 minutes, but a year there lasts almost twice as long as ours.\n\nMars is home to Olympus Mons, the largest volcano in the solar system. It is about two and a half times taller than Mount Everest. The planet also has two small moons named Phobos and Deimos, which are shaped more like potatoes than balls.\n\nScientists have sent many rovers to explore its surface. They have found signs that rivers and lakes once flowed there long ago. Someday, astronauts may travel to Mars and see those dry riverbeds with their own eyes."},
    {"id":"g7-010","g":7,"topic":"space","t":"Living in Orbit","x":"The International Space Station circles Earth about once every 90 minutes. Because it moves so fast, the astronauts on board can see around 16 sunrises and 16 sunsets every day. They live and work there for months at a time, and their days are busy with experiments, repairs, and exercise.\n\nDaily life in space can be tricky. Since everything floats, astronauts strap themselves into sleeping bags attached to the walls. They drink from pouches with straws, and they use special cups and trays so crumbs and drops won't drift into the equipment. Their muscles and bones can grow weak without gravity, so they spend about two hours a day exercising on a treadmill, a bike, and a weight machine.\n\nMany countries work together on the station, and it has been home to astronauts from all over the world."},
    {"id":"g7-011","g":7,"topic":"space","t":"Letter to a Future Astronaut","x":"Dear Future Astronaut,\n\nMy name is Jordan, and I am in seventh grade. Our class is writing letters to someone who might travel to the Moon or Mars someday, so I picked you. I hope you get to see Earth from far away. Astronauts say it looks like a blue marble floating in the dark, and I think that would be the best view there is.\n\nI have some questions for you. Is it hard to sleep when you are floating? Do you miss pizza, rain, and the smell of grass? Which do you like better, the view of Earth or the view of the stars?\n\nWhen I grow up, I want to be an engineer and help build rockets. Maybe I will even help build the one you ride in. Please take a picture out the window for me, and have a safe trip there and back.\n\nYour friend, Jordan"},
    {"id":"g7-012","g":7,"topic":"space","t":"Why Stars Twinkle","x":"On a clear night, the stars seem to sparkle and flicker. They aren't really changing, though. The twinkling happens because of the air around Earth. Starlight travels for years across empty space, and then, in the last few seconds of its trip, it passes through our moving, swirling atmosphere. Pockets of warm and cool air bend the light in slightly different directions, so the star seems to jump and shimmer.\n\nPlanets usually twinkle less than stars do. A star is so far away that its light reaches us as a single tiny point, and that point is easy for the air to bend. A planet is much closer, so it looks like a small disk, and the bending tends to even out.\n\nThis is also why astronomers put telescopes on high mountains and even launch them into space, where there is less air to blur their view."},
    {"id":"g7-013","g":7,"topic":"earth","t":"Islands Made by Volcanoes","x":"The Hawaiian Islands rose out of the Pacific Ocean one at a time, and they were all built by volcanoes. Deep under the ocean floor, there is a hot spot where melted rock pushes up toward the surface. Over many thousands of years, lava piled up until it broke through the water and formed an island.\n\nThe ocean floor is part of a huge plate that slowly moves, so each island gets carried away from the hot spot. Then a new volcano begins to grow in its place. That is why the oldest islands are in the northwest, and the youngest one, the Big Island of Hawaii, is in the southeast. Its volcano Kilauea is one of the most active in the world.\n\nAnother volcano on the Big Island, Mauna Kea, is taller than Mount Everest if you measure it from its base on the sea floor."},
    {"id":"g7-014","g":7,"topic":"earth","t":"Rivers of Ice","x":"A glacier is a giant, slow river of ice. It forms in places where more snow falls in winter than melts in summer. Year after year, the snow piles up and gets pressed into thick ice, and then its own weight makes it slide downhill, often just a few feet each day.\n\nAs glaciers move, they scrape and grind the land beneath them. They pick up rocks, carry them for miles, and drop them far from where they started. Long ago, during the last ice age, huge sheets of ice covered much of North America. When they melted, they left behind valleys, hills, and thousands of lakes. The Great Lakes were carved partly by glaciers, and so was the famous valley in Yosemite National Park in California.\n\nToday, glaciers still cover parts of Alaska, Greenland, and Antarctica."},
    {"id":"g7-015","g":7,"topic":"earth","t":"A Walk Among Redwoods","x":"Last summer, my family drove to northern California to see the coast redwoods. I had seen pictures, but I wasn't ready for how huge they were. Some of the trees were taller than a 30-story building, and their trunks were so wide that my sister, my cousin, and I couldn't reach around one even when we held hands.\n\nA park ranger named Ms. Lee told us that coast redwoods are the tallest trees on Earth. The tallest ones are more than 350 feet high. Their bark can be a foot thick, and it helps protect them from fires and insects. She also said that the trees get some of their water from the thick fog that rolls in from the ocean.\n\nWe walked on a trail for two hours, and it was quiet and cool the whole time. I felt smaller than an ant, but in a good way."},
    {"id":"g7-016","g":7,"topic":"earth","t":"Reading the Clouds","x":"If you know a little about clouds, you can guess what the weather will do. Puffy white clouds that look like cotton are called cumulus clouds. They usually mean fair weather, but if they grow taller and darker during a hot afternoon, a storm may be on its way.\n\nThe tallest storm clouds are cumulonimbus clouds. They can rise more than eight miles into the sky and bring lightning, heavy rain, and sometimes hail. Flat gray clouds that cover the whole sky are stratus clouds, and they often bring drizzle or a dull, cloudy day.\n\nHigh above all of these are cirrus clouds. They are thin and wispy, and they are made of ice crystals instead of water drops. When cirrus clouds spread across the sky, it can be a sign that rain or snow will arrive in a day or two. Try looking up tomorrow and naming the clouds you see."},
    {"id":"g7-017","g":7,"topic":"history","t":"Building the Transcontinental Railroad","x":"In the 1860s, traveling from the East Coast to California could take months by wagon or ship. Many Americans dreamed of a railroad that would cross the whole country, so two companies began building one. The Central Pacific started in Sacramento, California, and laid track toward the east. The Union Pacific started near Omaha, Nebraska, and built toward the west.\n\nThe work was hard. Thousands of workers, including many immigrants from China and Ireland, blasted tunnels through mountains, built bridges, and laid rails across deserts and plains. On May 10, 1869, the two lines finally met at Promontory Summit in Utah. A golden spike was tapped into the last tie to celebrate.\n\nAfter that, a trip across the country took about a week instead of several months, and the nation changed forever."},
    {"id":"g7-018","g":7,"topic":"history","t":"The Journey of Lewis and Clark","x":"In 1803, the United States bought a huge piece of land from France called the Louisiana Purchase. President Thomas Jefferson wanted to know what was there, so he asked Meriwether Lewis to lead an expedition. Lewis chose his friend William Clark to share the job, and their group became known as the Corps of Discovery.\n\nThey set out from near St. Louis in May 1804 and paddled up the Missouri River. Along the way, they made maps, collected plants, and described animals that were new to them, such as prairie dogs. A Shoshone woman named Sacagawea joined them and helped them talk with Native American nations and trade for horses.\n\nIn November 1805, the group finally reached the Pacific Ocean. They returned to St. Louis in 1806, and their maps and journals helped people learn about the West."},
    {"id":"g7-019","g":7,"topic":"history","t":"Diary From the Oregon Trail","x":"May 3, 1848\n\nWe left Independence, Missouri, today with our wagon, two oxen, and a cow named Daisy. Pa says the trail to Oregon is about 2,000 miles long, and it will take us until fall. Our wagon is so full of flour, bacon, tools, and quilts that there's no room to ride, so I walked beside it all day.\n\nJune 10, 1848\n\nWe crossed the Platte River this morning. The water was cold and muddy, but the oxen pulled hard, and we made it across. Tonight we camped with three other families. The children played tag while the grown-ups cooked beans and biscuits over the fire.\n\nJuly 4, 1848\n\nWe reached Independence Rock today, a huge gray rock that people carve their names on. I found my uncle's name from last year! Ma let me add mine next to it."},
    {"id":"g7-020","g":7,"topic":"history","t":"The Pyramids of Giza","x":"About 4,500 years ago, the people of ancient Egypt built some of the most amazing structures in history. The Great Pyramid of Giza was made for a king named Khufu. It was built from more than two million blocks of stone, and some of them weigh more than a car. For nearly 4,000 years, it was the tallest building made by humans anywhere in the world.\n\nHistorians used to think that slaves built the pyramids, but most now believe that skilled workers and farmers did the job. Archaeologists have found the remains of their villages, bakeries, and even notes about their work crews. The workers probably used ramps, sleds, and lots of teamwork to move the heavy stones into place.\n\nToday, the Great Pyramid is the oldest of the Seven Wonders of the Ancient World, and it is the only one still standing."},
    {"id":"g7-021","g":7,"topic":"world","t":"A Week in Tokyo","x":"Last spring, my aunt took me to Tokyo, the capital of Japan. It's one of the largest cities in the world, and it felt busy and exciting from the moment we landed. We rode the trains everywhere, and they were so clean and on time that my aunt joked we could set our watches by them.\n\nOn our first day, we visited a park where hundreds of cherry trees were in bloom. Families sat on blankets under the pink flowers and shared picnic lunches. Then we explored a market and tried noodles, rice balls, and a sweet bean cake.\n\nMy favorite moment came on our last morning. The sky was clear, so we went to the top of a tall building, and far in the distance, I could see Mount Fuji with snow on its peak. I took more pictures of that mountain than of anything else on the whole trip."},
    {"id":"g7-022","g":7,"topic":"world","t":"River of the Rain Forest","x":"The Amazon River in South America carries more water than any other river on Earth. It begins high in the Andes Mountains of Peru and flows east across the continent until it reaches the Atlantic Ocean in Brazil. Along the way, more than a thousand smaller rivers flow into it.\n\nThe river is surrounded by the Amazon rainforest, the largest tropical rainforest in the world. It is home to jaguars, sloths, river dolphins, and thousands of kinds of birds and fish. Many plants that grow there have never been studied by scientists.\n\nIn some places, the Amazon is so wide that you can't see the other side. There are no bridges across its main channel, so people travel by boat instead. For the towns and villages along its banks, the river is like a highway, a grocery store, and a water supply all in one."},
    {"id":"g7-023","g":7,"topic":"world","t":"Finding Places on a Map","x":"Every place on Earth has an address made of two numbers called latitude and longitude. Lines of latitude run east and west around the globe. The most famous one is the equator, which circles the middle of the Earth at zero degrees. Places north of the equator are in the Northern Hemisphere, and places south of it are in the Southern Hemisphere.\n\nLines of longitude run from the North Pole to the South Pole. The starting line, called the prime meridian, passes through Greenwich, England. Places are measured in degrees east or west of it.\n\nWhen you put the two numbers together, you can find any spot on a map. For example, New York City sits at about 41 degrees north and 74 degrees west. Sailors and pilots used these numbers long before phones had maps, and they still use them today."},
    {"id":"g7-024","g":7,"topic":"world","t":"Letter From Iceland","x":"Dear Grandma,\n\nGreetings from Iceland! We arrived in Reykjavik on Monday, and I can't believe how different it is from home. It's the middle of June, so the sun barely sets at all. Last night, I looked out the window at midnight, and it was still as bright as early evening.\n\nOn Tuesday, we drove out to see a geyser. We waited with a crowd of people, and then it shot hot water high into the air. Everyone cheered! Iceland has lots of volcanoes, so there is hot water under the ground in many places. People even use it to heat their houses.\n\nYesterday, we saw a glacier, three waterfalls, and a beach with black sand. Dad says the sand is black because it came from lava. I've already filled half my sketchbook, and I'll show you all my drawings when we get back.\n\nLove, Nora"},
    {"id":"g7-025","g":7,"topic":"everyday","t":"The Great Chore Chart","x":"Our family had a problem. Every Saturday, the house was a mess, and everyone argued about whose turn it was to clean. So last month, my older brother Sam and I made a chore chart. We listed every job we could think of, like washing dishes, folding laundry, feeding the dog, and taking out the trash.\n\nThen we gave each job points. Easy jobs were worth one point, and harder jobs, like cleaning the bathroom, were worth three. Each person had to earn ten points a week. Mom liked the idea so much that she hung the chart on the fridge.\n\nThe first week was bumpy, because Dad kept forgetting to check off his jobs. By the third week, though, the house was cleaner than it had been in a long time. I even started to like vacuuming, which I never thought I would say."},
    {"id":"g7-026","g":7,"topic":"everyday","t":"My First Family Dinner","x":"Last Friday, I cooked dinner for my whole family for the first time. I chose spaghetti with tomato sauce, a green salad, and garlic bread, because those were the dishes I had watched my dad make many times.\n\nI started early, but things still got hectic. First, I forgot to put salt in the pasta water, so I had to add it at the last minute. Then the garlic bread got a little too dark on the bottom while I was chopping cucumbers and carrots for the salad. My little sister Ava wanted to help, so I let her tear the lettuce and set the table.\n\nWhen we finally sat down, everyone was quiet for a moment, and I was nervous. Then my dad said the sauce was better than his, and my mom asked for seconds. I felt proud, and I've already planned what I'll make next time."},
    {"id":"g7-027","g":7,"topic":"everyday","t":"How to Pack a Great Lunch","x":"Packing your own lunch can save money, and it lets you eat food you actually like. Here's a simple way to do it.\n\nFirst, choose a main item that will keep you full, such as a sandwich, a wrap, or leftover pasta. Next, add a fruit and a vegetable. Apples, grapes, and clementines travel well, and so do carrot sticks and celery. Then pick a small snack, like crackers, cheese, or a handful of nuts if your school allows them.\n\nDon't forget a drink. Water is the best choice, and a reusable bottle is better for the planet than a plastic one. If your lunch has anything that needs to stay cold, put an ice pack in your bag.\n\nFinally, try to pack your lunch the night before. Mornings are busy, and you'll be glad it's ready when you're rushing out the door."},
    {"id":"g7-028","g":7,"topic":"everyday","t":"The New Kid in Class","x":"When my family moved to Denver in October, I had to start at a new school two months after everyone else. On my first day, I walked into the cafeteria with my tray, and every table looked full. I didn't know where to sit, so I stood there and pretended to look for someone.\n\nThen a girl with a green backpack waved at me. Her name was Priya, and she said there was an empty seat next to her. She introduced me to her friends, Marcus and Lena, and they asked me where I was from and what kind of music I liked.\n\nIt turned out that Marcus played the trumpet in the school band, and I play the trumpet too. By the end of the week, I had joined the band, learned my way around the building, and stopped getting lost on the way to science. Now, whenever I see someone new, I try to wave first."},
    {"id":"g7-029","g":7,"topic":"sports","t":"Basketball Through the Years","x":"Basketball was invented in 1891 by a teacher named James Naismith. He worked at a school in Springfield, Massachusetts, and he needed an indoor game that would keep his students active during the cold winter. He nailed two peach baskets to the balcony of the gym, and his students tried to toss a soccer ball into them.\n\nThe first game had nine players on each team, and only one basket was scored. Every time someone made a shot, a person had to climb a ladder and get the ball out of the basket. Years later, people cut holes in the bottoms of the baskets, and eventually they switched to metal hoops and nets.\n\nToday, basketball is played in nearly every country in the world. It's been part of the Olympic Games since 1936, and millions of kids play it in their driveways, parks, and school gyms."},
    {"id":"g7-030","g":7,"topic":"sports","t":"Learning to Play Chess","x":"Chess is a game for two players, and it's played on a board with 64 squares. Each player starts with 16 pieces: one king, one queen, two rooks, two bishops, two knights, and eight pawns. Every kind of piece moves in its own way. Bishops move diagonally, rooks move in straight lines, and knights jump in an L shape.\n\nThe goal of the game is to trap your opponent's king so it can't escape. This is called checkmate, and it ends the game right away.\n\nWhen I first started playing, I lost every game to my uncle. He told me to think about three things before each move. What is my opponent trying to do? Which of my pieces are in danger? What is my best move? It took practice, but after a few months, I finally won a game. I was so excited that I asked for a rematch right away."},
    {"id":"g7-031","g":7,"topic":"sports","t":"The Championship Game","x":"The score was tied at one goal each, and there were only five minutes left in the championship game. Our soccer team, the Falcons, had never won a title before. The bleachers were full of parents, grandparents, and friends, and they were all shouting at once.\n\nOur coach called a timeout and told us to stay calm. \"Pass the ball, and trust each other,\" she said. When the game started again, Danny stole the ball near midfield and passed it to me. I dribbled down the left side, but two defenders closed in, so I kicked the ball across the field to Rosa.\n\nRosa didn't waste a second. She shot the ball low, and it slid past the goalie into the corner of the net. When the final whistle blew a few minutes later, we ran onto the field and hugged. I'll remember that pass for the rest of my life."},
    {"id":"g7-032","g":7,"topic":"sports","t":"Running a Smart Race","x":"A marathon is a race that is 26.2 miles long. According to an old Greek legend, a messenger ran from a town called Marathon all the way to Athens to share news of a victory. When the modern Olympic Games began in 1896, a long race was added to honor that story.\n\nRunners who finish a marathon don't usually start as fast as they can. Instead, they pace themselves, which means they run at a steady speed they can keep for hours. If they start too fast, their muscles use up their stored energy early, and the last miles become much harder.\n\nGood pacing matters in shorter races too. Track coaches often tell runners to save some energy for a strong finish. Many runners even try to run the second half of a race a little faster than the first half. It sounds hard, but it's one of the best ways to reach the finish line feeling strong."},
    {"id":"g7-033","g":7,"topic":"arts","t":"How an Orchestra Works","x":"A full orchestra can have close to 100 musicians, and they are grouped into four families. The string family is the largest. It includes violins, violas, cellos, and double basses, and they usually sit at the front of the stage. Behind them are the woodwinds, such as flutes, clarinets, oboes, and bassoons.\n\nThe brass family includes trumpets, trombones, French horns, and the tuba. Their sound is bold and bright, so they sit near the back. The percussion section has drums, cymbals, xylophones, and many other instruments that are struck or shaken.\n\nAt the front stands the conductor, who doesn't play an instrument at all. Instead, the conductor uses a thin stick called a baton to set the speed, signal when each section should come in, and shape how loudly or softly the music is played. Without the conductor, it would be hard for so many players to stay together."},
    {"id":"g7-034","g":7,"topic":"arts","t":"Starting a Book Club","x":"In September, my best friend Elena and I decided to start a book club. We asked our librarian, Mrs. Chen, if we could meet in the library during lunch on Thursdays, and she said yes. Then we made posters and hung them in the halls.\n\nAt our first meeting, only four people came, but that was enough. We voted on our first book and picked an adventure story about a boy who survives alone in the wilderness. Everyone agreed to read the first five chapters before the next week.\n\nThe discussions were the best part. Some of us loved the main character, but others thought he made silly choices. We argued, laughed, and even changed our minds. By winter, our club had grown to eleven members. Now we take turns choosing the books, and Mrs. Chen brings snacks when someone finishes a really long one."},
    {"id":"g7-035","g":7,"topic":"arts","t":"The Art of Vincent van Gogh","x":"Vincent van Gogh was a Dutch painter who lived from 1853 to 1890. He didn't start painting until he was 27 years old, but in about ten years, he created more than 2,000 works of art, including around 860 oil paintings.\n\nHis style was easy to recognize. He used bright colors, thick paint, and swirling brushstrokes that make his pictures seem to move. He loved painting ordinary things, such as sunflowers, wheat fields, cafes, and his own bedroom. One of his most famous paintings, The Starry Night, shows a sky full of glowing, spinning stars above a quiet village.\n\nDuring his life, van Gogh sold very few paintings, and many people didn't understand his work. Today, though, he is one of the most admired artists in history. Visitors from all over the world travel to museums in Amsterdam, New York, and Paris to see his paintings in person."},
    {"id":"g7-036","g":7,"topic":"arts","t":"Behind the Curtain","x":"When people watch a play, they usually see only the actors. This year, I joined the stage crew for our school's musical, and I learned how much happens behind the curtain.\n\nFor six weeks, we built the set after school. We painted a backdrop of a city skyline, built a bench that looked like it was made of stone, and hung lights above the stage. Our teacher, Mr. Davis, showed us how to use the drills safely and how to tie knots that wouldn't slip.\n\nOn opening night, I wore all black so the audience wouldn't notice me. During each scene change, I had about thirty seconds to move furniture in the dark while the music played. My heart was pounding the whole time, but every change went smoothly. When the actors took their bows, they pointed to the crew, and the audience clapped for us too."},
    {"id":"g7-037","g":7,"topic":"inventions","t":"How Printing Changed Europe","x":"Before the 1400s, books in Europe were copied by hand, one page at a time. It could take months to finish a single book, so books were rare and expensive. Then, around 1440, a German goldsmith named Johannes Gutenberg built a printing press that changed everything.\n\nGutenberg's big idea was movable metal type. He made small blocks for each letter, and workers arranged them to form words and pages. They inked the letters, pressed paper onto them, and then printed the same page again and again. When one page was done, they could rearrange the letters for the next.\n\nHis most famous book was a Bible printed in the 1450s. Soon, printing shops opened in cities across Europe, and books became much cheaper. More people learned to read, and new ideas spread faster than ever before."},
    {"id":"g7-038","g":7,"topic":"inventions","t":"How a Refrigerator Stays Cold","x":"A refrigerator doesn't really make cold. Instead, it moves heat from inside the box to the air outside it. It does this with a special liquid called a refrigerant that flows through a loop of tubes.\n\nFirst, the refrigerant passes through thin coils inside the fridge. As it flows, it turns from a liquid into a gas, and that change soaks up heat from the food and air around it. Next, a pump called a compressor squeezes the gas, which makes it very hot. The hot gas then flows through coils on the back or bottom of the fridge, where it gives off its heat to the kitchen and turns back into a liquid. Then the loop starts again.\n\nThat is why the back of a refrigerator often feels warm. It's also why you should never block the vents, because the fridge needs to get rid of the heat it collects."},
    {"id":"g7-039","g":7,"topic":"inventions","t":"The Wright Brothers Take Flight","x":"Orville and Wilbur Wright grew up in Dayton, Ohio, and they ran a bicycle shop there. They used the money they earned, and the skills they learned fixing bikes, to build their own flying machines. They studied birds, tested gliders, and even built a small wind tunnel to test the shapes of wings.\n\nTo find steady winds and soft sand, they traveled to Kitty Hawk, North Carolina. On December 17, 1903, Orville climbed onto their airplane, the Flyer, and took off. The flight lasted only 12 seconds, and it covered about 120 feet, which is shorter than the wingspan of many modern jets. That same day, they made three more flights, and the longest one lasted almost a minute.\n\nIt was the first time a powered airplane carried a person through the air under control, and it started the age of flight."},
    {"id":"g7-040","g":7,"topic":"inventions","t":"How Touchscreens Work","x":"Many phones and tablets use a kind of touchscreen that can sense the electricity in your body. Under the glass, there is a grid of tiny wires so thin that you can't see them. The grid holds a small electric charge all the time.\n\nWhen your finger touches the screen, it pulls a little of that charge toward it. The device measures where the charge changed, and then it figures out exactly where you touched. Because the grid can track many points at once, you can pinch, swipe, and zoom with two or more fingers.\n\nThis also explains why most touchscreens don't respond when you're wearing thick gloves. The fabric blocks your body's charge from reaching the screen. Some gloves have special fingertips with threads that conduct electricity, so people can use their phones on cold days without freezing their hands."},
    {"id":"g8-001","g":8,"topic":"animals","t":"The Social Lives of Elephants","x":"Elephants live in close family groups called herds, and each herd is usually led by the oldest female, known as the matriarch. She remembers where to find water during dry seasons, which paths are safe, and how to react when danger is near. Her daughters, granddaughters, and their young stay with her for most of their lives, while young males leave the herd when they are teenagers.\n\nElephants communicate in surprising ways. Besides trumpeting, they make low rumbles that are too deep for human ears to hear. These sounds can travel for miles, and other elephants may even sense the vibrations through their feet.\n\nAn elephant's trunk is just as remarkable. It contains tens of thousands of muscles, and it is strong enough to lift a log but gentle enough to pick up a single peanut. Elephants use their trunks to breathe, smell, drink, greet each other, and comfort a calf that is upset."},
    {"id":"g8-002","g":8,"topic":"animals","t":"Seeing With Sound","x":"Most bats hunt at night, but they don't rely only on their eyes to find food. Instead, many of them use a skill called echolocation. A bat sends out a stream of high-pitched calls, and then it listens for the echoes that bounce back from objects nearby. By measuring how long each echo takes to return, the bat can tell how far away something is, how big it is, and even which way it's moving.\n\nThis system is so precise that some bats can detect an object as thin as a human hair. It lets them zoom through dark caves and forests without crashing, and it helps them catch insects in midair.\n\nBats are far more helpful than many people realize. A single little brown bat can eat hundreds of mosquitoes and other insects in an hour. Other bats pollinate flowers or spread seeds, and plants such as the agave and some kinds of bananas depend on them."},
    {"id":"g8-003","g":8,"topic":"animals","t":"Field Notes on Honeybees","x":"Monday, August 7\n\nToday was my first day helping Mrs. Alvarez with her beehives, and I was more nervous than I expected. She gave me a white suit, gloves, and a veil, and then she showed me how to use a smoker. A few gentle puffs of smoke calm the bees, so they are less likely to sting.\n\nWhen she lifted the first frame out of the hive, it was covered with thousands of bees. Most of them were workers, which are all female. Some were feeding the young, some were building wax cells, and others were coming home with yellow pollen on their legs. She pointed out the queen, who was longer than the others and was surrounded by a circle of helpers.\n\nThe most amazing thing I saw was a bee doing a waggle dance. Mrs. Alvarez explained that the dance tells the other bees which direction to fly and how far away the flowers are. I watched it three times, and I still can't believe insects can share directions like that."},
    {"id":"g8-004","g":8,"topic":"animals","t":"Penguins Below the Equator","x":"When people think of penguins, they often picture ice and snow, but not every penguin lives in a frozen world. Nearly all of the world's penguin species live in the Southern Hemisphere, and they are found on the coasts of South America, Africa, Australia, and New Zealand, as well as in Antarctica. The Galapagos penguin even lives close to the equator, where it cools off in chilly ocean currents.\n\nEmperor penguins, the largest species, have one of the hardest jobs in the animal kingdom. During the dark Antarctic winter, the female lays a single egg and then goes to sea to feed. The male balances the egg on his feet and covers it with a warm fold of skin. For about two months, he stands in the freezing wind with thousands of other males, and they huddle together and take turns moving to the warm center of the group.\n\nWhen the chick hatches, the mother returns, and the parents take turns caring for it."},
    {"id":"g8-005","g":8,"topic":"science","t":"Newton's Laws at the Skate Park","x":"More than 300 years ago, Isaac Newton described three laws of motion, and you can see all of them at a skate park. The first law says that an object at rest stays at rest, and an object in motion keeps moving, unless a force acts on it. That's why a skateboard keeps rolling after you push off, but it eventually slows down because of friction with the ground and the air.\n\nThe second law explains that the more force you use, the faster an object speeds up, and heavier objects need more force to get moving. A light push sends an empty skateboard rolling quickly, but the same push barely moves a board with a rider on it.\n\nThe third law says that for every action, there is an equal and opposite reaction. When a skater kicks backward against the ground, the ground pushes the skater forward. The same idea explains how rockets launch, how swimmers move through water, and why a balloon zooms across the room when you let the air out."},
    {"id":"g8-006","g":8,"topic":"science","t":"The Chemistry of Baking","x":"Baking is really a series of chemical reactions that happen in your kitchen. Take pancakes, for example. Many recipes call for baking soda, which is a base. When it mixes with an acid, such as buttermilk or lemon juice, it produces tiny bubbles of carbon dioxide gas. Those bubbles get trapped in the batter, and they make the pancakes light and fluffy.\n\nBread works in a different way. Instead of baking soda, most bread uses yeast, which is a living organism. When the dough rests in a warm place, the yeast eats sugars in the flour and gives off carbon dioxide, so the dough slowly rises. The heat of the oven then makes the gas expand even more before the bread sets.\n\nHeat also causes browning. When the surface of a cookie or a loaf of bread gets hot, sugars and proteins react with each other, and they create the golden color and rich smell that make baked goods so tempting. Next time you bake, you'll know that you're also doing science."},
    {"id":"g8-007","g":8,"topic":"science","t":"Building a Density Tower","x":"For our science lab last week, my partner Tyler and I built a density tower. We wanted to see whether liquids with different densities would stack on top of each other without mixing. We used honey, dish soap, water with blue food coloring, vegetable oil, and rubbing alcohol with a drop of red coloring.\n\nWe poured each liquid slowly down the side of a tall glass jar, starting with the heaviest. The honey sank straight to the bottom, and the dish soap formed a thick layer above it. The blue water settled on top of the soap, but some of it mixed in at first, so we had to wait a few minutes. Then the oil floated above the water, and the alcohol made a thin red layer at the very top.\n\nAfterward, we dropped small objects into the jar. A grape stopped in the water layer, a bolt sank to the honey, and a piece of cork floated on top. Our results showed that an object sinks until it reaches a liquid that is denser than it is, and I thought that was the coolest part of the whole lab."},
    {"id":"g8-008","g":8,"topic":"science","t":"Why the Sky Is Blue","x":"Sunlight looks white, but it is actually made of every color of the rainbow mixed together. Each color travels as a wave, and the waves have different lengths. Red light has the longest waves, while blue and violet light have much shorter ones.\n\nWhen sunlight enters Earth's atmosphere, it runs into countless tiny molecules of gas. These molecules scatter short waves of light far more than long waves, so blue light gets bounced all over the sky. No matter which direction you look during the day, some of that scattered blue light reaches your eyes. Violet light scatters even more, but our eyes are less sensitive to it, and some of it is absorbed high in the atmosphere, so the sky looks blue to us.\n\nAt sunrise and sunset, the light has to travel through much more air to reach you. By then, most of the blue has been scattered away, and the reds, oranges, and pinks are left. That's why the sky seems to glow with warm colors at the beginning and end of the day."},
    {"id":"g8-009","g":8,"topic":"space","t":"One Giant Leap","x":"On July 16, 1969, a giant Saturn V rocket lifted off from Florida carrying three astronauts: Neil Armstrong, Buzz Aldrin, and Michael Collins. Their mission, Apollo 11, had a goal that once seemed impossible. They were going to land on the Moon and return safely to Earth.\n\nFour days later, Armstrong and Aldrin climbed into the lunar module, which was named the Eagle, and they separated from the main spacecraft. Collins stayed behind and orbited the Moon alone. As the Eagle descended, Armstrong saw that the planned landing spot was covered with boulders, so he took control and flew to a safer place. They touched down in an area called the Sea of Tranquility with very little fuel to spare.\n\nA few hours later, Armstrong stepped onto the dusty surface. Hundreds of millions of people watched on television as he said, \"That's one small step for man, one giant leap for mankind.\" The astronauts collected rocks, set up experiments, and planted a flag before they began their journey home."},
    {"id":"g8-010","g":8,"topic":"space","t":"Jupiter, the Giant Planet","x":"Jupiter is the largest planet in our solar system, and it is so big that more than 1,000 Earths could fit inside it. Unlike Earth, it has no solid surface to stand on. It is made mostly of hydrogen and helium, and its colorful stripes are bands of clouds that race around the planet in opposite directions.\n\nOne of Jupiter's best-known features is the Great Red Spot. It is a giant storm, wider than Earth, and astronomers have watched it swirl for more than 300 years. Even though it has been shrinking over the past century, it is still the largest known storm in the solar system.\n\nJupiter also has dozens of moons. In 1610, the Italian scientist Galileo Galilei pointed his telescope at the planet and discovered its four largest moons, which are now called Io, Europa, Ganymede, and Callisto. Io has active volcanoes, and Europa may hide an ocean of liquid water beneath its icy crust. Ganymede is the largest moon in the solar system, and it is even bigger than the planet Mercury."},
    {"id":"g8-011","g":8,"topic":"space","t":"A Night at the Observatory","x":"Last Saturday, our astronomy club took a trip to an observatory in the mountains. We left right after lunch and arrived just before sunset, and the air was so cold that I was glad I had packed my thickest jacket. Once it was dark, the sky was filled with more stars than I had ever seen. Without the lights of the city, I could even see the faint band of the Milky Way stretching overhead.\n\nThe observatory had a huge telescope inside a dome that rotated. A volunteer named Dr. Patel explained that the roof opens like a slot, so the telescope can point at any part of the sky. First, she showed us Saturn. When it was my turn, I gasped, because I could clearly see its rings and even a tiny dot that she said was its moon Titan.\n\nThen we looked at a cluster of stars and a glowing cloud of gas where new stars are forming. By the time we got back on the bus, it was after midnight. I was tired, but I couldn't stop thinking about how huge the universe is."},
    {"id":"g8-012","g":8,"topic":"space","t":"Looking Back in Time","x":"Light is the fastest thing in the universe. It travels about 186,000 miles per second, which is fast enough to circle Earth more than seven times in one second. Even so, the distances in space are so enormous that light still takes time to reach us.\n\nLight from the Moon reaches Earth in a little more than one second, and light from the Sun takes about eight minutes. That means when you see the Sun, you're seeing it as it was eight minutes ago. Stars are much farther away, so astronomers measure their distances in light-years. A light-year is the distance light travels in one year, nearly six trillion miles.\n\nThis creates a fascinating effect. When we look at a star that is 100 light-years away, we see light that left it a century ago. Powerful telescopes can detect galaxies so distant that their light has traveled for billions of years. In a way, every telescope is also a time machine, because it shows us what the universe looked like long ago."},
    {"id":"g8-013","g":8,"topic":"earth","t":"The Moving Pieces of Earth","x":"In 1912, a German scientist named Alfred Wegener noticed something odd about maps. The coasts of South America and Africa looked like they could fit together like pieces of a puzzle. He also found similar fossils and rocks on continents separated by wide oceans. Wegener suggested that the continents had once been joined in a single giant landmass, which he called Pangaea, and that they had slowly drifted apart.\n\nAt first, many scientists rejected his idea, because he couldn't explain what made the continents move. Decades later, researchers mapping the ocean floor found long underwater mountain ranges where new crust was forming. Their discoveries led to the theory of plate tectonics.\n\nToday, we know that Earth's outer layer is broken into large plates that float on hotter, softer rock below. They move only a few centimeters each year, about as fast as your fingernails grow. Over millions of years, though, that slow motion builds mountains, opens oceans, and causes earthquakes and volcanoes along the edges of the plates."},
    {"id":"g8-014","g":8,"topic":"earth","t":"Cities Under the Sea","x":"Coral reefs cover less than one percent of the ocean floor, but they are home to about a quarter of all ocean species. Although they look like rocks or plants, reefs are built by tiny animals called coral polyps. Each polyp builds a hard skeleton of limestone around its soft body, and over hundreds of years, millions of these skeletons pile up to form a reef.\n\nMost reef-building corals have a partnership with tiny algae that live inside their tissues. The algae use sunlight to make food, and they share some of it with the coral. In return, the coral gives the algae a safe place to live. The algae also give many corals their bright colors.\n\nThe largest reef system in the world is the Great Barrier Reef, which stretches for more than 1,400 miles off the northeast coast of Australia. It is so large that astronauts can see it from space. Scientists study reefs closely, because when the water becomes too warm, corals can lose their algae and turn white, and the whole reef community is affected."},
    {"id":"g8-015","g":8,"topic":"earth","t":"Counting the Thunder","x":"Last night, a thunderstorm rolled across our town, and my younger brother Eli was too nervous to sleep. I sat with him on the back porch, where we were safely under the roof, and I taught him a trick that our grandfather taught me.\n\n\"When you see a flash of lightning,\" I said, \"start counting the seconds until you hear the thunder.\" Lightning and thunder happen at the same moment, but light travels almost instantly, while sound moves much more slowly. It takes sound about five seconds to travel one mile. So if you count to ten, the lightning was about two miles away.\n\nThe first flash lit up the whole yard, and Eli counted to fifteen before the rumble arrived. \"Three miles,\" he said proudly. As the storm got closer, the numbers got smaller, so we went inside to stay safe. We kept counting from the kitchen window, and by the time the storm moved off to the east, Eli was yawning and had forgotten that he was ever scared."},
    {"id":"g8-016","g":8,"topic":"earth","t":"How Caves Are Carved","x":"Many of the world's largest caves were carved out by water. It starts when rain falls through the air and seeps into the soil. Along the way, the water picks up carbon dioxide, which turns it into a weak acid. When that water trickles into cracks in limestone, it slowly dissolves the rock. Over hundreds of thousands of years, the tiny cracks grow into tunnels, rooms, and huge underground chambers.\n\nInside a cave, the dripping water can also build things. Each drop leaves behind a little bit of mineral as it falls from the ceiling. Over time, those minerals form stalactites, which hang down like icicles. The drops that land on the floor build stalagmites, which point upward. Sometimes the two meet in the middle and form a column.\n\nThe longest known cave system in the world is Mammoth Cave in Kentucky. Explorers have mapped more than 400 miles of its passages, and they think there is still more to discover."},
    {"id":"g8-017","g":8,"topic":"history","t":"Trading on the Silk Road","x":"The Silk Road wasn't a single road at all. It was a network of trade routes that linked China with Central Asia, the Middle East, and the Mediterranean world for well over a thousand years. Merchants rarely traveled the whole distance. Instead, goods passed from trader to trader, and they changed hands many times in busy market cities such as Samarkand.\n\nThe routes took their name from Chinese silk, a smooth, shiny fabric that was highly prized in Rome and other distant places. Traders also carried spices, tea, porcelain, glassware, horses, and precious stones. Caravans of camels crossed deserts and mountains, and travelers rested at roadside inns called caravanserais.\n\nIdeas traveled along the Silk Road too. Papermaking spread west from China, while new foods, music, art, and languages moved in every direction. In the 1200s, a young merchant from Venice named Marco Polo journeyed to China, and his stories later helped Europeans imagine the lands far to the east."},
    {"id":"g8-018","g":8,"topic":"history","t":"Digging the Erie Canal","x":"In the early 1800s, moving goods from the Atlantic coast to the Great Lakes was slow and costly. Wagons had to cross rough roads and steep hills, and the trip could take weeks. So the governor of New York, DeWitt Clinton, pushed for a bold plan. He wanted to dig a canal across the state to connect the Hudson River with Lake Erie.\n\nMany people laughed at the idea and called it \"Clinton's Ditch.\" Construction began in 1817, and workers dug most of it by hand with shovels, picks, and help from horses and mules. Since the land was higher in the west, engineers built a series of locks, which raise and lower boats like water elevators.\n\nWhen the canal opened in 1825, it stretched 363 miles from Albany to Buffalo. Shipping costs dropped sharply, and New York City grew into the country's busiest port. Towns along the canal, such as Rochester and Syracuse, grew quickly too, and the canal helped open the Midwest to farmers and settlers."},
    {"id":"g8-019","g":8,"topic":"history","t":"A Letter From Ancient Rome","x":"To my dear cousin Marcus,\n\nGreetings from Rome! I arrived last week with my father, and I have never seen a city so crowded or so grand. More people live here than in any other city I've heard of, and the streets are full of merchants, soldiers, and travelers from every corner of the empire.\n\nYesterday, we walked through the Forum, which is the center of the city. There were temples, law courts, and speakers giving loud speeches to anyone who would listen. Then we visited the public baths. They have a hot pool, a warm pool, and a cold pool, and people go there to wash, exercise, and talk with their friends.\n\nWhat amazes me most is the water. Huge stone channels called aqueducts carry fresh water into the city from springs that are miles away, and it flows into fountains on almost every street. Father says Roman engineers are the best in the world, and I believe him. I'll write again soon and tell you about the roads, which are paved with stone and seem to stretch forever.\n\nYour cousin, Lucius"},
    {"id":"g8-020","g":8,"topic":"history","t":"Benjamin Franklin's Many Talents","x":"Benjamin Franklin is remembered as one of the founders of the United States, but he was also a printer, a writer, a scientist, and an inventor. He was born in Boston in 1706, and he left school when he was only ten years old. Even so, he loved to read, and he taught himself about science, history, and languages.\n\nAs a young man, Franklin moved to Philadelphia and opened his own printing shop. He published a newspaper and a popular yearly book called Poor Richard's Almanack, which was full of weather predictions, jokes, and wise sayings. He also helped start the city's first lending library and one of its first volunteer fire companies.\n\nFranklin was fascinated by electricity. His experiments showed that lightning is a form of electricity, and they led him to invent the lightning rod, which protects buildings during storms. He later invented bifocal glasses and a stove that heated rooms more efficiently than an open fireplace. He never patented his inventions, because he wanted everyone to be able to use them."},
    {"id":"g8-021","g":8,"topic":"world","t":"Venice, a City on Water","x":"Venice, Italy, is one of the most unusual cities in the world. It was built on a group of more than 100 small islands in a shallow lagoon, and instead of streets, it has canals. The islands are connected by hundreds of bridges, and there are no cars in the historic center at all. People walk or travel by boat, and even the buses, taxis, and ambulances float.\n\nThe largest waterway, the Grand Canal, curves through the middle of the city like a giant letter S. It is lined with old palaces, churches, and markets, and it has been one of the city's main highways for centuries. Visitors often ride in gondolas, which are long, narrow, black boats steered by a rower who stands at the back with a single oar.\n\nVenice also faces a challenge. During very high tides, water can flood its squares and walkways, so the city built movable barriers that rise from the sea floor to hold back the water. Engineers and scientists continue to look for ways to protect this one-of-a-kind city."},
    {"id":"g8-022","g":8,"topic":"world","t":"The Vast Sahara","x":"The Sahara in northern Africa is the largest hot desert in the world. It covers about 3.6 million square miles, which makes it roughly the size of the United States. It stretches across all or part of more than ten countries, including Egypt, Libya, Algeria, Morocco, Mali, and Niger.\n\nMany people picture the Sahara as an endless sea of sand dunes, but dunes cover only part of it. Much of the desert is made of rocky plateaus, gravel plains, dry valleys, and mountains. Some of its dunes, though, are taller than a 50-story building.\n\nLife in the Sahara can be extreme. Daytime temperatures in summer often climb above 100 degrees Fahrenheit, but the nights can be surprisingly cold, because the dry air doesn't hold heat well. Even so, people have lived in and traveled across the desert for thousands of years. Oases, where underground water reaches the surface, support palm trees, gardens, and towns. Camels, which can go for days without drinking, are still used to carry people and goods across the sand."},
    {"id":"g8-023","g":8,"topic":"world","t":"Why We Have Time Zones","x":"Before the late 1800s, most towns set their clocks by the Sun. When the Sun was highest in the sky, it was noon. This worked fine when people traveled by horse, but it became confusing once trains could cross many towns in a single day. Each town had its own time, so train schedules were a mess.\n\nIn 1883, American and Canadian railroads adopted a system of standard time zones, and a year later, an international meeting chose the line through Greenwich, England, as the starting point for measuring longitude and time. The idea is simple. Earth spins once every 24 hours, so the world can be divided into 24 zones, each about 15 degrees of longitude wide. As you travel east, the clock usually moves ahead one hour for each zone you cross.\n\nIn the middle of the Pacific Ocean, there is a line called the International Date Line. When you cross it heading west, you skip ahead one day, and when you cross it heading east, you go back a day. That means it can be Tuesday on one side and Monday on the other."},
