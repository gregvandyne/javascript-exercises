  function say(text, kind) {
    if (!D.bub) return;
    D.bub.textContent = text; D.bub.className = 'ss-bub' + (kind ? ' ' + kind : '');
  }
  function hop() { if (!D.pip || reduced()) return; D.pip.classList.remove('hop'); void D.pip.offsetWidth; D.pip.classList.add('hop'); }

  /* Sizes: the pond as big as it can be; Pip, the sum and the hint under it in portrait and beside it in landscape. */
  function layout() {
    if (!D.play || !D.play.isConnected) return;
    var ss = D.ss, Wd = ss.clientWidth - 16, Ht = ss.clientHeight - 10, pl = D.play, st = pl.style;
    if (Wd <= 0 || Ht <= 0) return;
    var land = Wd > Ht * 1.2 && Wd >= 700;
    pl.classList.toggle('land', land);
    var pw, ph, side = Math.min(340, Math.max(260, Wd * 0.32));
    if (land) {
      st.setProperty('--ss-side', side + 'px'); st.setProperty('--ss-bw', '100%');
      pw = Math.min(Wd - side - 20, (Ht - 70) * 1.45, 760); ph = Math.min(Ht - 70, pw * 0.72);
      st.setProperty('--ss-pip', '72px');
    } else {
      var bw = Math.min(Wd, 620); st.setProperty('--ss-bw', bw + 'px');
      var small = Ht < 700; st.setProperty('--ss-pip', (small ? 56 : 76) + 'px');
      // what is left once the bar, Pip, the sum, the hint and the gaps are measured; a short screen gets a flatter
      // pond, never wider than 1.7 times its height, so the stones always sit inside it
      var hOf = function (e, d) { return e && e.offsetHeight ? e.offsetHeight : d; };
      var rest = hOf(D.bar, 48) + hOf(D.sayRow, small ? 62 : 80) + hOf(D.eq, 66) + hOf(D.tools, 62) + 4 * 10 + 14;
      ph = Math.min(bw * 0.8, Math.max(170, Ht - rest), 480); pw = Math.min(bw, ph * 1.7);
    }
    pw = Math.floor(pw); ph = Math.floor(ph);
    var n = S.p ? S.p.values.length : 4, d = Math.min(pw * (n <= 4 ? 0.26 : n === 5 ? 0.23 : 0.21), ph * 0.33, 136);
    d = Math.max(58, Math.floor(d));
    st.setProperty('--ss-pw', pw + 'px'); st.setProperty('--ss-ph', ph + 'px'); st.setProperty('--ss-d', d + 'px');
    st.setProperty('--ss-fs', Math.round(d * 0.42) + 'px');
  }

  /* ---------- a tap on a stone ---------- */
  function tap(i) {
    if (S.screen !== 'play' || S.busy || !S.p || i < 0 || i >= S.p.values.length) return;
    var p = S.p, s = D.stones[i];
    if (i === p.answer) return spotted();
    // a gentle nudge: no two other stones make this number (true by how the puzzle is made), and after two misses Pip shows the pair
    S.mistakes++; S.wrongHere++; S.streak = 0;
    sfx('wrong', { volume: 0.4 });
    if (s && !reduced()) { s.classList.remove('nope'); void s.offsetWidth; }
    if (s) s.classList.add('nope');
    var x = p.values[i];
    if (S.wrongHere >= 2 && S.hintStep < 2) {
      S.hintStep = 2; markPair();
      say(t('lookPair', { a: p.values[p.pair[0]], b: p.values[p.pair[1]] }), 'nope');
    } else say(t(p.op === 'mul' ? 'nopeMul' : 'nopeAdd', { x: x }), 'nope');
    announce(D.bub.textContent);
    drawEq();
    var later = function () { if (s) s.classList.remove('nope'); };
    if (S.w) S.w.after(900, later); else later();
  }
  function markPair() { var p = S.p; D.stones.forEach(function (s, k) { s.classList.toggle('hint', (S.hintStep >= 1 && k === p.pair[0]) || (S.hintStep >= 2 && k === p.pair[1])); }); }
  /** A hint: first one of the two numbers, then the other; counted. */
  function hint() {
    if (S.screen !== 'play' || S.busy || !S.p) return;
    var p = S.p;
    if (S.hintStep >= 2) { say(t('hintAll'), ''); announce(t('hintAll')); return; }
    S.hintStep++; S.hints++;
    markPair(); drawEq(); hop(); sfx('spark', { volume: 0.5 });
    var line = S.hintStep === 1 ? t('hint1', { a: p.values[p.pair[0]] }) : t('lookPair', { a: p.values[p.pair[0]], b: p.values[p.pair[1]] });
    say(line, ''); announce(line);
    D.hintN.textContent = String(S.hints);
  }
  function spotted() {
    var p = S.p; S.busy = true; S.shown = true;
    if (!S.wrongHere && !S.hintStep) S.clean++;
    S.found++; S.streak++; if (S.mode === 'rush' && S.streak >= 3) S.bonus += Math.min(10, 2 * (S.streak - 2));
    D.stones.forEach(function (s, k) { s.classList.remove('nope', 'hint'); if (k === p.pair[0] || k === p.pair[1]) s.classList.add('pair'); });
    D.stones[p.answer].classList.add('right');
    drawEq(); hop();
    var a = p.values[p.pair[0]], b = p.values[p.pair[1]], c = p.values[p.answer];
    say(t(['right1', 'right2', 'right3'][S.found % 3]), 'yes');
    announce(D.bub.textContent + ' ' + t(p.op === 'mul' ? 'eqMul' : 'eqAdd', { a: a, b: b, c: c }));
    sfx('correct', { volume: 0.7 });
    if (S.mode === 'rush' && D.name) D.name.textContent = t('rush') + ' · ' + t('found', { n: S.found });
    if (S.mode === 'practice' && D.countT) { D.countT.textContent = String(S.found); D.count.setAttribute('aria-label', t('found', { n: S.found })); }
    if (D.dots && D.dots.children[S.round]) D.dots.children[S.round].className = 'on';
    var go = function () {
      if (S.screen !== 'play' || S.done) return;
      S.round++;
      if (S.mode === 'level' && S.round >= C.level(S.id).rounds) return finishLevel();
      nextPuzzle();
    };
    if (S.fast) go(); else if (S.w) S.w.after(reduced() ? 600 : CONFIG.nextMs, go); else go();
  }

  /* ---------- the end of a level or a Rush: the kit's results card (stars, points, BRB.gameOver) ---------- */
  function finishLevel() {
    var w = S.w, L = C.level(S.id), r = { mistakes: S.mistakes, hints: S.hints, clean: S.clean };
    var stars = C.stars(r), points = C.score(L.id, r);
    S.done = true; S.screen = 'won';
    var prev = SAVE.best[L.id]; if (!prev || stars > prev.stars) SAVE.best[L.id] = { stars: stars };
    persist();
    S.lastWin = { mode: 'level', id: L.id, stars: stars, score: points, mistakes: r.mistakes, hints: r.hints, clean: r.clean };
    announce(t('winSay', { name: levelName(L.id), m: r.mistakes, h: r.hints }));
    sfx('levelup');
    S.again = true;
    if (w && !w.ended) w.win({ stars: stars, score: points, title: t('doneH') });
  }
  function endRush() {
    if (S.done) return;
    var w = S.w, n = S.found, stars = C.rushStars(n), points = C.rushPoints(n, S.bonus);
    S.done = true; S.screen = 'won'; S.busy = true;
    if (n > SAVE.rush) SAVE.rush = n;
    persist();
    S.lastWin = { mode: 'rush', found: n, stars: stars, score: points, mistakes: S.mistakes, hints: S.hints };
    announce(t('rushSay', { n: n }));
    S.again = true;
    if (w && !w.ended) w.win({ stars: stars, score: points, title: t('rushH') });
  }

  /* ---------- the keyboard: Tab or the arrows move between the stones, Enter or Space taps one, H asks for a hint ---------- */
  window.addEventListener('keydown', function (e) {
    if (S.screen !== 'play' || game.state !== 'play' || (O.ui.open && O.ui.open > 0) || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key;
    if (k === 'h' || k === 'H') { hint(); e.preventDefault(); return; }
    var mv = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[k];
    if (mv && D.stones && D.stones.length) {
      var at = D.stones.indexOf(document.activeElement), n = D.stones.length, nx = at < 0 ? 0 : (at + mv + n) % n;
      try { D.stones[nx].focus({ preventScroll: true }); } catch (er) { /* gone */ }
      e.preventDefault();
    }
  });

  /* ---------- test hooks (window.__brbTest, merged with the kit's) ---------- */
  function testState() {
    var p = S.p;
    return {
      screen: S.screen, mode: S.mode, level: S.mode === 'rush' ? C.rushLevel(S.round) : S.id, round: S.round, seed: S.seed,
      values: p ? p.values.slice() : [], op: p ? p.op : '', answer: p && (S.screen === 'play' || S.screen === 'won') ? p.answer : -1, pair: p ? p.pair.slice() : [],
      hintStep: S.hintStep, mistakes: S.mistakes, hints: S.hints, clean: S.clean, found: S.found, left: Math.max(0, Math.round(S.left)),
      best: SAVE.best, rushBest: SAVE.rush, lastWin: S.lastWin, kit: game.state,
    };
  }
  Object.assign(window.__brbTest, {
    state: testState,
    core: C,
    pick: function (mode, id, o) { o = Object.assign({}, o || {}); if (game.state === 'play') startMode(mode, id, o); else { S.pending = Object.assign({ mode: mode, id: id }, o); game.start(); } return testState(); },
    picker: function () { if (game.state === 'play') showPicker(); else game.start(); return testState(); },
    tap: function (i) { tap(i); return testState(); },
    hint: function () { hint(); return testState(); },
    skipAnimations: function () { S.fast = true; return testState(); },
    setLeft: function (s) { S.left = +s || 0; S.shownSec = -1; return testState(); },
  });
})();
</script>
