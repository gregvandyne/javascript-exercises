<title>Remi’s Quiet Meadow</title>
<style>
/* Remi's Quiet Meadow on the Oomba Kit: a classroom noise meter. A red panda, Remi (our own character), naps in a meadow
   at sunset while the class keeps quiet. The play page measures how loud the room is and passes the game one number at
   a time (BRB.loudness); nothing is recorded. Screens: the kit's title (Remi already asleep behind it) -> the setup
   card (how quiet, the goal, the room's quiet, the privacy note) -> the meadow with the gauge and the quiet-time clock ->
   the kit's results card. Layout: landscape (projector, laptop, tablet on its side) puts the gauge on the right edge;
   portrait puts it along the bottom. Colour is never the only cue: each zone has an icon and the loud zone stripes. */
html,body{height:100%}
body{margin:0;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.ok-hud{display:none!important}
.rq,.rq *,.rqs,.rqs *{box-sizing:border-box}
.rq{position:fixed;inset:0;overflow:hidden;color:var(--ok-text);font-family:var(--ok-font,system-ui,sans-serif);--top:110px;
  --ink:#2A1B22;--calm:#4CB860;--near:#F2C230;--loud:#E8483C;--card:#FFFDF5}
.rq button{font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.rq-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}
.rq-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
/* the meadow at sunset (light) and at dusk (dark) */
.rq-svg .sk0{stop-color:#7E6BB8}.rq-svg .sk1{stop-color:#E98AA0}.rq-svg .sk2{stop-color:#FFB37E}.rq-svg .sk3{stop-color:#FFE0A3}
.rq-svg .gl0{stop-color:#FFF1B8;stop-opacity:.85}.rq-svg .gl1{stop-color:#FFD39A;stop-opacity:0}
.rq-svg .sun{fill:#FFE7A0;stroke:#FFF6D6;stroke-width:6}
.rq-svg .stars{fill:#FFF6D6;opacity:0}
.rq-svg .cl path{fill:#FFD3D0;opacity:.92}
.rq-svg .h1{fill:#B58BB8}.rq-svg .h2{fill:#8BB565}.rq-svg .h3{fill:#77B24E}
.rq-svg .tuft path{fill:#5E9E3C;stroke:#2A1B22;stroke-width:4;stroke-linejoin:round}
.rq-svg .flies{opacity:0}
.rq-svg .z{font-family:var(--ok-font,system-ui,sans-serif);font-weight:900;fill:#FFFDF5;stroke:#2A1B22;stroke-width:5;paint-order:stroke;opacity:0}
.ok-night .rq-svg .sk0{stop-color:#141A3C}.ok-night .rq-svg .sk1{stop-color:#2E2A63}.ok-night .rq-svg .sk2{stop-color:#7A4675}.ok-night .rq-svg .sk3{stop-color:#D7786A}
.ok-night .rq-svg .gl0{stop-color:#F6A57A;stop-opacity:.55}
.ok-night .rq-svg .sun{fill:#F5A77E;stroke:#FFD3B0}
.ok-night .rq-svg .stars{opacity:.9}
.ok-night .rq-svg .cl path{fill:#6B5A8F;opacity:.8}
.ok-night .rq-svg .h1{fill:#4C3E73}.ok-night .rq-svg .h2{fill:#2F6A4A}.ok-night .rq-svg .h3{fill:#2C6B3F}
.ok-night .rq-svg .tuft path{fill:#245437}
.ok-night .rq-svg .flies{opacity:1}
.ok-night .rq-svg .fly{fill:#FFF3A0}
/* gentle motion: swaying grass and flowers, drifting clouds, blinking fireflies (none with less motion) */
.rq-svg .tuft path,.rq-svg .fl{transform-box:fill-box;transform-origin:50% 100%;animation:rqSway 4.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.rq-svg .cl{animation:rqDrift 38s ease-in-out infinite alternate}.rq-svg .c2{animation-duration:46s}
.rq-svg .fly{animation:rqFly 3.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes rqSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3.5deg)}}
@keyframes rqDrift{from{transform:translateX(-40px)}to{transform:translateX(60px)}}
@keyframes rqFly{0%,100%{opacity:.15;transform:translate(0,0)}50%{opacity:1;transform:translate(12px,-14px)}}
.ok-rm .rq-svg *{animation:none!important}
@media (prefers-reduced-motion:reduce){.rq-svg *{animation:none!important}}

/* the top bar: the quiet-time clock in the middle, pause and teacher settings at the end */
.rq-top{position:absolute;inset-inline:0;top:0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));pointer-events:none}
.rq-top>*{pointer-events:auto}
.rq-spacer{pointer-events:none}
.rq-clock{justify-self:center;display:flex;flex-direction:column;align-items:center;padding:6px 22px 8px;border-radius:24px;background:var(--card);color:var(--ink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);min-width:min(300px,48vw)}
.rq-clock .lab{font-weight:800;font-size:clamp(.95rem,min(2.2vw,2.6vh),1.7rem);line-height:1.1;display:flex;align-items:center;gap:6px}
.rq-clock .lab::before{content:'🌙';font-size:.95em}
.rq-clock .time{font-weight:900;font-size:clamp(34px,min(8vw,8.4vh),118px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.rq-clock .sub{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:clamp(.85rem,min(1.8vw,2.2vh),1.5rem);opacity:.85}
.rq-clock .wakes::before{content:'😮 '}
.rq-clock.run .time{color:#2E8B4A}
.rq-btns{justify-self:end;display:flex;gap:8px}
.rq-ib{width:clamp(48px,min(6vw,7vh),76px);height:clamp(48px,min(6vw,7vh),76px);border-radius:18px;border:3px solid var(--ink);background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;padding:0}
.rq-ib svg{width:55%;height:55%}
.rq-ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.rq button:focus-visible,.rq input:focus-visible{outline:4px solid var(--ok-focus,#2E7CF6);outline-offset:3px}
.rq:not(.playing) .rq-top,.rq:not(.playing) .rq-gauge,.rq:not(.playing) .rq-demo{visibility:hidden}

/* the gauge (landscape: up the right edge) */
.rq-gauge{position:absolute;right:calc(18px + env(safe-area-inset-right));top:calc(var(--top) + 30px);bottom:calc(40px + env(safe-area-inset-bottom));width:clamp(52px,4.4vw,84px);
  display:flex;flex-direction:column;align-items:center;gap:8px}
.g-track{position:relative;flex:1;width:100%;border-radius:999px;border:4px solid var(--ink);background:#FFFDF5;overflow:hidden;box-shadow:0 5px 0 var(--ink)}
.g-zone{position:absolute;left:0;right:0;bottom:0;opacity:.38}
.g-calm{background:var(--calm)}.g-near{background:var(--near)}
.g-loud{background:var(--loud);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 8px,transparent 8px 16px)}
.g-fill{position:absolute;left:0;right:0;bottom:0;transition:background-color .2s}
.g-fill.calm{background:var(--calm)}.g-fill.near{background:var(--near)}
.g-fill.loud{background:var(--loud);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 8px,transparent 8px 16px)}
.g-peak{position:absolute;left:0;right:0;height:5px;margin-bottom:-2px;background:var(--ink);opacity:.6}
.g-line{position:absolute;left:-4px;right:-4px;height:8px;margin-bottom:-4px;background:var(--ink)}
.g-ic{font-size:clamp(26px,min(3vw,4vh),48px);line-height:1}
.g-tag{position:absolute;right:calc(100% + 8px);transform:translateY(-50%);display:flex;align-items:center;gap:4px;white-space:nowrap;padding:4px 12px;border-radius:999px;
  background:var(--loud);color:#fff;border:3px solid var(--ink);font-weight:800;font-size:clamp(.9rem,min(1.6vw,2.4vh),1.5rem);box-shadow:0 3px 0 var(--ink)}
.g-held{position:absolute;right:calc(100% + 8px);bottom:0;white-space:nowrap;padding:4px 10px;border-radius:12px;background:var(--card);color:var(--ink);border:3px solid var(--ink);font-weight:700;font-size:.95rem}
.rq-gauge.held .g-track{opacity:.55}
.rq-gauge.loud .g-track{animation:rqThrob .8s ease-in-out infinite}
@keyframes rqThrob{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.ok-rm .rq-gauge.loud .g-track{animation:none}

/* portrait: the gauge lies along the bottom */
.rq.portrait .rq-gauge{left:calc(16px + env(safe-area-inset-left));right:calc(16px + env(safe-area-inset-right));top:auto;bottom:calc(64px + env(safe-area-inset-bottom));width:auto;height:58px;flex-direction:row}
.rq.portrait .g-track{height:100%;flex:1;width:auto}
.rq.portrait .g-zone,.rq.portrait .g-fill{top:0;bottom:0;left:0}
.rq.portrait .g-peak{top:0;bottom:0;width:5px;height:auto;margin:0 -2px}
.rq.portrait .g-line{top:-4px;bottom:-4px;width:8px;height:auto;margin:0 -4px}
.rq.portrait .g-tag{right:auto;bottom:calc(100% + 8px);transform:translateX(-50%)}
.rq.portrait .g-held{right:auto;left:0;bottom:calc(100% + 8px)}
.rq.portrait .g-icbot{order:-1}.rq.portrait .g-ictop{order:3}
.rq.portrait.demo .rq-gauge{bottom:calc(158px + env(safe-area-inset-bottom))}

/* "Too loud!" and the little "!" of a stir, over the meadow */
.rq-bubble{position:absolute;transform:translate(-50%,-100%);padding:10px 22px;border-radius:26px;background:var(--card);color:var(--ink);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);
  font-weight:900;font-size:clamp(1.3rem,min(3.4vw,5vh),3.4rem);white-space:nowrap;pointer-events:none}
.rq-bubble::after{content:'';position:absolute;left:24%;bottom:-18px;border:14px solid transparent;border-top:18px solid var(--ink);border-bottom:0}
.rq-bubble.pop{animation:rqPop .42s cubic-bezier(.34,1.56,.64,1) both}
.rq-mark{position:absolute;transform:translate(-50%,-100%);font-weight:900;font-size:clamp(1.6rem,4vh,3rem);color:#FFFDF5;-webkit-text-stroke:2px var(--ink);pointer-events:none}
.rq-mark.pop{animation:rqPop .35s cubic-bezier(.34,1.56,.64,1) both}
@keyframes rqPop{from{transform:translate(-50%,-100%) scale(.2);opacity:0}to{transform:translate(-50%,-100%) scale(1);opacity:1}}
.ok-rm .rq-bubble.pop,.ok-rm .rq-mark.pop{animation:none}

/* demo mode: the stand-in for the room */
.rq-demo{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  padding:10px 14px;border-radius:24px;background:var(--card);color:var(--ink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);max-width:calc(100vw - 32px);width:max-content}
.rq-ribbon{font-weight:900;padding:4px 12px;border-radius:999px;background:#B27CF0;color:#fff;border:3px solid var(--ink);text-transform:uppercase;letter-spacing:.05em;font-size:.9rem}
.rq-noise{display:flex;align-items:center;gap:8px;font-weight:800}
.rq-noise input{width:clamp(140px,22vw,320px);height:44px;accent-color:#E8483C;margin:0}
.rq-db{min-height:48px;padding:4px 16px;border-radius:16px;border:3px solid var(--ink);background:#FFE7A0;color:var(--ink);font-weight:800;font-size:1rem;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--ink)}
.rq-db[aria-pressed="true"]{background:#5DB548;color:#fff}
.rq-db .em{font-size:1.3em}
.rq.portrait .rq-demo{width:calc(100vw - 32px);max-width:560px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;padding:8px 10px}
.rq.portrait .rq-noise .tx{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rq.portrait .rq-noise input{width:100%}
.rq.portrait .rq-demo .rq-db{justify-content:center}
.rq.portrait .rq-ribbon{align-self:center}
/* a narrow screen: a smaller clock, the two buttons stacked at the end */
@media (max-width:600px){
  .rq-clock{min-width:0;padding:4px 12px 6px;border-radius:18px}
  .rq-clock .sub{gap:2px 8px;font-size:.8rem}
  .rq-btns{flex-direction:column}
}

.rqs{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));background:var(--ok-scrim)}
.rqs-card{width:min(860px,100%);max-height:100%;overflow:auto;background:var(--ok-card);color:var(--ok-text);border:3px solid var(--ok-edge);border-radius:28px;box-shadow:0 6px 0 var(--ok-edge);
  padding:16px 18px;display:grid;gap:12px 18px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"h h" "l r" "f f"}

  .rqs legend{font-size:clamp(1rem,2.4vmin,1.9rem)}

  .rqs .frow{font-size:clamp(.9rem,1.8vmin,1.4rem)}
  .rqs .linetx,.rqs .calt,.rqs .privacy{font-size:clamp(1rem,2vmin,1.5rem)}

}

<script>
/* remi-core:begin */
/* RemiCore: the level maths, the room calibration and Remi's moods, with no DOM (tests/unit/remis-quiet-meadow.test.js
   runs this block with node:vm). Every step is deterministic: the same inputs always give the same Remi. */
window.RemiCore = (function () {
  'use strict';
  var DB_LO = -70, DB_HI = -10;                       // -70 dBFS is 0 on the gauge, -10 dBFS is 100
  var ATTACK = 0.12, RELEASE = 0.5;                   // seconds: the gauge jumps up fast and settles slowly
  var PRESETS = { whisper: 10, quiet: 18, group: 30 }; // how far above the room's own quiet the "too loud" line sits
  var PRESET_IDS = ['whisper', 'quiet', 'group'];
  var BASE = 30, FINE = 25, LINE_MIN = 15, LINE_MAX = 95;
  var GOALS = [120, 300, 600, 900, 1200, 1800, 0];   // seconds of quiet time; 0 = no goal
  var T = {
    near: 10,        // a level within this of the line counts as "getting loud"
    stirIn: 0.3,     // seconds of near-the-line before Remi stirs
    stirOut: 1.2,    // seconds below the near band before a stirring Remi settles again
    stirCool: 2.5,   // seconds between two stirs (ear, tail, a peek, a murmur)
    wake: 1.5,       // seconds over the line (leaky) that wake him
    leak: 0.5,       // how fast the over-the-line count drains while it is quieter (x dt)
    seq: 2.8,        // the waking sequence: sit up 0.6, stretch and yawn to 2.0, then "Too loud!"
    sitUp: 0.6, grumble: 2.0,
    calmBand: 5,     // grumpy Remi calms while the level is this far under the line
    calm: 4,         // seconds of calm before he lies back down
    settle: 2.0,     // lying down takes this long
    reGrump: 0.6,    // noise this long while lying down makes him grumpy again (no extra wake)
  };
  var STIRS = ['ear', 'tail', 'peek', 'murmur'];
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  /** dBFS (from the play page) -> 0..100, linear in dB. */
  function levelOf(db) { if (typeof db !== 'number' || db !== db) return 0; return clamp((db - DB_LO) / (DB_HI - DB_LO) * 100, 0, 100); }
  /** One smoothing step: fast up (attack), slow down (release), using the real dt so any frame rate behaves the same. */
  function smooth(prev, x, dt) {
    var tau = x > prev ? ATTACK : RELEASE, a = 1 - Math.exp(-Math.max(0, dt) / tau);
    return prev + (x - prev) * a;
  }
  function presetOf(id) { return PRESETS.hasOwnProperty(id) ? id : 'quiet'; }
  /** The "too loud" line: the room's quiet + the preset's margin + the fine slider, kept on the gauge. */
  function line(base, preset, fine) {
    var b = typeof base === 'number' && base === base ? base : BASE;
    return Math.round(clamp(b + PRESETS[presetOf(preset)] + clamp(+fine || 0, -FINE, FINE), LINE_MIN, LINE_MAX));
  }
  function median(xs) {
    var a = xs.filter(function (x) { return typeof x === 'number' && x === x; }).sort(function (p, q) { return p - q; });
    if (!a.length) return null;
    var m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }
  /** samples: smoothed levels over ~3 s. -> { ok, base, why: 'noInput' | 'tooLoud' } */
  function calibrate(samples) {
    var m = median(samples || []);
    if (m === null || (samples || []).length < 5) return { ok: false, why: 'noInput' };
    if (m > 70) return { ok: false, why: 'tooLoud', room: Math.round(m) };

          var g5 = ctx.createGain(); g5.gain.setValueAtTime(0.0001, t0 + c[2]); g5.gain.exponentialRampToValueAtTime(0.25, t0 + c[2] + 0.02); g5.gain.exponentialRampToValueAtTime(0.0001, t0 + c[2] + 0.2);
          o5.connect(g5); g5.connect(out); o5.start(t0 + c[2]); o5.stop(t0 + c[2] + 0.22);
        });
      }
    } catch (e) { /* no sound */ }
  }
  function heldNow() { return now() < S.heldUntil; }

  /* ---------- the room: the page's number, the demo, or a test ---------- */
  function rawLevel(dtMs) {
    if (S.forced != null) return S.forced;
    if (S.demo) {
      var v = S.demoLevel;
      if (S.chatter) v = Math.max(v, 52 + 12 * Math.sin(A.time * 3.1) + 9 * Math.sin(A.time * 7.7 + 1) + (Math.random() - 0.5) * 10);
      if (now() < S.clapUntil) v = Math.max(v, 94);
      return Math.max(0, Math.min(100, v));
    }
    if (S.mic === 'on') return CORE.levelOf(S.db);
    return 0;
  }
  if (LD) {
    LD.on(function (db) { S.db = db; S.dbAt = now(); });
    LD.onState(function (st) {
      if (st === 'stopped' || st === 'idle') { var was = S.mic === 'on'; S.mic = 'idle'; if (was && S.screen === 'play' && !S.demo && !S.paused) pauseGame('mic'); }
      else if (st === 'on') S.mic = 'on';
    });
  }
  function micStart() { return LD ? LD.start().then(function (st) { S.mic = st === 'on' ? 'on' : st; return st; }, function () { S.mic = 'unavailable'; return 'unavailable'; }) : Promise.resolve('off'); }
  function micStop() { if (LD && S.mic === 'on') LD.stop(); if (S.mic === 'on') S.mic = 'idle'; }

  /* ---------- the loop (our own: the kit's loop pauses when the teacher clicks the page around the game) ---------- */
  var last = 0;
  function frame(ts) {
    var dt = last ? Math.min(0.1, (ts - last) / 1000) : 0.016; last = ts;
    tick(dt);
    requestAnimationFrame(frame);
  }
  function tick(dt) {
    if (!R.root) return;
    var raw = rawLevel(dt * 1000);
    S.raw = raw; S.level = CORE.smooth(S.level, raw, dt);
    S.peak = Math.max(S.level, S.peak - 25 * dt);
    if (S.calib) { S.calib.samples.push(S.level); S.calib.left -= dt; if (S.calib.left <= 0) calibDone(); else if (S.calib.onTick) S.calib.onTick(Math.ceil(S.calib.left)); }
    if (S.screen === 'play' && !S.paused && S.core && !S.ended) {
      var r = CORE.step(S.core, { level: S.level, line: lineNow(), held: heldNow(), dt: dt, rnd: Math.random() });
      r.events.forEach(onEvent);
    }
    animate(dt);
    meter();
  }
  function onEvent(e) {
    if (e.type === 'stir') { stir(e.act); if (S.core.stirs === 1 || S.core.stirs % 4 === 0) announce(t('remiStir')); }
    else if (e.type === 'wake') { announce(t('remiWoke'), true); }
    else if (e.type === 'yawn') snd('yawn');
    else if (e.type === 'grumble') { snd('grumble'); if (!reduced()) O.juice && O.juice.shake && O.juice.shake(0.2, R.bubble); }
    else if (e.type === 'regrump') snd('grumble');
    else if (e.type === 'settle') snd('sigh');
    else if (e.type === 'asleep') announce(t('remiBack'), true);
    else if (e.type === 'goal') celebrate();
  }

  /* ---------- the gauge and the clock ---------- */
  var lastMin = 0;
  function meter() {
    if (!R.g) return;
    var line = lineNow(), lv = Math.round(S.level), near = Math.max(0, line - CORE.T.near), vert = !POS.portrait, dim = vert ? 'height' : 'width', pos = vert ? 'bottom' : 'left';
    R.zg.style[dim] = near + '%'; R.zy.style[dim] = (line - near) + '%'; R.zy.style[pos] = near + '%'; R.zr.style[dim] = (100 - line) + '%'; R.zr.style[pos] = line + '%';
    ['zg', 'zy', 'zr', 'fill', 'peak', 'ln'].forEach(function (k) { var o = R[k].style; if (vert) { o.left = o.right = ''; o.width = ''; } else { o.bottom = ''; o.height = ''; if (pos === 'left') o.right = ''; else o.left = ''; } });
    R.zg.style[pos] = '0';
    R.fill.style[dim] = Math.max(2, S.level) + '%'; R.fill.style[pos] = '0';
    R.fill.className = 'g-fill ' + (S.level > line ? 'loud' : S.level > near ? 'near' : 'calm');
    R.peak.style[pos] = S.peak + '%'; R.ln.style[pos] = line + '%';
    var tr = R.track.getBoundingClientRect(), gr = R.g.getBoundingClientRect();
    if (vert) { R.tag.style.top = Math.round(tr.bottom - gr.top - tr.height * line / 100) + 'px'; R.tag.style.left = ''; }
    else { var lx = tr.left + tr.width * line / 100; R.tag.style.left = Math.round(lx - gr.left) + 'px'; R.tag.style.top = ''; }
    var h = heldNow() && S.screen === 'play'; R.held.hidden = !h; R.g.classList.toggle('held', h);
    R.g.setAttribute('aria-valuenow', String(lv)); R.g.setAttribute('aria-label', t('meterLine', { n: lv, line: line }));
    R.g.classList.toggle('loud', S.level > line);
    var c = S.core, q = c ? c.quiet : 0;
    R.time.textContent = clock(q);
    R.goalT.textContent = CFG.goal ? t('of', { goal: clock(CFG.goal) }) : t('noGoal');
    R.wakes.textContent = t('woke', { n: c ? c.wakes : 0 });
    R.card.classList.toggle('run', !!c && (c.state === 'asleep' || c.state === 'stirring') && !S.paused && S.screen === 'play');
    var mins = Math.floor(q / 60); if (c && mins > lastMin && S.screen === 'play') { lastMin = mins; announce(t('quietMin', { n: mins }), true); }
  }

  /* ---------- screens ---------- */
  function setScreen(s) { S.screen = s; document.documentElement.dataset.rq = s; R.root && R.root.classList.toggle('playing', s === 'play'); }
  function newSession() {
    S.core = CORE.make({ goal: CFG.goal }); S.ended = false; S.paused = false; A.celebrate = null; lastMin = 0; S.heldUntil = 0;
    document.documentElement.classList.remove('rq-ended');
  }
  /** the first Start, from the kit's flow (title -> setup card -> here) */
  var startP = null;
  function begin() {
    build(); newSession(); setScreen('play');
    var p = startP || Promise.resolve(S.demo ? 'demo' : 'off'); startP = null;
    S.paused = true;
    p.then(function (st) {
      if (st === 'demo') { setDemo(true); S.paused = false; return; }
      if (st === 'on') { setDemo(false); S.paused = false; announce(t('remiAsleep'), true); return; }
      noMic(st);
    });
  }
  function setDemo(on) {
    S.demo = !!on; R.demo.hidden = !S.demo; R.root.classList.toggle('demo', S.demo); if (S.demo) micStop(); layout();
  }

  /* the setup card: how quiet, the fine slider, the goal, the room's quiet, the privacy note, Start */
  var setupOpen = false, setupApi = null;
  function setupCard(opt) {
    opt = opt || {};
    build(); setScreen('setup');
    return new Promise(function (resolve) {
      setupOpen = true;
      var wrap = el('div', 'rqs'); wrap.dir = O.dir || 'ltr';
      var card = el('div', 'rqs-card'); card.setAttribute('role', 'dialog'); card.setAttribute('aria-modal', 'true'); card.setAttribute('aria-labelledby', 'rqsH');
      wrap.appendChild(card);
      var h = el('h2', '', t('setupH')); h.id = 'rqsH'; card.appendChild(h);
      var left = el('div', 'left'), right = el('div', 'right'); card.append(left, right);
      function group(label, cls, opts, get, set, into) {
        var fs = el('fieldset'), lg = el('legend', '', label); fs.appendChild(lg);
        var row = el('div', 'row ' + (cls || '')); row.setAttribute('role', 'radiogroup'); row.setAttribute('aria-label', label); row.style.setProperty('--n', opts.length);
        var bs = opts.map(function (o) {
          var b = el('button', 'opt'); b.type = 'button'; b.setAttribute('role', 'radio'); b.dataset.v = String(o.v);
          if (o.em) b.appendChild(el('span', 'em', o.em)); b.appendChild(el('span', '', o.label));
          b.addEventListener('click', function () { set(o.v); sync(); sfx('select'); });
          b.addEventListener('keydown', function (e) {
            var i = bs.indexOf(b), d = { ArrowRight: RTL ? -1 : 1, ArrowDown: 1, ArrowLeft: RTL ? 1 : -1, ArrowUp: -1 }[e.key];
            if (!d) return; e.preventDefault(); e.stopPropagation(); var n = bs[(i + d + bs.length) % bs.length]; n.click(); n.focus();
          });
          row.appendChild(b); return b;
        });
        function sync() { bs.forEach(function (b) { var on = String(get()) === b.dataset.v; b.setAttribute('aria-checked', String(on)); b.tabIndex = on ? 0 : -1; }); }
        sync(); fs.appendChild(row); into.appendChild(fs);
        return { fs: fs, sync: sync };
      }
      group(t('howQuiet'), 'presets', [{ v: 'whisper', label: t('whisper'), em: '🤫' }, { v: 'quiet', label: t('quietWork'), em: '📚' }, { v: 'group', label: t('groupWork'), em: '💬' }],
        function () { return CFG.preset; }, function (v) { CFG.preset = v; showLine(); }, left);
      // the fine slider: the line moves on the little gauge as it slides
      var fs2 = el('fieldset', 'fine'); fs2.appendChild(el('legend', '', t('fine')));
      var frow = el('div', 'frow'); frow.dir = 'ltr';
      var fr = el('input'); fr.type = 'range'; fr.min = String(-CORE.FINE); fr.max = String(CORE.FINE); fr.step = '1'; fr.value = String(CFG.fine); fr.setAttribute('aria-label', t('fine'));
      fr.addEventListener('input', function () { CFG.fine = +fr.value || 0; showLine(); });
      var lo = el('span', 'end', t('touchier')), hi = el('span', 'end', t('calmer'));
      frow.append(lo, fr, hi); fs2.appendChild(frow);
      var mini = el('div', 'mini'); mini.dir = 'ltr'; var mfill = el('i', 'mf'), mline = el('b', 'ml'); mini.append(mfill, mline); fs2.appendChild(mini);
      var lineTx = el('p', 'linetx'); fs2.appendChild(lineTx);
      left.appendChild(fs2);
      function showLine() { var l = lineNow(); mline.style.left = l + '%'; mfill.style.width = Math.round(S.level) + '%'; lineTx.textContent = t('calibDone', { room: CFG.base, line: l }); }
      showLine(); var lineT = setInterval(function () { mfill.style.width = Math.round(S.level) + '%'; }, 120);
      group(t('goalH'), 'goals', CORE.GOALS.map(function (g) { return { v: g, label: g ? t('min', { n: g / 60 }) : t('noGoal') }; }),
        function () { return CFG.goal; }, function (v) { CFG.goal = +v; }, right);
      // "Set to the room's quiet": 3 seconds of the room, then the line sits above it
      var cal = el('div', 'cal');
      var cb = el('button', 'calb'); cb.type = 'button'; cb.appendChild(el('span', 'em', '🎚️')); cb.appendChild(el('span', '', t('calib')));
      var ct = el('p', 'calt', t('calibHint')); ct.setAttribute('role', 'status');
      cb.addEventListener('click', function () {
        if (S.calib) return;
        cb.disabled = true; ct.textContent = t('calibListen', { n: 3 });
        var go = function () { startCalib(function (n) { ct.textContent = t('calibListen', { n: n }); }, function (r) {
          cb.disabled = false;
          if (r.ok) { CFG.base = r.base; save(); showLine(); ct.textContent = t('calibDone', { room: r.room, line: lineNow() }); }
          else ct.textContent = r.why === 'tooLoud' ? t('calibLoud') : t('calibNoMic');
        }); };
        if (S.demo || S.forced != null) go();
        else micStart().then(function (st) { if (st === 'on') go(); else { cb.disabled = false; ct.textContent = t('calibNoMic'); } });
      });
      cal.append(cb, ct); right.appendChild(cal);
      var foot = el('div', 'foot'); card.appendChild(foot);
      foot.appendChild(el('p', 'privacy', '🔒 ' + t('privacy')));
      var go = el('div', 'go'); foot.appendChild(go);
      function close(how) {
        if (!setupOpen) return; setupOpen = false; save(); clearInterval(lineT); wrap.remove(); document.removeEventListener('keydown', keys, true);
        if (S.calib) { S.calib = null; }
        resolve(how);
      }
      var start = O.ui.button(opt.edit ? t('backToRemi') : t('startMic'), { kind: 'hot', big: true, icon: opt.edit ? 'play' : undefined, onPress: function () {
        // the tap that lets the page open the microphone: asked for right now, inside the tap
        if (!(opt.edit && S.demo)) startP = micStart();
        close('start');
      } });
      if (!opt.edit) start.insertBefore(el('span', 'em', '🎤'), start.firstChild);
      start.id = 'rqStart'; start.setAttribute('data-start', ''); go.appendChild(start);
      var demoB = O.ui.button(opt.edit ? t('startOver') : t('tryDemo'), { kind: 'quiet', onPress: function () { if (!opt.edit) { S.demo = true; startP = Promise.resolve('demo'); } close(opt.edit ? 'restart' : 'demo'); } });
      demoB.id = opt.edit ? 'rqRestart' : 'rqDemo'; go.appendChild(demoB);
      function keys(e) {
        if (e.key === 'Tab') { var f = [].slice.call(card.querySelectorAll('button:not([tabindex="-1"]),input')).filter(function (b) { return b.offsetParent; }), i = f.indexOf(document.activeElement); e.preventDefault(); (f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length] || start).focus(); }
        if (e.key === ' ' || e.key === 'Escape' || e.key === 'p' || e.key === 'P') e.stopPropagation();
      }
      document.addEventListener('keydown', keys, true);
      O.ui.root().appendChild(wrap);
      setTimeout(function () { try { start.focus({ preventScroll: true }); } catch (e) { /* gone */ } }, 30);
      setupApi = { close: function () { if (setupOpen) start.click(); }, demo: function () { if (setupOpen) demoB.click(); } };
    });
  }
  function startCalib(onTick, onDone) { S.calib = { samples: [], left: 3, onTick: onTick, onDone: onDone }; }
  function calibDone() {
    var c = S.calib; S.calib = null; if (!c) return;
    var r = CORE.calibrate(c.samples);
    if (!S.demo && S.screen === 'setup') micStop();
    if (c.onDone) c.onDone(r);
  }

  /* the no-mic card: why, how to fix it, and the demo */
  function noMic(st) {
    setScreen('nomic'); S.paused = true;
    var k = ['denied', 'nodevice', 'busy', 'unavailable', 'off', 'needsTap'].indexOf(st) >= 0 ? st : 'unavailable';
    if (k === 'needsTap') k = 'denied';
    var wrap = el('div', 'rqs rqn'); wrap.dir = O.dir || 'ltr';
    var card = el('div', 'rqs-card'); wrap.appendChild(card); card.setAttribute('role', 'alertdialog'); card.setAttribute('aria-modal', 'true'); card.setAttribute('aria-labelledby', 'rqnH'); card.setAttribute('aria-describedby', 'rqnP');
    card.appendChild(el('div', 'big', k === 'off' ? '🎧' : '🎤'));
    var h = el('h2', '', t('noMic_' + k)); h.id = 'rqnH'; card.appendChild(h);
    var p = el('p', 'why', t('noMic_' + k + '_p')); p.id = 'rqnP'; card.appendChild(p);
    card.appendChild(el('p', 'privacy', '🔒 ' + t('privacy')));
    var go = el('div', 'go'); card.appendChild(go);
    function done() { wrap.remove(); }
    var again = O.ui.button(t('retry'), { kind: 'hot', big: true, icon: 'restart', onPress: function () {
      done(); setScreen('play'); micStart().then(function (s2) { if (s2 === 'on') { setDemo(false); S.paused = false; announce(t('remiAsleep'), true); } else noMic(s2); });
    } });
    again.id = 'rqRetry';
    var demo = O.ui.button(t('tryDemo'), { kind: 'go', big: k === 'off', onPress: function () { done(); setScreen('play'); setDemo(true); S.paused = false; announce(t('remiAsleep'), true); } });
    demo.id = 'rqDemo';
    if (k !== 'off') go.appendChild(again);
    go.appendChild(demo);
    O.ui.root().appendChild(wrap);
    setTimeout(function () { try { (k === 'off' ? demo : again).focus({ preventScroll: true }); } catch (e) { /* gone */ } }, 30);
  }

  /* pause: our button, Space, P or Esc, a hidden page, or the page's Stop. The microphone is off while paused. */
  var pauseOpen = false;
  function pauseGame(why) {
    if (S.screen !== 'play' || S.paused || S.ended) return;
    S.paused = true; micStop(); setScreen('play'); R.root.classList.add('paused');
    pauseOpen = true;
    announce(t('paused'), true);
    O.ui.pause().then(function (r) {
      pauseOpen = false; R.root.classList.remove('paused');
      if (r === 'restart') { newSession(); resume(); }
      else if (r === 'quit') teacherSettings(true);
      else resume();
    });
  }
  function resume() {
    if (S.demo) { S.paused = false; return; }
    // Resume is a tap: the page may open the microphone again
    micStart().then(function (st) { if (st === 'on') S.paused = false; else noMic(st); });
  }
  function teacherSettings(fromPause) {
    if (S.screen !== 'play' || S.ended) return;
    S.paused = true; micStop();
    setupCard({ edit: true }).then(function (how) {
      setScreen('play');
      if (how === 'restart') newSession();
      if (S.core) S.core.goal = CFG.goal;
      var p = startP; startP = null;
      if (S.demo) { S.paused = false; return; }
      (p || micStart()).then(function (st) { if (st === 'on') S.paused = false; else noMic(st); });
    });
  }
  document.addEventListener('keydown', function (e) {
    if (setupOpen || pauseOpen || S.screen !== 'play' || S.ended) return;
    if (O.ui.open) return;
    var tg = e.target && e.target.tagName;
    if (e.code === 'Space' && (tg === 'BUTTON' || tg === 'INPUT')) return;
    if (e.code === 'Space' || e.key === 'p' || e.key === 'P' || e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); pauseGame('key'); }
  }, true);
  document.addEventListener('visibilitychange', function () { if (document.hidden) pauseGame('hidden'); });

  /* the happy ending: Remi wakes gently, stands with his arms wide, stars and confetti, then the results card */
  function celebrate() {
    S.ended = true; micStop(); setScreen('end'); A.celebrate = now();
    R.bubble.hidden = true;
    announce(t('endTitle'), true);
    setTimeout(function () { snd('chirp'); sfx('win'); confetti(); }, 900);
    try { if (window.BRB) BRB.gameOver({ won: true, score: null }); } catch (e) { /* offline */ }
    setTimeout(results, A.skip ? 50 : 3000);
  }
  function results() {
    document.documentElement.classList.add('rq-ended');
    var c = S.core, stars = CORE.stars(c ? c.wakes : 0);
    var done = O.ui.win({ stars: stars, title: t('endTitle'), next: false, hero: false });
    setTimeout(function () {
      var card = document.querySelector('.ok-win .ok-card');
      if (card && !card.querySelector('.rq-stats')) {
        var sub = el('p', 'rq-stats');
        sub.appendChild(el('b', '', t('endSub'))); sub.appendChild(el('br'));
        sub.appendChild(document.createTextNode(t('endStats', { time: clock(c ? c.quiet : 0), n: c ? c.wakes : 0 })));
        var sp = card.querySelector('.ok-sparks'); if (sp && sp.nextSibling) card.insertBefore(sub, sp.nextSibling); else card.appendChild(sub);
      }
    }, 0);
    Promise.resolve(done).then(function () {
      document.documentElement.classList.remove('rq-ended');
      A.celebrate = null; S.core = null; setScreen('setup');
      setupCard().then(function (how) { begin(); });
    });
  }

  /* ---------- the kit game: the title over our sleeping meadow, then the setup card ---------- */
  var SET = ['          ', '          ', '          ', '          ', 'P         ', '##########'];
  var game = O.game({
    api: 1, title: t('title'), subtitle: t('tag'), titleHue: 'coral',
    controls: 'none', camera: 'fixed', hero: 'me', hud: [], countdown: 0,
    level: O.level.grid(SET, {}),
    intro: function () { return setupCard(); },
    setup: function () { build(); },
    testState: function () { return testState(); },
    on: { start: function () { begin(); }, title: function () { build(); setScreen('title'); } },
  });
  build();
  requestAnimationFrame(frame);

  /* ---------- test hooks (the covers, the e2e tests, the playtest) ---------- */
  function testState() {
    var c = S.core;
    return { remi: true, screen: S.screen, state: c ? c.state : 'asleep', pose: A.to, wakes: c ? c.wakes : 0, quiet: c ? Math.round(c.quiet * 10) / 10 : 0, goal: CFG.goal,
      line: lineNow(), level: Math.round(S.level * 10) / 10, held: heldNow(), mic: S.mic, demo: S.demo, preset: CFG.preset, fine: CFG.fine, base: CFG.base,
      paused: S.paused, stars: c ? CORE.stars(c.wakes) : 3, bubble: !!R.bubble && !R.bubble.hidden, saved: load() };
  }
  Object.assign(window.__brbTest, {
    state: function () { return testState(); },
    setup: function (o) { o = o || {}; if (CORE.PRESET_IDS.indexOf(o.preset) >= 0) CFG.preset = o.preset; if (o.fine != null) CFG.fine = Math.max(-25, Math.min(25, +o.fine || 0)); if (o.goal != null) CFG.goal = Math.max(0, +o.goal || 0); if (o.base != null) CFG.base = +o.base; return testState(); },
    closeSetup: function () { if (setupApi) setupApi.close(); return true; },
    demoStart: function () { if (setupApi) setupApi.demo(); return true; },
    demo: function (on) { if (S.screen === 'play' || S.screen === 'nomic') { var n = document.querySelector('.rqn'); if (n) n.remove(); setScreen('play'); setDemo(on !== false); S.paused = false; } else S.demo = on !== false; return testState(); },
    level: function (v) { S.forced = v == null ? null : Math.max(0, Math.min(100, +v)); if (v != null) { S.level = S.forced; S.peak = S.forced; } return testState(); },
    setGoal: function (sec) { CFG.goal = Math.max(0, +sec || 0); if (S.core) S.core.goal = CFG.goal; return testState(); },
    step: function (ms) { var n = Math.ceil((+ms || 0) / 50); for (var i = 0; i < n; i++) { if (S.heldUntil > now()) S.heldUntil -= 50; tick(0.05); } return testState(); },
    pose: function (name) { A.forced = name && ART.POSES[name] ? name : null; return testState(); },
    skipAnimations: function () { A.skip = true; return true; },
    calibrate: function (samples) { var r = CORE.calibrate(samples || []); if (r.ok) { CFG.base = r.base; save(); } return Object.assign({ line: lineNow() }, r); },
    sounds: function () { return S.sounds.slice(); },
    pause: function () { pauseGame('test'); return testState(); },
  });
})();
</script>
