<title>Happy Putt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Happy Putt: an 18-hole cartoon mini golf course. Layout = top HUD, the hole on a canvas (scaled to fit),
   a bottom bar with the power slider and the PUTT button. In landscape the HUD and bar move to a side column.
   Overlays (title, hole card, pass the phone, scorecard, pause, results) are fixed panels on top. */
:root{
  --grass:#3f9b55; --grass2:#2d7a40; --ink:#1d2b1f; --cream:#fff8e7; --gold:#f2c14e; --gold2:#c98f12;
  --red:#e63946; --sky:#bfe7ff; --card:#fffdf7; --muted:#6b7a6e; --blue:#2f6bff;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;font-family:var(--body);color:var(--ink);background:#1b4d2a;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid #fff;outline-offset:2px}
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:#1b4d2a}
/* HUD */
.hud{display:flex;align-items:center;gap:6px;padding:6px max(8px,env(safe-area-inset-right)) 4px max(8px,env(safe-area-inset-left));min-height:52px;background:linear-gradient(#1f5a31,#174526);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.hud .holebox{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.hud .holebox b{font:600 .98rem/1.05 var(--display);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.hud .holebox small{font-size:.68rem;font-weight:800;opacity:.85;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud.solo .who{display:none}  /* one player: no need to say who is up, give the hole name the room */
.hud .strokes{flex:none;background:#fff;color:var(--ink);border-radius:14px;padding:4px 10px;text-align:center;line-height:1.05;min-width:62px}
.hud .strokes b{display:block;font:600 1.25rem/1 var(--display)}
.hud .strokes .stick{font-size:.95rem;margin-right:3px;vertical-align:1px}  /* the hockey-stick putter next to the stroke count */
.hud .strokes small{font-size:.62rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hud .who{flex:0 1 auto;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 9px 4px 5px;font-weight:900;font-size:.76rem;max-width:122px;min-width:0}
.hud .who i{width:16px;height:16px;border-radius:50%;flex:none;background:var(--c,#fff);box-shadow:inset -2px -2px 0 rgba(0,0,0,.2)}
.hud .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 2-4 players: the hole name gets a touch smaller and may wrap onto two lines (whole words only) so a long player name has room */
.hud:not(.solo){gap:5px;padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right))}
.hud:not(.solo) .holebox b{font-size:.84rem;overflow-wrap:normal}
.hud:not(.solo) .strokes{min-width:56px;padding:4px 7px}
.hud:not(.solo) .btns{gap:4px}
.hud .who.tight{max-width:102px}
.hud .btns{display:flex;gap:6px}
.icon-btn{width:44px;height:44px;flex:none;border:0;border-radius:50%;background:#fff;color:var(--ink);font-size:1.2rem;box-shadow:0 3px 0 rgba(0,0,0,.25);display:grid;place-items:center;padding:0}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
/* stage */
.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden;background:#10331b;background-image:repeating-linear-gradient(-30deg,rgba(255,255,255,.035) 0 22px,transparent 22px 44px)}
canvas#c{display:block;touch-action:none;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.toast{position:absolute;left:50%;top:14%;transform:translate(-50%,0) scale(.6);opacity:0;pointer-events:none;
  font:700 clamp(1.5rem,7vw,2.6rem)/1 var(--display);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 18px rgba(0,0,0,.3);
  padding:8px 18px;border-radius:20px;background:rgba(0,0,0,.35);max-width:92%;line-height:1.1;transition:transform .25s cubic-bezier(.2,1.4,.4,1),opacity .25s}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast.big{top:30%;font-size:clamp(2rem,10vw,3.6rem);background:linear-gradient(#ffe27a,var(--gold));color:#5a3500;text-shadow:0 2px 0 #fff}
.toast.hint{top:44%;font-size:clamp(1rem,4.6vw,1.35rem);max-width:84%;padding:8px 14px;line-height:1.2}  /* mid-hole: off the ball and the cup */
/* bottom bar */
.bar{display:flex;align-items:center;gap:10px;padding:8px max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:linear-gradient(#174526,#10331b);color:#fff}
.power{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.power label{font-size:.68rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;opacity:.8;display:flex;justify-content:space-between}
.power input{width:100%;height:44px;margin:0;-webkit-appearance:none;appearance:none;background:transparent}
.power input::-webkit-slider-runnable-track{height:14px;border-radius:7px;background:linear-gradient(90deg,#4ade80,#facc15 55%,#ef4444)}
.power input::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #1d2b1f;margin-top:-8px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.power input::-moz-range-track{height:14px;border-radius:7px;background:linear-gradient(90deg,#4ade80,#facc15 55%,#ef4444)}
.power input::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #1d2b1f}
.putt{flex:none;border:0;border-radius:22px;background:linear-gradient(#ff7b7b,var(--red));color:#fff;font:600 1.4rem var(--display);letter-spacing:.04em;padding:0 22px;min-height:56px;min-width:118px;box-shadow:0 6px 0 #8f1c26}
.putt:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #8f1c26}
.putt:disabled{opacity:.45;cursor:default}
/* landscape: side column */
@media (orientation:landscape) and (max-height:520px){
  .app{flex-direction:row}
  .hud{flex-direction:column;align-items:stretch;width:150px;min-height:0;padding:8px;gap:8px;order:0}
  .hud .holebox b{white-space:normal;line-height:1.05}
  .hud .who{max-width:none}
  .hud .btns{justify-content:center}
  .stage{order:1}
  .bar{order:2;flex-direction:column;width:150px;padding:10px;justify-content:center}
  .power{width:100%}
  .putt{width:100%;min-width:0}
  #title{gap:3px;padding:4px 12px}
  #title .panel{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;width:min(100%,720px);align-items:start;padding:8px 16px}
  #title .chip{min-height:44px}
  #title .names.many{gap:4px}
  #playersBox p{margin-bottom:2px!important}
  #title .tcol{display:flex;flex-direction:column;gap:6px;min-width:0}
  #title .panel .corner{top:auto;bottom:8px}  /* landscape: the mute button sits in the bottom-right corner beside the keys hint, so the player column starts at the top */
  #titleKeys{padding-right:50px;text-align:start}
  #titleDesc{font-size:.85rem}
  #titlePanel #titleDesc{padding-right:0}
  #titleKeys{font-size:.68rem;line-height:1.35}  /* longer languages: the keys hint stays inside the card */  /* landscape: the mute button is in the bottom corner, so the text can use the full column */
  .marquee b{font-size:2rem}
  .marquee small{font-size:.6rem;margin-top:2px}
  .ceremony{height:110px}
  #results .resultbig{font-size:2rem}
  /* results: two columns side by side (scores left, scorecard + buttons right); each column scrolls on its own if it must */
  #results .panel{flex-direction:row;align-items:stretch;gap:16px;width:min(100%,760px);padding:14px 16px}
  #results .tcol{display:flex;flex-direction:column;gap:8px;flex:1 1 0;min-width:0;min-height:0;overflow:auto}
  #results .resultbig{font-size:2.2rem}
  /* between-holes scorecard: title, totals, legend and the Next button on the left, the table on the right (so the button is never below the fold) */
  #card .panel{flex-direction:row;align-items:stretch;gap:16px;width:min(100%,760px);padding:14px 16px}
  #card .tcol{display:flex;flex-direction:column;gap:8px;flex:1 1 0;min-width:0;min-height:0;overflow:auto}
  #card .tcol.ctrl{justify-content:center}
  #card .scorecard{flex:0 1 auto;min-height:92px;max-height:none}
  /* hole intro: a wider card so a long gag wraps to fewer lines and the Tee off button stays on screen */
  #intro .panel{width:min(100%,600px);gap:10px;padding:14px 16px}
  #intro .panel h2{font-size:1.35rem}
}
/* overlays */
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(16,51,27,.55);backdrop-filter:blur(2px)}
.panel{background:var(--card);border-radius:26px;padding:18px 16px;width:min(100%,420px);max-height:100%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px;text-align:center;position:relative}
.panel>*,.tcol>*{flex:none}  /* a panel scrolls as a whole; nothing inside gets squashed (ball preview, scorecard) */
.tcol{display:contents}       /* title / results columns: flat in portrait (ordered below), two columns in landscape */
#titleDesc{order:1}#playersBox{order:2}#names{order:3}#playRow{order:4}#bestLine{order:5}#titleKeys{order:6}
#cardTitle{order:1}#cardLine{order:2}#cardTable{order:3}#cardLegend{order:4}#cardNext{order:5}
.panel .corner{position:absolute;top:10px;right:10px;z-index:1}  /* mute toggle on the title card, so sound can be turned off before the first putt */
/* results: the scorecard gives up height first so "Play again" always stays on screen; the table scrolls inside it */
#results .scorecard{flex:0 1 auto;min-height:96px;max-height:none}
.panel h1{font:700 clamp(2rem,10vw,3rem)/1 var(--display);margin:0;color:var(--grass2);letter-spacing:.01em}
.panel h1 small{display:block;font:900 .72rem var(--body);letter-spacing:.25em;text-transform:uppercase;color:var(--gold2);margin-top:4px}
.panel h2{font:600 1.5rem/1.1 var(--display);margin:0;color:var(--ink)}
.panel p{margin:0;font-size:.95rem;line-height:1.4;color:#3b4a3e}
.panel .gag{background:#eef7ee;border-radius:16px;padding:10px 12px;font-weight:800;color:#24502f}
.panel .coach{display:flex;gap:10px;align-items:center;text-align:start;background:#fff3cf;border-radius:16px;padding:8px 10px}
.panel .coach .face{width:44px;height:44px;border-radius:50%;background:#ffd9a0;display:grid;place-items:center;font-size:1.5rem;flex:none;border:3px solid #fff}
.panel .coach b{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#8a5b00}
.btn{border:0;border-radius:18px;background:linear-gradient(#5ec46f,var(--grass));color:#fff;font:600 1.35rem var(--display);padding:12px 22px;min-height:56px;box-shadow:0 5px 0 var(--grass2);letter-spacing:.02em}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--grass2)}
.btn.gold{background:linear-gradient(#ffe27a,var(--gold));color:#5a3500;box-shadow:0 5px 0 var(--gold2)}
.btn.gold:active{box-shadow:0 2px 0 var(--gold2)}
.btn.soft{background:#e9efe9;color:var(--ink);box-shadow:0 5px 0 #c5d0c5;font-size:1.05rem;min-height:48px}
.btn.soft:active{box-shadow:0 2px 0 #c5d0c5}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row .btn{flex:1;min-width:120px}
.chips{display:flex;gap:6px;justify-content:center}
.chip{flex:1;min-height:48px;border:3px solid #cfdacf;border-radius:14px;background:#fff;font:600 1.15rem var(--display);color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--grass);background:#e3f5e6;box-shadow:0 0 0 2px var(--grass) inset}
.names{display:flex;flex-direction:column;gap:6px}
.names.many{display:grid;grid-template-columns:1fr 1fr}
.names.many .namerow{gap:6px;padding:4px 6px}.names.many .namerow span{font-size:.9rem}  /* 3-4 players: a little more room for longer nicknames */  /* 3-4 players: two short columns so the title card still fits a phone */
.namerow{display:flex;align-items:center;gap:8px;background:#f2f6f2;border-radius:14px;padding:4px 8px;min-width:0}
.namerow i{width:22px;height:22px;border-radius:50%;flex:none;background:var(--c);border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.namerow span{flex:1;text-align:start;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.namerow button{min-height:44px;border:0;border-radius:12px;background:#fff;font-weight:900;padding:0 12px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.best{font-size:.85rem;font-weight:900;color:var(--gold2)}
.holeno{display:inline-block;background:var(--grass2);color:#fff;border-radius:999px;padding:4px 14px;font:600 .95rem var(--display);letter-spacing:.06em}
.ballpreview{width:70px;height:70px;border-radius:50%;margin:0 auto;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 60%);box-shadow:0 8px 14px rgba(0,0,0,.25),inset -6px -6px 0 rgba(0,0,0,.12);display:grid;place-items:center;font-size:1.6rem}
/* Scorecard = a scrolling box of hole rows + a Total footer that keeps its own room below the box (so it never covers a hole row) */
.scorecard{display:flex;flex-direction:column;max-height:50vh;border:2px solid #dde7dd;border-radius:14px;overflow:hidden;background:#fff}
.scorecard .scroller{overflow:auto;min-height:0;flex:1 1 auto;scrollbar-gutter:stable}
.scorecard .footwrap{flex:none;overflow:hidden;scrollbar-gutter:stable;border-top:2px solid #cfe6d3}
.scorecard table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:.8rem}
.scorecard th,.scorecard td{padding:3px 4px;text-align:center;border-bottom:1px solid #eef3ee;white-space:nowrap;overflow:hidden}
.scorecard th{background:#eef7ee;font-weight:900;position:sticky;top:0;z-index:1}
.scorecard th i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:3px;border:1px solid rgba(0,0,0,.25);background:var(--c)}
.scorecard th span{display:inline-block;max-width:96px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.scorecard td small{display:block;font-size:.56rem;line-height:1.1;font-weight:900;letter-spacing:.02em;opacity:.8;text-transform:uppercase}  /* the word under the number: ACE, BIRDIE, PAR, BOGEY... */
/* 3-4 players: tighter cells; the name sits under its ball dot and may wrap onto two lines instead of being cut short */
.scorecard.many table{font-size:.72rem}
.scorecard.many th,.scorecard.many td{padding:3px 2px}
.scorecard.many th{vertical-align:bottom;line-height:1.05}
.scorecard.many th i{display:block;margin:0 auto 2px}
.scorecard.many th span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;max-width:none;white-space:normal;overflow-wrap:anywhere;font-size:.58rem;letter-spacing:-.01em;text-overflow:clip}
.scorecard.many td small{font-size:.5rem;letter-spacing:0}
.scorecard.many tr:first-child th:nth-child(-n+2){font-size:.62rem;letter-spacing:-.02em;padding:3px 1px}  /* "Buraco", "Лунка"... fit the narrow Hole / Par columns */
.legend{font-size:.7rem;color:var(--muted);font-weight:800;margin:0}
.legend span{white-space:nowrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin:0 2px 0 6px}
.namerow button.swap{min-width:44px;padding:0;font-size:1.1rem}  /* 3-4 players: icon-only "change name" button so the nickname keeps its room */
.scorecard tr.now td{background:#fff6d6;box-shadow:inset 0 2px 0 var(--gold),inset 0 -2px 0 var(--gold)}  /* the hole just played: gold bars, and its score keeps its colour (rules below win) */
.scorecard tr.total td{font-weight:900;background:#e3f5e6;line-height:1.1;border-bottom:0}
.scorecard tr.total td.tl{font-size:.66rem;white-space:normal;overflow-wrap:anywhere;line-height:1.05;padding:3px 1px}  /* 'Gesamt', 'المجموع'... wrap or shrink inside the narrow first column */
.scorecard tr.total small{display:block;font-size:.66rem;color:var(--muted);text-transform:none;opacity:1;letter-spacing:0}
.scorecard tr td.under{color:#1d7a3a;font-weight:900;background:#cdeed3}
.scorecard tr td.over{color:#b8322e;font-weight:900;background:#fbe0de}
.scorecard tr td.hio{background:#ffe27a;font-weight:900}
.resultbig{font:700 clamp(2.4rem,12vw,3.6rem)/1 var(--display);color:var(--gold2);margin:0}
.keys{font-size:.74rem;color:var(--muted);font-weight:800;line-height:1.5}
/* Title show + gold jacket ceremony: a drawn scene fills the screen behind the card (opaque, so nothing greyed-out shows through) */
.art{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:0}
#title,#results{backdrop-filter:none}
#title{flex-direction:column;gap:10px;background:#8fcbff}
#results{background:#141a3a}
#title .panel,#results .panel,.marquee{position:relative;z-index:1}
#title .panel{flex:0 1 auto;min-height:0;max-height:none;overflow:auto;padding-top:14px}
.marquee{flex:none;margin:0;padding:4px 0 0;text-align:center;line-height:1;animation:marqueeSway 4.5s ease-in-out infinite alternate}
.marquee b{display:block;font:700 clamp(2.7rem,14vw,4.2rem)/1 var(--display);letter-spacing:.015em;transform:rotate(-2.5deg);
  color:#ffe27a;background:linear-gradient(#fff8d2 10%,#f6cf5a 50%,#d79a12 92%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  -webkit-text-stroke:1.5px #5a3500;filter:drop-shadow(0 4px 0 #5a3500) drop-shadow(0 10px 12px rgba(0,0,0,.4))}
.marquee small{display:block;font:900 .78rem/1 var(--body);letter-spacing:.17em;text-transform:uppercase;color:#fff;margin-top:12px;text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 10px rgba(0,0,0,.3)}
@keyframes marqueeSway{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-4px) rotate(1deg)}}
#titleDesc{font-size:.9rem;padding-right:48px}  /* portrait: the 44px mute button sits in the top-right corner, so the first lines stop short of it */
.ceremony{width:100%;height:140px;display:block;border-radius:16px;background:#1d2d5c}
.chant{font:600 1.05rem/1.2 var(--display);color:#8e1c3a;margin:0}
.chant small{display:inline-block;font:900 .62rem var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-inline-end:6px;vertical-align:1px}
/* short portrait phones (360x640): the ceremony picture, the gaps and the scorecard box give up height first so Play again stays on screen */
@media (max-width:370px){#resultsRow .btn,#playRow .btn{padding:12px 8px;font-size:1.15rem}}
@media (max-height:660px) and (orientation:portrait){#titleDesc{font-size:.8rem;line-height:1.3}#titleKeys{font-size:.66rem;line-height:1.3}#title .panel{gap:8px}}  /* short phones: long languages keep the title card on one screen */  /* 360 px phones: Play again / Menu stay on one line */
@media (max-height:720px) and (orientation:portrait){.ceremony{height:126px}#results .panel{gap:9px}}
@media (max-height:680px) and (orientation:portrait){
  .ceremony{height:112px}
  #results .panel{gap:8px;padding:14px 14px}
  #results .panel h2{font-size:1.3rem}
  #results .resultbig{font-size:2rem}
  #results .panel p{font-size:.88rem;line-height:1.3}
  #results .scorecard{min-height:84px}
  #results .legend{font-size:.66rem}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.marquee{animation:none}}
/* Right-to-left languages (he, ar): the menus, cards and HUD read right to left; the course itself, the power slider and the
   numbers stay left to right. The mute button keeps its corner, so the title text keeps its padding on that side. */
[dir=rtl] .stage,[dir=rtl] .power input,[dir=rtl] .marquee b{direction:ltr}
[dir=rtl] #titleKeys{padding-right:0;padding-left:0}
html[lang=ar] *{letter-spacing:0!important} /* letter spacing would pull the joined Arabic letters apart */
</style>

<div class="app" id="app">
  <header class="hud solo" id="hud">
    <div class="holebox"><b id="hudName">Happy Putt</b><small id="hudPar" data-i18n="tapStart"></small></div>
    <div class="who" id="hudWho" style="--c:#fff"><i></i><span id="hudWhoName"></span></div>
    <div class="strokes"><b><span class="stick" aria-hidden="true">🏒</span><span id="hudStrokes">0</span></b><small data-i18n="strokesHud"></small></div>
    <div class="btns">
      <button class="icon-btn" id="pauseBtn" data-i18n-aria="aPause">⏸</button>
      <button class="icon-btn" id="muteBtn">🔊</button>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="c" width="390" height="640" data-i18n-aria="holeAria"></canvas>
    <div class="toast" id="toast"></div>
  </div>
  <div class="bar">
    <div class="power"><label><span data-i18n="power"></span><span id="powerVal" dir="ltr">50%</span></label>
      <input type="range" id="power" min="5" max="100" value="50" data-i18n-aria="powerAria" dir="ltr"></div>
    <button class="putt" id="puttBtn" data-i18n="putt"></button>
  </div>
</div>

<!-- Title: a drawn country-club scene (canvas) behind a big marquee title and the start card -->
<div class="screen" id="title">
  <canvas class="art" id="titleArt" aria-hidden="true"></canvas>
  <h1 class="marquee"><b>Happy Putt</b><small data-i18n="sub"></small></h1>
  <div class="panel" id="titlePanel">
    <button class="icon-btn corner" id="titleMute">🔊</button>
    <div class="tcol">
      <p id="titleDesc" data-i18n="desc"></p>
      <div class="row" id="playRow"><button class="btn gold" id="play18" data-i18n="play18"></button><button class="btn" id="play9" data-i18n="quick9"></button></div>
      <div class="best" id="bestLine"></div>
    </div>
    <div class="tcol">
      <div id="playersBox">
        <p style="font-weight:900;margin-bottom:6px" data-i18n="howMany"></p>
        <div class="chips" id="chips">
          <button class="chip" data-n="1" aria-pressed="true">1</button><button class="chip" data-n="2">2</button><button class="chip" data-n="3">3</button><button class="chip" data-n="4">4</button>
        </div>
      </div>
      <div class="names" id="names"></div>
      <p class="keys" id="titleKeys" data-i18n="keys"></p>
    </div>
  </div>
</div>

<!-- Hole intro card -->
<div class="screen" id="intro" hidden>
  <div class="panel">
    <span class="holeno" id="introNo"></span>
    <h2 id="introName"></h2>
    <div class="gag" id="introGag"></div>
    <div class="coach"><div class="face">🧤</div><div><b data-i18n="coachSays"></b><span id="introTip"></span></div></div>
    <button class="btn gold" id="teeOff" data-i18n="teeOff"></button>
  </div>
</div>

<!-- Pass the phone -->
<div class="screen" id="pass" hidden>
  <div class="panel">
    <h2 data-i18n="passTitle"></h2>
    <div class="ballpreview" id="passBall" style="--c:#fff"></div>
    <p id="passLine"></p>
    <button class="btn" id="passGo" data-i18n="imReady"></button>
  </div>
</div>

<!-- Scorecard between holes -->
<div class="screen" id="card" hidden>
  <div class="panel">
    <div class="tcol ctrl">
      <h2 id="cardTitle" data-i18n="scorecard"></h2>
      <p id="cardLine"></p>
      <p class="legend" id="cardLegend"></p>
      <button class="btn gold" id="cardNext" data-i18n="nextHole"></button>
    </div>
    <div class="tcol"><div class="scorecard" id="cardTable"></div></div>
  </div>
</div>

<!-- Pause -->
<div class="screen" id="pauseScreen" hidden>
  <div class="panel">
    <h2 data-i18n="paused"></h2>
    <button class="btn" id="resumeBtn" data-i18n="keepPlaying"></button>
    <div class="row"><button class="btn soft" id="pauseMute">🔊</button><button class="btn soft" id="quitBtn" data-i18n="quitMenu"></button></div>
  </div>
</div>

<!-- Results: the gold jacket ceremony (podium canvas inside the card, a night stadium with fireworks behind it) -->
<div class="screen" id="results" hidden>
  <canvas class="art" id="resultsArt" aria-hidden="true"></canvas>
  <div class="panel">
    <div class="tcol">
      <h2 id="resultsTitle" data-i18n="roundOver"></h2>
      <canvas class="ceremony" id="ceremony" data-i18n-aria="cerAria"></canvas>
      <p class="resultbig" id="resultsBig"></p>
      <p id="resultsLine"></p>
      <p class="chant" id="chant"></p>
      <div class="best" id="resultsBest"></div>
    </div>
    <div class="tcol">
      <div class="scorecard" id="resultsTable"></div>
      <p class="legend" id="resultsLegend"></p>
      <div class="row" id="resultsRow"><button class="btn gold" id="again" data-i18n="again"></button><button class="btn soft" id="toMenu" data-i18n="menu"></button></div>
    </div>
  </div>
</div>

  ballR: 7, cupR: 12,             // ball and cup radius

  dragMax: 140,                   // drag length (px) for 100% power
  aimSpeed: 70,                   // keyboard aim speed (deg/s), accelerates while held
  chargeSweep: 1.3,               // seconds for the Space charge meter to sweep 0 -> 100%
  trail: 14,                      // ball trail length

      ["Plein élan", "Le drive monstre. Prends ton élan, touche le tapis PAF, et ta balle file tout le long du parcours, rebondit sur la bande du coin et atterrit près d’un panneau 400 MÈTRES ?!", "Tout droit dans le tapis. La bande du coin la renvoie vers le trou."],
      ["Rentre à la maison", "Parle à ta balle : « Rentre à la maison ! » Une petite maison est posée au fond d’une cuvette d’herbe, et la pente fait le reste. Tout ce qui arrive au bord roule jusqu’à la porte.", "Atteins juste le bord de la cuvette. Force 45, et dis-lui de rentrer."],
      ["Le mont Bunker", "Le drapeau est en haut d’une butte de sable. Trop doux, la balle redescend à tes pieds ; trop fort, elle passe par-dessus et tombe dans la mer de sable derrière.", "Force 59, tout droit. Pas un poil de plus !"],
      ["Le piège de Sir Crâneur", "Le club privé du rival. La statue dorée géante de Sir Crâneur bloque le milieu, deux portes dorées s’ouvrent et se ferment chacune leur tour, et son panneau t’envoie gaiement du mauvais côté.", "Le panneau raconte des bobards. Prends l’allée de GAUCHE quand sa porte est ouverte."],
      ["Le bus-tunnel", "Le bus de la tournée est garé en travers du green : tu tapes dans la soute à bagages ouverte et la balle ressort de l’autre côté, droit vers le drapeau. Tout le monde à bord !", "Vise une porte de la soute. Le bus envoie la balle vers le drapeau pour toi."],
      ["Finale de la tour", "Le grand dernier trou. La tour télé s’écroule sur le green dans un grand ÇA TOMBE !, la foule retient son souffle, et le seul chemin, c’est de rebondir sur la tour tombée. Mets-la dedans et gagne la veste dorée.", "Tout droit vers la tour tombée. Elle renvoie la balle pile vers le trou."]
    ]
  },

    holes: [
      ["Salida de hockey", "Sales desde el centro de la pista de hielo. Una gran alfombra roja ZAS lanza tu pelota por la banda hasta la portería. ¿Para qué golpear suave si puedes darle con todo?", "Un golpe suave basta. ¡La alfombra ZAS hace el resto!"],
      ["Solo un toquecito", "Todo el campo es un circulito de césped en un mar de arena, bajo un letrero enorme que dice SOLO UN TOQUECITO. Si le pegas fuerte, tendrás que escarbar. Toc, toc, toquecito.", "Apenas tócala. Con fuerza 30 basta."],
      ["Boca carcajada", "¡El payaso que se ríe! Un embudo lleva a una boca de payaso gigante que se abre y se cierra. Si te equivocas de momento, el payaso escupe tu pelota con un gran JA JA JA.", "Mira la boca. Golpea justo cuando se abra."],
      ["Molino ventarrón", "Todo campo tiene un molino. El nuestro tiene cuatro aspas grandes que barren el césped delante de la puertita, y el hoyo te espera entre los tulipanes de atrás.", "Golpea cuando un aspa acabe de pasar por el medio. ¡Apunta a la puerta!"],
      ["La entrada de la abuela", "¡Salva la casa de la abuela! El camión de mudanzas está estacionado enfrente mientras cargan cajas. Sube por la entrada y cruza el jardín antes de que arranque y toque la bocina.", "Ve cuando el camión esté a la derecha. ¡Derecho por la entrada!"],
      ["Pantano del caimán", "El estanque del caimán. Un gran caimán verde nada por el pantano y se COME cualquier pelota que esté en el puente de tablas. Si pierdes una pelota, te eructa una burbuja.", "Cruza el puente cuando el caimán esté lejos. ¡No te quedes ahí parado!"],
      ["Práctica loca", "El campo de práctica. La red grande es para los demás: tú pasas POR el agujero roto y subes la colina hasta el letrero de 200 metros, mientras pasa despacito el carrito enjaulado que recoge pelotas.", "Golpea fuerte y derecho por el agujero roto. ¡La colina frena mucho!"],
      ["Rizo loco", "Dale FUERZA: un rizo de neón completo en medio del hoyo. Si va muy lenta, la pelota vuelve rodando hacia ti con un silbido triste.", "Fuerza 70 y derecho hacia arriba. ¡Las pelotas lentas vuelven!"],
      ["El Open empapado", "El Open con agua por todas partes. Un muelle largo de madera va en línea recta de la salida a la bandera; los puentes de césped en zigzag son el camino largo y seguro. Los patos ya se están riendo.", "¿Valiente? Golpea derecho por el muelle. ¿Prudente? Zigzaguea por los puentes de césped."],
      ["El lugar feliz", "Cierra los ojos y ve a tu lugar feliz: nubes, música suave, una torre de panqueques, un unicornio y un hoyo que atrae tu pelota con cariño aunque estés nervioso.", "Respira. Rueda la pelota cerca del brillo y el hoyo hace el resto."],
      ["Salón de la chaqueta dorada", "La sala de trofeos: vitrinas, alfombra roja y la chaqueta dorada que brilla mientras gira en su perchero. La vitrina del campeón tapa el camino recto, así que rebota la pelota en la pared roja acolchada como un campeón.", "Rebota en la pared IZQUIERDA. Apunta arriba a la izquierda y golpea firme."],
      ["¡Cuidado, coche!", "¡Sale un coche de la nada! Un coche de caricatura sonriente pasa a toda velocidad por una carretera pintada en medio del campo. Cuela tu golpe en diagonal entre pasada y pasada.", "Apunta arriba a la izquierda, justo después de que pase el coche."],
      ["Con carrerilla", "El golpe monstruo. Toma carrerilla, pisa la alfombra ZAS y tu pelota vuela todo el campo, rebota en la banda de la esquina y cae junto a un letrero que dice ¿¡400 METROS?!", "Derecho hacia la alfombra. La banda de la esquina la manda hacia el hoyo."],
      ["Vete a casa", "Háblale a la pelota: «¡Vete a tu casa!». Una casita está en un hoyo de césped y la pendiente hace el resto. Todo lo que llega al borde rueda hasta la puerta.", "Solo llega al borde del hoyo. Fuerza 45 y dile que se vaya a casa."],
      ["Monte Búnker", "La bandera está en la cima de un montículo de arena. Muy suave y la pelota vuelve rodando a tus pies; muy fuerte y pasa por encima y cae al mar de arena de atrás.", "Fuerza 59 derecho hacia arriba. ¡Ni un pelo más!"],
      ["La trampa de Sir Presumido", "El club privado del rival. La estatua dorada gigante de Sir Presumido tapa el medio, dos puertas doradas se abren y se cierran por turnos, y su letrero te manda alegremente por el camino equivocado.", "El letrero miente. Ve por el carril IZQUIERDO cuando su puerta esté abierta."],
      ["Túnel autobús", "El autobús de la gira está estacionado sobre el green, así que golpeas hacia el maletero abierto y la pelota sale por el otro lado apuntando a la bandera. ¡Todos a bordo!", "Apunta a una puerta del maletero. El autobús apunta la salida a la bandera por ti."],
      ["Gran final de la torre", "El gran hoyo final. La torre de TV cae sobre el green con un ¡SE CAE!, el público aguanta la respiración y la única forma de entrar es rebotar en el metal caído. Mete la pelota y gana la chaqueta dorada.", "Derecho hacia la torre caída. Rebota la pelota justo hacia el hoyo."]
    ]
  },

    holes: [
      ["Tacada de hóquei", "Você começa no meio da pista de gelo. Um tapete vermelho PÁ lança sua bola pela borda direto para o gol. Pra que tacada fraquinha se dá pra mandar com tudo?", "Uma tacada leve já basta. O tapete PÁ faz o resto!"],
      ["Só um toquinho", "O campo inteiro é um círculo pequenininho de grama num mar de areia, embaixo de uma placa enorme escrito SÓ UM TOQUINHO. Bata forte e você vai cavar. Toc, toc, toquinho.", "Mal encoste. Força 30 já basta."],
      ["Boca gargalhada", "O palhaço que gargalha! Um funil leva até uma boca de palhaço gigante que abre e fecha. Erre a hora e o palhaço cospe sua bola de volta com um grande HA HA HA.", "Olhe a boca. Taque na hora em que ela abrir."],
      ["Moinho ventania", "Todo campo tem um moinho. O nosso tem quatro pás enormes que varrem a grama na frente da portinha, e o buraco espera entre as tulipas lá atrás.", "Taque quando uma pá acabou de passar pelo meio. Mire na porta!"],
      ["A entrada da vovó", "Salve a casa da vovó! O caminhão de mudança está parado na frente enquanto carregam as caixas. Suba a entrada e atravesse o quintal antes que ele saia buzinando.", "Vá quando o caminhão estiver parado à direita. Reto pela entrada!"],
      ["Brejo do jacaré", "A lagoa do jacaré. Um jacarezão verde nada pelo brejo e dá um NHAC em qualquer bola na ponte de tábua. Se você perder a bola, ele arrota uma bolha pra você.", "Atravesse a tábua quando o jacaré estiver longe. Não fique parado!"],
      ["Treino maluco", "O campo de treino. A rede grande é pros outros: você vai passar PELO buraco rasgado e subir o morro até a placa de 200 metros, enquanto o carrinho com grade que recolhe bolas passa devagarinho.", "Taque forte e reto pelo buraco rasgado. O morro come a velocidade!"],
      ["Putt-looping", "Capricha na FORÇA: um looping de neon inteirinho no meio do buraco. Devagar demais e a bola volta rolando até você com um assobio triste.", "Força 70, reto pra cima. Bola lenta volta!"],
      ["O Open encharcado", "O Open com água pra todo lado. Um píer comprido de madeira vai reto da saída até a bandeira; as pontes de grama em zigue-zague são o caminho longo e seguro. Os patos já estão rindo.", "Corajoso? Taque reto pelo píer. Cuidadoso? Vá em zigue-zague pelas pontes de grama."],
      ["Meu lugar feliz", "Feche os olhos e vá para o seu lugar feliz: nuvens, música calminha, uma torre de panquecas, um unicórnio e um buraco que puxa sua bola de levinho, mesmo se você estiver nervoso.", "Respire. Role a bola perto do brilho e o buraco faz o resto."],
      ["Salão da jaqueta dourada", "A sala dos troféus: vitrines, tapete vermelho e a jaqueta dourada brilhando enquanto gira no cabide. A vitrine do campeão bloqueia o caminho reto, então tabele na parede vermelha fofinha como um campeão.", "Tabele na parede da ESQUERDA. Mire pra cima e pra esquerda, taque firme."],
      ["Cuidado, carro!", "Um carro aparece do nada! Um carro de desenho sorridente passa voando por uma rua pintada no meio do campo. Passe sua tacada na diagonal entre uma passada e outra.", "Mire pra cima e pra esquerda logo depois que o carro passar."],
      ["Pegando embalo", "A tacada monstro. Pegue embalo, passe pelo tapete PÁ, e sua bola voa o campo inteiro, bate na borda do canto e para perto de uma placa escrito 400 METROS?!", "Reto no tapete. A borda do canto manda a bola pro buraco."],
      ["Vai pra casa", "Fale com a bola: “Vai pra casa!” Uma casinha fica no fundo de uma tigela de grama e a descida faz o resto. Tudo que chega na borda rola até a porta.", "É só chegar na borda da tigela. Força 45 e mande ela pra casa."],
      ["Montanha de areia", "A bandeira fica no topo de um morro de areia. Fraco demais e a bola rola de volta até seus pés; forte demais e ela passa por cima e cai no mar de areia lá atrás.", "Força 59, reto pra cima. Nem um pouquinho a mais!"],
      ["A armadilha do Sir Convencido", "O clube particular do rival. A estátua dourada gigante do Sir Convencido bloqueia o meio, dois portões dourados abrem e fecham um de cada vez, e a placa dele aponta, toda alegre, para o lado errado.", "A placa está mentindo. Vá pela pista da ESQUERDA quando o portão dela abrir."],
      ["Túnel do ônibus", "O ônibus da turnê está parado em cima do green, então você taca no bagageiro aberto e a bola sai do outro lado mirando a bandeira. Todos a bordo!", "Mire numa porta do bagageiro. O ônibus mira a saída na bandeira pra você."],
      ["Final da torre", "O grande último buraco. A torre de TV cai sobre o green com um LÁ VAI!, a multidão prende a respiração e o único jeito de acertar é tabelar no ferro caído. Acerte e ganhe a jaqueta dourada.", "Reto na torre caída. Ela manda a bola direto pro buraco."]
    ]
  },

    holes: [
      ["Schlagschuss-Start", "Du schlägst vom Anspielkreis ab. Ein großes rotes ZACK-Feld schießt deinen Ball an der Bande entlang ins Tor. Warum putten, wenn man auch draufhauen kann?", "Ein sanfter Schlag reicht. Das ZACK-Feld macht den Rest!"],
      ["Nur antippen", "Die ganze Bahn ist ein winziger Grasfleck in einem Meer aus Sand, unter einem riesigen Schild: NUR ANTIPPEN. Schlägst du fest, musst du buddeln. Tipp, tipp, tippi-tapp.", "Kaum berühren. Kraft 30 reicht völlig."],
      ["Kichermund", "Der lachende Clown! Ein Trichter führt zu einem riesigen Clownsmund, der auf- und zugeht. Triffst du den falschen Moment, spuckt der Clown deinen Ball mit einem lauten HA HA HA wieder aus.", "Beobachte den Mund. Schlag genau, wenn er aufgeht."],
      ["Windmühlen-Wirbel", "Jeder Platz hat eine Windmühle. Unsere hat vier große Flügel, die vor der kleinen Tür übers Gras fegen, und das Loch wartet hinten in den Tulpen.", "Schlag, wenn ein Flügel gerade an der Mitte vorbei ist. Ziel auf die Tür!"],
      ["Omas Einfahrt", "Rette Omas Haus! Der Umzugswagen parkt vor der Tür, während die Möbelpacker Kisten tragen. Putte die Einfahrt hoch und quer über den Garten, bevor er hupend losfährt.", "Los, wenn der Wagen rechts parkt. Gerade die Einfahrt hoch!"],
      ["Kroko-Sumpf", "Der Alligatorteich. Ein großer grüner Alligator schwimmt durch den Sumpf und SCHNAPPT jeden Ball auf der Holzbrücke. Verlierst du einen Ball, rülpst er dir eine Blase zu.", "Geh über die Brücke, wenn der Alligator weit weg ist. Nicht trödeln!"],
      ["Übungsplatz-Chaos", "Die Driving Range. Das große Netz ist für alle anderen: Du schießt DURCH das Loch im Netz, den Hügel hinauf bis zum 200-Meter-Schild, während der vergitterte Ballsammelwagen vorbeituckert.", "Schlag fest und gerade durch das Loch im Netz. Der Hügel bremst!"],
      ["Looping-Putt", "Gib ordentlich SCHWUNG: ein ganzer Neon-Looping mitten auf der Bahn. Zu langsam, und der Ball rollt mit einem traurigen Pfeifen zu dir zurück.", "Kraft 70 und gerade nach oben. Langsame Bälle kommen zurück!"],
      ["Die Pitschnass-Open", "Die Open mit Wasser überall. Ein langer Holzsteg führt schnurgerade vom Abschlag zur Fahne; die Grasbrücken im Zickzack sind der lange, sichere Weg. Die Enten lachen schon.", "Mutig? Schlag gerade über den Holzsteg. Vorsichtig? Im Zickzack über die Grasbrücken."],
      ["Mein Glücksort", "Mach die Augen zu und geh an deinen Glücksort: Wolken, leise Musik, ein Pfannkuchenturm, ein Einhorn und ein Loch, das deinen Ball sanft heimholt, egal wie aufgeregt du bist.", "Atme durch. Roll den Ball irgendwo in die Nähe des Leuchtens, das Loch macht den Rest."],
      ["Halle der Goldjacke", "Der Pokalraum: Glasvitrinen, roter Teppich und die glitzernde Goldjacke, die sich auf ihrem Ständer dreht. Die Vitrine des Champions versperrt den geraden Weg, also spiel über die weiche rote Wand, wie ein echter Champ.", "Über die LINKE Wand spielen. Nach links oben zielen, kräftig schlagen."],
      ["Achtung, Auto!", "Plötzlich kommt ein Auto! Ein grinsendes Cartoon-Auto saust über eine Straße, die quer über die Bahn gemalt ist. Schlüpf mit deinem Putt schräg zwischen zwei Durchfahrten hindurch.", "Gleich nachdem das Auto vorbei ist, nach links oben über die Straße zielen."],
      ["Mit Anlauf", "Der Monster-Abschlag. Nimm Anlauf, triff das ZACK-Feld, und dein Ball fliegt die ganze Bahn entlang, prallt an der Eckbande ab und landet neben einem Schild: 400 METER?!", "Gerade nach oben ins Feld. Die Eckbande lenkt ihn zum Loch."],
      ["Ab nach Hause", "Sprich mit dem Ball: „Ab nach Hause!“ Ein kleines Häuschen steht in einer Grasmulde, und die Schräge macht den Rest. Alles, was den Rand erreicht, rollt bis zur Haustür.", "Erreich einfach den Rand der Mulde. Kraft 45 und schick ihn nach Hause."],
      ["Bunkerberg", "Die Fahne steht oben auf einem Sandhügel. Zu sanft, und der Ball rollt zu deinen Füßen zurück; zu fest, und er kullert drüber in das Sandmeer dahinter.", "Kraft 59, gerade nach oben. Kein bisschen mehr!"],
      ["Sir Angebers Falle", "Der Privatklub des Rivalen. Die riesige goldene Statue von Sir Angeber versperrt die Mitte, zwei goldene Tore klappern abwechselnd auf und zu, und sein Schild schickt dich fröhlich in die falsche Richtung.", "Das Schild schwindelt. Nimm die LINKE Bahn, wenn ihr Tor offen ist."],
      ["Tourbus-Tunnel", "Der Tourbus parkt quer auf dem Grün, also puttest du in seine offene Gepäckklappe, und der Ball kommt auf der anderen Seite Richtung Fahne wieder heraus. Alle einsteigen!", "Ziel auf eine Gepäckklappe. Der Bus richtet den Ausgang für dich auf die Fahne."],
      ["Turm-Finale", "Das große letzte Loch. Der Fernsehturm kippt mit einem TURM FÄLLT! über das Grün, die Menge hält den Atem an, und rein geht es nur über den umgefallenen Stahl. Lochst du ein, gewinnst du die goldene Jacke.", "Gerade nach oben in den umgefallenen Turm. Er lenkt den Ball direkt zum Loch."]
    ]
  },

    holes: [
      ["Tiro da hockey", "Parti dal centro della pista di ghiaccio. Un grande tappeto rosso SBAM spara la pallina lungo la balaustra fino in porta. Perché fare un putt quando puoi fare un tiro da hockey?", "Basta un colpo leggero. Il tappeto SBAM fa il resto!"],
      ["Solo un colpetto", "Tutto il percorso è un cerchietto d’erba in un mare di sabbia, sotto un cartello enorme che dice SOLO UN COLPETTO. Se tiri forte, finisci a scavare. Tic, tic, colpettino.", "Sfiorala appena. Forza 30 basta e avanza."],
      ["Bocca ridarella", "Il clown che ride! Un imbuto porta a una gigantesca bocca da clown che si apre e si chiude. Se sbagli il momento, il clown ti risputa la pallina con un grande AH AH AH.", "Guarda la bocca. Tira appena si apre."],
      ["Mulino vortice", "Ogni percorso ha un mulino. Il nostro ha quattro grandi pale che spazzano l’erba davanti alla porticina, e la buca ti aspetta tra i tulipani dietro.", "Tira quando una pala è appena passata in mezzo. Mira alla porta!"],
      ["Il vialetto della nonna", "Salva la casa della nonna! Il camion dei traslochi è parcheggiato davanti mentre portano via gli scatoloni. Sali per il vialetto e attraversa il giardino prima che parta suonando il clacson.", "Vai quando il camion è parcheggiato a destra. Dritto su per il vialetto!"],
      ["Palude del coccodrillo", "Lo stagno dell’alligatore. Un grosso alligatore verde nuota nella palude e si MANGIA ogni pallina che trova sul ponte di assi. Se perdi una pallina, ti fa un rutto a bolla.", "Attraversa il ponte quando l’alligatore è lontano. Non perdere tempo!"],
      ["Campo pratica", "Il campo pratica. La grande rete è per tutti gli altri: tu passi ATTRAVERSO il buco strappato, su per la collina fino al cartello dei 200 metri, mentre passa piano piano il carrello con la gabbia che raccoglie le palline.", "Tira forte e dritto nel buco della rete. La collina mangia velocità!"],
      ["Putt col giro", "Dacci dentro con la SPINTA: un giro della morte al neon in mezzo alla buca. Troppo piano e la pallina torna giù verso di te con un fischio triste.", "Forza 70, dritto in su. Le palline lente tornano indietro!"],
      ["L’Open fradicio", "L’Open con l’acqua dappertutto. Un lungo pontile di legno va dritto dalla partenza alla bandierina; i ponti d’erba a zig-zag sono la strada lunga e sicura. Le papere ridono già.", "Coraggioso? Tira dritto lungo il pontile. Prudente? Zig-zag sui ponti d’erba."],
      ["Il posto felice", "Chiudi gli occhi e vai nel tuo posto felice: nuvole, musica dolce, una torre di pancake, un unicorno e una buca che attira piano piano la pallina, anche se sei agitato.", "Respira. Fai rotolare la pallina vicino al bagliore e la buca fa il resto."],
      ["Sala della giacca d’oro", "La sala dei trofei: vetrine, tappeto rosso e la giacca d’oro che brilla girando sul suo appendiabiti. La vetrina del campione blocca la strada dritta, quindi fai rimbalzare la pallina sul morbido muro rosso, da campione.", "Rimbalza sul muro di SINISTRA. Mira in alto a sinistra e tira deciso."],
      ["Attenti all’auto!", "Un’auto spunta dal nulla! Un’auto dei cartoni tutta sorridente sfreccia su una strada dipinta in mezzo al percorso. Infila il tuo tiro in diagonale tra un passaggio e l’altro.", "Mira in alto a sinistra oltre la strada, subito dopo che l’auto è passata."],
      ["Con la rincorsa", "Il tiro mostruoso. Prendi la rincorsa, colpisci il tappeto SBAM e la pallina vola per tutto il percorso, rimbalza sulla sponda dell’angolo e atterra vicino a un cartello che dice 400 METRI?!", "Dritto in su nel tappeto. La sponda dell’angolo la manda verso la buca."],
      ["Vai a casa", "Parla alla pallina: «Vai a casa!» Una casetta sta in una conca d’erba e la discesa fa il resto. Tutto quello che arriva al bordo rotola fino alla porta.", "Arriva solo al bordo della conca. Forza 45 e dille di andare a casa."],
      ["Monte Bunker", "La bandierina è in cima a una montagnola di sabbia. Troppo piano e la pallina ti torna ai piedi, troppo forte e scavalca la cima finendo nel mare di sabbia dietro.", "Forza 59, dritto in su. Neanche un pelo di più!"],
      ["La trappola di Sir Spaccone", "Il club privato del rivale. La gigantesca statua d’oro di Sir Spaccone blocca il centro, due cancelli d’oro si aprono e si chiudono a turno, e il suo cartello ti manda allegramente dalla parte sbagliata.", "Il cartello racconta bugie. Prendi la corsia di SINISTRA quando il suo cancello è aperto."],
      ["Tunnel del pullman", "Il pullman del tour è parcheggiato di traverso sul green, quindi tiri nel bagagliaio aperto e la pallina esce dall’altra parte puntata verso la bandierina. Tutti a bordo!", "Mira a uno sportello del bagagliaio. Il pullman punta l’uscita verso la bandierina per te."],
      ["Finale della torre", "La grande ultima buca. La torre della TV crolla sul green con un CROLLA!, il pubblico trattiene il fiato e l’unico modo per entrare è rimbalzare sul metallo caduto. Mettila in buca e vinci la giacca d’oro.", "Dritto in su verso la torre caduta. Fa rimbalzare la pallina dritta in buca."]
    ]
  },

    holes: [
      ["Slapshot-start", "Je slaat af vanaf de middenstip op het ijs. Een groot rood BAM-kussen schiet je bal langs de boarding het doel in. Waarom putten als je ook kunt slaan?", "Een zacht slagje is genoeg. Het BAM-kussen doet de rest!"],
      ["Gewoon een tikje", "De hele baan is één piepklein rondje gras in een zee van zand, onder een enorm bord: GEEF EEN TIKJE. Sla je hard, dan sta je te graven. Tik, tik, tikkertje.", "Raak hem amper aan. Kracht 30 is genoeg."],
      ["Giechelmond", "De lachende clown! Een trechter leidt naar een reuzenclownsmond die open en dicht gaat. Kies je het verkeerde moment, dan spuugt de clown je bal terug met een luid HA HA HA.", "Let op de mond. Sla zodra hij opengaat."],
      ["Wervelmolen", "Elke baan heeft een windmolen. De onze heeft vier grote wieken die voor het deurtje over het gras zwiepen, en de hole wacht achter in de tulpen.", "Sla als een wiek net het midden voorbij is. Mik op het deurtje!"],
      ["Oma’s oprit", "Red het huis van oma! De verhuiswagen staat voor de deur terwijl de verhuizers dozen sjouwen. Put de oprit op en over het gras voordat hij toeterend wegrijdt.", "Ga als de wagen rechts geparkeerd staat. Recht de oprit op!"],
      ["Krokomoeras", "De alligatorvijver. Een grote groene alligator zwemt door het moeras en HAPT elke bal op de plankenbrug weg. Ben je een bal kwijt, dan laat hij een boer met een bel.", "Steek de plank over als de alligator ver weg is. Niet treuzelen!"],
      ["Het oefenveld", "De driving range. Het grote net is voor de rest: jij gaat DOOR het gescheurde gat, de heuvel op tot het bord van 200 meter, terwijl het ballenkarretje met kooi voorbij pruttelt.", "Sla hard en recht door het gat in het net. De heuvel remt flink!"],
      ["Looping-putt", "Geef hem VAART: een hele neonlooping midden op de hole. Te langzaam en de bal rolt met een zielig fluitje terug naar jou.", "Kracht 70 en recht omhoog. Trage ballen komen terug!"],
      ["De kletsnatte Open", "De Open met overal water. Een lange houten steiger loopt kaarsrecht van de afslag naar de vlag; de grasbruggetjes in zigzag zijn de lange, veilige weg. De eenden lachen al.", "Dapper? Sla recht over de steiger. Voorzichtig? Zigzag over de grasbruggetjes."],
      ["Het blije plekje", "Doe je ogen dicht en ga naar je blije plekje: wolken, zachte muziek, een pannenkoekentoren, een eenhoorn en een hole die je bal zachtjes naar huis trekt, hoe zenuwachtig je ook bent.", "Adem in. Rol de bal ergens bij de gloed en de hole doet de rest."],
      ["Hal van het gouden jasje", "De prijzenkamer: vitrines, rode loper en het glinsterende gouden jasje dat ronddraait aan zijn rek. De vitrine van de kampioen blokkeert de rechte lijn, dus kaats hem via de zachte rode muur, als een echte kampioen.", "Kaats via de LINKERmuur. Mik naar linksboven en sla stevig."],
      ["Pas op, auto!", "Uit het niets komt er een auto! Een grijnzende tekenfilmauto zoeft over een weg die dwars over de baan is geschilderd. Glip met je putt schuin tussen twee ritjes door.", "Mik naar linksboven over de weg, net nadat de auto voorbij is."],
      ["Met aanloop", "De monsterslag. Neem een aanloop, raak het BAM-kussen en je bal vliegt de hele baan over, kaatst tegen de hoekboarding en landt bij een bord: 400 METER?!", "Recht omhoog het kussen in. De hoekboarding stuurt hem naar de hole."],
      ["Ga naar huis", "Praat tegen de bal: ‘Ga naar huis!’ Een klein huisje staat in een graskom en de helling doet de rest. Alles wat de rand haalt, rolt naar de voordeur.", "Haal gewoon de rand van de kom. Kracht 45 en zeg dat hij naar huis moet."],
      ["Bunkerberg", "De vlag staat boven op een zandheuvel. Te zacht en de bal rolt terug naar je voeten, te hard en hij tuimelt over de top in de zandzee erachter.", "Kracht 59, recht omhoog. Geen haar meer!"],
      ["De val van Sir Opschepper", "De privéclub van de rivaal. Het reusachtige gouden beeld van Sir Opschepper blokkeert het midden, twee gouden hekken klapperen om de beurt open en dicht, en zijn bord stuurt je vrolijk de verkeerde kant op.", "Het bord jokt. Neem de LINKERbaan als het hek daar open is."],
      ["Toerbustunnel", "De toerbus staat dwars op de green geparkeerd, dus je put in zijn open bagageruim en de bal komt er aan de andere kant uit, recht op de vlag af. Instappen!", "Mik op een bagageluik. De bus richt de uitgang voor je op de vlag."],
      ["Torenfinale", "De grote laatste hole. De tv-toren valt met een DAAR GAAT IE! over de green, het publiek houdt de adem in, en de enige weg erin is via het omgevallen staal. Raak hem en win het gouden jasje.", "Recht omhoog de omgevallen toren in. Die kaatst de bal recht naar de hole."]
    ]
  },

    holes: [
      ["Хоккейный щелчок", "Ты бьёшь с центра хоккейной площадки. Большой красный коврик БАХ разгоняет мяч вдоль бортов прямо в ворота. Зачем катить мяч, если можно щёлкнуть?", "Хватит лёгкого удара. Остальное сделает коврик БАХ!"],
      ["Легонько-легонько", "Вся лунка — крошечный кружок травы в море песка, под огромной вывеской ЛЕГОНЬКО-ЛЕГОНЬКО. Ударишь сильно — будешь копать. Тук-тук, потихоньку.", "Едва коснись. Силы 30 хватит."],
      ["Рот-хохотун", "Хохочущий клоун! Воронка ведёт к огромному рту клоуна, который открывается и закрывается. Не угадаешь момент — клоун выплюнет мяч с громким ХА-ХА-ХА.", "Следи за ртом. Бей, как только он откроется."],
      ["Большая мельница", "На каждом поле есть мельница. У нашей четыре больших крыла, которые метут траву перед маленькой дверцей, а лунка ждёт за ней в тюльпанах.", "Бей, когда крыло только что прошло середину. Целься в дверцу!"],
      ["Бабушкин двор", "Спаси бабушкин дом! Грузовик для переезда стоит у ворот, пока грузчики носят коробки. Прокати мяч по дорожке через двор, пока он не уехал с гудком.", "Бей, когда грузовик стоит справа. Прямо по дорожке!"],
      ["Болото аллигатора", "Пруд с аллигатором. Большой зелёный аллигатор плавает по болоту и ХРУМКАЕТ любой мяч на дощатом мостике. Потеряешь мяч — он пустит в тебя пузырь.", "Переходи мостик, когда аллигатор далеко. Не зевай!"],
      ["Тренировочное поле", "Тренировочное поле. Большая сетка — для всех остальных, а ты бьёшь СКВОЗЬ дыру в ней, вверх по холму до таблички «200 метров», пока мимо тарахтит машинка-мячесборщик в клетке.", "Бей сильно и прямо в дыру в сетке. Холм гасит скорость!"],
      ["Мёртвая петля", "Наддай РАЗГОНА: посреди лунки — огромная неоновая мёртвая петля. Слишком медленно — и мяч скатится обратно к тебе с грустным свистом.", "Сила 70 и прямо вверх. Медленные мячи выплёвывает обратно!"],
      ["Мокрый турнир", "Турнир, где вода повсюду. Длинный деревянный пирс идёт прямо от старта до флажка, а травяные мостики зигзагом — долгий, но безопасный путь. Утки уже смеются.", "Смелый? Бей прямо по пирсу. Осторожный? Иди зигзагом по мостикам."],
      ["Счастливое местечко", "Закрой глаза и отправляйся в своё счастливое местечко: облака, тихая музыка, башня из блинчиков, единорог и лунка, которая мягко тянет мяч к себе, даже если ты волнуешься.", "Вдохни. Прокати мяч поближе к сиянию — лунка сделает остальное."],
      ["Зал золотого пиджака", "Зал трофеев: стеклянные витрины, красная дорожка и сверкающий золотой пиджак, который крутится на вешалке. Прямой путь закрывает витрина чемпиона, так что отбей мяч от мягкой красной стены, как настоящий чемпион.", "Отбей от ЛЕВОЙ стены. Целься вверх и влево, бей уверенно."],
      ["Осторожно, машина!", "Откуда ни возьмись — машина! Улыбчивая мультяшная машинка мчится по дороге, нарисованной прямо поперёк поля. Проскочи по диагонали между её проездами.", "Целься вверх и влево через дорогу сразу после того, как проедет машина."],
      ["С разбегу", "Чудовищный удар. Разбегись, попади на коврик БАХ — и мяч пролетит всё поле, отскочит от углового борта и остановится у таблички «400 МЕТРОВ?!»", "Прямо вверх в коврик. Угловой борт повернёт мяч к лунке."],
      ["Иди домой", "Поговори с мячом: «Иди домой!» Маленький домик стоит в травяной чаше, и склон сделает всё сам. Всё, что докатится до края, скатится прямо к двери.", "Просто докати до края чаши. Сила 45 — и скажи ему идти домой."],
      ["Песчаная гора", "Флажок стоит на вершине песчаного холма. Слабо — мяч скатится обратно к ногам, сильно — перелетит через верх в песчаное море позади.", "Сила 59 прямо вверх. Ни капельки больше!"],
      ["Ловушка сэра Задаваки", "Частный клуб соперника. Огромная золотая статуя сэра Задаваки загораживает середину, два золотых шлагбаума по очереди открываются и закрываются, а его табличка весело показывает не туда.", "Табличка врёт. Иди по ЛЕВОЙ дорожке, пока её ворота открыты."],
      ["Тоннель-автобус", "Гастрольный автобус встал прямо поперёк грина, так что бей в открытый багажный отсек — мяч выскочит с другой стороны прямо на флажок. Все на борт!", "Целься в дверцу багажника. Автобус сам направит выход на флажок."],
      ["Финал у башни", "Большая последняя лунка. Телебашня с криком ПАДАЕТ! валится на грин, трибуны затаили дыхание, и попасть можно только отскоком от упавшей стали. Забей — и золотой пиджак твой.", "Прямо вверх в упавшую башню. Она отобьёт мяч прямо в лунку."]
    ]

    holes: [
      ["ホッケーショット", "スタートはアイスリンクのまんなか。大きな赤いバシッパッドが、ボールをフェンスにそってゴールまでぶっとばします。パットよりスラップショットだ！", "やさしくうつだけでじゅうぶん。あとはバシッパッドにおまかせ！"],
      ["ちょんとおすだけ", "コースは、すなのうみにうかぶちいさなまるいしばふだけ。上には「ちょんとおすだけ」の大きなかんばん。つよくうつと、すなほりになっちゃうよ。ちょん、ちょん、ちょん。", "そっとさわるだけ。パワー30でじゅうぶん。"],
      ["げらげらピエロ", "わらうピエロ！ろうとの先に、あいたりしまったりする大きなピエロのくち。タイミングをまちがえると、ピエロが「ハッハッハ」とボールをはきだします。", "くちをよく見て。あいたしゅんかんにうとう。"],
      ["ぐるぐるふうしゃ", "コースにはやっぱりふうしゃ。4まいの大きなはねが、ちいさなドアの前のしばふをはらいます。カップはそのうしろのチューリップの中。", "はねがまんなかをとおりすぎたらうとう。ドアをねらえ！"],
      ["おばあちゃんちの前", "おばあちゃんのいえをまもれ！ひっこしトラックがいえの前にとまって、にもつをはこんでいます。トラックがプップーとうごきだす前に、にわをとおってパットしよう。", "トラックが右にとまっているときがチャンス。まっすぐすすめ！"],
      ["ワニのぬま", "ワニのいるいけ。大きなみどりのワニがぬまをおよいで、いたのはしの上のボールをパクッ！ボールをなくすと、ワニがあわでげっぷします。", "ワニがとおくにいるうちに、はしをわたろう。ぐずぐずしないで！"],
      ["うちっぱなし", "うちっぱなしのれんしゅうじょう。大きなネットはほかの人よう。きみはネットのやぶれたあなをくぐって、おかをのぼり200メートルのかんばんへ。そばをボールひろいカートがとことこはしります。", "つよく、まっすぐ、やぶれたあなへ。おかでスピードがおちるよ！"],
      ["くるりんループ", "いきおいをつけて！ホールのまんなかに、ネオンの大きなループ。おそすぎると、ボールはしょんぼりした口ぶえといっしょにもどってきます。", "パワー70でまっすぐ上へ。おそいボールははじかれるよ！"],
      ["びしょぬれオープン", "どこもかしこもみずのオープン。ながい木のさんばしが、スタートからはたまでまっすぐつづいています。くさのはしをジグザグにいけば、とおいけれどあんぜん。アヒルたちはもうわらっています。", "ゆうきがあるなら、さんばしをまっすぐ。しんちょうなら、くさのはしをジグザグに。"],
      ["しあわせのばしょ", "目をとじて、しあわせのばしょへ。くも、やさしいおんがく、パンケーキのタワー、ユニコーン。どんなにドキドキしても、カップがボールをやさしくよせてくれます。", "しんこきゅう。ひかりのちかくにころがせば、あとはカップにおまかせ。"],
      ["金のジャケットのへや", "トロフィールーム。ガラスのケース、赤いじゅうたん、くるくるまわるキラキラの金のジャケット。まっすぐのみちはチャンピオンのケースでふさがれているから、やわらかい赤いかべにあててはねかえそう。", "ひだりのかべにあてよう。左上をねらって、しっかりうとう。"],
      ["くるまにきをつけて", "いきなりくるまがやってきた！にこにこのくるまが、コースにかかれたどうろをびゅーんとはしります。くるまがとおるあいだをぬって、ななめにパットしよう。", "くるまがとおりすぎたらすぐ、左上にむかってどうろをこえよう。"],
      ["じょそうでドーン", "モンスターショット！じょそうをつけてバシッパッドにのると、ボールはコースのはしまでとんでいき、すみのフェンスではねて「400メートル?!」のかんばんのそばへ。", "まっすぐ上へパッドに。すみのフェンスがカップのほうへまげてくれるよ。"],
      ["おうちへおかえり", "ボールにはなしかけよう。「おうちへおかえり！」しばふのくぼみにちいさないえがあって、さかがあとはやってくれます。ふちまでとどけば、ドアまでころころ。", "くぼみのふちまでとどけばOK。パワー45で「おかえり」といってあげよう。"],
      ["すなやまのてっぺん", "はたはすなの山のてっぺん。よわいと足もとまでころがってもどり、つよいと山をこえてうしろのすなのうみへ。", "パワー59でまっすぐ上。ちょっとでもつよすぎはダメ！"],
      ["サー・イバリンボのわな", "ライバルのとくべつなクラブ。サー・イバリンボの大きな金のぞうがまんなかをふさぎ、2つの金のもんがかわりばんこにガシャンとあいたりしまったり。かんばんはにこにこ、ちがうほうをさしています。", "かんばんはうそつき。ひだりのもんがあいているときに、ひだりのみちへ。"],
      ["ツアーバスのトンネル", "ツアーバスがグリーンのまんなかにとまっています。あいているにもつ入れにパットすると、ボールははんたいがわからはたにむかってとびだします。みんな、のって！", "にもつ入れのドアをねらおう。でぐちはバスがはたにむけてくれるよ。"],
      ["タワーのフィナーレ", "さいごの大ホール。「たおれるぞー！」とテレビとうがグリーンにたおれ、かんきゃくはドキドキ。たおれたてっこつにあててはねかえすしかありません。きめれば金のジャケットはきみのもの！", "まっすぐ上の、たおれたタワーへ。ボールをカップにはねかえしてくれるよ。"]

    holes: [
      ["冰球猛擊", "你從冰球場正中央開球。一大塊紅色的「啪！」加速墊把球沿著擋板一路送進球門。能用冰球猛擊，幹嘛慢慢推？", "輕輕打就夠了，加速墊會幫你搞定！"],
      ["輕輕推進去", "整個球道只有一小圈草地，四周都是沙海，上面掛著大大的「輕輕推進去」招牌。打太大力，你就要去挖沙囉。輕輕、輕輕、再輕輕。", "只要輕輕碰一下。力道 30 就夠了。"],

      ["奶奶家車道", "救救奶奶的房子！搬家卡車停在門口，搬家工人正在搬箱子。趁卡車叭叭開走之前，把球推上車道、穿過院子。", "卡車停在右邊的時候出手。沿著車道直直推！"],
      ["鱷魚沼澤", "鱷魚池塘。一隻綠色大鱷魚在沼澤裡游來游去，木板橋上的球都會被牠「啊嗚」一口吃掉。球不見了，牠還會對你打個泡泡嗝。", "趁鱷魚游遠的時候過橋，不要拖拖拉拉！"],
      ["瘋狂練習場", "高爾夫練習場。大網子是給別人用的：你要穿過網子上的破洞，往上坡打到 200 公尺的牌子，旁邊還有關在籠子裡的撿球車慢慢開過。", "用力、直直打進破洞。上坡會吃掉速度！"],
      ["翻滾迴圈", "給它一點衝勁：球洞中間有一個完整的霓虹迴圈軌道。太慢的話，球會帶著難過的口哨聲滾回你這邊。", "力道 70，直直往上。太慢的球會被吐回來！"],
      ["落湯雞公開賽", "到處都是水的公開賽。一條長長的木棧道從開球台直直通到旗桿；鋸齒狀的草地小橋是比較遠但安全的路。鴨子們已經在笑了。", "夠勇敢？沿著木棧道直直打。想小心一點？走草地小橋繞過去。"],
      ["快樂小天地", "閉上眼睛，到你的快樂小天地：白雲、輕柔的音樂、鬆餅塔、獨角獸，還有一個不管你多緊張都會溫柔把球吸進去的球洞。", "深呼吸。把球滾到光圈附近，球洞會幫你搞定。"],
      ["金夾克大廳", "獎盃室：玻璃展示櫃、紅地毯，還有在衣架上閃閃發亮、轉個不停的金夾克。直線被冠軍的展示櫃擋住了，所以像冠軍一樣，讓球彈一下軟軟的紅牆吧。", "讓球彈左邊的牆。往左上瞄準，打紮實一點。"],
      ["小心車子！", "突然冒出一輛車！一輛笑咪咪的卡通車在畫在球道上的馬路上呼嘯而過。趁兩次經過之間，斜斜地把球推過去。", "車子一開過去，馬上往左上穿過馬路。"],
      ["助跑大開球", "怪獸級開球。助跑一下，衝上「啪！」加速墊，球會飛過整條球道，撞到角落的擋板彈開，停在寫著「400 公尺?!」的牌子旁。", "直直往上衝進加速墊，角落擋板會把球轉向球洞。"],
      ["回家去吧", "對球說話：「回家去吧！」一間小房子在草地碗的中間，坡度會幫你完成剩下的事。只要滾到碗邊，就會一路滾到大門口。", "只要打到碗的邊緣就好。力道 45，叫它回家吧。"],
      ["沙坑大山", "旗桿在沙丘頂上。太小力，球會滾回你腳邊；太大力，球會翻過山頂掉進後面的沙海。", "力道 59 直直往上。一點點都不能多！"],
      ["臭屁爵士的陷阱", "對手的私人俱樂部。臭屁爵士的巨大金色雕像擋在中間，兩道金色閘門輪流哐啷開關，他的牌子還開心地幫你指錯方向。", "牌子在騙人。趁左邊的閘門打開時走左邊的路。"],
      ["巡迴巴士隧道", "巡迴巴士橫停在果嶺上，所以你要把球推進打開的行李艙，球會從另一邊對著旗桿跑出來。大家上車囉！", "瞄準行李艙的門。巴士會幫你把出口對準旗桿。"],

/* ================================================================================================
   HOLE BUILDERS: turn the compact hole data into colliders, sensors and movers.
   ================================================================================================ */
function segsFromPts(pts, closed, rest, over) {
  const out = []; const n = closed ? pts.length : pts.length - 1;
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length]; const o = over && over[i];
    const sg = { ax: a[0], ay: a[1], bx: b[0], by: b[1], rest: o && o.rest !== undefined ? o.rest : rest, kind: o && o.kind, onHit: o && o.onHit };
    if (closed) { // a closed outline is a lane: remember which side the course is on (collideSeg keeps the ball on that side)
      const L = hyp(b[0] - a[0], b[1] - a[1]) || 1; let nx = -(b[1] - a[1]) / L, ny = (b[0] - a[0]) / L;
      if (!pointInPoly(pts, (a[0] + b[0]) / 2 + nx, (a[1] + b[1]) / 2 + ny)) { nx = -nx; ny = -ny; }
      sg.fnx = nx; sg.fny = ny; sg.poly = pts;
    }
    out.push(sg);
  }
  return out;
}
// A solid block inside the lane: the ball lives OUTSIDE it, so these walls keep the plain two-sided rule.
function rectSegs(x0, y0, x1, y1, rest, onHit) { return segsFromPts([[x0, y0], [x1, y0], [x1, y1], [x0, y1]], true, rest).map(s => { s.onHit = onHit; delete s.fnx; delete s.fny; delete s.poly; return s; }); }
const sandRect = (x0, y0, x1, y1) => ({ x0, y0, x1, y1, test: (x, y) => x >= x0 && x <= x1 && y >= y0 && y <= y1 });
const sandAnnulus = (cx, cy, r0, r1) => ({ cx, cy, r0, r1, test: (x, y) => { const d = hyp(x - cx, y - cy); return d > r0 && d < r1; } });
const norm = (x, y) => { const L = hyp(x, y) || 1; return { x: x / L, y: y / L }; };

// A moving axis-aligned rectangle (truck, car, cart). pos(t) -> {x, y, vx, vy, visible}
function rectMover(o) {
  const m = { w: o.w, h: o.h, cx: 0, cy: 0, vx: 0, vy: 0, vis: true, dent: 0, o,
    update(t) { const p = o.pos(t); m.cx = p.x; m.cy = p.y; m.vx = p.vx || 0; m.vy = p.vy || 0; m.vis = p.visible !== false; m.solid = p.solid !== false; if (m.dent > 0) m.dent -= 1 / 120; },
    collide() { if (!m.vis || !m.solid) return; collideRect(m.cx - m.w / 2, m.cy - m.h / 2, m.cx + m.w / 2, m.cy + m.h / 2, o.rest, m.vx, m.vy, (sp, x, y) => { m.dent = 1; defaultHit(sp, x, y); if (o.onHit) o.onHit(sp, x, y, m); }); },
    draw(ctx, t) { if (m.vis && o.draw) o.draw(ctx, m, t); } };

}
// A gate: a wall segment that only exists while closed(t) is true.

    update(t) { g.isClosed = closed(t); if (g.isClosed && !g.wasClosed) { g.shutT = 0.15; if (extra && extra.onShut) extra.onShut(); } g.wasClosed = g.isClosed; if (g.shutT > 0) g.shutT -= 1 / 120; if (g.hitT > 0) g.hitT -= 1 / 120; },
    collide() { if (!g.isClosed) return; collideSeg(ax, ay, bx, by, extra && extra.rad || 0, rest, 0, 0, (sp, x, y) => { g.hitT = 0.6; defaultHit(sp, x, y); if (extra && extra.onHit) extra.onHit(sp, x, y); }); },
    draw(ctx, t) { if (extra && extra.draw) extra.draw(ctx, g, t); } }, extra || {});

// Rotor with capsule sails (the windmill). Sails from r0 to r1 along each sail, half-width hw.
function sailRotor(hx, hy, n, r0, r1, hw, omegaDeg, phaseDeg, rest, extra) {
  const r = { hx, hy, a: phaseDeg * RAD, omega: omegaDeg * RAD, n, r0, r1, hw, hitT: 0,
    update(t) { r.a = (phaseDeg + omegaDeg * t) * RAD; if (r.hitT > 0) r.hitT -= 1 / 120; },
    collide() {
      for (let i = 0; i < n; i++) {
        const a = r.a + i * TAU / n, dx = Math.cos(a), dy = -Math.sin(a);
        const ax = hx + dx * r0, ay = hy + dy * r0, bx = hx + dx * r1, by = hy + dy * r1;
        const c = closestOnSeg(ax, ay, bx, by, ball.x, ball.y); if (hyp(ball.x - c.x, ball.y - c.y) > CONFIG.ballR + hw) continue;
        const s = hyp(c.x - hx, c.y - hy), ovx = r.omega * s * -Math.sin(a), ovy = r.omega * s * -Math.cos(a);
        const hit = collideSeg(ax, ay, bx, by, hw, rest, ovx, ovy, (sp, x, y) => { r.hitT = 0.5; defaultHit(sp, x, y); if (extra && extra.onHit) extra.onHit(sp, x, y); });
        // A sail always whacks a slow ball clear (sideways off the sail and outward from the hub) instead of carrying it round and round.
        if (hit && extra && extra.kick && hyp(ball.vx, ball.vy) < extra.kick) {

          const vu = ball.vx * ux + ball.vy * uy, want = extra.kick * 0.6; if (vu < want) { ball.vx += (want - vu) * ux; ball.vy += (want - vu) * uy; }

          sfx('click'); r.hitT = 0.5;
        }

    },
    draw(ctx, t) { if (extra && extra.draw) extra.draw(ctx, r, t); } };

}
// Rotor with round bumpers on the rim (the jacket rack).
function bumperRotor(hx, hy, radius, n, br, omegaDeg, rest, extra) {
  const r = { hx, hy, a: 0, omega: omegaDeg * RAD, radius, n, br, hitT: 0,
    update(t) { r.a = omegaDeg * t * RAD; if (r.hitT > 0) r.hitT -= 1 / 120; },
    collide() { for (let i = 0; i < n; i++) { const a = r.a + i * TAU / n, cx = hx + Math.cos(a) * radius, cy = hy - Math.sin(a) * radius; const ovx = r.omega * radius * -Math.sin(a), ovy = r.omega * radius * -Math.cos(a); collideCircle(cx, cy, br, rest, ovx, ovy, (sp, x, y) => { r.hitT = 0.5; defaultHit(sp, x, y); }); } },
    draw(ctx, t) { if (extra && extra.draw) extra.draw(ctx, r, t); } };
  return r;
}

/* ================================================================================================

   state()                 -> { screen, hole (1-based), par, strokes, players, current, scores, ball:{x,y,vx,vy,moving}, finished }

   skipAnimations()        -> dismisses the hole card, zero the hole clock (moving parts at phase 0), ends the TIMBER intro, makes waits instant
   setBall(x, y)           -> places the ball at rest
   seed(n)                 -> seeds the PRNG (crowds/particles only; moving parts are purely clock-driven)
   holePlan()              -> the 18-hole data: { n, name, par, gag, testShot: { angle (deg, 0 = right, 90 = up), power, timing } }
   ================================================================================================ */
