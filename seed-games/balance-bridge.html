<title>Balance Bridge</title>
<!-- Balance Bridge: Number Quest Launchpad Unit 4, The Balance Bridge (grades 1-2, ages 6-8). A see-saw drawbridge
     over the castle moat, on Oomba3D 1.1.0 in the Castle Quest theme: stone blocks stand on each side, and when both
     sides weigh the same the bridge goes level and the helper walks across. Three chapters of six rounds, one per
     course step:
       equal  (4.1) is it true? (5 + 2 = 7, 6 = 6, 4 + 1 = 5 + 2), then find the missing number (8 + ? = 11,
                    5 = ? − 3, 6 + 6 = ?): the equals sign means "the same as", and it is not always at the end;
       story  (4.2) short spoken stories about the castle's stones (add to, take from, put together, compare; then
                    within 100 and one two-step story): the blocks act the story out and the child picks the answer;
       groups (4.3) odd or even by sharing the blocks in pairs, one to each side (is one left over?), an even number
                    as a double (8 = 4 + 4), and rows of blocks added as equal addends (3 rows of 4: 4 + 4 + 4 = 12).
     Made for a child who is only starting to read: every instruction is short, shown and spoken (BRB.speak, the
     shared path; the speaker button says it again), the numbers are big, and everything is done with big buttons.
     No timer, no lives, no fail state: a wrong number is tried on the bridge (too light or too heavy), wobbles and
     gets a spoken hint, then another try. Lesson mode: BRB.params { chapter: equal | story | groups, lock: 1 } opens
     that chapter only; finishing its six rounds reports game over, won, once (the course step's completion signal).
     With no parameters the game offers the three chapters from a picture menu. Saves only which chapters are
     finished (BRB.storage 'balance-bridge-v1'). The bridge is a Rapier rigid body on a hinge (g.physics()); if
     Rapier cannot start, the game's own small spring tilts it instead. The import map below is exactly
     kit2ImportMap() (server/services/vendor.js); tests/unit/balance-bridge.test.js fails if a library bump leaves it
     behind. English only, like Number Quest's other lesson games. Test handle: window.__bb (also window.__brbTest,
     the name the picture scripts wait for). -->

  const b = document.createElement('button'); b.type = 'button'; b.className = 'bb-btn' + (cls ? ' ' + cls : ''); if (id) b.id = id;

  if (icon) { const i = span('i', icon); i.setAttribute('aria-hidden', 'true'); b.append(i); }
  if (big != null) b.append(span('big', big));
  if (label) b.append(span('l', label));
  b.setAttribute('aria-label', aria || label || String(big));
  b.addEventListener('click', () => go(b));
  return b;
}
function card(kind, { title, line, buttons, star }) {
  el.bar.hidden = true; el.row2.hidden = true; el.ask.hidden = true; hint();
  const top = document.createElement('div'), row = document.createElement('div');
  if (star) { const s = document.createElement('div'); s.className = 'bb-star'; s.setAttribute('aria-hidden', 'true'); s.textContent = '⭐'; top.append(s); }
  const h = document.createElement('h1'); h.textContent = title; top.append(h);
  const a = document.createElement('div'); a.className = 'bb-ask'; a.style.display = 'inline-flex';
  const sb = document.createElement('button'); sb.type = 'button'; sb.className = 'bb-say'; sb.textContent = '🔊'; sb.setAttribute('aria-label', fmt('btn.say'));
  sb.addEventListener('click', () => speak(line, null, { auto: false }));
  const t = document.createElement('span'); t.className = 'bb-askt'; t.textContent = fmt(line); a.append(sb, t); top.append(a);
  row.className = kind === 'menu' ? 'bb-menu' : 'bb-pick'; row.append(...buttons.map(button));
  el.card.className = 'bb-card';
  el.card.replaceChildren(top, row); el.card.hidden = false;
  S.line = [line, null]; speak(line);
}
/** The helper on a level bridge with three blocks on each side: the menu and the end of a chapter. */
function solo() {
  clearStage(); S.held = false; props(false);
  drawSides({ L: [{ n: 3 }], R: [{ n: 3 }], kind: 'parity' }, null, '');
  const h = S.hero; if (h) { drop(h.object); g.scene.add(h.object); h.object.visible = true; h.object.scale.setScalar(heroSize()); h.position.set(0, 0, ZH); h.object.rotation.y = 0; }
  Object.assign(view, { rect: tall ? [-HALF - 0.2, HALF + 0.2, -0.9, 1.2] : [-HALF - 1.4, HALF + 1.4, -0.9, 1.2], high: 2.6, low: 2.4, tilt: 0 });
}
function showMenu() {
  S.screen = 'menu'; S.chapter = ''; S.phase = 'idle'; S.tick++; solo();
  if (S.hero) S.hero.play('wave');
  card('menu', { title: fmt('title'), line: 'menu.pick', buttons: BB.CHAPTERS.map(c => ({ id: 'ch-' + c, icon: ICON[c] + (S.done[c] ? '⭐' : ''), label: fmt('ch.' + c), go: () => startChapter(c) })) });
  frame();
}

/* ---------- a chapter: six rounds ---------- */
function startChapter(chapter) {
  if (!BB.CHAPTERS.includes(chapter)) return showMenu();
  S.chapter = chapter; S.round = 0; S.screen = 'play'; S.side = -1; el.card.hidden = true; el.card.replaceChildren();
  if (S.hero) S.hero.play('idle');
  nextRound();
}
function dots() {
  el.dots.replaceChildren(...Array.from({ length: BB.ROUNDS }, (_, i) => { const d = document.createElement('i'); if (i < S.round - 1) d.className = 'on'; else if (i === S.round - 1) d.className = 'now'; return d; }));
  el.dots.setAttribute('aria-label', fmt('round', { n: S.round, m: BB.ROUNDS })); el.dots.hidden = false; el.row2.hidden = false;
}
const numeric = Rd => typeof Rd.answer === 'number';
/** The number chip for the round: the sum as it is written, "?" where the answer goes while it is asked. */
function chipText(Rd, found) {
  if (Rd.kind === 'parity') return found ? `${Rd.num} = ${Rd.rv} + ${Rd.rv}${Rd.answer === 'odd' ? ' + 1' : ''}` : fmt('show.blocks', { n: Rd.num });
  const x = found && numeric(Rd) ? Rd.answer : null;
  return BB.text(Rd.L, x) + ' = ' + BB.text(Rd.R, x) + (found && Rd.kind === 'true' ? (Rd.answer === 'yes' ? ' ✔' : ' ✘') : '');
}
const showSum = (Rd, found) => sum(chipText(Rd, found), found ? (Rd.answer === 'no' ? 'bad' : '') : 'ask');
function nextRound() {
  if (S.round >= BB.ROUNDS) return finish();
  S.round++; S.R = BB.round(S.chapter, S.round, S.lap); S.phase = 'play'; S.shown = false; S.trial = null; S.tick++;
  const Rd = S.R;
  hint(); dots(); showSum(Rd, false);
  say(Rd.ask[0], Rd.ask[1]);   // the words first: the camera fits the bridge under them
  redraw(); frame();
}
function finish() {
  S.screen = 'end'; S.phase = 'idle'; S.done[S.chapter] = true; store(); S.tick++;
  // The course step's completion signal: once for each chapter finished, never before its sixth round is right.
  S.reported++;
  try { if (window.BRB && BRB.gameOver) BRB.gameOver({ won: true }); } catch (e) { /* no page */ }
  solo();
  g.celebrate(S.hero, '');   // the cheer and the confetti; the words are on the card
  const buttons = [{ id: 'again', icon: '🔁', label: fmt('btn.again'), cls: 'go', go: () => { S.lap++; startChapter(S.chapter); } }];
  if (!S.lock) buttons.push({ id: 'menu', icon: '🏰', label: fmt('btn.menu'), go: showMenu });
  card('end', { title: fmt('win'), line: 'win.card', buttons, star: true });
  frame();
}

/** Draw the round from its state (also after the screen turns): the bridge, its blocks, the helper, the buttons. */
function redraw() {
  if (S.screen === 'hero') return void showHeroes();
  if (S.screen === 'menu' || S.screen === 'end') { solo(); return void frame(); }
  if (S.screen !== 'play' || !S.R) return void frame();
  const focus = el.bar.contains(document.activeElement) ? document.activeElement.id : '';
  const Rd = S.R, found = S.phase === 'right', first = !S.shown && !found;
  clearStage(); S.tick++; S.trial = null; if (S.phase === 'try') S.phase = 'play';
  el.card.hidden = true; el.bar.hidden = false;
  S.held = !found && (Rd.kind === 'true' || Rd.kind === 'parity'); props(S.held);
  drawSides(Rd, found && numeric(Rd) ? Rd.answer : null, first ? 'intro' : '', null, 'green');
  placeHero(S.side);
  const m = tall ? [S.side < 0 ? 1.25 : 0.12, S.side < 0 ? 0.12 : 1.25] : [2.1, 2.1];
  Object.assign(view, { rect: [-HALF - m[0], HALF + m[1], -0.9, tall ? 1.3 : 1.2], high: 3.5, low: tall ? 1.5 : 2.4, tilt: 0 });
  const num = v => button({ id: 'bb-n' + v, big: v, aria: fmt('btn.num', { n: v }), cls: found && v === Rd.answer ? 'go' : '', go: b => answer(v, b) });
  const word = (v, icon) => button({ id: 'bb-' + v, icon, label: fmt('btn.' + v), cls: found && v === Rd.answer ? 'go' : '', go: b => answer(v, b) });
  el.bar.className = 'bb-bar' + (numeric(Rd) ? '' : ' two');
  if (Rd.kind === 'true') el.bar.replaceChildren(word('yes', '✔️'), word('no', '✖️'));
  else if (Rd.kind === 'parity') el.bar.replaceChildren(word('even', '👫'), word('odd', '☝️'));
  else el.bar.replaceChildren(...Rd.choices.map(v => num(v)));
  if (focus) { const b = document.getElementById(focus) || el.bar.querySelector('button'); if (b) b.focus(); }   // a keyboard player stays on the buttons
  S.shown = true;
  if (found) pause(1.6, guard(nextRound));   // the screen turned while the bridge was settling: the round ends here
}
/** A step that only runs if the round it belongs to is still the one on screen. */
const guard = fn => { const tick = S.tick; return () => { if (tick === S.tick) fn(); }; };

/** The child picks an answer: True or Not true, Even or Odd, or a number. */
function answer(v, b) {
  if (S.phase !== 'play' || !S.R || S.screen !== 'play') return;
  const Rd = S.R, id = 'bb-' + (numeric(Rd) ? 'n' + v : v);
  if (!Rd.choices.includes(v)) return;
  b = b || document.getElementById(id);
  if (v !== Rd.answer) {
    wobble(b);
    if (!numeric(Rd)) { kick(v === 'yes' || v === 'even' ? 3 : -3); return hint(Rd.kind === 'true' ? 'tf.hint' : 'par.hint'); }
    hint(v < Rd.answer ? 'try.light' : 'try.heavy');
    if (reduced || S.fast) return;
    // the number is tried on the bridge: its blocks drop in, the bridge shows too light or too heavy, they go again
    S.phase = 'try'; S.tick++; S.trial = v; el.bar.classList.add('wait');
    const back = guard(() => { S.trial = null; S.phase = 'play'; el.bar.classList.remove('wait'); S.tick++; drawSides(Rd, null, ''); });
    return drawSides(Rd, v, 'new', () => settle(guard(() => pause(1.1, back))));
  }
  S.phase = 'right'; S.tick++; hint(); sfx('coin');
  if (b) b.classList.add('go');
  showSum(Rd, true);
  say(Rd.said[0][0], Rd.said[0][1], { queue: true });
  for (const [key, vars] of Rd.said.slice(1)) speak(key, vars, { queue: true });
  const level = Rd.lv === Rd.rv;
  const done = guard(() => {
    sfx('cheer'); if (!level) heroMove('cheer', 1700);
    const next = guard(() => pause(reduced ? 3.6 : level ? 1.5 : 2.6, guard(nextRound)));
    if (level) cross(next); else next();
  });
  // the bridge shows the answer: the blocks of the missing number drop in, or the posts let go; then it comes to rest
  if (numeric(Rd)) drawSides(Rd, Rd.answer, 'new', () => settle(done), 'green');
  else dropProps(guard(() => settle(done)));
}

/* ---------- the test handle: what the round asks and what is on screen (tests, covers, slide pictures) ---------- */
const scr = p => { const r = g.renderer.domElement.getBoundingClientRect(), q = p.clone().project(g.camera); return [(q.x + 1) / 2 * r.width + r.left, (1 - q.y) / 2 * r.height + r.top]; };
/** The screen box (left, top, right, bottom in CSS pixels) round some objects. */
function screenBox(objs) {
  const bx = [1e9, 1e9, -1e9, -1e9], b3 = new THREE.Box3(); let any = false;
  for (const o of objs) {
    if (!o.visible) continue; o.updateWorldMatrix(true, true); b3.setFromObject(o); if (b3.isEmpty()) continue; any = true;
    for (const x of [b3.min.x, b3.max.x]) for (const y of [b3.min.y, b3.max.y]) for (const z of [b3.min.z, b3.max.z]) { const [sx, sy] = scr(V3(x, y, z)); bx[0] = Math.min(bx[0], sx); bx[1] = Math.min(bx[1], sy); bx[2] = Math.max(bx[2], sx); bx[3] = Math.max(bx[3], sy); }
  }
  return any ? bx.map(n => Math.round(n)) : null;
}
window.__bb = window.__brbTest = {
  state: () => ({ game: 'balance-bridge', screen: S.screen, chapter: S.chapter, lock: S.lock, round: S.round, rounds: BB.ROUNDS, phase: S.phase, hero: S.hero ? S.hero.id : null, reported: S.reported, tall, physics: seesaw.mode,
    ...(S.R && S.screen === 'play' ? { ...S.R, weight: { l: weight.l, r: weight.r }, lean: ['right', 'level', 'left'][leanNow() + 1], held: S.held, angle: +seesaw.angle.toFixed(3), blocks: S.shownBlocks, trial: S.trial, side: S.side, crossed: S.crossed, moving: tweens.length + (resting ? 1 : 0) } : {}) }),
  fast: on => { S.fast = on !== false; },
  hero: id => chooseHero(id || HEROES[0]),
  act: (name, arg) => answer(arg),
  /** The helper's place: [x, y, z]. */
  heroAt: () => { if (!S.hero) return null; const p = S.hero.object.getWorldPosition(V3(0, 0, 0)); return [+p.x.toFixed(2), +p.y.toFixed(2), +p.z.toFixed(2)]; },
  /** Where things are on the screen (CSS pixels): the two ends of the bridge, and the boxes round the helper (as wide
   *  as the Wizard's hat), the
   *  blocks of each side and the number boards, for a test that checks everything is in view and nothing is hidden. */
  spot: () => ({ left: scr(V3(-HALF, 0, 0)), right: scr(V3(HALF, 0, 0)), hero: S.hero ? (() => { const p = S.hero.position, k = S.hero.object.scale.x, a = scr(V3(p.x - 0.95 * k, p.y + 2.1 * k, p.z)), b = scr(V3(p.x + 0.95 * k, p.y, p.z)); return [a[0], a[1], b[0], b[1]].map(n => Math.round(n)); })() : null,
    blocks: screenBox(stage.children.filter(o => !o.userData.label)), labels: screenBox(stage.children.filter(o => o.userData.label)),
    size: (() => { const a = scr(V3(0, 0, ZB)), b = scr(V3(BS, 0, ZB)); return +(b[0] - a[0]).toFixed(1); })() }),
};

el.load.hidden = true; el.load.remove(); el.bb.hidden = false;
await showHeroes();
window.__ready = true;
</script>
