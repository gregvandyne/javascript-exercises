<title>Typing Zoo</title>
<style>
  :root {
    --bg: #fbf7ee; --card: #fffdf7; --ink: #1f2430; --muted: #5d6170; --line: #e6dfcd; --accent: #2f9e6a; --accent-ink: #ffffff;
    --warn: #c2410c; --good: #2f9e6a; --gold: #e3a008; --soft: #f1ead8;
    --f-lp: #f4b6c2; --f-lr: #f7d08a; --f-lm: #bfe3a5; --f-li: #a8d8f0; --f-ri: #c9b8f2; --f-rm: #f6c4a3; --f-rr: #b8e6d8; --f-rp: #f2a7a7; --f-th: #e2e2e2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
  button { font: inherit; cursor: pointer; }
  .app { max-width: 980px; margin: 0 auto; padding: 14px 14px 40px; }
  .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .top h1 { font-size: 1.5rem; margin: 0; flex: 1; display: flex; align-items: center; gap: 8px; }
  .pill { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 14px; font-weight: 700; min-height: 44px; }
  .pill:hover { border-color: var(--accent); }
  .btn { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 12px 22px; font-weight: 800; font-size: 1.05rem; min-height: 48px; box-shadow: 0 4px 0 rgba(0,0,0,.18); }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .btn.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--line); box-shadow: none; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 18px; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }
  .unit { margin: 16px 0 8px; font-size: 1.05rem; color: var(--muted); font-weight: 800; letter-spacing: .02em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { position: relative; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px; min-height: 96px; display: flex; flex-direction: column; gap: 4px; color: var(--ink); }
  .tile:hover:not([disabled]) { border-color: var(--accent); }
  .tile .n { font-size: .8rem; font-weight: 800; color: var(--muted); }
  .tile .nm { font-weight: 800; font-size: 1.05rem; }
  .tile .st { margin-top: auto; letter-spacing: 2px; color: var(--gold); font-size: 1.05rem; }
  .tile .st .off { color: var(--line); }
  .tile.next { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,158,106,.18); }
  .tile[disabled] { opacity: .55; cursor: not-allowed; }
  .tile .lock { position: absolute; right: 10px; top: 10px; }
  .hello { display: flex; gap: 14px; align-items: center; }
  .hello .big { font-size: 3rem; }
  /* typing */
  .lesson-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lesson-h h2 { margin: 0; font-size: 1.25rem; flex: 1; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); display: inline-block; }
  .dots i.on { background: var(--accent); }
  .tip { font-size: 1.05rem; margin: 10px 0; }
  .line { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: clamp(1.4rem, 3.6vw, 2.2rem); line-height: 1.6; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 16px 18px; min-height: 4.2em; letter-spacing: .04em; }
  .line span { border-radius: 6px; padding: 0 1px; }
  .line .w { font-weight: inherit; white-space: nowrap; }
  .line .done { color: var(--good); }
  .line .cur { background: var(--ink); color: var(--card); }
  .line .bad { background: var(--warn); color: #fff; }
  .line .todo { color: var(--ink); }
  .line .sp.todo, .line .sp.done { color: var(--line); }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0; font-weight: 700; color: var(--muted); }
  .finger { font-weight: 800; }
  .kb { margin: 14px auto 0; display: flex; flex-direction: column; gap: 6px; max-width: 760px; user-select: none; }
  .row { display: flex; gap: 6px; justify-content: center; }
  .key { flex: 1 1 0; min-width: 0; max-width: 62px; height: 52px; border-radius: 10px; border: 2px solid rgba(0,0,0,.12); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.05rem; color: var(--ink); position: relative; padding: 0; }
  .key.wide { max-width: 96px; flex-grow: 1.6; font-size: .8rem; }
  .key.space { max-width: 360px; flex-grow: 6; }
  .key.home::after { content: ""; position: absolute; bottom: 7px; width: 12px; height: 3px; border-radius: 2px; background: rgba(0,0,0,.45); }
  .key.hit { outline: 4px solid var(--ink); outline-offset: 1px; transform: translateY(-2px); }
  .key.used { opacity: 1; }
  .key.unused { opacity: .35; }
  .key small { position: absolute; top: 3px; inset-inline-start: 6px; font-size: .62em; font-weight: 700; opacity: .75; }
  .key.dead { font-style: italic; }
  .key.next2 { outline: 3px dashed var(--ink); outline-offset: 1px; }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; font-size: .85rem; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; border: 1px solid rgba(0,0,0,.15); }
  .shake { animation: shake .25s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  /* results + egg */
  .center { text-align: center; }
  .stars { font-size: 2.6rem; letter-spacing: 6px; color: var(--gold); }
  .stars .off { color: var(--line); }
  .nums { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 10px 0 16px; }
  .num { background: var(--soft); border-radius: 14px; padding: 10px 16px; min-width: 120px; }
  .num b { display: block; font-size: 1.6rem; }
  .eggbox { display: flex; flex-direction: column; align-items: center; gap: 12px; margin: 10px 0; }
  .egg { width: 150px; height: 190px; border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%; background: radial-gradient(circle at 35% 30%, #ffffff, #f3e9d2 60%, #e2d3ad); border: 3px solid #d9c79c; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .egg.gold { background: radial-gradient(circle at 35% 30%, #fff8d6, #f7d56b 60%, #e3a008); border-color: #c98c06; }
  .egg.wobble { animation: wobble .4s; }
  @keyframes wobble { 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
  .egg svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .egg .spots { position: absolute; inset: 0; border-radius: inherit; background-image: radial-gradient(circle at 30% 60%, rgba(0,0,0,.06) 0 10px, transparent 11px), radial-gradient(circle at 70% 40%, rgba(0,0,0,.06) 0 14px, transparent 15px), radial-gradient(circle at 55% 78%, rgba(0,0,0,.06) 0 8px, transparent 9px); }
  .pet { font-size: 7rem; line-height: 1; animation: pop .5s ease-out; }
  .pet.shiny { filter: drop-shadow(0 0 14px rgba(227,160,8,.85)); }
  @keyframes pop { 0% { transform: scale(.2) translateY(40px); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  /* pets */
  .pets { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
  .petcard { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 10px 6px; text-align: center; min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .petcard .e { font-size: 2.6rem; line-height: 1; }
  .petcard.locked .e { filter: grayscale(1) brightness(.2); opacity: .25; }
  .petcard.shiny { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(227,160,8,.22); }
  .petcard small { font-weight: 700; font-size: .78rem; color: var(--muted); }
  .note { background: var(--soft); border-radius: 14px; padding: 10px 14px; }
  .tile .best { font-size: .85rem; font-weight: 700; color: var(--muted); margin-top: auto; }
  .tile .ic { font-size: 1.6rem; line-height: 1; }
  .tricky { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 12px; border-color: var(--gold); }
  .tricky .big { font-size: 2.2rem; }
  .tricky div { flex: 1; min-width: 200px; }
  .keycap { display: inline-block; min-width: 1.7em; padding: 0 .35em; margin: 0 2px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 7px; background: var(--card); font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 800; text-align: center; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 1.3rem; color: var(--ink); background: var(--soft); border-radius: 12px; padding: 4px 12px; }
  .timer.low { color: var(--warn); }
  .live { font-variant-numeric: tabular-nums; }
  .own { margin-top: 12px; }
  .kbpick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .kbpick select, .editor select { font: inherit; border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--card); color: var(--ink); }
  .own h3 { margin: 0 0 6px; font-size: 1.05rem; }
  .own-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .own-list li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border: 2px solid var(--line); border-radius: 14px; padding: 8px 10px; }
  .own-list .nm { flex: 1; min-width: 160px; font-weight: 700; }
  .own-list .nm small { display: block; font-weight: 600; color: var(--muted); }
  .pill.sm { min-height: 36px; padding: 4px 10px; font-size: .9rem; }
  .codebox { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .codebox input, .editor input[type=text], .editor textarea, .editor select { font: inherit; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card); color: var(--ink); }
  .codebox input { text-transform: uppercase; letter-spacing: .08em; width: 12em; }
  .editor label { display: block; font-weight: 700; margin: 12px 0 4px; }
  .editor input[type=text], .editor textarea { width: 100%; }
  .editor textarea { min-height: 180px; font-family: ui-monospace, Menlo, Consolas, monospace; line-height: 1.5; }
  .editor .row2 { display: flex; gap: 14px; flex-wrap: wrap; align-items: end; }
  .err { color: var(--warn); font-weight: 700; }
  .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1.6rem; font-weight: 800; letter-spacing: .1em; }
  .passnote { border: 2px dashed var(--accent); }
  /* ==== pet art START (PetArt in the script; docs/decisions.md "Typing Zoo: pets that walk") ==== */
  .pa { display: block; width: 100%; height: 100%; overflow: visible; }
  .pa * { transform-box: view-box; vector-effect: non-scaling-stroke; }
  .pa-sh { fill: rgba(31, 36, 48, .16); }
  .pa-b { transform-origin: 50px 91px; animation: pa-breathe 2.8s ease-in-out var(--d, 0s) infinite; }
  .pa-y { animation: pa-blink 5.2s var(--d, 0s) infinite; }
  .pa-e { animation: pa-ear 4.6s ease-in-out var(--d, 0s) infinite; }
  .pa-t { animation: pa-wag 1.8s ease-in-out var(--d, 0s) infinite; }
  .pa-w { animation: pa-flap 3.4s ease-in-out var(--d, 0s) infinite; }
  .pa-wf { animation: pa-flutter .18s ease-in-out infinite alternate; }
  .pa-wf2 { animation: pa-flutter2 .18s ease-in-out infinite alternate; }
  .pa-hov { animation: pa-hover 1.6s ease-in-out var(--d, 0s) infinite; }
  .pa-bub { animation: pa-bub 2.4s ease-in infinite; }
  .pa-sp { animation: pa-twinkle 1.6s ease-in-out infinite; }
  .pa.shiny { filter: drop-shadow(0 0 5px rgba(255, 196, 30, .85)); }
  .g-swim .pa-b { animation-name: pa-swim; }
  @keyframes pa-breathe { 50% { transform: scale(1.02, .97); } }
  @keyframes pa-swim { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-2px) rotate(-3deg); } }
  @keyframes pa-blink { 0%, 92%, 97%, 100% { transform: none; } 94.5% { transform: scaleY(.1); } }
  @keyframes pa-ear { 0%, 72%, 100% { transform: none; } 78% { transform: rotate(-7deg); } 86% { transform: rotate(5deg); } }
  @keyframes pa-wag { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(8deg); } }
  @keyframes pa-flap { 0%, 80%, 100% { transform: none; } 86% { transform: rotate(-22deg); } 92% { transform: rotate(4deg); } }
  @keyframes pa-flutter { to { transform: scaleX(.55); } }
  @keyframes pa-flutter2 { to { transform: scaleX(.55); } }
  @keyframes pa-hover { 50% { transform: translateY(-3px); } }
  @keyframes pa-bub { 0% { transform: translateY(6px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-10px); opacity: 0; } }
  @keyframes pa-twinkle { 0%, 100% { transform: scale(.6); opacity: .5; } 50% { transform: scale(1.1); opacity: 1; } }
  /* walking: the leg pairs swing in turn (hop, waddle, slide and swim move the whole pet instead) */
  .walking .pa-l1 { animation: pa-step .42s ease-in-out infinite alternate; }
  .walking .pa-l2 { animation: pa-step .42s ease-in-out -.42s infinite alternate; }
  .walking .g-walk .pa-b { animation: pa-trot .42s ease-in-out infinite alternate; }
  .walking .g-hop .pa-b { animation: pa-hop .5s cubic-bezier(.3, 0, .5, 1) infinite; }
  .walking .g-hop .pa-l1, .walking .g-hop .pa-l2 { animation: none; }
  .walking .g-waddle .pa-b { animation: pa-waddle .5s ease-in-out infinite alternate; }
  .walking .g-slide .pa-b { animation: pa-slide .7s ease-in-out infinite alternate; }
  .walking .g-swim .pa-b { animation: pa-swim .8s ease-in-out infinite; }
  .walking .g-swim .pa-t { animation-duration: .5s; }
  .walking .k-sea .pa-l1, .walking .k-sea .pa-l2 { animation-duration: .3s; }
  @keyframes pa-step { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
  @keyframes pa-trot { from { transform: translateY(0); } to { transform: translateY(-1.5px); } }
  @keyframes pa-hop { 0%, 100% { transform: translateY(0) scale(1.04, .94); } 15% { transform: translateY(0) scale(.96, 1.05); } 50% { transform: translateY(-9px) scale(1); } 85% { transform: translateY(0) scale(1); } }
  @keyframes pa-waddle { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
  @keyframes pa-slide { from { transform: scale(1, 1); } to { transform: scale(1.06, .95); } }
  /* a happy bounce (a line or a lesson done) and a small shake (a wrong key) */
  .pet-happy .pa { animation: pa-happy .55s cubic-bezier(.3, 0, .4, 1) 2; }
  .pet-oops .pa { animation: pa-oops .32s ease-in-out 1; }
  @keyframes pa-happy { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-16px) rotate(-6deg); } 70% { transform: translateY(0) scale(1.06, .94); } }
  @keyframes pa-oops { 25% { transform: translateX(-3px) rotate(-3deg); } 75% { transform: translateX(3px) rotate(3deg); } }
  /* ==== pet art END ==== */
  /* the walking pet's lane (Walk in the script): its own strip under the top bar, so it covers nothing */
  .lane { --pet: 64px; position: relative; height: calc(var(--pet) + 2px); margin: -4px 4px 12px; pointer-events: none; border-bottom: 2px dashed var(--line); }
  .walker { position: absolute; left: 0; bottom: calc(var(--pet) * -.08); width: var(--pet); height: var(--pet); pointer-events: none; will-change: transform; }
  @media (min-width: 700px) and (min-height: 600px) { .lane { --pet: 84px; } }
  .walker .face { width: 100%; height: 100%; transition: transform .2s; }
  .walker.left .face { transform: scaleX(-1); }
  .pet.pet-svg { width: 150px; height: 150px; font-size: 1rem; animation: hatchhop .9s ease-out; }
  @keyframes hatchhop { 0% { transform: scale(.2) translateY(40px); } 45% { transform: scale(1.08) translateY(-20px); } 65% { transform: scale(1.06, .94) translateY(0); } 82% { transform: translateY(-7px); } 100% { transform: none; } }
  .petcard .art { width: 84px; height: 84px; display: block; }
  .petcard.locked .art { filter: brightness(0); opacity: .22; }
  .petcard.locked .pa *, .petcard.locked .pa { animation: none; }
  .petcard.out { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,158,106,.18); }
  .petcard .walkbtn { margin-top: 2px; font-size: .78rem; min-height: 32px; padding: 3px 8px; }
  .petcard .walkbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .calm .pa *, .calm .pa, .calm .walker { animation: none !important; }
  .calm .pa .pa-y { animation: pa-blink 5.2s var(--d, 0s) infinite !important; }
  @media (max-width: 560px) {
    .key { height: 44px; font-size: .9rem; border-radius: 8px; }
    .row, .kb { gap: 4px; }
    .key.wide { font-size: .65rem; }
    .egg { width: 120px; height: 152px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pet, .egg.wobble, .shake { animation: none; }
    .pa, .pa *, .walker { animation: none !important; }
    .pa .pa-y { animation: pa-blink 5.2s var(--d, 0s) infinite !important; }
  }
</style>
<div class="app" id="app">
  <div class="top">
    <h1><span aria-hidden="true">🥚</span> <span id="title"></span></h1>
    <button type="button" class="pill" id="petsBtn"></button>
    <button type="button" class="pill" id="soundBtn"></button>
  </div>
  <div class="lane hidden" id="petLane" aria-hidden="true"><div class="walker" id="walker"><div class="face"></div></div></div>
  <main id="screen" aria-live="polite"></main>
</div>
<script>
// Typing Zoo: short touch-typing lessons (home row first), and at the end of each lesson an egg to crack that
// hatches a pet for the student's collection. Progress is kept in the player's own save (BRB.storage key SAVE_KEY):
// teachers see it for their class on the class's progress page (server/services/typing.js reads the same shape;
// keep LESSONS ids in step with it). A lesson step can open one lesson: ?chapter=l05&lock=1.
const CONFIG = {
  linesPerLesson: 3,      // drills in one lesson
  lineLength: 34,         // characters a drill line aims for
  crackTaps: 4,           // presses to hatch the egg
  starsAt: [95, 85],      // accuracy for 3 and 2 stars
  petsTotal: 40,
};
const SAVE_KEY = 'typing-pets-v1';

// ==== I18N START ====
var I18N = {
  "en": {"title":"Typing Zoo","tag":"Learn to type, one key at a time, and hatch a pet after every lesson.","how1":"Put your fingers on the home row: A S D F for your left hand, J K L ; for your right hand.","how2":"Feel the little bumps on F and J. They help you find home without looking.","how3":"Type the letter that is lit up. Finish the lesson to crack an egg and hatch a pet.","hello":"Pick a lesson. Each one ends with an egg to crack!","unit1":"Home row","unit2":"Top row","unit3":"Bottom row","unit4":"Big letters and sentences","lessonN":"Lesson {n}","locked":"Finish the lesson before to open this one.","pets":"My pets {n}/{total}","petsH":"My pets","petsSub":"Finish lessons to hatch more. Get 3 stars for a golden egg and a shiny pet!","walkWith":"Walk with me","walkingNow":"Out for a walk","walkOn":"Walking pet: on","walkOff":"Walking pet: off","soundOn":"Sound on","soundOff":"Sound off","start":"Press Space or tap Start to begin.","startBtn":"Start","map":"Lessons","again":"Try again","next":"Next lesson","lineOf":"Line {n} of {total}","finger":"Use your {finger}.","f_lp":"left pinky","f_lr":"left ring finger","f_lm":"left middle finger","f_li":"left pointer finger","f_ri":"right pointer finger","f_rm":"right middle finger","f_rr":"right ring finger","f_rp":"right pinky","f_th":"thumb","shiftHint":"Hold Shift with your other hand's pinky for a big letter.","speed":"Speed","acc":"Accuracy","wpm":"{n} words a minute","pct":"{n}%","doneH":"Lesson done!","great":"Great typing!","keepGoing":"Nice work! Try again for more stars.","eggReady":"Your egg is ready! Tap it or press any key to crack it.","goldEgg":"A golden egg for 3 stars!","hatched":"You hatched a {pet}!","shinyPet":"A shiny {pet}!","visit":"Your {pet} came to say hi!","noKb":"Typing practice works best with a keyboard. You can also tap the keys below.","tickTip":"Typed wrong? No problem. Find the lit-up key and try again.","intro_l01":"Rest your left pointer finger on F and your right pointer finger on J. Feel the bumps!","intro_l02":"Your middle fingers rest on D and K, right next to F and J.","intro_l03":"Your ring fingers rest on S and L.","intro_l04":"Your pinkies rest on A and the ; key. That is the whole home row!","intro_l05":"Now type real words with the home row keys.","intro_l06":"Reach your pointer fingers to the middle: G and H. Then come back home.","intro_l07":"Reach up from D to E, and up from K to I.","intro_l08":"Reach up from F to R, and up from J to U.","intro_l09":"Reach up and over to T and Y with your pointer fingers.","intro_l10":"Ring fingers reach up to W and O.","intro_l11":"Pinkies reach up to Q and P.","intro_l12":"Words that use the top row and the home row.","intro_l13":"Reach down from F to V, and down from J to M.","intro_l14":"Middle fingers reach down to C and the comma.","intro_l15":"Pointer fingers reach down to B and N.","intro_l16":"Ring fingers reach down to X and the period. Pinkies reach down to Z.","intro_l17":"Words that use every row.","intro_l18":"Big letters: hold Shift with one pinky and press the letter with the other hand.","intro_l19":"Type whole sentences with big letters and periods.","intro_l20":"A speed run! Type carefully first, then get faster.","praise1":"Super!","praise2":"Awesome typing!","praise3":"You did it!","unit5":"Numbers and symbols","unit6":"Paragraphs","unit7":"Longer reading","intro_l29":"Type whole paragraphs now. Keep your eyes on the words, not your fingers.","intro_l30":"Keep a steady beat. Smooth typing is faster than rushing.","intro_l31":"Watch for capital letters on names and places. Use the Shift key on the other hand.","intro_l32":"Numbers and words mixed together. Reach up for the number row and come back home.","intro_l33":"Quotation marks are Shift and the apostrophe key, with your right pinky.","intro_l34":"A full paragraph for speed. Stay relaxed and keep going.","intro_l35":"Longer text with harder words. Accuracy first, then speed.","intro_l36":"A short history passage. Read a few words ahead as you type.","intro_l37":"Instructions with numbers, colons and commas.","intro_l38":"A story with dialogue and punctuation. Take your time with each mark.","intro_l39":"Semicolons, dashes and apostrophes all in one place.","intro_l40":"The final run. Type smoothly, fix mistakes quickly, and finish strong.","intro_l21":"Reach up from F to 4, and up from J to 7. Keep your other fingers home.","intro_l22":"Pointer fingers stretch to 5 and 6, in the middle of the number row.","intro_l23":"Middle fingers reach up to 3 and 8.","intro_l24":"Ring fingers reach up to 2 and 9.","intro_l25":"Pinkies reach up to 1 and 0.","intro_l26":"Words and numbers together, like 3 cats and 12 dogs.","intro_l27":"A question mark is Shift and the / key. An exclamation mark is Shift and 1.","intro_l28":"The apostrophe is next to ; and the dash is next to 0. Both use your right pinky.","testsH":"Typing tests","testsSub":"Type as much as you can before the time runs out.","testN":"{n}-minute test","testsLocked":"Finish Lesson 12 to open the typing tests.","bestWpm":"Best: {n} wpm","intro_test":"Type as much as you can in {n} minutes. The clock starts with your first key. Fix any mistakes as you go.","timeUp":"Time's up!","liveWpm":"{n} wpm","trickyH":"Practice my tricky keys","trickySub":"The keys you miss most:","trickyName":"Tricky keys","intro_tricky":"These are the keys you miss most. Go slowly and get each one right.","practiceDone":"Practice done!","ownH":"Your own typing lessons","ownSub":"Write a lesson or a timed test with your own words, then share its class code or assign it.","writeBtn":"Write a lesson","writeH":"Write a typing lesson","editH":"Change your typing lesson","nameL":"Name (optional)","textL":"What students type","textHint":"Letters, numbers, spaces and . , ; : ' \" - ! ? ( ). Each line is typed in turn. 10 to 1,500 characters.","kindL":"Kind","kindLesson":"Lesson (type it once)","kindTest":"Timed test","minsL":"Minutes","saveBtn":"Save","saving":"Saving...","cancel":"Cancel","savedH":"Saved!","codeIs":"Class code: {code}","codeHow":"Students open Typing Zoo and type this code, or you assign it to a class.","assignBtn":"Assign to a class","copyBtn":"Copy link","copied":"Link copied!","tryBtn":"Try it","editBtn":"Edit","delBtn":"Delete","delAsk":"Delete this lesson? Its class code and links will stop working.","delSure":"Tap again to delete","saveErr":"That didn't save. Check the text has only keys from the keyboard and nothing personal or unkind.","badChars":"These can't be typed in Typing Zoo: {chars}","tooShort":"Type at least 10 characters.","tooLong":"That's more than 1,500 characters.","noneYet":"No lessons yet.","codeH":"Got a code from your teacher?","codePh":"Class code","openBtn":"Open","codeBad":"That code doesn't work. Check it with your teacher.","missing":"This lesson isn't there anymore. Ask your teacher for a new code.","myLesson":"Your teacher's lesson","minTest":"{n}-minute test","passNeed":"To pass: {what}.","passNot":"Not passed yet. You need {what}. Try again to crack your egg!","passOk":"You passed!","pAcc":"{n}% accuracy","pWpm":"{n} words a minute","pAnd":" and ","needRule":"Your teacher asks for {what} in the lesson before to open this one.","ruleNot":"To open the next lesson, your teacher asks for {what}. Try this one again!","ln_l05":"Home row words","ln_l12":"Top row words","ln_l17":"Every row words","ln_l18":"Big letters","ln_l19":"Sentences","ln_l20":"Speed run","ln_l26":"Words and numbers","ln_l27":"? and !","ln_l28":"Extra keys","ln_l29":"Animal facts","ln_l30":"Into space","ln_l31":"Names and places","ln_l32":"Numbers in words","ln_l33":"Talking in quotes","ln_l34":"Paragraph speed run","ln_l35":"Science","ln_l36":"A page of history","ln_l37":"How to do it","ln_l38":"A longer story","ln_l39":"Tricky punctuation","ln_l40":"Expert speed run","keyboardL":"Keyboard","keyboardHint":"Pick the language and keyboard you type on."},
  "de": {"title":"Tipp-Zoo","tag":"Lerne tippen, eine Taste nach der anderen, und brüte nach jeder Lektion ein Tier aus.","how1":"Leg deine Finger auf die Grundreihe: A S D F für die linke Hand, J K L Ö für die rechte Hand. Das Ä erreicht dein rechter kleiner Finger.","how2":"Fühlst du die kleinen Huckel auf F und J? Damit findest du die Grundreihe, ohne hinzuschauen.","how3":"Tippe den Buchstaben, der leuchtet. Schaffst du die Lektion, knackst du ein Ei und ein Tier schlüpft.","hello":"Such dir eine Lektion aus. Am Ende wartet immer ein Ei!","unit1":"Grundreihe","unit2":"Obere Reihe","unit3":"Untere Reihe","unit4":"Großbuchstaben und Sätze","lessonN":"Lektion {n}","locked":"Schaff erst die Lektion davor, dann geht diese auf.","pets":"Meine Tiere {n}/{total}","petsH":"Meine Tiere","petsSub":"Schaff mehr Lektionen, dann schlüpfen mehr Tiere. Mit 3 Sternen gibt es ein goldenes Ei und ein Glitzertier!","walkWith":"Geh mit mir","walkingNow":"Ist mit dir unterwegs","walkOn":"Tier läuft mit: an","walkOff":"Tier läuft mit: aus","soundOn":"Ton an","soundOff":"Ton aus","start":"Drück die Leertaste oder tippe auf Start.","startBtn":"Start","map":"Lektionen","again":"Nochmal","next":"Nächste Lektion","lineOf":"Zeile {n} von {total}","finger":"Nimm deinen {finger}.","f_lp":"linken kleinen Finger","f_lr":"linken Ringfinger","f_lm":"linken Mittelfinger","f_li":"linken Zeigefinger","f_ri":"rechten Zeigefinger","f_rm":"rechten Mittelfinger","f_rr":"rechten Ringfinger","f_rp":"rechten kleinen Finger","f_th":"Daumen","shiftHint":"Für einen Großbuchstaben hältst du die Umschalttaste (Shift) mit dem kleinen Finger der anderen Hand.","speed":"Tempo","acc":"Genauigkeit","wpm":"{n} Wörter pro Minute","pct":"{n} %","doneH":"Lektion geschafft!","great":"Super getippt!","keepGoing":"Gut gemacht! Probier es nochmal für mehr Sterne.","eggReady":"Dein Ei ist bereit! Tippe darauf oder drück eine Taste, um es zu knacken.","goldEgg":"Ein goldenes Ei für 3 Sterne!","hatched":"Hurra! Geschlüpft ist: {pet}!","shinyPet":"Ein Glitzertier: {pet}!","visit":"{pet} kommt dich besuchen und sagt Hallo!","noKb":"Tippen üben geht am besten mit einer Tastatur. Du kannst aber auch unten auf die Tasten tippen.","tickTip":"Vertippt? Macht nichts. Such die leuchtende Taste und versuch es nochmal.","intro_l01":"Leg deinen linken Zeigefinger auf F und deinen rechten Zeigefinger auf J. Fühlst du die Huckel?","intro_l02":"Deine Mittelfinger liegen auf D und K, direkt neben F und J.","intro_l03":"Deine Ringfinger liegen auf S und L.","intro_l04":"Deine kleinen Finger liegen auf A und Ö. Das ist die ganze Grundreihe!","intro_l05":"Jetzt tippst du echte Wörter mit den Tasten der Grundreihe.","intro_l06":"Streck die Zeigefinger zur Mitte: G und H. Dann geht es zurück nach Hause.","intro_l07":"Geh von D hoch zum E und von K hoch zum I.","intro_l08":"Geh von F hoch zum R und von J hoch zum U.","intro_l09":"Streck die Zeigefinger hoch und zur Seite zu T und Z.","intro_l10":"Die Ringfinger gehen hoch zu W und O.","intro_l11":"Die kleinen Finger gehen hoch zu Q und P.","intro_l12":"Wörter mit der oberen Reihe und der Grundreihe.","intro_l13":"Geh von F runter zum V und von J runter zum M.","intro_l14":"Die Mittelfinger gehen runter zu C und zum Komma.","intro_l15":"Die Zeigefinger gehen runter zu B und N.","intro_l16":"Die Ringfinger gehen runter zu X und zum Punkt. Der linke kleine Finger geht runter zum Y.","intro_l17":"Wörter mit allen Reihen.","intro_l18":"Großbuchstaben: Halte die Umschalttaste mit einem kleinen Finger und drück den Buchstaben mit der anderen Hand.","intro_l19":"Tippe ganze Sätze mit Großbuchstaben und Punkt.","intro_l20":"Ein Wettrennen! Tippe erst genau, dann immer schneller.","praise1":"Super!","praise2":"Toll getippt!","praise3":"Geschafft!","unit5":"Zahlen und Zeichen","unit6":"Absätze","unit7":"Längere Texte","intro_l29":"Jetzt tippst du ganze Absätze. Schau auf die Wörter, nicht auf deine Finger.","intro_l30":"Tippe gleichmäßig wie ein Takt. Ruhiges Tippen ist schneller als Hetzen.","intro_l31":"Achte auf Großbuchstaben bei Namen und Orten. Nimm die Umschalttaste der anderen Hand.","intro_l32":"Zahlen und Wörter gemischt. Geh hoch zur Zahlenreihe und dann zurück nach Hause.","intro_l33":"Anführungszeichen tippst du mit der Umschalttaste und der 2.","intro_l34":"Ein ganzer Absatz für Tempo. Bleib locker und mach weiter.","intro_l35":"Längerer Text mit schwierigeren Wörtern. Erst genau, dann schnell.","intro_l36":"Ein kurzer Text über Geschichte. Lies beim Tippen ein paar Wörter voraus.","intro_l37":"Eine Anleitung mit Zahlen, Doppelpunkten und Kommas.","intro_l38":"Eine Geschichte mit wörtlicher Rede und Satzzeichen. Lass dir bei jedem Zeichen Zeit.","intro_l39":"Semikolon, Doppelpunkt, Bindestrich und Klammern, alles auf einmal.","intro_l40":"Das große Finale. Tippe gleichmäßig, verbessere Fehler schnell und bring es stark zu Ende.","intro_l21":"Geh von F hoch zur 4 und von J hoch zur 7. Die anderen Finger bleiben zu Hause.","intro_l22":"Die Zeigefinger strecken sich zur 5 und zur 6, in der Mitte der Zahlenreihe.","intro_l23":"Die Mittelfinger gehen hoch zur 3 und zur 8.","intro_l24":"Die Ringfinger gehen hoch zur 2 und zur 9.","intro_l25":"Die kleinen Finger gehen hoch zur 1 und zur 0.","intro_l26":"Wörter und Zahlen zusammen, wie 3 Katzen und 12 Hunde.","intro_l27":"Ein Fragezeichen ist Umschalttaste und ß. Ein Ausrufezeichen ist Umschalttaste und 1.","intro_l28":"Jetzt kommen ü, ö, ä und ß! Ö und Ä liegen rechts neben L, Ü rechts neben P und ß rechts neben der 0. Alle tippt dein rechter kleiner Finger.","testsH":"Tipp-Tests","testsSub":"Tippe so viel du kannst, bevor die Zeit um ist.","testN":"{n}-Minuten-Test","testsLocked":"Schaff Lektion 12, dann gehen die Tipp-Tests auf.","bestWpm":"Bestwert: {n} WpM","intro_test":"Tippe in {n} Minuten so viel du kannst. Die Uhr startet mit deiner ersten Taste. Verbessere Fehler gleich beim Tippen.","timeUp":"Die Zeit ist um!","liveWpm":"{n} WpM","trickyH":"Meine kniffligen Tasten üben","trickySub":"Diese Tasten verfehlst du am häufigsten:","trickyName":"Knifflige Tasten","intro_tricky":"Diese Tasten verfehlst du am häufigsten. Tippe langsam und triff jede einzelne.","practiceDone":"Übung geschafft!","ownH":"Eigene Tipp-Lektionen","ownSub":"Schreib eine Lektion oder einen Test mit Zeitlimit mit deinen eigenen Wörtern. Teile dann den Klassencode oder weise sie zu.","writeBtn":"Lektion schreiben","writeH":"Tipp-Lektion schreiben","editH":"Tipp-Lektion ändern","nameL":"Name (freiwillig)","textL":"Was die Kinder tippen","textHint":"Buchstaben (auch ä ö ü ß), Zahlen, Leerzeichen und . , ; : \" - ! ? ( ). Kein Apostroph. Jede Zeile wird der Reihe nach getippt. 10 bis 1.500 Zeichen.","kindL":"Art","kindLesson":"Lektion (einmal tippen)","kindTest":"Test mit Zeitlimit","minsL":"Minuten","saveBtn":"Speichern","saving":"Wird gespeichert ...","cancel":"Abbrechen","savedH":"Gespeichert!","codeIs":"Klassencode: {code}","codeHow":"Die Kinder öffnen Tipp-Zoo und geben diesen Code ein, oder du weist die Lektion einer Klasse zu.","assignBtn":"Einer Klasse zuweisen","copyBtn":"Link kopieren","copied":"Link kopiert!","tryBtn":"Ausprobieren","editBtn":"Bearbeiten","delBtn":"Löschen","delAsk":"Diese Lektion löschen? Ihr Klassencode und ihre Links funktionieren dann nicht mehr.","delSure":"Zum Löschen nochmal tippen","saveErr":"Das wurde nicht gespeichert. Prüfe, ob der Text nur Tasten der Tastatur enthält und nichts Persönliches oder Gemeines.","badChars":"Das kann man in Tipp-Zoo nicht tippen: {chars}","tooShort":"Tippe mindestens 10 Zeichen.","tooLong":"Das sind mehr als 1.500 Zeichen.","noneYet":"Noch keine Lektionen.","codeH":"Hast du einen Code von deiner Lehrkraft?","codePh":"Klassencode","openBtn":"Öffnen","codeBad":"Dieser Code funktioniert nicht. Frag deine Lehrkraft.","missing":"Diese Lektion gibt es nicht mehr. Frag deine Lehrkraft nach einem neuen Code.","myLesson":"Lektion von deiner Lehrkraft","minTest":"{n}-Minuten-Test","passNeed":"Zum Bestehen: {what}.","passNot":"Noch nicht bestanden. Du brauchst {what}. Versuch es nochmal und knack dein Ei!","passOk":"Bestanden!","pAcc":"{n} % Genauigkeit","pWpm":"{n} Wörter pro Minute","pAnd":" und ","needRule":"Deine Lehrkraft möchte in der Lektion davor {what}, damit diese aufgeht.","ruleNot":"Für die nächste Lektion möchte deine Lehrkraft {what}. Versuch diese nochmal!","ln_l05":"Wörter der Grundreihe","ln_l12":"Wörter der oberen Reihe","ln_l17":"Wörter mit allen Reihen","ln_l18":"Großbuchstaben","ln_l19":"Sätze","ln_l20":"Wettrennen","ln_l26":"Wörter und Zahlen","ln_l27":"? und !","ln_l28":"Ä, Ö, Ü und ß","ln_l29":"Tierwissen","ln_l30":"Ab ins Weltall","ln_l31":"Namen und Orte","ln_l32":"Zahlen im Text","ln_l33":"Wörtliche Rede","ln_l34":"Absatz-Wettrennen","ln_l35":"Naturwissenschaft","ln_l36":"Eine Seite Geschichte","ln_l37":"So geht das","ln_l38":"Eine längere Geschichte","ln_l39":"Knifflige Satzzeichen","ln_l40":"Profi-Wettrennen","keyboardL":"Tastatur","keyboardHint":"Wähl die Sprache und die Tastatur, auf der du tippst."},
  "es": {"title":"Zoo del Teclado","tag":"Aprende a escribir con el teclado, tecla a tecla, y haz nacer una mascota en cada lección.","how1":"Pon los dedos en la fila base: A S D F con la mano izquierda y J K L Ñ con la mano derecha.","how2":"Toca los bultitos de la F y la J. Te ayudan a encontrar tu sitio sin mirar.","how3":"Escribe la letra que se ilumina. Termina la lección para romper un huevo y conocer a tu mascota.","hello":"Elige una lección. ¡Cada una termina con un huevo para romper!","unit1":"Fila base","unit2":"Fila de arriba","unit3":"Fila de abajo","unit4":"Mayúsculas y frases","lessonN":"Lección {n}","locked":"Termina la lección anterior para abrir esta.","pets":"Mis mascotas {n}/{total}","petsH":"Mis mascotas","petsSub":"Termina lecciones para que nazcan más. ¡Consigue 3 estrellas y tendrás un huevo dorado y una mascota brillante!","walkWith":"Pasea conmigo","walkingNow":"Paseando contigo","walkOn":"Mascota que pasea: sí","walkOff":"Mascota que pasea: no","soundOn":"Sonido activado","soundOff":"Sonido desactivado","start":"Pulsa la barra espaciadora o toca Empezar.","startBtn":"Empezar","map":"Lecciones","again":"Otra vez","next":"Siguiente lección","lineOf":"Línea {n} de {total}","finger":"Usa el {finger}.","f_lp":"meñique izquierdo","f_lr":"anular izquierdo","f_lm":"dedo medio izquierdo","f_li":"índice izquierdo","f_ri":"índice derecho","f_rm":"dedo medio derecho","f_rr":"anular derecho","f_rp":"meñique derecho","f_th":"pulgar","shiftHint":"Para una mayúscula, mantén pulsada la tecla Mayús con el meñique de la otra mano.","speed":"Velocidad","acc":"Precisión","wpm":"{n} palabras por minuto","pct":"{n} %","doneH":"¡Lección terminada!","great":"¡Qué bien escribes!","keepGoing":"¡Buen trabajo! Repite para ganar más estrellas.","eggReady":"¡Tu huevo está listo! Tócalo o pulsa cualquier tecla para romperlo.","goldEgg":"¡Un huevo dorado por 3 estrellas!","hatched":"¡Ha nacido tu mascota: {pet}!","shinyPet":"¡{pet} brillante!","visit":"¡Tu {pet} vino a saludarte!","noKb":"Es mejor practicar con un teclado. También puedes tocar las teclas de abajo.","tickTip":"¿Te equivocaste? No pasa nada. Busca la tecla iluminada y vuelve a intentarlo.","intro_l01":"Apoya el índice izquierdo en la F y el índice derecho en la J. ¡Toca los bultitos!","intro_l02":"Los dedos medios van en la D y la K, justo al lado de la F y la J.","intro_l03":"Los anulares van en la S y la L.","intro_l04":"Los meñiques van en la A y la Ñ. ¡Esa es toda la fila base!","intro_l05":"Ahora escribe palabras de verdad con las teclas de la fila base.","intro_l06":"Estira los índices hacia el centro: G y H. Luego vuelve a casa.","intro_l07":"Sube de la D a la E, y de la K a la I.","intro_l08":"Sube de la F a la R, y de la J a la U.","intro_l09":"Sube y estira los índices hasta la T y la Y.","intro_l10":"Los anulares suben a la W y la O.","intro_l11":"Los meñiques suben a la Q y la P.","intro_l12":"Palabras con la fila de arriba y la fila base.","intro_l13":"Baja de la F a la V, y de la J a la M.","intro_l14":"Los dedos medios bajan a la C y a la coma.","intro_l15":"Los índices bajan a la B y la N.","intro_l16":"Los anulares bajan a la X y al punto. Los meñiques bajan a la Z.","intro_l17":"Palabras con todas las filas.","intro_l18":"Mayúsculas: mantén pulsada Mayús con un meñique y pulsa la letra con la otra mano.","intro_l19":"Escribe frases enteras con mayúsculas y puntos.","intro_l20":"¡Carrera de velocidad! Primero escribe con cuidado y después más rápido.","praise1":"¡Genial!","praise2":"¡Escribes de maravilla!","praise3":"¡Lo lograste!","unit5":"Números y signos","unit6":"Párrafos","unit7":"Lecturas largas","intro_l29":"Ahora escribe párrafos enteros. Mira las palabras, no los dedos.","intro_l30":"Lleva un ritmo tranquilo. Escribir sin prisa y sin parar es más rápido.","intro_l31":"Fíjate en las mayúsculas de los nombres y los lugares. Usa la tecla Mayús de la otra mano.","intro_l32":"Números y palabras mezclados. Sube a la fila de números y vuelve a casa.","intro_l33":"Las comillas se escriben con Mayús y la tecla 2.","intro_l34":"Un párrafo entero para ir rápido. Relájate y sigue adelante.","intro_l35":"Un texto más largo con palabras difíciles. Primero sin errores, luego más rápido.","intro_l36":"Un poco de historia. Lee unas palabras por delante mientras escribes.","intro_l37":"Instrucciones con números, dos puntos y comas.","intro_l38":"Un cuento con diálogos y signos. Tómate tu tiempo con cada signo.","intro_l39":"Punto y coma, guiones, comillas y los signos ¿? y ¡!, todo junto.","intro_l40":"La última carrera. Escribe con soltura, corrige rápido y termina con fuerza.","intro_l21":"Sube de la F al 4, y de la J al 7. Los demás dedos se quedan en casa.","intro_l22":"Los índices se estiran hasta el 5 y el 6, en el centro de la fila de números.","intro_l23":"Los dedos medios suben al 3 y al 8.","intro_l24":"Los anulares suben al 2 y al 9.","intro_l25":"Los meñiques suben al 1 y al 0.","intro_l26":"Palabras y números juntos, como 3 gatos y 12 perros.","intro_l27":"El ? es Mayús y la tecla ' (a la derecha del 0). El ! es Mayús y el 1. Para abrir, ¡ y ¿ están en la tecla siguiente a la del '.","intro_l28":"La Ñ está a la derecha de la L: usa el meñique derecho. Para las tildes, pulsa ´ y después la vocal: á, é, í, ó, ú.","testsH":"Pruebas de escritura","testsSub":"Escribe todo lo que puedas antes de que se acabe el tiempo.","testN":"Prueba de {n} minutos","testsLocked":"Termina la lección 12 para abrir las pruebas de escritura.","bestWpm":"Récord: {n} ppm","intro_test":"Escribe todo lo que puedas en {n} minutos. El reloj empieza con tu primera tecla. Corrige los errores sobre la marcha.","timeUp":"¡Se acabó el tiempo!","liveWpm":"{n} ppm","trickyH":"Practicar mis teclas difíciles","trickySub":"Las teclas en las que más te equivocas:","trickyName":"Teclas difíciles","intro_tricky":"Estas son las teclas en las que más te equivocas. Ve despacio y acierta cada una.","practiceDone":"¡Práctica terminada!","ownH":"Tus propias lecciones","ownSub":"Escribe una lección o una prueba con tiempo usando tus propias palabras. Luego comparte su código de clase o asígnala.","writeBtn":"Escribir una lección","writeH":"Escribe una lección","editH":"Cambia tu lección","nameL":"Nombre (opcional)","textL":"Lo que escriben los alumnos","textHint":"Letras (también ñ y vocales con tilde o diéresis), números, espacios y . , ; : ' \" - ! ? ¡ ¿ ( ). Cada línea se escribe por turno. De 10 a 1500 caracteres.","kindL":"Tipo","kindLesson":"Lección (se escribe una vez)","kindTest":"Prueba con tiempo","minsL":"Minutos","saveBtn":"Guardar","saving":"Guardando...","cancel":"Cancelar","savedH":"¡Guardado!","codeIs":"Código de clase: {code}","codeHow":"Los alumnos abren Zoo del Teclado y escriben este código, o tú se lo asignas a una clase.","assignBtn":"Asignar a una clase","copyBtn":"Copiar enlace","copied":"¡Enlace copiado!","tryBtn":"Probar","editBtn":"Editar","delBtn":"Borrar","delAsk":"¿Borrar esta lección? Su código de clase y sus enlaces dejarán de funcionar.","delSure":"Toca otra vez para borrar","saveErr":"No se ha guardado. Comprueba que el texto solo tenga teclas del teclado y nada personal ni ofensivo.","badChars":"Esto no se puede escribir en Zoo del Teclado: {chars}","tooShort":"Escribe al menos 10 caracteres.","tooLong":"Son más de 1500 caracteres.","noneYet":"Todavía no hay lecciones.","codeH":"¿Tienes un código de tu maestro?","codePh":"Código de clase","openBtn":"Abrir","codeBad":"Ese código no funciona. Compruébalo con tu maestro.","missing":"Esta lección ya no existe. Pide un código nuevo a tu maestro.","myLesson":"La lección de tu maestro","minTest":"Prueba de {n} minutos","passNeed":"Para aprobar: {what}.","passNot":"Todavía no has aprobado. Necesitas {what}. ¡Inténtalo otra vez para romper tu huevo!","passOk":"¡Aprobaste!","pAcc":"{n} % de precisión","pWpm":"{n} palabras por minuto","pAnd":" y ","needRule":"Tu maestro pide {what} en la lección anterior para abrir esta.","ruleNot":"Para abrir la siguiente lección, tu maestro pide {what}. ¡Inténtalo otra vez!","ln_l05":"Palabras de la fila base","ln_l12":"Palabras de la fila de arriba","ln_l17":"Palabras con todas las filas","ln_l18":"Mayúsculas","ln_l19":"Frases","ln_l20":"Carrera de velocidad","ln_l26":"Palabras y números","ln_l27":"¿? y ¡!","ln_l28":"La ñ y las tildes","ln_l29":"Datos de animales","ln_l30":"Al espacio","ln_l31":"Nombres y lugares","ln_l32":"Números en el texto","ln_l33":"Diálogos con comillas","ln_l34":"Párrafo a toda velocidad","ln_l35":"Ciencia","ln_l36":"Una página de historia","ln_l37":"Paso a paso","ln_l38":"Un cuento más largo","ln_l39":"Signos difíciles","ln_l40":"Carrera de expertos","keyboardL":"Teclado","keyboardHint":"Elige el idioma y el teclado con el que escribes."},
  "fr": {"title":"Zoo du Clavier","tag":"Apprends à taper au clavier, une touche à la fois, et fais éclore un animal après chaque leçon.","how1":"Pose tes doigts sur la rangée de repos : Q S D F pour la main gauche, J K L M pour la main droite.","how2":"Touche les petites bosses sur F et J. Elles t'aident à retrouver ta place sans regarder.","how3":"Tape la lettre qui s'allume. Termine la leçon pour casser un œuf et faire éclore un animal.","hello":"Choisis une leçon. Chacune se termine par un œuf à casser !","unit1":"Rangée de repos","unit2":"Rangée du haut","unit3":"Rangée du bas","unit4":"Majuscules et phrases","lessonN":"Leçon {n}","locked":"Termine la leçon d'avant pour ouvrir celle-ci.","pets":"Mes animaux {n}/{total}","petsH":"Mes animaux","petsSub":"Termine des leçons pour en faire éclore d'autres. Avec 3 étoiles, tu gagnes un œuf doré et un animal brillant !","walkWith":"Promène-toi avec moi","walkingNow":"En promenade avec toi","walkOn":"Animal qui se promène : oui","walkOff":"Animal qui se promène : non","soundOn":"Son activé","soundOff":"Son coupé","start":"Appuie sur Espace ou touche Commencer pour démarrer.","startBtn":"Commencer","map":"Leçons","again":"Réessayer","next":"Leçon suivante","lineOf":"Ligne {n} sur {total}","finger":"Utilise ton {finger}.","f_lp":"petit doigt gauche","f_lr":"annulaire gauche","f_lm":"majeur gauche","f_li":"index gauche","f_ri":"index droit","f_rm":"majeur droit","f_rr":"annulaire droit","f_rp":"petit doigt droit","f_th":"pouce","shiftHint":"Pour une majuscule, garde la touche Maj enfoncée avec le petit doigt de l'autre main.","speed":"Vitesse","acc":"Précision","wpm":"{n} mots par minute","pct":"{n} %","doneH":"Leçon terminée !","great":"Super frappe !","keepGoing":"Bien joué ! Recommence pour gagner plus d'étoiles.","eggReady":"Ton œuf est prêt ! Touche-le ou appuie sur une touche pour le casser.","goldEgg":"Un œuf doré pour 3 étoiles !","hatched":"Un nouvel animal est né : {pet} !","shinyPet":"Waouh, un animal brillant : {pet} !","visit":"Coucou ! {pet} vient te dire bonjour !","noKb":"C'est mieux avec un clavier. Tu peux aussi toucher les touches en dessous.","tickTip":"Une erreur ? Pas grave. Trouve la touche allumée et réessaie.","intro_l01":"Pose ton index gauche sur F et ton index droit sur J. Tu sens les petites bosses ?","intro_l02":"Tes majeurs se posent sur D et K, juste à côté de F et J.","intro_l03":"Tes annulaires se posent sur S et L.","intro_l04":"Tes petits doigts se posent sur Q et M. Voilà toute la rangée de repos !","intro_l05":"Maintenant, tape de vrais mots avec les touches de la rangée de repos.","intro_l06":"Tends tes index vers le milieu : G et H. Puis reviens à ta place.","intro_l07":"Monte de D vers E, et de K vers I.","intro_l08":"Monte de F vers R, et de J vers U.","intro_l09":"Monte un peu plus loin avec tes index : T et Y.","intro_l10":"Tes annulaires montent vers Z et O.","intro_l11":"Tes petits doigts montent vers A et P.","intro_l12":"Des mots avec la rangée du haut et la rangée de repos.","intro_l13":"Descends de F vers V, et de J vers la virgule.","intro_l14":"Tes majeurs descendent vers C et le point-virgule. Avec Maj, cette touche fait le point.","intro_l15":"Tes index descendent vers B et N.","intro_l16":"Tes annulaires descendent vers X et les deux-points. Tes petits doigts descendent vers W.","intro_l17":"Des mots avec toutes les rangées.","intro_l18":"Les majuscules : garde Maj enfoncée avec un petit doigt et appuie sur la lettre avec l'autre main.","intro_l19":"Tape des phrases entières avec des majuscules et des points.","intro_l20":"Une course de vitesse ! Tape d'abord avec soin, puis va plus vite.","praise1":"Super !","praise2":"Bravo, quelle frappe !","praise3":"Tu as réussi !","unit5":"Chiffres et symboles","unit6":"Paragraphes","unit7":"Lectures plus longues","intro_l29":"Maintenant, tape des paragraphes entiers. Regarde les mots, pas tes doigts.","intro_l30":"Garde un rythme régulier. Taper sans à-coups, c'est plus rapide que de se précipiter.","intro_l31":"Attention aux majuscules des prénoms et des lieux. Utilise la touche Maj de l'autre main.","intro_l32":"Des chiffres et des mots mélangés. Pense à Maj pour les chiffres, puis reviens à ta place.","intro_l33":"Les guillemets \" sont sur la touche 3, sans Maj. Utilise ton majeur gauche.","intro_l34":"Un paragraphe entier pour la vitesse. Reste détendu et continue.","intro_l35":"Un texte plus long avec des mots difficiles. D'abord la précision, ensuite la vitesse.","intro_l36":"Un petit texte d'histoire. Lis quelques mots en avance pendant que tu tapes.","intro_l37":"Des consignes avec des chiffres, des deux-points et des virgules.","intro_l38":"Une histoire avec des dialogues et de la ponctuation. Prends ton temps pour chaque signe.","intro_l39":"Points-virgules, tirets et apostrophes, tout au même endroit.","intro_l40":"La dernière course. Tape en douceur, corrige vite tes erreurs et finis en beauté.","intro_l21":"Monte de F vers la touche 4, et de J vers la touche 7. Sur ce clavier, les chiffres se tapent avec Maj ! Sans Maj, tu obtiens ' et è.","intro_l22":"Tes index s'étirent vers 5 et 6, au milieu de la rangée des chiffres. N'oublie pas Maj ! Sans Maj, ce sont ( et -.","intro_l23":"Tes majeurs montent vers 3 et 8, toujours avec Maj. Sans Maj, ce sont \" et _.","intro_l24":"Tes annulaires montent vers 2 et 9, avec Maj. Sans Maj, ce sont é et ç.","intro_l25":"Tes petits doigts montent vers 1 et 0, avec Maj. Sans Maj, ce sont & et à.","intro_l26":"Des mots et des chiffres ensemble, comme 3 chats et 12 chiens. Pense à Maj pour les chiffres !","intro_l27":"Le point d'interrogation, c'est Maj et la touche virgule. Le point d'exclamation a sa propre touche, en bas à droite, à côté des deux-points. En français, on met une espace avant ? et !","intro_l28":"Les lettres spéciales : é, è, ç et à sont sur la rangée des chiffres (sans Maj), et ù est à côté de M. Pour â, ê, î, ô, û, appuie sur ^ puis sur la lettre. Pour ë et ï, tape ¨ (Maj et ^) puis la lettre.","testsH":"Tests de frappe","testsSub":"Tape le plus possible avant la fin du temps.","testN":"Test de {n} minutes","testsLocked":"Termine la leçon 12 pour ouvrir les tests de frappe.","bestWpm":"Record : {n} mots/min","intro_test":"Tape le plus possible en {n} minutes. Le chrono démarre à ta première touche. Corrige tes erreurs au fur et à mesure.","timeUp":"Temps écoulé !","liveWpm":"{n} mots/min","trickyH":"M'entraîner sur mes touches difficiles","trickySub":"Les touches que tu rates le plus :","trickyName":"Touches difficiles","intro_tricky":"Voici les touches que tu rates le plus. Va doucement et réussis chacune.","practiceDone":"Entraînement terminé !","ownH":"Tes propres leçons de frappe","ownSub":"Écris une leçon ou un test chronométré avec tes propres mots, puis partage son code de classe ou attribue-le.","writeBtn":"Écrire une leçon","writeH":"Écrire une leçon de frappe","editH":"Modifier ta leçon de frappe","nameL":"Nom (facultatif)","textL":"Ce que les élèves tapent","textHint":"Lettres (avec é è à ç ù et â ê î ô û ë ï), chiffres, espaces et . , ; : ' \" - ! ? ( ). Chaque ligne se tape à son tour. De 10 à 1 500 caractères. Pas de majuscules accentuées.","kindL":"Type","kindLesson":"Leçon (à taper une fois)","kindTest":"Test chronométré","minsL":"Minutes","saveBtn":"Enregistrer","saving":"Enregistrement...","cancel":"Annuler","savedH":"Enregistré !","codeIs":"Code de classe : {code}","codeHow":"Les élèves ouvrent Zoo du Clavier et tapent ce code, ou tu l'attribues à une classe.","assignBtn":"Attribuer à une classe","copyBtn":"Copier le lien","copied":"Lien copié !","tryBtn":"Essayer","editBtn":"Modifier","delBtn":"Supprimer","delAsk":"Supprimer cette leçon ? Son code de classe et ses liens ne marcheront plus.","delSure":"Touche encore pour supprimer","saveErr":"L'enregistrement n'a pas marché. Vérifie que le texte contient seulement des touches du clavier, et rien de personnel ni de méchant.","badChars":"Ces caractères ne se tapent pas dans Zoo du Clavier : {chars}","tooShort":"Tape au moins 10 caractères.","tooLong":"Ça fait plus de 1 500 caractères.","noneYet":"Pas encore de leçons.","codeH":"Tu as un code de ton enseignant ?","codePh":"Code de classe","openBtn":"Ouvrir","codeBad":"Ce code ne marche pas. Vérifie-le avec ton enseignant.","missing":"Cette leçon n'existe plus. Demande un nouveau code à ton enseignant.","myLesson":"La leçon de ton enseignant","minTest":"Test de {n} minutes","passNeed":"Pour réussir : {what}.","passNot":"Pas encore réussi. Il te faut {what}. Réessaie pour casser ton œuf !","passOk":"Réussi !","pAcc":"{n} % de précision","pWpm":"{n} mots par minute","pAnd":" et ","needRule":"Ton enseignant demande {what} à la leçon d'avant pour ouvrir celle-ci.","ruleNot":"Pour ouvrir la leçon suivante, ton enseignant demande {what}. Réessaie celle-ci !","ln_l05":"Mots de la rangée de repos","ln_l12":"Mots de la rangée du haut","ln_l17":"Mots de toutes les rangées","ln_l18":"Majuscules","ln_l19":"Phrases","ln_l20":"Course de vitesse","ln_l26":"Mots et chiffres","ln_l27":"? et !","ln_l28":"é è ç à ù et accents","ln_l29":"Le monde des animaux","ln_l30":"Dans l'espace","ln_l31":"Prénoms et lieux","ln_l32":"Des chiffres dans le texte","ln_l33":"Entre guillemets","ln_l34":"Paragraphe à toute vitesse","ln_l35":"Sciences","ln_l36":"Une page d'histoire","ln_l37":"Mode d'emploi","ln_l38":"Une histoire plus longue","ln_l39":"Ponctuation difficile","ln_l40":"Course d'expert","keyboardL":"Clavier","keyboardHint":"Choisis la langue et le clavier sur lesquels tu tapes."},
  "it": {"title":"Zoo della Tastiera","tag":"Impara a scrivere con la tastiera, un tasto alla volta, e fai nascere un cucciolo dopo ogni lezione.","how1":"Metti le dita sulla fila centrale: A S D F per la mano sinistra, J K L ò per la mano destra.","how2":"Senti i puntini in rilievo sulla F e sulla J? Ti aiutano a tornare al tuo posto senza guardare.","how3":"Premi la lettera illuminata. Finisci la lezione per rompere un uovo e far nascere un cucciolo.","hello":"Scegli una lezione. Alla fine di ognuna c'è un uovo da rompere!","unit1":"Fila centrale","unit2":"Fila in alto","unit3":"Fila in basso","unit4":"Maiuscole e frasi","lessonN":"Lezione {n}","locked":"Finisci la lezione prima per aprire questa.","pets":"I miei cuccioli {n}/{total}","petsH":"I miei cuccioli","petsSub":"Finisci le lezioni per farne nascere altri. Con 3 stelle ottieni un uovo d'oro e un cucciolo scintillante!","walkWith":"Cammina con me","walkingNow":"A spasso con te","walkOn":"Cucciolo a spasso: sì","walkOff":"Cucciolo a spasso: no","soundOn":"Audio acceso","soundOff":"Audio spento","start":"Premi la barra spaziatrice o tocca Inizia per cominciare.","startBtn":"Inizia","map":"Lezioni","again":"Riprova","next":"Lezione successiva","lineOf":"Riga {n} di {total}","finger":"Usa questo dito: {finger}.","f_lp":"mignolo sinistro","f_lr":"anulare sinistro","f_lm":"medio sinistro","f_li":"indice sinistro","f_ri":"indice destro","f_rm":"medio destro","f_rr":"anulare destro","f_rp":"mignolo destro","f_th":"pollice","shiftHint":"Per una lettera maiuscola, tieni premuto Maiusc con il mignolo dell'altra mano.","speed":"Velocità","acc":"Precisione","wpm":"{n} parole al minuto","pct":"{n}%","doneH":"Lezione finita!","great":"Che brava tastiera!","keepGoing":"Bel lavoro! Riprova per avere altre stelle.","eggReady":"Il tuo uovo è pronto! Toccalo o premi un tasto per romperlo.","goldEgg":"Un uovo d'oro per 3 stelle!","hatched":"È nato un nuovo amico: {pet}!","shinyPet":"Wow, un amico scintillante: {pet}!","visit":"Ciao! {pet} viene a salutarti!","noKb":"Ti eserciti meglio con una tastiera. Puoi anche toccare i tasti qui sotto.","tickTip":"Hai sbagliato? Nessun problema. Trova il tasto illuminato e riprova.","intro_l01":"Appoggia l'indice sinistro sulla F e l'indice destro sulla J. Senti i puntini in rilievo?","intro_l02":"I medi stanno sulla D e sulla K, proprio accanto alla F e alla J.","intro_l03":"Gli anulari stanno sulla S e sulla L.","intro_l04":"I mignoli stanno sulla A e sulla ò. Ecco tutta la fila centrale!","intro_l05":"Adesso scrivi parole vere con i tasti della fila centrale.","intro_l06":"Allunga gli indici verso il centro: G e H. Poi torna a casa.","intro_l07":"Sali dalla D alla E, e dalla K alla I.","intro_l08":"Sali dalla F alla R, e dalla J alla U.","intro_l09":"Con gli indici sali un po' in là, fino alla T e alla Y.","intro_l10":"Gli anulari salgono alla W e alla O.","intro_l11":"I mignoli salgono alla Q e alla P.","intro_l12":"Parole con la fila in alto e la fila centrale.","intro_l13":"Scendi dalla F alla V, e dalla J alla M.","intro_l14":"I medi scendono alla C e alla virgola.","intro_l15":"Gli indici scendono alla B e alla N.","intro_l16":"Gli anulari scendono alla X e al punto. I mignoli scendono alla Z.","intro_l17":"Parole che usano tutte le file.","intro_l18":"Le maiuscole: tieni premuto Maiusc con un mignolo e premi la lettera con l'altra mano.","intro_l19":"Scrivi frasi intere con le maiuscole e i punti.","intro_l20":"Una gara di velocità! Prima scrivi con attenzione, poi vai veloce.","praise1":"Super!","praise2":"Bravissimo!","praise3":"Ce l'hai fatta!","unit5":"Numeri e simboli","unit6":"Paragrafi","unit7":"Letture lunghe","intro_l29":"Adesso scrivi paragrafi interi. Guarda le parole, non le dita.","intro_l30":"Tieni un ritmo regolare. Scrivere con calma è meglio che avere fretta.","intro_l31":"Attenzione alle maiuscole di nomi e luoghi. Usa il tasto Maiusc dell'altra mano.","intro_l32":"Numeri e parole mescolati. Sali alla fila dei numeri e poi torna a casa.","intro_l33":"Le virgolette sono Maiusc e il tasto 2. Usa l'anulare sinistro.","intro_l34":"Un paragrafo intero per la velocità. Stai rilassato e vai avanti.","intro_l35":"Un testo lungo con parole difficili. Prima la precisione, poi la velocità.","intro_l36":"Un breve brano di storia. Leggi qualche parola in anticipo mentre scrivi.","intro_l37":"Istruzioni con numeri, due punti e virgole.","intro_l38":"Una storia con dialoghi e punteggiatura. Fai con calma a ogni segno.","intro_l39":"Punti e virgola, trattini e apostrofi, tutti insieme.","intro_l40":"L'ultima gara. Scrivi in modo fluido, correggi in fretta gli errori e chiudi alla grande.","intro_l21":"Sali dalla F al 4, e dalla J al 7. Le altre dita restano a casa.","intro_l22":"Gli indici si allungano fino al 5 e al 6, in mezzo alla fila dei numeri.","intro_l23":"I medi salgono al 3 e all'8.","intro_l24":"Gli anulari salgono al 2 e al 9.","intro_l25":"I mignoli salgono all'1 e allo 0.","intro_l26":"Parole e numeri insieme, come 3 gatti e 12 cani.","intro_l27":"Il punto interrogativo è Maiusc e il tasto dell'apostrofo, vicino allo 0. Il punto esclamativo è Maiusc e 1.","intro_l28":"Le lettere accentate: la è sta a destra della P (con Maiusc fai é), la ò e la à stanno a destra della L, la ì è vicino al tasto dell'apostrofo. Con Maiusc e ò fai ç. L'apostrofo è a destra dello 0, il trattino in basso a destra.","testsH":"Prove di scrittura","testsSub":"Scrivi il più possibile prima che finisca il tempo.","testN":"Prova da {n} minuti","testsLocked":"Finisci la lezione 12 per aprire le prove di scrittura.","bestWpm":"Record: {n} parole/min","intro_test":"Scrivi il più possibile in {n} minuti. Il tempo parte con il primo tasto. Correggi gli errori mentre scrivi.","timeUp":"Tempo scaduto!","liveWpm":"{n} parole/min","trickyH":"Esercita i miei tasti difficili","trickySub":"I tasti che sbagli di più:","trickyName":"Tasti difficili","intro_tricky":"Questi sono i tasti che sbagli di più. Vai piano e premili bene   "ru": {"title":"Клавиатурный зоопарк","tag":"Учись печатать по одной клавише и выводи питомца после каждого урока.","how1":"Поставь пальцы на основной ряд: Ф Ы В А для левой руки, О Л Д Ж для правой.","how2":"Нащупай маленькие бугорки на А и О. Они помогают найти место, не глядя на клавиатуру.","how3":"Нажимай букву, которая светится. Пройди урок, чтобы разбить яйцо и вывести питомца.","hello":"Выбери урок. В конце каждого тебя ждет яйцо!","unit1":"Основной ряд","unit2":"Верхний ряд","unit3":"Нижний ряд","unit4":"Большие буквы и предложения","lessonN":"Урок {n}","locked":"Сначала пройди предыдущий урок, чтобы открыть этот.","pets":"Мои питомцы {n}/{total}","petsH":"Мои питомцы","petsSub":"Проходи уроки, чтобы вывести больше питомцев. Получи 3 звезды, и будет золотое яйцо с блестящим питомцем!","walkWith":"Гуляй со мной","walkingNow":"Гуляет с тобой","walkOn":"Питомец гуляет: да","walkOff":"Питомец гуляет: нет","soundOn":"Звук включен","soundOff":"Звук выключен","start":"Нажми пробел или кнопку «Старт», чтобы начать.","startBtn":"Старт","map":"Уроки","again":"Еще раз","next":"Следующий урок","lineOf":"Строка {n} из {total}","finger":"Нажимай: {finger}.","f_lp":"левый мизинец","f_lr":"левый безымянный палец","f_lm":"левый средний палец","f_li":"левый указательный палец","f_ri":"правый указательный палец","f_rm":"правый средний палец","f_rr":"правый безымянный палец","f_rp":"правый мизинец","f_th":"большой палец","shiftHint":"Для большой буквы зажми Shift мизинцем другой руки.","speed":"Скорость","acc":"Точность","wpm":"{n} слов в минуту","pct":"{n}%","doneH":"Урок пройден!","great":"Отлично печатаешь!","keepGoing":"Хорошо! Попробуй еще раз, чтобы получить больше звезд.","eggReady":"Яйцо готово! Нажми на него или на любую клавишу, чтобы его разбить.","goldEgg":"Золотое яйцо за 3 звезды!","hatched":"Из яйца вылупился питомец: {pet}!","shinyPet":"Блестящий питомец: {pet}!","visit":"Твой питомец {pet} заглянул в гости!","noKb":"Учиться печатать лучше всего на клавиатуре. А еще можно нажимать на клавиши внизу.","tickTip":"Ошибся? Ничего страшного. Найди клавишу, которая светится, и попробуй снова.","intro_l01":"Положи левый указательный палец на А, а правый указательный на О. Нащупай бугорки!","intro_l02":"Средние пальцы лежат на В и Л, рядом с А и О.","intro_l03":"Безымянные пальцы лежат на Ы и Д.","intro_l04":"Мизинцы лежат на Ф и Ж. Это весь основной ряд!","intro_l05":"Теперь печатай настоящие слова клавишами основного ряда.","intro_l06":"Потянись указательными пальцами к середине: П и Р. Потом вернись на место.","intro_l07":"Подними палец с В на У, а с Л на Ш.","intro_l08":"Подними палец с А на К, а с О на Г.","intro_l09":"Потянись указательными пальцами вверх и в сторону: Е и Н.","intro_l10":"Безымянные пальцы тянутся вверх к Ц и Щ.","intro_l11":"Мизинцы тянутся вверх к Й и З.","intro_l12":"Слова с буквами верхнего и основного ряда.","intro_l13":"Опусти палец с А на М, а с О на Ь.","intro_l14":"Средние пальцы тянутся вниз к С и Б.","intro_l15":"Указательные пальцы тянутся вниз к И и Т.","intro_l16":"Безымянные пальцы тянутся вниз к Ч и Ю. Левый мизинец тянется вниз к Я.","intro_l17":"Слова со всех рядов.","intro_l18":"Большие буквы: зажми Shift одним мизинцем, а букву нажми другой рукой.","intro_l19":"Печатай целые предложения с большими буквами и точками. Точка — последняя клавиша нижнего ряда, справа от Ю.","intro_l20":"Гонка на скорость! Сначала печатай аккуратно, потом быстрее.","praise1":"Супер!","praise2":"Здорово печатаешь!","praise3":"Получилось!","unit5":"Цифры и знаки","unit6":"Абзацы","unit7":"Длинные тексты","intro_l29":"Теперь печатай целые абзацы. Смотри на слова, а не на пальцы.","intro_l30":"Держи ровный ритм. Плавно печатать быстрее, чем спешить.","intro_l31":"Следи за большими буквами в именах и названиях. Shift нажимай другой рукой.","intro_l32":"Числа и слова вперемешку. Тянись к ряду цифр и возвращайся на место.","intro_l33":"Кавычки — это Shift и 2. Тире печатай дефисом с пробелами.","intro_l34":"Целый абзац на скорость. Не напрягайся и не останавливайся.","intro_l35":"Длинный текст с трудными словами. Сначала точность, потом скорость.","intro_l36":"Немного истории. Читай на пару слов вперед, пока печатаешь.","intro_l37":"Инструкция с цифрами, двоеточиями и запятыми. Двоеточие — Shift и 6, запятая — Shift и клавиша с точкой.","intro_l38":"Рассказ с диалогами и знаками препинания. Не спеши на каждом знаке.","intro_l39":"Точка с запятой (Shift и 4), тире, дефисы и кавычки в одном тексте.","intro_l40":"Последний забег. Печатай плавно, быстро исправляй ошибки и финишируй красиво!","intro_l21":"Подними палец с А на 4, а с О на 7. Остальные пальцы остаются на месте.","intro_l22":"Указательные пальцы тянутся к 5 и 6, в середину ряда цифр.","intro_l23":"Средние пальцы тянутся вверх к 3 и 8.","intro_l24":"Безымянные пальцы тянутся вверх к 2 и 9.","intro_l25":"Мизинцы тянутся вверх к 1 и 0.","intro_l26":"Слова и числа вместе, например 3 кота и 12 собак.","intro_l27":"Вопросительный знак — это Shift и 7. Восклицательный знак — Shift и 1.","intro_l28":"Новые буквы для правого мизинца: Х и Ъ справа от З, Э справа от Ж. Дефис — справа от 0.","testsH":"Тесты на скорость","testsSub":"Напечатай как можно больше, пока не кончилось время.","testN":"Тест на {n} мин.","testsLocked":"Пройди урок 12, чтобы открыть тесты.","bestWpm":"Рекорд: {n} сл/мин","intro_test":"Напечатай как можно больше за {n} мин. Часы запустятся с первой клавиши. Исправляй ошибки по ходу.","timeUp":"Время вышло!","liveWpm":"{n} сл/мин","trickyH":"Тренируй трудные клавиши","trickySub":"Клавиши, в которых ты чаще ошибаешься:","trickyName":"Трудные клавиши","intro_tricky":"В этих клавишах ты ошибаешься чаще всего. Печатай медленно и правильно.","practiceDone":"Тренировка окончена!","ownH":"Свои уроки печати","ownSub":"Составь урок или тест на время из своих слов, а потом поделись кодом класса или задай его ученикам.","writeBtn":"Составить урок","writeH":"Новый урок печати","editH":"Изменить урок печати","nameL":"Название (необязательно)","textL":"Что печатают ученики","textHint":"Русские буквы, цифры, пробелы и . , ; : \" - ! ? ( ). Строки печатаются по очереди. От 10 до 1500 знаков.","kindL":"Тип","kindLesson":"Урок (напечатать один раз)","kindTest":"Тест на время","minsL":"Минуты","saveBtn":"Сохранить","saving":"Сохраняем...","cancel":"Отмена","savedH":"Сохранено!","codeIs":"Код класса: {code}","codeHow":"Ученики открывают «Клавиатурный зоопарк» и вводят этот код, или ты задаешь урок классу.","assignBtn":"Задать классу","copyBtn":"Копировать ссылку","copied":"Ссылка скопирована!","tryBtn":"Попробовать","editBtn":"Изменить","delBtn":"Удалить","delAsk":"Удалить этот урок? Его код класса и ссылки перестанут работать.","delSure":"Нажми еще раз, чтобы удалить","saveErr":"Не получилось сохранить. Проверь, что в тексте только клавиши с клавиатуры и нет ничего личного или грубого.","badChars":"Эти знаки нельзя напечатать в игре: {chars}","tooShort":"Напиши хотя бы 10 знаков.","tooLong":"Это больше 1500 знаков.","noneYet":"Уроков пока нет.","codeH":"Учитель дал тебе код?","codePh":"Код класса","openBtn":"Открыть","codeBad":"Этот код не работает. Проверь его у учителя.","missing":"Этого урока больше нет. Попроси у учителя новый код.","myLesson":"Урок от учителя","minTest":"Тест на {n} мин.","passNeed":"Чтобы пройти: {what}.","passNot":"Пока не пройдено. Нужно: {what}. Попробуй еще раз, чтобы разбить яйцо!","passOk":"Пройдено!","pAcc":"точность {n}%","pWpm":"{n} слов в минуту","pAnd":" и ","needRule":"Чтобы открыть этот урок, учитель просит в предыдущем: {what}.","ruleNot":"Чтобы открыть следующий урок, учитель просит: {what}. Попробуй еще раз!","ln_l05":"Слова основного ряда","ln_l12":"Слова верхнего ряда","ln_l17":"Слова всех рядов","ln_l18":"Большие буквы","ln_l19":"Предложения","ln_l20":"Гонка на скорость","ln_l26":"Слова и числа","ln_l27":"? и !","ln_l28":"Х, Ъ, Э и дефис","ln_l29":"Факты о животных","ln_l30":"В космос","ln_l31":"Имена и места","ln_l32":"Числа в тексте","ln_l33":"Р   "ja": {"title":"タイピングどうぶつえん","tag":"キーを1つずつおぼえよう。レッスンが終わるたびに、たまごからペットが生まれるよ。","how1":"指をホームポジションにおこう。左手は A S D F、右手は J K L ; だよ。","how2":"F と J には小さなでっぱりがあるよ。見なくてもホームポジションがわかるね。","how3":"光っている文字を打とう。レッスンを終えると、たまごがわれてペットが生まれるよ。","hello":"レッスンをえらんでね。さいごにたまごをわろう！","unit1":"ホームポジション","unit2":"上の列","unit3":"下の列","unit4":"大文字と文","lessonN":"レッスン{n}","locked":"前のレッスンを終えると開くよ。","pets":"わたしのペット {n}/{total}","petsH":"わたしのペット","petsSub":"レッスンを終えてペットをふやそう。星3つで金のたまごと、キラキラのペットがもらえるよ！","walkWith":"いっしょにおさんぽ","walkingNow":"おさんぽ中","walkOn":"おさんぽペット：オン","walkOff":"おさんぽペット：オフ","soundOn":"音あり","soundOff":"音なし","start":"スペースキーをおすか、「スタート」をタップしてはじめよう。","startBtn":"スタート","map":"レッスン","again":"もう一度","next":"次のレッスン","lineOf":"{n}行め（ぜんぶで{total}行）","finger":"{finger}で打とう。","f_lp":"左手の小指","f_lr":"左手のくすり指","f_lm":"左手の中指","f_li":"左手の人さし指","f_ri":"右手の人さし指","f_rm":"右手の中指","f_rr":"右手のくすり指","f_rp":"右手の小指","f_th":"親指","shiftHint":"大文字は、反対の手の小指で Shift をおさえながら打とう。","speed":"スピード","acc":"正確さ","wpm":"1分間に{n}語","pct":"{n}%","doneH":"レッスンクリア！","great":"じょうずに打てたね！","keepGoing":"いいね！もう一度やって星をふやそう。","eggReady":"たまごがかえりそう！タップするか、どれかのキーをおしてわろう。","goldEgg":"星3つで金のたまご！","hatched":"{pet}が生まれたよ！","shinyPet":"キラキラの{pet}！","visit":"{pet}があそびに来たよ！","noKb":"タイピングの練習はキーボードがいちばん。下のキーをタップしてもできるよ。","tickTip":"まちがえてもだいじょうぶ。光っているキーを見つけて、もう一度打とう。","intro_l01":"左手の人さし指を F に、右手の人さし指を J におこう。でっぱりをさわってみてね！","intro_l02":"中指は D と K におこう。F と J のすぐとなりだよ。","intro_l03":"くすり指は S と L におこう。","intro_l04":"小指は A と ; のキー。これでホームポジションのできあがり！","intro_l05":"ホームポジションのキーで、ことばを打ってみよう。","intro_l06":"人さし指をまんなかの G と H にのばそう。打ったらホームにもどってね。","intro_l07":"D から上の E へ、K から上の I へ指をのばそう。","intro_l08":"F から上の R へ、J から上の U へ指をのばそう。","intro_l09":"人さし指で、ななめ上の T と Y にのばそう。","intro_l10":"くすり指で上の W と O にのばそう。","intro_l11":"小指で上の Q と P にのばそう。","intro_l12":"上の列とホームポジションのキーを使ったことばだよ。","intro_l13":"F から下の V へ、J から下の M へ指をのばそう。","intro_l14":"中指で下の C と , のキーにのばそう。","intro_l15":"人さし指で下の B と N にのばそう。","intro_l16":"くすり指で下の X と . のキーに、小指で下の Z にのばそう。","intro_l17":"ぜんぶの列を使ったこと   "zh-Hant": {"title":"打字動物園","tag":"一次學一個鍵，練習打英文字母和單字，每完成一課就孵出一隻寵物！","how1":"把手指放在基準列上：左手放 A S D F，右手放 J K L ;。","how2":"摸摸看 F 和 J 上的小凸點，不用看鍵盤也能找到基準位置。","how3":"打出亮起來的字母。完成這一課，就能敲開蛋、孵出寵物！","hello":"選一課開始吧！每一課最後都有一顆蛋可以敲開！","unit1":"基準列","unit2":"上排","unit3":"下排","unit4":"大寫字母和句子","lessonN":"第 {n} 課","locked":"先完成前一課，才能打開這一課。","pets":"我的寵物 {n}/{total}","petsH":"我的寵物","petsSub":"完成課程就能孵出更多寵物。拿到 3 顆星會得到金蛋和閃亮寵物！","walkWith":"陪我散步","walkingNow":"正在陪你散步","walkOn":"散步寵物：開","walkOff":"散步寵物：關","soundOn":"開啟聲音","soundOff":"關閉聲音","start":"按空白鍵或點「開始」就可以開始。","startBtn":"開始","map":"課程","again":"再試一次","next":"下一課","lineOf":"第 {n} 行，共 {total} 行","finger":"用你的{finger}。","f_lp":"左手小指","f_lr":"左手無名指","f_lm":"左手中指","f_li":"左手食指","f_ri":"右手食指","f_rm":"右手中指","f_rr":"右手無名指","f_rp":"右手小指","f_th":"大拇指","shiftHint":"要打大寫字母，用另一隻手的小指按住 Shift。","speed":"速度","acc":"正確率","wpm":"每分鐘 {n} 個單字","pct":"{n}%","doneH":"完成這一課！","great":"打得真好！","keepGoing":"做得好！再試一次，拿更多星星。","eggReady":"你的蛋準備好了！點一下或按任意鍵把它敲開。","goldEgg":"3 顆星，得到金蛋！","hatched":"你孵出了一隻{pet}！","shinyPet":"閃亮的{pet}！","visit":"你的{pet}來跟你打招呼了！","noKb":"用鍵盤練習打字效果最好。你也可以點下面的按鍵。","tickTip":"打錯了嗎？沒關係。找到亮起來的鍵，再試一次。","intro_l01":"把左手食指放在 F，右手食指放在 J。摸摸看上面的凸點！","intro_l02":"中指放在 D 和 K，就在 F 和 J 旁邊。","intro_l03":"無名指放在 S 和 L。","intro_l04":"小指放在 A 和 ; 鍵。這樣就是完整的基準列了！","intro_l05":"用基準列的按鍵打出真正的英文單字。","intro_l06":"食指往中間伸到 G 和 H，打完再回到基準位置。","intro_l07":"從 D 往上伸到 E，從 K 往上伸到 I。","intro_l08":"從 F 往上伸到 R，從 J 往上伸到 U。","intro_l09":"用食指往上、往旁邊伸到 T 和 Y。","intro_l10":"無名指往上伸到 W 和 O。","intro_l11":"小指往上伸到 Q 和 P。","intro_l12":"練習用上排和基準列打出的英文單字。","intro_l13":"從 F 往下伸到 V，從 J 往下伸到 M。","intro_l14":"中指往下伸到 C 和逗號。","intro_l15":"食指往下伸到 B 和 N。","intro_l16":"無名指往下伸到 X 和句點，小指往下伸到 Z。","intro_l17":"練習用到每一排按鍵的英文單字。","intro_l18":"大寫字母：用一隻手的小指按住 Shift，再用另一隻手按字母。","intro_l19":"打出完整的英文句子，記得用大寫字母和句點。","intro_l20":"速度挑戰！先打正確，再慢慢加快。","praise1":"超棒！","praise2":"打得太厲害了！","praise3":"你做到了！","unit5":"數字和符號","unit6":"段落","unit7":"長篇閱讀","intro_l29":"現在要打整段文字了。眼睛看著文字，不要看手指。","intro_l30":"保持穩定的節奏。打得順比打 oice","view","fox","six","wax","mix","ox","zebra","zip","zoo","zero","lazy","prize","size"],"sentences":["The cat sat on a mat.","My dog likes to run.","We can play in the park.","The sun is hot today.","I see a red bird.","Fish swim in the lake.","She has a big blue kite.","He reads a fun book.","The frog can jump far.","We made a sand castle.","My pet is soft and kind.","The moon is bright at night.","I like green apples.","The bus is yellow.","Bees make sweet honey.","A turtle walks slowly.","The owl hoots at night.","We plant seeds in spring.","Snow is cold and white.","Ducks swim in a row."],"marks":["Can you see the moon?","What a big dog!","Is it time to eat?","We won the game!","Do you like frogs?","Look at that kite!","Where is my hat?","I found a shell!","Can we play now?","Wow, it is snowing!","Who ate the cake?","Run, run, run!"],"apos":["don't","can't","it's","I'm","we're","you're","let's","isn't","she's","that's","ice-cream","well-done","x-ray","red-hot","mid-day","dog's","cat's","two-way","sing-song","won't"],"paras":{"l29":"Octopuses have three hearts and blue blood. They can change color in less than a second to hide from fish that want to eat them. An octopus can also squeeze through any gap that is bigger than its beak.","l30":"The Moon is about a quarter of the size of Earth. It has no air, so there is no wind to blow away the footprints left by astronauts. Those prints could stay there for millions of years.","l31":"Maya and her brother Leo flew from Chicago to Lisbon in June. On Tuesday they rode a yellow tram up a steep hill, and on Friday they visited Aunt Rosa, who lives near the sea in a little blue house.","l32":"Our class planted 24 seeds on March 3. After 10 days, 18 of them had sprouted. By the end of April the tallest plant was 35 centimeters tall, and we picked 7 ripe tomatoes in the first week of June.","l33":"\"Can we go outside?\" asked Sam. \"Not yet,\" said Mr. Park. \"First, finish your page.\" Sam typed as fast as he could. \"Done!\" he called. \"Great,\" said Mr. Park, \"now we can all go out and play.\"","l34":"Every morning the baker wakes up before the sun. She mixes flour, water, salt, and yeast, then waits for the dough to rise. By seven o'clock the shop smells of warm bread, and a line of hungry people is waiting at the door.","l35":"Plants make their own food through a process called photosynthesis. Their leaves take in sunlight, water, and carbon dioxide, and they turn them into sugar and oxygen. The oxygen escapes into the air, which is lucky for every animal that needs to breathe.","l36":"Long before paper, people wrote on clay tablets, animal skins, and strips of bamboo. Around two thousand years ago, papermakers in China learned to mash plant fibers in water, spread the pulp on a screen, and dry it in the sun. Paper was cheap, light, and easy to carry.","l37":"How to make a paper boat: (1) Fold a sheet in half from top to bottom. (2) Fold the top corners down to the middle. (3) Fold the bottom edges up on both sides. (4) Open the middle and flatten it into a square. (5) Pull the sides out gently, and your boat is ready to sail.","l38":"The storm knocked out the lights just as the game began. \"Don't worry,\" said Grandpa, lighting a candle. \"We'll play the old way.\" He found a deck of cards in the drawer, and for three hours nobody missed the screen at all. When the power came back, they kept playing.","l39":"It wasn't easy; the trail was steep, muddy, and full of roots. Still, the hikers kept going - one slow step at a time - until they reached the top. \"Was it worth it?\" asked Jo. Everyone looked at the view and laughed; nobody needed to answer.","l40":"Hummingbirds are the smallest birds in the world, yet they are amazing athletes. Their wings can beat more than 50 times a second, and their hearts can beat over 1,000 times a minute. They can fly forward, backward, and even upside down, and each day they visit hundreds of flowers to drink sweet nectar."}},
