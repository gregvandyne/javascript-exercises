e bus de l'école est jaune.","Les abeilles font du miel.","La tortue marche doucement.","Le hibou hulule la nuit.","On plante des graines au printemps.","La neige est froide et blanche.","Les canards nagent en file."],"marks":["Tu vois la lune ?","Quel gros chien !","C'est l'heure de manger ?","On a gagné le match !","Tu aimes les grenouilles ?","Regarde ce cerf-volant !","Où est mon chapeau ?","J'ai trouvé un coquillage !","On peut jouer maintenant ?","Oh, il neige !","Qui a mangé le gâteau ?","Cours, cours, cours !"],"apos":["l'ami","j'aime","c'est","l'eau","d'accord","qu'il","n'est","aujourd'hui","l'école","s'il","arc-en-ciel","grand-mère","peut-être","chou-fleur","rendez-vous","c'est-à-dire","porte-clé","grand-père"],"paras":{"l29":"Le dauphin dort avec la moitié de son cerveau à la fois. L'autre moitié reste éveillée pour qu'il pense à remonter respirer à la surface. Chaque dauphin a aussi son propre sifflement, un peu comme un prénom, et ses amis l'utilisent pour l'appeler.","l30":"Mars est appelée la planète rouge, car son sol est couvert de poussière pleine de rouille. Une journée sur Mars dure un peu plus de 24 heures, mais une année y dure presque deux de nos années. Le plus grand volcan connu, Olympus Mons, s'y trouve : il est plus de deux fois plus haut que l'Everest.","l31":"Léa et son frère Hugo ont pris le train de Paris à Marseille en juillet. Mardi, ils ont mangé une glace sur le Vieux-Port. Vendredi, ils sont allés voir leur tante Rosa, qui habite à Cassis, dans une petite maison bleue près de la mer.","l32":"Dans notre école, il y a 6 classes et 148 élèves. Chaque midi, la cantine prépare environ 150 repas. Cette année, nous avons lu 320 livres en tout : la classe de Mme Martin en a lu 57, et la nôtre 63 ! Le 21 juin, nous fêterons ça avec 12 gâteaux.","l33":"\"Tu viens goûter ?\" demande Inès. \"J'arrive !\" répond Max. \"Il y a quoi ?\" \"Un gâteau au chocolat, dit Inès. C'est Papi qui l'a fait.\" Max court à la cuisine. \"Miam, il sent trop bon ! On en garde un morceau pour Maman ?\"","l34":"Le mercredi matin, Jules se lève tôt. Il prend son petit déjeuner, se brosse les dents et prépare son sac de sport. Ensuite, il part à vélo avec son cousin jusqu'au gymnase. Là-bas, il retrouve ses copains pour l'entraînement de basket. Le midi, il rentre à la maison, affamé et content.","l35":"L'eau de la Terre voyage sans arrêt. Le soleil chauffe la mer, et une partie de l'eau devient une vapeur invisible qui monte dans le ciel. Là-haut, il fait froid : la vapeur se transforme en minuscules gouttes qui forment les nuages. Quand les gouttes deviennent trop lourdes, elles tombent en pluie ou en neige, puis rejoignent les rivières et la mer.","l36":"Il y a environ 17 000 ans, des hommes ont peint des chevaux, des cerfs et des taureaux sur les murs d'une grotte, dans le sud-ouest de la France. Cette grotte, Lascaux, a été découverte en 1940 par quatre adolescents. Aujourd'hui, pour protéger les vraies peintures, les visiteurs découvrent une copie de la grotte.","l37":"Comment faire pousser un haricot : (1) Mets du coton dans un pot de yaourt. (2) Mouille le coton avec un peu d'eau. (3) Pose 2 ou 3 haricots secs dessus. (4) Place le pot près d'une fenêtre. (5) Ajoute un peu d'eau tous les 2 jours. Au bout d'une semaine environ, une petite tige verte va sortir !","l38":"L'orage a coupé la lumière juste au début du film. \"Pas de panique\", dit Mamie en allumant une bougie. \"On va jouer comme dans le temps.\" Elle sort un jeu de cartes du tiroir, et pendant trois heures, personne ne pense à l'écran. Quand le courant revient, tout le monde crie : \"On finit la partie !\"","l39":"Attention : ce n'est pas facile ! Le chemin monte ; il est glissant, plein de cailloux (et de boue). \"Tu crois qu'on y arrive ?\" demande Zoé. \"Peut-être... ou pas !\" Une fois en haut, ils éclatent de rire : la vue est magnifique ; plus personne n'a mal aux jambes.","l40":"Les abeilles sont de vraies championnes. Pour fabriquer un seul pot de miel, elles doivent butiner des milliers de fleurs. Dans une ruche, il peut y avoir plus de 40 000 abeilles, et chacune a un travail : nettoyer, nourrir les larves, garder l'entrée ou chercher du nectar. Pour montrer où se trouvent les fleurs, elles font même une petite danse !"}},
  "it": {"layout":"it","words":["a","da","fa","la","ha","sa","là","dà","alla","dalla","sala","salsa","gala","falsa","salda","ah","il","lo","le","gli","un","una","di","in","con","per","tra","su","io","tu","lui","lei","noi","voi","sì","no","ma","e","o","se","ci","ne","mio","tuo","suo","è","ape","albero","amico","amica","acqua","anatra","anno","arancia","aereo","bambino","bambina","banana","barca","bello","bianco","blu","bocca","borsa","braccio","bravo","buono","cane","gatto","casa","cielo","cibo","città","colore","cuore","cucina","dente","dito","dolce","dove","erba","estate","fame","fata","festa","fiore","fiume","foglia","forno","fragola","freddo","frutta","fuoco","gallina","gamba","gelato","giallo","gioco","giorno","gioia","gufo","inverno","isola","lago","latte","leone","letto","libro","luna","lupo","mamma","mano","mare","mela","miele","mondo","naso","neve","nido","noce","notte","nuvola","occhio","oggi","orso","oro","pane","papà","pera","pesce","piede","pioggia","pizza","ponte","porta","prato","rana","re","rosa","rosso","ruota","sale","sasso","scuola","sedia","sole","sorella","stella","strada","tavolo","tazza","tè","testa","topo","torta","treno","uovo","uva","vaso","vento","verde","zaino","zebra","zio","zia","zucca","zucchero","nonno","nonna","caffè","però","può","così","lunedì","metà","tartaruga","farfalla","cavallo","mucca","maiale","pecora","capra","coniglio","volpe","tigre","balena","delfino","polpo","granchio","lumaca","riccio","cappello","scarpa","maglia","gonna","palla","bici","kiwi","yogurt"],"sentences":["Il gatto dorme sul letto.","Il mio cane ama correre.","Giochiamo nel giardino.","Oggi il sole è caldo.","Vedo un uccellino rosso.","I pesci nuotano nel lago.","Lei ha un grande aquilone blu.","Lui legge un libro buffo.","La rana salta lontano.","Facciamo un castello di sabbia.","Il mio coniglio è morbido.","Di notte la luna brilla.","Mi piacciono le mele verdi.","Lo scuolabus è giallo.","Le api fanno il miele.","La tartaruga cammina piano.","Il gufo canta di notte.","In primavera piantiamo i semi.","La neve è fredda e bianca.","Le anatre nuotano in fila."],"marks":["Vedi la luna?","Che cane grande!","Si mangia adesso?","Abbiamo vinto la partita!","Ti piacciono le rane?","Guarda che aquilone!","Dov'è il mio cappello?","Ho trovato una conchiglia!","Possiamo giocare adesso?","Evviva, nevica!","Chi ha mangiato la torta?","Corri, corri, corri!"],"apos":["l'amico","c'è","dov'è","l'acqua","un'ape","d'estate","l'albero","com'è","quest'anno","anch'io","l'uovo","dell'uva","un po'","nord-est","sud-ovest","all'aperto"],"paras":{"l29":"Nessun animale di terra è grande come l'elefante africano. Con la proboscide può respirare, annusare, bere e perfino raccogliere oggetti piccolissimi. Gli elefanti parlano tra loro anche con suoni così bassi che le nostre orecchie non riescono a sentirli.","l30":"Il Sole è una stella, e la sua luce impiega circa 8 minuti per arrivare fino a noi. Saturno è famoso per i suoi anelli, fatti di ghiaccio e di roccia. Giove è il gigante del sistema solare: dentro potrebbero starci oltre mille pianeti grandi come la Terra!","l31":"Giulia e suo fratello Marco sono andati in treno da Milano a Napoli ad agosto. Martedì hanno mangiato una pizza vicino al porto, e venerdì sono saliti sul Vesuvio con la zia Anna, che abita a Sorrento in una casetta gialla con vista sul mare.","l32":"In una settimana la nostra classe ha raccolto 36 tappi, 14 bottiglie e 9 vecchi quaderni da riciclare. Lunedì eravamo in 22, ma 3 compagni avevano l'influenza. Il 15 marzo porteremo tutto al centro di raccolta, che apre alle 8 e chiude alle 19. Il nostro obiettivo: 100 tappi entro maggio!","l33":"\"Vieni a fare merenda?\" chiede Sara. \"Arrivo!\" risponde Luca. \"Che cosa c'è?\" \"Una torta al cioccolato\", dice Sara. \"L'ha fatta il nonno.\" Luca corre in cucina. \"Che profumo! Ne teniamo una fetta per la mamma?\"","l34":"Il sabato mattina andiamo al mercato con il nonno. Compriamo pane fresco, pomodori, formaggio e una cassetta di pesche. Il nonno conosce tutti e si ferma a chiacchierare a ogni banco. Io porto la borsa e conto i soldi del resto. Quando torniamo a casa, la nonna ha già preparato il pranzo.","l35":"L'acqua della Terra non sta mai ferma. Il sole scalda il mare e una parte dell'acqua diventa vapore, che sale in cielo senza che lo vediamo. In alto fa freddo, così il vapore si trasforma in goccioline che formano le nuvole. Quando le gocce diventano pesanti, cadono come pioggia o neve e tornano nei fiumi e nel mare.","l36":"Nel 79 dopo Cristo il Vesuvio, un vulcano vicino a Napoli, eruttò all'improvviso. La città di Pompei fu coperta da cenere e pietre e restò nascosta per secoli. Quando gli archeologi iniziarono a scavare, trovarono strade, case, forni e perfino scritte sui muri. Oggi visitare Pompei è come fare un viaggio nel tempo.","l37":"Come far crescere un fagiolo: (1) Metti del cotone in un vasetto dello yogurt. (2) Bagna il cotone con un po' d'acqua. (3) Appoggia sopra 2 o 3 fagioli secchi. (4) Metti il vasetto vicino a una finestra. (5) Aggiungi un po' d'acqua ogni 2 giorni. Dopo circa una settimana spunterà una piccola pianta verde!","l38":"Durante il temporale la luce se ne andò proprio all'inizio del film. \"Niente paura\", disse la nonna accendendo una candela. \"Giochiamo come una volta.\" Tirò fuori un mazzo di carte dal cassetto e per tre ore nessuno pensò alla televisione. Quando la corrente tornò, tutti gridarono: \"Finiamo la partita!\"","l39":"Non era facile: il sentiero era ripido, fangoso e pieno di radici; eppure i ragazzi andavano avanti - un passo alla volta - verso la cima. \"Dov'è la fine? Manca un po'?\" chiese Leo. Quando arrivarono, guardarono il panorama e risero; nessuno ebbe bisogno di dire altro. Perché? La risposta era lì, davanti a loro!","l40":"Le api sono vere campionesse. Per produrre un solo vasetto di miele devono visitare migliaia di fiori. In un alveare possono vivere oltre 40.000 api, e ognuna ha un compito: pulire, nutrire le larve, fare la guardia o cercare il nettare. Per indicare alle compagne dove sono i fiori, fanno perfino una piccola danza!"}},
  "pt": {"layout":"pt","words":["a","as","sal","sala","salas","fada","fadas","asa","asas","gala","salada","fala","falas","falha","da","das","água","amigo","amiga","árvore","azul","avião","abelha","avó","avô","banho","barco","beijo","bola","boca","braço","bom","cabra","cama","caminho","campo","canção","casa","céu","cinco","carro","cor","comer","coelho","correr","dedo","dia","dez","dois","doce","ele","ela","em","escola","estrela","flor","foca","fruta","fogo","gato","balão","boné","grande","minhoca","sorvete","irmão","irmã","folha","oi","hoje","ovo","ilha","jardim","jogo","brincar","suco","lago","lápis","leite","leão","livro","limão","chuva","lua","luz","mãe","milho","mão","maçã","manhã","mar","mesa","meu","mel","macaco","música","nariz","menino","menina","noite","nuvem","novo","olho","urso","outono","pai","pássaro","pão","papel","parque","pato","pequeno","cachorro","peixe","pé","abacaxi","praia","frango","porta","queijo","sapo","rato","presente","relógio","rio","vermelho","rosa","pular","senhor","sim","cadeira","sol","sopa","sono","tarde","xícara","chá","terra","tigre","tio","trem","três","você","um","uva","vaca","copo","verde","vento","eu","sapato","raposa","kiwi","quilo","zebra","xadrez","quente","frio","feliz","bolo","pipa","coração","nadar","cantar","dançar","verão","inverno","aranha","ano","já","lá","aqui","mamãe","papai","bebê","sofá","café","web","pinguim"],"sentences":["O gato dorme na cama.","Meu cachorro corre no parque.","Hoje o sol está forte.","Vejo um pássaro vermelho.","Os peixes nadam no rio.","Ela tem uma pipa azul.","Ele lê um livro divertido.","O sapo pula muito longe.","Fizemos um castelo de areia.","Meu bichinho é fofo e bonzinho.","A lua brilha à noite.","Eu gosto de maçã verde.","O ônibus escolar é amarelo.","As abelhas fazem mel doce.","A tartaruga anda devagar.","A coruja pia de noite.","Na primavera plantamos sementes.","A neve é fria e branca.","Os patinhos nadam em fila.","Amanhã vamos à praia."],"marks":["Você está vendo a lua?","Que cachorro grande!","Já está na hora de comer?","Ganhamos o jogo!","Você gosta de sapos?","Olha aquela pipa!","Cadê meu boné?","Achei uma concha!","Podemos brincar agora?","Uau, está nevando!","Quem comeu o bolo?","Corre, corre, corre!"],"apos":["guarda-chuva","beija-flor","arco-íris","couve-flor","segunda-feira","quarta-feira","sexta-feira","bem-vindo","bem-te-vi","guarda-roupa","peixe-boi","tatu-bola","louva-a-deus","porta-lápis","mico-leão","água-viva"],"paras":{"l29":"O bicho-preguiça vive pendurado nas árvores das florestas da América do Sul e da América Central. Ele se move tão devagar que algas verdes crescem no seu pelo, e isso ajuda a escondê-lo entre as folhas. Ele desce da árvore só mais ou menos uma vez por semana para fazer cocô.","l30":"Júpiter é o maior planeta do Sistema Solar. Ele é feito quase todo de gás e não tem um chão onde dê para pisar. Lá existe uma tempestade gigante, a Grande Mancha Vermelha, que é maior do que a Terra inteira e já dura centenas de anos.","l31":"Beatriz e o primo Rafael foram de Recife para Lisboa nas férias de julho. Na segunda-feira, andaram de bonde amarelo pelas ladeiras de Alfama. No sábado, pegaram um trem para o Porto e visitaram a tia Helena, que mora perto do rio Douro.","l32":"Na nossa turma há 28 alunos. No dia 5 de abril, plantamos 40 sementes de feijão em copinhos. Depois de 6 dias, 33 já tinham brotado. Em maio, o pé mais alto media 47 centímetros e tinha 9 folhas. Agora queremos plantar 60 sementes de milho!","l33":"- Podemos ir para o pátio? - perguntou Ana. - Ainda não - respondeu a professora Lúcia. - Primeiro termine a sua página. Ana digitou o mais rápido que pôde. - Pronto! - gritou ela. - Muito bem - disse a professora. - Agora todo mundo pode ir brincar.","l34":"O despertador toca às seis e meia. Eu escovo os dentes, troco de roupa e tomo café com leite, pão e uma banana. Depois arrumo a mochila: cadernos, estojo, lanche e uma garrafinha de água. Minha irmã e eu vamos juntas para a escola e sempre damos bom-dia ao porteiro.","l35":"As plantas fabricam o próprio alimento. As folhas usam a luz do sol, a água que vem das raízes e um gás do ar chamado gás carbônico. Com isso, elas produzem açúcar para crescer e soltam oxigênio no ar. É esse oxigênio que os animais e as pessoas respiram todos os dias.","l36":"Muito antes dos carros, as pessoas viajavam pelo mar em barcos a vela. Em 1500, uma frota portuguesa comandada por Pedro Álvares Cabral chegou ao litoral do que hoje é a Bahia. Mas essas terras já tinham dono: milhões de indígenas, de muitos povos diferentes, viviam ali havia milhares de anos.","l37":"Como fazer um barquinho de papel: (1) Dobre uma folha ao meio, de cima para baixo. (2) Dobre os cantos de cima até o meio. (3) Dobre as abas de baixo para cima, dos dois lados. (4) Abra o meio e achate, formando um quadrado. (5) Puxe as pontas com cuidado: seu barquinho está pronto para navegar!","l38":"Naquela tarde, Pedro achou um pintinho perdido perto do rio. - Cadê a sua mãe? - perguntou ele. O pintinho só fez piu. Pedro colocou o bichinho no boné, com todo o cuidado, e foi andando pela margem até ouvir um cacarejo aflito. Era uma galinha procurando no meio do capim. Quando viu o pintinho, ela correu até ele. Pedro sorriu: foi o melhor passeio das férias.","l39":"Que dia! Primeiro choveu; depois o sol apareceu. E sabe o que aconteceu? Vimos um arco-íris (enorme, brilhante e duplo) sobre o morro. - Você viu? - perguntou Sara. - Claro que vi! - respondeu Paulo. Em casa, anotamos tudo: a hora, o lugar e as cores. Até a vovó, que é sabida, disse: nunca vi coisa igual!","l40":"A onça-pintada é o maior felino das Américas. Ela vive em lugares como a Amazônia e o Pantanal, e cada uma tem um desenho de pintas só seu, como se fosse uma impressão digital. Ao contrário de muitos gatos, a onça gosta de água: nada muito bem e caça até jacarés nos rios. Sua mordida é uma das mais fortes entre todos os felinos do mundo."}},

der vannacht.","Ik hou van groene appels.","De schoolbus is geel.","Bijen maken zoete honing.","De schildpad loopt langzaam.","De uil roept in de nacht.","In de lente zaaien we bloemen.","Sneeuw is koud en wit.","Eendjes zwemmen op een rij."],"marks":["Zie jij de maan?","Wat een grote hond!","Is het al tijd om te eten?","We hebben gewonnen!","Hou jij van kikkers?","Kijk eens naar die vlieger!","Waar is mijn muts?","Ik heb een schelp gevonden!","Mogen we nu spelen?","Joepie, het sneeuwt!","Wie heeft de taart opgegeten?","Rennen, rennen, rennen!"],"apos":["auto's","foto's","oma's","opa's","baby's","zo'n","'s nachts","'s ochtends","m'n fiets","pizza's","e-mail","t-shirt","zee-egel","auto-ongeluk","na-apen","zee-eend","x-benen","radio-omroep"],"paras":{"l29":"Een octopus heeft drie harten en blauw bloed. Hij kan in een flits van kleur veranderen, zodat vissen hem niet zien. Omdat hij geen botten heeft, kan hij door heel kleine gaatjes kruipen. Een octopus is ook slim: hij kan potjes openmaken en de weg in een doolhof leren.","l30":"Saturnus is de planeet met de mooiste ringen. Die ringen zijn gemaakt van ijs, stof en stukjes steen. Sommige stukjes zijn zo klein als een zandkorrel, andere zo groot als een huis. Saturnus is zo licht voor zijn grootte dat hij in een heel grote badkuip zou blijven drijven.","l31":"Sanne en haar broer Daan gaan in juli met de trein van Utrecht naar Parijs. Op dinsdag klimmen ze de Eiffeltoren op, en op vrijdag varen ze met een boot over de Seine. Daarna rijden ze door naar tante Ria, die in een klein huisje vlak bij de zee in Bretagne woont.","l32":"In onze klas zitten 27 kinderen. Op 6 april hebben we 40 zonnebloempitten geplant. Na 8 dagen waren er 33 opgekomen. In augustus was de grootste zonnebloem 2 meter en 10 centimeter hoog, en we hebben 150 pitten bewaard voor volgend jaar.","l33":"\"Mag ik meedoen?\" vroeg Bram. \"Natuurlijk,\" zei Noor, \"maar eerst moet je de regels leren.\" Bram knikte. \"Ik let heel goed op!\" Noor lachte. \"Dan mag jij beginnen.\" Na drie rondjes riep Bram: \"Ik heb gewonnen!\" \"Goed gedaan,\" zei Noor, \"morgen spelen we weer.\"","l34":"Elke ochtend gaat om zeven uur de wekker. Lotte rekt zich uit, poetst haar tanden en kleedt zich aan. In de keuken eet ze een boterham met kaas en drinkt ze een glas melk. Dan pakt ze haar tas, doet haar jas aan en fietst naar school. Onderweg zwaait ze naar de bakker op de hoek.","l35":"Water is altijd onderweg. De zon verwarmt de zee en de meren, en een deel van het water verdampt. De onzichtbare waterdamp stijgt op, koelt af en vormt wolken van piepkleine druppeltjes. Worden die druppels te zwaar, dan vallen ze naar beneden als regen of sneeuw. Via sloten en rivieren stroomt het water uiteindelijk weer terug naar zee.","l36":"Een groot deel van Nederland ligt onder de zeespiegel. Al heel lang geleden bouwden mensen dijken om het water tegen te houden. Later gebruikten ze windmolens om water uit de polders weg te pompen. Bij Kinderdijk staan nog 19 oude molens. Sinds 1997 staan ze op de lijst van werelderfgoed.","l37":"Zo maak je een papieren bootje: 1. Vouw een vel dubbel, van boven naar beneden. 2. Vouw de bovenste hoeken naar het midden. 3. Vouw de onderste randen aan beide kanten omhoog. 4. Maak het midden open en druk het plat tot een vierkant. 5. Trek de zijkanten voorzichtig uit elkaar. Klaar, je bootje kan varen!","l38":"Midden in het spel ging opeens het licht uit. Buiten onweerde het hard. \"Niet bang zijn,\" zei opa, en hij stak een kaars aan. \"We spelen gewoon zoals vroeger.\" Hij haalde een oud spel kaarten uit de la, en al snel lachte iedereen zo hard dat ze de donder bijna niet hoorden. Toen de stroom terugkwam, wilde niemand stoppen. \"Nog een potje!\" riep Fleur.","l39":"Het pad was steil, modderig en vol wortels; toch liepen we door. 's Middags zei Tim: \"Zo'n tocht doe ik nooit meer!\" Maar stap voor stap - soms heel langzaam - kwamen we boven. Was het de moeite waard? Iedereen keek naar het dal, de meren en de auto's in de verte (zo klein als mieren) en lachte.","l40":"Kolibries zijn de kleinste vogels ter wereld, maar ze zijn echte topsporters. Hun vleugels kunnen meer dan 50 keer per seconde slaan, en hun hart kan meer dan 1.000 keer per minuut kloppen. Ze kunnen vooruit, achteruit en zelfs ondersteboven vliegen. Elke dag bezoeken ze honderden bloemen om zoete nectar te drinken."}},

рячется в лесу.","Я люблю читать сказки.","Сестра слушает музыку.","Ночью видно луну.","Друзья играют в мяч.","Бабушка вяжет шарф.","Летом мы купаемся в реке.","Мой щенок умеет сидеть.","Цветы растут в саду.","Завтра будет праздник."],"marks":["Ты видишь луну?","Какая большая собака!","Пора обедать?","Мы победили!","Где мой мяч?","Ура, каникулы!","Кто там стучит?","Смотри, радуга!","Хочешь пирог?","Как здорово!","Ты умеешь плавать?","Привет, друг!"],"apos":["кто-то","что-то","где-то","как-то","когда-то","куда-то","по-моему","по-русски","по-новому","ну-ка","давай-ка","чуть-чуть","еле-еле","тук-тук","ха-ха","крест-накрест"],"paras":{"l29":"У жирафа в шее всего семь позвонков, столько же, сколько у человека. Просто каждый позвонок у него очень длинный. Язык жирафа бывает длиной почти полметра. Им он ловко срывает листья с колючих веток акации и не колется.","l30":"Сатурн - шестая планета от Солнца. Его кольца состоят из кусочков льда и камня: от крошечных пылинок до глыб размером с дом. Сатурн очень легкий для своего размера, поэтому в огромной ванне с водой он бы не утонул. Сутки на Сатурне длятся всего около 10 с половиной часов.","l31":"Летом Маша и Петя поехали с папой из Москвы в Казань. В понедельник они гуляли по Кремлю, а в среду катались на теплоходе по Волге. Потом они заехали в Самару, где их ждала бабушка Нина, и все вместе пекли пироги с яблоками.","l32":"В нашем классе 28 учеников. В сентябре мы посадили 15 луковиц тюльпанов, а весной расцвели 12 цветков. Каждый день 2 дежурных поливали клумбу. К 9 мая мы сделали 40 фотографий и повесили 6 самых лучших на стену в коридоре.","l33":"\"Можно мы пойдем гулять?\" - спросила Оля. \"Сначала доделай задачу\", - ответила мама. Оля быстро решила пример. \"Готово!\" - крикнула она. \"Молодец\", - улыбнулась мама. - \"Бери куртку и шапку, и пойдем вместе.\"","l34":"Утром в нашем доме шумно. Папа варит кашу, мама ищет ключи, а кот сидит у миски и ждет завтрак. Я быстро умываюсь, чищу зубы, надеваю форму и собираю рюкзак. В восемь часов мы все выходим на улицу и спешим в школу.","l35":"Вода может быть жидкой, может превратиться в пар, а на морозе становится льдом. Летом солнце нагревает лужи и реки, и вода незаметно испаряется. Высоко в небе пар остывает и собирается в облака из крошечных капель. Когда капли становятся тяжелыми, они падают вниз дождем.","l36":"Почти тысячу лет назад в Новгороде люди писали письма на бересте, то есть на коре березы. Буквы выдавливали острой палочкой, которую называли писалом. Ученые нашли в земле больше тысячи таких грамот. Среди них есть даже записи мальчика Онфима, который учил буквы и рисовал смешные картинки.","l37":"Как вырастить фасоль: 1) Положи в стакан мокрую вату. 2) Положи на вату 3 фасолины. 3) Поставь стакан на светлое окно. 4) Каждый день проверяй, чтобы вата была влажной. 5) Через 5-7 дней появятся ростки: зарисуй их в тетрадь!","l38":"Вечером вдруг погас свет. \"Не бойся\", - сказал дедушка и зажег свечу. - \"Сыграем в шашки, как в детстве?\" Мы сели за стол у окна. За стеклом шумел дождь, а мы играли партию за партией. Дедушка рассказывал смешные истории, и я хохотал до слез. Когда свет снова включили, никто даже не встал из-за стола.","l39":"Было трудно; тропа шла вверх, камни скользили, а рюкзак тянул назад. И все же мы шли - шаг за шагом, не спеша. \"Далеко еще?\" - спросил Ваня. \"Нет-нет, почти пришли!\" - ответил вожатый. Наверху мы увидели озеро: синее, тихое, огромное.","l40":"Колибри - самые маленькие птицы на свете. Их крылья взмахивают до 80 раз в секунду, поэтому в полете слышно тихое жужжание. Колибри умеют летать вперед, назад и даже висеть на одном месте. За день такая птичка облетает сотни цветков и пьет сладкий нектар, а ночью крепко спит, чтобы сберечь силы."}},

gohann wo tabemashita.","yoru ni hoshi ga hikaru.","umi de kai wo hiroimashita.","tori ga uta wo utatte iru.","ookina ki no kage de yasumu.","ame no hi ha honn wo yomu.","natsu ha suika ga oishii.","fuyu ni yuki ga furimasu.","akai kingyo ga oyoide iru.","otouto ha ashi ga hayai.","aki ha momiji ga kirei desu.","tsuki ga marukute akarui."],"marks":["neko ha doko ni iru no?","sugoi, ookina inu da!","mou gohann no jikann?","yatta, katta yo!","kaeru ha suki?","mite, tako ga tonde iru!","boushi ha doko kana?","kirei na kai wo mitsuketa!","ima asonde mo ii?","waa, yuki ga futte iru!","dare ga okashi wo tabeta no?","hashire, hashire, hashire!"],"apos":["ke-ki","su-pa-","ju-su","su-pu","bo-ru","ka-do","pu-ru","no-to","ra-menn","chi-zu","aisuku-rimu","sa-kka-","to-suto","pi-mann","ka-tenn","ko-hi-"],"paras":{"l29":"kirinn no kubi ha totemo nagai desu ga, kubi no hone no kazu ha hito to onaji 7 ko desu. kirinn ha takai ki no ha wo, nagai bero de makitotte tabemasu. sono bero no nagasa ha yaku 50 senchi mo arimasu. nemuru jikann ha totemo mijikaku, 1 nichi ni sukoshi shika nemasenn.","l30":"tsuki ha chikyuu no mawari wo yaku 27 nichi de isshuu shimasu. tsuki ni ha kuuki ga nai node, kaze mo fukazu, ame mo furimasenn. sono tame, uchuu hikoushi ga nokoshita ashiato ha, nagai aida kiezu ni nokotte iru to kangaerarete imasu.","l31":"yuka to otouto no haruto ha, natsuyasumi ni toukyou kara hokkaidou he ikimashita. sapporo de ha oishii ra-menn wo tabe, otaru de ha furui unga no soba wo arukimashita. saigo no hi ni ha, hakodate ni sumu obaachann no ie ni tomarimashita.","l32":"kurasu de 24 ko no tane wo 4 gatsu 10 ka ni makimashita. 10 ka go ni ha, 18 ko kara me ga demashita. 6 gatsu no owari ni ha, ichiban takai nae ga 35 senchi ni nari, hajimete 7 ko no mini tomato wo shuukaku shimashita.","l33":"\"soto de asonde mo ii?\" to sora ga kikimashita. \"mada da yo,\" to sensei ha iimashita. \"saki ni kono pe-ji wo owarasete ne.\" sora ha isoide taipu shimashita. \"dekita!\" \"yoku ganbatta ne. jaa, soto ni ikou.\"","l34":"maiasa, pannya no obasann ha taiyou yori hayaku okimasu. komugiko to mizu to shio wo mazete, kiji ga fukuramu no wo machimasu. 7 ji ni naru to, mise ha atatakai pann no nioi de ippai ni nari, mise no mae ni ha onaka wo sukaseta hitotachi ga narande imasu.","l35":"shokubutsu ha hikari wo tsukatte, jibunn de eiyou wo tsukurimasu. kore wo kougousei to iimasu. ha ga taiyou no hikari to mizu to nisanka tanso wo tori ire, toubunn to sanso wo tsukuru no desu. sanso ha kuuki no naka ni dete, watashitachi ga iki wo suru no ni yakudachimasu.","l36":"kami ga dekiru mae, hitobito ha nendo no ita ya doubutsu no kawa, take no fuda ni moji wo kaite imashita. yaku 2000 nenn mae no chuugoku de, shokubutsu no seni wo mizu no naka de bara bara ni hogushi, usuku hiroge, hi ni hoshite kawakasu kami no tsukurikata ga hiromarimashita. kami ha yasukute karuku, hakobi yasui mono deshita.","l37":"kami no fune no orikata: (1) kami wo yoko ni hanbunn ni orimasu. (2) ue no kado wo chuushinn ni mukete orimasu. (3) hashi no fuchi wo ryougawa tomo ue ni orimasu. (4) soko kara hiraite, shikaku ni tatamimasu. (5) ryouhashi wo yukkuri hipparu to, fune no dekiagari desu.","l38":"arashi no yoru, kyuu ni ie no denki ga kiemashita. \"daijoubu da yo,\" to ojiichann ga rousoku ni hi wo tsukemashita. \"mukashi no asobi wo shiyou.\" hikidashi kara karuta wo dashite, kazoku zenninn de 3 jikann mo asobimashita. denki ga tsuite mo, dare mo yameyou to ha iimasenn deshita.","l39":"\"ohayou!\" to, ane ga genki ni iimashita. ke-ki, aisuku-rimu, ju-su: katakana no nobasu oto ha, 0 no tonari no - de utsu yo. ten ha , de, maru ha . de utemasu. \"muzukashii?\" \"daijoubu, nareru to kantann da yo!\"","l40":"nihonn ni ha 4 tsu no ookina shima ga arimasu: hokkaidou, honshuu, shikoku, kyuushuu desu. ichiban takai yama ha fujisann de, takasa ha 3776 me-toru desu. fuyu ni ha yama no ue ga yuki de shiroku nari, hareta hi ni ha toukyou kara mo miemasu. mukashi kara ooku no hito ga kono yama wo e ni kaki, uta ni utatte kimashita."}},
  "ar": {"layout":"ar","words":["بيت","بنت","سمك","كتاب","باب","نبات","شمس","ملك","سبت","تين","كلب","سكين","لبن","اسم","ابن","بنات","نمل","بستان","سلم","مكتب","كتب","شباك","مال","ماما","بابا","سنة","قط","ولد","قلم","قمر","نجم","بحر","شجرة","زهرة","طير","حصان","بقرة","دب","فيل","قرد","نمر","ثعلب","سلحفاة","ضفدع","فراشة","نحلة","نملة","تفاح","موز","عنب","فراولة","خبز","حليب","جبن","ماء","عصير","كعكة","بيضة","رز","حساء","كرة","دمية","لعبة","لون","وردي","بني","برتقالي","رمادي","كبير","صغير","حار","بارد","جميل","جيد","سعيد","جديد","قديم","سريع","بطيء","طويل","قصير","نظيف","لطيف","قوي","هو","هي","نحن","نعم","لا","ما","من","متى","كيف","هنا","هناك","يوم","ليل","صباح","مساء","شهر","ساعة","مطر","ثلج","ريح","غيم","صيف","شتاء","ربيع","خريف","يد","رجل","عين","فم","شعر","قلب","صف","معلم","مدرسة","دفتر","حقيبة","رسم","صديق","صديقة","عائلة","جد","جدة","عم","عمة","خال","خالة","طفل","سيارة","حافلة","قطار","طائرة","دراجة","قارب","طريق","مدينة","قرية","حديقة","شاطئ","جبل","نهر","حقل","طعام","يلعب","يكتب","يرسم","ينام","يجري","يقفز","يحب","يرى","يسبح","يغني","يضحك","يمشي","يشرب","شكرا","مرحبا","سلام","كوب","صحن","ملعقة","شوكة","سرير","وسادة","قفاز","قبعة","معطف","قميص","جورب","مظلة","مفتاح","هاتف","حاسوب","رقم","حرف","كلمة","قصة","حلم","نور","ظلام","صوت","هدية","فرح","بسمة","حلوى","بطة","دجاجة","ديك","خروف","جمل","غزال","حوت","دلفين","نسر","ببغاء","بومة","بطريق","زرافة","حمار","نجمة","سماء","غابة","كهف","عش","ورقة","جزر","خيار","ليمون","بطيخ","تمر","عسل","سكر","ملح","شاي","ظبي","ظل","طاووس","سؤال","لؤلؤة"],"sentences":["القط ينام على السرير.","الكلب يحب الجري.","نلعب في الحديقة.","الشمس حارة اليوم.","أرى عصفورا أحمر.","أمي تخبز كعكة.","أبي يقرأ كتابا.","عندي سمكة ذهبية صغيرة.","أخي يرسم فيلا.","نذهب إلى المدرسة معا.","في الشتاء ينزل المطر.","البطة تسبح في البحيرة.","الثعلب يعيش في الغابة.","أحب قراءة القصص.","أختي تغني أغنية جميلة.","في الليل نرى النجوم.","يلعب الأصدقاء بالكرة.","جدتي تحيك وشاحا.","في الصيف نذهب إلى البحر.","الأزهار تنمو في البستان.","غدا عندنا حفلة في الصف."],"marks":["هل ترى القمر؟","يا له من كلب كبير!","هل حان وقت الأكل؟","فزنا في المباراة!","أين كرتي؟","هيا إلى العطلة!","من يطرق الباب؟","انظر، قوس قزح!","هل تريد كعكة؟","ما أجمل الأزهار!","هل تعرف السباحة؟","مرحبا يا صديقي!"],"apos":["ذهب","ذئب","أرنب","أسد","إبرة","آلة","أذن","إصبع","ظبي","ظل","زجاج","طاووس","دجاج","جزر","مظلة","ذيل"],"paras":{"l29":"الجمل حيوان صبور يعيش في الصحراء. وهو يخزن الدهون في سنامه، لا الماء كما يظن كثير من الناس. يستطيع الجمل أن يشرب كمية كبيرة من الماء في دقائق قليلة، وله رموش طويلة تحمي عينيه من الرمال، ويستطيع أن يغلق أنفه عند هبوب العاصفة.","l30":"المشتري أكبر كوكب في مجموعتنا الشمسية، ويمكن أن يتسع لأكثر من 1300 كوكب بحجم الأرض. وفيه بقعة حمراء كبيرة، هي عاصفة عملاقة يرصدها العلماء منذ أكثر من 150 سنة. أما اليوم على المشتري فقصير جدا، إذ يدور حول نفسه في نحو 10 ساعات فقط.","l31":"سافرت ليلى مع أخيها سامي من القاهرة إلى تونس في شهر يوليو. يوم الثلاثاء زارا مدينة سوسة وسبحا في البحر، ويوم الجمعة ركبا القطار إلى العاصمة، حيث كانت عمتهما سلمى تنتظرهما قرب سوق المدينة القديمة.","l32":"في مدرستنا 450 تلميذا و 18 معلما. في شهر مارس زرعنا 36 شجرة في الحديقة، وبعد 3 سنوات أصبح طول بعضها 4 أمتار. وفي كل صف 25 كرسيا و 6 طاولات كبيرة، وعلى الجدار ساعة تدق كل 60 دقيقة.","l33":"قال سامي: \"هل نخرج للعب الآن؟\" فردت المعلمة: \"ليس بعد، أكمل صفحتك أولا.\" كتب سامي بأسرع ما يستطيع، ثم صاح: \"انتهيت!\" فابتسمت المعلمة وقالت: \"أحسنت! هيا بنا جميعا إلى الملعب.\"","l34":"في الصباح يكون بيتنا مليئا بالحركة. أبي يحضر الفطور، وأمي تبحث عن مفاتيح السيارة، والقط يجلس قرب صحنه وينتظر طعامه. أغسل وجهي، وألبس ثيابي، وأرتب حقيبتي بسرعة، ثم نخرج جميعا ونمشي إلى المدرسة قبل أن يرن الجرس.","l35":"تسخن الشمس مياه البحار والأنهار فتتبخر وتصعد إلى السماء. هناك يبرد البخار ويتحول إلى قطرات صغيرة جدا تتجمع لتصنع الغيوم. وعندما تثقل القطرات تسقط مطرا، أو ثلجا إذا كان الجو باردا. ثم تجري المياه في الأنهار حتى تصل إلى البحر، وتبدأ الدورة من جديد.","l36":"قبل نحو 1200 سنة كانت بغداد مدينة عظيمة للعلم. وفيها بيت الحكمة، وهو مكان جمع فيه العلماء كتبا كثيرة من بلاد مختلفة وترجموها إلى العربية. وفي ذلك الزمن تعلم أهل بغداد صناعة الورق، فأصبحت الكتب أرخص، وانتشرت المعرفة بين الناس.","l37":"كيف تزرع حبة فول: (1) ضع قطنا مبللا في كوب. (2) ضع فوقه 3 حبات فول. (3) ضع الكوب قرب نافذة مضيئة. (4) تأكد كل يوم أن القطن ما زال رطبا. (5) بعد 5 إلى 7 أيام ستظهر نبتة صغيرة، فارسمها في دفترك!","l38":"في ليلة ممطرة انقطعت الكهرباء عن الحي كله. قال جدي: \"لا تخافوا يا صغار، عندي شمعة.\" ثم أشعلها ووضعها على الطاولة، وجلسنا حوله. حكى لنا قصصا عن طفولته في القرية، وعن الحقول والنخيل والبئر القديمة. ضحكنا كثيرا، وعندما عاد النور قالت أختي سلمى: \"ليت الكهرباء تنقطع كل ليلة!\"","l39":"لم تكن الرحلة سهلة؛ فالطريق طويل وصاعد ومليء بالحجارة. ومع ذلك تابعنا السير - خطوة بعد خطوة - حتى بلغنا القمة. سأل مازن: \"هل كان الطريق يستحق هذا التعب؟\" نظرنا جميعا إلى الوادي (وكان رائعا حقا!) وضحكنا؛ فلم يحتج سؤاله إلى جواب.","l40":"النحلة حشرة صغيرة لكنها نشيطة جدا. تزور النحلة الواحدة مئات الأزهار في اليوم، وتجمع منها الرحيق وحبوب اللقاح. وفي الخلية الواحدة قد يعيش مع الملكة أكثر من 50000 نحلة. ويحول النحل الرحيق إلى عسل يخزنه ليأكله في الشتاء. وتضرب النحلة بجناحيها أكثر من 200 مرة في الثانية، ولهذا نسمع طنينها."}},

ס בצמר גפן רטוב. 2) מניחים עליו 3 שעועיות. 3) שמים את הכוס ליד חלון מואר. 4) בודקים כל יום שהצמר גפן עדיין לח. 5) אחרי 5 עד 7 ימים יופיעו נבטים - ציירו אותם במחברת!","l38":"באמצע הטיול התחיל לרדת גשם חזק. \"לא נורא,\" אמר סבא, \"נחכה במערה הקטנה.\" הוא הוציא מהתיק תרמוס עם תה חם ושקית צימוקים. ישבנו צמודים, הקשבנו לטיפות, וסבא סיפר על הטיולים שלו כשהיה ילד. כשהשמש חזרה, ראינו קשת ענקית מעל העמק, ואף אחד כבר לא רצה ללכת הביתה.","l39":"זה לא היה קל: השביל היה תלול, בוצי ומלא אבנים. ובכל זאת המשכנו - צעד אחרי צעד - עד הפסגה. \"זה שווה את זה?\" שאל ג'ק. כולנו הסתכלנו על הנוף וצחקנו. בדרך חזרה קנינו צ'יפס ליד ביה\"ס ואמרנו: \"נחזור לכאן בקיץ!\"","l40":"הצ'יטה היא היונק המהיר ביותר ביבשה. בריצה קצרה היא מגיעה למהירות של כ-100 קילומטרים בשעה, ומאפס ל-80 היא מאיצה בתוך כשלוש שניות. הזנב הארוך עוזר לה לשמור על שיווי משקל בפניות חדות. אבל הצ'יטה מתעייפת מהר, ולכן היא רודפת רק כמה מאות מטרים ואז חייבת לנוח."}}

  if (L.apos && !L.keysL.some(isLetter)) return [0, 1, 2].map(() => fill(() => pick(PK.apos)));

    const ex = L.keysL, ws = PK.words.filter(w => ex.some(c => w.includes(c)) && wordsWith(allowed.concat(ex)).includes(w));

  }

  const num = () => { let n = pick(digits); if (Math.random() < .5) n += pick(digits); return n; };
  if (L.numWords) return [0, 1, 2].map(() => fill(() => `${num()} ${pick(wordsWith(letters))}`));

      fill(() => { let g = ''; for (let i = 0; i < 3; i++) g += Math.random() < .6 ? pick(tk) : pick(home); return g; }),

    const prev = save.custom[L.id];
    save.custom[L.id] = { w: Math.max(wpm, prev ? prev.w : 0), a: Math.max(acc, prev ? prev.a : 0), n: (prev ? prev.n : 0) + 1, t: Date.now(), lw: wpm, la: acc, k: L.test ? 't' : 'l' };
    const ids = Object.keys(save.custom).sort((a, b) => (save.custom[a].t || 0) - (save.custom[b].t || 0));
    while (ids.length > 30) delete save.custom[ids.shift()];
  } else {
    const prev = save.done[L.id];
    save.done[L.id] = { s: Math.max(stars, prev ? prev.s : 0), w: Math.max(wpm, prev ? prev.w : 0), a: Math.max(acc, prev ? prev.a : 0), n: (prev ? prev.n : 0) + 1, t: Date.now(), la: acc, lw: wpm };
  }
  for (const k in cur.hit) { const r = save.keys[k] || [0, 0]; r[0] += cur.hit[k]; save.keys[k] = r; }
  for (const k in cur.miss) { const r = save.keys[k] || [0, 0]; r[1] += cur.miss[k]; save.keys[k] = r; }
  save.secs += Math.round(cur.ms / 1000); save.last = Date.now();
  // Minutes typed per day (the student's own calendar), the last 14 days, for the class's daily goal.
  const day = today(); save.days[day] = (save.days[day] || 0) + Math.round(cur.ms / 1000);
  for (const k of Object.keys(save.days).sort().slice(0, -14)) delete save.days[k];
  store();
  const passed = !PASS || ((PASS.acc === null || acc >= PASS.acc) && (PASS.wpm === null || wpm >= PASS.wpm));
  // For a class lesson step: the speed as the score, with accuracy and stars beside it (the teacher's gradebook).
  try {
    // Every finished run is reported. With a pass mark the server marks the step done only for a run that reaches it
    // (services/typing.js passOfStep) and grades the best run; without one, any finished run does it.
    const what = L.custom ? 'Own' : L.test ? `Test ${L.min}m` : L.tricky ? 'Tricky keys' : `L${cur.i + 1}`;
    if (BRBx && BRBx.score) BRBx.score.submit(wpm, `${what} ${acc}% ${stars}* ${wpm} wpm`.slice(0, 40));
    if (BRBx && BRBx.gameOver) BRBx.gameOver({ won: passed, score: wpm });
  } catch (e) { /* preview */ }
  sfx('win'); Walk.cheer();
  screen.innerHTML = `<div class="card center">
    <h2 style="margin:0">${esc(L.test ? t('timeUp') : L.tricky ? t('practiceDone') : t('doneH'))}</h2>
    <div class="stars" aria-label="${stars} / 3">${starsHtml(stars)}</div>
    <p><b>${esc(stars === 3 ? t('great') : t('keepGoing'))}</b></p>
    <div class="nums"><div class="num">${esc(t('speed'))}<b>${esc(t('wpm', { n: wpm }))}</b></div><div class="num">${esc(t('acc'))}<b>${esc(t('pct', { n: acc }))}</b></div></div>
    ${passed ? `${PASS ? `<p><b>🎯 ${esc(t('passOk'))}</b></p>` : ''}<div class="eggbox">
      <p><b>${esc(stars === 3 ? t('goldEgg') + ' ' : '')}${esc(t('eggReady'))}</b></p>
      <button type="button" class="egg${stars === 3 ? ' gold' : ''}" id="egg" aria-label="${esc(t('eggReady'))}"><span class="spots"></span><svg viewBox="0 0 150 190" id="cracks" aria-hidden="true"></svg></button>
    </div>` : `<p class="note passnote"><b>${esc(t('passNot', { what: passText() }))}</b></p>
      <div class="actions"><button type="button" class="btn" data-lesson="${esc(L.id)}">${esc(t('again'))}</button></div>`}
  </div>`;
  if (!passed) { say(t('passNot', { what: passText() })); drawTop(); return; }
  say(t(stars === 3 ? 'great' : 'keepGoing') + ' ' + t('eggReady'));
  egg = { taps: 0, stars };
  $('egg').focus();
  listen(e => { if (e.key.length === 1 || e.key === 'Enter') { e.preventDefault(); crack(); } });
  drawTop();
}

// ---------------------------------------------------------------- the egg and the pets
let egg = null;
const CRACKS = ['M75 18 L66 46 L82 60 L70 82', 'M70 82 L50 96 L60 116 L40 130', 'M82 60 L104 74 L96 98 L118 112', 'M40 130 L75 120 L110 132'];
function crack() {
  if (!egg || egg.done) return;
  egg.taps++;
  const el = $('egg'); el.classList.remove('wobble'); void el.offsetWidth; el.classList.add('wobble');
  $('cracks').innerHTML = CRACKS.slice(0, egg.taps).map(d => `<path d="${d}" fill="none" stroke="#5a4a2a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  sfx('jump');
  if (egg.taps >= CONFIG.crackTaps) hatch();
}
function hatch() {
  egg.done = true; stopKeys();
  const shiny = egg.stars === 3;
  const free = PETS.filter(p => !save.pets[p[0]]);
  let pet, msg;
  if (free.length) { pet = pick(free); save.pets[pet[0]] = { s: shiny ? 1 : 0, n: 1, t: Date.now() }; msg = t(shiny ? 'shinyPet' : 'hatched', { pet: petName(pet) }); }
  else {
    // every pet hatched: a golden egg makes one shiny, otherwise a friend visits
    const plain = PETS.filter(p => !save.pets[p[0]].s);
    pet = shiny && plain.length ? pick(plain) : pick(PETS);
    const r = save.pets[pet[0]]; r.n = (r.n || 1) + 1; if (shiny) r.s = 1;
    msg = shiny ? t('shinyPet', { pet: petName(pet) }) : t('visit', { pet: petName(pet) });
  }
  store();
  try { if (BRBx && BRBx.fx) BRBx.fx.confetti(); } catch (e) { /* reduced motion */ }
  sfx('powerup');
  const L = cur.L, nextL = cur.i >= 0 && meetsRule(save.done[L.id]) ? LESSONS[cur.i + 1] : null;
  const ruleNote = !locked && cur.i >= 0 && RULES && LESSONS[cur.i + 1] && !meetsRule(save.done[L.id]);
  $('egg').parentElement.innerHTML = `<div class="pet pet-svg${shiny ? ' shiny' : ''}">${PetArt.svg(pet[0], { shiny })}</div><p style="font-size:1.3rem"><b>${esc(msg)}</b></p>${ruleNote ? `<p class="note passnote"><b>${esc(t('ruleNot', { what: ruleText() }))}</b></p>` : ''}`;
  say(msg + ' ' + pick([t('praise1'), t('praise2'), t('praise3')]));
  const acts = document.createElement('div');
  acts.className = 'actions';
  acts.innerHTML = `${!locked && nextL ? `<button type="button" class="btn" data-lesson="${nextL.id}">${esc(t('next'))} →</button>` : ''}
    <button type="button" class="btn ghost" data-lesson="${L.id}">${esc(t('again'))}</button>
    ${locked ? '' : `<button type="button" class="btn ghost" data-go="map">${esc(t('map'))}</button>`}
    <button type="button" class="btn ghost" data-go="pets">🐾 ${esc(t('petsH'))}</button>`;
  screen.querySelector('.card').appendChild(acts);
  drawTop();
}
function showPets() {
  stopKeys(); cur = null;
  screen.innerHTML = `<div class="card"><div class="lesson-h"><h2>🐾 ${esc(t('petsH'))} (${petCount()}/${PETS.length})</h2>
    <button type="button" class="pill" data-go="map">← ${esc(t('map'))}</button></div>
    <p class="muted">${esc(t('petsSub'))}</p>
    ${petCount() ? `<p><button type="button" class="pill sm" data-go="walkToggle" aria-pressed="${save.walkOff ? 'false' : 'true'}">🐾 ${esc(t(save.walkOff ? 'walkOff' : 'walkOn'))}</button></p>` : ''}
    <div class="pets">${PETS.map(p => { const r = save.pets[p[0]], out = !!r && !save.walkOff && Walk.out() === p[0];
      return `<div class="petcard${r ? (r.s ? ' shiny' : '') + (out ? ' out' : '') : ' locked'}"><span class="art">${PetArt.svg(p[0], { shiny: !!(r && r.s) })}</span><small>${r ? esc(petName(p)) + (r.s ? ' ✨' : '') : '?'}</small>${r ? `<button type="button" class="pill walkbtn" data-walk="${p[0]}" aria-pressed="${out}">${esc(t(out ? 'walkingNow' : 'walkWith'))}</button>` : ''}</div>`; }).join('')}</div></div>`;
  drawTop();
}

// ==== PET WALK START ====
// The pet that walks with the player (docs/decisions.md "Typing Zoo: pets that walk"): the chosen pet (save.out, picked
// in the collection) or the latest hatched one, on its own ground lane under the top bar, so it never covers the typing
// line, the keyboard or a button (pointer-events: none). It walks left and right only, toward the pointer's x (on touch:
// the last tap), stops under it, wanders a little when left alone, and while the player types it settles at the end of
// the lane, faces the line, bounces on a finished line and wobbles on a wrong key. Reduced motion (the device, or
// BRB.motion 'reduce'): it stands still and only blinks. "Walking pet: off" in the collection hides it (save.walkOff).
const Walk = (function () {
  const lane = $('petLane'), el = $('walker'), face = el.querySelector('.face');
  let shown = '', x = 8, dir = 1, raf = 0, prev = 0, ptrX = null, ptrAt = -1e9, reached = true, typedAt = -1e9, goal = null, nextWander = 0, moving = false, fxT = 0;
  const TYPING_MS = 2500, POINTER_MS = 8000;
  const calm = () => (BRBx && BRBx.motion === 'reduce') || (!(BRBx && BRBx.motion === 'full') && !!window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  /** The pet out walking: the one picked in the collection, else the latest hatched. */
  function petOut() {
    if (save.out && save.pets[save.out]) return save.out;
    let best = '', t = -1;
    for (const p of PETS) { const r = save.pets[p[0]]; if (r && (r.t || 0) > t) { best = p[0]; t = r.t || 0; } }
    return best;
  }
  const W = () => el.offsetWidth || 64;
  const maxX = () => Math.max(0, lane.clientWidth - W());
  function place() { el.style.transform = `translateX(${Math.round(x)}px)`; el.classList.toggle('left', dir < 0); el.classList.toggle('walking', moving); }
  function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; moving = false; }
  /** Draw the lane for the current save (every screen calls this through drawTop). */
  function show() {
    const id = save.walkOff ? '' : petOut(), key = id && id + (save.pets[id].s ? '*' : '');
    lane.classList.toggle('hidden', !id);
    if (!id) { stop(); shown = ''; return; }
    if (key !== shown) { face.innerHTML = PetArt.svg(id, { shiny: !!save.pets[id].s }); shown = key; }
    const still = calm();
    lane.classList.toggle('calm', still);
    x = Math.min(x, maxX());
    if (still) { stop(); x = Math.min(8, maxX()); dir = 1; }
    else if (!raf) { prev = 0; raf = requestAnimationFrame(step); }
    place();
  }
  function step(now) {
    raf = requestAnimationFrame(step);
    const dt = prev ? Math.min(0.1, (now - prev) / 1000) : 0; prev = now;
    const max = maxX(), rtl = document.documentElement.dir === 'rtl', typing = now - typedAt < TYPING_MS;
    let target;
    if (typing) target = rtl ? 0 : max;   // beside the line's end, cheering, not chasing
    else if (ptrX !== null && (now - ptrAt < POINTER_MS || !reached)) target = ptrX - W() / 2;   // to the pointer, then a rest
    else {   // left alone: a few steps now and then, or a rest
      if (now > nextWander) { nextWander = now + 3000 + Math.random() * 4000; goal = Math.random() < 0.35 ? null : Math.random() * max; }
      target = goal;
    }
    if (target !== null) target = Math.max(0, Math.min(max, target));
    const dx = target === null ? 0 : target - x;
    if (Math.abs(dx) > (moving ? 2 : 14)) {
      x += Math.sign(dx) * Math.min(Math.abs(dx), (Math.abs(dx) > 160 ? 190 : 110) * dt);
      dir = dx > 0 ? 1 : -1; moving = true;
    } else {
      moving = false; if (!typing) reached = true;
      if (typing) dir = rtl ? 1 : -1;
      else if (ptrX !== null && now - ptrAt < POINTER_MS && Math.abs(ptrX - (x + W() / 2)) > 4) dir = ptrX > x + W() / 2 ? 1 : -1;
    }
    place();
  }
  function pointer(e) {
    if (lane.classList.contains('hidden')) return;
    if (e.type === 'pointermove' && e.pointerType !== 'mouse' && e.pointerType !== 'pen') return;   // touch: the tap only
    ptrX = e.clientX - lane.getBoundingClientRect().left; ptrAt = performance.now(); reached = false;
  }
  document.addEventListener('pointermove', pointer, { passive: true });
  document.addEventListener('pointerdown', pointer, { passive: true });
  window.addEventListener('resize', () => { if (shown) { x = Math.min(x, maxX()); place(); } });
  function fx(cls, ms) {
    if (!shown || calm()) return;
    el.classList.remove('pet-happy', 'pet-oops'); void el.offsetWidth; el.classList.add(cls);
    clearTimeout(fxT); fxT = setTimeout(() => el.classList.remove(cls), ms);
  }
  return {
    show,
    /** A key typed: right (settle by the line) or wrong (a small wobble). */
    typed(ok) { typedAt = performance.now(); if (!ok) fx('pet-oops', 340); },
    /** A line or a lesson done: a happy bounce. */
    cheer() { fx('pet-happy', 1150); },
    /** The pet out walking (none when the setting is off). */
    out: () => (save.walkOff ? '' : petOut()),
    state: () => ({ id: shown.replace('*', ''), x, dir, moving, running: !!raf, calm: calm(), hidden: lane.classList.contains('hidden') }),
  };
})();
// ==== PET WALK END ====

// ---------------------------------------------------------------- clicks
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'soundBtn') { if (BRBx && BRBx.sfx) BRBx.sfx.mute(); drawTop(); return; }
  if (b.id === 'petsBtn') { showPets(); return; }
  if (b.id === 'egg') { crack(); return; }
  if (b.dataset.lesson) { const L = lessonById(b.dataset.lesson); if (L) showIntro(L); return; }
  if (b.dataset.go === 'map') { showMap(); return; }
  if (b.dataset.go === 'pets') { showPets(); return; }
  if (b.dataset.go === 'walkToggle') { save.walkOff = save.walkOff ? 0 : 1; store(); showPets(); return; }
  if (b.dataset.walk && save.pets[b.dataset.walk]) { save.out = b.dataset.walk; save.walkOff = 0; store(); showPets(); return; }
  if (b.dataset.go === 'type') { startTyping(); return; }
  if (b.dataset.go === 'write') { showWriter(null); return; }
  if (b.dataset.own) { ownAction(b); return; }
  if (b.dataset.key && cur && keyFn === onKey) {
    const id = b.dataset.key;
    if (id === 'shiftL' || id === 'shiftR') { shiftOn = !shiftOn; return; }
    const key = id === 'space' ? SPACE : id === 'k0-lead' ? KB.lead : KB.rows.flat().find(x => x.id === id);
    if (!key) return;
    let ch = shiftOn && key.shift !== NONE ? key.shift : key.base; shiftOn = false;
    if (ch === NONE) return;
    if (KB.dead.has(ch)) { pendingDead = ch; cur.deadOn = true; drawLine(); return; }   // an accent key, then a letter
    if (pendingDead) { const c = [...KB.compose].find(([, v]) => v.dead === pendingDead && v.letter === ch); pendingDead = null; if (c) ch = c[0]; }
    press(ch);
  }
});
let shiftOn = false;   // tapping Shift on the keyboard below, for a big letter
let pendingDead = null;   // an accent key tapped on the keyboard below, waiting for its letter
function ownAction(b) {
  const id = b.dataset.id, x = ownSets.find(o => o.id === id);
  if (b.dataset.own === 'try' && x) { customL = customLesson(id, x.items); if (customL) showIntro(customL); }
  else if (b.dataset.own === 'edit') showWriter(id);
  else if (b.dataset.own === 'assign' && BRBx.assign) BRBx.assign(`chapter=${id}&lock=1`);
  else if (b.dataset.own === 'copy' && BRBx.copy) { const p = BRBx.copy(b.dataset.link); if (p) p.then(ok => { if (ok) b.textContent = '✓ ' + t('copied'); }); }
  else if (b.dataset.own === 'del' && BRBx.deleteQuestionSet) {
    // The game's frame can't show the browser's confirm box: the first tap asks, a second tap deletes.
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = t('delSure'); b.title = t('delAsk'); return; }
    const p = BRBx.deleteQuestionSet(id); if (p) p.then(() => loadOwn());
  }
}
document.addEventListener('change', e => {
  if (!e.target || e.target.id !== 'packSel') return;
  save.pack = e.target.value; store(); usePack(save.pack); showMap();
});
document.addEventListener('submit', e => {
  if (!e.target || e.target.id !== 'codeForm') return;
  e.preventDefault();
  const code = $('codeIn').value.trim(); if (!code) return;
  const p = BRBx.findQuestionSet(code); if (!p) return;
  p.then(r => {
    const L = r && r.id && r.items ? customLesson(r.id, r.items) : null;
    if (!L) { $('codeErr').textContent = t('codeBad'); return; }
    customL = L; showIntro(L);
  });
});

// For cover pictures and tests (scripts/covers/typing-zoo.recipe.js).
window.__brbTest = {
  lesson: id => showIntro(lessonById(id) || LESSONS[0]),
  type: id => { showIntro(lessonById(id) || LESSONS[0]); startTyping(); },
  // a test without waiting for the clock: type n characters, then the time is up
  finishTest: () => { if (cur && cur.L.test) { cur.ms = cur.L.min * 60000; lessonDone(); } },
  typeAll: () => { if (!cur) return; while (cur && cur.line < cur.lines.length && keyFn === onKey) press(cur.lines[cur.line][cur.pos]); },
  crackAll: () => { while (egg && !egg.done) crack(); },
  pets: () => showPets(),
  lessons: LESSONS.map(L => L.id),
  save: () => save,
  walk: () => Walk.state(),
  petIds: PETS.map(p => p[0]),
  artIds: PetArt.ids,
};

drawTop();
showMap();   // a locked link (a lesson, a test, tricky keys or a teacher's lesson) opens it from there
</script>
