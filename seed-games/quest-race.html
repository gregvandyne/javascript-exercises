      look.lerp(new THREE.Vector3(tgt.x, tgt.y + 1, tgt.z), Math.min(1, dt * 5));
      // during a question the card covers the lower half: look further down so I stay in the top half
      const low = ph === 'playing' || ph === 'between' ? 2.6 : 0.4;
      camera.position.set(look.x - Math.sin(yaw) * 7, look.y + 4.2 + low * 0.6, look.z - Math.cos(yaw) * 7);
      camera.lookAt(look.x + Math.sin(yaw) * low, look.y + 0.4 - low * 0.9, look.z + Math.cos(yaw) * low);
    }
    QR.drawCalls = renderer.info.render.calls;
    QR.crowdCalls = crowd.drawCalls;
  });
  QR.started3d = true; QR.B = B; QR.crowd = crowd;
  QR.begin();
}
</script>
