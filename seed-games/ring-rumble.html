<title>Ring Rumble</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Ring Rumble on the Oomba Kit. Layout: a full-screen canvas arena (landscape) in front of the kit's stadium world
   (evening light; night on a dark site). The kit draws the title (the player's own character stands in the corner), the
   pause screen and the results card; the game's own DOM (wrestler select, Get ready, Controls, the VS splash, the two
   touch pads, the key hint strips and the top buttons) lives in the kit's UI root, so it gets the kit's font and its
   day/night variables. Colours are the kit's (CSS variables --rr-* set at start from Oomba.color). */
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
.ok-ui{--ink:var(--rr-ink);--cream:var(--rr-cream);--p1:var(--rr-p1);--p2:var(--rr-p2);--spc:var(--rr-grape)}   /* the game's colours, also on the kit's own screens */
.rr button{font-family:inherit;-webkit-tap-highlight-color:transparent}
.rr .ok-btn{color:var(--ink)}
.rr .ok-btn svg{width:24px;height:24px;flex:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;box-sizing:border-box;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(color-mix(in srgb,var(--rr-night) 72%,transparent),color-mix(in srgb,var(--rr-night) 40%,transparent))}
/* sticker headings: Cream letters, an Ink edge and an Ink drop, like the kit's title */
.stk{font-weight:800;color:var(--cream);-webkit-text-stroke:.14em var(--ink);paint-order:stroke fill;text-shadow:0 .09em 0 var(--ink);margin:0;text-align:center;line-height:1.05}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.keys{font-size:clamp(.72rem,1.9vh,.85rem);font-weight:600;text-align:center;line-height:1.5;margin:0;background:var(--ok-card);color:var(--ok-text);border:2.5px solid var(--ink);border-radius:14px;padding:4px 12px;max-width:min(92vw,720px)}
.keys b{font-weight:800}
#ready,#controls{overflow-x:hidden;overflow-y:auto;justify-content:center;justify-content:safe center}
/* the title: the kit's lockup and Play; the game adds its second button and (desktop) the key diagrams */
.ok-title-screen .rr-cta{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
.ok-title-screen .rr-cta .ok-big{margin-top:0;min-width:200px}
.ok-title-screen .rr-tag{font-weight:700;margin:0;text-align:center;color:var(--cream);-webkit-text-stroke:.16em var(--ink);paint-order:stroke fill;font-size:clamp(.85rem,2.2vh,1.1rem)}
.ok-title-screen .ok-title-block{max-height:none}
html.desk .ok-title-screen .ok-h1{font-size:clamp(2.4rem,min(10vmin,12vw),5.6rem)}
html.desk .ok-title-screen .ok-big{min-height:clamp(60px,8vh,80px)}
@media (max-height:500px){.ok-title-screen .ok-h1{font-size:clamp(2rem,11vmin,3.4rem)}.ok-title-screen .ok-stack .ok-title-word{display:inline-block}
  .ok-title-screen .ok-big{min-height:58px;min-width:170px;font-size:1.25rem}.ok-title-screen .rr-tag,.ok-title-screen .keys{display:none}.ok-title-screen .ok-title-block{gap:6px}}

/* keyboard controls panel: two key-cap diagrams (P1 coral, P2 sky), shown on desktop only */
.ctlwrap{display:flex;gap:clamp(12px,3vw,40px);justify-content:center;flex-wrap:wrap;--ks:clamp(30px,5.6vh,48px)}
.ctl{--kc:var(--p1);border:3px solid var(--ink);border-radius:20px;padding:clamp(6px,1.4vh,12px) clamp(10px,2vw,18px);background:var(--ok-card);color:var(--ok-text);
  box-shadow:0 5px 0 var(--ink),inset 0 6px 0 var(--kc);text-align:center}
.ctl.p2{--kc:var(--p2)}
.ctl h3{font-size:clamp(1.05rem,3.6vh,1.5rem);font-weight:800;line-height:1;color:var(--ok-text);margin:clamp(4px,.8vh,8px) 0 clamp(4px,1vh,8px)}
.ctl h3::before{content:"";display:inline-block;width:.62em;height:.62em;border-radius:50%;background:var(--kc);border:2px solid var(--ink);margin-inline-end:.35em;vertical-align:.02em}
.ctl h3 small{display:block;font-size:clamp(.72rem,1.6vh,.8rem);font-weight:600;line-height:1.3;margin-top:3px;opacity:.75}
.ctlrow{display:flex;gap:clamp(10px,2vw,22px);align-items:center;justify-content:center}
.cluster{display:flex;flex-direction:column;align-items:center;gap:4px}
.kr{display:flex;gap:4px}
.cl,.ak span{font-size:clamp(.72rem,1.6vh,.8rem);font-weight:700;white-space:nowrap}
.cl{display:inline-flex;align-items:center;gap:2px}.cl svg{width:1.1em;height:1.1em}
.acts2{display:flex;gap:clamp(6px,1vw,12px)}
.ak{display:flex;flex-direction:column;align-items:center;gap:4px}
kbd.k{display:inline-flex;align-items:center;justify-content:center;min-width:var(--ks);height:var(--ks);padding:0 .35em;box-sizing:border-box;border-radius:12px;
  font-size:calc(var(--ks)*.46);font-weight:800;line-height:1;font-family:inherit;color:var(--ink);background:var(--cream);border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 -5px 0 var(--kc)}
kbd.k.spc{--kc:var(--spc)} kbd.k.esc{--kc:var(--rr-stone)}
.ctlfoot{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:clamp(.75rem,1.8vh,.9rem);font-weight:700;--ks:clamp(26px,4.4vh,36px)}
.ctlfoot b{font-weight:800;color:var(--cream);-webkit-text-stroke:.18em var(--ink);paint-order:stroke fill}
.ok-title-screen .ctlfoot b{color:var(--cream)}
@media (max-height:460px){.ctlwrap{--ks:clamp(26px,6vh,48px)}.ctl{padding:5px clamp(8px,1.6vw,14px)}.ctl h3{margin-bottom:3px}.cluster,.ak{gap:2px}}
@media (max-width:600px){.ctlwrap{--ks:clamp(24px,5vh,40px)}#ready{gap:1vh}#ready .readyhead{font-size:clamp(1.6rem,6vh,3rem)}
  html.desk .ok-title-screen .rr-tag{display:none}html.desk .ok-title-screen .ctlwrap{--ks:clamp(22px,4vh,40px);gap:8px}html.desk .ok-title-screen .ctl{padding:5px 10px}}

/* Get ready screen (desktop) and Controls screen: sticker headings over the arena */
#ready{gap:1.4vh}
.readyhead{font-size:clamp(2rem,8vh,4rem)}
.vsline{font-size:clamp(1.05rem,3.4vh,1.6rem);font-weight:800;margin:0;text-align:center;background:var(--ok-card);color:var(--ok-text);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:999px;padding:4px 18px}
.vsline .n1{color:var(--rr-p1s)} .vsline .n2{color:var(--rr-p2s)}
.anykey{font-size:clamp(1.1rem,4vh,1.8rem)}
.notekb{font-size:clamp(.8rem,1.8vh,.95rem);font-weight:700;margin:0;text-align:center;background:var(--ok-card);color:var(--ok-text);border:2.5px solid var(--ink);border-radius:14px;padding:4px 12px}

/* in-fight key hint strips (desktop, 2 players, round 1): Cream pills under each health bar */
.hint{position:fixed;display:flex;gap:8px;align-items:center;flex-wrap:nowrap;white-space:nowrap;--ks:clamp(22px,min(3.4vh,2.1vw),28px);--kc:var(--p1);opacity:0;transition:opacity .7s;pointer-events:none;
  background:var(--ok-card);color:var(--ok-text);padding:3px 8px;border-radius:12px;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);max-width:calc(50vw - 32px);overflow:hidden;box-sizing:border-box} /* max-width is refined by layoutHints() so the two strips never meet */
.hint kbd.k{border-radius:8px;border-width:2px;box-shadow:0 2px 0 var(--ink),inset 0 -3px 0 var(--kc)}
.hint.p2{--kc:var(--p2);justify-content:flex-end}
.hint.show{opacity:1}
.hint.show.dim{opacity:.6;transition:opacity .15s} /* a wrestler is jumping through the strip's band: get out of the way */
.hint .hk{display:inline-flex;align-items:center;gap:3px}
.hint .hk em{font-size:clamp(.72rem,1.7vh,.85rem);font-weight:800;font-style:normal;margin-inline-start:2px}
@media (max-width:1150px){.hint{gap:4px;padding:3px 5px;--ks:clamp(20px,min(3vh,2.1vw),24px)}.hint .hk em{font-size:.66rem;margin-inline-start:0}.hint .hk{gap:2px}}
/* Narrow desktop windows: the strips would clip, so show only the key caps (players saw the full labels on the Get ready screen). */
@media (max-width:900px){.hint .hk em{display:none}.hint{gap:5px}.hint .hk{gap:0}}
@media (max-width:560px){.hint{display:none}}

/* wrestler select: kit cards (Cream, Ink edge, a drop) with the wrestler on their colour */
#select{justify-content:center;gap:1.2vh}
.selhead{font-size:clamp(1.3rem,5.4vh,2.4rem)}
.selhead.p1{--hc:var(--p1)} .selhead.p2{--hc:var(--p2)}
.selhead::before{content:"";display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--hc);border:.08em solid var(--ink);margin-inline-end:.3em;vertical-align:.04em;-webkit-text-stroke:0}
.grid{display:grid;--cols:4;--rows:2;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:1.4vh 12px;width:100%;max-width:1000px;flex:1;min-height:0;padding:4px 4px 8px;box-sizing:border-box;
  /* Cap the height so a card is never taller than about 2/3 of its width: the portrait (height 100%, 2:3) then takes ~45% of the card and the name,
     stats and special keep the rest. Without this, tall windows (1280x800, 1920x1080) stretch the rows and the portrait swallows the text column. */
  max-height:calc((min(100vw - 32px,1000px) - (var(--cols) - 1)*12px) / var(--cols) * 2 / 3 * var(--rows) + (var(--rows) - 1)*1.4vh + 12px)}
@media (max-width:600px){.grid{--cols:2;--rows:4}} /* narrow desktop windows: two columns of wider cards */
.card{position:relative;border:3px solid var(--ink);border-radius:18px;background:var(--rr-deep);cursor:pointer;color:var(--cream);box-shadow:0 4px 0 var(--ink);
  display:flex;flex-direction:row;align-items:stretch;padding:0;overflow:hidden;min-height:0;text-align:start;font:inherit;transition:transform 80ms ease-out,box-shadow 80ms ease-out}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.card img{height:100%;aspect-ratio:2/3;object-fit:cover;flex:none;background:var(--c);border-inline-end:2.5px solid var(--ink)}
.card .info{flex:1;min-width:0;padding:.6vh 8px;display:flex;flex-direction:column;justify-content:center;justify-content:safe center;gap:.3vh} /* safe: never clip the top of the name */
.card .nm{font-size:clamp(.72rem,min(2.6vh,1.3vw),1.15rem);font-weight:800;line-height:1;overflow-wrap:normal;word-break:normal;hyphens:manual;color:var(--cream)} /* never broken inside a word: fitNames() shrinks a long one instead */
.card .nk{font-size:clamp(.55rem,1.7vh,.75rem);font-weight:600;line-height:1.15;opacity:.8;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;min-height:1.1em} /* nickname: up to two lines, then cut */
.stat{display:flex;align-items:center;gap:5px;font-size:clamp(.5rem,1.5vh,.66rem);font-weight:800}
.stat span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto;max-width:55%}
.stat i{flex:1;height:clamp(6px,1.1vh,9px);border-radius:9px;background:var(--ink);border:2px solid var(--ink);box-shadow:0 0 0 1px color-mix(in srgb,var(--cream) 30%,transparent);overflow:hidden;position:relative}
.stat i::after{content:"";position:absolute;inset:0;width:var(--v);background:var(--c);border-inline-end:2px solid var(--ink)}
.card .sp{font-size:clamp(.55rem,min(1.8vh,.92vw),.78rem);font-weight:800;line-height:1.05;color:var(--rr-gold);overflow-wrap:break-word;display:flex;gap:3px;align-items:flex-start}
.card .sp svg{color:var(--ink)}
.card .sp svg{width:1.15em;height:1.15em;flex:none}
/* short or narrow windows: drop the nickname and tighten the text column so the name, stats and special all fit */
@media (max-height:520px),(max-width:600px){.card .nk{display:none}.card .info{gap:2px;padding:4px 6px}}
@media (max-width:600px){.card .nm{font-size:clamp(.8rem,2.4vh,1.05rem)}.card .sp{font-size:clamp(.55rem,1.6vh,.7rem)}}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink),0 0 0 3px var(--c)}
.card.p1{box-shadow:0 0 0 4px var(--p1),0 4px 0 4px var(--ink)}
.card.p2{box-shadow:0 0 0 4px var(--p2),0 4px 0 4px var(--ink)}
.card.p1.p2{box-shadow:0 0 0 4px var(--p1),0 0 0 8px var(--p2),0 4px 0 8px var(--ink)}
.badge{position:absolute;top:5px;inset-inline-start:5px;font-size:.9rem;font-weight:800;padding:1px 9px;border-radius:999px;color:var(--ink);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink)}
.badge.b1{background:var(--p1)} .badge.b2{background:var(--p2);inset-inline-start:auto;inset-inline-end:5px}
.selfoot{display:flex;gap:12px;align-items:center}

/* VS splash: two flat halves (coral and sky) with an Ink edge, the wrestlers and a sticker VS */
#vs{background:none;overflow:hidden}
.half{position:absolute;top:0;bottom:0;width:62%;display:flex;align-items:flex-end;justify-content:center}
.half::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.09) 0 18px,transparent 18px 46px);pointer-events:none}
.half.l{left:-6%;background:var(--p1);clip-path:polygon(0 0,100% 0,78% 100%,0 100%);animation:inL .45s cubic-bezier(.2,1.3,.4,1) both}
.half.r{right:-6%;background:var(--p2);clip-path:polygon(22% 0,100% 0,100% 100%,0 100%);animation:inR .45s cubic-bezier(.2,1.3,.4,1) both}
.vsedge{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent calc(50% - 4px),var(--ink) calc(50% - 4px),var(--ink) calc(50% + 4px),transparent calc(50% + 4px));transform:skewX(-14deg);animation:vsIn .4s .3s both}
.half img{height:92%;max-width:70%;object-fit:contain;position:relative;z-index:1}
.half .vn{position:absolute;top:9%;font-size:clamp(1.5rem,7vh,3.6rem);z-index:2;width:80%}
.half.l .vn{left:6%} .half.r .vn{right:6%}
@keyframes inL{from{transform:translateX(-100%)}} @keyframes inR{from{transform:translateX(100%)}}
.vsword{position:relative;z-index:3;font-size:clamp(4rem,24vh,12rem);font-weight:800;line-height:1;color:transparent;
  background:linear-gradient(var(--rr-t1) 20%,var(--rr-t2) 85%);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:.05em var(--ink);
  filter:drop-shadow(0 .06em 0 var(--ink)) drop-shadow(0 0 .04em var(--cream));animation:vsIn .5s .35s cubic-bezier(.2,1.8,.4,1) both}
@keyframes vsIn{from{transform:scale(4) rotate(20deg);opacity:0}}

/* results: the kit's card, with the winner's own picture and the rounds */
.rr-win-pic{height:min(40vh,300px);width:auto;display:block;margin:calc(-1 * min(7vh,54px)) auto -4px;position:relative;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--wc) 70%,transparent))}
.ok-win .ok-card{overflow:visible}
.rr-score{font-size:clamp(1.6rem,6vh,2.4rem);font-weight:800;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.rr-score .s1{color:var(--rr-p1s)} .rr-score .s2{color:var(--rr-p2s)}
.ok-night .rr-score .s1{color:var(--p1)} .ok-night .rr-score .s2{color:var(--p2)}
.ok-win .ok-score{display:none}
/* short landscape phones: the winner stands beside the card (not on it) and the sparks shrink, so both buttons fit */
@media (max-height:520px){.ok-win .ok-card{padding-top:14px;padding-bottom:14px;overflow:visible}.ok-win .ok-h2{font-size:1.35rem;margin:0}
  .rr-win-pic{position:absolute;right:calc(100% - 24px);bottom:0;height:min(80vh,300px);margin:0}
  .ok-win .ok-sparks .ok-slot{width:44px;height:44px}.rr-score{font-size:1.5rem}}

/* touch pads: Cream kit buttons with the player's colour as their lip; the special glows when it is ready */
.pad{position:fixed;bottom:0;display:flex;align-items:flex-end;gap:2vw;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));pointer-events:none}
.pad.p1{left:max(10px,env(safe-area-inset-left,0px));--pc:var(--p1)}
.pad.p2{right:max(10px,env(safe-area-inset-right,0px));flex-direction:row-reverse;--pc:var(--p2)}
.dpad{display:grid;grid-template-columns:repeat(2,auto);gap:6px;pointer-events:auto}
.dpad .up{grid-column:1/3;justify-self:center}
.acts{display:grid;grid-template-columns:repeat(2,auto);gap:6px;pointer-events:auto}
.pb{--s:min(14vh,64px);width:var(--s);height:var(--s);border-radius:50%;border:2.5px solid var(--ink);background:var(--cream);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;opacity:.88;box-shadow:0 4px 0 var(--ink),inset 0 calc(var(--s)*-.1) 0 var(--pc);
  touch-action:none;cursor:pointer;padding:0;font-weight:800;box-sizing:border-box}
.pb svg{width:calc(var(--s)*.42);height:calc(var(--s)*.42)}
.pb small{font-size:calc(var(--s)*.2);line-height:1.05;max-width:90%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pb.act small{font-size:calc(var(--s)*.21)}
.pb.on{transform:translateY(3px) scale(.94);opacity:1;box-shadow:0 1px 0 var(--ink),inset 0 calc(var(--s)*-.1) 0 var(--pc)}
.pb.spc{--pc:var(--spc);background:var(--rr-grapeT)}
.pb.spc.ready{animation:ready .6s infinite alternate}
@keyframes ready{to{box-shadow:0 4px 0 var(--ink),0 0 0 5px var(--rr-gold),inset 0 calc(var(--s)*-.1) 0 var(--pc)}}
.pb.spc.ready{background:var(--rr-gold);--pc:var(--spc)} /* ready: spark yellow, like the meter and its SPECIAL READY! label */
.topbtns{position:fixed;top:max(6px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px}
.ib{position:relative;width:40px;height:40px;border-radius:50%;border:2.5px solid var(--ink);background:var(--cream);color:var(--ink);cursor:pointer;padding:0;display:grid;place-items:center;box-shadow:0 3px 0 var(--ink)}
.ib svg{width:22px;height:22px}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ib::before{content:"";position:absolute;inset:-4px} /* 48px tap target */
@media (max-height:460px){.ib{width:34px;height:34px}.ib svg{width:19px;height:19px}.ib::before{inset:-7px}}
.rr :focus-visible{outline:3px solid var(--ok-focus);outline-offset:3px}
#rotate{z-index:30;background:var(--rr-night);text-align:center}
#rotate .ph{width:46px;height:78px;border:5px solid var(--cream);border-radius:12px;box-shadow:0 0 0 3px var(--ink);animation:spin 2s ease-in-out infinite}
@keyframes spin{50%{transform:rotate(-90deg)}}
#rotate p{font-size:1.9rem;font-weight:800;line-height:1.15}
/* reduced motion (the device, the site or the kit's settings: the kit puts .ok-rm on its root) */
.ok-rm .rr .half,.ok-rm .rr .vsword,.ok-rm .rr .vsedge,.ok-rm .rr .ph,.ok-rm .rr .pb.spc.ready,.ok-rm .rr .card{animation:none;transition:none}
.ok-rm .rr .hint{transition:none}
@media (prefers-reduced-motion:reduce){.half,.vsword,.vsedge,#rotate .ph,.pb.spc.ready{animation:none}.hint,.card{transition:none}}
/* Right-to-left languages (he, ar): menus and texts read right to left, but the arena, the key diagrams (P1 = left side of the
   keyboard), the in-fight key strips, the touch pads and the VS splash keep their left/right layout. */
[dir=rtl] .ctlwrap,[dir=rtl] .hint,[dir=rtl] .pad,[dir=rtl] #vs{direction:ltr}
.ok-ui[lang|=ar] *,.ok-ui[lang|=he] *{letter-spacing:0!important} /* letter spacing would pull the joined Arabic letters apart */
</style>

<canvas id="cv" data-i18n-aria="arena"></canvas>

<div class="rr" id="rr">
<section class="screen" id="ready" hidden>
  <h2 class="stk readyhead" data-i18n="getReady"></h2>
  <p class="vsline"><bdi class="n1" id="rdyN1"></bdi> &nbsp;<span data-i18n="vs"></span>&nbsp; <bdi class="n2" id="rdyN2"></bdi></p>
  <div id="readyCtl"></div>
  <p class="stk anykey" data-i18n="anykey"></p>
  <div class="row"><button class="ok-btn ok-hot ok-big" id="fightBtn" data-icon="play"><span data-i18n="fight"></span></button><button class="ok-btn ok-quiet" id="readyBack" data-icon="back"><span data-i18n="pickAgain"></span></button></div>
</section>

<section class="screen" id="controls" hidden>
  <h2 class="stk readyhead" data-i18n="ctlTitle"></h2>
  <div id="ctlPanel"></div>
  <p class="notekb" id="padNote" data-i18n="padNote"></p>
  <div class="row"><button class="ok-btn ok-go ok-big" id="ctlClose" data-icon="back"><span data-i18n="back"></span></button><button class="ok-btn ok-quiet" id="padToggle" data-icon="tap"><span id="padToggleT"></span></button></div>
</section>

<section class="screen" id="select" hidden>
  <h2 class="stk selhead p1" id="selhead"></h2>
  <div class="grid" id="grid"></div>
  <div class="selfoot"><button class="ok-btn ok-quiet" id="selBack" data-icon="back"><span data-i18n="back"></span></button></div>

const C=(h,s)=>Oomba.color(h,s==null?'base':s);

const P1C=C('coral'),P2C=C('sky'),SPC=C('grape'),GOLD=C('spark'),T1=C('spark',1),T2=C('coral',1);

function col(v){if(v==null)return v;const [h,s]=String(v).split('.');if(h==='skin')return SKIN[+s];if(h==='hair')return HAIR[s];return C(h,s==null?'base':+s);}
const cssVars={ink:INK,cream:CREAM,p1:P1C,p2:P2C,p1s:C('coral',3),p2s:C('sky',3),grape:SPC,grapeS:C('grape',3),grapeL:C('grape',1),grapeT:C('grape',0),
  stone:C('stone',1),track:C('stone',0),night:INK,t1:T1,t2:T2,gold:C('spark',2)};
for(const k in cssVars)document.documentElement.style.setProperty('--rr-'+k,cssVars[k]);

function worldLight(){STAGE.setTimeOfDay(Oomba.theme.mode==='dark'?1:EVENING,0);}
worldLight();Oomba.theme.on('change',()=>{worldLight();for(const k in portraitCache)delete portraitCache[k];});
const NIGHT=()=>Oomba.theme.mode==='dark';
// the game's DOM goes into the kit's UI root (the kit's font, day/night variables and right-to-left)

function sticker(c,txt,x,y,size,fill,max,align){

  c.fillStyle=INK;c.lineWidth=size*.3;c.strokeStyle=INK;c.strokeText(txt,x,y+size*.08,max);c.fillText(txt,x,y+size*.08,max);

  c.lineWidth=size*.15;c.strokeStyle=INK;c.strokeText(txt,x,y,max);
  c.fillStyle=fill;c.fillText(txt,x,y,max);
}

/** HUD names: Cream letters with one Ink edge and an Ink drop drawn as the same shape, snapped to whole pixels (crisp at phone size). */
function hudName(c,txt,x,y,size,max,align){
  c.font=font(size);c.textAlign=align;c.textBaseline='middle';c.lineJoin='round';x=Math.round(x);y=Math.round(y);
  const d=Math.max(2,Math.round(size*.1)),lw=Math.max(3,Math.round(size*.24));
  c.lineWidth=lw;c.strokeStyle=INK;c.fillStyle=INK;c.strokeText(txt,x,y+d,max);c.fillText(txt,x,y+d,max);
  c.strokeText(txt,x,y,max);c.fillStyle=CREAM;c.fillText(txt,x,y,max);
}

function inkText(c,txt,x,y,size,fill,max,align){c.font=font(size);c.textAlign=align||'center';c.textBaseline='middle';c.lineJoin='round';c.lineWidth=Math.max(3,size*.22);c.strokeStyle=INK;c.strokeText(txt,x,y,max);c.fillStyle=fill;c.fillText(txt,x,y,max);}

function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function shade(h,a){const[r,g,b]=hex2rgb(h);const f=a<0?0:255,t=Math.abs(a);return`rgb(${Math.round(r+(f-r)*t)},${Math.round(g+(f-g)*t)},${Math.round(b+(f-b)*t)})`;}

/* ======================= WRESTLER RENDERER =======================

   Ink style: a Cream sticker rim around the whole figure, the Ink outline, flat fills with one hard shade on the far

const OUT=INK;

const add=(p,v,l)=>[p[0]+v[0]*l,p[1]+v[1]*l];

function legGeom(d,hip,a1,a2){const S=d.size,k=add(hip,dirv(a1),78*S),an=add(k,dirv(a2),76*S);return{k,an};}
function poseHipHeight(d,p){
  const S=d.size,h=[0,0];

/* ======================= POSES ======================= */
function basePose(){return{lean:.1,tilt:0,rot:0,a:[.7,2.5,.4,2.3],l:[.28,-.05,-.22,-.1],face:'',hipH:null};}
function poseFor(f,t){

    case 'walk':{const ph=f.walkPh;p.lean=.16;p.a=[.75+Math.sin(ph)*.15,2.5,.45-Math.sin(ph)*.15,2.3];
      const s1=Math.sin(ph),s2=Math.sin(ph+PI);p.l=[.05+.42*s1,.05+.42*s1-.55*Math.max(0,Math.sin(ph+1.4)),.05+.42*s2,.05+.42*s2-.55*Math.max(0,Math.sin(ph+1.4+PI))];break;}
    case 'block':p.lean=-.02;p.a=[1.05,2.95,.95,2.85];p.l=[.38,-.15,-.3,-.2];p.tilt=.15;break;
    case 'punch':p.face='yell';if(sp<.3){p.lean=.05;p.a=[.3,2.7,.6,2.5];}else if(sp<.7){p.lean=.32;p.a=[1.57,1.57,.2,2.4];p.l=[.45,-.1,-.4,-.2];}else{p.lean=.15;p.a=[1.2,2.0,.4,2.3];}break;
    case 'kick':p.face='yell';if(sp<.3){p.lean=-.05;p.l=[1.1,.2,-.15,-.1];p.a=[.9,2.2,-.4,1.0];}else if(sp<.72){p.lean=-.38;p.l=[1.58,1.6,-.12,-.08];p.a=[1.1,2.0,-.7,.4];}else{p.lean=0;p.l=[.7,.3,-.2,-.1];}break;
    case 'grab':p.lean=.28;p.a=[1.4,1.55,1.3,1.5];p.l=[.45,-.1,-.4,-.2];break;
    case 'slam':p.face='yell';if(u<.42){p.lean=-.12;p.a=[2.9,3.05,2.8,3.0];p.l=[.3,-.1,-.3,-.15];}else{p.lean=.55;p.a=[1.7,1.3,1.6,1.2];p.l=[.6,-.2,-.5,-.3];}break;
    case 'held':p.face='hurt';p.a=[2.2+Math.sin(t*20)*.4,2.6,1.9+Math.cos(t*18)*.4,2.4];p.l=[.7+Math.sin(t*17)*.3,.2,-.3,-.6];p.rot=f.holdRot;p.hipH=0;break;

      if(st==='down'&&u<.25){p.rot=-PI/2+Math.sin(u*25)*.08;}break;
    case 'getup':p.lean=.4;p.a=[.9,1.2,.7,1.1];p.l=[1.3,-.4,.2,-.8];break;
    case 'air':if(f.dropkick){p.face='yell';p.rot=-1.05;p.l=[1.6,1.6,1.45,1.5];p.a=[-1.2,-1.0,-1.5,-1.2];}else{p.l=[1.15,.1,.85,-.2];p.a=[1.9,2.7,1.6,2.5];p.lean=.05;}break;
    case 'special':p.face='yell';
      if(u<.5){p.lean=.02;p.a=[1.57,3.1,-1.3,-2.9];p.l=[.6,-.4,-.6,.2];}
      else if(u<1.15){p.rot=((u-.5)/.65)*TAU;p.l=[1.5,.2,1.3,.1];p.a=[2.4,2.8,2.0,2.6];}

    case 'pin':p.rot=PI/2-.08;p.hipH=58*f.d.size;p.lean=0;p.a=[.6,.2,.4,.1];p.l=[.1,.2,-.1,.3];break;

function blendPose(cur,tgt,k){
  if(!cur)return JSON.parse(JSON.stringify(tgt));

/* ======================= PORTRAITS =======================
   Cards and the VS splash: the wrestler on a flat panel of their colour with light diagonal stripes (no gradients on
   art); the HUD's round heads on a flat disc of their colour. */
const portraitCache={};
function portrait(d,w,h,mode){
  const key=d.name+w+mode;if(portraitCache[key])return portraitCache[key];

  if(mode!=='clear'){const bg=d.card||d.aura;x.fillStyle=bg;x.fillRect(0,0,w,h);
    x.strokeStyle=rgba(INK,.14);x.lineWidth=7;for(let i=-h;i<w;i+=22){x.beginPath();x.moveTo(i,h);x.lineTo(i+h,0);x.stroke();}
    const sl=x.createRadialGradient(w/2,h*.32,4,w/2,h*.32,h*.6);sl.addColorStop(0,'rgba(255,255,255,.38)');sl.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=sl;x.fillRect(0,0,w,h);

  if(mode!=='head'){p.a=[1.57,3.1,-1.35,-2.95];p.lean=.02;p.face='yell';}
  const sc=h/420;
  x.save();
  const hh=poseHipHeight(d,p);x.translate(w*.5,h*.95-hh*sc);x.scale(sc,sc);
  drawWrestler(x,d,p,0);
  x.restore();
  return portraitCache[key]=c;
}
function headPortrait(d,size){
  const key=d.name+'head'+size;if(portraitCache[key])return portraitCache[key];
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
  x.fillStyle=d.aura;x.fillRect(0,0,size,size);
  x.fillStyle='rgba(255,255,255,.22)';x.beginPath();x.arc(size*.5,size*.42,size*.36,0,TAU);x.fill();
  const p=basePose();p.lean=0;p.face='yell';
  const sc=size/(95*d.size);

  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=650;bp.Q.value=.6;
  crowdGain=AC.createGain();crowdGain.gain.value=0;src.connect(bp);bp.connect(crowdGain);crowdGain.connect(AC.destination);src.start();
}
function noise(dur,type,freq,gain,q=1,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay;const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=AC.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t,Math.random());s.stop(t+dur+.05);}
function tone(f0,f1,dur,gain,type='sine',delay=0){if(!AC||muted)return;const t=AC.currentTime+delay;const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);}

/* ======================= AI ======================= */
function think(f,o,dt){
  const a=f.ai;a.t-=dt;a.inp=a.inp||{};
  ['punch','kick','grab','special','up'].forEach(k=>a.inp[k]=false);
  if(a.t>0)return;
  a.t=rand(.12,.32);a.inp.left=a.inp.right=false;
  if(phase!=='fight'||!['idle','walk','block'].includes(f.state))return;
  const dist=Math.abs(o.x-f.x),toward=o.x>f.x?'right':'left',away=toward==='right'?'left':'right';
  if(f.meter>=100&&Math.random()<.6){a.inp.special=true;return;}
  if(['punch','kick','grab'].includes(o.state)&&dist<190&&Math.random()<.35){a.inp[away]=true;a.t=.35;return;}
  if(dist>175){if(Math.random()<.85)a.inp[toward]=true;if(Math.random()<.06)a.inp.up=true;if(dist<330&&Math.random()<.08){a.inp.up=true;a.inp[toward]=true;}return;}
  const r=Math.random();
  if(o.state==='down'||o.state==='getup'){a.inp[away]=Math.random()<.5;return;}
  if(r<.38)a.inp.punch=true;else if(r<.62)a.inp.kick=true;else if(r<.8)a.inp.grab=true;else if(r<.9)a.inp[away]=true;
}

/* ======================= COMBAT ======================= */
const WORDS=Object.assign({block:[t('block')]},tv('words'));
// effect colours from the kit's palette (spark yellow only in the winner's confetti and fireworks: rewards)
const FX={block:C('sky',1),spark:C('peach',1),words:[C('peach',1),C('coral',1),C('sky',1),C('mint',1)],ko:C('coral'),slam:C('peach',1),
  confetti:[GOLD,P1C,P2C,C('mint'),CREAM,C('grape',1)],pyro:[GOLD,C('peach'),CREAM]};
function canAct(f){return['idle','walk','block'].includes(f.state);}
function hurt(v,a,dmg,kind){
  if(v.invuln>0||['down','ko','held','getup'].includes(v.state))return false;
  const front=Math.sign(v.x-a.x)||a.face;
  const hx=v.x-front*30*v.d.size,hy=GY+v.y-200*v.d.size;
  if(v.backing&&v.y===0&&(kind==='punch'||kind==='kick')&&canAct(v)){
    v.hp-=dmg*.2*v.tough;v.vx=front*220;setState(v,'block',.22);
    sparks(hx,hy,FX.block,10);addText(hx,hy-40,t('block'),FX.block,.8);SFX.block();a.meter=Math.min(100,a.meter+3);v.meter=Math.min(100,v.meter+4);hitstop=.04;checkKO(v,a);return true;
  }
  const d=dmg*a.pw*v.tough;v.hp-=d;v.flashT=.12;
  a.meter=Math.min(100,a.meter+(kind==='special'?0:d*1.4));v.meter=Math.min(100,v.meter+d*1.1);
  a.combo=a.comboT>0?a.combo+1:1;a.comboT=1.1;
  excite=Math.min(1,excite+d/40);
  const big=kind==='slam'||kind==='special'||kind==='dropkick'||a.combo>=4;

  ring(hx,hy,big?140:70,kind==='special'?a.d.aura:CREAM);
  addText(hx+front*20,hy-60,pick(WORDS[kind]||WORDS.punch),kind==='special'?a.d.aura:pick(FX.words),big?1.5:1.05);
  shake=Math.max(shake,big?22:kind==='kick'?10:6);hitstop=big?.12:.07;

  banner={txt:f.d.spn,t:0,col:f.d.aura,sub:f.d.dn};slow=.55;slowT=.5;flash=.6;SFX.special();excite=1;

/* ======================= UPDATE ======================= */
function updateFighter(f,o,i,dt,T){
  f.t+=dt;f.invuln=Math.max(0,f.invuln-dt);f.comboT-=dt;f.flashT-=dt;
  if((vsCPU&&i===1)||autoplay)think(f,o,dt);
  const inp=readInput(f,i);
  const active=phase==='fight';
  const grounded=f.y>=0;
  // face opponent
  if(canAct(f)&&grounded)f.face=o.x>=f.x?1:-1;
  f.backing=false;
  switch(f.state){
    case 'idle':case 'walk':case 'block':{
      if(f.state==='block'&&f.t<f.dur){f.vx*=.85;break;}
      if(!active){f.vx=0;if(f.state!=='idle')setState(f,'idle');break;}
      if(inp.ev.special&&f.meter>=100){consume(f,'special');startSpecial(f,o);break;}
      if(inp.ev.special){consume(f,'special');}
      if(inp.ev.punch){consume(f,'punch');setState(f,'punch',.34*(1.12-f.d.Sp*.03));SFX.whiff();break;}
      if(inp.ev.kick){consume(f,'kick');setState(f,'kick',.5*(1.12-f.d.Sp*.03));SFX.whiff();break;}
      if(inp.ev.grab){consume(f,'grab');setState(f,'grab',.38);break;}
      if(inp.ev.up){consume(f,'up');setState(f,'air');f.vy=-1000-f.d.Sp*25;f.y=-1;f.dropkick=false;SFX.jump();break;}
      const dir=(inp.right?1:0)-(inp.left?1:0);
      f.backing=dir!==0&&dir===-f.face;
      f.vx=dir*f.spd*(f.backing?.7:1);
      if(dir){if(f.state!=='walk')setState(f,'walk');f.walkPh+=dt*f.spd/22*(dir*f.face);}else if(f.state!=='idle')setState(f,'idle');
      break;}
    case 'punch':f.vx=0;if(f.t>f.dur*.3&&f.t<f.dur*.65)tryHit(f,o,128,6,'punch');if(f.t>=f.dur)setState(f,'idle');break;
    case 'kick':f.vx=0;if(f.t>f.dur*.32&&f.t<f.dur*.7)tryHit(f,o,168,9,'kick');if(f.t>=f.dur)setState(f,'idle');break;
    case 'grab':f.vx=0;
      if(!f.hitDone&&f.t>.1){f.hitDone=true;const dx=(o.x-f.x)*f.face;
        if(dx>0&&dx<135*f.d.size&&o.y===0&&o.invuln<=0&&!['down','ko','held','getup','air'].includes(o.state)){startSlam(f,o);break;}}
      if(f.t>=f.dur)setState(f,'idle');break;
    case 'slam':{const v=f.victim,u=f.t;
      if(u<.42){const k=u/.42;v.x=f.x+f.face*lerp(40,10,k);v.y=-lerp(40,330,k)*f.d.size;v.holdRot=-PI/2*f.face*k*1.0;v.face=-f.face;}
      else if(u<.62){const k=(u-.42)/.2;v.x=f.x+f.face*lerp(10,150,k);v.y=-lerp(330*f.d.size,26,k*k);v.holdRot=(-PI/2-PI*.9*k)*f.face;}
      else if(!f.hitDone){f.hitDone=true;v.y=0;v.x=f.x+f.face*150;v.state='idle';v.holdRot=0;
        const d=13*f.pw*v.tough;v.hp-=d;f.meter=Math.min(100,f.meter+18);v.meter=Math.min(100,v.meter+12);v.face=-f.face;

    case 'air':

      if(f.dropkick)tryHit(f,o,150,9,'dropkick');

function separate(a,b){
  if(a.state==='held'||b.state==='held'||a.state==='special'||b.state==='special'||a.y<0||b.y<0)return;
  if(['down','ko','pin'].includes(a.state)||['down','ko','pin'].includes(b.state))return;
  const min=95*(a.d.size+b.d.size)/2,dx=b.x-a.x;

}

function startMatch(){
  wins=[0,0];round=1;F=[mkFighter(picks[0],0),mkFighter(picks[1],1)];coachSpecs();
  startRound();
  showScreen(null);matchLive=true;padsTouched=false;applyPads();$('topbtns').hidden=false;
  mode='game';
  // desktop: remind the keyboard players of their keys for the first few seconds of round 1 (P1 only vs the computer)
  if(desktop&&!autoplay)showHints();else hideHints();
}
function startRound(){
  F.forEach((f,i)=>{Object.assign(f,{x:i?RIGHTX-170:LEFTX+170,y:0,vx:0,vy:0,face:i?-1:1,hp:100,hpTrail:100,invuln:0,koed:false,pose:null,buf:{},combo:0,victim:null,holder:null,airDown:false});setState(f,'idle');});
  ref=null;parts=[];texts=[];phase='intro';phaseT=0;winner=-1;countN=0;
  banner={txt:round===3?t('finalRound'):t('round',{n:round}),t:0,col:C('peach',1),big:1};SFX.bell();
}
function updateMatch(dt,T){
  phaseT+=dt;
  if(phase==='intro'){if(phaseT>1.3&&!banner2){banner={txt:t('fightB'),t:0,col:C('coral'),big:1};banner2=true;}if(phaseT>1.9){phase='fight';banner2=false;}}
  if(phase==='ko'&&phaseT>1.6){
    // winner goes for the pin
    const w=F[winner],l=F[1-winner];
    if(['down','ko'].includes(l.state)&&l.y===0&&canAct(w)||w.state==='hit'||w.state==='idle'){
      phase='pin';phaseT=0;
      w.x=l.x;w.y=0;setState(w,'pin');w.face=l.face*-1;w.pose=null;
      ref={d:REF,x:camX+900,y:0,face:-1,state:'refwalk',t:0,dur:0,seed:1,walkPh:0,pose:null,slap:false};
    } else if(phaseT>4){phase='pin';phaseT=0;}
  }
  if(phase==='pin'&&ref){
    const target=F[winner].x+90;
    if(ref.state==='refwalk'){ref.walkPh+=dt*10;ref.x-=dt*700;if(ref.x<=target){ref.x=target;ref.state='ref';ref.t=0;ref.face=-1;ref.pose=null;phaseT=0;}}
    else{
      const n=Math.floor((phaseT-.15)/.8)+1;
      ref.slap=((phaseT-.15)%.8)>.55;
      if(n>countN&&n<=3&&((phaseT-.15)%.8)>.55){countN=n;SFX.count();shake=8;addText(ref.x-60,GY-300,String(n),CREAM,2.4);excite=Math.min(1,excite+.3);}
      if(phaseT>2.9&&phase==='pin'){phase='roundEnd';phaseT=0;SFX.bell();cheer(1.5);wins[winner]++;
        const w=F[winner];setState(w,'win');w.x=clamp(w.x-w.face*120,LEFTX,RIGHTX);w.face=w.x<W/2?1:-1;w.pose=null;
        banner={txt:wins[winner]>=2?t('wins',{name:w.d.dn}):t('roundTo',{who:winner===0?'P1':(vsCPU?'CPU':'P2')}),t:0,col:winner?P2C:P1C,big:wins[winner]>=2?1:0};
        confetti(120);pyro(150);pyro(1450);coachCheer(winner);}
    }
    ref.pose=blendPose(ref.pose,poseFor(ref,T),1-Math.exp(-dt*20));ref.t+=dt;
  }
  if(phase==='roundEnd'){
    if(Math.random()<dt*3)pyro(pick([150,1450]));
    if(phaseT>3.4){
      if(wins[winner]>=2)endMatch();else{round++;startRound();}
    }
  }
}

/* ======================= RINGSIDE (kit characters) =======================
   Each wrestler has a fan at ringside, drawn by the kit: player 1's is the player's own character (Oomba.avatar(), the
   one they designed on their Me page; the Oomba for guests), player 2's the fox (the bear against the computer). They

const coaches=[{spec:null,cheer:0,img:{}},{spec:null,cheer:0,img:{}}];

function drawCoaches(T,dt){

    if(!$('pad'+(i+1)).hidden)return;   // the touch pad sits in this corner: the pad wins
    const sad=(phase==='roundEnd'||phase==='over')&&winner>=0&&winner!==i;

const DUST=C('snow',1);
function drawParticles(dt){
  const c=ctx;
  parts=parts.filter(p=>(p.t+=dt)<p.life);
  for(const p of parts){const k=p.t/p.life;
    if(p.k==='spark'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;c.strokeStyle=p.col;c.globalAlpha=1-k;c.lineCap='round';c.lineWidth=5*(1-k)+1;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.03,p.y-p.vy*.03);c.stroke();}
    else if(p.k==='dust'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;c.globalAlpha=.55*(1-k);c.fillStyle=DUST;c.beginPath();c.arc(p.x,p.y,p.r*(1+k*1.5),0,TAU);c.fill();}
    else if(p.k==='ring'){c.globalAlpha=1-k;c.strokeStyle=p.col;c.lineWidth=10*(1-k)+2;c.beginPath();c.ellipse(p.x,p.y,p.r*(.3+k),p.r*(.3+k)*.6,0,0,TAU);c.stroke();}
    else if(p.k==='conf'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;c.globalAlpha=1-k*k;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=INK;c.fillRect(-8,-12,16,24);c.fillStyle=p.col;c.fillRect(-6,-10,12,20);c.restore();}
  }
  c.globalAlpha=1;
  // hit words: sticker words (an Ink drop, a Cream rim, an Ink edge) that pop in and float up
  texts=texts.filter(t=>(t.t+=dt)<t.life);
  for(const t of texts){const k=t.t/t.life,s=t.sc*(k<.15?lerp(.3,1.25,k/.15):1.25-k*.25);
    c.save();c.translate(t.x,t.y-k*60);c.rotate(t.rot);c.scale(s,s);
    c.globalAlpha=k>.7?1-(k-.7)/.3:1;sticker(c,t.txt,0,0,78,t.col,560);c.restore();}
}
/* The HUD on the canvas: each wrestler's round head, a health bar (Cream rim, Ink edge, flat mint / peach / coral),
   the name, the round wins as the kit's sparks, and the special meter in grape (the kit's 'special' colour). */
function drawHUD(T){
  const c=ctx,s=Math.min(cw/1400,ch/720),pad=Math.max(12,ch*.03);
  c.save();
  const barH=Math.max(12,30*s),barW=Math.min(560*s*1.1,(cw-2*pad-2*barH*2.3-150)/2),top=pad+(ch<500?4:10);
  F.forEach((f,i)=>{
    const L=i===0,x0=L?pad+barH*2.3:cw-pad-barH*2.3-barW,pc=L?P1C:P2C;
    // portrait: the wrestler's head in a circle with a Cream rim, an Ink edge and the player's colour
    const pr=headPortrait(f.d,128),ps=barH*2.1,px=L?pad:cw-pad-ps,cx=px+ps/2,cy=top+ps/2;
    c.beginPath();c.arc(cx,cy+3,ps/2+3,0,TAU);c.fillStyle=INK;c.fill();
    c.save();c.beginPath();c.arc(cx,cy,ps/2,0,TAU);c.closePath();c.clip();c.drawImage(pr,px,top,ps,ps);c.restore();
    c.lineWidth=7;c.strokeStyle=INK;c.beginPath();c.arc(cx,cy,ps/2,0,TAU);c.stroke();
    c.lineWidth=3.5;c.strokeStyle=pc;c.beginPath();c.arc(cx,cy,ps/2-1,0,TAU);c.stroke();
    // health bar (slanted)
    const sk=barH*.5,bx=x0,by=top+2;
    const shape=(w,y,h)=>{c.beginPath();if(L){c.moveTo(bx,y);c.lineTo(bx+w,y);c.lineTo(bx+w-sk,y+h);c.lineTo(bx-sk*0,y+h);}else{c.moveTo(bx+barW,y);c.lineTo(bx+barW-w,y);c.lineTo(bx+barW-w+sk,y+h);c.lineTo(bx+barW,y+h);}c.closePath();};
    c.lineJoin='round';
    shape(barW,by,barH);c.lineWidth=7;c.strokeStyle=CREAM;c.stroke();c.fillStyle=INK;c.fill();c.lineWidth=3;c.strokeStyle=INK;c.stroke();
    const hw=barW*clamp(f.hpTrail,0,100)/100;shape(hw,by+3,barH-6);c.fillStyle=CREAM;c.fill();
    const hv=clamp(f.hp,0,100)/100,gw=barW*hv;shape(gw,by+3,barH-6);
    c.fillStyle=hv>.5?C('mint'):hv>.25?C('peach'):C('coral');c.fill();
    c.fillStyle='rgba(255,255,255,.35)';shape(gw,by+3,(barH-6)*.35);c.fill();
    // name (sticker letters)
    const nmx=L?bx:bx+barW,nmy=by+barH+3+barH*.5;
    hudName(c,f.d.dn,nmx,nmy,Math.max(13,barH*.85),barW*.62,L?'left':'right');
    // round wins: the kit's sparks (lit) or an empty ring
    for(let k=0;k<2;k++){const sx=L?bx+barW-14-k*24*Math.max(s,.7):bx+14+k*24*Math.max(s,.7),sy=by+barH+barH*.55,r=barH*.4;
      if(k<wins[i])sparkGlyph(c,sx,sy,r,GOLD);else{c.beginPath();c.arc(sx,sy,r*.42,0,TAU);c.fillStyle=rgba(CREAM,.35);c.fill();c.lineWidth=2;c.strokeStyle=INK;c.stroke();}}
    // special meter (grape; it shines Cream when the special is ready)
    const mw=barW*.6,mh=Math.max(7,barH*.36),mx=L?bx+barW*.4-sk:bx+sk,my=by+barH+barH*1.15;
    c.fillStyle=rgba(INK,.85);c.fillRect(mx,my,mw,mh);
    const full=f.meter>=100,pulse=REDUCED?1:.5+.5*Math.sin(T*10);
    const fw=mw*f.meter/100;c.fillStyle=full?GOLD:SPC;c.fillRect(L?mx:mx+mw-fw,my,fw,mh);
    if(full){c.fillStyle=rgba(CREAM,.45*pulse);c.fillRect(mx,my,mw,mh*.4);}
    c.strokeStyle=INK;c.lineWidth=2.5;c.strokeRect(mx,my,mw,mh);
    if(full){c.save();c.globalAlpha=.55+.45*pulse;c.strokeStyle=GOLD;c.lineWidth=3;c.strokeRect(mx-3,my-3,mw+6,mh+6);c.restore();}
    else{c.strokeStyle=CREAM;c.lineWidth=1;c.strokeRect(mx-2,my-2,mw+4,mh+4);}
    if(full){const fs=Math.round(Math.max(14,barH*.72)),tx=L?mx:mx+mw,ty2=my+mh+4+fs*.6,txt=noEmoji(t('ready'));
      sparkGlyph(c,L?tx+fs*.5:tx-fs*.5,ty2,fs*.55,GOLD);
      inkText(c,txt,L?tx+fs*1.15:tx-fs*1.15,ty2,fs,GOLD,mw*1.3,L?'left':'right');}
  });
  // banner (ROUND 1, FIGHT!, K.O.!, the special move, who won): sticker words, the kit's pop-in
  if(banner){banner.t+=1/60;const b=banner,k=b.t;
    const life=b.big?1.6:2.2;if(k>life&&phase!=='roundEnd')banner=null;
    else{const sc=k<.18&&!REDUCED?lerp(3,1,k/.18):1,al=phase==='roundEnd'?1:(k>life-.3?(life-k)/.3:1);
      c.save();c.translate(cw/2,ch*(b.sub?.3:.38));c.scale(sc,sc);c.globalAlpha=clamp(al,0,1);c.rotate(-.04);
      const fs=Math.round((b.big?140:86)*s*(b.txt.length>14?.6:1)),bmw=cw*.92/sc;
      if(b.sub){const usesTxt=t('uses',{name:b.sub});sticker(c,usesTxt,0,-fs*.8,Math.round(44*s),CREAM,cw*.9/sc);}
      const tg=c.createLinearGradient(0,-fs/2,0,fs/2);tg.addColorStop(0,CREAM);tg.addColorStop(.45,b.col);tg.addColorStop(1,shade(b.col,-.25));
      sticker(c,noEmoji(b.txt),0,0,fs,tg,bmw);c.restore();}
  }
  c.restore();
}

/* ======================= LOOP ======================= */
let last=performance.now(),T=0,autoplay=false,viewBottom=GY+215;
const cam0=STAGE.camera.x;
function frame(now){
  requestAnimationFrame(frame);
  let rdt=Math.min(.05,(now-last)/1000);last=now;
  if(mode==='paused')rdt=0;
  if(slowT>0){slowT-=rdt;if(slowT<=0)slow=1;}
  let dt=rdt*slow;
  if(hitstop>0){hitstop-=rdt;dt=0;}
  T+=rdt;
  if(hintT>0){hintT-=rdt;if(hintT<=0)hideHints();else dimHints();} // key hint strips fade after a few seconds (frozen while paused)
  excite=Math.max(.25,excite-rdt*.12);
  if(crowdGain&&AC)crowdGain.gain.value=muted?0:.03+excite*.07;
  if(mode==='game'&&dt>0){
    for(let i=0;i<2;i++)updateFighter(F[i],F[1-i],i,dt,T);
    separate(F[0],F[1]);
    updateMatch(dt,T);
    $('pad1').querySelector('.spc').classList.toggle('ready',F[0].meter>=100);$('pad2').querySelector('.spc').classList.toggle('ready',F[1].meter>=100);
  }
  // camera
  let tx=W/2,tz=1;
  if(F.length&&mode!=='menu'&&mode!=='select'){const a=F[0].x,b=F[1].x;tx=(a+b)/2;const visW=cw/(ch/900);tz=clamp(visW/(Math.abs(a-b)+560),.85,1.1);
    const sp=F.find(f=>f.state==='special'&&f.t<.5);if(sp){tx=sp.x;tz=1.32;}
    if(phase==="pin"||phase==="roundEnd"){tz=1.2;}}
  else{tx=W/2+(REDUCED?0:Math.sin(T*.15)*250);tz=.8;}
  camX=lerp(camX,tx,1-Math.exp(-rdt*4));camZ=lerp(camZ,tz,1-Math.exp(-rdt*3));
  shake=REDUCED?0:Math.max(0,shake-rdt*60);
  // the kit's stadium behind follows the arena's camera a little (the stands are far away)
  STAGE.camera.x=cam0+(camX-W/2)*.12;
  // draw
  const c=ctx;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,cw,ch);
  const base=ch/900*camZ,sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
  const camY=Math.max(GY-235,GY+215-(ch*.5)/base);viewBottom=camY+(ch*.5)/base;   // zoomed in: look lower, so the apron's RING RUMBLE stays whole
  c.save();c.translate(cw/2+sx,ch*.5+sy);c.scale(base,base);c.translate(-camX,-camY);
  drawArena(T);drawRingBack(T);drawFighters(T);drawParticles(rdt*slow);drawRingFront(T);drawCoaches(T,rdt);
  c.restore();
  // soft vignette (Ink)
  const vg=c.createRadialGradient(cw/2,ch/2,ch*.35,cw/2,ch/2,Math.max(cw,ch)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,rgba(INK,.6));c.fillStyle=vg;c.fillRect(0,0,cw,ch);
  if(F.length&&(mode==='game'||mode==='paused'))drawHUD(T);
  if(flash>0){if(!REDUCED){c.fillStyle=rgba(CREAM,flash*.6);c.fillRect(0,0,cw,ch);}flash=Math.max(0,flash-rdt*2.5);}
}
requestAnimationFrame(frame);
