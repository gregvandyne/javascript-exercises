<title>Ring Rumble</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@600;800;900&display=swap">
<style>
/* Layout: full-screen canvas arena (landscape). HTML overlays for title, wrestler select, VS splash, results and the two touch pads. One committed look: a dark arena lit by spotlights. */
:root{
  --night:#05040b; --panel:#120f22; --line:#2d2650; --ink:#fff7ea; --muted:#a89fc9;
  --p1:#ff3b4e; --p2:#2f8bff; --gold:#ffcf3a; --hot:#ff7a1a;
  --display:"Bangers","Impact",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;z-index:5;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(80% 70% at 50% 40%,rgba(5,4,11,.15),rgba(5,4,11,.75))}
.logo{font:400 clamp(3rem,13vh,8rem)/.9 var(--display);letter-spacing:.04em;margin:0;text-align:center;transform:rotate(-3deg);
  background:linear-gradient(180deg,#fff 0%,#ffe9a8 30%,var(--gold) 50%,#ff8a00 75%,#c2410c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 #4a1300) drop-shadow(0 0 28px rgba(255,140,0,.55));animation:logoIn .8s cubic-bezier(.2,1.6,.4,1) both}
.logo span{display:block;font-size:.42em;letter-spacing:.2em;background:linear-gradient(#fff,#9fd2ff 60%,#2f8bff);-webkit-background-clip:text;background-clip:text}
@keyframes logoIn{from{transform:scale(2.4) rotate(-12deg);opacity:0}}
.tag{font:800 clamp(.7rem,2.4vh,1rem) var(--body);letter-spacing:.35em;text-transform:uppercase;color:var(--muted);margin:0}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn{font:400 clamp(1.2rem,4.4vh,1.9rem) var(--display);letter-spacing:.06em;padding:.45em 1.3em;border-radius:14px;cursor:pointer;color:#fff;
  border:3px solid #fff;background:linear-gradient(180deg,#ff5a6a,#d7102a);box-shadow:0 6px 0 #6b0614,0 0 26px rgba(255,59,78,.45);transform:skew(-8deg)}
.btn.blue{background:linear-gradient(180deg,#5aa7ff,#1554d1);box-shadow:0 6px 0 #0b2a6b,0 0 26px rgba(47,139,255,.45)}
.btn.gold{background:linear-gradient(180deg,#ffe27a,#f59e0b);color:#2a1600;box-shadow:0 6px 0 #7a4c00,0 0 26px rgba(255,207,58,.45)}
.btn.ghost{background:rgba(255,255,255,.06);box-shadow:0 4px 0 #000;border-color:rgba(255,255,255,.4);font-size:clamp(.9rem,3vh,1.2rem)}
.btn:active{transform:skew(-8deg) translateY(4px);box-shadow:0 2px 0 #000}
.btn:focus-visible,.card:focus-visible,.pb:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.keys{font-size:clamp(.6rem,1.9vh,.8rem);color:var(--muted);text-align:center;line-height:1.5;margin:0}
.keys b{color:var(--ink)}
#title,#ready,#controls{overflow-x:hidden;overflow-y:auto;justify-content:center;justify-content:safe center}

/* keyboard controls panel: two key-cap diagrams (P1 red, P2 blue), shown on desktop only */
.ctlwrap{display:flex;gap:clamp(12px,3vw,48px);justify-content:center;flex-wrap:wrap;--ks:clamp(30px,6vh,50px)}
.ctl{--kc:var(--p1);border:2px solid var(--kc);border-radius:16px;padding:clamp(6px,1.4vh,12px) clamp(10px,2vw,18px);background:rgba(10,8,20,.78);
  box-shadow:0 0 24px rgba(0,0,0,.6);box-shadow:0 0 24px color-mix(in srgb,var(--kc) 35%,transparent);text-align:center}
.ctl.p2{--kc:var(--p2)}
.ctl h3{font:400 clamp(1.1rem,4.2vh,1.8rem)/1 var(--display);letter-spacing:.05em;color:var(--kc);margin:0 0 clamp(4px,1vh,8px)}
.ctl h3 small{display:block;font:800 clamp(.72rem,1.6vh,.78rem)/1.3 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.ctlrow{display:flex;gap:clamp(10px,2vw,22px);align-items:center;justify-content:center}
.cluster{display:flex;flex-direction:column;align-items:center;gap:4px}
.kr{display:flex;gap:4px}
.cl{font:800 clamp(.72rem,1.6vh,.78rem) var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.acts2{display:flex;gap:clamp(6px,1vw,12px)}
.ak{display:flex;flex-direction:column;align-items:center;gap:4px}
.ak span{font:800 clamp(.72rem,1.6vh,.78rem) var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
kbd.k{display:inline-flex;align-items:center;justify-content:center;min-width:var(--ks);height:var(--ks);padding:0 .35em;box-sizing:border-box;border-radius:9px;
  font:900 calc(var(--ks)*.46)/1 var(--body);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.5);
  /* plain fallbacks first, then the color-mix() versions (older browsers keep the solid player colour) */
  background:var(--kc);box-shadow:0 4px 0 rgba(0,0,0,.55);
  background:linear-gradient(180deg,color-mix(in srgb,var(--kc) 70%,#fff 30%) 0%,var(--kc) 55%,color-mix(in srgb,var(--kc) 75%,#000) 100%);
  border:2px solid rgba(255,255,255,.75);box-shadow:0 4px 0 color-mix(in srgb,var(--kc) 45%,#000),0 0 10px color-mix(in srgb,var(--kc) 40%,transparent)}
kbd.k.spc{--kc:#f59e0b} kbd.k.esc{--kc:#6b6690}
.ctlfoot{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font:800 clamp(.7rem,1.8vh,.8rem) var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);--ks:clamp(26px,4.4vh,36px);--kc:#6b6690}
.ctlfoot b{color:var(--ink)}
/* short windows (844x390 laptops): smaller caps and tighter gaps, but every caption stays */
@media (max-height:460px){.ctlwrap{--ks:clamp(26px,6vh,50px)}.ctl{padding:5px clamp(8px,1.6vw,14px)}.ctl h3{margin-bottom:3px}.cluster,.ak{gap:2px}}
@media (max-width:600px){.ctlwrap{--ks:clamp(24px,5vh,40px)}#ready{gap:1vh}#ready .readyhead{font-size:clamp(1.6rem,6vh,3rem)}
  /* narrow desktop window: smaller logo, no tagline and tighter gaps so the two key panels sit above the fold */
  html.desk #title{gap:1vh}html.desk #title .logo{font-size:clamp(2.2rem,8vh,8rem)}html.desk #title .tag{display:none}
  html.desk #title .btn{font-size:clamp(1.1rem,3.4vh,1.9rem);padding:.4em 1.2em}html.desk #title .ctlwrap{--ks:clamp(22px,4vh,40px);gap:8px}html.desk #title .ctl{padding:5px 10px}}

/* Get ready screen (2 players, desktop) */
#ready{gap:1.4vh;background:linear-gradient(180deg,rgba(5,4,11,.88),rgba(5,4,11,.7))}
.readyhead{font:400 clamp(2rem,9vh,4.5rem)/1 var(--display);letter-spacing:.05em;margin:0;text-align:center;color:var(--gold);text-shadow:0 4px 0 #000,0 0 26px rgba(255,207,58,.5)}
.vsline{font:400 clamp(1rem,3.6vh,1.6rem)/1 var(--display);letter-spacing:.06em;margin:0;text-align:center}
.vsline .n1{color:var(--p1)} .vsline .n2{color:var(--p2)}
.anykey{font:400 clamp(1.1rem,4.4vh,2rem)/1 var(--display);letter-spacing:.08em;color:#fff;margin:0;text-align:center;text-shadow:0 3px 0 #000}

/* Controls screen (from pause / top buttons) */
#controls{background:linear-gradient(180deg,rgba(5,4,11,.9),rgba(5,4,11,.8))}
.notekb{font:800 clamp(.7rem,1.8vh,.85rem) var(--body);color:var(--muted);margin:0;text-align:center;letter-spacing:.05em}

/* in-fight key hint strips (desktop, 2 players, round 1) */
.hint{position:fixed;z-index:4;display:flex;gap:8px;align-items:center;flex-wrap:nowrap;white-space:nowrap;--ks:clamp(22px,min(3.4vh,2.1vw),28px);--kc:var(--p1);opacity:0;transition:opacity .7s;pointer-events:none;
  background:rgba(5,4,11,.6);padding:3px 8px;border-radius:10px;border:1px solid rgba(255,255,255,.18);max-width:calc(50vw - 32px);overflow:hidden} /* max-width is refined by layoutHints() so the two strips never meet */
.hint.p2{--kc:var(--p2);justify-content:flex-end}
.hint.show{opacity:1}
.hint.show.dim{opacity:.22;transition:opacity .15s} /* a wrestler is jumping through the strip's band: get out of the way */
.hint .hk{display:inline-flex;align-items:center;gap:3px}
.hint .hk em{font:800 clamp(.68rem,1.6vh,.75rem) var(--body);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-left:2px}
/* narrower stages (under ~1150px, e.g. 1024x768 and 844x390 windows): tighter strip so it stays one row; very narrow windows drop it (the Get ready screen showed the keys) */
@media (max-width:1150px){.hint{gap:4px;padding:3px 5px;--ks:clamp(20px,min(3vh,2.1vw),24px)}.hint .hk em{letter-spacing:.03em;font-size:.64rem;margin-left:0}.hint .hk{gap:2px}}
/* Narrow desktop windows: the strips would clip, so show only the key caps (players saw the full labels on the Get ready screen). */
@media (max-width:900px){.hint .hk em{display:none}.hint{gap:5px}.hint .hk{gap:0}}
@media (max-width:560px){.hint{display:none}}
@media (prefers-reduced-motion:reduce){.hint{transition:none}}

/* select */
#select{justify-content:center;gap:1.2vh;background:linear-gradient(180deg,rgba(5,4,11,.85),rgba(5,4,11,.6))}
.selhead{font:400 clamp(1.4rem,6vh,2.6rem)/1 var(--display);letter-spacing:.05em;margin:0;text-align:center}
.selhead.p1{color:var(--p1);text-shadow:0 0 18px rgba(255,59,78,.6)} .selhead.p2{color:var(--p2);text-shadow:0 0 18px rgba(47,139,255,.6)}
.grid{display:grid;--cols:4;--rows:2;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:1.2vh 10px;width:100%;max-width:1000px;flex:1;min-height:0;
  /* Cap the height so a card is never taller than about 2/3 of its width: the portrait (height 100%, 2:3) then takes ~45% of the card and the name,
     stats and special keep the rest. Without this, tall windows (1280x800, 1920x1080) stretch the rows and the portrait swallows the text column. */
  max-height:calc((min(100vw - 32px,1000px) - (var(--cols) - 1)*10px) / var(--cols) * 2 / 3 * var(--rows) + (var(--rows) - 1)*1.2vh)}
@media (max-width:600px){.grid{--cols:2;--rows:4}} /* narrow desktop windows: two columns of wider cards */
.card{position:relative;border:2px solid var(--line);border-radius:12px;background:linear-gradient(160deg,#1d1838,#0c0a18);cursor:pointer;color:var(--ink);
  display:flex;flex-direction:row;align-items:stretch;padding:0;overflow:hidden;min-height:0;text-align:start;font:inherit}
.card img{height:100%;aspect-ratio:2/3;object-fit:cover;flex:none;background:var(--c)}
.card .info{flex:1;min-width:0;padding:.6vh 8px;display:flex;flex-direction:column;justify-content:center;justify-content:safe center;gap:.3vh} /* safe: never clip the top of the name */
.card .nm{font:400 clamp(.8rem,3.2vh,1.35rem)/.95 var(--display);letter-spacing:.02em;overflow-wrap:anywhere}
.card .nk{font:800 clamp(.5rem,1.8vh,.72rem)/1.1 var(--body);color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;min-height:1.1em} /* nickname: up to two lines, then cut */
.stat{display:flex;align-items:center;gap:5px;font:900 clamp(.45rem,1.6vh,.62rem) var(--body);color:var(--muted)}
.stat i{flex:1;height:clamp(4px,1vh,7px);border-radius:9px;background:#2a2446;overflow:hidden;position:relative}
.stat i::after{content:"";position:absolute;inset:0;width:var(--v);background:linear-gradient(90deg,var(--c),#fff)}
.card .sp{font:400 clamp(.55rem,2vh,.8rem)/1 var(--display);letter-spacing:.04em;color:var(--gold);overflow-wrap:anywhere}
/* short or narrow windows: drop the nickname and tighten the text column so the name, stats and special all fit */
@media (max-height:520px),(max-width:600px){.card .nk{display:none}.card .info{gap:2px;padding:4px 6px}}
@media (max-width:600px){.card .nm{font-size:clamp(.8rem,2.4vh,1.05rem)}.card .sp{font-size:clamp(.55rem,1.6vh,.7rem)}}
.card:hover{border-color:#fff}
.card.p1{border-color:var(--p1);box-shadow:0 0 0 2px var(--p1),0 0 22px rgba(255,59,78,.55)}
.card.p2{border-color:var(--p2);box-shadow:0 0 0 2px var(--p2),0 0 22px rgba(47,139,255,.55)}
.card.p1.p2{box-shadow:0 0 0 2px var(--p1),0 0 0 5px var(--p2)}
.badge{position:absolute;top:4px;left:4px;font:400 .9rem var(--display);padding:1px 7px;border-radius:6px;color:#fff;letter-spacing:.05em}
.badge.b1{background:var(--p1)} .badge.b2{background:var(--p2);left:auto;right:4px}
.selfoot{display:flex;gap:12px;align-items:center}

/* VS */
#vs{background:none;overflow:hidden}
.half{position:absolute;top:0;bottom:0;width:62%;display:flex;align-items:flex-end;justify-content:center}
.half.l{left:-6%;background:linear-gradient(135deg,#ff3b4e,#7a0414);clip-path:polygon(0 0,100% 0,78% 100%,0 100%);animation:inL .45s cubic-bezier(.2,1.3,.4,1) both}
.half.r{right:-6%;background:linear-gradient(225deg,#2f8bff,#071f5c);clip-path:polygon(22% 0,100% 0,100% 100%,0 100%);animation:inR .45s cubic-bezier(.2,1.3,.4,1) both}
.half img{height:92%;max-width:70%;object-fit:contain;filter:drop-shadow(0 0 30px rgba(0,0,0,.6))}
.half .vn{position:absolute;top:10%;font:400 clamp(1.6rem,8vh,4rem)/1 var(--display);letter-spacing:.04em;text-shadow:0 4px 0 #000;text-align:center;width:80%}
.half.l .vn{left:6%} .half.r .vn{right:6%}
@keyframes inL{from{transform:translateX(-100%)}} @keyframes inR{from{transform:translateX(100%)}}
.vsword{position:relative;z-index:2;font:400 clamp(4rem,26vh,13rem)/1 var(--display);color:#fff;-webkit-text-stroke:4px #000;text-shadow:0 0 40px #ffcf3a,0 8px 0 #000;
  animation:vsIn .5s .35s cubic-bezier(.2,1.8,.4,1) both}
@keyframes vsIn{from{transform:scale(4) rotate(20deg);opacity:0}}

/* result */
#result .who{font:400 clamp(2.2rem,12vh,6rem)/1 var(--display);letter-spacing:.04em;margin:0;text-align:center;animation:logoIn .7s cubic-bezier(.2,1.6,.4,1) both;
  text-shadow:0 5px 0 #000,0 0 30px var(--wc,#ffcf3a)}
#result img{height:min(42vh,320px);filter:drop-shadow(0 0 30px var(--wc,#ffcf3a))}

/* touch pads */
.pad{position:fixed;bottom:0;z-index:4;display:flex;align-items:flex-end;gap:2vw;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));pointer-events:none}
.pad.p1{left:max(10px,env(safe-area-inset-left,0px))}
.pad.p2{right:max(10px,env(safe-area-inset-right,0px));flex-direction:row-reverse}
.dpad{display:grid;grid-template-columns:repeat(2,auto);gap:6px;pointer-events:auto}
.dpad .up{grid-column:1/3;justify-self:center}
.acts{display:grid;grid-template-columns:repeat(2,auto);gap:6px;pointer-events:auto}
.pb{--s:min(14vh,64px);width:var(--s);height:var(--s);border-radius:50%;border:2.5px solid rgba(255,255,255,.55);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--pc) 70%,#fff 10%),color-mix(in srgb,var(--pc) 55%,#000));
  color:#fff;font:400 calc(var(--s)*.3)/1 var(--display);letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;opacity:.78;
  box-shadow:0 4px 0 rgba(0,0,0,.6);touch-action:none;cursor:pointer;padding:0}
.pb b{font-size:calc(var(--s)*.38);line-height:1}
.pb small{font:400 calc(var(--s)*.17) var(--display);letter-spacing:.04em;text-transform:uppercase;max-width:92%;overflow:hidden;white-space:nowrap}
.pb.on{transform:scale(.9);opacity:1;filter:brightness(1.4)}
.pb.spc{--pc:#f59e0b}
.pb.spc.ready{animation:ready .6s infinite alternate;border-color:#fff}
@keyframes ready{to{box-shadow:0 0 22px #ffcf3a,0 0 4px #fff;filter:brightness(1.35)}}
.pad.p1 .pb{--pc:var(--p1)} .pad.p2 .pb{--pc:var(--p2)}
.pad .pb.spc{--pc:#f59e0b}
.topbtns{position:fixed;top:max(6px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:8px}
.ib{position:relative;width:34px;height:34px;border-radius:10px;border:2px solid rgba(255,255,255,.35);background:rgba(10,8,20,.6);color:#fff;font-size:1rem;cursor:pointer}
.ib::before{content:"";position:absolute;inset:-7px} /* 44px tap target: the pseudo-element grows from the 30px padding box (34px minus the 2px borders) */
#rotate{z-index:30;background:var(--night);text-align:center}
#rotate .ph{font-size:4rem;animation:spin 2s ease-in-out infinite}
@keyframes spin{50%{transform:rotate(-90deg)}}
#rotate p{font:400 2rem/1.1 var(--display);letter-spacing:.04em;margin:0}
@media (prefers-reduced-motion:reduce){.logo,.half,.vsword,#result .who,#rotate .ph{animation:none}}
/* Right-to-left languages (he, ar): menus and texts read right to left, but the arena, the key diagrams (P1 = left side of the
   keyboard), the in-fight key strips, the touch pads and the VS splash keep their left/right layout. */
[dir=rtl] .ctlwrap,[dir=rtl] .hint,[dir=rtl] .pad,[dir=rtl] #vs{direction:ltr}
[dir=rtl] .stat i::after{background:linear-gradient(270deg,var(--c),#fff)}
html[lang=ar] *{letter-spacing:0!important} /* letter spacing would pull the joined Arabic letters apart */
</style>

<canvas id="cv" data-i18n-aria="arena"></canvas>

<section class="screen" id="title">
  <h1 class="logo">Ring Rumble<span data-i18n="sub"></span></h1>
  <p class="tag" data-i18n="tag"></p>
  <div class="row">
    <button class="btn" id="go2" data-i18n="go2"></button>
    <button class="btn blue" id="go1" data-i18n="go1"></button>
  </div>
  <p class="keys" id="keysLine"></p>
  <!-- big key-cap diagrams; filled by controlsHTML() and shown on desktop (keyboard) only -->
  <div id="titleCtl" hidden></div>
</section>

<section class="screen" id="ready" hidden>
  <h2 class="readyhead" data-i18n="getReady"></h2>
  <p class="vsline"><bdi class="n1" id="rdyN1"></bdi> &nbsp;<span data-i18n="vs"></span>&nbsp; <bdi class="n2" id="rdyN2"></bdi></p>
  <div id="readyCtl"></div>
  <p class="anykey" data-i18n="anykey"></p>
  <div class="row"><button class="btn gold" id="fightBtn" data-i18n="fight"></button><button class="btn ghost" id="readyBack" data-i18n="pickAgain"></button></div>
</section>

<section class="screen" id="controls" hidden>
  <h2 class="readyhead" data-i18n="ctlTitle"></h2>
  <div id="ctlPanel"></div>
  <p class="notekb" id="padNote" data-i18n="padNote"></p>
  <div class="row"><button class="btn gold" id="ctlClose" data-i18n="back"></button><button class="btn ghost" id="padToggle"></button></div>
</section>

<section class="screen" id="select" hidden>
  <h2 class="selhead p1" id="selhead"></h2>
  <div class="grid" id="grid"></div>
  <div class="selfoot"><button class="btn ghost" id="selBack" data-i18n="back"></button></div>
</section>

<section class="screen" id="vs" hidden>
  <div class="half l"><div class="vn" id="vsN1"></div><img id="vsI1" alt=""></div>
  <div class="half r"><div class="vn" id="vsN2"></div><img id="vsI2" alt=""></div>
  <div class="vsword">VS</div>
</section>

<section class="screen" id="result" hidden>
  <img id="resImg" alt="">
  <h2 class="who" id="resWho"></h2>
  <div class="row">
    <button class="btn gold" id="rematch" data-i18n="rematch"></button>
    <button class="btn blue" id="newPick" data-i18n="newPick"></button>
  </div>
</section>

<div class="pad p1" id="pad1" hidden>
  <div class="dpad"><button class="pb up" data-k="up"><b>▲</b></button><button class="pb" data-k="left"><b>◀</b></button><button class="pb" data-k="right"><b>▶</b></button></div>
  <div class="acts"><button class="pb" data-k="punch"><b>👊</b><small data-i18n="punch"></small></button><button class="pb" data-k="kick"><b>🦶</b><small data-i18n="kick"></small></button><button class="pb" data-k="grab"><b>💪</b><small data-i18n="slam"></small></button><button class="pb spc" data-k="special"><b>⚡</b><small data-i18n="special"></small></button></div>
</div>
<div class="pad p2" id="pad2" hidden>

  // face + hair as detail on body group (after head fill)
  D(1,c=>drawFace(c,d,hp,S,p,t));

  for(const g of groups){
    // outline pass
    for(const pr of g){
      if(pr.t==='l'){c.lineCap='round';c.strokeStyle=OUT;c.lineWidth=pr.w+ow*2;line(c,pr.a,pr.b);}
      else if(pr.t==='c'){c.fillStyle=OUT;c.beginPath();c.arc(pr.c[0],pr.c[1],pr.r+ow,0,TAU);c.fill();}
      else if(pr.t==='p'&&!pr.noOut){c.strokeStyle=OUT;c.lineJoin='round';c.lineWidth=ow*2;poly(c,pr.pts);c.stroke();}

        if(pr.hl){c.strokeStyle='rgba(255,255,255,.22)';c.lineWidth=pr.w*.28;const o=[-pr.w*.2,-pr.w*.22];line(c,[pr.a[0]+o[0],pr.a[1]+o[1]],[pr.b[0]+o[0],pr.b[1]+o[1]]);}}
      else if(pr.t==='c'){c.fillStyle=pr.col;c.beginPath();c.arc(pr.c[0],pr.c[1],pr.r,0,TAU);c.fill();
        c.fillStyle='rgba(255,255,255,.2)';c.beginPath();c.arc(pr.c[0]-pr.r*.3,pr.c[1]-pr.r*.35,pr.r*.38,0,TAU);c.fill();}
      else if(pr.t==='p'){c.fillStyle=pr.col;poly(c,pr.pts);c.fill();}
      else if(pr.t==='d'){c.save();pr.fn(c);c.restore();}
    }
  }
}
function line(c,a,b){c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();}
function poly(c,pts){c.beginPath();pts.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.closePath();}
function star(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=-PI/2+i*PI/5,rr=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}c.closePath();c.fill();}
function drawFace(c,d,hp,S,p,t){
  const P=(x,y)=>hp(x,y);
  const path=(pts,fill,stroke,w)=>{c.beginPath();pts.forEach((q,i)=>{const r=P(q[0],q[1]);i?c.lineTo(r[0],r[1]):c.moveTo(r[0],r[1]);});c.closePath();if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=w*S;c.lineJoin='round';c.stroke();}};
  const ln=(pts,col,w)=>{c.beginPath();pts.forEach((q,i)=>{const r=P(q[0],q[1]);i?c.lineTo(r[0],r[1]):c.moveTo(r[0],r[1]);});c.strokeStyle=col;c.lineWidth=w*S;c.lineCap='round';c.lineJoin='round';c.stroke();};
  const dot=(x,y,r,col)=>{const q=P(x,y);c.fillStyle=col;c.beginPath();c.arc(q[0],q[1],r*S,0,TAU);c.fill();};
  const hurt=p.face==='hurt',yell=p.face==='yell';
  // beard
  if(d.beard)path([[2,-14],[30,-14],[28,-30],[16,-36],[2,-30],[-6,-16]],d.beard,OUT,2.2);
  // mask
  if(d.mask){
    path([[13,-6],[24,-2],[26,8],[14,6]],d.maskA,null);
    path([[-8,24],[2,8],[-4,4],[6,-14],[-2,-12],[-14,8],[-6,10]],d.maskA,null);
    path([[10,-14],[26,-12],[29,-22],[18,-30],[8,-24]],d.skin,OUT,2);
  }
  if(d.paint==='dark'){path([[4,4],[22,6],[22,-6],[6,-8]],'#1a1030',null);ln([[16,-12],[16,-24]],'#1a1030',3);}
  if(d.paint==='stripes'){ln([[6,-8],[18,-6]],'#ff2bd6',3);ln([[6,-14],[18,-12]],'#22d3ee',3);}
  // eye
  if(hurt){ln([[12,4],[20,-2]],OUT,2.5);ln([[12,-2],[20,4]],OUT,2.5);}
  else{path([[11,2],[21,3],[20,-3],[12,-3]],'#fff',OUT,1.6);dot(18,0,2.2,OUT);}
  ln([[8,9],[22,yell?10:6]],OUT,4.2);
  // nose
  if(!d.mask||true)path([[24,0],[31,-6],[25,-8]],d.mask?d.mask:d.skin,OUT,2);
  // mouth
  if(!d.beard||yell){if(yell)path([[14,-15],[25,-14],[24,-24],[16,-24]],'#5a0d14',OUT,2);else ln([[15,-17],[24,-16]],OUT,2.4);}

  const hc=d.hairC||'#222';

  if(d.hair==='flat')path([[-24,6],[-22,30],[20,30],[24,14],[12,14],[-6,12],[-20,-2]],hc,OUT,2);
  if(d.hair==='long')path([[-26,6],[-12,26],[8,28],[22,18],[8,14],[-8,12],[-22,-10]],hc,OUT,2);
  if(d.hair==='ponytail')path([[-24,4],[-12,24],[8,28],[22,18],[10,14],[-8,10],[-22,-6]],hc,OUT,2);
  if(d.hair==='mohawk'){path([[-26,10],[-22,38],[-10,26],[-6,46],[4,30],[12,44],[16,24],[22,18],[8,18],[-14,14]],hc,OUT,2);}
  if(d.hair==='spiky'){path([[-26,4],[-34,22],[-16,22],[-18,40],[-2,28],[4,44],[12,26],[26,30],[20,16],[0,14],[-18,4]],hc,OUT,2);}
  if(d.hair==='bald'){const q=P(-2,18);c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.ellipse(q[0],q[1],9*S,4*S,0,0,TAU);c.fill();}

}

/* ======================= POSES ======================= */
function basePose(){return{lean:.1,tilt:0,rot:0,a:[.7,2.5,.4,2.3],l:[.28,-.05,-.22,-.1],face:'',hipH:null};}
function poseFor(f,t){
  const p=basePose(),st=f.state,u=f.t,sp=f.dur?clamp(u/f.dur,0,1):0;
  const br=Math.sin(t*3.2+f.seed);
  switch(st){
    case 'idle':p.lean=.12+br*.02;p.a=[.75+br*.05,2.55+br*.06,.45,2.35];p.l=[.32,-.08,-.24,-.12];break;
    case 'walk':{const ph=f.walkPh;p.lean=.16;p.a=[.75+Math.sin(ph)*.15,2.5,.45-Math.sin(ph)*.15,2.3];
      const s1=Math.sin(ph),s2=Math.sin(ph+PI);p.l=[.05+.42*s1,.05+.42*s1-.55*Math.max(0,Math.sin(ph+1.4)),.05+.42*s2,.05+.42*s2-.55*Math.max(0,Math.sin(ph+1.4+PI))];break;}
    case 'block':p.lean=-.02;p.a=[1.05,2.95,.95,2.85];p.l=[.38,-.15,-.3,-.2];p.tilt=.15;break;
    case 'punch':p.face='yell';if(sp<.3){p.lean=.05;p.a=[.3,2.7,.6,2.5];}else if(sp<.7){p.lean=.32;p.a=[1.57,1.57,.2,2.4];p.l=[.45,-.1,-.4,-.2];}else{p.lean=.15;p.a=[1.2,2.0,.4,2.3];}break;
    case 'kick':p.face='yell';if(sp<.3){p.lean=-.05;p.l=[1.1,.2,-.15,-.1];p.a=[.9,2.2,-.4,1.0];}else if(sp<.72){p.lean=-.38;p.l=[1.58,1.6,-.12,-.08];p.a=[1.1,2.0,-.7,.4];}else{p.lean=0;p.l=[.7,.3,-.2,-.1];}break;
    case 'grab':p.lean=.28;p.a=[1.4,1.55,1.3,1.5];p.l=[.45,-.1,-.4,-.2];break;
    case 'slam':p.face='yell';if(u<.42){p.lean=-.12;p.a=[2.9,3.05,2.8,3.0];p.l=[.3,-.1,-.3,-.15];}else{p.lean=.55;p.a=[1.7,1.3,1.6,1.2];p.l=[.6,-.2,-.5,-.3];}break;
    case 'held':p.face='hurt';p.a=[2.2+Math.sin(t*20)*.4,2.6,1.9+Math.cos(t*18)*.4,2.4];p.l=[.7+Math.sin(t*17)*.3,.2,-.3,-.6];p.rot=f.holdRot;p.hipH=0;break;
    case 'hit':p.face='hurt';p.lean=-.38;p.tilt=-.35;p.a=[-.2,.7,-.5,.3];p.l=[.36,.1,-.36,-.22];break;
    case 'down':case 'ko':p.face='hurt';p.rot=-PI/2;p.hipH=27*f.d.size;p.lean=0;p.a=[2.6,2.95,2.3,2.8];p.l=[.08,0,-.05,.02];
      if(st==='down'&&u<.25){p.rot=-PI/2+Math.sin(u*25)*.08;}break;
    case 'getup':p.lean=.4;p.a=[.9,1.2,.7,1.1];p.l=[1.3,-.4,.2,-.8];break;
    case 'air':if(f.dropkick){p.face='yell';p.rot=-1.05;p.l=[1.6,1.6,1.45,1.5];p.a=[-1.2,-1.0,-1.5,-1.2];}else{p.l=[1.15,.1,.85,-.2];p.a=[1.9,2.7,1.6,2.5];p.lean=.05;}break;
    case 'special':p.face='yell';
      if(u<.5){p.lean=.02;p.a=[1.57,3.1,-1.3,-2.9];p.l=[.6,-.4,-.6,.2];}
      else if(u<1.15){p.rot=((u-.5)/.65)*TAU;p.l=[1.5,.2,1.3,.1];p.a=[2.4,2.8,2.0,2.6];}
      else{p.lean=.5;p.a=[2.6,2.9,2.4,2.8];p.l=[.9,-.3,-.6,-.4];}break;
    case 'pin':p.rot=PI/2-.08;p.hipH=58*f.d.size;p.lean=0;p.a=[.6,.2,.4,.1];p.l=[.1,.2,-.1,.3];break;
    case 'win':p.face='yell';p.lean=-.05;p.a=[2.95+Math.sin(t*8)*.1,3.1,2.85-Math.sin(t*8)*.1,3.0];p.l=[.3,-.08,-.25,-.1];break;
    case 'ref':p.lean=.85;p.l=[1.45,.1,-.15,-1.45];p.a=[f.slap?0.35:1.9,f.slap?0.2:2.6,.6,.3];break;
    case 'refwalk':{const ph=f.walkPh;p.lean=.1;const s1=Math.sin(ph),s2=Math.sin(ph+PI);p.l=[.4*s1,.4*s1-.4*Math.max(0,Math.sin(ph+1.4)),.4*s2,.4*s2-.4*Math.max(0,Math.sin(ph+1.4+PI))];p.a=[.3*s2,.6,.3*s1,.6];break;}
  }
  return p;
}
function blendPose(cur,tgt,k){
  if(!cur)return JSON.parse(JSON.stringify(tgt));
  cur.lean=lerp(cur.lean,tgt.lean,k);cur.tilt=lerp(cur.tilt,tgt.tilt,k);
  let dr=tgt.rot-cur.rot;if(Math.abs(dr)>PI*1.2&&tgt.rot===0)cur.rot=cur.rot%TAU,dr=tgt.rot-cur.rot;
  cur.rot=lerp(cur.rot,tgt.rot,k);
  for(let i=0;i<4;i++){cur.a[i]=lerp(cur.a[i],tgt.a[i],k);cur.l[i]=lerp(cur.l[i],tgt.l[i],k);}
  cur.face=tgt.face;
  cur.hipH=tgt.hipH==null?null:(cur.hipH==null?tgt.hipH:lerp(cur.hipH,tgt.hipH,k));
  return cur;
}

const portraitCache={};
function portrait(d,w,h,mode){
  const key=d.name+w+mode;if(portraitCache[key])return portraitCache[key];
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  if(mode!=='clear'){const g=x.createRadialGradient(w/2,h*.35,10,w/2,h*.5,h*.8);g.addColorStop(0,rgba(d.aura,.9));g.addColorStop(.55,rgba(d.aura,.25));g.addColorStop(1,'#0c0a18');x.fillStyle=g;x.fillRect(0,0,w,h);
    x.strokeStyle=rgba('#ffffff',.08);x.lineWidth=2;for(let i=-h;i<w;i+=16){x.beginPath();x.moveTo(i,h);x.lineTo(i+h,0);x.stroke();}}
  const p=poseFor({state:mode==='head'?'idle':'win',t:0,dur:0,seed:0,d},0);
  if(mode!=='head'){p.a=[1.57,3.1,-1.35,-2.95];p.lean=.02;p.face='yell';}
  const sc=h/400;
  x.save();
  const hh=poseHipHeight(d,p);x.translate(w*.5,h*.97-hh*sc);x.scale(sc,sc);
  drawWrestler(x,d,p,0);
  x.restore();
  return portraitCache[key]=c;
}
function headPortrait(d,size){
  const key=d.name+'head'+size;if(portraitCache[key])return portraitCache[key];
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
  const g=x.createRadialGradient(size/2,size*.4,4,size/2,size/2,size*.7);g.addColorStop(0,rgba(d.aura,.95));g.addColorStop(1,'#0c0a18');x.fillStyle=g;x.fillRect(0,0,size,size);
  const p=basePose();p.lean=0;p.face='yell';
  const sc=size/(95*d.size);
  // head centre is at about (2, -T*1.08 - 24) relative to the hip
  const S=d.size,hy=-(112*S*1.08+24*S),hx=2*S;
  x.save();x.translate(size*.46,size*.56);x.scale(sc,sc);x.translate(-hx-6*S,-hy);drawWrestler(x,d,p,0);x.restore();
  return portraitCache[key]=c;
}

let AC=null,muted=false,noiseBuf=null,crowdGain=null;
function audio(){
  if(AC||muted)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=650;bp.Q.value=.6;
  crowdGain=AC.createGain();crowdGain.gain.value=0;src.connect(bp);bp.connect(crowdGain);crowdGain.connect(AC.destination);src.start();
}
function noise(dur,type,freq,gain,q=1,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay;const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=AC.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t,Math.random());s.stop(t+dur+.05);}
function tone(f0,f1,dur,gain,type='sine',delay=0){if(!AC||muted)return;const t=AC.currentTime+delay;const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);}
function cheer(amt){noise(1.4,'bandpass',1100,.18*amt,.4);noise(1.8,'bandpass',700,.14*amt,.5,.1);}
const SFX={
  punch(){noise(.09,'bandpass',1200,.5,1.2);tone(160,55,.12,.6);},
  kick(){noise(.14,'lowpass',1600,.6);tone(110,40,.18,.8);},
  block(){noise(.06,'highpass',2500,.25);tone(600,400,.06,.15,'square');},
  whiff(){noise(.12,'highpass',1800,.12,.5);},
  slam(){noise(.5,'lowpass',500,1);tone(70,28,.5,1);cheer(1.2);},
  bell(){[0,.32,.64].forEach(dl=>{tone(1320,1300,.9,.25,'sine',dl);tone(880,870,1,.2,'triangle',dl);});},
  special(){tone(180,1400,.6,.25,'sawtooth');noise(.6,'highpass',900,.2);},
  boom(){noise(.8,'lowpass',380,1.2);tone(55,22,.8,1.2);cheer(1.6);},
  jump(){tone(300,600,.12,.12,'triangle');},
  count(){noise(.08,'lowpass',900,.7);tone(140,60,.1,.5);}
};

  if(mode==='ready'&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&!/^(Escape|Tab|F\d\d?|Shift|Control|Alt|Meta|OS|CapsLock|NumLock|ScrollLock|ContextMenu|Unidentified)/.test(e.code||'')
     &&!(/^(Enter|NumpadEnter|Space)$/.test(e.code)&&document.activeElement&&document.activeElement.tagName==='BUTTON')){e.preventDefault();startFromReady();return;}

function playerPanel(pl){

    <div class="acts2">${ACTIONS.map(([a,n])=>`<div class="ak">${cap(k[a],a==='special'?'spc':'')}<span>${t(n)}</span></div>`).join('')}</div>
  </div></div>`;
}

/* Put the strips just under the HUD (same numbers as drawHUD: bar, name, meter, "SPECIAL READY" text). */
function layoutHints(){
  const s=Math.min(cw/1400,ch/720),pad=Math.max(12,ch*.03),barH=Math.max(12,30*s),top=pad+(ch<500?4:10),mh=Math.max(6,barH*.32);
  const y=top+2+barH+barH*1.15+mh+2+mh*1.5+8;

/* ======================= AI ======================= */
function think(f,o,dt){
  const a=f.ai;a.t-=dt;a.inp=a.inp||{};
  ['punch','kick','grab','special','up'].forEach(k=>a.inp[k]=false);
  if(a.t>0)return;
  a.t=rand(.12,.32);a.inp.left=a.inp.right=false;
  if(phase!=='fight'||!['idle','walk','block'].includes(f.state))return;
  const dist=Math.abs(o.x-f.x),toward=o.x>f.x?'right':'left',away=toward==='right'?'left':'right';
  if(f.meter>=100&&Math.random()<.6){a.inp.special=true;return;}
  if(['punch','kick','grab'].includes(o.state)&&dist<190&&Math.random()<.35){a.inp[away]=true;a.t=.35;return;}
  if(dist>175){if(Math.random()<.85)a.inp[toward]=true;if(Math.random()<.06)a.inp.up=true;if(dist<330&&Math.random()<.08){a.inp.up=true;a.inp[toward]=true;}return;}
  const r=Math.random();
  if(o.state==='down'||o.state==='getup'){a.inp[away]=Math.random()<.5;return;}
  if(r<.38)a.inp.punch=true;else if(r<.62)a.inp.kick=true;else if(r<.8)a.inp.grab=true;else if(r<.9)a.inp[away]=true;
}

/* ======================= COMBAT ======================= */
const WORDS=Object.assign({block:[t('block')]},tv('words'));
function canAct(f){return['idle','walk','block'].includes(f.state);}
function hurt(v,a,dmg,kind){
  if(v.invuln>0||['down','ko','held','getup'].includes(v.state))return false;
  const front=Math.sign(v.x-a.x)||a.face;
  const hx=v.x-front*30*v.d.size,hy=GY+v.y-200*v.d.size;
  if(v.backing&&v.y===0&&(kind==='punch'||kind==='kick')&&canAct(v)){
    v.hp-=dmg*.2*v.tough;v.vx=front*220;setState(v,'block',.22);
    sparks(hx,hy,'#7dd3fc',10);addText(hx,hy-40,t('block'),'#7dd3fc',.8);SFX.block();a.meter=Math.min(100,a.meter+3);v.meter=Math.min(100,v.meter+4);hitstop=.04;checkKO(v,a);return true;
  }
  const d=dmg*a.pw*v.tough;v.hp-=d;v.flashT=.12;
  a.meter=Math.min(100,a.meter+(kind==='special'?0:d*1.4));v.meter=Math.min(100,v.meter+d*1.1);
  a.combo=a.comboT>0?a.combo+1:1;a.comboT=1.1;
  excite=Math.min(1,excite+d/40);
  const big=kind==='slam'||kind==='special'||kind==='dropkick'||a.combo>=4;
  sparks(hx,hy,kind==='special'?a.d.aura:'#ffe066',big?28:14);
  ring(hx,hy,big?140:70,kind==='special'?a.d.aura:'#fff');
  addText(hx+front*20,hy-60,pick(WORDS[kind]||WORDS.punch),kind==='special'?a.d.aura:pick(['#ffcf3a','#ff5a6a','#5aa7ff','#a3ff12']),big?1.5:1.05);
  shake=Math.max(shake,big?22:kind==='kick'?10:6);hitstop=big?.12:.07;
  if(kind==='punch')SFX.punch();else if(kind==='kick'||kind==='dropkick')SFX.kick();
  if(big){knockDown(v,front,kind==='special'?520:420);if(a.combo>=4&&kind!=='slam'&&kind!=='special'){a.combo=0;}}
  else{setState(v,'hit',kind==='kick'?.42:.3);v.vx=front*(kind==='kick'?520:330);}
  checkKO(v,a);return true;
}
function knockDown(v,front,push){setState(v,'down',1.05);v.vx=front*push;v.vy=-420;v.y=Math.min(v.y,-1);v.airDown=true;}
function checkKO(v,a){
  if(v.hp<=0&&phase==='fight'){v.hp=0;phase='ko';phaseT=0;slow=.25;slowT=1.3;flash=1;banner={txt:t('ko'),t:0,col:'#ff3b4e',big:1};SFX.boom();
    if(v.state!=='down')knockDown(v,Math.sign(v.x-a.x)||1,380);v.koed=true;winner=a.side;}
}
function tryHit(f,o,range,dmg,kind){
  if(f.hitDone)return;
  const dx=(o.x-f.x)*f.face;
  if(dx>-10&&dx<range*f.d.size&&Math.abs(o.y-f.y)<170){f.hitDone=true;if(!hurt(o,f,dmg,kind)){}}
}
function startSlam(f,o){setState(f,'slam',1.05);setState(o,'held',1.05);o.holder=f;f.victim=o;f.vx=0;o.vx=0;SFX.whiff();}
function startSpecial(f,o){
  f.meter=0;setState(f,'special',1.75);f.sx0=f.x;f.vx=0;f.target=o;f.hitDone=false;
  banner={txt:f.d.spn,t:0,col:f.d.aura,sub:f.d.dn};slow=.55;slowT=.5;flash=.6;SFX.special();excite=1;
}

/* ======================= UPDATE ======================= */
function updateFighter(f,o,i,dt,T){
  f.t+=dt;f.invuln=Math.max(0,f.invuln-dt);f.comboT-=dt;f.flashT-=dt;
  if((vsCPU&&i===1)||autoplay)think(f,o,dt);
  const inp=readInput(f,i);
  const active=phase==='fight';
  const grounded=f.y>=0;
  // face opponent
  if(canAct(f)&&grounded)f.face=o.x>=f.x?1:-1;
  f.backing=false;
  switch(f.state){
    case 'idle':case 'walk':case 'block':{
      if(f.state==='block'&&f.t<f.dur){f.vx*=.85;break;}
      if(!active){f.vx=0;if(f.state!=='idle')setState(f,'idle');break;}
      if(inp.ev.special&&f.meter>=100){consume(f,'special');startSpecial(f,o);break;}
      if(inp.ev.special){consume(f,'special');}
      if(inp.ev.punch){consume(f,'punch');setState(f,'punch',.34*(1.12-f.d.Sp*.03));SFX.whiff();break;}
      if(inp.ev.kick){consume(f,'kick');setState(f,'kick',.5*(1.12-f.d.Sp*.03));SFX.whiff();break;}
      if(inp.ev.grab){consume(f,'grab');setState(f,'grab',.38);break;}
      if(inp.ev.up){consume(f,'up');setState(f,'air');f.vy=-1000-f.d.Sp*25;f.y=-1;f.dropkick=false;SFX.jump();break;}
      const dir=(inp.right?1:0)-(inp.left?1:0);
      f.backing=dir!==0&&dir===-f.face;
      f.vx=dir*f.spd*(f.backing?.7:1);
      if(dir){if(f.state!=='walk')setState(f,'walk');f.walkPh+=dt*f.spd/22*(dir*f.face);}else if(f.state!=='idle')setState(f,'idle');
      break;}
    case 'punch':f.vx=0;if(f.t>f.dur*.3&&f.t<f.dur*.65)tryHit(f,o,128,6,'punch');if(f.t>=f.dur)setState(f,'idle');break;
    case 'kick':f.vx=0;if(f.t>f.dur*.32&&f.t<f.dur*.7)tryHit(f,o,168,9,'kick');if(f.t>=f.dur)setState(f,'idle');break;
    case 'grab':f.vx=0;
      if(!f.hitDone&&f.t>.1){f.hitDone=true;const dx=(o.x-f.x)*f.face;
        if(dx>0&&dx<135*f.d.size&&o.y===0&&o.invuln<=0&&!['down','ko','held','getup','air'].includes(o.state)){startSlam(f,o);break;}}
      if(f.t>=f.dur)setState(f,'idle');break;
    case 'slam':{const v=f.victim,u=f.t;
      if(u<.42){const k=u/.42;v.x=f.x+f.face*lerp(40,10,k);v.y=-lerp(40,330,k)*f.d.size;v.holdRot=-PI/2*f.face*k*1.0;v.face=-f.face;}
      else if(u<.62){const k=(u-.42)/.2;v.x=f.x+f.face*lerp(10,150,k);v.y=-lerp(330*f.d.size,26,k*k);v.holdRot=(-PI/2-PI*.9*k)*f.face;}
      else if(!f.hitDone){f.hitDone=true;v.y=0;v.x=f.x+f.face*150;v.state='idle';v.holdRot=0;
        const d=13*f.pw*v.tough;v.hp-=d;f.meter=Math.min(100,f.meter+18);v.meter=Math.min(100,v.meter+12);v.face=-f.face;
        setState(v,'down',1.2);v.vx=f.face*120;v.vy=-300;v.y=-1;v.airDown=true;v.pose=null;
        dust(v.x,GY,40);ring(v.x,GY-20,220,'#fff');addText(v.x,GY-260,pick(WORDS.slam),'#ffcf3a',1.6);shake=26;hitstop=.1;ropeShake=1;excite=1;SFX.slam();checkKO(v,f);}
      if(u>=f.dur)setState(f,'idle');break;}
    case 'held':f.vx=0;if(!f.holder||f.holder.state!=='slam'){setState(f,'idle');f.y=0;}break;
    case 'hit':f.vx*=Math.pow(.02,dt);if(f.t>=f.dur)setState(f,'idle');break;
    case 'down':f.vx*=Math.pow(.05,dt);if(f.koed){if(f.t>.6)f.state='ko';break;}if(f.t>=f.dur&&f.y>=0){setState(f,'getup',.35);}break;
    case 'getup':f.vx=0;if(f.t>=f.dur){setState(f,'idle');f.invuln=.7;}break;
    case 'air':
      if(inp.ev.kick&&!f.dropkick){consume(f,'kick');f.dropkick=true;f.vx=f.face*520;SFX.whiff();}
      if(f.dropkick)tryHit(f,o,150,9,'dropkick');
      break;
    case 'special':{const u=f.t,o2=f.target;f.vx=0;
      if(u<.5){}
      else if(u<1.15){const k=(u-.5)/.65;const tx=o2.x;f.x=lerp(f.sx0,tx-f.face*10,k);f.y=-Math.sin(k*PI)*420-(k>.85?0:0);}
      else if(!f.hitDone){f.hitDone=true;f.y=0;const before=o2.invuln;o2.invuln=0;
        if(!['held'].includes(o2.state)){o2.state=o2.state==='down'?'idle':o2.state;hurt(o2,f,26,'special');}
        o2.invuln=Math.max(o2.invuln,before);
        dust(f.x,GY,60);ring(f.x,GY-30,340,f.d.aura);shake=34;flash=.8;ropeShake=1.4;SFX.boom();f.x+= -f.face*90;}
      if(u>=f.dur)setState(f,'idle');break;}
    case 'pin':case 'win':case 'ko':f.vx=0;break;
  }
  // physics
  if(f.state!=='held'&&f.state!=='special'&&!(f.state==='slam')){
    if(f.y<0||f.vy<0){f.vy+=2700*dt;f.y+=f.vy*dt;if(f.y>=0){f.y=0;f.vy=0;
      if(f.state==='air'){setState(f,'idle');dust(f.x,GY,10);}
      if(f.airDown){f.airDown=false;dust(f.x,GY,24);shake=Math.max(shake,12);if(!f.koed)SFX.kick();}}}
    f.x+=f.vx*dt;
  }
  f.x=clamp(f.x,LEFTX,RIGHTX);
  if(f.state==='walk'&&Math.random()<dt*2)0;
  // pose
  const tgt=poseFor(f,T);
  const fast=['punch','kick','slam','special','hit','held'].includes(f.state);
  f.pose=blendPose(f.pose,tgt,1-Math.exp(-dt*(fast?34:16)));
  if(f.state==='held'||f.state==='special')f.pose.rot=tgt.rot;
  f.hpTrail=f.hpTrail>f.hp?f.hpTrail-dt*30:f.hp;
}
function separate(a,b){
  if(a.state==='held'||b.state==='held'||a.state==='special'||b.state==='special'||a.y<0||b.y<0)return;
  if(['down','ko','pin'].includes(a.state)||['down','ko','pin'].includes(b.state))return;
  const min=95*(a.d.size+b.d.size)/2,dx=b.x-a.x;
  if(Math.abs(dx)<min){const push=(min-Math.abs(dx))/2*Math.sign(dx||1);a.x-=push;b.x+=push;a.x=clamp(a.x,LEFTX,RIGHTX);b.x=clamp(b.x,LEFTX,RIGHTX);}
}

/* ======================= PARTICLES ======================= */
function sparks(x,y,col,n){for(let i=0;i<n;i++){const a=rand(0,TAU),s=rand(300,900);parts.push({k:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.18,.4),t:0,col});}}
function dust(x,y,n){for(let i=0;i<n;i++){parts.push({k:'dust',x:x+rand(-60,60),y:y-rand(0,10),vx:rand(-260,260),vy:-rand(40,240),life:rand(.4,.9),t:0,r:rand(10,26)});}}
function ring(x,y,r,col){parts.push({k:'ring',x,y,r,life:.35,t:0,col});}
function addText(x,y,txt,col,sc){texts.push({x,y,txt,col,sc,t:0,life:.85,rot:rand(-.25,.25)});}
function confetti(n){for(let i=0;i<n;i++)parts.push({k:'conf',x:rand(camX-900,camX+900),y:rand(-200,100),vx:rand(-60,60),vy:rand(150,320),life:rand(2.5,4),t:0,col:pick(['#ffcf3a','#ff3b4e','#2f8bff','#a3ff12','#fff','#ff2bd6']),rot:rand(0,TAU),vr:rand(-8,8)});}
function pyro(x){for(let i=0;i<40;i++){const a=rand(-PI*.9,-PI*.1),s=rand(400,1100);parts.push({k:'spark',x,y:GY-330,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.5,1.1),t:0,col:pick(['#ffcf3a','#ff7a1a','#fff'])});}}

/* ======================= MATCH FLOW ======================= */
function startMatch(){
  wins=[0,0];round=1;F=[mkFighter(picks[0],0),mkFighter(picks[1],1)];
  startRound();
  showScreen(null);matchLive=true;padsTouched=false;applyPads();$('topbtns').hidden=false;
  mode='game';
  // desktop: remind the keyboard players of their keys for the first few seconds of round 1 (P1 only vs the computer)
  if(desktop&&!autoplay)showHints();else hideHints();
}
function startRound(){
  F.forEach((f,i)=>{Object.assign(f,{x:i?RIGHTX-170:LEFTX+170,y:0,vx:0,vy:0,face:i?-1:1,hp:100,hpTrail:100,invuln:0,koed:false,pose:null,buf:{},combo:0,victim:null,holder:null,airDown:false});setState(f,'idle');});
  ref=null;parts=[];texts=[];phase='intro';phaseT=0;winner=-1;countN=0;
  banner={txt:round===3?t('finalRound'):t('round',{n:round}),t:0,col:'#ffcf3a',big:1};SFX.bell();
}
function updateMatch(dt,T){
  phaseT+=dt;
  if(phase==='intro'){if(phaseT>1.3&&!banner2){banner={txt:t('fightB'),t:0,col:'#ff3b4e',big:1};banner2=true;}if(phaseT>1.9){phase='fight';banner2=false;}}
  if(phase==='ko'&&phaseT>1.6){
    // winner goes for the pin
    const w=F[winner],l=F[1-winner];
    if(['down','ko'].includes(l.state)&&l.y===0&&canAct(w)||w.state==='hit'||w.state==='idle'){
      phase='pin';phaseT=0;
      w.x=l.x;w.y=0;setState(w,'pin');w.face=l.face*-1;w.pose=null;
      ref={d:REF,x:camX+900,y:0,face:-1,state:'refwalk',t:0,dur:0,seed:1,walkPh:0,pose:null,slap:false};
    } else if(phaseT>4){phase='pin';phaseT=0;}
  }
  if(phase==='pin'&&ref){
    const target=F[winner].x+90;
    if(ref.state==='refwalk'){ref.walkPh+=dt*10;ref.x-=dt*700;if(ref.x<=target){ref.x=target;ref.state='ref';ref.t=0;ref.face=-1;ref.pose=null;phaseT=0;}}
    else{
      const n=Math.floor((phaseT-.15)/.8)+1;
      ref.slap=((phaseT-.15)%.8)>.55;
      if(n>countN&&n<=3&&((phaseT-.15)%.8)>.55){countN=n;SFX.count();shake=8;addText(ref.x-60,GY-300,String(n),'#ffffff',2.4);excite=Math.min(1,excite+.3);}
      if(phaseT>2.9&&phase==='pin'){phase='roundEnd';phaseT=0;SFX.bell();cheer(1.5);wins[winner]++;
        const w=F[winner];setState(w,'win');w.x=clamp(w.x-w.face*120,LEFTX,RIGHTX);w.face=w.x<W/2?1:-1;w.pose=null;
        banner={txt:wins[winner]>=2?t('wins',{name:w.d.dn}):t('roundTo',{who:winner===0?'P1':(vsCPU?'CPU':'P2')}),t:0,col:winner?'#2f8bff':'#ff3b4e',big:wins[winner]>=2?1:0};
        confetti(120);pyro(150);pyro(1450);}
    }
    ref.pose=blendPose(ref.pose,poseFor(ref,T),1-Math.exp(-dt*20));ref.t+=dt;
  }
  if(phase==='roundEnd'){
    if(Math.random()<dt*3)pyro(pick([150,1450]));
    if(phaseT>3.4){
      if(wins[winner]>=2)endMatch();else{round++;startRound();}
    }
  }
}
let banner2=false;
function endMatch(){
  phase='over';mode='result';const w=F[winner];
  matchLive=false;applyPads();hideHints();$('topbtns').hidden=true;
  $('resWho').textContent=t('wins',{name:w.d.dn});$('result').style.setProperty('--wc',w.d.aura);
  $('resImg').src=portrait(w.d,300,400,'clear').toDataURL();
  showScreen('result');
}

function drawArena(T){
  const c=ctx;

/* ======================= LOOP ======================= */
let last=performance.now(),T=0,autoplay=false;
function frame(now){
  requestAnimationFrame(frame);
  let rdt=Math.min(.05,(now-last)/1000);last=now;
  if(mode==='paused')rdt=0;
  if(slowT>0){slowT-=rdt;if(slowT<=0)slow=1;}
  let dt=rdt*slow;
  if(hitstop>0){hitstop-=rdt;dt=0;}
  T+=rdt;
  if(hintT>0){hintT-=rdt;if(hintT<=0)hideHints();else dimHints();} // key hint strips fade after a few seconds (frozen while paused)
  excite=Math.max(.25,excite-rdt*.12);
  if(crowdGain&&AC)crowdGain.gain.value=muted?0:.03+excite*.07;
  if(mode==='game'&&dt>0){
    for(let i=0;i<2;i++)updateFighter(F[i],F[1-i],i,dt,T);
    separate(F[0],F[1]);
    updateMatch(dt,T);
    $('pad1').querySelector('.spc').classList.toggle('ready',F[0].meter>=100);$('pad2').querySelector('.spc').classList.toggle('ready',F[1].meter>=100);
  }
  // camera
  let tx=W/2,tz=1;
  if(F.length&&mode!=='menu'&&mode!=='select'){const a=F[0].x,b=F[1].x;tx=(a+b)/2;const visW=cw/(ch/900);tz=clamp(visW/(Math.abs(a-b)+560),.85,1.1);
    const sp=F.find(f=>f.state==='special'&&f.t<.5);if(sp){tx=sp.x;tz=1.32;}
    if(phase==="pin"||phase==="roundEnd"){tz=1.2;}}
  else{tx=W/2+Math.sin(T*.15)*250;tz=.8;}
  camX=lerp(camX,tx,1-Math.exp(-rdt*4));camZ=lerp(camZ,tz,1-Math.exp(-rdt*3));
  shake=Math.max(0,shake-rdt*60);
  // draw
  const c=ctx;c.setTransform(dpr,0,0,dpr,0,0);
  const base=ch/900*camZ,sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
  c.save();c.translate(cw/2+sx,ch*.5+sy);c.scale(base,base);c.translate(-camX,-(GY-235));
  drawArena(T);drawRingBack(T);drawFighters(T);drawParticles(rdt*slow);drawRingFront(T);
  c.restore();
  // vignette
  const vg=c.createRadialGradient(cw/2,ch/2,ch*.3,cw/2,ch/2,Math.max(cw,ch)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.6)');c.fillStyle=vg;c.fillRect(0,0,cw,ch);
  if(F.length&&(mode==='game'||mode==='paused'))drawHUD(T);
  if(flash>0){c.fillStyle=`rgba(255,255,255,${flash*.7})`;c.fillRect(0,0,cw,ch);flash=Math.max(0,flash-rdt*2.5);}
}
requestAnimationFrame(frame);

function openSelect(cpu){
  vsCPU=cpu;picks=[null,null];pickStage=0;audio();
  $('selhead').textContent=t('pick1');$('selhead').className='selhead p1';
  if(!$('grid').children.length)buildSelect();markCards();
  showScreen('select');mode='select';
}
function goVS(){
  $('vsN1').textContent=picks[0].dn;$('vsN2').textContent=picks[1].dn;
  $('vsI1').src=portrait(picks[0],300,400,'clear').toDataURL();$('vsI2').src=portrait(picks[1],300,400,'clear').toDataURL();
  $('vsI2').style.transform='scaleX(-1)';
  showScreen('vs');mode='vs';SFX.boom();
  vsTimer=setTimeout(()=>{startMatch();},2300);
}
let vsTimer=0;
$('go2').addEventListener('click',()=>openSelect(false));
$('go1').addEventListener('click',()=>openSelect(true));
$('selBack').addEventListener('click',()=>{showScreen('title');mode='menu';F=[];});
$('rematch').addEventListener('click',()=>{audio();startMatch();});
$('newPick').addEventListener('click',()=>{F=[];openSelect(vsCPU);});
function togglePause(){if(mode==='game'){mode='paused';showScreen('pause');}else if(mode==='paused'){mode='game';showScreen(null);}}
$('pauseBtn').addEventListener('click',togglePause);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='game')togglePause();}); // tab hidden: pause the fight
$('resume').addEventListener('click',togglePause);
$('quit').addEventListener('click',()=>{mode='menu';F=[];ref=null;phase='menu';matchLive=false;applyPads();hideHints();$('topbtns').hidden=true;showScreen('title');});
$('fightBtn').addEventListener('click',startFromReady);
$('readyBack').addEventListener('click',()=>openSelect(vsCPU));
$('ctlBtn').addEventListener('click',openControls);
$('ctlOpen').addEventListener('click',openControls);
$('ctlClose').addEventListener('click',closeControls);
$('padToggle').addEventListener('click',()=>{padsForced=!padsWanted();try{localStorage.setItem('rr.pads',padsForced?'1':'0');}catch(e){}applyPads();});
/* Fill the page's fixed texts from I18N and set the language + direction. The arena, the key diagrams, the touch pads
   and the VS splash stay left-to-right (P1 is always the left side); see the [dir=rtl] rules in the CSS. */
function applyI18n(){
  const html=document.documentElement;html.lang=LANG;html.dir=RTL?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.i18nAria));});
  const k1=keysOf(0),k2=keysOf(1),line=k=>`${k.left} ${k.right} ${t('move')} · ${k.up} ${t('jump')} · ${k.punch} ${t('punch')} · ${k.kick} ${t('kick')} · ${k.grab} ${t('slam')} · ${k.special} ${t('special')}`;
  $('keysLine').innerHTML=`${t('keyboard')}: <b>P1</b> <bdi>${line(k1)}</bdi> &nbsp;|&nbsp; <b>P2</b> <bdi>${line(k2)}</bdi>`;
}
applyI18n();
applyDesktop();
$('muteBtn').addEventListener('click',()=>{muted=!muted;$('muteBtn').textContent=muted?'🔇':'🔊';if(crowdGain)crowdGain.gain.value=0;if(!muted)audio();});
$('fsBtn').addEventListener('click',()=>{const el=document.documentElement;try{const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(r&&r.then)r.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}catch(e){}});
document.fonts&&document.fonts.ready.then(()=>{for(const k in portraitCache)delete portraitCache[k];if($('grid').children.length){$('grid').innerHTML='';buildSelect();markCards();}});
// demo mode for testing: #demo
if(location.hash==='#demo'){autoplay=true;vsCPU=true;picks=[ROSTER[0],ROSTER[1]];startMatch();}

/* ======================= DEBUG HOOK (for automated playtests; harmless in production) =======================
   state()        -> {mode, phase, round, wins, desktop, padsShown:[p1,p2], hints:boolean (P1 strip visible), hintT}
   fighters()     -> the live fighter objects F (F[0].x, F[i].state, F[i].hp ...)
   setDesktop(v)  -> force desktop (keyboard) or phone (touch) presentation
   skipVS()       -> jump from the VS splash straight into the match
   keys(pl)       -> the key labels for player 0 or 1, as shown in the diagrams */
window.__brbTest={
  state:()=>({mode,phase,round,wins:[...wins],desktop,padsShown:[!$('pad1').hidden,!$('pad2').hidden],hints:$('hint1').classList.contains('show'),hintT}),
  fighters:()=>F,
  setDesktop:v=>{desktop=!!v;applyDesktop();},
  skipVS:()=>{if(mode==='vs'){clearTimeout(vsTimer);startMatch();}},
  keys:keysOf
};
})();
</script>
