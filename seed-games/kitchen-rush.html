<title>Kitchen Rush</title>
<!-- Kitchen Rush: Number Quest Launchpad Unit 7, The Measuring Meadow (grades K-2, ages 5-8), and the Launchpad
     finale. A busy kitchen getting a garden party ready, on Oomba3D 1.1.0 in the Busy Kitchen theme: the helper
     measures, tells the time, counts the tip jar and sorts the vegetables, and every finished round puts a dish on
     the party table. The "rush" is the busy kitchen: there is no clock on the child. Four chapters of six rounds:
       measure (7.1) same-size units laid end to end with no gaps (a baguette is 6 sugar cubes long), then a ruler
                     in inches or centimeters (start at 0; one thing that does not start at 0), then which is
                     longer and by how much;
       clock   (7.2) the kitchen's clock to the hour and the half hour, the oven's digital clock, then to five
                     minutes with a.m. and p.m.; then the coins in the tip jar: pennies, nickels, dimes and
                     quarters with the cent sign, and one round with a dollar bill and the dollar sign. Coins are
                     counted for their value only: nothing is bought, sold or priced;
       chart   (7.3) vegetables sorted into two and three bins (how many, which has the most, how many more),
                     then a picture graph and a bar graph of four fruits (how many, how many more or fewer, how
                     many altogether);
       gate    (7.4) The Garden Gate feast, the Launchpad finale: one round from each earlier unit (a teen
                     number, adding over ten, tens and ones, equal sides or a story, hundreds, shares or shapes).
     Made for a child who is only starting to read: every instruction is short, shown and spoken (BRB.speak, the
     shared path; the speaker button says it again), and everything is done with big buttons. Rulers, clocks,
     coins and graphs are drawn face on, on the kitchen board, so the room's perspective never bends them. No
     timer, no lives, no fail state: a wrong answer wobbles, the board shows why, and a spoken hint says it; then
     another try. Lesson mode: BRB.params { chapter: measure | clock | chart | gate, lock: 1 } opens that chapter
     only; finishing its six rounds reports game over, won, once (the course step's completion signal). With no
     parameters the game offers the four chapters from a picture menu. Saves only which chapters are finished
     (BRB.storage 'kitchen-rush-v1'). The import map below is exactly kit2ImportMap() (server/services/vendor.js);
     tests/unit/kitchen-rush.test.js fails if a library bump leaves it behind. English only, like Number Quest's
     other lesson games. Test handle: window.__kr (also window.__brbTest, the name the picture scripts wait for). -->

  say(Rd.said[0][0], Rd.said[0][1], { queue: true });
  for (const [key, vars] of Rd.said.slice(1)) speak(key, vars, { queue: true });
  paint(Rd, 'found'); drop(board); board.position.copy(BOARD); board.scale.set(BW, BH, 1); pop(board, { from: 0.9 });
  // the round's dish goes to the party table, the helper cheers, and only then the next round
  serve(guard(() => { sfx('cheer'); heroMove('cheer', 1700); pause(reduced ? 3.4 : 2.1, guard(nextRound)); }));
}

/* ---------- the test handle: what the round asks and what is on screen (tests, covers, slide pictures) ---------- */
/** The screen box (left, top, right, bottom in CSS pixels) of the board. */
function boxOf(o) {
  const cam = g.camera, right = V3(1, 0, 0).applyQuaternion(cam.quaternion), up = V3(0, 1, 0).applyQuaternion(cam.quaternion), [w, h] = o.userData.size;
  const mid = o.getWorldPosition(V3(0, 0, 0));
  const [sx, sy] = scr(mid), [rx] = scr(mid.clone().addScaledVector(right, w / 2)), [, uy] = scr(mid.clone().addScaledVector(up, h / 2));
  return [sx - (rx - sx), uy, rx, sy + (sy - uy)].map(n => Math.round(n));
}
const shown = o => { for (let q = o; q; q = q.parent) if (!q.visible) return false; return true; };
const ray = new THREE.Raycaster();
/** Whether nothing of the kitchen stands between the camera and a point (the furniture never hides the board). */
function clearTo(p) {
  const from = g.camera.position, dir = p.clone().sub(from), dist = dir.length();
  ray.set(from, dir.normalize()); ray.near = 0.1; ray.far = dist - 0.12;
  return !ray.intersectObjects([room, props, feast], true).some(hit => shown(hit.object));
}
const boxPts = pts => { const p = pts.map(scr); return [Math.min(...p.map(q => q[0])), Math.min(...p.map(q => q[1])), Math.max(...p.map(q => q[0])), Math.max(...p.map(q => q[1]))].map(n => Math.round(n)); };
window.__kr = window.__brbTest = {
  state: () => ({ game: 'kitchen-rush', screen: S.screen, chapter: S.chapter, lock: S.lock, round: S.round, rounds: KR.ROUNDS, phase: S.phase, hero: S.hero ? S.hero.id : null, reported: S.reported, tall,
    ...(S.R && S.screen === 'play' ? { ...S.R, mode: S.mode, moving: tweens.length, onStage: { board: stage.children.includes(board) && board.visible, dishes: feast.children.length } } : {}) }),
  fast: on => { S.fast = on !== false; },
  hero: id => chooseHero(id || HEROES[0]),
  act: (name, arg) => answer(arg),
  /** Where things are on the screen (CSS pixels): the box round the helper (as wide as the Wizard's hat), the board
   *  (its box, whether the kitchen leaves it in full view, and the smallest words on it in screen pixels) and the
   *  party table. */
  spot: () => {
    const bx = boxOf(board), k = 0.46;
    return {
      hero: S.hero ? boxPts(heroBox(S.hero.position, S.hero.object.scale.x)) : null,
      board: { box: bx, small: Math.round(S.small * (bx[2] - bx[0]) / CW * 10) / 10,
        clear: [[0, 0], [-k, -k], [k, -k], [k, k], [-k, k], [0, -k], [0, k]].every(([dx, dy]) => clearTo(V3(BOARD.x + dx * BW, BOARD.y + dy * BH, BOARD.z))) },
      table: table.visible ? (() => { const s = tableSize(), t = tableSpot(); return boxPts([V3(t.x - 1.5 * s, 0, t.z), V3(t.x + 1.5 * s, 0, t.z), V3(t.x - 1.5 * s, 1.5 * s, t.z), V3(t.x + 1.5 * s, 1.5 * s, t.z)]); })() : null,
    };
  },
};

el.load.hidden = true; el.load.remove(); el.kr.hidden = false;
await showHeroes();
window.__ready = true;
</script>
