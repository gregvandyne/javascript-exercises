<title>Swish Flick</title>
<style>
/* Swish Flick on the Oomba Kit: a basketball flick game. One canvas fills the screen (portrait court; in landscape it
   is centred and letterboxed) and is drawn in the kit's "Oomba Ink" look (Ink outlines, kit props and characters,
   sticker text); the HUD floats on top of it. The kit draws the title screen, the pause screen and settings, and the
   win / try-again cards; the story map and the level card are the game's own DOM in the kit's sticker style. The font
   and every colour come from the kit (--ok-* variables, and --sf-* set from Oomba.color at start). Every button is at
   least 48px tall. Right-to-left languages mirror the menus and text, never the court. */
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;background:var(--sf-lb,#1d1d2a)}
.sf{--ink:var(--sf-ink);--cream:var(--sf-cream);--soft:color-mix(in srgb,var(--ok-text) 62%,transparent);position:fixed;inset:0;font-family:var(--ok-font);color:var(--ok-text)}
.sf button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sf svg{display:block}
/* stage: the letterbox and the canvas */
#stage{position:fixed;inset:0;overflow:hidden;background:var(--lb,#1d1d2a);transition:background .4s}
#c{position:absolute;display:block;touch-action:none;outline:none}
#box{position:absolute;pointer-events:none}             /* same rectangle as the canvas: HUD, toasts and tips live in here */
#box>*{pointer-events:auto}
/* HUD: kit icon buttons and one Cream sticker pill */
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:8px 8px 0;pointer-events:none}
.hud>*{pointer-events:auto}
.sf .ok-btn.ok-icon{width:48px;min-height:48px;flex:none;color:var(--ink)}
.sf .ok-btn.ok-icon svg{width:26px;height:26px}
.pill{flex:1;min-width:0;height:48px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;
  border-radius:999px;background:var(--cream);color:var(--ink);border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-weight:800;font-size:1rem;line-height:1.05;white-space:nowrap;overflow:hidden}
.pill .lbl{overflow:hidden;text-overflow:ellipsis;min-width:0;display:flex;align-items:center;gap:4px}
.pill .lbl svg{width:20px;height:20px;flex:none}
.pill .num{font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums}
.pill .balls{display:flex;gap:3px;flex:none;align-items:center;direction:ltr;font-weight:800}
.pill .balls svg{width:22px;height:22px}
.pill.fire{background:var(--sf-coralTint);border-color:var(--ink)}
.pill.fire .balls svg{color:var(--sf-coral)}
/* toasts and tips: stickers */
.toast{position:absolute;left:50%;top:max(12%,70px);transform:translate(-50%,0) scale(.6);opacity:0;pointer-events:none;white-space:nowrap;
  font-weight:800;font-size:clamp(1.4rem,6.6vw,2.2rem);line-height:1.05;color:var(--ink);padding:8px 20px;border-radius:999px;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);
  background:var(--cream);max-width:92%;overflow:hidden;text-overflow:ellipsis;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .25s}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast.gold{background:var(--sf-spark)}
.toast.fire{background:var(--sf-coral);color:var(--cream);text-shadow:0 2px 0 var(--sf-coralShade)}
.tip{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);max-width:88%;text-align:center;font-weight:800;font-size:1rem;line-height:1.25;color:var(--ink);
  background:var(--cream);border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:999px;padding:8px 16px;pointer-events:none;transition:opacity .3s;white-space:normal}
.tip.off{opacity:0}
.hintbtn{position:absolute;inset-inline-end:10px;bottom:16%}
.keyhint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:.74rem;font-weight:800;color:var(--cream);text-shadow:0 1px 2px var(--ink);opacity:.85;pointer-events:none;display:none}
@media (hover:hover) and (pointer:fine){.keyhint{display:block}}
/* the title screen (the kit's): the two modes, the best line, the helper chip */
.sf-modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(420px,92vw)}
.sf-modes .ok-btn{flex-direction:column;gap:2px;min-height:88px;padding:8px 10px;border-radius:26px;border-width:3px;box-shadow:0 6px 0 var(--ok-press);font-size:1.35rem;line-height:1.05}
.sf-modes .ok-btn svg{width:30px;height:30px}
.sf-modes small{font-weight:700;font-size:.8rem;opacity:.9;letter-spacing:0}
.sf-tcard{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--ok-card);color:var(--ok-text);border:3px solid var(--ok-edge);border-radius:28px;box-shadow:0 6px 0 var(--sf-ink);padding:14px 14px 12px;max-width:min(460px,94vw);box-sizing:border-box}
.sf-tcard .ok-p{text-align:center;font-weight:700}
.sf-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:800;background:var(--ok-bg2);color:var(--ok-text);border:2.5px solid var(--ok-edge);border-radius:999px;padding:5px 14px 5px 10px;font-size:.95rem;line-height:1.2;min-height:40px;box-sizing:border-box}
.chip svg{width:20px;height:20px;flex:none}
button.chip{min-height:44px}
button.chip[aria-pressed="true"]{background:var(--sf-mintTint);color:var(--ink);border-color:var(--ink)}
.keys{font-size:.78rem;color:var(--soft);font-weight:700;line-height:1.4;display:none;text-align:center;margin:0}
@media (hover:hover) and (pointer:fine){.keys{display:block}}
.ok-title-screen .ok-cta{display:none}
@media (orientation:landscape) and (max-height:560px){.sf-modes .ok-btn{min-height:68px}.sf-tcard{gap:6px;padding:10px}.ok-title-screen .ok-title-hero{display:none}}
/* own screens (map, level card): a scrim and kit-style cards */
.screen{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box;background:var(--ok-scrim)}
.panel{background:var(--ok-card);color:var(--ok-text);border:3px solid var(--ok-edge);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:20px 16px 18px;width:min(100%,430px);max-height:100%;overflow:auto;box-sizing:border-box;
  display:flex;flex-direction:column;gap:12px;text-align:center;position:relative;animation:sfpop .3s cubic-bezier(.34,1.56,.64,1)}
.panel>*{flex:none}
@keyframes sfpop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.panel h2{font-weight:800;font-size:1.6rem;line-height:1.1;margin:0;text-wrap:balance}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.row .ok-btn{flex:1 1 0;min-width:0;padding-left:12px;padding-right:12px}
/* map */
#map{align-items:stretch;padding:0;background:var(--sf-mapbg)}
.mapwrap{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;min-height:0}
.maphead{display:flex;align-items:center;gap:8px;padding:10px 10px 8px}
.maphead h2{flex:1;margin:0;font-weight:800;font-size:1.6rem;line-height:1;text-align:center;color:var(--cream);text-shadow:0 2px 0 var(--ink),0 0 2px var(--ink)}
.maphead .chip{background:var(--cream);color:var(--ink);border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.maphead .chip svg{color:var(--sf-sparkShade)}
[dir=rtl] .flipx svg{transform:scaleX(-1)}
.worlds{flex:1;min-height:0;overflow:auto;padding:0 10px 18px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y}
.world{flex:none;border-radius:26px;padding:12px 12px 16px;position:relative;overflow:hidden;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
.world h3{margin:0 0 2px;font-weight:800;font-size:1.25rem;line-height:1.1;display:flex;align-items:center;gap:8px;color:var(--ink)}
.world h3 canvas{flex:none;height:40px;width:auto}
.world h3>span:not(.chip){flex:1;min-width:0}
.world h3 .chip{font-size:.85rem;min-height:32px;padding:3px 10px 3px 8px;background:var(--cream);color:var(--ink);border-color:var(--ink)}
.world h3 .chip svg{width:16px;height:16px;color:var(--sf-sparkShade)}
.world.locked .nodes{opacity:.4;filter:grayscale(.8)}
.world .lock{position:absolute;inset:auto 12px 12px;z-index:2;background:var(--cream);color:var(--ink);border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:18px;padding:10px;text-align:center;font-weight:800;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:6px}
.world .lock svg{width:20px;height:20px}
.w-city{background:var(--sf-w-city)}
.w-ship{background:var(--sf-w-ship)}
.w-candy{background:var(--sf-w-candy)}
.w-space{background:var(--sf-w-space)}
.w-space h3{color:var(--cream);text-shadow:0 2px 0 var(--ink)}
.nodes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;margin-top:10px}
.node{position:relative;min-height:76px;border:2.5px solid var(--ink);border-radius:20px;background:var(--cream);color:var(--ink);box-shadow:0 4px 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;transition:transform 80ms ease-out,box-shadow 80ms ease-out}
.node:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.node:nth-child(3n+2){margin-top:10px;margin-bottom:-10px}
.node b{font-weight:800;font-size:1.35rem;line-height:1;display:flex}
.node b svg{width:24px;height:24px}
.node .st{display:flex;gap:1px;direction:ltr}
.node .st svg{width:15px;height:15px;color:var(--sf-off)}
.node .st .on svg{color:var(--sf-sparkShade)}
.node small{font-size:.68rem;font-weight:800;line-height:1.05;color:var(--sf-inkSoft);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node.bonus{background:var(--sf-sparkTint)}
.node:disabled{background:color-mix(in srgb,var(--cream) 55%,transparent);cursor:default;box-shadow:none}
.node:disabled b{opacity:.6}
.node.next{box-shadow:0 0 0 4px var(--sf-spark),0 4px 0 var(--ink);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{translate:0 -4px}}
/* level card */
.lvno{display:inline-flex;align-self:center;align-items:center;gap:6px;background:var(--ink);color:var(--cream);border-radius:999px;padding:4px 14px 4px 6px;font-weight:800;font-size:.95rem;letter-spacing:.02em}
.lvno canvas{height:28px;width:auto}
.goal{background:var(--sf-peachTint);color:var(--ink);border:2px solid var(--ink);border-radius:18px;padding:10px 12px;font-weight:800;font-size:1rem;line-height:1.3}
.starrows{display:flex;flex-direction:column;gap:5px;font-weight:800;font-size:.95rem}
.starrows div{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ok-bg2);border-radius:14px;padding:6px 12px}
.starrows span:first-child{display:flex;gap:2px;direction:ltr;color:var(--sf-sparkShade)}
.starrows svg{width:18px;height:18px}
/* the kit's result cards: the game's lines, stats and a menu button added */
.sf-line{margin:-4px 0 0;font-weight:700;font-size:1.02rem;line-height:1.35}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.stats div{background:var(--ok-bg2);border:2px solid var(--ok-line);border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats b{font-weight:800;font-size:1.45rem;line-height:1;font-variant-numeric:tabular-nums}
.stats small{font-size:.76rem;font-weight:800;color:var(--soft);overflow-wrap:anywhere;line-height:1.1}
.sf-nosparks .ok-sparks{display:none}
.sf-noscore .ok-score{display:none}
.sf-score::after{-webkit-text-stroke:0;text-shadow:none;content:attr(data-pts);display:block;margin-top:2px;font-weight:800;font-size:.8rem;line-height:1.2;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.sf-desc{margin:0;font-weight:700;font-size:1rem;line-height:1.3;text-align:center;max-width:34ch}
@media (orientation:landscape) and (max-height:520px){
  .panel{max-height:calc(100% - 4px);padding:12px 14px;gap:8px}
  .panel.two{width:min(100%,640px);display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:8px 16px}
  .panel.two>.full{grid-column:1/-1}
  .tip{bottom:3%}
  .ok-win .ok-portrait,.ok-try .ok-portrait{display:none}
}
@media (max-height:600px) and (orientation:portrait){.panel{padding:14px 12px;gap:9px}}
@media (prefers-reduced-motion:reduce){.node.next{animation:none}.toast{transition:opacity .2s}.panel{animation:none}}
.ok-rm .node.next{animation:none}.ok-rm .panel{animation:none}.ok-rm .toast{transition:opacity .2s}
/* the title screen inside the court's frame: the oomba mark and the corner buttons sit in the frame's top corners (never
   in the letterbox, in either reading direction), the lockup sits below them, the tagline is plain sticker text and
   the menu card sits at the bottom of the frame, so the hoop, the crowd and the trees stay in view between them */
.ok-title-screen.ok-title-screen{padding-top:calc(var(--sf-bt,0px) + 78px)}
.ok-title-screen.ok-title-screen .ok-brand{top:calc(var(--sf-bt,0px) + 14px);left:calc(var(--sf-bl,0px) + 14px);right:auto}
.ok-title-screen.ok-title-screen .ok-corner{top:calc(var(--sf-bt,0px) + 12px);right:calc(var(--sf-br,0px) + 12px);left:auto}
.ok-title-screen .ok-h1{font-size:clamp(2.8rem,min(11vmin,14vw),5.6rem)}
@media (orientation:landscape){.ok-title-screen .ok-stack .ok-title-word{display:inline-block}}
.ok-title-screen .ok-title-block{gap:4px}
.ok-title-screen .ok-p#tagline{background:none;border:0;box-shadow:none;padding:0 8px;color:var(--sf-cream);font-weight:800;font-size:clamp(1.05rem,2.4vmin,1.25rem);text-shadow:0 2px 0 var(--sf-ink),0 0 3px var(--sf-ink),1px 0 0 var(--sf-ink),-1px 0 0 var(--sf-ink)}
.sf-tcard.sf-low{position:fixed;left:calc(var(--sf-bl,0px) + var(--sf-bw,100vw) / 2);top:calc(var(--sf-bt,0px) + var(--sf-bh,100vh) - 12px);transform:translate(-50%,-100%);width:min(440px,calc(var(--sf-bw,100vw) - 24px));max-width:none;padding:14px 16px 12px}
.sf-modes{width:100%}
.sf-modes .ok-btn:focus-visible{outline-offset:2px}
/* the result cards: a big coral score (the old game's look), and the buttons side by side at the same width */
.ok-win .ok-score.sf-score,.ok-try .ok-score.sf-score{font-size:4.4rem;line-height:.95;color:var(--sf-ball);-webkit-text-stroke:3px var(--sf-ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--sf-ink)}
.ok-row.sf-endrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.ok-row.sf-endrow .ok-btn{width:100%;min-width:0;min-height:58px;margin:0;font-size:1.1rem;padding:6px 10px;white-space:normal;line-height:1.1;animation:none}
.ok-row.sf-endrow .ok-btn:nth-child(3){grid-column:1/-1}
.ok-win .ok-card,.ok-try .ok-card{gap:10px}
/* the HUD's balls: little basketballs */
.pill .balls i{width:18px;height:18px;display:block}
.pill .balls i svg{width:18px;height:18px}
.pill .balls i.used svg{opacity:.3;filter:grayscale(1)}
</style>

    shooter: L.shooter.slice(), hoop: JSON.parse(JSON.stringify(L.hoop)), g: L.g || 9.8, wind: L.wind || null, obstacles: (L.solids || []).length, power: L.power || 0.5 })),
  solve: testSolve,
  setTime(s) { if (G && G.mode === 'arcade') { G.timeLeft = s; if (s > 0) G.timeUp = false; updateHud(); } return true; },
  seed(n) { seedRng(n); return true; },
  freeze(on) { frozen = on !== false; return frozen; },
  frameStats(ms) { FRAMES.gaps = []; FRAMES.on = true; return new Promise(res => setTimeout(() => { FRAMES.on = false; const g = FRAMES.gaps.slice(1).sort((a, b) => a - b); res({ frames: g.length, median: g[g.length >> 1], p95: g[Math.floor(g.length * 0.95)], worst: g[g.length - 1] }); }, ms || 3000)); },
  camera: () => G ? Object.assign({}, G.cam1) : null,   // the framed camera for this shot (debugging)
  config: CONFIG,
};

/* ---------- boot ---------- */
Oomba.ui.root().appendChild($('sf'));        // the game's DOM inside the kit's layer (its fonts, colours and night mode)
for (const e of document.querySelectorAll('[data-ic]')) e.innerHTML = ic(e.getAttribute('data-ic'));
Oomba.time.start();                          // the kit's clock for its screens (this game draws its own court)
kitFont(); Oomba.fonts.ready.then(() => { kitFont(); bgKey = ''; });
applyI18n();
computeView();
syncMute();
refreshUnlocked();
goTitle();
requestAnimationFrame(frame);
})();
</script>
