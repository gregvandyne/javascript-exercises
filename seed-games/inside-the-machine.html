/* lesson mode: the Case-closed card (one concept check + a confidence face) before the stars */

    const fr = el('div', 'im-faces'); faces.appendChild(fr); card.appendChild(faces);
    [['faceLow', tr('Not sure'), 1], ['faceMid', tr('Fairly sure'), 2], ['faceHigh', tr('Very sure'), 3]].forEach(([p, label, n]) => { const b = el('button', 'im-face-btn', pic(p)); b.type = 'button'; b.setAttribute('aria-label', label); b.addEventListener('click', () => { if (conf) return; conf = n; b.classList.add('on'); sfx('select'); later(350, () => close(true)); }); fr.appendChild(b); });

function showWin(stars) {

}
const chainEnd = () => { const list = levelsFor(S.chapter); return S.chain && S.chain.ch === S.chapter ? Math.min(S.chain.to, list.length) : list.length; };

/* the Quest Card: band, read-aloud, music, settings and the 4-digit quest keypad (never in a live frame) */

function applyCode(code) {
