<title>Inside the Machine</title>
<style>
/* Inside the Machine on the Oomba Kit: a DOM-first systems game (parts, hardware and software, the Fix-It desk, bits,
   gadgets, the Design Lab) with Gizmo the mouse. The kit draws the workbench behind, Gizmo, the title, pause, results,
   settings, buttons, icons, sounds and the type. This file lays out only the game's own pieces: the chapter map, the
   play screen (a board and a work panel), the tap-wiring board, the card sorter, the tile chain, the Fix-It tray and
   flowchart, the quest keypad and the Case-closed card. No color codes and no fonts here: kit variables only
   (the --im-* ones are set once from Oomba.color at start). */
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#im{position:fixed;inset:0;pointer-events:none;font-family:var(--ok-font);color:var(--ok-text);--im-top:var(--ok-safe-top);--im-edge:var(--ok-edge);font-size:calc(16px * var(--ok-ts,1));line-height:1.25}
#im>*{pointer-events:auto}
#im button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;color:var(--ok-text)}
#im button:disabled{cursor:default}
#im svg{display:block}
#im.im-proj{font-size:calc(20px * var(--ok-ts,1))}
.ok-night #im{--im-edge:color-mix(in srgb,var(--ok-edge) 38%,transparent)}
@media (max-height:480px),(max-width:480px){#im{--im-top:calc(var(--ok-safe-top) - 56px)}}
@media (max-width:480px){.im-hintword{display:none}.im-top .ok-quiet{padding:0 12px}}
.im-screen{position:absolute;left:0;right:0;top:var(--im-top);bottom:0;padding:0 calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));box-sizing:border-box;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.im-box{background:var(--ok-card);color:var(--ok-text);border:3px solid var(--im-edge);border-radius:24px;box-shadow:0 4px 0 var(--im-edge);box-sizing:border-box}
.im-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:48px;flex:0 0 auto}
.im-pill{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--ok-card);border:2px solid var(--im-edge);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;box-sizing:border-box;flex:0 1 auto;min-width:0}
.im-pill>span{overflow:hidden;text-overflow:ellipsis}
.im-play .im-top .im-pill{flex:1 1 0}
.im-pill svg{width:22px;height:22px;flex:none}
.im-grow{flex:1 1 auto}
.im-body{flex:1 1 0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) fit-content(66%);gap:8px}
.im-board{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0}
.im-panel{display:flex;flex-direction:column;gap:8px;padding:12px;overflow:auto;min-height:0;scrollbar-width:thin}
@media (orientation:landscape) and (min-width:640px){.im-body{grid-template-rows:none;grid-template-columns:minmax(0,9fr) minmax(0,11fr)}}
@media (max-height:480px){.im-panel{padding:8px 10px;gap:6px}.im-tray{gap:6px}.im-tile{min-height:48px;padding:5px 10px 5px 12px;font-size:.95em}.im-ticket{padding:8px 12px}.im-ticket p{font-size:.85em}.im-board{padding:6px}
  .im-play.im-screen{top:calc(62px + env(safe-area-inset-top))}.im-play .im-top{position:fixed;top:calc(8px + env(safe-area-inset-top));inset-inline-start:calc(318px + env(safe-area-inset-left));inset-inline-end:calc(134px + env(safe-area-inset-right));justify-content:center;flex-wrap:nowrap;z-index:13;min-height:0;overflow:hidden}.im-play .im-top .im-pill{flex:0 1 auto}.im-top .ok-btn{flex:0 0 auto}
  .im-part{min-height:60px;font-size:.76em;padding:4px 6px}.im-part svg{width:28px;height:28px}.im-device{gap:8px 12px}}
.im-prompt{font-weight:800;font-size:clamp(1.05em,2.6vmin,1.35em);line-height:1.25;margin:0;text-wrap:balance}
.im-prompt:empty,.im-note:empty{display:none}
.im-note{font-weight:600;opacity:.85;margin:0;font-size:.95em}
.im-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center;margin-top:auto}
.im-actions .ok-btn{min-height:48px}
/* tiles: a tray of taps (cards, checks, chain pieces) */
.im-tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.im-tray.im-list{grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
.im-tray.im-two{grid-template-columns:1fr 1fr}
.im-tile{position:relative;min-height:52px;padding:8px 12px 8px 14px;border-radius:16px;border:2.5px solid var(--im-edge);background:var(--ok-bg2);font:inherit;font-weight:700;line-height:1.2;display:flex;align-items:center;gap:8px;text-align:start;box-shadow:0 3px 0 var(--im-edge);box-sizing:border-box;transition:transform 80ms ease-out,box-shadow 80ms ease-out}
.im-tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--im-edge)}
.im-tile.on{background:var(--im-sky-t);border-color:var(--im-sky)}
.im-tile.good{background:var(--im-mint-t)}
.im-tile.bad{background:var(--im-coral-t)}
.im-tile.dim{opacity:.55}
.im-tile .im-k{position:absolute;top:1px;inset-inline-start:7px;font-size:.68em;font-weight:700;opacity:.5}
.im-tile .im-num{position:absolute;top:-9px;inset-inline-end:-6px;min-width:26px;height:26px;padding:0 6px;border-radius:999px;background:var(--im-sky);border:2px solid var(--im-edge);display:grid;place-items:center;font-size:.8em;font-weight:800;box-sizing:border-box}
.im-tile .im-cost{margin-inline-start:auto;flex:none;font-size:.85em;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--im-peach-t);border:2px solid var(--im-edge);white-space:nowrap}
.im-tile canvas,.im-tile>svg{width:34px;height:34px;flex:none}
.im-tile .im-mark{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--im-edge);display:grid;place-items:center;background:var(--ok-card)}
.im-tile .im-mark svg{width:18px;height:18px}
.im-tile .im-mark.bad{border-radius:6px}
.im-glow{outline:4px solid var(--im-spark);outline-offset:2px;animation:im-glow .9s ease-in-out infinite alternate}

@keyframes im-glow{from{outline-color:var(--im-spark)}to{outline-color:transparent}}
@keyframes im-pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes im-shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.im-pop{animation:im-pop 260ms cubic-bezier(.34,1.56,.64,1)}
.im-shake{animation:im-shake 240ms linear}
.ok-rm .im-pop,.ok-rm .im-shake{animation:none}
/* the device board: parts as big taps, wires drawn over them */
.im-device{display:grid;grid-auto-flow:row dense;gap:10px 14px;justify-content:center;align-content:center;position:relative;max-width:100%}
.im-part{position:relative;min-height:66px;min-width:76px;padding:6px 8px;border-radius:18px;border:2.5px solid var(--im-edge);background:var(--ok-bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;font-weight:800;font-size:.82em;line-height:1.1;box-shadow:0 3px 0 var(--im-edge);box-sizing:border-box;z-index:1;text-align:center}
.im-part svg{width:34px;height:34px;color:var(--ok-text)}
.im-part.on{background:var(--im-sky-t);border-color:var(--im-sky)}
.im-part.good{background:var(--im-mint-t)}
.im-part.bad{background:var(--im-coral-t)}
.im-part .im-role{position:absolute;top:-9px;inset-inline-end:-6px;font-size:.62em;padding:1px 7px;border-radius:999px;border:2px solid var(--im-edge);background:var(--ok-card);line-height:1.3}
.im-wires{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:0}
.im-wires line{stroke:var(--im-sky);stroke-width:6;stroke-linecap:round}
.im-wires line.need{stroke:var(--im-mint)}
.im-wires circle{fill:var(--im-sky)}
/* the chain (A Tap Travels, the flowchart) */
.im-chain{display:flex;flex-direction:column;gap:6px;align-items:stretch;width:100%;max-width:420px}
.im-chain .im-step{display:flex;align-items:center;gap:8px}
.im-chain .im-n{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--im-edge);display:grid;place-items:center;font-weight:800;font-size:.8em;background:var(--ok-card)}
.im-chain .im-tile{flex:1 1 auto;min-height:48px}
.im-diamond{flex:none;width:26px;height:26px;transform:rotate(45deg);border:2.5px solid var(--im-edge);background:var(--im-peach-t);border-radius:5px;margin:0 6px}
.im-arrow{text-align:center;opacity:.7;line-height:1;font-weight:800}
.im-chain .im-done{background:var(--im-mint-t)}
.im-chain .im-fail{background:var(--im-coral-t)}
.im-empty{min-height:48px;border:2.5px dashed var(--im-edge);border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:700;opacity:.7;padding:6px 10px;text-align:center}
.im-flowprev{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;width:100%;max-width:480px}
.im-chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:3px 10px;border-radius:12px;border:2px solid var(--im-edge);background:var(--ok-bg2);font-weight:700;font-size:.9em;max-width:100%;box-sizing:border-box}
.im-chip>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.im-chip .im-dia{width:13px;height:13px;transform:rotate(45deg);border:2px solid var(--im-edge);background:var(--im-peach-t);flex:none;border-radius:3px;margin:0 3px}
.im-chip.fix{background:var(--im-mint-t)}
.im-chip.ran{background:var(--im-stone-t)}
.im-chip.swap{border-style:dashed}
.im-chip.cur{background:var(--im-sky-t)}
.im-chip svg{width:16px;height:16px;flex:none}
.im-flowprev .im-arrow{opacity:.6}
.im-flowprev .im-arrow svg{width:16px;height:16px}
/* the sorter: one card at a time, big bins */
.im-deck{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.im-face{width:min(100%,320px);min-height:90px;border-radius:22px;border:3px solid var(--im-edge);background:var(--ok-card);display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 18px;font-weight:800;font-size:clamp(1.15em,3.2vmin,1.6em);text-align:center;box-shadow:0 5px 0 var(--im-edge);box-sizing:border-box}
.im-face canvas,.im-face svg{width:48px;height:48px;flex:none}

.im-bin{min-height:56px;padding:8px 10px;border-radius:18px;border:2.5px solid var(--im-edge);background:var(--ok-bg2);font:inherit;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 3px 0 var(--im-edge);box-sizing:border-box;text-align:center}
.im-bin .im-count{font-size:.8em;opacity:.75;font-weight:700}
.im-bin.good{background:var(--im-mint-t)}
.im-bin.bad{background:var(--im-coral-t)}
/* the Fix-It desk */
.im-ticket{width:100%;max-width:440px;border-radius:20px;border:3px solid var(--im-edge);background:var(--im-peach-t);padding:12px 16px;box-sizing:border-box;display:flex;gap:12px;align-items:center;text-align:start}
.im-ticket canvas,.im-ticket>svg{width:56px;height:56px;flex:none}
.im-ticket h3{margin:0;font-size:1.05em;font-weight:800}
.im-ticket p{margin:2px 0 0;font-weight:600;font-size:.88em}
.im-react{width:100%;max-width:440px;min-height:40px;border-radius:16px;border:2px dashed var(--im-edge);padding:6px 10px;box-sizing:border-box;font-weight:700;display:flex;align-items:center;gap:8px}
.im-react svg{width:24px;height:24px;flex:none}
.im-clock{display:inline-flex;align-items:center;gap:6px;font-weight:800;flex-wrap:wrap;font-size:1em}
.im-clock svg{width:22px;height:22px}
.im-stack{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;min-height:0;max-height:100%;overflow:auto;scrollbar-width:thin}
/* chapter map */
.im-map{overflow:auto;scrollbar-width:thin;align-items:center}
.im-map .im-top{width:min(820px,100%)}
.im-seg{display:inline-flex;border:2.5px solid var(--im-edge);border-radius:999px;overflow:hidden;background:var(--ok-card)}

.im-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:min(820px,100%)}
.im-chap{min-height:112px;padding:10px 10px 12px;border-radius:22px;border:3px solid var(--im-edge);background:var(--ok-card);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 4px 0 var(--im-edge);text-align:center;box-sizing:border-box;position:relative}
.im-chap canvas{height:44px;width:auto}

.im-chap .im-stars{font-size:.85em;font-weight:700;display:inline-flex;align-items:center;gap:4px;opacity:.9}
.im-chap .im-stars svg{width:18px;height:18px}
.im-chap.on{background:var(--im-sky-t);border-color:var(--im-sky)}
.im-chap .im-crown{position:absolute;top:-10px;inset-inline-end:-6px;width:30px;height:30px;color:var(--im-spark)}
.im-levels{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(820px,100%);padding:4px 0}
.im-lv{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--im-edge);background:var(--ok-bg2);font:inherit;font-weight:800;font-size:1.05em;display:grid;place-items:center;box-shadow:0 3px 0 var(--im-edge);position:relative}

.im-star{color:var(--im-spark);--ok-fill:var(--im-spark)}
.im-silver{filter:grayscale(1) brightness(1.1)}

/* our own modal cards (the quest card, the learn card, the case-closed card) reuse the kit's modal look */
.im-modal{position:fixed;inset:0;z-index:21;display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));background:var(--ok-scrim);box-sizing:border-box}
.im-modal .im-card{position:relative;background:var(--ok-card);color:var(--ok-text);border:3px solid var(--im-edge);border-radius:28px;box-shadow:0 8px 0 var(--im-edge);padding:20px 18px 18px;width:min(520px,100%);max-height:100%;overflow:auto;scrollbar-width:thin;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;box-sizing:border-box;animation:im-pop 260ms cubic-bezier(.34,1.56,.64,1)}

.im-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;width:100%}

.im-daily .im-stars{display:inline-flex;gap:1px;flex:none}

  /* ---------- helpers ---------- */
  const chapter = id => CHAPTERS.find(c => c.id === id) || null;
  const levelsFor = (ch, band) => LEVELS.filter(l => l.ch === ch && l.bands.includes(band));
  const level = id => LEVELS.find(l => l.id === id) || null;
  const byCost = list => list.slice().sort((a, b) => a.cost - b.cost);
  /** The author's par for a ticket: the cost of checking cheapest first (ties included) up to the last fault, then
   *  swapping cheapest first up to the faulty part. Any cheapest-first order costs this or less. */
  function parCost(l) {
    if (l.kind !== 'ticket' && l.kind !== 'flow') return l.par;
    const rel = l.checks.filter(c => c.rel && !c.help), swaps = l.swaps || [];
    const cf = l.faults.filter(f => rel.some(c => c.id === f)), sf = l.faults.filter(f => swaps.some(s => s.id === f));

    if (sf.length) { const top = Math.max(...sf.map(f => swaps.find(s => s.id === f).cost)); return sum(rel) + sum(swaps.filter(s => s.cost <= top)); }

  /** The cheapest-first answer for a ticket (what a careful fixer does). */
  function cheapest(l) {
    const rel = byCost(l.checks.filter(c => c.rel && !c.help)).map(c => c.id);

  }
  for (const l of LEVELS) if ((l.kind === 'ticket' || l.kind === 'flow') && !l.sol) l.sol = cheapest(l);
  /** Runs a ticket answer: checks in order (flow: the chain), then swaps, until every fault is fixed. */
  function runTicket(l, a) {
    const faults = new Set(l.faults), path = []; let cost = 0, helped = false;
    const walk = (ids, list, kind) => {
      for (const id of ids || []) {
        if (!faults.size) break;
        const c = list.find(x => x.id === id); if (!c) continue;
        cost += c.cost; const hit = faults.has(id); if (hit) faults.delete(id);
        if (c.help) { helped = true; faults.clear(); }
        path.push({ id, kind, hit, help: !!c.help, cost: c.cost });
      }
    };
    walk(l.kind === 'flow' ? a.flow : a.checks, l.checks, 'check');
    if (l.kind === 'flow') walk(a.swaps, l.swaps || [], 'swap');
    const ok = !faults.size;
    return { ok, fails: ok ? [] : ['still broken'], cost, path, helped, left: faults.size, good: ok && !helped && cost <= l.par };
  }
  /** judge(level, answer) -> { ok, fails[], good (the second star) , ...details }. Pure. */
  function judge(l, a) {
    a = a || {};
    switch (l.kind) {
      case 'tap': case 'pick': {
        const want = l.kind === 'tap' ? l.jobs.map(j => j.a) : l.rounds.map(r => r.answer), picks = Array.isArray(a.picks) ? a.picks : [];
        const fails = []; want.forEach((w, i) => { if (picks[i] !== w) fails.push('round ' + (i + 1)); });
        return { ok: !fails.length, fails, good: !fails.length && !(a.wrong > 0) };
      }
      case 'wire': {
        const key = e => e.slice().sort().join('>');
        const need = new Set(l.need.map(key)), have = new Set((a.wires || []).map(key));
        const missing = [...need].filter(k => !have.has(k)), extra = [...have].filter(k => !need.has(k));
        const fails = missing.map(k => 'missing ' + k).concat(extra.map(k => 'extra ' + k));
        return { ok: !fails.length, fails, missing, extra, good: !fails.length && !(a.edits > 0) };
      }
      case 'sort': {
        const placed = a.placed || {}, wrong = l.cards.filter(c => placed[c.id] !== c.bin).map(c => c.id);
        return { ok: !wrong.length, fails: wrong.map(id => 'card ' + id), wrongCards: wrong, good: !wrong.length && !(a.wrong > 0) };
      }
      case 'order': {
        const order = a.order || [], sol = l.sol.order; let firstBad = -1;
        for (let i = 0; i < sol.length; i++) if (order[i] !== sol[i]) { firstBad = i; break; }
        const ok = firstBad < 0 && order.length === sol.length;
        return { ok, fails: ok ? [] : ['step ' + (firstBad < 0 ? order.length : firstBad + 1)], firstBad, good: ok && (a.moves == null || a.moves <= l.par) };
      }
      case 'ticket': case 'flow': return runTicket(l, a);
      case 'switches': {
        const values = a.values || [], fails = []; l.rounds.forEach((r, i) => { if (values[i] !== r.target) fails.push('round ' + (i + 1)); });
        return { ok: !fails.length, fails, good: !fails.length && !(a.wrong > 0) };
      }
      case 'pixels': {
        const grid = a.grid || [], fails = []; l.target.forEach((row, i) => { if (grid[i] !== row) fails.push('row ' + (i + 1)); });
        return { ok: !fails.length, fails, firstBad: fails.length ? l.target.findIndex((row, i) => grid[i] !== row) : -1, good: !fails.length && (a.toggles == null || a.toggles <= l.par) };
      }
      case 'rgb': {
        const rgb = a.rgb || [], off = l.target.map((t, i) => Math.abs((rgb[i] | 0) - t)), fails = off.map((d, i) => (d > l.tol ? ['red', 'green', 'blue'][i] : null)).filter(Boolean);
        return { ok: !fails.length, fails, off, good: !fails.length && (a.moves == null || a.moves <= l.par) };
      }

        const metNeed = n => (n.id ? picked.has(n.id) : parts.some(p => p.cat === n.cat && (!n.any || n.any.includes(p.id))));
        const unmet = l.needs.filter(n => !metNeed(n)), over = Object.keys(l.budget).filter(k => totals[k] > l.budget[k]);
        const fails = unmet.map(n => 'need ' + (n.id || n.cat)).concat(over.map(k => 'over ' + k));
        const built = !fails.length, imps = [...new Set(a.imps || [])], best = l.improvements ? imps.filter(id => l.best.includes(id)).length : 0;
        if (l.improvements) { if (imps.length !== 2) fails.push('two improvements'); else if (!best) fails.push('improvements'); }
        return { ok: !fails.length, built, fails, met: l.needs.length - unmet.length, unmet, over, totals, best, good: !fails.length && totals.cost <= l.par && (!l.improvements || best === 2) };
      }
      case 'persona': {
        const changes = [...new Set(a.changes || [])], best = changes.filter(c => l.best.includes(c)).length;
        const fails = []; if (a.beat !== l.struggle) fails.push('moment'); if (changes.length !== 2) fails.push('two changes'); else if (!best) fails.push('changes');
        return { ok: !fails.length, fails, best, good: !fails.length && best === 2 && !(a.wrong > 0) };
      }
      default: return { ok: false, fails: ['unknown kind ' + l.kind], good: false };
    }
  }
  /** How many moves an answer holds (par >= moves(sol) for the tap-and-build kinds). */
  const moves = (l, a) => l.kind === 'wire' ? (a.wires || []).length : l.kind === 'sort' ? Object.keys(a.placed || {}).length : l.kind === 'order' ? (a.order || []).length : l.kind === 'tap' || l.kind === 'pick' ? (a.picks || []).length : l.kind === 'switches' ? (a.values || []).length : l.kind === 'pixels' ? (a.toggles | 0) : l.kind === 'rgb' ? (a.moves | 0) : l.kind === 'bin' ? l.parts.filter(p => (a.picked || []).includes(p.id)).reduce((n, p) => n + p.cost, 0) : l.kind === 'persona' ? 3 : 0;
  /* quest codes: C B M L. C = chapter index (0 = map), B = 1 Explorer | 2 Pro, M = mode (0 play, 3 projector), L = level (0 = first unfinished). */
  function parseCode(s) {
    const d = String(s || '').replace(/\D/g, ''); if (d.length !== 4) return null;
    const ch = CHAPTERS.find(c => c.index === +d[0]) || null;
    return { chapter: +d[0] === 0 ? null : (ch ? ch.id : null), band: BANDS[+d[1]] || null, mode: MODES[+d[2]] || 'play', level: +d[3] };
  }
  function codeFor(o) {
    const ch = chapter(o.chapter); const c = ch ? ch.index : 0, b = o.band === '2' ? 2 : 1, m = o.mode === 'projector' ? 3 : 0, l = Math.max(0, Math.min(9, o.level | 0));
    return String(c) + String(b) + String(m) + String(l);
  }
  /** Every English sentence and label in the data (the packs translate these; the test keeps en.json equal to them). */
  const TEXT = new Set(['title', 'text', 'q', 'story', 'label', 'name', 'ok', 'fix', 'tiles', 'hints', 'intro', 'beats', 'helps', 'why', 'quotes', 'sim']);
  function strings() {
    const out = new Set();
    const walk = (v, key) => {
      if (v == null) return;
      if (typeof v === 'string') { if (TEXT.has(key) && !/^[\d ]+$/.test(v)) out.add(v); return; }
      if (Array.isArray(v)) { v.forEach(x => walk(x, key)); return; }
      if (typeof v === 'object') for (const k of Object.keys(v)) { if (k === 'sol') continue; walk(v[k], k); }
    };
    walk(CHAPTERS, ''); walk(LEVELS, ''); walk(Object.values(PARTS), ''); walk(Object.values(BINS), ''); walk(Object.values(ROLE_NAMES).concat(Object.values(CATS)).map(name => ({ name })), '');

  }
  return { CHAPTERS, LEVELS, PARTS, BINS, POOL, ROLE_NAMES, CATS, MODES, BANDS, chapter, level, levelsFor, judge, moves, parCost, cheapest, parseCode, codeFor, strings };
})();
