  "d.mango.intro3": "اهزم بطلًا واربح ريشته. لكل ريشة لون مختلف!",
  "d.mango.intro4": "خذ ريشاتك إلى طوطم الكأس في قرية الطحلب. املأ الفتحات الثماني...",
  "d.mango.intro5": "...وسيُفتح مصعد الكروم عند شجرة الكابوك العظيمة. كأس الأدغال تنتظرك في الأعلى! جرّب جادا أولًا في ملعب القمم. اذهب غرب القرية!",
  "d.mango.hint0": "جادا تلعب ضربة المضرب في ملعب القمم، غرب القرية. ابحث عن القوس البرتقالي!",
  "d.mango.hint1": "ريشة واحدة بالفعل! أقواس الزهور في كل أنحاء الجزيرة. افتح الخريطة لتجدها.",
  "d.mango.hint2": "أحسنت! اعبر حجارة النهر لتصل إلى الجزيرة الصغيرة الشرقية.",
  "d.mango.hint3": "طوطم الكأس يمتلئ! واصل يا بطل!",
  "d.mango.qask1": "كراا... أنا جائعة جدًا. أفضل المانجو تنمو عند سفح التلال.",
  "d.mango.qask2": "هل تحضر لي واحدة؟ سأعطيك شيئًا جميلًا!",
  "d.mango.qwait": "شجرة المانجو قرب التلال، في الشمال الغربي. ممم، مانجو...",
  "d.mango.qthanks": "مانجو! المفضلة عندي! خذ قبعة المستكشف هذه لمستكشف حقيقي.",
  "d.mango.allf": "الريشات الثماني! مصعد الكروم عند شجرة الكابوك العظيمة مفتوح. هيا، هيا!",
  "d.mango.after": "بطل كأس الأدغال! ما زال بإمكانك لعب أي رياضة لتحسين أرقامك.",
  "d.mango.free": "لعب حر! كل الرياضات مفتوحة، وتلك العصابة الذهبية لك. حاول الحصول على ثلاث نجوم في كل مكان!",
  "d.tapir.hello": "مرحبًا، أنا تابو. كشكي لا يبيع شيئًا، فيه نصائح فقط. والنصائح مجانية!",
  "d.tapir.tip1": "نصيحة: في ضربة المضرب، اضرب مبكرًا لكرة قصيرة ومتأخرًا لكرة طويلة.",
  "d.tapir.tip2": "نصيحة: الضربة المثالية تملأ عدّاد الوثبة. العدّاد الممتلئ يعطيك ضربة خارقة!",
  "d.tapir.tip3": "نصيحة: إذا كان البطل صعبًا جدًا، شغّل «أبطال أسهل» في الإعدادات.",
  "d.tapir.tip4": "نصيحة: الخريطة تُظهر كل الأقواس. انقر على رياضة في الخريطة لتذهب إليها مباشرة.",
  "d.tapir.tip5": "نصيحة: ثلاث نجوم في رياضة تعني أنك أتقنتها حقًا. في المرة الأولى تحصل على عصابة توتية!",
  "d.tapir.tip6": "نصيحة: سكان الجزيرة يحتاجون إلى المساعدة. ساعدهم لتحصل على مظاهر جديدة!",
  "d.tapir.tip7": "نصيحة: الخسارة لا بأس بها. كل محاولة تعلّم كفوفك شيئًا جديدًا.",
  "d.tapir.tip8": "نصيحة: الحكيم شيلبي قرب الطوطم يعرف قصة كأس الأدغال.",
  "d.tapir.letter": "رسالة لي؟ من زوزو؟ ما ألطف ذلك. شكرًا لأنك أحضرتها!",
  "d.ants.qask1": "النجدة! الريح أطارت أكبر ورقة لدينا! كانت سقفنا!",
  "d.ants.qask2": "رأيناها تطير فوق النهر إلى الجزيرة الصغيرة الشرقية. هل تعيدها لنا؟",
  "d.ants.qwait": "ورقتنا على الجزيرة الصغيرة الشرقية. اعبر حجارة النهر!",
  "d.ants.qthanks": "سقفنا! شكرًا يا صديقنا الكبير. هذه عصابة زرقاء سماوية نسجناها بأنفسنا!",
  "d.ants.after": "قص، قص! نحن نبني سقفًا أكبر الآن.",
  "d.elder.totem1": "آه، أيها الصغير. هذا طوطم الكأس. إنه هنا منذ زمن أطول من صدفتي.",
  "d.elder.totem2": "فيه ثماني فتحات. كل واحدة تنتظر ريشة بطل.",
  "d.elder.totem3": "عندما تتوهج الثماني كلها، يستيقظ مصعد الكروم. وعندها تكون كأس الأدغال على منصة قمم الأشجار.",
  "d.elder.qask1": "همم، أين وضعت نظارتي؟ كنت أغفو قرب البحيرة...",
  "d.elder.qask2": "هل تبحث عنها أيها الصغير؟ قرب الرمل، جنوب البحيرة.",
  "d.elder.qwait": "يجب أن تكون نظارتي على الرمل قرب البحيرة. كل شيء ضبابي جدًا!",
  "d.elder.qthanks": "نظارتي! الآن أراك! خذ قبعة القش هذه. إنها تحميك من الشمس.",
  "d.elder.count": "يحمل الطوطم {n} من 8 ريشات. صبرًا، وتدرّب.",
  "d.elder.allf": "الريشات الثماني تتوهج! في كل سنواتي نادرًا ما رأيت ذلك. اصعد أيها البطل.",
  "d.zuzu.qask1": "بززز! أنا زوزو، أسرع ساعية بريد في الجزيرة!",
  "d.zuzu.qask2": "لكن جناحيّ متعبان. هل تأخذ هذه الرسالة إلى تابو في كشكه بالقرية؟",
  "d.zuzu.qwait": "كشك تابو سقفه أزرق وأبيض، في قرية الطحلب. بززز!",

  "name.ants": "La famille Snip", "name.elder": "Sage Shellby", "name.otters": "Jumelles Loutres", "name.marm": "Ouistitis",
  "story.1": "Cappy le capybara a descendu la rivière sur un petit radeau, jusqu'à l'île Delta.",
  "story.2": "Chaque année, l'île organise la Coupe de la Jungle. Huit champions. Huit sports. Cappy pourra-t-il tous les gagner ?",
  "story.3": "Boum ! Le radeau a touché le ponton, et les cousins Coco et Pip faisaient déjà coucou.",
  "d.coco.hi": "Cousin Cappy ! Tu es là ! Bienvenue sur l'île Delta !",
  "d.coco.again": "Le Totem de la Coupe est au milieu du village. Chaque Plume que tu gagnes l'illumine !",
  "d.pip.hi0": "Mango le perroquet t'attend en haut du ponton de bois. Va lui dire bonjour !",
  "d.pip.hi": "Salut Cappy ! J'adore la plage ici.",
  "d.pip.qask": "J'ai perdu trois jolis coquillages sur les plages. Tu peux les trouver ? Ils brillent !",
  "d.pip.qwait": "Plus que {n} coquillages à trouver ! Regarde sur les rives de sable.",
  "d.pip.qthanks": "Les trois ! Merci ! Tiens, prends mon bandana coucher de soleil. Il t'ira super bien.",
  "d.pip.after": "Le bandana coucher de soleil te va bien, cousin !",
  "d.mango.intro1": "Croâ ! Tu dois être Cappy ! Moi, c'est Mango, la guide de l'île.",
  "d.mango.intro2": "Huit champions vivent sur l'île Delta, et chacun garde un sport.",
  "d.mango.intro3": "Bats un champion et tu gagnes sa Plume. Chaque Plume a une couleur différente !",
  "d.mango.intro4": "Apporte tes Plumes au Totem de la Coupe, dans le Village Moussu. Remplis les huit encoches...",
  "d.mango.intro5": "...et l'ascenseur de lianes du Grand Kapokier s'ouvrira. La Coupe de la Jungle t'attend en haut ! Essaie d'abord Jada au court de la canopée. Va à l'ouest du village !",
  "d.mango.hint0": "Jada joue au Smash Raquette au court de la canopée, à l'ouest du village. Cherche l'arche orange !",
  "d.mango.hint1": "Déjà une Plume ! Il y a des arches fleuries partout sur l'île. Ouvre la carte pour les trouver.",
  "d.mango.hint2": "Bravo ! Traverse les pierres de la rivière pour aller sur l'îlot de l'est.",
  "d.mango.hint3": "Le Totem de la Coupe se remplit ! Continue, champion !",
  "d.mango.qask1": "Croâ... J'ai TELLEMENT faim. Les meilleures mangues poussent au pied des collines.",
  "d.mango.qask2": "Tu m'en rapportes une ? Je te donnerai un joli cadeau !",
  "d.mango.qwait": "Le manguier est près des collines, au nord-ouest. Miam, la mangue...",
  "d.mango.qthanks": "MANGUE ! Ma préférée ! Tiens, un chapeau d'explorateur pour un vrai explorateur.",
  "d.mango.allf": "Les huit Plumes ! L'ascenseur de lianes du Grand Kapokier est ouvert. Vas-y, vas-y !",
  "d.mango.after": "Champion de la Coupe de la Jungle ! Tu peux toujours jouer à tous les sports pour battre tes records.",
  "d.mango.free": "Jeu libre ! Tous les sports sont ouverts, et ce bandana doré est à toi. Essaie d'avoir trois étoiles partout !",
  "d.tapir.hello": "Bonjour, je suis Tapo. Mon étal ne vend rien, il n'y a que des astuces. Les astuces sont gratuites !",
  "d.tapir.tip1": "Astuce : au Smash Raquette, frappe tôt pour un coup court et tard pour un coup long.",
  "d.tapir.tip2": "Astuce : un coup parfait remplit ta jauge de Bond. Une jauge pleine donne un super coup !",
  "d.tapir.tip3": "Astuce : si un champion est trop fort, active Champions plus faciles dans les Réglages.",
  "d.tapir.tip4": "Astuce : la carte montre toutes les arches. Touche un sport sur la carte pour y aller tout de suite.",
  "d.tapir.tip5": "Astuce : trois étoiles à un sport, c'est que tu le maîtrises vraiment. La première fois, tu gagnes un bandana mûre !",
  "d.tapir.tip6": "Astuce : les habitants de l'île ont besoin d'aide. En les aidant, tu gagnes de nouveaux styles !",
  "d.tapir.tip7": "Astuce : perdre, ce n'est pas grave. Chaque essai apprend quelque chose de nouveau à tes pattes.",
  "d.tapir.tip8": "Astuce : le Sage Shellby, près du totem, connaît l'histoire de la Coupe de la Jungle.",
  "d.tapir.letter": "Une lettre pour moi ? De Zuzu ? Comme c'est gentil. Merci de l'avoir apportée !",
  "d.ants.qask1": "Au secours ! Le vent a emporté notre plus grande feuille ! C'était notre toit !",
  "d.ants.qask2": "On l'a vue s'envoler au-dessus de la rivière, vers l'îlot de l'est. Tu peux la rapporter ?",
  "d.ants.qwait": "Notre feuille est sur l'îlot de l'est. Traverse les pierres de la rivière !",
  "d.ants.qthanks": "Notre toit ! Merci, grand ami. Voici un bandana bleu ciel que nous avons tissé nous-mêmes !",
  "d.ants.after": "Snip, snip ! On construit un toit plus grand maintenant.",
  "d.elder.totem1": "Ah, jeune ami. Voici le Totem de la Coupe. Il est là depuis plus longtemps que ma carapace.",
  "d.elder.totem2": "Il a huit encoches. Chacune attend la Plume d'un champion.",
  "d.elder.totem3": "Quand les huit brilleront, l'ascenseur de lianes se réveillera. Alors la Scène de la Canopée offrira la Coupe de la Jungle.",
  "d.elder.qask1": "Hum, où ai-je mis mes lunettes ? Je faisais la sieste près du lagon...",
  "d.elder.qask2": "Tu veux bien les chercher, jeune ami ? Près du sable, au sud du lagon.",
  "d.elder.qwait": "Mes lunettes doivent être sur le sable près du lagon. Tout est si flou !",
  "d.elder.qthanks": "Mes lunettes ! Maintenant je te vois ! Prends ce chapeau de paille. Il protège du soleil.",
  "d.elder.count": "Le totem a {n} Plumes sur 8. De la patience, et de l'entraînement.",
  "d.elder.allf": "Les huit Plumes brillent ! En toutes mes années, je l'ai rarement vu. Monte, champion.",
  "d.zuzu.qask1": "Bzzz ! Je suis Zuzu, la messagère la plus rapide de l'île !",
  "d.zuzu.qask2": "Mais mes ailes sont fatiguées. Tu peux apporter cette lettre à Tapo, à son étal du village ?",
  "d.zuzu.qwait": "L'étal de Tapo a un toit bleu et blanc, dans le Village Moussu. Bzzz !",
  "d.zuzu.thanks": "Bzzz ! Tu l'as livrée ! Tiens, un drapeau feuille pour ton radeau. Il flotte joliment !",
  "d.zuzu.after": "Bzzz ! Il paraît que Jada est super rapide à la raquette !",
  "d.zuzu.liftopen": "Bzzz ! GRANDE NOUVELLE ! Les huit Plumes ! L'ascenseur de lianes du Grand Kapokier est ouvert !",
  "d.marm.hi": "Iiik iiik ! On est les petits assistants de Jada. On adore les échanges rapides !",
  "d.jada.pre": "Prêt pour le Smash Raquette ? Regarde la balle, frappe au bon moment, et bondis !",
  "d.jada.won": "Tu m'as battue à la loyale. Revanche quand tu veux !",
  "d.jada.soon": "On installe encore la table. Reviens bientôt !",
  "d.sloane.pre": "Bonjour... je... grimpe... lentement... mais... je... ne... m'arrête... jamais.",
  "d.sloane.won": "Tu... as... grimpé... si... vite. Bravo.",
  "d.sloane.soon": "Les... lianes... ne... sont... pas... prêtes.",
  "d.tico.pre": "Tir de Graines ! Touche les fruits flottants avant moi. Bonne chance !",
  "d.tico.won": "Quelle précision ! La Plume est à toi.",
  "d.tico.soon": "Les cibles du lagon se mettent en place. Reviens bientôt !",
  "d.otters.pre": "Fais la course avec nous sur les rapides ! Plouf, plouf !",
  "d.otters.won": "Tu as été plus rapide que nous deux !",
  "d.otters.soon": "On cire encore nos canoës. Reviens bientôt !",
  "d.rana.pre": "Tu peux suivre mes tambours ? Écoute, puis rejoue !",
  "d.rana.won": "Quel rythme ! Tu as le tempo de la jungle.",
  "d.rana.soon": "Mes tambours sèchent encore au soleil. Reviens bientôt !",
  "d.mico.pre": "HOUUU ! Des penaltys ! Tu arriveras à me marquer un but ?",
  "d.mico.won": "HOUUU ! Quel buteur ! Tu as gagné !",
  "d.mico.soon": "HOUUU ! On trace encore les lignes du terrain. Reviens bientôt !",
  "d.kiki.pre": "Glisse Feuille ! Saute sur les tremplins, fais des figures et atterris bien droit !",
  "d.kiki.won": "Ces figures étaient incroyables !",
  "d.kiki.soon": "La pente de boue est encore trop sèche. Reviens après la pluie !",
  "d.jada.ready": "Bel échauffement ! Maintenant, c'est mon tour. Le premier à 7. Attention à la Folie des fruits !",
  "end.1": "L'ascenseur de lianes a emmené Cappy tout là-haut, à travers les feuilles, jusqu'à la Scène de la Canopée.",
  "end.2": "Les huit champions l'attendaient. « Tu l'as bien méritée, Cappy ! »",
  "end.3": "Voici la Coupe de la Jungle, tressée de feuilles dorées. Elle revient au champion de l'île Delta.",
  "end.4": "Lève-la bien haut, Cappy ! Croâ !",
  "end.cup": "Champion de la Coupe de la Jungle !",
  "end.5": "Merci à tous ! À l'année prochaine ?",

  "name.ants": "La famiglia Snip", "name.elder": "Saggio Shellby", "name.otters": "Lontre Gemelle", "name.marm": "Uistitì",
  "story.1": "Cappy il capibara scese lungo il fiume su una piccola zattera, fino all'Isola Delta.",
  "story.2": "Ogni anno l'isola ospita la Coppa della Giungla. Otto campioni. Otto sport. Riuscirà Cappy a vincerli tutti?",
  "story.3": "Bum! La zattera arrivò al pontile, e i cugini Coco e Pip lo stavano già salutando.",
  "d.coco.hi": "Cugino Cappy! Ce l'hai fatta! Benvenuto sull'Isola Delta!",
  "d.coco.again": "Il Totem della Coppa è in mezzo al villaggio. Ogni Piuma che vinci lo illumina!",
  "d.pip.hi0": "Mango il pappagallo ti aspetta in cima alla passerella. Vai a salutarlo!",
  "d.pip.hi": "Ciao Cappy! Adoro la spiaggia qui.",
  "d.pip.qask": "Ho perso tre bellissime conchiglie sulle spiagge. Riesci a trovarle? Brillano!",
  "d.pip.qwait": "Mancano solo {n} conchiglie! Cerca sulle rive di sabbia.",
  "d.pip.qthanks": "Tutte e tre! Grazie! Tieni la mia bandana tramonto. Ti starà benissimo.",
  "d.pip.after": "La bandana tramonto ti sta bene, cugino!",
  "d.mango.intro1": "Craa! Tu devi essere Cappy! Io sono Mango, la guida dell'isola.",
  "d.mango.intro2": "Sull'Isola Delta vivono otto campioni, e ognuno custodisce uno sport.",
  "d.mango.intro3": "Batti un campione e vinci la sua Piuma. Ogni Piuma ha un colore diverso!",
  "d.mango.intro4": "Porta le tue Piume al Totem della Coppa nel Villaggio Muschioso. Riempi tutti e otto gli incavi...",
  "d.mango.intro5": "...e si aprirà l'ascensore di liane del Grande Kapok. In cima ti aspetta la Coppa della Giungla! Prova prima con Jada al campo della chioma. Vai a ovest del villaggio!",
  "d.mango.hint0": "Jada gioca a Racchetta Smash al campo della chioma, a ovest del villaggio. Cerca l'arco arancione!",
  "d.mango.hint1": "Già una Piuma! Ci sono archi fioriti in tutta l'isola. Apri la mappa per trovarli.",
  "d.mango.hint2": "Bravo! Attraversa le pietre del fiume per arrivare all'isolotto a est.",
  "d.mango.hint3": "Il Totem della Coppa si sta riempiendo! Continua così, campione!",
  "d.mango.qask1": "Craa... Ho TANTA fame. I mango migliori crescono ai piedi delle colline.",
  "d.mango.qask2": "Me ne porti uno? Ti darò una cosa bella!",
  "d.mango.qwait": "L'albero di mango è vicino alle colline, a nord-ovest. Mmm, mango...",
  "d.mango.qthanks": "MANGO! Il mio preferito! Tieni, un cappello da esploratore per un vero esploratore.",
  "d.mango.allf": "Tutte e otto le Piume! L'ascensore di liane del Grande Kapok è aperto. Vai, vai, vai!",
  "d.mango.after": "Campione della Coppa della Giungla! Puoi ancora giocare a ogni sport per battere i tuoi record.",
  "d.mango.free": "Gioco libero! Tutti gli sport sono aperti, e quella bandana dorata è tua. Prova a prendere tre stelle ovunque!",
  "d.tapir.hello": "Ciao, sono Tapo. Alla mia bancarella non si compra niente, ci sono solo consigli. I consigli sono gratis!",
  "d.tapir.tip1": "Consiglio: a Racchetta Smash, colpisci presto per un tiro corto e tardi per uno lungo.",
  "d.tapir.tip2": "Consiglio: un colpo perfetto riempie la barra del Balzo. Con la barra piena fai un supercolpo!",
  "d.tapir.tip3": "Consiglio: se un campione è troppo difficile, attiva Campioni più facili nelle Impostazioni.",
  "d.tapir.tip4": "Consiglio: la mappa mostra tutti gli archi. Tocca uno sport sulla mappa per andarci subito.",
  "d.tapir.tip5": "Consiglio: tre stelle in uno sport vuol dire che lo sai fare davvero. La prima volta ricevi una bandana mora!",
  "d.tapir.tip6": "Consiglio: gli abitanti dell'isola hanno bisogno di aiuto. Se li aiuti, avrai nuovi stili!",
  "d.tapir.tip7": "Consiglio: perdere va bene. Ogni tentativo insegna qualcosa di nuovo alle tue zampe.",
  "d.tapir.tip8": "Consiglio: il Saggio Shellby, vicino al totem, conosce la storia della Coppa della Giungla.",
  "d.tapir.letter": "Una lettera per me? Da Zuzu? Che bello. Grazie per avermela portata!",
  "d.ants.qask1": "Aiuto! Il vento si è portato via la nostra foglia più grande! Era il nostro tetto!",
  "d.ants.qask2": "L'abbiamo vista volare sopra il fiume, fino all'isolotto a est. Ce la riporti?",
  "d.ants.qwait": "La nostra foglia è sull'isolotto a est. Attraversa le pietre del fiume!",
  "d.ants.qthanks": "Il nostro tetto! Grazie, grande amico. Ecco una bandana azzurro cielo tessuta da noi!",
  "d.ants.after": "Snip, snip! Ora stiamo costruendo un tetto più grande.",
  "d.elder.totem1": "Ah, giovane amico. Questo è il Totem della Coppa. È qui da più tempo del mio guscio.",
  "d.elder.totem2": "Ha otto incavi. Ognuno aspetta la Piuma di un campione.",
  "d.elder.totem3": "Quando tutti e otto brilleranno, l'ascensore di liane si sveglierà. E sul Palco della Chioma ci sarà la Coppa della Giungla.",
  "d.elder.qask1": "Mmm, dove ho messo gli occhiali? Stavo facendo un pisolino vicino alla laguna...",
  "d.elder.qask2": "Me li cerchi, giovane amico? Vicino alla sabbia, a sud della laguna.",
  "d.elder.qwait": "I miei occhiali dovrebbero essere sulla sabbia vicino alla laguna. Vedo tutto sfocato!",
  "d.elder.qthanks": "I miei occhiali! Adesso ti vedo! Prendi questo cappello di paglia. Ripara dal sole.",
  "d.elder.count": "Il totem ha {n} Piume su 8. Pazienza, e allenamento.",
  "d.elder.allf": "Brillano tutte e otto le Piume! In tutti i miei anni, l'ho visto raramente. Sali, campione.",
  "d.zuzu.qask1": "Bzzz! Sono Zuzu, la messaggera più veloce dell'isola!",
  "d.zuzu.qask2": "Ma ho le ali stanche. Porteresti questa lettera a Tapo, alla sua bancarella nel villaggio?",
  "d.zuzu.qwait": "La bancarella di Tapo ha il tetto blu e bianco, nel Villaggio Muschioso. Bzzz!",
  "d.zuzu.thanks": "Bzzz! L'hai consegnata! Tieni, una bandiera a foglia per la tua zattera. Sventola benissimo!",
  "d.zuzu.after": "Bzzz! Ho sentito che Jada è velocissima con la racchetta!",
  "d.zuzu.liftopen": "Bzzz! GRANDE NOTIZIA! Tutte e otto le Piume! L'ascensore di liane del Grande Kapok è aperto!",
  "d.marm.hi": "Iiik iiik! Siamo i piccoli aiutanti di Jada. Adoriamo gli scambi veloci!",
  "d.jada.pre": "Pronto per Racchetta Smash? Guarda la pallina, colpisci al momento giusto e balza!",
  "d.jada.won": "Mi hai battuta lealmente. Rivincita quando vuoi!",
  "d.jada.soon": "Stiamo ancora montando il tavolo. Torna presto!",
  "d.sloane.pre": "Ciao... io... salgo... piano... ma... non... mi... fermo... mai.",
  "d.sloane.won": "Sei... salito... così... veloce. Bravo.",
  "d.sloane.soon": "Le... liane... non... sono... ancora... pronte.",
  "d.tico.pre": "Tiro di Semi! Colpisci la frutta galleggiante prima di me. Buona fortuna!",
  "d.tico.won": "Che mira! La Piuma è tua.",
  "d.tico.soon": "I bersagli della laguna stanno arrivando al loro posto. Torna presto!",
  "d.otters.pre": "Sfidaci giù per le rapide! Splash, splash!",
  "d.otters.won": "Sei stato più veloce di tutte e due!",
  "d.otters.soon": "Stiamo ancora lucidando le canoe. Torna presto!",
  "d.rana.pre": "Riesci a starmi dietro con i tamburi? Ascolta, poi suonalo tu!",
  "d.rana.won": "Che ritmo! Hai il battito della giungla.",
  "d.rana.soon": "I miei tamburi si stanno ancora asciugando al sole. Torna presto!",
  "d.mico.pre": "UUUH! Rigori! Riesci a segnarmi?",
  "d.mico.won": "UUUH! Che bomber! Hai vinto!",
  "d.mico.soon": "UUUH! Stanno ancora segnando il campo. Torna presto!",
  "d.kiki.pre": "Scivolata Foglia! Salta dalle rampe, fai acrobazie e atterra dritto!",
  "d.kiki.won": "Quelle acrobazie erano fantastiche!",
  "d.kiki.soon": "Il pendio di fango è ancora troppo secco. Torna dopo la pioggia!",
  "d.jada.ready": "Bel riscaldamento! Ora tocca a me. Vince chi arriva a 7. Attento alla Frenesia di frutta!",
  "end.1": "L'ascensore di liane portò Cappy su, su, su, tra le foglie fino al Palco della Chioma.",
  "end.2": "Tutti e otto i campioni lo aspettavano. «Te la sei meritata, Cappy!»",
  "end.3": "Questa è la Coppa della Giungla, intrecciata con foglie d'oro. Appartiene al campione dell'Isola Delta.",
  "end.4": "Alzala in alto, Cappy! Craa!",
  "end.cup": "Campione della Coppa della Giungla!",
  "end.5": "Grazie a tutti! Ci vediamo l'anno prossimo?",

  "name.ants": "A família Snip", "name.elder": "Sábio Shellby", "name.otters": "Lontras Gêmeas", "name.marm": "Saguis",
  "story.1": "Cappy, a capivara, desceu o rio numa jangadinha, até chegar à Ilha Delta.",
  "story.2": "Todo ano a ilha faz a Taça da Selva. Oito campeões. Oito esportes. Será que Cappy vence todos?",
  "story.3": "Tum! A jangada chegou ao cais, e os primos Coco e Pip já estavam acenando.",
  "d.coco.hi": "Primo Cappy! Você chegou! Bem-vindo à Ilha Delta!",
  "d.coco.again": "O Totem da Taça fica no meio da vila. Cada Pena que você ganha acende ele!",
  "d.pip.hi0": "O papagaio Mango está esperando você lá em cima da passarela. Vá dar um oi!",
  "d.pip.hi": "Oi, Cappy! Eu adoro a praia daqui.",
  "d.pip.qask": "Perdi três conchas lindas nas praias. Você consegue achar? Elas brilham!",
  "d.pip.qwait": "Faltam só {n} conchas! Procure nas margens de areia.",
  "d.pip.qthanks": "As três! Obrigado! Tome, fique com minha bandana pôr do sol. Vai ficar ótima em você.",
  "d.pip.after": "A bandana pôr do sol combina com você, primo!",
  "d.mango.intro1": "Crá! Você deve ser o Cappy! Eu sou a Mango, a guia da ilha.",
  "d.mango.intro2": "Oito campeões moram na Ilha Delta, e cada um cuida de um esporte.",
  "d.mango.intro3": "Vença um campeão e ganhe a Pena dele. Cada Pena tem uma cor diferente!",
  "d.mango.intro4": "Leve suas Penas ao Totem da Taça, na Vila do Musgo. Encha os oito encaixes...",
  "d.mango.intro5": "...e o elevador de cipós da Grande Sumaúma vai abrir. A Taça da Selva espera lá no alto! Tente primeiro a Jada na quadra da copa. Vá para o oeste da vila!",
  "d.mango.hint0": "A Jada joga Raquete Feroz na quadra da copa, a oeste da vila. Procure o arco laranja!",
  "d.mango.hint1": "Já tem uma Pena! Há arcos de flores pela ilha toda. Abra o mapa para achar.",
  "d.mango.hint2": "Muito bem! Atravesse as pedras do rio para chegar à ilhota do leste.",
  "d.mango.hint3": "O Totem da Taça está enchendo! Continue, campeão!",
  "d.mango.qask1": "Crá... Estou com MUITA fome. As melhores mangas crescem no pé dos morros.",
  "d.mango.qask2": "Você me traz uma? Eu te dou uma coisa legal!",
  "d.mango.qwait": "A mangueira fica perto dos morros, a noroeste. Hum, manga...",
  "d.mango.qthanks": "MANGA! Minha favorita! Tome, um chapéu de explorador para um verdadeiro explorador.",
  "d.mango.allf": "As oito Penas! O elevador de cipós da Grande Sumaúma está aberto. Vai, vai, vai!",
  "d.mango.after": "Campeão da Taça da Selva! Você ainda pode jogar qualquer esporte para bater seus recordes.",
  "d.mango.free": "Jogo livre! Todos os esportes estão abertos, e aquela bandana dourada é sua. Tente três estrelas em todos!",
  "d.tapir.hello": "Olá, eu sou o Tapo. Na minha barraca não se compra nada, só tem dicas. Dicas são de graça!",
  "d.tapir.tip1": "Dica: na Raquete Feroz, bata cedo para uma bola curta e tarde para uma longa.",
  "d.tapir.tip2": "Dica: uma batida perfeita enche sua barra de Bote. Com a barra cheia sai uma superbola!",
  "d.tapir.tip3": "Dica: se um campeão estiver difícil demais, ligue Campeões mais fáceis nos Ajustes.",
  "d.tapir.tip4": "Dica: o mapa mostra todos os arcos. Toque num esporte no mapa para ir direto até lá.",
  "d.tapir.tip5": "Dica: três estrelas num esporte quer dizer que você domina mesmo. Na primeira vez, você ganha uma bandana amora!",
  "d.tapir.tip6": "Dica: o pessoal da ilha precisa de ajuda. Ajudando, você ganha estilos novos!",
  "d.tapir.tip7": "Dica: perder não tem problema. Cada tentativa ensina algo novo às suas patas.",
  "d.tapir.tip8": "Dica: o Sábio Shellby, perto do totem, conhece a história da Taça da Selva.",
  "d.tapir.letter": "Uma carta para mim? Da Zuzu? Que lindo. Obrigado por trazer!",
  "d.ants.qask1": "Socorro! O vento levou nossa maior folha! Era o nosso telhado!",
  "d.ants.qask2": "Vimos ela voar por cima do rio, até a ilhota do leste. Você traz de volta?",
  "d.ants.qwait": "Nossa folha está na ilhota do leste. Atravesse as pedras do rio!",
  "d.ants.qthanks": "Nosso telhado! Obrigada, grande amigo. Tome uma bandana azul-céu que nós mesmas tecemos!",
  "d.ants.after": "Tec, tec! Agora estamos fazendo um telhado maior.",
  "d.elder.totem1": "Ah, jovem. Este é o Totem da Taça. Ele está aqui há mais tempo que o meu casco.",
  "d.elder.totem2": "Ele tem oito encaixes. Cada um espera a Pena de um campeão.",
  "d.elder.totem3": "Quando os oito brilharem, o elevador de cipós vai acordar. E no Palco da Copa das Árvores estará a Taça da Selva.",
  "d.elder.qask1": "Hum, onde deixei meus óculos? Eu estava cochilando perto da lagoa...",
  "d.elder.qask2": "Você procura para mim, jovem? Perto da areia, ao sul da lagoa.",
  "d.elder.qwait": "Meus óculos devem estar na areia perto da lagoa. Está tudo embaçado!",
  "d.elder.qthanks": "Meus óculos! Agora eu te vejo! Fique com este chapéu de palha. Ele protege do sol.",
  "d.elder.count": "O totem tem {n} de 8 Penas. Paciência, e treino.",
  "d.elder.allf": "As oito Penas brilham! Em todos os meus anos, quase nunca vi isso. Suba, campeão.",
  "d.zuzu.qask1": "Bzzz! Eu sou a Zuzu, a mensageira mais rápida da ilha!",
  "d.zuzu.qask2": "Mas minhas asas estão cansadas. Você leva esta carta para o Tapo, na barraca dele na vila?",
  "d.zuzu.qwait": "A barraca do Tapo tem o teto azul e branco, na Vila do Musgo. Bzzz!",
  "d.zuzu.thanks": "Bzzz! Você entregou! Tome, uma bandeira de folha para sua jangada. Ela tremula bonito!",
  "d.zuzu.after": "Bzzz! Ouvi dizer que a Jada é rapidíssima na raquete!",
  "d.zuzu.liftopen": "Bzzz! NOTÍCIA BOA! As oito Penas! O elevador de cipós da Grande Sumaúma está aberto!",
  "d.marm.hi": "Iiic iiic! Somos os ajudantes da Jada. Adoramos trocas de bola rápidas!",
  "d.jada.pre": "Pronto para a Raquete Feroz? Olhe a bola, bata na hora certa e dê o bote!",
  "d.jada.won": "Você me venceu de forma justa. Revanche quando quiser!",
  "d.jada.soon": "A mesa ainda está sendo montada. Volte logo!",
  "d.sloane.pre": "Olá... eu... subo... devagar... mas... nunca... paro.",
  "d.sloane.won": "Você... subiu... tão... rápido. Muito... bem.",
  "d.sloane.soon": "Os... cipós... ainda... não... estão... prontos.",
  "d.tico.pre": "Tiro de Sementes! Acerte as frutas flutuantes antes de mim. Boa sorte!",
  "d.tico.won": "Que pontaria! A Pena é sua.",
  "d.tico.soon": "Os alvos da lagoa estão chegando no lugar. Volte logo!",
  "d.otters.pre": "Aposte corrida com a gente nas corredeiras! Tchibum, tchibum!",
  "d.otters.won": "Você foi mais rápido que nós duas!",
  "d.otters.soon": "Ainda estamos encerando as canoas. Volte logo!",
  "d.rana.pre": "Consegue acompanhar meus tambores? Escute e depois toque igual!",
  "d.rana.won": "Que ritmo! Você tem a batida da selva.",
  "d.rana.soon": "Meus tambores ainda estão secando no sol. Volte logo!",
  "d.mico.pre": "UUUH! Pênaltis! Você consegue fazer um gol em mim?",
  "d.mico.won": "UUUH! Que artilheiro! Você venceu!",
  "d.mico.soon": "UUUH! O campo ainda está sendo pintado. Volte logo!",
  "d.kiki.pre": "Tobogã de Folha! Pule nas rampas, faça manobras e aterrisse reto!",
  "d.kiki.won": "Essas manobras foram incríveis!",
  "d.kiki.soon": "A ladeira de lama ainda está seca demais. Volte depois da chuva!",
  "d.jada.ready": "Bom aquecimento! Agora é a minha vez. Quem fizer 7 primeiro. Cuidado com o Frenesi de Frutas!",
  "end.1": "O elevador de cipós levou Cappy para cima, para cima, para cima, por entre as folhas até o Palco da Copa das Árvores.",
  "end.2": "Os oito campeões estavam esperando. “Você mereceu, Cappy!”",
  "end.3": "Esta é a Taça da Selva, trançada com folhas douradas. Ela é do campeão da Ilha Delta.",
  "end.4": "Levante bem alto, Cappy! Crá!",

  "story.1": "水豚卡皮乘著小木筏順著河流漂下，一路來到三角洲島。",
  "story.2": "每年島上都會舉辦叢林盃。八位冠軍。八種運動。卡皮能全部贏下來嗎？",
  "story.3": "咚！木筏靠上了碼頭，表哥可可和表妹皮普早就在揮手了。",
  "d.coco.hi": "卡皮表弟！你來了！歡迎來到三角洲島！",
  "d.coco.again": "獎盃圖騰在村子正中央。你每贏一根羽毛，它就會亮起來！",
  "d.pip.hi0": "鸚鵡芒果在木棧道上面等你。快去打招呼！",
  "d.pip.hi": "嗨，卡皮！我好喜歡這裡的海灘。",
  "d.pip.qask": "我在海灘上弄丟了三個漂亮的貝殼。你能找到嗎？它們會閃閃發亮！",
  "d.pip.qwait": "只剩 {n} 個貝殼了！去沙岸找找看。",
  "d.pip.qthanks": "三個都找到了！謝謝你！這條夕陽頭巾送你，你戴一定很好看。",
  "d.pip.after": "夕陽頭巾很適合你喔！",
  "d.mango.intro1": "嘎！你一定是卡皮！我是芒果，島上的導遊。",
  "d.mango.intro2": "三角洲島上住著八位冠軍，每位都守護著一種運動。",
  "d.mango.intro3": "打敗冠軍就能贏得他的羽毛。每根羽毛的顏色都不一樣！",
  "d.mango.intro4": "把羽毛帶到青苔村的獎盃圖騰。把八個插槽都填滿……",
  "d.mango.intro5": "……巨大木棉樹的藤蔓升降梯就會打開。叢林盃在上面等你！先去樹冠球場挑戰潔達吧。往村子西邊走！",
  "d.mango.hint0": "潔達在村子西邊的樹冠球場打球拍猛擊。找找橘色的拱門！",
  "d.mango.hint1": "已經有一根羽毛了！島上到處都有花朵拱門。打開地圖就能找到。",
  "d.mango.hint2": "做得好！踩著河裡的踏腳石到東邊的小島。",
  "d.mango.hint3": "獎盃圖騰快滿了！繼續加油，冠軍！",
  "d.mango.qask1": "嘎……我好餓好餓。最好吃的芒果長在山丘腳下。",
  "d.mango.qask2": "可以幫我帶一顆來嗎？我會送你好東西！",
  "d.mango.qwait": "芒果樹在山丘旁邊，西北方。嗯，芒果……",
  "d.mango.qthanks": "芒果！我的最愛！這頂探險帽送給真正的探險家。",
  "d.mango.allf": "八根羽毛！巨大木棉樹的藤蔓升降梯打開了。快去，快去！",
  "d.mango.after": "叢林盃冠軍！你還是可以玩任何運動，刷新你的紀錄。",
  "d.mango.free": "自由遊玩！所有運動都開放了，那條金色頭巾也是你的。每一項都挑戰三顆星吧！",
  "d.tapir.hello": "你好，我是塔波。我的小攤什麼都不賣，只有小提示。提示是免費的！",
  "d.tapir.tip1": "提示：在球拍猛擊中，早點揮拍球會短，晚點揮拍球會長。",
  "d.tapir.tip2": "提示：完美的揮拍會讓撲擊量表變多。量表滿了就能打出超級球！",
  "d.tapir.tip3": "提示：如果冠軍太難，就在設定裡打開「簡單一點的冠軍」。",
  "d.tapir.tip4": "提示：地圖上有所有拱門。點地圖上的運動就能直接走過去。",
  "d.tapir.tip5": "提示：一項運動拿到三顆星，代表你真的很厲害。第一次拿到時會得到莓果頭巾！",
  "d.tapir.tip6": "提示：島上的居民需要幫忙。幫助他們就能得到新造型！",
  "d.tapir.tip7": "提示：輸了沒關係。每次嘗試都會讓你的爪子學到新東西。",
  "d.tapir.tip8": "提示：圖騰旁邊的雪比長老知道叢林盃的故事。",
  "d.tapir.letter": "給我的信？是祖祖寄的？真開心。謝謝你送來！",
  "d.ants.qask1": "救命！風把我們最大的葉子吹走了！那是我們的屋頂！",
  "d.ants.qask2": "我們看到它飛過河，到東邊的小島去了。你能幫我們拿回來嗎？",
  "d.ants.qwait": "我們的葉子在東邊的小島上。踩著河裡的踏腳石過去！",
  "d.ants.qthanks": "我們的屋頂！謝謝你，大朋友。這條天空藍頭巾是我們自己織的！",
  "d.ants.after": "喀嚓喀嚓！我們現在要蓋更大的屋頂。",
  "d.elder.totem1": "啊，年輕人。這就是獎盃圖騰。它在這裡的時間比我的殼還要久。",
  "d.elder.totem2": "它有八個插槽。每個都在等一位冠軍的羽毛。",
  "d.elder.totem3": "當八個都亮起來，藤蔓升降梯就會醒來。叢林盃就在樹冠舞台上等著。",
  "d.elder.qask1": "嗯，我把眼鏡放到哪裡去了？我剛剛在潟湖邊打盹……",
  "d.elder.qask2": "年輕人，你能幫我找找嗎？在潟湖南邊的沙灘附近。",
  "d.elder.qwait": "我的眼鏡應該在潟湖邊的沙灘上。什麼都看不清楚！",
  "d.elder.qthanks": "我的眼鏡！現在看得到你了！這頂草帽送你，可以遮太陽。",
  "d.elder.count": "圖騰上有 {n}/8 根羽毛。要有耐心，多多練習。",
  "d.elder.allf": "八根羽毛都在發光！我活了這麼多年，很少見到。上去吧，冠軍。",
  "d.zuzu.qask1": "嗡嗡！我是祖祖，島上最快的信差！",
  "d.zuzu.qask2": "可是我的翅膀好累。你能把這封信送到村子裡塔波的小攤嗎？",
  "d.zuzu.qwait": "塔波的小攤在青苔村，屋頂是藍白色的。嗡嗡！",
  "d.zuzu.thanks": "嗡嗡！你送到了！這面葉子旗送你的木筏，飄起來很好看！",
  "d.zuzu.after": "嗡嗡！聽說潔達揮拍超級快！",
  "d.zuzu.liftopen": "嗡嗡！大消息！八根羽毛到齊了！巨大木棉樹的藤蔓升降梯打開了！",
  "d.marm.hi": "吱吱！我們是潔達的小幫手。我們最愛快速對打！",
  "d.jada.pre": "準備好玩球拍猛擊了嗎？看好球，抓準時機揮拍，然後撲上去！",
  "d.jada.won": "你光明正大地打敗我了。隨時歡迎再比一場！",
  "d.jada.soon": "球桌還在搭。過一陣子再來！",
  "d.sloane.pre": "你好……我……爬得……很慢……但是……我……從不……停下。",
  "d.sloane.won": "你……爬得……好快。做得……好。",
  "d.sloane.soon": "藤蔓……還沒……準備……好。",
  "d.tico.pre": "種子射擊！比我先打中漂浮的水果。祝你好運！",
  "d.tico.won": "好準！羽毛是你的了。",
  "d.tico.soon": "潟湖上的靶子還在漂到定位。過一陣子再來！",
  "d.otters.pre": "來跟我們比賽衝急流！嘩啦嘩啦！",
  "d.otters.won": "你比我們兩個都快！",
  "d.otters.soon": "我們還在幫獨木舟上蠟。過一陣子再來！",
  "d.rana.pre": "你跟得上我的鼓聲嗎？先聽，再打出來！",
  "d.rana.won": "好棒的節奏！你有叢林的節拍。",
  "d.rana.soon": "我的鼓還在太陽下曬乾。過一陣子再來！",
  "d.mico.pre": "吼～！罰球！你能踢進我守的門嗎？",
  "d.mico.won": "吼～！好厲害的射手！你贏了！",
  "d.mico.soon": "吼～！球場還在畫線。過一陣子再來！",
  "d.kiki.pre": "葉子滑行！從跳台跳起來，做特技，然後平穩落地！",
  "d.kiki.won": "那些特技太厲害了！",
  "d.kiki.soon": "泥巴坡還太乾。下過雨再來吧！",
  "d.jada.ready": "暖身得不錯！現在換我了。先拿 7 分的贏。小心水果狂歡！",
  "end.1": "藤蔓升降梯載著卡皮往上、往上、再往上，穿過樹葉來到樹冠舞台。",
  "end.2": "八位冠軍都在等他。「這是你應得的，卡皮！」",
  "end.3": "這就是叢林盃，用金色的葉子編成。它屬於三角洲島的冠軍。",
  "end.4": "把它舉高高，卡皮！嘎！",
  "end.cup": "叢林盃冠軍！",
  "end.5": "謝謝大家！明年再見？",

/* ---- core/06-ui.js ---- */
// ======================================================================================================
// UI: buttons (touch, mouse and keys), wooden cards, HUD bars, the star bar, floating score text, particles,
// a banner, and the typewriter text box. All drawn on the canvas in virtual pixels.
// Buttons: call JC.ui.button(g, id, x, y, w, h, label, opts) while drawing; a tap on it, or A while it has the
// keyboard focus, calls the scene's onButton(id). Arrow keys move the focus between the buttons drawn last frame.
// ======================================================================================================
const UI = { hits: [], n: 0, prevN: 0, prev: [], focus: 0, focusScope: '', pressId: '', pressT: 0, showFocus: false };
JC.ui = UI;
for (let i = 0; i < 64; i++) { UI.hits.push({ id: '', x: 0, y: 0, w: 0, h: 0 }); UI.prev.push({ id: '', x: 0, y: 0, w: 0, h: 0 }); }
UI.beginFrame = function () { UI.n = 0; };
/** After drawing: the buttons of the finished frame are what taps and the focus use (UI.prev). */
UI.endFrame = function () {
  for (let i = 0; i < UI.n; i++) { const a = UI.prev[i], b = UI.hits[i]; a.id = b.id; a.x = b.x; a.y = b.y; a.w = b.w; a.h = b.h; }
  UI.prevN = UI.n;
  if (UI.focus >= UI.prevN) UI.focus = Math.max(0, UI.prevN - 1);
};
UI.hitAt = function (x, y) {
  for (let i = UI.prevN - 1; i >= 0; i--) { const h = UI.prev[i]; if (x >= h.x && x < h.x + h.w && y >= h.y && y < h.y + h.h) return h.id; }
  return '';
};
UI.focusedId = () => (UI.prevN ? UI.prev[Math.min(UI.focus, UI.prevN - 1)].id : '');
UI.setFocus = function (id) { for (let i = 0; i < UI.prevN; i++) if (UI.prev[i].id === id) { UI.focus = i; return; } UI.wantFocus = id; };
/** Move the keyboard focus to the nearest button in a direction. */
UI.moveFocus = function (dir) {
  if (!UI.prevN) return;
  UI.showFocus = true;
  const cur = UI.prev[Math.min(UI.focus, UI.prevN - 1)], cx = cur.x + cur.w / 2, cy = cur.y + cur.h / 2;
  let best = -1, bestD = 1e9;
  for (let i = 0; i < UI.prevN; i++) {
    if (i === UI.focus) continue;
    const h = UI.prev[i], dx = h.x + h.w / 2 - cx, dy = h.y + h.h / 2 - cy;
    const along = dir === 'left' ? -dx : dir === 'right' ? dx : dir === 'up' ? -dy : dy;
    const across = dir === 'left' || dir === 'right' ? Math.abs(dy) : Math.abs(dx);
    if (along <= 2) continue;
    const d = along + across * 2.5;
    if (d < bestD) { bestD = d; best = i; }
  }
  if (best < 0) { // wrap through the list order
    best = (dir === 'down' || dir === 'right') ? (UI.focus + 1) % UI.prevN : (UI.focus - 1 + UI.prevN) % UI.prevN;
  }
  UI.focus = best; AUDIO.sfx('blip');
};
/** Standard menu input: arrows move the focus, A presses it, a tap presses what is under it. Returns the id or ''. */
UI.menuInput = function (e) {
  if (e.type === 'press' && (e.key === 'left' || e.key === 'right' || e.key === 'up' || e.key === 'down')) { UI.moveFocus(e.key); return ''; }
  if (e.type === 'press' && e.key === 'a') { UI.showFocus = true; const id = UI.focusedId(); if (id) { UI.pressId = id; UI.pressT = 0.12; } return id; }
  if (e.type === 'down') { const id = UI.hitAt(e.x, e.y); if (id) { UI.pressId = id; UI.pressT = 0.2; } UI.showFocus = false; return ''; }
  if (e.type === 'tap') { const id = UI.hitAt(e.x, e.y); if (id) { UI.setFocus(id); UI.pressT = 0.1; } return id; }
  return '';
};
function addHit(id, x, y, w, h) {
  if (UI.n >= UI.hits.length) return;
  const r = UI.hits[UI.n++]; r.id = id; r.x = x; r.y = y; r.w = w; r.h = h;
  if (UI.wantFocus === id) { UI.focus = UI.n - 1; UI.wantFocus = ''; }
}
UI.addHit = addHit;
/* A chunky button. opts: { col (fill), tcol (text), icon (a function(g, cx, cy)), small, disabled, glow } */
UI.button = function (g, id, x, y, w, h, label, opts) {
  const o = opts || NOOPT;
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  if (!o.disabled) addHit(id, x, y, w, h);
  const focused = UI.showFocus && UI.prevN && UI.prev[Math.min(UI.focus, UI.prevN - 1)].id === id && !o.disabled;
  const down = UI.pressT > 0 && UI.pressId === id;
  const fill = o.disabled ? '#7a7488' : o.col || PAL.r3, dy = down ? 1 : 0;
  if (focused || o.glow) { rect(g, x - 2, y - 2 + dy, w + 4, h + 4, focused ? PAL.r5 : shade(fill, 0.5)); }
  rect(g, x + 1, y + 2, w - 2, h - 1, PAL.ink);                    // drop shadow
  box(g, x, y + dy, w, h - 2, PAL.ink, PAL.ink);
  rect(g, x + 1, y + 1 + dy, w - 2, h - 4, shade(fill, -0.3));      // dark base
  rect(g, x + 1, y + 1 + dy, w - 2, h - 6, fill);                   // face
  rect(g, x + 2, y + 1 + dy, w - 4, 1, shade(fill, 0.45));          // shine
  const cy = y + dy + ((h - 4) >> 1), sc = o.scale || 1;
  let tx = x + w / 2, room = w - 8;
  const lw = label ? textW(label, sc) : 0;
  if (o.icon) {
    if (!label) o.icon(g, x + w / 2, cy);
    else if (lw + 22 <= w) { o.icon(g, x + 4 + 6, cy); tx = x + 14 + (w - 14) / 2; room = w - 22; }
  }
  if (!label) return;

// ======================================================================================================
// STORY PANELS: soft, painted-looking pictures (gradients, washes of colour, brush dabs and a paper grain, all drawn
// in code) that tell the raft arrival at the start of each launch and the climb to the Canopy Stage at the end.
// They contrast with the crisp pixel island on purpose. A story line is a text-box line with a `panel`:
//   JC.say([{ who: 'story', key: 'story.1', panel: 'river' }, ...])
// While such a line is open the panel fills the screen above the text box, with a Skip button (or Esc / B) that
// jumps past every panel line in a row. Each picture is painted once per screen size into its own canvas.
// ======================================================================================================

JC.story = STORY;

STORY.showing = () => !!STORY.line();
/** Skip every story-panel line in a row (the lines after them, like a cousin's hello, still show). */
STORY.skip = function () {
  let n = 0;
  while (STORY.showing() && n++ < 40) TB.nextLine();
  STORY.cur = ''; STORY.prev = '';
};
STORY.update = function (dt) {
  STORY.t += dt;
  const id = STORY.line();
  if (id && id !== STORY.cur) { STORY.prev = STORY.cur; STORY.cur = id; STORY.fade = 0; }
  if (STORY.fade < 1) STORY.fade = Math.min(1, STORY.fade + dt * 2.5);
  if (!id) { STORY.cur = ''; STORY.prev = ''; }
};
/** Input while a panel shows: Skip (button, Esc / B) or the text box. True when used. */
STORY.input = function (e) {
  if (!STORY.showing()) return false;
  if ((e.type === 'press' && (e.key === 'b' || e.key === 'pause')) || (e.type === 'tap' && UI.hitAt(e.x, e.y) === 'skip')) { AUDIO.sfx('back'); STORY.skip(); return true; }
  if (e.type === 'down' && UI.hitAt(e.x, e.y) === 'skip') return true;
  TB.input(e);

  }
  function groundAt(x) {
    const f = clamp(x, 0, LEN - STEP) / STEP, i = f | 0, k = f - i;

  /* ---------- riding (shared by Cappy and Kiki) ---------- */
  function groundAccel(x, vx) {

  /** Seconds until a body in the air at (x, y) with (vx, vy) lands (a quick forward simulation, for bots and tests). */
  function landIn(x, y, vx, vy) {
    for (let i = 1; i < 300; i++) { const dt = 1 / 60; vy += gravAt(vy) * dt; x += vx * dt; y += vy * dt; if (y >= groundAt(x)) { S.landX = x; return i / 60; } }

  /* ---------- Cappy ---------- */
  function jump(ctx) {
    if (S.over || S.crash > 0) return;

    if (S.landCd > 0) return;
    S.hint = Math.max(0, S.hint - 0.15);

  }
  function takeOff(ctx, vy) {
    S.air = true; S.airT = 0; S.vy = vy + S.vx * slopeAt(S.x) * 0.5; S.lowMsg = false;
    S.nTr = 0; S.cSpin = 0; S.cFlip = 0; S.cGrab = 0; S.pend = 0; S.trick = ''; S.queue = ''; S.lastTrickEnd = -9; S.windOn = false;
    const big = vy < -HOP_V - 10;
    ctx.sfx(big ? 'lsPop' : 'whoosh');
    S.sqT = 0.16; S.sqK = big ? 0.9 : 0.5;              // stretch on the way up
    JC.juice.clearTrail(TRAIL);
    if (big) {
      // a launch burst: mud and leaf bits fly off the lip
      const X = sx(S.x), Y = sy(S.y);
      for (let i = 0; i < 10; i++) UI.particle(X - 4, Y, -30 - S.r() * 60, -20 - S.r() * 80, i % 3 ? '#9a6234' : '#7cc84a', 0.5 + S.r() * 0.3, 2, 260);

    }
  }
  function trickInput(ctx, id) {
    if (!S.air || S.over || S.crash > 0) return;
    if (S.trick) { if (!S.queue) S.queue = id; return; }
    startTrick(ctx, id);
  }
  function startTrick(ctx, id) {
    const h = groundAt(S.x) - S.y;
    if (h < MIN_AIR && S.airT > 0.05) { if (!S.lowMsg) { S.lowMsg = true; UI.float(sx(S.x), fy(sy(S.y) - 30), t('ls.low'), '#ffe9a0'); } return; }
    S.trick = id; S.trickT = 0; S.trickDur = TRICKS[id].dur * (S.ctx.easy ? 0.85 : 1);
    S.hint = Math.max(0, S.hint - 0.2);
    ctx.sfx('whoosh');
  }
  function trickDone(ctx) {
    const id = S.trick, base = TRICKS[id].pts;
    const c = id === 'spin' ? S.cSpin++ : id === 'flip' ? S.cFlip++ : S.cGrab++;
    S.pend += c ? base / 2 : base; S.nTr++; S.tricksDone++;
    S.trick = '';
    ctx.sfx('lsTrick'); S.lastTrickEnd = S.airT;
    UI.float(sx(S.x) + 30 * S.K, fy(sy(S.y) - 30), t('ls.' + id), '#ffe9a0', 2);
    if (S.nTr > 1) UI.float(sx(S.x) + 30 * S.K, fy(sy(S.y) - 52), label('ls.combo', S.nTr), '#ffd24a', 2);

  }
  function land(ctx) {

      S.trick = ''; S.queue = ''; S.crash = 0.85; S.crashes++; S.vx = Math.min(S.vx, 70);
      ctx.sfx('lsSplat'); UI.burst(sx(S.x), sy(S.y), 18, '#7a4a26', 80);
      for (let i = 0; i < 8; i++) UI.particle(sx(S.x), sy(S.y) - 4, (S.r() - 0.3) * 120, -40 - S.r() * 70, '#6e4325', 0.7, 3, 300);
      UI.float(sx(S.x), fy(sy(S.y) - 34), t('ls.wipeout'), '#ffb3d6', 2);
      UI.float(sx(S.x), fy(sy(S.y) - 56), t('ls.shake'), '#fff8e8');

    if (big) {

      for (let i = 0; i < 6; i++) UI.particle(sx(S.x) - 14, sy(S.y) - 2, -40 - S.r() * 70, -10 - S.r() * 30, i % 2 ? '#ffd24a' : '#ff9a3c', 0.35, 1, 120);

    }

    if (air >= BIGAIR_T) { bonus += 40; S.bigAirs++; UI.float(sx(S.x), fy(sy(S.y) - 70), t('ls.bigAir'), '#9fe8ff', 2); }

  }
  function moveCappy(dt, ctx) {
    if (S.landCd > 0) S.landCd -= dt;
    if (S.crash > 0) { S.crash -= dt; }
    if (S.sqT > 0) S.sqT -= dt;
    if (!S.air) {
      S.vx = clamp(S.vx + groundAccel(S.x, S.vx) * dt * (S.crash > 0 ? 0.3 : 1), 55, 215);

          let vy = S.vx * rs;

        }
      }

      }
      // mud splashes (just for fun)

  /* ---------- Kiki: rides the same slope, always pops, scores on every ramp ---------- */
  // Kiki's points per ramp (the jumps got bigger, so she keeps up: tuned with the bots in jungle-cup-c's balance test)
  const KIKI_BASE = 215, KIKI_EASY = 135, KIKI_MEGA = 140, KIKI_MEGA_E = 70, KIKI_RND = 70, KIKI_RND_E = 55, KIKI_BIG = 45, KIKI_BIG_E = 22;
  function moveKiki(dt, ctx) {

      }
      if (S.kNextLog < S.nL && S.kx + 26 > S.logs[S.kNextLog]) { S.kNextLog++; S.kvy = -HOP_V - 10; S.kair = true; S.kairT = 0; S.kTrickQ = 30; }
    } else {
      S.kairT += dt; S.kvy += gravAt(S.kvy) * dt; S.kx += S.kvx * dt; S.ky += S.kvy * dt;

    S.kScore += dt * (ctx.easy ? 3 : 5);
  }

  /* ---------- the bot (tests and balance): pops every ramp, fits tricks into the air it has ---------- */
  const BOT_ORDER = ['flip', 'spin', 'grab', 'spin'];
  function bot(ctx, dt) {
    if (S.botCd > 0) { S.botCd -= dt; return; }
    if (!S.air) {
      // decide once per ramp whether to pop (a sloppy rider forgets some)
      if (onRamp(S.x) && !S.pop && S.botRamp !== S.nextLip) { S.botRamp = S.nextLip; if (S.r() < 0.25 + S.skill * 0.75) jump(ctx); }
      else if (S.nextLog < S.nL && S.logs[S.nextLog] - S.x < S.vx * 0.2 && S.logs[S.nextLog] - S.x > 0) jump(ctx);

    }
    if (S.trick || S.queue) return;
    const left = landIn(S.x, S.y, S.vx, S.vy), want = BOT_ORDER[S.nTr % BOT_ORDER.length];

    else if (left > TRICKS.grab.dur * (ctx.easy ? 0.85 : 1) + margin && S.skill > 0.5) { trickInput(ctx, 'grab'); S.botCd = 0.05; }
    else if (S.skill < 0.6 && S.r() < 0.012) trickInput(ctx, 'spin');   // a sloppy rider sometimes starts one too late
  }

  /* ---------- update ---------- */
  function finishSlide(ctx) {
    if (S.over) return;
    S.over = true; S.endT = 0;
    const score = Math.round(S.score), kiki = Math.round(S.kScore);
    S.won = score > kiki;
    ctx.sfx(S.won ? 'cheer' : 'miss');
    UI.banner(t(S.won ? 'ls.youWin' : 'ls.kikiWins'), S.won ? '#8ee070' : '#ff6fb5', 1.2);
  }
  function update(dt, ctx) {
    S.ctx = ctx;
    JC.juice.tick(dt);
    if (S.flash > 0) S.flash -= dt;
    if (!S.over) {
      S.time += dt;
      if (S.auto) bot(ctx, dt);
      moveCappy(dt, ctx);
      moveKiki(dt, ctx);
      if (S.time >= TIME || S.x > LEN - 400) finishSlide(ctx);
    } else {
      S.endT += dt;
      // coast to a stop
      if (!S.air) { S.vx = Math.max(0, S.vx - 140 * dt); S.x += S.vx * dt; S.y = groundAt(S.x); } else { S.vy += GRAV * dt; S.x += S.vx * dt; S.y += S.vy * dt; if (S.y >= groundAt(S.x)) { S.air = false; S.trick = ''; S.y = groundAt(S.x); } }

        const stars = won ? 1 + (score >= kiki * 1.35 ? 1 : 0) + (score >= kiki * 1.8 ? 1 : 0) : 0;
        ctx.finish({ score, stars, won, frac: won ? [0.34, 0.67, 1][stars - 1] : Math.min(0.3, score / kiki * 0.3), stats: { kiki, crashes: S.crashes, bestCombo: S.bestCombo, tricks: S.tricksDone, perfects: S.perfects, bigAirs: S.bigAirs } });
      }

  }
  function camera(dt, ctx) {
    const W = ctx.W / S.K, H = ctx.H / S.K;
    // in the air the view opens up ahead and frames both Cappy and the spot he'll land on
    const flying = S.air && !S.over && S.airT > 0.08;
    S.camLead += ((flying ? 0.2 : 0.28) - S.camLead) * Math.min(1, dt * 3);
    S.camX = S.x - W * S.camLead;
    let wantY = Math.min(S.y, groundAt(S.x)) - H * 0.5 + 14;
    if (S.air) {

  const TOPGAP = 96, HUD_Y = 66;

  const sy = y => Math.round((y - S.camY) * S.K);

  /* ---------- input ---------- */
  function onInput(e, ctx) {
    if (S.over) return;
    if (e.type === 'press') {
      const k = e.key;
      if (k === 'a') { if (S.air) trickInput(ctx, 'spin'); else jump(ctx); }
      else if (k === 'up') { if (S.air) trickInput(ctx, 'flip'); else jump(ctx); }
      else if (S.air && (k === 'left' || k === 'right')) trickInput(ctx, 'spin');
      else if (S.air && k === 'down') trickInput(ctx, 'grab');
    } else if (e.type === 'down') {
      const id = UI.hitAt(e.x, e.y);
      if (id === 'ljump') jump(ctx);
      else if (id === 'lspin') trickInput(ctx, 'spin');
      else if (id === 'lflip') trickInput(ctx, 'flip');
      else if (id === 'lgrab') trickInput(ctx, 'grab');
      else if (!id && !S.air) jump(ctx);           // a touch anywhere jumps (in the air, wait for the tap or swipe)
    } else if (e.type === 'tap') {
      if (UI.hitAt(e.x, e.y)) return;

    } else if (e.type === 'swipe') {
      if (!S.air) { if (e.dir === 'up') jump(ctx); return; }

    }
  }

  /* ---------- drawing ---------- */
  function buildBg(ctx) {
    const W = ctx.W, H = ctx.H;
    S.bgGen = VIEW.gen; S.bgW = W; S.bgH = H;
    // far: sky and blue-green mountains (a 256-px tile that repeats), near: jungle trees (192-px tile)
    let c = JC.canvas2(256 + W, H), g = c.getContext('2d');
    for (let y = 0; y < H; y++) { const k = y / H; g.fillStyle = k < 0.25 ? '#7fd0ee' : k < 0.45 ? '#a8e2f0' : k < 0.6 ? '#cdeedd' : '#e6f4c8'; g.fillRect(0, y, 256 + W, 1); }
    for (let x = 0; x < 256 + W; x++) {
      const p = (x % 256) / 256 * Math.PI * 2, h = H * 0.3 + Math.sin(p) * 14 + Math.sin(p * 3 + 1) * 7 + Math.sin(p * 5) * 3;
      g.fillStyle = '#7fb8a8'; g.fillRect(x, Math.round(H - h - H * 0.25), 1, Math.round(h + H * 0.25));
      const h2 = H * 0.2 + Math.sin(p * 2 + 2) * 10 + Math.sin(p * 7) * 3;
      g.fillStyle = '#5f9a7a'; g.fillRect(x, Math.round(H - h2 - H * 0.12), 1, Math.round(h2 + H * 0.12));
    }
    // a waterfall far away
    for (let x = 0; x < 256 + W; x += 256) { rect(g, x + 170, Math.round(H * 0.42), 5, Math.round(H * 0.3), '#e8f8ff'); rect(g, x + 171, Math.round(H * 0.42), 1, Math.round(H * 0.3), '#b8e8f8'); }
    S.bgFar = c;
    c = JC.canvas2(192 + W, H); g = c.getContext('2d');
    for (let x = 0; x < 192 + W; x += 48) {

  /* ---------- the court on the screen ---------- */

  function layout(ctx) {

  /* ---------- balls ---------- */
  /** Send ball b from (x0, y0, h0) to bounce at (xb, yb), moving at v court units a second along the ground. */

  function liveCount() { let n = 0; for (const b of BALLS) if (b.live) n++; return n; }

  /** A ball is dead: the point goes to `who`. */

  function endRally(ctx) {

  }
  function gameWon() {
    const a = S.you, b = S.them, T = S.target;

    if (b >= T && b - a >= 2) return 'them';

  /** Fruit Frenzy comes once someone reaches 3 (two balls) and again at 6 (three; two with Easier champions). */
  function frenzyDue(ctx) {
    if (warm()) return 0;

    S.phase = 'serve'; S.phaseT = 0; S.speed = baseSpeed(ctx); S.ptYou = 0; S.ptThem = 0;

      S.tossAt[0] = 1.5; S.tossAt[1] = 3.0; S.tossWarn[0] = S.tossWarn[1] = 9;

  }
  function startStage(ctx, stage) {
    S.stage = stage; S.you = 0; S.them = 0; S.target = stage === 'warm' ? 3 : 7; S.serve = 'you'; S.serveN = 0;
    S.rally = 0; S.pounce = 0; S.pounceReady = false; S.phase = 'serve'; S.phaseT = 0; S.speed = baseSpeed(ctx);
    S.frenzy = 0; S.fzDone = 0; S.tossN = 0; S.ptYou = 0; S.ptThem = 0;

  /** Cappy's paddle: just in front of him, on his right. */

  /** Cappy swings. */

  /* ---------- the play-bot (test.auto and the balance check): it really moves and swings ---------- */
  function botThink(dt, ctx) {

  /* ---------- update ---------- */
  function readAxis(ctx) {

  function moveCappy(dt, ctx) {

  /** The test bot: aims at the most valuable fruit it can lead well, fires about once a second (sigma = aim error in px). */

    for (let i = 1; i < n; i++) { const k = i / n, lx = Math.round(x0 + (x1 - x0) * k), ly = Math.round(y0 + (y1 - y0) * k); rect(g, lx + (i % 2 ? 2 : -3), ly, 3, 2, i % 2 ? '#7cc84a' : '#3d9a2e'); }
    rect(g, x1 - 1, y1 - 1, 4, 3, '#2a7a30'); rect(g, x1, y1, 2, 1, '#b6e35d');
    spr(g, SPRITES.vc_clump, x0 - 9, y0 - 6);
  }
  function drawCappy(g, ctx) {
    const x = sxOf(S.x), y = syOf(S.y);
    if (S.state === 'stand' || S.state === 'top') {
      const walk = S.state === 'stand' && Math.abs(S.walkTo - S.x) > 0.5 && ((S.time * 8) | 0) % 2;
      const hop = S.state === 'top' ? Math.abs(Math.sin(S.time * 8)) * 6 : 0;
      const feet = y + 28;
      shadow(g, x, feet, 9);
      sprK(g, SPRITES[walk ? 'cappy_right_w' : 'cappy_right'], x - 16, feet - 30 - hop, 2, S.facing < 0);
      const hat = SAVE.data.cos.hat && SPRITES['hat_' + SAVE.data.cos.hat]; if (hat) sprK(g, hat, x - 14 + S.facing * 4, feet - 36 - hop, 2, S.facing < 0);
    } else {
      buildHang();
      const fr = S.state === 'leap' || S.state === 'fall' || ((S.time * 3) | 0) % 2 ? 'vc_hang2' : 'vc_hang';
      if (S.state === 'fall' && S.knock > 0) {
        // knocked off: tumbling head over heels on the way down
        const sp = SPRITES[fr];
        g.save(); g.translate(x, y + 20); g.rotate(BRBX.reduced() ? 0.6 : S.spin); g.drawImage(sp.c, -sp.w, -sp.h, sp.w * 2, sp.h * 2); g.restore();
      } else {
        sprK(g, SPRITES[fr], x - 19, y - 1, 2);
        const hat = SAVE.data.cos.hat && SPRITES['hat_' + SAVE.data.cos.hat]; if (hat) sprK(g, hat, x - 15, y + 8, 2);
      }
    }
    // knocked down: a ring of little stars and a "bonk" mark over Cappy's head
    if (S.knock > 0 && S.state !== 'fall') {
      const top = S.state === 'stand' ? y - 4 : y + 6;
      for (let i = 0; i < 5; i++) { const a = S.time * 7 + i * 1.257; spr(g, SPRITES.sparkle, x - 3 + Math.cos(a) * 12, top + Math.sin(a) * 3); }
      return;
    }
    if (S.daze > 0) for (let i = 0; i < 3; i++) { const a = S.time * 6 + i * 2.1; spr(g, SPRITES.sparkle, x - 2 + Math.cos(a) * 10, y + (S.state === 'stand' ? -4 : 6) + Math.sin(a) * 3); }
  }
  function panel(g, x, y, w, name, val, frac, col, right) {
    box(g, x, y, w, 26, 'rgba(27,19,37,0.82)', PAL.ink);
    text(g, name, right ? x + w - 4 : x + 4, y + 1, right ? T_R : T_L);
    T_VAL.col = col; T_VAL.align = right ? 'right' : 'left';
    const vw = text(g, val, right ? x + w - 4 : x + 4, y + 13, T_VAL);
    const bw = w - vw - 12; if (bw > 10) UI.bar(g, right ? x + 4 : x + vw + 8, y + 15, bw, 7, frac, col, 4);
  }
  function draw(g, ctx) {
    S.ctx = ctx; view(ctx);
    const W = S.vw, H = S.vh, k = S.k;
    if (S.bgGen !== VIEW.gen || S.bgK !== k || !S.bg) buildBg(ctx);
    g.setTransform(VIEW.S * k, 0, 0, VIEW.S * k, JC.juice.ox * VIEW.S * k, JC.juice.oy * VIEW.S * k);
    BASEY = Math.round(H * 0.55);
    // the far forest (parallax)
    const off = Math.round(Math.min(0, H - S.bgH + S.cam * 0.35));
    g.drawImage(S.bg, 0, off);
    // the trunk
    const tx = Math.round(W / 2 - TRUNK), floorY = syOf(0), topY = syOf(TOP_M * PXM);
    const k0 = Math.max(0, Math.floor((S.cam + BASEY - H) / 64)), k1 = Math.min(Math.floor(TOP_M * PXM / 64), Math.ceil((S.cam + BASEY) / 64));
    for (let i = k0; i <= k1; i++) g.drawImage(S.trunk, tx, syOf((i + 1) * 64));
    if (floorY < H + 60) g.drawImage(S.floor, 0, floorY - 8);
    // branch platforms with height signs
    for (let bi = 0; bi < 3; bi++) {
      const v = S.T[BR_LIST[bi]], y = syOf(v.h * PXM); if (y < -30 || y > H + 30) continue;
      const right = v.sx >= 0, bx = right ? Math.round(W / 2 - 10) : Math.round(W / 2 + 10 - 104);
      g.drawImage(right ? S.branch.c : S.branch.f, bx, y - 8);
      const sx = right ? Math.round(W / 2 + 10) : Math.round(W / 2 - 34);
      box(g, sx, y + 9, 24, 11, '#c48a4c', OUT); text(g, label('vc.sign' + bi, v.h), sx + 12, y + 8, SIGN);
    }
    // Sloane, hugging the trunk
    const sly = syOf(S.sloane * PXM) - 34;
    if (sly > -40 && sly < H + 4) sprK(g, SPRITES[((S.time * (S.over ? 6 : 1.6)) | 0) % 2 ? 'vc_sloane2' : 'vc_sloane1'], Math.round(W / 2 - 10), sly, 2);
    // vines (the next one glows, with a ring at its tip that turns green when you can grab it)
    const nI = S.cur + 1;
    for (let i = 1; i <= N; i++) {
      const v = S.T[i]; if (v.kind === 'branch') continue;
      const yy = syOf(v.ah); if (yy > H + 10 || yy + v.L + 20 < 0) continue;
      drawVine(g, v, i === nI && !S.over);
    }
    if (topY > -100) g.drawImage(S.canopy, 0, topY - 54);
    if (!S.over && S.T[nI] && S.T[nI].kind !== 'branch' && (S.state === 'hang' || S.state === 'stand')) {
      const v = S.T[nI], dx = Math.abs(nextX(S.time) - cappyX(S.time)), r = R(ctx) + (S.state === 'stand' ? 2 : 0);
      const col = S.daze > 0 ? '#9a94a8' : dx <= r ? '#6ad34a' : dx <= r * 2.4 ? '#ffd24a' : '#fff8e8';
      const x = sxOf(tipX(v, S.time)), y = syOf(tipY(v, S.time)), rr = dx <= r ? 7 + ((S.time * 10) | 0) % 2 : 6;
      g.globalAlpha = dx <= r ? 1 : 0.7;
      for (let a = 0; a < 16; a++) { const c = Math.cos(a * 0.3927), s = Math.sin(a * 0.3927); rect(g, x + c * rr, y + s * rr * 0.8, 2, 2, col); }
      g.globalAlpha = 1;
    }
    // coconut, Cappy, bee
    const co = S.coco;
    if (co.on) { const sh = co.shake > 0 && !BRBX.reduced() ? Math.round(Math.sin(S.time * 40) * 1.5) : 0; sprK(g, SPRITES.vc_coconut, sxOf(co.x) - 8 + sh, syOf(co.wy) - 8, 2); if (co.shake > 0) text(g, '!', sxOf(co.x), syOf(co.wy) - 22, WARN); }
    drawCappy(g, ctx);
    const b = S.bee;
    if (b.on) {
      if (b.warn > 0) { const ex = b.dir > 0 ? 6 : W - 14; if (((S.time * 8) | 0) % 2) { box(g, ex - 2, syOf(b.wy) - 8, 14, 14, PAL.r2, PAL.ink); text(g, '!', ex + 5, syOf(b.wy) - 7, WARN2); } }
      else sprK(g, SPRITES[((S.time * 12) | 0) % 2 ? 'vc_bee1' : 'vc_bee2'], sxOf(b.x) - 10, syOf(b.wy + Math.sin(b.t * 8) * 3) - 6, 2, b.dir < 0);
    }
    // HUD (screen size): the two climbers, the timer, the height meter, Sloane's marker when she is off screen, the hint
    drawHud(g, ctx, sly);
    g.setTransform(VIEW.S, 0, 0, VIEW.S, 0, 0);
  }
  /** Time left, top centre (like JC.hud.timer, but in the scene's scale). */
  function timerBox(g, W, secs, frac) {
    const w = 64, x = Math.round((W - w) / 2), y = 32;
    box(g, x, y, w, 20, 'rgba(27,19,37,0.82)', PAL.ink);
    T_TIME.col = secs < 10 ? PAL.r3 : PAL.white;
    text(g, label('hud.secs', Math.max(0, Math.ceil(secs))), x + w / 2, y + 1, T_TIME);
    UI.bar(g, x + 3, y + 13, w - 6, 5, frac, secs < 10 ? PAL.r2 : PAL.w3);
  }
  function drawHud(g, ctx, sly) {
    const W = S.vw, H = S.vh;
    const l = Math.ceil(HUD.left() / S.k), wAll = W - l - 6, w = Math.min(150, (wAll - 6) / 2) | 0;
    panel(g, l, 4, w, t('name.cappy'), label('vc.m', Math.floor(S.hm)), S.hm / TOP_M, '#45c34e', false);
    panel(g, W - 6 - w, 4, w, t('name.sloane'), label('vc.mB', Math.floor(S.sloane)), S.sloane / TOP_M, '#c9a37a', true);
    const tNow = S.over ? S.finishT : S.time;
    timerBox(g, W, TIME - tNow, 1 - tNow / TIME);
    const mx = W - 9, my0 = 62, my1 = H - 26;
    if (my1 - my0 > 60) {
      rect(g, mx - 2, my0, 5, my1 - my0, PAL.ink); rect(g, mx - 1, my0 + 1, 3, my1 - my0 - 2, '#5c3a22');
      for (let m = 0; m <= TOP_M; m += 15) rect(g, mx - 4, Math.round(my1 - (my1 - my0) * m / TOP_M), 9, 1, m === TOP_M ? PAL.gold2 : PAL.cream);
      const sy = Math.round(my1 - (my1 - my0) * S.sloane / TOP_M), cy = Math.round(my1 - (my1 - my0) * S.hm / TOP_M);
      disc(g, mx, sy, 3, PAL.ink); disc(g, mx, sy, 2, '#c9a37a');
      disc(g, mx, cy, 4, PAL.ink); disc(g, mx, cy, 3, '#45c34e'); rect(g, mx - 1, cy - 1, 1, 1, '#b6f5a0');
    }
    if (sly < 52 || sly > H - 4) {
      const up = sly < 52, yy = up ? 56 : H - 40, xx = W - 76;
      box(g, xx, yy, 58, 18, 'rgba(27,19,37,0.82)', PAL.ink); spr(g, SPRITES.sloane, xx + 1, yy + 1);
      text(g, up ? '↑' : '↓', xx + 20, yy + 3, ARROW); text(g, label('vc.mS', Math.floor(S.sloane)), xx + 27, yy + 3, ARROW);
    }
    if (S.hint > 0.05 && !S.over) {
      const hk = S.state === 'stand' && S.cur === 0 ? (ctx.touch ? 'vc.hintStartTouch' : 'vc.hintStartKeys') : (ctx.touch ? 'vc.hintTouch' : 'vc.hintKeys');
      g.globalAlpha = clamp(S.hint * 2, 0, 1); textBlock(g, t(hk), 6, H - 28, W - 30, HINT); g.globalAlpha = 1;
    }
  }

  /* ---------- sound ---------- */
  AUDIO.addSfx('buzz', (tt, b) => { const P = AUDIO.prims; P.tone(b, 'sawtooth', 210, tt, 0.35, 0.08, 230, 0.01, 0.1, 0.8); P.tone(b, 'square', 216, tt, 0.35, 0.05, 200, 0.01, 0.1, 0.8); });
  AUDIO.songs.vine = { bpm: 112, steps: 32, leadWave: 'triangle', harmWave: 'square', swing: 0.1,
    lead: 'A4 . C5 . E5 . A5 - G5 . E5 . D5 - E5 . C5 . E5 . G5 . C6 - B5 . G5 . A5 - - .',
    harm: '. . E4 . . . E4 . . . D4 . . . D4 . . . E4 . . . E4 . . . D4 . . . C4 .',
    bass: 'A2 . . A2 E3 . . . G2 . . G2 D3 . . . C3 . . C3 G3 . . . F2 . . F2 E2 . G2 .',
    drums: 'k.c.u.c.k.c.t.c.k.c.u.c.k.ct.u.c' };

  JC.register({
    id: 'vine',
    champion: 'sloane',
    music: 'vine',
    start(ctx) {
      S.ctx = ctx; view(ctx); build(ctx);
      S.cur = 0; S.state = 'stand'; S.x = -26; S.walkTo = -26; S.y = 28; S.hm = 0; S.maxM = 0; S.facing = 1; S.time = 0; S.daze = 0; S.knock = 0; S.knocks = 0; S.spin = 0; S.fallTo = -1; JC.juice.reset();
      S.sloane = 0; S.sloaneV = TOP_M / (ctx.easy ? 72 : 62); S.falls = 0; S.perfects = 0; S.grabs = 0; S.bonks = 0; S.over = false; S.won = false;
      S.cam = 40; S.waitMsg = 0; S.cheer = 0; S.auto = false; S.sigma = 0; S.eps = 0; S.hint = ctx.firstTime ? 1.6 : 0.7;
      S.coco.on = false; S.coco.next = ctx.easy ? 6 : 3; S.bee.on = false; S.bee.next = ctx.easy ? 5 : 2;
      const n = S.T[1]; n.p = Math.PI * 0.9;
    },
    update,
    draw,
    onInput(e, ctx) {
      if ((e.type === 'press' && (e.key === 'a' || e.key === 'up')) || e.type === 'down') tryGrab(ctx);
    },
    outro(dt, ctx) { S.time += dt; if (S.cheer > 0) S.cheer -= dt; if (S.state === 'leap' || S.state === 'fall') moveCappy(dt, ctx); },
    testState(ctx) {
      const n = S.T[S.cur + 1];
      return { state: S.state, cur: S.cur, metres: Math.round(S.hm * 10) / 10, best: S.maxM, sloane: Math.round(S.sloane * 10) / 10, time: Math.round(S.time * 100) / 100,
        dx: n ? Math.round((n.kind === 'branch' ? 0 : nextX(S.time) - cappyX(S.time)) * 10) / 10 : 0, next: n ? n.kind : '', r: R(ctx), daze: S.daze > 0,
        falls: S.falls, perfects: S.perfects, grabs: S.grabs, bonks: S.bonks, knocks: S.knocks, knocked: S.knock > 0, fallTo: S.fallTo, over: S.over, won: S.won, auto: S.auto, coconut: S.coco.on, bee: S.bee.on };
    },
    test: {
      auto(ctx, on, sigma) { S.auto = !!on; S.sigma = +sigma || 0; S.eps = 0; S.tapAt = -1; return S.auto; },
      /** Jump to target i (e.g. 19, just under the top). */
      to(ctx, i) { i = clamp(i | 0, 0, N - 1); const v = S.T[i]; if (isStand(v.kind)) { S.state = 'stand'; S.cur = i; S.x = v.sx; S.walkTo = v.sx; S.y = v.h * PXM + 28; } else { S.cur = i; ride(v, 0); S.state = 'hang'; S.x = tipX(v, S.time); S.y = tipY(v, S.time); } S.hm = v.h; S.maxM = Math.max(S.maxM, v.h); S.cam = S.y + 10; return S.cur; },
      sloane(ctx, m) { S.sloane = clamp(+m || 0, 0, TOP_M); return S.sloane; },
      hazards(ctx, on) { S.coco.next = on ? 0 : 999; S.bee.next = on ? 0 : 999; S.coco.on = false; S.bee.on = false; return !!on; },
      /** Drop a coconut right above Cappy, or send a bee straight at him (tests of the knockdown). */
      drop(ctx, kind) {
        if (kind === 'bee') { const b = S.bee; b.on = true; b.hit = false; b.warn = 0; b.t = 0; b.dir = 1; b.x = S.x - 3; b.wy = S.y - 16; return true; }
        const co = S.coco; co.on = true; co.hit = false; co.shake = 0; co.vy = -30; co.x = S.x; co.wy = S.y + 2; return true;
      },
    },
    cheat(won) { S.over = true; S.won = won; S.maxM = won ? TOP_M : 27; return { score: won ? 1300 : 270, stars: won ? 2 : 0, won, frac: won ? 0.67 : 0.14 }; },
  });
})();

/* ---- boot.js ---- */
/* ---- start: build the island, load the save, show the title ---- */
SAVE.load();
JC.refreshCappy();
buildCappy('coco', '#ffd23f', { b: '#c08048', l: '#e0a868', s: '#8a5530' }, { noPack: true });
buildCappy('pip', '#3fb7ff', { b: '#9a6438', l: '#c48a52', s: '#6e4424' }, { noPack: true });
WORLD.build();
JC.buildNpcs();
JC.start();
JC.go('title', {}, true);
// a sheet of every sprite, for looking at the art (window.__brbTest.jc.sheet(true))
const _draw = TITLE.draw;
TITLE.draw = function (g) {
  if (!JC.sheet) return _draw(g);
  g.fillStyle = '#6a8a6a'; g.fillRect(0, 0, VIEW.W, VIEW.H);
  let x = 4, y = 4, rowH = 0; const k = 2;
  for (const name in SPRITES) { const s = SPRITES[name]; if (x + s.w * k > VIEW.W - 4) { x = 4; y += rowH + 4; rowH = 0; } sprK(g, s, x, y, k); x += s.w * k + 4; rowH = Math.max(rowH, s.h * k); }
};

})();
</script>
