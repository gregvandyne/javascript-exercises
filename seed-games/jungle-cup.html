  "vs.jada": "gegen Jada, die Jaguarin", "vs.sloane": "gegen Sloane, das Faultier", "vs.tico": "gegen Tico, den Tukan", "vs.otters": "gegen die Otter-Zwillinge",

  "name.ants": "Familie Snip", "name.elder": "Ältester Shellby", "name.otters": "Otter-Zwillinge", "name.marm": "Krallenäffchen",
  "story.1": "Cappy, das Wasserschwein, trieb auf einem kleinen Floß den Fluss hinunter, bis zur Delta-Insel.",
  "story.2": "Jedes Jahr veranstaltet die Insel den Dschungel-Pokal. Sieben Champions. Sieben Sportarten. Kann Cappy alle gewinnen?",
  "story.3": "Rums! Das Floß erreichte den Steg, und Cousine Coco und Cousin Pip winkten schon.",
  "d.coco.hi": "Cousin Cappy! Du bist da! Willkommen auf der Delta-Insel!",
  "d.coco.again": "Der Pokal-Totem steht mitten im Dorf. Jede Feder, die du gewinnst, lässt ihn leuchten!",
  "d.pip.hi0": "Mango, der Papagei, wartet oben am Holzsteg auf dich. Sag hallo!",
  "d.pip.hi": "Hallo Cappy! Ich liebe den Strand hier.",
  "d.pip.qask": "Ich habe drei hübsche Muscheln an den Stränden verloren. Findest du sie? Sie glitzern!",
  "d.pip.qwait": "Nur noch {n} Muscheln! Schau an den Sandufern.",
  "d.pip.qthanks": "Alle drei! Danke! Hier, nimm mein Abendrot-Halstuch. Es steht dir bestimmt super.",
  "d.pip.after": "Das Abendrot-Halstuch steht dir, Cousin!",
  "d.mango.intro1": "Krah! Du musst Cappy sein! Ich bin Mango, die Inselführerin.",
  "d.mango.intro2": "Auf der Delta-Insel leben sieben Champions, und jeder hütet eine Sportart.",
  "d.mango.intro3": "Besiege einen Champion und du gewinnst seine Feder. Jede Feder hat eine andere Farbe!",
  "d.mango.intro4": "Bring deine Federn zum Pokal-Totem im Mooswald-Dorf. Füll alle sieben Fassungen...",
  "d.mango.intro5": "...dann öffnet sich der Lianenaufzug am Großen Kapokbaum. Oben wartet der Dschungel-Pokal! Versuch es zuerst bei Jada am Baumkronen-Platz. Geh westlich vom Dorf!",
  "d.mango.hint0": "Jada spielt Schläger-Schmetter am Baumkronen-Platz, westlich vom Dorf. Such den orangen Bogen!",
  "d.mango.hint1": "Schon eine Feder! Überall auf der Insel gibt es Blumenbögen. Öffne die Karte, um sie zu finden.",
  "d.mango.hint2": "Prima! Geh über die Trittsteine im Fluss zur Ostinsel.",
  "d.mango.hint3": "Der Pokal-Totem füllt sich! Weiter so, Champ!",
  "d.mango.qask1": "Krah... Ich habe SO einen Hunger. Die besten Mangos wachsen am Fuß der Hügel.",
  "d.mango.qask2": "Bringst du mir eine? Dann schenke ich dir etwas Schönes!",
  "d.mango.qwait": "Der Mangobaum steht bei den Hügeln, im Nordwesten. Mmm, Mango...",
  "d.mango.qthanks": "MANGO! Meine Lieblingsfrucht! Hier, ein Forscherhut für einen echten Forscher.",
  "d.mango.allf": "Alle sieben Federn! Der Lianenaufzug am Großen Kapokbaum ist offen. Los, los, los!",
  "d.mango.after": "Dschungel-Pokal-Champion! Du kannst jede Sportart weiterspielen, um deine Rekorde zu schlagen.",
  "d.mango.free": "Freies Spiel! Alle Sportarten sind offen, und das goldene Halstuch gehört dir. Hol dir überall drei Sterne!",
  "d.tapir.hello": "Hallo, ich bin Tapo. An meinem Stand gibt es nichts zu kaufen, nur Tipps. Tipps sind gratis!",
  "d.tapir.tip1": "Tipp: Bei Schläger-Schmetter schlag früh für einen kurzen Ball und spät für einen langen.",
  "d.tapir.tip2": "Tipp: Ein perfekter Schlag füllt deine Sprung-Leiste. Eine volle Leiste gibt einen Superschlag!",
  "d.tapir.tip3": "Tipp: Wenn ein Champion zu schwer ist, schalte in den Einstellungen Leichtere Champions ein.",
  "d.tapir.tip4": "Tipp: Die Karte zeigt jeden Bogen. Tippe auf der Karte auf eine Sportart, um direkt hinzugehen.",
  "d.tapir.tip5": "Tipp: Drei Sterne in einer Sportart heißt, du kannst sie richtig gut. Beim ersten Mal bekommst du ein Beeren-Halstuch!",
  "d.tapir.tip6": "Tipp: Die Leute auf der Insel brauchen Hilfe. Wenn du hilfst, bekommst du neue Stile!",
  "d.tapir.tip7": "Tipp: Verlieren ist nicht schlimm. Jeder Versuch bringt deinen Pfoten etwas Neues bei.",
  "d.tapir.tip8": "Tipp: Der Älteste Shellby beim Totem kennt die Geschichte des Dschungel-Pokals.",
  "d.tapir.letter": "Ein Brief für mich? Von Zuzu? Wie schön. Danke fürs Bringen!",
  "d.ants.qask1": "Hilfe! Der Wind hat unser größtes Blatt weggeweht! Es war unser Dach!",
  "d.ants.qask2": "Wir haben gesehen, wie es über den Fluss zur Ostinsel flog. Holst du es zurück?",
  "d.ants.qwait": "Unser Blatt ist auf der Ostinsel. Geh über die Trittsteine im Fluss!",
  "d.ants.qthanks": "Unser Dach! Danke, großer Freund. Hier ist ein himmelblaues Halstuch, selbst gewebt!",
  "d.ants.after": "Schnipp, schnipp! Jetzt bauen wir ein größeres Dach.",
  "d.elder.totem1": "Ah, junger Freund. Das ist der Pokal-Totem. Er steht hier schon länger als mein Panzer.",
  "d.elder.totem2": "Er hat sieben Fassungen. Jede wartet auf die Feder eines Champions.",
  "d.elder.totem3": "Wenn alle sieben leuchten, erwacht der Lianenaufzug. Dann wartet auf der Baumkronen-Bühne der Dschungel-Pokal.",
  "d.elder.qask1": "Hmm, wo habe ich nur meine Brille hingelegt? Ich habe an der Lagune ein Nickerchen gemacht...",
  "d.elder.qask2": "Suchst du sie für mich, junger Freund? Am Sand, südlich der Lagune.",
  "d.elder.qwait": "Meine Brille müsste im Sand bei der Lagune liegen. Alles ist so verschwommen!",
  "d.elder.qthanks": "Meine Brille! Jetzt sehe ich dich! Nimm diesen Strohhut. Er schützt vor der Sonne.",
  "d.elder.count": "Der Totem hat {n} von 7 Federn. Geduld und Übung.",
  "d.elder.allf": "Alle sieben Federn leuchten! In all meinen Jahren habe ich das selten gesehen. Geh hinauf, Champion.",
  "d.zuzu.qask1": "Bzzz! Ich bin Zuzu, die schnellste Botin der Insel!",
  "d.zuzu.qask2": "Aber meine Flügel sind müde. Bringst du diesen Brief zu Tapo an seinen Stand im Dorf?",
  "d.zuzu.qwait": "Tapos Stand hat ein blau-weißes Dach, im Mooswald-Dorf. Bzzz!",
  "d.zuzu.thanks": "Bzzz! Du hast ihn zugestellt! Hier, eine Blattflagge für dein Floß. Sie flattert schön!",
  "d.zuzu.after": "Bzzz! Ich habe gehört, Jada ist super schnell am Schläger!",
  "d.zuzu.liftopen": "Bzzz! GROSSE NEUIGKEIT! Alle sieben Federn! Der Lianenaufzug am Großen Kapokbaum ist offen!",
  "d.marm.hi": "Iek iek! Wir sind Jadas kleine Helfer. Wir lieben schnelle Ballwechsel!",
  "d.jada.pre": "Bereit für Schläger-Schmetter? Achte auf den Ball, schlag im richtigen Moment und spring!",
  "d.jada.won": "Du hast mich fair besiegt. Revanche jederzeit!",
  "d.jada.soon": "Der Tisch wird noch aufgebaut. Komm bald wieder!",
  "d.sloane.pre": "Hallo... ich... klettere... langsam... aber... ich... höre... nie... auf.",
  "d.sloane.won": "Du... bist... so... schnell... geklettert. Gut... gemacht.",
  "d.sloane.soon": "Die... Lianen... sind... noch... nicht... bereit.",
  "d.tico.pre": "Samen-Schuss! Triff das schwimmende Obst vor mir. Viel Glück!",
  "d.tico.won": "Super gezielt! Die Feder gehört dir.",
  "d.tico.soon": "Die Ziele auf der Lagune treiben noch an ihren Platz. Komm bald wieder!",
  "d.otters.pre": "Fahr mit uns ein Rennen durch die Stromschnellen! Platsch, platsch!",
  "d.otters.won": "Du warst schneller als wir beide!",
  "d.otters.soon": "Wir wachsen noch unsere Kanus. Komm bald wieder!",
  "d.rana.pre": "Kommst du bei meinem Trommeln mit? Hör zu und spiel es dann nach!",
  "d.rana.won": "Was für ein Rhythmus! Du hast den Takt des Dschungels.",
  "d.rana.soon": "Meine Trommeln trocknen noch in der Sonne. Komm bald wieder!",
  "d.mico.pre": "HUUU! Elfmeter! Kriegst du einen an mir vorbei?",
  "d.mico.won": "HUUU! Was für ein Torjäger! Du gewinnst!",
  "d.mico.soon": "HUUU! Das Spielfeld wird noch markiert. Komm bald wieder!",
  "d.kiki.pre": "Blatt-Rutsche! Spring über die Rampen, mach Tricks und lande gerade!",
  "d.kiki.won": "Diese Tricks waren unglaublich!",
  "d.kiki.soon": "Der Matschhang ist noch zu trocken. Komm nach dem Regen wieder!",
  "d.jada.ready": "Gutes Aufwärmen! Jetzt bin ich dran. Wer zuerst 7 hat. Zeig mir deinen Sprung!",
  "end.1": "Der Lianenaufzug trug Cappy hinauf, hinauf, hinauf, durch die Blätter bis zur Baumkronen-Bühne.",
  "end.2": "Alle sieben Champions warteten schon. „Den hast du dir verdient, Cappy!“",
  "end.3": "Das ist der Dschungel-Pokal, aus goldenen Blättern geflochten. Er gehört dem Champion der Delta-Insel.",
  "end.4": "Heb ihn hoch, Cappy! Krah!",
  "end.cup": "Dschungel-Pokal-Champion!",
  "end.5": "Danke an alle! Nächstes Jahr wieder?",

  "rap.ripple": "Рябь", "rap.splash": "Плюх",
  "story.1": "Капибара Каппи плыл по реке на маленьком плоту до самого острова Дельта.",
  "story.2": "Каждый год на острове проходит Кубок Джунглей. Семь чемпионов. Семь видов спорта. Сможет ли Каппи победить всех?",
  "story.3": "Бум! Плот причалил к пристани, а двоюродные брат и сестра Коко и Пип уже махали ему.",
  "d.coco.hi": "Братец Каппи! Ты приплыл! Добро пожаловать на остров Дельта!",
  "d.coco.again": "Тотем Кубка стоит в центре деревни. Каждое Перо, которое ты выиграешь, зажигает его!",
  "d.pip.hi0": "Попугай Манго ждёт тебя дальше по мосткам. Иди поздоровайся!",
  "d.pip.hi": "Привет, Каппи! Я обожаю здешний пляж.",
  "d.pip.qask": "Я потерял на пляжах три красивые ракушки. Найдёшь их? Они блестят!",
  "d.pip.qwait": "Осталось найти ракушек: {n}! Посмотри на песчаных берегах.",
  "d.pip.qthanks": "Все три! Спасибо! Вот, возьми мою закатную бандану. Тебе очень пойдёт.",
  "d.pip.after": "Закатная бандана тебе к лицу, братец!",
  "d.mango.intro1": "Кра! Ты, должно быть, Каппи! Я Манго, проводница по острову.",
  "d.mango.intro2": "На острове Дельта живут семь чемпионов, и каждый хранит свой вид спорта.",
  "d.mango.intro3": "Победи чемпиона и получи его Перо. Все Перья разного цвета!",
  "d.mango.intro4": "Неси Перья к Тотему Кубка в Моховой деревне. Заполни все семь гнёзд...",
  "d.mango.intro5": "...и откроется лифт из лиан у Великого капока. Наверху ждёт Кубок Джунглей! Сначала сыграй с Джадой на корте под кронами. Иди на запад от деревни!",
  "d.mango.hint0": "Джада играет в Ракеточный удар на корте под кронами, к западу от деревни. Ищи оранжевую арку!",
  "d.mango.hint1": "Уже одно Перо! Арки из цветов есть по всему острову. Открой карту, чтобы их найти.",
  "d.mango.hint2": "Отлично! Перейди реку по камням, чтобы попасть на восточный островок.",
  "d.mango.hint3": "Тотем Кубка заполняется! Так держать, чемпион!",
  "d.mango.qask1": "Кра... Я ТАК голодна. Самые вкусные манго растут у подножия холмов.",
  "d.mango.qask2": "Принесёшь мне одно? Я подарю тебе что-то хорошее!",
  "d.mango.qwait": "Манговое дерево у холмов, на северо-западе. Ммм, манго...",
  "d.mango.qthanks": "МАНГО! Моё любимое! Вот шляпа исследователя для настоящего исследователя.",
  "d.mango.allf": "Все семь Перьев! Лифт из лиан у Великого капока открыт. Вперёд, вперёд!",
  "d.mango.after": "Чемпион Кубка Джунглей! Ты можешь играть в любой вид спорта и бить свои рекорды.",
  "d.mango.free": "Свободная игра! Все виды спорта открыты, а золотая бандана теперь твоя. Попробуй везде получить три звезды!",
  "d.tapir.hello": "Привет, я Тапо. В моей лавке ничего не продаётся, только советы. Советы бесплатно!",
  "d.tapir.tip1": "Совет: в Ракеточном ударе бей раньше, чтобы мяч летел коротко, и позже, чтобы далеко.",
  "d.tapir.tip2": "Совет: идеальный удар заполняет шкалу Прыжка. Полная шкала даёт суперудар!",
  "d.tapir.tip3": "Совет: если чемпион слишком сильный, включи «Чемпионы полегче» в Настройках.",
  "d.tapir.tip4": "Совет: на карте видны все арки. Нажми на вид спорта на карте, чтобы сразу туда попасть.",
  "d.tapir.tip5": "Совет: три звезды в виде спорта значат, что ты его по-настоящему освоил. В первый раз получишь ягодную бандану!",
  "d.tapir.tip6": "Совет: жителям острова нужна помощь. Помогай им и получай новые стили!",
  "d.tapir.tip7": "Совет: проигрывать не страшно. Каждая попытка учит твои лапки чему-то новому.",
  "d.tapir.tip8": "Совет: Старейшина Шеллби у тотема знает историю Кубка Джунглей.",
  "d.tapir.letter": "Письмо мне? От Зузу? Как приятно. Спасибо, что принёс!",
  "d.ants.qask1": "Помогите! Ветер унёс наш самый большой лист! Это была наша крыша!",
  "d.ants.qask2": "Мы видели, как он улетел за реку, на восточный островок. Принесёшь его?",
  "d.ants.qwait": "Наш лист на восточном островке. Перейди реку по камням!",
  "d.ants.qthanks": "Наша крыша! Спасибо, большой друг. Вот небесно-голубая бандана, мы сами её сплели!",
  "d.ants.after": "Чик-чик! Теперь мы строим крышу побольше.",
  "d.elder.totem1": "А, юный друг. Это Тотем Кубка. Он стоит здесь дольше, чем мой панцирь.",
  "d.elder.totem2": "В нём семь гнёзд. Каждое ждёт Перо чемпиона.",
  "d.elder.totem3": "Когда засветятся все семь, лифт из лиан проснётся. И тогда на Сцене в кронах будет ждать Кубок Джунглей.",
  "d.elder.qask1": "Хм, куда же я дел очки? Я дремал у лагуны...",
  "d.elder.qask2": "Поищешь их, юный друг? На песке, к югу от лагуны.",
  "d.elder.qwait": "Мои очки должны быть на песке у лагуны. Всё так расплывается!",
  "d.elder.qthanks": "Мои очки! Теперь я тебя вижу! Возьми эту соломенную шляпу. Она защищает от солнца.",
  "d.elder.count": "В тотеме {n} из 7 Перьев. Терпение и тренировки.",
  "d.elder.allf": "Все семь Перьев сияют! За все мои годы я редко такое видел. Поднимайся, чемпион.",
  "d.zuzu.qask1": "Жжж! Я Зузу, самая быстрая почтальонша острова!",
  "d.zuzu.qask2": "Но мои крылышки устали. Отнесёшь это письмо Тапо в его лавку в деревне?",
  "d.zuzu.qwait": "У лавки Тапо сине-белая крыша, в Моховой деревне. Жжж!",
  "d.zuzu.thanks": "Жжж! Ты доставил его! Вот флаг-листок для твоего плота. Он красиво развевается!",
  "d.zuzu.after": "Жжж! Говорят, Джада очень быстро играет ракеткой!",
  "d.zuzu.liftopen": "Жжж! БОЛЬШАЯ НОВОСТЬ! Все семь Перьев! Лифт из лиан у Великого капока открыт!",
  "d.marm.hi": "Иии-иии! Мы маленькие помощники Джады. Мы обожаем быстрые розыгрыши!",
  "d.jada.pre": "Готов к Ракеточному удару? Следи за мячом, бей вовремя и прыгай!",
  "d.jada.won": "Ты честно меня победил. Реванш в любое время!",
  "d.jada.soon": "Стол ещё устанавливают. Приходи скоро!",
  "d.sloane.pre": "Привет... я... лезу... медленно... но... никогда... не... останавливаюсь.",
  "d.sloane.won": "Ты... залез... так... быстро. Молодец.",
  "d.sloane.soon": "Лианы... ещё... не... готовы.",
  "d.tico.pre": "Стрельба семечками! Попади во фрукты на воде раньше меня. Удачи!",
  "d.tico.won": "Вот это меткость! Перо твоё.",
  "d.tico.soon": "Мишени на лагуне ещё подплывают на места. Приходи скоро!",
  "d.otters.pre": "Наперегонки с нами по порогам! Плюх, плюх!",
  "d.otters.won": "Ты был быстрее нас обеих!",
  "d.otters.soon": "Мы ещё натираем каноэ воском. Приходи скоро!",
  "d.rana.pre": "Успеешь за моими барабанами? Послушай, а потом сыграй сам!",
  "d.rana.won": "Какой ритм! В тебе бьётся сердце джунглей.",
  "d.rana.soon": "Мои барабаны ещё сохнут на солнце. Приходи скоро!",
  "d.mico.pre": "УУУ! Пенальти! Сможешь мне забить?",
  "d.mico.won": "УУУ! Вот это бомбардир! Ты победил!",
  "d.mico.soon": "УУУ! Поле ещё размечают. Приходи скоро!",
  "d.kiki.pre": "Спуск на листе! Прыгай с трамплинов, делай трюки и приземляйся ровно!",
  "d.kiki.won": "Трюки были потрясающие!",
  "d.kiki.soon": "Грязевой склон ещё слишком сухой. Приходи после дождя!",
  "d.jada.ready": "Хорошая разминка! Теперь моя очередь. До 7 очков. Покажи свой прыжок!",
  "end.1": "Лифт из лиан поднял Каппи вверх, вверх, вверх сквозь листья на Сцену в кронах.",
  "end.2": "Все семь чемпионов ждали его. «Ты это заслужил, Каппи!»",
  "end.3": "Это Кубок Джунглей, сплетённый из золотых листьев. Он принадлежит чемпиону острова Дельта.",
  "end.4": "Подними его высоко, Каппи! Кра!",
  "end.cup": "Чемпион Кубка Джунглей!",
  "end.5": "Спасибо всем! Увидимся в следующем году?",
  "credits.1": "Кубок Джунглей",
  "credits.2": "В главной роли капибара Каппи",
  "credits.3": "а также Джада, Слоан, Тико, Близняшки-выдры, Рана, Мико и Кики",
  "credits.4": "и Манго, Коко, Пип, Тапо, семья Снип, Старейшина Шеллби и Зузу",
  "credits.5": "Сделано командой Oomba Academy",
  "credits.6": "Пиксели, музыка и звуки созданы кодом",
  "credits.7": "Спасибо за игру!",
  "credits.8": "Все виды спорта остаются открытыми. Получишь три звезды во всех семи?",
  "sport.frog.goal": "Рана играет ритм на трёх барабанах из листьев. Послушай и повтори его в такт! Набери больше очков, чем Рана, до конца песни.",
  "sport.frog.touch": "Касание: нажимай низкий (синий, 1 точка), средний (зелёный, 2 точки) и высокий (розовый, 3 точки) барабаны.",

  "frog.hintKeys": "Смотри на верхнюю полоску: когда кружки загорятся, жми те же барабаны в такт.",
  "sport.kick.goal": "Серия пенальти! По пять ударов, потом до первого промаха. Забей больше голов, чем Мико, чтобы победить.",
  "sport.kick.touch": "Касание: проведи к воротам и отпусти, чтобы ударить (чем длиннее, тем сильнее). Когда ты на воротах, нажми на сторону, чтобы прыгнуть.",
  "sport.kick.keys": "Клавиши: Влево / Вправо — целиться, Пробел — сила, Пробел ещё раз — удар. На воротах: Влево / Вправо — прыжок, Вниз — стоять.",

  "bk.diveL": "Прыжок", "bk.stay": "Стоять", "bk.diveR": "Прыжок",
  "bk.hintShootTouch": "Проведи от мяча к воротам и отпусти. Зелёная сила надёжная, красная улетает выше ворот.",
  "bk.hintShootKeys": "Влево / Вправо — целься в угол, потом Пробел для силы.",
  "bk.hintPowerKeys": "Нажми Пробел ещё раз, чтобы ударить! Зелёный надёжный, красный — выше ворот.",
  "bk.hintKeepTouch": "Смотри на глаза и хвост Мико: они показывают, куда он ударит. Нажми на эту сторону, чтобы прыгнуть!",
  "bk.hintKeepKeys": "Смотри на глаза и хвост Мико: они показывают, куда он ударит. Влево / Вправо — прыжок, Вниз — стоять.",
  "sport.leaf.goal": "Катись по грязи на огромном листе 90 секунд. Прыгай с трамплинов, делай трюки в воздухе и приземляйся ровно. Побей счёт Кики!",

//   { type: 'press' | 'release', key: 'left'|'right'|'up'|'down'|'a'|'b'|'pause', device }   (keys, pad, on-screen pad)
//   { type: 'down' | 'move' | 'up', id, x, y, sx, sy (where it started), dx, dy, device: 'touch' }  (virtual pixels)
//   { type: 'tap', x, y }   a short touch or click that did not move
//   { type: 'swipe', dir: 'left'|'right'|'up'|'down', x, y, dx, dy, speed }   a quick flick (>= 18 CSS px)
// Held state: JC.input.held.left ... .a .b (keys, gamepad and the on-screen D-pad together), JC.input.dirX()/dirY().
// Keys: arrows / WASD move, Space / Enter / Z = A (action), Esc / Backspace / X = B (back), P = pause.
// Gamepad: left stick or d-pad, button 0 = A, 1 = B, 9 (start) = pause.
// ======================================================================================================
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  Space: 'a', Enter: 'a', NumpadEnter: 'a', KeyZ: 'a', Escape: 'b', Backspace: 'b', KeyX: 'b', KeyP: 'pause' };
const INPUT = {
  held: { left: false, right: false, up: false, down: false, a: false, b: false, pause: false },
  keys: { left: false, right: false, up: false, down: false, a: false, b: false, pause: false },
  padHeld: { left: false, right: false, up: false, down: false, a: false, b: false, pause: false },
  touchHeld: { left: false, right: false, up: false, down: false, a: false, b: false, pause: false },
  device: 'touch', hasTouch: false, pointers: new Map(), listeners: [], gamepads: false, lastAny: 0,
};
JC.input = INPUT;
try { INPUT.hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0; } catch (e) { /* ignore */ }
INPUT.device = INPUT.hasTouch ? 'touch' : 'keys';
INPUT.dirX = () => (INPUT.held.right ? 1 : 0) - (INPUT.held.left ? 1 : 0);
INPUT.dirY = () => (INPUT.held.down ? 1 : 0) - (INPUT.held.up ? 1 : 0);
INPUT.showTouch = () => INPUT.device === 'touch';
function emit(e) {
  INPUT.lastAny = performance.now();
  AUDIO.unlock();
  if (JC.onInput) JC.onInput(e);
}
JC.emit = emit;
function refreshHeld() {
  const h = INPUT.held;

}
/** On-screen buttons call this to hold or let go of a key (the D-pad, the A button). */
INPUT.touchKey = function (key, on) {
  if (INPUT.touchHeld[key] === on) return;
  INPUT.touchHeld[key] = on; refreshHeld();
  emit({ type: on ? 'press' : 'release', key, device: 'touch' });
};
INPUT.releaseTouch = function () { for (const k in INPUT.touchHeld) if (INPUT.touchHeld[k]) INPUT.touchKey(k, false); };
window.addEventListener('keydown', ev => {
  const k = KEYMAP[ev.code] || (ev.key === ' ' ? 'a' : null);
  if (!k) return;
  ev.preventDefault();
  INPUT.device = 'keys';
  if (INPUT.keys[k] && ev.repeat) return;
  INPUT.keys[k] = true; refreshHeld();
  emit({ type: 'press', key: k, device: 'keys' });
});
window.addEventListener('keyup', ev => {
  const k = KEYMAP[ev.code] || (ev.key === ' ' ? 'a' : null);
  if (!k) return;
  ev.preventDefault();
  INPUT.keys[k] = false; refreshHeld();
  emit({ type: 'release', key: k, device: 'keys' });
});
window.addEventListener('blur', () => { for (const k in INPUT.keys) INPUT.keys[k] = false; INPUT.releaseTouch(); refreshHeld(); });

function ptr(ev) { const r = CV.getBoundingClientRect(); return toVirtual(ev.clientX - r.left, ev.clientY - r.top, PT); }
CV.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  try { CV.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
  try { CV.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  INPUT.device = ev.pointerType === 'mouse' ? 'keys' : 'touch';
  const p = ptr(ev);
  const rec = { id: ev.pointerId, x: p.x, y: p.y, sx: p.x, sy: p.y, t0: performance.now(), moved: false, cssX: ev.clientX, cssY: ev.clientY };
  INPUT.pointers.set(ev.pointerId, rec);
  emit({ type: 'down', id: rec.id, x: p.x, y: p.y, sx: p.x, sy: p.y, dx: 0, dy: 0, device: ev.pointerType === 'mouse' ? 'mouse' : 'touch' });
});
CV.addEventListener('pointermove', ev => {
  const rec = INPUT.pointers.get(ev.pointerId); if (!rec) return;
  const p = ptr(ev); rec.x = p.x; rec.y = p.y;
  if (Math.abs(ev.clientX - rec.cssX) + Math.abs(ev.clientY - rec.cssY) > 8) rec.moved = true;
  emit({ type: 'move', id: rec.id, x: p.x, y: p.y, sx: rec.sx, sy: rec.sy, dx: p.x - rec.sx, dy: p.y - rec.sy, device: 'touch' });
});
function pointerEnd(ev) {
  const rec = INPUT.pointers.get(ev.pointerId); if (!rec) return;
  INPUT.pointers.delete(ev.pointerId);
  const p = ptr(ev), dt = performance.now() - rec.t0, dxc = ev.clientX - rec.cssX, dyc = ev.clientY - rec.cssY, dist = Math.hypot(dxc, dyc);
  emit({ type: 'up', id: rec.id, x: p.x, y: p.y, sx: rec.sx, sy: rec.sy, dx: p.x - rec.sx, dy: p.y - rec.sy, device: 'touch', cancel: ev.type === 'pointercancel' });
  if (ev.type === 'pointercancel') return;
  if (dist >= 18 && dt < 450) {
    const dir = Math.abs(dxc) > Math.abs(dyc) ? (dxc > 0 ? 'right' : 'left') : (dyc > 0 ? 'down' : 'up');
    emit({ type: 'swipe', dir, x: p.x, y: p.y, sx: rec.sx, sy: rec.sy, dx: p.x - rec.sx, dy: p.y - rec.sy, speed: dist / Math.max(16, dt) });
  } else if (dist < 12 && dt < 600) emit({ type: 'tap', x: p.x, y: p.y });

CV.addEventListener('pointerup', pointerEnd);
CV.addEventListener('pointercancel', pointerEnd);
CV.addEventListener('contextmenu', ev => ev.preventDefault());

const PADKEYS = ['left', 'right', 'up', 'down', 'a', 'b', 'pause'];
const PADNOW = { left: false, right: false, up: false, down: false, a: false, b: false, pause: false };
/** Poll the first gamepad (only once one has connected). */
INPUT.poll = function () {
  if (!INPUT.gamepads || !navigator.getGamepads) return;
  let gp = null; const list = navigator.getGamepads();
  for (let i = 0; i < list.length; i++) if (list[i] && list[i].connected) { gp = list[i]; break; }
  if (!gp) return;
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0, b = gp.buttons, on = i => !!(b[i] && b[i].pressed);
  PADNOW.left = ax < -0.5 || on(14); PADNOW.right = ax > 0.5 || on(15); PADNOW.up = ay < -0.5 || on(12); PADNOW.down = ay > 0.5 || on(13);
  PADNOW.a = on(0); PADNOW.b = on(1); PADNOW.pause = on(9);
  for (let i = 0; i < PADKEYS.length; i++) {
    const k = PADKEYS[i];
    if (PADNOW[k] !== INPUT.padHeld[k]) { INPUT.padHeld[k] = PADNOW[k]; refreshHeld(); INPUT.device = 'pad'; emit({ type: PADNOW[k] ? 'press' : 'release', key: k, device: 'pad' }); }
  }
};

/* ---- core/07-textbox.js ---- */
// ======================================================================================================
// TEXT BOX: the typewriter dialogue at the bottom of the screen.
//   JC.say([{ who: 'mango', key: 'd.mango.hi' }, ...], onDone)   who: a speaker id (portrait + name), key: an I18N key
// Tap / A: finishes the line being typed, then goes on to the next. B skips nothing (kids read at their own pace).
// With AI voices on for the player's language (BRB.aiVoice) and sound on, each line is also read aloud.
// ======================================================================================================

  jada: 'jada', sloane: 'sloane', tico: 'tico', otters: 'otter', rana: 'rana', mico: 'mico', kiki: 'kiki', marm: 'marmoset', sign: '', lift: '' };

JC.textbox = TB;

TB.advance = function () {

function glyphMask(str) {

    const rows = GLYPHS[ch], w = GW[ch];

    cols.push(0);

}
function buildLogo() {
  const maxW = Math.min(VIEW.W - 16, 330);

  const k = Math.max(3, Math.min(7, Math.floor(maxW / (top.length + 2))));
  const W = (top.length + 2) * k + 6, H = (7 * 2 + 4) * k + 8;

      let near = false; for (let dx = -1; dx <= 1 && !near; dx++) for (let dy = -1; dy <= 1; dy++) if (at(x + dx, y + dy) || at(x + dx, y + dy - 1)) { near = true; break; }

    }

      if (hash(x, y, ox) < 0.18) { g.fillStyle = fill[3]; g.fillRect(ox + x * k + (k >> 2), oy + y * k + (k >> 2), Math.max(1, k >> 1), Math.max(1, k >> 2)); }

  const ox2 = Math.round((W - bot.length * k) / 2);

// ======================================================================================================
// STORY PANELS: soft, painted-looking pictures (gradients, washes of colour, brush dabs and a paper grain, all drawn
// in code) that tell the raft arrival at the start of each launch and the climb to the Canopy Stage at the end.
// They contrast with the crisp pixel island on purpose. A story line is a text-box line with a `panel`:
//   JC.say([{ who: 'story', key: 'story.1', panel: 'river' }, ...])
// While such a line is open the panel fills the screen above the text box, with a Skip button (or Esc / B) that
// jumps past every panel line in a row. Each picture is painted once per screen size into its own canvas.
// ======================================================================================================
const STORY = { cache: {}, gen: -1, cur: '', prev: '', fade: 1, t: 0, frame: { x: 0, y: 0, w: 0, h: 0 } };
JC.story = STORY;
STORY.line = () => (TB.open && TB.lines && TB.lines[TB.i] && TB.lines[TB.i].panel) || '';
STORY.showing = () => !!STORY.line();
/** Skip every story-panel line in a row (the lines after them, like a cousin's hello, still show). */
STORY.skip = function () {
  let n = 0;
  while (STORY.showing() && n++ < 40) { TB.shown = TB.full.length; TB.advance(); }
  STORY.cur = ''; STORY.prev = '';
};
STORY.update = function (dt) {
  STORY.t += dt;
  const id = STORY.line();
  if (id && id !== STORY.cur) { STORY.prev = STORY.cur; STORY.cur = id; STORY.fade = 0; }
  if (STORY.fade < 1) STORY.fade = Math.min(1, STORY.fade + dt * 2.5);
  if (!id) { STORY.cur = ''; STORY.prev = ''; }
};
/** Input while a panel shows: Skip (button, Esc / B) or the text box. True when used. */
STORY.input = function (e) {
  if (!STORY.showing()) return false;
  if ((e.type === 'press' && (e.key === 'b' || e.key === 'pause')) || (e.type === 'tap' && UI.hitAt(e.x, e.y) === 'skip')) { AUDIO.sfx('back'); STORY.skip(); return true; }
  if (e.type === 'down' && UI.hitAt(e.x, e.y) === 'skip') return true;
  TB.input(e);

JC.loop = LOOP;

    FADE.t += dt * 4;

    else if (FADE.dir === -1) { FADE.t -= dt * 8; if (FADE.t <= 0) { FADE.dir = 0; FADE.t = 0; } }

  /* ---------- layout (each frame; reused object) ---------- */

  /* ---------- the match ---------- */

  /** Is the shootout decided? Regulation: the trailing side cannot catch up; sudden death: after each pair. */

  }
  function startShoot(ctx) {

    S.kDive = 0; S.kDiveT = 0; S.outcome = ''; S.flyT = 0; S.botT = 0.35 + S.r() * 0.3;
    S.aimX = 0;
    if (S.nYou === 2 && !ctx.easy && !S.crafty) { S.crafty = true; UI.banner(t('bk.crafty'), '#ffd23f', 1.4); ctx.sfx('bkHoot'); }
  }
  function startKeep(ctx) {
    S.side = 'keep'; S.phase = 'setup'; S.phaseT = 0; S.dive = 9; S.diveAt = 0; S.early = false; S.saw = false; S.mOutcome = ''; S.flyT = 0;
    const k = S.nMico, easy = ctx.easy;
    // where Mico will shoot: a corner most of the time; later he aims away from the side you like to dive to

  /** The tell Mico is showing right now (what the player sees): -1 / 0 / 1 for eyes and tail. */

  }
  function record(who, goal) {
    if (who === 'you') { S.you[Math.min(MAXK - 1, S.nYou++)] = goal ? 1 : 2; if (goal) S.gYou++; }
    else { S.mico[Math.min(MAXK - 1, S.nMico++)] = goal ? 1 : 2; if (goal) S.gMico++; }

  function say(ctx, key, col) { S.msg = t(key); S.msgCol = col; S.msgT = 1.3; }

  /* ---------- update ---------- */

  /* ---------- input ---------- */

  /* ---------- drawing ---------- */

  /* ---------- the slope ---------- */

    for (let i = 1; i < n; i++) { const k = i / n, lx = Math.round(x0 + (x1 - x0) * k), ly = Math.round(y0 + (y1 - y0) * k); rect(g, lx + (i % 2 ? 2 : -3), ly, 3, 2, i % 2 ? '#7cc84a' : '#3d9a2e'); }
    rect(g, x1 - 1, y1 - 1, 4, 3, '#2a7a30'); rect(g, x1, y1, 2, 1, '#b6e35d');
    spr(g, SPRITES.vc_clump, x0 - 9, y0 - 6);
  }
  function drawCappy(g, ctx) {
    const x = sxOf(S.x), y = syOf(S.y);
    if (S.state === 'stand' || S.state === 'top') {
      const walk = S.state === 'stand' && Math.abs(S.walkTo - S.x) > 0.5 && ((S.time * 8) | 0) % 2;
      const hop = S.state === 'top' ? Math.abs(Math.sin(S.time * 8)) * 6 : 0;
      const feet = y + 28;
      shadow(g, x, feet, 9);
      sprK(g, SPRITES[walk ? 'cappy_right_w' : 'cappy_right'], x - 16, feet - 30 - hop, 2, S.facing < 0);
      const hat = SAVE.data.cos.hat && SPRITES['hat_' + SAVE.data.cos.hat]; if (hat) sprK(g, hat, x - 14 + S.facing * 4, feet - 36 - hop, 2, S.facing < 0);
    } else {
      buildHang();
      const fr = S.state === 'leap' || S.state === 'fall' || ((S.time * 3) | 0) % 2 ? 'vc_hang2' : 'vc_hang';
      sprK(g, SPRITES[fr], x - 19, y - 1, 2);
      const hat = SAVE.data.cos.hat && SPRITES['hat_' + SAVE.data.cos.hat]; if (hat) sprK(g, hat, x - 15, y + 8, 2);
    }
    if (S.daze > 0) for (let i = 0; i < 3; i++) { const a = S.time * 6 + i * 2.1; spr(g, SPRITES.sparkle, x - 2 + Math.cos(a) * 10, y + (S.state === 'stand' ? -4 : 6) + Math.sin(a) * 3); }
  }
  function panel(g, x, y, w, name, val, frac, col, right) {
    box(g, x, y, w, 26, 'rgba(27,19,37,0.82)', PAL.ink);
    text(g, name, right ? x + w - 4 : x + 4, y + 1, right ? T_R : T_L);
    T_VAL.col = col; T_VAL.align = right ? 'right' : 'left';
    const vw = text(g, val, right ? x + w - 4 : x + 4, y + 13, T_VAL);
    const bw = w - vw - 12; if (bw > 10) UI.bar(g, right ? x + 4 : x + vw + 8, y + 15, bw, 7, frac, col, 4);
  }
  function draw(g, ctx) {
    S.ctx = ctx; view(ctx);
    const W = S.vw, H = S.vh, k = S.k;
    if (S.bgGen !== VIEW.gen || S.bgK !== k || !S.bg) buildBg(ctx);
    g.setTransform(VIEW.S * k, 0, 0, VIEW.S * k, 0, 0);
    BASEY = Math.round(H * 0.55);
    // the far forest (parallax)
    const off = Math.round(Math.min(0, H - S.bgH + S.cam * 0.35));
    g.drawImage(S.bg, 0, off);
    // the trunk
    const tx = Math.round(W / 2 - TRUNK), floorY = syOf(0), topY = syOf(TOP_M * PXM);
    const k0 = Math.max(0, Math.floor((S.cam + BASEY - H) / 64)), k1 = Math.min(Math.floor(TOP_M * PXM / 64), Math.ceil((S.cam + BASEY) / 64));
    for (let i = k0; i <= k1; i++) g.drawImage(S.trunk, tx, syOf((i + 1) * 64));
    if (floorY < H + 60) g.drawImage(S.floor, 0, floorY - 8);
    // branch platforms with height signs
    for (let bi = 0; bi < 3; bi++) {
      const v = S.T[BR_LIST[bi]], y = syOf(v.h * PXM); if (y < -30 || y > H + 30) continue;
      const right = v.sx >= 0, bx = right ? Math.round(W / 2 - 10) : Math.round(W / 2 + 10 - 104);
      g.drawImage(right ? S.branch.c : S.branch.f, bx, y - 8);
      const sx = right ? Math.round(W / 2 + 10) : Math.round(W / 2 - 34);
      box(g, sx, y + 9, 24, 11, '#c48a4c', OUT); text(g, label('vc.sign' + bi, v.h), sx + 12, y + 8, SIGN);
    }
    // Sloane, hugging the trunk
    const sly = syOf(S.sloane * PXM) - 34;
    if (sly > -40 && sly < H + 4) sprK(g, SPRITES[((S.time * (S.over ? 6 : 1.6)) | 0) % 2 ? 'vc_sloane2' : 'vc_sloane1'], Math.round(W / 2 - 10), sly, 2);
    // vines (the next one glows, with a ring at its tip that turns green when you can grab it)
    const nI = S.cur + 1;
    for (let i = 1; i <= N; i++) {
      const v = S.T[i]; if (v.kind === 'branch') continue;
      const yy = syOf(v.ah); if (yy > H + 10 || yy + v.L + 20 < 0) continue;
      drawVine(g, v, i === nI && !S.over);
    }
    if (topY > -100) g.drawImage(S.canopy, 0, topY - 54);
    if (!S.over && S.T[nI] && S.T[nI].kind !== 'branch' && (S.state === 'hang' || S.state === 'stand')) {
      const v = S.T[nI], dx = Math.abs(nextX(S.time) - cappyX(S.time)), r = R(ctx) + (S.state === 'stand' ? 2 : 0);
      const col = S.daze > 0 ? '#9a94a8' : dx <= r ? '#6ad34a' : dx <= r * 2.4 ? '#ffd24a' : '#fff8e8';
      const x = sxOf(tipX(v, S.time)), y = syOf(tipY(v, S.time)), rr = dx <= r ? 7 + ((S.time * 10) | 0) % 2 : 6;
      g.globalAlpha = dx <= r ? 1 : 0.7;
      for (let a = 0; a < 16; a++) { const c = Math.cos(a * 0.3927), s = Math.sin(a * 0.3927); rect(g, x + c * rr, y + s * rr * 0.8, 2, 2, col); }
      g.globalAlpha = 1;
    }
    // coconut, Cappy, bee
    const co = S.coco;
    if (co.on) { const sh = co.shake > 0 ? Math.round(Math.sin(S.time * 40) * 1.5) : 0; sprK(g, SPRITES.vc_coconut, sxOf(co.x) - 8 + sh, syOf(co.wy) - 8, 2); if (co.shake > 0) text(g, '!', sxOf(co.x), syOf(co.wy) - 22, WARN); }
    drawCappy(g, ctx);
    const b = S.bee;
    if (b.on) {
      if (b.warn > 0) { const ex = b.dir > 0 ? 6 : W - 14; if (((S.time * 8) | 0) % 2) { box(g, ex - 2, syOf(b.wy) - 8, 14, 14, PAL.r2, PAL.ink); text(g, '!', ex + 5, syOf(b.wy) - 7, WARN2); } }
      else sprK(g, SPRITES[((S.time * 12) | 0) % 2 ? 'vc_bee1' : 'vc_bee2'], sxOf(b.x) - 10, syOf(b.wy + Math.sin(b.t * 8) * 3) - 6, 2, b.dir < 0);
    }
    // HUD (screen size): the two climbers, the timer, the height meter, Sloane's marker when she is off screen, the hint
    drawHud(g, ctx, sly);
    g.setTransform(VIEW.S, 0, 0, VIEW.S, 0, 0);
  }
  /** Time left, top centre (like JC.hud.timer, but in the scene's scale). */
  function timerBox(g, W, secs, frac) {
    const w = 64, x = Math.round((W - w) / 2), y = 32;
    box(g, x, y, w, 20, 'rgba(27,19,37,0.82)', PAL.ink);
    T_TIME.col = secs < 10 ? PAL.r3 : PAL.white;
    text(g, label('hud.secs', Math.max(0, Math.ceil(secs))), x + w / 2, y + 1, T_TIME);
    UI.bar(g, x + 3, y + 13, w - 6, 5, frac, secs < 10 ? PAL.r2 : PAL.w3);
  }
  function drawHud(g, ctx, sly) {
    const W = S.vw, H = S.vh;
    const l = Math.ceil(HUD.left() / S.k), wAll = W - l - 6, w = Math.min(150, (wAll - 6) / 2) | 0;
    panel(g, l, 4, w, t('name.cappy'), label('vc.m', Math.floor(S.hm)), S.hm / TOP_M, '#45c34e', false);
    panel(g, W - 6 - w, 4, w, t('name.sloane'), label('vc.mB', Math.floor(S.sloane)), S.sloane / TOP_M, '#c9a37a', true);
    const tNow = S.over ? S.finishT : S.time;
    timerBox(g, W, TIME - tNow, 1 - tNow / TIME);
    const mx = W - 9, my0 = 62, my1 = H - 26;
    if (my1 - my0 > 60) {
      rect(g, mx - 2, my0, 5, my1 - my0, PAL.ink); rect(g, mx - 1, my0 + 1, 3, my1 - my0 - 2, '#5c3a22');
      for (let m = 0; m <= TOP_M; m += 15) rect(g, mx - 4, Math.round(my1 - (my1 - my0) * m / TOP_M), 9, 1, m === TOP_M ? PAL.gold2 : PAL.cream);
      const sy = Math.round(my1 - (my1 - my0) * S.sloane / TOP_M), cy = Math.round(my1 - (my1 - my0) * S.hm / TOP_M);
      disc(g, mx, sy, 3, PAL.ink); disc(g, mx, sy, 2, '#c9a37a');
      disc(g, mx, cy, 4, PAL.ink); disc(g, mx, cy, 3, '#45c34e'); rect(g, mx - 1, cy - 1, 1, 1, '#b6f5a0');
    }
    if (sly < 52 || sly > H - 4) {
      const up = sly < 52, yy = up ? 56 : H - 40, xx = W - 76;
      box(g, xx, yy, 58, 18, 'rgba(27,19,37,0.82)', PAL.ink); spr(g, SPRITES.sloane, xx + 1, yy + 1);
      text(g, up ? '↑' : '↓', xx + 20, yy + 3, ARROW); text(g, label('vc.mS', Math.floor(S.sloane)), xx + 27, yy + 3, ARROW);
    }
    if (S.hint > 0.05 && !S.over) {
      const hk = S.state === 'stand' && S.cur === 0 ? (ctx.touch ? 'vc.hintStartTouch' : 'vc.hintStartKeys') : (ctx.touch ? 'vc.hintTouch' : 'vc.hintKeys');
      g.globalAlpha = clamp(S.hint * 2, 0, 1); textBlock(g, t(hk), 6, H - 28, W - 30, HINT); g.globalAlpha = 1;
    }
  }

  /* ---------- sound ---------- */
  AUDIO.addSfx('buzz', (tt, b) => { const P = AUDIO.prims; P.tone(b, 'sawtooth', 210, tt, 0.35, 0.08, 230, 0.01, 0.1, 0.8); P.tone(b, 'square', 216, tt, 0.35, 0.05, 200, 0.01, 0.1, 0.8); });
  AUDIO.songs.vine = { bpm: 112, steps: 32, leadWave: 'triangle', harmWave: 'square', swing: 0.1,
    lead: 'A4 . C5 . E5 . A5 - G5 . E5 . D5 - E5 . C5 . E5 . G5 . C6 - B5 . G5 . A5 - - .',
    harm: '. . E4 . . . E4 . . . D4 . . . D4 . . . E4 . . . E4 . . . D4 . . . C4 .',
    bass: 'A2 . . A2 E3 . . . G2 . . G2 D3 . . . C3 . . C3 G3 . . . F2 . . F2 E2 . G2 .',
    drums: 'k.c.u.c.k.c.t.c.k.c.u.c.k.ct.u.c' };

  JC.register({
    id: 'vine',
    champion: 'sloane',
    music: 'vine',
    start(ctx) {
      S.ctx = ctx; view(ctx); build(ctx);
      S.cur = 0; S.state = 'stand'; S.x = -26; S.walkTo = -26; S.y = 28; S.hm = 0; S.maxM = 0; S.facing = 1; S.time = 0; S.daze = 0;
      S.sloane = 0; S.sloaneV = TOP_M / (ctx.easy ? 72 : 62); S.falls = 0; S.perfects = 0; S.grabs = 0; S.bonks = 0; S.over = false; S.won = false;
      S.cam = 40; S.waitMsg = 0; S.cheer = 0; S.auto = false; S.sigma = 0; S.eps = 0; S.hint = ctx.firstTime ? 1.6 : 0.7;
      S.coco.on = false; S.coco.next = ctx.easy ? 6 : 3; S.bee.on = false; S.bee.next = ctx.easy ? 5 : 2;
      const n = S.T[1]; n.p = Math.PI * 0.9;
    },
    update,
    draw,
    onInput(e, ctx) {
      if ((e.type === 'press' && (e.key === 'a' || e.key === 'up')) || e.type === 'down') tryGrab(ctx);
    },
    outro(dt, ctx) { S.time += dt; if (S.cheer > 0) S.cheer -= dt; if (S.state === 'leap' || S.state === 'fall') moveCappy(dt, ctx); },
    testState(ctx) {
      const n = S.T[S.cur + 1];
      return { state: S.state, cur: S.cur, metres: Math.round(S.hm * 10) / 10, best: S.maxM, sloane: Math.round(S.sloane * 10) / 10, time: Math.round(S.time * 100) / 100,
        dx: n ? Math.round((n.kind === 'branch' ? 0 : nextX(S.time) - cappyX(S.time)) * 10) / 10 : 0, next: n ? n.kind : '', r: R(ctx), daze: S.daze > 0,
        falls: S.falls, perfects: S.perfects, grabs: S.grabs, bonks: S.bonks, over: S.over, won: S.won, auto: S.auto, coconut: S.coco.on, bee: S.bee.on };
    },
    test: {
      auto(ctx, on, sigma) { S.auto = !!on; S.sigma = +sigma || 0; S.eps = 0; S.tapAt = -1; return S.auto; },
      /** Jump to target i (e.g. 19, just under the top). */
      to(ctx, i) { i = clamp(i | 0, 0, N - 1); const v = S.T[i]; if (isStand(v.kind)) { S.state = 'stand'; S.cur = i; S.x = v.sx; S.walkTo = v.sx; S.y = v.h * PXM + 28; } else { S.cur = i; ride(v, 0); S.state = 'hang'; S.x = tipX(v, S.time); S.y = tipY(v, S.time); } S.hm = v.h; S.maxM = Math.max(S.maxM, v.h); S.cam = S.y + 10; return S.cur; },
      sloane(ctx, m) { S.sloane = clamp(+m || 0, 0, TOP_M); return S.sloane; },
      hazards(ctx, on) { S.coco.next = on ? 0 : 999; S.bee.next = on ? 0 : 999; S.coco.on = false; S.bee.on = false; return !!on; },
    },
    cheat(won) { S.over = true; S.won = won; S.maxM = won ? TOP_M : 27; return { score: won ? 1300 : 270, stars: won ? 2 : 0, won, frac: won ? 0.67 : 0.14 }; },
  });
})();

/* ---- boot.js ---- */
/* ---- start: build the island, load the save, show the title ---- */
SAVE.load();
JC.refreshCappy();
buildCappy('coco', '#ffd23f', { b: '#c08048', l: '#e0a868', s: '#8a5530' }, { noPack: true });
buildCappy('pip', '#3fb7ff', { b: '#9a6438', l: '#c48a52', s: '#6e4424' }, { noPack: true });
WORLD.build();
JC.buildNpcs();
JC.start();
JC.go('title', {}, true);
// a sheet of every sprite, for looking at the art (window.__brbTest.jc.sheet(true))
const _draw = TITLE.draw;
TITLE.draw = function (g) {
  if (!JC.sheet) return _draw(g);
  g.fillStyle = '#6a8a6a'; g.fillRect(0, 0, VIEW.W, VIEW.H);
  let x = 4, y = 4, rowH = 0; const k = 2;
  for (const name in SPRITES) { const s = SPRITES[name]; if (x + s.w * k > VIEW.W - 4) { x = 4; y += rowH + 4; rowH = 0; } sprK(g, s, x, y, k); x += s.w * k + 4; rowH = Math.max(rowH, s.h * k); }
};

})();
</script>
