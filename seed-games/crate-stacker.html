     Oomba3D 1.1.0 in the Toy Town theme: one crate is a ONE, a tower of ten crates is a TEN, and a toy truck takes
     the load. Three chapters of six rounds, one per course step:
       build   (3.1) load a number with towers and crates (Add a ten, Add a one, Take one off, Go; ten loose crates
                     snap into a tower by themselves), then read a load and pick its number (34 or 43?), up to 109;
       greater (3.2) two trucks: which has more (tens first, then ones), then pick the sign: >, = or <;
       add     (3.3) 27 and 30 more (towers hop on), 10 more and 10 less (one tower comes or goes), and 27 and 5 more
                     (crates fill a tower, then the rest), all within 100.
     Made for a child who is only starting to read: every instruction is short, shown and spoken (BRB.speak, the
     shared path; the speaker button says it again), the numbers are big, and everything is done with big buttons or
     by tapping a truck. No timer, no lives, no fail state: a wrong answer wobbles and gets a spoken hint, then
     another try. Lesson mode: BRB.params { chapter: build | greater | add, lock: 1 } opens that chapter only;
     finishing its six rounds reports game over, won, once (the course step's completion signal). With no parameters
     the game offers the three chapters from a picture menu. Saves only which chapters are finished (BRB.storage
     'crate-stacker-v1'). The import map below is exactly kit2ImportMap() (server/services/vendor.js);
     tests/unit/crate-stacker.test.js fails if a library bump leaves it behind. English only, like Number Quest's
     other lesson games. Test handle: window.__cs (also window.__brbTest, the name the picture scripts wait for). -->

  slab(-half - 1.6, half + 1.6, -1.9, 2.8);
  ride(A);
  Object.assign(view, { rect: [-half - 0.2, half + 0.2, -0.6, 0.9], high: TOP + 0.3, low: 1.2, back: tall ? -4.6 : -4.2, tilt: 0 });
  if (!S.shown && !found) drive(A, A.home, { from: A.home + 16, dur: 0.8 });
}
/** The chip and the truck's sign follow the load as it is built. */
function live() { const R = S.R; showSum(R, false); setSign(S.A, R.ask === 'parts' ? '?' : S.count, 'cream'); }
/** Ten loose crates snap into a tower: it hops from the crates' corner to its place among the towers. */
function bundle(A, tens) {
  setLoad(A, tens, 0);
  const t = A.towers[tens - 1], to = t.position.clone();
  t.position.set(crateAt(A, 0).x, BED, 0); fly(t, to, { arc: 1.1, dur: 0.5, then: () => sfx('land') }); sfx('coin');
}
function build(act, b) {
  if (S.phase !== 'play' || !S.A || S.R.kind !== 'build') return;
  const R = S.R, A = S.A, tick = ++S.tick;
  setLoad(A, tensOf(S.count), onesOf(S.count));   // whatever was still moving is where it belongs
  if (act === 'ten' || act === 'one') {
    const n = act === 'ten' ? 10 : 1;
    if (S.count + n > CS.MAX) { wobble(b); return hint('build.full'); }
    S.hist.push(act); S.count += n; hint(); heroMove('use', 800);
    if (act === 'ten') { const t = tower(); t.position.copy(towerAt(A, A.tens)); A.load.add(t); A.towers.push(t); A.tens++; fall(t); }
    else {
      const c = crate(), full = A.ones === 9; c.position.copy(crateAt(A, A.ones)); A.load.add(c); A.crates.push(c); A.ones++;
      if (full) { hint('build.bundle'); A.tens++; A.ones = 0; }   // the tenth loose crate: they become a tower
      fall(c, { high: 2.2, then: () => { if (full && S.tick === tick) bundle(A, tensOf(S.count)); } });
    }
    return live();
  }
  if (act === 'off') {
    if (!S.hist.length) { wobble(b); return hint('build.empty'); }
    S.count -= S.hist.pop() === 'ten' ? 10 : 1; hint(); sfx('jump');
    setLoad(A, tensOf(S.count), onesOf(S.count));
    return live();
  }
  if (S.count !== R.answer) {
    wobble(b); shake(A.body);
    return tensOf(S.count) !== R.tens ? hint('build.hint.tens.' + (R.tens === 1 ? '1' : 'n'), { t: R.tens }) : hint('build.hint.ones.' + (R.ones === 1 ? '1' : 'n'), { o: R.ones });
  }
  S.phase = 'right'; hint(); sfx('coin'); setSign(A, R.answer, 'green');
  right(partsKey('parts', R.tens, R.ones), { t: R.tens, o: R.ones, n: R.answer }, 3600, () => later(2100, () => leave(A)));
}
/** A loaded truck drives off to the left. */
function leave(V, to = -30) { if (reduced || S.fast) return; sfx('walk'); drive(V, to, { dur: 1.3 }); }

/* ----- chapter 2, two trucks: which has more, then the sign that goes between the two numbers ----- */
function drawTwo(R, found) {
  const cap = R.view === 'numbers' ? 5 : Math.max(3, tensOf(R.a), tensOf(R.b));
  const A = S.A = truck('red', cap), B2 = S.B = truck('blue', cap), len = A.x1 - A.x0, half = len / 2;
  put(A.object); put(B2.object);
  // side by side on a wide screen; on a tall phone the first truck is up on the loading dock behind the second
  if (tall) { centre(A, 0, 1, -6.4); centre(B2, 0, 0, 1.2); put(box(M.dock, len + 2.2, 1, 2.6, 0, 0.5, -6.4)); slab(-half - 1.6, half + 1.6, -4.6, 3.8); }
  else { centre(A, -half - 0.75); centre(B2, half + 0.75); slab(-len - 2.4, len + 2.4, -1.9, 2.8); }
  for (const [V, n] of [[A, R.a], [B2, R.b]]) {
    if (R.view === 'numbers') setContainer(V, n); else setLoad(V, tensOf(n), onesOf(n));
    setSign(V, n, found && (R.kind === 'sign' || n === R.answer) ? 'green' : 'cream');
    if (R.kind === 'more') targets.push({ at: () => V.object.position.clone().add(V3((V.x0 + V.x1) / 2, 1.5, 0)), r: half * 0.8, go: () => answer(n) });
  }
  // the sign between the two trucks (on a tall phone the trucks stand one behind the other: the chip shows the sign)
  if (R.kind === 'sign' && !tall) { const m = S.mid = put(board(found ? SIGN[R.answer] : '?', 1.5, found ? 'green' : 'gold')); m.position.set(0, 2.3, 0.9); }
  ride(A);
  const high = R.view === 'numbers' ? 4.5 : TOP + 0.3;
  Object.assign(view, tall ? { rect: [-half - 0.2, half + 0.2, -7, 2.2], high: high + 1, low: 1.2, back: -3.4, tilt: 0.62 } : { rect: [-len - 0.95, len + 0.95, -0.6, 1.6], high, low: 1.2, back: -4.2, tilt: 0 });
}

/* ----- chapter 3, a truck and a cart: tens more, ten more and ten less, ones more (they may fill a tower) ----- */
function drawAdd(R, found) {
  const tensAdd = R.kind === 'tens' || R.kind === 'more10', n = found ? R.answer : R.a;
  const A = S.A = truck('red', Math.max(3, tensOf(R.a), tensOf(R.answer))), C = S.C = cart(tensAdd ? R.b / 10 : 1, !tall);
  const lenA = A.x1 - A.x0, lenC = C.x1 - C.x0, all = lenA + 0.6 + lenC;
  put(A.object); put(C.object); centre(A, -all / 2 + lenA / 2); centre(C, all / 2 - lenC / 2);
  setLoad(A, tensOf(n), onesOf(n)); setSign(A, n, found ? 'green' : 'cream');
  C.towers = []; C.crates = [];
  if (!found) {
    if (tensAdd) for (let i = 0; i < R.b / 10; i++) { const t = tower(); t.position.set(0.4 + i * PITCH, C.top, 0); C.load.add(t); C.towers.push(t); }
    if (R.kind === 'ones') for (let j = 0; j < R.b; j++) { const c = crate(); c.position.set(0.5, C.top + CR / 2 + j * CR, 0); C.load.add(c); C.crates.push(c); }
    const tag = C.tag = board((R.kind === 'less10' ? '−' : '+') + R.b, 1.25, 'gold'); tag.position.set(C.L / 2, C.top + (tensAdd ? CR * 10 : R.kind === 'ones' ? R.b * CR : 0) + 0.62, 0); C.object.add(tag);
  } else if (R.kind === 'less10') C.object.visible = false;
  slab(-all / 2 - 1.6, all / 2 + 1.6, -1.9, 2.8);
  ride(A);
  Object.assign(view, { rect: [-all / 2 - 0.2, all / 2 + 0.2, -0.6, 0.9], high: TOP + (tensAdd ? 0.9 : 0.3), low: 1.2, back: tall ? -4.6 : -4.2, tilt: 0 });
  if (!S.shown && !found) drive(C, C.home, { from: C.home + 14, dur: 0.8 });
}
/** Move a thing from the cart to its place on the truck (or back): it keeps its place in the world, then hops. */
function carry(o, parent, at, opts = {}) { parent.attach(o); o.rotation.set(0, 0, 0); fly(o, at, { arc: 1.2, dur: 0.45, ...opts }); }
/** The right total: the crates move first, each step when the one before has landed, and the round is done when the
 *  last has (S.after is that last step, so a turned screen, which redraws the round finished, can still end it). */
function addRight(R) {
  const A = S.A, C = S.C, tick = ++S.tick, ok = () => S.tick === tick && S.A === A;
  if (C.tag) C.tag.visible = false;
  const key = R.kind === 'more10' || R.kind === 'less10' ? R.kind + '.sum' : 'add.sum';
  const whole = S.after = () => { if (S.after !== whole) return; S.after = null; setSign(S.A, R.answer, 'green'); right(key, { a: R.a, b: R.b, c: R.answer }, 3400); };
  /** Loose crates hop from the cart onto the truck's corner one after another; `each(i)` as each lands. */
  const crates = (list, each) => list.forEach((c, i) => carry(c, A.load, crateAt(A, A.ones + i), { wait: i * 0.24, then: () => { sfx('land'); if (ok()) each(i, i === list.length - 1); } }));
  if (R.kind === 'tens' || R.kind === 'more10') {
    const ts = C.towers, from = A.tens;
    A.towers.push(...ts); A.tens += ts.length;
    return ts.forEach((t, i) => carry(t, A.load, towerAt(A, from + i), { wait: i * 0.42, then: () => { sfx('land'); if (!ok()) return; setSign(A, R.a + 10 * (i + 1), 'cream'); if (i === ts.length - 1) whole(); } }));
  }
  if (R.kind === 'less10') {
    const t = A.towers.pop(); A.tens--;
    return carry(t, C.load, V3(0.5, C.top, 0), { then: () => { sfx('land'); if (!ok()) return; whole(); later(600, () => { if (ok()) leave(C, 34); }); } });
  }
  if (!R.cross) { const from = A.ones; A.crates.push(...C.crates); crates(C.crates, (i, last) => { setSign(A, R.a + i + 1, 'cream'); if (last) whole(); }); A.ones = from + R.b; return; }
  // over a ten: the crates fill the tower first (27 and 3 make 30), then the rest go on (2 more makes 32)
  const fill = 10 - onesOf(R.a), rest = R.b - fill, ten = R.a + fill, first = C.crates.slice(0, fill), last = C.crates.slice(fill);
  sum('show.add', { a: R.a, b: fill, c: ten }); say('add.fill', { a: R.a, b: fill, c: ten });
  crates(first, (i, end) => {
    setSign(A, R.a + i + 1, 'cream');
    if (end) later(450, () => {
      if (!ok()) return;
      for (const c of first) c.removeFromParent();
      bundle(A, tensOf(ten)); setSign(A, ten, 'cream');
      later(1900, () => {
        if (!ok()) return;
        sum('show.add', { a: ten, b: rest, c: R.answer }); say('add.more', { b: rest, c: R.answer }, { queue: true });
        crates(last, (j, done) => { setSign(A, ten + j + 1, 'cream'); if (done) later(1900, () => { if (ok()) whole(); }); });
        A.crates.push(...last); A.ones = rest;
      });
    });
  });
}

const HINT = R => (R.kind === 'read' ? 'read.hint' : R.kind === 'more' || R.kind === 'sign' ? 'gr.hint.' + R.look : R.kind === 'ones' ? 'ones.hint' + (R.cross ? '.ten' : '') : R.kind + '.hint');
/** The child picks an answer: a number button, a sign button, or a tap on a truck in the yard. */
function answer(v, b) {
  if (S.phase !== 'play' || !S.R || S.R.kind === 'build') return;
  const R = S.R, id = 'cs-' + (R.kind === 'sign' ? v : 'n' + v);
  if (!R.choices.includes(v)) return;
  if (v !== R.answer) {
    wobble(b || document.getElementById(id));
    shake(R.kind === 'more' && v === R.b ? S.B.body : S.A.body);
    return hint(HINT(R), { a: R.a });
  }
  S.phase = 'right'; hint(); sfx('coin');
  const btn = document.getElementById(id); if (btn) btn.classList.add('go');
  if (R.kind === 'read') {
    setSign(S.A, R.answer, 'green');
    return right(R.tens === 10 ? 'read.hundred' : partsKey('parts', R.tens, R.ones), { t: R.tens, o: R.ones, n: R.answer }, R.tens === 10 ? 4600 : 3600, () => later(2100, () => leave(S.A)));
  }
  if (R.kind === 'more' || R.kind === 'sign') {
    const hi = Math.max(R.a, R.b), lo = Math.min(R.a, R.b);
    const why = () => (R.look === 'same' ? speak('gr.why.same', null, { queue: true }) : R.look === 'tens' ? speak('gr.why.tens', { a: tensOf(hi), b: tensOf(lo) }, { queue: true }) : speak('gr.why.ones', { a: onesOf(hi), b: onesOf(lo) }, { queue: true }));
    if (R.kind === 'more') { const V = v === R.a ? S.A : S.B; setSign(V, v, 'green'); hop(V.body, 0.45); return right('gr.gt', { a: hi, b: lo }, 5200, why); }
    reboard(S.mid, SIGN[v], 'green'); setSign(S.A, R.a, 'green'); setSign(S.B, R.b, 'green');
    return right('gr.' + v, { a: R.a, b: R.b }, 5200, why);
  }
  addRight(R);
}

/* ---------- the test handle: what the round asks and what is on screen (tests, covers, slide pictures) ---------- */
const loadOf = V => (V ? { tens: V.tens, ones: V.ones } : null);
window.__cs = window.__brbTest = {
  state: () => ({ game: 'crate-stacker', screen: S.screen, chapter: S.chapter, lock: S.lock, round: S.round, rounds: CS.ROUNDS, phase: S.phase, hero: S.hero ? S.hero.id : null, reported: S.reported, tall,
    ...(S.R && S.screen === 'play' ? { ...S.R, count: S.count, load: loadOf(S.A), loadB: loadOf(S.B), sign: S.A && S.A.sign.visible ? S.A.sign.userData.text : null, moving: tweens.length } : {}) }),
  fast: on => { S.fast = on !== false; },
  hero: id => chooseHero(id || HEROES[0]),
  act: (name, arg) => (name === 'answer' ? answer(arg) : build(name)),
  /** The helper's place in the yard: [x, how far above the ground, z]. */
  heroAt: () => { if (!S.hero) return null; const p = S.hero.object.getWorldPosition(V3(0, 0, 0)); return [+p.x.toFixed(2), +p.y.toFixed(2), +p.z.toFixed(2)]; },
  /** Where a truck ('a' or 'b') is on the screen (CSS pixels): the middle of its bed and the top of its load, for a
   *  test that taps the yard itself or checks that the whole load is in view. */
  spot: which => {
    const V = which === 'b' ? S.B : S.A; if (!V) return null;
    const r = g.renderer.domElement.getBoundingClientRect(), px = p => { const q = p.project(g.camera); return [(q.x + 1) / 2 * r.width + r.left, (1 - q.y) / 2 * r.height + r.top]; };
    const at = (x, y) => px(V.object.position.clone().add(V3(x, y, 0)));
    return { mid: at((V.x0 + V.x1) / 2, 1.5), left: at(V.x0, 0.3), right: at(V.x1, 0.3), top: at(V.L / 2, V.big ? BED + 1.9 : TOP) };
  },
};

el.load.hidden = true; el.load.remove(); el.cs.hidden = false;
await showHeroes();
window.__ready = true;
</script>
