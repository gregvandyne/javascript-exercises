     Oomba3D 1.1.0 in the Toy Town theme: one crate is a ONE, a tower of ten crates is a TEN, and a toy truck takes
     the load. Three chapters of six rounds, one per course step:
       build   (3.1) load a number with towers and crates (Add a ten, Add a one, Take one off, Go; ten loose crates
                     snap into a tower by themselves), then read a load and pick its number (34 or 43?), up to 109;
       greater (3.2) two trucks: which has more (tens first, then ones), then pick the sign: >, = or <;
       add     (3.3) 27 and 30 more (towers hop on), 10 more and 10 less (one tower comes or goes), and 27 and 5 more
                     (crates fill a tower, then the rest), all within 100.
     Made for a child who is only starting to read: every instruction is short, shown and spoken (BRB.speak, the
     shared path; the speaker button says it again), the numbers are big, and everything is done with big buttons or
     by tapping a truck. No timer, no lives, no fail state: a wrong answer wobbles and gets a spoken hint, then
     another try. Lesson mode: BRB.params { chapter: build | greater | add, lock: 1 } opens that chapter only;
     finishing its six rounds reports game over, won, once (the course step's completion signal). With no parameters
     the game offers the three chapters from a picture menu. Saves only which chapters are finished (BRB.storage
     'crate-stacker-v1'). The import map below is exactly kit2ImportMap() (server/services/vendor.js);
     tests/unit/crate-stacker.test.js fails if a library bump leaves it behind. English only, like Number Quest's
     other lesson games. Test handle: window.__cs (also window.__brbTest, the name the picture scripts wait for). -->
