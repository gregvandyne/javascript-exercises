# Render blueprint: one web service with a persistent disk for the SQLite file.
services:
  - type: web
    name: magic-cup
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: brb-data
      mountPath: /data
      sizeGB: 2
    # Moving to your own domain (oomba.ai): add the domain under Settings → Custom Domains, wait for "Verified",
    # then set PUBLIC_URL=https://oomba.ai in the dashboard. Old names move over once the server checks it can be reached
    # there (README: PUBLIC_URL). Sign in with Google later needs GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET (dashboard).
    envVars:
      - key: NODE_ENV
        value: production
      - key: BRB_DATA_DIR
        value: /data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BUILDER_DAILY_TURNS
        value: "60"
      - key: AI_DAILY_BUDGET_USD
        value: "5"
      # The free AI budget (docs/decisions.md "Paid plans", D0): $150 a month, $5 a day (about monthly ÷ 30) so it
      # lasts the whole month. Keep these the same as the dashboard: a blueprint sync resets the dashboard to this file.
      - key: AI_MONTHLY_BUDGET_USD
        value: "150"
      # Where grown-ups write to the team (/parents, the footer); also the support email in Stripe.
      - key: CONTACT_EMAIL
        value: greg@oomba.ai
      # Paid plans (README "Paid plans"): off until both are set in the dashboard. A restricted key (rk_…), never the
      # sk_ secret key; never put either value in this file.
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # The "Family" payment method configuration (pmc_…, Link off); required for family checkout.
      - key: STRIPE_PMC_FAMILY
        sync: false
      # Optional "School" payment method configuration (pmc_…: cards, Link, ACH); unset = the account's default.
      - key: STRIPE_PMC_SCHOOL
        sync: false
      # Parent-made child accounts (docs/decisions.md): off. Turn on only after the owner's sign-off is recorded in
      # docs/legal-review.md (item 30).
      - key: PARENT_MADE_CHILDREN
        value: "0"
      # The Builder looking facts up on the web (server/builder/search.js; docs/legal-review.md item 39). Off until the
      # owner has checked one live build with it on (the blocked-sites list is sent with every request and the API
      # refuses a list it doesn't accept; the server then turns search off by itself and logs why). Set "1" to turn it on.
      - key: BUILDER_WEB_SEARCH
        value: "0"
      # Speaking instead of typing in the Builder chat (server/services/stt.js; docs/legal-review.md item 38). The mic
      # is hidden until STT_API_KEY is set. Set the key in the dashboard only after the provider has agreed zero data
      # retention for the key's project; never put it in this file. STT_PROVIDER: openai (default) or elevenlabs.
      - key: STT_PROVIDER
        value: openai
      - key: STT_API_KEY
        sync: false
